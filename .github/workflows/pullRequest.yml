name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  BUILD_STRING: '${{ github.run_number }}-${{ github.sha }}'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-deno

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Run check
        run: deno task check

  test_web:
    uses: ./.github/workflows/test-with-db.yml
    with:
      setup-lfs: true
      artifact-name: test-web-logs
      build: |
        deno task compile:s_expressions
        deno task db:restore snomed
        deno task db:migrate all
        deno task build
        test -f _fresh/client/.vite/manifest.json
      run: |
        deno task test --use-build test/web

  test_non_web:
    uses: ./.github/workflows/test-with-db.yml
    with:
      setup-lfs: true
      artifact-name: test-non-web-logs
      build: |
        deno task compile:s_expressions
        deno task db:restore snomed
        deno task db:migrate all
      run: |
        deno task test --ignore=test/web --ignore=test/marketing

  test_marketing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-deno

      - uses: ./.github/actions/write-test-env

      - name: Install marketing dependencies
        working-directory: marketing
        run: deno install --allow-scripts

      - name: Init logs directory
        run: mkdir -p logs/slow_queries

      - name: Run marketing tests
        run: deno task test test/marketing

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-marketing-logs
          path: |
            logs/
          retention-days: 3
          if-no-files-found: ignore

  # TODO turn back on
  # test_chatbot:
  #   uses: ./.github/workflows/test-with-db.yml
  #   with:
  #     setup-lfs: true
  #     artifact-name: test-chatbot-logs
  #     run: |
  #       deno task db:restore snomed
  #       deno task db:migrate all
  #       deno task test:chatbot

  test_migrations:
    uses: ./.github/workflows/test-with-db.yml
    with:
      artifact-name: test-migrations-logs
      build: deno task db:migrate latest
      run: |
        deno task db:migrate to snomed_inferred
        deno task db:migrate latest

  build_container:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t vha .

  compile_web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-deno

      - name: Build web
        run: deno task build

      - name: Compile web
        run: deno task compile:web

  compile_chatbot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-deno

      - name: Compile chatbot
        run: deno task compile:chatbot
