nol, NSAIDs (like ibuprofen). • Suspect a drug rash in a patient with a generalised rash which appeared within 3 months of starting a new medication.", "bbox": [51.0, 89.7, 506.9, 119.9], "key": "p88-42170e13"}, {"id": "p88-out-e03", "page": 88, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely. 2Markers of severity: face/tongue swelling, difficulty breathing, BP < 90/60, temperature ≥ 38°C, abdominal pain, vomiting/diarrhoea, involves mouth/eyes/genitals, blisters/ peeling/raw areas, jaundice, unwell/malaise/fatigue/body pain.", "bbox": [34.0, 535.0, 802.6, 552.0], "key": "p88-1d382f6c"}, {"id": "p88-out-e04", "page": 88, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with a drug rash not needing urgent attention", "bbox": [281.3, 265.0, 560.7, 276.0], "key": "p88-e91e278e"}, {"id": "p88-out-e05", "page": 88, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Is patient on ART, TB medication, co-trimoxazole or TPT?", "bbox": [318.8, 275.8, 523.2, 286.0], "key": "p88-20b9380c"}, {"id": "p88-out-e06", "page": 88, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Refer to doctor/discuss with MIC hotline 200 whether to continue, change or stop medication: • If on ART: - Continue unless on abacavir, and abacavir hypersensitivity reaction (AHR) likely 131. - If on nevirapine or efavirenz, doctor to switch ART 132. • If itch, give chlorphenamine 4mg at night, or 8 hourly for up to 5 days. • Check ALT and eosinophil count. • Advise to return urgently if rash worsens or markers of severity1 occur.", "bbox": [119.1, 326.3, 504.0, 397.1], "key": "p88-ee41c9c5"}, {"id": "p88-out-e07", "page": 88, "box": 0, "kind_hint": "outside", "secti y": "p88-35f51225"}, {"id": "p88-out-e16", "page": 88, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Discuss with doctor whether to stop or change medication. • If itchy, give chlorphenamine 4mg at night, or up to 8 hourly for up to 5 days. • If dark coloured round flat spots that occur anywhere on body following ingestion of a medication and often start as itchy patches with red edges, fixed drug eruption likely: apply hydrocortisone 1% to affected areas daily for 5 days. • If extensive, refer.", "bbox": [656.2, 326.8, 788.8, 467.0], "key": "p88-efd9acf6"}, {"id": "p88-out-e17", "page": 88, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Patient well and no markers of severity2", "bbox": [330.6, 437.6, 474.8, 447.9], "key": "p88-bb88bc10"}, {"id": "p88-out-e18", "page": 88, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Advise to return urgently if markers of severity2 occur. • Advise to return if rash persists ≥ 2 weeks: discuss/refer.", "bbox": [469.2, 498.5, 676.8, 518.8], "key": "p88-c814a368"}], "boxes": [{"box": 1, "rect": [35.5, 138.6, 806.4, 246.4]}, {"box": 2, "rect": [35.5, 480.2, 171.7, 521.5]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAADiCAIAAAB7todWAAAACXBIWXMAABcSAAAXEgFnn9JSAAGxuElEQVR4nOzdd3gb150v/Pvve29iS7LjjdM2lpvcHcuybHVZskRJFMXee68AiEaCBAn2BvYO9k5KokRShaQkUuy9ASBYJNvJbspuspveNsndXd3vwQ+aICRFUXYcO/vO83wePcBwMHPmzMwhz1dzDv7Xz77xHI/H4/F4PB6Px/t8VV/pj3a3zjp3BDSuVtDo7Qxdfg7kWogz3BB4wUhcCMyli2A8VQDTWXJYKlSBviAOFsuTYKEgBuYy5DCfGUPiTx8Bq+e+DsEHXoegQ29AxLHdkHLuEGTZHIEih6NQ7nwMKl1PQYOnLWnzcYTOQAfoDbODG2GORk6cnhBH6A11gH6BCyN0gz6BUbiHicATRuW+MKv0A21SACznCuBOsQwWMgWwlCoyioQ7WVHwYW4cLKtjyUq2Ej7Mi4eP8xNgNZfRq2NgqUAJq2UqWCphPq7OYKqY5eIEoi9QwoeaRPhuZTLcKYkFXY4U5jJFoMuRgT43CiZTQmE8iZlOE8BshojMZ0XCYp6cyWHm0yWgVctgOl0Mi4WxsFqRZJQMH1enw1JpAlksigeDOgaWc5WwlBsDyzn ed_concept \"Mouth region structure\" \"body structure\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Eruption caused by drug\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Fatigue\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Finding of vomiting\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generalized aches and pains\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Jaundice\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Malaise\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Peeling of skin\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Shock\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Face structure\" \"body structure\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Tongue structure\" \"body structure\")))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis_condition": {"only_A": ["(<= (onset (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"New medication commenced\" \"finding\"))) (time_ago 3 months))", "(diagnosis (snomed_concept \"Eruption caused by drug\" \"disorder\") possible)", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Eruption caused by drug\" \"disorder\"))"], "only_B": ["(<= (onset (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))) (time_ago 3 months))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))"], "both": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generalized rash\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperpigmentation of skin\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Macule of skin\" \"disorder\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Eruption caused by drug\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Fixed drug eruption\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 88 – Drug rash: flowchart\n\nSource: APC 2026 e-book page 88: the red box, the \"Approach to the patient\nwith a drug rash not needing urgent attention\" algorithm below it, and the second red box at its\nbottom left.\n\n```mermaid\nflowchart TD\n    S[\"Suspect drug rash: generalised rash which appeared<br/>within 3 months of starting a new medication\"]\n    S --> RB{\"Any marker of severity?<br/>face/tongue swelling, vomiting/diarrhoea, difficulty breathing,<br/>involves mouth/eyes/genitals, shock¹/SBP &lt; 80, blisters/peeling/raw areas,<br/>temperature ≥ 38°C, jaundice, abdominal pain, unwell/malaise/fatigue/body pain\"}\n    RB -- Yes --> URG[\"Give urgent attention.<br/>Manage and refer urgently\"]\n    RB -- No --> Q1{\"Is patient on ART, TB medication,<br/>co-trimoxazole or TPT?\"}\n    Q1 -- Yes --> Y1[\"Refer/discuss with MIC hotline (200).<br/>On ART: continue unless abacavir and AHR likely (131);<br/>nevirapine/efavirenz: switch ART (132).<br/>Chlorphenamine if itch. Check ALT and eosinophil count.\"]\n    Y1 --> R24{\"Review patient and result within 24 hours\"}\n    R24 -- \"Patient unwell or markers of severity²\" --> BOX2[\"Stop all medication.<br/>Give urgent attention as above\"]\n    BOX2 --> URG\n    R24 -- \"Patient well, no markers of severity²\" --> LAB{\"ALT or eosinophil count raised?\"}\n    LAB -- Raised --> MIC[\"Discuss with MIC hotline/specialist\"]\n    LAB -- \"Both not raised\" --> ADV[\"Advise return urgently if markers of severity;<br/>return if rash persists ≥ 2 weeks\"]\n    Q1 -- No --> N1[\"Discuss with doctor whether to stop/change medication.<br/>Chlorphenamine if itchy.\"]\n    N1 --> FDE{\"Dark coloured round flat spots after ingestion of a medication,<br/>often starting as itchy patches with red edges?\"}\n    FDE -- Yes --> FDEL[\"Fixed drug eruption likely: hydrocortisone 1%.<br/>If extensive, refer\"]\n    N1 --> ADV\n```\n\n¹ If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely.\n² Markers of severity: face/tongue swelling, difficulty breathing, BP < 90/60, temperature ≥ 38°C,\nabdominal pain, vomiting/diarrhoea, involves mouth/eyes/genitals, blisters/peeling/raw areas,\njaundice, unwell/malaise/fatigue/body pain.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Suspect drug rash | Generalised rash **and** a new medication commenced within the last 3 months | `Suspect drug rash: generalised rash after new medication` (possible) |\n| (what makes us look for markers of severity) | Drug rash recorded, or suspected by the rule above | `Check for drug rash markers of severity` |\n| New medication question | Asked whenever a generalised rash is recorded, so the suspect rule can fire | `Check for new medication in generalised rash` |\n| Any marker of severity (red box) | Drug rash **and** any red-box item; shock written as Shock **or** SBP < 80 | `Urgent: drug rash with markers of severity` |\n| Review: \"Patient unwell or markers of severity²\" → Box 2 \"Give urgent attention as above\" | Same urgent rule; footnote 2 adds BP < 90/60 (systolic < 90 or diastolic < 60), which the red box does not list | `Urgent: drug rash with markers of severity` |\n| On ART/TB medication/co-trimoxazole/TPT? | Not modelled: the branch only routes management (refer, MIC hotline, switch ART) | — |\n| AHR likely (131) | Cross-reference to page 131, not modelled here | — |\n| ALT or eosinophil count raised | Not representable (no lab-value unit or observable in the language); routing to MIC hotline is management | — |\n| Fixed drug eruption likely | Drug rash **and** hyperpigmentation of skin **and** macule of skin (dark, flat spots). \"Round\", \"anywhere on body\" and the \"often\" itchy/red-edged start are not encoded; the \"No\" branch condition is not encoded | `Diagnose probable fixed drug eruption` |\n| Advise/return/refer/discuss | Management | — |\n\n## Notes\n\n- The \"Yes\" box text says \"markers of severity¹\", but footnote 1 is the shock definition; the review\n  boxes use footnote 2 (markers of severity). Read as markers of severity (footnote 2).\n- Footnote 1 (\"shock likely\") is not built as a probable shock rule: it would be a shared\n  definition of shock, and the page does not say whether all or any of the signs are needed.\n", "questions": "# Page 88 – Drug rash: remaining questions\n\n## Decisions made\n\n- **Presenting complaint.** \"Drug rash\" is `Eruption caused by drug` (disorder). It is not a recorded\n  common symptom or warning sign. The check task and the urgent rule fire on either a recorded drug\n  rash finding or the `possible` diagnosis from the page's \"Suspect a drug rash\" sentence:\n  `(or (clinical_finding Eruption caused by drug) (diagnosis Eruption caused by drug possible))`.\n- **Suspect drug rash** (`possible`): `Generalized rash` **and** `(<= (onset (clinical_finding New medication\n  commenced)) (time_ago 3 months))`. The time comparison uses `<=`, per the decision for all pages\n  (\"within\" → `<=`). A small task, `Check for new medication in generalised rash`, asks about new\n  medication whenever a generalised rash is recorded, so that the finding exists for the rule to use.\n- **Shock/SBP < 80** is encoded as the page writes it: `Shock` (disorder) **or** systolic BP < 80.\n  Footnote 1 (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness,\n  shock likely\") is **not** built as a probable shock rule. That would be a shared definition of\n  shock, and the footnote does not say whether any one sign or all of them are needed.\n- **BP < 90/60 added to the urgent rule.** The red box doesn't list it, but footnote 2 (markers of\n  severity) does, and box 2 (\"Patient unwell or markers of severity² → Stop all medication. Give\n  urgent attention as above\") sends those patients to the same urgent care. Encoded as systolic < 90\n  **or** diastolic < 60 (Will's convention).\n- **Involves mouth, eyes or genitals** is encoded as `Eruption caused by drug` with `finding_site`\n  `Mouth region structure`, `Eye region structure` and `Genital structure`. All three were confirmed to resolve.\n- **Blisters, peeling or raw areas** are `Blister of skin`, `Peeling of skin` and `Denuded skin` (for raw areas).\n- **Unwell, malaise, fatigue, body pain** are `Generally unwell`, `Malaise`, `Fatigue` and `Generalized aches and pains`.\n- **Fixed drug eruption likely** (`probable`): drug rash (finding or possible diagnosis) **and**\n  `Hyperpigmentation of skin` **and** `Macule of skin` (\"dark coloured … flat spots\").\n- The \"Yes\" branch box says \"markers of severity¹\"; footnote 1 is the shock definition, so this is\n  read as footnote 2 (markers of severity), as used in the review step.\n- No `measure` tasks: the only measurements the page asks for are ALT and eosinophil count (labs).\n\n## Could not model\n\n- **ALT and eosinophil count** (\"Check ALT and eosinophil count\"; \"ALT or eosinophil count raised\"):\n  the language has no lab-value unit or observable, so these are `not_representable`. The branch only routes to\n  management (discuss with MIC hotline/specialist), so no rule is lost.\n- **Rash onset relative to medication start**: the page says the rash \"appeared within 3 months of\n  starting a new medication\". The rule checks that the medication was started within the last 3\n  months. It therefore misses a rash that appeared within 3 months of starting a drug begun more\n  than 3 months ago, so it fires **less often** than the page intends, and it does not check that the rash\n  came after the drug.\n- **Fixed drug eruption details**: \"round\", \"anywhere on body\" and the \"often start as itchy\n  patches with red edges\" are not encoded. The page reaches this diagnosis only on the \"No\" branch\n  (not on ART, TB medication, co-trimoxazole or TPT). The rule does not apply that condition, so it\n  fires **more often** than the page intends.\n- **\"Is patient on ART, TB medication, co-trimoxazole or TPT?\"**: this routes management only, so it isn't modelled.\n- **\"Abacavir hypersensitivity reaction (AHR) likely 131\"** is a cross-reference to page 131 and isn't modelled here.\n- **\"Review patient and result within 24 hours\"** and the advice to return are follow-up/management.\n\n## SNOMED gaps\n\n- \"Drug rash\": `Drug eruption` (disorder) does not exist; used `Eruption caused by drug` (disorder).\n- \"Raw areas\": no `Raw skin`; used `Denuded skin` (disorder).\n- \"Body pain\": no `Body pain` (finding); used `Generalized aches and pains` (finding).\n- \"Unwell\": no `Feeling unwell`; used `Generally unwell` (finding).\n- \"Shock\" exists only as a disorder: `Shock` (disorder).\n- \"Dark coloured round flat spots\": there is no single concept; used `Hyperpigmentation of skin` (disorder) plus\n  `Macule of skin` (disorder).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should BP < 90/60 (footnote 2, reached through the review step) make a drug-rash patient Urgent at\n  first presentation, or only the red-box list (Shock/SBP < 80)?\n- Is `Eye region structure` the right site for \"involves eyes\" (eyelids and conjunctiva), or should only the eye\n  proper/conjunctiva count?\n- Is it acceptable that \"fixed drug eruption likely\" fires for patients on ART/TB medication/co-trimoxazole/TPT,\n  for whom the page instead routes to the doctor/MIC hotline?\n- Footnote 1 \"shock likely\": does it mean any one of the signs, or all of them? This page encodes only\n  Shock/SBP < 80.\n- Is drug rash + `Hyperpigmentation of skin` + `Macule of skin` an acceptable stand-in for \"dark\n  coloured round flat spots … following ingestion of a medication\"? (The reconciler kept drug rash as\n  the medication context rather than a separate drug-exposure finding.)\n- Should a generalised rash with any current medication (not only one started within 3 months)\n  prompt the drug-rash checks?\n", "claims": [{"claim_id": "c001", "rule": "Check for new medication in generalised rash", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generalized rash\" \"disorder\"))", "element_keys": ["p88-42170e13"], "quote": "generalised rash"}, {"claim_id": "c002", "rule": "Check for new medication in generalised rash", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"New medication commenced\" \"finding\"))", "element_keys": ["p88-42170e13"], "quote": "starting a new medication"}, {"claim_id": "c003", "rule": "Check for drug rash markers of severity", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Eruption caused by drug\" \"disorder\"))", "element_keys": ["p88-334ac29c"], "quote": "drug rash"}, {"claim_id": "c004", "rule":  medication in generalised rash", "text": "Trigger is Generalized rash; check_for 'New medication commenced' matches the page's suspect statement. No problem beyond lack of drug-class detail (ART, TB, co-trimoxazole, TPT) used by the flowchart.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "(none) Shock likely, footnote 1", "text": "The page's 'shock likely' definition (SBP < 80, pulse >= 100, RR > 30, confusion/restlessness, weakness) has no probable Shock rule. The Urgent rule depends on the health worker recording 'Shock' directly; pulse >= 100, RR > 30 and confusion alone won't trigger urgency.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fixed drug eruption", "text": "It needs a drug-rash diagnosis or finding, and the only possible rule for that needs a Generalized rash. A fixed drug eruption is typically localised, so the rule is rarely reachable from the system's own logic. Its features (hyperpigmentation, macule) are checked only inside the 'markers of severity' task, which is triggered by drug rash, so this is circular for localised cases. The ART/TB/co-trimoxazole/TPT 'No' branch context is also lost.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "Suspect drug rash: generalised rash after new medication", "text": "Onset of 'New medication commenced' within the last 3 months approximates 'rash appeared within 3 months of starting a new medication' relative to today, not relative to rash onset. 'New medication commenced' appears only inside an onset expression; confirm the check_for-used-as-evidence test counts this as a use.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "Check for drug rash markers of severity", "text": "This task mixes fixed drug eruption features (Hyperpigmentation of skin, Macule of skin) into a check list named for markers of severity; it's a grouping and naming issue only. SBP < 80 is redundant with SBP < 90 in the Urgent rule, which is harmless.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "Check for drug rash markers of severity", "text": "Type, trigger and the 19 severity items are right, but the last two findings (Hyperpigmentation of skin, Macule of skin) are fixed-drug-eruption discriminators from the 'No' branch, not markers of severity, and sit under a task whose name says otherwise; they should be a separate task or the task renamed. Nothing invented.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fixed drug eruption", "text": "probable is right for 'fixed drug eruption likely'. Two weaknesses: (1) the page's single lesion description is split into two independent generic findings, so unrelated hyperpigmentation plus any macule fires it; (2) the page gives this only in the 'not needing urgent attention' / 'No' (not on ART, TB medication, co-trimoxazole or TPT) branch, and the rule drops both conditions. Neither is inventable content, and the 'often start as itchy patches with red edges' qualifier is rightly left optional.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "high", "ref": "Check for drug rash markers of severity", "text": "Includes hyperpigmentation and macule (fixed drug eruption features, non-urgent branch) in the severity check_for list. Mouth/eye region concepts may be broader than the mucosal involvement meant.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fixed drug eruption", "text": "Precondition is drug-rash finding/possible dx, which needs generalised rash plus new medication within 3 months; page only says following ingestion of a medication, localized spots. Probable is justified by 'likely'.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "Check for drug rash markers of severity", "text": "Includes two fixed-drug-eruption features (Hyperpigmentation of skin, Macule of skin) in a task titled for markers of severity; they are not severity markers. Severity list otherwise matches the red box; no check for temperature/SBP is needed as those are measurements.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "rule", "priority": "medium", "ref": "Urgent: drug rash with markers of severity", "text": "Urgent level matches 'Give urgent attention'; and/or structure faithful to red box. But footnote-2 BP<90/60 disjuncts make the red-box SBP<80 threshold redundant (urgent now fires at SBP 85 or DBP 55) — page-supported via the 24-h review box but worth reviewer confirmation. Footnote-1 shock criteria (pulse ≥100, RR >30, confusion/restlessness, weakness) are not encoded, so 'Shock' depends on a clinician recording it.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 88, "slug": "88-drug-rash", "kind": "build_disagreement", "priority": "low", "ref": "trigger", "text": "A only: task triggered by (finding Generalized rash) to check for New medication commenced", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generalized rash\" \"disorder\"))", "reason": "\"Suspect a drug rash in a patient with a generalised rash which appeared within 3 months of starting a new medication\" needs the new-medication finding asked about when a generalised rash is present, otherwise the suspect rule cannot fire.", "unsettled": false}]}, {"page": 88, "slug": "88-drug-rash", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: New medication commenced  vs  B: Exposure to (contextual qualifier) + Drug or medicament", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"New medication commenced\" \"finding\"))", "reason": "The page says \"starting a new medication\"; New medication commenced matches those words, whereas generic drug exposure includes long-standing medication.", "unsettled": false}]}, {"page": 88, "slug": "88-drug-rash", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A only: Generally unwell", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generally unwell\" \"finding\"))", "reason": "The marker reads \"Unwell, malaise, fatigue, body pain\"; \"Unwell\" is listed separately from \"malaise\", and box 2 says \"Patient unwell\".", "unsettled": false}]}, {"page": 88, "slug": "88-drug-rash", "kind": "build_disagreement", "priority": "low", "ref": "priority_condition", "text": "A only: Generally unwell in the urgent rule", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generally unwell\" \"finding\"))", "reason": "Same as above: \"Unwell\" is a marker of severity in the red box and in footnote 2.", "unsettled": false}]}, {"page": 88, "slug": "88-drug-rash", "kind": "build_disagreement", "priority": "low", "ref": "diagnosis_condition", "text": "Suspect drug rash: A: (<= (onset New medication commenced) (time_ago 3 months))  vs  B: Drug exposure present and (<= (onset Drug exposure) (time_ago 3 months))", "detail": [{"choice": "A", "final": "(<= (onset (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept   <section class="pane"><h2><span id="rulesttl">Rules, in plain English</span> <span class="hb" data-k="rules"></span> <span style="float:right"><button id="rawbtn" style="font-size:11.5px;text-transform:none;letter-spacing:0">show structured rules</button><span class="hb" data-k="rawtoggle"></span></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="rules"></div></section>
</main>
<div class="lower">
  <div class="tabs" id="tabs"></div>
  <div class="tabbody" id="tabbody"></div>
</div>
<script src="help.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
