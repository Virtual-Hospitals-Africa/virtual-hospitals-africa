 "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "reflex test.", "bbox": [293.7, 461.4, 330.9, 471.6], "key": "p102-23053e52"}, {"id": "p102-out-e16", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Start INH-resistant TB treatment 107 and review reflex test results", "bbox": [268.4, 484.8, 358.0, 515.0], "key": "p102-e89722ef"}, {"id": "p102-out-e17", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Send a 2nd sputum sample", "bbox": [386.0, 441.4, 488.5, 451.6], "key": "p102-71ca2e73"}, {"id": "p102-out-e18", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "for DR-TB reflex test.", "bbox": [399.7, 451.4, 472.8, 461.6], "key": "p102-3df70f20"}, {"id": "p102-out-e19", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "TUBERCULOSIS (TB): DIAGNOSIS", "bbox": [288.8, 48.7, 552.4, 71.0], "key": "p102-21b979e6"}, {"id": "p102-out-e20", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Diagnose RR-TB: • Refer or start RR-TB treatment 111. • Review reflex test results 104.", "bbox": [383.5, 474.0, 480.9, 525.0], "key": "p102-7728f754"}, {"id": "p102-out-e21", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes", "bbox": [59.1, 360.3, 71.0, 370.5], "key": "p102-bfa056d1"}, {"id": "p102-out-e22", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "MTB detected: TB NAAT positive Was the patient treated for TB in the last 2 years?", "bbox": [178.0, 325.8, 350.7, 346.8], "key": "p102-758f428c"}, {"id": "p102-out-e23", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "MTB detected: TB NAAT trace Was the patient treated for TB in the last 2 years?", "bbox": [568.4, 325.8, 741.1, 346.8], "key": "p102-a680223d"}, {"id": "p102-out-e24", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "TB symptoms and signs present and/", "bbox": [663.3, 384.7, 798.6, 394.9], "key": "p102-f0862318"}, {"id": "p102-out-e25", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "or abnormal CXR suggestive TB? • Send sputum for culture and DST. • TB symptoms and signs present?", "bbox": [507.4, 384.7, 789.6, 404.9], "key": "p102-614fe580"}, {"id": "p102-out-e26", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Continue routine care.", "bbox": [517.5, 441.4, 563.0, 461.6], "key": "p102-863e00e0"}, {"id": "p102-out-e27", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Start DS-TB treatment", "bbox": [625.4, 474.2, 704.8, 484.4], "key": "p102-ce6f3d9f"}, {"id": "p102-out-e28", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Review culture and DST results 104.", "bbox": [553.5, 497.6, 692.5, 508.4], "key": "p102-fda2c52a"}, {"id": "p102-out-e29", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes", "bbox": [693.2, 418.0, 705.1, 428.2], "key": "p102-6ef809e7"}, {"id": "p102-out-e30", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes", "bbox": [554.4, 360.3, 566.4, 370.5], "key": "p102-00fdd25c"}, {"id": "p102-out-e31", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Continue routine care. Send sputum for", "bbox": [668.6, 441.4, 802.1, 461.6], "key": "p102-d1047051"}, {"id": "p102-out-e32", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "culture and DST.", "bbox": [669.4, 451.4, 729.0, 461.6], "key": "p102-4a8cf562"}, {"id": "p102-out-e33", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes No", "bbox": [535.0, 418.0, 622.4, 428.2], "key": "p102-ea16e7d5"}, {"id": "p102-out-e34", "page": 102, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1A TB contact refers to any person who shared an enclosed space (at school, socially, or in a household setting), for ≥ 1 night or for frequent/extended daytime periods, with an adult/adolescent with pulmonary TB (\"index patient\"), during the 3-month period before the index patient started their TB treatment. 2Do not mix Ringer's lactate and IV ceftriaxone. If severe penicillin allergy (previous angioedema, anaphylaxis or urticaria), discuss with doctor.", "bbox": [34.0, 536.0, 797.3, 552.5], "key": "p102-f6aec8cc"}], "boxes": [{"box": 1, "rect": [35.4, 142.7, 806.0, 215.1]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAACYCAIAAADRD6nxAAAACXBIWXMAABcSAAAXEgFnn9JSAACxPklEQVR4nOy9h1cUSff///1Dfuc8yyiKIgqKYkIXUcw5IwZMYMCcI+aw667ZxZwTYlZEUVSMiIqYFbOsumZXXfWzzzO/N3OhLDvU9IzggN5zXofDdFd3V7h1697bVdX/7/n/V5xhGIZhGIZhGIZhGIZhihb/z+M5YBiGYRiGYRiGYRiGYRhX4agWwzAMwzAMwzAMwzAMU/T4HNV6Uarc+3kTGYZhGIZhGIZhGIZhGKZw8txWyiCq9bJSZfv/XWYYhmEYhmEYhmEYhmGYwsmLUmU5qsUwDMMwDMMwDMMwDMMUMTiqxTAMwzAMwzAMwzAMwxQ9OKrFMAzDMAzDMAzDMAzDFD04qsUwDMMwDMMwDMMwDMMUPTiqxTAMwzAMwzAMwzAMwxQ9OKrFMAzDMAzDMAzDMAzDFD04qsUwDMMwDMMwDMMwDMMUPTiqxTAMwzAMwzAMwzAMwxQ9OKrFMAzDMAzDMAzDMAzDFD04qsUwDMMwDMMwDMMwDMMUPTiqxTAMwxQ4H99lvH9z1uPZYBS8eXHmvx8vejwbFrl8YWfS3qXg+ZMTHs+MI Deficiency of macronutrients\" \"disorder\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "relation": "A_narrower"}], "same_concept_different_form": []}, "diagnosis_condition": {"only_A": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Exposure to Mycobacterium tuberculosis\" \"event\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Plain X-ray of chest for tuberculosis screening abnormal\" \"finding\"))"], "only_B": ["(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Mycobacterium tuberculosis complex\" \"organism\"))"], "both": ["(active_condition (snomed_concept \"Fever\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cough\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Night sweats\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weight decreased\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Tuberculosis\" \"disorder\") possible)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 102 – Tuberculosis (TB): Diagnosis: flowchart\n\nSource: APC 2026 e-book, page 102.\n\n```mermaid\nflowchart TD\n    S[\"TB symptoms: current cough, weight loss, drenching night sweats or fever<br/>or screening group: DS-TB in last 2 years, PLHIV, TB contact¹, abnormal digital CXR + CAD\"]\n    S --> SUS[\"Suspected TB\"]\n    SUS --> RB{\"Any of: RR ≥ 30, pulse > 120, T > 39°C, breathlessness at rest/while talking,<br/>prominent use of breathing muscles, coughs up ≥ 1 tablespoon fresh blood,<br/>drowsy/confused, neck stiffness, persistent vomiting, new weakness of arm/leg,<br/>unable to walk unaided, severe malnutrition or wasted?\"}\n    RB -- Yes --> URG[\"Give urgent attention. Manage and refer urgently\"]\n    RB -- No --> WU[\"Workup: check interrupted treatment > 2 months; 1 sputum for TB NAAT;<br/>test for HIV; urine LAM if HIV + TB symptoms + CD4 ≤ 200 or WHO stage 3/4\"]\n    WU -- \"LAM positive\" --> LAM[\"Diagnose TB on urine LAM; start DS-TB treatment\"]\n    WU --> POS[\"MTB detected: TB NAAT positive<br/>Treated for TB in last 2 years?\"]\n    WU --> TR[\"MTB detected: TB NAAT trace<br/>Treated for TB in last 2 years?\"]\n    POS -- Yes --> DST[\"Check current DST result\"]\n    POS -- No --> DST\n    DST -- \"Rifampicin sensitive or unsuccessful\" --> DS[\"Send sputum (smear / culture + DST); start DS-TB treatment\"]\n    DST -- \"Rifampicin sensitive and INH-resistant\" --> INH[\"Diagnose INH-resistant TB\"]\n    DST -- \"Rifampicin resistant or both\" --> RR[\"2nd sputum for DR-TB reflex test; Diagnose RR-TB\"]\n    TR -- Yes --> TRY[\"Send sputum for culture and DST.<br/>TB symptoms and signs present?\"]\n    TRY -- No --> RC1[\"Continue routine care; review culture and DST\"]\n    TRY -- Yes --> DST2[\"Start DS-TB treatment; review culture and DST\"]\n    TR -- No --> TRN{\"TB symptoms and signs and/or abnormal CXR suggestive TB?\"}\n    TRN -- Yes --> DST2\n    TRN -- No --> RC2[\"Continue routine care\"]\n```\n\n¹ TB contact: shared an enclosed space for ≥ 1 night or frequent/extended daytime periods with an\nindex patient with pulmonary TB, in the 3 months before the index patient started treatment.\n\n(The page's left \"Yes\" line from \"treated for TB in last 2 years\" runs down past the DST column;\nthe image does not show a separate destination box, so it is drawn as joining \"Check current DST\nresult\". Not modelled either way.)\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| TB symptoms / TB contact / abnormal screening CXR → suspected TB | `or` of Cough, Weight decreased, Night sweats, active Fever, exposure to Mycobacterium tuberculosis complex, Plain X-ray of chest for tuberculosis screening abnormal | `Diagnose possible TB from TB symptoms, TB contact or abnormal screening CXR` |\n| DS-TB in last 2 years, PLHIV screening schedule | Not modelled (timing schedule; see remaining questions) | — |\n| Red box | `check_for` of the non-vital red-box items, triggered by possible TB | `Check for urgent suspected TB conditions` |\n| Red box = Yes | `(and possible TB (or …red box…))` → Urgent | `Urgent: suspected TB with danger signs` |\n| Workup, LAM, NAAT, DST branches, INH-resistant TB, RR-TB | Not modelled: lab results (NAAT, LAM, CD4, DST, culture) have no representation; the remainder is management | — |\n", "questions": "# Page 102 – Tuberculosis (TB): Diagnosis: remaining questions\n\n(Final build, reconciled from two independent builds A and B; see `reconcile.json`.)\n\n## Decisions made\n\n- **\"Suspected TB\" is a `possible` TB diagnosis.** The page's opening line (\"Check for TB if the\n  patient has any TB symptoms: current cough, weight loss, drenching night sweats or fever. Also\n  test for TB … if … TB contact, abnormal findings on digital CXR + CAD screening\") is encoded as\n  `Diagnose possible TB from TB symptoms, TB contact or abnormal screening CXR`. The red-box check\n  task and the Urgent priority rule both key off `(diagnosis Tuberculosis possible)`.\n- **Red box → Urgent**, as `(and (diagnosis Tuberculosis possible) (or …all 12 items…))`. The page\n  does not escalate beyond \"urgent attention\", so `Urgent` throughout, even where an item's own\n  warning sign carries a higher level (Acute confusion, Hemoptysis).\n- The task's `check_for` holds only the red-box items. The TB symptoms and TB contact feed the\n  possible-TB rule that triggers the task, so checking for them inside that task could not change\n  any rule's result (both builds' reasoning was weighed; see `reconcile.json`).\n- Vitals (RR ≥ 30, pulse > 120, temperature > 39 °C) are routine and get no measure task; the page's\n  comparison directions are kept exactly (≥ 30, > 120, > 39).\n- \"Breathlessness at rest or while talking\" = `Dyspnea at rest` or `Unable to complete a sentence in\n  one breath`. \"Drowsy/confused\" = `Drowsy` or `Acute confusion`. \"Severe malnutrition or wasted\" =\n  `Deficiency of macronutrients` (protein-energy malnutrition) + Severe, or `Nutritional wasting`.\n  \"Unable to walk unaided\" = `Unable to walk` (the app's mobility-assessment form).\n- **TB contact** is encoded with Will's exposure pattern (page 20): `(finding Exposure to\n  (contextual qualifier) Mycobacterium tuberculosis complex)`.\n- No `probable` diagnosis rules: every \"diagnose\" on this page (TB on urine LAM, MTB detected,\n  INH-resistant TB, RR-TB) rests on a lab result.\n- No shock / BP < 90/60 criteria appear on this page.\n\n## Could not model\n\n- **PLHIV screening** (at diagnosis, at re-engagement if ART interrupted > 90 days, yearly when viral\n  load checked, at first antenatal visit) and **DS-TB in last 2 years** (yearly for 2 years after\n  treatment): the schedule cannot be expressed. Encoding the bare condition would make possible TB\n  fire at every visit of every PLHIV, so they are left out; the possible-TB rule fires **less often**\n  than the page intends for asymptomatic people in these groups.\n- **Lab-based workup and diagnoses**: TB NAAT (positive / trace / unsuccessful), urine LAM, CD4 ≤ 200,\n  WHO stage 3/4, DST (rifampicin/INH), culture, interrupted treatment > 2 months. No observables or\n  units exist for these, and SNOMED has no \"MTB detected\" result finding (only a \"not detected\" PCR\n  finding). Diagnose INH-resistant TB, Diagnose RR-TB and \"diagnose TB on urine LAM\" are therefore\n  not encoded. All flowchart endpoints are management (start treatment, sputum, review results).\n- \"Coughs up ≥ 1 tablespoon of fresh blood\": volume and \"fresh\" not expressible; plain `Hemoptysis`\n  is used, which fires **more often** than the page intends.\n- \"Drenching\" night sweats: plain `Night sweats`, fires **more often**.\n- \"Unable to walk unaided\": `Unable to walk`; a patient who walks only with help may be missed\n  (fires **less often**).\n- TB contact definition (footnote 1: enclosed space, ≥ 1 night or frequent/extended daytime\n  periods, 3-month window) is not expressible; any recorded exposure counts.\n- \"Digital CXR + CAD\": only an abnormal screening chest X-ray finding\n  (`Plain X-ray of chest for tuberculosis screening abnormal`) is expressible; \"digital\" and \"CAD\"\n  are dropped.\n- Management box (oxygen to keep saturation ≥ 92 %, ceftriaxone, refer) and the whole workup /\n  treatment section: management steps, not modelled in this pass.\n\n## SNOMED gaps\n\n- `Weight loss` (finding): not an active FSN; used `Weight decreased` (finding).\n- `Drenching sweats`: none; used `Night sweats`.\n- `Confusion` (finding): none general enough; used `Acute confusion` (the warning-sign form).\n- `Severe malnutrition` / `Malnutrition` (disorder): none; used `Deficiency of macronutrients` +\n  `Severe (severity modifier)` (broader than `Malnutrition (calorie)`, which is its descendant).\n- Dyspnoea while talking: none; used `Unable to complete a sentence in one breath` (narrower).\n- \"Unable to walk unaided\": used `Unable to walk`.\n- No \"TB contact\" situation; `Exposure to Mycobacterium tuberculosis` exists only as an `event`, so\n  the exposure qualifier + organism form was used.\n- No \"massive/large haemoptysis\" concept.\n- No concepts for TB NAAT/Xpert result, urine LAM result, DST result or CXR with CAD.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Is \"suspected TB\" from any single symptom (e.g. cough alone) the right trigger for the urgent\n  check, given that cough is a very common complaint?\n- Should a known TB patient (on treatment) with the red-box signs also be Urgent here? Only\n  *suspected* TB (possible) is keyed; a recorded active TB diagnosis without new symptoms does not\n  trigger the check.\n- Should PLHIV and patients treated for DS-TB in the last 2 years trigger possible TB at all, given\n  the schedule cannot be modelled?\n- Is any haemoptysis acceptable as the urgent criterion in place of \"≥ 1 tablespoon of fresh blood\"?\n- Is `Unable to complete a sentence in one breath` an acceptable stand-in for \"breathless while\n  talking\"?\n- Weight loss, night sweats, TB contact and an abnormal screening CXR are not common symptoms or\n  warning signs, and no task on this page asks for them. Where should they be recorded so the\n  possible-TB rule can fire on them? (Builder B had added the first three to the urgent check task;\n  the final build does not, because that task only runs once TB is already suspected.)\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent suspected TB conditions", "role": "trigger", "expr": "(diagnosis (snomed_concept \"Tuberculosis\" \"disorder\") possible)", "element_keys": ["p102-8d1cf36b"], "quote": "suspected TB"}, {"claim_id": "c002", "rule": "Check for urgent suspected TB conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Dyspnea at rest\" \"finding\"))", "element_keys": ["p102-0dc99669"], "quote": "Breathlessness at rest"}, {"claim_id": "c003", "rule": "Check for urgent suspected TB conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to complete a sentence in one breath\" \"finding\"))", "element_keys": ["p102-0dc99669"], "quote": "while talking"}, {"claim_id": "c004", "rule": "Check for urgent suspected TB conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Accessory respiratory muscles used\" \"finding\"))", "element_keys": ["p102-ada0c81e"], "quote": "Prominent anism form where 'Exposure to tuberculosis' (event) exists. Otherwise the red box is faithfully and completely encoded with correct thresholds and Urgent priority; 'unable to walk unaided' and 'drenching' night sweats lose their qualifiers."}], "scorecard": {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "validation_ok": true, "builder_agreement": 0.865, "elements": 49, "elements_agreed": 33, "claims": 36, "claims_agreed": 18, "queue": 60, "queue_by_priority": {"low": 17, "medium": 32, "high": 11}, "missing_reports": [], "element_rows": [{"key": "p102-8d1cf36b", "id": "p102-rb1-e01", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p102-d73eb0c6", "id": "p102-rb1-e02", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p102-0dc99669", "id": "p102-rb1-e03", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p102-12ed0574", "id": "p102-rb1-e04", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"correct": 2, "partial": 1}}, {"key": "p102-56ca0cdf", "id": "p102-rb1-e05", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p102-3b56083a", "id": "p102-rb1-e06", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"partial": 2, "correct": 1}}, {"key": "p102-2fbcc260", "id": "p102-rb1-e07", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p102-ada0c81e", "id": "p102-rb1-e08", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p102-937da012", "id": "p102-rb1-e09", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p102-010b5c09", "id": "p102-rb1-e10", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p102-d66060d7", "id": "p102-rb1-e11", "box": 1, "status": "queue", "scopes": {"in_sc rculosis-tb-diagnosis", "kind": "element", "priority": "low", "ref": "p102-12ed0574", "text": "Drowsy/confused", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Two parts, both encoded: Drowsy (exact) and Acute confusion (Confusional state is also available as a disorder; Acute confusion as a finding is the better fit for a bedside sign).", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["plain 'confused' (not necessarily acute) is narrowed to 'Acute confusion'"], "problem": "Drowsy and Acute confusion encoded as separate alternatives. The page says 'Drowsy/confused'; 'Acute' is not on the page and could miss chronic/unspecified confusion.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Drowsy and confused both encoded. 'Acute confusion' is narrower than the page's plain 'confused' (Confusional state would be broader), but acceptable for an acute presentation.", "confidence": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "element", "priority": "medium", "ref": "p102-3b56083a", "text": "Unable to walk unaided", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'unaided': a patient who can walk only with help is not 'Unable to walk' and would not trigger the rule"], "problem": "Encoded as Unable to walk (282145008), which is stricter than the page. The page's criterion includes the patient who walks with assistance. SNOMED has (snomed_concept \"Dependent for walking\" \"finding\") (synonym matched on 'walk assist'), which matches 'unable to walk unaided' more closely; alternatively keep Unable to walk and add Dependent for walking as an or-branch.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "'Unable to walk' drops 'unaided' nuance; acceptable.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'unaided': patients who can walk only with assistance are not captured"], "problem": "'Unable to walk' (282145008) is narrower than 'unable to walk unaided'; a patient needing help to walk would not trigger Urgent. No 'unable to walk without assistance' concept was found; a qualifier or Difficulty walking + Severe would be closer.", "confidence": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "element", "priority": "low", "ref": "p102-d66060d7", "text": "Severe malnutrition or wasted", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Two parts, both encoded. 'Severe malnutrition' = Deficiency of macronutrients (synonym: protein-calorie malnutrition; SNOMED has no plain 'Malnutrition' or 'Severe malnutrition' concept, and the severe PCM concept is a paediatric Gomez definition) with the Severe qualifier. 'Wasted' = Nutritional wasting, a child of Deficiency of macronutrients; Cachexia (finding) would be an acceptable alternative.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'Severe malnutrition' mapped to Deficiency of macronutrients + Severe; a closer malnutrition concept may exist"], "problem": "Two parts: severe malnutrition and wasted. 'Wasted' encoded as Nutritional wasting (fine). 'Severe malnutrition' uses the broader 'Deficiency of macronutrients' with a severity qualifier; fidelity of concept is questionable and the qualifier may not match recorded form.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Both parts encoded: severe malnutrition as Deficiency of macronutrients + Severe; wasted as Nutritional wasting.", "confidence": "high"}]}, {"page": 102, "slug": "102-tuberculosi gger.", "fix": "Same as c005.", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page threshold is coughing up >= 1 tablespoon of FRESH blood (significant haemoptysis); plain Hemoptysis also matches blood-streaked sputum, which is common in TB and would over-trigger Urgent. No 'massive hemoptysis' concept found in the release.", "fix": "Add a severity qualifier, e.g. (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")), in both the check_for and the priority rule, or note the volume threshold for the reviewer.", "confidence": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "claim", "priority": "medium", "ref": "c030", "text": "Urgent: suspected TB with danger signs :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Acute confusion\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Same as c007: narrower than the page's 'confused'.", "fix": "", "confidence": "low"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page says 'confused' with no acuity; 'Acute confusion' adds a qualifier the page doesn't state (likely the intended clinical meaning, so minor).", "fix": "Consider (snomed_concept \"Confusional state\" \"disorder\") if chronic confusion should also count; otherwise accept.", "confidence": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "claim", "priority": "low", "ref": "c033", "text": "Urgent: suspected TB with danger signs :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Persistent vomiting\" \"disorder\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "As c010.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "claim", "priority": "medium", "ref": "c034", "text": "Urgent: suspected TB with danger signs :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to walk\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Same as c011: 'unaided' is dropped; narrower than the page.", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Drops the \"unaided\" qualifier.", "fix": "As c011.", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page says 'unable to walk UNAIDED' (includes patients who can walk only with help); 'Unable to walk' is narrower and misses them.", "fix": "Add qualifier (snomed_concept \"Unaided\" \"qualifier value\") or document that 'Unable to walk' is meant to cover needs-assistance.", "confidence": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "claim", "priority": "low", "ref": "c035", "text": "Urgent: suspected TB with danger signs :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Deficiency of macronutrients\" \"disorder\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "As c012.", "fix": "As c012.", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "claim", "priority": "low", "ref": "c036", "text": "Urgent: suspected TB with danger signs :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Nutritional wasting\" \"disorder\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "As c013.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms, TB contact or abnormal screening CXR", "text": "The rule encodes two of the page's four 'test even without symptoms' triggers (contact, screening CXR) but not the other two (DS-TB in the last 2 years; PLHIV). Both omitted triggers are expressible as patient state (active_condition / history with a 2-year onset window; active_condition HIV infection) even though their timing schedules are not. Asymptomatic PLHIV and recently treated patients therefore never reach the suspected-TB state on this page.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: suspected TB with danger signs", "text": "'Unable to walk unaided' is encoded as Unable to walk, which is stricter than the page; a patient who can walk only with help does not trigger Urgent. (snomed_concept \"Dependent for walking\" \"finding\") is closer.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: suspected TB with danger signs", "text": "Pulse is measured under (snomed_concept \"Pulse, function\" \"observable entity\"), a body-function concept, rather than (snomed_concept \"Heart rate\" \"observable entity\"). Whether this branch ever fires depends on which concept the system records the routine pulse vital under; this cannot be confirmed from the checker inputs and should be checked against the vitals vocabulary. Direction, unit and threshold (> 120 bpm) are right.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: suspected TB with danger signs", "text": "'Coughs up >= 1 tablespoon of fresh blood' is reduced to any Hemoptysis (volume not representable), so blood-streaked sputum also makes the patient Urgent. Over-triggers rather than misses.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "(whole file)", "text": "The page's result-driven diagnoses (TB on positive urine LAM; INH-resistant TB and RR-TB from DST) and the NAAT positive / trace branches are not encoded. These depend on lab results, which the house standard does not ask rule authors to model, so this is a scope note rather than a defect; but if the team decides result-driven diagnoses are wanted, this page has three of them.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Check for urgent suspected TB conditions", "text": "No structural defects: all 12 check_for findings are consumed by the Urgent rule with identical s-expressions, the priority rule's remaining evidence is routine vitals, the task's due_to is not in its own check_for, the Urgent level matches the page's 'Give urgent attention', and the red box is not merged with anything outside it.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Check for urgent suspected TB conditions (task) / system_diagnosis_rule", "text": "Possible-TB rule omits two of the page's 'test even without symptoms' triggers (recent DS-TB treatment, PLHIV/pregnant at first antenatal visit); only symptoms, contact and CXR are encoded.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: suspected TB with danger signs", "text": "Hemoptysis fires without the >= 1 tablespoon volume; Drowsy/confused narrowed to Acute confusion.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "whole page", "text": "No TB diagnosis rule for confirmed pathways (NAAT positive, urine LAM, INH-resistant, RR-TB); these depend on lab results and are arguably not representable.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "system_diagnosis_rule possible TB", "text": "Broad evidence: any Cough, Weight decreased or Fever makes TB possible, which then combines with any danger sign (e.g. Fever > 39 alone) to give Urgent. Page logic is 'suspected TB' so acceptable but over-triages.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms, TB contact or abnormal screening CXR", "text": "Four of six triggers (Weight decreased, Night sweats, TB exposure, abnormal screening CXR) are never checked for on this page. Only Cough and Fever are common symptoms, so the other branches fire only if another page happens to record them. The 'test even without symptoms' groups (TB contact, CXR) are the most likely to be lost.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: suspected TB with danger signs", "text": "'Suspected TB' is anchored to a possible-TB rule that fires on any cough or any fever. In practice this priority rule applies the TB red box to every adult with a cough and a danger sign. That is faithful to the page, but broad. Combined with unqualified Hemoptysis (no >= 1 tablespoon / fresh), it over-triages minor blood-streaked sputum.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "(page flowchart)", "text": "No diagnosis rules for the page's explicit conclusions: 'diagnose TB on urine LAM', NAAT positive/trace -> TB, 'Diagnose INH-resistant TB', 'Diagnose RR-TB'. The concepts exist for INH-resistant and RR-TB. The triggers are lab results that are probably not representable, but the file shows no sign this was considered.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms, TB contact or abnormal screening CXR", "text": "The 'also test for TB' list is half encoded: TB contact and abnormal CXR are included, but DS-TB in the last 2 years ('History of tuberculosis' situation exists) and PLHIV (HIV infection) are omitted.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms, TB contact or abnormal screening CXR", "text": "Type (possible, since the page says 'check for'/'suspected') and the flat 'or' are faithful to the first panel, and nothing is invented. But two of the page's four asymptomatic test triggers are missing: 'DS-TB in last 2 years' (yearly for 2 years after completing treatment) and 'PLHIV' (at diagnosis, at re-engagement after > 90 days interrupted ART, yearly, and at first antenatal visit if pregnant). The rule title acknowledges the narrower scope; the omission should be recorded as a schedule-based criterion the language cannot time, not left silent.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Check for urgent suspected TB conditions", "text": "Check task lists only symptoms and not vitals, and omits the management items (oxygen, ceftriaxone) from the red box; acceptable, but the trigger Tuberculosis possible comes from the box header 'suspected TB'.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms, TB contact or abnormal screening CXR", "text": "Page also says to test for TB without symptoms in: DS-TB in last 2 years, PLHIV (at diagnosis/yearly), pregnant at first antenatal visit. These are omitted. Also the page's wording is 'check/test for TB', not 'likely', so possible is right but the abnormal-CXR and contact entries are screening indications not symptoms.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Check for urgent suspected TB conditions", "text": "Type, trigger (possible TB) and coverage of the red box are right (vitals are routine and need no check). It inherits the Hemoptysis threshold and 'unaided' problems from its items. Because the trigger fires on any cough or fever (via the possible-TB rule), this 12-item check will run for every coughing or febrile adult.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 102, "slug": "102-tuberculosis-tb-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms, TB contact or abnormal screening CXR", "text": "'Check for TB if any TB symptoms' as a possible TB diagnosis is reasonable. But the page's 'also test for TB even in the absence of symptoms' indications (TB contact, abnormal CAD CXR) are merged in as if they were grounds to suspect TB. The other two indications (DS-TB in   <section class="pane"><h2>Red box text, piece by piece <span class="hb" data-k="source"></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="source"></div></section>
  <section class="pane"><h2><span id="rulesttl">Rules, in plain English</span> <span class="hb" data-k="rules"></span> <span style="float:right"><button id="rawbtn" style="font-size:11.5px;text-transform:none;letter-spacing:0">show structured rules</button><span class="hb" data-k="rawtoggle"></span></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="rules"></div></section>
</main>
<div class="lower">
  <div class="tabs" id="tabs"></div>
  <div class="tabbody" id="tabbody"></div>
</div>
<script src="help.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
