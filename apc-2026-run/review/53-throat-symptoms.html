queous benzyl penicillin 25000IU/kg IV, up to 1MIU. • Discuss diphtheria antitoxin (DAT) with NICD hotline 200. • Alert lab and send swab according to NICD guidance. • Notify4 within 24 hours. • Identify close contacts and discuss with provincial CDC5 directorate. • Refer.", "bbox": [493.2, 465.3, 746.7, 526.1], "key": "p53-e85cf7e9"}, {"id": "p53-out-e13", "page": 53, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Viral tonsillopharyngitis", "bbox": [40.3, 375.7, 117.5, 396.7], "key": "p53-3b105e15"}, {"id": "p53-out-e14", "page": 53, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely Explain that antibiotics are not", "bbox": [44.9, 396.5, 113.0, 426.7], "key": "p53-61676b21"}, {"id": "p53-out-e15", "page": 53, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "necessary.", "bbox": [59.3, 426.5, 96.6, 436.7], "key": "p53-9bff13ef"}, {"id": "p53-out-e16", "page": 53, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Bacterial tonsillopharyngitis likely • May also have generalised red rash, red spots in back of throat or a red tongue with bumps (strawberry tongue). • If ≤ 21 years old, give one of: - single dose of benzathine benzylpenicillin", "bbox": [134.6, 311.7, 371.1, 373.0], "key": "p53-49e9e5a3"}, {"id": "p53-out-e17", "page": 53, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1.2MU IM2 or - amoxicillin 1g 12 hourly for 10 days or - phenoxymethylpenicillin 500mg 12 hourly", "bbox": [140.3, 372.8, 313.6, 403.0], "key": "p53-dc30b027"}, {"id": "p53-out-e18", "page": 53, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "for 10 days. - If severe penicillin allergy (history of anaphylaxis,", "bbox": [140.3, 402.8, 323.7, 4 t symptoms and any of:<br/>• Unable to open mouth<br/>• Unable to swallow at all<br/>• Red swelling blocking airway (assess airway 16)<br/>• Sudden face/tongue swelling and any of: generalised itch/rash, wheeze,<br/>difficulty breathing, BP &lt; 90/60, dizziness/collapse, abdominal pain,<br/>vomiting or exposure to possible allergen¹ → check for anaphylaxis 28\"]\n    RB -- Yes --> URG[\"Refer urgently\"]\n    RB -- No --> ASSESS[\"Assess the patient with throat symptoms not needing urgent attention<br/>• Ask about swallowing problems (food/liquid stuck → refer)<br/>• Difficulty or pain on swallowing + white patches on cheeks/gums/tongue/palate<br/>→ oesophageal candida likely 52<br/>• Check for redness, grey membrane, bleeding and white patches\"]\n    ASSESS --> Q1[\"Is there sore throat and a thick grey layer (pseudomembrane)<br/>in throat/nose, with or without mild fever?\"]\n    Q1 -- Yes --> DIPH[\"Consider diphtheria\"]\n    Q1 -- No --> Q2[\"Are there swollen tonsils and any of: pus/white patches on tonsils<br/>or no cough or no runny nose?\"]\n    Q2 -- Yes --> BACT[\"Bacterial tonsillopharyngitis likely\"]\n    Q2 -- No --> VDESC[\"Red throat and/or swollen tonsils, tender neck lymph nodes,<br/>cough, runny nose\"]\n    VDESC --> VIRAL[\"Viral tonsillopharyngitis likely\"]\n    BACT --> SYMPT[\"Symptomatic care (paracetamol, salt-water gargle, soft food)\"]\n    VIRAL --> SYMPT\n```\n\n¹ Common allergens include medication, food or insect bite/sting within the past few hours.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Throat symptoms (trigger) | `(or Sore throat, Difficulty swallowing, Swallowing painful)` for the red box; `Sore throat` for the Assess box (which checks for difficulty / pain on swallowing) | due_to of `Check for urgent throat symptom conditions`; due_to of `Assess throat symptoms not needing urgent attention` |\n| Red box | `(and throat symptoms (or unable to open mouth, unable to swallow, (and pharyngeal swelling, upper respiratory tract obstruction), (and sudden face/tongue swelling (or …anaphylaxis features…))))` | `Urgent: throat symptoms with danger signs` |\n| Red box, anaphylaxis bullet (\"check for anaphylaxis 28\") | `possible` anaphylaxis: throat symptoms **and** sudden face/tongue swelling **and** any of the listed features; this hands over to page 28's check | `Diagnose possible anaphylaxis from throat symptoms with sudden face/tongue swelling` |\n| Assess, bullet 2 | `(and (or Difficulty swallowing, Swallowing painful) White patches on oral mucosa)` → probable Candidiasis of esophagus | `Diagnose probable oesophageal candida from painful or difficult swallowing` |\n| Q1 = Yes | `(and Sore throat (or pseudomembrane in pharynx, pseudomembrane in nose))`; mild fever is \"with or without\" so not required | `Diagnose possible diphtheria from throat/nose pseudomembrane` |\n| Q1 = No → Q2 = Yes | `(and Sore throat (no pseudomembrane pharynx) (no pseudomembrane nose) Swelling of tonsil (or Exudate on tonsils, (no Cough), (no Nasal discharge)))` | `Diagnose probable bacterial tonsillopharyngitis` |\n| Q1 = No → Q2 = No | `(and Sore throat (or Redness of throat, Swelling of tonsil) (no pseudomembranes) (or (no Swelling of tonsil) (and (no Exudate on tonsils) Cough Nasal discharge)))`. The descriptive box is used only for its first line as the positive anchor | `Diagnose probable viral tonsillopharyngitis` |\n| Consider diphtheria management, antibiotics, symptomatic care | Management, not modelled | – |\n\n## Notes\n\n- Q2 = No is the logical negation of Q2: no swollen tonsils, **or** swollen tonsils with no\n  pus/white patches **and** cough **and** runny nose.\n- Q1 = No is encoded as \"no pseudomembrane in throat or nose\" rather than the full negation\n  (which would also include \"no sore throat\"), because every patient on this flow already has a\n  throat symptom.\n- BP < 90/60 is read as systolic < 90 **or** diastolic < 60.\n- \"Within the past few hours\" (footnote 1) is not modelled as a time comparison: the page gives\n  no number.\n", "questions": "# Page 53 – Throat symptoms: remaining questions\n\n## Decisions made\n\n- **Trigger (reconciled).** \"Throat symptoms\" has no SNOMED concept. The red-box task\n  (`Check for urgent throat symptom conditions`), the Urgent rule and the possible-anaphylaxis\n  rule use `(or Sore throat, Difficulty swallowing, Swallowing painful)`, so a patient whose throat\n  symptom is a swallowing problem still gets the red-box check. The Assess task and the bacterial /\n  viral tonsillopharyngitis rules use `Sore throat`. This lets the Assess task check for\n  difficulty and pain on swallowing (\"Ask about swallowing problems\"), which constraint 3 would\n  forbid if they were in its own `due_to`. Side effect: a patient presenting only with a\n  swallowing problem is not walked through the Assess box (white patches, pseudomembrane, tonsils).\n- **Red box → `Urgent: throat symptoms with danger signs`.** \"Refer urgently\" means `Urgent`, not\n  Emergency. This page doesn't escalate further. A recorded `Upper respiratory tract obstruction`\n  also matches the existing Emergency warning sign `Respiratory obstruction` by descent.\n- **\"Red swelling blocking airway\"** is encoded as `(and Pharyngeal swelling, Upper respiratory\n  tract obstruction)`. \"Red\" isn't coded separately.\n- **The anaphylaxis bullet** is not treated as a pointer only, because it lists its own criteria.\n  It is encoded twice: as part of the Urgent rule, and as a `possible` anaphylaxis diagnosis\n  (throat symptom AND sudden face/tongue swelling AND any of the listed features), so that page\n  28's anaphylaxis check is triggered (\"check for anaphylaxis 28\").\n- **\"Generalised itch/rash\"** → `Generalized pruritus` or `Generalized rash`. **BP < 90/60** →\n  systolic < 90 or diastolic < 60.\n- **\"Exposure to possible allergen¹\"**: footnote 1 lists medication, food or insect bite/sting.\n  These are encoded as exposure to `Drug or medicament`, exposure to `Food`, `Insect bite - wound`\n  and `Insect sting`.\n- **Oesophageal candida likely** → probable `Candidiasis of esophagus` from (difficulty or pain on\n  swallowing) AND white patches on oral mucosa.\n- **Q1 = Yes** → possible `Diphtheria caused by Corynebacterium diphtheriae` from sore throat AND\n  a pseudomembrane in the pharynx or nose. Mild fever is \"with or without\", so it is not required.\n- **Q1 = No** is encoded as \"no pseudomembrane in throat and none in nose\". The full negation would\n  also allow \"no sore throat\". That was left out because every patient on this flow already has a\n  throat symptom.\n- **Q2 = Yes** → probable `Bacterial tonsillitis`: swollen tonsils AND (exudate on tonsils OR no\n  cough OR no runny nose), plus Q1 = No.\n- **Q2 = No** → probable `Viral tonsillitis`: (no swollen tonsils) OR (swollen tonsils without\n  exudate, with cough and runny nose), plus Q1 = No. A positive anchor (red throat or swollen\n  tonsils) comes from the descriptive box on that branch, so the rule doesn't fire on absences\n  alone.\n- **\"Tonsillopharyngitis\"** has no SNOMED concept. `Bacterial tonsillitis` (is-a Infective\n  pharyngitis) and `Viral tonsillitis` (is-a Viral pharyngitis) were used.\n- **\"Check for … bleeding\"** isn't in any `check_for`, because no decision on the page uses it\n  (Will's constraint 2).\n- **No `measure` task.** Pulse, BP and oxygen saturation for diphtheria are routine vitals and\n  part of management.\n\n## Could not model\n\n- \"Unable to swallow **at all**\": no qualifier for completeness; `Unable to swallow` is used.\n- \"**Thick grey** layer\": colour/thickness of the pseudomembrane is not encoded.\n\n- \"If food/liquid gets stuck with swallowing, refer\": this is a referral (management) with no\n  diagnosis, so it isn't encoded.\n- \"Within the past few hours\" (footnote 1): the page gives no number, so it has no time\n  comparison. Exposures recorded in the current encounter count as recent. This fires more\n  often than the page intends.\n- The supporting features of bacterial tonsillopharyngitis (rash, red spots, strawberry tongue)\n  are \"may also have\". They are not diagnostic criteria, so they aren't encoded.\n- \"Tender neck lymph nodes\" in the viral descriptive box isn't required, so the viral rule\n  fires more often than a reading that needs every listed feature.\n- Age split (≤ 21 / > 21 years), antibiotics, recurrent episodes (≥ 6 per year): these are\n  management.\n\n## SNOMED gaps\n\n- No \"Throat symptom\" finding. The substitute is the three-finding `or` above.\n- No \"tonsillopharyngitis\" concepts (bacterial or viral). The substitutes are Bacterial\n  tonsillitis and Viral tonsillitis.\n- No \"Diphtheria\" disorder by that exact name. The substitute is `Diphtheria caused by\n  Corynebacterium diphtheriae`.\n- No precoordinated \"pharyngeal/nasal pseudomembrane\". The substitute is `Pseudomembrane`\n  (morphologic abnormality) with finding site `Pharyngeal structure` / `Nasal structure`, both\n  verified.\n- No \"Allergen\" substance. The substitute is the footnote's allergen classes.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR`:\n  `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pseudomembrane\" \"morphologic abnormality\") (snomed_concept \"No\" \"qualifier value\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Pharyngeal structure\" \"body structure\"))))`\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR`:\n  `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pseudomembrane\" \"morphologic abnormality\") (snomed_concept \"No\" \"qualifier value\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Nasal structure\" \"body structure\"))))`\n\n  Reason (both): the gate's `NO_RE` expects the `No` qualifier last. When the finding has a\n  finding site, the canonical form puts `No` before the attribute, so `(no X)` isn't mapped back\n  to X. Both pseudomembranes are checked for in `Assess throat symptoms not needing urgent\n  attention`. This is a tool problem, not a missing check.\n\n## Questions for a clinician\n\n- Viral rule: is \"no swollen tonsils and red throat\" the right reading of the No branch, or should\n  any sore throat without the bacterial features count as viral?\n- Bacterial/viral rules need an explicit \"No\" for pseudomembrane at both pharynx and nose. Is that\n  workable at the point of care, or should a single pseudomembrane finding be used?\n- Is \"Food\" (in general) the intended allergen exposure, or the anaphylaxis page's list of specific foods?\n\n- Should \"throat symptoms\" include anything beyond sore throat and difficult or painful\n  swallowing (e.g. hoarseness, throat irritation)? And should a patient presenting only with\n  difficult or painful swallowing go through the Assess box and flowchart (the final build sends\n  them through the red-box check only)?\n- Is \"Red swelling blocking airway\" better recorded as airway obstruction alone? If so, the\n  `and` with pharyngeal swelling makes the rule fire less often.\n- On the viral branch, is the descriptive box (\"Red throat and/or swollen tonsils, tender neck\n  lymph nodes, cough, runny nose\") a requirement or only a description? We required only red\n  throat or swollen tonsils.\n- Does the \"Check for … white patches\" step refer to tonsillar exudate (as encoded) or to oral\n  white patches (candida)?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent throat sympto ith painful swallowing, swollen tonsils and exudate gets no diagnosis. Low, because such a patient almost always also has sore throat, and the diphtheria node does say 'sore throat' explicitly.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 53, "slug": "53-throat-symptoms", "kind": "rule", "priority": "medium", "ref": "Assess throat symptoms not needing urgent attention", "text": "Two page items are not checked for: 'bleeding' from the examination list and 'tender neck lymph nodes' from the viral picture. Neither drives a decision on the page, and the house test rejects unused check_for items, so omitting them is defensible; recording them would require a consuming rule (e.g. Cervical lymphadenopathy as an additional alternative in the viral rule's first (or ...)).", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 53, "slug": "53-throat-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable bacterial tonsillopharyngitis", "text": "'No cough' and 'no runny nose' are modelled as absence of a recorded finding. Because Cough and Nasal discharge are common symptoms recorded at intake, this is the intended house pattern, but it means a patient whose cough was simply not asked about satisfies the bacterial criterion. Inherent to the language; noted, not a defect of this file.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 53, "slug": "53-throat-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for urgent throat symptom conditions", "text": "Rules use systolic < 90 and diastolic < 60 but check_for has no blood pressure items.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 53, "slug": "53-throat-symptoms", "kind": "rule", "priority": "medium", "ref": "Assess throat symptoms not needing urgent attention", "text": "check_for lacks bleeding (page: check for redness, grey membrane, bleeding, white patches) and tender neck lymph nodes.", "detail": [{"checker": "fo <main>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,

  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
