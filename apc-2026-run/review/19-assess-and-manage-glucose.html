eferral centre before giving short-acting insulin 0.1units/kg IM10. Insulin may cause low potassium and heart dysrhythmia; avoid if unable to monitor serum electrolytes.", "bbox": [701.0, 371.5, 798.0, 472.3], "key": "p19-9bcc6abd"}, {"id": "p19-out-e01", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "ASSESS AND MANAGE GLUCOSE", "bbox": [289.9, 48.7, 552.0, 71.0], "key": "p19-2c5cf14a"}, {"id": "p19-out-e02", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Three teaspoons sugar (15g) in 1 cup (200mL) water. 2If dextrose 10% unavailable: mix 1 part dextrose 50% to 4 parts water for injection to make dextrose 10% solution. 3If dextrose 5% not available: add 10mL dextrose 50% to each 100mL of sodium chloride 0.9%. 4 BMI = weight (kg) ÷ height (m) ÷ height (m). 5Polycystic ovarian syndrome to change to polyendocrine metabolic ovarian syndrome. 6Cardiovascular disease (CVD) includes ischaemic heart disease, peripheral vascular disease and stroke/ TIA. 7 Thirst, dry mouth, poor skin turgor, BP < 90/60, pulse ≥ 100. 8Unexplained weight loss, tiredness, thirst (especially at night), passing excessive amounts of urine often, periodic changes in vision, frequent infections (e.g. urinary, skin). 9If shock/SBP <80, also give 20mL/kg bolus and repeat until SBP > 80. Avoid giving > 50mL/kg in the first 4 hours. 10Avoid using insulin needle, use 22-25 gauge needle.", "bbox": [34.1, 519.3, 804.0, 551.8], "key": "p19-9997268e"}, {"id": "p19-out-e03", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Interpret and manage random fingerprick glucose:", "bbox": [328.2, 89.5, 513.8, 99.7], "key": "p19-5b3c7b33"}, {"id": "p19-out-e04", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Glucose < 3 (< 4 if diabetes) Patient has hypoglycaemia.", "bbox": [87.4, 112.1, 191.9, 132.3], "key": "p19-77ae0499"}, {"id": "p19-out-e05", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Glucose 3-6 (4-6 if known diabetes) • If known diabetes, give routine care 145. • If not known diabetes:", "bbox": [258.2, 112.1, 415.0, 142.3], "key": "p19-c635c5cf"}, {"id": "p19-out-e06", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Does patient have risk factors: BMI4 ≥ 25/ waist circumference ≥ 94cm (man) or ≥ 80cm", "bbox": [260.0, 154.7, 421.6, 175.0], "key": "p19-64139e5d"}, {"id": "p19-out-e07", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "(woman) and ≥ 1 of: • Physical inactivity • Hypertension • Parent or sibling with diabetes • polycystic ovarian syndrome5 • Indian ethnicity • Cardiovascular disease6 • Diabetes during pregnancy • Previously had a big baby > 4000g • Previous impaired fasting glucose", "bbox": [258.0, 174.8, 384.0, 275.0], "key": "p19-59904313"}, {"id": "p19-out-e08", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes No", "bbox": [271.8, 287.4, 372.5, 297.6], "key": "p19-450c1e61"}, {"id": "p19-out-e09", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Recheck glucose 3 yearly once over 45 years. • Assess for risk factors at each clinic visit.", "bbox": [258.0, 310.0, 296.1, 430.2], "key": "p19-7d37734a"}, {"id": "p19-out-e10", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No: check urine for ketones Yes", "bbox": [577.9, 213.9, 789.7, 224.1], "key": "p19-fcf9e32e"}, {"id": "p19-out-e11", "page": 19, "box": 0, "kind_hint": "outside", "section": null, "section_y es when fingerprick glucose is low or high\"\n  adult\n  (or (< (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 4)\n      (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1))\n  (check_for\n    (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n  )\n)\n(task\n  \"Check for urgent signs when fingerprick glucose is 11.1 or more\"\n  adult\n  (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1)\n  (check_for\n    ;; Red box 2. Temperature >= 38 is a routine vital and is not listed here.\n    (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Drowsy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Kussmaul's respiration\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n    (clinical_finding (snomed_concept \"Abdominal pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Dehydration\" \"disorder\"))\n  )\n)\n(task\n  \"Check urine for ketones when fingerprick glucose is 11.1 or more\"\n  adult\n  (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1)\n  (check_for\n    (clinical_finding (snomed_concept \"Ketonuria\" \"finding\"))\n  )\n)\n(task\n  \"Check for symptoms of diabetes when glucose is 11.1 or more without ketones\"\n  adult\n  ;; No ketones and not known diabetes -> \"does patient have symptoms of diabetes?\" (footnote 8)\n  (and (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1)\n       (no (clinical_finding (snomed_concept \"Ketonuria\" \"finding\")))\n       (no (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))))\n  (check_for\n    (clinical_finding (snomed_concept \"Unexplained weight loss\" \"finding\"))\n    (clinical_finding (snomed_concept \"Fatigue\" \"finding\"))\n    (clinical_finding (snomed_concept \"Excessive thirst\" \"finding\"))\n    (clinical_finding (snomed_concept \"Polyuria\" \"finding\"))\n    (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Recurrent infectious disease\" \"disorder\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable hypoglycaemia from fingerprick glucose\"\n  (diagnosis\n    (snomed_concept \"Hypoglycemia\" \"disorder\")\n    probable\n  )\n  adult\n  ;; \"Glucose < 3 (< 4 if diabetes) Patient has hypoglycaemia.\"\n  (or (< (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 3)\n      (and (< (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 4)\n           (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable diabetes from random glucose 11.1 or more with symptoms\"\n  (diagnosis\n    (snomed_concept \"Diabetes mellitus\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Glucose >= 11.1 -> no ketones -> not known diabetes -> symptoms of diabetes = Yes -> \"Diagnose diabetes\".\n  ;; The fasting-glucose routes to \"Diagnose diabetes\" cannot be modelled (no fasting glucose observable).\n  (and (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1)\n       (no (clinical_finding (snomed_concept \"Ketonuria\" \"finding\")))\n       (no (clinical_finding (snomed_concept \"Diabetes mellitus\" \"dis > B3[\"RED BOX 3: sodium chloride 0.9% IV, refer urgently,<br/>insulin only after discussion if referral delay &gt; 2 h\"]\n    B2 -- \"No: check urine for ketones\" --> K{\"Ketones?\"}\n    K -- present --> B3\n    K -- \"No ketones\" --> KD{\"Known diabetes?\"}\n    KD -- Yes --> RC3[\"Routine care → 145\"]\n    KD -- No --> SYM{\"Symptoms⁸ of diabetes?\"}\n    SYM -- Yes --> DX[\"Diagnose diabetes<br/>&lt; 35 y: type 1 diabetes likely, refer<br/>≥ 35 y: routine diabetes care → 145\"]\n    SYM -- No --> FBG\n\n    FBG --> F1[\"&lt; 6.1: repeat fasting fingerprick glucose after 3 years (yearly if multiple risk factors) → assess CVD risk 142\"]\n    FBG --> F2[\"6.1-6.9: impaired fasting glucose; repeat FBG after 1 week<br/>&lt; 7: repeat after 1 year / assess CVD risk; ≥ 7 → Diagnose diabetes\"]\n    FBG --> F3[\"≥ 7: symptoms of diabetes?\"]\n    F3 -- Yes --> DX\n    F3 -- No --> F4[\"Repeat FBG 1 week later<br/>≥ 7 → Diagnose diabetes; &lt; 7 → repeat after 1 year\"]\n```\n\n⁸ Unexplained weight loss, tiredness, thirst (especially at night), passing excessive amounts of\nurine often, periodic changes in vision, frequent infections (e.g. urinary, skin). The ≥ 7 node\non the page says \"symptoms⁷\", which points at the dehydration footnote; read here as a misprint for ⁸.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Glucose < 3 (< 4 if diabetes): patient has hypoglycaemia | Random glucose < 3 mmol/L, **or** < 4 mmol/L with known diabetes | `Diagnose probable hypoglycaemia from fingerprick glucose` |\n| Known diabetes (needed for the < 4 and ≥ 11.1 branches) | `check_for` Diabetes mellitus (Known present) when glucose < 4 or ≥ 11.1 | `Check for known diabetes when fingerprick glucose is low or high` |\n| Red box 1: Give urgent attention | `(active_condition Hypoglycemia)` → Urgent | `Urgent: hypoglycaemia on fingerprick glucose` |\n| Is patient alert? Yes/No and everything below it in box 1 | Management branching only (oral vs IV glucose, recheck, refer); not modelled | — |\n| Glucose ≥ 11.1 → red box 2 items | `check_for` of the box-2 findings (temperature is a routine vital) | `Check for urgent signs when fingerprick glucose is 11.1 or more` |\n| Red box 2 = Yes → red box 3 (refer urgently) | Glucose ≥ 11.1 **and** any box-2 item → Urgent | `Urgent: glucose 11.1 or more with danger signs` |\n| No → check urine for ketones | `check_for` Ketonuria when glucose ≥ 11.1 | `Check urine for ketones when fingerprick glucose is 11.1 or more` |\n| Ketones present → red box 3 (refer urgently) | Glucose ≥ 11.1 **and** Ketonuria → Urgent | `Urgent: glucose 11.1 or more with urine ketones` |\n| No ketones, not known diabetes → symptoms⁸ of diabetes? | `check_for` the six footnote-8 symptoms, due to glucose ≥ 11.1 with no ketonuria and no known diabetes | `Check for symptoms of diabetes when glucose is 11.1 or more without ketones` |\n| Symptoms = Yes → Diagnose diabetes | Glucose ≥ 11.1, no ketonuria, no known diabetes, any symptom⁸ → probable Diabetes mellitus | `Diagnose probable diabetes from random glucose 11.1 or more with symptoms` |\n| < 35 years: type 1 diabetes likely | Not modelled: the language has no age-in-years comparison | — |\n| Glucose 3-6 / 6.1-11, risk-factor screen, fasting glucose branches, impaired fasting glucose | Not modelled: SNOMED has no fasting-glucose observable entity, so a fasting result cannot be told apart from a random one; the screen only leads to that measurement | — (see remaining questions) |\n\n## Notes\n\n- \"(< 4 if diabetes)\" in the hypoglycaemia header and \"(< 4)\" / \"(≥ 4)\" in box 1 are read as the\n  threshold for patients with known diabetes.\n- Box 3 has no diagnosis named on the page (it does not say DKA or HHS), so no diagnosis rule is\n  written for it; its \"Refer urgently\" is the basis for the two Urgent evaluations.\n", "questions": "# Page 19 – Assess and manage glucose: remaining questions\n\n## Decisions made\n\n- **Trigger is the routine glucose vital.** Every rule hangs off the random fingerprick glucose,\n  `(measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L)`, which the app\n  records as a vital. No `measure` task is needed for it.\n- **Hypoglycaemia** (\"Glucose < 3 (< 4 if diabetes) Patient has hypoglycaemia\") is a `probable`\n  diagnosis: glucose < 3, or glucose < 4 with known diabetes (Diabetes mellitus + Known present).\n  The page states it outright; `probable` was chosen so the red-box-1 Urgent rule can use\n  `(active_condition Hypoglycemia)`.\n- **Red box 1 (\"Give urgent attention\")** → `Urgent: hypoglycaemia on fingerprick glucose`. The page\n  does not escalate further for the non-alert patient, so no Very urgent/Emergency level is used.\n  \"Is patient alert?\" and everything under it is treatment routing (oral vs IV glucose, thiamine,\n  15-minute recheck, refer) and is accounted for as management/flowchart routing.\n- **Red box 2** → `check_for` of its items when glucose ≥ 11.1, and `Urgent: glucose 11.1 or more\n  with danger signs` (glucose ≥ 11.1 and any item). Temperature ≥ 38 °C is a routine vital.\n  \"Nausea or vomiting\" is split into Nausea and Finding of vomiting. \"Dehydration⁷\" is the concept\n  Dehydration; its footnote signs are not turned into separate criteria.\n- **Ketones present** leads to red box 3 (\"Refer urgently\") → `Urgent: glucose 11.1 or more with\n  urine ketones`. Urine ketones are recorded as the finding Ketonuria; \"No ketones\" is `(no Ketonuria)`.\n- **Diagnose diabetes** is encoded only for the random-glucose route: glucose ≥ 11.1, no ketonuria,\n  not known diabetes, and any footnote-8 symptom → `probable` Diabetes mellitus. The \"No\" answer to\n  red box 2 that precedes the ketone check is not required by the rule, so it can also fire when\n  urgent signs are present (fires more often than the page path; that patient is Urgent anyway).\n- The \"≥ 7 Does have symptoms⁷ of diabetes?\" node cites footnote 7 (dehydration signs); read as a\n  misprint for footnote 8. It only matters for the fasting branch, which is not modelled.\n- **Reconciled build (builder B's encoding).** Builder A's alternatives were weighed: A used Acute\n  confusion and Signs of dehydration; this build keeps Clouded consciousness (SNOMED's concept for\n  \"Confusion\", broader) and Dehydration (the page's word). A's Urgent hypoglycaemia rule repeated the\n  glucose thresholds; this build uses `(active_condition Hypoglycemia)` as Will's briefing asks.\n- No shock threshold is encoded: \"shock/SBP < 80\" appears only in footnote 9 as a fluid-dosing\n  instruction (management).\n\n## Could not model\n\n- **Fasting blood glucose branches** (check FBG after an 8-hour fast / 2-h OGTT; < 6.1, 6.1-6.9\n  \"impaired fasting glucose\", ≥ 7; repeat after 1 week / 1 year / 3 years; Diagnose diabetes via\n  two fasting values ≥ 7 or one with symptoms). SNOMED has no fasting-glucose *observable entity*\n  (only procedures such as \"Fasting blood glucose measurement\"), and `measurement` takes no\n  qualifier, so a fasting value cannot be told from a random one. No proxy used. Effect: diabetes\n  and impaired fasting glycaemia are diagnosed less often than the page intends.\n- **Risk-factor screen** for glucose 3-6 (BMI ≥ 25 / waist ≥ 94 cm man, ≥ 80 cm woman, and ≥ 1\n  risk factor): it leads only to the fasting-glucose check above and to rechecking schedules, so it\n  is not encoded. Sex-specific waist thresholds would also need a sex criterion.\n- **\"If < 35 years, type 1 diabetes likely\"**: the language has no age-in-years comparison (only\n  age groups), so no `probable` type 1 diabetes rule. Fires less often than the page (never).\n- **15-minute recheck thresholds in box 1** (< 3 (< 4) / ≥ 3 (≥ 4)): a repeat glucose after\n  treatment cannot be distinguished from the first reading; these only route treatment.\n- \"Thirst (especially at night)\" and \"periodic changes in vision\": the qualifiers \"at night\" and\n  \"periodic\" are not expressed.\n\n## SNOMED gaps\n\n- Fasting blood glucose (observable entity): none exists. Not encoded.\n- \"Confusion\" (finding): not an FSN; used Clouded consciousness (its SNOMED synonym is Confusion).\n- \"Thirst\" (finding): not an FSN; used Excessive thirst.\n- \"Tiredness\" (finding): not an FSN; used Fatigue.\n- \"Weight loss\" (finding): not an FSN; used Unexplained weight loss (matches the page wording).\n- \"Rapid deep breathing\": used Kussmaul's respiration.\n- \"Frequent infections\": used Recurrent infectious disease (disorder).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should a hypoglycaemic patient who is **not alert** be escalated above Urgent (e.g. Emergency /\n  Very urgent), or is the page's \"Give urgent attention\" enough?\n- Is it right that the system diagnoses diabetes from one random glucose ≥ 11.1 plus a single\n  symptom (e.g. fatigue alone), as the page's flow implies?\n- Should the hyperglycaemia + urgent signs / ketones patient (red box 3) carry a named diagnosis\n  (diabetic ketoacidosis or hyperosmolar state)? The page names none, so none was encoded.\n- Should glucose < 3 mmol/L be `Emergency` (as VHA's \"Glucose less than 3mmol/L\" warning sign has\n  it) rather than the page's \"urgent attention\"?\n- `(active_condition Hypoglycemia)` in the Urgent rule could also match a recorded past\n  hypoglycaemia. Should the Urgent rule instead use today's glucose reading directly?\n- Dehydration in red box 2 is defined by footnote 7 (thirst, dry mouth, poor skin turgor,\n  BP < 90/60, pulse ≥ 100). Should any one of those signs make a hyperglycaemic patient urgent, and\n  is Dehydration (disorder) or Signs of dehydration (finding) the right recorded form?\n- Should a diabetes diagnosis from glucose ≥ 11.1 require every red box 2 item to be recorded as\n  absent, or is \"No ketones\" enough?\n- Is Kussmaul's respiration the right recorded form for \"rapid deep breathing\", and Clouded\n  consciousness for \"confusion\"?\n", "claims": [{"claim_id": "c001", "rule": "Check for known diabetes when fingerprick glucose is low or high", "role": "trigger", "expr": "(< (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 4)", "element_keys": ["p19-77ae0499"], "quote": "< 4 if diabetes"}, {"claim_id": "c002", "rule": "Check for known diabetes when fingerprick glucose is low or high", "role": "trigger", "expr": "(>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1)", "element_keys": ["p19-e28afbd6"], "quote": "Glucose ≥ 11.1"}, {"claim_id": "c003", "rule": "Check for known diabetes when fingerprick glucose is low or high", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))", "element_keys": ["p19-77ae0499"], "quote": "< 4 if diabetes"}, {"claim_id": "c004", "rule": "Check for urgent signs when fingerprick glucose is 11.1 or more", "role": "trigger", "expr": "(>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1)", "element_keys": ["p19-e28afbd6", "p19-03968614"], "quote": "Glucose ≥ 11.1 Check if patient needs urgent attention"}, {"claim_id": "c005", "rule": "Check for urgent signs when fingerprick glucose is 11.1 or more", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased level of consciousness\" \"finding\"))", "element_keys": ["p19-036f41a9"], "quote": "Decreased consciousness"}, {"claim_id": "c006", "rule": "Check for urgent signs when fingerprick glucose is 11.1 or more", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Drowsy\" \"finding\"))", "element_keys": ["p19-26afd857"], "quote": "Drowsiness"}, {"claim_id": "c007", "rule": "Check for urgent signs w ement_key": "p19-64139e5d", "scope": "borderline", "scope_reason": "Risk-factor screen for the 3-6 / not-known-diabetes arm: 'BMI >= 25 / waist circumference >= 94cm (man) or >= 80cm (woman)'. Its outcome is a decision to test (fasting glucose) rather than a diagnosis or priority, which is why it is borderline; but it is a criterion with thresholds that the house standard could encode as the trigger of a measure task. BMI has no unit in the language (not_representable); waist circumference is representable in cm but needs sex, which the language does not express.", "verdict": "missing", "parts_missing": ["BMI >= 25 (not representable: no kg/m2 unit)", "waist circumference >= 94 cm (man) / >= 80 cm (woman) (cm is a unit, but no sex criterion in the language)"], "problem": "Nothing in the file touches the risk-factor screen. Given that both halves are at best partly representable and the only downstream action is a fasting-glucose test that itself cannot be expressed (no fasting-glucose observable entity), the omission is defensible, but it should be recorded as 'could not model'.", "evidence": [], "confidence": "medium"}, {"element_key": "p19-59904313", "scope": "borderline", "scope_reason": "The 'and >= 1 of' risk-factor list (physical inactivity, hypertension, family history of diabetes, PCOS, Indian ethnicity, CVD, gestational diabetes, big baby > 4000g, previous IFG). Same status as p19-64139e5d: a screening criterion whose only output is a test.", "verdict": "missing", "parts_missing": ["all nine risk factors"], "problem": "Not encoded. Several items are representable as findings/situations, but the compound criterion is useless without the BMI/waist half and the fasting-glucose measure task it gates. Defensible omission; should be documented.", "evidence": [], "confidence": "medium"}, {"element_key": "p19-fcf9e32e", "scope": "in_scope", "scope_reason": "Flowchart decision in the >= 11.1 branch: 'No (urgent signs): check urine for ketones'. A check_for task.", "verdict": "correct", "parts_missing": [], "problem": "Ketonuria is checked for on glucose >= 11.1. The page asks for the urine test only in the 'No urgent signs' arm; the rule asks for it on every >= 11.1 reading. That is a harmless widening (patients with urgent signs go to the same box anyway), noted under rule-level problems.", "evidence": ["Check urine for ketones when fingerprick glucose is 11.1 or more :: (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1) (check_for (clinical_finding (snomed_concept \"Ketonuria\" \"finding\")))"], "confidence": "high"}, {"element_key": "p19-e059b1ef", "scope": "in_scope", "scope_reason": "'No ketones: if known diabetes routine care; if not known diabetes, does patient have symptoms of diabetes?' Two parts: the known-diabetes gate, and the symptom check (footnote 8).", "verdict": "correct", "parts_missing": [], "problem": "Trigger matches the page exactly: glucose >= 11.1, no ketonuria, no known diabetes. Footnote 8's six symptoms are each mapped to a sensible concept: unexplained weight loss -> Unexplained weight loss; tiredness -> Fatigue; thirst -> Excessive thirst; passing excessive urine -> Polyuria; periodic changes in vision -> Visual disturbance; frequent infections -> Recurrent infectious disease.", "evidence": ["Check for symptoms of diabetes when glucose is 11.1 or more without ketones :: (and (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1) (no (clinical_finding (snomed_concept \"Ketonuria\" \"finding\"))) (no (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))))"], "confidence": "high"}, {"element_key": "p19-f6759649", "scope": "in_scope", "scope_reason": "'Ketones present' (fragment, continued in p19-9618a9ba): this arm goes to the red box ending in 'Refer urgently', so it is an Urgent trigger.", "verdict": "correct", "parts_missing": [], "problem": "", "evidence": ["Urgent: glucose 11.1 or more with urine ketones :: (and (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1) (clinical_finding (snomed_concept \"Ketonuria\" \"finding\")))"], "confidence": "high"}, {"element_key": "p19-0e0f6a62", "scope": "out_of_scope", "scope_reason": "not_representable", "verdict": "", "parts_missing": [], "problem": "'Check fasting blood glucose after an 8-hour overnight fast (or 2-hour OGTT plasma glucose)'. A measure task would need a fasting-glucose observable entity; the release has only procedures ('Fasting blood glucose measurement', 'Glucose measurement, fasting'), and a measurement must be an observable entity with a unit. Using 'Blood glucose status' would conflate fasting with random readings and corrupt the >= 11.1 / < 4 rules. Should be listed under 'could not model'.", "evidence": [], "confidence": "medium"}, {"element_key": "p19-2d891b6d", "scope": "out_of_scope", "scope_reason": "not_representable", "verdict": "", "parts_missing": [], "problem": "'Fasting 6.1-6.9: patient has impaired fasting glucose' is a diagnostic conclusion ('Impaired fasting glycemia' disorder 390951007 exists), but it depends on a fasting reading that cannot be distinguished from a random one (see p19-0e0f6a62). Not encodable without a fasting-glucose observable.", "evidence": [], "confidence": "medium"}, {"element_key": "p19-cca94446", "scope": "out_of_scope", "scope_reason": "not_representable", "verdict": "", "parts_missing": [], "problem": "'Fasting >= 7: does patient have symptoms of diabetes?' (then one or two repeat readings a week apart before 'Diagnose diabetes'). Needs a fasting-glucose observable and a 'repeat reading one week later' sequence; neither exists in the language.", "evidence": [], "confidence": "medium"}, {"element_key": "p19-560cbf1b", "scope": "in_scope", "scope_reason": "'Diagnose diabetes. If < 35 years, type 1 diabetes likely. Refer. If >= 35 years, routine care.' This is the page's diagnostic conclusion, reached from (a) random >= 11.1 + no ketones + not known diabetes + symptoms, and (b) the fasting-glucose pathway. 'Type 1 diabetes likely' is an 'X likely'.", "verdict": "partial", "parts_missing": ["type 1 diabetes likely when < 35 years (not representable: the grammar has only adult / older child / younger child, no numeric age comparison)", "diagnosis of diabetes via the fasting-glucose pathway (not representable, see p19-0e0f6a62)"], "problem": "The reachable path (random >= 11.1 with symptoms, no ketones, not known diabetes) is encoded correctly as probable Diabetes mellitus. The two missing parts are both language limits rather than builder omissions, but neither is visible in the rules, so a reviewer cannot tell they were considered.", "evidence": ["Diagnose probable diabetes from random glucose 11.1 or more with symptoms :: (and (>= (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 11.1) (no (clinical_finding (snomed_concept \"Ketonuria\" \"finding\"))) (no (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))) (or (clinical_finding (snomed_concept \"Unexplained weight loss\" \"finding\")) (clinical_finding (snomed_concept \"Fatigue\" \"finding\")) (clinical_finding (snomed_concept \"Excessive thirst\" \"finding\")) (clinical_finding (snomed_concept \"Polyuria\" \"finding\")) (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\")) (clinical_finding (snomed_concept \"Recurrent infectious disease\" \"disorder\"))))"], "confidence": "medium"}, {"element_key": "p19-9997268e", "scope": "in_scope", "scope_reason": "Footnotes. Footnotes 7 (definition of dehydration) and 8 (symptoms of diabetes) carry criteria used by the red box and by the symptom check; the rest are dosing/preparation notes.", "verdict": "partial", "parts_missing": ["footnote 7: BP < 90/60, pulse >= 100, thirst, dry mouth, poor skin turgor are not expanded (see p19-d56f473b)"], "problem": "Footnote 8 is fully and sensibly encoded in the symptoms task and the probable-diabetes rule. Footnote 7 is collapsed into the single concept 'Dehydration'.", "evidence": ["Check for symptoms of diabetes when glucose is 11.1 or more without ketones :: (check_for (clinical_finding (snomed_concept \"Unexplained weight loss\" \"finding\")) (clinical_finding (snomed_concept \"Fatigue\" \"finding\")) (clinical_finding (snomed_concept \"Excessive thirst\" \"finding\")) (clinical_finding (snomed_concept \"Polyuria\" \"finding\")) (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\")) (clinical_finding (snomed_concept \"Recurrent infectious disease\" \"disorder\")))", "Urgent: glucose 11.1 or more with danger signs :: (clinical_finding (snomed_concept \"Dehydration\" \"disorder\"))"], "confidence": "medium"}], "outside_not_logic": ["p19-2c5cf14a", "p19-5b3c7b33", "p19-3ff3dad8", "p19-6dcdc5bd", "p19-9618a9ba", "p19-450c1e61", "p19-6ae0e175", "p19-7d37734a", "p19-e608dfaf", "p19-e39b50df", "p19-c98b7700", "p19-d96c4962", "p19-b14100b3", "p19-966fa864", "p19-d328d053", "p19-96e3c31e", "p19-f0c8daab"], "rule_level_problems": [{"rule": "Urgent: glucose 11.1 or more with danger signs / Check for urgent signs when fingerprick glucose is 11.1 or more", "problem": "Footnote 7 defines 'Dehydration' as thirst, dry mouth, poor skin turgor, BP < 90/60, pulse >= 100. Only the bare disorder concept is used. The two vital-sign components are routine measurements the system already holds (Systolic/Diastolic blood pressure, Heart rate; all exist as observable entities) and the three findings have concepts (Excessive thirst, Xerostomia, Decreased skin turgor). The gold standard expands such footnote definitions (page 20 writes BP < 90/60 as two measurements). Suggested: add an (or (clinical_finding Dehydration) (< SBP 90) (< DBP 60) (>= Heart rate 100) ...) group to the priority rule and the findings to the check_for.", "severity": "medium"}, {"rule": "Check urine for ketones when fingerprick glucose is 11.1 or more", "problem": "The page asks for urine ketones only in the 'No urgent signs' arm; the task fires on every reading >= 11.1. Clinically harmless (both arms reach the same red box) and it keeps the ketone priority rule simple, but it is a deliberate departure from the flowchart that should be stated.", "severity": "low"}, {"rule": "Diagnose probable diabetes from random glucose 11.1 or more with symptoms", "problem": "The page's 'Diagnose diabetes' box adds 'If < 35 years, type 1 diabetes likely. Refer.' The grammar has no numeric age comparison (only adult / older child / younger child), so a probable 'Diabetes mellitus type 1' rule cannot be written. The whole fasting-glucose pathway (6.1-11 branch, risk-factor screen, 6.1-6.9 = impaired fasting glucose, >= 7 twice = diabetes) is likewise unrepresentable because the release has no fasting-glucose observable entity. None of this is a builder error, but the file gives no sign these were weighed; they belong in a 'could not model' note so the omission is not mistaken for a miss.", "severity": "low"}, {"rule": "Check for symptoms of diabetes when glucose is 11.1 or more without ketones", "problem": "The due_to uses (no Ketonuria) and (no known Diabetes mellitus). Both are answered by tasks that fire on the same >= 11.1 trigger, so the gate works; but if 'no' means 'recorded as absent' rather than 'not recorded', a patient whose ketone result is never entered is never asked about symptoms and the probable-diabetes rule can never fire for them. The ordering is correct per the page; flagging only so the semantics of 'no' are confirmed.", "severity": "low"}], "summary": "The red-box logic of both triage boxes is encoded correctly: hypoglycaemia (< 3, or < 4 with known diabetes) as a probable diagnosis driving an Urgent priority, and glucose >= 11.1 with any of the ten listed danger signs, or with urine ketones, as ote 7 defines 'Dehydration' as thirst, dry mouth, poor skin turgor, BP < 90/60, pulse >= 100. Only the bare disorder concept is used. The two vital-sign components are routine measurements the system already holds (Systolic/Diastolic blood pressure, Heart rate; all exist as observable entities) and the three findings have concepts (Excessive thirst, Xerostomia, Decreased skin turgor). The gold standard expands such footnote definitions (page 20 writes BP < 90/60 as two measurements). Suggested: add an (or (clinical_finding Dehydration) (< SBP 90) (< DBP 60) (>= Heart rate 100) ...) group to the priority rule and the findings to the check_for.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 19, "slug": "19-assess-and-manage-glucose", "kind": "rule", "priority": "medium", "ref": "Check urine for ketones when fingerprick glucose is 11.1 or more", "text": "The page asks for urine ketones only in the 'No urgent signs' arm; the task fires on every reading >= 11.1. Clinically harmless (both arms reach the same red box) and it keeps the ketone priority rule simple, but it is a deliberate departure from the flowchart that should be stated.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 19, "slug": "19-assess-and-manage-glucose", "kind": "rule", "priority": "medium", "ref": "Diagnose probable diabetes from random glucose 11.1 or more with symptoms", "text": "The page's 'Diagnose diabetes' box adds 'If < 35 years, type 1 diabetes likely. Refer.' The grammar has no numeric age comparison (only adult / older child / younger child), so a probable 'Diabetes mellitus type 1' rule cannot be written. The whole fasting-glucose pathway (6.1-11 branch, risk-factor screen, 6.1-6.9 = impaired fasting glucose, >= 7 twice = diabetes) is likewise unrepresentable because the release has no fasting-glucose observable entity. None of this is a builder error, but the file gives no sign these were weighed; they belong in a 'could not model' note so the omission is not mistaken for a miss.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 19, "slug": "19-assess-and-manage-glucose", "kind": "rule", "priority": "medium", "ref": "Check for symptoms of diabetes when glucose is 11.1 or more without ketones", "text": "The due_to uses (no Ketonuria) and (no known Diabetes mellitus). Both are answered by tasks that fire on the same >= 11.1 trigger, so the gate works; but if 'no' means 'recorded as absent' rather than 'not recorded', a patient whose ketone result is never entered is never asked about symptoms and the probable-diabetes rule can never fire for them. The ordering is correct per the page; flagging only so the semantics of 'no' are confirmed.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 19, "slug": "19-assess-and-manage-glucose", "kind": "rule", "priority": "high", "ref": "Absent rules for 3-6 / 6.1-11 / fasting pathway", "text": "The whole non-urgent diagnostic arm (risk factors, fasting glucose, impaired fasting glucose, diabetes on fasting >=7 twice, type 1 likely if <35) is missing; only the >=11.1 arm and hypoglycaemia are encoded.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 19, "slug": "19-assess-and-manage-glucose", "kind": "rule", "priority": "medium", "ref": "Check for known diabetes when fingerprick glucose is low or high", "text": "Triggers only at <4 or >=11.1; page asks known diabetes for 3-6 (4-6) and 6.1-11 too.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 19, "slug": "19-assess-and-manage-glucose", "kind": "rule", "priority": "medium", "ref": "Diagnose probable diabetes from random glucose 11.1 or more with symptoms", "text": "Page gives 'Diagnose diabetes' (and type 1 likely if <35); encoded as probable only, no age split.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 19, "slug": "19-assess-and-manage-glucose", "kind": "rule", "priority": "medium", "ref": "Urgent: glucose 1 <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};

const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
