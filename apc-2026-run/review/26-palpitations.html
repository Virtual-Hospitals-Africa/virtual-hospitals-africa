ction": null, "section_y": -1, "indent": 0, "parent": null, "text": "Palpitations refer to patient's unpleasant awareness of his/her own fast or irregular heartbeat. Patient may describe 'heart racing’ or 'pounding’ or 'fluttering in the chest’.", "bbox": [114.1, 89.5, 729.8, 99.7], "key": "p26-3c301571"}, {"id": "p26-out-e02", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Review in 2 days. If palpitations persist, refer for further assessment.", "bbox": [285.0, 513.4, 557.1, 524.6], "key": "p26-bf4aaad8"}, {"id": "p26-out-e03", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Consult the South African Medicines Formulary (SAMF) or MIC helpline. 2Medications that prolong QT interval: macrolides (azithromycin), fluoroquinolones (moxifloxacin), bedaquiline, antipsychotics (haloperidol), antidepressants (citalopram or amitriptyline).", "bbox": [34.0, 535.3, 778.8, 551.8], "key": "p26-86554096"}, {"id": "p26-out-e04", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "PALPITATIONS", "bbox": [362.7, 48.7, 480.8, 71.0], "key": "p26-69890eed"}, {"id": "p26-out-e05", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with palpitations not needing urgent attention • If any of the following, arrange for cardiology appointment, same week if possible: known current or previous heart disease, a history of fainting, or family history of sudden death. • Also do an ECG (if available) and discuss/refer to doctor for review. If unsure whether ECG is abnormal, discuss with specialist.", "bbox": [76.5, 242.1, 735.7, 273.3], "key": "p26-6438e9f2"}, {"id": "p26-out-e06", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Sinus rhythm", "bbox": [495.9, 287.1, 544.2, 297.3], "key": "p26-970e558c"}, {"id": "p26-out-e07", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Sinus tachycardia", "bbox": [335.2, 287.1, 398.7, 297.3], "key": "p26-e172c137"}, {"id": "p26-out-e08", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Atrial fibrillation (AF) (irregular rate, absent ‘p-waves’)", "bbox": [610.9, 286.3, 726.0, 307.3], "key": "p26-5ec1a727"}, {"id": "p26-out-e09", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check for fever, dehydration, anaemia, pregnancy and medication side effects", "bbox": [171.8, 341.6, 457.9, 351.8], "key": "p26-fa0da578"}, {"id": "p26-out-e10", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If none of the above, consider thyroid or electrolyte abnormalities. Check TSH, potassium, magnesium and manage according to result.", "bbox": [67.5, 432.5, 560.2, 442.7], "key": "p26-b734420c"}, {"id": "p26-out-e11", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If ECG unavailable: refer same day to nearest facility where available.", "bbox": [189.8, 442.5, 437.9, 452.7], "key": "p26-1840727f"}, {"id": "p26-out-e12", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Identify triggers. If palpitations are linked to smoking, excessive alcohol binges, caffeine, stimulants (diet pills or cocaine/ amphetamines), advise to cut down or avoid these. • Palpitations may be related to anxiety: decide this only once all other causes are excluded. Assess for stress and anxiety 98.", "bbox": [76.5, 468.0, 539.8, 498.2], "key": "p26-c15da811"}, {"id": "p26-out-e13", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Discuss need for blood thinners and how to manage further with", "bbox": [608.4, 360.7, 730.5, 380.9], "key": "p26-4d998ebd"}, {"id": "p26-out-e14", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "specialist.", "bbox": [651.0, 380.7, 686.0, 390.9], "key": "p26-5a3d597d"}, {"id": "p26-out-e15", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Other arrhythmia or", "bbox": [750.6, 287.1, 802.2, 307.3], "key": "p26-5b3a3cd9"}, {"id": "p26-out-e16", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "abnormality", "bbox": [753.3, 307.1, 797.6, 317.3], "key": "p26-b91151ab"}, {"id": "p26-out-e17", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Arrange for", "bbox": [754.8, 332.6, 798.1, 342.8], "key": "p26-9498010c"}, {"id": "p26-out-e18", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "cardiology appointment", "bbox": [751.2, 342.6, 801.7, 362.8], "key": "p26-2495ecd2"}, {"id": "p26-out-e19", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "same week if", "bbox": [751.8, 362.6, 801.1, 372.8], "key": "p26-a461875d"}, {"id": "p26-out-e20", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "possible. If temperature", "bbox": [40.4, 367.1, 791.3, 382.8], "key": "p26-ae623d86"}, {"id": "p26-out-e21", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "≥ 38°C, assess", "bbox": [41.4, 377.1, 93.9, 387.3], "key": "p26-0b237fcc"}, {"id": "p26-out-e22", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "and manage", "bbox": [43.6, 387.1, 91.7, 397.3], "key": "p26-9170d8df"}, {"id": "p26-out-e23", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "fever 38.", "bbox": [45.0, 396.3, 90.3, 407.3], "key": "p26-b5b50c22"}, {"id": "p26-out-e24", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If thirst, dry mouth, poor skin", "bbox": [112.9, 367.1, 220.9, 377.3], "key": "p26-12820836"}, {"id": "p26-out-e25", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "turgor or decreased urine output, dehydration likely. If", "bbox": [112.7, 377.1, 221.1, 397.3], "key": "p26-07537519"}, {"id": "p26-out-e26", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "nausea/vomiting 57. If", "bbox": [119.8, 396.5, 214.0, 407.3], "key": "p26-56387c6b"}, {"id": "p26-out-e27", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "diarrhoea 58.", "bbox": [136.7, 406.5, 195.1, 417.3], "key": "p26-a65157ba"}, {"id": "p26-out-e28", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If pallor, check fingerprick Hb: if < 12 (woman) or < 13 (man), anaemia", "bbox": [239.7, 367.1, 319.4, 407.3], "key": "p26-554b2c81"}, {"id": "p26-out-e29", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely 44.", "bbox": [257.8, 406.5, 301.4, 417.3], "key": "p26-eebf59df"}, {"id": "p26-out-e30", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Review patient's prescribed and over- the-counter medication1 to check if any are known to prolong QT interval2. • Consider switch/stop medication. If unsure, discuss.", "bbox": [430.2, 367.1, 583.5, 417.3], "key": "p26-627627d9"}, {"id": "p26-out-e31", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If woman of child bearing potential, do urine", "bbox": [339.0, 367.1, 408.6, 397.3], "key": "p26-4ce98263"}, {"id": "p26-out-e32", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "pregnancy test. If pregnant 175.", "bbox": [340.3, 397.1, 406.4, 417.3], "key": "p26-8d335f29"}, {"id": "p26-out-e33", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Premature ventricular contractions (PVCs)", "bbox": [129.3, 287.1, 281.4, 297.3], "key": "p26-76d455e3"}, {"id": "p26-out-e34", "page": 26, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "ECG unavailable", "bbox": [45.6, 287.1, 104.5, 297.3], "key": "p26-0c31a454"}], "boxes": [{"box": 1, "rect": [35.5, 112.9, 806.4, 229.1]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAADzCAIAAACzPFZoAAAACXBIWXMAABcSAAAXEgFnn9JSAAE8JElEQVR4nOy9Z3AVR9cu+t26derU/XdP3br/Tt3PbBCIjEAgjEgiY3LOQSSRc44iJwMmW+QMJkeLLHISGBFMtjHYGGxjbGPA4NfvO/fRXmi53TPTe/ZWhlX1lEp7Qk/36tUrPNPd818//+98AoFAIBAIBAKBQCAQCAQCQe7Cf2V7DQQCgUAgEAgEAoFAIBAIBIJgIayWQCAQCAQCgUAgEAgEAoEg9+EfrNbrTfPf7FwiEAgEAoFAIBAIBAKBQCAQ5EC8mj3WmdX6988XrH99KRAIBAKBQCAQCAQCgUAgEORA/Hlmi7BaAoFAIBAIBAKBQCAQCASCXAZhtQQCgUAgEAgEAoFAIBAIBLkPwmoJBAKBQCAQCAQCgUAgEAhyH4TVEggEAoFAIBAIBAKBQCAQ5D4IqyUQCAQCgUAgEAgEAoFAIMh9EFZLIBAIBAKBQCAQCAQCgUCQ+yCslkAgEAgEAoFAIBAIBAKBIPdBWC2BQCAQCAQCgUAgEAgEAkHug7BaAoFAIBAIBAKBQCAQCASC3AdhtQQCgUAgEAgEAoFAIBAIBLkPwmoJBAKBIKvx28/ns70OAjNyVx+dOrbuwOfLgGyviSPevEx59fxStlfDjufPkv/95prhgi+v7CbB/vzDmcyuTAjPyi nding\"))\n\n    (clinical_finding (snomed_concept \"Pulse irregular\" \"finding\"))\n    (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n\n    (clinical_finding (snomed_concept \"Pain in calf\" \"finding\"))\n    (clinical_finding (snomed_concept \"Thigh pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Swollen calf\" \"finding\"))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Thigh structure\" \"body structure\")))\n\n    (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Orthopnea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Leg swelling symptom\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Muscle weakness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n  )\n)\n;; Approach to the patient not needing urgent attention: \"Check for fever, dehydration, anaemia,\n;; pregnancy and medication side effects\". Only the dehydration signs are representable\n;; (fever uses the routine temperature; anaemia needs Hb; pregnancy needs a urine test).\n(task\n  \"Check for causes of palpitations\"\n  adult\n  (clinical_finding (snomed_concept \"Palpitations\" \"finding\"))\n  (check_for\n    (clinical_finding (snomed_concept \"Thirst due to water deprivation\" \"finding\"))\n    (clinical_finding (snomed_concept \"Xerostomia\" \"finding\"))\n    (clinical_finding (snomed_concept \"Decreased skin turgor\" \"finding\"))\n    (clinical_finding (snomed_concept \"Decreased urine output\" \"finding\"))\n  )\n)\n;; Red box: \"Difficulty breathing worse on lying flat and leg swelling, heart failure likely\"\n(system_diagnosis_rule\n  \"Diagnose probable heart failure from palpitations\"\n  (diagnosis\n    (snomed_concept \"Heart failure\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Palpitations\" \"finding\"))\n    (clinical_finding (snomed_concept \"Orthopnea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Leg swelling symptom\" \"finding\"))\n  )\n)\n;; Red box: \"New sudden asymmetric weakness or numbness, difficulty speaking or visual disturbance, consider stroke/TIA\"\n(system_diagnosis_rule\n  \"Diagnose possible stroke from palpitations\"\n  (diagnosis\n    (snomed_concept \"Cerebrovascular accident\" \"disorder\")\n    possible\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Palpitations\" \"finding\"))\n    (or\n      (clinical_finding (snomed_concept \"Muscle weakness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Numbness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible TIA from palpitations\"\n  (diagnosis\n    (snomed_concept \"Transient ischemic attack\" \"disorder\")\n    possible\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Palpitations\" \"finding\"))\n    (or\n      (clinical_finding (snomed_concept \"Muscle weakness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Numbness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    )\n  )\n)\n;; \"If thirst, dry mouth, poor skin turgor or decreased urine output, dehydration likely\"\n(system_diagnosis_rule\n  \"Diagnose probable dehydration from palpitations\"\n  (diagnosis\n    (snomed_concept \"Dehydration\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Palpitations\" \"finding\"))\n    (or\n      (clinical_finding (snomed_concept \"Thirst due to water deprivation\" \"finding\"))\n      (clinical_finding (snomed_concept \"Xerostomia\" \"finding\"))\n      (clinical_finding (snomed_concept \"Decreased skin turgor\" \"finding\"))\n      (clinical_finding (snomed_concept \"Decreased urine output\" \"finding\"))\n    )\n  )\n)\n;; \"If none of the above, consider thyroid or electrolyte abnormalities.\"\n;; Only the representable parts of \"none of the above\" are excluded: temperature >= 38 °C and the\n;; dehydration signs. ECG, Hb, pregnancy test and medication review cannot be expressed.\n(system_diagnosis_rule\n  \"Diagnose possible thyroid disorder from palpitations\"\n  (diagnosis\n    (snomed_concept \"Disorder of thyroid gland\" \"disorder\")\n    possible\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Palpitations\" \"finding\"))\n    (< (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38)\n    (no (clinical_finding (snomed_concept \"Thirst due to water deprivation\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Xerostomia\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Decreased skin turgor\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Decreased urine output\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible electrolyte imbalance from palpitations\"\n  (diagnosis\n    (snomed_concept \"Electrolyte imbalance\" \"disorder\")\n    possible\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Palpitations\" \"finding\"))\n    (< (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38)\n    (no (clinical_finding (snomed_concept \"Thirst due to water deprivation\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Xerostomia\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Decreased skin turgor\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Decreased urine output\" \"finding\")))\n  )\n)\n;; Red box. Hb < 8 is not representable (no Hb observable or unit).\n(system_priority_evaluation\n  \"Urgent: palpitations with danger signs\"\n  adult\n  Urgent\n  (and\n    (clinical_finding (snomed_concept \"Palpitations\" \"finding\"))\n    (or\n      ;; Faint or loss of consciousness\n      (clinical_finding (snomed_concept \"Syncope\" \"finding\"))\n      (clinical_finding (snomed_concept \"Loss of consciousness\" \"finding\"))\n      ;; Dizziness or light-headedness\n      (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n      (clinical_finding (snomed_concept \"Lightheadedness\" \"finding\"))\n      ;; Confusion\n      (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n      ;; Chest pain\n      (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n      ;; BP >= 180/110 or < 90/60\n      (>= (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 180)\n      (>= (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 110)\n      (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n      (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)\n      ;; Pulse irregular, > 150 or < 50\n      (clinical_finding (snomed_concept \"Pulse irregular\" \"finding\"))\n      (> (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 150)\n      (< (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 50)\n      ;; Fingerprick glucose < 3 (< 4 if diabetes)\n      (< (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 3)\n      (and (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n           (< (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L) 4))\n      ;; Calf or thigh pain and/or swelling\n      (clinical_finding (snomed_concept \"Pain in calf\" \"finding\"))\n      (clinical_finding (snomed_concept \"Thigh pain\" \"finding\"))\n      (clinical_finding (snomed_concept \"Swollen calf\" \"finding\"))\n      (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Thigh structure\" \"body structure\")))\n      ;; Difficulty breathing, respiratory rate >= 30 or oxygen saturation < 94%\n      (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n      (>= (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)\n      (< (measurement (snomed_concept \"Hemoglobin saturation with oxygen\" \"observable entity\") %) 94)\n      ;; Difficulty breathing worse on lying flat and leg swelling, heart failure likely\n      (active_condition "]\n    START --> RB{\"Any of: faint/loss of consciousness, dizziness/light-headedness, confusion,<br/>chest pain, BP ≥ 180/110 or &lt; 90/60, pulse irregular / &gt; 150 / &lt; 50,<br/>fingerprick glucose &lt; 3 (&lt; 4 if diabetes), calf/thigh pain and/or swelling, Hb &lt; 8,<br/>difficulty breathing / RR ≥ 30 / SpO₂ &lt; 94%,<br/>orthopnoea + leg swelling (heart failure likely),<br/>new sudden asymmetric weakness/numbness, difficulty speaking, visual disturbance (consider stroke/TIA)\"}\n    RB -- Yes --> URGENT[\"Manage and refer urgently<br/>(ABC, oxygen, ECG, discuss with specialist)\"]\n    RB -- No --> APPROACH[\"Not needing urgent attention:<br/>heart disease / history of fainting / family history of sudden death → cardiology appointment same week.<br/>Do ECG if available.\"]\n    APPROACH --> ECG{\"ECG result\"}\n    ECG -- \"ECG unavailable / PVCs / sinus tachycardia / sinus rhythm\" --> CHECK[\"Check for fever, dehydration, anaemia, pregnancy and medication side effects\"]\n    ECG -- \"Atrial fibrillation\" --> AF[\"Discuss blood thinners and further management with specialist\"]\n    ECG -- \"Other arrhythmia or abnormality\" --> CARD[\"Arrange cardiology appointment same week if possible\"]\n    CHECK --> FEV[\"Temperature ≥ 38 °C → assess and manage fever 38\"]\n    CHECK --> DEH[\"Thirst, dry mouth, poor skin turgor or decreased urine output → dehydration likely\"]\n    CHECK --> ANA[\"Pallor → fingerprick Hb &lt; 12 (woman) / &lt; 13 (man) → anaemia likely 44\"]\n    CHECK --> PREG[\"Woman of child-bearing potential → urine pregnancy test; pregnant → 175\"]\n    CHECK --> MED[\"Review medication for QT prolongation; consider switch/stop\"]\n    FEV & DEH & ANA & PREG & MED --> NONE[\"If none of the above: consider thyroid or electrolyte abnormalities<br/>(TSH, potassium, magnesium). If ECG unavailable: refer same day.\"]\n    NONE --> TRIG[\"Identify triggers (smoking, alcohol, caffeine, stimulants).<br/>Anxiety only once all other causes are excluded 98\"]\n    TRIG --> REVIEW[\"Review in 2 days; if palpitations persist, refer\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `(clinical_finding Palpitations)` as the trigger | `Check for urgent palpitations conditions`, `Check for causes of palpitations` |\n| Red box (any of) | `(and Palpitations (or …red box items…))` | `Urgent: palpitations with danger signs` |\n| Orthopnoea + leg swelling → heart failure likely | `probable` Heart failure: Palpitations **and** Orthopnea **and** Leg swelling symptom | `Diagnose probable heart failure from palpitations` (referenced from the priority rule via `active_condition`) |\n| New sudden asymmetric weakness/numbness, difficulty speaking, visual disturbance → consider stroke/TIA | `possible` Cerebrovascular accident and `possible` Transient ischemic attack, each Palpitations **and** any of the four sudden-onset findings | `Diagnose possible stroke from palpitations`, `Diagnose possible TIA from palpitations` |\n| Hb < 8 | Not representable (no Hb unit/observable) | — |\n| ECG branches (PVCs, sinus tachycardia, sinus rhythm, AF, other arrhythmia) | Not representable (no ECG result in the language) | — |\n| Temperature ≥ 38 °C → fever 38 | Cross-reference to the fever page; temperature is a routine vital | — (used as an exclusion in the thyroid/electrolyte rules) |\n| Thirst, dry mouth, poor skin turgor or decreased urine output → dehydration likely | `probable` Dehydration: Palpitations **and** any of the four | `Diagnose probable dehydration from palpitations` |\n| Pallor → Hb → anaemia likely | Not representable (needs fingerprick Hb) | — |\n| Pregnancy test → 175 | Not representable (urine test result) / cross-reference | — |\n| Medication review (QT) | Management | — |\n| None of the above → consider thyroid or electrolyte abnormalities | `possible` Disorder of thyroid gland and `possible` Electrolyte imbalance: Palpitations **and** temperature < 38 °C **and** (no) each dehydration sign | `Diagnose possible thyroid disorder from palpitations`, `Diagnose possible electrolyte imbalance from palpitations` |\n| Anxiety only once all other causes excluded | Not encoded (exclusion of ECG, Hb, pregnancy and medication causes is not representable) | — |\n\n## Notes\n\n- The ECG, Hb, pregnancy-test and medication-review steps cannot be expressed, so the\n  thyroid/electrolyte \"none of the above\" exclusion only covers fever and the dehydration signs.\n- Cardiology/referral steps, oxygen and ECG instructions are management and are not modelled.\n", "questions": "# Page 26 – Palpitations: remaining questions\n\n## Decisions made\n\n- **Reconciled build.** Builder B's encoding was taken as the base; see `reconcile.json`.\n\n- **Trigger.** Both tasks and every rule are anchored on `(clinical_finding Palpitations)`.\n  Palpitations is not a recorded common symptom or warning sign, so these rules only fire once the\n  complaint is recorded as a finding.\n- **Red box → one `Urgent` priority rule** (`Urgent: palpitations with danger signs`),\n  `(and Palpitations (or …))`. The page does not escalate any item, so nothing is `Very urgent` or\n  `Emergency` here (chest pain keeps its own warning-sign level elsewhere).\n- **BP ≥ 180/110 or < 90/60**: systolic ≥ 180 or diastolic ≥ 110; systolic < 90 or diastolic < 60\n  (Will's convention for the pair).\n- **Pulse > 150 / < 50**: strict comparisons on `Pulse, function` (bpm), as written.\n- **Glucose < 3 (< 4 if diabetes)**: `< 3 mmol/L` or (known diabetes and `< 4 mmol/L`). Diabetes uses\n  the `clinical_finding … Known present` form in both the check and the priority rule.\n- **Faint or loss of consciousness**: `Syncope` and `Loss of consciousness` (Syncope is a descendant\n  of LOC; both are listed so the health worker sees the page's word).\n- **Dizziness or light-headedness**: `Dizziness` and `Lightheadedness` (not related by is-a in SNOMED).\n- **Confusion**: `Clouded consciousness` (VHA's AVPU \"Confused\" record).\n- **Calf or thigh pain and/or swelling**: Pain in calf, Thigh pain, Swollen calf, and Swelling at\n  Thigh structure, joined by `or`.\n- **Heart failure likely** → `probable` Heart failure (Palpitations + Orthopnea + Leg swelling\n  symptom), referenced from the priority rule as `(active_condition Heart failure)`.\n- **Consider stroke/TIA** → two `possible` rules (Cerebrovascular accident, Transient ischemic\n  attack). The four findings themselves are in the priority rule. \"New sudden\" is encoded as the\n  `Sudden onset` qualifier on all four. \"Asymmetric\" is the `Asymmetry` qualifier on weakness and\n  numbness only.\n- **Dehydration likely** → `probable` Dehydration: Palpitations and any of thirst, dry mouth, poor\n  skin turgor, decreased urine output. A second task, `Check for causes of palpitations`, checks for\n  these four.\n- **Consider thyroid or electrolyte abnormalities (\"if none of the above\")** → two `possible` rules.\n  The representable part of \"none of the above\" is temperature < 38 °C and an explicit No for each\n  dehydration sign.\n- **Fever ≥ 38 °C → 38, pregnant → 175, anxiety → 98**: these are cross-references to other pages and\n  are not re-encoded here.\n- No `measure` task: glucose, temperature, pulse, RR, BP and SpO₂ are routine vitals. Hb and ECG\n  have no representation.\n- Shock is not mentioned on this page.\n\n## Could not model\n\n- **Hb < 8** (red box). It has no observable or unit. It is left out of the priority rule, which\n  therefore fires **less often** than the page intends (a patient whose only danger sign is Hb < 8 is\n  not flagged).\n- **ECG results** (PVCs, sinus tachycardia, sinus rhythm, atrial fibrillation, other arrhythmia).\n  There is no ECG finding in the language, so the AF and \"other arrhythmia\" branches (blood\n  thinners, cardiology appointment) are not modelled.\n- **Anaemia likely** (pallor, then fingerprick Hb < 12 woman / < 13 man). It needs Hb. Pallor alone\n  is not the page's criterion, so no rule is written.\n- **Pregnancy** (urine pregnancy test for a woman of child-bearing potential). This is a test\n  result and a cross-reference to 175. It is not in the thyroid/electrolyte exclusion, so those\n  `possible` rules fire **more often** than intended (also when pregnancy explains the palpitations).\n- **Medication side effects** (QT-prolonging drugs). This is a review and management step. It is\n  not in the exclusion either, so those rules fire **more often**.\n- **\"Not needing urgent attention\"** scoping: the thyroid/electrolyte and dehydration rules do not\n  exclude red-box patients.\n- **Anxiety** (\"decide this only once all other causes are excluded\"). The exclusion of ECG, Hb,\n  pregnancy and medication causes cannot be expressed, so no `possible` anxiety rule is written.\n- **Cardiology appointment** for known heart disease, history of fainting or family history of sudden\n  death. This is referral (management).\n- **Triggers** (smoking, alcohol, caffeine, stimulants) and the 2-day review. These are advice and\n  follow-up.\n\n## SNOMED gaps\n\n- \"Confusion\" (finding) does not exist. `Clouded consciousness` is used.\n- \"Light-headedness\" does not exist. `Lightheadedness` is used.\n- \"Thirst\" (finding) does not exist. `Thirst due to water deprivation` (VHA vocabulary) is used;\n  `Increased thirst` was the alternative.\n- No precoordinated thigh-swelling concept exists. `Swelling` with finding_site `Thigh structure`\n  is used, and the site was verified.\n- \"Dry mouth\" does not exist. `Xerostomia` is used.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the thyroid/electrolyte `possible` rules require an explicit \"No\" to each dehydration\n  sign and a temperature < 38 °C? The alternative is to fire on any palpitations patient, since most\n  of \"none of the above\" cannot be checked.\n- Does \"New sudden\" apply to difficulty speaking and visual disturbance as well as to\n  weakness/numbness? Should \"asymmetric\" be recorded as `Asymmetry` or as `Unilateral`?\n- Is `Clouded consciousness` the right record for \"Confusion\", or should `Acute confusion` also\n  count?\n- Should a recorded history of heart failure with palpitations be Urgent? The priority rule uses\n  `(active_condition Heart failure)`, which matches a known heart failure diagnosis as well as the\n  current orthopnoea + leg swelling combination the page names. (Raised by builder A.)\n- Should \"asymmetric\" weakness/numbness be restricted to the limbs (`Muscle weakness of limb`,\n  `Numbness of limbs`)? The page does not say \"limb\"; the final build uses the general concepts\n  with an `Asymmetry` qualifier. (Reconciler: builder A used the limb concepts without asymmetry.)\n- Should \"Faint\" also include `Feeling faint` (presyncope), or only syncope / loss of consciousness?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent palpitations conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Palpitations\" \"finding\"))", "element_keys": ["p26-aa2dfef1"], "quote": "palpitations"}, {"claim_id": "c002", "rule": "Check for urgent palpitations conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Syncope\" \"finding\"))", "element_keys": ["p26-496756d0"], "quote": "Faint"}, {"claim_id": "c003", "rule": "Check for urgent palpitations conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Loss of consciousness\" \"finding\"))", "element_keys": ["p26-496756d0"], "quote": "loss of consciousness"}, {"claim_id": "c004", "rule": "Check for urgent palpitations conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Dizziness\" \"finding\"))", "element_keys": ["p26-c7834187"], "quote": "Dizziness"}, { // ---------- banners ----------
function renderBanners() {
  const b = [];

  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);

  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}

}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};

  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,

  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {

    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {

      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }

const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
