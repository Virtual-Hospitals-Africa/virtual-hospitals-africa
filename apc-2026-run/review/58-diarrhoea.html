-out-e25", "page": 58, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Dysentery likely • Give ciprofloxacin 500mg 12 hourly for 3 days. • If no response within 3 days, refer.", "bbox": [381.5, 308.0, 445.2, 399.0], "key": "p58-c4c91295"}, {"id": "p58-out-e26", "page": 58, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Give loperamide 2mg as needed", "bbox": [583.7, 408.6, 715.8, 419.4], "key": "p58-bd57a62c"}, {"id": "p58-out-e27", "page": 58, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "up to 8mg/day.", "bbox": [619.5, 419.2, 675.9, 429.4], "key": "p58-8cb83345"}], "boxes": [{"box": 1, "rect": [35.7, 86.7, 806.4, 147.4]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAACACAIAAAA+iikHAAAACXBIWXMAABcSAAAXEgFnn9JSAACLUElEQVR4nOy9B1AVS/zveV/t26q3r17t1m7V7v9V7b6nHIIooqIoBlARBXPOIoo5YUavGRPmiAlzxJwDoggCigiiCF5zVszXgKgYz345P+jbd2bOnEMW/VV9iprT09O5e/r3pbvnj7//PzuGYRiGYRiGYRiGYRiGKV38UeIpYBiGYRiGYRiGYRiGYZi8wqoWwzAMwzAMwzAMwzAMU/r4R9V6Xa3G28Y+DMMwDMMwDMMwDMMwDPMT8qa+p7aq9XHpNOPXvxiGYRiGYRiGYRiGYRjmJ+Rr2lFWtRiGYRiGYRiGYRiGYZhSBqtaDMMwDMMwDMMwDMMwTOmDVS2GYRiGYRiGYRiGYRim9MGqFsMwDMMwDMMwDMMwDFP6YFWLYRiGYRiGYRiGYRiGKX2wqsUwDMMwDMMwDMMwDMOUPljVYhiGYRiGYRiGYRiGYUofrGoxDMMwDMMwDMMwDMMwpQ9WtRiGYRiGYRiGYRiGYZjSB6taDMMwDMMwDMMwDMMwTOmDVS2GYRiGYRiGYRiGYRim9MGqFsMwDPNz8e7v8yWeBkafUlRHWZmXIo6tBUnndpV4YjTJeJ30/XNaiSdDjcVa/uvyISrbv5/H5yP8+LgwelxkvyjaVQET+dPy5eNlytf5sztKPDE6oHJPhK9dETJ5y4Y5aOolnh6GYRjm14NVLYZhGKZYefEkLmzzvOlBw/z92vl3bzt6RO9N62e/fnGO7k6dHGAoU6Zvr44lnk5GE9ioLZo0sLOxWb2ydMwTnjyMQYsCnTs0K/HEqDlycGU5O9s6btUyXieWeGJkrOmJY0f3pbI9d2Z7PqJo6lOfHs/KvGRljPmggIn8aXn393nKV5uW3iWeGHNkvr3QsqkXpRM8uhdV4kliGIZhfj1Y1WIYhmGKiU/vL4YsmlixfDlh5AhSLx4gP0286+GncwXHLx8vl3iCi5Tn6XG7ty+GyZ1wJj9LLeJjw5YunDBp/CDh8jEj+fiR1TOChm9aP7voEvn383g7GxvUUU/ftkVRLOp8FTDBP5Wqpc5d0KQASt6lpL0FD78Q24CiJ2qGXLiqVhH1fVa1SpB – Diarrhoea: flowchart\n\nSource: APC 2026 e-book page 58. Red box first, then the approach for the patient\nnot needing urgent attention.\n\n```mermaid\nflowchart TD\n    START[\"Patient with diarrhoea\"]\n    START --> RB{\"Red box: any of<br/>Shock¹ or SBP &lt; 80<br/>Watery diarrhoea + cholera outbreak area in past 5 days (cholera likely → 59)\"}\n    RB -- Yes --> URGENT[\"Give urgent attention<br/>Manage and refer urgently\"]\n    RB -- No --> CONF[\"Confirm diarrhoea: ≥ 3 loose stools/day\"]\n    CONF --> DEH{\"Thirst, dry mouth or poor skin turgor?\"}\n    DEH -- Yes --> DEHL[\"Dehydration likely<br/>(ORS; IV and refer if unable to drink / no better after 2 h)\"]\n    CONF --> OVF{\"Prolonged constipation followed by watery stool?\"}\n    OVF -- Yes --> OVFL[\"Overflow diarrhoea likely ↻ 60\"]\n    CONF --> DUR{\"Duration of diarrhoea\"}\n    DUR -- \"≤ 2 weeks\" --> BLOOD{\"Is there blood in the stool?\"}\n    BLOOD -- Yes --> DYS[\"Dysentery likely\"]\n    BLOOD -- No --> CHOL{\"Has patient been in cholera outbreak area in past 5 days?\"}\n    CHOL -- Yes --> CHOLL[\"Cholera likely → 59\"]\n    CHOL -- No --> GE[\"Gastroenteritis likely\"]\n    DUR -- \"> 2 weeks\" --> LONG[\"If blood/mucous in stool, refer<br/>Send stool for ova, cysts, parasites<br/>Test for HIV ↻ 124\"]\n    LONG --> HIV{\"HIV result\"}\n    HIV -- \"HIV positive\" --> HIVP[\"Routine HIV care; LPVr can cause loose stools<br/>Review symptoms and stool result in 1 week\"]\n    HIVP --> ISO[\"Isospora belli → co-trimoxazole\"]\n    HIVP --> CRY[\"Cryptosporidium → loperamide\"]\n    HIV -- \"HIV negative or unknown\" --> GIA[\"Treat for giardiasis\"]\n    GIA --> REV{\"Review stool result\"}\n    REV -- \"Stool negative\" --> LOP[\"Loperamide\"]\n    REV -- \"Stool positive\" --> TAR[\"Treat according to result\"]\n    LONG --> PERS[\"If diarrhoea persists despite treatment, refer\"]\n    START --> IMP{\"> 65 years, bed-bound or receiving palliative care?\"}\n    IMP -- Yes --> RECT{\"Solid immobile bulk of stool in rectum?\"}\n    RECT -- Yes --> IMPL[\"Impaction likely: refer\"]\n```\n\n¹ Footnote: \"If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness,\nshock likely.\" Not built as a shared shock definition (decision for all pages); the red box is\nencoded as written, shock finding or SBP < 80.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `Diarrhea` (common symptom) | `Check for diarrhoea urgent signs and causes` (trigger) |\n| Red box: Shock or SBP < 80 | `(or Shock (< SBP 80))` | `Urgent: diarrhoea with shock or cholera` |\n| Red box: watery diarrhoea + cholera outbreak area → cholera likely | Watery-qualified diarrhoea **and** exposure to *Vibrio cholerae* | `Diagnose probable cholera in diarrhoea` (first branch); priority uses `(active_condition Cholera)` |\n| Thirst, dry mouth or poor skin turgor | Diarrhoea **and** any of increased thirst, xerostomia, decreased skin turgor | `Diagnose probable dehydration in diarrhoea` |\n| Prolonged constipation followed by watery stool | Chronic constipation **and** watery-qualified diarrhoea | `Diagnose probable overflow diarrhoea` |\n| Duration ≤ 2 weeks | `(<= (onset Diarrhea) (time_ago 2 weeks))` | used in dysentery, cholera (second branch), gastroenteritis rules |\n| Blood in stool = Yes | Hematochezia | `Diagnose probable dysentery in diarrhoea` |\n| Blood = No, cholera area = Yes | `(no Hematochezia)` **and** exposure to *Vibrio cholerae* | `Diagnose probable cholera in diarrhoea` (second branch) |\n| Blood = No, cholera area = No | `(no Hematochezia)` **and** `(no exposure)` | `Diagnose probable gastroenteritis in diarrhoea` |\n| Duration > 2 weeks, HIV negative or unknown → treat for giardiasis | Treatment instruction, no \"likely\"/\"consider\" diagnosis: not modelled | — (see remaining questions) |\n| HIV positive → Isospora belli / Cryptosporidium | Stool laboratory result: not modelled | — (see remaining questions) |\n| > 65 years, bed-bound or palliative care → check rectum | Bed-ridden or seen by palliative care service (age not representable) | `Check rectum for faecal impaction in diarrhoea` (task) |\n| Solid immobile bulk of stool in rectum → impaction likely | Fullness of rectum due to feces **and** the gate above | `Diagnose probable faecal impaction in diarrhoea` |\n\n## Notes\n\n- Cholera outbreak \"in past 5 days\" is not modelled as a time comparison (as on page 20, exposure\n  findings are taken to be recent; they do not record an onset).\n- \"≤ 2 weeks\" is `(<= (onset Diarrhea) (time_ago 2 weeks))`. The \"> 2 weeks\" branch has no \"likely\" or\n  \"consider\" diagnosis, so its duration is not encoded.\n- Management (ORS, IV fluids, medicines, referral, advice, stool tests, HIV test) is not modelled.\n", "questions": "# Page 58 – Diarrhoea: remaining questions\n\nFinal build, reconciled from two independent builds (base: builder A).\n\n## Decisions made\n\n- **Shock / SBP < 80** encoded as written on this page: `(or Shock (< SBP 80))`. The footnote's\n  shock definition (SBP < 80, pulse ≥ 100, RR > 30, confusion/restlessness, weakness) is not built\n  as a shock rule (decision for all pages).\n- **Red box cholera.** Following Will's briefing, the red box's \"cholera likely\" is a `probable`\n  rule (`Diagnose probable cholera in diarrhoea`) and the priority rule uses\n  `(active_condition Cholera)`. The cholera rule has two branches: the red box (watery diarrhoea and\n  outbreak area) and the flowchart (diarrhoea ≤ 2 weeks, no blood, outbreak area). So the\n  flowchart branch also makes the patient Urgent, which is wider than the red box itself.\n- **Cholera outbreak area** is recorded as exposure to *Vibrio cholerae*\n  (`Exposure to (contextual qualifier)` + `Vibrio cholerae` organism, both in the vocabulary).\n  \"In past 5 days\" is not a time comparison: as on the gold page 20, exposure findings record no\n  onset (Will's briefing: the subject of `onset` is a `clinical_finding` or `active_condition`).\n- **Durations.** \"≤ 2 weeks\" is `(<= (onset Diarrhea) (time_ago 2 weeks))`. The \"> 2 weeks\" branch\n  has no \"likely\" or \"consider\" diagnosis, so its duration is not encoded.\n- **Blood in stool = No** and **cholera area = No** use `(no …)`, so they need the health worker to\n  answer No explicitly.\n- **\"Treat for giardiasis\"** (> 2 weeks, HIV negative or unknown) is read as a treatment\n  instruction, not \"giardiasis likely\"/\"consider giardiasis\"; it is not encoded.\n- **Faecal impaction**: a second `check_for` task asks for the rectal finding when the patient with\n  diarrhoea is bed-ridden or under palliative care; `probable` Fecal impaction when it is present.\n- **Dehydration** and **faecal impaction** rules include the Diarrhea finding as page context.\n- **Gastroenteritis** uses `Inflammation of stomach and intestine` (SNOMED synonym\n  \"gastroenteritis\"), not the narrower `Infectious gastroenteritis`.\n- No `measure` task: SBP is a routine vital; the stool and HIV tests are laboratory tests.\n\n## Could not model\n\n- \"Confirm patient has diarrhoea: ≥ 3 loose stools/day\": stool frequency has no unit or\n  observable.\n- \"In past 5 days\" for the cholera outbreak area: exposure findings record no onset; treated as\n  recent (as on page 20). Cholera fires more often than the page (an older exposure also counts),\n  and gastroenteritis less often (an older exposure blocks it unless recorded as No).\n- \"> 65 years\" for the impaction check: no age comparison in the language. The rectal-check task\n  and the impaction rule fire less often than the page (only bed-ridden or palliative patients).\n- \"Prolonged constipation **followed by** watery stool\": the order in time is not modelled; both\n  findings must be present.\n- The \"> 2 weeks\" branch: stool tests, HIV test, HIV-status routing, *Isospora belli* /\n  *Cryptosporidium* stool results and \"Treat for giardiasis\" lead only to treatment; not modelled.\n  \"LPVr can cause ongoing loose stools\" is a note.\n- \"Solid immobile bulk of stool\": `Fullness of rectum due to feces` does not carry \"solid\n  immobile\". Fires more often than the page intends.\n- All management: ORS, IV fluids, medicines, referral, stool tests, HIV test, advice.\n\n## SNOMED gaps\n\n- No `Dysentery` concept: used `Dysenteric diarrhea` (disorder).\n- No `Gastroenteritis` FSN: used `Inflammation of stomach and intestine` (disorder).\n- No `Blood in stool` FSN: used `Hematochezia` (finding).\n- No `Watery diarrhea`: used `Diarrhea` with the `Watery` qualifier.\n- No `Thirst` finding: used `Increased thirst`. The vocabulary's `Thirst due to water deprivation`\n  presumes a cause.\n- \"Dry mouth\": FSN is `Xerostomia` (finding).\n- No \"overflow diarrhoea\": used `Chronic constipation with overflow`.\n- No \"receiving palliative care\" finding: used `Seen by palliative care service` (low confidence;\n  `Under care of palliative care physician` is narrower).\n- No cholera-outbreak-area situation: used exposure to `Vibrio cholerae`.\n- No \"solid immobile bulk of stool in rectum\": used `Fullness of rectum due to feces`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the flowchart's cholera branch (non-watery diarrhoea ≤ 2 weeks, no blood, outbreak area)\n  make the patient Urgent, as it does now through `(active_condition Cholera)`?\n- Is exposure to *Vibrio cholerae* an acceptable stand-in for \"has been in a cholera outbreak area\n  in the past 5 days\", or should VHA record travel/residence in an outbreak area separately (with\n  a date, so the 5-day window can be checked)?\n- Should \"Treat for giardiasis\" (diarrhoea > 2 weeks, HIV negative or unknown) be a `possible`\n  giardiasis diagnosis? (The builders disagreed; the final build leaves it out.)\n- Is `Seen by palliative care service` an acceptable record of \"receiving palliative care\"?\n- Should impaction also fire for pa <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";

// The rule's own text in the page's rule file: the top-level form whose description matches,

const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }

    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
