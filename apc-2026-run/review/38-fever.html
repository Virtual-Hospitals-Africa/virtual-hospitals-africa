"}, {"id": "p38-out-e03", "page": 38, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• A patient with a fever has a temperature ≥ 38°C now or in the past 3 days. • If patient has been in a malaria area in past 3 months, consider malaria. 39.", "bbox": [51.0, 90.2, 340.7, 110.4], "key": "p38-2d9a1b25"}, {"id": "p38-out-e04", "page": 38, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with a fever not needing urgent attention • If on abacavir, check for abacavir hypersensitivity reaction (AHR) 131. • If unexplained rash or lesion/s of skin/genitals/anus/rectum/mouth/eyes and ≥ 1 of: headache/backache/body pain, swollen lymph nodes, temperature > 38.5°C, fatigue, sore throat/nasal congestion/ cough, consider mpox. 40. • If sore throat, mild fever and a thick grey layer (pseudomembrane) in nose/throat that bleeds easily if touched, consider diphtheria 53. • If none of the above, or previous malaria test/s negative:", "bbox": [51.0, 266.2, 787.3, 327.4], "key": "p38-2172e4f3"}, {"id": "p38-out-e05", "page": 38, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Does patient have a tick bite (small dark brown/black scab) or tick present?", "bbox": [284.1, 342.6, 557.8, 352.8], "key": "p38-e536e654"}, {"id": "p38-out-e06", "page": 38, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes", "bbox": [216.5, 368.1, 228.4, 378.3], "key": "p38-d008521e"}, {"id": "p38-out-e07", "page": 38, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Tick bite fever likely • May also have headache, body pain, rash or localised lymphadenopathy. • If tick present, grip tick close to skin using forceps and remove. • Give doxycycline3,4 100mg 12 hourly with food for 7 days. • If pregnant, give doxycycline4,5 100mg 12 hourly with food for 2 days only, then switch to azithromycin 500mg daily for 3 days. • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed for up to 5 days. • Refer if: - Unable to take medication orally - Fever persisting for > 2 days after starting treatment. • Advise to return if any of: new rash, confusion, shortness of breath, palpitations, severe weakness. Refer.", "bbox": [51.0, 392.7, 392.6, 513.7], "key": "p38-0a04184f"}, {"id": "p38-out-e08", "page": 38, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Ask about other symptoms: assess and manage on symptom page. • If any of: headache, body pain, recent common cold, acute viral infection likely 51.", "bbox": [442.1, 393.5, 763.3, 413.7], "key": "p38-17389c5c"}, {"id": "p38-out-e09", "page": 38, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If none of above: • Check urine dipstick: if blood, leucocytes or nitrites 69. • Check for TB 102 and test for HIV 124. • Advise patient to return if other symptoms develop. • If fever recurs or persists for > 2 days and cause still uncertain, discuss/refer.", "bbox": [442.1, 429.0, 722.6, 479.2], "key": "p38-7ffbcd92"}], "boxes": [{"box": 1, "rect": [35.5, 134.5, 806.4, 242.3]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAADhCAIAAAD9IvX4AAAACXBIWXMAABcSAAAXEgFnn9JSAAEfJ0lEQVR4nOy9B1RVWbfvWX3ve/26+/bo8cbt1/e+2+P2+MqDKIoJFDEAihgLcw4YMIFZEXPChFnLXJgwJ8wJFQRFRCUIgjknSkyomNCy6vT/nCnL5d777HNA4IA1x/gNxmHttddeac8159wr/PTiP8syDMMwDMMwDMMwDMMwTOniJ7vngGEYhmEYhmEYhmEYhmHyC3u1GIZhGIZhGIZhGIZhmNLHN16tj0fWfYrdwjAMwzAMwzAMwzAMwzAlkA9hs7S9Wn++SDT+cZlhGIZhGIZhGIZhGIZhSiCfEiLYq8UwDMMwDMMwDMMwDMOUMtirxTAMwzAMwzAMwzAMw5Q+2KvFMAzDMAzDMAzDMAzDlD7Yq8UwDMMwDMMwDMMwDMOUPtirxTAMwzAMwzAMwzAMw5Q+2KvFMAzDMAzDMAzDMAzDlD7Yq8UwDMMwDMMwDMMwDMOUPtirxTAMwzAMwzAMwzAMw5Q+2KvFMAzDMAzDMAzDMAzDlD7Yq8UwDMMwDMMwDMMwDMOUPtirxTAM \"Common cold\" \"disorder\"))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pseudomembrane\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Nasal cavity structure\" \"body structure\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pseudomembrane\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Nasal structure\" \"body structure\")))"}]}, "diagnosis": {"only_A": ["(diagnosis (snomed_concept \"Fever\" \"finding\") probable)", "(diagnosis (snomed_concept \"Spotted fever group rickettsial disease\" \"disorder\") probable)"], "only_B": ["(diagnosis (snomed_concept \"South African tick-bite fever\" \"disorder\") probable)"], "both": ["(diagnosis (snomed_concept \"Acute viral disease\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Appendicitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Diphtheria caused by Corynebacterium diphtheriae\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Meningitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Monkeypox\" \"disorder\") possible)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Spotted fever group rickettsial disease\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"South African tick-bite fever\" \"disorder\") probable)", "relation": "B_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 38 – Fever: flowchart\n\nSource: APC 2026 e-book page 38. Red box at the top; \"Approach to the patient\nwith a fever not needing urgent attention\" below it, ending in a Yes/No tick-bite question.\n\n```mermaid\nflowchart TD\n    DEF[\"Fever: temperature ≥ 38°C now or in the past 3 days\"]\n    DEF --> MAL[\"Malaria area in past 3 months → consider malaria (39)\"]\n    DEF --> RB{\"Red box: fever and any of<br/>seizure, decreased consciousness, RR ≥ 30 or difficulty breathing,<br/>shock/SBP &lt; 80, neck stiffness/drowsy/confused/purple-red rash (meningitis likely),<br/>tender right lower abdomen (appendicitis likely),<br/>severe abdominal or back pain, jaundice, easy bleeding or bruising?\"}\n    RB -- Yes --> URG[\"Give urgent attention; manage and refer urgently\"]\n    RB -- No --> APP[\"Approach to the patient not needing urgent attention\"]\n    APP --> ABC[\"On abacavir → check for AHR (131)\"]\n    APP --> MPOX[\"Unexplained rash/lesion of skin/genitals/anus/rectum/mouth/eyes<br/>and ≥ 1 of headache/backache/body pain, swollen lymph nodes,<br/>temp &gt; 38.5°C, fatigue, sore throat/nasal congestion/cough → consider mpox (40)\"]\n    APP --> DIPH[\"Sore throat, mild fever, thick grey pseudomembrane in nose/throat<br/>that bleeds easily → consider diphtheria (53)\"]\n    APP --> NONE[\"None of the above, or previous malaria test/s negative\"]\n    NONE --> TICK{\"Tick bite (small dark brown/black scab) or tick present?\"}\n    TICK -- Yes --> TBF[\"Tick bite fever likely\"]\n    TICK -- No --> VIR{\"Any of: headache, body pain, recent common cold?\"}\n    VIR -- Yes --> AVI[\"Acute viral infection likely (51)\"]\n    VIR -- No --> REST[\"Urine dipstick (69); check for TB (102), test for HIV (124);<br/>return if other symptoms; discuss/refer if fever recurs or persists &gt; 2 days\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Fever definition | `(or (active_condition Fever) (>= Body temperature 38 °C))`. \"In the past 3 days\" for a measurement cannot be expressed; only the current temperature is compared | trigger of `Check for urgent fever conditions`, `Check for causes of fever not needing urgent attention` and the fever term of every rule below |\n| Malaria area in past 3 months | Not encoded: no SNOMED concept for having been in a malaria area | — (SNOMED gap) |\n| Red box = Yes | Fever **and** any red-box item; meningitis and appendicitis items through their probable diagnoses | `Urgent: fever with red-box danger signs` |\n| Neck stiffness, drowsy/confused or purple/red rash → meningitis likely | Fever **and** any of stiff neck, drowsy, acute confusion, purpuric rash | `Diagnose probable meningitis from fever page` |\n| Tender in right lower abdomen → appendicitis likely | Fever **and** tenderness of right lower quadrant | `Diagnose probable appendicitis from fever page` |\n| On abacavir → AHR | Pointer to page 131 only | — (cross-reference) |\n| Consider mpox | Fever **and** (rash or lesion at any of the six sites) **and** any of the listed symptoms or temp > 38.5 °C. \"Unexplained\" not modelled | `Diagnose possible mpox from fever page` |\n| Consider diphtheria | Fever **and** sore throat **and** pseudomembrane in nose or throat. \"Mild\", \"thick grey\" and \"bleeds easily if touched\" not modelled | `Diagnose possible diphtheria from fever page` |\n| Tick = Yes → tick bite fever likely | Fever **and** (tick bite or tick infestation) | `Diagnose probable tick bite fever` |\n| Tick = No → any of headache, body pain, recent common cold → acute viral infection likely | Fever **and** tick bite and tick infestation all recorded No **and** any of headache, generalized aches and pains, recent common cold | `Diagnose probable acute viral infection from fever page` |\n| None of above → dipstick, TB, HIV, return/refer | Routing to other pages and advice | — (cross-reference / management) |\n\n## Notes\n\n- \"Not needing urgent attention\", \"none of the above\" and \"previous malaria test/s negative\" are\n  sequencing preconditions that are not modelled; the lower rules can fire alongside the red box.\n- Management lines in the red box and in the tick-bite-fever box are not modelled (no `manage`\n  tasks in this pass).\n", "questions": "# Page 38 – Fever: remaining questions\n\n## Decisions made\n\n- **Fever term.** Every rule's fever condition is `(or (active_condition Fever) (>= Body temperature\n  38 °C))`, following the page's definition (\"temperature ≥ 38°C now or in the past 3 days\").\n  `active_condition Fever` covers the common symptom; the temperature comparison covers a measured\n  fever.\n- **Shock/SBP < 80** is encoded on this page only, as an `or` of `Shock` (disorder) and systolic BP\n  < 80 (decision for all pages). Footnote 1 (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30,\n  confusion/restlessness, weakness, shock likely\") is not built into a shock definition. Its and/or\n  reading is ambiguous, and SBP < 80 alone already makes the patient urgent.\n- **Seizure.** \"Having/just had a seizure\" is the `Seizure` warning-sign finding. `Post-ictal state`\n  was not added (the other build added it; left as a question below).\n- **Confused** = `Acute confusion` (a warning sign). SNOMED has no plain `Confusion` finding. The\n  alternative was `Clouded consciousness`.\n- **Purple/red rash** = `Purpuric rash`.\n- **Easy bleeding** = `Finding of tendency to bleed` (the parent of `Bleeds easily`), and **bruising** =\n  `Easy bruising`.\n- **Severe abdominal or back pain** = `Abdominal pain` and `Backache`, each with the `Severe (severity\n  modifier)` qualifier.\n- **Meningitis likely / appendicitis likely** are `probable` rules (fever and the red-box items on\n  that line). The urgent rule references them through `active_condition`, following Will's pattern.\n- **Appendicitis** uses the page's word (`Appendicitis`) rather than the vocabulary's `Acute\n  appendicitis`.\n- **Tick bite fever** = `South African tick-bite fever`, the SNOMED name closest to the page term.\n  \"Tick present\" = `Infestation caused by Ixodidae` or `Infestation caused by Argasidae`.\n  (Reconciled: the other build used the parent `Spotted fever group rickettsial disease`; left as a\n  question below.)\n- **Acute viral infection likely** (the tick question's No branch) requires the tick bite and both tick\n  infestations to be recorded No, plus any of headache, body pain (`Generalized aches and pains`)\n  or recent common cold (`Common cold` + `Recent`).\n- **Mpox and diphtheria** are `possible` rules (\"consider\").\n- **Two check_for tasks:** one for the red box, one for the \"not needing urgent attention\" approach,\n  both triggered by fever.\n\n## Could not model\n\n- **\"Or in the past 3 days\"** (fever definition): a measurement cannot be compared with a time\n  window. Only the current temperature counts, so the rules may fire less often than intended (a\n  fever recorded only as a past measurement is missed unless the Fever finding is recorded).\n- **\"Not needing urgent attention\", \"None of the above, or previous malaria test/s negative\"**: these\n  sequencing preconditions are not modelled. The mpox, diphtheria, tick-bite-fever and viral rules\n  can fire alongside the urgent rule (more often than intended).\n- **\"Unexplained\" rash/lesion** (mpox): not modelled, so the rule fires more often.\n- **Diphtheria: \"mild\" fever, \"thick grey\" layer, \"bleeds easily if touched\"**: not modelled. The\n  rule requires sore throat, fever and a pseudomembrane in the nose or throat, so it fires more often.\n- **Abacavir → check for AHR (131)**: a pointer to page 131. It is not encoded here.\n- **Glucose < 3 (< 4 if diabetes) or ≥ 11.1 → 19** sits in the management list and is a pointer.\n- **\"If none of above\": urine dipstick (69), TB (102), HIV (124), return/refer advice**: routing and\n  management.\n- **Tick bite fever box** (\"May also have headache, body pain, rash or localised lymphadenopathy\",\n  treatment, refer/return advice): supporting features and management. Not encoded.\n\n## SNOMED gaps\n\n- **Having been in a malaria area in the past 3 months**: no concept (searched \"malaria\", \"malarial\",\n  \"travel\", \"endemic\", \"exposure\"). So \"consider malaria\" is **not encoded**. `Exposure to\n  (contextual qualifier)` + `Plasmodium` (organism) was rejected as a proxy, because exposure to the\n  organism is not the same as being in an area.\n- **Tick bite fever**: no concept with that name. `South African tick-bite fever` was used. The\n  alternatives were `African tick bite fever` and `Spotted fever group rickettsial disease` (the\n  common parent).\n- **Mpox**: the SNOMED name is `Monkeypox`.\n- **Diphtheria**: no plain concept. `Diphtheria caused by Corynebacterium diphtheriae` was used.\n- **Confusion** (finding): absent. `Acute confusion` was used.\n- **Lesion of skin/genitals/anus/rectum/mouth/eyes**: precoordinated concepts are used where they\n  exist: `Skin lesion`, `Lesion of genitalia`, `Lesion of rectum`, `Oral lesion`, `Lesion of eye` (all\n  disorders). The anus has no precoordinated concept, so it is `Lesion` (morphologic abnormality) with\n  finding site `Anal structure`. **Rash** is `Eruption` (morphologic abnormality), the form VHA's\n  vocabulary already uses.\n- **Throat**: `Pharyngeal structure`. **Nose**: `Nasal structure` (the alternative was `Nasal cavity structure`).\n- **Swollen lymph nodes**: `Lymphadenopathy` (disorder).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Does \"purple/red rash\" mean only a purpuric (non-blanching) rash, or any red rash with fever?\n- Does \"Tick bite fever\" in South Africa map better to `South African tick-bite fever` (R. conorii),\n  `African tick bite fever` (R. africae), or their parent `Spotted fever group rickettsial disease`?\n- Should the acute-viral-infection rule require the tick question to be answered No explicitly, as\n  encoded? If not, it would also fire for patients never asked about ticks.\n- How should \"been in a malaria area in past 3 months\" be recorded so that a malaria rule can use it?\n- Is footnote 1 (shock likely) everity": "medium"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Diagnose probable acute viral infection from fever page", "text": "The page reaches this box only after 'If none of the above' (no urgent signs, no AHR, no mpox or diphtheria criteria) and after the tick-bite No branch. The rule excludes tick bite but not the urgent, mpox or diphtheria findings, so a febrile patient with neck stiffness and headache gets both probable Meningitis and probable Acute viral disease. Low because the probable Meningitis rule and Urgent evaluation still fire.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "(missing) possible Hypersensitivity to abacavir", "text": "'If on abacavir, check for abacavir hypersensitivity reaction' has no rule. (snomed_concept \"Hypersensitivity to abacavir\" \"finding\") exists; whether 'on abacavir' is expressible is unclear, and the line routes to page 131, so this may be cross-reference only.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "all rules (fever trigger)", "text": "The page's fever definition includes 'temperature >= 38°C ... in the past 3 days'; the trigger only uses a current measurement >= 38 or a recorded Fever complaint. The time window could be expressed with onset/time_ago but is not. Minor because (active_condition Fever) covers the common case.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Check for causes of fever not needing urgent attention", "text": "The tick-bite question tells the nurse to look for a 'small dark brown/black scab' (eschar). Eschar is not checked for, so a nurse who records the eschar rather than 'Tick bite' will not reach probable tick bite fever.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "high", "ref": "Urgent: fever with red-box danger signs", "text": "Meningitis and appendicitis enter via active_condition of a system-diagnosed probable condition; stiff neck, drowsy, confusion, purpuric rash and RLQ tenderness are not in the priority rule directly. If system diagnoses do not feed active_condition, those red-box items never trigger Urgent.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Diagnose probable meningitis from fever page", "text": "'Purple/red rash' only partly encoded: red non-purpuric rash missing; page also lists drowsy/confused as alternatives to neck stiffness, fine.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tick bite fever / acute viral infection", "text": "Page applies these only to patients not needing urgent attention and after mpox/diphtheria/malaria considerations; rules are not gated, so they fire alongside urgent signs.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Task: Check for urgent fever conditions", "text": "check_for lacks SBP<80 and RR>=30 measurements used by the priority rule; no rule for malaria or abacavir AHR.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Diagnose possible diphtheria from fever page", "text": "'Bleeds easily' feature not encoded and 'mild fever' ignored; low impact.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "(page-level)", "text": "No possible Malaria rule for 'If patient has been in a malaria area in past 3 months, consider malaria'. This is a ria test/s negative') is not represented, so these probable rules can fire alongside possible mpox, diphtheria or malaria. This is acceptable as flowchart routing.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Check for causes of fever not needing urgent attention", "text": "Two page instructions in this section have no rule at all: 'If patient has been in a malaria area in past 3 months, consider malaria' (p38-2d9a1b25) should give a possible Malaria diagnosis with a travel/exposure check, and 'If on abacavir, check for abacavir hypersensitivity reaction' (p38-2172e4f3) is not checked for. Also, the page scopes this section to patients not needing urgent attention and (for the tick/viral branch) 'none of the above'; the task triggers on any fever, which is a tolerable simplification but should be recorded.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Urgent: fever with red-box danger signs", "text": "Urgent is justified by 'Give urgent attention' and the (and fever (or ...)) structure, with meningitis/appendicitis via active_condition, follows the house standard. Gap: footnote 1 (p38-d50f2820) says 'If SBP < 80, pulse >= 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely' - an 'X likely' on the page with no probable Shock diagnosis rule; the priority rule only matches a recorded Shock finding or SBP < 80, so a febrile patient with pulse >= 100 + RR > 30 + confusion (no BP reading) is not escalated by this page.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 38, "slug": "38-fever", "kind": "rule", "priority": "medium", "ref": "Check for urgent fever conditions", "text": "check_for omits respiratory rate >= 30 and systolic BP < 80, which are red-box items (they appear only in the priority rule).", "detail": [{"checker": "backward- // ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);

  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);

  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};

  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,

  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });

}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));

    i++;
  }

})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
