s\"\n  adult\n  (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n  (check_for\n    ;; Bladder or bowel disturbance (retention or incontinence)\n    (clinical_finding (snomed_concept \"Retention of urine\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Urinary incontinence\" \"finding\"))\n    (clinical_finding (snomed_concept \"Incontinence of feces\" \"finding\"))\n\n    ;; Numbness of buttocks, perineum or legs\n    (clinical_finding (snomed_concept \"Numbness of saddle area\" \"finding\"))\n    (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\"))\n\n    ;; Leg weakness or difficulty walking\n    (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\"))\n    (clinical_finding (snomed_concept \"Difficulty walking\" \"finding\"))\n\n    ;; Recent injury\n    (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))\n\n    ;; Sudden onset severe upper abdominal pain with nausea/vomiting: pancreatitis likely\n    (clinical_finding (snomed_concept \"Upper abdominal pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n\n    ;; Flank pain (then urine dipstick) and the features of complicated pyelonephritis / kidney stone\n    (clinical_finding (snomed_concept \"Flank pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Flank pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Radiating pain\" \"finding\") (finding_site (snomed_concept \"Inguinal region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Male\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Postmenopausal state\" \"finding\"))\n\n    ;; Pulsatile abdominal mass: abdominal aortic aneurysm likely\n    (clinical_finding (snomed_concept \"Pulsatile mass of abdomen\" \"finding\"))\n\n    ;; Known cancer patient\n    (clinical_finding (snomed_concept \"Malignant neoplastic disease\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n  )\n)\n(task\n  \"Check urine dipstick in back pain with flank pain\"\n  adult\n  (and (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n       (clinical_finding (snomed_concept \"Flank pain\" \"finding\")))\n  (check_for\n    (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n    (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\"))\n    (clinical_finding (snomed_concept \"Blood in urine\" \"finding\"))\n  )\n)\n(task\n  \"Check for causes of back pain not needing urgent attention\"\n  adult\n  (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n  (check_for\n    ;; Unexplained rash or lesions (consider mpox)\n    (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\"))\n    (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Lesion of genitalia\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Lesion of rectum\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Oral lesion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Lesion of eye\" \"disorder\"))\n\n    ;; Q1: cough, weight loss, night sweats or fever\n    (clinical_finding (snomed_concept \"Cough\" \"finding\"))\n    (clinical_finding (snomed_concept \"Weight decreased\" \"finding\"))\n    (clinical_finding (snomed_concept \"Night sweats\" \"finding\"))\n\n    ;; Q2: pain progressive, previous cancer or back surgery, osteoporosis, oral steroid use, HIV, IV drug use, deformity\n    (clinical_finding (snomed_concept \"Backache\" \"finding\") (qualifier (snomed_concept \"Progressive\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"History of malignant neoplasm\" \"situation\"))\n    (clinical_finding (snomed_concept \"History of spinal surgery\" \"situation\"))\n    (clinical_finding (snomed_concept \"Osteoporosis\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Use of steroids\" \"finding\"))\n    (clinical_finding (snomed_concept \"Human immunodeficiency virus infection\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Intravenous drug user\" \"finding\"))\n    (clinical_finding (snomed_concept \"Deformity of spine\" \"finding\"))\n\n    ;; Q3: sleep disturbed by pain, morning stiffness\n    (clinical_finding (snomed_concept \"Sleep pattern disturbance\" \"finding\"))\n    (clinical_finding (snomed_concept \"Stiff back\" \"finding\") (qualifier (snomed_concept \"Morning\" \"qualifier value\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable pancreatitis in back pain\"\n  (diagnosis\n    (snomed_concept \"Acute pancreatitis\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Upper abdominal pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (or (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n        (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable complicated pyelonephritis in back pain\"\n  (diagnosis\n    (snomed_concept \"Acute pyelonephritis\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Flank pain\" \"finding\"))\n    (or (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n        (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\")))\n    (or (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n        ;; sepsis (footnote 1): SBP < 80, pulse >= 100, respiratory rate > 30, confusion\n        (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80)\n        (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n        (> (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)\n        (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n        (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Male\" \"finding\"))\n        (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n        (clinical_finding (snomed_concept \"Postmenopausal state\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable kidney stone in back pain\"\n  (diagnosis\n    (snomed_concept \"Kidney stone\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Blood in urine\" \"finding\"))\n    (clinical_finding (snomed_concept \"Flank pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Radiating pain\" \"finding\") (finding_site (snomed_concept \"Inguinal region structure\" \"body structure\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable abdominal aortic aneurysm in back pain\"\n  (diagnosis\n    (snomed_concept \"Abdominal aortic aneurysm\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pulsatile mass of abdomen\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable uncomplicated pyelonephritis in back pain\"\n  (diagnosis\n    (snomed_concept \"Acute pyelonephritis\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Flank pain\" \"finding\"))\n    (or (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n        (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible mpox in back pain\"\n  (diagnosis\n    (snomed_concept \"Monkeypox\" \"disorder\")\n    possible\n  )\n  adult\n  (and\n    (or (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\"))\n        (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Lesion of genitalia\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Lesion of rectum\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Oral lesion\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Lesion of eye\" \"disorder\")))\n    (or (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n        (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n        (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\"))\n        (clinical_finding (snomed_concept \"Lymphadenopathy\" \"disorder\"))\n        (> (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38.5)\n        (clinical_finding (snomed_concept \"Fatigue\" \"finding\"))\n        (clinical_finding (snomed_concept \"Sore throat\" \"finding\"))\n        (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\"))\n        (clinical_finding (snomed_concept \"Cough\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible TB in back pain\"\n  (diagnosis\n    (snomed_concept \"Tuberculosis\" \"disorder\")\n    possible\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n    (or (clinical_finding (snomed_concept \"Cough\" \"finding\"))\n        (clinical_finding (snomed_concept \"Weight decreased\" \"finding\"))\n        (clinical_finding (snomed_concept \"Night sweats\" \"finding\"))\n        (active_condition (snomed_concept \"Fever\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable mechanical back pain\"\n  (diagnosis\n    (snomed_concept \"Mechanical low back pain\" \"finding\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n    ;; Q1 = No\n    (no (clinical_finding (snomed_concept \"Cough\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Weight decreased\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Night sweats\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Fever\" \"finding\")))\n    ;; Q2 = No (age > 50 years cannot be expressed)\n    (no (clinical_finding (snomed_concept \"Backache\" \"finding\") (qualifier (snomed_concept \"Progressive\" \"qualifier value\"))))\n    (<= (onset (clinical_finding (snomed_concept \"Backache\" \"finding\"))) (time_ago 6 weeks))\n    (no (clinical_finding (snomed_concept \"History of malignant neoplasm\" \"situation\")))\n    (no (clinical_finding (snomed_concept \"History of spinal surgery\" \"situation\")))\n    (no (clinical_finding (snomed_concept \"Osteoporosis\" \"disorder\")))\n    (no (clinical_finding (snomed_concept \"Use of steroids\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Human immunodeficiency virus infection\" \"disorder\")))\n    (no (clinical_finding (snomed_concept \"Intravenous drug user\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Deformity of spine\" \"finding\")))\n    ;; Q3 = No (age < 40 years, pain better with exercise, not better with rest cannot be expressed)\n    (no (clinical_finding (snomed_concept \"Sleep pattern disturbance\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Stiff back\" \"finding\") (qualifier (snomed_concept \"Morning\" \"qualifier value\"))))\n  )\n)\n(system_priority_evaluation\n  \"Urgent: back pain with red box features\"\n  adult\n  Urgent\n  (and\n    (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n    (or\n      (clinical_finding (snomed_concept \"Retention of urine\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Urinary incontinence\" \"finding\"))\n      (clinical_finding (snomed_concept \"Incontinence of feces\" \"finding\"))\n      (clinical_finding (snomed_concept \"Numbness of saddle area\" \"finding\"))\n      (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\"))\n      (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\"))\n      (clinical_finding (snomed_concept \"Difficulty walking\" \"finding\"))\n      (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))\n      (active_condition (snomed_concept \"Acute pancreatitis\" \"disorder\"))\n      ;; complicated pyelonephritis likely (written out: the diagnosis concept is shared with uncomplicated pyelonephritis)\n      (and\n        (clinical_finding (snomed_concept \"Flank pain\" \"finding\"))\n        (or (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n            (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\")))\n        (or (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n            (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80)\n            (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n            (> (measurement (snomed_concept \"Respiratory rate\ ache\" \"finding\") (snomed_concept \"No\" \"qualifier value\") (qualifier (snomed_concept \"Progressive\" \"qualifier value\"))))"}]}, "diagnosis": {"only_A": [], "only_B": ["(diagnosis (snomed_concept \"Acute pyelonephritis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Mechanical low back pain\" \"finding\") probable)"], "both": ["(diagnosis (snomed_concept \"Abdominal aortic aneurysm\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Acute pancreatitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Acute pyelonephritis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Kidney stone\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Monkeypox\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Tuberculosis\" \"disorder\") possible)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 78 – Back pain: flowchart\n\nSource: APC 2026 e-book page 78: red box, then \"Approach to patient with\nback pain not needing urgent attention\".\n\n```mermaid\nflowchart TD\n    START[\"Patient with back pain\"] --> RB{\"Red box: any of<br/>bladder/bowel disturbance, numbness of buttocks/perineum/legs,<br/>leg weakness/difficulty walking, recent injury and x-ray unavailable/abnormal,<br/>sudden severe upper abdominal pain with nausea/vomiting (pancreatitis likely),<br/>flank pain → dipstick (complicated pyelonephritis / kidney stone likely),<br/>pulsatile abdominal mass (AAA likely), known cancer patient?\"}\n    RB -- Yes --> URG[\"Give urgent attention. Manage and refer urgently\"]\n    RB -- No --> APP[\"Approach to patient not needing urgent attention\"]\n    APP --> PYE[\"Flank pain with leucocytes/nitrites:<br/>uncomplicated pyelonephritis likely\"]\n    APP --> MPX[\"Unexplained rash/lesions and ≥ 1 of headache/backache/body pain,<br/>swollen lymph nodes, T > 38.5°C, fatigue, sore throat/nasal congestion/cough:<br/>consider mpox → 40\"]\n    APP --> Q1{\"Any of: cough, weight loss,<br/>night sweats or fever?\"}\n    Q1 -- Yes --> TB[\"Check for TB → 102 and doctor: back x-ray, discuss/refer\"]\n    Q1 -- No --> Q2{\"Any of: > 50 years, pain progressive or for > 6 weeks,<br/>previous cancer or back surgery, osteoporosis, oral steroid use,<br/>HIV, IV drug use or deformity?\"}\n    Q2 -- Yes --> XR[\"Doctor to: do back x-ray; discuss results with specialist/refer\"]\n    Q2 -- No --> Q3{\"Any of: < 40 years, sleep disturbed by pain,<br/>pain better with exercise, does not get better with rest,<br/>morning stiffness lasting > 30 minutes?\"}\n    Q3 -- No --> MECH[\"Mechanical back pain likely\"]\n    Q3 -- Yes --> INFL[\"Inflammatory back pain likely (may also have fatigue)\"]\n    Q3 -- Unsure --> IBU[\"Give ibuprofen; refer to doctor\"]\n    INFL --> IBU\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Red box items | `check_for` of every red-box finding, triggered by Backache | `Check for urgent back pain conditions` |\n| \"If flank pain, check urine dipstick\" | dipstick findings checked when back pain and flank pain | `Check urine dipstick in back pain with flank pain` |\n| Sudden onset severe upper abdominal pain with nausea/vomiting | `probable` Acute pancreatitis | `Diagnose probable pancreatitis in back pain` |\n| Flank pain, leucocytes/nitrites and a complicating factor | `probable` Acute pyelonephritis (no SNOMED concept for \"complicated\"); urgency written from the criteria themselves | `Diagnose probable complicated pyelonephritis in back pain` |\n| Flank pain, blood, sudden severe one-sided pain radiating to groin | `probable` Kidney stone | `Diagnose probable kidney stone in back pain` |\n| Pulsatile abdominal mass | `probable` Abdominal aortic aneurysm | `Diagnose probable abdominal aortic aneurysm in back pain` |\n| Red box = Yes | Backache **and** any red-box item | `Urgent: back pain with red box features` |\n| Uncomplicated pyelonephritis | `probable` Acute pyelonephritis from flank pain and leucocytes/nitrites | `Diagnose probable uncomplicated pyelonephritis in back pain` |\n| Consider mpox | `possible` Monkeypox | `Diagnose possible mpox in back pain` |\n| Q1 = Yes → Check for TB | `possible` Tuberculosis | `Diagnose possible TB in back pain` |\n| Q2 = Yes → doctor x-ray | No diagnosis named on the page; not a rule. The Q2 findings are used as `(no …)` on the way to mechanical back pain | (none) |\n| Q1 = No, Q2 = No, Q3 = No | `probable` Mechanical low back pain, every Q1–Q3 item recorded as No | `Diagnose probable mechanical back pain` |\n| Q3 = Yes → Inflammatory back pain likely | Not modelled: no SNOMED concept for inflammatory back pain | (none; see remaining questions) |\n| Q3 = Unsure | Management only | (none) |\n\n## Notes\n\n- Age criteria (> 50 years, < 40 years) cannot be expressed in the language; see remaining questions.\n- \"For > 6 weeks\" is written as onset of backache at least 6 weeks ago; the No branch as onset\n  within the last 6 weeks (`<=`), since only `>=`/`<=` are accepted in onset comparisons.\n", "questions": "# Page 78 – Back pain: remaining questions\n\n## Decisions made\n\n- **Trigger.** Every task and the Urgent rule are anchored to the common symptom\n  `(clinical_finding (snomed_concept \"Backache\" \"finding\"))`.\n- **Urine dipstick** is a separate task, triggered by back pain **and** flank pain, as in \"If flank\n  pain, check urine dipstick\". It checks for leucocytes, nitrites and blood.\n- **Complicated pyelonephritis.** No SNOMED concept exists, so the probable rule diagnoses\n  `Acute pyelonephritis`. The Urgent rule writes out the page's criteria (flank pain, leucocytes or\n  nitrites, any of vomiting/sepsis/diabetes/pregnant/post menopause) instead of using\n  `(active_condition Acute pyelonephritis)`, because the uncomplicated rule (outside the red box)\n  diagnoses the same concept and would otherwise be made urgent.\n- **Male** (complicated pyelonephritis) is encoded as `(clinical_finding (snomed_concept \"Male\" \"finding\"))`\n  in the check_for, the complicated rule and the Urgent rule. If VHA records sex only\n  demographically it never matches, and those rules fire **less often** for men (see questions).\n- **Pancreatitis and AAA** probable rules include `Backache`, since the red box states them for\n  \"the patient with back pain\".\n- **Sepsis (footnote 1)** is encoded as this page's own logic: SBP < 80, pulse ≥ 100,\n  respiratory rate > 30, Acute confusion. No shared sepsis definition was built.\n- **Pancreatitis** is diagnosed as `Acute pancreatitis` (the page describes sudden onset);\n  plain `Pancreatitis` also exists.\n- **Kidney stone**: blood in urine **and** flank pain qualified Sudden onset + Severe + Unilateral\n  **and** Radiating pain with finding site Inguinal region structure.\n- **Numbness of buttocks, perineum** → `Numbness of saddle area`; legs → `Numbness of lower limb`.\n- **Recent injury** → `Traumatic injury` (descendants match).\n- **Check for TB** (Q1 = Yes) is a `possible` Tuberculosis rule.\n- **Mechanical back pain likely** (Q1, Q2 and Q3 all No) is a `probable` rule that needs each\n  Q1–Q3 item explicitly recorded as No, plus back pain onset within the last 6 weeks (written\n  `(<= (onset Backache) (time_ago 6 weeks))`, the No side of \"for > 6 weeks\"; only `>=`/`<=` are\n  accepted). The concept is `Mechanical low back pain` because \"Mechanical back pain\" doesn't exist. It is narrower (low back only).\n- **Osteoporosis and HIV** are checked for as plain disorders (no `Known present` qualifier), so that\n  their `(no …)` form in the mechanical rule matches the check_for.\n- **Uncomplicated pyelonephritis**: probable Acute pyelonephritis from flank pain and\n  leucocytes/nitrites. It also fires whenever the complicated rule fires (same concept, harmless).\n- **Mpox** (consider → `possible` Monkeypox): rash or skin lesion and ≥ 1 of the listed features.\n\n## Could not model\n\n- **Age** (> 50 years in Q2, < 40 years in Q3): the language has no age criterion. The mechanical\n  rule therefore fires **more often** than intended (it can't exclude patients over 50).\n  Inflammatory back pain isn't encoded at all (see SNOMED gaps).\n- **\"x-ray unavailable or abnormal\"** and **\"recent\"** (injury): not representable. The Urgent rule\n  fires **more often** (any recorded traumatic injury with back pain).\n- **\"Unexplained\"** rash: not expressible, so the mpox rule fires more often (any rash/lesion).\n  Anal lesions have no concept (genitals, rectum, mouth, eyes and skin are encoded), so it fires\n  less often for anal lesions only.\n- **\"Sleep disturbed by pain\"** → `Sleep pattern disturbance` (cause not expressible).\n  **\"Morning stiffness lasting > 30 minutes\"** → `Stiff back` qualified `Morning`; the duration is not expressible.\n- **\"Pain better with exercise\", \"does not get better with rest\"**: no concepts. They are not part of the\n  mechanical rule's No-conditions, so that rule can fire for patients with these features.\n- **Q2 = Yes → doctor back x-ray** and **Unsure** branches: management only, no diagnosis named.\n- \"May also have fatigue\": descriptive note, not encoded.\n\n## SNOMED gaps\n\n- Complicated pyelonephritis / uncomplicated pyelonephritis → `Acute pyelonephritis` (disorder).\n- Bowel retention: no fitting concept (constipation would be broader). Only urinary retention and both\n  incontinences encoded.\n- Numbness of buttock / perineum → `Numbness of saddle area`.\n- Pain radiating to groin → `Radiating pain` + finding site `Inguinal region structure`.\n- Mechanical back pain → `Mechanical low back pain` (finding).\n- Inflammatory back pain: none found (`Axial spondyloarthritis` is a disease, not this finding).\n  **The \"Inflammatory back pain likely\" rule is not encoded.**\n- Oral steroid use → `Use of steroids` (not route-specific).\n- Back surgery → `History of spinal surgery` (situation).\n- Lesion of anus (disorder): not found; anal lesions not encoded.\n- Weight loss → `Weight decreased`; body pain → `Generalized aches and pains`; mpox → `Monkeypox`.\n- Pain better with exercise, not better with rest, pain disturbing sleep: none.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\nThe checker doesn't match a qualified finding inside `(no …)`: the `no` form inserts\n`(snomed_concept \"No\" \"qualifier value\")` before the qualifier. These items are used as evidence\n(Q2/Q3 = No in \"Diagnose probable mechanical back pain\").\n\n- `CHECKED FOR BUT NEVER USED AS EVIDENCE`: `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Backache\" \"finding\") (qualifier (snomed_concept \"Progressive\" \"qualifier value\")))`\n- `CHECKED FOR BUT NEVER USED AS EVIDENCE`: `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stiff back\" \"finding\") (qualifier (snomed_concept \"Morning\" \"qualifier value\")))`\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR`: `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stiff back\" \"finding\") (snomed_concept \"No\" \"qualifier value\") (qualifier (snomed_concept \"Morning\" \"qualifier value\"))))`\n\n## Questions for a clinician\n\n- Should \"Recent injury\" be limited to back injury, or any injury?\n- Is \"Check for TB\" right as a possible TB diagnosis, or only a pointer to page 102?\n- Should mechanical back pain still be diagnosed when the health worker hasn't answered every Q1–Q3\n  item (the rule currently needs an explicit No for each)?\n- Is Acute pancreatitis acceptable for \"pancreatitis\", and Mechanical low back pain for \"mechanical back pain\"?\n- Does VHA record the patient's sex as a `Male` (finding)? If sex is demographic only, the \"male\"\n  factor for complicated pyelonephritis never matches and needs a different form.\n- Is `Traumatic injury` alone acceptable for \"recent injury and x-ray unavailable or abnormal\",\n  given that primary-care clinics usually cannot x-ray on the spot?\n- Mechanical back pain cannot exclude patients over 50 or under 40, or pain better with exercise /\n  not better with rest (no age criterion, no concepts), so it can also fire for patients the page\n  would route to x-ray or to inflammatory back pain. Should the rule stay, or be dropped until\n  these can be expressed?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent back pain conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Backache\" \"finding\"))", "element_keys": ["p78-039cfbc5"], "quote": "back pain"}, {"claim_id": "c002", "rule": "Check for urgent back pain conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Retention of urine\" \"disorder\"))", "element_keys": ["p78-40365d4f"], "quote": "retention"}, {"claim_id": "c003", "rule": "Check for urgent back pain conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Urinary incontinence\" \"finding\"))", "element_keys": ["p78-40365d4f"], "quote": "incontinence"}, {"claim_id": "c004", "rule": "Check for urgent back pain conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Incontinence of feces\" \"finding\"))", "element_keys": ["p78-40365d4f"], "quote": "incontinence"}, {"claim_id": "c005", "rule": "Check for urgent back pain conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"fi : "This decision node is used only negated, as the gate to mechanical back pain. It is correctly encoded: no progressive pain, onset within 6 weeks, no previous cancer, no back surgery, no osteoporosis, no steroid use (oral generalised to any), no HIV, no IV drug use, no deformity. Age > 50 is dropped, so patients over 50 can be labelled mechanical back pain. Its Yes branch (doctor x-ray) is routing and correctly produces no diagnosis.", "evidence": ["Diagnose probable mechanical back pain :: (no Backache+Progressive) (<= (onset Backache) (time_ago 6 weeks)) (no History of malignant neoplasm) (no History of spinal surgery) (no Osteoporosis) (no Use of steroids) (no HIV infection) (no Intravenous drug user) (no Deformity of spine)"], "confidence": "high"}, {"element_key": "p78-e0a40c28", "scope": "in_scope", "scope_reason": "", "verdict": "partial", "parts_missing": ["< 40 years (not representable; omitted)", "pain better with exercise (missing)", "pain does not get better with rest (missing)", "morning stiffness duration > 30 minutes (only 'Stiff back' + Morning)", "the Yes branch to inflammatory back pain (missing; see p78-078a3526)"], "problem": "Only two of the five inflammatory features are negated in the mechanical rule: Sleep pattern disturbance (broader than 'sleep disturbed by pain') and morning stiff back. 'Better with exercise' and 'not better with rest' are neither checked for nor used, so the mechanical rule fires for patients with inflammatory features. No rule handles the Yes or Unsure branches.", "evidence": ["Diagnose probable mechanical back pain :: (no (clinical_finding (snomed_concept \"Sleep pattern disturbance\" \"finding\"))) (no (clinical_finding (snomed_concept \"Stiff back\" \"finding\") (qualifier (snomed_concept \"Morning\" \"qualifier value\"))))"], "confidence": "high"}, {"element_key": "p78-078a3526", "scope": "in_scope", "scope_reason": "", "verdict": "missing", "parts_missing": ["probable inflammatory back pain rule (closest SNOMED: A <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;

// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.

}

const ruleSource = (() => {

    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
