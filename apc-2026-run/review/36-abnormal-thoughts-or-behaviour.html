36, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "intoxication likely", "bbox": [350.2, 338.1, 416.2, 349.1], "key": "p36-4d48d28e"}, {"id": "p36-rb1-e38", "page": 36, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "Give thiamine 200mg IM.", "bbox": [449.0, 338.3, 516.7, 359.1], "key": "p36-863ac997"}, {"id": "p36-rb1-e39", "page": 36, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Psychosis likely", "bbox": [236.1, 348.1, 295.7, 359.1], "key": "p36-1546eb2b"}, {"id": "p36-rb1-e40", "page": 36, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "If pulse irregular, chest pain or BP ≥ 140/90, do ECG and discuss with specialist or local poison helpline 200.", "bbox": [339.2, 348.3, 428.8, 409.1], "key": "p36-0391ed5c"}, {"id": "p36-rb1-e41", "page": 36, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "If alcohol withdrawal, also give thiamine 200mg IM and oral rehydration solution.", "bbox": [562.9, 348.3, 692.1, 379.1], "key": "p36-12f5ea48"}, {"id": "p36-rb1-e42", "page": 36, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Poisoning likely Discuss urgently with specialist or local poison helpline 200.", "bbox": [727.0, 348.1, 788.2, 409.1], "key": "p36-855ac708"}, {"id": "p36-rb1-e43", "page": 36, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "Give sodium chloride 0.9% 1L 6 hourly.", "bbox": [449.0, 358.3, 526.3, 389.1], "key": "p36-1fa4180d"}, {"id": "p36-rb1-e44", "page": 36, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "If ≥ 8 hours since last alcohol, refer for alcohol detoxification programme.", "bbox": [562.9, 378.3, 685.8, 409.1], "key": "p36-5767195c"}, {"id": "p36-rb1-e45", "page": 36, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with abnormal thoughts or behaviour and any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "Check for head injury.", "bbox": [449.0, 388.3, 537.8, 399.1], "key": "p36-286ca926"}, {"id": "p36-rb1-e46", "page": 36, "box": 1, "kind_hint": "other", "section": "Manage urgently:", "section_y": 122.7, "indent": 0, "parent": null, "text": "Refer urgently unless:", "bbox": [51.2, 414.7, 133.7, 425.7], "key": "p36-5901c4c8"}, {"id": "p36-rb1-e47", "page": 36, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 122.7, "indent": 1, "parent": null, "text": "Patient with known schizophrenia who is otherwise well, give routine schizophrenia care 162.", "bbox": [51.2, 424.9, 422.3, 435.7], "key": "p36-30912b6c"}, {"id": "p36-rb1-e48", "page": 36, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 122.7, "indent": 1, "parent": null, "text": "Patient with diabetes and low glucose on insulin. If abnormal thoughts/behaviour resolves with dextrose, no need to refer, give routine diabetes care 145.", "bbox": [51.2, 434.9, 651.7, 445.7], "key": "p36-61e931a3"}, {"id": "p36-rb1-e49", "page": 36, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 122.7, "indent": 1, "parent": null, "text": "Patient with known alcohol use who is otherwise well. If abnormal thoughts/behaviour resolves once sober, no need to refer 165.", "bbox": [51.2, 444.9, 558.0, 455.7], "key": "p36-83566ce2"}, {"id": "p36-out-e01", "page": 36, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "ABNORMAL THOUGHTS OR BEHAVIOUR", "bbox": [258.0, 48.7, 583.3, 71.0], "key": "p36-330b4924"}, {"id": "p36-out-e02", "page": 36, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with abnormal thoughts or behaviour not needing urgent attention • If for at least 6 months ≥ 1 of: memory problems, disorientation, language difficulty, less able to cope with daily activities and work/social function, consider dementia 166. • If unsure of diagnosis, refer for further assessment.", "bbox": [50.7, 482.9, 692.6, 514.1], "key": "p36-ee7af581"}, {"id": "p36-out-e03", "page": 36, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If severe penicillin allergy (previous angioedema, anaphylaxis or urticaria), discuss with doctor. Do not mix Ringer's lactate and IV ceftriaxone. 2Stimulants include: methamphetamines (tik), cocaine (crack), methaqualone (mandrax), cannabis.", "bbox": [33.7, 543.5, 766.6, 552.0], "key": "p36-8cb634e4"}], "boxes": [{"box": 1, "rect": [35.2, 86.7, 806.4, 460.9]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAMNCAIAAACtTDScAAAACXBIWXMAABcSAAAXEgFnn9JSAAPkj0lEQVR4nOy9Z1BVyfvv+6tz6tate855cV/dc178q5RNFATJqICKKEFFFDNiwJzAhAlzzjqKymBAUcGAWRBBRAFBJCiCcUQxi4qomNBxZt8HHuxZrr1ZexNmkPFb9Slrre5evZ5++lnL3V+6e/3n1X8ZAQAAAAAAAAAAAADQtPhPo1sAAAAAAAAAAAAAAEBtgaoFAAAAAAAAAAAAAJoef6larx1bv/HyBAAAAAAAAAAAAADgx+S1azstqtannWvUv18HAAAAAAAAAAAAAODH5EtmLFQtAAAAAAAA s-or-behaviour-flowchart.md for how each box on the page maps to these rules.\n(task\n  \"Check for urgent abnormal thoughts or behaviour conditions\"\n  adult\n  (or (clinical_finding (snomed_concept \"Abnormal behavior\" \"finding\"))\n      (clinical_finding (snomed_concept \"Disturbance in thinking\" \"finding\")))\n  (check_for\n    ;; Red box: sudden or recent onset\n    (clinical_finding (snomed_concept \"Abnormal behavior\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Disturbance in thinking\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Abnormal behavior\" \"finding\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Disturbance in thinking\" \"finding\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n\n    ;; Consider stroke or TIA\n    (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n\n    ;; Delirium\n    (clinical_finding (snomed_concept \"Fluctuation of level of consciousness\" \"finding\"))\n\n    ;; Mania\n    (clinical_finding (snomed_concept \"Elevated mood\" \"finding\"))\n    (clinical_finding (snomed_concept \"Increased energy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pressure of speech\" \"finding\"))\n    (clinical_finding (snomed_concept \"Feeling irritable\" \"finding\"))\n\n    ;; Psychosis\n    (clinical_finding (snomed_concept \"Lack of insight\" \"finding\"))\n    (clinical_finding (snomed_concept \"Hallucinations\" \"finding\"))\n    (clinical_finding (snomed_concept \"Delusion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Incoherent speech\" \"finding\"))\n\n    ;; Stimulant drug intoxication\n    (clinical_finding (snomed_concept \"Dilated pupil\" \"finding\"))\n    (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Paranoid ideation\" \"finding\"))\n    (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Sweating\" \"finding\"))\n\n    ;; Alcohol intoxication\n    (clinical_finding (snomed_concept \"Smell of alcohol on breath\" \"finding\"))\n    (clinical_finding (snomed_concept \"Slurred speech\" \"finding\"))\n    (clinical_finding (snomed_concept \"Incoordination\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unsteady when walking\" \"finding\"))\n\n    ;; Alcohol/drug withdrawal\n    (clinical_finding (snomed_concept \"Stopped drinking alcohol\" \"finding\"))\n    (clinical_finding (snomed_concept \"Decreased alcohol consumption\" \"finding\"))\n    (clinical_finding (snomed_concept \"Abstinent from drug misuse\" \"finding\"))\n    (clinical_finding (snomed_concept \"Tremor\" \"finding\"))\n    (clinical_finding (snomed_concept \"Restless t needing urgent attention\"]\n    URG --> MU[\"Manage urgently (seizure 20, aggressive 35, head injury 30,<br/>suicidal 34, oxygen, glucose 19, fluids, involuntary admission 158, crypto LP)\"]\n    MU --> ST{\"New sudden asymmetric weakness/numbness of face/arm/leg,<br/>difficulty speaking or visual disturbance?\"}\n    ST -- Yes --> STR[\"Consider stroke or TIA 152\"]\n    MU --> LF[\"Look for delirium, mania, psychosis, intoxication, withdrawal or poisoning\"]\n    LF --> B1[\"Varying levels of consciousness over hours/days<br/>and temperature ≥ 38°C\"] --> D1[\"Delirium likely\"]\n    LF --> B2[\"Abnormally happy, energetic, talkative, irritable or reckless\"] --> D2[\"Mania likely\"]\n    LF --> B3[\"Lack of insight with ≥ 1 of: hallucinations, delusions,<br/>disorganised speech or behaviour\"] --> D3[\"Psychosis likely\"]\n    LF --> B4[\"Dilated pupils, restlessness, paranoia, nausea,<br/>sweating, pulse ≥ 100, BP ≥ 140/90\"] --> D4[\"Stimulant drug intoxication likely\"]\n    LF --> B5[\"Smells of alcohol, slurred speech, incoordination, unsteady gait\"] --> D5[\"Alcohol intoxication likely\"]\n    LF --> B6[\"Known alcohol/drug user who has stopped/reduced intake with tremor,<br/>sweating, nausea, severe restlessness/agitation or hallucinations\"] --> D6[\"Alcohol/drug withdrawal likely\"]\n    LF --> B7[\"Exposure via ingestion/inhalation/absorption of<br/>medication/unknown substance\"] --> D7[\"Poisoning likely\"]\n    LF --> REF[\"Refer urgently unless (known schizophrenia, hypoglycaemia on insulin, known alcohol use)\"]\n    NU --> DM{\"For at least 6 months ≥ 1 of: memory problems, disorientation,<br/>language difficulty, less able to cope with daily activities and work/social function?\"}\n    DM -- Yes --> DEM[\"Consider dementia 166\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Complaint | Abnormal behavior **or** Disturbance in thinking | trigger of `Check for urgent abnormal thoughts or behaviour conditions`; first conjunct of every rule below |\n| RB = Yes | complaint with Sudden onset **or** Recent qualifier | `Urgent: abnormal thoughts or behaviour of sudden or recent onset` |\n| ST = Yes | any sudden-onset weakness/numbness of face, upper limb, lower limb, difficulty talking, visual disturbance | `Diagnose possible stroke in abnormal thoughts or behaviour`, `Diagnose possible TIA in abnormal thoughts or behaviour` |\n| B1 → D1 | Fluctuation of level of consciousness **and** temperature ≥ 38 °C | `Diagnose probable delirium in abnormal thoughts or behaviour` |\n| B2 → D2 | any of Elevated mood, Increased energy, Pressure of speech, Feeling irritable (reckless: no concept) | `Diagnose probable mania in abnormal thoughts or behaviour` |\n| B3 → D3 | Lack of insight **and** any of Hallucinations, Delusion, Incoherent speech | `Diagnose probable psychosis in abnormal thoughts or behaviour` |\n| B4 → D4 | any of dilated pupil, restlessness, paranoid ideation, nausea, sweating, pulse ≥ 100, systolic ≥ 140, diastolic ≥ 90 | `Diagnose probable stimulant drug intoxication in abnormal thoughts or behaviour` |\n| B5 → D5 | any of smell of alcohol on breath, slurred speech, incoordination, unsteady when walking | `Diagnose probable alcohol intoxication in abnormal thoughts or behaviour` |\n| B6 → D6 | (stopped drinking / decreased alcohol consumption / abstinent from drug misuse) **and** any of tremor, sweating, nausea, severe restlessness, severe agitation, hallucinations | `Diagnose probable alcohol/drug withdrawal in abnormal thoughts or behaviour` |\n| B7 → D7 | exposure to Drug or medicament **or** to Substance (unknown) | `Diagnose probable poisoning in abnormal thoughts or behaviour` |\n| DM = Yes | onset ≥ 6 months ago of any of memory impairment, disorientated, language difficulty, difficulty coping | `Diagnose possible dementia in abnormal thoughts or behaviour` |\n| Manage urgently / Refer urgently unless | management and cross-references only | not encoded (`management_step` / `cross_reference_only`) |\n", "questions": "# Page 36 – Abnormal thoughts or behaviour: remaining questions\n\n## Decisions made\n\n- **Presenting complaint** is `Abnormal behavior` (finding) **or** `Disturbance in thinking` (finding), used as the\n  trigger of the check task and as the first conjunct of every rule. It is not a recorded common symptom or\n  warning sign, so the task fires only if one of these is recorded.\n- **Recent onset** is the `Recent` qualifier value on the complaint. SNOMED has no \"Recent onset\" qualifier, and\n  the page gives no time window that would allow an onset comparison. **Sudden onset** uses `Sudden onset`.\n- **Priority:** only the two red-box items (sudden or recent onset) set `Urgent`. The \"likely\" boxes under\n  \"Manage urgently\" do not add priorities of their own. (`Poisoning` is already a Very urgent warning sign.)\n- **Every \"likely\" box is a `probable` rule conjoined with the complaint**, because the boxes sit inside the red\n  box for patients with abnormal thoughts or behaviour.\n- **Lists with no quantifier** (mania, stimulant intoxication, alcohol intoxication boxes) are read as \"any of\".\n  Only the psychosis box says \"≥ 1 of\" explicitly.\n- **Delirium** needs fluctuating consciousness **and** temperature ≥ 38 °C, as the box writes \"and\".\n- **BP ≥ 140/90** is read as systolic ≥ 140 **or** diastolic ≥ 90, following Will's convention for BP pairs.\n- **Withdrawal:** one rule for `Substance withdrawal syndrome` (`Alcohol withdrawal syndrome` is a descendant).\n  \"Known alcohol/drug user who has stopped/reduced intake\" is `Stopped drinking alcohol`, `Decreased alcohol\n  consumption` or `Abstinent from drug misuse`. \"Severe\" is applied to both restlessness and agitation.\n- **Poisoning:** exposure to `Drug or medicament` or, for \"unknown substance\", to the generic `Substance`.\n- **\"Consider stroke or TIA\"** and **\"consider dementia\"** are encoded as `possible` rules. \"New sudden\" is the\n  `Sudden onset` qualifier. \"For at least 6 months\" is `(>= (onset …) (time_ago 6 months))`.\n- No `measure` task: pulse, BP, temperature and glucose are routine vitals.\n- **Arm/leg** weakness and numbness (stroke/TIA bullet) are written as separate upper-limb and lower-limb\n  concepts (`Muscle weakness of upper limb`, `Weakness of muscle of lower limb`, `Numbness of upper limb`,\n  `Numbness of lower limb`), matching the page's \"arm/leg\", rather than one generic limb concept.\n- **Reconciled build:** this is builder B's build, with B's encodings kept for every difference from builder A\n  (see `reconcile.json`). Builder A's stand-ins for \"reckless\" (`Disinhibited behavior`), \"disorganised\n  speech\" (`Disorganized thinking`) and \"disorganised behaviour\" (`Bizarre behavior`) were not used.\n\n## Could not model\n\n- **\"asymmetric\"** weakness/numbness (stroke/TIA bullet): the language has no laterality comparison, so any\n  sudden-onset weakness or numbness counts. The possible rules may fire **more often** than the page intends.\n- **Route of exposure** (ingestion/inhalation/absorption) is not modelled: any exposure counts.\n- **\"Unknown substance\"** as the generic `Substance`: descendant matching makes it match exposure to *any*\n  substance (e.g. a food recorded for page 20), so the poisoning rule may fire **more often** than intended.\n- **\"over hours/days\"** (delirium) is taken as implied by `Fluctuation of level of consciousness`; no time comparison.\n- **\"Known\" user** is not a separate condition: having stopped or reduced intake is taken to imply it.\n- **Manage urgently** steps (oxygen, fluids, glucose → 19, involuntary admission, LP referral), drug doses in\n  the boxes, \"Check for head injury\", ECG advice and the \"Refer urgently unless\" exceptions are management.\n\n## SNOMED gaps\n\n- **\"reckless\"** (mania box): only `Reckless character` / `Reckless driving` exist (traits or specific\n  behaviours). Not encoded, so the mania rule may fire **less often**.\n- **\"talkative\"**: no concept; `Pressure of speech` used (narrower). `Logorrhea` was the alternative.\n- **\"Disorganised speech\"**: no concept; `Incoherent speech` used. **\"Disorganised behaviour\"**: no concept;\n  not encoded (`Bizarre behavior` was considered and rejected as a different idea).\n- **Reduced (not stopped) drug intake**: no concept; only `Abstinent from drug misuse` is encoded.\n- **\"less able to cope with daily activities and work/social function\"**: no direct concept; `Difficulty coping`\n  used.\n- **\"Recent onset\"** qualifier: none; `Recent` used.\n- **\"Psychosis\"** (disorder): no concept; `Psychotic disorder` used.\n- **\"Abnormal thoughts or behaviour\"**: no single concept; `Abnormal behavior` or `Disturbance in thinking` used.\n- **\"Disorientation\"**: the FSN is `Disorientated`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the stimulant box need more than one feature? With \"any of\", nausea or sweating alone in a patient\n  with abnormal behaviour gives probable stimulant intoxication.\n- Should delirium really need fever? The box joins fluctuating consciousness and temperature ≥ 38 °C with \"and\".\n- Should a probable delirium, psychosis, mania, intoxication or withdrawal diagnosis by itself make the patient\n  Urgent, even without a recorded sudden or recent onset?\n- \"reckless\" (mania) and \"disorganised behaviour\" (psychosis) are not encoded for lack of a matching concept.\n  Would `Disinhibited behavior` (for reckless) or `Bizarre behavior` (for disorganised behaviour) be acceptable\n  stand-ins? Without them, mania and psychosis fire **less often** than the page intends.\n- \"Disorganised speech\" is encoded as `Incoherent speech`. Is that right, or is `Disorganized thinking` (the\n  thought disorder that disorganised speech expresses) the better concept?\n- Should exposure to any substance count toward probable poisoning, or only medication and truly unknown\n  substances?\n- Is `Recent` an acceptable recording of \"recent onset\", or should a time window (e.g. onset within 2 weeks) be set?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent abnormal thoughts or behaviour conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abnormal behavior\" \"finding\"))", "element_keys": ["p36-cf86a3e4"], "quote": "abnormal thoughts or behaviour"}, {"claim_id": "c002", "rule": "Check for urgent abnormal thoughts or behaviour conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Disturbance in thinking\" \"finding\"))", "element_keys": ["p36-cf86a3e4"], "quote": "abnormal thoughts or behaviour"}, {"claim_id": "c003", "rule": "Check for urgent abnormal thoughts or behaviour conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abnormal behavior\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "element_keys": ["p36-2765dde2"], "quote": "Sudden onset of abnormal thoughts or behaviour"}, {"claim_id": "c004", "rule": "Check for urgent abnormal thoughts or behaviour conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Disturbance in thinking\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "element_keys": ["p36-2765dde2"], "quote": "Sudden onset of abnormal thoughts or behaviour"}, {"claim_id": "c005", "rule": "Check for urgent abnormal thoughts or behaviour conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abnormal behavior\" \"finding\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))", "element_keys": ["p36-48cbdcc4"], "quote": "Recent onset of abnormal thoughts or behaviour"}, {"claim_id": "c006", " ven active_condition alternates to the priority rule's 'or' would close this.", "severity": "medium"}, {"rule": "Diagnose probable stimulant drug intoxication in abnormal thoughts or behaviour", "problem": "The comma list is encoded as a flat 'or', so a single non-specific finding (Nausea, which is a common symptom; Sweating; Restlessness; or a BP of 140/90 alone) plus abnormal behaviour yields a PROBABLE stimulant intoxication. Nausea, Sweating and Restlessness are also withdrawal findings, so the same patient is simultaneously probable withdrawal if any stopped/decreased finding is present. The page shows a cluster; any2 (available in the language) would be a more faithful reading. The same flat-'or' choice in the mania and alcohol-intoxication rules is less harmful because those findings are specific.", "severity": "medium"}, {"rule": "Diagnose probable stimulant drug intoxication (pulse measurement)", "problem": "Pulse is compared via (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm). SNOMED also has Heart rate (observable entity); whichever concept VHA records as the routine vital is the only one that will ever match. The gold page gives no precedent for pulse. Worth confirming against the recorded vital, otherwise the 'pulse >= 100' arm is dead.", "severity": "medium"}, {"rule": "Diagnose possible dementia in abnormal thoughts or behaviour / check_for", "problem": "The four dementia findings are in check_for but are consumed only inside (onset ...) wrappers in a possible rule. Evidence matching in the house tests is by exact s-expression string, so if the wrapped form does not count as 'used as evidence' the gate will flag four CHECKED FOR BUT NEVER USED items. Also, Difficulty coping is the wrong concept for functional decline (see p36-out-e02).", "severity": "low"}, {"rule": "Check for urgent abnormal thoughts or behaviour conditions (Restlessness)", "problem": "Restlessness is checked for twice, plain (for stimulant intoxication) ng\" \"finding\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}], "rules": [{"rule": "Check for urgent abnormal thoughts or behaviour conditions", "verdict": "problem", "severity": "medium", "problem": "Type and trigger are right and the listed findings all trace to the page, but the red box is not fully covered: 'If HIV positive with recent positive cryptococcal antigen test, refer for urgent lumbar puncture' is a page-specific urgent criterion with no finding anywhere in the file ('Antigen of Cryptococcus' (substance) exists for a test-result finding); 'reckless' (mania box) and 'disorganised behaviour' (psychosis box) are not checked for; the stroke/TIA findings lack the page's 'asymmetric' qualifier; 'reduced' drug intake (withdrawal box) has no finding (only Abstinent from drug misuse). Seizure, aggressive/disruptive, recent head injury and suicidal thoughts are cross-page referrals and may be covered by warning signs elsewhere, but nothing on this page records them."}, {"rule": "Diagnose possible stroke in abnormal thoughts or behaviour", "verdict": "problem", "severity": "low", "problem": "'possible' matches 'consider stroke' and the and/or shape matches the page sentence, but every weakness/numbness finding drops 'asymmetric' (page: 'new sudden asymmetric weakness or numbness of face/arm/leg'); add the Unilateral qualifier."}, {"rule": "Diagnose possible TIA in abnormal thoughts or behaviour", "verdict": "problem", "severity": "low", "problem": "Same as the stroke rule: 'asymmetric' is dropped. Otherwise 'possible' for 'consider ... TIA' is right."}, {"rule": "Diagnose probable delirium in abnormal thoughts or behaviour", "verdict": "ok", "severity": "low", "problem": ""}, {"rule": "Diagnose probable mania in abnormal thoughts or behaviour", "verdict": "problem", "severity": "low", "problem": "'probable' for 'Mania likely' and the 'or' match the page ('Abnormally happy, energetic, talkative, irritable or reckless'), but the fifth item 'reckless' is missing. SNOMED has only 'Reckless character' (finding), a personality trait, so this may be a deliberate gap; it should be recorded as one."}, {"rule": "Diagnose probable psychosis in abnormal thoughts or behaviour", "verdict": "problem", "severity": "low", "problem": "Shape (lack of insight AND >= 1 of ...) is faithful and 'probable' matches 'Psychosis likely', but the third criterion 'Disorganised speech or behaviour' is encoded as Incoherent speech only; disorganised behaviour has no finding."}, {"rule": "Diagnose probable stimulant drug intoxication in abnormal thoughts or behaviour", "verdict": "problem", "severity": "medium", "problem": "The page box is a comma list with no conjunction ('Dilated pupils, restlessness, paranoia, nausea, sweating, pulse >= 100, BP >= 140/90'), presented as a clinical picture. Encoding it as a flat 'or' means nausea alone, sweating alone or restlessness alone with abnormal behaviour yields probable stimulant intoxication, and those same findings also sit in the withdrawal rule. The page's reading is not certain, but 'or' is the loosest possible one; 'any2' (or dilated pupils/paranoia plus one other) is closer to 'likely'. Also 'Pulse, function' should be 'Heart rate'. 'BP >= 140/90' as systolic >= 140 or diastolic >= 90 follows the gold file's convention and is fine."}, {"rule": "Diagnose probable alcohol intoxication in abnormal thoughts or behaviour", "verdict": "problem", "severity": "low", "problem": "Same comma-list ambiguity: 'Smells of alcohol, slurred speech, incoordination, unsteady gait' encoded as a flat 'or', so unsteady gait alone gives probable alcohol intoxication. Smell of alcohol alone is defensible; the others alone are not. Concepts are faithful."}, {"rule": "Diagnose probable alcohol/drug withdrawal in abnormal thoughts or behaviour", "verdict": "ok", "severity": "low", "problem": "Structure (stopped/reduced intake AND one of tremor/sweating/nausea/severe restlessness-agitation/hallucinations) follows the page's 'with ... or'; 'Substance withdrawal syndrome' is a sound parent for 'Alcohol/drug withdrawal' (Alcohol withdrawal syndrome is_a it). Minor: 'reduced' drug intake is not covered (only Abstinent from drug misuse); 'Known ... user' is implied by the stopped/reduced findings."}, {"rule": "Diagnose probable poisoning in abnormal thoughts or behaviour", "verdict": "problem", "severity": "medium", "problem": "'probable' for 'Poisoning likely' and the exposure pattern are right, but exposure to the root 'Substance' matches every descendant (edible substances, body substances, materials), so a food exposure recorded on page 20 plus abnormal behaviour fires probable Poisoning. The page says 'medication/unknown substance'. Narrow the second branch or document it as an accepted over-match."}, {"rule": "Diagnose possible dementia in abnormal thoughts or behaviour", "verdict": "ok", "severity": "low", "problem": "'possible' matches 'consider dementia'; '>= 1 of' for at least 6 months is encoded as onset at least 6 months ago on each finding, per the house time semantics. The page frames this under 'not needing urgent attention' and the rule does not exclude urgent presentations, which is acceptable for a possible rule."}, {"rule": "Urgent: abnormal thoughts or behaviour of sudden or recent onset", "verdict": "ok", "severity": "low", "problem": "Matches the red-box heading exactly: abnormal thoughts/behaviour AND (sudden OR recent onset) -> Urgent. Note the brief's pattern of also referencing (active_condition X) for diagnoses named in the red box is not used; a patient with probable delirium/psychosis but no recorded sudden/recent onset qualifier would not be flagged Urgent. Low, since the page itself keys urgency on onset."}], "summary": "Two medium problems: the stimulant-intoxication rule turns a comma-listed clinical picture into a flat 'or', so a single non-specific finding (nausea, sweating, r ormal-thoughts-or-behaviour", "kind": "claim", "priority": "medium", "ref": "c063", "text": "Diagnose possible TIA in abnormal thoughts or behaviour :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Page says 'new sudden asymmetric weakness or numbness'; the asymmetric/one-sided qualifier is dropped, so bilateral weakness or numbness also matches", "fix": "add (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")) alongside Sudden onset", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page says \"new sudden asymmetric weakness or numbness\"; \"asymmetric\" (one-sided) is dropped, so bilateral/symmetric weakness or numbness also fires the stroke/TIA rules.", "fix": "Add (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")) alongside Sudden onset, or use a one-sided concept such as (snomed_concept \"Hemiparesis\" \"disorder\") for the weakness items.", "confidence": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "claim", "priority": "medium", "ref": "c076", "text": "Diagnose probable mania in abnormal thoughts or behaviour :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pressure of speech\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Page says 'talkative' (lay description); 'Pressure of speech' is a narrower clinical sign. SNOMED has no plain 'talkative' finding, so this is the nearest, but it is narrower than the page", "fix": "", "confidence": "low"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "\"Talkative\" is weaker than \"Pressure of speech\" (pressured, rapid speech); the concept is narrower than the page, though no closer concept was found in SNOMED.", "fix": "", "confidence": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "claim", "priority": "medium", "ref": "c084", "text": "Diagnose probable psychosis in abnormal thoughts or behaviour :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Incoherent speech\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Page says 'Disorganised speech or behaviour'; 'Incoherent speech' covers only the speech half, disorganised behaviour is dropped. No SNOMED 'Disorganized behavior' finding exists; 'Disorganized thinking' (finding) exists but is thought, not behaviour", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "\"Incoherent speech\" is-a \"Unintelligible articulation\" (a speech articulation finding), not the thought-disorder sense of \"disorganised speech\". The \"or behaviour\" half of the bullet is also not encoded.", "fix": "Use (snomed_concept \"Disorganized thinking\" \"finding\") and add (snomed_concept \"Bizarre behavior\" \"finding\") for disorganised behaviour.", "confidence": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "claim", "priority": "low", "ref": "c093", "text": "Diagnose probable stimulant drug intoxication in abnormal thoughts or behaviour :: (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Page says 'pulse >= 100'; 'Pulse, function' is a physiological-function concept, not the measured rate. The standard observable for the measured value is 'Heart rate', confirmed with exists", "fix": "(>= (measurement (snomed_concept \"Heart rate\" \"observable entity\") bpm) 100)", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "claim", "priority": "low", "ref": "c108", "text": "Diagnose probable alcohol/drug withdrawal in abnormal thoughts or behaviour :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abstinent from drug misuse\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page says \"stopped/reduced intake\" for alcohol or drug users. The drug side encodes only stopping (abstinent); reduced drug intake is missing.", "fix": "Add (clinical_finding (snomed_concept \"Reduced drugs misuse\" \"finding\")) (it exists).", "confidence": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "claim", "priority": "low", "ref": "c113", "text": "Diagnose probable alcohol/drug withdrawal in abnormal thoughts or behaviour :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Feeling agitated\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "\"Feeling agitated\" is a subjective feeling. The page means observed agitation, which is a clinical sign of withdrawal.", "fix": "Consider (snomed_concept \"Psychomotor agitation\" \"finding\") with the Severe qualifier.", "confidence": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "claim", "priority": "medium", "ref": "c119", "text": "Diagnose probable poisoning in abnormal thoughts or behaviour :: (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Substance\" \"substance\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Page says 'unknown substance' (a poison of unknown nature); 'Substance' is the root of the whole substance hierarchy, so any recorded exposure (foods such as Fish from page 20, body substances, materials) plus abnormal behaviour fires probable Poisoning. Broader than the page", "fix": "no exact concept for \"unknown substance\"; consider (snomed_concept \"Substance categorized by hazard characteristics\" \"substance\") or keep only Drug or medicament and note the gap", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "\"Substance\" is the top substance concept, so exposure to anything (food, water) fires probable Poisoning. The page says \"unknown substance\", and the medication item is then subsumed.", "fix": "Mark it as unknown, or narrow it to a drug/toxic substance concept. At minimum, note that this is over-broad.", "confidence": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "claim", "priority": "low", "ref": "c126", "text": "Diagnose possible dementia in abnormal thoughts or behaviour :: (>= (onset (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Difficulty coping\" \"finding\"))) (time_ago 6 months))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "\"Difficulty coping\" is a psychological coping finding (parent \"Finding related to ability to cope\"). The page means functional decline: \"less able to cope with daily activities and work/social function\".", "fix": "Use (snomed_concept \"Decline in functional status\" \"finding\"), which is the parent of Difficulty coping and is a functional finding.", "confidence": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "high", "ref": "Check for urgent abnormal thoughts or behaviour conditions / all rules (trigger)", "text": "Every rule is anchored on (or Abnormal behavior, Disturbance in thinking), but neither concept is a common symptom or warning sign per the house standard, and the natural warning-sign entry point, Aggressive behavior, is NOT a SNOMED descendant of Abnormal behavior (checked with is_a), nor are Hallucinations a descendant of Disturbance in thinking. Unless the VHA intake records one of these two concepts, nothing fires on this page. Needs a remaining-questions note and ideally an extra trigger (e.g. Aggressive behavior, or a broad possible pre-screen as on the gold page).", "detail": [{"checker": "forward-1", "severity": "high"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Urgent: abnormal thoughts or behaviour of sudden or recent onset", "text": "The six 'likely' diagnoses (delirium, mania, psychosis, stimulant intoxication, alcohol intoxication, withdrawal, poisoning) sit inside the red box under 'Manage urgently', yet the priority rule fires only on the Sudden/Recent onset qualifiers. A patient recorded with Abnormal behavior (no onset qualifier) + Fluctuation of level of consciousness + temperature 39 gets probable Delirium but no Urgent priority. The house standard says to reference (active_condition X) for likely diagnoses named in the red box; adding the seven active_condition alternates to the priority rule's 'or' would close this.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stimulant drug intoxication in abnormal thoughts or behaviour", "text": "The comma list is encoded as a flat 'or', so a single non-specific finding (Nausea, which is a common symptom; Sweating; Restlessness; or a BP of 140/90 alone) plus abnormal behaviour yields a PROBABLE stimulant intoxication. Nausea, Sweating and Restlessness are also withdrawal findings, so the same patient is simultaneously probable withdrawal if any stopped/decreased finding is present. The page shows a cluster; any2 (available in the language) would be a more faithful reading. The same flat-'or' choice in the mania and alcohol-intoxication rules is less harmful because those findings are specific.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stimulant drug intoxication (pulse measurement)", "text": "Pulse is compared via (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm). SNOMED also has Heart rate (observable entity); whichever concept VHA records as the routine vital is the only one that will ever match. The gold page gives no precedent for pulse. Worth confirming against the recorded vital, otherwise the 'pulse >= 100' arm is dead.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible dementia in abnormal thoughts or behaviour / check_for", "text": "The four dementia findings are in check_for but are consumed only inside (onset ...) wrappers in a possible rule. Evidence matching in the house tests is by exact s-expression string, so if the wrapped form does not count as 'used as evidence' the gate will flag four CHECKED FOR BUT NEVER USED items. Also, Difficulty coping is the wrong concept for functional decline (see p36-out-e02).", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Check for urgent abnormal thoughts or behaviour conditions (Restlessness)", "text": "Restlessness is checked for twice, plain (for stimulant intoxication) and with the Severe qualifier (for withdrawal). Both are consumed, so the gate passes, but the health worker is asked the same question twice; the unqualified form in the stimulant rule would match the severe recording only if the runtime treats qualified findings as descendants of the plain one.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Urgent: abnormal thoughts or behaviour of sudden or recent onset (structure)", "text": "The outer conjunct (plain Abnormal behavior / Disturbance in thinking) is redundant with the qualified alternates; if runtime matching of a qualified recording against an unqualified pattern is exact rather than subsuming, the rule needs two separate recordings before it fires. Harmless if qualifiers subsume; worth a check.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Urgent: abnormal thoughts or behaviour of sudden or recent onset", "text": "Priority fires only on sudden/recent onset. The box is the urgent box and tells the clinician to look for delirium, mania, psychosis, intoxication, withdrawal and poisoning and 'manage before referral'/'refer urgently', so probable diagnoses and stroke/TIA are not linked to Urgent priority; a patient with e.g. psychosis likely but no sudden/recent qualifier gets no priority. Judgement call, but the page does not clearly say those are non-urgent either.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke / TIA", "text": "Identical criteria for stroke and TIA, no distinguishing logic; 'asymmetric' lost; requires abnormal behaviour AND sudden neuro sign whereas the page says 'new sudden' symptom only (page is within the abnormal-behaviour context, acceptable).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable alcohol/drug withdrawal", "text": "'Known alcohol/drug user' precondition missing; 'reduced drug intake' uncovered.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable psychosis", "text": "'Disorganised speech or behaviour' mapped to 'Incoherent speech' only.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mania", "text": "'Reckless' absent; 'talkative' mapped to the narrower 'Pressure of speech'.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable poisoning", "text": "'Exposure to' + generic Substance/Drug is vague and may match anything; route of exposure missing.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "check_for list", "text": "Delirium temperature and stimulant vitals cannot be listed; check_for lacks 'Disorganised behaviour' and 'Reckless'. Otherwise findings used by rules are listed. 'Visual disturbance' is tagged 'disorder' rather than finding (valid concept but semantic tag unusual).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stimulant drug intoxication in abnormal thoughts or behaviour", "text": "Every sign is an independent OR, so a single non-specific sign (nausea alone, sweating alone, pulse ≥ 100 alone, DBP ≥ 90 alone) in any patient with abnormal behaviour yields PROBABLE stimulant intoxication. Nausea and sweating are also withdrawal signs, so the same patient gets both probable diagnoses. The page box reads as a cluster; at least the non-specific items should need a companion sign (e.g. any2) or the issue should be recorded as a judgment call.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable psychosis in abnormal thoughts or behaviour", "text": "'Disorganised behaviour' is dropped from the ≥1-of list; only speech is represented (as Incoherent speech).", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mania in abnormal thoughts or behaviour", "text": "'Reckless' is missing from the OR list.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke / possible TIA", "text": "'Asymmetric' is not encoded, so symmetric sudden weakness/numbness also triggers possible stroke/TIA.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable alcohol/drug withdrawal in abnormal thoughts or behaviour", "text": "'Known alcohol/drug user' and reduced (not stopped) drug intake are not represented; only stopped/reduced alcohol and abstinence from drug misuse.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "(page footnote 2)", "text": "The stimulant list (tik, cocaine, mandrax, cannabis) is not used, e.g. known exposure to these substances does not support stimulant intoxication; out of scope as a note but worth recording.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Check for urgent abnormal thoughts or behaviour conditions", "text": "Type and trigger are right and the listed findings all trace to the page, but the red box is not fully covered: 'If HIV positive with recent positive cryptococcal antigen test, refer for urgent lumbar puncture' is a page-specific urgent criterion with no finding anywhere in the file ('Antigen of Cryptococcus' (substance) exists for a test-result finding); 'reckless' (mania box) and 'disorganised behaviour' (psychosis box) are not checked for; the stroke/TIA findings lack the page's 'asymmetric' qualifier; 'reduced' drug intake (withdrawal box) has no finding (only Abstinent from drug misuse). Seizure, aggressive/disruptive, recent head injury and suicidal thoughts are cross-page referrals and may be covered by warning signs elsewhere, but nothing on this page records them.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke in abnormal thoughts or behaviour", "text": "'possible' matches 'consider stroke' and the and/or shape matches the page sentence, but every weakness/numbness finding drops 'asymmetric' (page: 'new sudden asymmetric weakness or numbness of face/arm/leg'); add the Unilateral qualifier.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TIA in abnormal thoughts or behaviour", "text": "Same as the stroke rule: 'asymmetric' is dropped. Otherwise 'possible' for 'consider ... TIA' is right.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mania in abnormal thoughts or behaviour", "text": "'probable' for 'Mania likely' and the 'or' match the page ('Abnormally happy, energetic, talkative, irritable or reckless'), but the fifth item 'reckless' is missing. SNOMED has only 'Reckless character' (finding), a personality trait, so this may be a deliberate gap; it should be recorded as one.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable psychosis in abnormal thoughts or behaviour", "text": "Shape (lack of insight AND >= 1 of ...) is faithful and 'probable' matches 'Psychosis likely', but the third criterion 'Disorganised speech or behaviour' is encoded as Incoherent speech only; disorganised behaviour has no finding.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stimulant drug intoxication in abnormal thoughts or behaviour", "text": "The page box is a comma list with no conjunction ('Dilated pupils, restlessness, paranoia, nausea, sweating, pulse >= 100, BP >= 140/90'), presented as a clinical picture. Encoding it as a flat 'or' means nausea alone, sweating alone or restlessness alone with abnormal behaviour yields probable stimulant intoxication, and those same findings also sit in the withdrawal rule. The page's reading is not certain, but 'or' is the loosest possible one; 'any2' (or dilated pupils/paranoia plus one other) is closer to 'likely'. Also 'Pulse, function' should be 'Heart rate'. 'BP >= 140/90' as systolic >= 140 or diastolic >= 90 follows the gold file's convention and is fine.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable alcohol intoxication in abnormal thoughts or behaviour", "text": "Same comma-list ambiguity: 'Smells of alcohol, slurred speech, incoordination, unsteady gait' encoded as a flat 'or', so unsteady gait alone gives probable alcohol intoxication. Smell of alcohol alone is defensible; the others alone are not. Concepts are faithful.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable poisoning in abnormal thoughts or behaviour", "text": "'probable' for 'Poisoning likely' and the exposure pattern are right, but exposure to the root 'Substance' matches every descendant (edible substances, body substances, materials), so a food exposure recorded on page 20 plus abnormal behaviour fires probable Poisoning. The page says 'medication/unknown substance'. Narrow the second branch or document it as an accepted over-match.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Check for urgent abnormal thoughts or behaviour conditions", "text": "Task check_for omits page red-box items: recent head injury, recent seizure, suicidal thoughts, hypoxia/difficulty breathing (RR>30, SpO2<94), glucose <3 / <4 diabetic / >=11.1, dehydration signs, HIV with positive cryptococcal antigen. These are manage-urgently steps, but several are findings the page asks the clinician to look for. 'Asymmetric' is dropped from the stroke signs. 'Reckless' (mania) not encoded.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke in abnormal thoughts or behaviour", "text": "'asymmetric' qualifier on weakness/numbness dropped (no SNOMED laterality used); page says 'consider stroke or TIA' with identical triggers so stroke and TIA rules are duplicated, acceptable.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TIA in abnormal thoughts or behaviour", "text": "Identical condition to stroke rule; page does not distinguish. 'Asymmetric' dropped.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mania in abnormal thoughts or behaviour", "text": "Any single one of four soft findings (talkative->Pressure of speech, irritable) gives probable mania; page lists them as alternatives but 'reckless' is missing and 'talkative' mapped to the stronger 'pressure of speech'.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stimulant drug intoxication in abnormal thoughts or behaviour", "text": "Page box is a list of signs without explicit 'any of'; the rule fires probable stimulant intoxication on a single non-specific sign such as nausea or sweating. Also no stimulant exposure required. Reading is plausible but loose.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable alcohol intoxication in abnormal thoughts or behaviour", "text": "Any single of four signs gives probable; page lists them in one box without 'and/or' so reading is ambiguous. Acceptable.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable alcohol/drug withdrawal in abnormal thoughts or behaviour", "text": "'Known alcohol/drug user' context not encoded; reduced drug intake not covered (only 'abstinent'); 'sweating, nausea' sensitive signs fire with any stopped-drinking finding.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible dementia in abnormal thoughts or behaviour", "text": "Page places this under 'not needing urgent attention', but the rule has no exclusion of the urgent priority, so dementia is suggested also in urgent presentations. Dementia criteria themselves (onset >=6 months ago) are correct.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Urgent: abnormal thoughts or behaviour of sudden or recent onset", "text": "Structure and level are right (red box -> Urgent). Page 'Refer urgently unless' exceptions (known stable schizophrenia, diabetes low glucose resolving with dextrose, known alcohol use otherwise well) are not encoded, so Urgent fires for those patients.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 36, "slug": "36-abnormal-thoughts-or-behaviour", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke in abnormal thoughts or behaviour", "text": "\"New\" and \"asymmetric\" are dropped. Only Sudden onset is kept, so symmetric deficits trigger the rule. \"Possible\" correctly matches \"consider stroke\".", "detail": [{"checker": "backward-3", "severity" <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);

// ---------- header ----------

function renderHeader() {

}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
