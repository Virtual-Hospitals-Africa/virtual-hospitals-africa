ted ≥ 6 weeks? • If body/general pain 75. • If back pain 78. • If neck pain 79. • If arm symptoms 79. • If leg symptoms 80. • If foot symptoms 81.", "bbox": [39.8, 275.4, 548.3, 345.6], "key": "p77-695fa732"}, {"id": "p77-out-e16", "page": 77, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes Has there been recent injury?", "bbox": [435.2, 224.5, 542.8, 244.7], "key": "p77-5f68c027"}, {"id": "p77-out-e17", "page": 77, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Gonococcal arthritis likely • Usually involves wrists, ankles, hands and feet. • Refer/discuss same day. • Treat patient's partner/s as for cervicitis/male urethritis 62.", "bbox": [175.8, 371.0, 241.5, 482.0], "key": "p77-fe22e78f"}, {"id": "p77-out-e18", "page": 77, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Joint problem unlikely", "bbox": [54.2, 250.0, 135.9, 260.2], "key": "p77-0fe11088"}], "boxes": [{"box": 1, "rect": [35.5, 86.8, 806.4, 164.4]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAACjCAIAAAC/sl6fAAAACXBIWXMAABcSAAAXEgFnn9JSAAC/bUlEQVR4nOy9B1RUWfcv+P3fe2tmrfnPmjUzb2be+6/1Zr62AEURBEUxYmO2DShmxYARA+YcMWFq7TY3JlTMGROCImJAFJFkm9tsq21szHb3V/OjNpw+3nvr1q2ioED3Wr/Fok6de+4+5+yzz96/OuEfz/+HO4PBYDAYDAaDwWAwGAwGg1G28A+XS8BgMBgMBoPBYDAYDAaDwWDYC2a1GAwGg8FgMBgMBoPBYDAYZQ+fsVovA2q/rFWHwWAwGAwGg8FgMBgMBoPBKIV4UbW6Nqv11/Pz5j9+ZjAYDAaDwWAwGAwGg8FgMEohPqXuZFaLwWAwGAwGg8FgMBgMBoNRxsCsFoPBYDAYDAaDwWAwGAwGo+yBWS0Gg8FgMBgMBoPBYDAYDEbZA7NaDAaDwWAwGAwGg8FgMBiMsgdmtRgMBoPBYDAYDAaDwWAwGGUPzGoxGAwGg8FgMBgMBoPBYDDKHpjVYjAYDAaDwWAwGAwGg8FglD0wq8VgMBgMBoPBYDAYDAaDwSh7YFaLwWAwGAwGg8FgMBgMBoNR9sCsFoPBYDAYDAaDwWAwGAwGo+yBWS0Gg8FgMBgMBoPBYDAYDEbZA7NaDAaDwXAZPr7NepeX4XIxGDooW330672UhMNrgJtXj7hcGE38/vycy2VwQLAPbzKpYdPP7nDue//6mJv3It14/rKlkAw1rl46RLr07PEZlwvDYDAYjC8AzGoxGAwGoxhxJffg2uhZE8eFh3YJ7t+706Tx4fv3LP/jfQ6+uvvLsapVKleuW pCEdk0xSqxaPnPk0J5ou/atG3P9MHp8mpVKEPk3axmGYZhXmX9oVOvwgVWdE5pfvrCj2CV5XYHpXL9O9KDkLjdz9uYnn60bF8CtEtu4MPlnyIBEn94jYwqVurVroJu4eUVrU+pcjFoxNavGRFfr2rml3ReXmKLh0a9Zi+a927J5g6iqEXH1ag1OTvTpBdISwatZRvdd5h/OqWPr+/fpWD+2JpqvbauGq1fMKvZFdkyJgLsYwzAMU+L4h0a1mJLCH0/OFfZ2MwxTjBTs9nkM89rDXYZhChXuYgzDMEyJg6NaDMMwDMMwDMMwDMMwTMmDo1oMwzAMwzAMwzAMwzBMyYOjWgzDMAzDMAzDMAzDMEzJg6NaDMMwDMMwDMMwDMMwTMmDo1oMwzAMwzAMwzAMwzBMyYOjWgzDMAzDMAzDMAzDMEzJg6NaDMMwDMMwDMMwDMMwTMnDNqr1cEDPR0P7MAzDMAzDMAzDMAzDMMwryIPO7ayjWgzDMAzDMAzDMAzDMAxTIuCoFsMwDMMwDMMwDMMwDFPy4KgWwzAMwzAMwzAMwzAMU/L4/80myKemfIqzAAAAAElFTkSuQmCC"}, "page_image": null, "lisp": ";; Page 77 - Joint symptoms\n;; See 77-joint-symptoms-flowchart.md for the page's algorithm and how each node maps to a rule.\n(task\n  \"Check for urgent joint symptom conditions\"\n  adult\n  (clinical_finding (snomed_concept \"Pain of joint\" \"finding\"))\n  (check_for\n    ;; Red box: septic arthritis likely; flowchart Q1 (joint warm/tender/swollen or unable to do all actions)\n    (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n    (clinical_finding (snomed_concept \"Tenderness of joint\" \"finding\"))\n    (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n    (clinical_finding (snomed_concept \"Limitation of joint movement\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain of joint\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n\n    ;; Red box: injury in past 48 hours and severe pain/swelling or deformity, fracture likely; flowchart Q2 (recent injury)\n    (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Joint swelling\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Deformity\" \"finding\"))\n\n    ;; Red box: unable to weight-bear\n    (clinical_finding (snomed_concept \"Unable to weight-bear\" \"finding\"))\n\n    ;; Red box: known gout, affected joint big toe/midfoot/ankle, no fever or wound\n    (clinical_finding (snomed_concept \"Gout\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Pain of joint\" \"finding\") (finding_site (snomed_concept \"Structure of joint of hallux\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Pain of joint\" \"finding\") (finding_site (snomed_concept \"Structure of midfoot region of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Pain of joint\" \"finding\") (finding_site (snomed_concept \"Ankle joint structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Fever\" \"finding\"))\n    (clinical_finding (snomed_concept \"Wound\" \"disorder\"))\n\n    ;; Flowchart Q4: recent genital discharge or painless non-itchy skin rash (gonococcal arthritis)\n    (clinical_finding (snomed_concept \"Vaginal discharge\" \"finding\"))\n    (clinical_finding (snomed_concept \"Urethral discharge\" \"finding\"))\n    (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\") (qualifier (snomed_concept \"Painless\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Itching\" \"finding\"))\n\n    ;; Flowchart Q5: sudden onset of warm, extremely painful, red, swollen joints (acute gout)\n    (clinical_finding (snomed_concept \"Pain of joint\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Erythema\" \"finding\") (finding_site (snomed_concept \"Joint structure\" \"body structure\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable septic arthritis (joint symptoms)\"\n  (diagnosis\n    (snomed_concept \"Infective arthritis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Red box: short history of single warm, swollen, extremely painful joint with limited range of movement.\n  ;; \"Short history\" and \"single\" joint cannot be expressed (see remaining questions).\n  (and (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n       (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n       (clinical_finding (snomed_concept \"Pain of joint\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n       (clinical_finding (snomed_concept \"Limitation of joint movement\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable fracture (joint symptoms)\"\n  (diagnosis\n    (snomed_concept \"Fracture of bone\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Red box: injury in past 48 hours and severe pain/swelling or deformity\n  (and (<= (onset (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))) (time_ago 48 hours))\n       (or (clinical_finding (snomed_concept \"Pain of joint\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Joint swelling\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Deformity\" \"finding\"))\n       )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable sprain/strain (joint symptoms)\"\n  (diagnosis\n    (snomed_concept \"Sprain of ligament of joint\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = Yes (joint warm/tender/swollen or unable to do all actions) and Q2 = Yes (recent injury)\n  (and (or (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n           (clinical_finding (snomed_concept \"Tenderness of joint\" \"finding\"))\n           (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n           (clinical_finding (snomed_concept \"Limitation of joint movement\" \"finding\"))\n       )\n       (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable chronic arthritis (joint symptoms)\"\n  (diagnosis\n    (snomed_concept \"Chronic arthritis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = Yes, Q2 = No (no recent injury), Q3 = Yes (joint pain lasted >= 6 weeks)\n  (and (or (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n           (clinical_finding (snomed_concept \"Tenderness of joint\" \"finding\"))\n           (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n           (clinical_finding (snomed_concept \"Limitation of joint movement\" \"finding\"))\n       )\n       (no (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\")))\n       (>= (onset (clinical_finding (snomed_concept \"Pain of joint\" \"finding\"))) (time_ago 6 weeks))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable gonococcal arthritis (joint symptoms)\"\n  (diagnosis\n    (snomed_concept \"Gonococcal infection of joint\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = Yes, Q2 = No, Q3 = No (joint pain < 6 weeks, written <= because onset comparisons allow only >= and <=),\n  ;; Q4 = Yes (recent genital discharge or painless non-itchy skin rash)\n  (and (or (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n           (clinical_finding (snomed_concept \"Tenderness of joint\" \"finding\"))\n           (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n           (clinical_finding (snomed_concept \"Limitation of joint movement\" \"finding\"))\n       )\n       (no (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\")))\n       (<= (onset (clinical_finding (snomed_concept \"Pain of joint\" \"finding\"))) (time_ago 6 weeks))\n       (or (clinical_finding (snomed_concept \"Vaginal discharge\" \"finding\"))\n           (clinical_finding (snomed_concept \"Urethral discharge\" \"finding\"))\n           (and (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\") (qualifier ( (fracture likely)<br/>• unable to weight-bear<br/>• known gout and affected joint big toe, midfoot or ankle and no fever, wound, surgery or injection into joint (acute gout likely)\"}\n    RB -- Yes --> URGENT[\"Give urgent attention.<br/>Manage and refer urgently\"]\n    RB -- No --> APPROACH[\"Check joints; ask patient to do the actions<br/>(hands behind head/back, fist, palms together, walk, sit and stand)\"]\n    APPROACH --> Q1{\"Any of: joint warm/tender/swollen<br/>or unable to do all actions comfortably?\"}\n    Q1 -- No --> UNLIKELY[\"Joint problem unlikely.<br/>Body/general pain 75, back 78, neck 79, arm 79, leg 80, foot 81\"]\n    Q1 -- Yes --> Q2{\"Has there been recent injury?\"}\n    Q2 -- Yes --> SPRAIN[\"Sprain/strain likely\"]\n    Q2 -- No --> Q3{\"Has joint pain lasted ≥ 6 weeks?\"}\n    Q3 -- Yes --> CHRONIC[\"Chronic arthritis likely 188\"]\n    Q3 -- No --> Q4{\"Recent genital discharge or<br/>painless non-itchy skin rash?\"}\n    Q4 -- Yes --> GONO[\"Gonococcal arthritis likely\"]\n    Q4 -- No --> Q5{\"Sudden onset of 1-3 warm, extremely painful,<br/>red, swollen joints (often big toe or knee)?\"}\n    Q5 -- Yes --> GOUT[\"Acute gout likely 189\"]\n    Q5 -- No --> SYMPT[\"Symptomatic treatment, test for HIV,<br/>review after 1 month (management only)\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint \"joint symptom/s\" | `Pain of joint` (finding) | trigger of `Check for urgent joint symptom conditions` |\n| RB: septic arthritis likely | warm **and** swollen **and** severe joint pain **and** limitation of joint movement (\"short history\" and \"single\" joint not modelled) | `Diagnose probable septic arthritis (joint symptoms)` → `Urgent: joint symptoms with danger signs` |\n| RB: Temperature ≥ 38°C | body temperature ≥ 38 °C | `Urgent: joint symptoms with danger signs` |\n| RB: fracture likely | traumatic injury with onset ≤ 48 hours ago **and** any of severe joint pain, severe joint swelling, deformity | `Diagnose probable fracture (joint symptoms)` → `Urgent: joint symptoms with danger signs` |\n| RB: unable to weight-bear | `Unable to weight-bear` | `Urgent: joint symptoms with danger signs` |\n| RB: acute gout likely (known gout) | known gout **and** joint pain at big toe joint, midfoot or ankle joint **and** no fever **and** no wound (surgery/injection into joint not modelled) | inline in `Urgent: joint symptoms with danger signs`; also first branch of `Diagnose probable acute gout (joint symptoms)` |\n| Q1 = Yes | any of joint warm, tenderness of joint, joint swelling, limitation of joint movement | shared gate in the sprain, chronic arthritis and gonococcal rules (the gout rule's own criteria already include warm and swollen) |\n| Q1 = No → Joint problem unlikely | routing to other pages only | not encoded (flowchart_routing / cross_reference_only) |\n| Q2 = Yes → Sprain/strain likely | Q1 gate **and** traumatic injury | `Diagnose probable sprain/strain (joint symptoms)` |\n| Q2 = No → Q3 = Yes → Chronic arthritis likely | Q1 gate **and** `(no Traumatic injury)` **and** joint pain onset ≥ 6 weeks ago | `Diagnose probable chronic arthritis (joint symptoms)` |\n| Q3 = No → Q4 = Yes → Gonococcal arthritis likely | Q1 gate **and** `(no Traumatic injury)` **and** joint pain onset ≤ 6 weeks ago **and** (vaginal or urethral discharge, or painless rash with no itching) | `Diagnose probable gonococcal arthritis (joint symptoms)` |\n| Q4 = No → Q5 = Yes → Acute gout likely | `(no Traumatic injury)` **and** joint pain onset ≤ 6 weeks ago **and** joint warm **and** sudden-onset severe joint pain **and** erythema of joint **and** joint swelling **and** no vaginal discharge, no urethral discharge, no painless rash (Q4 = No) (\"1-3 joints\" not modelled) | second branch of `Diagnose probable acute gout (joint symptoms)` |\n| Q5 = No | management only | not encoded (management_step) |\n\n## Notes\n\n- \"< 6 weeks\" (Q3 = No) is written `(<= (onset …) (time_ago 6 weeks))` because the database only\n  accepts `>=` and `<=` in onset comparisons; the 6-week boundary itself falls in both branches.\n- \"Recent injury\" (Q2) and \"recent genital discharge\" (Q4) are read as recorded in the current\n  encounter, as the gold standard does for \"in the few hours before\".\n- The flowchart's acute gout and the red box's acute gout share one diagnosis concept. Only the red\n  box's known-gout criteria make the patient urgent, so the priority rule uses those criteria\n  inline rather than `(active_condition Acute gout)`.\n", "questions": "# Page 77 – Joint symptoms: remaining questions\n\n## Decisions made\n\n- **Presenting complaint.** \"Joint symptom/s\" is anchored on `Pain of joint` (finding). It is not a\n  recorded common symptom (it is commented out in `common_symptoms.ts`), so the check task and the\n  priority rule fire only once a health worker records joint pain. `Joint finding` was rejected as\n  too broad (it includes `Joint normal` and `Arthropathy`).\n- **Septic arthritis = `Infective arthritis` (disorder)**; there is no \"Septic arthritis\" FSN.\n  \"Extremely painful\" = `Pain of joint` with the `Severe (severity modifier)` qualifier.\n- **Fracture likely** = traumatic injury with onset ≤ 48 hours ago and any of severe joint pain,\n  severe joint swelling (\"severe pain/swelling\" read as severe pain or severe swelling) or\n  deformity. Deformity is the generic `Deformity` finding, since the deformity after injury may be\n  of bone rather than joint. Diagnosis concept `Fracture of bone`.\n- **Urgent priority** = joint pain and any of: probable septic arthritis, temperature ≥ 38 °C,\n  probable fracture, unable to weight-bear, or the red box's known-gout criteria. The known-gout\n  criteria are written inline rather than as `(active_condition Acute gout)`, because the\n  non-urgent flowchart also reaches \"Acute gout likely\" and should not become urgent by that route.\n- **Acute gout** has one probable rule with two branches: the red box's known-gout branch and the\n  flowchart's Q5 branch.\n- **Big toe / midfoot / ankle** are `finding_site`s on `Pain of joint`: `Structure of joint of\n  hallux`, `Structure of midfoot region of foot` (no midfoot joint structure found), `Ankle joint\n  structure`. All three resolve.\n- **Q1 gate** (\"joint warm/tender/swollen or unable to do all actions comfortably\") = any of `Joint\n  warm`, `Tenderness of joint`, `Joint swelling`, `Limitation of joint movement`. It is required in\n  the sprain, chronic arthritis and gonococcal rules.\n- **No-branches.** Q2 = No is `(no Traumatic injury)`; Q3 = No (\"< 6 weeks\") is `(<= (onset Pain of\n  joint) (time_ago 6 weeks))` because only `>=`/`<=` are accepted in onset comparisons, so the\n  6-week boundary falls in both branches. Q4 = No is required in the flowchart gout branch as no vaginal\n  discharge, no urethral discharge and no painless rash.\n- **\"Recent\" injury and \"recent\" genital discharge** are read as recorded in the current encounter.\n- **Genital discharge** = `Vaginal discharge` or `Urethral discharge`; `Abnormal urogenital\n  discharge` has no descendants, so it would not match either.\n- **Painless non-itchy skin rash** = `Eruption` with the `Painless` qualifier and `(no Itching)`.\n- **Sprain/strain** = `Sprain of ligament of joint` (one concept for both).\n- **Red joint** = `Erythema` with `finding_site Joint structure` (SNOMED has only site-specific\n  \"X joint red\" concepts).\n- **Fever** is in the `check_for` so that \"no fever\" can be recorded as a negative.\n\n## Could not model\n\n- **Septic arthritis, \"short history\" and \"single\" joint**: no number for the window and no way to\n  count joints. The rule fires more often than the page intends (any warm, swollen, severely\n  painful joint with limited movement).\n- **Acute gout (flowchart), \"1-3\" joints**: joint count not expressible; fires more often.\n- **\"Non-itchy\" in the Q4 = No branch**: `(no …)` cannot negate \"painless and not itchy\" as a\n  whole, so the No branch is written as \"no painless rash\". A patient with a painless but itchy\n  rash does not reach acute gout (fires less often in that edge case).\n- **\"Unable to do all actions comfortably\"** (the screening manoeuvres) is approximated by\n  `Limitation of joint movement`.\n- **\"Often big toe or knee\"**: descriptive, not a criterion; not encoded.\n- **\"Surgery or injection into joint\"** (red-box gout exclusion): only procedure concepts exist\n  (`Operation on joint`, `Intra-articular injection`), and no \"History of joint surgery/injection\"\n  situation was found. Not encoded, so the red-box gout branch fires more often than the page\n  intends.\n- **\"Joint problem unlikely\"** and its pointers (75, 78, 79, 80, 81): routing only.\n- **Management** (sprain care, analgesia, HIV test, review, referral, \"Manage and refer urgently\"\n  including suspected secondary gout and known gout with CKD): out of scope.\n\n## SNOMED gaps\n\n- \"Septic arthritis\" (disorder): absent; `Infective arthritis` used.\n- \"Gonococcal arthritis\" (disorder): absent; `Gonococcal infection of joint` used.\n- \"Sprain\"/\"Strain\" (disorder): absent; `Sprain of ligament of joint` used.\n- \"Genital discharge\" (finding): absent; vaginal or urethral discharge used.\n- Midfoot joint body structure: absent; `Structure of midfoot region of foot` used.\n- Joint redness (general): absent; `Erythema` + `Joint structure` used.\n- Surgery or injection into a joint as a finding/situation: absent; not encoded.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR: (no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Eruption\" \"morphologic abnormality\") (snomed_concept \"No\" \"qualifier value\") (qualifier (snomed_concept \"Painless\" \"qualifier value\"))))`\n  (rule: Diagnose probable acute gout (joint symptoms)). The painless rash *is* checked for in\n  `Check for urgent joint symptom conditions`; the checker does not match a `(no …)` of a\n  **qualified** finding to its `check_for`, because the No value is inserted before the qualifier.\n\n## Questions for a clinician\n\n- Should the sprain/strain rule exclude patients who already meet the red-box fracture criteria?\n  The language has no \"not diagnosed\" form, so both can be probable at once.\n- Is \"short history\" for septic arthritis a defined window (e.g. days)? If so, it could be added as\n  an onset comparison.\n- Should \"Unable to weight-bear\" apply to any joint symptom (as written), or only to lower-limb joints?\n- Should \"joint symptom/s\" (the presenting complaint) be joint pain only, as encoded, or also\n  joint swelling or stiffness on their own? (Builder A used a possible-Arthropathy pre-screen on\n  pain, swelling or stiffness.)\n- `(active_condition Fracture of bone)` and `(active_condition Infective arthritis)` also match a\n  fracture or septic arthritis in the patient's history. Should the priority use the current\n  probable diagnosis only?\n- Sprain/strain: is a single sprain diagnosis enough, or should muscle strain also be recorded?\n- Is \"no fever\" in the known-gout item the patient's report (as encoded), or temperature < 38°C?\n- Should a painless *itchy* rash count as a No to the gonococcal question (leading on to the acute\n  gout question)?\n- Does \"wound\" in the gout exclusion mean a wound over the affected joint only? It is encoded as any\n  recorded wound.\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent joint symptom conditions", "role": "trigger", "expr": "(finding (snomed_concept // ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
