:", "section_y": 91.9, "indent": 1, "parent": null, "text": "Unable to pass urine", "bbox": [417.8, 142.5, 501.9, 153.4], "key": "p11-eed81320"}, {"id": "p11-rb1-e21", "page": 11, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with any of:", "section_y": 91.9, "indent": 1, "parent": null, "text": "Purple/red rash that does not disappear with gentle pressure", "bbox": [519.9, 142.5, 757.9, 153.4], "key": "p11-e919c2d4"}, {"id": "p11-rb1-e22", "page": 11, "box": 1, "kind_hint": "header", "section": "Management:", "section_y": 167.8, "indent": 0, "parent": null, "text": "Management:", "bbox": [51.2, 167.8, 107.0, 178.9], "key": "p11-faa4fbd1"}, {"id": "p11-rb1-e23", "page": 11, "box": 1, "kind_hint": "management", "section": "Management:", "section_y": 167.8, "indent": 1, "parent": null, "text": "Check and record BP, pulse, respiratory rate and temperature and ensure patient is urgently seen by nurse or doctor.", "bbox": [51.2, 178.1, 498.4, 188.9], "key": "p11-e1c61025"}, {"id": "p11-rb1-e24", "page": 11, "box": 1, "kind_hint": "management", "section": "Management:", "section_y": 167.8, "indent": 1, "parent": null, "text": "If decreased consciousness, seizures, confused, unable to sit up or known diabetic, also check glucose.", "bbox": [51.2, 188.1, 445.7, 198.9], "key": "p11-bb99c108"}, {"id": "p11-out-e01", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "INITIAL ASSESSMENT OF THE PATIENT", "bbox": [266.1, 48.8, 575.8, 71.1], "key": "p11-958f79ed"}, {"id": "p11-out-e02", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Do routine tests on the patient not needing urgent attention • Routinely check and record weight, BP, pulse and temperature. • If coughing/difficulty breathing, also check respiratory rate and oxygen saturation, if available.", "bbox": [246.6, 220.6, 595.1, 251.8], "key": "p11-a790b9a0"}, {"id": "p11-out-e03", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Ensure the patient with any of the following is seen promptly by nurse or doctor • BP ≥ 180/110 or systolic BP < 80 • Pregnant with BP ≥ 140/90 • Pulse irregular, ≥ 100 or < 50 • Temperature ≥ 38°C • Respiratory rate ≥ 30 • Glucose < 3 (or < 4 if diabetic) or ≥ 11.1 • Oxygen saturation < 92% at rest • Oxygen saturation drop to < 87% on exertion (walking 15-20m)", "bbox": [69.4, 266.1, 774.3, 297.5], "key": "p11-b631e487"}, {"id": "p11-out-e04", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Continue to assess the pregnant patient and the patient with hypertension and/or diabetes", "bbox": [239.5, 311.8, 602.3, 323.0], "key": "p11-4816d4d5"}, {"id": "p11-out-e05", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Patient has hypertension", "bbox": [400.6, 338.2, 491.6, 348.4], "key": "p11-6ba8aa91"}, {"id": "p11-out-e06", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check at every visit: • Weight • BP", "bbox": [359.3, 362.7, 438.6, 393.9], "key": "p11-35801489"}, {"id": "p11-out-e07", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check once a year: • BMI1, waist circumference (also check 3-6 monthly if trying to lose weight) • Urine dipstick • Fingerprick glucose (also check if glucose on urine dipstick)", "bbox": [359.3, 398.4, 530.3, 459.6], "key": "p11-827c2beb"}, {"id": "p11-out-e08", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Patient has diabetes", "bbox": [647.8, 338.2, 721.3, 348.4], "key": "p11-d52a11f3"}, {"id": "p11-out-e09", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check at every visit: • BP • Fingerprick glucose • Urine dipstick only if fingerprick glucose ≥ 11.1", "bbox": [589.6, 362.7, 766.8, 403.9], "key": "p11-b1cbcc67"}, {"id": "p11-out-e10", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check once a year: • BMI1, waist circumference, waist-hip ratio3 (also check 3-6 monthly if trying to lose weight) • Urine dipstick • Visual acuity", "bbox": [589.6, 408.4, 768.7, 459.5], "key": "p11-1ab08e88"}, {"id": "p11-out-e11", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Patient is pregnant", "bbox": [146.6, 338.2, 215.6, 348.4], "key": "p11-7e88cc6d"}, {"id": "p11-out-e12", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check at booking visit: • Mid Upper Arm Circumference (MUAC) • Weight and height to calculate BMI1 • Fingerprick glucose only if risk factor2 • Hb • Rapid rhesus and syphilis • Urine dipstick", "bbox": [51.0, 362.7, 199.4, 433.9], "key": "p11-515cb243"}, {"id": "p11-out-e13", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check at every visit: • BP • Urine dipstick • Fingerprick glucose only if glucose on urine dipstick on ≥ 2 occasions • HIV and syphilis Also: • At 26 weeks: fingerprick glucose only if risk factor2 • At 30 and 36 weeks: Hb", "bbox": [51.0, 438.4, 309.9, 519.5], "key": "p11-69d6ac3c"}, {"id": "p11-out-e14", "page": 11, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1BMI = weight (kg) ÷ height (m) ÷ height (m). 2Glucose in urine, BMI ≥ 35, age ≥ 40 years, previous diabetes in pregnancy, first degree family history of diabetes (parents, siblings), previous unexplained stillbirth, previous baby with congenital abnormalities, previous baby ≥ 4000g, polyhydramnios, SFH large for gestational age, Indian ethnicity. 3Waist-hip ratio = waist circumference ÷ hip circumference (measure at the widest part of the hips/buttocks).", "bbox": [34.0, 535.3, 768.2, 551.8], "key": "p11-8f7d6f08"}], "boxes": [{"box": 1, "rect": [35.5, 86.9, 806.4, 204.1]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAD1CAIAAABlZbV1AAAACXBIWXMAABcSAAAXEgFnn9JSAAEAIUlEQVR4nOydh1cUSff3f3/Ie86jQxBFFBRFRVFEUVTEHBAD6iomVMwZE6bVXbOYc84JA4oRA6KIrjmvrtl1zbqh3y9zoSw71AyoDMg953M4THV1d3WFm7qq+v+e/z93hmEYhmEYhmEYhmEYhilc/J/LS8AwDMMwDMMwDMMwDMMwuYWjWgzDMAzDMAzDMAzDMEzh44uo1t+ZO/+5eYBhGIZhGIZhGIZhGIZhCiAftiaaR7X+fX5a+/s3hmEYhmEYhmEYhmEYhimAfErdwFEthmEYhmEYhmEYhmEYppDBUS2GYRiGYRiGYRiGYRim8MFRLYZhGIZhGIZhGIZhGKbwwVEthmEYhmEYhmEYhmEYpvDBUS2GYRiGYRiGYRiGYRim8MFRLYZhGIZhGIZhGIZhGKbwwVEthmEYhmEYhmEYhmEYpvDBUS2GYRiGYRiGYRiGYRim8MFRLYZhGIZhGIZhGIZhGKbwwVEthmEYhmEYhmEYhmEYpvDBUS2GYRiG+Vo+vs149yrd5cVgFBSuNvrj3uG9uxeCG1f2uLwwpvz1/JTLy5CHgn14c44qNu3EepcXNVf8+/HCvqSFc2aOXLFk0qsXaS4vD8MwDMMUEDiqxTAMwzCOuXxh56LEcUMHxUS1jujSseWwwTHbN8/++30mDt29mVyubOnSJUucOr7W5eVkTCl0bbRlw0zb//4Hfvl5iMsLY2T0yF4o208dW7i8JDL/frwQHlbTvXjx+XPHWOX5495hqthWzeu7vMDO8+blmYb1Qqjk4PfbB11eJIZhGIYpIHBUi2EYhmFUPPz9cL/e0cKfFJTxLvnPh6yo1t5dCyhl3qx4l5f2e3P1t12L54/vEdPm1Ytc2wmPHxzdsObXQf1/OnlsrTrxK0k9snrGtGEjhnYXKd+1jd69St+zc/64+D7LFk/8VgUuOFEt0wYKC62OsvmU8vr07vzX3+JrOpXM88ep7sWLo2AdoppYXbmQRrXGjIqlYnt7eTYKr/3y2UmXF4lhGIZhCggc1WIYhmEYS+AMV6tSgfxJLw/3ls3q9+/TMean1nVrB4mJKh/fZsz8ZfjE8f3+fPrju5rtoxpTbTx/nJrbc+fOHEXn7t6eqE78Srw83HDBOiHVRMp3baOzpzfRI4wc2uNbFbjgRLVMGyj99MYhA7qk7F/6TW7xNZ1Kx9aNs4YNjrl6abfVlQtpVKtq5Swp5F68+KP7R1xeGIZhGIYpUHBUi2EYhmEs6RkTRT5wZIvw+3e+WPXz4c05+ufVi9NXf9sFnj06/u/HC/Q/+O/TRcqA9JwM2a51VrZLu5N2JOIv/je99c2re3HKtUtJ9POfD5l0kbs3kynl+uUk/Hz68Bj+R7YjB1eIc+H67k9adD59y9/vMx8/OIpsuNqXhc84e3rTvqSFD+4dkp+IbvH6zzTc7uSxtSihuB3dsVnjulQhaSfWI6dxqg4u8tv57Xt3Lzy4b8m9WwdE+oO7KWK+yaLEcTj3r+enTBPFKS+fncRDHU1ZI essment of the patient\n;; The red box applies to every patient, so the check_for task is anchored on the root\n;; \"Clinical finding\" concept (descendants match in due_to): it fires once anything is recorded.\n(task\n  \"Check for urgent signs at initial assessment of the patient\"\n  adult\n  (clinical_finding (snomed_concept \"Clinical finding\" \"finding\"))\n  (check_for\n    (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n    (clinical_finding (snomed_concept \"Aggressive behavior\" \"finding\"))\n    (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Feeling agitated\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unable to sit up\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unable to complete a sentence in one breath\" \"finding\"))\n    (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Cough\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n    (clinical_finding (snomed_concept \"Muscle weakness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n\n    (clinical_finding (snomed_concept \"Bleeding\" \"finding\"))\n    (clinical_finding (snomed_concept \"Hematemesis\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Hemoptysis\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Burn\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Injury of eye region\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of bone\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Dislocation of joint\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Overdose\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Victim of sexual aggression\" \"finding\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Non-blanching rash\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Purpuric rash\" \"disorder\"))\n\n    (clinical_finding (snomed_concept \"Severe pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unable to void urine\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Abdominal pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Bleeding from vagina\" \"finding\"))\n\n    ;; Management line: \"known diabetic\" (known chronic condition, Will's briefing form)\n    (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n  )\n)\n;; Red box management: \"If decreased consciousness, seizures, confused, unable to sit up or known diabetic, also check glucose.\"\n(task\n  \"Initial assessment: measure glucose if decreased consciousness, seizures, confused, unable to sit up or diabetic\"\n  adult\n  (or (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n      (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n      (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n      (clinical_finding (snomed_concept \"Unable to sit up\" \"finding\"))\n      (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n      (active_condition (snomed_concept \"Diabetes mellitus\" \"disorder\"))\n  )\n  (measure (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L))\n)\n;; Routine tests: \"If coughing/difficulty breathing, also check respiratory rate and oxygen saturation, if available.\"\n(task\n  \"Initial assessment: measure respiratory rate and oxygen saturation if coughing or difficulty breathing\"\n  adult\n  (or (clinical_finding (snomed_concept \"Cough\" \"finding\"))\n      (clinical_finding (snomed_concept \"Dyspnea\" \"finding\"))\n      (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n  )\n  (measure\n    (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm)\n    (measurement (snomed_concept \"Hemoglobin saturation with oxygen\" \"observable entity\") %)\n  )\n)\n;; Continue to assess: patient is pregnant (booking visit). Pregnancy uses the checked-for clinical_finding form (no probable rule diagnoses it). Weight is routine; Hb, rhesus, syphilis and dipstick cannot be modelled.\n(task\n  \"Initial assessment: measure MUAC and height in the pregnant patient\"\n  adult\n  (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n  (measure\n    (measurement (snomed_concept \"Mid upper arm circumference\" \"observable entity\") cm)\n    (measurement (snomed_concept \"Body height\" \"observable entity\") cm)\n  )\n)\n;; Continue to assess: patient has hypertension (once a year: BMI, waist circumference, fingerprick glucose).\n(task\n  \"Initial assessment: measure BMI inputs, waist circumference and glucose in the patient with hypertension\"\n  adult\n  (active_condition (snomed_concept \"Hypertensive disorder, systemic arterial\" \"disorder\"))\n  (measure\n    (measurement (snomed_concept \"Body height\" \"observable entity\") cm)\n    (measurement (snomed_concept \"Waist circumference\" \"observable entity\") cm)\n    (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L)\n  )\n)\n;; Continue to assess: patient has diabetes (every visit: fingerprick glucose; once a year: BMI, waist circumference, waist-hip ratio).\n(task\n  \"Initial assessment: measure glucose, BMI inputs, waist and hip circumference in the patient with diabetes\"\n  adult\n  (or (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n      (active_condition (snomed_concept \"Diabetes mellitus\" \"disorder\"))\n  )\n  (measure\n    (measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L)\n    (measurement (snomed_concept \"Body height\" \"observable entity\") cm)\n    (measurement (snomed_concept \"Waist circumference\" \"observable entity\") cm)\n    (measurement (snomed_concept \"Hip circumference\" \"observable entity\") cm)\n  )\n)\n;; Red box: \"Give urgent attention to the patient with any of:\"\n(system_priority_evaluation\n  \"Urgent: initial assessment danger signs\"\n  adult\n  Urgent\n  (or\n    (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n    (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unable to complete a sentence in one breath\" \"finding\"))\n    (>= (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)\n    (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n\n    (and (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n         (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\")))\n    (cl e entity\") cm)", "(measurement (snomed_concept \"Waist circumference\" \"observable entity\") cm)", "(measurement (snomed_concept \"Waist circumference\" \"observable entity\") cm)"], "only_B": [], "both": ["(measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L)", "(measurement (snomed_concept \"Hemoglobin saturation with oxygen\" \"observable entity\") %)", "(measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm)"], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 11 – Initial assessment of the patient: flowchart\n\nSource: APC 2026 e-book page 11 (APC 2026 e-book, page 11). The page is a top-to-bottom sequence of\nboxes joined by connectors, ending in three parallel branches (pregnant / hypertension / diabetes).\n\n```mermaid\nflowchart TD\n    RB[\"<b>Give urgent attention to the patient with any of:<\/b><br/>decreased consciousness; seizures; difficulty breathing or breathless while talking;<br/>RR ≥ 30; chest pain; headache <i>and<\/i> vomiting; aggressive, confused or agitated;<br/>overdose of drugs/medication; recent sexual assault; vomiting or coughing blood;<br/>bleeding; burn; eye injury; severe pain; unable to pass urine; sudden facial swelling;<br/>suspected fracture or joint dislocation; recent sudden onset weakness, numbness or<br/>visual disturbance; pregnant <i>with<\/i> abdominal pain/vaginal bleeding;<br/>purple/red rash that does not disappear with gentle pressure\"]\n    RB -- Yes --> URG[\"Urgent. Check and record BP, pulse, RR, temperature;<br/>ensure urgently seen by nurse or doctor\"]\n    URG --> GLU{\"Decreased consciousness, seizures, confused,<br/>unable to sit up or known diabetic?\"}\n    GLU -- Yes --> GLUM[\"Also check glucose\"]\n    RB -- No --> ROUT[\"Do routine tests: weight, BP, pulse, temperature\"]\n    ROUT --> COUGH{\"Coughing / difficulty breathing?\"}\n    COUGH -- Yes --> RRSAT[\"Also check respiratory rate and SpO₂ if available\"]\n    ROUT --> PROMPT[\"Ensure seen promptly by nurse or doctor if any of:<br/>BP ≥ 180/110 or systolic BP &lt; 80; pregnant with BP ≥ 140/90;<br/>pulse irregular, ≥ 100 or &lt; 50; temperature ≥ 38°C; RR ≥ 30;<br/>glucose &lt; 3 (or &lt; 4 if diabetic) or ≥ 11.1;<br/>SpO₂ &lt; 92% at rest; SpO₂ drop to &lt; 87% on exertion\"]\n    PROMPT --> CONT[\"Continue to assess the pregnant patient and the patient<br/>with hypertension and/or diabetes\"]\n    CONT --> PREG[\"Patient is pregnant:<br/>booking visit MUAC, weight and height (BMI), glucose if risk factor, Hb,<br/>rhesus, syphilis, urine dipstick; every visit BP, dipstick, glucose if<br/>glycosuria ≥ 2 occasions, HIV, syphilis; 26 wk glucose if risk factor; 30/36 wk Hb\"]\n    CONT --> HTN[\"Patient has hypertension:<br/>every visit weight, BP; once a year BMI, waist circumference,<br/>urine dipstick, fingerprick glucose\"]\n    CONT --> DM[\"Patient has diabetes:<br/>every visit BP, fingerprick glucose, dipstick only if glucose ≥ 11.1;<br/>once a year BMI, waist circumference, waist-hip ratio, dipstick, visual acuity\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Red box (any of the 20 items) | Asked of every patient with any recorded clinical finding; any one item → Urgent | `Check for urgent signs at initial assessment of the patient` → `Urgent: initial assessment danger signs` |\n| Headache *and* vomiting | `(and Headache Finding of vomiting)`; neither alone | `Urgent: initial assessment danger signs` |\n| Pregnant *with* abdominal pain/vaginal bleeding | `(and Pregnancy (or Abdominal pain, Bleeding from vagina))` | `Urgent: initial assessment danger signs` |\n| GLU = Yes | `measure` blood glucose due to decreased consciousness, seizure, clouded consciousness (confused), unable to sit up, or known diabetes (`Diabetes mellitus` + `Known present`, or `(active_condition Diabetes mellitus)`) | `Initial assessment: measure glucose if decreased consciousness, seizures, confused, unable to sit up or diabetic` |\n| ROUT (weight, BP, pulse, temperature) | Routine vitals: no task needed | — |\n| COUGH = Yes | `measure` respiratory rate and SpO₂ due to cough, dyspnea or difficulty breathing | `Initial assessment: measure respiratory rate and oxygen saturation if coughing or difficulty breathing` |\n| PROMPT (\"seen promptly\") | **Not modelled**: VHA's lowest priority is `Urgent`, which the page reserves for the red box (see remaining questions) | — |\n| PREG | `measure` MUAC and height, due to `(clinical_finding Pregnancy)` | `Initial assessment: measure MUAC and height in the pregnant patient` |\n| HTN | `measure` height, waist circumference, glucose, due to `(active_condition Hypertensive disorder, systemic arterial)` | `Initial assessment: measure BMI inputs, waist circumference and glucose in the patient with hypertension` |\n| DM | `measure` glucose, height, waist and hip circumference, due to known diabetes (`Known present` form or `(active_condition Diabetes mellitus)`) | `Initial assessment: measure glucose, BMI inputs, waist and hip circumference in the patient with diabetes` |\n\n## Notes\n\n- Visit timing (\"at booking visit\", \"every visit\", \"once a year\", \"3-6 monthly\", \"at 26 / 30 / 36\n  weeks\") cannot be expressed; each measure task fires whenever its condition is active.\n- Hb, urine dipstick, rapid rhesus, syphilis, HIV tests and visual acuity have no observable/unit\n  in the language and are not modelled.\n", "questions": "# Page 11 – Initial assessment of the patient: remaining questions\n\nFinal build reconciled from two independent builds (A and B). Base: A. See `reconcile.json`.\n\n## Decisions made\n\n- **Trigger for the red-box questions.** This page has no presenting complaint: the red box applies\n  to every patient. The language has no \"every patient\" anchor, so the `check_for` task is due to\n  the root concept `(clinical_finding (snomed_concept \"Clinical finding\" \"finding\"))`. Descendants\n  match in `due_to`, so the questions are asked once anything at all is recorded for the patient.\n  The other build anchored on the list of common symptoms (plus active Fever). That would skip a\n  patient with no common symptom recorded, so the reconciler kept the root concept.\n- **One Urgent priority evaluation** (`Urgent: initial assessment danger signs`): a plain `or` of the\n  red-box items with no complaint wrapper, because the header says \"the patient with any of\". All\n  items are `Urgent` because the page says \"urgent attention\". Several items are also warning signs\n  with higher levels (Seizure = Emergency; chest pain, aggression, eye injury and coughing blood =\n  Very urgent). Those warning-sign rules keep their own levels and were not escalated here.\n- **\"Headache *and* vomiting\"** is `(and Headache Finding of vomiting)`. Neither one alone counts.\n- **\"Pregnant *with* abdominal pain/vaginal bleeding\"** is `(and Pregnancy (or Abdominal pain,\n  Bleeding from vagina))`. Pregnancy uses the `clinical_finding` form everywhere, including the\n  booking-visit measure task, because no rule diagnoses pregnancy at `probable`.\n- **\"Recent sudden onset weakness, numbness or visual disturbance\"**: each of Muscle weakness,\n  Numbness and Visual disturbance carries both the `Sudden onset` and `Recent` qualifiers. The\n  Cerebrovascular accident warning sign was not added, because the page does not name it.\n- **\"Aggressive, confused or agitated\"**: Aggressive behavior (a warning sign); Clouded consciousness\n  (the AVPU \"Confused\" form, a parent of Acute confusion, chosen because the page does not say\n  acute); Feeling agitated (`Agitation` does not exist).\n- **\"Overdose of drugs/medication\"** = `Overdose` (disorder), a child of Poisoning. No \"Drug\n  overdose\" concept exists.\n- **\"Recent sexual assault\"** = `Victim of sexual aggression` (finding; SNOMED synonym \"sexual\n  assault\") with the `Recent` qualifier. It was chosen over `Alleged victim of sexual assault`\n  (situation) because the page does not say \"alleged\". No time window is given, so there is no\n  onset comparison.\n- **\"Suspected fracture or joint dislocation\"** = Fracture of bone or Dislocation of joint. There is\n  no \"suspected\" qualifier; the health worker's \"yes\" stands for the suspicion.\n- **Eye injury** = `Injury of eye region` (general; the warning sign `Injury of globe of eye` is a\n  descendant). **Vomiting blood** = `Hematemesis` (general; the warning sign `Vomiting blood - fresh`\n  is a descendant).\n- **\"Purple/red rash that does not disappear with gentle pressure\"** = Non-blanching rash *or*\n  Purpuric rash. The page's words describe both. The two are not related in SNOMED, and Purpuric\n  rash is the concept VHA's rules already use for this sign.\n- **\"Known diabetic\"** is asked in the `check_for` in Will's known-chronic-condition form\n  (`Diabetes mellitus` + `Known present`). The glucose tasks fire on that form or on\n  `(active_condition Diabetes mellitus)` from the patient's record.\n- **Measure tasks for conditional \"routine\" vitals.** The page makes two of them conditional:\n  - glucose (red-box management line: \"If decreased consciousness, seizures, confused, unable to\n    sit up or known diabetic, also check glucose\");\n  - respiratory rate and SpO₂ (\"If coughing/difficulty breathing\"). The trigger is Cough, Dyspnea\n    (the recorded common-symptom form) or Difficulty breathing.\n\n  Weight, BP, pulse and temperature are routine for every patient and get no task. Unable to sit up,\n  Cough, Headache and vomiting are in the `check_for` so the tasks and the priority can fire.\n- **Pregnant / hypertension / diabetes branches** are `measure` tasks:\n  - pregnancy → MUAC and height (for BMI);\n  - hypertension → height (BMI), waist circumference and glucose;\n  - diabetes → glucose, height (BMI), and waist and hip circumference (waist-hip ratio).\n\n  Weight and BP are routine. The other build left these branches out because visit frequency\n  cannot be expressed. The reconciler kept them because the page lists them as checks. They are\n  marked unsettled (see Questions). There are no `manage` tasks.\n- There are no \"X likely\" / \"consider X\" statements on this page, so there are no diagnosis rules.\n- The page has no \"Shock/SBP < 80\" or \"BP < 90/60\" wording in the red box.\n\n## Could not model\n\n- **\"Ensure the patient with any of the following is seen promptly by nurse or doctor\"**:\n  - BP ≥ 180/110 or systolic BP < 80;\n  - pregnant with BP ≥ 140/90;\n  - pulse irregular, ≥ 100 or < 50;\n  - temperature ≥ 38°C;\n  - respiratory rate ≥ 30;\n  - glucose < 3 (or < 4 if diabetic) or ≥ 11.1;\n  - SpO₂ < 92% at rest;\n  - SpO₂ drop to < 87% on exertion.\n\n  VHA's priorities are Emergency / Very urgent / Urgent only, and the page ranks \"seen promptly\"\n  below the red box's \"urgent attention\". Encoding these items as `Urgent` would over-triage, so\n  they are not encoded. The page's rules therefore fire less often than it intends: these patients\n  get no priority from this page. RR ≥ 30 is also in the red box and is encoded there. \"SpO₂ drop on\n  exertion (walking 15-20 m)\" and \"pulse irregular\" would also need forms the language lacks.\n- **Visit timing**: \"at booking visit\", \"every visit\", \"once a year\", \"3-6 monthly if trying to lose\n  weight\", \"at 26 weeks\", \"at 30 and 36 weeks\". Measure tasks fire whenever the condition is\n  present, which is more often than the page intends for the booking-visit and yearly items.\n- **Hb, urine dipstick, rapid rhesus, syphilis, HIV tests and visual acuity**: there is no\n  observable or unit for them in the language. The conditional rules built on them (\"urine dipstick\n  only if fingerprick glucose ≥ 11.1\", \"fingerprick glucose only if glucose on urine dipstick on ≥ 2\n  occasions\") are not encoded.\n- **\"Fingerprick glucose only if risk factor²\"** in pregnancy (booking visit and 26 weeks): the\n  footnote-2 risk factors include:\n  - glycosuria;\n  - BMI ≥ 35;\n  - age ≥ 40;\n  - obstetric history;\n  - SFH large for gestational age;\n  - ethnicity.\n\n  They are not encoded, because they need dipstick, gestational-age and history items. Glucose for\n  pregnant patients is therefore not requested by this page's rules, so they fire less often than\n  the page intends.\n- **BMI and waist-hip ratio** are derived values; only their inputs (height, and waist and hip\n  circumference) are requested.\n- \"Ensure patient is urgently seen by nurse or doctor\" is the Urgent priority itself, not a task.\n\n## SNOMED gaps\n\n- `Confusion` (finding) was not found, so Clouded consciousness (finding) is used.\n- `Agitation` (finding) was not found, so Feeling agitated (finding) is used.\n- `Drug overdose` (disorder) was not found, so Overdose (disorder) is used.\n- \"Breathless while talking\" has no exact concept, so Unable to complete a sentence in one breath is\n  used.\n- There is no concept for \"suspected fracture\", so Fracture of bone is used.\n- All `finding_site` values (Face structure) were confirmed to exist.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Is anchoring the red-box questions on \"any recorded clinical finding\" acceptable, or should VHA\n  add a true \"initial assessment\" trigger for every patient?\n- Should the \"seen promptly\" vital-sign thresholds get a priority at all? VHA has nothing below\n  Urgent. Would you rather they were Urgent (over-triage) than unencoded?\n- **Unsettled (reconciler):** should the pregnant / hypertension / diabetes branch checks (MUAC,\n  height, waist and hip circumference, yearly glucose) be measure tasks that fire at every visit,\n  or be left out until VHA can express visit frequency?\n- \"Difficulty breathing\" is not a descendant of the recorded common symptom Dyspnea. Should every\n  patient presenting with shortness of breath be Urgent from this page, i.e. should Dyspnea be added\n  to the red-box `or`? Dyspnea currently triggers only the RR/SpO₂ measure task.\n- Decreased consciousness: VHA's AVPU records \"Reacts to voice\", \"Reacts to pain\" and \"Unresponsive\"\n  as `Impairment of mental alertness`, `Responds to pain` and `Unresponsive`. These are not\n  descendants of `Decreased level of consciousness`. Should the priority rule also accept them?\n- Confused: is `Clouded consciousness` (the AVPU form) correct here, or `Acute confusion`?\n- Purple/red non-blanching rash: are both `Non-blanching rash` and `Purpuric rash` right, or only one?\n- Is requiring both \"Sudden onset\" and \"Recent\" on weakness/numbness/visual disturbance right, or\n  should \"Sudden onset\" alone suffice?\n- Should plain \"Bleeding\" (any bleeding, including minor) make the patient Urgent, as the page\n  literally says?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent signs at initial assessment of the patient", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Clinical finding\" \"finding\"))", "element_keys": ["p11-6372edd4"], "quote": "the patient"}, {"claim_id": "c002", "rule": "Check for urgent signs at initial assessment of the patient", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased level of consciousness\" \"finding\"))", "element_keys": ["p11-30df61c4"], "quote": "Decreased consciousness"}, {"claim_id": "c003", "rule": "Check for urgent signs at initial assessment of the patient", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Seizure\" \"finding\"))", "element_keys": ["p11-9c073b1d"], "quote": "Seizures"}, {"claim_id": "c004", "rule": "Check for urgent signs at initial assessment of the patient", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Aggressive behavior\" \"finding\"))", " ay. Hb, rhesus/syphilis and urine dipstick are not measurements, so leaving them out is acceptable.", "severity": "medium"}, {"rule": "Initial assessment: measure BMI inputs, waist circumference and glucose in the patient with hypertension", "verdict": "problem", "problem": "The page sets BMI, waist and glucose once a year (waist 3-6 monthly if losing weight); the rule fires every visit with no cadence. The concepts are right.", "severity": "low"}, {"rule": "Initial assessment: measure glucose, BMI inputs, waist and hip circumference in the patient with diabetes", "verdict": "problem", "problem": "Glucose is every visit, but BMI, waist and hip (waist-hip ratio) are once a year; the cadence is collapsed into one every-visit task. The concepts are right.", "severity": "low"}, {"rule": "Urgent: initial assessment danger signs", "verdict": "ok", "problem": "Urgent matches 'Give urgent attention'. All 21 red-box criteria are present. 'Headache and vomiting' is correctly an and. 'Pregnant with abdominal pain/vaginal bleeding' is correctly and(pregnancy, or(...)). The rash is split into an or of Non-blanching and Purpuric, which is equivalent because purpura is non-blanching. No presenting-complaint and-wrapper is used, which is right for a page that applies to all patients.", "severity": "low"}, {"rule": "(missing) Seen promptly by nurse or doctor", "verdict": "problem", "problem": "The middle box 'Ensure the patient with any of the following is seen promptly by nurse or doctor' is page triage logic and has no rule: BP >= 180/110 or systolic < 80, pregnant with BP >= 140/90, pulse irregular/>= 100/< 50, temperature >= 38, glucose < 3 (< 4 if diabetic) or >= 11.1, SpO2 < 92% at rest, or a drop to < 87% on exertion. RR >= 30 appears only through the Urgent rule.", "severity": "medium"}], "summary": "The concepts are clean: every red-box criterion maps to an existing, appropriate SNOMED concept, and the and/or structure of the Urgent rule matches the page. The most consequen heck_for omits RR >= 30 measurement.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: initial assessment danger signs", "text": "Single Urgent rule with 'Bleeding' generic and 'Fracture of bone' non-suspected; priority level Urgent is plausible given the red box. Semantic tags 'disorder' on Visual disturbance/Hematemesis/Burn worth verifying with the SNOMED tool.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "(none) — 'Ensure the patient … is seen promptly' box", "text": "The second-tier triage thresholds (BP ≥ 180/110 or SBP < 80, pregnant BP ≥ 140/90, pulse irregular/≥100/<50, temp ≥ 38, glucose < 3 / < 4 if diabetic / ≥ 11.1, SpO2 < 92%) are not encoded anywhere. Grammar has no level below Urgent, so this is a design gap that should at least be recorded as a decision.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Initial assessment: measure BMI inputs, waist circumference and glucose in the patient with hypertension", "text": "Trigger is active_condition only; the diabetes task also accepts the clinical_finding 'Known present' form. Inconsistent anchoring between the two chronic-condition branches.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Check for urgent signs at initial assessment of the patient", "text": "due_to is the SNOMED root 'Clinical finding', so the check list fires on any recorded finding — intended as a universal pre-screen but very broad; check_for and priority rule agree item for item (every check_for item is consumed by the priority rule or a measure task).", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Initial assessment: measure MUAC and height in the pregnant patient / hypertension / diabetes tasks", "text": "Visit-frequency semantics (booking visit, every visit, yearly, 3-6 monthly, 26/30/36 weeks) are lost; tasks fire on every encounter.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: initial assessment danger signs", "text": "Concept choices for 'confused' (Clouded consciousness; 'Confusional state' disorder not a descendant) and 'agitated' (Feeling agitated; 'Psychomotor agitation' not a descendant) may miss patients recorded with the observed-sign concepts.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Check for urgent signs at initial assessment of the patient", "text": "Type (check task) and red-box coverage are right (all 20 red-box items present), but the task's title claims every item is an urgent sign while three items (Cough, Unable to sit up, Diabetes mellitus known present) come from the Management line or the routine-tests block, not the red box. Cough is also a recorded common symptom and need not be checked for. Trigger on the root 'Clinical finding' is a broad approximation of 'every patient'.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Initial assessment: measure MUAC and height in the pregnant patient", "text": "Trigger right; the page limits MUAC and height to the booking visit, and the rule has no timing, so it is due at every antenatal visit. The booking-visit Hb, rapid rhesus/syphilis, urine dipstick and conditional fingerprick glucose (risk factors in footnote 2) are not encoded, nor the 26-week glucose and 30/36-week Hb.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Initial assessment: measure BMI inputs, waist circumference and glucose in the patient with hypertension", "text": "Trigger right. 'Check once a year' timing (and 3-6 monthly if trying to lose weight) is dropped for all three measurements; the yearly urine dipstick and the 'also check glucose if glucose on urine dipstick' condition are not encoded.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "medium", "ref": "Initial assessment: measure glucose, BMI inputs, waist and hip circumference in the patient with diabetes", "text": "Trigger right and every-visit glucose right. The yearly timing for BMI, waist circumference and waist-hip ratio is dropped (so they are due every visit alongside glucose); yearly urine dipstick and visual acuity, and the every-visit 'urine dipstick only if fingerprick glucose >= 11.1' are not encoded.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 11, "slug": "11-initial-assessment-of-the-patient", "kind": "rule", "priority": "high", "ref": "(missing) Prompt review: 'Ensure the patient with any of the following is seen promptly by nurse or doctor'", "text": "The page's second triage block (BP >= 180/110 or systolic < 80; pregnant with BP >= 140/90; pulse irregular, >= 100 or < 50; temperature >= 38; RR >= 30; glucose < 3 (< 4 if diabetic) or >= 11.1; SpO2 < 92% at rest or drop to < 87% on exertion) has no priority evaluation at all. These are all measurement comparisons the grammar can express. This is the page's main triage logic outside the red box and it is absent.", "detail": [{"checker": "backward-1", "severity": "high"}]}, {"page": 11, "s <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);

// ---------- storage: browser drafts only, namespaced; export is the record ----------

const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};

(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });

(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });

const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------

function renderHeader() {

    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>

    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>

  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
