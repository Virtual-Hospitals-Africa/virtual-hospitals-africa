ctor. • Check for symptoms/signs suggestive of cancer or if eligible for cancer screening 194.", "bbox": [48.2, 268.3, 215.7, 369.3], "key": "p43-7ac76b8c"}, {"id": "p43-out-e04", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check medications • If on abacavir or zidovudine, check for urgent side effects 131. • Chlorphenamine, enalapril, amlodipine, fluoxetine, amitriptyline, metoclopramide, sodium valproate, phenytoin and spironolactone can cause weakness or tiredness. Discuss with doctor.", "bbox": [250.9, 268.3, 389.6, 359.3], "key": "p43-a27f34b0"}, {"id": "p43-out-e05", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check mental health • In the past month, has patient felt down/ depressed/hopeless or little interest/pleasure in doing things? If yes to either 159. • In the past year, has patient drunk ≥ 4 drinks1/session, used illegal drugs or misused prescription/over-the-counter medications? If yes to any 165. • If none of the above, assess for stress and anxiety 98.", "bbox": [425.2, 268.3, 598.5, 369.3], "key": "p43-d9bf9d23"}, {"id": "p43-out-e06", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check long-term health conditions • Test for HIV 124. If HIV positive, give routine care 126. • Check for pregnancy 174. • Check Hb. If < 12 (woman) or < 13 (man), anaemia likely 44. • Check for diabetes 19. • If patient has a life-limiting illness, also give palliative care 191.", "bbox": [633.6, 268.3, 791.8, 359.3], "key": "p43-9b35877c"}, {"id": "p43-out-e07", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes No", "bbox": [330.2, 410.0, 735.6, 420.2], "key": "p43-5c0a4937"}, {"id": "p43-out-e08", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Is there muscle weakness on examination2?", "bbox": [341.7, 384.5, 502.3, 394.7], "key": "p43-fbdf4e0b"}, {"id": "p43-out-e09", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Ask about duration of tiredness:", "bbox": [277.4, 435.4, 395.6, 445.6], "key": "p43-c77efdca"}, {"id": "p43-out-e10", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "< 1 month ≥ 1 month", "bbox": [108.1, 460.9, 455.7, 471.1], "key": "p43-a7ee6187"}, {"id": "p43-out-e11", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Doctor to confirm weakness and: - Check potassium, sodium,", "bbox": [665.4, 435.4, 792.3, 455.6], "key": "p43-1c67a33a"}, {"id": "p43-out-e12", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "calcium, phosphate, TSH - Discuss/refer to specialist. • If no doctor available, refer. • If any other symptoms managed above, reassure that tiredness should resolve with treatment. • Advise to return if no better in 1 month.", "bbox": [51.1, 455.4, 771.4, 526.5], "key": "p43-218a7170"}, {"id": "p43-out-e13", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Check FBC, differential count, sodium, calcium, creatinine and ALT. If abnormal, discuss with doctor. • If likely cause found, reassure that tiredness should resolve with treatment. If tiredness persists despite treatment, discuss/refer. • If no cause found, review in 1 month. If tiredness persists and cause still not found, discuss/refer.", "bbox": [252.3, 486.3, 622.0, 526.5], "key": "p43-2c8c54cd"}, {"id": "p43-out-e14", "page": 43, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1One drink is 1 tot of spirits, or 1 small glass (125mL) of wine or 1 can/bottle (330mL) of beer. 2If unsure how to examine for muscle weakness, discuss with doctor.", "bbox": [34.0, 543.3, 527.0, 551.8], "key": "p43-5d39e508"}], "boxes": [{"box": 1, "rect": [35.5, 86.1, 806.3, 203.6]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAD2CAIAAADj8cfbAAAACXBIWXMAABcSAAAXEgFnn9JSAAE4lElEQVR4nOy9B1QV27rne+45t/u+O16P8brv7Xu7X/e7fXQJiiIKKGJEEXPOOWEATKiICVExYdrqNm8Uc84REUUQFFSCxG3O2xxQUTHssN6f9encc1fVqlUEBdzfGL+xRq1Zs2bNXPP715yz/vL8/7NjGIZhGIZhGIZhGIZhmLLFX0o8BgzDMAzDMAzDMAzDMAxTUFjVYhiGYRiGYRiGYRiGYcoef1C18pbNYBiGYRiGYRiGYRiGYZjSyetRPtqqlvnnHxmGYRiGYRiGYRiGYRimdPIhaiOrWgzDMAzDMAzDMAzDMEwZg1UthmEYhmEYhmEYhmEYpuzBqhbDMAzDMAzDMAzDMAxT9mBVi2EYhmEYhmEYhmEYhil7sKrFMAzDMAzDMAzDMAzDlD1Y1WIYhmEYhmEYhmEYhmHKHqxqMQzDMAzDMAzDMAzDMGUPVrUYhmEYhmEYhmEYhmGYsgerWgzDMAzDMAzDMAzDMEzZg1UthmEYhmEYhmEYhmEYpuzBqhbDMMyfkQ9v0/NyU0s8GowOZauMHtyNizoaDq5fPlbikdHk1fPzJR6HQkTs/Zs0ytjks7tKPKpE6S/rYic3J/nXD1nFGODl7AjKw2ePEko8dcVLWUkaynTPziXLl0w5uHdFiUeGYRiGKQqsajEMw3ybXMo6sjZsVtAEvz492/sM7D55ot+hfSt+fpeJU3duRLtWr1q1cqXzCTtKPJ6MJmWujPbvXmb6+9/B4u8mlXhk1EyfOhJxGzKwW4nHRObXD1ltWza2K19+9aoZ1vw8uBtHGduja+sSjzBRysu62DlycFUluwr13Gvk5iQVV5hUIcGpkxtLPIHFS5lI2o8Zh9xcq1M869dxK/H4MAzDMEWBVS2GYZhvjYc/xY0d5U3jdZlqjpV/eZ+vakVFrCGXH5aHlHhsvzRXfoxYt3r2cL/ehbBI83JTjx1ZPStk9MZ1c4Xj4/und2//fkLgkHNnik1vSozftnTR5ClBw4TLFy0jzXQVMcKlR+nQTF3LZg0RN6cqDh/zMop+i+KqA88fJ9qVL4+IDejTyVrIrGp9ZdR1O2TKJ5kmLXlvcd2lTEg/32rSfvuY3aalJ0WytpvLMN9eJR4lhmEYpiiwqsUwDPNNkZuT1KCuG43XHeztundpHTh6oN+Qni2aeoiJKh/epi9bHDx39tgXT8+VeIS/NP37dKTceP44saDXXkjaS9dODRouHFctm0aORw+FFVckHewrIMDmXg2EyxctI810FTHCpUfp0ExdatKeSeN8Yk9sKJZbFGMdOLBn+eSJflcuHrUWMqtaXxl13b5/91RI8Ij1a0KL8S6lX/r5hpP2060YimGr5o3Q05Z4fBiGYZgiwqoWwzDMN8UIvz40Xu/Vre292zHyqfdv0uggNyfpyo8R4NmjhF8/ZNEx+O1jNnmA+2cPvytBMO2OR4ZfSNorwlFw40oULrl6MZL+/vI+kwK5cyOaXK5disTfpw/P4Bje4mM2i2sf3Ys/Ebk2I3X/z+8yH98/DW8I7Y+RT8etEQFEQ3anMJ88OG22LLo8cnBVZtoB+WyXji0oQ5LP7oJP9VQdpBr3ggEWeTjscnYELdIEOU/OHty7gq71H94P1 ifier (snomed_concept \"Sudden onset\" \"qualifier value\")))"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))"}]}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Cerebrovascular accident\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Dehydration\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Heart failure\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Transient ischemic attack\" \"disorder\") possible)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 43 – Weakness or tiredness: flowchart\n\nSource: APC 2026 e-book page 43 (APC 2026 page 43). The red box is a flat \"any of\" list; the lower\nhalf of the page is a Yes/No and duration algorithm for the patient **not** needing urgent attention.\n\n```mermaid\nflowchart TD\n    C[\"Patient with weakness or tiredness\"] --> RB{\"Any red-box finding?<br/>stroke/TIA signs · glucose &lt; 3 (&lt; 4 if diabetes) or ≥ 11.1 · chest pain ·<br/>difficulty breathing or RR ≥ 30 · Hb &lt; 6 · heart failure likely ·<br/>worsening weakness of leg/s · dehydration likely · temp ≥ 38°C now or in past 3 days\"}\n    RB -- Yes --> URG[\"Give urgent attention · Manage urgently\"]\n    RB -- No --> APP[\"Approach: check symptoms, medications,<br/>mental health, long-term conditions (cross-references)\"]\n    APP --> MW{\"Is there muscle weakness on examination²?\"}\n    MW -- Yes --> DOC[\"Doctor to confirm weakness; check K, Na, Ca, PO₄, TSH;<br/>discuss/refer to specialist. If no doctor, refer.\"]\n    MW -- No --> DUR{\"Duration of tiredness?\"}\n    DUR -- \"&lt; 1 month\" --> SHORT[\"Reassure if other symptoms managed;<br/>return if no better in 1 month\"]\n    DUR -- \"≥ 1 month\" --> LONG[\"Check FBC, diff count, Na, Ca, creatinine, ALT;<br/>review / discuss / refer\"]\n```\n\n² If unsure how to examine for muscle weakness, discuss with doctor.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `Fatigue` or `Asthenia` (weakness) as clinical findings | `Check for urgent weakness or tiredness conditions` (trigger) |\n| Red box: stroke/TIA signs | Sudden-onset asymmetric weakness/numbness of face, upper limb, lower limb; difficulty talking or visual disturbance (no onset qualifier) | `Urgent: weakness or tiredness with red-box findings`; `Diagnose possible stroke (weakness or tiredness page)`; `Diagnose possible TIA (weakness or tiredness page)` |\n| Red box: glucose | Glucose < 3, or < 4 with known diabetes, or ≥ 11.1 mmol/L | `Urgent: weakness or tiredness with red-box findings` |\n| Red box: chest pain; difficulty breathing or RR ≥ 30 | Findings / vital | `Urgent: weakness or tiredness with red-box findings` |\n| Red box: Hb < 6 | Not representable (no Hb observable/unit) | — |\n| Red box: heart failure likely | Orthopnoea **and** leg swelling → probable heart failure | `Diagnose probable heart failure (weakness or tiredness page)` → `(active_condition Heart failure)` in the urgent rule |\n| Red box: worsening weakness of leg/s | Lower-limb muscle weakness with `Worsening` qualifier | `Urgent: weakness or tiredness with red-box findings` |\n| Red box: dehydration likely | Any of thirst, dry mouth, decreased skin turgor, BP < 90/60 → probable dehydration | `Diagnose probable dehydration (weakness or tiredness page)` → `(active_condition Dehydration)` in the urgent rule |\n| Red box: temperature | Temp ≥ 38 °C, or active fever | `Urgent: weakness or tiredness with red-box findings` |\n| Muscle weakness on examination? Yes/No | Routing to doctor/investigations only; no diagnosis or priority | Not encoded (management) |\n| Duration < 1 month / ≥ 1 month | Routing to reassurance/investigations only | Not encoded (management) |\n\n## Notes\n\n- The non-urgent half of the page ends only in investigations, referral, reassurance and\n  cross-references; it names no \"likely\" diagnosis that the language can express (the only one,\n  \"anaemia likely\" from Hb < 12/13, needs a haemoglobin value).\n\nEvery diagnosis rule above also requires the complaint (Fatigue or Asthenia), because the red box\napplies to \"the patient with weakness or tiredness\".\n", "questions": "# Page 43 – Weakness or tiredness: remaining questions\n\nFinal build, reconciled from two independent builds (A and B). See `reconcile.json`.\n\n## Decisions made\n\n- **Presenting complaint** is `Fatigue` (a recorded common symptom; `Tired` is its child) or\n  `Asthenia` (SNOMED has no plain \"Weakness\" finding). It is the `due_to` of the `check_for` task,\n  the first conjunct of the urgent rule, and the first conjunct of **every diagnosis rule**, because\n  the red box applies only to \"the patient with weakness or tiredness\". `Muscle weakness` was not\n  added to the trigger because the red box's limb-weakness items are its descendants.\n- **Stroke/TIA item** (\"New sudden asymmetric weakness or numbness of face, arm or leg; difficulty\n  speaking or visual disturbance: consider stroke or TIA\"): six weakness/numbness findings (face,\n  upper limb, lower limb), each qualified `Sudden onset` **and** `Asymmetry` (the page says\n  \"sudden asymmetric\"). \"New\" is taken as implied by sudden onset. \"Difficulty speaking\"\n  (`Difficulty talking`, the exact SNOMED match and VHA's usual term) and \"visual disturbance\" are\n  **not** qualified, because \"New sudden\" grammatically governs only the clause before the\n  semicolon (see questions). These feed the urgent rule and two `possible` rules\n  (Cerebrovascular accident, Transient ischemic attack), since the page says \"consider\".\n- **Glucose**: `< 3`, or `< 4` **and** known diabetes (`Diabetes mellitus` + `Known present`, the\n  same form checked for and used), or `≥ 11.1` mmol/L.\n- **Heart failure likely**: `probable` Heart failure from `Orthopnea` **and** `Leg swelling symptom`;\n  the urgent rule references `(active_condition Heart failure)`.\n- **Dehydration likely**: `probable` Dehydration from **any** of increased thirst, xerostomia,\n  decreased skin turgor, systolic < 90 or diastolic < 60 (BP < 90/60 per Will's convention); the\n  urgent rule references `(active_condition Dehydration)`. See questions.\n- **Worsening weakness of leg/s**: `Weakness of muscle of lower limb` + `Worsening` qualifier.\n- **Temperature ≥ 38 °C now or in past 3 days**: body temperature ≥ 38, or\n  `(active_condition Fever)`. No onset window, because a fever that began more than 3 days ago and\n  is still present is also a fever \"in the past 3 days\".\n- **Priority level** is `Urgent` throughout (\"give urgent attention\"). No shock wording on this page.\n- **Vocabulary deviations**: `Increased thirst` instead of `Thirst due to water deprivation`, and\n  `Xerostomia` instead of `Xerostomia due to dehydration`; both vocabulary terms assert a cause the\n  page does not state.\n- **Lower half of the page** (checks of symptoms, medications, mental health, long-term\n  conditions; muscle weakness on examination Yes/No; duration < 1 / ≥ 1 month) ends only in\n  investigations, referral, reassurance and cross-references, so it adds no rules. The flowchart\n  file records it.\n- No `measure` task: glucose, temperature, RR and BP are routine vitals. No `manage` tasks.\n\n## Could not model\n\n- **Hb < 6** (red box): no haemoglobin observable/unit in the language. The urgent rule therefore\n  **fires less often** than the page intends (a tired patient whose only red-box finding is\n  Hb < 6 is not flagged).\n- **\"Check Hb. If < 12 (woman) or < 13 (man), anaemia likely\"** (outside the red box): not\n  representable for the same reason (and it needs sex); no probable anaemia rule. Page 44 covers\n  anaemia.\n- **\"in past 3 days\"** for fever: `(active_condition Fever)` has no 3-day window, so this branch can\n  **fire more often** than the page intends (an older, still-active fever record counts).\n- `(active_condition Heart failure)` also matches known heart failure from history, so the urgent\n  rule fires **more often** than \"heart failure likely\" from today's findings alone.\n- \"Difficulty speaking\" and \"visual disturbance\" without an onset qualifier make the stroke/TIA\n  rules fire **more often** than if \"new sudden\" applied to them too.\n- \"Muscle weakness on examination\" and duration of tiredness are routing questions that lead only\n  to management; not encoded.\n\n## SNOMED gaps\n\n- \"Weakness\" (finding): does not exist; used `Asthenia`.\n- \"Difficulty speaking\" (finding): does not exist; used `Difficulty talking`.\n- \"Thirst\" (finding) and \"Dry mouth\" (finding): do not exist; used `Increased thirst` and\n  `Xerostomia`.\n- \"Asymmetrical\" (qualifier value): does not exist; used `Asymmetry`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n1. Dehydration: does \"Thirst, dry mouth, poor skin turgor, BP < 90/60, dehydration likely\" mean any\n   one sign, all of them, or some combination? The build reads it as any one, so e.g. thirst alone\n   makes dehydration probable and the patient urgent.\n2. Should \"new sudden\" also govern \"difficulty speaking or visual disturbance\"? The build applies\n   it only to weakness and numbness (the clause before the semicolon).\n3. Is `Asymmetry` the right way to record one-sided weakness/numbness, or should laterality\n   (left/right) be recorded instead?\n4. Is a still-active fever older than 3 days meant to count as \"temperature ≥ 38 °C in past 3 days\"?\n5. Is `Asthenia` the right recorded concept for the complaint \"weakness\"? Weakness is not a\n   recorded common symptom; should the app offer it so this page triggers on it?\n6. Blood glucose is only on VHA's vitals form for patients with diabetes. Should weakness or\n   tiredness trigger a glucose measurement for everyone, so the glucose criteria can fire? (No\n   `measure` task was added, following Will's rule that glucose is a routine vital.)\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent weakness or tiredness conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Fatigue\" \"finding\"))", "element_keys": ["p43-78963a6b"], "quote": "tiredness"}, {"claim_id": "c002", "rule": "Check for urgent weakness or tiredness conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Asthenia\" \"finding\"))", "element_keys": ["p43-78963a6b"], "quote": "weakness"}, {"claim_id": "c003", "rule": "Check for urgent weakness or tiredness conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))", "element_keys": ["p43-25ab7dfe"], "quote": "New sudden asymmetric weakness or numbness of face, arm or leg"}, {"claim_id": "c004", "rule": "Check for urgent weakness or tiredness condition e' match is by exact s-expression of the leaf, this may be flagged. Cannot verify without the VHA test; noting only.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "high", "ref": "Urgent: weakness or tiredness with red-box findings", "text": "Heart failure and dehydration criteria enter via active_condition (Heart failure, Dehydration) instead of the page's own findings; urgent priority depends on a diagnosis being treated as an active condition, which may never fire from the 'likely' findings.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Urgent: weakness or tiredness with red-box findings", "text": "Fever in past 3 days approximated with active_condition Fever; recency lost.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Urgent: weakness or tiredness with red-box findings", "text": "Whole priority rule gated on Fatigue/Asthenia, while the page says 'weakness or tiredness'; generalised weakness recorded as e.g. muscle weakness would not trigger.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "check_for", "text": "Check list omits measurement items (glucose, RR, BP, temperature) and heart failure/fever items used by the priority rule; list and priority rule differ.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "stroke/TIA", "text": "Possible stroke and possible TIA rules are identical so both always co-fire; acceptable per page wording.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "high", "ref": "Diagnose probable dehydration (weakness or tiredness page)", "text": "OR over a sign cluster: any single sign (e.g. thirst or dry mouth) gives probable dehydration, and via active_condition Dehydration the patient becomes Urgent. The page means the combination. Use and, or any2.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Urgent: weakness or tiredness with red-box findings", "text": "(active_condition (snomed_concept \"Heart failure\" \"disorder\")) is satisfied by any known, stable heart failure diagnosis, not only the page's 'orthopnoea + leg swelling, heart failure likely'. A tired patient with chronic HF is always made Urgent. The same applies to (active_condition Fever) with no 3-day bound.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Urgent: weakness or tiredness with red-box findings", "text": "The 'Temperature ≥ 38°C … in past 3 days' arm has no onset window; (< (onset (active_condition Fever)) (time_ago 3 days)) is expressible and was not used.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke / possible TIA", "text": "'Difficulty talking' has no SNOMED descendants, so speech findings recorded as Dysarthria, Aphasia or Slurred speech do not trigger the stroke/TIA or Urgent rules. Limb/face findings only match when both the Sudden onset and Asymmetry qualifiers are recorded.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Check for urgent weakness or tiredness conditions", "text": "Type, trigger (Fatigue or Asthenia) and contents match the red box, except that nothing ly' (p43-9b35877c). The brief asks for every 'X likely' as a probable diagnosis; none is written. (snomed_concept \"Anemia\" \"disorder\") exists. If Hb cannot be expressed as a measurement, record it in remaining questions.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Check for urgent weakness or tiredness conditions", "text": "Check task includes bare known diabetes as a check item, and omits red-box Hb < 6, glucose, respiratory rate and temperature thresholds that are in the box.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Diagnose probable dehydration (weakness or tiredness page)", "text": "BP < 90/60 split into independent OR branches; diastolic alone fires.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "high", "ref": "Urgent: weakness or tiredness with red-box findings", "text": "Hb < 6 (red box, bullet 'Hb < 6 ->44') is entirely missing. Heart failure and dehydration enter via active_condition rather than the page findings. Fever concept replaces the 'temperature >= 38 C in past 3 days' window. Urgent level is justified by the box heading.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 43, "slug": "43-weakness-or-tiredness", "kind": "rule", "priority": "medium", "ref": "Check for urgent weakness or tiredness conditions", "text": "The red-box item 'Hb < 6' has no corresponding measure task (Hb is not a routine vital, so the house standard needs a `measure` task), and nothing on the page's Hb logic (Hb < 6 urgent; Hb < 12 woman / < 13 man → anaemia likely) is collected. Otherwise the check_for list matches the red box faithfully.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 43, "slug": "43-weakn <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.

  while (i < src.length) {
    const ch = src[i];

    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }

}

    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
