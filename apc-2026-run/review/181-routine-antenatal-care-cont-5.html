he HIV positive patient in labour", "section_y": 422.2, "indent": 1, "parent": null, "text": "Give ideally during early labour, and urgently if delivery is imminent.", "bbox": [51.2, 452.6, 317.5, 463.4], "key": "p181-5caf5c23"}, {"id": "p181-rb1-e06", "page": 181, "box": 1, "kind_hint": "management", "section": "Treat the HIV positive patient in labour", "section_y": 422.2, "indent": 1, "parent": null, "text": "Start patient on ART next day 126. Give 2 months ART supply.", "bbox": [51.2, 462.6, 300.7, 473.4], "key": "p181-415cac55"}, {"id": "p181-rb1-e07", "page": 181, "box": 1, "kind_hint": "management", "section": "Treat the HIV positive patient in labour", "section_y": 422.2, "indent": 1, "parent": null, "text": "Decide HIV transmission risk of HIV-exposed baby and give infant prophylaxis according to risk 186.", "bbox": [51.2, 472.6, 447.6, 483.4], "key": "p181-167efb2a"}, {"id": "p181-rb1-e08", "page": 181, "box": 1, "kind_hint": "other", "section": "Treat the HIV positive patient in labour", "section_y": 422.2, "indent": 0, "parent": null, "text": "DTG - dolutegravir; FTC – emtricitabine; NVP - nevirapine; TDF – tenofovir; 3TC – lamivudine, TLD - TDF/3TC/DTG or tenofovir/lamivudine/dolutegravir", "bbox": [173.6, 484.7, 668.3, 493.8], "key": "p181-359c9917"}, {"id": "p181-out-e01", "page": 181, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Treat the pregnant patient • Give folic acid 5mg daily up to 13 weeks gestation. If > 13 weeks gestation, folic acid may increase risk of gestational diabetes, large-for-gestational-age baby and neurodevelopmental effects. If on antiseizure medication, family history or previous baby with neural tube defect, continue folic acid throughout pregnancy. • Give iron1 according to Hb: - If Hb ≥ 10, give ferrous sulphate compound BPC 170mg daily or ferrous fumarate 200mg daily throughout pregnancy.", "bbox": [51.0, 195.7, 781.9, 246.8], "key": "p181-67e6b020"}, {"id": "p181-out-e02", "page": 181, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If daily iron not tolerated2, give instead ferrous sulphate compound BPC 340mg once weekly with food or ferrous fumarate 400mg once weekly with food throughout pregnancy. - If Hb < 10, give ferrous sulphate compound BPC 170mg 12 hourly with food or ferrous fumarate 200mg 12 hourly with food.", "bbox": [56.7, 246.0, 736.4, 266.8], "key": "p181-6aaee87d"}, {"id": "p181-out-e03", "page": 181, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Continue for 3 months once Hb ≥ 10, then once daily throughout pregnancy. • Give elemental calcium 1g daily (given as 3 tablets of calcium carbonate 420mg tablets, 12 hourly) to reduce the risk of pre-eclampsia. - If hypertension, diabetes, systemic lupus erythematosus (SLE), antiphospholipid syndrome or previous pre-eclampsia, give aspirin 150mg at night from 6 weeks gestation (ideally before 16 weeks) until 36 weeks. • Give tetanus, reduced-strength diphtheria and acellular pertussis vaccine (Tdap) 0.5mL IM, ideally between 26 and 34 weeks. • Give influenza vaccine 0.5mL IM if at time of annual campaign. • If gestational hypertension: - Start methyldopa 250mg 8 hourly and titrate up to 750mg 8 hourly if needed. Avoid taking iron within 4 hours of taking methyldopa. - Review weekly to check for new symptoms, BP, urine, weight, SFH, fetal heart and fetal movements 179. If proteinuria/new symptoms, refer urgently. - Refer at 38 weeks for delivery at hospital. • If HIV positive: start/continue ART and check if prophylaxis (co-trimoxazole preventive therapy or TB preventive treatment) needed 128. If HIV negative, assess for HIV pre-exposure prophylaxis (PrEP) 119.", "bbox": [51.0, 266.6, 783.0, 376.8], "key": "p181-85b437b9"}, {"id": "p181-out-e04", "page": 181, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Give routine postnatal care to patient and baby 182", "bbox": [316.9, 513.2, 525.0, 524.2], "key": "p181-acd3ea62"}, {"id": "p181-out-e05", "page": 181, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Review the pregnant patient at 20, 26, 30, 34, 36, 38, 40 weeks. If undelivered, also review at 41 weeks.", "bbox": [217.5, 392.4, 624.4, 403.6], "key": "p181-0e330a50"}, {"id": "p181-out-e06", "page": 181, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Advise the pregnant patient • Complete Maternity Case Record and give to patient, remind patient to bring it to every visit and when in labour. • Encourage patient to register on MomConnect (dial *134*550#) to receive messages to support her and her baby during pregnancy, childbirth and baby’s first year. • Advise patient to only take medication prescribed by nurse/doctor who knows she is pregnant. If unsure, advise her to check with nurse/doctor. • Alert patient to risks of smoking and drinking alcohol and urge to stop. Support patient to change 199 and refer patient to available helpline 200. • Discuss safe sex. Advise patient to use condoms throughout pregnancy and have only 1 partner at a time. • Discuss contraception choice for after delivery 170. • Educate about signs of early labour and pregnancy emergency: persistent headache, blurred vision, abdominal pain (not discomfort), drainage of liquor, vaginal bleeding, reduced fetal movements. • From 30 weeks, ensure patient knows where she is going to give birth and check if transport arrangements have been made should she go into labour. • Discuss infant feeding: - Encourage exclusive breastfeeding for 6 months, regardless of HIV status. This means that baby gets only breast milk (no formula/water/cereal) and if HIV-exposed, infant prophylaxis. - From 6 months, introduce food while continuing with feeding choice. Continue breastfeeding until 2 years for all, ensuring that HIV positive patient is adherent on ART and virally suppressed. - If patient chooses to exclusively formula feed, check that patient will be able to afford it long-term, has access to clean boiled water, and that it will be acceptable (i.e. no disclosure issues).", "bbox": [51.0, 48.9, 775.5, 180.0], "key": "p181-4ed07017"}, {"id": "p181-out-e07", "page": 181, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Avoid taking iron within 4 hours of taking calcium or methyldopa and within 2 hours of milk and tea. If on dolutegravir and taking at same time as iron, take with food. 2Abdominal pain, nausea, vomiting, constipation. 3If on dolutegravir and taking at same time as calcium, take with food. 4Tetanus vaccinations include DTP, DTP-Hib, DTaP-IPV/Hib, TD or TT.", "bbox": [34.2, 535.3, 798.5, 551.8], "key": "p181-55e42a76"}], "boxes": [{"box": 1, "rect": [35.5, 417.2, 806.4, 499.4]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAACsCAIAAABO5OxKAAAACXBIWXMAABcSAAAXEgFnn9JSAADyeUlEQVR4nOy9h1dWx/Y+/v1Dfmt97r0kMdEbY4oaY2zR3BATY2KJNRpjrIkmGrtRo1Gxa6IiICiKih3FAiIKgkgvgmKnd6TXF3g9v+e8G4bhtPdQFDTDehbrnDlzpuy9p+znnZnz/4r+v9cEBAQEBAQEBAQEBAQEBAQEBAReLvy/Ti+BgICAgICAgICAgICAgICAgIBAayFYLQEBAQEBAQEBAQEBAQEBAQGBlw8tWK36wJ0NN10EBAQEBAQEBAQEBAQEBAQEBAS6IGoPL9FmtaTicKnhroCAgICAgICAgICAgICAgICAQBeENfqgYLUEBAQEBAQEBAQEBAQEBAQEBF4yCFZLQEBAQEBAQEBAQEBAQEBAQODlg2C1BAQEBAQEBAQEBAQEBAQEBARePghWS0BAQEBAQEBAQEBAQEBAQEDg5YNgtQQEBAQEBAQEBAQEBAQEBAQEXj4IVktAQEBAQEBAQEBAQEBAQEBA4OWDYLUEBAQEBAQEBAQEBAQEBAQEBF4+CFZLQEBAQEBAQEBAQEBAQEBAQODlg2C1BAQEBAQEBAQEBAQEBAQEBARePghWS0BAQEBAQEBAQEBAQEBAQEDg5YNgtQQEBAQEBATM4t6dwMCAE0BxQVSnF6bTUV4UazdOZUncs/rOL6pd1Nck1VQkdCnRaeLWzXNkgR0eWUBAQEBAQOBlhGC1BAQEBAQEugpWrV62bPkiTbi47uz04gGr16xw+L9/AZHhvu1Mat++7VS1sqcxLDAnI4wCjx51xe2z+rt0u3XretxeCzxJt8e93fikqssTlq9YjPA/1q6UGpJfjCg2bVoLOcz/5WeDOH6Xj3Xv9uawocMqittI4rwYZKaG9vuw37u9ekVHXuwiotPD8M+HkwV2eGQB ovenance": {"edition": "2026", "page": 181, "lisp_file": "181-routine-antenatal-care-cont-5.lisp", "conditions": [], "elements_not_encoded": [{"element_key": "p181-98299e7b", "element_id": "p181-rb1-e01", "text": "Treat the HIV positive patient in labour", "reason_category": "management_step", "reason": "Header of a treatment box (ART in labour), not an urgent-attention box; no triage or diagnostic criteria to encode. Brief scope excludes manage tasks."}, {"element_key": "p181-99b25601", "element_id": "p181-rb1-e02", "text": "Note: fill 'C#DELIVERY' on blood request form code field so that VL not rejected.", "reason_category": "figure_or_note", "reason": "Administrative note about the lab request form code; no clinical logic."}, {"element_key": "p181-d0bd3e92", "element_id": "p181-rb1-e03", "text": "If on ART, continue ART throughout delivery. Check viral load, regardless of when last done, and review results at 3-6 day postnatal visit.", "reason_category": "management_step", "reason": "Continue ART and send viral load: treatment and lab-ordering steps. A viral load result also has no unit/observable in the language."}, {"element_key": "p181-ee4e1064", "element_id": "p181-rb1-e04", "text": "If not on ART, give together single dose NVP 200mg as early as possible in labour and single dose TLD: TDF/3TC/DTG 300/300/50mg.", "reason_category": "management_step", "reason": "Medicines and doses (NVP, TLD) for the patient not on ART; out of scope (no manage tasks, no medicines)."}, {"element_key": "p181-5caf5c23", "element_id": "p181-rb1-e05", "text": "Give ideally during early labour, and urgently if delivery is imminent.", "reason_category": "management_step", "reason": "Timing of the intrapartum medicine doses; management detail."}, {"element_key": "p181-415cac55", "element_id": "p181-rb1-e06", "text": "Start patient on ART next day 126. Give 2 months ART supply.", "reason_category": "management_step", "reason": "Start ART next day (pointer to 126) and 2-month supply; management."}, {"element_key": "p181-167efb2a", "element_id": "p181-rb1-e07", "text": "Decide HIV transmission risk of HIV-exposed baby and give infant prophylaxis according to risk 186.", "reason_category": "management_step", "reason": "Infant risk assessment and prophylaxis (pointer to 186) concern the baby and are management; not adult triage logic."}, {"element_key": "p181-359c9917", "element_id": "p181-rb1-e08", "text": "DTG - dolutegravir; FTC – emtricitabine; NVP - nevirapine; TDF – tenofovir; 3TC – lamivudine, TLD - TDF/3TC/DTG or tenofovir/lamivudine/dolutegravir", "reason_category": "figure_or_note", "reason": "Abbreviation key for drug names."}], "known_issues": [], "judgment_calls": [{"topic": "Page has no triage/diagnostic logic", "decision": "Comment-only .lisp file. The only red box is a treatment box (HIV positive patient in labour), not a 'give urgent attention' box, and the page has no 'X likely' / 'consider X' statements; everything is advice, treatment or scheduling.", "alternatives": "A check_for task for 'on ART' triggered by HIV in labour, or a measure task for viral load; rejected because the page uses these only to choose medicines (management), and viral load has no unit in the language.", "confidence": "medium"}, {"topic": "Outside sections (advise/treat the pregnant patient, review schedule)", "decision": "Not encoded: all management, education, medicines or visit scheduling. 'If gestational hypertension... If proteinuria/new symptoms, refer urgently' is a referral step defined on page 179, not a triage criterion of this page.", "alternatives": "A priority rule for gestational hypertension with proteinuria; rejected as a referral/management step and as belonging to page 179.", "confidence": "medium"}]}, "validation": {"ok": true, "summary": {"parse": 0, "snomed": 0, "database": 0, "provenance": 0, "quotes": 0, "keys": 0, "coverage": 0, "always_true": 0, "will": 0, "files": 0}, "problems": {"parse": [], "snomed": [], "database": [], "provenan nly red box, \"Treat the HIV positive patient in labour\",\n  is a treatment box, not a \"give urgent attention\" box. Every line in it is a management step\n  (continue/start ART, single-dose NVP + TLD, timing of doses, viral load request, infant\n  prophylaxis via page 186) or a note (lab-form code, abbreviation key). Under the shared scope\n  decision (no `manage` tasks, no medicines, doses or referral steps), nothing in it becomes a rule.\n  All 8 red-box elements are accounted for in provenance as `management_step` or `figure_or_note`.\n- **Outside sections not encoded.** \"Advise the pregnant patient\", \"Treat the pregnant patient\",\n  the review schedule and the postnatal pointer (182) are education, medicines, vaccines and\n  visit scheduling. The page has no \"X likely\" or \"consider X\" statement.\n- The gestational-hypertension line \"If proteinuria/new symptoms, refer urgently\" is a referral step\n  that points back to page 179's review; it was left as management, not turned into a priority rule.\n\n## Could not model\n\n- \"Check viral load, regardless of when last done\": viral load has no unit or observable in the\n  language, so no `measure` task could be written even if lab ordering were in scope.\n- Branching on \"on ART\" vs \"not on ART\" only selects medicines, so it has no triage effect to encode.\n\n## SNOMED gaps\n\n- None (no concepts used).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should \"HIV positive patient in labour\" raise a priority (e.g. so the intrapartum NVP + TLD is not\n  missed when the patient is not on ART and delivery is imminent)? The page says \"urgently if\n  delivery is imminent\" about giving the medicines, not about patient priority, so no priority rule\n  was written.\n- (From builder B.) Should the review schedule (20, 26, 30, 34, 36, 38, 40, 41 weeks) or \"Educate about signs of\n  early labour and pregnancy emergency\" become triage rules elsewhere? This page gives them // ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {

  while (i < src.length) {
    const ch = src[i];

    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }

}

    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
