ng the collapse?", "bbox": [388.1, 340.1, 711.8, 350.3], "key": "p45-62cabe1c"}, {"id": "p45-out-e04", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes", "bbox": [741.0, 364.2, 752.9, 374.4], "key": "p45-b3a3c59c"}, {"id": "p45-out-e05", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Hyperventilation likely • May also have light- headedness, chest tightness, tingling of hands/feet and visual changes. Usually with emotional stress. • Reassure and encourage to breathe at normal rate. • Assess for stress and anxiety 98.", "bbox": [691.7, 387.4, 804.2, 488.4], "key": "p45-0036c82f"}, {"id": "p45-out-e06", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Did patient have dizziness, light-headedness, nausea, sweating,", "bbox": [366.4, 388.2, 599.4, 398.4], "key": "p45-8428e74f"}, {"id": "p45-out-e07", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "weakness or vision changes before the collapse?", "bbox": [393.2, 398.2, 570.6, 408.4], "key": "p45-2b385735"}, {"id": "p45-out-e08", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes", "bbox": [403.6, 422.3, 415.6, 432.5], "key": "p45-faaa9a70"}, {"id": "p45-out-e09", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Common faint likely • Advise to avoid triggers like overheating, dehydration and prolonged standing. • Advise to lie flat with legs raised as soon as symptoms occur.", "bbox": [297.6, 445.5, 518.1, 486.5], "key": "p45-2fcc28e5"}, {"id": "p45-out-e10", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If collapse associated with coughing, swallowing, head turning, refer. • If known diabetes 145.", "bbox": [547.1, 446.3, 657.5, 486.5], "key": "p45-8ce24594"}, {"id": "p45-out-e11", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If none of the above, look for and manage likely cause: if vision problems 48, joint problems 77, foot problems 81, leg problems 80, dementia 166. • Refer if patient > 65 years with possible heart disease, patient collapses/falls repeatedly or cause for collapse/falls is uncertain.", "bbox": [102.0, 499.9, 692.6, 520.7], "key": "p45-a6ff7fb3"}, {"id": "p45-out-e12", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes", "bbox": [149.9, 316.1, 161.9, 326.3], "key": "p45-fdf8215d"}, {"id": "p45-out-e13", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Orthostatic hypotension likely • Common in the elderly. • Review medications: e.g. fluoxetine, amitriptyline, amlodipine, enalapril, furosemide, hydrochlorothiazide, isosorbide dinitrate can cause collapse/falls. Discuss with doctor. • If diarrhoea 58, if vomiting 57, if fever 38. If poor fluid intake, encourage fluids, give oral rehydration solution. • Advise patient to sit first before standing up from lying down. • Refer if: - Diabetes - Peripheral neuropathy (pain/numbness of feet) - Tremor, slow movements or stiffness - History of constipation or erection problems", "bbox": [39.7, 339.3, 273.2, 480.3], "key": "p45-82aae406"}, {"id": "p45-out-e14", "page": 45, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Common allergens: medication, food or insect bite/sting within the past few hours. 2If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely. 3One drink is 1 tot of spirits, or 1 small glass (125mL) of wine or 1 can/ bottle (330mL) of beer.", "bbox": [34.0, 535.3, 790.2, 551.8], "key": "p45-2c192c7f"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 234.2]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAE0CAIAAAAZpnPQAAAACXBIWXMAABcSAAAXEgFnn9JSAAFxIklEQVR4nOy9d1BUyfv/+7m/7/3dW9+qW7fq/vP769b9yBAVQUAUBUUxgBlzxIAJIypiwpzTGjEsJswJMSuiCIKISFBE15xXV0yorLrqZ3fnvpkH295zzpwZQB3Qp+pVUzN9zunT4ek+/bynu8+/Xvy/DgzDMAzDMAzDMAzDMAxTufiXzVPAMAzDMAzDMAzDMAzDMKWFVS2GYRiGYRiGYRiGYRim8vEPVeuPNfP+2LyYYRiGYRiGYRiGYRiGYSogb6dHaqtaf73IMv7nF4ZhGIZhGIZhGIZhGIapgHzMiGNVi2EYhmEYhmEYhmEYhqlksKrFMAzDMAzDMAzDMAzDVD5Y1WIYhmEYhmEYhmEYhmEqH6xqMQzDMAzDMAzDMAzDMJUPVrUYhmEYhmEYhmEYhmGYygerWgzDMAzDMAzDMAzDMEzlg1UthmEYhmEYhmEYhmEYpvLBqhbDMAzDMAzDMAzDMAxT+WBVi2EYhmEYhmEYhmEYhql8sKrFMAzDMAzDMAzDMAzDVD5Y1WIYhmG+Oq9fnLN5Ghh9KlcdpZ/amnh0HbB5SjT58DbvXVGuzZOh4JeLB6nQXjzJKGdU799coKiyz+62eb4spq1iWsu1y0coVc8Lznzte2Wc3k73+uvDJZtnXIf7t5O2xM5fHT01M32nzRPDMAzDVBZY1WIYhmHKC9zIA/ErF84dM3hg95BuwSOH916+eOLt64l0dPqU4YZ//3tA3842TydjjkpXRw3r+yDBwOYpUQPP3KtG9epVnc+dqVie+bjIAVRoZ9N3lDOq3x6kUlRdO7W0eb4spq1iWgs1OnDq5Kavfa8WQQ3pXuirbZ5xc+zZudTF0Z7SGTmyr83TwzAMw1QWWNViGIZhysXBvSvr1a1FrojMmtUz6ITmgQ3w062ay8d3F22e2q/Ku6LcY4fXzJo2ctOGeWW4PCNt+/LFEydHDbEYWB6ePDodt2PpuMgB8myIr1pH1385smHN7KGDehQVlmVooZngiqNTqCso8chaStvPK6aVP/5yGpUMq1o2T5sMq1oyqLXqVZ0pkU0b1Vu5fIrNk8QwDMNUFljVYhiGYcrOxnVzhIzVoJ5PWP+uo0eE9uze1t3V5VLeATonN2vPhDEDU05stHlqvzbns+KpKKZEDS3D5TRPIahxfYuB5WF19FRK5NGDMSLwq9ZR75B2dMeyLXzTTHDF0SnUFfThbV70kknzZo9++Syz/PGX06hkWNWyedpkWNWS2bNzKaXwCyr4DMMwzA8Cq1oMwzBMGfnl4kFy6Z3sDbu3L/n742VxCI69+Hn35vHrvxwB+P70t9P0/dnjdHHy9StHiwOvHBUhr55npiVvOZ2yBV80b41wikcIJU8elcT85lUOfhY+PUs/kYx3RblJxzaIOyJteTl7TySsf15w5s/3+XSa4kaPHpw6nrDufFa87AQ+up+CM+/dSjKaPOeEQzEZp7eLE3DHA/EryTELH9oLZz7+NVWdclx4Nn3Hof2rL2THv31dsvUSIsH5zg7FhRlQvw6+37mRqBko4vnrwyWUGNKAT3mvHP1E4uiMqeGUyPUxs3Ambacl15EA5ZZ/fv+RAz/nX9j//k2eCKeEgd9fZqMAM9N34i73bydp1tTNqwkd2zWjO2af3Y2r5OlgSE/KiY0pSZs0y0onwbJOgapPPLoOdaq+HMlGJaIqUaGa8Qs7QRniZFQKTkaEZa41hBcVZlGciv2SNI1KTgDKM/l ,<br/>pulse &lt; 50 or irregular, family history, abnormal ECG/heart problem,<br/>decreased consciousness, collapse with exercise, seizure,<br/>collapse after vaccination, chest pain, vomited blood/blood in stool,<br/>difficulty breathing, severe back/abdominal pain,<br/>glucose &lt; 3 (&lt; 4 if diabetes), pregnant/missed period + abdominal pain + vaginal bleeding)\"}\n    RB -- Yes --> URG[\"Give urgent attention; manage and refer urgently\"]\n    RB -- No --> APP[\"Approach: ECG; Hb (anaemia likely 44); substance-use screen 165;<br/>BP ≥ 140/90 → 148; measure BP lying 5 min then standing 3 min\"]\n    APP --> Q1{\"Systolic BP drop ≥ 20<br/>or diastolic drop ≥ 10?\"}\n    Q1 -- Yes --> OH[\"Orthostatic hypotension likely\"]\n    Q1 -- No --> Q2{\"Breathing very quickly or deeply<br/>immediately before or during the collapse?\"}\n    Q2 -- Yes --> HV[\"Hyperventilation likely\"]\n    Q2 -- No --> Q3{\"Dizziness, light-headedness, nausea, sweating,<br/>weakness or vision changes before the collapse?\"}\n    Q3 -- Yes --> CF[\"Common faint likely\"]\n    Q3 -- No --> OTH[\"Collapse with coughing/swallowing/head turning: refer.<br/>Known diabetes → 145\"]\n    OH --> END[\"If none of the above: look for cause (48, 77, 81, 80, 166).<br/>Refer if > 65 with possible heart disease, repeated, or uncertain cause\"]\n    HV --> END\n    CF --> END\n    OTH --> END\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Patient has collapsed | `(or Collapse Falls)` as trigger (Falls from the page title; unsettled) | `Check for urgent collapse/falls conditions`, `Check for causes of collapse/falls`, `Measure lying and standing blood pressure after collapse/falls` |\n| Red box (any of) | `(and (or Collapse Falls) (or …each red-box item…))` | `Urgent: collapse/falls with danger signs` |\n| \"consider stroke or TIA\" | Collapse/falls **and** any sudden-onset face, arm or leg weakness or numbness, difficulty talking or visual disturbance | `Diagnose possible stroke after collapse/falls`, `Diagnose possible TIA after collapse/falls` |\n| \"Sudden collapse and any of … check for anaphylaxis\" | Sudden-onset collapse **and** any of the listed allergy signs or exposures | `Diagnose possible anaphylaxis after sudden collapse` |\n| Q1 = Yes | Collapse/falls **and** level of reduction in systolic BP on standing ≥ 20 mmHg (diastolic drop: no observable, not modelled); lying/standing systolic and diastolic BP are measured | `Diagnose probable orthostatic hypotension after collapse/falls` |\n| Q1 = No → Q2 = Yes | Collapse/falls **and** systolic drop < 20 **and** (tachypnoea or excessively deep breathing) | `Diagnose probable hyperventilation after collapse/falls` |\n| Q2 = No → Q3 = Yes | Collapse/falls **and** systolic drop < 20 **and** recorded No to tachypnoea **and** to excessively deep breathing **and** any prodromal symptom | `Diagnose probable common faint after collapse/falls` |\n| Q3 = No; final box | Referral / cross-references only | not encoded (management / cross-reference) |\n| Hb < 12 / < 13 → anaemia likely | Haemoglobin has no unit/observable in the language | not encoded (see remaining questions) |\n\n## Notes\n\n- \"Not needing urgent attention\" (entry to the algorithm) cannot be expressed as a negation of the\n  priority evaluation; the flowchart rules fire whenever their evidence is present.\n- Timing words (\"immediately before or during\", \"before the collapse\") are not modelled; findings\n  recorded in the same encounter are taken as related to this collapse.\n\n- Final build reconciled from two independent builds; see `reconcile.json`.\n", "questions": "# Page 45 – Collapse/Falls: remaining questions\n\nFinal build, reconciled from builders A and B (see `reconcile.json`).\n\n## Decisions made\n\n- **Complaint = Collapse or Falls.** Every task, diagnosis rule and the Urgent rule are anchored on\n  `(or Collapse Falls)`. The page title is \"COLLAPSE/FALLS\" and the bottom box says \"collapses/falls\n  repeatedly\", but both box headers say \"the patient who has collapsed\". This is unsettled (see\n  questions).\n- **Shock/SBP < 80** is encoded as the page writes it: `(or (clinical_finding Shock) (< SBP 80))`.\n  Footnote 2 (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness,\n  shock likely\") is not turned into a shock rule, per the all-pages decision not to build a shared\n  shock definition.\n- **Stroke/TIA bullet.** Face, arm and leg are encoded separately (`Weakness of face muscles`,\n  `Muscle weakness of upper limb`, `Weakness of muscle of lower limb`, `Numbness of face`,\n  `Numbness of upper limb`, `Numbness of lower limb`), all with `Sudden onset` for \"new sudden\".\n  `Difficulty talking` and `Visual disturbance` also carry `Sudden onset`. Without it, any vision\n  change would make the collapse urgent, which contradicts the page's own non-urgent faint\n  prodrome (\"vision changes before the collapse\"). \"Consider stroke or TIA\" becomes two `possible`\n  rules (CVA and TIA), each requiring the complaint.\n- **Sudden collapse + allergy signs.** This is one red-box branch, `(and (Collapse + Sudden onset)\n  (or …))`, and a `possible` anaphylaxis rule so that page 28's anaphylaxis check can run.\n  \"Generalised itch/rash\" = `Generalized pruritus`, `Generalized rash`. \"Exposure to possible\n  allergen\" uses footnote 1 (medication, food, insect bite/sting).\n- **Recent injury** = `Traumatic injury` with the `Recent` qualifier.\n- **Collapse with exercise** = `Collapse` qualified `During exercise`. **Collapse following\n  vaccination** = `Vaccination given` (situation) under the complaint anchor.\n- **Vomited blood or blood in stool** = Hematemesis, Hematochezia or Melena.\n- **Glucose < 3 (or < 4 if diabetes)**: `(< glucose 3)` or `(and known diabetes (< glucose 4))`.\n- **Pregnant or missed/overdue period with abdominal pain and vaginal bleeding**: `(and (or\n  Pregnancy, Missed period, Menstrual period late) Abdominal pain, Abnormal vaginal bleeding)`.\n- **Orthostatic hypotension.** The page's lying/standing BP instruction is a `measure` task (lying\n  and standing systolic and diastolic, plus the observable \"Level of reduction in systolic blood\n  pressure on standing\"). Q1 = Yes is `(>= systolic reduction 20)`.\n- **Flowchart No branches** are encoded where the language can express them. Hyperventilation and\n  common faint require a systolic reduction < 20. Common faint also requires an explicit No for\n  `Tachypnea` and for `Excessively deep breathing` (\"breathing very quickly or deeply\").\n- **Diagnosis concepts**: \"Hyperventilation likely\" = `Hyperventilation` (finding); \"Common faint\n  likely\" = `Vasovagal syncope` (finding). Prodromal \"weakness\" = `Asthenia`; \"vision changes\" =\n  `Visual disturbance`.\n- Priority is `Urgent`, as the page says. Items that are also warning signs (seizure, chest pain)\n  keep their own higher warning-sign priorities.\n\n## Could not model\n\n- **Diastolic BP drop ≥ 10** (Q1): there is no observable for a diastolic postural drop, and the\n  language cannot subtract lying from standing values. Orthostatic hypotension therefore fires\n  **less often** than the page intends. Hyperventilation and common faint can fire for a patient\n  whose diastolic drop alone should have sent them to orthostatic hypotension.\n- **Sequential preconditions**: because hyperventilation and common faint need a recorded systolic\n  reduction, and common faint needs explicit Nos for fast or deep breathing, these rules fire\n  **less often** when those items were not recorded.\n- **Hb < 12 (woman) or < 13 (man): anaemia likely 44.** Haemoglobin has no unit or observable in\n  the language. No rule was written, so the referral to page 44 is lost.\n- **Asymmetry** of weakness/numbness is not expressed. The stroke/TIA and priority branches fire\n  **more often** (for symmetric weakness too).\n- **Timing**: \"immediately before or during\" the collapse, \"before the collapse\", \"following\"\n  vaccination and \"within the past few hours\" (footnote 1) are not modelled. Findings recorded in\n  the current encounter are taken as related to this collapse. \"Recent\" injury is carried only as\n  a qualifier.\n- **\"Not needing urgent attention\"**: the flowchart diagnoses cannot require the absence of the\n  urgent priority, so they can fire alongside it.\n- **ECG**: \"Do an ECG\" has no measurable unit. The result is captured as the finding\n  `Electrocardiogram abnormal` in the urgent check, and the same-day referral is management.\n- Not encoded, because they are referrals or cross-references: the substance-use screen (165),\n  BP ≥ 140/90 (148), the Q3 = No branch (refer if coughing/swallowing/head turning; known\n  diabetes 145), the final \"if none of the above\" box, management inside the \"likely\" boxes and\n  the IV fluid line in the red box.\n\n## SNOMED gaps\n\n- \"Family history of collapse\": no concept. Used `Family history of syncope` (situation).\n- \"Difficulty speaking\": no concept with that name. Used `Difficulty talking` (finding).\n- \"Weakness\" (finding) does not exist. Used `Asthenia` (finding) for the prodromal weakness.\n- \"Common faint\": no concept. Used `Vasovagal syncope` (finding).\n- \"Collapse following vaccination\": no precoordinated concept. Used `Vaccination given` (situation)\n  inside the complaint-conditioned rules.\n- \"Vaginal bleeding\": used `Abnormal vaginal bleeding` (finding), the vocabulary concept.\n- \"Asymmetrical\" qualifier: none (only `Asymmetry`). Not used.\n- Diastolic postural drop: no observable (see Could not model).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should `Falls` without collapse also trigger this page's checks and urgent evaluation? The page\n  title is \"Collapse/Falls\", but both boxes address \"the patient who has collapsed\".\n- Does \"new sudden\" in the stroke/TIA bullet also apply to \"difficulty speaking or visual\n  disturbance\" after the semicolon? The final build applies it to both.\n- Footnote 2: does \"shock likely\" need any one of SBP < 80, pulse ≥ 100, RR > 30,\n  confusion/restlessness or weakness, or all of them?\n- Is `Family history of syncope` an acceptable stand-in for \"family history of collapse\"?\n- Is `Vaccination given` (no time limit) acceptable for \"collapse following vaccination\", or\n  should it be limited to the same day?\n- Should \"collapse with exercise\" also cover collapse straight after exercise (`After exercise`)?\n- Is `Vasovagal syncope` the right concept for \"common faint\", and `Hyperventilation` (rather\n  than `Psychogenic hyperventilation`) for \"hyperventilation likely\"?\n- Without a diastolic observable, should a recorded `Postural drop in blood pressure` finding also\n  count as orthostatic hypotension?\n- Should hyperventilation and common faint fire without a recorded BP drop or a recorded No for\n  fast or deep breathing? The final build follows the page's arrows and requires them.\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent collapse/falls conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Collapse\" \"finding\"))", "element_keys": ["p45-1084b7ed"], "quote": "collapsed"}, {"claim_id": "c002", "rule": "Check for urgent collapse/falls conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Falls\" \"finding\"))", "element_keys": ["p45-b03b62ce"], "quote": "COLLAPSE/FALLS"}, {"claim_id": "c003", "rule": "Check for urgent collapse/falls conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "element_keys": ["p45-da0e5870"], "quote": "weakness or numbness of face"}, {"claim_id": "c004", "rule": ference_only", "verdict": null, "parts_missing": [], "problem": "Pointers to other pages for likely cause, plus non-urgent referral criteria (> 65 with possible heart disease, repeated collapses, uncertain cause), which are management steps.", "evidence": [], "confidence": "medium"}, {"element_key": "p45-2c192c7f", "scope": "borderline", "scope_reason": "Footnote block. Footnote 3 (drink size) is figure_or_note. Footnote 1 (common allergens: medication, food, insect bite/sting within the past few hours) is a criterion definition and is encoded except for the time window. Footnote 2 ('If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely') is an 'X likely' conclusion, which the house standard turns into a probable diagnosis rule, and the red box relies on it ('Shock' is a red-box trigger).", "verdict": "partial", "parts_missing": ["Footnote 2: no probable Shock rule. The priority rule accepts a recorded 'Shock' (disorder) and SBP < 80, but the page's own definition of shock (SBP < 80, pulse ≥ 100, RR > 30, confusion/restlessness, weakness) is not encoded; pulse ≥ 100, RR > 30, restlessness and clouded consciousness/confusion are not checked for or used.", "Footnote 1: the 'within the past few hours' window on allergen exposure is not expressed (an onset comparison would be the house mechanism)."], "problem": "The red box's 'Shock' criterion is only as good as the nurse's own recognition of shock; the page gives an explicit recognisable definition that could drive a probable Shock rule and then (active_condition Shock) in the priority rule. 'Confusion' does not exist as a finding name; 'Clouded consciousness' (finding) and 'Restlessness' (finding) do; 'Respiratory rate' (observable entity) exists.", "evidence": ["Urgent: collapse/falls with danger signs :: (clinical_finding (snomed_concept \"Shock\" \"disorder\"))", "Urgent: collapse/falls with danger signs :: (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80)"], "confidence": "medium"}], "outside_not_logic": ["p45-b03b62ce"], "rule_level_problems": [{"rule": "Diagnose probable orthostatic hypotension after collapse/falls; Diagnose probable hyperventilation after collapse/falls; Diagnose probable common faint after collapse/falls", "problem": "The flowchart's first decision is 'systolic drop ≥ 20 OR diastolic drop ≥ 10'. All three rules test only the systolic reduction. A patient with a diastolic postural drop ≥ 10 and systolic drop < 20 is wrongly routed down the No branch and can be diagnosed with probable hyperventilation or common faint instead of orthostatic hypotension. No 'reduction in diastolic BP on standing' observable exists in SNOMED and the language cannot compute a difference, so the fix is either a documented not_representable note or a fallback: check for 'Postural drop in blood pressure' (finding, 271648003) and use it as an alternative Yes condition / a (no ...) in the No branch.", "severity": "high"}, {"rule": "Urgent: collapse/falls with danger signs", "problem": "'(clinical_finding (snomed_concept \"Vaccination given\" \"situation\"))' has no temporal restriction. The page's criterion is collapse following vaccination; as encoded, any recorded vaccination history makes every collapse or fall Urgent. Add a Recent qualifier (consistent with 'Traumatic injury' + Recent in the same rule) or an onset comparison.", "severity": "medium"}, {"rule": "Urgent: collapse/falls with danger signs (Shock)", "problem": "The page defines 'shock likely' in footnote 2 (SBP < 80, pulse ≥ 100, RR > 30, confusion/restlessness, weakness). Per the house standard an 'X likely' becomes a probable diagnosis rule and the priority rule references (active_condition X). Only the SBP < 80 part is in the priority rule; the rest of the definition is absent and shock is otherwise left to free recording.", "severity": "medium"}, {"rule": "Diagnose probable hyperventilation after collapse/falls; Diagnose probable common faint after collapse/falls", "problem": "Both rules require '(< (measurement \"Level of reduction in systolic blood pressure on standing\") 20)', so neither fires until the lying/standing BP has actually been measured and the derived reduction recorded. This is faithful to the flowchart, but if the derived observable is not something the system records (the measure task lists it, so it may be fine), the two probable diagnoses can never be reached. Worth confirming that a derived 'reduction' measurement is recordable rather than only the four raw readings.", "severity": "low"}, {"rule": "Diagnose possible anaphylaxis after sudden collapse; Urgent: collapse/falls with danger signs", "problem": "The anaphylaxis branch is gated on 'Collapse' with the 'Sudden onset' qualifier, a different piece of evidence from the plain 'Collapse' warning sign that triggers the page. The qualified form is in the check_for so it can be recorded, but a nurse who records plain Collapse plus wheeze/face swelling will not trigger the possible Anaphylaxis diagnosis (and the page-28 check task it is meant to reach). Consider accepting plain Collapse here, since the page's presenting complaint is already 'has collapsed'.", "severity": "low"}, {"rule": "Check for urgent collapse/falls conditions", "problem": "Footnote 1 limits allergen exposure to 'within the past few hours'; the exposure findings carry no time window. Low weight, as page 20 (gold) also omits it.", "severity": "low"}], "summary": "The red box is encoded almost completely and accurately: 17 of 18 criteria are correct, with the one error being 'Vaccination given' with no temporal restriction, which makes any vaccination history an urgent trigger. The most consequential problem is in the flowchart: the orthostatic hypotension decision tests only systolic drop ≥ 20 and ignores the page's 'or diastolic drop ≥ 10', so diastolic-only postural drops are misrouted to the hyperventilation/common faint branch. Footnote 2's definiti tity\") mmHg) 20)", "Measure lying and standing blood pressure after collapse/falls :: no diastolic reduction measurement"], "confidence": "high"}, {"element_key": "p45-82aae406", "scope": "out_of_scope", "scope_reason": "management_step", "parts_missing": [], "problem": "", "evidence": [], "confidence": "medium"}, {"element_key": "p45-0036c82f", "scope": "in_scope", "scope_reason": "", "verdict": "partial", "parts_missing": ["associated symptoms (chest tightness, tingling) not used"], "problem": "Hyperventilation probable rule is triggered by tachypnea OR excessively deep breathing, matching the question. Gated on systolic drop < 20 only (diastolic omitted). 'Hyperventilation' is a finding-tagged diagnosis; 'immediately before/during collapse' timing not captured. Associated features are descriptive only.", "evidence": ["Diagnose probable hyperventilation after collapse/falls :: (and ... (< (measurement ...Level of reduction in systolic blood pressure on standing...) 20) (or (clinical_finding \"Tachypnea\") (clinical_finding \"Excessively deep breathing\")))"], "confidence": "medium"}, {"element_key": "p45-2fcc28e5", "scope": "in_scope", "scope_reason": "", "verdict": "partial", "parts_missing": ["diastolic gating", "timing before the collapse"], "problem": "Common faint (vasovagal syncope) probable rule has the six prodromal symptoms and the No-hyperventilation branch right; 'before the collapse' timing not encoded; depends on systolic drop only.", "evidence": ["Diagnose probable common faint after collapse/falls :: (or Dizziness Lightheadedness Nausea Sweating Asthenia Visual disturbance) with (no Tachypnea) (no Excessively deep breathing)"], "confidence": "medium"}, {"element_key": "p45-2c192c7f", "scope": "borderline", "scope_reason": "Footnote 2 defines 'shock likely': SBP < 80, pulse >= 100, RR > 30, confusion/restlessness, weakness. It is diagnostic logic, but may be out of scope as a figure note.", "verdict": "missing", "parts_missing": ["shock likely crite ": "rule", "priority": "medium", "ref": "Check for urgent collapse/falls conditions", "text": "Footnote 1 limits allergen exposure to 'within the past few hours'; the exposure findings carry no time window. Low weight, as page 20 (gold) also omits it.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 45, "slug": "45-collapse-falls", "kind": "rule", "priority": "high", "ref": "Diagnose probable orthostatic hypotension / hyperventilation / common faint", "text": "Orthostatic test omits 'or diastolic drop >= 10'; the No branch (systolic < 20) therefore lets diastolic-only drops into hyperventilation or common faint rules, and no diastolic-reduction measurement exists.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 45, "slug": "45-collapse-falls", "kind": "rule", "priority": "medium", "ref": "Check for causes of collapse/falls / hyperventilation and faint rules", "text": "Flowchart ordering is lost: hyperventilation and common faint are not mutually exclusive in the rules when both lack exclusions (hyperventilation does not exclude the prodrome; faint excludes hyperventilation only via symptom absence), and neither is conditional on the BP-drop question having been answered (no measurement means < 20 is unknown, not true).", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 45, "slug": "45-collapse-falls", "kind": "rule", "priority": "medium", "ref": "Measure tasks", "text": "Priority rule uses systolic BP, pulse and glucose thresholds, but no measure task collects Systolic blood pressure, Pulse or Blood glucose, so those inputs are not prompted.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 45, "slug": "45-collapse-falls", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis after sudden collapse", "text": "Allergen exposure and insect bite/sting lack the 'within the past few hours' limit; vaccination in the priority rule lacks 'following'.", "detail": [{"chec <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.

  while (i < src.length) {
    const ch = src[i];

    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }

}

    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
