"}, {"id": "p39-out-e05", "page": 39, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Give artemether/lumefantrine 80/480mg at 0, 8, 20, 32, 44 and 56 hours (total of 6 doses) with fatty food/milk.", "bbox": [247.3, 381.7, 565.5, 402.5], "key": "p39-568862f3"}, {"id": "p39-out-e06", "page": 39, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- Give first dose in health facility and monitor patient for 1 hour. - If patient vomits within 1 hour of taking first dose, give metoclopramide 10mg", "bbox": [253.0, 402.3, 555.4, 422.5], "key": "p39-026fd14b"}, {"id": "p39-out-e07", "page": 39, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "orally/IM. - Repeat artemether/lumefantrine 80/480mg. If patient vomits again, refer. - Explain importance of completing prescribed doses, even if patient feels better. • For pain and fever, give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed for 5 days. • Advise patient to keep hydrated. • Advise to return immediately if symptoms worsen (vomiting, drowsy, confused, jaundiced) and refer urgently. • Review patient in 2 days. If no improvement in symptoms, refer.", "bbox": [247.3, 422.3, 567.0, 512.5], "key": "p39-7cbb181a"}, {"id": "p39-out-e08", "page": 39, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Give artemether/lumefantrine 80/480mg with fatty food/milk. If referral delayed, give second dose after 8 hours.", "bbox": [51.0, 381.7, 182.9, 422.5], "key": "p39-abb08cef"}, {"id": "p39-out-e09", "page": 39, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- If patient vomits within 1 hour", "bbox": [56.7, 422.3, 174.0, 432.5], "key": "p39-dea0ba32"}, {"id": "p39-out-e10", "page": 39, "box": 0, "kind_hint": "outside", "section": nu : null, "section_y": -1, "indent": 0, "parent": null, "text": "laboratory test results", "bbox": [666.4, 426.2, 749.8, 437.0], "key": "p39-b9e76196"}, {"id": "p39-out-e17", "page": 39, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If positive, manage in adjacent column. • If negative, assess for other causes of fever 38.", "bbox": [625.8, 452.3, 787.9, 482.5], "key": "p39-c726a9b6"}, {"id": "p39-out-e18", "page": 39, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No Yes", "bbox": [119.1, 356.8, 417.3, 367.0], "key": "p39-23194f22"}], "boxes": [{"box": 1, "rect": [35.2, 125.8, 806.1, 233.6]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAADhCAIAAAD9IvX4AAAACXBIWXMAABcSAAAXEgFnn9JSAAEmTklEQVR4nOy9d1RVybfv2+ecd8897/xx73vj3PvOC/ecX7sVRVEURVFRFFEQc9Y2YwJzwoQJE6bWNtuYc8KcEEUxoiIoom1ubW1ptc20scNvvy9MKMsVaq8NSJxjfAaDvVattSrMmjXnXFW1vnr+v0oxDMMwDMMwDMMwDMMwTOHiq3zPAcMwDMMwDMMwDMMwDMM4C0e1GIZhGIZhGIZhGIZhmMLHp6jWm5H9//zxKMMwDMMwDMMwDMMwDMMUTF4FBhhEtd5OHWn/4weGYRiGYRiGYRiGYRiGKZi8btGUo1oMwzAMwzAMwzAMwzBMIYOjWgzDMAzDMAzDMAzDMEzhg6NaDMMwDMMwDMMwDMMwTOGDo1oMwzAMwzAMwzAMwzBM4YOjWgzDMAzDMAzDMAzDMEzhg6NaDMMwDMMwDMMwDMMwTOGDo1oMwzAMwzAMwzAMwzBM4YOjWgzDMAzDMAzDMAzDMEzhg6NaDMMwDMMwDMMwDMMwTOGDo1oMwzAMwzAMwzAMwzBM4YOjWgzDMIxjXj8/n+95YNQUrjY6fXxDzMEVIN9zYsjHt8nv0pLyPRt60l5c+OvjFUWCHy7vpYp9/iQ+33Nb0Ig/tYkqR12HOSdXxLsg9Ojf312mgpw/syXfM6PmYsKO5d9PWRE55d7tw/meGYZhGCYv4agWwzAM88OHN5f27Fg8e/qIvn06dv6m+ZCB3RbMHfvjzRg6O2nCQNvf/ta7R7t8zydjRqFro7q1vZBhkO850XP/x9jKFcuXL1umoHny+/csLVOqpLdXlbQXCWZpRoX2poo9e3pzvme4oNEooC5VDjTeF31QzsW7gPTo18/PU0FaNvPP35yoCRsZTPkE27fMy/f8MAzDMHkJR7UYhmGKO3t3Lq5Vo6pwCQTLlk6mBIH+dfCzQjnX399dzvfcflHepSUd2r9saviQtatmZOPymz8cWLVsWv+QTnLQIf7kpgVzx44P65dbmXySeipq87xRob3Pnf4Uc/mibWRYrhxmuOBEtfSlizmwnPL2/aLwXHlEbslA+PiBlLFLF3aY3bmoRrVy2DeJQhTVKiBat1BEtQ5HrxDDVrPGfieOrsv3LDEMwzB5CUe1GIZhijVrVkQIf6BOLa/gXh2GDw7q0rGFu5vrleQ9lCYpYfuYEX3ijqzJ9 e\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Finding of vomiting\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Influenza-like illness\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Muscle pain\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Nausea\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pain of joint\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Shivering or rigors\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": ["(diagnosis (snomed_concept \"Complicated malaria\" \"disorder\") possible)"], "both": ["(diagnosis (snomed_concept \"Malaria\" \"disorder\") possible)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 39 – Malaria: flowchart\n\nSource: APC 2026 e-book, page 39 (page image APC 2026 e-book page 39).\n\n```mermaid\nflowchart TD\n    S[\"Suspect malaria if patient in a malaria area¹ in the past 3 months and now presents with<br/>temperature ≥ 38°C, severe headache, fatigue, shivering episodes, joint/muscle pain,<br/>flu-like symptoms, dry cough, nausea and vomiting or diarrhoea\"]\n    S --> RB{\"Red box: suspected malaria and any of:<br/>decreased consciousness, drowsy/confused · RR &gt; 30 or difficulty breathing ·<br/>seizure or just had a seizure · severe general body weakness ·<br/>glucose &lt; 3 (&lt; 4 if diabetes) · shock²/SBP &lt; 80 · jaundice ·<br/>easy bleeding or bruising · Hb &lt; 7 · black urine or no urine in past 12 hours ·<br/>persistent vomiting\"}\n    RB -- Yes --> SEV[\"Give urgent attention.<br/>Manage as suspected severe malaria and refer urgently<br/>(fluids, rapid test, artesunate, notify)\"]\n    RB -- No --> APP[\"Approach to the patient with suspected malaria not needing urgent attention:<br/>rapid test³ if available; if not available or negative, laboratory microscopy\"]\n    APP --> POS[\"Malaria test positive: notify⁴ within 24 hours;<br/>if treatment not available, refer same day\"]\n    APP --> NEG[\"Rapid test not available/negative:<br/>symptomatic treatment, advice\"]\n    POS --> RISK{\"Any of: &gt; 65 years, pregnant/postpartum, long-term health conditions<br/>(e.g. PLHIV, diabetes, TB), impaired immunity⁵, previous splenectomy?\"}\n    RISK -- Yes --> TREATY[\"Artemether/lumefantrine first dose(s), hydration, refer same day\"]\n    RISK -- No --> TREATN[\"Artemether/lumefantrine full course, paracetamol, advice, review in 2 days\"]\n    NEG --> REV[\"Review patient in 2 days and check laboratory test results\"]\n    REV --> REVR[\"If positive, manage in adjacent column.<br/>If negative, assess for other causes of fever → 38\"]\n    REVR -.positive.-> POS\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| S (what makes us ask) | Any of the page's presenting symptoms that the app records (temperature ≥ 38, headache, fatigue, muscle pain, cough, nausea, vomiting, diarrhoea) → ask about being in a malaria area, and about the symptoms the app does not record by default (severe headache, shivering, joint pain, flu-like illness, dry cough) | `Check for exposure to a malaria area` |\n| S = suspect malaria | History of travel with high risk of exposure to communicable disease, onset within the past 3 months, **and** any of the listed symptoms | `Diagnose possible malaria` |\n| Suspected malaria → red box questions | `(diagnosis Malaria possible)` triggers the check for the red-box items | `Check for urgent signs in suspected malaria` |\n| RB = Yes | Suspected malaria **and** any red-box item (Hb < 7 not representable) | `Urgent: suspected malaria with danger signs` |\n| RB = Yes → \"Manage as suspected severe malaria\" | Same evidence as the priority rule, at `possible` certainty, as Complicated malaria | `Diagnose possible complicated (severe) malaria` |\n| Malaria test positive / negative | Laboratory and rapid-test results have no observable in the language | not modelled (see remaining questions) |\n| RISK | Routes between two management branches only | not modelled (management) |\n| Treatment boxes, review, notify | Management | not modelled (no `manage` tasks) |\n\n## Notes\n\n- \"In the past 3 months\" is written as `(<= (onset …) (time_ago 3 months))` on the travel\n  finding, following the brief's convention that `<=` means \"within\".\n- Footnote 2 (\"If systolic BP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness,\n  weakness, shock likely\") is not turned into a shock diagnosis rule; per the shared decision on\n  shock, only the red box's own \"Shock/systolic BP < 80\" is encoded.\n", "questions": "# Page 39 – Malaria: remaining questions\n\nFinal build reconciled from two independent builds (base: builder B). See `reconcile.json`.\n\n## Decisions made\n\n- **Suspected malaria is a `possible` diagnosis** (\"Suspect malaria if patient in a malaria area in\n  the past 3 months and now presents with …\"): travel/exposure within 3 months **and** any one of\n  the listed symptoms. The list is read as \"any of\".\n- **\"Nausea and vomiting or diarrhoea\"** is read as (nausea **and** vomiting) **or** diarrhoea,\n  literally. The alternative reading (each alone) would fire more often.\n- **\"Temperature ≥ 38°C\"** uses the measured temperature only, not the self-reported Fever symptom,\n  in both the diagnosis rule and the exposure task's trigger, because the page gives a number.\n- **Exposure question.** A pre-screen task, `Check for exposure to a malaria area`, fires on any of\n  the page's symptoms that the app records (temperature ≥ 38, headache, fatigue, muscle pain,\n  cough, nausea, vomiting, diarrhoea) and asks about being in a high-risk area, plus the page's\n  symptoms that are not common symptoms (severe headache, shivering, joint pain, flu-like illness,\n  dry cough). Without it nothing would ever record the exposure. This fires widely (every headache\n  or cough patient is asked about travel). Plain Headache and Cough are triggers only; the\n  diagnosis rule uses the page's \"severe headache\" and \"dry cough\".\n- **\"In the past 3 months\"** is `(<= (onset …) (time_ago 3 months))`, the brief's form for \"within\".\n- **Red box → `Urgent`**, `(and (diagnosis Malaria possible) (or …red-box items…))`. The page says\n  \"give urgent attention\" and does not escalate further. Seizure, confusion and persistent vomiting\n  are also warning signs at their own levels.\n- **\"Manage as suspected severe malaria\"** → `possible` Complicated malaria with the same evidence\n  as the urgent rule. SNOMED has no \"Severe malaria\"; Complicated malaria is a child of Malaria.\n- **Shock:** per the shared decision, \"Shock²/systolic BP < 80\" is `(or Shock (disorder), SBP < 80)`\n  on this page only. Footnote 2 (\"If systolic BP < 80, pulse ≥ 100, respiratory rate > 30,\n  confusion/restlessness, weakness, shock likely\") is not turned into a shock diagnosis rule.\n- **Glucose < 3 (< 4 if diabetes):** glucose < 3, or known diabetes and glucose < 4 (mmol/L).\n  Known diabetes uses the `Known present` form in both the `check_for` and the rules.\n- **\"No urine passed in past 12 hours\":** Anuria with onset at least 12 hours ago,\n  `(>= (onset Anuria) (time_ago 12 hours))`.\n- **\"Decreased consciousness, drowsy/confused\":** Decreased level of consciousness, Drowsy, and for\n  \"confused\" both Clouded consciousness (the app's \"Confused\" AVPU level) and Acute confusion (the\n  \"Confusion\" warning sign), so either way the app records confusion counts.\n- **\"Just had a seizure\"** → Post-ictal state.\n- **\"Severe general body weakness\"** → Asthenia with Severe qualifier.\n- The lower algorithm (test positive / negative, the risk question, treatment regimens, review)\n  only routes between management options and laboratory results, so it is not modelled. No\n  `manage` tasks. Measured items are routine vitals, so there is no `measure` task.\n\n## Could not model\n\n- **Hb < 7:** no haemoglobin observable or unit. The urgent rule (and the complicated-malaria\n  rule) fires **less often** than the page intends: a patient whose only danger sign is Hb < 7 is\n  not flagged.\n- **Malaria test results** (rapid test positive/negative, laboratory microscopy): no observable for\n  lab results, so \"Malaria test positive\" cannot become a probable/definite malaria rule, and\n  \"If negative, assess for other causes of fever\" cannot be routed.\n- **Risk-group question** (> 65, pregnant/postpartum, long-term conditions, impaired immunity,\n  splenectomy) only chooses between two management branches; not modelled (no manage tasks).\n- **\"In a malaria area\":** the travel concept is broader than a malaria area and does not cover\n  people who live in one. The onset of a \"history of travel\" finding may be when it is recorded,\n  not when the travel happened, so the 3-month window is approximate.\n- **Onset of anuria:** if the onset is not recorded as a past time, the 12-hour criterion will not\n  fire (fires less often).\n\n## SNOMED gaps\n\n- **Being in / living in a malaria area:** no concept (searched \"travel malaria\", \"malarial area\",\n  \"endemic area\", \"exposure to malaria\"). Substitute: `History of travel with high risk of exposure\n  to communicable disease` (situation), already in VHA's vocabulary.\n- **Severe malaria:** no concept; `Complicated malaria` (disorder) used.\n- **\"Shivering\"** (finding) does not exist; used `Shivering or rigors` (finding).\n- **\"Confusion\"** (finding) does not exist; used `Acute confusion` and `Clouded consciousness`.\n- **\"Weakness\" / \"Generalized weakness\"** (finding) do not exist; used `Asthenia` (finding) with\n  `Severe (severity modifier)`.\n- **\"Shock\" (finding)** does not exist; used `Shock` (disorder).\n- No `finding_site` values are used on this page.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should residence in a malaria area (Limpopo, Mpumalanga, northern KwaZulu-Natal) count as well\n  as travel? If so, a separate concept or a VHA-local finding is needed.\n- Should a self-reported fever (no measured temperature) trigger the exposure question, or count\n  towards suspecting malaria? The page says \"temperature ≥ 38°C\", so currently it does neither.\n  (Builder A also triggered the exposure question on reported Fever; the final build does not.)\n- Is it acceptable that every patient with a recorded headache, cough, fatigue, muscle pain, nausea,\n  vomiting or diarrhoea is asked about travel to a malaria area, or should the exposure question be\n  triggered by temperature ≥ 38 only?\n- Is \"nausea and vomiting or diarrhoea\" meant as nausea and vomiting together, or each of the\n  three alone?\n- Is Asthenia with Severe the right reading of \"severe general body weakness\", or should it be\n  Generalized muscle weakness?\n- \"No urine passed in past 12 hours\": is recording anuria with an onset the expected workflow, or\n  should anuria alone count?\n", "claims": [{"claim_id": "c001", "rule": "Check for exposure to a malaria area", "role": "trigger", "expr": "(>= (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38)", "element_keys": ["p39-92ab4ce3"], "quote": "temperature ≥ 38°C"}, {"claim_id": "c002", "rule": "Check for exposure to a malaria area", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\"))  > 30, confusion/restlessness, weakness, shock likely' has no probable Shock diagnosis rule; Shock appears only as a directly recorded finding. Footnotes 1, 3, 4 and 5 are notes, references or definitions (5 defines impaired immunity for a routing question) and are out of scope."], "problem": "Every 'X likely' should become a probable rule. The footnote's list is ambiguous (all vs any); a rule such as probable Shock with SBP < 80 plus pulse >= 100 or the other signs would let shock be derived instead of relying on a worker to record 'Shock'.", "confidence": "medium"}]}, {"page": 39, "slug": "39-malaria", "kind": "element", "priority": "medium", "ref": "p39-92ab4ce3", "text": "Suspect malaria if patient in a malaria area1 in the past 3 months and now presents with temperature ≥ 38°C, severe headache, fatigue, shivering episodes, joint/muscle pain, flu-like symptoms, dry cough, nausea and vomiting or diarrhoea.", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "partial", "parts_missing": ["Vomiting on its own: the page lists 'nausea and vomiting' as one symptom cluster; the rule requires (and Nausea Vomiting), so a traveller with vomiting but no nausea recorded does not reach the symptom branch via this item."], "problem": "Everything else is encoded with the right concept, direction and rule type (possible). The travel criterion uses 'History of travel with high risk of exposure to communicable disease' with onset within 3 months; SNOMED has no 'malaria area' / 'endemic area' concept, so this is the closest available (the generic 'Foreign travel history finding' would be worse, since many malaria areas are domestic). The nausea-and-vomiting conjunction is stricter than the page's intent and is also inconsistent with the check task's own trigger, which treats nausea and vomiting as separate.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'malaria area' exposure is encoded as generic ria", "kind": "rule", "priority": "medium", "ref": "Diagnose possible malaria", "text": "'Nausea and vomiting' is encoded as (and Nausea Vomiting), stricter than the page's symptom cluster, and inconsistent with the 'Check for exposure to a malaria area' task whose due_to lists Nausea and Finding of vomiting as separate (or) triggers. A traveller presenting with vomiting alone triggers the exposure check but can never be diagnosed as possible malaria through that symptom.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Check for exposure to a malaria area", "text": "The trigger uses only the Body temperature measurement >= 38 for fever; the briefing says the recorded form of the common symptom is (active_condition (snomed_concept \"Fever\" \"finding\")). A patient recorded with Fever but without a temperature value would not trigger the exposure check (the other listed symptoms still would).", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Check for urgent signs in suspected malaria", "text": "'Acute confusion' is a SNOMED child of 'Clouded consciousness', so the check list asks the same question twice. Harmless, but the list could drop one or use the parent 'Confusional state' (disorder) for 'confused'.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Check for exposure to a malaria area", "text": "Trigger is broader than the page: plain Headache, Cough, Nausea and Vomiting each trigger alone, whereas the page says severe headache, dry cough and 'nausea and vomiting' together; check_for lists severe headache and dry cough, so trigger and checklist disagree. Trigger omits shivering, joint pain and influenza-like illness that the page lists.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Urgent: suspected malaria with danger signs", "text": "Hb < 7 cannot be expressed, so the danger-sign list is knowingly incomplete; should be recorded as not_representable.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Check for urgent signs in suspected malaria", "text": "check_for omits measurement criteria (RR > 30, glucose, SBP < 80) that the priority rule uses, so a clinician is not prompted for them. Every check_for item is used by a rule.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Diagnose possible complicated (severe) malaria", "text": "Page names no separate 'possible complicated malaria' diagnosis (box says 'suspected severe malaria'). It duplicates the priority rule's whole criteria list, so the two must be kept in sync. Reasonable but unrequested; Hb < 7 missing. Existence of the 'Complicated malaria' SNOMED concept not verified by me.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "(none) footnote 2", "text": "'Shock likely' (SBP < 80, pulse >= 100, RR > 30, confusion/restlessness, weakness) has no probable Shock rule, so shock in the red box depends entirely on a worker recording 'Shock'.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Diagnose possible malaria", "text": "Exposure is modelled only as travel history; residents of malaria areas (the page says 'in a malaria area') are not captured. The 3-month window relies on the onset of a history-of-travel situation, which only works if the worker records the travel date.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Urgent: suspected malaria with danger signs / Diagnose possible complicated (severe) malaria", "text": "The danger-sign list is copied verbatim into both rules instead of the priority rule referencing (diagnosis Complicated malaria possible); correct now, but the copies can drift apart. The anuria clause relies on a back-dated onset (>= 12 hours ago), which may never be true when anuria is first recorded at triage.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Check for urgent signs in suspected malaria", "text": "Red-box item \"Hb < 7\" is not encoded anywhere: no measure task, no check_for item, no claim. Haemoglobin is not a routine vital, so the page is telling the health worker to measure it. No haemoglobin observable entity was found in SNOMED (so the threshold cannot be written as a measurement); the closest usable finding is (clinical_finding (snomed_concept \"Hemoglobin below reference range\" \"finding\")), confirmed with exists. Add it to this check_for. (Acute confusion is a descendant of Clouded consciousness, so it is redundant but harmless.)", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Diagnose possible malaria", "text": "The and/or shape (exposure within 3 months AND any presenting symptom) follows the page, and possible matches \"Suspect malaria\". But nausea and vomiting are conjoined (c041/c042) where the page lists them as one item of an any-of list; vomiting alone should suffice.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "high", "ref": "Diagnose possible complicated (severe) malaria", "text": "Red-box item \"Hb < 7\" is not encoded anywhere: no measure task, no check_for item, no claim. Haemoglobin is not a routine vital, so the page is telling the health worker to measure it. No haemoglobin observable entity was found in SNOMED (so the threshold cannot be written as a measurement); the closest usable finding is (clinical_finding (snomed_concept \"Hemoglobin below reference range\" \"finding\")), confirmed with exists. Add it as an or-branch. Otherwise the or-list mirrors the red box item by item, \"Complicated malaria\" carries the synonym \"Severe malaria\", and possible matches \"Manage as suspected severe malaria\".", "detail": [{"checker": "backward-1", "severity": "high"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "high", "ref": "Urgent: suspected malaria with danger signs", "text": "Red-box item \"Hb < 7\" is not encoded anywhere: no measure task, no check_for item, no claim. Haemoglobin is not a routine vital, so the page is telling the health worker to measure it. No haemoglobin observable entity was found in SNOMED (so the threshold cannot be written as a measurement); the closest usable finding is (clinical_finding (snomed_concept \"Hemoglobin below reference range\" \"finding\")), confirmed with exists. A patient with suspected malaria and Hb < 7 (and no other sign) will not be flagged Urgent. Urgent is the right level for \"Give urgent attention ... refer urgently to reach referral hospital within 6 hours\". Also unencoded: footnote 2 says \"If systolic BP < 80, pulse >= 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely\", which by the house standard is a probable Shock diagnosis rule that this evaluation could reference; without it \"Shock\" fires only when recorded directly.", "detail": [{"checker": "backward-1", "severity": "high"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Check for exposure to a malaria area", "text": "Trigger includes plain Headache and Cough (page: severe headache, dry cough); check_for omits muscle pain though trigger has it. Task as framed (screen for exposure) is a reasonable reading of the first box.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Check for urgent signs in suspected malaria", "text": "Omits Hb < 7 (element p39-733dd29c) from the danger-sign list; includes Known diabetes as a standalone item.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Diagnose possible complicated (severe) malaria", "text": "Omits Hb < 7, which is on the page as a severe-malaria sign. Possible tier matches 'manage as suspected severe malaria'.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "high", "ref": "Urgent: suspected malaria with danger signs", "text": "Omits Hb < 7, so a patient with suspected malaria and Hb<7 alone is not made Urgent. Urgent level itself is justified by 'Give urgent attention'.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "high", "ref": "Check for urgent signs in suspected malaria", "text": "Red-box item 'Hb < 7' is missing. The house standard requires the check_for to include every red-box item. Note that Hb has no g/dL unit in the grammar, so it may need a finding such as severe anaemia, or a remaining-questions entry.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 39, "slug": "39-malaria", "kind": "rule", "priority": "medium", "ref": "Diagnose possible malaria", "text": "'Suspect malaria' maps correctly to possible, and the structure (exposure AND any symptom, with nausea AND vomiting) follows the page. But the exposure condition uses a travel-only concept with an onset window that doesn't capture residents of malaria areas or the timing of exposure. Under-triggering is possible for people who live in endemi <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },

};

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};

const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });

(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });

(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });

(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
