ortness of breath on mild exertion or RR > 24.", "bbox": [459.9, 372.7, 570.5, 493.7], "key": "p23-21128af7"}, {"id": "p23-out-e06", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If diagnosis uncertain or poor response to treatment, refer. If patient has life-limiting illness, also give palliative care 191.", "bbox": [183.2, 514.9, 658.3, 525.9], "key": "p23-9cbaa225"}, {"id": "p23-out-e07", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with cough or difficulty breathing not needing urgent attention • Test for HIV 124. If on abacavir, check for abacavir hypersensitivity reaction (AHR) 131. • Test for TB: send 1 sputum sample for TB NAAT 102. • If patient smokes, encourage to stop 164. Ask about duration and recurrence of cough or difficulty breathing:", "bbox": [51.0, 226.3, 785.4, 260.2], "key": "p23-1128cc7a"}, {"id": "p23-out-e08", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Cough < 2 weeks and not recurrent", "bbox": [175.6, 273.3, 307.7, 283.5], "key": "p23-88004b5f"}, {"id": "p23-out-e09", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Does patient have crackles or bronchial breathing on auscultation?", "bbox": [118.2, 296.7, 363.1, 306.9], "key": "p23-620b3770"}, {"id": "p23-out-e10", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes: Pneumonia likely • Confirm diagnosis with chest x-ray if available. • If poor living conditions, adherence to treatment unlikely, or no transport, refer. • Any of: HIV, > 65 years, lung/heart/liver/kidney disease, diabetes or alcohol misuse?", "bbox": [174.5, 319.2, 425.7, 380.2], "key": "p23-04553a03"}, {"id": "p23-out-e11", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes: give amoxicillin/clavulanic acid4", "bbox": [177.3, 392.7, 322.8, 403.5], "key": "p23-ee5f365f"}, {"id": "p23-out-e12", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "875/125mg 12 hourly for 5 days. No: give amoxicillin4 1g", "bbox": [190.1, 392.7, 441.5, 413.5], "key": "p23-f706014f"}, {"id": "p23-out-e13", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "8 hourly for 5 days.", "bbox": [358.0, 403.3, 426.7, 413.5], "key": "p23-7a57c6f2"}, {"id": "p23-out-e14", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No: Acute viral infection likely • Usually sudden onset fever, chills or body pain. • If recent cold and now tight/ sore chest or coughing sputum, acute bronchitis likely. • Advise antibiotics are not needed. • If pain/fever: give paracetamol 500mg-1g 4-6 hourly (max 4g/24 hours) as needed for up to 5 days. • Advise rest and hydration. • Advise patient to return if earache, pain over sinuses, or cough/fever persists longer than 1 week.", "bbox": [39.8, 319.2, 157.2, 500.2], "key": "p23-b3d80faf"}, {"id": "p23-out-e15", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If pain/fever: give paracetamol 500mg-1g 4-6 hourly (max 4g/24hours) as needed for up to 5 days. • Advise rest and hydration and to return if worsens. • Review after 2 days: if no better, refer. • If > 50 years or persistent symptoms, repeat chest x-ray 4-6 weeks after treatment or earlier if worsening symptoms/complications suspected (e.g. empyema/abscess/pneumothorax).", "bbox": [174.5, 426.1, 440.8, 496.9], "key": "p23-173c7994"}, {"id": "p23-out-e16", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Cough/difficulty breathing ≥ 2 weeks or recurrent episodes", "bbox": [522.5, 273.3, 739.5, 283.5], "key": "p23-ba551fd6"}, {"id": "p23-out-e17", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If itchy/blocked nose, or frequent throat clearing, consider underlying nose problems 51. • Also consider asthma and COPD 138 and other cause:", "bbox": [459.9, 296.2, 804.0, 317.1], "key": "p23-5f9ce05b"}, {"id": "p23-out-e18", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Persistent snoring or poor sleep", "bbox": [597.8, 330.2, 638.0, 360.4], "key": "p23-ec986182"}, {"id": "p23-out-e19", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Obstructive sleep apnoea", "bbox": [590.9, 372.7, 645.6, 393.7], "key": "p23-75e01b32"}, {"id": "p23-out-e20", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely • If overweight 156. • Refer if enlarged tonsils, stops breathing/ chokes/ gasps while sleeping.", "bbox": [588.9, 393.5, 645.2, 493.7], "key": "p23-6559e2ac"}, {"id": "p23-out-e21", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Recent upper", "bbox": [670.4, 330.2, 722.0, 340.4], "key": "p23-2cff60d9"}, {"id": "p23-out-e22", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "respiratory tract infection,", "bbox": [668.7, 340.2, 723.7, 360.4], "key": "p23-efe482a5"}, {"id": "p23-out-e23", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "no difficulty", "bbox": [673.4, 360.2, 719.0, 370.4], "key": "p23-d00344dc"}, {"id": "p23-out-e24", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "breathing", "bbox": [677.2, 370.2, 713.1, 380.4], "key": "p23-7b93b459"}, {"id": "p23-out-e25", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Smoker or", "bbox": [754.7, 330.2, 794.1, 340.4], "key": "p23-f2c32620"}, {"id": "p23-out-e26", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "recently stopped", "bbox": [758.1, 340.2, 790.1, 360.4], "key": "p23-36b1eddf"}, {"id": "p23-out-e27", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If weight loss, consider lung cancer 37. • If coughing with/without sputum most days of 3 months for ≥ 2 years, COPD likely 138.", "bbox": [744.9, 373.5, 801.4, 493.7], "key": "p23-81e8590b"}, {"id": "p23-out-e28", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Post-infectious", "bbox": [665.5, 392.7, 726.7, 403.7], "key": "p23-652e1c50"}, {"id": "p23-out-e29", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "cough likely • Reassure cough should resolve on its own. • Advise to return if cough persists > 8 weeks.", "bbox": [664.0, 402.7, 724.8, 493.7], "key": "p23-307beea4"}, {"id": "p23-out-e30", "page": 23, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely. 2Large bore cannula: 14G (orange), 16G (grey), 18G (green). 3If severe penicillin allergy (previous angioedema, anaphylaxis or urticaria), discuss with doctor. Avoid giving Ringer's lactate together with IV ceftriaxone. 4If severe penicillin allergy, give instead moxifloxacin 400mg daily for 5 days. 5If < 40kg, give 160/800mg. If 40-56kg, give 240/1200mg.", "bbox": [34.0, 535.3, 791.6, 551.8], "key": "p23-0d90b567"}], "boxes": [{"box": 1, "rect": [35.1, 86.5, 806.4, 214.4]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAELCAIAAADsisaoAAAACXBIWXMAABcSAAAXEgFnn9JSAAGWJUlEQVR4nOy9B3BWR9Mu+O+9W7f27q2tuvv/u1u1W3f3My9JIHISIBAIkUTOUWBEkshJ5CRyMjmKJDIYkZMQCEQOAowQmJwNNrYxNhhs8Gd/Zx+9LTXDyUq8kumqp1R658w5Z0JPT/dzZnr+7af/UUggEAgEAoFAIBAIBAKBQCDIX/g3n5dAIBAIBAKBQCAQCAQCgUAgyCyE1RIIBAKBQCAQCAQCgUAgEOQ/vGe1Xo/q//u6OQKBQCAQCAQCgUAgEAgEAkHexJsJUSas1ruEtdo/vxYIBAKBQCAQCAQCgUAgEAjyJv44EyeslkAgEAgEAoFAIBAIBAKBIJ9BWC2BQCAQCAQCgUAgEAgEAkH+g7BaAoFAIBAIBAKBQCAQCASC/AdhtQQCgUAgEAgEAoFAIBAIBPkPwmoJBAKBQCAQCAQCgUAgEAjyH4TVEggEAoFAIBAIBAKBQCAQ5D8IqyUQCAQCgUAgEAgEAoFAIMh/EFZLIBAIBAKBQCAQCAQCgUCQ/yCslkAgEAgEAoFAIBAIBAKBIP9BWC2BQCAQCAQCgUAgEAgEAkH+g7BaAoFAkA/w8qfzPi+DwB75q49OHduQcGAl4POSmOLdm5TfXl3yeTGMePXiwl/vrtpk+PrKHmrYn74/4/PS2sC3AvD905P09tvX4znROIIgA1cu7TyZtP7H705RyvNnp/ftXrpsUXTMkgmJB1f//utXeaop3r6+TI+6cHarTxqW8O3j41SMuzcPWuXJs0PMiJvX9lN10Ps+L4wNoBy2fTl/0fyxu7cv9nlhBAKB4JOCsFoCgUDge8AXgh08a9rQXj07hLVvOrDf5wvmjL53K4GuThjXz/OPf/To2sbn5RRYId/1Uc3qASgw4POSGPHoXmK50iVKFCt6/vQWnxdGxb7dS4sWKhgYUP7Vi2SrPMOjelDDnj212ecFtoFvBSDhwEp6+/QpQ/Dzr3dXG4fWKlSgwPKlEznPzriFpUsUp2xjRvZCysJ5Y4oXLUIpOdjIOdgU3z4+To9q17qhr3qWmo6KMfeLkaYZ8uwQMwVpV+DYkbzrnnx9ZU/FcqWpnNWqVPR5eQQCgeCTgrBaAoFA4GPs2bEYRrDqqhHYwQutWwM/Sxb3++O3Kz4vba7it1eXDu5bPjl64NrV07Nw+5kTmxbMGT12VG/HxOzg+6cn4zbPGx7V49yp9w5hrvbRra/3r14+pU9kRxsyJbMFzjuslrGDEvavoLItWxSd/ednU6hURI9N964vX9huVXhhtdxAx2r99P2ZQgUK4GeXsBaU4Xrq3iIFPZSnTEn/40fWbftyPv0s7CnQtFHtJg1DKpQtlSPDTdcU2REYn7BaRv3gyGrl7BDLbeR9Vutff1xrFBpMhaxcsWzviA4+L5JAIBB8UhBWSyAQCHyJNSunMo1Vo1pARPd2QwaEd+rQrJS/39WU3ZTnUvK2kUN7Jh1e4/PS5ja+St5OTTFuVJ8s3O5XuCDurRdS3TExO1i6cDwV8sCeGE7M1T76PKw5vTFrm9pMC5x3WC1jB717k7Jw7pjpU4b8/OO57D8/m0Kl4unjY9Fj+saumGpTeGG13EDHagG7ti0aPSLy1vUD9HPMyF6UYdP6LzQva9C+TSNKuXg+jvLkFIOsa4rsCIxPWC2jfnBktXJ2iOU28j6r9c2Do1TCBvVqom19Xh6BQCD41CCslkA linical_finding (snomed_concept \"Chest pain\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Trachea displaced\" \"disorder\"))\n\n    ;; wheeze/tight chest\n    (clinical_finding (snomed_concept \"Wheezing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Tight chest\" \"finding\"))\n\n    ;; confused, agitated or reduced consciousness\n    (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Feeling agitated\" \"finding\"))\n    (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n\n    ;; breathless at rest or while talking\n    (clinical_finding (snomed_concept \"Dyspnea at rest\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unable to complete a sentence in one breath\" \"finding\"))\n\n    ;; shock, coughing blood, calf\n    (clinical_finding (snomed_concept \"Shock\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Hemoptysis\" \"finding\"))\n    (clinical_finding (snomed_concept \"Swollen calf\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Pain in calf\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n\n  )\n)\n(task\n  \"Check for causes of cough or difficulty breathing not needing urgent attention\"\n  adult\n  (or (clinical_finding (snomed_concept \"Cough\" \"finding\"))\n      (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\")))\n  (check_for\n    ;; duration and recurrence\n    (clinical_finding (snomed_concept \"Cough\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n\n    ;; cough < 2 weeks: auscultation, recent cold\n    (clinical_finding (snomed_concept \"Respiratory crackles\" \"finding\"))\n    (clinical_finding (snomed_concept \"Bronchial breathing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Common cold\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Productive cough\" \"finding\"))\n\n    ;; cough/difficulty breathing >= 2 weeks or recurrent\n    (clinical_finding (snomed_concept \"Itching\" \"finding\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Clearing throat - hawking\" \"finding\"))\n    (clinical_finding (snomed_concept \"Human immunodeficiency virus infection\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Dry cough\" \"finding\"))\n    (clinical_finding (snomed_concept \"Habitual snoring\" \"finding\"))\n    (clinical_finding (snomed_concept \"Poor sleep pattern\" \"finding\"))\n    (clinical_finding (snomed_concept \"Upper respiratory infection\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Smoker\" \"finding\"))\n    (clinical_finding (snomed_concept \"Ex-smoker\" \"finding\"))\n    (clinical_finding (snomed_concept \"Weight decreased\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable heart failure (cough/difficulty breathing page)\"\n  (diagnosis\n    (snomed_concept \"Heart failure\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Orthopnea\" \"finding\"))\n       (clinical_finding (snomed_concept \"Swelling of lower limb\" \"finding\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable tension pneumothorax (cough/difficulty breathing page)\"\n  (diagnosis\n    (snomed_concept \"Tension pneumothorax\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Dyspnea\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (or (clinical_finding (snomed_concept \"Hyperresonance\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Decreased breath sounds\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Chest pain\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\"))))\n    (clinical_finding (snomed_concept \"Trachea displaced\" \"disorder\"))\n    (or (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n        (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60))\n  )\n)\n;; Cough < 2 weeks and not recurrent, no crackles or bronchial breathing (see 23-cough-or-difficulty-breathing-flowchart.md)\n(system_diagnosis_rule\n  \"Diagnose probable acute viral infection (short cough, no crackles)\"\n  (diagnosis\n    (snomed_concept \"Acute viral disease\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (<= (onset (clinical_finding (snomed_concept \"Cough\" \"finding\"))) (time_ago 2 weeks))\n    (no (clinical_finding (snomed_concept \"Cough\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\"))))\n    (no (clinical_finding (snomed_concept \"Respiratory crackles\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Bronchial breathing\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable acute bronchitis (short cough, recent cold)\"\n  (diagnosis\n    (snomed_concept \"Acute bronchitis\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (<= (onset (clinical_finding (snomed_concept \"Cough\" \"finding\"))) (time_ago 2 weeks))\n    (no (clinical_finding (snomed_concept \"Cough\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\"))))\n    (no (clinical_finding (snomed_concept \"Respiratory crackles\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Bronchial breathing\" \"finding\")))\n    (clinical_finding (snomed_concept \"Common cold\" \"disorder\"))\n    (or (clinical_finding (snomed_concept \"Tight chest\" \"finding\"))\n        (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n        (clinical_finding (snomed_concept \"Productive cough\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable pneumonia (short cough with crackles/bronchial breathing)\"\n  (diagnosis\n    (snomed_concept \"Pneumonia\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (<= (onset (clinical_finding (snomed_concept \"Cough\" \"finding\"))) (time_ago 2 weeks))\n    (no (clinical_finding (snomed_concept \"Cough\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\"))))\n    (or (clinical_finding (snomed_concept \"Respiratory crackles\" \"finding\"))\n        (clinical_finding (snomed_concept \"Bronchial breathing\" \"finding\")))\n  )\n)\n;; Cough/difficulty breathing >= 2 weeks or recurrent episodes\n(system_diagnosis_rule\n  \"Diagnose possible nose disorder (chronic or recurrent cough)\"\n  (diagnosis\n    (snomed_concept \"Disorder of the nose\" \"disorder\")\n    possible\n  )\n  adult\n  (and\n    (or (>= (onset (clinical_finding (snomed_concept \"Cough\" \"finding\"))) (time_ago 2 weeks))\n        (>= (onset (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))) (time_ago 2 weeks))\n        (clinical_finding (snomed_concept \"Cough\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\"))))\n    (or (clinical_finding (snomed_concept \"Itching\" \"finding\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")))\n        (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\"))\n        (clinical_finding (snomed_concept \ monia\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Tension pneumothorax\" \"disorder\") probable)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Disorder of the nose\" \"disorder\") possible)", "B": "(diagnosis (snomed_concept \"Disorder of nose AND/OR nasopharynx\" \"disorder\") possible)", "relation": "A_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": ["(measurement (snomed_concept \"Blood glucose status\" \"observable entity\") mmol/L)"], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 23 – Cough or difficulty breathing: flowchart\n\nSource: APC 2026 e-book page 23. The red box is the urgent screen; the panel below\nit (\"Approach to the patient with cough or difficulty breathing not needing urgent attention\") is a\ntwo-branch algorithm on duration/recurrence.\n\n```mermaid\nflowchart TD\n    START[\"Cough or difficulty breathing\"] --> RB{\"Red box: any of the urgent signs?\"}\n    RB -- Yes --> URG[\"Give urgent attention; manage and refer urgently<br/>(heart failure likely / tension pneumothorax likely sub-pictures)\"]\n    RB -- No --> APPROACH[\"Test for HIV, TB NAAT, smoking advice.<br/>Ask about duration and recurrence\"]\n    APPROACH --> SHORT[\"Cough &lt; 2 weeks <i>and<\/i> not recurrent\"]\n    APPROACH --> LONG[\"Cough/difficulty breathing ≥ 2 weeks or recurrent episodes\"]\n    SHORT --> AUSC{\"Crackles or bronchial breathing on auscultation?\"}\n    AUSC -- No --> VIRAL[\"Acute viral infection likely\"]\n    VIRAL --> BRONCH[\"If recent cold and now tight/sore chest or coughing sputum:<br/>acute bronchitis likely\"]\n    AUSC -- Yes --> PNEU[\"Pneumonia likely\"]\n    PNEU --> RISK{\"Any of: HIV, &gt; 65 years, lung/heart/liver/kidney disease,<br/>diabetes or alcohol misuse?\"}\n    RISK -- Yes --> AMOXCLAV[\"amoxicillin/clavulanic acid\"]\n    RISK -- No --> AMOX[\"amoxicillin\"]\n    LONG --> NOSE[\"Itchy/blocked nose or frequent throat clearing:<br/>consider underlying nose problems → 51\"]\n    LONG --> ASTHMA[\"Also consider asthma and COPD → 138, and other cause:\"]\n    ASTHMA --> PJP[\"HIV with CD4 &lt; 200 and dry cough, shortness of breath:<br/>PJP likely\"]\n    ASTHMA --> OSA[\"Persistent snoring or poor sleep:<br/>obstructive sleep apnoea likely\"]\n    ASTHMA --> PIC[\"Recent URTI, no difficulty breathing:<br/>post-infectious cough likely\"]\n    ASTHMA --> SMOK[\"Smoker or recently stopped\"]\n    SMOK --> LCA[\"If weight loss: consider lung cancer → 37\"]\n    SMOK --> COPD[\"Cough most days of 3 months for ≥ 2 years:<br/>COPD likely → 138\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `Cough` or `Difficulty breathing` (descendants include the recorded common symptom `Dyspnea`) | `due_to` of both `check_for` tasks and of the priority rule |\n| Red box, any item | `(and complaint (or …red-box items…))` | `Urgent: cough or difficulty breathing with red-box signs` |\n| Heart failure likely | Orthopnea **and** swelling of lower limb | `Diagnose probable heart failure (cough/difficulty breathing page)` → `(active_condition Heart failure)` in the priority rule |\n| Tension pneumothorax likely | Sudden-onset dyspnoea **and** a one-sided sign (hyperresonance / decreased breath sounds / chest pain, each `Unilateral`) **and** displaced trachea **and** BP < 90/60 | `Diagnose probable tension pneumothorax (cough/difficulty breathing page)` → `(active_condition Tension pneumothorax)` in the priority rule |\n| Rapid deep breathing → glucose | not modelled: glucose is a routine vital (no `measure` task); \"If > 11.1 → 19\" is a cross-reference | — |\n| Cough < 2 weeks and not recurrent | `(<= (onset Cough) (time_ago 2 weeks))` **and** `(no Cough + Recurrent)` | used inside the three short-cough rules |\n| Crackles/bronchial breathing = No | `(no Respiratory crackles)` and `(no Bronchial breathing)` | `Diagnose probable acute viral infection (short cough, no crackles)` |\n| Acute bronchitis likely | short-cough No-branch **and** common cold **and** (tight chest or chest pain or productive cough) | `Diagnose probable acute bronchitis (short cough, recent cold)` |\n| Crackles/bronchial breathing = Yes | short-cough gate **and** (crackles or bronchial breathing) | `Diagnose probable pneumonia (short cough with crackles/bronchial breathing)` |\n| Pneumonia risk question (antibiotic choice) | not modelled (management) | — |\n| Cough/DB ≥ 2 weeks or recurrent | `or` of `(>= (onset Cough) (time_ago 2 weeks))`, `(>= (onset Difficulty breathing) (time_ago 2 weeks))`, recurrent cough, recurrent difficulty breathing | used inside every long-branch rule |\n| Consider nose problems | long gate **and** (itching of nose, nasal congestion, throat clearing) | `Diagnose possible nose disorder (chronic or recurrent cough)` |\n| Consider asthma and COPD | long gate | `Diagnose possible asthma (chronic or recurrent cough/difficulty breathing)`, `Diagnose possible COPD (chronic or recurrent cough/difficulty breathing)` |\n| PJP likely | long gate **and** known HIV **and** dry cough **and** dyspnoea (CD4 < 200 not representable) | `Diagnose probable PJP (chronic cough with HIV)` |\n| OSA likely | long gate **and** (habitual snoring or poor sleep pattern) | `Diagnose probable obstructive sleep apnoea (chronic cough page)` |\n| Post-infectious cough likely | long gate **and** upper respiratory infection **and** `(no Difficulty breathing)` | `Diagnose probable post-infectious cough` |\n| Consider lung cancer | long gate **and** (smoker or ex-smoker) **and** weight decreased | `Diagnose possible lung cancer (smoker with chronic cough and weight loss)` |\n| COPD likely | (smoker or ex-smoker) **and** `(>= (onset Cough) (time_ago 2 years))` | `Diagnose probable COPD (smoker with cough for 2 years or more)` |\n\n## Notes\n\n- \"< 2 weeks\" is written `<=` and \"≥ 2 weeks\" `>=`, because onset comparisons accept only `>=`/`<=`;\n  a cough of exactly 2 weeks therefore satisfies both gates.\n- \"Recent\" (recent cold, recent URTI) is not modelled as a time comparison.\n- Treatment boxes (antibiotics, paracetamol, co-trimoxazole, review/refer) are management and are not modelled.\n", "questions": "# Page 23 – Cough or difficulty breathing: remaining questions\n\n## Decisions made\n\n- **Trigger.** `Cough` or `Difficulty breathing`. `Dyspnea` (the recorded \"Shortness of breath\"\n  common symptom) is a descendant of `Difficulty breathing`, so both recorded complaints fire the tasks.\n- **Shock/SBP < 80** is encoded as this page's own `or` of `(clinical_finding Shock)` and systolic\n  BP < 80. Footnote 1 (pulse ≥ 100, RR > 30, …, \"shock likely\") is not built into a shock rule.\n- **BP < 90/60** (tension pneumothorax) is systolic < 90 **or** diastolic < 60.\n- **Heart failure likely** = orthopnoea **and** swelling of lower limb (the general concept, so the\n  `Leg swelling symptom` descendant also matches). The priority rule references\n  `(active_condition Heart failure)`.\n- **Tension pneumothorax likely** is read as one clinical picture: sudden-onset dyspnoea **and** a\n  one-sided sign (hyperresonance, decreased breath sounds or chest pain, each with `Unilateral`)\n  **and** displaced trachea **and** BP < 90/60. The priority rule references\n  `(active_condition Tension pneumothorax)`.\n- **Confused** = `Clouded consciousness` (VHA's ACVPU \"Confused\" finding); agitated = `Feeling agitated`;\n  reduced consciousness = `Decreased level of consciousness`.\n- **Breathless while talking** = `Unable to complete a sentence in one breath`.\n- **Swelling and pain in one calf** = `Swollen calf` and `Pain in calf`, both with `Unilateral`.\n- **Rapid deep breathing → fingerprick glucose** (management list) has no `measure` task: glucose is\n  a routine vital in Will's briefing, so it needs no task. \"If > 11.1 → 19\" is a cross-reference.\n  The element is accounted for as `management_step`. (Reconciler: builder B's choice over builder A's\n  Kussmaul-triggered measure task.)\n- **Laterality.** \"more resonant/decreased breath sounds/pain on 1 side\" is read with \"on 1 side\"\n  applying to all three signs, so each carries `Unilateral`.\n- **Persistent snoring** = `Habitual snoring`; **frequent throat clearing** = `Clearing throat - hawking`\n  (a finding, a descendant of `Cough`).\n- **Acute viral infection** = `Acute viral disease` (closest to the page's words; the page does not say\n  \"respiratory\"). Builder B used `Viral respiratory infection`; see Questions for a clinician.\n- **Nose problems** = `Disorder of the nose` (the page does not mention the nasopharynx).\n- **Duration and recurrence.** \"Cough < 2 weeks\" is `(<= (onset Cough) (time_ago 2 weeks))`, and\n  \"≥ 2 weeks\" is `(>= (onset …) (time_ago 2 weeks))`. The database accepts only `>=`/`<=` in onset\n  comparisons, so a cough of exactly 2 weeks matches both branches. \"Recurrent\" is the finding with the\n  `Recurrent` qualifier. \"Not recurrent\" is an explicit `(no Cough + Recurrent)`.\n- **Crackles/bronchial breathing = No** is an explicit `(no …)` for both findings.\n- **Acute bronchitis** is read as \"recent cold **and** (tight chest, sore chest or coughing sputum)\",\n  inside the short-cough, no-crackles branch.\n- **Long branch.** Every right-hand rule except probable COPD carries the \"≥ 2 weeks or recurrent\"\n  gate. Probable COPD has its own ≥ 2-year onset. Post-infectious cough uses only the cough part of\n  the gate, because the page requires no difficulty breathing.\n- **\"Consider\"** items (nose problems, asthma, COPD, lung cancer) are `possible` rules. The **\"likely\"**\n  items (acute viral infection, acute bronchitis, pneumonia, PJP, OSA, post-infectious cough, COPD)\n  are `probable` rules.\n- **Severe pneumonia** (red box, management list) only selects ceftriaxone, so it is accounted for as\n  `management_step`. Its age > 65 criterion could not be expressed anyway.\n\n## Could not model\n\n- **SpO₂ \"drops to < 87% on exertion (walking 15–20 m)\"**: a measurement has no exertion context.\n  Only SpO₂ < 92% at rest is encoded, so the rule fires **less often** than the page intends.\n- **\"Coughs ≥ 1 tablespoon fresh blood\"**: the amount and \"fresh\" are not expressible. Any\n  `Hemoptysis` matches, so the rule fires **more often**. (Hemoptysis is also a Very urgent warning sign.)\n- **CD4 < 200** (PJP): a lab value with no unit or observable in the language. PJP is diagnosed from known\n  HIV + dry cough + dyspnoea + the long gate, so it fires **more often** than the page intends.\n- **COPD \"most days of 3 months for ≥ 2 years\"**: only \"cough onset ≥ 2 years ago\" is encoded. The\n  rule fires **more often** (any long-standing cough in a smoker) and can also miss a cough recorded\n  without an onset date.\n- **\"Recent\"** cold, URTI or stopping smoking: no time comparison. Any recorded common cold, URTI or\n  ex-smoker status matches (fires **more often**).\n- **Frequent** throat clearing: frequency not encoded.\n- **Severe pneumonia's** age > 65: no age comparison in the language (management only, see above).\n- **Treatment-selection question** for pneumonia (HIV, > 65 years, comorbidities, alcohol): management.\n\n## SNOMED gaps\n\n- **Sore chest**: no concept found; `Chest pain` is used.\n- **Post-infectious cough**: no direct concept; `Persistent cough after viral respiratory infection`\n  (disorder) is used.\n- **Itchy nose**: no precoordinated concept; `Itching` with finding site `Nasal structure` (resolves) is used.\n- **Persistent snoring**: `Habitual snoring` is used.\n- **Weight loss** (finding) does not exist; `Weight decreased` is used.\n- `Chest structure` (body structure) does not resolve, so no chest finding site is used.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Tension pneumothorax: should the urgent rule need the whole picture (as encoded), or should sudden\n  breathlessness plus any one-sided sign be enough to make the patient urgent?\n- `(active_condition Heart failure)` makes any patient with known heart failure and a cough urgent. Is\n  that acceptable, or should the urgent rule use only the orthopnoea + leg swelling findings?\n- Is `Clouded consciousness` the right concept for \"confused\" (or `Acute confusion`)? And should the ACVPU findings\n  (responds to voice/pain, unresponsive) also count as \"reduced consciousness\"?\n- Is \"post-infectious cough\" → `Persistent cough after viral respiratory infection` an acceptable SNOMED choice?\n- Should a cough of exactly 2 weeks count as short or long (the encoding currently allows both)?\n- Should PJP stay `probable` without CD4 < 200, or be `possible` until a CD4 form exists?\n- \"Acute viral infection likely\": `Acute viral disease` (page's words, as encoded) or\n  `Viral respiratory infection` (more specific to a cough page)?\n- \"Swelling and pain in one calf\": both findings carry `Unilateral`, but nothing ties them to the\n  same calf. Is that acceptable?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent cough or difficulty breathing conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cough\" \"finding\"))", "element_keys": ["p23-a5357eb9"], "quote": "cough"}, {"claim_id": "c002", "rule": "Check for urgent cough or difficulty breathing conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Difficulty breathing\" \"finding\"))", "element_keys": ["p23-a5357eb9"], "quote": "difficulty breathing"}, {"claim_id": "c003", "rule": "Check for urgent cough or difficulty breathing conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Orthopnea\" \"finding\"))", "element_keys": ["p23-1a1fd5e0"], "quote": "Difficulty breathing worse on lying flat"}, {"claim_id": "c004", "rule": "Check le.", "detail": [{"checker": "forward-1", "severity": "high"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "Urgent: cough or difficulty breathing with red-box signs", "text": "Exertional desaturation (SpO2 drops to < 87% on walking 15-20m) is missing from the check list and the priority rule; cyanosis and < 92% at rest are the only parts encoded.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "Urgent: cough or difficulty breathing with red-box signs (Shock)", "text": "Footnote 1 defines 'shock likely' (SBP < 80, pulse >= 100, RR > 30, confusion/restlessness, weakness); no probable Shock rule exists, so the Shock disjunct only fires on a directly recorded Shock finding. The house pattern for a red-box 'X likely' is a probable rule referenced via active_condition.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tension pneumothorax (cough/difficulty breathing page)", "text": "All four groups (sudden dyspnea, one-sided sign, deviated trachea, BP < 90/60) are required conjunctively. The page's comma list can be read that way, but tracheal deviation and hypotension are late signs; requiring every one means the rule, and therefore the Urgent disjunct for tension pneumothorax, will almost never fire. Worth a clinician question (any2/any3 of the groups with sudden dyspnea required).", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "(none) severe pneumonia", "text": "The red box's 'severe pneumonia (2 or more of confusion/decreased consciousness, BP < 90/60, RR >= 30, age > 65)' is not encoded. It governs management on this page, and age > 65 is not representable, so leaving it out is defensible; recorded here so the decision is explicit.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "Diagnose probable PJP (chronic cough with HIV)", "text": "CD4 < 200 is dropped (no cell-count unit in the language), so the rule fires for any known-HIV patient with chronic dry cough and dyspnea. Not fixable in the language; should be listed under 'could not model'.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "Diagnose probable post-infectious cough; Diagnose probable acute bronchitis", "text": "'Recent' upper respiratory tract infection and 'recent' cold are matched with no time bound; an onset comparison on the infection finding would express the page's recency.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "Urgent priority rule and bronchitis rule", "text": "Tight chest is Urgent (red box) and also a trigger for acute bronchitis (non-urgent); a patient gets both. Chest pain unqualified is a task-2 check item while unilateral chest pain is task-1.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "Diagnose probable PJP", "text": "CD4 < 200 omitted, so probable overreaches.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": "rule", "priority": "medium", "ref": "Diagnose probable COPD (smoker with cough for 2 years or more)", "text": "Missing 'most days of 3 months' criterion.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 23, "slug": "23-cough-or-difficulty-breathing", "kind": " <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
