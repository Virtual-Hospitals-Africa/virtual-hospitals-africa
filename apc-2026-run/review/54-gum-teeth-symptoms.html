ling of face/jaw/next to tooth (with temperature >= 38 °C, a routine vital)\n    (clinical_finding (snomed_concept \"Facial swelling\" \"finding\"))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Jaw region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Tooth, gum, and/or supporting structure\" \"body structure\")))\n\n    ;; Red box: unable to eat or drink\n    (clinical_finding (snomed_concept \"Unable to eat\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unable to drink\" \"finding\"))\n\n    ;; Red box: tooth pain felt without touching tooth/gum, or that wakes patient at night\n    (clinical_finding (snomed_concept \"Toothache\" \"finding\") (qualifier (snomed_concept \"Spontaneous\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Toothache\" \"finding\") (qualifier (snomed_concept \"Night time\" \"qualifier value\")))\n\n    ;; Dental caries: staining, holes/pits, missing teeth\n    (clinical_finding (snomed_concept \"Staining of tooth\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Cavity\" \"morphologic abnormality\") (finding_site (snomed_concept \"Tooth structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Tooth absent\" \"finding\"))\n\n    ;; Gum problem: gums red/bleeding or enlarged\n    (clinical_finding (snomed_concept \"Gingival erythema\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Bleeding gums\" \"finding\"))\n    (clinical_finding (snomed_concept \"Gingival enlargement\" \"disorder\"))\n\n    ;; Dental abscess: tooth pain with pus in mouth, swelling next to tooth\n    (clinical_finding (snomed_concept \"Toothache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pus\" \"morphologic abnormality\") (finding_site (snomed_concept \"Oral cavity structure\" \"body structure\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable dental caries (gum/teeth symptoms)\"\n  (diagnosis\n    (snomed_concept \"Dental caries\" \"disorder\")\n    probable\n  )\n  adult\n  (or (clinical_finding (snomed_concept \"Staining of tooth\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Cavity\" \"morphologic abnormality\") (finding_site (snomed_concept \"Tooth structure\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Tooth absent\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable gum problem (gum/teeth symptoms)\"\n  (diagnosis\n    (snomed_concept \"Gingival disease\" \"disorder\")\n    probable\n  )\n  adult\n  (or (clinical_finding (snomed_concept \"Gingival erythema\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Bleeding gums\" \"finding\"))\n      (clinical_finding (snomed_concept \"Gingival enlargement\" \"disorder\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable dental abscess (gum/teeth symptoms)\"\n  (diagnosis\n    (snomed_concept \"Dental abscess\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Toothache\" \"finding\"))\n       (clinical_finding (snomed_concept \"Pus\" \"morphologic abnormality\") (finding_site (snomed_concept \"Oral cavity structure\" \"body structure\")))\n       (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Tooth, gum, and/or supporting structure\" \"body structure\")))\n  )\n)\n(system_priority_evaluation\n  \"Urgent: gum/teeth symptoms with danger signs\"\n  adult\n  Urgent\n  (and\n    (or (clinical_finding (snomed_concept \"Tooth finding\" \"finding\"))\n        (clinical_finding (snomed_concept \"Gingivae finding\" \"finding\")))\n    (or\n      (and (>= (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38)\n           (or (clinical_finding (snomed_concept \"Facial swelling\" \"finding\"))\n               (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Jaw region structure\" \"body structure\")))\n               (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Tooth, gum, and/or supporting structure\" \"body structure\")))))\n      (clinical_finding (snomed_concept \"Unable to eat\" \"finding\"))\n      (clinical_finding (snomed_concept \"Unable to drink\" \"finding\"))\n      (clinical_finding (snomed_concept \"Toothache\" \"finding\") (qualifier (snomed_concept \"Spontaneous\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Toothache\" \"finding\") (qualifier (snomed_concept \"Night time\" \"qualifier value\")))\n    )\n  )\n)\n", "rules": [{"atom": "task", "description": "Check for urgent and likely gum/teeth conditions", "ages": ["adult"], "raw": "(task \"Check for urgent and likely gum/teeth conditions\" \"adult\" (or (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Tooth finding\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Gingivae finding\" \"finding\"))) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Facial swelling\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Jaw region structure\" \"body structure\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Tooth, gum, and/or supporting structure\" \"body structure\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to eat\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to drink\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Toothache\" \"finding\") (qualifier (snomed_concept \"Spontaneous\" [\"Dental abscess likely\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Gum/teeth symptoms | Tooth finding or Gingivae finding | trigger of `Check for urgent and likely gum/teeth conditions`; first conjunct of `Urgent: gum/teeth symptoms with danger signs` |\n| Red box | (temp ≥ 38 °C and (facial / jaw / next-to-tooth swelling)) or unable to eat or unable to drink or spontaneous toothache or night-time toothache | `Urgent: gum/teeth symptoms with danger signs` |\n| B1 → Dental caries likely | Staining of tooth or cavity in tooth or tooth absent | `Diagnose probable dental caries (gum/teeth symptoms)` |\n| B2 → Gum problem likely | Gingival erythema or bleeding gums or gingival enlargement | `Diagnose probable gum problem (gum/teeth symptoms)` |\n| B3 → Dental abscess likely | Toothache and pus in mouth and swelling next to tooth | `Diagnose probable dental abscess (gum/teeth symptoms)` |\n", "questions": "# Page 54 – Gum/teeth symptoms: remaining questions\n\n## Decisions made\n\n- **Presenting complaint.** \"Gum/teeth symptoms\" is not a recorded common symptom or warning sign. It is\n  modelled as `(or (clinical_finding \"Tooth finding\") (clinical_finding \"Gingivae finding\"))`; descendants\n  (Toothache, Bleeding gums, Swollen gums, Mobile tooth …) match.\n- **Red box.** `Urgent`, as `(and complaint (or …))`. \"Temperature ≥ 38°C and swelling of face/jaw/next to\n  tooth\" is `(and (>= Body temperature 38 °C) (or Facial swelling, Swelling@Jaw region structure,\n  Swelling@Tooth, gum, and/or supporting structure))`. \"Unable to eat or drink\" is either one.\n  \"Tooth pain felt without touching\" is Toothache + `Spontaneous`; \"wakes patient at night\" is Toothache +\n  `Night time`.\n- **Dental caries likely:** any one of staining, holes/pits, missing teeth (or).\n- **Gum problem likely:** any one of red, bleeding or enlarged gums (or). Diagnosis concept `Gingival disease`.\n- **Dental abscess likely:** the page lists \"previous/current tooth pain with pus in mouth, swelling next to\n  tooth\" as one picture; encoded as an AND of all three.\n- \"May have tooth pain with hot or cold food/drink\" is optional (\"may have\") and is not used as caries\n  evidence.\n- No `measure` task: temperature is a routine vital. No management (paracetamol, antibiotics, mouthwash,\n  referral criteria, mouth-care advice) per scope.\n\n## Could not model\n\n- \"Previous\" tooth pain: a recorded Toothache stands for previous or current; no time comparison on the page.\n- \"Wakes patient at night\": `Night time` qualifier says the pain is at night, not that it wakes the patient.\n- \"Brown/black\" colour and \"at gumline\" for staining are not expressed.\n- Refer-to-dentist criteria for gum problems (no better after 5 days, foul breath, swollen gums, temperature\n  ≥ 38°C, mobile teeth, loss of gum/bone, HIV or diabetes) and same-day referral criteria for abscess\n  (> 65 years, alcohol/drug misuse, HIV, diabetes) are referral/management steps, not encoded.\n\n## SNOMED gaps\n\n- No concept for \"swelling of jaw\" (only `Swelling of lower jaw region`): used `Swelling` + finding_site\n  `Jaw region structure`.\n- No concept for holes/pits in teeth: used `Cavity` (morphologic abnormality) + finding_site `Tooth structure`.\n- No concept for \"pus in mouth\": used `Pus` (morphologic abnormality) + finding_site `Oral cavity structure`.\n- No finding-level \"red gums\": used `Gingival erythema` (disorder).\n- No \"toothache waking from sleep\": used Toothache + `Night time`.\n- No \"gum problem\" concept: used `Gingival disease` (disorder).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Dental abscess: should pus in mouth **or** swelling next to tooth (with tooth pain) be enough, rather than\n  requiring both? The AND fires less often than an OR reading.\n- Is `Gingival disease` the right target for \"gum problem\", or should it be `Gingivitis` / `Periodontal disease`?\n- Should \"missing teeth\" alone make dental caries likely (teeth may be missing for other reasons)? Encoded as\n  the page lists it.\n- Should \"tooth pain with hot or cold food/drink\" (e.g. `Sensitive dentin`) count towards dental caries?\n- (From builder B) For the red box, is swelling next to a tooth (gum/supporting-structure swelling) plus\n  temperature ≥ 38 °C enough for urgent referral, or only facial/jaw swelling? Encoded as the page reads:\n  any of the three.\n\n## Reconciler notes\n\n- Final build is builder A's. Builder B read \"swelling next to tooth\" as `Swollen gums`, \"swelling of face\"\n  as `Swelling` at `Face structure`, \"missing teeth\" as `Tooth loss`, and dental abscess as toothache AND\n  (pus OR swelling). The reconciler kept A's encodings; see `reconcile.json`.\n- The dental abscess AND/OR reading is unsettled (question above).\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent and likely gum/teeth conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Tooth finding\" \"finding\"))", "element_keys": ["p54-d516b4e7"], "quote": "gum/teeth symptoms"}, {"claim_id": "c002", "rule": "Check for urgent and likely gum/teeth conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Gingivae finding\" \"finding\"))", "element_keys": ["p54-d516b4e7"], "quote": "gum/teeth symptoms"}, {"claim_id": "c003", "rule": "Check for urgent and likely gum/teeth conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Facial swelling\" \"finding\"))", "element_keys": ["p54-5176d624"], "quote": "swelling of face"}, {"claim_id": "c004", "rule": "Check for urgent and likely gum/teeth conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"at ure-AND-swelling conjunction, and all three 'likely' boxes become probable diagnoses. The most consequential issue is that the dental abscess rule ANDs toothache, pus and swelling next to tooth, while the page's comma list could equally mean pus OR swelling. AND is the strictest reading and may miss abscesses. Smaller points: 'Dental swelling' (finding) is a closer concept for 'swelling next to tooth'; 'Night time' doesn't encode 'wakes patient'; staining loses brown/black at gumline; and 'Tooth absent' alone yields probable caries."}], "scorecard": {"page": 54, "slug": "54-gum-teeth-symptoms", "validation_ok": true, "builder_agreement": 0.821, "elements": 22, "elements_agreed": 16, "claims": 39, "claims_agreed": 27, "queue": 37, "queue_by_priority": {"low": 10, "high": 1, "medium": 26}, "missing_reports": [], "element_rows": [{"key": "p54-d516b4e7", "id": "p54-rb1-e01", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p54-5176d624", "id": "p54-rb1-e02", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p54-344aa684", "id": "p54-rb1-e03", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p54-643f0c3e", "id": "p54-rb1-e04", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p54-c8879178", "id": "p54-rb1-e05", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p54-9c6fb10b", "id": "p54-rb1-e06", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p54-e67aa779", "id": "p54-out-e01", "box": 0, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p54-f6cf110d", "id": "p54-out-e02", "box": 0, "status": "queue", "scopes": {"out_of_scope": 2, "(no verdict)": 1}, "verdicts": {"(no verdict)": 1}}, {"key": "p54-21ff7229", "id": "p54-out-e03", "box": 0, "status": "agreed", "scopes": {"out_of_scope": 3}, "ver d or bleeding/enlarged gums? • Look in mouth: lift lips to look at teeth and gums:", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "correct", "parts_missing": [], "problem": "Tooth pain, red gums, bleeding gums and enlarged gums all appear in the check_for and each is consumed by a diagnosis rule. The 'not needing urgent attention' framing (probable rules fire even when the red box also fires) is consistent with the house standard, which does not gate probable rules on the priority rule.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "", "confidence": "medium"}, {"checker": "forward-3", "scope": "borderline", "verdict": "correct", "parts_missing": [], "problem": "Toothache, Gingival erythema, Bleeding gums and Gingival enlargement are all in check_for.", "confidence": "medium"}]}, {"page": 54, "slug": "54-gum-teeth-symptoms", "kind": "element", "priority": "low", "ref": "p54-c5bb22f4", "text": "Brown/black staining of teeth at gumline, holes, pits or missing teeth. May have tooth", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Three parts (staining / holes-pits / missing teeth) encoded as an 'or', matching the page's comma-or list. 'Staining of tooth' (disorder) exists and fits; 'Tooth discolored' (finding) is an alternative but no closer. Holes/pits encoded as 'Cavity' (morphologic abnormality) at 'Tooth structure': acceptable (the gold standard also wraps a morphologic abnormality in clinical_finding). 'Tooth absent' fits missing teeth. The page's 'brown/black' and 'at gumline' qualifiers are not expressed, but no SNOMED qualifier would add discriminating value here.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Optional 'may have tooth pain with hot/cold' not encoded, correct as it is a 'may'. 'Holes, pits' as Cavity@Tooth structure; 'missing teeth' as Tooth absent (could include historical extraction, minor).", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'at gumline' location of the brown/black staining (Staining of tooth carries no site)", "'pits' (only Cavity on tooth structure covers 'holes'; pits are arguably folded in)"], "problem": "Staining, holes and missing teeth are OR'd as the page intends. Missing teeth alone, or any tooth staining (not only brown/black at the gumline), gives probable caries. That follows the page literally but is broad.", "confidence": "medium"}]}, {"page": 54, "slug": "54-gum-teeth-symptoms", "kind": "element", "priority": "high", "ref": "p54-2c4393c6", "text": "pain with hot or cold food/drink.", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "missing", "parts_missing": ["tooth pain with hot food/drink", "tooth pain with cold food/drink"], "problem": "Not in the check_for and not used in the caries rule. Low consequence: the page does not make it necessary or sufficient for the caries conclusion.", "confidence": "medium"}, {"checker": "forward-2", "scope": "out_of_scope", "verdict": null, "parts_missing": [], "problem": "Optional 'may have' symptom; not required.", "confidence": "low"}, {"checker": "forward-3", "scope": "borderline", "verdict": "missing", "parts_missing": ["tooth pain provoked by hot/cold food or drink (thermal sensitivity), as supporting caries evidence"], "problem": "Not encoded anywhere. Because the page says 'may have', leaving it out of the AND/OR logic is defensible. It could have been an OR'd supporting finding.", "confidence": "medium"}]}, {"page": 54, "slug": "54-gum-teeth-symptoms", "kind": "element", "priority": "medium", "ref": "p54-50b5e5b0", "text": "Previous/current tooth pain with pus in mouth,", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "partial", "parts_missing": ["previous (historical) tooth pain"], "problem": "Two issues. (1) 'Previous/current tooth pain': only a current 'Toothache' is matched; a patient whose tooth pain has settled but who now has pus/swelling would not satisfy the rule. SNOMED has the qualifier value 'Previous' (and 'In the past'), so (or Toothache (Toothache qualifier Previous)) was expressible and would need its own check_for entry. (2) Logic: the page reads 'tooth pain with pus in mouth, swelling next to tooth'. The rule requires toothache AND pus AND swelling. The comma list is ambiguous; the more clinically natural reading is tooth pain with either sign (an abscess that has not pointed shows swelling without visible pus). Requiring all three makes the rule stricter than the page. 'Pus' (morphologic abnormality) at 'Oral cavity structure' is an acceptable rendering of 'pus in mouth'; no precoordinated concept exists.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'Previous' tooth pain: the rule needs Toothache to be recorded, so a patient whose pain has settled but who has pus and swelling will not get the diagnosis"], "problem": "Pus in mouth is Pus (morphologic abnormality) on Oral cavity structure, which is acceptable. Current toothache is encoded and AND'd.", "confidence": "medium"}]}, {"page": 54, "slug": "54-gum-teeth-symptoms", "kind": "element", "priority": "low", "ref": "p54-e16ade11", "text": "Dental abscess likely • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) for up to 5 days. • Give amoxicillin 500mg 8 hourly for 5 days. If penicillin allergy (history of anaphylaxis, urticaria or angioedema), give instead azithromycin 500mg daily for 3 days. • Also give metronidazole2 40", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "partial", "parts_missing": ["refer urgently if temperature >= 38 °C with dental abscess (only partly covered: the red box needs fever AND swelling)", "refer urgently if symptoms worsen / no better after 2 days (time-based; expressible with onset comparators only loosely)", "refer same day if > 65 years with dental abscess", "refer same day if alcohol/drug misuse with dental abscess", "refer same day if HIV with dental abscess", "refer same day if diabetes with dental abscess"], "problem": "The 'Dental abscess likely' conclusion is correctly encoded as probable 'Dental abscess' (disorder). None of the post-diagnosis escalation criteria are encoded. Age > 65, HIV and diabetes are all expressible (age comparison; 'Known present' qualifier on HIV infection / Diabetes mellitus, or active_condition). Low-to-medium consequence given the brief's management exclusion, but 'refer same day' / 'refer urgently' are priority decisions rather than treatment.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Drug, referral and same-day criteria (>65, HIV, diabetes) are management, out of scope.", "confidence": "high"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "The diagnosis is encoded. 'Refer urgently if worse, temperature >= 38 °C or no better after 2 days' and 'refer same day if > 65, alcohol/drug misuse, HIV, diabetes' are follow-up and referral escalation, so they are treated as management and are not encoded. That is acceptable under the no-manage rule, though arguably a priority escalation.", "confidence": "medium"}]}, {"page": 54, "slug": "54-gum-teeth-symptoms", "kind": "claim", "priority": "medium", "ref": "c005", "text": "Check for urgent and likely gum/teeth conditions :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Tooth, gum, and/or supporting structure\" \"body structure\") <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,

  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
