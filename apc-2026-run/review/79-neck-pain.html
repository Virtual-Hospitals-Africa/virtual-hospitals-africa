difier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Deformity of upper limb\" \"finding\"))\n\n    ;; New sudden onset of weakness of arm: consider stroke or TIA\n    (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n  )\n)\n(task\n  \"Check for causes of arm or hand symptoms\"\n  adult\n  (clinical_finding (snomed_concept \"Finding of upper limb\" \"finding\"))\n  (check_for\n    ;; Joint warm/tender/swollen or unable to do all actions comfortably: joint problem likely\n    (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n    (clinical_finding (snomed_concept \"Tenderness of joint\" \"finding\"))\n    (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n    (clinical_finding (snomed_concept \"Limitation of joint movement\" \"finding\"))\n\n    ;; Painful shoulder: referred pain likely\n    (clinical_finding (snomed_concept \"Pain of shoulder region\" \"finding\"))\n\n    ;; Wrist/hand pain: intermittent, worse at night: carpal tunnel syndrome likely\n    (clinical_finding (snomed_concept \"Pain of wrist region\" \"finding\") (qualifier (snomed_concept \"Intermittent\" \"qualifier value\")) (qualifier (snomed_concept \"Night time\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Hand pain\" \"finding\") (qualifier (snomed_concept \"Intermittent\" \"qualifier value\")) (qualifier (snomed_concept \"Night time\" \"qualifier value\")))\n\n    ;; Elbow pain with or after elbow flexion/extension: tennis or golfer's elbow likely\n    (clinical_finding (snomed_concept \"Pain provoked by movement\" \"finding\") (finding_site (snomed_concept \"Elbow region structure\" \"body structure\")))\n\n    ;; Thumb pain worse with thumb/wrist movement or catching/locking of finger: tenosynovitis likely\n    (clinical_finding (snomed_concept \"Pain in thumb\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain provoked by movement\" \"finding\") (finding_site (snomed_concept \"Thumb structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Pain provoked by movement\" \"finding\") (finding_site (snomed_concept \"Wrist region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Joint catching\" \"finding\") (finding_site (snomed_concept \"Finger structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Locking of joint\" \"finding\") (finding_site (snomed_concept \"Finger structure\" \"body structure\")))\n  )\n)\n\n;; Neck pain: meningitis likely\n(system_diagnosis_rule\n  \"Diagnose probable meningitis from neck pain page\"\n  (diagnosis\n    (snomed_concept \"Meningitis\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Stiff neck\" \"finding\"))\n       (or (>= (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38)\n           (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n           (clinical_finding (snomed_concept \"Drowsy\" \"finding\"))\n           (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n           (clinical_finding (snomed_concept \"Purpuric rash\" \"disorder\"))\n           (clinical_finding (snomed_concept \"Erythematous rash\" \"disorder\"))))\n)\n\n;; Arm or hand symptoms: fracture likely\n(system_diagnosis_rule\n  \"Diagnose probable fracture of upper limb from arm or hand symptoms\"\n  (diagnosis\n    (snomed_concept \"Fracture of upper limb\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Injury of upper extremity\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n       (or (clinical_finding (snomed_concept \"Pain in upper limb\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Swelling of upper limb\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Deformity of upper limb\" \"finding\"))))\n)\n\n;; Arm or hand symptoms: consider stroke or TIA\n(system_diagnosis_rule\n  \"Diagnose possible stroke from sudden arm weakness\"\n  (diagnosis\n    (snomed_concept \"Cerebrovascular accident\" \"disorder\")\n    possible\n  )\n  adult\n  (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n)\n(system_diagnosis_rule\n  \"Diagnose possible TIA from sudden arm weakness\"\n  (diagnosis\n    (snomed_concept \"Transient ischemic attack\" \"disorder\")\n    possible\n  )\n  adult\n  (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n)\n\n;; Arm or hand symptoms: joint problem likely (-> page 77)\n(system_diagnosis_rule\n  \"Diagnose probable joint problem from arm or hand symptoms\"\n  (diagnosis\n    (snomed_concept \"Arthropathy\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Finding of upper limb\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n           (clinical_finding (snomed_concept \"Tenderness of joint\" \"finding\"))\n           (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n           (clinical_finding (snomed_concept \"Limitation of joint movement\" \"finding\"))))\n)\n\n;; Arm or hand symptoms, not urgent: painful shoulder -> referred pain likely\n(system_diagnosis_rule\n  \"Diagnose probable referred pain from painful shoulder\"\n  (diagnosis\n    (snomed_concept \"Referred pain\" \"finding\")\n    probable\n  )\n  adult\n  (clinical_finding (snomed_concept \"Pain of shoulder region\" \"finding\"))\n)\n\n;; Wrist/hand pain -> carpal tunnel syndrome likely\n(system_diagnosis_rule\n  \"Diagnose probable carpal tunnel syndrome from wrist or hand pain\"\n  (diagnosis\n    (snomed_concept \"Carpal tunnel syndrome\" \"disorder\")\n    probable\n  )\n  adult\n  (or (clinical_finding (snomed_concept \"Pain of wrist region\" \"finding\") (qualifier (snomed_concept \"Intermittent\" \"qualifier value\")) (qualifier (snomed_concept \"Night time\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Hand pain\" \"finding\") (qualifier (snomed_concept \"Intermittent\" \"qualifier value\")) (qualifier (snomed_concept \"Night time\" \"qualifier value\"))))\n)\n\n;; Elbow pain with/after flexion/extension -> tennis or golfer's elbow likely\n(system_diagnosis_rule\n  \"Diagnose probable elbow tendinopathy from elbow pain on movement\"\n  (diagnosis\n    (snomed_concept \"Elbow tendinopathy\" \"disorder\")\n    probable\n  )\n  adult\n  (clinical_finding (snomed_concept \"Pain provoked by movement\" \"finding\") (finding_site (snomed_concept \"Elbow region structure\" \"body structure\")))\n)\n\n;; Thumb pain worse with thumb/wrist movement or catching/locking of finger -> tenosynovitis likely\n(system_diagnosis_rule\n  \"Diagnose probable tenosynovitis from thumb pain or finger locking\"\n  (diagnosis\n    (snomed_concept \"Tenosynovitis\" \"disorder\")\n    probable\n  )\n  adult\n  (or (and (clinical_finding (snomed_concept \"Pain in thumb\" \"finding\"))\n           (or (clinical_finding (snomed_concept \"Pain provoked by movement\" \"finding\") (finding_site (snomed_concept \"Thumb structure\" \"body structure\")))\n               (clinical_finding (snomed_concept \"Pain provoked by movement\" \"finding\") (finding_site (snomed_concept \"Wrist region structure\" \"body structure\")))))\n      (clinical_finding (snomed_concept \"Joint catching\" \"finding\") (finding_site (snomed_concept \"Finger structure\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Locking of joint\" \"finding\") (finding_site (snomed_concept \"Finger structure\" \"body structure\"))))\n)\n\n ding (snomed_concept \"Chest pain\" \"finding\")))\n           (active_condition (snomed_concept \"Fracture of upper limb\" \"disorder\"))\n           (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))))\n)\n", "rules": [{"atom": "task", "description": "Check for urgent neck pain conditions", "ages": ["adult"], "raw": "(task \"Check for urgent neck pain conditions\" \"adult\" (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Neck pain\" \"finding\")) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stiff neck\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Drowsy\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Acute confusion\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Purpuric rash\" \"disorder\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Erythematous rash\" \"disorder\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Muscle weakness of limb\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of limbs\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Clumsiness\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stiff limbs\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abnormal gait\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased coordination\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Injury of neck\" \"disorder\") (qualif # Neck pain\n\n```mermaid\nflowchart TD\n    NP[\"Neck pain\"] --> RB2{\"Red box: neck stiffness + any of T ≥ 38°C / headache /<br/>drowsy-confused / purple-red rash (meningitis likely);<br/>neurological symptoms in arms/legs;<br/>recent injury + x-ray unavailable/abnormal or neurological symptoms\"}\n    RB2 -- Any --> URG[\"Urgent; refer urgently\"]\n    RB2 -- None --> Q[\"Any of: >50 years, pain progressive or > 6 weeks, oral steroids, HIV,<br/>diabetes, IV drug use, unexplained weight loss/fever or TB,<br/>neck surgery, previous cancer?\"]\n    Q -- Yes --> XR[\"Cervical spine x-ray; refer to doctor\"]\n    Q -- No --> TX[\"Paracetamol → ibuprofen; physiotherapy; reassess at 5 days / 6 weeks / 3 months\"]\n```\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Neck pain (complaint) | `(clinical_finding Neck pain)` | `Check for urgent neck pain conditions` (trigger) |\n| Meningitis likely | Stiff neck **and** any of temperature ≥ 38 °C, headache, drowsy, acute confusion, purpuric rash, erythematous rash | `Diagnose probable meningitis from neck pain page` |\n| Red box (any item) | Neck pain **and** any of: probable meningitis; any neurological limb symptom; recent neck injury with an abnormal cervical spine x-ray or a neurological symptom | `Urgent: neck pain with meningitis, neurological symptoms or recent injury` |\n| Recent injury + x-ray unavailable/abnormal | Recent neck injury **and** (Plain X-ray of cervical spine abnormal **or** a neurological symptom); \"x-ray unavailable\" is not representable | same priority rule, injury branch |\n| Q (risk factors) → Yes/No | Not modelled: both branches are management (x-ray, referral, analgesia). No diagnosis is named | — |\n\n## Arm or hand symptoms\n\n```mermaid\nflowchart TD\n    AH[\"Arm or hand symptoms\"] --> J{\"Joint warm/tender/swollen or unable to do all actions comfortably?\"}\n    J -- Yes --> JP[\"Joint problem likely → 77\"]\n    AH --> RB1{\"Red box: arm pain + chest pain;<br/>recent injury + severe pain/swelling or deformity (fracture likely);<br/>new sudden-onset arm weakness (consider stroke/TIA)\"}\n    RB1 -- Any --> URG2[\"Urgent\"]\n    RB1 -- None --> APP[\"Approach (not urgent)\"]\n    APP --> SH[\"Painful shoulder\"] --> RP[\"Referred pain likely\"]\n    APP --> WR[\"Wrist/hand pain: intermittent, worse at night, relieved by shaking\"] --> CTS[\"Carpal tunnel syndrome likely\"]\n    APP --> EL[\"Elbow pain with/after flexion/extension\"] --> TE[\"Tennis or golfer's elbow likely\"]\n    APP --> TH[\"Thumb pain worse with thumb/wrist movement, or catching/locking of finger\"] --> TS[\"Tenosynovitis likely\"]\n```\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Arm or hand symptoms (complaint) | `(clinical_finding Finding of upper limb)`; upper-limb pain (hand, wrist, elbow, shoulder, thumb), weakness, numbness and swelling are descendants | `Check for urgent arm or hand conditions`, `Check for causes of arm or hand symptoms` (trigger) |\n| Arm pain with chest pain | Pain in upper limb **and** chest pain | `Urgent: arm or hand symptoms with chest pain, fracture or sudden weakness` |\n| Fracture likely | Recent upper-limb injury **and** (severe arm pain, severe arm swelling or upper-limb deformity) | `Diagnose probable fracture of upper limb from arm or hand symptoms` |\n| Consider stroke or TIA | Sudden-onset muscle weakness of upper limb | `Diagnose possible stroke from sudden arm weakness`, `Diagnose possible TIA from sudden arm weakness` |\n| Red box (any item) | Complaint **and** any of the three above | `Urgent: arm or hand symptoms with chest pain, fracture or sudden weakness` |\n| Joint problem likely | Upper-limb finding **and** any of joint warm, tenderness of joint, joint swelling, or limitation of joint movement | `Diagnose probable joint problem from arm or hand symptoms` |\n| Referred pain likely | Pain of shoulder region | `Diagnose probable referred pain from painful shoulder` |\n| Carpal tunnel syndrome likely | Wrist or hand pain, qualified intermittent **and** night time | `Diagnose probable carpal tunnel syndrome from wrist or hand pain` |\n| Tennis or golfer's elbow likely | Pain provoked by movement at the elbow region | `Diagnose probable elbow tendinopathy from elbow pain on movement` |\n| Tenosynovitis likely | Thumb pain with pain on thumb or wrist movement, or catching or locking of a finger joint | `Diagnose probable tenosynovitis from thumb pain or finger locking` |\n| \"If no better after 6 weeks or worsens, refer\" | Management, not modelled | — |\n", "questions": "# Page 79 – Neck pain (and arm or hand symptoms): remaining questions\n\nFinal build, reconciled from builders A and B (base A). Every difference and the reason for\nchoosing it is listed in `reconcile.json`.\n\n## Decisions made\n\n- **Two complaints, one page.** The page has a NECK PAIN section and an ARM OR HAND SYMPTOMS\n  section, each with its own red box. Each section gets its own `check_for` task and `Urgent`\n  priority rule. The arm section also gets a second task, `Check for causes of arm or hand\n  symptoms`, for the non-urgent \"X likely\" columns.\n- **Arm or hand complaint trigger** → `Finding of upper limb` (finding). The page names no specific\n  symptom. Hand, wrist, elbow, shoulder and thumb pain, and weakness, numbness and swelling of the\n  upper limb, are all descendants (checked with `is_a`). Neither neck pain nor \"arm or hand\n  symptoms\" is a recorded common symptom or warning sign, so both complaints fire only when\n  recorded as a finding.\n- **Meningitis likely** → `probable` Meningitis: Stiff neck **and** any of temperature ≥ 38 °C,\n  headache, drowsy, acute confusion, purpuric rash or erythematous rash. The priority rule uses\n  `(active_condition Meningitis)`. Neck pain is required only in the priority rule, because the\n  page's meningitis criterion is \"neck stiffness and any of\".\n- **\"confused\"** → `Acute confusion` (`Confusion` (finding) does not exist).\n- **\"Purple/red rash\"** → purpuric rash **or** erythematous rash, a literal reading.\n- **Neurological symptoms in arms/legs** → Muscle weakness of limb, Numbness of limbs, Clumsiness,\n  Stiff limbs, Abnormal gait, Decreased coordination.\n- **\"Recent injury and x-ray unavailable/abnormal or neurological symptoms\"** is read as a recent\n  neck injury **and** (abnormal cervical spine x-ray **or** neurological symptoms). The abnormal\n  x-ray is `Plain X-ray of cervical spine abnormal`. \"Recent\" is the `Recent` qualifier, because\n  the page gives no time window.\n- **Fracture likely** → `probable` Fracture of upper limb: recent upper-limb injury **and**\n  (severe arm pain **or** severe arm swelling **or** upper-limb deformity). \"Severe\" is read as\n  applying to both pain and swelling.\n- **Consider stroke or TIA** → two `possible` rules (Cerebrovascular accident, Transient ischemic\n  attack) on sudden-onset muscle weakness of upper limb. \"With/without difficulty speaking or\n  visual disturbance\" doesn't discriminate, so those findings aren't checked. \"New\" isn't added as\n  a second qualifier.\n- **Joint problem likely (→ 77)** → `probable` Arthropathy: upper-limb finding **and** any of joint\n  warm, tenderness of joint, joint swelling, limitation of joint movement.\n- **Referred pain likely** → `probable` Referred pain (a finding) from Pain of shoulder region, as\n  the page links \"Painful shoulder\" straight to \"Referred pain likely\".\n- **Carpal tunnel syndrome likely** → wrist or hand pain qualified `Intermittent` and `Night time`\n  (\"worse at night\" describes that pain).\n- **Tennis or golfer's elbow likely** → one `probable` rule for Elbow tendinopathy, the common\n  parent of lateral and medial epicondylitis, from pain provoked by movement at the elbow region.\n- **Tenosynovitis likely** → (thumb pain **and** pain on thumb or wrist movement) **or** catching\n  of a finger joint **or** locking of a finger joint.\n- **Neck-pain approach (risk factors → Yes/No)** isn't encoded. Both branches are management\n  (x-ray, referral, analgesia, physiotherapy) and name no diagnosis.\n- Temperature is a routine vital, so there is no `measure` task. Shock / BP < 90/60 don't appear\n  on this page.\n\n## Could not model\n\n- **\"x-ray unavailable\"** (neck red box, item 3). Only \"x-ray abnormal\" and \"neurological symptoms\"\n  are encoded. A recent neck injury with **no x-ray available** and no neurological symptoms isn't\n  flagged Urgent, so the rule fires **less often** than the page intends. A `(no (procedure …))`\n  proxy was rejected as an invented proxy.\n- **\"relieved by shaking\"** (carpal tunnel): there is no qualifier for it, and `Relieved by` exists\n  only as an attribute. The rule fires **more often** than the page intends.\n- **\"unable to do all actions comfortably\"** and the movement tests (hands behind head and back,\n  fist, palms together) are approximated by Limitation of joint movement. Discomfort without\n  limitation is missed (**less often**).\n- **\"May be numbness/tingling in 1st, 2nd and 3rd fingers or weakness of hand\"** and **\"May have\n  decreased grip strength\"** are optional (\"may\"), so they aren't used as evidence.\n- **Risk-factor question** (>50 years, pain > 6 weeks, steroids, HIV, diabetes, IV drug use,\n  weight loss/fever/TB, neck surgery, previous cancer): management routing only, so it isn't\n  modelled.\n- Management (ceftriaxone, collar/immobilisation, analgesia, splints, physiotherapy, referral) is\n  out of scope.\n\n## SNOMED gaps\n\n- No \"arm/hand symptom\" concept → used `Finding of upper limb`.\n- `Confusion` (finding) → used `Acute confusion`.\n- `Injury of upper limb` → used `Injury of upper extremity`.\n- `Disorder of joint` → used `Arthropathy`.\n- `Shoulder pain`, `Wrist pain` → used `Pain of shoulder region`, `Pain of wrist region`.\n  `Thumb pain` → used `Pain in thumb`.\n- No \"Nocturnal\"/\"At night\" qualifier → used `Night time` (qualifier value).\n- No \"worse with movement\" qualifier → used `Pain provoked by movement` with `finding_site`\n  (Elbow region structure, Thumb structure, Wrist region structure; all checked to exist).\n- No \"locking of finger\" / \"trigger finger\" concept → used `Locking of joint` and `Joint catching`\n  with `finding_site` Finger structure.\n- `Epicondylitis`, `Medial epicondylitis` → used `Elbow tendinopathy` (parent of both).\n- No concept for \"x-ray unavailable\" or \"relieved by shaking\".\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should a recent neck injury with **no x-ray available** count as urgent on its own? At most\n  primary-care clinics that's the usual situation, and the current rule misses it.\n- Is \"purple/red rash\" meant as any red rash, or only a non-blanching (purpuric/petechial) rash?\n  Including red rash makes the meningitis rule much broader.\n- Painful shoulder alone gives `probable` Referred pain. Is that the intended strength, or should\n  it be `possible`?\n- Is \"severe pain/swelling\" meant as severe pain or severe swelling (as encoded), or severe pain\n  or any swelling?\n- Is \"Thumb pain: worse with thumb/wrist movement or catching/locking of finger\" correctly read as\n  (thumb pain worse with movement) OR (catching/locking of a finger)?\n- Is \"arm or hand symptoms\" meant as any upper-limb finding (as encoded), or a narrower set?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent neck pain conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Neck pain\" \"finding\"))", "element_keys": ["p79-d3e29d0c"], "quote": "neck pain"}, {"claim_id": "c002", "rule": "Check for urgent neck pain conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stiff neck\" \"finding\"))", "element_keys": ["p79-56738f8a"], "quote": "Neck stiffness"}, {"claim_id": "c003", "rule": "Check for urgent neck pain async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }

}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }

})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;

    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);

}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {

}

  const l = checkerLabel(name);

}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);

  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}

}
function treeHtml(n, rule) {

}
function renderRules() {

  $("#rules").innerHTML = R.map(r => {

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }

  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));

function elHtml(e) {

    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :

// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes

function rulesNamed(ref) {

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
