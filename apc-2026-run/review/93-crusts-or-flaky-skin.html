(triage lives on page 82).\n(task\n  \"Check for causes of crusts or flaky skin\"\n  adult\n  (or (clinical_finding (snomed_concept \"Crust on skin\" \"finding\"))\n      (clinical_finding (snomed_concept \"Scaly skin\" \"finding\")))\n  (check_for\n    ;; Crusts: impetigo\n    (clinical_finding (snomed_concept \"Crust on skin\" \"finding\") (qualifier (snomed_concept \"Yellow color\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Blister of skin\" \"disorder\"))\n\n    ;; Flaky skin: seborrhoeic dermatitis\n    (clinical_finding (snomed_concept \"Erythema\" \"finding\"))\n    (clinical_finding (snomed_concept \"Greasy skin\" \"finding\"))\n\n    ;; Flaky skin: psoriasis\n    (clinical_finding (snomed_concept \"Skin plaque\" \"disorder\") (qualifier (snomed_concept \"Well defined\" \"qualifier value\")) (qualifier (snomed_concept \"Raised\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Silver color\" \"qualifier value\")))\n\n    ;; Flaky skin: eczema\n    (clinical_finding (snomed_concept \"Xeroderma\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Itching of skin\" \"finding\"))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of wrist region\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of ankle\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of antecubital fossa\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of popliteal fossa\" \"body structure\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable impetigo (crusts or flaky skin)\"\n  (diagnosis\n    (snomed_concept \"Impetigo\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Crusts branch: \"Blisters which dry to form yellow crusts\"\n  (and (clinical_finding (snomed_concept \"Blister of skin\" \"disorder\"))\n       (clinical_finding (snomed_concept \"Crust on skin\" \"finding\") (qualifier (snomed_concept \"Yellow color\" \"qualifier value\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable seborrhoeic dermatitis (crusts or flaky skin)\"\n  (diagnosis\n    (snomed_concept \"Seborrheic dermatitis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Flaky skin branch: \"Red/pink scaly patches with fine, greasy scales\"\n  (and (clinical_finding (snomed_concept \"Scaly skin\" \"finding\"))\n       (clinical_finding (snomed_concept \"Erythema\" \"finding\"))\n       (clinical_finding (snomed_concept \"Greasy skin\" \"finding\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable psoriasis (crusts or flaky skin)\"\n  (diagnosis\n    (snomed_concept \"Psoriasis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Flaky skin branch: \"Well-defined, raised plaques covered with silvery scale\"\n  (and (clinical_finding (snomed_concept \"Skin plaque\" \"disorder\") (qualifier (snomed_concept \"Well defined\" \"qualifier value\")) (qualifier (snomed_concept \"Raised\" \"qualifier value\")))\n       (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Silver color\" \"qualifier value\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable eczema (crusts or flaky skin)\"\n  (diagnosis\n    (snomed_concept \"Eczema\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Flaky skin branch: \"Patches of dry, scaly, itchy skin on wrists, ankles, inside elbows or behind knees\"\n  (and (or (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of wrist region\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of ankle\" \"body structure\")))\n           (clinical_finding (snomed sis (snomed_concept \"Eczema\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Impetigo\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Psoriasis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Seborrheic dermatitis\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 93 – Crusts or flaky skin: flowchart\n\nSource: APC 2026 e-book page 93. The red box is a pointer only (\"Check if the patient\nneeds urgent attention ↻ 82\"); the triage is on page 82. The rest of the page is a descriptive\nalgorithm leading to four \"likely\" diagnoses.\n\n```mermaid\nflowchart TD\n    RB[\"Red box: Check if the patient needs urgent attention ↻ 82\"]\n    RB --> Q[\"Are there crusts or flaky skin?\"]\n    Q -- Crusts --> C1[\"Blisters which dry to form yellow crusts often around mouth or nose.<br/>May complicate insect bites, scabies or skin trauma\"]\n    C1 --> IMP[\"Impetigo likely\"]\n    Q -- \"Flaky skin\" --> F1[\"Red/pink scaly patches with fine, greasy scales.<br/>Usually on scalp, between eyebrows, in nose folds,<br/>behind ears, in axillae, groin, under breasts\"]\n    Q -- \"Flaky skin\" --> F2[\"Well-defined, raised plaques covered with silvery scale.<br/>Often on knees, elbows, lower back, scalp. May have pitted nails\"]\n    Q -- \"Flaky skin\" --> F3[\"Patches of dry, scaly, itchy skin on wrists, ankles,<br/>inside elbows or behind knees\"]\n    F1 --> SD[\"Seborrhoeic dermatitis likely\"]\n    F2 --> PS[\"Psoriasis likely\"]\n    F3 --> EC[\"Eczema likely ↻ 84\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Red box (pointer to 82) | Not modelled here; cross-reference only | — |\n| Are there crusts or flaky skin? | `Crust on skin` or `Scaly skin` recorded | `Check for causes of crusts or flaky skin` (trigger) |\n| Crusts → blisters drying to yellow crusts | Blister of skin **and** crust on skin (yellow colour) | `Diagnose probable impetigo (crusts or flaky skin)` |\n| Flaky → red/pink scaly patches with greasy scales | Scaly skin **and** erythema **and** greasy skin | `Diagnose probable seborrhoeic dermatitis (crusts or flaky skin)` |\n| Flaky → well-defined raised plaques with silvery scale | Skin plaque (well defined, raised) **and** scaly skin (silver colour) | `Diagnose probable psoriasis (crusts or flaky skin)` |\n| Flaky → dry, scaly, itchy patches on wrists/ankles/inside elbows/behind knees | Scaly skin at one of the four sites **and** xeroderma **and** itching of skin | `Diagnose probable eczema (crusts or flaky skin)` |\n\n## Notes\n\n- Locations introduced by \"often\" / \"usually\" (mouth or nose; scalp, eyebrows, nose folds, ears,\n  axillae, groin, under breasts; knees, elbows, lower back, scalp) and \"may\" features (insect\n  bites, scabies, skin trauma; pitted nails) are descriptive, not required; they are not criteria.\n- The eczema sites are stated without a hedge (\"on wrists, ankles, inside elbows or behind knees\"),\n  so they are required.\n", "questions": "# Page 93 – Crusts or flaky skin: remaining questions\n\n## Decisions made\n\n- **Red box is a pointer only** (\"Check if the patient needs urgent attention ↻ 82\"). No priority\n  evaluation on this page; the element is accounted for as `cross_reference_only`.\n- **Trigger:** `Crust on skin` (finding) or `Scaly skin` (finding). Neither is a recorded common\n  symptom or warning sign, so the check task fires only when one of them is recorded.\n- **Four probable diagnoses** from the four \"X likely\" boxes: impetigo, seborrhoeic dermatitis,\n  psoriasis, eczema. Management text under each (including the Eczema \"Manage ↻ 84\" pointer and\n  all medicines, HIV tests, urine dipstick, referral criteria) is not encoded.\n- **Hedged descriptors are not criteria.** \"often around mouth or nose\", \"May complicate insect\n  bites, scabies or skin trauma\", \"Usually on scalp, between eyebrows, …\", \"Often on knees, elbows,\n  lower back, scalp\" and \"May have pitted nails\" describe typical presentations; requiring them\n  would make the rules fire less often than the page intends, and making them alternatives would\n  add logic the page doesn't state.\n- **Eczema sites are required**, because the page states them without a hedge (\"on wrists,\n  ankles, inside elbows or behind knees\"). The site is placed on the scaly finding.\n- **Impetigo requires both blisters and yellow crusts** (\"Blisters which dry to form yellow\n  crusts\"; reconciler chose builder B's literal reading). This fires less often than a\n  crusts-only reading if the blister stage was not seen.\n- **Eczema sites** use the skin structures (`Skin structure of wrist region`, `… of ankle`,\n  `… of antecubital fossa`, `… of popliteal fossa`), since the page puts the scaly patches on the\n  skin there; builder B used the region structures.\n- \"Fine\" (seborrhoeic scale) is not encoded separately.\n- The \"Crusts\" vs \"Flaky skin\" split is implicit: impetigo is not tied to the absence of scaly skin.\n\n## Could not model\n\n- \"Greasy scales\": no concept; `Greasy skin` (finding) used as the nearest.\n- \"Patches\" as a morphology: no `Patch` morphologic abnormality concept; not encoded.\n- The descriptive photographs carry no rule content.\n\n## SNOMED gaps\n\n- `Dry skin` (finding): does not exist → `Xeroderma` (disorder).\n- `Skin structure of wrist` (body structure): does not exist → `Skin structure of wrist region`.\n- `Greasy` / `Silvery` (qualifier value): do not exist → `Greasy skin` (finding); `Silver color`\n  (qualifier value).\n- No concept for \"flaky skin\" → `Scaly skin` (finding).\n- \"Yellow crust\": no precoordinated concept → `Crust on skin` + `Yellow color` qualifier.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Impetigo: should yellow crusts alone (without a recorded blister, e.g. once blisters have dried) be enough for \"Impetigo likely\"? The final build requires both.\n- Eczema: should the listed sites be required (as encoded), or are they typical only, like the\n  other columns?\n- Seborrhoeic dermatitis vs psoriasis: both are red scaly lesions; is erythema + greasy-looking\n  skin + scale a fair discriminator from silvery-scaled raised plaques?\n- Should psoriasis also be \"likely\" from pitted nails with scaly skin, without a recorded plaque?\n", "claims": [{"claim_id": "c001", "rule": "Check for causes of crusts or flaky skin", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Crust on skin\" \"finding\"))", "element_keys": ["p93-9e3a65c4"], "quote": "CRUSTS"}, {"claim_id": "c002", "rule": "Check for causes of crusts or flaky skin", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Scaly skin\" \"finding\"))", "element_keys": ["p93-9e3a65c4"], "quote": "FLAKY SKIN"}, {"claim_id": "c003", "rule": "Check for causes of crusts or flaky skin", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Crust on skin\" \"finding\") (qualifier (snomed_concept \"Yellow color\" \"qualifier value\")))", "element_keys": ["p93-19439102"], "quote": "yellow crusts"}, {"claim_id": "c004", "rule": "Check for causes of crusts or flaky skin", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Blister of skin\" \"disorder\"))", "element_keys": ["p93-19439102"], "quote": "Blisters"}, {"claim_id": "c005", "rule": "Check for causes of crusts or flaky skin", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Erythema\" \"finding\"))", "element_keys": ["p93-74fa3ad8"], "quote": "Red/pink"}, {"claim_id": "c006", "rule": "Check for causes of crusts or flaky skin", "role": "check_for", g' (disorder) exist; a supporting finding the briefing says belongs in the check_for)", "often on knees, elbows, lower back, scalp (Skin structure of knee / elbow / lower back / scalp exist)"], "problem": "Silvery scale is correctly encoded as Scaly skin + Silver color and is required by the rule. Sites and nail pitting are absent. Sites are hedged with 'often' so their omission is defensible; pitted nails is a distinct discriminating finding and should at least be checked for (and could be an 'or' alternative).", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["pitted nails ('may have')", "distribution: knees, elbows, lower back, scalp (often)"], "problem": "Silver scale is encoded. 'May have pitted nails' is optional. A concept 'Pitting of nails' (disorder) exists, so it could be a check_for item feeding a rule. It could not be required in the probable rule, so omitting it is defensible.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["Typical sites (knees, elbows, lower back, scalp) not encoded; 'often', so optional", "'May have pitted nails' not encoded (SNOMED has 'Pitting of nails' disorder); 'may', so optional"], "problem": "The core criterion, silvery scale, is correctly ANDed with the plaque. It is a separate finding rather than scale on the plaque, which is acceptable in this language.", "confidence": "high"}]}, {"page": 93, "slug": "93-crusts-or-flaky-skin", "kind": "element", "priority": "low", "ref": "p93-cbcabda8", "text": "wrists, ankles, inside elbows or", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Wrist region, ankle and antecubital fossa; 'inside elbows' = antecubital fossa is a correct reading (Skin structure of elbow flexion crease would be equivalent). The four sites are correctly joined by 'or'.", "confidence": "high"}, {"checker": "forward-2", "scope": <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;

  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);

}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {

}
function verdictChip(name, v, suffix = "") {

  const l = checkerLabel(name);

}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}

}
function treeHtml(n, rule) {

function renderRules() {

function renderSource() {

      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;

// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {

  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
