nding\" \"finding\") (snomed_concept \"Hearing difficulty\" \"finding\") (snomed_concept \"No\" \"qualifier value\")))", "B": "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased hearing\" \"finding\") (snomed_concept \"No\" \"qualifier value\")))", "relation": "A_narrower"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hearing difficulty\" \"finding\"))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased hearing\" \"finding\"))", "relation": "A_narrower"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hearing difficulty\" \"finding\"))", "B": "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased hearing\" \"finding\") (snomed_concept \"No\" \"qualifier value\")))", "relation": "A_narrower"}], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Anaphylaxis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Non-allergic hypersensitivity reaction\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 14 – Observation post vaccination: flowchart\n\nSource: APC 2026 e-book page 14. The only red box is the pointer\n\"Treat as anaphylaxis → 28\"; the decision logic that leads to it sits outside the red box.\n\n```mermaid\nflowchart TD\n    START[\"Observe patient ≥ 15 min after vaccination<br/>(30 min if known severe allergies).<br/>Check for signs or symptoms of an adverse reaction\"]\n    START --> COL[\"Collapse → 15\"]\n    START --> FAINT[\"Feeling faint/unwell symptoms:<br/>light-headedness or dizziness, feeling warm or cold, sweating,<br/>palpitations, visual 'blurring', reduced hearing, pallor reported by onlookers\"]\n    START --> SKIN[\"Skin/mucosal: itchiness, skin rash (hives),<br/>swelling of eyes, lips, tongue, face or hands/feet, nasal congestion\"]\n    START --> RESP[\"Respiratory: wheeze or cough, throat tightness, stridor,<br/>shortness of breath, hoarseness, sats &lt; 92%, trouble swallowing, drooling\"]\n    START --> GI[\"Gastrointestinal: nausea, vomiting, diarrhoea, cramps\"]\n    FAINT --> FMG[\"Lean forward / lie flat, loosen clothing,<br/>cool cloth, reassure (management)\"]\n    FMG --> IMP{\"Do symptom/s improve quickly (minutes)?\"}\n    IMP -- Yes --> OBS[\"Observe until symptoms resolve\"]\n    IMP -- No --> D1\n    SKIN --> D1\n    RESP --> D1\n    GI --> D1\n    D1{\"Decide when to treat for anaphylaxis:<br/>Are 2 or more body systems involved?\"}\n    D1 -- Yes --> TREAT[\"Treat as anaphylaxis → 28 (red box)\"]\n    D1 -- No --> D2{\"Generalised urticaria (raised red rash/hives)<br/>involving the whole body?\"}\n    D2 -- Yes --> TREAT\n    D2 -- No --> D3{\"Serious or life-threatening, even if single system?<br/>(hypotension, respiratory distress,<br/>significant swelling of tongue or lips)\"}\n    D3 -- Yes --> TREAT\n    D3 -- No --> ISO[\"Isolated rash, otherwise well: monitor ≥ 30 min.<br/>No other symptoms and remains well → pseudoallergic self-limiting rash likely.<br/>Other symptoms → discuss with doctor urgently.<br/>In doubt → treat as anaphylaxis → 28\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| START (check for adverse reaction) | `Vaccination given` (situation) triggers a `check_for` of every listed sign and symptom, plus \"Generally unwell\" for \"otherwise well\" | `Check for adverse reaction after vaccination` |\n| Collapse → 15 | Cross-reference only; page 15 handles collapse | not encoded |\n| IMP (improve quickly?) | **Not modelled**: the language cannot express \"improved within minutes\". Faint/unwell symptoms count as a body system in D1 whether or not they improved | — |\n| D1 = Yes | `any2` of the four groups (faint/unwell, skin/mucosal, respiratory, GI), each group an `or` so it counts once | `Diagnose probable anaphylaxis after vaccination`, `any2` branch |\n| D2 = Yes | `Urticaria` with qualifier `Generalized` | same rule, second branch |\n| D3 = Yes | `Low blood pressure`, `Respiratory distress`, `Swelling` of tongue or lip with `Severe (severity modifier)` | same rule, remaining branches |\n| TREAT | `probable` Anaphylaxis; urgency and treatment are on page 28 (pointer-only red box) | no priority evaluation on this page |\n| ISO | Vaccination given, urticaria, and recorded absence (`no`) of every other checked sign including generalised urticaria and \"generally unwell\" | `Diagnose probable pseudoallergic rash after vaccination` |\n| \"If in doubt, treat as anaphylaxis\" | Not representable (clinical judgment) | — |\n", "questions": "# Page 14 – Observation post vaccination: remaining questions\n\n## Decisions made\n\n- **Pointer-only red box, but the page has its own logic.** The red box is only \"Treat as\n  anaphylaxis → 28\" (accounted as `cross_reference_only`). The algorithm that leads to it sits\n  outside the box, so it is encoded: a `check_for` task, a probable anaphylaxis rule and a probable\n  pseudoallergic-rash rule. **No priority evaluation** is written here: urgency and treatment of\n  anaphylaxis belong to page 28, which the red box points to. `(diagnosis Anaphylaxis probable)` from\n  this page should feed page 28's anaphylaxis rules.\n- **Trigger.** \"Post vaccination\" is not a recorded common symptom or warning sign. The task fires on\n  `(clinical_finding (snomed_concept \"Vaccination given\" \"situation\"))`. Alternative: the procedure\n  `Administration of vaccine to produce active immunity`, if VHA records vaccinations as procedures.\n- **\"Treat as anaphylaxis\" → `probable` Anaphylaxis** (rule \"Diagnose probable anaphylaxis after\n  vaccination\"), with the page's three Yes branches: (1) `any2` of the four body-system groups, each an\n  `or` so it counts once; (2) generalised urticaria (Urticaria + `Generalized`); (3) serious single-system\n  signs: hypotension (`Low blood pressure`), respiratory distress, significant (`Severe`) swelling of\n  tongue or lips. Oxygen sats < 92% is in the respiratory group, strict `<` as written.\n- **Hypotension has no threshold on this page**, so no BP number is imported (not \"BP < 90/60\", not\n  the shock definition).\n- **\"Pseudoallergic self-limiting rash likely\" → `probable` Non-allergic hypersensitivity reaction**\n  (rule \"Diagnose probable pseudoallergic rash after vaccination\"): vaccination given, urticaria\n  (\"raised, red rash\"), and recorded absence (`no`) of every other sign the page checks, including\n  generalised urticaria and \"Generally unwell\" (for \"otherwise well / remains well\").\n- **Faint/unwell group** holds exactly the page's bullets; the header \"Feeling faint/unwell symptoms\"\n  names the group and is not encoded as a symptom of its own (reconciler: builder A had added\n  `Feeling faint`). \"Feeling warm or cold\" is split into `Sensation of being warm` and\n  `Sensation of being cold`. \"Reduced hearing\" is `Decreased hearing`; GI \"Cramps\" is `Abdominal colic`.\n- **Collapse → 15** is a cross-reference to page 15 and is not encoded here.\n\n## Could not model\n\n- **\"Do symptom/s improve quickly (minutes)?\"** The language cannot express the course of a symptom.\n  Faint/unwell symptoms count as a body system in the `any2` whether or not they improved, so the\n  anaphylaxis rule **fires more often** than the page intends (e.g. a vasovagal reaction plus nausea).\n- **\"Observe for at least 15 minutes / 30 minutes if known severe allergies\"** and \"monitor for at\n  least 30 minutes\" before calling the rash pseudoallergic: no duration of observation can be\n  expressed. The pseudoallergic rule can fire before 30 minutes of monitoring, so it **fires earlier\n  (more often)** than the page intends.\n- **\"If in doubt, treat as anaphylaxis\"**: clinical judgment, not representable.\n- Oxygen sats < 92% is not in the `no` list of the pseudoallergic rule: a measurement cannot be\n  wrapped in `no`, and writing sats ≥ 92 would add a criterion the page does not state.\n- Management (lean forward / lie flat, loosen clothing, cool cloth, reassure, oral antihistamines,\n  safety-net advice, discuss with doctor, AEFI reporting) is out of scope.\n\n## SNOMED gaps\n\n- \"Pseudoallergic self-limiting rash\": no concept. Used `Non-allergic hypersensitivity reaction`\n  (disorder), whose synonym is \"pseudoallergic reaction\"; broader than a rash.\n- \"Hypotension\" (disorder) does not exist; FSN is `Low blood pressure` (disorder).\n- \"Pallor\" (finding) does not exist; used `Pale complexion` (finding).\n- \"Abdominal cramps\" (finding) does not exist; used `Abdominal colic` (finding), which is_a\n  Abdominal pain (`Stomach cramps` exists but sits only under `Cramp`).\n- \"Feeling warm\"/\"Feeling cold\" do not exist; used `Sensation of being warm` / `Sensation of being cold`.\n- \"Reduced hearing\": used `Decreased hearing` (the vocabulary's `Hearing difficulty` is a narrower child).\n- \"Generalised urticaria\" has no precoordinated concept; used `Urticaria` + qualifier `Generalized`.\n- All finding_site body structures resolve (`Eye region structure`, `Lip structure`,\n  `Tongue structure`, `Face structure`, `Hand structure`, `Foot structure`); \"Eye structure\" does not.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\nAll nine are `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR` on \"Diagnose probable pseudoallergic rash\nafter vaccination\". Each is the `(no …)` f ng, difficulty breathing, abdominal pain, nausea, vomiting) and 'discuss with doctor' are management; 'if in doubt treat as anaphylaxis' is a note.", "evidence": ["Diagnose probable pseudoallergic rash after vaccination :: (diagnosis (snomed_concept \"Non-allergic hypersensitivity reaction\" \"disorder\") probable)", "Diagnose probable pseudoallergic rash after vaccination :: (no (clinical_finding (snomed_concept \"Itching\" \"finding\")))"], "confidence": "medium"}, {"element_key": "p14-524e0c15", "scope": "out_of_scope", "scope_reason": "management_step", "verdict": null, "parts_missing": [], "problem": "Reporting of adverse events (Med Safety app, CRF, AEFI email) is administrative.", "evidence": [], "confidence": "high"}], "outside_not_logic": ["p14-0144d1dd", "p14-bed33a65", "p14-316775ec", "p14-2cbee79c", "p14-0b6b7ca8", "p14-a3778715", "p14-84495d00", "p14-2d221de7", "p14-40185850", "p14-16063b6a"], "rule_level_problems": [{"rule": "(whole file)", "problem": "No system_priority_evaluation. The red box 'Treat as anaphylaxis' is the page's escalation, and the house standard turns the red box into a priority rule (gold: 'Urgent: Anaphylaxis' on (active_condition Anaphylaxis)). This file diagnoses probable anaphylaxis but never raises priority; it relies on the anaphylaxis page's rule, which may or may not be present in this ruleset.", "severity": "medium"}, {"rule": "Diagnose probable pseudoallergic rash after vaccination", "problem": "The page reaches 'pseudoallergic self-limiting rash likely' only after monitoring for at least 30 minutes with no other symptoms. The rule has no time condition, so it fires as soon as an isolated rash and the absences are recorded. (>= (onset (clinical_finding (snomed_concept \"Urticaria\" \"disorder\"))) (time_ago 30 minutes)) would encode the window.", "severity": "medium"}, {"rule": "Diagnose probable pseudoallergic rash after vaccination", "problem": "(no Itching) excludes the common case of an itchy isolated urticarial rash. thful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "'Patient remains well' / 'no other associated symptoms' are after monitoring for at least 30 minutes; the 30-minute observation window is dropped.", "fix": "Add the >=30 minute observation condition if the grammar allows, or note it.", "confidence": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "claim", "priority": "low", "ref": "c113", "text": "Diagnose probable pseudoallergic rash after vaccination :: (diagnosis (snomed_concept \"Non-allergic hypersensitivity reaction\" \"disorder\") probable)", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "the page's 'pseudoallergic self-limiting rash' has an exact precoordinated concept: (snomed_concept \"Acute urticaria due to pseudoallergy\" \"disorder\") (confirmed with exists; is_a Urticaria = YES). 'Non-allergic hypersensitivity reaction' is the broad parent process and drops the rash. 'likely' -> probable is correct.", "fix": "(diagnosis (snomed_concept \"Acute urticaria due to pseudoallergy\" \"disorder\") probable)", "confidence": "high"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "(whole file)", "text": "No system_priority_evaluation. The red box 'Treat as anaphylaxis' is the page's escalation, and the house standard turns the red box into a priority rule (gold: 'Urgent: Anaphylaxis' on (active_condition Anaphylaxis)). This file diagnoses probable anaphylaxis but never raises priority; it relies on the anaphylaxis page's rule, which may or may not be present in this ruleset.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pseudoallergic rash after vaccination", "text": "The page reaches 'pseudoallergic self-limiting rash likely' only after monitoring for at least 30 minutes with no other symptoms. The rule has no time condition, so it fires as soon as an isolated rash and the absences are recorded. (>= (onset (clinical_finding (snomed_concept \"Urticaria\" \"disorder\"))) (time_ago 30 minutes)) would encode the window.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pseudoallergic rash after vaccination", "text": "(no Itching) excludes the common case of an itchy isolated urticarial rash. Such a patient fails this rule and, being single-system and not generalised or severe, also fails the anaphylaxis rule, so they end with no diagnosis. The page's 'without other symptoms' reads as other body systems; itch belongs to the same skin/mucosal group as the rash. Consider dropping the Itching and Nasal congestion exclusions, keeping the swelling ones (which the page names as return triggers).", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis after vaccination", "text": "The 'Do symptom/s improve quickly (minutes)?' gate is lost: faint/unwell findings count as a body system in any2 even when they resolve in minutes, so dizziness + nausea from a vasovagal episode yields probable anaphylaxis. Not fully representable; at minimum the remaining-questions record should carry it.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis after vaccination", "text": "Hypotension is encoded as the recorded finding (clinical_finding Low blood pressure) rather than the routine BP measurement. The gold anaphylaxis page uses (< (measurement Systolic blood pressure mmHg) 90) / (< diastolic 60), which fires from vitals without a separate recording. The page gives no numeric threshold, so the finding form is defensible, but the two pages will disagree on what counts as hypotension.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Check for adverse reaction after vaccination", "text": "Swelling is encoded as Swelling + finding_site although SNOMED has precoordinated Lip swelling, Tongue swelling, Facial swelling, Swelling of hand and Swelling of eyelid (all finding). The finding_site form matches the gold anaphylaxis page, so this is consistent and should stay unless the whole ruleset changes; noted only so the choice is on record.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis after vaccination", "text": "Resp group includes SpO2<92 but check_for list lacks it; check list and rule disagree.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis after vaccination", "text": "Four groups in any2 include the faint group, and plain tongue/lip swelling (skin group) plus one other group triggers; 'improves quickly' gate absent so transient vasovagal symptoms plus a mild skin symptom yield probable anaphylaxis.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pseudoallergic rash after vaccination", "text": "Exclusion list omits SpO2<92 and Collapse; 30-minute monitoring not represented; 'Generally unwell' added without direct page text.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "task Check for adverse reaction after vaccination", "text": "No priority evaluation for the red box 'Treat as anaphylaxis' beyond the diagnosis; Collapse missing from check_for.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Check list", "text": "'Low blood pressure' disorder and 'Abdominal colic' are imprecise concepts for hypotension and cramps.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis after vaccination", "text": "Faint/unwell group enters the any2 count unconditionally; the page sends it to anaphylaxis assessment only when symptoms do not improve within minutes. Transient vasovagal symptoms + nausea (or sweating + itching) will produce probable anaphylaxis and, via page 20's priority rule, Urgent.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pseudoallergic rash after vaccination", "text": "Negates Itching although itch belongs to the same (skin) system as the hives; isolated itchy urticaria falls through both rules with no diagnosis. Also lacks the 30-minute observation condition before 'likely'.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Check for adverse reaction after vaccination", "text": "Anchored to (clinical_finding Vaccination given), which is not a common symptom or warning sign; the whole page only fires if that situation is recorded. 'Generally unwell' is checked for but only used as a negation in the pseudoallergic rule (allowed, but the page's 'feeling unwell' heading is not otherwise used).", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "(file)", "text": "No system_priority_evaluation in this file for the red box; relies on page 20's 'Urgent: Anaphylaxis' (active_condition) rule. Acceptable under the house pattern, but page-level priority depends on another file.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis after vaccination", "text": "Structure mostly follows the page: any2 of system groups OR generalised urticaria OR any single serious sign all lead to the red box 'Treat as anaphylaxis', and probable is justified by that directive. Two deviations: (1) the feeling-faint/unwell group is counted as a body system unconditionally, whereas on the page it only enters the anaphylaxis decision after 'Do symptom/s improve quickly? No'; so light-headedness/sweating that settles on lying down, plus one GI or skin symptom, fires probable anaphylaxis. (2) The page's red box 'Treat as anaphylaxis' has no system_priority_evaluation in this file; it relies on the anaphylaxis page's 'Urgent' evaluation on the active condition, which should be confirmed. Hypotension as a recorded disorder rather than a BP comparison will rarely match.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pseudoallergic rash after vaccination", "text": "'likely' -> probable is right and the 'isolated rash, not generalised, no other symptoms, remains well' structure is faithful. But (1) the diagnosis concept is the broad 'Non-allergic hypersensitivity reaction'; the exact (snomed_concept \"Acute urticaria due to pseudoallergy\" \"disorder\") exists and should be used; (2) the page only calls the rash pseudoallergic after monitoring for at least 30 minutes with no other symptoms, and the rule fires immediately on an isolated rash, dropping that window (e.g. (>= (onset (clinical_finding (snomed_concept \"Urticaria\" \"disorder\"))) (time_ago 30 minutes)) if minutes are supported). Redundant negations (severe tongue/lip swelling are already excluded by the unqualified tongue/lip swelling negations) are harmless.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Check for adverse reaction after vaccination", "text": "Task is a reasonable fit for the observe/check-for box, but includes invented 'Generally unwell', omits Oxygen sats <92% that the page lists under respiratory symptoms, and drops the 15/30-minute observation timing (30 min if severe allergies) and the Collapse -> 15 branch.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "high", "ref": "Diagnose probable anaphylaxis after vaccination", "text": "(1) The red box 'Treat as anaphylaxis -> 28' is encoded only as a probable diagnosis, with no priority/emergency evaluation. (2) The faint/unwell group is counted as a body system in any2, though the page routes it to 'improve quickly?' not to the 2-systems question. (3) 'If in doubt, treat as anaphylaxis' and the 'serious or life-threatening' catch-all are not encoded. Other branches (2+ systems, generalised urticaria, hypotension, respiratory distress, significant tongue/lip swelling) match the page.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pseudoallergic rash after vaccination", "text": "Structure matches the page (isolated rash, no other symptoms, not generalised, 'likely' -> probable). The 30-minute monitoring window is dropped, so a rash seen minutes after vaccination can be labelled pseudoallergic; the 'urgent care if swelling, breathing difficulty, abdominal pain, nausea' advice is not encoded.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Check for adverse reaction after vaccination", "text": "check_for omits the SpO2 measurement (Oxygen sats < 92%) that the anaphylaxis rule uses; the 15/30-minute observation period is not represented. Otherwise the list matches the page's symptom boxes.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "high", "ref": "Diagnose probable anaphylaxis after vaccination", "text": "The faint/unwell group is counted as one of the 2+ body systems without the page's gate that faint symptoms must fail to improve quickly after positioning; vasovagal dizziness/sweating + nausea will fire probable anaphylaxis. The single-system serious branch, generalised urticaria branch and any2 structure otherwise match the flowchart. Page wording is 'Treat as anaphylaxis', not 'likely'. 'If in doubt, treat as anaphylaxis' is not encoded (acceptable).", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pseudoallergic rash after vaccination", "text": "Matches the page's 'pseudoallergic self-limiting rash likely' with correct 'probable' and a faithful concept, but drops the 'monitor for at least 30 minutes' window and negates itching, which usually accompanies hives.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "build_disagreement", "priority": "medium", "ref": "check_for", "text": "A: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Feeling faint\" \"finding\"))  vs  B: (absent)", "detail": [{"choice": "B", "final": "", "reason": "\"Feeling faint/unwell symptoms\" is the heading of a list; the symptoms the page asks about are its bullets, so the heading is not encoded as a symptom of its own.", "unsettled": true}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Feels hot\" \"finding\"))  vs  B: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Sensation of being warm\" \"finding\"))", "detail": [{"choice": "B", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Sensation of being warm\" \"finding\"))", "reason": "\"Feeling warm or cold\": Sensation of being warm is the closer wording and the sibling of the Sensation of being cold both builds use.", "unsettled": false}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hearing difficulty\" \"finding\"))  vs  B: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased hearing\" \"finding\"))", "detail": [{"choice": "B", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased hearing\" \"finding\"))", "reason": "\"Reduced hearing\" matches Decreased hearing; Hearing difficulty is a narrower child and would miss a recorded Decreased hearing.", "unsettled": false}]}, {"page": 14, "slug": "14-observation-post-vaccination", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (find // ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};

  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}

}
document.addEventListener("click", e => {

document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];

    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {

document.addEventListener("click", e => {

// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes

function rulesNamed(ref) {

function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
