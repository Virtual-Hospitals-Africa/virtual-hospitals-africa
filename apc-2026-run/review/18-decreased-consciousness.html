{"id": "p18-rb1-e37", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e35", "text": "Remove clothing.", "bbox": [393.7, 292.7, 465.1, 303.5], "key": "p18-a24283b8"}, {"id": "p18-rb1-e38", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 1, "parent": null, "text": "Recheck glucose after 15 minutes: if still < 3, give further dextrose 10%2 2mL/kg IV.", "bbox": [47.9, 302.7, 124.4, 353.5], "key": "p18-a96c5dea"}, {"id": "p18-rb1-e39", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e35", "text": "Use fan and water spray to cool patient.", "bbox": [393.7, 302.7, 501.6, 323.5], "key": "p18-fab0b02a"}, {"id": "p18-rb1-e40", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e18", "text": "If known kidney/heart disease, discuss fluid volume with doctor.", "bbox": [156.7, 322.7, 273.8, 353.5], "key": "p18-57036bb4"}, {"id": "p18-rb1-e41", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e35", "text": "Apply ice-packs to axillae, groin and neck.", "bbox": [393.7, 322.7, 498.7, 343.5], "key": "p18-fc9a9bb3"}, {"id": "p18-rb1-e42", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 1, "parent": null, "text": "Then give dextrose 5%3 or 10% 1L IV 6 hourly.", "bbox": [47.9, 352.7, 127.5, 383.5], "key": "p18-abb5ddd9"}, {"id": "p18-rb1-e43", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e18", "text": "Stop if breathing worsens.", "bbox": [156.7, 352.7, 261.2, 363.5], "key": "p18-3130a845"}, {"id": "p18-rb1-e44", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 1, "parent": null, "text": "If known diabetes and referral delay > 2 hours, discuss with referral centre before giving short-acting insulin 0.1units/ kg IM5. Insulin may cause low potassium and heart dysrhythmia; avoid if unable to monitor serum electrolytes.", "bbox": [151.0, 362.7, 276.9, 443.5], "key": "p18-b532a2f9"}, {"id": "p18-rb1-e45", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e42", "text": "Refer urgently.", "bbox": [51.2, 452.1, 114.5, 463.0], "key": "p18-29f45585"}, {"id": "p18-rb1-e46", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e42", "text": "While awaiting transport:", "bbox": [51.2, 462.1, 153.4, 473.0], "key": "p18-2494c0a4"}, {"id": "p18-rb1-e47", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e42", "text": "Check BP, pulse, respiratory rate, oxygen saturation and GCS every 15 minutes. Insert urinary catheter.", "bbox": [56.9, 472.1, 448.5, 483.0], "key": "p18-b4f467dc"}, {"id": "p18-rb1-e48", "page": 18, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with decreased consciousness:", "section_y": 91.5, "indent": 2, "parent": "p18-rb1-e42", "text": "If BP < 90/60, pulse > 100 or < 50, respiratory rate > 20 or < 9, oxygen saturation < 94% or drop in GCS, reassess and manage airway, breathing, circulation and level of consciousness 16.", "bbox": [56.9, 482.1, 773.9, 493.0], "key": "p18-d2a70d56"}, {"id": "p18-out-e01", "page": 18, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "DECREASED CONSCIOUSNESS", "bbox": [298.9, 48.5, 543.0, 70.8], "key": "p18-cc3018aa"}, {"id": "p18-out-e02", "page": 18, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Common allergens include medication, food or insect bite/sting within the past few hours. 2If dextrose 10% unavailable: mix 1 part dextrose 50% to 4 parts water for injection to make dextrose 10% solution. 3If dextrose 5% not available: add 10mL dextrose 50% to each 100mL of sodium chloride 0.9%. 4Avoid giving > 50mL/kg in the first 4 hours. 5Avoid using insulin needle, use 22-25 gauge needle. 6If severe penicillin allergy (previous anaphylaxis, urticaria or angioedema), discuss with doctor.", "bbox": [34.0, 535.3, 796.5, 551.8], "key": "p18-8b7b7b44"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 498.2]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAANaCAIAAAC8xwzTAAAACXBIWXMAABcSAAAXEgFnn9JSAAOxC0lEQVR4nOy9B1RWSbfn/c69753v3jsz63537txv1syaO6+AKIqiKIoKRsy2WVvbjAnbnAMmDG1qMWFo1DaLAXNCFEFUUAmKaBsxtphFpc1t9/P9YWtZnnOeOud5QIHuvdZvsZ5Tp06dql27wt5U1fnL4/9TnGEYhmEYhmEYhmEYhmGKFn8p8BwwDMMwDMMwDMMwDMMwjKOwV4thGIZhGIZhGIZhGIYpenzi1Xq9MezNjqUMwzAMwzAMwzAMwzAMUwh5OWeCsVfrt8dJtl9/YhiGYRiGYRiGYRiGYZhCyNvESPZqMQzDMAzDMAzDMAzDMEUM9moxDMMwDMMwDMMwDMMwRQ/2ajEMwzAMwzAMwzAMwzBFD/ZqMQzDMAzDMAzDMAzDMEUP9moxDMMwDMMwDMMwDMMwRQ/2ajEMwzAMwzAMwzAMwzBFD/ZqMQzDMAzDMAzDMAzDMEUP9moxDMMwDMMwDMMwDMMwRQ/2ajEMwzAMwzAMwzAMwzBFD/ZqMQzDMAzDMAzDMAzDMEUP9moxDMMwn4s3L9JeZqcWeDYYBdlZyb+9OVvg2bDIT2d2Re9bDh7fTyzwzBjy7PHJAs+DHtOWeOdWPAk24+J+J9K/n3mUHr98PqrAC5vvvH15hkp3MmFjgWdGTdFqzgzD oncept \"Meningitis\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Overdose\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Poisoning\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Shock\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 18 – Decreased consciousness: flowchart\n\nSource: APC 2026 e-book page 18. The whole page is one red box: \"Give urgent attention to\nthe patient with decreased consciousness\". It holds a list of first steps and then a three-way\ndecision tree (glucose, temperature, pupils).\n\n```mermaid\nflowchart TD\n    DLOC[\"Decreased consciousness<br/>(give urgent attention)\"]\n    DLOC --> ABC[\"Assess and manage ABC and level of consciousness ↻ 16<br/>Identify injuries, look for cause\"]\n    DLOC --> XREF[\"If seizures ↻ 20, injuries ↻ 30, burns ↻ 31\"]\n    DLOC --> ANA{\"Sudden decreased consciousness and any of:<br/>generalised itch/rash, face/tongue swelling, wheeze,<br/>difficulty breathing, abdominal pain, vomiting,<br/>exposure to possible allergen¹?\"}\n    ANA -- Yes --> ANA28[\"Check for anaphylaxis ↻ 28\"]\n    DLOC --> CHECK[\"Check glucose, temperature and pupils\"]\n\n    CHECK --> GLU[\"Glucose\"]\n    GLU --> GLO[\"&lt; 3 (&lt; 4 if diabetes) or unable to measure\"]\n    GLO --> GLOM[\"Dextrose / thiamine (management only)\"]\n    GLU --> GHI[\"≥ 11.1\"]\n    GHI --> SHOCK{\"SBP &lt; 80, pulse ≥ 100,<br/>respiratory rate &gt; 30, weakness?\"}\n    SHOCK -- Yes --> SHOCKL[\"Shock likely\"]\n    GHI --> GHIM[\"Fluids, insulin (management only)\"]\n\n    CHECK --> TEMP[\"Temperature\"]\n    TEMP --> TLO[\"≤ 35°C\"]\n    TLO --> TLOM[\"Warm patient (management only)\"]\n    TEMP --> THI[\"≥ 38°C\"]\n    THI --> MEN[\"Ceftriaxone for possible meningitis\"]\n    THI --> MAL[\"Malaria area in past 3 months → manage ↻ 39\"]\n    THI --> TCOOL[\"If &gt; 40°C cool patient (management only)\"]\n\n    CHECK --> PUP[\"Pupils\"]\n    PUP --> PIN[\"Pinpoint\"]\n    PIN --> PIN1[\"Illegal drug use and/or respiratory rate &lt; 12\"]\n    PIN --> PIN2[\"Excessive secretions or muscle twitching\"]\n    PUP --> DIL[\"Both equally dilated\"]\n    DIL --> OD[\"Stimulant or other drug overdose likely\"]\n    PIN1 --> POIS[\"Poisoning likely ↻ 27\"]\n    PIN2 --> POIS\n    OD --> POIS\n    PUP --> UNEQ[\"Unequal or respond poorly to light\"]\n    UNEQ --> UNEQM[\"Raise head 30°, keep spine straight if injured,<br/>discuss urgently (management only)\"]\n\n    DLOC --> REF[\"Refer urgently; monitor every 15 minutes<br/>(management only)\"]\n```\n\n¹ Common allergens include medication, food or insect bite/sting within the past few hours.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Decreased consciousness (box header) | Trigger: `or` of Decreased level of consciousness and the three recorded AVPU levels below Alert (reacts to voice, reacts to pain, unresponsive) | `Check for causes of decreased consciousness`; `Urgent: decreased consciousness` |\n| Sudden decreased consciousness + any anaphylaxis feature → check for anaphylaxis ↻ 28 | `possible` Anaphylaxis: sudden-onset decreased consciousness **and** any of generalised itch, generalised rash, face swelling, tongue swelling, wheeze, difficulty breathing, abdominal pain, vomiting, exposure to drug/food, insect bite/sting | `Diagnose possible anaphylaxis with sudden decreased consciousness` (feeds page 28's anaphylaxis check) |\n| Glucose < 3 (< 4 if diabetes) or unable to measure | Not modelled: the branch names no diagnosis, only dextrose/thiamine management | none |\n| Glucose ≥ 11.1 → SBP < 80, pulse ≥ 100, RR > 30, weakness → shock likely | `probable` Shock: trigger **and** glucose ≥ 11.1 **and** any of SBP < 80, pulse ≥ 100, RR > 30, weakness (Asthenia) | `Diagnose probable shock with decreased consciousness and glucose ≥ 11.1` |\n| Temperature ≤ 35°C | Not modelled: management only (warming) | none |\n| Temperature ≥ 38°C → \"for possible meningitis\" | `possible` Meningitis: trigger **and** temperature ≥ 38 | `Diagnose possible meningitis with decreased consciousness and temperature ≥ 38` |\n| Temperature ≥ 38°C, malaria area → manage ↻ 39 | Not modelled: cross-reference to page 39 | none |\n| Pinpoint + (illegal drug use and/or RR < 12) → poisoning likely | `probable` Poisoning, first branch | `Diagnose probable poisoning with decreased consciousness` |\n| Pinpoint + (excessive secretions or muscle twitching) → poisoning likely | `probable` Poisoning, same branch (`or` of the two boxes) | `Diagnose probable poisoning with decreased consciousness` |\n| Both equally dilated → stimulant or other drug overdose likely | `probable` Overdose: trigger **and** dilated pupils of both eyes | `Diagnose probable drug overdose with decreased consciousness and dilated pupils` |\n| Stimulant/drug overdose likely → poisoning likely | `probable` Poisoning, second branch: trigger **and** dilated pupils of both eyes (evidence repeated, not `active_condition Overdose`, so it stays checked for in this file) | `Diagnose probable poisoning with decreased consciousness` |\n| Unequal or respond poorly to light | Not modelled: the page attaches only management (head up, discuss) and names no diagnosis | none |\n\n## Notes\n\n- Glucose and temperature are routine vitals, so no `measure` task is written for them. Pupils are\n  findings and go in the `check_for`.\n- The page's \"Unequal or respond poorly to light\", \"≤ 35°C\" and \"< 3 … or unable to measure\"\n  branches lead only to management, so nothing in the language consumes them; per Will's rule\n  (\"If the page really does not use a finding for anything, remove it from the check_for\") they are\n  not checked for.\n", "questions": "# Page 18 – Decreased consciousness: remaining questions\n\n## Decisions made\n\n- **Trigger.** \"Decreased consciousness\" is not an adult common symptom or warning sign. The\n  trigger is an `or` of `Decreased level of consciousness` and the three AVPU levels below Alert\n  that triage records (`Impairment of mental alertness` = reacts to voice, `Responds to pain`,\n  `Unresponsive`). None of these three is a SNOMED descendant of `Decreased level of\n  consciousness`, so they are listed explicitly. AVPU \"Confused\" (`Clouded consciousness`) is left\n  out because confusion is its own presentation.\n- **Reconciliation.** Final build = builder B's, with builder A's `Asthenia` for \"weakness\" and\n  `Excessive bronchial secretion` for \"excessive secretions\". `Pin point pupils` (B) replaces A's\n  broader `Constricted pupil`, so A's \"Could not model\" note on pinpoint is resolved.\n- **Priority.** One `Urgent` rule for any decreased consciousness (\"Give urgent attention to the\n  patient with decreased consciousness\"). The page does not escalate further.\n- **Anaphylaxis line → `possible` Anaphylaxis.** \"If sudden decreased consciousness and any of …,\n  check for anaphylaxis 28\" is a consider-statement: sudden-onset decreased consciousness AND any of\n  generalised itch, generalised rash, face/tongue swelling, wheeze, difficulty breathing, abdominal\n  pain, vomiting, or exposure to a possible allergen. The allergens come from footnote 1\n  (medication, food, insect bite/sting) and use the gold standard's exposure form, with the general\n  `Food` substance because this page names no specific food.\n- **Shock (glucose ≥ 11.1 column).** As decided for all pages, the page's own logic is encoded and no\n  shared shock definition is used: probable `Shock` = decreased consciousness AND glucose ≥ 11.1 AND\n  any of SBP < 80, pulse ≥ 100, respiratory rate > 30, weakness. The comma list is read as \"any of\".\n- **Meningitis.** \"Give ceftriaxone … for possible meningitis\" in the ≥ 38°C column → `possible`\n  Meningitis = decreased consciousness AND temperature ≥ 38.\n- **Pupils → poisoning.** Pinpoint AND (illegal drug use, RR < 12, excessive secretions or muscle\n  twitching) → probable `Poisoning`. Both equally dilated → probable `Overdose` (\"stimulant or other\n  drug overdose likely\") and, since that box also feeds \"Poisoning likely\", probable `Poisoning` too.\n  The poisoning rule repeats the pupil evidence instead of using `(active_condition Overdose)`, so its\n  evidence stays checked for in this file.\n- **Branches that name no diagnosis are not encoded:** glucose < 3 (< 4 if diabetes) or unable to\n  measure, temperature ≤ 35°C, and unequal/poorly reactive pupils lead only to management. Their\n  findings are not checked for, following Will's rule that a finding nothing consumes should not be\n  in a `check_for`.\n- Glucose and temperature are routine vitals, so there is no `measure` task.\n- No time comparisons are used.\n\n## Could not model\n\n- **Hypoglycaemia branch** (\"< 3 (< 4 if diabetes) or unable to measure\"): the page gives only\n  management. \"Unable to measure\" has no representation. No rule fires, so the low-glucose path is\n  silent in the rules (dextrose management not in scope).\n- **Hypothermia branch** (≤ 35°C, ≤ 32°C) and **hyperthermia** (> 40°C): management only.\n- **Unequal pupils / poor light response**: management only (head up, discuss urgently). Because\n  nothing consumes them, the task does not prompt the health worker to look for them, although the\n  page says to check pupils. If a later pass wants them prompted, a diagnosis (e.g. raised\n  intracranial pressure) would need to come from the page, and this page names none.\n- **Malaria area in past 3 months → manage 39**: cross-reference only.\n- **Monitoring while awaiting transport** (BP < 90/60, pulse > 100 or < 50, RR > 20 or < 9,\n  SpO₂ < 94%, drop in GCS → reassess ↻ 16): monitoring/management. Not encoded as triage.\n- \"Within the past few hours\" (footnote 1) for allergen exposure: as on the gold page, exposures\n  recorded in the encounter are taken as recent.\n- \"Both **equally** dilated\": encoded as dilated pupils of both eyes; equality is not expressed.\n\n## SNOMED gaps\n\n- \"Pinpoint\" → `Pin point pupils` (finding) exists. ✔\n- \"Excessive secretions\": no single concept. Substituted `Excessive salivation` (disorder) OR\n  `Excessive bronchial secretion` (finding). `Bronchorrhea` (finding) was the other builder's\n  choice; the two are not related by is-a.\n- \"Muscle twitching\" → `Muscle twitch` (finding). `Muscle fasciculation` is not a descendant and is\n  not added.\n- \"Both equally dilated\": no bilateral precoordinated concept. Used `Dilated pupil` with finding_site\n  `Structure of pupil of both eyes` (body structure, verified).\n- \"Weakness\": no plain `Weakness` finding. Used `Asthenia` (finding), the concept the SNOMED tool\n  offers for \"Weakness\". `Muscle weakness` (in VHA's vocabulary, but a narrower muscle-power\n  finding) was the other builder's choice.\n- \"Stimulant or other drug overdose\": `Drug overdose` does not exist. Used `Overdose` (disorder).\n- \"Generalised itch/rash\" → `Generalized pruritus` (finding) and `Generalized rash` (disorder), both\n  in the VHA vocabulary.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n1. Shock line: does \"SBP < 80, pulse ≥ 100, respiratory rate > 30, weakness\" mean any one of these,\n   or all together? And should it apply only within the glucose ≥ 11.1 column (as encoded)?\n2. Should AVPU \"Reacts to voice\" count as decreased consciousness for this page's trigger? And should\n   \"Confused\" also trigger it?\n3. Should probable poisoning with decreased consciousness be `Very urgent` (as the adult Poisoning\n   warning sign is), rather than `Urgent`?\n4. Is \"excessive secretions\" well captured by excessive salivation or bronchorrhoea, or should\n   lacrimation and sweating also count?\n5. Should the low-glucose branch produce a hypoglycaemia diagnosis, even though the page names none?\n6. Should unequal or poorly reactive pupils raise the priority above Urgent (e.g. raised\n   intracranial pressure), given the page says \"discuss urgently\"?\n7. \"Weakness\" in the shock line: general weakness (`Asthenia`, as encoded) or muscle weakness?\n", "claims": [{"claim_id": "c001", "rule": "Check for causes of decreased consciousness", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased level of consciousness\" \"finding\"))", "element_keys": ["p18-96f9e0c5"], "quote": "decreased consciousness"}, {"claim_id": "c002", "rule": "Check for causes of decreased consciousness", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Impairment of mental alertness\" \"finding\"))", "element_keys": ["p18-96f9e0c5"], "quote": "decreased consciousness"}, {"claim_id": "c003", "rule": "Check for causes of decreased consciousness", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Responds to pain\" \"finding\"))", "element_keys": ["p18-96f9e0c5"], "quote": "decreased consciousness"}, {"claim_id": "c004", "rule": "Check for causes of decreased consciousness", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unresponsive\" \"finding\"))", "element_keys": ["p18-96f9e0c5"], "quote": "decreased consciousness"}, {"claim_id": "c005", "rule": "Check for causes of decreased consciousness", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased level of consciousness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "element_keys": ["p18-d32664c5"], "quote": "sudden decreased consciousness"}, {"claim_id": "c006", "rule": "Check for causes of decreased consciousness", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_conc dicament, exposure to Food, Insect bite - wound and Insect sting. 'Within the past few hours' is not encoded, but the gold page-20 pattern does not encode it either.", "evidence": ["Diagnose possible anaphylaxis with sudden decreased consciousness :: (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\")) (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Food\" \"substance\")) (clinical_finding (snomed_concept \"Insect bite - wound\" \"disorder\")) (clinical_finding (snomed_concept \"Insect sting\" \"disorder\"))"], "confidence": "high"}], "outside_not_logic": ["p18-cc3018aa"], "rule_level_problems": [{"rule": "Check for causes of decreased consciousness (check_for)", "problem": "The pupil branch is incomplete: 'Unequal or respond poorly to light' is a red-box finding with its own escalation ('Discuss urgently with referral centre') and is neither checked for nor used. Will's briefing requires every red-box item in the check_for. Candidate concepts exist: (snomed_concept \"Anisocoria\" \"disorder\"), (snomed_concept \"Sluggish pupil movement\" \"finding\"), (snomed_concept \"Abnormal pupil reaction\" \"finding\").", "severity": "medium"}, {"rule": "Urgent: decreased consciousness (system_priority_evaluation)", "problem": "Only one priority level (Urgent) for every patient. The page's deterioration criteria (BP < 90/60, pulse > 100 or < 50, RR > 20 or < 9, SpO2 < 94%) in a patient with decreased consciousness match Will's named example for Very urgent / Emergency ('BP < 90/60 with altered consciousness'); the unequal/poorly-reactive-pupil branch ('Discuss urgently') is another escalation. Neither is encoded, so the file cannot distinguish a stable from a deteriorating unconscious patient.", "severity": "medium"}, {"rule": "Whole file: glucose and temperature branches", "problem": "Of the page's seven leaf thresholds under 'Check glucose, temperature and pupils', only >= 11.1 (as a gate), >= 38°C, pinpoint and both-dilated are encoded. Glucose < 3 (< 4 if diabetes), temperature <= 35°C and the unequal/poorly reactive pupils are absent. The builders encoded >= 38°C as a possible diagnosis even though the page only says 'for possible meningitis' in a drug instruction, so the same reasoning should have produced possible Hypoglycemia (with (active_condition Diabetes mellitus) raising the cut-off to 4) and possible Hypothermia, or the remaining-questions file should say why not.", "severity": "medium"}, {"rule": "Diagnose probable shock with decreased consciousness and glucose >= 11.1", "problem": "The shock criteria are gated on glucose >= 11.1 because the box sits under that branch. This is faithful to the layout, but it means an unconscious patient with SBP < 80 and glucose 6 gets no shock diagnosis from this page. Also the page's comma list ('SBP < 80, pulse >= 100, respiratory rate > 30, weakness') is read as any-of; it may mean the combination. Both choices are defensible; they should be recorded as judgement calls.", "severity": "low"}, {"rule": "Diagnose probable shock / Diagnose probable poisoning / Diagnose possible meningitis (measurement concepts)", "problem": "Pulse is measured as (snomed_concept \"Pulse, function\" \"observable entity\"), whose parent is 'Cardiovascular function', not a rate; (snomed_concept \"Heart rate\" \"observable entity\") is the natural concept for a bpm value. Glucose is measured as (snomed_concept \"Blood glucose status\" \"observable entity\") (parent 'General clinical state'); (snomed_concept \"Blood glucose concentration\" \"observable entity\") is the natural concept for a mmol/L value. If the recorded vitals use the other concepts these comparisons never match and the rules silently never fire. I could not see the vitals anchor, so this is a flag, not a confirmed error.", "severity": "medium"}, {"rule": "Diagnose probable poisoning with decreased consciousness", "problem": "Pinpoint pupils alone do not reach 'Poisoning likely'; the rule requires one of illicit drug use, RR < 12, excessive secretions or muscle twitching as well. On the page the two sub-boxes hang off 'Pinpoint' as the two poisoning patterns and the 'Poisoning likely' bar sits under the whole pinpoint column, so pinpoint pupils in an unconscious adult are arguably sufficient. A judgement call; the stricter reading loses the case of pinpoint pupils with no other feature.", "severity": "low"}, {"rule": "Whole file: malaria", "problem": "'If patient was in malaria area in past 3 months, manage 39' under the >= 38°C branch is an implied 'consider malaria' and is not encoded. SNOMED as searched has no malaria-area exposure concept, so this may be a not_representable gap, but it should be recorded.", "severity": "low"}], "summary": "The anaphylaxis pre-screen, the three 'X likely' conclusions (shock, overdose, poisoning) and possible meningitis are encoded faithfully with existing concepts and the page's logic, and every check_for item is consumed. The most consequential gap is the page's escalation logic: the unequal / poorly reactive pupil branch and the deterioration thresholds (BP < 90/60, pulse > 100 or < 50, RR > 20 or < 9, SpO2 < 94%) are absent, leaving a single Urgent level for every patient. The glucose < 3 (< 4 if diabetes) and temperature <= 35°C branches are not encoded at all, and the pulse and glucose measurement concepts ('Pulse, function', 'Blood glucose status') look unlikely to be what vitals are recorded under."}, {"page": 18, "checker": "forward-2", "elements": [{"element_key": "p18-96f9e0c5", "scope": "in_scope", "scope_reason": "", "verdict": "correct", "parts_missing": [], "problem": "Priority level Urgent is a reasonable reading of 'Give urgent attention'/'Refer urgently', though the page sits in the Emergencies section; low-severity doubt.", "evidence": ["Urgent: decreased consciousness :: (system_priority_evaluation ... Urgent (or cker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Check for causes of decreased consciousness (check_for)", "text": "The pupil branch is incomplete: 'Unequal or respond poorly to light' is a red-box finding with its own escalation ('Discuss urgently with referral centre') and is neither checked for nor used. Will's briefing requires every red-box item in the check_for. Candidate concepts exist: (snomed_concept \"Anisocoria\" \"disorder\"), (snomed_concept \"Sluggish pupil movement\" \"finding\"), (snomed_concept \"Abnormal pupil reaction\" \"finding\").", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Urgent: decreased consciousness (system_priority_evaluation)", "text": "Only one priority level (Urgent) for every patient. The page's deterioration criteria (BP < 90/60, pulse > 100 or < 50, RR > 20 or < 9, SpO2 < 94%) in a patient with decreased consciousness match Will's named example for Very urgent / Emergency ('BP < 90/60 with altered consciousness'); the unequal/poorly-reactive-pupil branch ('Discuss urgently') is another escalation. Neither is encoded, so the file cannot distinguish a stable from a deteriorating unconscious patient.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Whole file: glucose and temperature branches", "text": "Of the page's seven leaf thresholds under 'Check glucose, temperature and pupils', only >= 11.1 (as a gate), >= 38°C, pinpoint and both-dilated are encoded. Glucose < 3 (< 4 if diabetes), temperature <= 35°C and the unequal/poorly reactive pupils are absent. The builders encoded >= 38°C as a possible diagnosis even though the page only says 'for possible meningitis' in a drug instruction, so the same reasoning should have produced possible Hypoglycemia (with (active_condition Diabetes mellitus) raising the cut-off to 4) and possible Hypothermia, or the remaining-questions file should say why not.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock with decreased consciousness and glucose >= 11.1", "text": "The shock criteria are gated on glucose >= 11.1 because the box sits under that branch. This is faithful to the layout, but it means an unconscious patient with SBP < 80 and glucose 6 gets no shock diagnosis from this page. Also the page's comma list ('SBP < 80, pulse >= 100, respiratory rate > 30, weakness') is read as any-of; it may mean the combination. Both choices are defensible; they should be recorded as judgement calls.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock / Diagnose probable poisoning / Diagnose possible meningitis (measurement concepts)", "text": "Pulse is measured as (snomed_concept \"Pulse, function\" \"observable entity\"), whose parent is 'Cardiovascular function', not a rate; (snomed_concept \"Heart rate\" \"observable entity\") is the natural concept for a bpm value. Glucose is measured as (snomed_concept \"Blood glucose status\" \"observable entity\") (parent 'General clinical state'); (snomed_concept \"Blood glucose concentration\" \"observable entity\") is the natural concept for a mmol/L value. If the recorded vitals use the other concepts these comparisons never match and the rules silently never fire. I could not see the vitals anchor, so this is a flag, not a confirmed error.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Diagnose probable poisoning with decreased consciousness", "text": "Pinpoint pupils alone do not reach 'Poisoning likely'; the rule requires one of illicit drug use, RR < 12, excessive secretions or muscle twitching as well. On the page the two sub-boxes hang off 'Pinpoint' as the two poisoning patterns and the 'Poisoning likely' bar sits under the whole pinpoint column, so pinpoint pupils in an unconscious adult are arguably sufficient. A judgement call; the stricter reading loses the case of pinpoint pupils with no other feature.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Whole file: malaria", "text": "'If patient was in malaria area in past 3 months, manage 39' under the >= 38°C branch is an implied 'consider malaria' and is not encoded. SNOMED as searched has no malaria-area exposure concept, so this may be a not_representable gap, but it should be recorded.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Diagnose probable poisoning with decreased consciousness", "text": "Pinpoint pupils are required for the 'excessive secretions or muscle twitching' sub-branch. Flowchart connects both leaves under Pinpoint, so reading is plausible, but secretions/twitching with no pupil finding would not fire; consider confirming.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Check for causes of decreased consciousness", "text": "check_for lacks glucose, temperature and unequal/poorly reactive pupils, though the page says 'Check glucose, temperature and pupils'. It also includes Asthenia, which is used by the shock rule, but no check_for item for respiratory rate/SBP/pulse/temperature measurements.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Urgent: decreased consciousness", "text": "Priority Urgent versus Emergency is a judgement call; page is in the Emergencies section, and says 'Give urgent attention' and 'Refer urgently', which supports Urgent.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis", "text": "Allergen exposure 'within the past few hours' not represented (no timing); a drug/food exposure of any time would satisfy the rule.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "(no rule)", "text": "Low glucose (< 3 / < 4 diabetes / unable to measure), temperature <= 35 C and unequal pupils branches have no encoding; the page names no diagnosis for them, so this is defensible.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Check for causes of decreased consciousness", "text": "Pupil assessment check_for covers pinpoint and both-dilated but omits the third branch (unequal / poorly reactive to light); no rule consumes it, so adding it would also need a rule (none named on page).", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis with sudden decreased consciousness", "text": "Allergen exposure (footnote 1) has no 'within the past few hours' onset constraint, so any recorded exposure qualifies.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock with decreased consciousness and glucose ≥ 11.1", "text": "Page's comma list 'SBP < 80, pulse ≥ 100, RR > 30, weakness' is read as any-of; an all-of or any2 reading is possible, and a single sign (e.g. pulse 100) is a low bar for probable shock. Reasonable but worth confirming.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "(none)", "text": "Glucose < 3 (< 4 if diabetes), temperature ≤ 35°C and fever with malaria-area exposure branches have no rules; the page names no 'likely' diagnosis for them, so this is consistent with the house standard but loses implicit hypoglycaemia/hypothermia/malaria logic.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Check for causes of decreased consciousness (trigger)", "text": "Trigger includes 'Responds to pain' and 'Unresponsive' but not 'Responds to voice'; relies on descendants of Decreased level of consciousness for other AVPU states.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Check for causes of decreased consciousness", "text": "Page says 'Check glucose, temperature and pupils' but check_for contains no glucose or temperature measurements (hypoglycaemia <3/<4 diabetes, >=11.1, <=35, >=38). Also the anaphylaxis symptoms are listed as check_for items although the page only says check for anaphylaxis (pointer to p28); acceptable pre-screen pattern but note.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Check for causes of decreased consciousness", "text": "Mostly faithful. The page says 'Check ... pupils' with an 'Unequal or respond poorly to light' branch (raise head, discuss urgently with the referral centre), but that finding isn't checked for anywhere. It's acceptable only because no rule consumes it, so the page's pupil check is only partly encoded. Allergen exposures drop the 'past few hours' window.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock with decreased consciousness and glucose ≥ 11.1", "text": "The page's comma list 'If SBP < 80, pulse ≥ 100, respiratory rate > 30, weakness, shock likely' is encoded as a plain or, so glucose ≥ 11.1 plus weakness alone (or pulse 100 alone) gives probable shock, which leads to a 20 mL/kg bolus. It's ambiguous whether the page means any one sign or the cluster; a plain or is the most permissive reading and should be confirmed with the clinical lead (any2 or and are the alternatives). Placement inside the glucose ≥ 11.1 branch is correct.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "build_disagreement", "priority": "medium", "ref": "trigger", "text": "A: Decreased level of consciousness only  vs  B: also (clinical_finding (snomed_concept \"Impairment of mental alertness\" \"finding\")) (clinical_finding (snomed_concept \"Responds to pain\" \"finding\")) (clinical_finding (snomed_concept \"Unresponsive\" \"finding\"))", "detail": [{"choice": "B", "final": "(or (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\")) (clinical_finding (snomed_concept \"Impairment of mental alertness\" \"finding\")) (clinical_finding (snomed_concept \"Responds to pain\" \"finding\")) (clinical_finding (snomed_concept \"Unresponsive\" \"finding\")))", "reason": "The page's 'decreased consciousness' is recorded for adults through the AVPU levels below Alert (Decreased level of consciousness is only a child 'more sleepy' warning sign), so B's or anchors the page's own complaint; whether 'Reacts to voice' counts is not settled by the page.", "unsettled": true}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "build_disagreement", "priority": "medium", "ref": "priority_condition", "text": "same AVPU additions as the trigger (A: absent, B: present)", "detail": [{"choice": "B", "final": "(or (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\")) (clinical_finding (snomed_concept \"Impairment of mental alertness\" \"finding\")) (clinical_finding (snomed_concept \"Responds to pain\" \"finding\")) (clinical_finding (snomed_concept \"Unresponsive\" \"finding\")))", "reason": "'Give urgent attention to the patient with decreased consciousness' must match the same patients as the trigger; follows the trigger decision.", "unsettled": true}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "build_disagreement", "priority": "medium", "ref": "diagnosis_condition", "text": "AVPU additions in the decreased-consciousness conjunct of the shock, meningitis, overdose and poisoning rules (12 conditions, B only)", "detail": [{"choice": "B", "final": "same or as the trigger, in each of the four rules", "reason": "Every column sits under 'the patient with decreased consciousness', so the diagnosis rules use the same definition as the trigger.", "unsettled": true}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "build_disagreement", "priority": "low", "ref": "check_for + diagnosis_condition", "text": "A: (clinical_finding (snomed_concept \"Constricted pupil\" \"finding\"))  vs  B: (clinical_finding (snomed_concept \"Pin point pupils\" \"finding\")) (B narrower)", "detail": [{"choice": "B", "final": "(clinical_finding (snomed_concept \"Pin point pupils\" \"finding\"))", "reason": "The page says 'Pinpoint' and the exact concept Pin point pupils exists; A's broader Constricted pupil would fire on any miosis.", "unsettled": false}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "build_disagreement", "priority": "medium", "ref": "check_for + diagnosis_condition", "text": "A: (clinical_finding (snomed_concept \"Asthenia\" \"finding\"))  vs  B: (clinical_finding (snomed_concept \"Muscle weakness\" \"finding\"))", "detail": [{"choice": "A", "final": "(clinical_finding (snomed_concept \"Asthenia\" \"finding\"))", "reason": "The page says plain 'weakness' in the shock line; Asthenia is SNOMED's general weakness concept, while Muscle weakness narrows it to muscle power, which the page does not say.", "unsettled": true}]}, {"page": 18, "slug": "18-decreased-consciousness", "kind": "build_disagreement", "priority": "medium", "ref": "check_for + diagnosis_condition", "text": "A: (clinical_finding (snomed_concept \"Excessive bronchial secretion\" \"finding\"))  vs  B: (clinical_finding (snomed_concept \"Bronchorrhea\" \"finding\"))", "detail": [{"choice": "A", "final": "(clinical_finding (snomed_concept \"Excessive bronchial secretion\" \"finding\"))", "reason": "'Excessive secretions' is matched most literally by Excessive bronchial secretion; Bronchorrhea (profuse watery sputum) is a specific picture the page does not name, and the two are not is-a related.", "unsettled": true}]}], "concepts": {"Decreased level of consciousness|finding": {"resolves": true, "id": "443371007", "descendants": 115, "parents": ["Disturbance of consciousness (finding)"]}, "Impairment of mental alertness|finding": {"resolves": true, "id": "704426000", "descendants": 1, "parents": ["Finding of mental alertness (finding)"]}, "Responds to pain|finding": {"resolves": true, "id": "450847001", "descendants": 0, "parents": ["Finding of response to pain (finding)"]}, "Unresponsive|finding": {"resolves": true, "id": "422768004", "descendants": 3, "parents": ["Consciousness and/or awareness finding (finding)"]}, "Sudden onset|qualifier value": {"resolves": true, "id": "385315009", "descendants": 2, "parents": ["Sudden onset AND/OR short duration (qualifier value)"]}, "Generalized pruritus|finding": {"resolves": true, "id": "276444007", "descenda   <section class="pane"><h2><span id="rulesttl">Rules, in plain English</span> <span class="hb" data-k="rules"></span> <span style="float:right"><button id="rawbtn" style="font-size:11.5px;text-transform:none;letter-spacing:0">show structured rules</button><span class="hb" data-k="rawtoggle"></span></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="rules"></div></section>
</main>
<div class="lower">
  <div class="tabs" id="tabs"></div>
  <div class="tabbody" id="tabbody"></div>
</div>
<script src="help.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
