5mg IV. Repeat every 3 minutes, up to a total of 3mg.", "bbox": [352.3, 308.9, 510.6, 359.7], "key": "p16-3f586123"}, {"id": "p16-rb1-e26", "page": 16, "box": 1, "kind_hint": "header", "section": "Best motor response", "section_y": 318.1, "indent": 0, "parent": null, "text": "Best motor response 6 Obeys commands 5 Localises to pain 4 Withdraws from pain 3 Abnormal flexion to pain 2 Extends to pain 1 None", "bbox": [533.2, 318.1, 622.8, 403.5], "key": "p16-8fcfa861"}, {"id": "p16-rb1-e27", "page": 16, "box": 1, "kind_hint": "header", "section": "Best motor response", "section_y": 318.1, "indent": 0, "parent": null, "text": "Best verbal response 5 Orientated 4 Confused 3 Inappropriate words 2 Incomprehensible sounds 1 None", "bbox": [629.6, 318.1, 711.0, 402.6], "key": "p16-0e9b2dc5"}, {"id": "p16-rb1-e28", "page": 16, "box": 1, "kind_hint": "other", "section": "Best verbal response", "section_y": 318.1, "indent": 0, "parent": null, "text": "Eye opening 4 Spontaneous 3 To voice 2 To pain 1 None", "bbox": [717.5, 318.1, 778.6, 371.8], "key": "p16-7bf202c1"}, {"id": "p16-rb1-e29", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 1, "parent": null, "text": "If respiratory rate < 9 or blue lips/ tongue, connect bag-valve-mask to oxygen and slowly deliver each breath with the patient.", "bbox": [189.3, 328.9, 323.4, 369.7], "key": "p16-6153a2f5"}, {"id": "p16-rb1-e30", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 2, "parent": null, "text": "Remove foreign bodies from mouth and suction fluids.", "bbox": [56.0, 358.9, 172.3, 379.7], "key": "p16-815c532b"}, {"id": "p16-rb1-e31", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 1, "parent": null, "text": "If shock3/SBP < 80, pulse ≥ 100 or heavy bleeding, give sodium chloride 0.9% 1L IV rapidly, repeat until SBP > 80. If known heart problem or severe infection suspected, give instead sodium chloride 0.9% 500mL IV over 30 minutes, repeat until SBP > 80. Continue 1L 6 hourly. Stop if breathing worsens.", "bbox": [352.3, 358.9, 512.8, 439.7], "key": "p16-5b2bde21"}, {"id": "p16-rb1-e32", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 1, "parent": null, "text": "Intubate if using bag-valve-mask and still difficulty breathing, oxygen saturation < 94% or blue lips/tongue.", "bbox": [189.3, 368.9, 333.9, 399.7], "key": "p16-1a47f839"}, {"id": "p16-rb1-e33", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 2, "parent": null, "text": "If unconscious, insert oropharyngeal airway. If patient resists, gags or vomits, use lubricated nasopharyngeal airway instead.", "bbox": [56.0, 378.9, 156.2, 439.7], "key": "p16-529267e8"}, {"id": "p16-rb1-e34", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 1, "parent": null, "text": "If sudden breathlessness, more resonant/decreased breath sounds/ pain on 1 side, deviated trachea, tension pneumothorax likely:", "bbox": [189.3, 398.9, 328.4, 439.7], "key": "p16-6ef6c3cf"}, {"id": "p16-rb1-e35", "page": 16, "box": 1, "kind_hint": "unclassified", "section": "Best motor response", "section_y": 318.1, "indent": 1, "parent": null, "text": "Add scores to give a single score out of 15:", "bbox": [530.1, 414.3, 697.5, 425.2], "key": "p16-66c9323e"}, {"id": "p16-rb1-e36", "page": 16, "box": 1, "kind_hint": "unclassified", "section": "Best motor response", "section_y": 318.1, "indent": 2, "parent": "p16-rb1-e35", "text": "If GCS ≤ 8, intubate patient.", "bbox": [535.8, 424.3, 645.4, 435.2], "key": "p16-73bb82a1"}, {"id": "p16-rb1-e37", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 2, "parent": null, "text": "Intubate if unable to maintain airway with oro- or nasopharyngeal airway.", "bbox": [56.0, 438.9, 171.9, 469.7], "key": "p16-9f39e768"}, {"id": "p16-rb1-e38", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 2, "parent": "p16-rb1-e34", "text": "Insert large bore cannula above the 6th rib, anterior axillary line.", "bbox": [194.9, 438.9, 337.3, 459.7], "key": "p16-337bdcde"}, {"id": "p16-rb1-e39", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 1, "parent": null, "text": "Stop bleeding: apply pressure and elevate limb. If bleeding still severe, apply tourniquet above injury.", "bbox": [352.3, 438.9, 495.7, 469.7], "key": "p16-e8e7558a"}, {"id": "p16-rb1-e40", "page": 16, "box": 1, "kind_hint": "management", "section": "Assess and manage airway, breathing, circulation and level of consciousness", "section_y": 268.5, "indent": 2, "parent": "p16-rb1-e34", "text": "Arrange urgent chest tube.", "bbox": [194.9, 458.9, 300.2, 469.7], "key": "p16-c9b1aed7"}, {"id": "p16-rb1-e41", "page": 16, "box": 1, "kind_hint": "header", "section": "Manage further and refer urgently:", "section_y": 473.7, "indent": 0, "parent": null, "text": "Manage further and refer urgently:", "bbox": [51.2, 473.7, 190.9, 484.8], "key": "p16-64633920"}, {"id": "p16-rb1-e42", "page": 16, "box": 1, "kind_hint": "management", "section": "Manage further and refer urgently:", "section_y": 473.7, "indent": 1, "parent": null, "text": "While awaiting transport, continue to assess and manage airway, breathing, circulation and level of consciousness.", "bbox": [51.2, 484.0, 494.9, 494.8], "key": "p16-2196ee62"}, {"id": "p16-rb1-e43", "page": 16, "box": 1, "kind_hint": "management", "section": "Manage further and refer urgently:", "section_y": 473.7, "indent": 1, "parent": null, "text": "If decreased consciousness or vomiting, place in left lateral lying (recovery) position.", "bbox": [51.2, 494.0, 377.6, 504.8], "key": "p16-5df3d162"}, {"id": "p16-rb1-e44", "page": 16, "box": 1, "kind_hint": "management", "section": "Manage further and refer urgently:", "section_y": 473.7, "indent": 1, "parent": null, "text": "If decreased consciousness 18, if injured 30, if seizures/just had a seizure 20, if burns 31, if bite/sting 29, if fever 38, if rash 82, if anaphylaxis 28.", "bbox": [51.2, 504.0, 640.2, 514.8], "key": "p16-7585bb89"}, {"id": "p16-rb1-e45", "page": 16, "box": 1, "kind_hint": "management", "section": "Manage further and refer urgently:", "section_y": 473.7, "indent": 1, "parent": null, "text": "If other symptom, manage as on symptom page.", "bbox": [51.2, 514.0, 244.0, 524.8], "key": "p16-a1d295e8"}, {"id": "p16-out-e01", "page": 16, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "THE EMERGENCY PATIENT", "bbox": [314.2, 48.7, 527.7, 71.0], "key": "p16-eae84789"}, {"id": "p16-out-e02", "page": 16, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If the patient has a life-limiting illness, consider whether or not to proceed. If CPR not needed in the palliative care patient, address the dying patient's needs 193. 2Lift chin forward with fingers under bony tips of jaw. 3Leg swelling, difficulty breathing which worsens on lying down/with effort. 3If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely.", "bbox": [34.0, 534.8, 775.2, 551.8], "key": "p16-c57722be"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 530.0]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAOdCAIAAACwKiLfAAAACXBIWXMAABcSAAAXEgFnn9JSAAP/DklEQVR4nOydh1cV1/v1f3/Iu1aULgiKYgVRiQY72GuwxBZ7iz1GjS3xmxg11mjsvcaODTuiiAqCDUWliAgqKAqK3HfnPvFkMnMbCAKy9/os150zZ848p8xdnO2Zc/8v6/+5EEIIIYQQQgghhBBSsfi/Mo+AEEIIIYQQQgghhJCiQleLEEIIIYQQQgghhFQ8/uNqvVk57836XwkhhBBCCCGEEEIIKYfkzhhn2dV6n3XJ9C6eEEIIIYQQQgghhJByyNsLO+hqEUIIIYQQQgghhJAKBl0tQgghhBBCCCGEEFLxoKtFCCGEEEIIIYQQQioedLUIIYQQQgghhBBCSMWDrhYhhBBCCCGEEEIIqXjQ1SKEEEIIIYQQQgghFQ+6WoQQQgghhBBCCCGk4kFXixBCCCGEEEIIIYRUPOhqEUIIIYQQQgghhJCKB10tQgghhBBCCCGEEFLxoKtFCCGElBjZWVFlHgOxTcXqo3OnNoYfWgXKPBJSPPJzr73OuVLmYRBCCCGfK3S1CCGEEEfJe3X1r11L5s/97tuBPXp1Dxk1vPeiX6fcux0uZ2dMG+70xRcD+nUp8ziJNSpcHzVpVA8BgzKPhBSDh/eO16pRvXo196jzW8s8GEIIIeSzhK4WIYQQ4hD7di8JaFBHLAYtK5fNlAwtv2qMQ29Pj7evr5d5tKXK65wrRw6snDV91Lo/5xXj8tvxB/9cOXvo4J45z/79Y+PCmc2Lfp3y/eQhJRXkk9SzO7b8NmHcgIvn/jUUSrWPLNbrIwOmq1WBMA6A8IN/SPct/316idyixB8TQgghpKJDV4sQQgixz9pVc5SN1Tig3qD+3caO7Pt1j1AfL4+4a39JniuXdk76bmDEsbVlHm1pE3NplzTFtMlDi3F5717t5fKsJxdUooerM1KCv2xUUkEuW/yD3OXQvhUqsVT7yGK9PjJguloVCOMAyM+9tnjB1Hmzxz5/erFEblHijwkhhBBS0aGrRQghhNgh/vo+mUy6OTtt37yg8O0NdQqzVnWYdPfo7fiDAJ8z0s7K56ePz6nMtxMO/Z2YcEil5L26FnNp19HDq1IfnbJ46xeZF6UcNU9+kvpPya9eROPwWUakHCKM1zlXjh/5U90RsV2L3n3s8OrM9PMFebGSDQVqy8d9cXfEkPfq6r+JDyOQ80HicXxOe3T68P4VF85uVhlwx792LZHZ+4ihYcj5OPm0xchR7MG/ll84szkz/V+X5+7Nw53at5DLL0dux+Uvn1/Gv+4uf7dw00b18fn+nXCV/31+HFoMMeBffHYwSJyd+cMIucvqFbOQU7bT0vaRAu0WG7MXocZe3Yse0Z5CtMiM3sTnm3EHDvy1DHks9pSxXtrlYIgn4tjaiOPrLLaVjYC1rha6PvzQKvSp8XK7A0nbL2dObjgbsUE7EmQU3Uk4jM8YLbjLlUs7MWb+GdiJx44cWClN7XhpJTsmVZkYAxgwJ4+uAUg0hpTz7FJ01I5D+1bcuLYPJaSnnJELpROBuq/UV9OGVyUd5eMuOItaJ946UuyBjQGAYKRM1NfxdrNYRwnP2mNCCCGEVFroahFCCCF2GNCvi0xWFy+YaiOb1oA48Ncy+dw3rKOcxSxUUjp3aCkpm9bN93B1UUvABvXvlput31V666Zf5OyyxT9IyrTJQyXl1Il1ONy49mc5PH1ivY9XNXw4d2oj0uOu/YWpr5xyqVr11/kT5fOu7YukHMz2O4W2UHfHtRHH18mpIYN6IAXVQeGuTlUlQ/OggJQHJ3H2z5Wzde9g truction\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n      (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80)\n      (< (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 50)\n      (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n      (< (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 9)\n      (> (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)\n      (< (measurement (snomed_concept \"Hemoglobin saturation with oxygen\" \"observable entity\") %) 94)\n  )\n  (check_for\n    ;; Pulse and breathing (unresponsive patient)\n    (clinical_finding (snomed_concept \"Absent pulse\" \"finding\"))\n    (clinical_finding (snomed_concept \"Gasping for breath\" \"finding\"))\n    (clinical_finding (snomed_concept \"Agonal respiration\" \"finding\"))\n    (clinical_finding (snomed_concept \"Apnea\" \"finding\"))\n\n    ;; Airway\n    (clinical_finding (snomed_concept \"Snoring\" \"finding\"))\n    (clinical_finding (snomed_concept \"Gurgling\" \"finding\"))\n    (clinical_finding (snomed_concept \"Noisy respiration\" \"finding\"))\n\n    ;; Breathing\n    (clinical_finding (snomed_concept \"Blue lips\" \"finding\"))\n    (clinical_finding (snomed_concept \"Blue tongue\" \"finding\"))\n    (clinical_finding (snomed_concept \"Dyspnea\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Hyperresonance\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Decreased breath sounds\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Chest pain\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Trachea displaced\" \"disorder\"))\n\n    ;; Circulation\n    (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Acute heart failure\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Swelling of lower limb\" \"finding\"))\n    (clinical_finding (snomed_concept \"Orthopnea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Dyspnea on exertion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Bleeding\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Asthenia\" \"finding\"))\n\n    ;; Level of consciousness: GCS <= 8\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 3\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 4\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 5\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 6\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 7\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 8\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable tension pneumothorax (emergency patient)\"\n  (diagnosis\n    (snomed_concept \"Tension pneumothorax\" \"disorder\")\n    probable\n  )\n  adult\n  ;; \"sudden breathlessness, more resonant/decreased breath sounds/pain on 1 side, deviated trachea\"\n  (and (clinical_finding (snomed_concept \"Dyspnea\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n       (or (clinical_finding (snomed_concept \"Hyperresonance\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Decreased breath sounds\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Chest pain\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n       )\n       (clinical_finding (snomed_concept \"Trachea displaced\" \"disorder\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable shock (emergency patient)\"\n  (diagnosis\n    (snomed_concept \"Shock\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Footnote 3: \"If SBP < 80, pulse >= 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely.\"\n  (and (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80)\n       (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n       (> (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)\n       (or (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n           (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n           (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n       )\n       (clinical_finding (snomed_concept \"Asthenia\" \"finding\"))\n  )\n)\n(system_priority_evaluation\n  \"Emergency: emergency patient unresponsive, pulseless or not breathing\"\n  adult\n  Emergency\n  (or (clinical_finding (snomed_concept \"Unresponsive\" \"finding\"))\n      (clinical_finding (snomed_concept \"Absent pulse\" \"finding\"))\n      (clinical_finding (snomed_concept \"Cardiac arrest\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Gasping for breath\" \"finding\"))\n      (clinical_finding (snomed_concept \"Agonal respiration\" \"finding\"))\n      (clinical_finding (snomed_concept \"Apnea\" \"finding\"))\n  )\n)\n(system_priority_evaluation\n  \"Emergency: emergency patient with airway, breathing, circulation or consciousness compromise\"\n  adult\n  Emergency\n  (or\n    ;; Airway obstructed (snoring, gurgling, noisy breathing)\n    (clinical_finding (snomed_concept \"Respiratory obstruction\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Snoring\" \"finding\"))\n    (clinical_finding (snomed_concept \"Gurgling\" \"finding\"))\n    (clinical_finding (snomed_concept \"Noisy respiration\" \"finding\"))\n    ;; Breathing: \"If difficulty breathing or oxygen saturation < 94%\"\n    (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n    (< (measurement (snomed_concept \"Hemoglobin saturation with oxygen\" \"observable entity\") %) 94)\n    (< (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 9)\n    (clinical_finding (snomed_concept \"Blue lips\" \"finding\"))\n    (clinical_finding (snomed_concept \"Blue tongue\" \"finding\"))\n    (active_condition (snomed_concept \"Tension pneumothorax\" \"disorder\"))\n    ;; Circulation: pulse < 50 and unstable\n    (and (< (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 50)\n         (or (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n             (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)\n             (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n             (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n             ;; acute heart failure, or its footnote 3 features (leg swelling with breathlessness worse lying down/with effort)\n             (clinical_finding (snomed_concept \"Acute heart failure\" \"disorder\"))\n             (and (clinical_finding (snomed_concept \"Swelling of lower limb\" \"finding\"))\n                  (or (clinical_finding (snomed_concept \"Orthopnea\" \"finding\"))\n                      (clinical_finding (snomed_concept \"Dyspnea on exertion\" \"finding\"))\n                  )\n             )\n         )\n    )\n    ;; Circulation: shock/SBP < 80, pulse >= 100 or heavy bleeding\n    (active_condition (snomed_concept \"Shock\" \"disorder\"))\n    (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80)\n    (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n    (clinical_finding (snomed_concept \"Bleeding\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    ;; Level of consciousness: GCS <= 8\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 3\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 4\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 5\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 6\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 7\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glasgow coma scale, 8\" \"finding\"))\n  )\n)\n", "rules": [{"atom": "task", "description": "Check for emergency patient airway, breathing and circulation signs", "ages": ["adult"], "raw": "(task \"Check for emergency patient airway, breathing and circulation signs\" \"adult\" (or (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unresponsive\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cardiac arrest\" \"disorder\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Respiratory obstruction\" \"disorder\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Difficulty breathing\" \"finding\")) (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80) (< (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 50) (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100) (< (me yngeal airway; intubate if airway not maintained\"]\n    ABC --> BR[\"Breathing: difficulty breathing or SpO₂ &lt; 94% → oxygen;<br/>RR &lt; 9 or blue lips/tongue → bag-valve-mask;<br/>sudden breathlessness, more resonant/decreased breath sounds/pain on 1 side,<br/>deviated trachea → <b>tension pneumothorax likely<\/b>\"]\n    ABC --> CIRC[\"Circulation: pulse &lt; 50 and unstable (BP &lt; 90/60, decreased consciousness,<br/>chest pain or acute heart failure³) → atropine;<br/>shock³/SBP &lt; 80, pulse ≥ 100 or heavy bleeding → IV fluids; stop bleeding\"]\n    ABC --> LOC[\"Level of consciousness: GCS; if GCS ≤ 8, intubate\"]\n    AIR & BR & CIRC & LOC --> REF[\"Manage further and refer urgently<br/>(pointers: decreased consciousness 18, injured 30, seizures 20, burns 31,<br/>bite/sting 29, fever 38, rash 82, anaphylaxis 28; other symptom → symptom page)\"]\n```\n\n¹ Life-limiting illness: consider whether to proceed. ³ (first) Acute heart failure: leg swelling, difficulty\nbreathing which worsens on lying down/with effort. ³ (second) If SBP < 80, pulse ≥ 100, respiratory rate > 30,\nconfusion/restlessness, weakness, **shock likely**. (The page numbers both footnotes \"3\".)\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Q1 = No (does not respond to voice or physical stimulation) | `Unresponsive` | trigger of `Check for emergency patient airway, breathing and circulation signs`; `Emergency: emergency patient unresponsive, pulseless or not breathing` |\n| Q2 = No pulse felt or unsure | `Absent pulse`, or `Cardiac arrest` (warning sign) | `Emergency: emergency patient unresponsive, pulseless or not breathing` |\n| Q3 = Gasping or not breathing | `Gasping for breath`, `Agonal respiration`, `Apnea` | `Emergency: emergency patient unresponsive, pulseless or not breathing` |\n| Q3 = Breathing well / Q1 = Yes | No rule of its own; the patient goes on to the ABC assessment, whose findings drive the second priority rule | — |\n| Airway obstructed (snoring, gurgling, noisy breathing) | `Respiratory obstruction` (warning sign) or `Snoring`, `Gurgling`, `Noisy respiration` | `Emergency: emergency patient with airway, breathing, circulation or consciousness compromise` |\n| Difficulty breathing or SpO₂ < 94% | `Difficulty breathing`, SpO₂ < 94 | same |\n| RR < 9 or blue lips/tongue | RR < 9, `Blue lips`, `Blue tongue` | same |\n| Tension pneumothorax likely | Sudden-onset dyspnoea **and** (hyperresonance, decreased breath sounds or chest pain, each unilateral) **and** `Trachea displaced` | `Diagnose probable tension pneumothorax (emergency patient)`, then `(active_condition Tension pneumothorax)` in the second priority rule |\n| Pulse < 50 and unstable | pulse < 50 **and** (SBP < 90 or DBP < 60, decreased consciousness, chest pain, `Acute heart failure`, or leg swelling **and** orthopnoea/dyspnoea on exertion from footnote 3) | second priority rule |\n| Shock³/SBP < 80, pulse ≥ 100 or heavy bleeding | `(active_condition Shock)` or SBP < 80, pulse ≥ 100, severe bleeding | second priority rule |\n| Shock likely (footnote) | SBP < 80 **and** pulse ≥ 100 **and** RR > 30 **and** (confusion [`Clouded consciousness` or `Acute confusion`] or restlessness) **and** weakness | `Diagnose probable shock (emergency patient)` |\n| GCS ≤ 8 | `Glasgow coma scale, 3` … `Glasgow coma scale, 8` findings | second priority rule |\n| Manage further and refer urgently | Management and cross-references only | not encoded |\n\n## Notes\n\n- Every action (CPR, AED, bag-valve-mask, airway manoeuvres, oxygen, atropine, fluids, intubation,\n  chest decompression, tourniquet, recovery position) is management and is not modelled.\n- Difficulty breathing is an Emergency criterion with SpO₂ < 94%, because the page lists them in one sentence (reconciler decision, unsettled; see remaining questions).\n", "questions": "# Page 16 – The emergency patient: remaining questions (final, reconciled)\n\n## Decisions made\n\n- **Base build.** Builder A's structure: one `check_for` task, two `probable` diagnosis rules\n  (tension pneumothorax, shock) and two `Emergency` priority rules (unresponsive / pulseless / not\n  breathing; ABC and consciousness compromise). Builder B's single priority rule repeated the\n  trigger as an `and` gate. Nearly every gate item was also in the inner `or`, so the gate did\n  almost nothing. It was dropped.\n- **Trigger.** \"The emergency patient\" is not a recorded complaint. The task fires on an `or` of the\n  page's entry points: `Unresponsive` (AVPU), the `Cardiac arrest` and `Respiratory obstruction`\n  warning signs, `Difficulty breathing` (the page's wording; `Dyspnea` is a descendant of it), and the\n  vital thresholds the page acts on (SBP < 80, pulse < 50, pulse ≥ 100, RR < 9, RR > 30,\n  SpO₂ < 94%). This is a broad trigger.\n- **Priority level: Emergency** (page title \"The emergency patient\"), rather than Urgent from the\n  header wording \"Give urgent attention\".\n- **Difficulty breathing is an Emergency criterion.** The page says \"If difficulty breathing or\n  oxygen saturation < 94%\" in one sentence, so both are kept (unsettled, see questions).\n- **Gasping or not breathing** → `Gasping for breath`, `Agonal respiration`, `Apnea`.\n- **Shock (decision for all pages).** \"shock³/SBP < 80\" is an `or` of `(active_condition Shock)` and\n  SBP < 80, on this page only. \"pulse ≥ 100\" and \"heavy bleeding\" in the same list are separate `or`\n  items (any-of reading).\n- **Shock likely (footnote 3, second).** \"If SBP < 80, pulse ≥ 100, respiratory rate > 30,\n  confusion/restlessness, weakness, shock likely\" is read as **all of** them, the same way both\n  builders read the tension pneumothorax list. Confusion is `Clouded consciousness` (AVPU \"Confused\")\n  or `Acute confusion` (warning sign \"Confusion\"). This rule fires less often than an any-of reading;\n  the priority rule still fires on SBP < 80 alone.\n- **Tension pneumothorax likely.** Sudden-onset dyspnoea **and** (hyperresonance, decreased breath\n  sounds or chest pain, each with `Unilateral`) **and** `Trachea displaced`.\n- **Pulse < 50 and unstable.** pulse < 50 **and** any of: SBP < 90 or DBP < 60, decreased\n  consciousness, chest pain, or acute heart failure. Acute heart failure is the `Acute heart failure`\n  disorder **or** its footnote 3 (first) picture: leg swelling **and** breathlessness that is worse\n  lying down (`Orthopnea`) or with effort (`Dyspnea on exertion`).\n- **BP < 90/60** is read as systolic < 90 or diastolic < 60 (Will's convention).\n- **GCS ≤ 8** is listed as the findings `Glasgow coma scale, 3` … `Glasgow coma scale, 8`.\n- The page numbers two footnotes \"3\" (acute heart failure; shock). Both are read as written.\n- All CPR, airway, oxygen, drug, fluid, intubation, decompression, bleeding-control and referral\n  steps are management and are not encoded. The pointer line (18, 30, 20, 31, 29, 38, 82, 28) is a\n  cross-reference only.\n\n## Could not model\n\n- **GCS as a measurement.** The language has no unit for a score, so there is no `measure` task for\n  GCS and no `(<= GCS 8)` comparison. The GCS 3–8 findings fire only if the app records a GCS total\n  as one of those findings. No anchor records them today, so for GCS this rule fires less often than\n  the page intends. Summing the component scores (motor/verbal/eye) can't be expressed.\n- \"No pulse felt **or unsure**\": uncertainty can't be recorded, so only `Absent pulse` is encoded.\n- \"If known heart problem or severe infection suspected\" changes only the fluid regimen\n  (management), so it is not encoded.\n- \"If neck injury suspected, use jaw-thrust\" and footnote 1 (life-limiting illness: consider whether\n  to proceed with CPR) are management decisions.\n\n## SNOMED gaps\n\n- There is no \"Confusion\" (finding). Used `Clouded consciousness` and `Acute confusion`.\n- There is no \"Weakness\" (finding). Used `Asthenia`.\n- There is no \"Tracheal deviation\" finding. Used `Trachea displaced` (disorder).\n- There are no precoordinated concepts for \"unilateral chest pain\", \"cyanosis of lips/tongue\" or\n  \"heavy bleeding\". Used `Chest pain` + `Unilateral`, `Blue lips`, `Blue tongue`, and\n  `Bleeding` + `Severe (severity modifier)`.\n- There is no \"gurgling respiration\" concept. Used `Gurgling` (finding).\n- \"More resonant\": used `Hyperresonance`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n1. Should difficulty breathing, SpO₂ < 94%, pulse ≥ 100 or RR < 9 **alone** make a patient an\n   Emergency, or are these only treatment triggers for a patient already identified as an emergency?\n   Who counts as \"the emergency patient\"?\n2. Is \"shock³/SBP < 80, pulse ≥ 100 or heavy bleeding\" an any-of list, or does pulse ≥ 100 qualify\n   SBP < 80?\n3. Does the shock footnote (\"SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness,\n   weakness, shock likely\") mean all of the signs (as encoded), any one of them, or a number of them?\n4. Tension pneumothorax: must sudden breathlessness, one-sided chest signs and a deviated trachea all\n   be present, and does \"on 1 side\" apply to resonance and breath sounds as well as pain?\n5. Acute heart failure (footnote 3): is leg swelling **plus** worsening breathlessness required (as\n   encoded), or is any one feature enough?\n6. Should this page's questions be asked of every patient with difficulty breathing or tachycardia,\n   or only of patients already flagged as emergencies?\n", "claims": [{"claim_id": "c001", "rule": "Check for emergency patient airway, breathing and circulation signs", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unresponsive\" \"finding\"))", "element_keys": ["p16-e6d6ad20", "p16-e64d521e"], "quote": "emergency patient Does the patient respond to voice or physical stimulation?"}, {"claim_id": "c002", "rule": "Check for emergency patient airway, breathing and  these inside an already-identified emergency patient. Bradycardia branch (pulse<50 and unstable with HF per footnote 3) is faithful; GCS 3–8 and heavy bleeding are faithful."}], "summary": "Most consequential: the ABC Emergency priority rule has no emergency-patient anchor and uses broad concepts, so 'Difficulty breathing' (ancestor of the common symptom Dyspnea), 'Respiratory obstruction' (includes nasal obstruction and OSA) and pulse ≥100 alone would make ordinary adults Emergency. The shock rule ANDs all five footnote signs, so it will rarely fire, and 'Clouded consciousness' and 'Gasping for breath' are poorer fits than Acute confusion and Agonal respiration. Most other conditions, including the tension pneumothorax rule, bradycardia-instability criteria and GCS ≤ 8, faithfully match the page."}], "scorecard": {"page": 16, "slug": "16-the-emergency-patient", "validation_ok": true, "builder_agreement": 0.755, "elements": 47, "elements_agreed": 35, "claims": 90, "claims_agreed": 71, "queue": 72, "queue_by_priority": {"low": 36, "high": 7, "medium": 29}, "missing_reports": [], "element_rows": [{"key": "p16-e6d6ad20", "id": "p16-rb1-e01", "box": 1, "status": "queue", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p16-e64d521e", "id": "p16-rb1-e02", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p16-d616c4fb", "id": "p16-rb1-e03", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p16-36bad2ae", "id": "p16-rb1-e04", "box": 1, "status": "queue", "scopes": {"in_scope": 1, "out_of_scope": 2}, "verdicts": {"correct": 1}}, {"key": "p16-ae4745ed", "id": "p16-rb1-e05", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p16-9bbf196a", "id": "p16-rb1-e06", "box": 1, "status": "queue", "scopes": {"borderline": 1, "out_of_scope": 2}, "verdicts": {"correct": 1}}, {"key": "p16-6df785a7", "id": "p16-rb1-e07", "box": 1, "status": "agreed", "scopes": {"o ium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "element", "priority": "high", "ref": "p16-c57722be", "text": "1If the patient has a life-limiting illness, consider whether or not to proceed. If CPR not needed in the palliative care patient, address the dying patient's needs 193. 2Lift chin forward with fingers under bony tips of jaw. 3Leg swelling, difficulty breathing which worsens on lying down/with effor", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "error", "parts_missing": null, "problem": "Shock part: the rule requires ALL five features at once (and SBP<80, pulse>=100, RR>30, (confusion or restlessness), weakness). The page's comma list is ambiguous, but the circulation box on the same page uses the same comma construction with an explicit 'or' ('If shock/SBP < 80, pulse >= 100 or heavy bleeding'), and clinically a patient with SBP < 80 and pulse >= 100 who is not weak or confused is still in shock. As written the probable shock diagnosis will almost never fire, so (active_condition Shock) in the priority rule is nearly dead; the Emergency level is still reached via the standalone SBP<80 and pulse>=100 criteria, so the triage consequence is limited, but the diagnosis is wrong in logic. Each concept choice is fine (Clouded consciousness / Acute confusion for confusion, Restlessness, Asthenia for weakness, RR > 30 bpm). Acute heart failure part: correctly expanded as (and Swelling of lower limb (or Orthopnea, Dyspnea on exertion)) inside the pulse<50 branch. Footnote 1 (palliative) and 2 (jaw-thrust) are management.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "error", "parts_missing": [], "problem": "Footnote 3 lists SBP<80, pulse>=100, RR>30, confusion/restlessness, weakness as signs for 'shock likely'; the rule requires ALL of them (including weakness) simultaneously, so it will almost never fire. A 'consider' list is probably meant as any-of or a k-of-n. Also footnote 3 (leg sw ail": [{"checker": "backward-1", "verdict": "faithful", "reason": "As c023.", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Page says \"pain on 1 side\" (not specifically chest pain); chest pain + unilateral qualifier is a narrowing.", "fix": "Acceptable; consider a plain pain-on-one-side concept.", "confidence": "low"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page says 'pain on 1 side' (chest implied); Chest pain+Unilateral is reasonable, but Pleuritic pain may be closer; minor.", "fix": "", "confidence": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "medium", "ref": "c051", "text": "Diagnose probable shock (emergency patient) :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Clouded consciousness\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "'confusion' = Clouded consciousness.", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Page says \"confusion\"; \"Clouded consciousness\" is a different concept, duplicating Acute confusion.", "fix": "Use only \"Acute confusion\" (or plain Confusion).", "confidence": "low"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page says 'confusion'; 'Clouded consciousness' is a different (broader disturbance-of-consciousness) concept and is the parent of 'Acute confusion', so the pair is redundant.", "fix": "Use only (snomed_concept \"Acute confusion\" \"finding\") (or Confusional state).", "confidence": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "low", "ref": "c052", "text": "Diagnose probable shock (emergency patient) :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Acute confusion\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "As c033: redundant narrower child of Clouded consciousness; 'acute' not on page.", "fix": "Drop.", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "medium", "ref": "c058", "text": "Emergency: emergency patient unresponsive, pulseless or not breathing :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cardiac arrest\" \"disorder\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Page says 'No pulse felt or unsure → Start CPR', never 'cardiac arrest'; the concept is an inference and duplicates Absent pulse (c057) in the same or.", "fix": "Keep (harmless) or drop; if kept, the trigger form in the task is the matching check.", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "\"Start CPR\" is a management step; the page never states cardiac arrest. Role is management-as-condition; Absent pulse already covers it.", "fix": "Remove Cardiac arrest from the priority rule or keep only as a documented inference.", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Quote 'Start CPR' is a management step, not a finding; Cardiac arrest is an inference from 'No pulse felt or unsure'. 'Unsure' (pulse uncertain) is not encoded.", "fix": "Cite p16-e4810de1 'No pulse felt or unsure'; consider an explicit pulse-uncertain finding if one exists.", "confidence": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "low", "ref": "c059", "text": "Emergency: emergency patient unresponsive, pulseless or not breathing :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Gasping for breath\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "'Gasping for breath' is a child of Dyspnea and means a breathless (often conscious) patient; the page's 'gasping' is agonal breathing in an unresponsive patient. Standalone it would make any gasping-for-breath dyspnoea Emergency.", "fix": "Keep Agonal respiration; drop Gasping for breath or anchor it to Unresponsive.", "confidence": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "low", "ref": "c060", "text": "Emergency: emergency patient unresponsive, pulseless or not breathing :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Agonal respiration\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "As c013.", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Page says only \"Gasping\"; \"Agonal respiration\" is added as a synonym, not on the page.", "fix": "Keep Gasping for breath only.", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "low", "ref": "c062", "text": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Respiratory obstruction\" \"disorder\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "'Respiratory obstruction' is too broad: its descendants include Obstructive sleep apnea syndrome, Nasal obstruction and Nasal sinus obstruction (via Upper respiratory tract obstruction), so a blocked nose or known OSA would fire Emergency; the page means an obstructed airway (snoring, gurgling, noisy breathing).", "fix": "Use (or (snomed_concept \"Partially obstructed airway\" \"disorder\") (snomed_concept \"Totally obstructed airway\" \"disorder\")) instead.", "confidence": "high"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "low", "ref": "c066", "text": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Difficulty breathing\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "'Difficulty breathing' is an ancestor of Dyspnea (common symptom), Labored breathing and Respiratory distress, so as a standalone Emergency criterion any adult recording dyspnea becomes Emergency; the page uses it only to start oxygen inside the emergency-patient pathway.", "fix": "Gate the priority rule on the emergency context, or use (clinical_finding (snomed_concept \"Dyspnea\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\"))) / Respiratory distress.", "confidence": "high"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "medium", "ref": "c083", "text": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise :: (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "Page lists 'pulse ≥ 100' as its own fluid criterion ('If shock/SBP < 80, pulse ≥ 100 or heavy bleeding'), so pulse ≥ 100 alone → Emergency is what the page says.", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Pulse >= 100 alone makes Emergency. Page lists it alongside SBP < 80 as shock features (footnote 3 / \"shock/SBP < 80, pulse >= 100\"); isolated tachycardia is not shown as an emergency.", "fix": "Make it part of an and with SBP < 80, or rely on the Shock diagnosis.", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page reads 'If shock/SBP < 80, pulse ≥ 100 or heavy bleeding' and footnote 3 lists SBP<80 and pulse≥100 together as shock features; as a standalone Emergency criterion, any adult with HR ≥100 (e.g. fever, anxiety) is triaged Emergency, which over-reads the page.", "fix": "Use (and SBP<80 pulse≥100) or rely on (active_condition Shock)/SBP<80; drop pulse ≥100 alone.", "confidence": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "claim", "priority": "low", "ref": "c084", "text": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Bleeding\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Same as c031: heavy bleeding is a fluid/tourniquet management trigger; reasonable as Emergency but an inference.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock (emergency patient)", "text": "Top-level 'and' of five features (SBP<80, pulse>=100, RR>30, confusion/restlessness, weakness) where the page's comma list most plausibly means a cluster of signs, as the same page's circulation box uses commas as 'or'. The diagnosis will almost never fire, and (active_condition Shock) in the priority rule is then nearly dead evidence. Consider SBP<80 anchored with any2/or of the remaining signs, and record the choice as a clinician question.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "text": "Flat 'or' with no emergency-context anchor. Snoring, Noisy respiration, Gurgling and Difficulty breathing each alone escalate to Emergency. The page lists snoring/gurgling/noisy breathing as signs of an obstructed airway in a patient already under 'Give urgent attention to the emergency patient'; a patient reporting habitual snoring, or mild dyspnoea from another page, would be triaged Emergency. The briefing's pattern is (and <presenting context> (or ...)); here the context could be Respiratory obstruction for the airway noises, or the builders should document why standalone is intended.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tension pneumothorax (emergency patient)", "text": "Deviated trachea is mandatory (top-level 'and'), so the rule cannot fire from sudden breathlessness plus unilateral signs alone. This is the literal reading of the comma list, but tracheal deviation is a late sign and the same page uses commas as 'or' elsewhere; a clinician should confirm. Low because the Emergency level is reached anyway through Difficulty breathing / SpO2 / RR.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Check for emergency patient airway, breathing and circulation signs", "text": "Trigger (due_to) omits findings that the page's red box treats as emergency presentations: Decreased level of consciousness / GCS <= 8, severe bleeding, and Absent pulse. A patient recorded as bleeding heavily or with GCS 7 but with vitals not yet entered would not trigger the ABC check. Also 'Difficulty breathing' (230145002) is not a SNOMED descendant of 'Dyspnea' (the recorded common symptom), so a recorded Dyspnea does not trigger this task or the Emergency rule; this follows the gold page-20 pattern, so it is a shared house issue rather than this page's error.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "text": "'Heavy bleeding' encoded as Bleeding + Severe (severity modifier). The shared warning sign named in the briefing is Bleeding + Uncontrolled; if the system records heavy bleeding under the warning-sign form, this criterion will not match it. Worth aligning or including both.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "high", "ref": "Diagnose probable shock (emergency patient)", "text": "All criteria ANDed incl. asthenia; page footnote reads as a list of signs. Also the priority rule triggers on active_condition Shock, so a too-strict diagnosis silently weakens the pathway.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "high", "ref": "Diagnose probable tension pneumothorax (emergency patient)", "text": "Requires sudden dyspnea AND deviated trachea AND one side sign; page lists them as features. Too strict; Emergency via this branch will rarely fire.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "text": "SBP<80 and pulse>=100 each alone trigger Emergency; the page pairs them in the shock footnote. Also pulse<50 branch includes chest pain and acute heart failure as 'unstable' which is right, but single check_for item 'Chest pain' (no qualifier) used for both this and unilateral chest pain.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Check for emergency patient airway, breathing and circulation signs", "text": "check_for contains Dyspnea on exertion, Asthenia, Swelling of lower limb etc. but not the diastolic BP measurement; trigger 'or' also lacks diastolic BP/unstable-pulse composite, so the task may not fire for isolated hypertension-free low-DBP bradycardia (pulse<50 already triggers, so minor).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Whole page", "text": "No possible/probable diagnosis for other items; page only has tension pneumothorax and shock 'likely', both present. No flowchart-level problems apart from 'unsure' pulse not representable.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "high", "ref": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "text": "The Emergency priority rule has no presenting-complaint anchor. The house standard says (and <presenting complaint> (or …)); here every item is a standalone trigger for any adult. Routine vitals or common symptoms alone give Emergency: pulse ≥ 100, SpO2 < 94, SBP < 80, Difficulty breathing. Any febrile patient with pulse 100 is classed Emergency. On the page these thresholds are management cues inside an already-identified emergency patient, and 'SBP < 80, pulse ≥ 100' is plausibly a definition of shock rather than two separate triggers.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "(task \"Check for emergency patient airway, breathing and circulation signs\")", "text": "The task's due_to fires the full emergency check_for list on isolated vitals such as pulse ≥ 100, RR > 30 or SpO2 < 94. This is the same over-triggering as problem 1, on the task side.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock (emergency patient)", "text": "The footnote's comma list is encoded as an AND of five criteria (SBP<80, pulse≥100, RR>30, confusion/restlessness, weakness). That is very restrictive, so the rule will rarely fire. In practice it adds nothing, because the priority rule already fires on SBP<80 or pulse≥100 alone. An any-N or (and SBP<80 (or …)) reading is arguably closer to the intent.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "text": "GCS ≤ 8 depends on the discrete 'Glasgow coma scale, N' findings being recorded, and nothing measures a total GCS. If GCS isn't recorded in that form, the criterion is dead.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "text": "Heavy bleeding is encoded as Bleeding + Severe; the existing warning sign uses Bleeding + Uncontrolled, so the two may not connect.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tension pneumothorax (emergency patient)", "text": "probable is right ('tension pneumothorax likely'). The and/or structure is a literal reading of 'If sudden breathlessness, more resonant/decreased breath sounds/pain on 1 side, deviated trachea': commas as and, slashes as or. That makes deviated trachea (a late sign) mandatory, so the rule will miss most tension pneumothoraces that a nurse would call from sudden breathlessness plus one-sided signs. The page's punctuation is genuinely ambiguous; a clinician should confirm whether the comma list is all-of or any-of (e.g. sudden breathlessness and any of the rest).", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock (emergency patient)", "text": "probable is right (footnote 3 'shock likely'). Requiring all five of SBP < 80, pulse ≥ 100, RR > 30, confusion/restlessness and weakness is the literal comma-as-and reading; the main text's 'If shock³/SBP < 80' treats SBP < 80 as the core of shock, so a patient with SBP 70, pulse 120 and RR 28 would not be labelled shock here. Triage is unaffected (SBP < 80 and pulse ≥ 100 each give Emergency on their own), so only the diagnosis label is at stake. Clinician to confirm the intended logic. Acute confusion (c052) is redundant.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tension pneumothorax (emergency patient)", "text": "Requires deviated trachea AND sudden dyspnea AND one-sided sign. Page lists the features as a series leading to 'tension pneumothorax likely' and does not say all are required; deviated trachea is a late sign, so the rule may be too strict.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "high", "ref": "Diagnose probable shock (emergency patient)", "text": "Ands all five footnote features (SBP<80, pulse>=100, RR>30, confusion/restlessness, weakness). Footnote 3 is a list ending 'shock likely' and does not require all; an and of five will rarely fire. Likely should be or / at-least-n.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Emergency: emergency patient unresponsive, pulseless or not breathing", "text": "Cardiac arrest is inferred from 'Start CPR' (management step); otherwise priority Emergency is justified by the red box.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "text": "Pulse >=100 alone triggers Emergency; page ties it to shock/SBP<80. Heavy bleeding alone and Decreased consciousness only within pulse<50 are fine. Remaining structure (pulse<50 and unstable) is faithful.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Check for emergency patient airway, breathing and circulation signs", "text": "Type and content fine (every red-box sign and discriminating finding is checked for). Trigger 'Respiratory obstruction' is over-broad (nasal obstruction, OSA); 'Clouded consciousness' duplicates/misnames 'confusion'; 'Gasping for breath' is a dyspnoea concept, not agonal gasping. Pulse 'unsure' branch not represented.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock (emergency patient)", "text": "Footnote 3 'If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely' is encoded as AND of all five, which almost never fires (a hypotensive tachycardic patient with RR 28 or no recorded weakness is not shock). APC comma lists of signs are usually 'any of'; a looser structure (e.g. SBP<80 and (pulse≥100 or RR>30 or confusion/restlessness or weakness), or any2) is closer. Clouded consciousness is also the wrong concept for 'confusion'.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "medium", "ref": "Emergency: emergency patient unresponsive, pulseless or not breathing", "text": "Emergency is justified (CPR / unresponsive). But 'Gasping for breath' (child of Dyspnea) as a standalone criterion makes breathless conscious patients Emergency; the page's gasping is agonal, which 'Agonal respiration' already covers. 'Cardiac arrest' is inferred rather than stated (acceptable).", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "rule", "priority": "high", "ref": "Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "text": "No emergency-patient anchor: the briefing pattern is (and <presenting complaint> (or …)), but this is a bare global (or …). Combined with broad concepts it over-triages any adult: 'Difficulty breathing' subsumes Dyspnea (a common symptom), 'Respiratory obstruction' subsumes nasal obstruction and OSA, pulse ≥100 alone, snoring alone. The page applies these inside an already-identified emergency patient. Bradycardia branch (pulse<50 and unstable with HF per footnote 3) is faithful; GCS 3–8 and heavy bleeding are faithful.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "trigger", "text": "A: (> RR 30)  vs  B: (none)", "detail": [{"choice": "A", "final": "(> (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)", "reason": "Footnote 3's \"respiratory rate > 30\" feeds the shock-likely rule, so the questions that rule needs should be asked when it is present.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "trigger", "text": "A: (>= pulse 100)  vs  B: (none)", "detail": [{"choice": "A", "final": "(>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)", "reason": "\"pulse ≥ 100\" is one of the Circulation column's conditions for acting, like SBP < 80, which both builds use as a trigger.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "trigger", "text": "A: Dyspnea  vs  B: Difficulty breathing (A narrower)", "detail": [{"choice": "B", "final": "(clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))", "reason": "The page says \"difficulty breathing\"; B's concept is the page's word, and Dyspnea is a descendant of it.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: Acute heart failure (disorder)  vs  B: its footnote features", "detail": [{"choice": "both", "final": "Acute heart failure, Swelling of lower limb, Orthopnea, Dyspnea on exertion", "reason": "The page names \"acute heart failure³\", and footnote 3 spells out leg swelling and difficulty breathing that worsens on lying down or with effort, so the concept and its features are all asked.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: Clouded consciousness  vs  B: Acute confusion (B narrower)", "detail": [{"choice": "both", "final": "(clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\")) and (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))", "reason": "\"confusion\" has no SNOMED term of its own; the app records it both as AVPU \"Confused\" (Clouded consciousness) and as the warning sign \"Confusion\" (Acute confusion).", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: Glasgow coma scale, 3 … 8  vs  B: (none; GCS judged not representable)", "detail": [{"choice": "A", "final": "(clinical_finding (snomed_concept \"Glasgow coma scale, N\" \"finding\")) for N = 3..8", "reason": "The page says \"If GCS ≤ 8\" in the red box; these six existing findings express it exactly, at the cost of firing only if a GCS total is recorded as one of them.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (none)  vs  B: Agonal respiration", "detail": [{"choice": "B", "final": "(clinical_finding (snomed_concept \"Agonal respiration\" \"finding\"))", "reason": "The \"Gasping or not breathing\" branch means agonal gasping in an unresponsive patient, alongside Gasping for breath.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (none)  vs  B: Swelling of lower limb, Orthopnea, Dyspnea on exertion", "detail": [{"choice": "B", "final": "the three footnote features", "reason": "Footnote 3 (first) lists exactly these features of acute heart failure; they are needed as evidence in the pulse < 50 instability criterion.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "medium", "ref": "priority_condition", "text": "A: Acute heart failure (disorder)  vs  B: (or Swelling of lower limb, Orthopnea, Dyspnea on exertion)", "detail": [{"choice": "new", "final": "(or (clinical_finding (snomed_concept \"Acute heart failure\" \"disorder\")) (and (clinical_finding (snomed_concept \"Swelling of lower limb\" \"finding\")) (or (clinical_finding (snomed_concept \"Orthopnea\" \"finding\")) (clinical_finding (snomed_concept \"Dyspnea on exertion\" \"finding\")))))", "reason": "The page names acute heart failure, and footnote 3 describes it as leg swelling with breathlessness that worsens lying down or with effort, one picture rather than three alternatives; B's any-of reading would count leg swelling alone.", "unsettled": true}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "priority_condition", "text": "A: Glasgow coma scale, 3 … 8  vs  B: (none)", "detail": [{"choice": "A", "final": "(clinical_finding (snomed_concept \"Glasgow coma scale, N\" \"finding\")) for N = 3..8", "reason": "The red box says \"If GCS ≤ 8, intubate patient\", one of the ABC/consciousness compromises the priority rule gathers.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "priority_condition", "text": "A: (none)  vs  B: an entry gate (and <Unresponsive, Cardiac arrest, Respiratory obstruction, Difficulty breathing, SpO2 < 94, RR < 9, SBP < 80, pulse < 50> (or …))", "detail": [{"choice": "neither", "final": "", "reason": "The page doesn't define \"the emergency patient\". Almost every gate item also appears in the inner or, so the gate repeated the trigger without restricting anything; A's ungated form is kept.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "priority_condition", "text": "A: (none)  vs  B: Agonal respiration", "detail": [{"choice": "B", "final": "(clinical_finding (snomed_concept \"Agonal respiration\" \"finding\"))", "reason": "It belongs to \"Gasping or not breathing\" in the first priority rule.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "medium", "ref": "priority_condition", "text": "A: (none; difficulty breathing alone deliberately excluded)  vs  B: Difficulty breathing", "detail": [{"choice": "B", "final": "(clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))", "reason": "The page puts \"If difficulty breathing or oxygen saturation < 94%\" in one sentence, and both builds already include SpO2 < 94; leaving out its partner would be a clinical judgment the page doesn't make. It makes any difficulty breathing an Emergency.", "unsettled": true}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "diagnosis_condition", "text": "A: Clouded consciousness  vs  B: Acute confusion (shock likely)", "detail": [{"choice": "both", "final": "(or Clouded consciousness, Acute confusion, Restlessness)", "reason": "\"confusion/restlessness\": both recorded forms of confusion are or-ed with restlessness.", "unsettled": false}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "medium", "ref": "diagnosis_condition", "text": "Structure of shock likely: A: (and SBP < 80, pulse ≥ 100, RR > 30, confusion/restlessness, weakness)  vs  B: (or …)", "detail": [{"choice": "A", "final": "(and (< SBP 80) (>= pulse 100) (> RR 30) (or Clouded consciousness, Acute confusion, Restlessness) Asthenia)", "reason": "The footnote lists signs with no \"or\" (unlike the \"chest pain or acute heart failure\" list) ending in \"shock likely\", the same shape as the tension pneumothorax list both builders read as all-of. B's any-of reading makes pulse ≥ 100 alone probable shock.", "unsettled": true}]}, {"page": 16, "slug": "16-the-emergency-patient", "kind": "build_disagreement", "priority": "low", "ref": "priority_condition", "text": "Structure: A: two Emergency rules  vs  B: one", "detail": [{"choice": "A", "final": "Emergency: emergency patient unresponsive, pulseless or not breathing; Emergency: emergency patient with airway, breathing, circulation or consciousness compromise", "reason": "The page has the flowchart's top branches (no response, no pulse, gasping) and the ABC columns as two distinct stages; the split follows them and keeps each rule's description specific.", "unsettled": false}]}], "concepts": {"Unresponsive|finding": {"resolves": true, "id": "422768004", "descendants": 3, "parents": ["Consciousness and/or awareness finding (finding)"]}, "Cardiac arrest|disorder": {"resolves": true, "id": "410429000", "descendants": 36, "parents": ["Cardiac arrhythmia (disorder)"]}, "Respiratory obstruction|disorder": {"resolves": true, "id": "79688008", "descendants": 73, "parents": ["Disorder of respiratory system (disorder)"]}, "Difficulty breathing|finding": {"resolves": true, "id": "230145002", "descendants": 61, "parents": ["Finding of ease of respiration (finding)"]}, "Systolic blood pressure|observable entity": {"resolves": true, "id": "271649006", "descendants": 9, "parents": ["Blood pressure (observable entity)", "Vascular measure (observable entity)"]}, "Pulse, function|observable entity": {"resolves": true, "id": "8499008", "descendants": 18, "parents": ["Cardiovascular function (observable entity)"]}, "Respiratory rate|observable entity": {"resolves": true, "id": "86290005", "descendants": 2, "parents": ["Respiratory measure (observable entity)"]}, "Hemoglobin saturation with oxygen|observable entity": {"resolves": true, "id": "103228002", "descendants": 11, "parents": ["Hematologic function (observable entity)", "Observable related to oxygenation status (observable entity)"]}, "Absent pulse|finding": {"resolves": true, "id": "54518005", "descendants": 23, "parents": ["Pulse finding (finding)"]}, "Gasping for breath|finding": {"resolves": true, "id": "23141003", "descendants": 0, "parents": ["Dyspnea (finding)", "Abnormal respiratory rhythm (finding)"]}, "Agonal respiration|finding": {"resolves": true, "id": "430546009", "descendants <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.

    const ch = src[i];

    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }

}

    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
