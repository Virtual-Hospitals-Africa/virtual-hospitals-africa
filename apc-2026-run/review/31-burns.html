": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with burn/s and any of:", "section_y": 115.4, "indent": 0, "parent": null, "text": "4.5%", "bbox": [525.2, 240.3, 542.1, 249.8], "key": "p31-3d7c0be4"}, {"id": "p31-rb1-e28", "page": 31, "box": 1, "kind_hint": "other", "section": "How to calculate %TBSA of burn", "section_y": 133.1, "indent": 0, "parent": null, "text": "4.5%", "bbox": [610.3, 240.3, 627.2, 249.8], "key": "p31-bc9a74b1"}, {"id": "p31-rb1-e29", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 2, "parent": "p31-rb1-e23", "text": "If > 10% TBSA:", "bbox": [57.1, 259.4, 118.0, 270.2], "key": "p31-798dad6b"}, {"id": "p31-rb1-e30", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 3, "parent": "p31-rb1-e29", "text": "If shock1/systolic BP < 80, give sodium chloride 0.9% 1L IV rapidly. Repeat until systolic BP > 80.", "bbox": [62.7, 269.4, 433.8, 280.2], "key": "p31-00270aee"}, {"id": "p31-rb1-e31", "page": 31, "box": 1, "kind_hint": "other", "section": "How to calculate %TBSA of burn", "section_y": 133.1, "indent": 0, "parent": null, "text": "1%", "bbox": [570.5, 268.6, 579.9, 276.9], "key": "p31-743363fd"}, {"id": "p31-rb1-e32", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 3, "parent": "p31-rb1-e29", "text": "Also give sodium chloride 0.9% IV 4mL x weight (kg) x % TBSA over 24 hours. Give half this volume in first 8 hours from time of burn. Calculate the hourly volume (mL) = total volume (mL) ÷ 2 ÷ 8.", "bbox": [62.7, 279.4, 475.0, 300.2], "key": "p31-72e8d62e"}, {"id": "p31-rb1-e33", "page": 31, "box": 1, "kind_hint": "other", "section": "How to calculate %TBSA of burn", "section_y": 133.1, "indent": 0, "parent": null, "text": "9%", "bbox": [702.8, 286.1, 713.4, 295.4], "key": "p31-4a1707af"}, {"id": "p31-rb1-e34", "page": 31, "box": 1, "kind_hint": "other", "section": "How to calculate %TBSA of burn", "section_y": 133.1, "indent": 0, "parent": null, "text": "9%", "bbox": [721.1, 286.1, 731.7, 295.4], "key": "p31-db0b6d06"}, {"id": "p31-rb1-e35", "page": 31, "box": 1, "kind_hint": "other", "section": "How to calculate %TBSA of burn", "section_y": 133.1, "indent": 0, "parent": null, "text": "9%", "bbox": [560.7, 288.0, 571.4, 297.5], "key": "p31-7d382df2"}, {"id": "p31-rb1-e36", "page": 31, "box": 1, "kind_hint": "other", "section": "How to calculate %TBSA of burn", "section_y": 133.1, "indent": 0, "parent": null, "text": "9%", "bbox": [580.6, 288.0, 591.3, 297.5], "key": "p31-79746519"}, {"id": "p31-rb1-e37", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 2, "parent": "p31-rb1-e23", "text": "Insert a urinary catheter and document urine output every hour.", "bbox": [57.1, 299.4, 307.0, 310.2], "key": "p31-4b439d55"}, {"id": "p31-rb1-e38", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 1, "parent": null, "text": "Give paracetamol 500mg-1g orally 4-6 hourly (max 4g/24 hours). If pain severe, give morphine 3-10mg slow IV2.", "bbox": [51.4, 309.4, 484.9, 320.2], "key": "p31-9e591667"}, {"id": "p31-rb1-e39", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 1, "parent": null, "text": "If other injuries, manage 30.", "bbox": [51.4, 319.4, 173.5, 330.2], "key": "p31-f8ec9f63"}, {"id": "p31-rb1-e40", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 1, "parent": null, "text": "Clean and dress burn gently:", "bbox": [51.4, 329.4, 168.2, 340.2], "key": "p31-fcd562e6"}, {"id": "p31-rb1-e41", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 2, "parent": "p31-rb1-e40", "text": "Remove loose/dead skin and clean burn with chlorhexidine 0.05% or sodium chloride 0.9%.", "bbox": [57.1, 339.4, 424.4, 350.2], "key": "p31-fe043c49"}, {"id": "p31-rb1-e42", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 2, "parent": "p31-rb1-e40", "text": "If full thickness or > 10% TBSA burn, apply paraffin gauze and cover with plastic wrap.", "bbox": [57.1, 349.4, 387.4, 360.2], "key": "p31-e1ece3e5"}, {"id": "p31-rb1-e43", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 2, "parent": "p31-rb1-e40", "text": "If hospital transfer delayed > 12 hours, apply paraffin gauze and cover with dry gauze and bandage.", "bbox": [57.1, 359.4, 441.1, 370.2], "key": "p31-f0b31314"}, {"id": "p31-rb1-e44", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 2, "parent": "p31-rb1-e40", "text": "If none of above, apply hydrogel burn dressing (e.g. Burnshield®) and cover with bandage. If not available, use a non-adherent dressing or wrap in clean, dry sheet and blanket.", "bbox": [57.1, 369.4, 488.1, 390.2], "key": "p31-e098770c"}, {"id": "p31-rb1-e45", "page": 31, "box": 1, "kind_hint": "other", "section": "How to calculate %TBSA of burn", "section_y": 133.1, "indent": 0, "parent": null, "text": "The patient's open palm (including fingers) represents 1% TBSA.", "bbox": [550.0, 385.5, 748.0, 394.0], "key": "p31-2633a01f"}, {"id": "p31-rb1-e46", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 1, "parent": null, "text": "Give tetanus toxoid 0.5mL IM if none in past 5 years.", "bbox": [51.4, 389.4, 262.0, 400.2], "key": "p31-733939d4"}, {"id": "p31-rb1-e47", "page": 31, "box": 1, "kind_hint": "other", "section": "How to calculate %TBSA of burn", "section_y": 133.1, "indent": 0, "parent": null, "text": "Exclude simple redness from calculation.", "bbox": [585.3, 393.5, 710.8, 402.0], "key": "p31-d815c7e4"}, {"id": "p31-rb1-e48", "page": 31, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 189.2, "indent": 1, "parent": null, "text": "While awaiting transport, monitor BP, pulse, respiratory rate, oxygen saturation, level of consciousness and urine output hourly.", "bbox": [51.4, 399.4, 486.5, 420.2], "key": "p31-fb4a6e65"}, {"id": "p31-out-e01", "page": 31, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "BURNS", "bbox": [392.4, 48.5, 449.5, 70.8], "key": "p31-04a07887"}, {"id": "p31-out-e02", "page": 31, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Calculate the percentage total body surface area (% TBSA) burnt using the figure below.", "bbox": [260.5, 89.5, 581.4, 99.7], "key": "p31-0dfc3aef"}, {"id": "p31-out-e03", "page": 31, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with burn/s not needing urgent attention • Cool burn < 3 hours old with cool tap water or wet towel for 30 minutes and give single dose paracetamol 1g for pain before cleaning wound. • Remove loose/dead skin and gently clean burn with chlorhexidine 0.05% or sodium chloride 0.9%. Then cover with paraffin gauze dressing. • Give tetanus toxoid 0.5mL IM if none in past 5 years. • If cigarette burns, burn with specific shape (e.g. iron, grid, knife/fork, car cigarette lighter, light bulb), repeated/unexplained burns/other unexplained injuries, consider abuse 33 and self-harm 34. • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed for up to 5 days. • Review daily until burn healed: - Dress burn with paraffin gauze dressing. If signs of infection (redness, swelling), apply povidone iodine 5% cream daily. - If severe infection (extensive redness or swelling, foul-smell, pus or temperature ≥ 38°C), pain despite medication or burn not healed after 2 weeks, refer.", "bbox": [51.0, 435.9, 785.2, 527.1], "key": "p31-c4a41afb"}, {"id": "p31-out-e04", "page": 31, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely. 2Dilute 10mg morphine with 9mL of sodium chloride 0.9%. Give diluted morphine 3mL IV over 3 minutes (1mL/minute). If needed, give another 1mL/min until pain improved, up to 10mL. Stop if BP drops < 90/60.", "bbox": [34.0, 534.8, 794.3, 551.8], "key": "p31-b44f674a"}], "boxes": [{"box": 1, "rect": [35.5, 110.4, 806.4, 425.4]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAKRCAIAAABhn+kQAAAACXBIWXMAABcSAAAXEgFnn9JSAAPuTUlEQVR4nOydh1cUvfv2f3/Ie873camKIFZURMXee0Us2BvYsPeGvRfEhr0hdkQQQURRARFBURTsKCqiYq/7Xrs3xjizO7tgoXjnfA5nJ5NJ7mQyk+Qiyfzf8/9nyzAMwzAMwzAMwzAMwzCli/8rdgsYhmEYhmEYhmEYhmEYprCwqsUwDMMwDMMwDMMwDMOUPn5StT6nHvuSdYphGIZhGIZhGIZhGIZhSiAfDgWZVrW+Pk/Qf77GMAzDMAzDMAzDMAzDMCWQT/EhrGoxDMMwDMMwDMMwDMMwpQxWtRiGYRiGYRiGYRiGYZjSB6taDMMwDMMwDMMwDMMwTOmDVS2GYRiGYRiGYRiGYRim9MGqFsMwDMMwDMMwDMMwDFP6YFWLYRiGYRiGYRiGYRiGKX2wqsUwDMMwDMMwDMMwDMOUPljVYhiGYRiGYRiGYRiGYUofrGoxDMMwDMMwDMMwDMMwpQ9WtRiGYRiGYRiGYRiGYZjSB6taDMMwTKnk49uUd/mXit0MRoP8vMSvH9OK3QwruXblSMTxjeD5k/hiN8Ykr55fLHYb1Fh8Ej+8uUwFm3h+n8XYHt2PpcCZN04Ue9b+Pp/eXaHsXzy3p9iN0QDPdWT4xrWrpm0PXoDHvNjtYRiGYf5lWNViGIZhSiixp7atXjF1tJ+PV9fWwwb3mDtz5Pmzu+nUvayoKpUqVizvUMLHfv8yxw4HOtjauLtVzc8rHT2K8f4DdP/7HxDVrOTw9WNa6+YNbMuVWx84q9iNkbHmSXx0P5YKtlvnlhYjPBiyigIvWzyxWHKE6tq4QZ3+Pp2LJfVXzy9S9tu3aVIsBljDm5dJbVo0JDvBgzvRxW4SwzAM8y/DqhbDMAxT4rhy6WCn9s3EqEnQt3cnChARtoF81q2eUezW/mniz+xauXTy1ElDi3Dtk+y4kN3Lx/sPuHD2h+iQcS1s8/q5wwb3+I16k9rIGVN96R5dTgz97WViMl+/aHDJUbXUuXv+JN62XDnY1se7w29J4nfVAfWTqI65dKlaxw4HIvXZM0YUS+qlQtWaNd2PjHRytG/XuvHL3AvFbhLDMAzzL8OqFsMwDFOySE0+ZG+jo1FTVVfn3 \"Burn any degree involving 80-89 percent of body surface\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Burn any degree involving 90 percent OR more of body surface\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Over 70 percent body burnt\" \"disorder\"))\n\n    ;; Site of burn\n    (clinical_finding (snomed_concept \"Burn of chest wall\" \"disorder\") (qualifier (snomed_concept \"Circumferential\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Burn of upper limb\" \"disorder\") (qualifier (snomed_concept \"Circumferential\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Burn of lower limb\" \"disorder\") (qualifier (snomed_concept \"Circumferential\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Burn of face\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Burn of hand\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Burn of foot\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Burn of genitalia\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Burn\" \"disorder\") (finding_site (snomed_concept \"Joint structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Burn of neck\" \"disorder\"))\n\n    ;; Inhalation injury\n    (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Hoarse\" \"finding\"))\n    (clinical_finding (snomed_concept \"Stridor\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of color of sputum\" \"finding\") (qualifier (snomed_concept \"Black color\" \"qualifier value\")))\n\n    ;; Shock\n    (clinical_finding (snomed_concept \"Shock\" \"disorder\"))\n\n    ;; Other injury (Burn is_a Traumatic injury, so burn records are excluded)\n    (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\") (excluding (clinical_finding (snomed_concept \"Burn\" \"disorder\"))))\n\n    ;; Abuse or self-harm\n    (clinical_finding (snomed_concept \"Cigarette burn\" \"disorder\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable inhalation injury in patient with burns\"\n  (diagnosis\n    (snomed_concept \"Injury to respiratory system due to inhaled substance\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Burn\" \"disorder\"))\n    (or (clinical_finding (snomed_concept \"Burn of face\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Burn of neck\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n        (clinical_finding (snomed_concept \"Hoarse\" \"finding\"))\n        (clinical_finding (snomed_concept \"Stridor\" \"finding\"))\n        (clinical_finding (snomed_concept \"Finding of color of sputum\" \"finding\") (qualifier (snomed_concept \"Black color\" \"qualifier value\")))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Consider abuse in patient with cigarette burns\"\n  (diagnosis\n    (snomed_concept \"Victim of abuse\" \"finding\")\n    possible\n  )\n  adult\n  (clinical_finding (snomed_concept \"Cigarette burn\" \"disorder\"))\n)\n(system_diagnosis_rule\n  \"Consider self-harm in patient with cigarette burns\"\n  (diagnosis\n    (snomed_concept \"Self-injurious behavior\" \"finding\")\n    possible\n  )\n  adult\n  (clinical_finding (snomed_concept \"Cigarette burn\" \"disorder\"))\n)\n(system_priority_evaluation\n  \"Urgent: burns with urgent features\"\n  adult\n  Urgent\n  (and\n    (clinical_finding (snomed_concept \"Burn\" \"disorder\"))\n    (or\n      (clinical_finding (snomed_concept \"Drowsy\" \"finding\"))\n      (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n      (clinical_finding (snomed_concept \"Electrical burn\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Chemical burn\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Full thickness burn\" \"disorder\"))\n      (and\n        (clinical_finding (snomed_concept \"Partial thickness burn\" \"disorder\"))\n        (or (clinical_finding (snomed_concept \"Burn any degree involving 10-19 percent of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Burn any degree involving 20-29 percent of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Burn any degree involving 30-39 percent of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Burn any degree involving 40-49 percent of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Burn any degree involving 50-59 percent of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Burn any degree involving 60-69 percent of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Burn any degree involving 70-79 percent of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Burn any degree involving 80-89 percent of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Burn any degree involving 90 percent OR more of body surface\" \"disorder\"))\n            (clinical_finding (snomed_concept \"Over 70 percent body burnt\" \"disorder\"))\n        )\n      )\n      (active_condition (snomed_concept \"Injury to respiratory system due to inhaled substance\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Burn of chest wall\" \"disorder\") (qualifier (snomed_concept \"Circumferential\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Burn of upper limb\" \"disorder\") (qualifier (snomed_concept \"Circumferential\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Burn of lower limb\" \"disorder\") (qualifier (snomed_concept \"Circumferential\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Burn of face\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Burn of hand\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Burn of foot\" \"d snomed_concept \"Black color\" \"qualifier value\")))"], "both": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Burn of face\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Burn of neck\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Burn\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cigarette burn\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cigarette burn\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Difficulty breathing\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hoarse\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stridor\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": ["(diagnosis (snomed_concept \"Adult victim of abuse\" \"finding\") possible)"], "only_B": ["(diagnosis (snomed_concept \"Victim of abuse\" \"finding\") possible)"], "both": ["(diagnosis (snomed_concept \"Injury to respiratory system due to inhaled substance\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Self-injurious behavior\" \"finding\") possible)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Adult victim of abuse\" \"finding\") possible)", "B": "(diagnosis (snomed_concept \"Victim of abuse\" \"finding\") possible)", "relation": "A_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": null, "questions": "# Page 31 – Burns: remaining questions\n\nNo flowchart file: the page has a red box and an \"approach\" list, with no Yes/No branches or multi-step algorithm.\n\n## Decisions made\n\n- **Trigger.** `(clinical_finding Burn)` (the \"Burn Other\" warning-sign form). Recorded burn warning signs (facial, chemical, circumferential) are descendants, so they trigger the check too.\n- **Priority level.** `Urgent`, because the page says \"Give urgent attention\". Several of the same burns carry Emergency or Very urgent as warning signs (facial, inhalation, chemical, circumferential). Those still apply through `warning_signs.ts`; this page does not escalate them.\n- **Shock.** Encoded as the page writes it: `(or (clinical_finding Shock) (< SBP 80))` (the decision for all pages). Footnote 1 (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely\") is not built into a probable-shock rule. It is a general shock definition, and it does not say whether one sign or all of them are needed.\n- **Inhalation injury likely.** This is a `probable` rule for \"Injury to respiratory system due to inhaled substance\" (the parent of smoke and hot-gas inhalation injury): Burn AND any of face burn, neck burn, difficulty breathing, hoarse, stridor or black sputum. The priority rule uses `(active_condition …)` for it.\n- **Circumferential burn of chest/limbs.** Encoded as Burn of chest wall, Burn of upper limb or Burn of lower limb, each with the `Circumferential` qualifier. This follows the page's site restriction. The broader warning-sign form `Burn + Circumferential` (no site) does not match these.\n- **Drowsy or confused.** Drowsy (finding) or Clouded consciousness (finding), VHA's usual form for confusion.\n- **Burn to joint.** `Burn` with `finding_site Joint structure`, because there is no precoordinated \"Burn of joint\".\n- **Consider abuse / self-harm.** These are two `possible` rules, Victim of abuse and Self-injurious behavior, triggered by Cigarette burn, the only cue with a concept.\n\n- **Other injury.** `Traumatic injury` excluding `Burn` (taken from build A at reconciliation). `Burn` is_a `Traumatic injury`, so the plain concept would make every burn urgent; `excluding` removes burn records, so a separately recorded non-burn injury matches.\n- **Drowsy or confused, AVPU.** `Clouded consciousness` subsumes `Acute confusion` (the Confusion warning sign), so both the warning-sign and AVPU \"Confused\" forms match.\n\n## Could not model\n\n- **\"> 10% TBSA\".** The language has no % TBSA observable (\"Body surface area\" is in m²), so there is no `measure` task for \"Calculate the % TBSA\". Instead, the rule requires Partial thickness burn AND one of SNOMED's \"Burn any degree involving N percent of body surface\" bands from 10-19 % upward (or \"Over 70 percent body burnt\"). The 10-19 band includes exactly 10 %, so the rule fires at 10 %, where the page says > 10 %, which is slightly **more often** than the page intends. The bands also count burns of any degree. The page's figure excludes simple redness, so that is close to partial-plus-full thickness.\n- **Abuse cues** \"burn with specific shape (iron, grid, …)\" and \"repeated/unexplained burns/other unexplained injuries\" have no concepts. The abuse and self-harm rules fire **less often** than the page intends.\n- Everything under \"Manage and refer urgently\", the % TBSA figure, and the non-urgent approach list (including the signs of infection used for review and referral) are management or figure content.\n\n## SNOMED gaps\n\n- \"Other injury\" (an injury other than the burn): no concept. Substitute: `Traumatic injury` excluding `Burn`.\n- \"Black sputum\": no concept. Substitute: `Finding of color of sputum` + qualifier `Black color`.\n- \"Burn of joint\": no concept. Substitute: `Burn` + `finding_site Joint structure`.\n- \"% TBSA burnt\" observable: none. Substitute: the SNOMED percentage-band disorders (see above).\n- Burn with a specific shape, repeated or unexplained burns: no concept. Not encoded.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the inhalation-injury signs require the patient to have a burn (as encoded), given the page is about patients with burns?\n\n- Is the band approach for \"> 10 % TBSA\" acceptable? It counts exactly 10 % and burns of any depth. Would you prefer a % TBSA observable to be added to the language?\n- \"Other injury\" is encoded as Traumatic injury excluding Burn. Should it also exclude inhalation injury (Injury to respiratory system due to inhaled substance), which is a separate criterion on this page? Is a separate trauma finding (page 30) the intended record?\n- Should the warning-sign `Burn + Circumferential` (no site) count here as well? It is broader than \"chest/limbs\".\n- Should a directly recorded \"Inhalation burn due to hot gas\" warning sign also count as \"inhalation injury likely\"? This page lists only the clinical signs.\n- Should footnote 1's signs (pulse ≥ 100, RR > 30, confusion/restlessness, weakness) define shock on this page, and with \"any\" or \"all\" logic?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent burn features", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Burn\" \"disorder\"))", "element_keys": ["p31-53beb9c2"], "quote": "burn/s"}, {"claim_id": "c002", "rule": "Check for urgent burn features", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Drowsy\" \"finding\"))", "element_keys": ["p31-06449a03"], "quote": "Drowsy"}, {"claim_id": "c003", "rule": "Check for urgent burn features", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Clouded consciousness\" \"finding\"))", "element_keys": ["p31-06449a03"], "quote": "confused"}, {"claim_id": "c004", "rule": "Check for urgent burn features", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Electrical burn\" \"disorder\"))", "element_keys": ["p31-e71bca1c"], "quote": "Electric"}, {"claim_id": "c005", "rule": "Check for urgent b "medium", "ref": "Urgent: burns with urgent features", "text": "Every red-box item is at Urgent, but VHA's warning_signs already carry higher levels for several of them: 'Burn of face' and inhalation burn are Emergency, 'Chemical burn', circumferential burn and 'Burn Over 20%' are Very urgent. The briefing says to use the level the corresponding warning sign already carries. The page's own wording ('urgent attention') justifies Urgent, so this is a house-standard mismatch rather than a page error, but the rule will under-prioritise relative to the warning-signs page.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 31, "slug": "31-burns", "kind": "rule", "priority": "medium", "ref": "Urgent: burns with urgent features", "text": "The footnote defining shock ('shock likely' if SBP < 80, pulse >= 100, RR > 30, confusion/restlessness, weakness) is not encoded as a probable Shock rule; the priority rule only fires on shock if the nurse records 'Shock' directly or SBP < 80. Pulse >= 100, RR > 30, restlessness and weakness never contribute.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 31, "slug": "31-burns", "kind": "rule", "priority": "medium", "ref": "Consider abuse / Consider self-harm", "text": "Both possible rules fire on 'Cigarette burn' only; the page's other three triggers (burn with a specific shape, repeated/unexplained burns, other unexplained injuries) are dropped without any approximation such as 'Non-accidental injury' (disorder), which exists in SNOMED.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 31, "slug": "31-burns", "kind": "rule", "priority": "medium", "ref": "Urgent: burns with urgent features", "text": "Circumferential burn is encoded as three site-specific forms (chest wall / upper limb / lower limb + Circumferential). VHA's 'Burn Circumferential' warning sign records the general form (Burn + Circumferential), which is not a descendant of any of the three, so a burn recorded through the warning-signs page will not satisfy this rule. Using (Burn + Circumferential) would match both the general record and the site-specific ones.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 31, "slug": "31-burns", "kind": "rule", "priority": "medium", "ref": "Urgent: burns with urgent features", "text": "Inhalation injury is only accepted as (active_condition ...). VHA's 'Burn Inhalation' warning sign records (clinical_finding 'Inhalation burn due to hot gas'), which this rule ignores; adding that clinical_finding (or the parent) to the or-list would close the gap. Low because the warning sign already carries Emergency on its own.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 31, "slug": "31-burns", "kind": "rule", "priority": "medium", "ref": "Check for urgent burn features", "text": "'Cigarette burn' sits in the 'Check for urgent burn features' task although it is a non-urgent-pathway finding; cosmetic, but the task description misleads. 'Over 70 percent body burnt' in the TBSA list is redundant with the 70-79/80-89/90+ bands, and the 10-19 band admits exactly 10% where the page says > 10%.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 31, "slug": "31-burns", "kind": "rule", "priority": "medium", "ref": "Urgent: burns with urgent features", "text": "Depends on active_condition of a derived probable diagnosis for neck burn, breathing difficulty, hoarseness, stridor, black sputum; if derived diagnoses are not visible to priority evaluation these are lost.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 31, "slug": "31-burns", "kind": "rule", "priority": "medium", "ref": "Urgent: burns with urgent features", "text": "Percent-band concepts are any-degree and overlapping (Over 70 percent vs 70-79 etc.); 10-19 includes 10% though page says >10%.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 31, "slug": "31-burns", "kind": "rule", "priority":   get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },

// ---------- banners ----------
function renderBanners() {
  const b = [];

  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {

document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];

    <div class="chips">${chips}</div>

    ${reasons ? `<div class="detail">${reasons}</div>` : ""}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {

document.addEventListener("click", e => {

// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes

function rulesNamed(ref) {

function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
