 urea, sodium, calcium and review results. • If focal seizures or new seizures after meningitis, stroke or head injury, discuss with specialist. • If patient had ≥ 2 definite seizures with no identifiable cause, doctor to consider epilepsy and give routine care 167.", "bbox": [158.2, 363.1, 524.4, 403.3], "key": "p21-d4fe13b2"}, {"id": "p21-out-e21", "page": 21, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If severe penicillin allergy (previous angioedema, anaphylaxis or urticaria), discuss with doctor. 2Avoid ibuprofen if peptic ulcer, asthma, hypertension, heart failure, kidney disease or pregnant. 3Test for malaria with rapid diagnostic test if available. If not available send blood to laboratory for microscopy. Rapid tests may stay positive for up to one month after successful treatment. A negative test does not exclude malaria, request a second test. 4Notify within 24 hours via NMC App (download from NICD website/app store) or www.nicd.ac.za/nmc-overview/notification-process.", "bbox": [34.0, 527.3, 803.8, 551.8], "key": "p21-068217b5"}], "boxes": [{"box": 1, "rect": [35.5, 107.8, 545.6, 289.1]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCgAAAF7CAIAAACfKC1VAAAACXBIWXMAABcSAAAXEgFnn9JSAAGN8klEQVR4nOy9h5cUxff+//1Dfud83gwZBMmLRMkgOUfJSXKUnDMISHbJOYPkuOQgmRUQREGCoqiIyO7CLiw7v1fPXYqiu6dnNrGs1jnPmTPdXV11u8K996n4//76/3IYGBgYGBgYGBgYGBhkKP5fpktgYGBgYGBgYGBgYPCvhyEeBgYGBgYGBgYGBgYZjreIR0zvzrEDuhkYGBgYGBgYGBgYGKQdT6pUcScer/4653/5nYGBgYGBgYGBgYGBQdoRN/5zQzwMDAwMDAwMDAwMDDIWhngYGBgYGBgYGBgYGGQ4DPEwMDAwMDAwMDAwMMhwGOJhYGBgYGBgYGBgYJDhMMTDwMDAwMDAwMDAwCDDYYiHgYGBgYGBgYGBgUGGwxAPAwMDAwMDAwMDA4MMhyEeBgYGBgYGBgYGBgYZDkM8DAwMDAwMDAwMDAwyHIZ4GBgYGBgYGBgYGBhkOAzxMDAwMDAwMDAwMDDIcBjiYWBgYPBdQlz0zq/nz5s9cvuWeZkujIErjh5asX/P4p/vHM7QVG5e37N04YQlkeN/+mF/pn+yK04eXb1gzqi1K6f989fZTBfGwMDAIEUwxMPAwCDLA87wef+OXTo0bdOqfveuLceM7ImHmvTiWpiv48BVrlDa93//B0pFFMn0z9Fx5uT6qpXK4GhmuiSZjuJFPqSA1qyYlnF5u2Lp5BzZsklN2LBm oncept \"Headache\" \"finding\") (qualifier (snomed_concept \"Worsening\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Frequent headache\" \"finding\"))\n\n    ;; known conditions\n    (clinical_finding (snomed_concept \"Human immunodeficiency virus infection\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Epilepsy\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n\n    ;; consciousness after the fit\n    (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n\n    ;; focal neurology (stroke or TIA likely)\n    (clinical_finding (snomed_concept \"Muscle weakness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\"))\n    (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\"))\n\n    ;; alcohol/drug use, head injury, pregnancy\n    (clinical_finding (snomed_concept \"Overdose\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Substance withdrawal syndrome\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Injury of head\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))\n\n    ;; not a seizure: common faint likely\n    (clinical_finding (snomed_concept \"Collapse\" \"finding\"))\n    (clinical_finding (snomed_concept \"Muscle twitch\" \"finding\"))\n    (clinical_finding (snomed_concept \"Flushing\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Sweating\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable meningitis after a seizure/fit\"\n  (diagnosis\n    (snomed_concept \"Meningitis\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n    (or (>= (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38)\n        (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n        (clinical_finding (snomed_concept \"Stiff neck\" \"finding\"))\n        (clinical_finding (snomed_concept \"Purpuric rash\" \"disorder\"))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable stroke from focal signs (seizure/fit page)\"\n  (diagnosis\n    (snomed_concept \"Cerebrovascular accident\" \"disorder\")\n    probable\n  )\n  adult\n  (or (clinical_finding (snomed_concept \"Muscle weakness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Numbness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\"))\n      (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable TIA from focal signs (seizure/fit page)\"\n  (diagnosis\n    (snomed_concept \"Transient ischemic attack\" \"disorder\")\n    probable\n  )\n  adult\n  (or (clinical_finding (snomed_concept \"Muscle weakness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept easured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 21 – Seizures/fits (cont. 2): flowchart\n\nSource: APC 2026 e-book, page 21.\n\n```mermaid\nflowchart TD\n    Q0[\"Approach to the patient who is not fitting now<br/>Confirm that patient indeed had a seizure/fit: jerking movements of part of or the whole body,<br/>usually lasting &lt; 3 minutes. May have had tongue biting, incontinence, post-fit drowsiness and confusion.\"]\n    Q0 -- Yes --> RB[\"<b>Refer patient same day if any of:<\/b><br/>Temperature ≥ 38°C, headache, neck stiffness or purple/red rash, meningitis likely<br/>(malaria area in past 3 months + malaria test positive: also give artesunate)<br/>New/different headache or headache getting worse/more frequent<br/>Patient with HIV and no known epilepsy<br/>Decreased consciousness &gt; 1 hour after fit → 18<br/>Glucose &lt; 3 (&lt; 4 if diabetes) or unable to measure → 19<br/>Glucose ≥ 11.1 → 19<br/>New sudden asymmetric weakness or numbness, difficulty speaking or visual disturbance<br/>BP ≥ 180/130 more than 1 hour after fit has stopped<br/>Alcohol/drug use: overdose or withdrawal<br/>Recent head injury<br/>Pregnant or up to 1 week postpartum (≥ 20 weeks pregnant and just had fit → 177)\"]\n    Q0 -- No --> N1[\"New sudden asymmetric weakness or numbness of face, arm or leg;<br/>difficulty speaking or visual disturbance\"]\n    Q0 -- No --> N2[\"Collapse with twitching lasting &lt; 15 seconds following flushing,<br/>dizziness, nausea, sweating and with rapid recovery\"]\n    N1 --> STROKE[\"Stroke or TIA likely → 152\"]\n    N2 --> FAINT[\"Common faint likely → 45\"]\n    STROKE --> UNC[\"If diagnosis uncertain, refer.\"]\n    FAINT --> UNC\n    RB -- \"none of the above\" --> Q1[\"Approach to the patient who had a fit but does not need same day referral<br/>Is the patient known with epilepsy?\"]\n    Q1 -- Yes --> EPI[\"Give routine epilepsy care → 167\"]\n    Q1 -- No --> WORKUP[\"Doctor to check FBC, creatinine (eGFR), urea, sodium, calcium.<br/>Focal seizures or new seizures after meningitis, stroke or head injury: discuss with specialist.<br/>≥ 2 definite seizures with no identifiable cause: doctor to consider epilepsy, routine care → 167\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Q0 (seizure confirmed?) | The recorded warning sign `Seizure` is the trigger for the whole page | `Check for same-day referral after a seizure/fit` (due_to) |\n| RB, meningitis bullet | Seizure **and** any of temperature ≥ 38 °C, headache, stiff neck, purpuric rash | `Diagnose probable meningitis after a seizure/fit` |\n| RB (all bullets) | Seizure **and** any red-box criterion (meningitis via `active_condition`) | `Urgent: same-day referral after a seizure/fit` |\n| N1 → Stroke or TIA likely | Any focal sign (sudden asymmetric weakness/numbness, difficulty talking, visual disturbance) | `Diagnose probable stroke from focal signs (seizure/fit page)`, `Diagnose probable TIA from focal signs (seizure/fit page)` |\n| N2 → Common faint likely | Collapse **and** muscle twitch **and** any of flushing, dizziness, nausea, sweating | `Diagnose probable common faint (seizure/fit page)` |\n| If diagnosis uncertain, refer | Referral step | Not modelled (management) |\n| Q1 / routine epilepsy care / doctor work-up | Management and lab work-up | Not modelled (management; \"≥ 2 definite seizures\" cannot be counted in the language) |\n\n## Notes\n\n- The \"No\" branch (not a seizure) cannot be expressed as a negation of the trigger, because the\n  trigger is the recorded seizure itself. The stroke/TIA and faint rules therefore rest on their\n  own evidence and do not require `(no Seizure)`.\n- \"> 1 hour after fit\" is modelled as `(>= (onset Seizure) (time_ago 1 hours))`.\n- \"Up to 1 week postpartum\" is modelled as `(<= (onset Postpartum state) (time_ago 1 weeks))`.\n- BP ≥ 180/130 is read as systolic ≥ 180 **or** diastolic ≥ 130.\n", "questions": "# Page 21 – Seizures/fits (cont. 2): remaining questions\n\n## Decisions made\n\n- **Trigger.** Every rule on the \"Yes\" side hangs off the recorded warning sign\n  `(clinical_finding (snomed_concept \"Seizure\" \"finding\"))`. The red box sits under \"Confirm that\n  patient indeed had a seizure/fit: Yes\", so the priority rule is `(and Seizure (or …red box…))`.\n- **Priority level.** \"Refer patient same day\" is encoded as `Urgent`. The page does not escalate.\n  (The Seizure warning sign has its own Emergency level, but that applies to active fitting.)\n- **Meningitis likely.** I read \"Temperature ≥ 38°C, headache, neck stiffness or purple/red rash,\n  meningitis likely\" as Seizure **and** any one of the four → `probable` Meningitis, which the\n  priority rule uses through `(active_condition Meningitis)`. Seizure is kept in the rule so that a\n  headache alone does not diagnose meningitis anywhere else in the book. \"Purple/red rash\" →\n  `Purpuric rash`.\n- **New/different or worsening/more frequent headache** → Headache + `New`, Headache + `Worsening`,\n  `Frequent headache`.\n- **HIV and no known epilepsy** → `(and (HIV + Known present) (no (Epilepsy + Known present)))`,\n  following Will's briefing for known chronic conditions. The check_for asks about Epilepsy + Known\n  present. This trips two gate false positives (see **Checker issues left in place**).\n- **Time criteria.** \"Decreased consciousness > 1 hour after fit\" and \"BP ≥ 180/130 more than 1 hour\n  after fit has stopped\" each use `(>= (onset Seizure) (time_ago 1 hours))`. \"Up to 1 week\n  postpartum\" is `Postpartum state` plus `(<= (onset Postpartum state) (time_ago 1 weeks))`. Per the\n  brief, only `>=` and `<=` are used.\n- **BP ≥ 180/130** → systolic ≥ 180 **or** diastolic ≥ 130.\n- **Glucose** uses the routine vital `Blood glucose status` (mmol/L): < 3; known diabetes and < 4;\n  ≥ 11.1. No measure task, because glucose is routine.\n- **Focal signs** (\"New sudden asymmetric weakness or numbness, difficulty speaking or visual\n  disturbance\"): `Muscle weakness` and `Numbness` with `Sudden onset` + `Asymmetry`, and plain\n  `Difficulty talking` and `Visual disturbance`. In the page's list, \"new sudden asymmetric\" is read\n  as modifying \"weakness or numbness\" only (unsettled; see questions). The same four findings are a\n  red-box criterion (Yes branch) and the evidence for \"Stroke or TIA likely\" (No branch).\n  Generic `Muscle weakness` / `Numbness` were preferred over face/limb-specific concepts because the\n  red box names no site, and they cover the No branch's \"face, arm or leg\".\n- **Stroke or TIA likely** → two `probable` rules (Cerebrovascular accident, Transient ischemic\n  attack) with the same evidence.\n- **Common faint likely** → `probable` `Vasovagal syncope` (finding) when there is Collapse and\n  Muscle twitch and any of Flushing, Dizziness, Nausea or Sweating.\n- **The No branch** (fit not confirmed) isn't expressed as `(no Seizure)`. The trigger is the\n  recorded seizure, so the stroke/TIA and faint rules rest on their own evidence. The seizure task\n  asks for their findings.\n- **\"Fit has stopped\"**: only the onset of the Seizure finding is available, so the 1-hour window\n  runs from onset, not from the end of the fit (seizures usually last < 3 minutes).\n- **The malaria bullet** (\"If patient was in malaria area … malaria test positive, also give\n  artesunate\") is a treatment add-on for a patient already being referred, so it is accounted for as\n  `management_step`.\n- **The lower flowchart** (known epilepsy → routine care; the doctor's work-up; \"≥ 2 definite\n  seizures … consider epilepsy\") is management or lab work and is not modelled.\n- **Shock and BP < 90/60** don't appear on this page.\n\n## Could not model\n\n- **Glucose \"unable to measure\"** has no representation, so that part of the rule fires less often\n  than the page intends.\n- **Collapse \"lasting < 15 seconds\" and \"with rapid recovery\"** have no representation, so the faint\n  rule fires more often.\n- **\"New\" on the focal signs** is carried only by `Sudden onset`, not by a separate `New` qualifier.\n- **\"≥ 20 weeks pregnant and just had fit → 177\"**: gestational age isn't modelled. It is a\n  cross-reference to page 177, and the pregnancy bullet already refers the patient.\n- **Malaria area in the past 3 months plus a positive malaria test**: not encoded (management).\n- **\"Doctor to consider epilepsy\" after ≥ 2 definite seizures with no identifiable cause**: the\n  language can't count episodes or express \"no identifiable cause\", so there is no `possible`\n  epilepsy rule.\n- **Onset timing.** Both onset comparisons depend on the Seizure and Postpartum state findings\n  carrying the real time of the event. If onset defaults to the time of recording, the \"> 1 hour\"\n  criteria never fire, and the postpartum criterion always fires.\n\n## SNOMED gaps\n\n- **\"Twitching\"** (finding) doesn't exist. I used `Muscle twitch` (finding).\n- **\"Flushing\"** exists only as a disorder, so I used `Flushing` (disorder).\n- **\"Difficulty speaking\"** (finding) doesn't exist. I used `Difficulty talking` (finding), which is\n  in the vocabulary.\n- **\"Drug withdrawal\" / \"Drug overdose\"** (disorder) don't exist. I used\n  `Substance withdrawal syndrome` (disorder) and `Overdose` (disorder).\n- **Common faint**: there is no \"Simple faint\". `Vasovagal syncope` exists only as a finding.\n- **\"Asymmetrical\"** (qualifier) doesn't exist. I used `Asymmetry` (qualifier value).\n- **No qualifier for \"different\"** (headache). `New` covers it.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\nThese are gate false positives. The finding is used as `(no X)`, but the gate's `(no …)`\nnormaliser only recognises the No value when it is last. With a qualifier it is not last, so the\nusage is missed.\n\n- `CHECKED FOR BUT NEVER USED AS EVIDENCE`:\n  `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Epilepsy\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))`\n- `PRIORITY EVALUATION EVIDENCE NOT CHECKED FOR`:\n  `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Epilepsy\" \"disorder\") (snomed_concept \"No\" \"qualifier value\") (qualifier (snomed_concept \"Known present\" \"qualifier value\"))))`\n\n## Questions for a clinician\n\n1. Meningitis likely: is any single item (for example, headache alone after a fit) enough, or does\n   the page mean fever plus a meningeal sign?\n2. Should \"Stroke or TIA likely\" give two probable diagnoses, or one?\n3. Is twitching required for \"common faint likely\", or is it just the reason the faint was mistaken\n   for a fit?\n4. Should a positive malaria test after travel to a malaria area be a referral criterion in its own\n   right (cerebral malaria)?\n5. Is the `Asymmetry` qualifier practical to record, or should plain sudden-onset weakness/numbness\n   be enough?\n6. Does \"new sudden\" in \"New sudden asymmetric weakness or numbness, difficulty speaking or visual\n   disturbance\" also apply to difficulty speaking and visual disturbance? As encoded it does not,\n   so any recorded difficulty talking or visual disturbance after a fit refers same day and gives\n   probable stroke/TIA.\n7. Should the page's \"post-fit drowsiness and confusion\" (the post-ictal state) also trigger this\n   page's rules when no seizure has been recorded? As encoded, only `Seizure` does.\n8. Should the common-faint rule exist at all, given that its key discriminators (< 15 seconds,\n   rapid recovery) cannot be recorded?\n9. Is `Urgent` the right level for same-day referral after a fit, given that the Seizure warning\n   sign already sets Emergency?\n10. Does \"Recent head injury\" need a time window (e.g. days)?\n", "claims": [{"claim_id": "c001", "rule": "Check for same-day referral after a seizure/fit", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Seizure\" \"finding\"))", "element_keys": ["p21-2a53d778"], "quote": "seizure/fit"}, {"claim_id": "c002", "rule": "Check for same-day referral after a seizure/fit", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\"))", "element_keys": ["p21-f765a7a4"], "quote": "headache"}, {"claim_id": "c003", "rule": "Check for same-day referral after a seizure/fit", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stiff neck\" \"finding\"))", "element_keys": ["p21-f765a7a4"], "quote": "neck stiffness"}, {"claim_id": "c004", "rule": "Check for same-day referral after a seizure/fit", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Purpuric rash\" \"disorder\"))", "element_keys": ["p21-f765a7a4"], "quote": "purple/red rash"}, {"claim_id": "c005", "rule": "Check for same-day referral after a seizure/fit", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"New\" \"qualifier value\")))", "element_keys": ["p21-ace014ff"], "quote": "New/different headache"}, {"claim_id": "c006", "rule": "Check for same-day referral after a seizure/fit", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Worsening\" \"qualifier value\")))", "element_keys": ["p21-ace014ff"], "quote": "headache l", "reason": "", "fix": "", "confidence": "high"}, {"claim_id": "c065", "rule": "Urgent: same-day referral after a seizure/fit", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Difficulty talking\" \"finding\"))", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"claim_id": "c066", "rule": "Urgent: same-day referral after a seizure/fit", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Visual disturbance\" \"disorder\"))", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"claim_id": "c067", "rule": "Urgent: same-day referral after a seizure/fit", "expr": "(>= (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 180)", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"claim_id": "c068", "rule": "Urgent: same-day referral after a seizure/fit", "expr": "(>= (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 130)", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"claim_id": "c069", "rule": "Urgent: same-day referral after a seizure/fit", "expr": "(>= (onset (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Seizure\" \"finding\"))) (time_ago 1 hours))", "verdict": "imprecise", "reason": "Page times from when the fit has STOPPED; rule times from seizure onset, so a long fit could count before 1 hour post-fit has elapsed. '>' vs '>=' minor.", "fix": "Accept approximation and note in remaining questions.", "confidence": "low"}, {"claim_id": "c070", "rule": "Urgent: same-day referral after a seizure/fit", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Overdose\" \"disorder\"))", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"claim_id": "c071", "rule": "Urgent: same-day referral after a seizure/fit", "expr": "(finding (snomed_concept \"Clinical finding ely' and triggers Urgent through active_condition, which makes the separate red-box line 'New/different headache or worsening' redundant. The page more plausibly means the cluster (fever with meningism/headache/rash). Suggest (and fever (or headache stiff-neck rash)) or any2, or flag for a clinician.", "severity": "high"}, {"rule": "Diagnose probable stroke from focal signs (seizure/fit page)", "verdict": "problem", "problem": "On the page, 'Stroke or TIA likely' is on the NO branch (the event was NOT confirmed as a seizure). The rule has no seizure exclusion, so a patient with a confirmed fit and post-ictal (Todd's) weakness, or any visual disturbance, gets probable stroke. Consider (no Seizure) or anchoring so it does not fire for a confirmed fit.", "severity": "medium"}, {"rule": "Diagnose probable TIA from focal signs (seizure/fit page)", "verdict": "problem", "problem": "Same as the stroke rule (No branch, no seizure exclusion). It also fires with identical evidence, so every case gets both probable stroke AND probable TIA, where the page says 'Stroke OR TIA'. That is acceptable as two rules, but worth noting.", "severity": "medium"}, {"rule": "Diagnose probable common faint (seizure/fit page)", "verdict": "problem", "problem": "The duration '< 15 seconds' and 'rapid recovery' are dropped. These are the features that separate a faint from a seizure on this page. Treating flushing/dizziness/nausea/sweating as an OR is a defensible reading. The Vasovagal syncope concept is fine.", "severity": "medium"}, {"rule": "Urgent: same-day referral after a seizure/fit", "verdict": "problem", "problem": "Urgent is justified by 'Refer patient same day'. Every red-box line is present except 'Glucose ... unable to measure'. The malaria-positive line is treatment within the meningitis bullet, so leaving it out is acceptable. Timing for BP and DLOC is approximated from seizure onset. Separately, the page has 'If patient had >= 2 definite seizures with no identifiable cause, doctor to consider epilepsy' (should be a POSSIBLE epilepsy rule), and 'If diagnosis uncertain, refer' is not encoded anywhere.", "severity": "medium"}], "summary": "The most consequential problem is the meningitis rule. It ORs fever, headache, neck stiffness and rash, so any headache after a fit gives probable meningitis and an Urgent referral, which also makes the separate new/worsening-headache criterion redundant. The stroke and TIA rules leave out the page's 'not a seizure' branch, so post-ictal weakness gives probable stroke/TIA. The faint rule drops the '<15 seconds / rapid recovery' discriminators. Smaller gaps: purpuric rash is narrower than 'purple/red rash', 'glucose unable to measure' is missing, and there is no possible-epilepsy rule for 'doctor to consider epilepsy'."}], "scorecard": {"page": 21, "slug": "21-seizures-fits-cont-2", "validation_ok": true, "builder_agreement": 0.702, "elements": 36, "elements_agreed": 16, "claims": 75, "claims_agreed": 56, "queue": 78, "queue_by_priority": {"low": 34, "high": 7, "medium": 37}, "missing_reports": [], "element_rows": [{"key": "p21-aa908c15", "id": "p21-rb1-e01", "box": 1, "status": "queue", "scopes": {"in_scope": 2, "out_of_scope": 1}, "verdicts": {"correct": 2}}, {"key": "p21-f765a7a4", "id": "p21-rb1-e02", "box": 1, "status": "queue", "scopes": {"in_scope": 2, "borderline": 1}, "verdicts": {"correct": 2, "partial": 1}}, {"key": "p21-2c74f34e", "id": "p21-rb1-e03", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p21-ba976456", "id": "p21-rb1-e04", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p21-8a284497", "id": "p21-rb1-e05", "box": 1, "status": "queue", "scopes": {"out_of_scope": 2, "borderline": 1}, "verdicts": {"missing": 1}}, {"key": "p21-ace014ff", "id": "p21-rb1-e06", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"partial": 2, "correct": 1}}, {"key": "p21-d67a8ac2", "id": "p21-rb1-e07", "box": 1, "sta m": "Minor: meningitis rule additionally requires Seizure (page context implies it); priority relies on active_condition Meningitis, which may not match a system 'probable' diagnosis; 'red' rash mapped only to purpuric rash.", "confidence": "medium"}, {"checker": "forward-3", "scope": "borderline", "verdict": "partial", "parts_missing": ["'red' rash: only Purpuric rash is used. Petechiae of skin (disorder) is not a descendant of Purpuric rash, so a petechial or red non-blanching rash will not match"], "problem": "Every part is encoded: temp >= 38 °C, Headache, Stiff neck and Purpuric rash, OR-ed under Seizure, giving probable Meningitis, which the Urgent rule references via active_condition. But the OR reading means Seizure + plain Headache (very common after a fit) or Seizure + fever alone produces a PROBABLE meningitis diagnosis. As a referral trigger that is acceptable; as a 'probable' diagnosis it is over-broad and clinically doubtful. It also makes the separate new/worse-headache criteria redundant. Consider requiring >= 2 items (any2) or downgrading to possible.", "confidence": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "element", "priority": "high", "ref": "p21-8a284497", "text": "If patient was in malaria area in past 3 months and malaria test3 positive, also give artesunate 2.4mg/kg IM. Patient to reach referral hospital within 6 hours. If referral delayed, repeat dose after 12 hours. Notify4.", "detail": [{"checker": "forward-1", "scope": "out_of_scope", "verdict": null, "parts_missing": [], "problem": "Conditional artesunate for a malaria-test-positive meningitis patient is a treatment instruction, not a referral criterion. A 'possible malaria' rule could be argued for but the page does not say 'malaria likely'.", "confidence": "medium"}, {"checker": "forward-2", "scope": "out_of_scope", "verdict": null, "parts_missing": [], "problem": "management_step (malaria test/area are inputs to treatment, not to referral; patient already referred)", "confidence": "medium"}, {"checker": "forward-3", "scope": "borderline", "verdict": "missing", "parts_missing": ["malaria-area exposure in past 3 months", "positive malaria test", "escalation to a <6-hour referral (higher than Urgent)"], "problem": "Nothing encodes the malaria branch. A seizure with a positive malaria test only reaches Urgent through another item (e.g. fever giving probable meningitis), and never above Urgent, although the page demands arrival within 6 hours.", "confidence": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "element", "priority": "medium", "ref": "p21-ace014ff", "text": "New/different headache or headache getting worse/more frequent.", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'different' headache (change in character) has no encoded form; only New, Worsening and Frequent headache are present"], "problem": "Minor: 'new/different' is usually read as one idea and New covers most of it; no obvious SNOMED concept for a changed-character headache was found.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "'Different' headache not separately encoded; 'more frequent' mapped to 'Frequent headache' (state, not change). Minor.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'different' headache (change in character) is not encoded", "'more frequent' is encoded as Frequent headache (a static state), not an increase in frequency"], "problem": "New and Worsening headache are encoded correctly. In practice the whole item is shadowed: any Headache after a seizure already fires probable meningitis and so Urgent.", "confidence": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "element", "priority": "low", "ref": "p21-0f10f76b", "text": "Decreased consciousness > 1 hour after fit 18.", "detail": [{"chec "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Page says more than 1 hour after fit has STOPPED; rule uses seizure onset, so a long fit could trigger early", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Page times from when the fit has STOPPED; rule times from seizure onset, so a long fit could count before 1 hour post-fit has elapsed. '>' vs '>=' minor.", "fix": "Accept approximation and note in remaining questions.", "confidence": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable meningitis after a seizure/fit", "text": "Evidence is Seizure AND (temperature >= 38 OR headache OR stiff neck OR purpuric rash). Headache is a recorded common symptom, so any seizure patient with a headache is diagnosed with probable meningitis and referred as Urgent. That is the literal reading of the 'any of' box, but 'meningitis likely' on headache alone is clinically loose; the builders should record the reading as a decision for a clinician.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Urgent: same-day referral after a seizure/fit", "text": "'Alcohol/drug use: overdose' is encoded only as Overdose (disorder). Alcohol intoxication (disorder) is not a descendant of Overdose (Overdose is under Poisoning), so alcohol overdose after a fit does not trigger referral. Add (clinical_finding (snomed_concept \"Alcohol intoxication\" \"disorder\")) to the check_for and the or-list.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stroke from focal signs (seizure/fit page) / Diagnose probable TIA from focal signs (seizure/fit page)", "text": "The page reaches 'Stroke or TIA likely' only on the 'did not have a seizure' branch; the rules fire on any focal sign regardless of context, including a patient who did have a seizure (where the same signs are red-box referral criteria and may be post-ictal). Defensible, since the signs warrant the diagnosis anyway, but the flowchart branch is not preserved.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable common faint (seizure/fit page)", "text": "Two of the page's discriminators are absent: twitching lasting < 15 seconds (not representable) and rapid recovery (no concept found; a (no Post-ictal state) conjunct would approximate it). Without them the rule can label a brief seizure with a prodrome as a faint.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Urgent: same-day referral after a seizure/fit", "text": "Glucose is measured as (snomed_concept \"Blood glucose status\" \"observable entity\"). SNOMED also has \"Blood glucose concentration\" (observable entity); I could not verify which concept the routine glucose vital records under, and if it differs the three glucose criteria never fire. Builders should confirm against the vitals definition.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "(none)", "text": "No possible Epilepsy rule for the page's 'doctor to consider epilepsy' (>= 2 definite seizures with no identifiable cause); the count is not representable, so this is a judgment call rather than a clear miss.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "high", "ref": "Diagnose probable common faint (seizure/fit page)", "text": "Omits the required 'lasting < 15 seconds' and 'rapid recovery'; fires , "text": "Three time clauses depend on recorded-onset semantics: decreased consciousness > 1 h after fit, BP >= 180/130 > 1 h after fit, and postpartum <= 1 week. The first two are anchored to the Seizure record's onset (usually 'now' at triage), so they will rarely fire when the referral decision is made. The postpartum bound is anchored to the record time, not delivery, so it does not restrict anything.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stroke / Diagnose probable TIA (seizure/fit page)", "text": "No due_to anchor or context, and Difficulty talking / Visual disturbance carry no New/Sudden qualifier. Any adult with a recorded visual disturbance or speech difficulty gets probable stroke AND probable TIA.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable common faint (seizure/fit page)", "text": "The discriminators that separate a faint from a seizure (twitching < 15 s, rapid recovery) are missing, and the rule does not exclude a confirmed Seizure. A seizure presenting as collapse + twitching + nausea can be called a probable vasovagal syncope at the same time as the Urgent seizure referral.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Urgent: same-day referral after a seizure/fit", "text": "The malaria sub-item (malaria area in past 3 months + positive test → artesunate, 'reach referral hospital within 6 hours') is not encoded. That time limit arguably justifies a level above Urgent for that subset.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Urgent: same-day referral after a seizure/fit", "text": "'Glucose ... or unable to measure' is dropped.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Check for same-day referral after a seizure/fit", "text": "The check_for, triggered by Seizure, includes the 'No (not a seizure)' branch findings (Collapse, Muscle twitch, Flushing, etc.). That is coherent only if the faint rule is meant to compete with the seizure label. The page's Yes/No confirmation step is not modelled.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable common faint (seizure/fit page)", "text": "Rule is broader than the page: 'lasting < 15 seconds' and 'with rapid recovery', the two features that separate a faint from a seizure, are not encoded, and the prodrome list 'flushing, dizziness, nausea, sweating' (page uses 'and') is read as any-one-of. The grammar has no finding-duration construct, so this cannot be fixed exactly; it must be recorded as could-not-model and the reconciler should decide whether a probable label on 'collapse + twitch + one prodrome symptom' is acceptable.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Check for same-day referral after a seizure/fit", "text": "Check task mixes in faint features (collapse, twitching, flushing, dizziness, nausea, sweating) from the 'No' branch, and diabetes/glucose context; acceptable only to satisfy the checked-for rule for the faint diagnosis, but does not itself correspond to a page box", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stroke from focal signs (seizure/fit page)", "text": "Page's 'No' branch (not a seizure); rule has no seizure-absent condition and drops 'new sudden' on speech/visual items", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable TIA from focal signs (seizure/fit page)", "text": "Same as stroke: identical criteria, no way to distinguish; page gives 'Stroke or TIA likely' as one box so acceptable, but no seizure-absent condition", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Diagnose probable common faint (seizure/fit page)", "text": "Drops 'lasting < 15 seconds' and 'rapid recovery'; weaker than page, likely over-triggers", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Urgent: same-day referral after a seizure/fit", "text": "Omits 'glucose unable to measure' and malaria-area positive test items; faithful otherwise; Urgent level matches 'Refer same day'", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "medium", "ref": "Check for same-day referral after a seizure/fit", "text": "Type and trigger are right and it covers the red-box findings and the faint/stroke discriminators. But 'Glucose ... or unable to measure' has no item, and the outside-box logic for an unconfirmed seizure (collapse, flushing etc.) sits under a Seizure trigger. That is minor because these patients present as 'fit'.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 21, "slug": "21-seizures-fits-cont-2", "kind": "rule", "priority": "high", "ref": "Diagnose probable meningitis after a seizure/fit", "text": "Flat OR: Seizure plus ANY ONE of fever, headache, stiff neck or rash gives PROBABLE meningitis. So any headache after a fit makes meningitis 'likely' an // ---------- banners ----------
function renderBanners() {

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {

  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}

}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;

  const box = btn.closest(".decide"), key = box.dataset.item;

  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,

}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;

}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";

// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {

    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
