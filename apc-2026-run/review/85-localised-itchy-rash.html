n_y": -1, "indent": 0, "parent": null, "text": "2 weeks by smaller, oval, scaly patches. May have", "bbox": [357.3, 303.1, 448.0, 323.3], "key": "p85-91fe3d10"}, {"id": "p85-out-e33", "page": 85, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Christmas tree pattern", "bbox": [360.7, 323.1, 444.5, 333.3], "key": "p85-a0845543"}, {"id": "p85-out-e34", "page": 85, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "on back", "bbox": [387.1, 333.1, 416.1, 343.3], "key": "p85-a6686283"}, {"id": "p85-out-e35", "page": 85, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "© University of Cape Town", "bbox": [417.2, 423.1, 475.9, 429.8], "key": "p85-90d0a38a"}, {"id": "p85-out-e36", "page": 85, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Encourage open shoes. • Avoid synthetic socks. • If involves nails 97. Advise to avoid sharing clothes,", "bbox": [560.4, 406.7, 797.6, 436.9], "key": "p85-a72f8408"}, {"id": "p85-out-e37", "page": 85, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "combs and hairbrushes.", "bbox": [574.5, 423.7, 661.9, 433.9], "key": "p85-0242c879"}], "boxes": [{"box": 1, "rect": [35.5, 87.4, 806.4, 108.9]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAAtCAIAAACbCCs3AAAACXBIWXMAABcSAAAXEgFnn9JSAAAWEElEQVR4nO3dCVAV15oH8LzMvHlT79XMq6k3MzVV895EwQU3jIhCxA03BOMS9+CS4ALuC+KGqBjXaFAjRgVRUVFRwIiyg+yCbHoFXFDcRXFDQVDA5c4HHzl2+va9VwkErv6rfpW63X26+/Q5jZX+V5/Tnzz+ezMAAAAAAAAAAADD8kmD1wAAAAAAAAAAAOB9IdUCAAAAAAAAAADD86tU62V2yKurJwEAAAAAAAAAABqh8mNeyqnW68fp6pfnAQAAAAAAAAAAGqHKlACkWgAAAAAAAAAAYGCQagEAAAAAAAAAgOFBqgUAAAAAAAAAAIYHqRYAAAAAAAAAABgepFoAAAAAAAAAAGB4kGoBAAAAAAAAAIDhQaoFAAAAAAAAAACGB6kWAAAAAAAAAAAYHqRaAAAAAAAAAABgeJBqAQAAAAAAAACA4UGqBQAA8B7OnzseGeZDHt9Pqc in\" \"disorder\") (finding_site (snomed_concept \"Structure of interdigital web of hand\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\") (finding_site (snomed_concept \"Axillary region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\") (finding_site (snomed_concept \"Structure of waist region of trunk\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\") (finding_site (snomed_concept \"Genital structure\" \"body structure\")))\n\n    ;; Eczema: patches of dry, scaly, itchy skin on wrists, ankles, inside elbows or behind knees\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Dry\" \"qualifier value\")) (finding_site (snomed_concept \"Wrist region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Dry\" \"qualifier value\")) (finding_site (snomed_concept \"Ankle region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Dry\" \"qualifier value\")) (finding_site (snomed_concept \"Antecubital region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Dry\" \"qualifier value\")) (finding_site (snomed_concept \"Popliteal fossa structure\" \"body structure\")))\n\n    ;; Fixed drug eruption: dark coloured round macules after ingestion of a medication\n    (clinical_finding (snomed_concept \"Macule of skin\" \"disorder\") (qualifier (snomed_concept \"Dark color\" \"qualifier value\")) (qualifier (snomed_concept \"Round shape\" \"qualifier value\")))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))\n\n    ;; Insect bites branch: blistered / healed with darkening; yellow crusts\n    (clinical_finding (snomed_concept \"Blister of skin\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Post-inflammatory hyperpigmentation\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Crust on skin\" \"finding\") (qualifier (snomed_concept \"Yellow color\" \"qualifier value\")))\n\n    ;; Psoriasis: well-defined, raised plaques covered with silvery scale\n    (clinical_finding (snomed_concept \"Skin plaque\" \"disorder\") (qualifier (snomed_concept \"Well defined\" \"qualifier value\")) (qualifier (snomed_concept \"Raised\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Silver color\" \"qualifier value\")))\n\n    ;; Pityriasis rosea: one large ring on chest/back (herald patch), then smaller, oval patches\n    (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\") (qualifier (snomed_concept \"Large\" \"qualifier value\")) (qualifier (snomed_concept \"Annular shape\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of chest\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\") (qualifier (snomed_concept \"Large\" \"qualifier value\")) (qualifier (snomed_concept \"Annular shape\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of back\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Oval shaped lesion\" \"finding\") (qualifier (snomed_concept \"Multiple\" \"qualifier value\")) (qualifier (snomed_concept \"Small\" \"qualifier value\")))\n\n    ;; Tinea corporis: lesion/s with raised edges / ring of scale\n    (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\") (qualifier (snomed_concept \"Annular shape\" \"qualifier value\")) (qualifier (snomed_concept \"Raised\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Annular shape\" \"qualifier value\")))\n\n    ;; Tinea pedis: cracks, peeling or scaly lesions between toes, or thickened scaly skin on soles/heels/sides of feet\n    (clinical_finding (snomed_concept \"Fissure in skin\" \"disorder\") (finding_site (snomed_concept \"Structure of interdigital web of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Peeling of skin\" \"finding\") (finding_site (snomed_concept \"Structure of interdigital web of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Structure of interdigital web of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Thickened\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of sole of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Thickened\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of heel\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Thickened\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of border of foot\" \"body structure\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable scabies (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Infestation caused by Sarcoptes scabiei var hominis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; \"very itchy, small red bumps and burrows in webspaces of fingers, axillae, waist or genitals, scabies likely\"\n  (and (clinical_finding (snomed_concept \"Itching\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Red color\" \"qualifier value\")))\n    (or (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\") (finding_site (snomed_concept \"Structure of interdigital web of hand\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\") (finding_site (snomed_concept \"Axillary region structure\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\") (finding_site (snomed_concept \"Structure of waist region of trunk\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\") (finding_site (snomed_concept \"Genital structure\" \"body structure\")))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable eczema (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Eczema\" \"disorder\")\n    probable\n  )\n  adult\n  ;; \"patches of dry, scaly, itchy skin on wrists, ankles, inside elbows or behind knees\" (itchy = the trigger)\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n    (or (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Dry\" \"qualifier value\")) (finding_site (snomed_concept \"Wrist region structure\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Dry\" \"qualifier value\")) (finding_site (snomed_concept \"Ankle region structure\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Dry\" \"qualifier value\")) (finding_site (snomed_concept \"Antecubital region structure\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Dry\" \"qualifier value\")) (finding_site (snomed_concept \"Popliteal fossa structure\" \"body structure\")))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable fixed drug eruption (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Fixed drug eruption\" \"disorder\")\n    probable\n  )\n  adult\n  ;; \"dark coloured round macules ... after ingestion of a medication\"\n  (and (clinical_finding (snomed_concept \"Macule of skin\" \"disorder\") (qualifier (snomed_concept \"Dark color\" \"qualifier value\")) (qualifier (snomed_concept \"Round shape\" \"qualifier value\")))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable insect bites (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Insect bite - wound\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q = Yes: \"red itchy bumps\" (itchy = the trigger; blistering / darkening optional: \"may have\")\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Red color\" \"qualifier value\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable papular urticaria (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Prurigo simplex\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Insect bites box: \"If blisters/heals with darkened skin, papular urticaria likely\" (Prurigo simplex = papular urticaria)\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Red color\" \"qualifier value\")))\n    (or (clinical_finding (snomed_concept \"Blister of skin\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Post-inflammatory hyperpigmentation\" \"disorder\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable impetigo (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Impetigo\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Insect bites box: \"If yellow crusts, impetigo likely\"\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Red color\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Crust on skin\" \"finding\") (qualifier (snomed_concept \"Yellow color\" \"qualifier value\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable psoriasis (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Psoriasis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q = No, head/face/trunk/limbs: \"Well-defined, raised plaques covered with silvery scale\"\n  (and (clinical_finding (snomed_concept \"Skin plaque\" \"disorder\") (qualifier (snomed_concept \"Well defined\" \"qualifier value\")) (qualifier (snomed_concept \"Raised\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Silver color\" \"qualifier value\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable pityriasis rosea (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Pityriasis rosea\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q = No: one large ring on chest/back (herald patch), followed by smaller, oval, scaly patches\n  (and (or (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\") (qualifier (snomed_concept \"Large\" \"qualifier value\")) (qualifier (snomed_concept \"Annular shape\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of chest\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\") (qualifier (snomed_concept \"Large\" \"qualifier value\")) (qualifier (snomed_concept \"Annular shape\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of back\" \"body structure\"))))\n    (clinical_finding (snomed_concept \"Oval shaped lesion\" \"finding\") (qualifier (snomed_concept \"Multiple\" \"qualifier value\")) (qualifier (snomed_concept \"Small\" \"qualifier value\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable tinea corporis (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Tinea corporis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q = No: \"Slow-growing lesion/s with raised edges/ring of scale, clear in centre\"\n  (or (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\") (qualifier (snomed_concept \"Annular shape\" \"qualifier value\")) (qualifier (snomed_concept \"Raised\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Annular shape\" \"qualifier value\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable tinea pedis (localised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Tinea pedis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q = No, feet: \"Cracks, peeling or scaly lesions between toes, or thickened scaly skin on soles/heels/sides of feet\"\n  (or (clinical_finding (snomed_concept \"Fissure in skin\" \"disorder\") (finding_site (snomed_concept \"Structure of interdigital web of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Peeling of skin\" \"finding\") (finding_site (snomed_concept \"Structure of interdigital web of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Structure of interdigital web of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Thickened\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of sole of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Thickened\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of heel\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (qualifier (snomed_concept \"Thickened\" \"qualifier value\")) (finding_site (snomed_concept \"Skin structure of border of foot\" \"body structure\"))))\n)\n", "rules": [{"atom": "task", "description": "Check for localised itchy rash conditions", "ages": ["adult"], "raw": "(task \"Check for localised itchy rash conditions\" rdigital web of foot\" \"body structure\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Scaly skin\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Skin structure of sole of foot\" \"body structure\")))"}]}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Eczema\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Fixed drug eruption\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Impetigo\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Infestation caused by Sarcoptes scabiei var hominis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Insect bite - wound\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Pityriasis rosea\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Prurigo simplex\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Psoriasis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Tinea corporis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Tinea pedis\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 85 – Localised itchy rash: flowchart\n\nSource: APC 2026 e-book page 85. The red box is a pointer only (\"Check if the\npatient needs urgent attention ↻ 82\"); the page's own logic is the bullet list and the flowchart\nbelow it.\n\n```mermaid\nflowchart TD\n    START[\"Localised itchy rash\"] --> RB[\"Check if the patient needs urgent attention ↻ 82<br/>(pointer only, not encoded here)\"]\n    START --> B1{\"Rash on scalp?\"}\n    B1 -- Yes --> P95[\"→ 95 (not encoded)\"]\n    START --> B2{\"Very itchy, small red bumps and burrows in webspaces of<br/>fingers, axillae, waist or genitals?\"}\n    B2 -- Yes --> SCAB[\"Scabies likely → 84\"]\n    START --> B3{\"Patches of dry, scaly, itchy skin on wrists, ankles,<br/>inside elbows or behind knees?\"}\n    B3 -- Yes --> ECZ[\"Eczema likely → 84\"]\n    START --> B4{\"Dark coloured round macules anywhere on body after<br/>ingestion of a medication?\"}\n    B4 -- Yes --> FDE[\"Fixed drug eruption likely → 88\"]\n    START --> Q{\"Are there red itchy bumps that may have blistered<br/>or healed with darkening of skin?\"}\n    Q -- Yes --> IB[\"Usually occurs in crops<br/>Insect bites likely\"]\n    IB --> IB1{\"Blisters / heals with darkened skin?\"}\n    IB1 -- Yes --> PU[\"Papular urticaria likely\"]\n    IB --> IB2{\"Yellow crusts?\"}\n    IB2 -- Yes --> IMP[\"Impetigo likely → 93\"]\n    Q -- \"No: check site of rash\" --> SITE{\"Site\"}\n    SITE -- \"Head, face, trunk or limbs\" --> ASK[\"Ask where rash started and how it progressed.<br/>Look at distribution, check for raised edges, check nails\"]\n    ASK --> PS{\"Well-defined, raised plaques covered with silvery scale<br/>(often knees, elbows, lower back, scalp; may have pitted nails)\"}\n    PS -- Yes --> PSO[\"Psoriasis likely\"]\n    ASK --> PR{\"Starts as one large ring on chest/back (herald patch),<br/>followed by smaller oval scaly patches\"}\n    PR -- Yes --> PRO[\"Pityriasis rosea likely\"]\n    ASK --> TC{\"Slow-growing lesion/s with raised edges/ring of scale,<br/>clear in centre\"}\n    TC -- Yes --> TCO[\"Tinea corporis (ringworm) likely\"]\n    SITE -- Feet --> TP{\"Cracks, peeling or scaly lesions between toes, or<br/>thickened scaly skin on soles/heels/sides of feet\"}\n    TP -- Yes --> TPO[\"Tinea pedis (athlete's foot) likely\"]\n    START --> UNC[\"If diagnosis uncertain, discuss/refer (management, not encoded)\"]\n```\n\n## Decision nodes → rules\n\nAll findings below are in the `check_for` of `Check for localised itchy rash conditions`, which is\ntriggered by `Pruritic rash`.\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Red box | Pointer to page 82 only | none (cross-reference) |\n| Rash on scalp → 95 | Routing to another page | none (flowchart routing) |\n| Scabies likely | Severe itching **and** red papules **and** burrows in skin in the finger webspaces, axilla, waist or genitals | `Diagnose probable scabies (localised itchy rash)` |\n| Eczema likely | Itchy rash (trigger) **and** dry scaly skin on the wrist, ankle, antecubital region or popliteal fossa | `Diagnose probable eczema (localised itchy rash)` |\n| Fixed drug eruption likely | Dark, round macules **and** exposure to a drug or medicament | `Diagnose probable fixed drug eruption (localised itchy rash)` |\n| Q = Yes → Insect bites likely | Itchy rash (trigger) **and** red papules (\"red itchy bumps\") | `Diagnose probable insect bites (localised itchy rash)` |\n| Blisters / heals with darkened skin → Papular urticaria likely | Insect-bite evidence **and** (blister of skin **or** post-inflammatory hyperpigmentation) | `Diagnose probable papular urticaria (localised itchy rash)` |\n| Yellow crusts → Impetigo likely | Insect-bite evidence **and** yellow crust on skin | `Diagnose probable impetigo (localised itchy rash)` |\n| Q = No → site | Not modelled as a gate; the site is carried by each description's own findings | — |\n| Psoriasis likely | Well-defined raised skin plaque **and** silver-coloured scaly skin | `Diagnose probable psoriasis (localised itchy rash)` |\n| Pityriasis rosea likely | Large annular lesion on the skin of the chest or back (herald patch) **and** multiple small oval-shaped lesions | `Diagnose probable pityriasis rosea (localised itchy rash)` |\n| Tinea corporis likely | Raised annular skin lesion **or** annular scaly skin | `Diagnose probable tinea corporis (localised itchy rash)` |\n| Feet → Tinea pedis likely | Fissure in skin, peeling or scaly skin in the toe webs, **or** thickened scaly skin on the sole, heel or border of the foot | `Diagnose probable tinea pedis (localised itchy rash)` |\n\n## Notes\n\n- The \"No\" branch of the question is not encoded as a negation (for example `(no red papules)`)\n  in the psoriasis, pityriasis rosea and tinea rules, following the gold standard, where the Q4\n  branch does not require `(no exposure)`.\n- Words such as \"often\", \"may have\", \"typically\" and \"usually\" describe features that are not\n  required, so they are not encoded as criteria (psoriasis sites, pitted nails, the Christmas tree\n  pattern, \"within 2 weeks\", \"usually occurs in crops\", the red-edged itchy patches of fixed drug\n  eruption).\n- Management boxes (advice, medicines, HIV/diabetes tests, referral, → 93, → 97) are not encoded.\n", "questions": "# Page 85 – Localised itchy rash: remaining questions\n\nFinal build, reconciled from two independent builds (A and B); see `reconcile.json` for each\ndifference and why it was resolved that way.\n\n## Decisions made\n\n- **The red box is a pointer only** (\"Check if the patient needs urgent attention ↻ 82\"). There is\n  no priority evaluation on this page, and the element is recorded as `cross_reference_only`. The\n  page's own diagnostic logic (the bullets and the Yes/No algorithm) is encoded as one `check_for`\n  task and ten `probable` diagnosis rules.\n- **The trigger** is `Pruritic rash` (disorder), citing the page title. It isn't a recorded common\n  symptom or warning sign, so the task fires only when someone records it. \"Localised\" has no\n  concept, so a generalised itchy rash would also trigger the task.\n- **\"Itchy\"** in the eczema (\"dry, scaly, itchy skin\") and insect-bite (\"red itchy bumps\") criteria\n  comes from the trigger (`Pruritic rash`). \"Very itchy\" for scabies is `Itching` + `Severe\n  (severity modifier)`.\n- **Red bumps** are encoded as `Papule of skin` + `Red color`. The same finding serves scabies\n  (\"small red bumps\") and insect bites (\"red itchy bumps\").\n- **Scabies** is encoded as `Infestation caused by Sarcoptes scabiei var hominis`, because no\n  \"Scabies\" FSN exists. The site list (webspaces of fingers, axillae, waist, genitals) is attached\n  to `Burrows in skin`.\n- **Eczema** is itchy rash + `Scaly skin` with a `Dry` qualifier at the wrist, ankle, antecubital\n  region (\"inside elbows\") or popliteal fossa (\"behind knees\"). Dryness and scaliness sit on one\n  finding at one site, as in \"patches of dry, scaly … skin on …\".\n- **Fixed drug eruption** is `Macule of skin` with `Dark color` and `Round shape` qualifiers +\n  `Exposure to … Drug or medicament` (the gold-standard exposure form). The time order (\"after\n  ingestion\") isn't modelled.\n- **Insect bites likely** is itchy rash + red papules. Blistering and darkening are optional (\"may\n  have\") and are used only for papular urticaria.\n- **Papular urticaria and impetigo** sit inside the insect-bites box, so both require the insect-bite\n  evidence plus their own feature. For papular urticaria that is a blister of skin or\n  `Post-inflammatory hyperpigmentation` (\"heals with darkened skin\"); for impetigo it is a yellow\n  crust. Papular urticaria is encoded as `Prurigo simplex`, its SNOMED synonym.\n- **No-branch diagnoses** (psoriasis, pityriasis rosea, tinea) don't require an explicit \"No\" to the\n  red-itchy-bumps question, following the gold standard. The head/face/trunk/limbs vs feet split is\n  carried by each finding's own sites.\n- **Pityriasis rosea** is a herald patch (`Skin lesion` + `Large` + `Annular shape` on the skin of\n  the chest or back) **and** `Oval shaped lesion` + `Multiple` + `Small`.\n- **Tinea pedis** is a fissure in skin, peeling or scaly skin of the interdigital web of the foot,\n  **or** `Scaly skin` + `Thickened` on the sole, heel or border of the foot (\"sides of feet\" means\n  both borders).\n- **Optional features aren't encoded:** \"often on knees, elbows, lower back, scalp\" and \"may have\n  pitted nails\" (psoriasis); \"typically followed within 2 weeks\" and \"may have Christmas tree\n  pattern on back\" (pityriasis rosea); \"usually occurs in crops\" (insect bites); \"often start as\n  itchy patches with red edges\" (fixed drug eruption); \"slow-growing\" (tinea corporis).\n\n## Could not model\n\n- **\"Rash on scalp → 95\"**: routing only. Nothing sends scalp rashes to page 95.\n- **Pityriasis rosea timing.** \"Typically followed within 2 weeks by smaller, oval, scaly patches\"\n  can't be encoded, because the language can't compare the onsets of two findings. The rule\n  therefore fires somewhat more often than the page intends. \"Fine scale in centre\", \"scaly\" (for\n  the oval patches) and the Christmas-tree pattern aren't encoded either.\n- **Tinea corporis.** \"Slow-growing\" and \"clear in centre\" have no concepts, so the rule fires more\n  often than intended. \"Raised edges\" is approximated by a raised annular lesion.\n- **Time order and course:** \"after ingestion of a medication\" and \"heals with darkened skin\" are\n  encoded without their time element.\n- **\"Small\" red bumps (scabies):** a papule is small by definition, so \"small\" has no separate\n  qualifier. The site is attached to the burrows only, not to the bumps.\n- **\"Ask where rash started and how it progressed. Look at distribution…\"** is an examination\n  instruction. Its content is carried by the site-specific findings.\n- **Pointers and management aren't encoded:** nails ↻ 97, surrounding skin red/warm/swollen or\n  yellow crusts ↻ 93, → 84, → 88, → 93, advice, medicines, HIV and diabetes tests, referral, and\n  \"If diagnosis uncertain, discuss/refer\".\n\n## SNOMED gaps\n\n- `Scabies` (disorder) isn't an FSN; used `Infestation caused by Sarcoptes scabiei var hominis`.\n- `Papular urticaria` (disorder) isn't an FSN; used `Prurigo simplex`, which has it as a synonym.\n- `Rash` (finding) and `Itchy rash` don't exist; used `Pruritic rash` (disorder).\n- `Dry skin` (finding) doesn't exist, though `Xeroderma` (disorder) does; used `Scaly skin` + `Dry`.\n- Herald patch, silvery scale, ring of scale, raised edge and central clearing have no concepts;\n  used qualifiers on `Skin lesion` / `Scaly skin`.\n- `Thickened skin` (finding) doesn't exist; used `Scaly skin` + `Thickened`.\n- `Patch` (morphologic abnormality) doesn't exist.\n- `Back structure` doesn't exist; used `Skin structure of back`.\n- Every body site was confirmed with `exists`: Structure of interdigital web of hand/foot, Axillary\n  region structure, Structure of waist region of trunk, Genital structure, Wrist region structure,\n  Ankle region structure, Antecubital region structure, Popliteal fossa structure, Skin structure of\n  chest, Skin structure of back, Skin structure of sole of foot, Skin structure of heel and Skin\n  structure of border of foot.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Is \"red itchy bumps\" (itchy rash + red papules) too broad for \"insect bites likely\"? It overlaps\n  scabies, which also has red papules, so both diagnoses can fire together. Should insect bites\n  require something more, such as no burrows?\n- Should the No-branch diagnoses (psoriasis, pityriasis rosea, tinea) require the absence of red\n  itchy bumps, as the flowchart order implies? As written, they fire without the health worker\n  answering \"No\".\n- Should the pityriasis rosea rule fire on a herald patch plus multiple small oval lesions alone,\n  without the 2-week sequence?\n- Should the psoriasis rule also accept pitted nails? The page says \"check nails\" but also \"may have\n  pitted nails\". As written, pitted nails aren't checked for.\n- Should impetigo be diagnosed from yellow crusts alone, outside the insect-bite context? The tinea\n  box also mentions yellow crusts (→ 93) but doesn't say \"impetigo likely\".\n- Is `Prurigo simplex` the concept VHA wants for papular urticaria?\n- Is `Pruritic rash` the right recorded complaint for this page, and will page 82 record it?\n- \"Healed with darkening of skin\" is encoded as `Post-inflammatory hyperpigmentation`; the other\n  build used the broader `Hyperpigmentation of skin`. Is the specific concept right for papular\n  urticaria?\n", "claims": [{"claim_id": "c001", "rule": "Check for localised itchy rash conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pruritic rash\" \"disorder\"))", "element_keys": ["p85-74f00f0f"], "quote": "LOCALISED ITCHY RASH"}, {"claim_id": "c002", "rule": "Check for localised itchy rash conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Itching\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "element_keys": ["p85-31ec2960"], "quote": "very itchy"}, {"claim_id": "c003", "rule": "Check for localised itchy rash conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Red color\" \"qualifier value\")))", "element_keys": ["p85-31ec2960"], "quote": "small red bumps"}, {"claim_id": "c004", "rule": "Check for localised itchy rash conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Burrows in skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Structure of interdigital web of hand\" \"body structure\")))", "element_keys": ["p85-31ec2960"], "quote": "webspaces of fingers"}, {"claim_id": "c005", "rule": "Check for localised itchy rash conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Burrows in skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Axillary region structure\" \"body structure\")))", "element_keys": ["p85-31ec2960"], "quote": "axillae"}, {"claim_id": "c006", "rule": "Check for localised itchy rash conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") ( checker": "forward-1", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pityriasis rosea (localised itchy rash)", "text": "The rule ANDs the herald patch with the secondary oval patches. The page describes a sequence ('typically followed within 2 weeks'), so a patient presenting during the herald-patch-only phase gets no diagnosis. The sequence is not representable; an AND is a defensible reading but a clinician may prefer the herald patch alone to be sufficient.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Check for localised itchy rash conditions (check_for)", "text": "No nail finding despite the page's 'check nails' instruction and 'may have pitted nails' for psoriasis. 'Pitting of nails' (disorder) exists in SNOMED. Optional feature, so low.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable scabies (localised itchy rash)", "text": "'small red bumps' encoded without the Small qualifier (Papule of skin + Red color). Papules are by definition small, so this is cosmetic.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tinea corporis (localised itchy rash)", "text": "'Slow-growing' is not encoded and is not representable; the rule fires on any annular raised lesion or annular scale. Acceptable but noted for the clinician.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable insect bites / papular urticaria / impetigo", "text": "Page is hierarchical (insect bites by default; papular urticaria if blisters/darkening; impetigo if yellow crusts), but all three rules share the same base and fire together with no exclusion; insect bites cannot be told from the other two.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tinea corporis", "text": "Permissive OR on annular raised lesion or annular scaly skin; also fires on a pityriasis rosea herald patch and any annular lesion. No clear-centre or slow-growth criterion and no site restriction.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pityriasis rosea", "text": "Omits scale on both herald patch and oval patches; 'Oval shaped lesion' is non-scaly, so the key discriminator versus other oval lesions is lost.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable scabies", "text": "Does not include Pruritic rash anchor as the other itch rules do; harmless given Severe itching. Also 'small' red bumps unrepresented.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "task check_for list", "text": "Task trigger is 'Pruritic rash' disorder; the page title is 'localised itchy rash' with no localisation concept, so scalp routing (95) and flowchart No branch are not represented. Pruritic rash is not in the common-symptom list, so the task may not fire in practice.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "(no priority evaluation)", "text": "Red box only cross-references page 82; absence of a priority rule is appropriate.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable insect bites (localised itchy rash)", "text": "Evidence (Pruritic rash + red papule) is a subset of the scabies picture (severe itching + red papule + burrows), and the task anchor makes Pruritic rash likely to be recorded. Every scabies patient will also get 'Insect bites probable'. On the page, scabies is a separate pre-flowchart exit (-> 84), not a Yes-branch case. No (no Burrows in skin) or similar exclusion is present.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tinea corporis (localised itchy rash)", "text": "A bare 'or' of single findings with no presenting-complaint anchor, no site gate (head/face/trunk/limbs) and no central clearing. 'Scaly skin + Annular shape' alone gives probable tinea corporis, including on the feet, where it co-fires with tinea pedis, and for an annular scaly herald patch.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pityriasis rosea (localised itchy rash)", "text": "Scale is dropped from both the herald patch (fine scale in centre) and the secondary oval patches, and the herald-then-eruption sequence (within 2 weeks) is lost. The rule rests on a large annular lesion on chest/back plus multiple small oval lesions.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Flowchart Yes/No branch (all No-branch rules)", "text": "The exclusivity of the 'red itchy bumps' Yes branch versus the 'No: check site' branch is not represented. Psoriasis, pityriasis rosea and the tinea rules can co-fire with insect bites, papular urticaria and impetigo. Lower impact because the evidence sets mostly differ.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Anchoring across rules", "text": "Pruritic rash is in the evidence for eczema, insect bites, papular urticaria and impetigo, but not for scabies, FDE, psoriasis, pityriasis rosea or the tinea rules, so those fire without the presenting complaint. Pruritic rash is also not a recorded common symptom or warning sign, so the check_for task may never trigger. This needs a note in remaining-questions.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Check for localised itchy rash conditions", "text": "The page says 'check nails' and offers pitted nails for psoriasis, but nails are not in check_for (Pitting of nails (disorder) exists). Otherwise every check_for item is consumed by a rule, and every probable-rule evidence item is in the check_for or the task due_to.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable insect bites (localised itchy rash)", "text": "Page reaches 'Insect bites likely' only after the scabies / eczema / fixed drug eruption checks have been passed. The rule's evidence (itchy + red papules) is a strict subset of the scabies rule's evidence, so every scabies presentation also gets 'insect bites probable'. Consider excluding burrows, e.g. (not (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\"))) or (not (active_condition scabies)).", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pityriasis rosea (localised itchy rash)", "text": "Second conjunct uses 'Oval shaped lesion', a radiology concept, so the rul  85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tinea corporis (localised itchy rash)", "text": "Annular shape inferred from raised edges; 'slow-growing' dropped; or-structure means a herald patch (annular, scaly) also triggers it.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Check for localised itchy rash conditions", "text": "The trigger Pruritic rash drops 'localised' and isn't a recorded common symptom, so a generalised itchy rash also fires this page. The red box is only a cross-reference to page 82, so it rightly has no priority rule. The scalp (95) and nails (97) cross-references aren't modelled, which is acceptable. The check_for items cover every discriminating finding on the page.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable insect bites (localised itchy rash)", "text": "The evidence is only Pruritic rash + red papule, which is the bare 'Yes' answer. It doesn't use the defining part of the question ('may have blistered or healed with darkening') or 'usually occurs in crops'. So every scabies picture (very itchy red bumps) and any red papular itchy rash also yields probable insect bites. Over-broad.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pityriasis rosea (localised itchy rash)", "text": "The secondary patches lose 'scaly' and the 'within 2 weeks' sequence after the herald patch. The herald patch loses 'fine scale in centre'.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 85, "slug": "85-localised-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tinea corporis (localised itchy rash) <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;

const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
