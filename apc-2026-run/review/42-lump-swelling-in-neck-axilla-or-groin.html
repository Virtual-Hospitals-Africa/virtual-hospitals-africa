 headache/backache/body pain, temperature > 38.5°C, fatigue, sore throat/nasal congestion/cough, consider mpox 40. • Check for symptoms/signs suggestive of cancer or if eligible for cancer screening 194. • If none of above, decide how to manage further:", "bbox": [39.7, 399.6, 461.5, 480.5], "key": "p42-abfe1dbc"}, {"id": "p42-out-e11", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Axilla • Check arms, breasts, chest, upper abdomen and back. • If lump in breast 55. No: check lower abdomen, legs, buttocks, genitals, anal region Yes: treat for bubo 65.", "bbox": [201.3, 299.4, 733.6, 342.4], "key": "p42-0934ccaf"}, {"id": "p42-out-e12", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Groin Is the groin lymph node hot and tender?", "bbox": [486.2, 299.4, 634.9, 319.6], "key": "p42-45efa657"}, {"id": "p42-out-e13", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Is medication or infective cause likely?", "bbox": [266.2, 354.8, 405.6, 365.0], "key": "p42-fbbe9bc6"}, {"id": "p42-out-e14", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Localised: ask about other symptoms and look for cause (infection, rash, bite)", "bbox": [317.9, 276.8, 599.1, 287.0], "key": "p42-865a5816"}, {"id": "p42-out-e15", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with lump/swelling in neck, axilla or groin not needing urgent attention • If lump on the skin 89. If lump beneath skin, examine neck, inguinal area, axillae and perineum:", "bbox": [53.1, 159.5, 612.4, 180.7], "key": "p42-64e6b5d2"}, {"id": "p42-out-e16", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Thyroid mass likely if lump in neck that", "bbox": [64.9, 184.1, 213.0, 195.1], "key": "p42-ef60bed1"}, {"id": "p42-out-e17", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "moves up when patient swallows:", "bbox": [75.8, 194.9, 204.2, 205.1], "key": "p42-c30e3edd"}, {"id": "p42-out-e18", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "check TSH and refer same week.", "bbox": [79.5, 204.9, 196.4, 215.1], "key": "p42-63ee8a0b"}, {"id": "p42-out-e19", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Inguinal hernia likely if lump in groin", "bbox": [239.1, 184.1, 380.2, 195.1], "key": "p42-22bbfbff"}, {"id": "p42-out-e20", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "that gets bigger when standing/", "bbox": [249.0, 194.9, 368.3, 205.1], "key": "p42-9e6f669a"}, {"id": "p42-out-e21", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "coughing/passing stools: refer.", "bbox": [252.7, 204.9, 364.6, 215.1], "key": "p42-d3d618cb"}, {"id": "p42-out-e22", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Hidradenitis suppurativa likely if recurrent, painful abscesses in axilla, groin or perineum • Discuss/refer all patients. Also check for diabetes 19, hypertension 148 and mental health 98. • If patient smokes, encourage to stop 164. If overweight/BMI ≥ 25 156.", "bbox": [403.0, 184.1, 780.2, 215.1], "key": "p42-cc0bfa39"}, {"id": "p42-out-e23", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If none of above: a lump in neck, axilla or groin is likely an enlarged lymph node (lymphadenopathy). If unsure, discuss/refer.", "bbox": [53.1, 220.7, 517.1, 231.7], "key": "p42-9622ca78"}, {"id": "p42-out-e24", "page": 42, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No Yes", "bbox": [284.5, 377.4, 526.0, 387.6], "key": "p42-606c9354"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 147.0]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAB/CAIAAADaToLLAAAACXBIWXMAABcSAAAXEgFnn9JSAABzV0lEQVR4nOy9h1cV1/f+//1DfmtFLqgooqAoVhRR7A27YsGKvffeW9TYg7Gj2HtBFEVFUVEUsfcSTUhCjBo16ifv3N/D3bhzMjN3ZuCigO61Xot1p505ZZ+yH8458/9+//98BEEQBEEQBEEQBEEQBKFo8f8KPAaCIAiCIAiCIAiCIAiCkFtE1RIEQRAEQRAEQRAEQRCKHv9Rtf5aOfuvDQsEQRAEQRAEQRAEQRAEoRDyZspwY1Xrf7+nOv/vuiAIgiAIgiAIgiAIgiAUQj6kbBdVSxAEQRAEQRAEQRAEQShiiKolCIIgCIIgCIIgCIIgFD1E1RIEQRAEQRAEQRAEQRCKHqJqCYIgCIIgCIIgCIIgCEUPUbUEQRAEQRAEQRAEQRCEooeoWoIgCIIgCIIgCIIgCELRQ1QtQRAEQRAEQRAEQRAEoeghqpYgCIIgCIIgCIIgCIJQ9BBVSxAEQRAEQRAEQRAEQSh6iKolCIIgCIIgCIIgCIIgFD1E1RIEQfjqePn7+QKPg2BOESqjd68vJxxaBS6c3VbgkTHk1fML/3t/tcCjoceylK9f2Ud5+/svKZahnT6xkW4u8HR9Nn56cpKSfO/WYacbU/ykVamw1dP3b9Lfvkor8GiAW9cOUllkZZ4p8MiY8Ph+YuzaOSuWTDp3ekuBR0YQBEHIG6JqCYIgfGn8+lNy3IZ50yYPiurcMqpTxPAh3devmf3817N0dcrEAY5vvunZrU2Bx1Mw5H/vrzZpUNvHy2vliqkFHhk7/PTkJCwKtGvdqMAjo+fA3hUlfbyrBVd49bxwDWzs1MRRw3tS3p49vdkywFo1gunmAk/a8iUTw2pVPXU89lO/aPf2JZTkhd+OcepM8ZNWpUJYTx/fTyxfrkyZUiXPnyl4gYbMG5w4tr7AI+OOHVu+8y3uTfEcPrhbgcdHEARByBuiagmCIHw5/PXnpSULx8OroWG6SsalPXRPg/CaOPQv7fvh7ZUCj/An5Zdnyds3fzdqeM+8/RM+5VTc4gXjJozty2fevko7fGDl9MmD16+Z/eki+fsvKXCVUUZdIyM+Rbbo0+VhhAuVqqVP3eQJOd715Qs7PQ8/H21AUxMNQy6iqlbd2tVhwy+yzn3qF5mrWp+0Kn3qepoHEg7+QMn/funkAo9M4Ve1YC3cV8Jily2eWOBREgRBEPKGqFqCIAhfDr17tGMZq0mD2oP6dx7Qt1OrFvWDAv15BVZa6o4xI3olHV1X4LH91KxYMomy4tC+mDw8Tv/DrxdWg89cSt1JAU4c2++TRnLPjqXjRkffvnHoU2SLPl0eRrhQqVr61D17cmLy+P5rf5iZL+Hnow1oaqJhyEVR1Xry4Bji0KZlw8/wLnNVy/mJq9InDTwPvH+TvmTh+Nkzhv3x2yfXEy0p/KrWji3fUQzzLPELgiAIhQRRtQRBEL4QNq6bS2P0asEVNDscvXt9mX8/vHvk9vWDAL8f3Uuk369fXKSrb16m0ZkfHx7nR15knTt1PDY5Kdbd5Aucp lump/swelling in neck, axilla or groin\"\n  adult\n  (clinical_finding (snomed_concept \"Mass of body region\" \"finding\"))\n  (check_for\n    (clinical_finding (snomed_concept \"Mass of neck\" \"finding\"))\n    (clinical_finding (snomed_concept \"Mass of axilla\" \"finding\"))\n    (clinical_finding (snomed_concept \"Groin mass\" \"finding\"))\n    (clinical_finding (snomed_concept \"Mass of skin\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Thyroid gland moves with swallowing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Cough impulse of mass present\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Recurrent abscess\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Abscess of axilla\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Abscess of groin\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Abscess of perineum\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Pain in axilla\" \"finding\"))\n    (clinical_finding (snomed_concept \"Inguinal pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Perineal pain\" \"finding\"))\n  )\n)\n;; Page 42 - Red box: lump/swelling in groin\n(task\n  \"Check for urgent lump/swelling in groin conditions\"\n  adult\n  (clinical_finding (snomed_concept \"Groin mass\" \"finding\"))\n  (check_for\n    (clinical_finding (snomed_concept \"Cough impulse of mass present\" \"finding\"))\n    (clinical_finding (snomed_concept \"Severe pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n    (clinical_finding (snomed_concept \"Constipation\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unable to break wind\" \"finding\"))\n    (clinical_finding (snomed_concept \"Groin mass\" \"finding\") (qualifier (snomed_concept \"Irreducible\" \"qualifier value\")))\n\n    (clinical_finding (snomed_concept \"Groin mass\" \"finding\") (qualifier (snomed_concept \"Pulsatile\" \"qualifier value\")))\n  )\n)\n;; Page 42 - Lymphadenopathy work-up: consider mpox\n(task\n  \"Check for mpox features in lymphadenopathy (lump in neck, axilla or groin)\"\n  adult\n  (active_condition (snomed_concept \"Lymphadenopathy\" \"disorder\"))\n  (check_for\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Monkeypox virus\" \"organism\"))\n\n    (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\"))\n    (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Lesion of genitalia\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\") (finding_site (snomed_concept \"Anal structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Lesion of rectum\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Oral lesion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Lesion of eye\" \"disorder\"))\n\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\"))\n    (clinical_finding (snomed_concept \"Fatigue\" \"finding\"))\n    (clinical_finding (snomed_concept \"Sore throat\" \"finding\"))\n    (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Cough\" \"finding\"))\n  )\n)\n;; Page 42 - Red box: incarcerated/strangulated inguinal hernia likely\n(system_diagnosis_rule\n  \"Diagnose probable incarcerated (irreducible) inguinal hernia, lump in groin\"\n  (diagnosis\n    (snomed_concept \"Irreducible inguinal hernia\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Groin mass\" \"finding\"))\n    ;; \"gets bigger when standing/coughing/passing stool\": only the cough impulse has a concept\n    (clinical_finding (snomed_concept \"Cough impulse of mass present\" \"finding\"))\n    (or\n      (clinical_finding (snomed_concept \"Severe pain\" \"finding\"))\n      (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n      ;; \"no stools or flatus/wind for past 24 hours\"\n      (and (>= (onset (clinical_finding (snomed_concept \"Constipation\" \"finding\"))) (time_ago 24 hours))\n           (>= (onset (clinical_finding (snomed_concept \"Unable to break wind\" \"finding\"))) (time_ago 24 hours)))\n      (clinical_finding (snomed_concept \"Groin mass\" \"finding\") (qualifier (snomed_concept \"Irreducible\" \"qualifier value\")))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable strangulated inguinal hernia, lump in groin\"\n  (diagnosis\n    (snomed_concept \"Strangulated inguinal hernia\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Groin mass\" \"finding\"))\n    (clinical_finding (snomed_concept \"Cough impulse of mass present\" \"finding\"))\n    (or\n      (clinical_finding (snomed_concept \"Severe pain\" \"finding\"))\n      (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n      (and (>= (onset (clinical_finding (snomed_concept \"Constipation\" \"finding\"))) (time_ago 24 hours))\n           (>= (onset (clinical_finding (snomed_concept \"Unable to break wind\" \"finding\"))) (time_ago 24 hours)))\n      (clinical_finding (snomed_concept \"Groin mass\" \"finding\") (qualifier (snomed_concept \"Irreducible\" \"qualifier value\")))\n    )\n  )\n)\n;; Page 42 - Red box: pulsating lump, aneurysm likely\n(system_diagnosis_rule\n  \"Diagnose probable aneurysm, pulsating lump in groin\"\n  (diagnosis\n    (snomed_concept \"Aneurysm\" \"disorder\")\n    probable\n  )\n  adult\n  (clinical_finding (snomed_concept \"Groin mass\" \"finding\") (qualifier (snomed_concept \"Pulsatile\" \"qualifier value\")))\n)\n;; Page 42 - Approach (not needing urgent attention)\n(system_diagnosis_rule\n  \"Diagnose probable thyroid mass, lump in neck moving on swallowing\"\n  (diagnosis\n    (snomed_concept \"Mass of thyroid gland\" \"finding\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Mass of neck\" \"finding\"))\n    (clinical_finding (snomed_concept \"Thyroid gland moves with swallowing\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable inguinal hernia, lump in groin\"\n  (diagnosis\n    (snomed_concept \"Inguinal hernia\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Groin mass\" \"finding\"))\n    (clinical_finding (snomed_concept \"Cough impulse of mass present\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable hidradenitis suppurativa, recurrent painful abscesses\"\n  (diagnosis\n    (snomed_concept \"Hidradenitis suppurativa\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Recurrent abscess\" \"disorder\"))\n    (or\n      (and (clinical_finding (snomed_concept \"Abscess of axilla\" \"disorder\"))\n           (clinical_finding (snomed_concept \"Pain in axilla\" \"finding\")))\n      (and (clinical_finding (snomed_concept \"Abscess of groin\" \"disorder\"))\n           (clinical_finding (snomed_concept \"Inguinal pain\" \"finding\")))\n      (and (clinical_finding (snomed_concept \"Abscess of perineum\" \"disorder\"))\n           (clinical_finding (snomed_concept \"Perineal pain\" \"finding\")))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable lymphadenopathy, lump in neck, axilla or groin\"\n  (diagnosis\n    (snomed_concept \"Lymphadenopathy\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (or\n      (clinical_finding (snomed_concept \"Mass of neck\" \"finding\"))\n      (clinical_finding (snomed_concept \"Mass of axilla\" \"finding\"))\n      (clinical_finding (snomed_concept \"Groin mass\" \"finding\"))\n    )\n    ;; \"If none of above\": not on the skin, not thyroid, not hernia, not hidradenitis\n    (no (clinical_finding (snomed "))))", "B": "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Recurrent abscess\" \"disorder\") (snomed_concept \"No\" \"qualifier value\")))"}]}, "diagnosis": {"only_A": [], "only_B": ["(diagnosis (snomed_concept \"Strangulated inguinal hernia\" \"disorder\") probable)"], "both": ["(diagnosis (snomed_concept \"Aneurysm\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Hidradenitis suppurativa\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Inguinal hernia\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Irreducible inguinal hernia\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Lymphadenopathy\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Mass of thyroid gland\" \"finding\") probable)", "(diagnosis (snomed_concept \"Monkeypox\" \"disorder\") possible)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 42 – Lump/swelling in neck, axilla or groin: flowchart\n\nSource: APC 2026 e-book page 42. Red box at top; the \"not needing urgent\nattention\" approach and lymphadenopathy work-up below it.\n\n```mermaid\nflowchart TD\n    START[\"Lump/swelling in neck, axilla or groin\"]\n    START --> RB{\"Lump/swelling in groin and any of the red-box items?\"}\n    RB -- \"Gets bigger when standing/coughing/passing stool AND any of:<br/>severe pain, vomiting, no stools or flatus for past 24 h, lump cannot be reduced\" --> HERNIA_URG[\"Incarcerated/strangulated inguinal hernia likely<br/>Refer urgently\"]\n    RB -- \"Pulsating lump\" --> ANEU[\"Aneurysm likely<br/>Refer urgently\"]\n    RB -- No --> SKIN{\"Lump on the skin?\"}\n    SKIN -- Yes --> P89[\"→ page 89\"]\n    SKIN -- \"No (beneath skin): examine neck, inguinal area, axillae, perineum\" --> THY{\"Lump in neck that moves up on swallowing?\"}\n    THY -- Yes --> THYM[\"Thyroid mass likely<br/>TSH, refer same week\"]\n    THY -- No --> IH{\"Lump in groin that gets bigger when standing/coughing/passing stools?\"}\n    IH -- Yes --> IHL[\"Inguinal hernia likely: refer\"]\n    IH -- No --> HS{\"Recurrent, painful abscesses in axilla, groin or perineum?\"}\n    HS -- Yes --> HSL[\"Hidradenitis suppurativa likely<br/>discuss/refer\"]\n    HS -- No --> LAD[\"None of above: lymphadenopathy likely\"]\n    LAD --> MED[\"Review medication (drug hypersensitivity)\"]\n    MED --> LOC{\"Localised or generalised (≥ 2 areas)?\"}\n    LOC -- Generalised --> W[\"Work-up (No branch)\"]\n    LOC -- Localised --> SITE[\"Neck / Axilla / Groin: look for cause\"]\n    SITE --> GROIN{\"Groin: node hot and tender?\"}\n    GROIN -- Yes --> BUBO[\"Treat for bubo → page 65\"]\n    GROIN -- No --> CAUSE{\"Is medication or infective cause likely?\"}\n    SITE --> CAUSE\n    CAUSE -- Yes --> SYMP[\"Manage as on symptom page;<br/>if node persists > 4 weeks, manage as No branch\"]\n    CAUSE -- No --> W\n    W[\"Test HIV, TB, syphilis, FBC;<br/>cough/weight loss/night sweats/fever → aspirate node for TB;<br/>mpox contact + rash/lesion + ≥ 1 symptom → consider mpox;<br/>cancer symptoms/screening\"]\n    W --> DEC{\"Generalised, unwell or node getting bigger quickly?\"}\n    DEC -- Yes --> RSW[\"Refer same week\"]\n    DEC -- \"No (localised and well)\" --> REAS[\"Reassure; return if symptoms;<br/>refer if > 4 weeks\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `Mass of body region` (the recorded common symptom \"Lump\"); site recorded as `Mass of neck` / `Mass of axilla` / `Groin mass` | `Check for causes of lump/swelling in neck, axilla or groin` |\n| Red box, lump in groin | `Groin mass` triggers the red-box check | `Check for urgent lump/swelling in groin conditions` |\n| RB hernia branch | `Groin mass` **and** `Cough impulse of mass present` **and** any of `Severe pain`, vomiting, (constipation **and** unable to break wind, both onset ≥ 24 h), groin mass with `Irreducible` qualifier | `Diagnose probable incarcerated (irreducible) inguinal hernia, lump in groin`, `Diagnose probable strangulated inguinal hernia, lump in groin` |\n| RB pulsating lump | `Groin mass` with `Pulsatile` qualifier | `Diagnose probable aneurysm, pulsating lump in groin` |\n| Refer urgently | `Urgent` priority: groin mass **and** either hernia diagnosis or aneurysm | `Urgent: lump/swelling in groin with incarcerated/strangulated hernia or aneurysm` |\n| Lump on the skin | `Mass of skin`: cross-reference only (page 89); used as an exclusion for lymphadenopathy | `Diagnose probable lymphadenopathy, lump in neck, axilla or groin` (as `(no …)`) |\n| Thyroid mass | `Mass of neck` **and** `Thyroid gland moves with swallowing` | `Diagnose probable thyroid mass, lump in neck moving on swallowing` |\n| Inguinal hernia | `Groin mass` **and** `Cough impulse of mass present` | `Diagnose probable inguinal hernia, lump in groin` |\n| Hidradenitis suppurativa | recurrent abscess of axilla/groin/perineum, each paired with pain at that site | `Diagnose probable hidradenitis suppurativa, recurrent painful abscesses` |\n| None of above → lymphadenopathy | lump in neck/axilla/groin **and** explicit absence of: skin mass, thyroid moving with swallowing, cough impulse, recurrent abscess at each of the three sites | `Diagnose probable lymphadenopathy, lump in neck, axilla or groin` |\n| Consider mpox | `Lymphadenopathy` active **and** exposure to monkeypox virus **and** rash/lesion **and** ≥ 1 of the listed symptoms or temperature > 38.5 °C | `Diagnose possible mpox in lymphadenopathy (lump in neck, axilla or groin)`, fed by `Check for mpox features in lymphadenopathy (lump in neck, axilla or groin)` |\n| Localised / generalised, hot and tender groin node (bubo), medication/infective cause, TB symptoms, refer same week / reassure | Routing and management; not modelled (see remaining questions) | — |\n", "questions": "# Page 42 – Lump/swelling in neck, axilla or groin: remaining questions\n\n## Decisions made\n\n- **Anchor.** The main task fires on `Mass of body region`, the recorded common symptom \"Lump\"\n  (its anchor comment names this page). `Mass of neck`, `Mass of axilla` and `Groin mass` are\n  descendants of it and are checked for to record the site. The red-box task fires on `Groin mass`\n  because the red box applies only to \"lump/swelling in groin\".\n- **Incarcerated/strangulated inguinal hernia.** SNOMED has `Irreducible inguinal hernia`\n  (synonym \"incarcerated inguinal hernia\") and `Strangulated inguinal hernia`, which is *not* a\n  descendant of it. Two probable rules with identical evidence, one per concept; the Urgent rule\n  references both.\n- **\"Gets bigger when standing/coughing/passing stool\"** is encoded as\n  `Cough impulse of mass present` in both the urgent hernia rules and the non-urgent inguinal\n  hernia rule.\n- **\"No stools or flatus/wind for past 24 hours\"** is `Constipation` **and** `Unable to break wind`,\n  each with `(>= (onset …) (time_ago 24 hours))` (onset at least 24 hours ago = present for the\n  past 24 hours).\n- **\"Lump cannot be reduced\"** and **\"Pulsating lump\"** are `Groin mass` with the `Irreducible` /\n  `Pulsatile` qualifier; the pulsating lump is read as a groin lump because the red box's header\n  restricts it to lump/swelling in groin.\n- **Aneurysm** uses the general `Aneurysm` (disorder); the page does not name a type (e.g. femoral).\n- **Priority.** `Urgent` (the page says \"Refer urgently\", no explicit emergency escalation),\n  structured as `(and Groin mass (or …diagnoses…))`.\n- **Thyroid mass** is diagnosed as `Mass of thyroid gland` (finding), the exact concept; evidence\n  `Mass of neck` and `Thyroid gland moves with swallowing`.\n- **Hidradenitis suppurativa**: `Recurrent abscess` **and** an abscess at one of axilla/groin/perineum\n  paired with pain at the same site (\"painful\"; no \"painful\" qualifier exists).\n- **Lymphadenopathy (\"If none of above\")** requires a lump at one of the three sites **and** an\n  explicit `(no …)` for each \"above\" discriminator: lump on the skin, thyroid moving on swallowing,\n  cough impulse, recurrent abscess. A first version used the site abscesses with a `Recurrent`\n  qualifier inside `(no …)`; the gate could not match a qualified finding inside `(no …)` and\n  flagged an always-true branch, so the precoordinated `Recurrent abscess` is used instead (same\n  meaning, not a restructure of the logic).\n- **Consider mpox** is a `possible` Monkeypox rule. It is gated on probable lymphadenopathy\n  (the bullet sits in that work-up branch), exposure to monkeypox virus, rash or lesion at a listed\n  site, and at least one of the listed symptoms or temperature > 38.5 °C. Its findings are in a\n  dedicated check task fired by lymphadenopathy.\n- **Reconciliation.** This final build is builder B's, with builder A's anal-lesion condition added to\n  the mpox check and rule. Builder A's alternatives that were not taken (per-site neck/axilla tasks,\n  `Cough impulse in inguinal canal`, `Obstipation`, site-qualified `Recurrent abscess`, a single\n  hernia diagnosis) are recorded in `reconcile.json`.\n- No `measure` task: the only measurement (temperature) is a routine vital.\n- No `manage` tasks (TSH, refer, HIV/TB/syphilis tests, FBC, node aspiration, reassure, medication review).\n\n## Could not model\n\n- **Enlargement on standing or passing stool**: only the cough impulse is representable. The hernia\n  rules fire **less often** than the page intends (a lump that enlarges only on standing/straining\n  is missed).\n- **\"No stools\"** has no concept; `Constipation` is broader, but it is paired with\n  `Unable to break wind`. Fires about as intended; slightly more often if constipation without total\n  absence of stool is recorded.\n- **Lymphadenopathy \"none of above\"** needs four explicit negative findings; if the nurse leaves any\n  unrecorded the rule fires **less often** than intended. It also does not exclude the red-box\n  causes (pulsatile/irreducible lump); the page puts those under urgent attention first.\n- **Mpox**: \"in the 21 days before symptom onset\" (relative to symptom onset, not to now) and\n  \"unexplained\" rash are not modelled, so the rule fires **more often**. Contact with a\n  probable/confirmed case is approximated by exposure to monkeypox virus.\n- **Localised vs generalised lymphadenopathy (≥ 2 areas)**, \"Is medication or infective cause\n  likely?\", \"Unwell\", \"lymph node getting bigger quickly\", \"persists > 4 weeks\": routing to\n  management (refer same week / reassure), not diagnoses; not modelled.\n- **TB symptoms (cough, weight loss, night sweats, fever)** lead only to a referral for node\n  aspiration (management); no \"consider TB\" on this page.\n- **Drug hypersensitivity** (\"Review medication: … can cause … Discuss with doctor\") is a\n  medication review, not a \"consider\"; not modelled.\n\n## SNOMED gaps\n\n- **Bubo** (hot and tender groin node → \"treat for bubo 65\"): only `Bubo` (morphologic abnormality)\n  and `Inguinal bubo` (qualifier value) exist, no disorder; \"hot\" lymph node has no concept. Left as\n  routing to page 65.\n- **Lesion of anus** (mpox lesion sites): no concept; encoded as `Skin lesion` with finding_site\n  `Anal structure` (taken from builder A in reconciliation).\n- **\"Painful\"** qualifier: none; site pain findings used instead.\n- **\"No stools\"/absolute constipation**: none; see above.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should an incarcerated/strangulated hernia also be suspected when the lump does *not* show a cough\n  impulse but is irreducible and painful (the page's wording requires the enlarging lump)?\n- Is the pulsating-lump criterion meant only for groin lumps (as the red-box header says) or for\n  neck lumps too (e.g. carotid aneurysm)?\n- Is it acceptable that mpox is only considered once lymphadenopathy is diagnosed, or should page\n  40's own rule be relied on?\n- \"No stools or flatus/wind for past 24 hours\": is `Constipation` **and** `Unable to break wind`\n  (both onset ≥ 24 h) right, or should it be `Obstipation` alone (builder A's encoding)?\n- Is \"cough impulse\" an acceptable stand-in for \"gets bigger when standing/coughing/passing stool\"?\n- Should \"painful\" abscesses for hidradenitis require pain at the abscess site (as encoded), or is a\n  recurrent abscess at the site enough?\n- Should \"treat for bubo\" be diagnosed here (e.g. as a sexually transmitted infection syndrome) once\n  page 65's concept is settled?\n", "claims": [{"claim_id": "c001", "rule": "Check for causes of lump/swelling in neck, axilla or groin", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Mass of body region\" \"finding\"))", "element_keys": ["p42-a507183a"], "quote": "LUMP/SWELLING IN NECK, AXILLA OR GROIN"}, {"claim_id": "c002", "rule": "Check for causes of lump/swelling in neck, axilla or groin", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Mass of neck\" \"finding\"))", "element_keys": ["p42-a507183a"], "quote": "NECK"}, {"claim_id": "c003", "rule": "Check for causes of lump/swelling in neck, axilla or groin", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Mass of axilla\" \"finding\"))", "element_keys": ["p42-a507183a"], "quote": "AXILLA"}, {"claim_id": "c004", "rule": "Check for causes of lump/swelling in neck, axilla or groin", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Groin mass\" \"finding\"))", "element_keys": ["p42-a507183a"], "quote": "GROIN"}, {"claim_id": "c005", "rule": "Check for causes of lump/swelling in neck, axilla or groin", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical fi ls or flatus/wind for past 24 hours; (e) lump cannot be reduced; (f) incarcerated/strangulated inguinal hernia likely.", "verdict": "error", "parts_missing": [], "problem": "Part (d) is encoded as an AND of two 24-hour findings: constipation with onset >= 24 hours ago AND unable to break wind with onset >= 24 hours ago. The page lists 'no stools or flatus/wind for past 24 hours' as one item in an 'any of' list, i.e. either absence qualifies; requiring both is stricter than the page, so a patient with 24 hours of no stools but who can still pass wind (or vice versa) does not reach the probable diagnosis and the Urgent priority. The other parts are correct: (a) Groin mass + Cough impulse of mass present (a reasonable proxy for 'gets bigger when standing/coughing/passing stool'; the standing/straining components are not separately represented but the SNOMED cough-impulse concept is the standard sign for a reducible hernia); (b) Severe pain; (c) Finding of vomiting; (e) Groin mass with Irreducible qualifier; (f) two probable rules, Irreducible inguinal hernia and Strangulated inguinal hernia, with identical evidence, which matches the page's 'incarcerated/strangulated' wording. The 'past 24 hours' is approximated with Constipation onset >= 24 hours ago; the language cannot say 'no stool passed', so this is the closest available.", "evidence": ["Diagnose probable incarcerated (irreducible) inguinal hernia, lump in groin :: (and (clinical_finding (snomed_concept \"Groin mass\" \"finding\")) (clinical_finding (snomed_concept \"Cough impulse of mass present\" \"finding\")) (or (clinical_finding (snomed_concept \"Severe pain\" \"finding\")) (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\")) (and (>= (onset (clinical_finding (snomed_concept \"Constipation\" \"finding\"))) (time_ago 24 hours)) (>= (onset (clinical_finding (snomed_concept \"Unable to break wind\" \"finding\"))) (time_ago 24 hours))) (clinical_finding (snomed_concept \"Groin mass\" \"finding p42-d3d618cb", "scope": "in_scope", "scope_reason": "'coughing/passing stools' completes the hernia criterion; 'refer' is a management step and is not judged.", "verdict": "correct", "parts_missing": [], "problem": "", "evidence": ["Diagnose probable inguinal hernia, lump in groin :: (clinical_finding (snomed_concept \"Cough impulse of mass present\" \"finding\"))"], "confidence": "medium"}, {"element_key": "p42-cc0bfa39", "scope": "in_scope", "scope_reason": "'Hidradenitis suppurativa likely if recurrent, painful abscesses in axilla, groin or perineum' is an X-likely conclusion; the rest of the box (discuss/refer, check for diabetes/hypertension/mental health, smoking, BMI) is management and cross-reference.", "verdict": "correct", "parts_missing": [], "problem": "Every part of the criterion is represented: recurrent (Recurrent abscess), site (Abscess of axilla / groin / perineum, OR-ed), painful (site-specific pain finding paired with each site). The encoding is strict: three separate findings must be recorded (Recurrent abscess, the site abscess, the site pain) for a single page phrase, and 'painful' would more naturally be a qualifier on the abscess than a separate pain finding. Not wrong, but harder to satisfy than the page.", "evidence": ["Diagnose probable hidradenitis suppurativa, recurrent painful abscesses :: (and (clinical_finding (snomed_concept \"Recurrent abscess\" \"disorder\")) (or (and (clinical_finding (snomed_concept \"Abscess of axilla\" \"disorder\")) (clinical_finding (snomed_concept \"Pain in axilla\" \"finding\"))) (and (clinical_finding (snomed_concept \"Abscess of groin\" \"disorder\")) (clinical_finding (snomed_concept \"Inguinal pain\" \"finding\"))) (and (clinical_finding (snomed_concept \"Abscess of perineum\" \"disorder\")) (clinical_finding (snomed_concept \"Perineal pain\" \"finding\")))))"], "confidence": "medium"}, {"element_key": "p42-9622ca78", "scope": "in_scope", "scope_reason": "'If none of above: a lump in neck, axilla or groin is likely an enlarged lymph node (lymphadenopathy)' is an X-likely conclusion with a none-of-the-above condition; 'If unsure, discuss/refer' is management.", "verdict": "correct", "parts_missing": [], "problem": "Site OR (Mass of neck / Mass of axilla / Groin mass) with (no ...) exclusions for each discriminating finding on the page: skin lump (-> 89), thyroid movement, cough impulse (hernia), recurrent abscess (hidradenitis). The urgent red-box features (pulsatile, irreducible) are not excluded, but those are subsets of the cough-impulse/groin-mass logic and the page does not list them under 'above' for this purpose, so this is acceptable.", "evidence": ["Diagnose probable lymphadenopathy, lump in neck, axilla or groin :: (and (or (clinical_finding (snomed_concept \"Mass of neck\" \"finding\")) (clinical_finding (snomed_concept \"Mass of axilla\" \"finding\")) (clinical_finding (snomed_concept \"Groin mass\" \"finding\"))) (no (clinical_finding (snomed_concept \"Mass of skin\" \"finding\"))) (no (clinical_finding (snomed_concept \"Thyroid gland moves with swallowing\" \"finding\"))) (no (clinical_finding (snomed_concept \"Cough impulse of mass present\" \"finding\"))) (no (clinical_finding (snomed_concept \"Recurrent abscess\" \"disorder\"))))"], "confidence": "high"}, {"element_key": "p42-0eb7409a", "scope": "borderline", "scope_reason": "Two parts. (1) 'Review medication: atenolol, allopurinol, co-trimoxazole, phenytoin and antibiotics can cause a drug hypersensitivity reaction with lymphadenopathy' is a causal hint that the house standard could treat as a 'consider drug hypersensitivity' possible diagnosis, but the page phrases it as a review step ending in 'Discuss with doctor'. (2) 'Is lymphadenopathy localised (neck or axilla or groin) or generalised (>= 2 areas)?' is the flowchart's first decision; it drives the generalised branch (tests) and the refer-same-week outcome, so it is more than pure routing.", "verdict": "missing", "parts_missing": ["drug-hype  days before symptom onset') is not encoded; the exposure is a (finding (Exposure to ...) (Monkeypox virus)) and onset/time_ago applies only to a clinical_finding or active_condition subject, so this is likely not_representable and should be recorded as such"], "problem": "Part (c) is otherwise encoded faithfully: possible Monkeypox requires active lymphadenopathy, exposure to Monkeypox virus, at least one of the rash/lesion sites (Eruption; Skin lesion; Lesion of genitalia; Skin lesion at Anal structure; Lesion of rectum; Oral lesion; Lesion of eye), and at least one of headache / backache / body pain (Generalized aches and pains) / temperature > 38.5 C / fatigue / sore throat / nasal congestion / cough, matching the page's two-group AND. 'Unexplained' on the rash is not representable. Part (b) is missing entirely: the page's cough/weight loss/night sweats/fever cluster is the one place it tells the clinician to suspect TB, and the house standard maps 'suspect X' to a possible rule; it is borderline because the page phrases it as a referral for testing rather than 'TB likely'.", "evidence": ["Diagnose possible mpox in lymphadenopathy (lump in neck, axilla or groin) :: (and (active_condition (snomed_concept \"Lymphadenopathy\" \"disorder\")) (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Monkeypox virus\" \"organism\")) (or (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\")) (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\")) (clinical_finding (snomed_concept \"Lesion of genitalia\" \"disorder\")) (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\") (finding_site (snomed_concept \"Anal structure\" \"body structure\"))) (clinical_finding (snomed_concept \"Lesion of rectum\" \"disorder\")) (clinical_finding (snomed_concept \"Oral lesion\" \"disorder\")) (clinical_finding (snomed_concept \"Lesion of eye\" \"disorder\"))) (or (clinical_finding (snomed_concept \"Headache\" \"finding\")) (clinical_finding (snomed_concept \"Backache\" \"finding\")) (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\")) (> (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38.5) (clinical_finding (snomed_concept \"Fatigue\" \"finding\")) (clinical_finding (snomed_concept \"Sore throat\" \"finding\")) (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\")) (clinical_finding (snomed_concept \"Cough\" \"finding\"))))", "Check for mpox features in lymphadenopathy (lump in neck, axilla or groin) :: (task ... (active_condition (snomed_concept \"Lymphadenopathy\" \"disorder\")) (check_for (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Monkeypox virus\" \"organism\")) ... (clinical_finding (snomed_concept \"Cough\" \"finding\"))))"], "confidence": "medium"}, {"element_key": "p42-aee39615", "scope": "out_of_scope", "scope_reason": "management_step", "verdict": null, "parts_missing": [], "problem": "Manage as on symptom page, reassure, return if symptoms develop, refer if node persists > 4 weeks: all management. The '> 4 weeks' threshold decides a referral, not a diagnosis, and manage tasks are excluded from this pass.", "evidence": [], "confidence": "high"}, {"element_key": "p42-43bba3b9", "scope": "borderline", "scope_reason": "'Generalised lymphadenopathy or Unwell or Lymph node/s getting bigger quickly' are the criteria for 'Refer same week'. They are triage criteria, but 'refer same week' is not a priority level the house standard assigns (the red box alone maps to Urgent), so the outcome has no clear home in the language other than a manage task, which is excluded.", "verdict": "missing", "parts_missing": ["generalised lymphadenopathy (Generalized enlarged lymph nodes exists in SNOMED)", "unwell (Generally unwell / Malaise exist)", "lymph node/s getting bigger quickly (no SNOMED finding found; would need a qualifier)"], "problem": "None of the three criteria is in a check_for or used by a rule. If the project wants same-week referral criteria captured, these are the ones on this page.", "evidence": [], "confidence": "medium"}, {"element_key": "p42-d433b932", "scope": "out_of_scope", "scope_reason": "management_step", "verdict": null, "parts_missing": [], "problem": "'Refer same week' is a disposition; see p42-43bba3b9 for its criteria.", "evidence": [], "confidence": "high"}], "outside_not_logic": ["p42-a507183a", "p42-d39309e6", "p42-06bb25b2", "p42-522a4fa5", "p42-606c9354"], "rule_level_problems": [{"rule": "Diagnose probable incarcerated (irreducible) inguinal hernia, lump in groin; Diagnose probable strangulated inguinal hernia, lump in groin", "problem": "'and' where the page means 'or': the 24-hour obstruction item is encoded as constipation >= 24 h AND unable to break wind >= 24 h. The page's 'no stools or flatus/wind for past 24 hours' sits inside an 'any of' list and reads as either absence. Because the Urgent priority depends on these probable diagnoses via active_condition, the stricter conjunction also narrows the red-box trigger.", "severity": "medium"}, {"rule": "(whole file) lower flowchart", "problem": "Nothing below the 'lymphadenopathy likely' rule is encoded except mpox. The lost branches are: localised vs generalised (>= 2 areas); groin node hot and tender -> bubo (-> 65); cough / weight loss / night sweats / fever -> suspect TB (aspirate for TB testing); generalised or unwell or node enlarging quickly -> refer same week. The bubo and TB-suspicion branches are the ones the house standard would most plausibly expect as possible diagnoses; the others resolve to management/referral and are arguably out of scope, but no remaining-questions decision is visible in the rules to confirm that was deliberate.", "severity": "medium"}, {"rule": "Diagnose possible mpox in lymphadenopathy (lump in neck, axilla or groin)", "problem": "The 21-day exposure window before symptom onset is not encoded and is probably not representable (onset/time_ago takes a clinical_finding or active_condition, not an exposure finding). Should be flagged as not_representable rather than silently dropped.", "severity": "low"}, {"rule": "Diagnose probable hidradenitis suppurativa, recurrent painful abscesses", "problem": "Three separately recorded findings (Recurrent abscess + site abscess + site pain) are needed to satisfy one page phrase; 'painful' as a separate regional pain finding is an indirect reading of 'painful abscesses'. Over-strict rather than wrong.", "severity": "low"}, {"rule": "Diagnose probable incarcerated (irreducible) inguinal hernia; Diagnose probable strangulated inguinal hernia", "problem": "Identical evidence in two probable rules, so both diagnoses are always produced together. This follows the page's 'incarcerated/strangulated' wording, but the irreducible-lump item alone is really the incarceration criterion while pain/vomiting/obstruction point to strangulation; a split would be more faithful clinically. Low because the page itself does not separate them.", "severity": "low"}, {"rule": "Check for causes of lump/swelling in neck, axilla or groin", "problem": "The task is triggered by Mass of body region, of which Mass of neck, Mass of axilla, Groin mass and Mass of skin are all descendants, and then checks for those same four findings. The test's exact-string self-reference check passes, but when the trigger is a recorded Groin mass the task asks the clinician to confirm the finding that triggered it. Harmless, but the site findings could be dropped from check_for since they are the triggers.", "severity": "low"}, {"rule": "Diagnose probable thyroid mass, lump in neck moving on swallowing", "problem": "'Thyroid gland moves with swallowing' presupposes the lump is thyroid; the page's criterion is that the neck lump moves on swallowing. No better SNOMED concept was found (no 'neck mass moves on swallowing'), so this is the best available and should page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "(whole file) lower flowchart", "text": "Nothing below the 'lymphadenopathy likely' rule is encoded except mpox. The lost branches are: localised vs generalised (>= 2 areas); groin node hot and tender -> bubo (-> 65); cough / weight loss / night sweats / fever -> suspect TB (aspirate for TB testing); generalised or unwell or node enlarging quickly -> refer same week. The bubo and TB-suspicion branches are the ones the house standard would most plausibly expect as possible diagnoses; the others resolve to management/referral and are arguably out of scope, but no remaining-questions decision is visible in the rules to confirm that was deliberate.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Diagnose possible mpox in lymphadenopathy (lump in neck, axilla or groin)", "text": "The 21-day exposure window before symptom onset is not encoded and is probably not representable (onset/time_ago takes a clinical_finding or active_condition, not an exposure finding). Should be flagged as not_representable rather than silently dropped.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Diagnose probable hidradenitis suppurativa, recurrent painful abscesses", "text": "Three separately recorded findings (Recurrent abscess + site abscess + site pain) are needed to satisfy one page phrase; 'painful' as a separate regional pain finding is an indirect reading of 'painful abscesses'. Over-strict rather than wrong.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Diagnose probable incarcerated (irreducible) inguinal hernia; Diagnose probable strangulated inguinal hernia", "text": "Identical evidence in two probable rules, so both diagnoses are always produced together. This follows the page's 'incarcerated/strangulated' wording, but the irreducible-lump item alone is really the incarceration criterion while pain/vomiting/obstruction point to strangulation; a split would be more faithful clinically. Low because the page itself does not separate them.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Check for causes of lump/swelling in neck, axilla or groin", "text": "The task is triggered by Mass of body region, of which Mass of neck, Mass of axilla, Groin mass and Mass of skin are all descendants, and then checks for those same four findings. The test's exact-string self-reference check passes, but when the trigger is a recorded Groin mass the task asks the clinician to confirm the finding that triggered it. Harmless, but the site findings could be dropped from check_for since they are the triggers.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Diagnose probable thyroid mass, lump in neck moving on swallowing", "text": "'Thyroid gland moves with swallowing' presupposes the lump is thyroid; the page's criterion is that the neck lump moves on swallowing. No better SNOMED concept was found (no 'neck mass moves on swallowing'), so this is the best available and should be noted as a SNOMED gap rather than fixed.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Urgent: lump/swelling in groin with incarcerated/strangulated hernia or aneurysm", "text": "The priority rule relies on active_condition of diagnoses produced by probable rules. This is the briefing's pattern, but the groin mass requirement is redundant with the diagnoses, and the Urgent level is justified by 'Give urgent attention'/'Refer urgently'. No problem otherwise.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Diagnose probable incarcerated (irreducible) inguinal hernia / strangulated inguinal hernia", "text": "The two rules are identical, so any patient meeting one meets the other. The page gives one combined criterion ('incarcerated/strangulated'), so this is faithful but undiscriminating.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Diagnose probable lymphadenopathy", "text": "Pulsatile groin mass is not excluded, so a suspected aneurysm also yields probable lymphadenopathy. Hernia without cough impulse (bigger on standing/straining) also yields lymphadenopathy.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Check for mpox features in lymphadenopathy", "text": "check_for lacks Body temperature > 38.5 although the mpox diagnosis rule uses it; the 21-day contact window is not representable.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium", "ref": "Check for causes of lump/swelling in neck, axilla or groin", "text": "Not a problem per se, but the generalised/localised split, bubo and drug-hypersensitivity branches from the flowchart are lost with no non-urgent referral priority.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 42, "slug": "42-lump-swelling-in-neck-axilla-or-groin", "kind": "rule", "priority": "medium   get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
