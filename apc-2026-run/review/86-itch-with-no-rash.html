_y": -1, "indent": 0, "parent": null, "text": "• If itch persists > 2 weeks: - Test for anaemia 44, HIV 124 and diabetes 19. - Refer to doctor same day.", "bbox": [528.2, 366.2, 735.1, 396.4], "key": "p86-ceb136ec"}, {"id": "p86-out-e14", "page": 86, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Advise to: - Avoid hot baths, wool/itchy fabrics and scratching as these may worsen itch. - Wash with aqueous cream (UEA) instead of soap. Avoid using aqueous cream as moisturiser. - Moisturise skin with emulsifying ointment (UE) twice a day. - Avoid scrubbing the skin and washing more than once a day. Gently pat skin dry. - Keep nails short and clean. • If known with a life-limiting illness, also give palliative care 191.", "bbox": [218.8, 444.3, 574.9, 514.5], "key": "p86-71db33f1"}, {"id": "p86-out-e15", "page": 86, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If no better or diagnosis uncertain, discuss/refer.", "bbox": [327.5, 531.7, 514.4, 542.7], "key": "p86-7d315bca"}], "boxes": [{"box": 1, "rect": [35.5, 86.1, 806.4, 107.6]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAAuCAIAAAAdnFmZAAAACXBIWXMAABcSAAAXEgFnn9JSAAAV7UlEQVR4nO3daVAU19oHcG7l3pvv98Nb74db9SYZE6PmGvclBuOCVyUaEwSXuMcFEFxwg4igoETFPUZU3FBUEAMiKiiLKJsDsjkI4oYbGNTgggiyJPM+M89wbHt6ZpRIYOK/6lepmZ7T3afPaUz1v845bVPx7zYAAAAAAAAAAADWxabFawAAAAAAAAAAAPC6kGoBAAAAAAAAAID1eSnVeh7qWRvhAwAAAAAAAAAA0ApVr5+mnGppH57TNhQCAAAAAAAAAAC0Qr+d34NUCwAAAAAAAAAArAxSLQAAAAAAAAAAsD5ItQAAAAAAAAAAwPog1QIAAAAAAAAAAOuDVAsAAAAAAAAAAKwPUi0AAAAAAAAAALA+SLUAAAAAAAAAAMD6INUCAAAAAAAAAADrg1QLAAAAAAAAAACsD1ItAAAAAAAAAACwPki1AAAAAAAAAADA+iDVAgAAeA2XLiYmxh8iD+9nvcHDlpdm8GGvXzljsXB9TUHN03zplt/rCxMTIoKDNx48uL3qUe4bPFeLoEugK2rxarxx9++queWvXU5u8cq8tSorcpr7FLlXYlr8MgEAAN4SSLUAAAAUFBUk/Lg5cN78OU6jnKZMmeTt7Zl5Tvek6rt0ser/3iP89U2JObqPD/vTT2vMl7xzI7V3r96dO3U6n3mctzx7kjdmzGjenZTeSntT52oRcbEH27f92G6g3dOHzZ4+/MkS4w9x Diagnose probable dry skin in itch with no rash\"\n  (diagnosis\n    (snomed_concept \"Xeroderma\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Itching\" \"finding\"))\n    (no (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\")))\n    (no (clinical_finding (snomed_concept \"Infestation caused by Sarcoptes scabiei var hominis\" \"disorder\")))\n    (no (clinical_finding (snomed_concept \"Louse infestation\" \"disorder\")))\n    (no (clinical_finding (snomed_concept \"Insect bite - wound\" \"disorder\")))\n    ;; Is the skin very dry? = Yes\n    (clinical_finding (snomed_concept \"Severe dry skin\" \"disorder\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable medication side-effect in itch with no rash\"\n  (diagnosis\n    (snomed_concept \"Adverse reaction caused by drug\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Itching\" \"finding\"))\n    (no (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\")))\n    (no (clinical_finding (snomed_concept \"Infestation caused by Sarcoptes scabiei var hominis\" \"disorder\")))\n    (no (clinical_finding (snomed_concept \"Louse infestation\" \"disorder\")))\n    (no (clinical_finding (snomed_concept \"Insect bite - wound\" \"disorder\")))\n    ;; Is the skin very dry? = No\n    (no (clinical_finding (snomed_concept \"Severe dry skin\" \"disorder\")))\n    ;; New medication in the weeks before the itch started? = Yes\n    (clinical_finding (snomed_concept \"New medication commenced\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable jaundice in itch with no rash\"\n  (diagnosis\n    (snomed_concept \"Jaundice\" \"finding\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Itching\" \"finding\"))\n    (no (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\")))\n    (no (clinical_finding (snomed_concept \"Infestation c  \"Clinical finding\" \"finding\") (snomed_concept \"Insect bite - wound\" \"disorder\") (snomed_concept \"No\" \"qualifier value\")))", "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"New medication commenced\" \"finding\") (snomed_concept \"No\" \"qualifier value\")))", "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Severe dry skin\" \"disorder\") (snomed_concept \"No\" \"qualifier value\")))", "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Severe dry skin\" \"disorder\") (snomed_concept \"No\" \"qualifier value\")))"], "is_a_related": [{"A": "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Infestation caused by Pediculus\" \"disorder\") (snomed_concept \"No\" \"qualifier value\")))", "B": "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Louse infestation\" \"disorder\") (snomed_concept \"No\" \"qualifier value\")))", "relation": "A_narrower"}], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Adverse reaction caused by drug\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Jaundice\" \"finding\") probable)", "(diagnosis (snomed_concept \"Xeroderma\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 86 – Itch with no rash: flowchart\n\nSource: APC 2026 e-book page 86. The red box is a pointer only\n(\"Check if the patient needs urgent attention ↻ 82\"); the diagnostic logic is the flowchart below it.\n\n```mermaid\nflowchart TD\n    START[\"Itch with no rash\"]\n    START --> RB[\"Check if the patient needs urgent attention ↻ 82 (red box, pointer only)\"]\n    RB --> CONFIRM[\"Confirm there is no rash, scabies, lice or insect bites.<br/>If generalised itchy rash → 84. If localised itchy rash → 85.<br/>If itch around anus only → 61.\"]\n    CONFIRM --> Q1{\"Is the skin very dry?\"}\n    Q1 -- Yes --> DRY[\"Dry skin (xeroderma/ichthyosis) likely\"]\n    Q1 -- No --> Q2{\"Did the patient start any new medication<br/>in the weeks before the itch started?\"}\n    Q2 -- Yes --> MED[\"Medication side-effect likely<br/>Discuss with doctor whether to stop or change medication.<br/>Advise to return if rash develops or itch persists.\"]\n    Q2 -- No --> JAUN[\"If yellow skin/eyes, jaundice likely → 94\"]\n    JAUN --> PERSIST[\"If itch persists > 2 weeks: test for anaemia ↻ 44, HIV ↻ 124 and diabetes ↻ 19.<br/>Refer to doctor same day.\"]\n    MED --> SYMPT[\"If severe itch, give chlorphenamine … If long-term itch, give instead cetirizine …\"]\n    PERSIST --> SYMPT\n    SYMPT --> ADVICE[\"Advise to: avoid hot baths … moisturise … keep nails short.<br/>If known with a life-limiting illness, also give palliative care ↻ 191.\"]\n    DRY --> ADVICE\n    ADVICE --> END[\"If no better or diagnosis uncertain, discuss/refer.\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `(clinical_finding Itching)` triggers the check-for task | `Check for causes of itch with no rash` |\n| Red box ↻ 82 | Pointer only; no rule on this page | — (`cross_reference_only`) |\n| Confirm no rash, scabies, lice or insect bites | Each is checked for, and each \"likely\" rule requires `(no …)` of all four, since the flowchart is entered only after they are excluded | All three diagnosis rules |\n| → 84 / → 85 / → 61 | Routing to other pages; not modelled | — (`flowchart_routing`) |\n| Q1 = Yes | `Severe dry skin` | `Diagnose probable dry skin in itch with no rash` (Xeroderma, probable) |\n| Q1 = No → Q2 = Yes | `(no Severe dry skin)` and `New medication commenced` | `Diagnose probable medication side-effect in itch with no rash` (Adverse reaction caused by drug, probable) |\n| Q1 = No → Q2 = No → yellow skin/eyes | `(no Severe dry skin)`, `(no New medication commenced)` and (`Yellow skin` or `Scleral icterus`) | `Diagnose probable jaundice in itch with no rash` (Jaundice, probable) |\n| Itch persists > 2 weeks | Tests and same-day referral are management; not modelled | — (`management_step`) |\n| Symptomatic treatment, advice, palliative care, discuss/refer | Management; not modelled | — (`management_step`) |\n\n## Notes\n\n- \"In the weeks before the itch started\" (Q2) cannot be expressed: the language compares an onset\n  with a time ago, not two onsets with each other. The rule accepts any recorded new medication.\n- \"Very dry\" is read as the precoordinated `Severe dry skin`.\n", "questions": "# Page 86 – Itch with no rash: remaining questions\n\n## Decisions made\n\n- **Red box is a pointer only** (\"Check if the patient needs urgent attention ↻ 82\"). It is\n  accounted for as `cross_reference_only`; this page has no priority evaluation. The page's own\n  diagnostic flowchart is encoded.\n- **Trigger** is `(clinical_finding Itching)`, cited from the page title, since the red box has no\n  header naming the complaint. Itching is not a recorded common symptom or warning sign, so the task\n  only fires when another page (or intake) records Itching.\n- **Exclusions are part of every \"likely\" rule.** The page says \"Confirm there is no rash, scabies,\n  lice or insect bites\" before the first question, so each probable rule requires `(no Eruption)`,\n  `(no Infestation caused by Sarcoptes scabiei var hominis)`, `(no Louse infestation)` and\n  `(no Insect bite - wound)`. Consequence: a rule fires only after the nurse has explicitly recorded\n  these as absent.\n- **Yes/No branches are chained**: the medication rule requires `(no Severe dry skin)`; the jaundice\n  rule requires `(no Severe dry skin)` and `(no New medication commenced)`, following the arrows.\n- **\"Very dry\"** = `Severe dry skin` (disorder), a child of `Xeroderma`.\n- **Dry skin (xeroderma/ichthyosis) likely** → probable `Xeroderma` only.\n- **Medication side-effect likely** → probable `Adverse reaction caused by drug`.\n- **Jaundice likely** → probable `Jaundice` (finding); yellow eyes = `Scleral icterus`.\n- **Routing** to 84, 85, 61 and 94, the \"itch persists > 2 weeks\" tests and same-day referral,\n  antihistamines, skin-care advice, palliative care and \"discuss/refer\" are management or routing\n  and are not encoded.\n\n## Could not model\n\n- **\"In the weeks before the itch started\"**: the language compares an onset with a time ago, not\n  two onsets with each other. The medication rule accepts any recorded `New medication commenced`,\n  so it fires **more often** than the page intends (e.g. medication started after the itch).\n- **\"If itch persists > 2 weeks\"** could be written as `(>= (onset Itching) (time_ago 2 weeks))`,\n  but everything it leads to (tests for anaemia, HIV, diabetes; same-day referral) is management, so\n  no rule consumes it.\n\n## SNOMED gaps\n\n- `Scabies` (disorder) does not exist; used `Infestation caused by Sarcoptes scabiei var hominis`.\n- No plain \"Lice\" concept; used `Louse infestation` (disorder).\n- `Dry skin` (finding) does not exist; `Xeroderma` (disorder) carries it as a synonym, and\n  `Severe dry skin` (disorder) for \"very dry\".\n- No \"Yellow eyes\" concept; used `Scleral icterus` (finding).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should \"Dry skin (xeroderma/ichthyosis)\" also produce a probable `Ichthyosis` diagnosis, or is\n  `Xeroderma` enough?\n- Is `Adverse reaction caused by drug` the right diagnosis, or the narrower `Pruritus caused by\n  drug`?\n- Should the \"likely\" rules require the exclusions (no rash, scabies, lice, insect bites) to be\n  recorded as absent, or fire when they are simply not recorded?\n- Should \"yellow skin/eyes\" also accept the recorded `Jaundice` finding directly?\n- Should jaundice be diagnosed from yellow skin/eyes even he house pattern.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Check for causes of itch with no rash / all three diagnosis rules", "text": "'If itch around anus only -> 61' is a gate on this page, like 'no rash', but there is no check_for or (no ...) for perianal-only itch. SNOMED has (snomed_concept \"Pruritus ani\" \"disorder\"). As written, anal-only itch with very dry skin yields probable Xeroderma here rather than routing to page 61.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable medication side-effect in itch with no rash", "text": "Diagnosis concept 'Adverse reaction caused by drug' is a faithful literal of 'medication side-effect', but SNOMED has the more specific (snomed_concept \"Pruritus caused by drug\" \"disorder\"), which is exactly what this page concludes. Consider swapping; not an error.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable dry skin in itch with no rash", "text": "The evidence 'Severe dry skin' is a SNOMED child of the diagnosis 'Xeroderma', so the rule is near-tautological (severe dry skin -> dry skin). This mirrors the page ('Is the skin very dry? Yes -> Dry skin likely'), so it is faithful, but note the rule adds no inference beyond what the health worker records.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "check task", "text": "The check_for list includes Eruption, scabies, lice, bites; the check task has no priority evaluations, appropriate since the red box only points to page 82.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "medication side-effect / jaundice", "text": "Priority chain (dry skin > medication > jaundice) encoded via exclusion; page jaundice branch follows only No-medication, matches. But medication rule is gated on absence of severe dry skin, which page does too. No defect, but all three rules exclude Eruption/scabies/lice/bite as hard negations, so a missing answer may block diagnoses.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable dry skin", "text": "Ichthyosis not encoded; 'Severe dry skin' is used as the finding for 'very dry'; verify concept resolves.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable jaundice in itch with no rash", "text": "Jaundice is gated on (no Severe dry skin) and (no New medication commenced), as the flowchart orders the branches. A patient with itch and yellow skin/eyes who also has very dry skin, or recently started a medication, never gets probable jaundice. Jaundice is the most serious cause on the page (-> page 94), and a drug can itself cause cholestatic jaundice. The rule is faithful to the page's layout, but the sequential gating suppresses a high-value diagnosis. A clinician should confirm whether yellow skin/eyes should override the earlier branches.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable medication side-effect in itch with no rash", "text": "'New medication in the weeks before the itch started' is reduced to plain New medication commenced, with no recency or onset constraint, so the temporal logic of the branch is lost.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Check for causes of itch with no rash", "text": "The task and all rules anchor on Itching (finding), which is not one of the recorded common symptoms or warning signs. Unless another page's check_for records Itching, the task and rules may never fire. Perianal-only itch (-> 61) is also not excluded.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable dry skin in itch with no rash", "text": "Ichthyosis, named on the page alongside xeroderma, is not represented.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable medication side-effect in itch with no rash", "text": "and-structure faithful (not very dry AND new medication -> likely). Diagnosis concept is broader than the page: 'Pruritus caused by drug' (disorder) exists and names exactly what the page calls 'Medication side-effect likely' for itch. Timing qualifier 'in the weeks before the itch started' is not represented (no number on the page).", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Check for causes of itch with no rash", "text": "Page's check_for content is the confirm-no-rash/scabies/lice/bites step; also unencoded: itch >2 weeks (test anaemia, HIV, diabetes; refer same day), chlorphenamine/cetirizine, advice, palliative care, if no better discuss/refer, itch around anus/localised/generalised redirects.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 86, "slug": "86-itch-with-no-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable medication side-effect in itch with no rash", "text": "Medication timing window (weeks before itch) not captured.", "detail": [{"checker": "backward-2", "s <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {

  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;

    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;

}

const ruleSource = (() => {

  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
