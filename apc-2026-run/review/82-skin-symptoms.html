: [672.7, 234.7, 737.4, 242.0], "key": "p82-b7760b53"}, {"id": "p82-rb1-e18", "page": 82, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 198.5, "indent": 2, "parent": "p82-rb1-e16", "text": "Notify4 as suspected meningococcal disease. If possible, isolate patient, and give surgical mask to prevent spread.", "bbox": [56.9, 238.7, 495.1, 249.5], "key": "p82-762912ce"}, {"id": "p82-rb1-e19", "page": 82, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 198.5, "indent": 2, "parent": "p82-rb1-e16", "text": "Prevent disease in close household contacts:", "bbox": [56.9, 248.7, 233.4, 259.5], "key": "p82-d769c287"}, {"id": "p82-rb1-e20", "page": 82, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 198.5, "indent": 3, "parent": "p82-rb1-e19", "text": "If contact < 6 years old, give ceftriaxone3 125mg IM as a single dose (dissolve ceftriaxone 250mg in 0.9mL lidocaine 1% without adrenaline (epinephrine); discard half the volume and inject the rest).", "bbox": [62.5, 258.7, 773.7, 279.5], "key": "p82-ad060a66"}, {"id": "p82-rb1-e21", "page": 82, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 198.5, "indent": 3, "parent": "p82-rb1-e19", "text": "If contact 6-12 years old, give ciprofloxacin 250mg as a single dose.", "bbox": [62.5, 278.7, 331.0, 289.5], "key": "p82-6aaf9831"}, {"id": "p82-rb1-e22", "page": 82, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 198.5, "indent": 3, "parent": "p82-rb1-e19", "text": "If contact ≥12 years, give ciprofloxacin 500mg as a single dose. If pregnant, give instead ceftriaxone3 250mg IM (dissolve ceftriaxone 250mg in 0.9mL lidocaine 1% without adrenaline (epinephrine)).", "bbox": [62.5, 288.7, 781.0, 309.5], "key": "p82-7267e3d3"}, {"id": "p82-rb1-e23", "page": 82, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 198.5, "indent": 1, "parent": null, "text": "If serious drug reaction likely: stop all medication. If peeling or raw skin, also manage as for burns before referral 31.", "bbox": [51.2, 308.5, 508.8, 319.5], "key": "p82-16c837b5"}, {"id": "p82-out-e01", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "SKIN SYMPTOMS", "bbox": [351.4, 48.7, 490.5, 71.0], "key": "p82-766ff29d"}, {"id": "p82-out-e02", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If rash is extensive, recurrent or difficult to treat, test for HIV 124.", "bbox": [291.9, 507.9, 550.0, 518.9], "key": "p82-79c28aa1"}, {"id": "p82-out-e03", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with skin symptoms not needing urgent attention If unexplained rash or lesion/s of skin/genitals/anus/rectum/mouth/eyes and ≥ 1 of: headache/backache/body pain, swollen lymph nodes, temperature > 38.5°C, fatigue, sore throat/nasal congestion/", "bbox": [55.6, 343.4, 786.3, 364.6], "key": "p82-eba45078"}, {"id": "p82-out-e04", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "cough consider mpox 40. Manage according to skin symptom/s:", "bbox": [350.7, 363.6, 491.2, 384.6], "key": "p82-cfa294a7"}, {"id": "p82-out-e05", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Pain", "bbox": [54.7, 399.8, 70.0, 410.0], "key": "p82-46d89599"}, {"id": "p82-out-e06", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No rash", "bbox": [238.3, 425.3, 266.3, 435.5], "key": "p82-45666d2a"}, {"id": "p82-out-e07", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "86 Localised Generalised", "bbox": [105.1, 450.3, 261.6, 461.1], "key": "p82-7e53adac"}, {"id": "p82-out-e08", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Generalised, non-itchy rash", "bbox": [294.1, 399.8, 346.6, 420.0], "key": "p82-512288b5"}, {"id": "p82-out-e09", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Lump/s Pimples/ blackheads", "bbox": [371.5, 399.8, 479.2, 420.0], "key": "p82-b5742e50"}, {"id": "p82-out-e10", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Ulcer/s or non-healing", "bbox": [516.9, 399.8, 563.7, 420.0], "key": "p82-ccb40bdc"}, {"id": "p82-out-e11", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "wound", "bbox": [526.3, 419.8, 552.3, 430.0], "key": "p82-514f09ab"}, {"id": "p82-out-e12", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Changes in", "bbox": [701.9, 399.8, 744.9, 410.0], "key": "p82-50d92a86"}, {"id": "p82-out-e13", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "skin colour", "bbox": [702.5, 409.8, 742.3, 420.0], "key": "p82-f9b6c96d"}, {"id": "p82-out-e14", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Scalp symptoms Crusts", "bbox": [592.5, 399.8, 801.3, 420.0], "key": "p82-9608442f"}, {"id": "p82-out-e15", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Flaky skin", "bbox": [644.5, 399.8, 679.3, 410.0], "key": "p82-473730b1"}, {"id": "p82-out-e16", "page": 82, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, cture of eye proper\" \"body structure\")))", "relation": "A_narrower"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Eruption\" \"morphologic abnormality\"))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Lesion\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Oral cavity structure\" \"body structure\")))", "relation": "A_narrower"}], "same_concept_different_form": [{"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Lesion\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Eye region structure\" \"body structure\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Lesion\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Genital structure\" \"body structure\")))"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Lesion\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Eye region structure\" \"body structure\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Lesion\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Structure of eye proper\" \"body structure\")))"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Lesion\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Eye region structure\" \"body structure\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Lesion\" \"morphologic abnormality\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Oral cavity structure\" \"body structure\")))"}]}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Adverse reaction caused by drug\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Anaphylaxis\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Meningococcal infectious disease\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Monkeypox\" \"disorder\") possible)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 82 – Skin symptoms: flowchart\n\nSource: APC 2026 e-book page 82 (red box, the \"approach\" section and the routing tree below it).\n\n```mermaid\nflowchart TD\n    S[\"Patient with skin symptoms\"] --> RB{\"Red box: any of the urgent groups?\"}\n    RB -- \"Sudden generalised itch/rash or face/tongue swelling<br/>AND any of wheeze, difficulty breathing, BP &lt; 90/60,<br/>dizziness/collapse, abdominal pain, vomiting, exposure to allergen¹\" --> ANA[\"Urgent. Check for anaphylaxis (p28)\"]\n    RB -- \"Purple/red rash AND any of neck stiffness,<br/>drowsy/confused, T ≥ 38°C, headache\" --> MEN[\"Urgent. Meningococcal disease likely\"]\n    RB -- \"Diffuse rash within 3 months of a new medication<br/>AND any of the 9 listed features\" --> DRG[\"Urgent. Serious drug reaction likely\"]\n    RB -- \"None\" --> AP{\"Unexplained rash/lesions of skin, genitals, anus,<br/>rectum, mouth or eyes AND ≥ 1 of headache/backache/body pain,<br/>swollen lymph nodes, T &gt; 38.5°C, fatigue,<br/>sore throat/nasal congestion/cough?\"}\n    AP -- Yes --> MPX[\"Consider mpox (p40)\"]\n    AP -- \"No / also\" --> ROUTE[\"Manage according to skin symptom: pain 83, itch with generalised rash 84,<br/>localised rash 85, no rash 86, generalised non-itchy rash 87,<br/>lumps/pimples 89, ulcers/wounds 90, crusts/flaky skin 93,<br/>colour change 94, scalp 95\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Patient with skin symptoms | `(or (clinical_finding Skin finding) (clinical_finding Itching))` trigger (descendants match) | `Check for urgent skin symptom conditions`, `Check for mpox features with skin symptoms` |\n| Anaphylaxis group | `(and (or sudden-onset itch/rash/face swelling/tongue swelling) (or wheeze, difficulty breathing, SBP<90, DBP<60, dizziness, collapse, abdominal pain, vomiting, exposure to drug/food, insect bite/sting))` | `Diagnose possible anaphylaxis from skin symptoms`; `Urgent: skin symptoms with features of anaphylaxis` |\n| Meningococcal group | `(and (or Purpuric rash, Erythematous rash) (or Stiff neck, Drowsy, Acute confusion, T ≥ 38, Headache))` | `Diagnose probable meningococcal disease from purple/red rash`; `Urgent: skin symptoms with meningococcal disease likely` |\n| Serious drug reaction group | `(and Generalized rash (<= (onset New medication commenced) (time_ago 3 months)) (or …9 features…))` | `Diagnose probable serious drug reaction with diffuse rash`; `Urgent: skin symptoms with serious drug reaction likely` |\n| Consider mpox | `(and (or rash/lesion sites) (or ≥1 systemic feature))` | `Diagnose possible mpox from skin symptoms` |\n| Routing tree to pages 83–95 | Not modelled: routing to other pages' own rules | — |\n", "questions": "# Page 82 – Skin symptoms: remaining questions\n\n## Decisions made\n\n- **Trigger.** \"Skin symptoms\" is not a recorded common symptom or warning sign. Both tasks are\n  triggered by `(or (clinical_finding Skin finding) (clinical_finding Itching))`, relying on\n  descendant matching. `Itching` is added because SNOMED does not file it under `Skin finding`,\n  while the page lists Itch among the skin symptoms. Face/tongue swelling is not a skin finding, so\n  a patient presenting only with face swelling will not trigger the task from this page.\n- **Priority rules do not repeat the trigger.** Every red-box group already starts with a skin sign\n  (itch/rash/swelling, purple/red rash, diffuse rash), so the Urgent rules are not wrapped in\n  `(and <Skin finding> …)`.\n- **Anaphylaxis bullet (\"check for anaphylaxis 28\").** Encoded as a `possible` Anaphylaxis rule\n  (which raises page 28's check task) and an Urgent priority rule on the same evidence, written out\n  in full rather than via `(active_condition Anaphylaxis)`, so it does not depend on page 28.\n  \"Sudden\" is the `Sudden onset` qualifier on itch, rash and face/tongue swelling, as on page 20.\n- **Exposure to possible allergen** expanded per footnote 1 into exposure to Drug or medicament,\n  exposure to Food, Insect bite - wound and Insect sting. \"Within the past few hours\" not modelled.\n- **BP < 90/60** = systolic < 90 or diastolic < 60.\n- **Shock/SBP < 80** (drug reaction) = `(or (clinical_finding Shock) (< SBP 80))`, as the page's own\n  logic. Footnote 2 (\"If SBP < 80, pulse ≥ 100, RR > 30, decreased LOC, weakness, shock likely\") is\n  not built into a shock definition (shared decision; also unclear whether any-of or all-of).\n- **Purple/red rash** = Purpuric rash or Erythematous rash (literal reading; unsettled, see questions).\n- **Within 3 months of starting a new medication** = `(<= (onset (clinical_finding New medication\n  commenced)) (time_ago 3 months))` (only `<=`/`>=` allowed in onset comparisons).\n- **Serious drug reaction** = `Adverse reaction caused by drug` (disorder), diagnosed `probable`.\n- **Involves mouth, eyes or genitals** (the diffuse rash involves them) = `Eruption` (morphologic\n  abnormality) with finding_site Oral cavity structure / Structure of eye proper / Genital structure.\n  The mpox \"lesion/s of … genitals/anus/rectum/mouth/eyes\" use `Lesion` with the same sites plus\n  Anal structure and Rectum structure, checked in the mpox task.\n- **Unwell, malaise** are encoded separately: `Generally unwell` and `Malaise`.\n- **Consider mpox** → `possible` Monkeypox rule; its extra findings are in a second check task.\n\n## Could not model\n\n- \"**Unexplained** rash or lesion/s\" (mpox): no way to express \"unexplained\". The rule fires on any\n  rash plus one systemic feature, i.e. **more often** than the page intends (it is only `possible`).\n- \"Diffuse rash appearing within 3 months **of starting** a new medication\": the language cannot\n  compare the rash onset with the medication start. The rule checks that a new medication was\n  started within the last 3 months and that a generalised rash is present now. A rash that appeared\n  within 3 months of a medication started longer ago (e.g. 4 months ago, rash 2 months later) is\n  missed (**less often**).\n  Conversely, a rash that began before the medication was started still matches (**more often**).\n- \"**Serious**\" in \"serious drug reaction\" has no place on the diagnosis concept; the Urgent\n  priority rule carries the seriousness.\n- \"Within the past few hours\" for allergen exposure (footnote 1).\n- \"If rash is extensive, recurrent or difficult to treat, test for HIV 124\": a test instruction,\n  not a diagnosis; not modelled.\n- The routing tree (pain 83, itch 84–86, non-itchy rash 87, lumps 89, ulcers 90, crusts/flaky 93,\n  colour 94, scalp 95): routing to other pages, not modelled.\n- All management (fluids, ceftriaxone, notification, contact prophylaxis, stop medication, burns).\n\n## SNOMED gaps\n\n- No \"Mpox\" FSN: used `Monkeypox` (disorder).\n- No \"serious/severe drug reaction\" concept: used `Adverse reaction caused by drug` (disorder).\n- No \"Confusion\" (finding): used `Acute confusion`.\n- \"Unwell\": `Generally unwell` (finding).\n- \"Raw areas\": `Denuded skin` (disorder), matched via the synonym \"raw skin\".\n- \"Body pain\": no exact concept; `Generalized aches and pains` is used.\n- \"Skin symptoms\": no concept; `Skin finding` or `Itching` is used.\n- No \"allergen\" substance: used the footnote's medication/food/insect items.\n- No \"Shock\" finding: used `Shock` (disorder).\n- No precoordinated \"rash of mouth/eye\" or \"lesion of anus/rectum\": `Lesion` + finding_site.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should \"purple/red rash\" include any erythematous rash (literal reading, used now), or only\n  purpuric / petechial rash? The literal reading makes any red rash with headache or fever\n  \"meningococcal disease likely\" and Urgent.\n- Is `Adverse reaction caused by drug` acceptable as the diagnosis for \"serious drug reaction\", or\n  should the diagnosis be a specific entity (SJS/TEN, DRESS)?\n- Should \"Involves mouth, eyes or genitals\" be read as mucosal involvement (for example,\n  conjunctivitis or oral ulcers) rather than the rash itself extending to those sites? And should\n  \"eyes\" include the eyelids and periorbital skin (`Eye region structure`) or only the eye itself?\n- Does \"sudden\" apply to face/tongue swelling as well as to the generalised itch/rash?\n- Should a patient with sudden face/tongue swelling but no skin finding still reach the urgent\n  anaphylaxis rule from this page (it will, via the priority rule, if those findings are recorded\n  elsewhere; but this page's check task will not be raised)?\n- For mpox, how should \"unexplained\" be recorded by the health worker?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent skin symptom conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Skin finding\" \"finding\"))", "element_keys": ["p82-58219e12"], "quote": "skin symptoms"}, {"claim_id": "c002", "rule": "Check for urgent skin symptom conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Itching\" \"finding\"))", "element_keys": ["p82-58219e12"], "quote": "skin symptoms"}, {"claim_id": "c003", "rule": "Check for urgent skin symptom conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generalized pruritus\" \"finding\") (qualifier (snomed_con uld be recorded as a remaining question.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: skin symptoms with features of anaphylaxis", "text": "Repeats the entire anaphylaxis evidence instead of referencing the active condition the possible rule produces, unlike the gold standard's (active_condition Anaphylaxis). It is logically equivalent and arguably safer (a possible diagnosis may not become an active condition), but any later edit to the criteria must be made in two places.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis from skin symptoms", "text": "Footnote 1's 'within the past few hours' on the allergen exposure is not encoded, so any recorded drug or food exposure, or an old insect bite, satisfies the 'any of' arm. Minor because the rule is possible and the skin-sign arm must also hold.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable serious drug reaction with diffuse rash", "text": "The 3-month window is encoded as 'New medication commenced' started within the last 3 months rather than 'rash appeared within 3 months of the medication start'. This is the closest the language allows and gives the same answer in nearly every case; noting it so the reconciler does not read the comparator direction as wrong (under the house convention <= time_ago 3 months means within the last 3 months).", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for urgent skin symptom conditions", "text": "check_for omits measurements the diagnosis rules use (SBP<90, DBP<60, SBP<80, temp>=38) and the anaphylaxis, meningococcal and drug-reaction items are merged into a single task with no separation between the three boxes' triggers; also check_for includes 'Generalized rash' twice in different themes (harmless duplication).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable serious drug reaction with diffuse rash", "text": "Relies on onset comparison (<= onset (time_ago 3 months)) and 'New medication commenced' as a finding; the briefing's convention ('<' means within) suggests '<' would be the canonical form, and 'Adverse reaction caused by drug' is a generic concept for what the page calls serious drug reaction (SJS/TEN/DRESS type). Verify in the VHA test and SNOMED.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: skin symptoms with features of anaphylaxis", "text": "Duplicates the diagnosis criteria instead of using active_condition on Anaphylaxis like the other two priority rules; inconsistent but consistent with the gold file. The Urgent priority fires on a possible (not probable) anaphylaxis, which matches 'check for anaphylaxis'.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible mpox from skin symptoms", "text": "Page 'unexplained rash' and the HIV testing advice ('extensive, recurrent or difficult to treat') are not captured; both are not representable or management. No priority evaluation exists for non-urgent route, which is correct.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable serious drug reaction with diffuse rash", "text": "Its 'Shock' arm relies on a recorded Shock finding, but footnote 2's 'shock likely' criteria (SBP < 80, pulse >= 100, RR > 30, decreased consciousness, weakness) are not encoded anywhere. Only the SBP < 80 part reaches the rule, so a shocked patient with a tachycardic, tachypnoeic or drowsy presentation and SBP >= 80 is missed unless Shock is entered by hand.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable meningococcal disease from purple/red rash", "text": "Taking 'red rash' literally as Erythematous rash means any erythematous rash with headache (or temp >= 38) yields probable meningococcal disease and an Urgent priority. That is faithful to the page's text but likely to over-trigger; a clinician should confirm whether 'red' should be narrowed (e.g. petechial/non-blanching).", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis from skin symptoms / Urgent: skin symptoms with features of anaphylaxis", "text": "Allergen exposure is unbounded in time (footnote 1 says 'within the past few hours'). A historical drug or food exposure plus a sudden generalised rash satisfies both rules.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis from skin symptoms", "text": "Allergen exposure and insect bite/sting lose the 'within the past few hours' window from footnote 1, so any historical exposure with a sudden rash satisfies the rule. Type and 'possible' (check for anaphylaxis) are right; and/or structure is faithful.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis from skin symptoms", "text": "Structure (sudden itch/rash/face-tongue swelling AND any of the second list) and 'possible' for 'check for anaphylaxis' are right, but the allergen-exposure arm drops footnote 1's 'within the past few hours' window.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable meningococcal disease from purple/red rash", "text": "'Probable' matches 'likely' and the and/or is faithful, but adding Erythematous rash lets any red rash plus headache or fever produce probable meningococcal disease (and Urgent, plus ceftriaxone management downstream).", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable serious drug reaction with diffuse rash", "text": "Structure (diffuse rash AND new drug within 3 months AND any of 14 features) is faithful, but the diagnosis concept 'Adverse reaction caused by drug' is broader than 'serious drug reaction', and the 3-month window is anchored to now, not to rash onset.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible mpox from skin symptoms", "text": "'Possible' correctly matches 'consider', and the and/or is faithful, but 'unexplained' is dropped, so it fires for any rash with a common symptom such as headache or cough.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: skin symptoms with features of anaphylaxis", "text": "Urgent matches the red-box heading; the same missing exposure time window as the diagnosis rule. The 'skin symptoms' presenting complaint is implicit in the first group, which is acceptable.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 82, "slug": "82-skin-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: skin symptoms with serious drug reaction   <section class="pane"><h2><span id="rulesttl">Rules, in plain English</span> <span class="hb" data-k="rules"></span> <span style="float:right"><button id="rawbtn" style="font-size:11.5px;text-transform:none;letter-spacing:0">show structured rules</button><span class="hb" data-k="rawtoggle"></span></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="rules"></div></section>
</main>
<div class="lower">
  <div class="tabs" id="tabs"></div>
  <div class="tabbody" id="tabbody"></div>
</div>
<script src="help.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
