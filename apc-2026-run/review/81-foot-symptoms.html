ight. If needed, increase by 25mg (10mg if ≥ 65 years) every 2 weeks, up to 75mg at night. • If on isoniazid, increase pyridoxine to 50mg 8 hourly for 3 weeks, then give 50mg daily. If pregnant, discuss/refer. • If on linezolid, check RR-TB treatment duration and discuss with TB expert/helpline 200. • If one-sided, weakness or severe numbness, refer same week. • If patient known to have cancer, refer same day. • If available, refer to physiotherapist. • If no better with treatment, discuss/refer.", "bbox": [39.7, 275.9, 385.3, 426.9], "key": "p81-bce81f62"}, {"id": "p81-out-e10", "page": 81, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Localised pain Ensure that shoes fit properly.", "bbox": [588.9, 225.8, 697.2, 246.0], "key": "p81-4bc7de93"}, {"id": "p81-out-e11", "page": 81, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Heel pain, worse on starting walking Foot deformity Bony lump at base of big toe; may have callus,", "bbox": [514.9, 261.2, 800.2, 291.4], "key": "p81-de21fb49"}, {"id": "p81-out-e12", "page": 81, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "redness or ulcer", "bbox": [724.5, 291.2, 782.7, 301.4], "key": "p81-580e6118"}, {"id": "p81-out-e13", "page": 81, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Foot pain with", "bbox": [419.2, 251.2, 455.7, 271.4], "key": "p81-d6576abd"}, {"id": "p81-out-e14", "page": 81, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "muscle pain in legs or buttocks", "bbox": [415.5, 271.2, 459.4, 301.4], "key": "p81-cf0b3d45"}, {"id": "p81-out-e15", "page": 81, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Peripheral", "bbox": [416.0, 315.9, 458.7, 326.9], "key": "p81-09 e or 1 can/bottle (330mL) of beer. 2Avoid if on RR-TB treatment. 3BMI = weight (kg) ÷ height (m) ÷ height (m).", "bbox": [34.0, 543.3, 546.2, 551.8], "key": "p81-8299dae4"}], "boxes": [{"box": 1, "rect": [35.5, 113.7, 806.4, 175.8]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAACDCAIAAAC4HlupAAAACXBIWXMAABcSAAAXEgFnn9JSAACGMklEQVR4nOy9d1BVSff3O1X3/f2q3j9uve99773vW3XvrXr0EEQRFEVRARVRzAmzYsAEJlTEhAkTplHHLOaIAXNCFEFAEQmKOWcZdYxjGvWZec79chb00+69zz77EEScVfUp6pw+vXuvXr26d69Fd++fXv5/jgzDMAzDMAzDMAzDMAxTvvipzCVgGIZhGIZhGIZhGIZhGHvhqBbDMAzDMAzDMAzDMAxT/vgqqvWqcrVXVRiGYRiGYRiGYRiGYRjme+RlparaUa2/Xmaa/3mFYRiGYRiGYRiGYRiGYb5DvqTHcVSLYRiGYRiGYRiGYRiGKWdwVIthGIZhGIZhGIZhGIYpf3BUi2EYhmEYhmEYhmEYhil/cFSLYRiGYRiGYRiGYRiGKX9wVIthGIZhGIZhGIZhGIYpf3BUi2EYhmEYhmEYhmEYhil/cFSLYRiGYRiGYRiGYRiGKX9wVIthGIZhGIZhGIZhGIYpf3BUi2EYhmEYhmEYhmEYhil/cFSLYRiGYRiGYRiGYRiGKX9wVIthGIZhGIZhGIZhGIYpf3BUi2EYhilJfn95tsxlYPQpR2306f35hCNrQNaZnWUujCZvX2X99flSmYuhxmYrnzq5hXRrvMxzmbtXr5y+Jmb6vVvHyryCTDG5fvkwGcCLp6fLXBgd0MV27Vi0dNGk/buXlbkwDMMwzHcIR7UYhmEYO/jt17TYTfOmRw0P7tUhuGdgxMh+G9fNfvXbGfwE375180aOFSuuWjGtzOVkNCl3bfTrwxTTP/4BunZqWebCqDm0f0UlRwdvr5pvX31fs6apk4dBaQP6dtbJ09DXi3RrsMzIMSGUH+za/kuZ15EpJmQk4OSJjWUujDWuXDhQq0Y1ktOnbq0yl4dhGIb5DuGoFsMwDGOIP96dW7JwYtXKlYRnK7h4bh8yvHyW7lixIr72CQosc2lLm2d5aXHbfhkbMSDj1PYiXJ6eGrt4wYRJkYNFyse3OUcPrZoRNWLjutklJeSNK4fXrZo5JLSHiLmUdhup61VMgb+fqJZmA0VNKogLnM/aXUq3KBrNAxpAKrcqLl8+XrBWsl1RrWPxa0R/b9PSP+XEpuLXV93c3yflRU57+f6jWv/6crlVcz8Ssk4tj8Eh3ctcJIZhGOY7hKNaDMMwjCFC+ncVbm3r5o2GD+01bHDPju2beXq4iR1Y+3YtnTAu9MbVI2UubWmzYskUUsWRAzFFuNzFyQHXNvX3FSnnMndTgZMjh5SUkL2D2lOZL5+li8RSbSN1vYop8PcT1dJsoLyHJ6MmDl2/Orr0blE0cjJ3jR89MPn4Bp2S7YpqRYzoS5kP7V9RUirVtM/vkPIip718/1GtR/eSSMIWTRt+/pBb5vIwDMMw3ycc1WIYhmFss2XDXPIuvL1qKk44+vT+PH345x8Xb1w5DB7ePYGv928n0tf3b7Ipw4ffcygFvoq4/M2LjNSkzWnJm/FB89a/Pkyhq/54d45S7t0+Tin/+nIZX/MeJOPzgzuJ+Pz8ySl43ZRuthzIcurkltMpW3FrfKarZO/or8+Xblw9En8wBn/l05FuXYtHzt9+TcPna5cOocyL5/eJX3HHaVPCSCFrY2Ygp+YZRpD8zKltB/etOJ+1GwIIdSF/Jcf86I+fbx18vnsz4dV 4UNUihBBCCCGEEEIIIRUPqlqEEEIIIYQQQgghpOJBVYsQQgghhBBCCCGEVDyCqloFNZ4uqEkIIYQQQgghhBBCyD+RH6rXdla1CCGEEEIIIYQQQgipEFDVIoQQQgghhBBCCCEVD6pahBBCCCGEEEIIIaTi8f/QyRHmLYmoHQAAAABJRU5ErkJggg=="}, "page_image": null, "lisp": ";; Page 81 - Foot symptoms\n(task\n  \"Check for urgent foot symptom conditions\"\n  adult\n  (clinical_finding (snomed_concept \"Finding of foot region\" \"finding\"))\n  (check_for\n    ;; Unable to bear weight following injury: fracture likely\n    (clinical_finding (snomed_concept \"Unable to weight-bear\" \"finding\"))\n    (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))\n\n    ;; Sudden severe foot pain at rest with numbness, weakness, pallor or no pulse in the leg: acute limb ischaemia likely\n    (clinical_finding (snomed_concept \"Foot pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"At rest\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\"))\n    (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\"))\n    (clinical_finding (snomed_concept \"White discoloration of skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of lower limb\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Peripheral pulse absent\" \"finding\"))\n\n    ;; Muscle pain in legs or buttocks on exercise with foot pain at rest, ulcer or gangrene on foot: critical limb ischaemia likely\n    (clinical_finding (snomed_concept \"Intermittent claudication\" \"finding\"))\n    (clinical_finding (snomed_concept \"Foot pain\" \"finding\") (qualifier (snomed_concept \"At rest\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Ulcer of foot\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Gangrene of foot\" \"disorder\"))\n  )\n)\n(task\n  \"Check for causes of foot symptoms not needing urgent attention\"\n  adult\n  (clinical_finding (snomed_concept \"Finding of foot region\" \"finding\"))\n  (check_for\n    ;; Tinea pedis: cracks/peeling/scaly lesions between toes, or thickened scaly skin on soles/heels/sides of feet\n    (clinical_finding (snomed_concept \"Fissure in skin\" \"disorder\") (finding_site (snomed_concept \"Structure of interdigital space of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Peeling of skin\" \"finding\") (finding_site (snomed_concept \"Structure of interdigital space of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Structure of interdigital space of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Thick skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of sole of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of sole of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Thick skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of heel\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of heel\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Thick skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of border of foot\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of border of foot\" \"body structure\")))\n\n    ;; Generalised foot pain: peripheral neuropathy, peripheral vascular disease\n    (clinical_finding (snomed_concept \"Foot pain\" \"finding\") (qualifier (snomed_concept \"Generalized\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Burning feet\" \"finding\"))\n    (clinical_finding (snomed_concept \"Paresthesia of foot\" \"finding\"))\n    (clinical_finding (snomed_concept \"Numbness of foot\" \"finding\"))\n    (clinical_finding (snomed_concept \"Muscle pain\" \"finding\") (finding_site (snomed_concept \"Lower limb structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Muscle pain\" \"finding\") (finding_site (snomed_concept \"Buttock structure\" \"body structure\")))\n\n    ;; Localised pain: plantar fasciitis, bunion\n    (clinical_finding (snomed_concept \"Heel pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain aggravated by walking\" \"finding\"))\n    (clinical_finding (snomed_concept \"Deformity of foot\" \"finding\"))\n    (clinical_finding (snomed_concept \"Bony swelling of toe joint\" \"finding\") (finding_site (snomed_concept \"First metatarsophalangeal joint structure\" \"body structure\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable fracture with foot symptoms\"\n  (diagnosis\n    (snomed_concept \"Fracture of bone\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Finding of foot region\" \"finding\"))\n       (clinical_finding (snomed_concept \"Unable to weight-bear\" \"finding\"))\n       (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable acute lower limb ischaemia with foot symptoms\"\n  (diagnosis\n    (snomed_concept \"Acute lower limb ischemia\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Foot pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"At rest\" \"qualifier value\")))\n       (or (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\"))\n           (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\"))\n           (clinical_finding (snomed_concept \"White discoloration of skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of lower limb\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Peripheral pulse absent\" \"finding\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable critical lower limb ischaemia with foot symptoms\"\n  (diagnosis\n    (snomed_concept \"Critical lower limb ischemia\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Intermittent claudication\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Foot pain\" \"finding\") (qualifier (snomed_concept \"At rest\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Ulcer of foot\" \"disorder\"))\n           (clinical_finding (snomed_concept \"Gangrene of foot\" \"disorder\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable tinea pedis from foot skin changes\"\n  (diagnosis\n    (snomed_concept \"Tinea pedis\" \"disorder\")\n    probable\n  )\n  adult\n  (or (clinical_finding (snomed_concept \"Fissure in skin\" \"disorder\") (finding_site (snomed_concept \"Structure of interdigital space of foot\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Peeling of skin\" \"finding\") (finding_site (snomed_concept \"Structure of interdigital space of foot\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Structure of interdigital space of foot\" \"body structure\")))\n      (and (clinical_finding (snomed_concept \"Thick skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of sole of foot\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of sole of foot\" \"body structure\"))))\n      (and (clinical_finding (snomed_concept \"Thick skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of heel\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Scaly lking\"]\n    HEEL --> PF[\"Plantar fasciitis likely\"]\n    LOC --> DEF[\"Foot deformity: bony lump at base of big toe;<br/>may have callus, redness or ulcer\"]\n    DEF --> BUN[\"Bunion likely\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Patient with foot symptoms | `(clinical_finding \"Finding of foot region\")`; descendants (foot pain, heel pain, foot ulcer, …) match | trigger of `Check for urgent foot symptom conditions` and `Check for causes of foot symptoms not needing urgent attention` |\n| Unable to bear weight following injury → fracture likely | Foot symptoms **and** unable to weight-bear **and** traumatic injury | `Diagnose probable fracture with foot symptoms` |\n| Sudden severe foot pain at rest + leg numbness/weakness/pallor/no pulse → acute limb ischaemia likely | Foot pain with Sudden onset + Severe + At rest qualifiers **and** any of numbness of lower limb, weakness of lower limb muscle, white discoloration of lower limb skin, peripheral pulse absent | `Diagnose probable acute lower limb ischaemia with foot symptoms` |\n| Muscle pain in legs/buttocks on exercise + foot rest pain/ulcer/gangrene → critical limb ischaemia likely | Intermittent claudication **and** any of foot pain at rest, ulcer of foot, gangrene of foot | `Diagnose probable critical lower limb ischaemia with foot symptoms` |\n| Red box → urgent | Foot symptoms **and** any of the three red-box diagnoses (active) | `Urgent: foot symptoms with fracture or limb ischaemia` |\n| Tinea pedis likely | Any of fissure/peeling/scaly skin between toes, **or** thick **and** scaly skin at the same site (sole, heel, border of foot) | `Diagnose probable tinea pedis from foot skin changes` |\n| Generalised foot pain → burning/pins and needles/numbness → peripheral neuropathy likely | Generalised foot pain **and** any of burning feet, paresthesia of foot, numbness of foot | `Diagnose probable peripheral neuropathy from foot symptoms` |\n| Generalised foot pain → with muscle pain in legs/buttocks → PVD likely | Generalised foot pain **and** any of muscle pain of lower limb, muscle pain of buttock | `Diagnose probable peripheral vascular disease from foot symptoms` |\n| Localised → heel pain worse on starting walking → plantar fasciitis likely | Heel pain **and** pain aggravated by walking | `Diagnose probable plantar fasciitis from heel pain` |\n| Localised → foot deformity, bony lump at base of big toe → bunion likely | Deformity of foot **and** bony swelling of toe joint at the first MTP joint (diagnosis: Hallux valgus AND bunion) | `Diagnose probable bunion from foot deformity` |\n| Joint check → 77 | Not modelled (pointer to another page) | – |\n\n## Notes\n\n- \"Refer urgently\", all treatment bullets, the diabetes/PVD \"foot at risk\" review and the foot-care\n  advice are management and are not modelled.\n- \"Constant\", \"worse at night\" and \"on starting\" walking are not expressible with confirmed SNOMED\n  forms; see the remaining-questions file.\n- Reconciled from builds A and B; see `reconcile.json`.\n", "questions": "# Page 81 – Foot symptoms: remaining questions\n\nReconciled final build from builders A and B (see `reconcile.json`).\n\n## Decisions made\n\n- **Presenting complaint.** \"Foot symptoms\" is not a recorded common symptom or warning sign. Both\n  tasks and the priority rule use `(clinical_finding \"Finding of foot region\")`, whose descendants\n  (Foot pain, Heel pain, Numbness of foot, Ulcer of foot, Gangrene of foot, Tinea pedis, Deformity\n  of foot …) match. Foot pain alone was rejected because it would miss non-pain complaints.\n- **Two check tasks**, following the page's layout: the red box (`Check for urgent foot symptom\n  conditions`) and the \"Approach to the patient with foot symptoms not needing urgent attention\"\n  (`Check for causes of foot symptoms not needing urgent attention`).\n- **Red box → three `probable` rules + one Urgent priority.** Fracture (`Fracture of bone`, since\n  the page says \"fracture\" without a site), `Acute lower limb ischemia`, `Critical lower limb\n  ischemia`. `Urgent: foot symptoms with fracture or limb ischaemia` is\n  `(and foot-symptom (or active_condition …))`. \"Refer urgently\" is management.\n- **Fracture:** foot symptoms AND Unable to weight-bear AND `Traumatic injury` (the page says\n  \"injury\" without a site; the foot-symptoms condition keeps the rule in this page's context).\n- **Acute limb ischaemia:** one Foot pain finding with Sudden onset, Severe and At rest qualifiers,\n  AND any of Numbness of lower limb, Weakness of muscle of lower limb, White discoloration of skin\n  at Skin structure of lower limb (pallor), Peripheral pulse absent (\"no pulse\" in the leg).\n- **Critical limb ischaemia:** \"Muscle pain in legs or buttocks on exercise\" = `Intermittent\n  claudication`, AND any of foot pain at rest (Foot pain + At rest), ulcer of foot, gangrene of foot.\n- **Tinea pedis:** cracks / peeling / scaly skin at Structure of interdigital space of foot, OR\n  Thick skin AND Scaly skin at the same site, for sole, heel and border of foot (\"sides of feet\").\n- **Peripheral neuropathy:** generalised foot pain (Foot pain + Generalized) AND any of Burning\n  feet, Paresthesia of foot (pins/needles), Numbness of foot. Diagnosis concept `Peripheral nerve\n  disease` (no FSN \"Peripheral neuropathy\").\n- **Peripheral vascular disease:** generalised foot pain AND muscle pain at lower limb or buttock.\n  The PVD box does not say \"on exercise\", so claudication is not used there.\n- **Plantar fasciitis:** Heel pain AND Pain aggravated by walking.\n- **Bunion:** Deformity of foot AND Bony swelling of toe joint at First metatarsophalangeal joint\n  structure (\"bony lump at base of big toe\"). \"May have callus, redness or ulcer\" is optional and\n  not required. Diagnosis concept `Hallux valgus AND bunion`.\n- No `measure` task: the page asks for no measurement in its triage/diagnostic logic (light-prick\n  sensation and foot pulses appear only in the diabetes/PVD foot-at-risk review box).\n\n## Could not model\n\n- **\"following injury\"** (injury before inability to bear weight): co-occurrence only.\n- **\"Constant\" and \"worse at night\"** (neuropathy): not encoded. Fires more often than the page\n  intends.\n- **\"Localised\" pain** (plantar fasciitis, bunion): not required as a qualifier; the specific\n  findings (heel pain, deformity with bony swelling) carry the branch. Fires more often.\n- **\"Worse on starting walking\"**: encoded as Pain aggravated by walking; \"on starting\" (first\n  steps) is lost. Fires more often.\n- **\"Ensure that shoes fit properly\"** (localised pain): management.\n- **Joint check → page 77** (walk, sit, stand with arms folded): routing to another page; no rule.\n- **Diabetes/PVD foot at risk** (callus, corns, cracks, ulcers, deformity, abnormal light-prick\n  sensation, absent/reduced pulses → review more frequently) and the daily foot-care advice:\n  review and management, out of scope for this pass.\n\n## SNOMED gaps\n\n- **Pallor of the leg**: no pallor/pale concept for limb skin (`Pallor`, `Pale skin`, `Pallor of\n  skin` do not exist; `Pale complexion` is face-specific). Substitute: `White discoloration of\n  skin` at `Skin structure of lower limb`.\n- **Peripheral neuropathy** (disorder): not an FSN. Substitute: `Peripheral nerve disease`.\n- **Bunion** (disorder): not an FSN. Substitute: `Hallux valgus AND bunion` (a descendant of\n  `Swelling of first metatarsophalangeal joint of hallux`, the FSN `exists` suggests).\n- **\"Worse at night\" / \"nocturnal\"** qualifier: only `Night time` exists, which means \"at night\",\n  not \"worse at night\"; not used.\n- **\"Thickened skin\"**: not an FSN; `Thick skin` (finding) used.\n- No \"acute limb ischaemia\" FSN at limb level without side; `Acute lower limb ischemia` used.\n- All finding_site body structures were checked with `snomed exists`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Is `Intermittent claudication` an acceptable reading of \"muscle pain in legs or buttocks on\n  exercise\", including buttock claudication?\n- Should the PVD branch (\"foot pain with muscle pain in legs or buttocks\") require exertional pain\n  (claudication), as the red-box CLI item does?\n- Should acute limb ischaemia require sudden, severe and at rest all on the same recorded foot\n  pain, or would any sudden severe foot pain do?\n- Is \"no pulse\" best checked as any absent peripheral pulse, or restricted to foot pulses\n  (dorsalis pedis / posterior tibial)?\n- Should a fracture anywhere (not only foot/ankle) be urgent on this page, and does any injury\n  count, or only an injury of the leg/foot?\n- Is requiring generalised foot pain for peripheral neuropathy right, or should numbness/burning of\n  the feet alone suffice?\n- Should the bunion rule also require (localised) foot pain, since it sits under \"Localised pain\"?\n- Does the app record \"Finding of foot region\" descendants for the presenting complaint (e.g. foot\n  pain), so these rules fire? Should VHA add a foot complaint to the common symptoms?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent foot symptom conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Finding of foot region\" \"finding\"))", "element_keys": ["p81-54f7e4fb"], "quote": "foot symptoms"}, {"claim_id": "c002", "rule": "Check for urgent foot symptom conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to weight-bear\" \"finding\"))", "element_keys": ["p81-197f31de"], "quote": "Unable to bear weight"}, {"claim_id": "c003", "rule": "Check for urgent foot symptom conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Traumatic injury\" \"disorder\"))", "element_keys": ["p81-19 ": "in_scope", "scope_reason": "Red-box criterion with an 'X likely' conclusion. Parts: (a) sudden, (b) severe, (c) foot pain, (d) at rest, with any of in the leg: (e) numbness, (f) weakness, (g) pallor, (h) no pulse; (i) acute limb ischaemia likely.", "verdict": "correct", "parts_missing": [], "problem": "Logic matches the page: AND of the qualified foot pain with an OR of the four leg signs. Sudden/Severe/At rest are all carried as qualifiers on Foot pain. Numbness and weakness use lower-limb concepts. Pallor has no lower-limb precoordinated concept in SNOMED (only 'Pallor of skin of face' and 'Pale discoloration of entire skin of body'), so 'White discoloration of skin' at 'Skin structure of lower limb' is a fair approximation. 'Peripheral pulse absent' is right for 'no pulse ... in the leg' ('Foot pulse absent' is a descendant and would also match). 'Acute lower limb ischemia' is the exact SNOMED disorder.", "evidence": ["Diagnose probable acute lower limb ischaemia with foot symptoms :: (and (clinical_finding (snomed_concept \"Foot pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"At rest\" \"qualifier value\"))) (or (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\")) (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\")) (clinical_finding (snomed_concept \"White discoloration of skin\" \"finding\") (finding_site (snomed_concept \"Skin structure of lower limb\" \"body structure\"))) (clinical_finding (snomed_concept \"Peripheral pulse absent\" \"finding\"))))"], "confidence": "high"}, {"element_key": "p81-74e46a6e", "scope": "in_scope", "scope_reason": "Red-box criterion with an 'X likely' conclusion. Parts: (a) muscle pain in legs or buttocks on exercise, associated with any of (b) foot pain at rest, (c) ulcer on foot, (d) gangrene on foot; (e) critical limb ischaemia likely.", "verdict": "correct", "parts_missing": [], "problem": "Logic matches the page: AND of the exertional muscle pain with an OR of rest pain / ulcer / gangrene. 'Intermittent claudication' is the correct SNOMED concept for 'muscle pain in legs or buttocks on exercise' and is a descendant of 'Muscle pain'. 'Critical lower limb ischemia' is the exact disorder. See rule-level problem 1: the same page phrase lower on the page ('muscle pain in legs or buttocks', PVD branch) is coded differently (Muscle pain + finding_site), so the two rules will not see each other's recordings.", "evidence": ["Diagnose probable critical lower limb ischaemia with foot symptoms :: (and (clinical_finding (snomed_concept \"Intermittent claudication\" \"finding\")) (or (clinical_finding (snomed_concept \"Foot pain\" \"finding\") (qualifier (snomed_concept \"At rest\" \"qualifier value\"))) (clinical_finding (snomed_concept \"Ulcer of foot\" \"disorder\")) (clinical_finding (snomed_concept \"Gangrene of foot\" \"disorder\"))))"], "confidence": "medium"}, {"element_key": "p81-839a9f80", "scope": "borderline", "scope_reason": "'Refer urgently.' is a management step, but it is also what justifies the priority level, so it is judged against the priority evaluation.", "verdict": "correct", "parts_missing": [], "problem": "The page says 'urgent attention' and 'Refer urgently', not 'Emergency', so the Urgent level is the right one. The referral action itself is out of scope by design (no manage tasks).", "evidence": ["Urgent: foot symptoms with fracture or limb ischaemia :: (system_priority_evaluation \"Urgent: foot symptoms with fracture or limb ischaemia\" adult Urgent ...)"], "confidence": "high"}, {"element_key": "p81-a2a7035a", "scope": "out_of_scope", "scope_reason": "cross_reference_only", "verdict": null, "parts_missing": [], "problem": "A screening instruction that routes to the joint-symptoms page (77) when the walk/sit/stand test fails; it names no diagnosis and no red-box criterion. Not encoded, and the house standard would not expect it. Reasonable people could also call it a flowchart decision, hence medium confidence.", "evidence": [], "confidence": "medium"}, {"element_key": "p81-cf487151", "scope": "borderline", "scope_reason": "'If the patient has diabetes or PVD, identify the foot at risk and review more frequently if patient also has any of: skin (callus, corns, cracks, wet soft skin between toes, ulcers); foot deformity (refer for specialist care); sensation (light prick abnormal after 2 attempts); circulation (absent or reduced foot pulses).' This is a criteria list with a conclusion ('foot at risk'), but the conclusion is a review-frequency / referral decision rather than an 'X likely' diagnosis, so the house standard does not clearly require it.", "verdict": "missing", "parts_missing": ["trigger: known diabetes or PVD", "callus / corns", "cracks between toes", "wet soft skin between toes", "ulcers", "foot deformity (refer for specialist care)", "abnormal light-prick sensation after 2 attempts", "absent or reduced foot pulses", "conclusion: foot at risk"], "problem": "Nothing from this block is encoded: no check_for task triggered by diabetes/PVD, no rule. Most of the findings are expressible (SNOMED has 'Foot callus', 'Ulcer of foot', 'Deformity of foot', '10g monofilament sensation absent', 'Foot pulse absent'; 'Diabetic foot' exists as a disorder), so a check_for task on (active_condition Diabetes mellitus / Peripheral vascular disease) with a possible 'Diabetic foot' conclusion was feasible. Because it is not an 'X likely' and the page's output is a management decision, I rate this as a borderline omission rather than an error.", "evidence": [], "confidence": "medium"}, {"element_key": "p81-7d5b6c24", "scope": "in_scope", "scope_reason": "'X likely' conclusion. Parts: (a) cracks between toes, (b) peeling between toes, (c) scaly lesions between toes, OR (d) thickened scaly skin on soles, (e) on heels, (f) on sides of feet; (g) <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

function prettyLisp(expr, width = 72) {

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";

// The rule's own text in the page's rule file: the top-level form whose description matches,

const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }

const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;

  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
