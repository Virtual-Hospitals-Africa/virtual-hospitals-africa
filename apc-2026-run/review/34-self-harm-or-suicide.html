": null, "text": "Assess the patient whose risk of self-harm or suicide is low", "bbox": [305.1, 320.2, 536.8, 331.4], "key": "p34-41e85c33"}, {"id": "p34-out-e03", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess When to assess Note", "bbox": [39.7, 336.2, 214.8, 347.2], "key": "p34-255673ec"}, {"id": "p34-out-e04", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Depression Every visit In the past month, has patient felt down/depressed/hopeless or little interest/pleasure in doing things? If yes to either 159. If known depression 160.", "bbox": [39.7, 351.3, 720.3, 362.1], "key": "p34-0bd18a87"}, {"id": "p34-out-e05", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Substance use Every visit In the past year, has patient drunk ≥ 4 drinks1/session, used illegal drugs or misused prescription or over-the-counter medications? If yes to any 165.", "bbox": [39.7, 366.1, 707.6, 376.9], "key": "p34-2d411090"}, {"id": "p34-out-e06", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Other mental illness Every visit If hallucinations, delusions, disorganised speech, disorganised or catatonic behaviour, discuss with specialist same day. If memory problem, screen for dementia 166.", "bbox": [39.7, 381.0, 764.1, 391.8], "key": "p34-e7727f33"}, {"id": "p34-out-e07", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Stressors Every visit • If not known with a mental illness, assess for stress and anxiety 98. • Help identify psychosocial stressors. Ask about trauma, sexual assault 32, abuse 33, family or relationship problems, financial difficulty, bereavement, chronic ill-health.", "bbox": [39.7, 395.9, 783.6, 416.7], "key": "p34-966513e1"}, {"id": "p34-out-e08", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Long-term health conditions", "bbox": [39.7, 421.2, 101.4, 441.4], "key": "p34-6631e727"}, {"id": "p34-out-e09", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Every visit • If chronic pain, assess and manage pain 76 and underlying condition. Link patient with helpline or support group 200. • If patient has a life-limiting illness, in bed or chair for 50% or more of the day or dependent on others for most care, also give palliative care 191.", "bbox": [121.9, 420.8, 698.4, 441.6], "key": "p34-c605690b"}, {"id": "p34-out-e10", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Discharge into care of family, if possible. Review patient at least weekly for 2 months and involve a counsellor, psychiatric nurse/psychologist or social worker if possible. • If self-harm or suicide risk is still low, follow up monthly. If thoughts or attempts of self-harm or suicide recur, reassess suicide risk above.", "bbox": [51.0, 516.0, 672.5, 536.2], "key": "p34-6ea82761"}, {"id": "p34-out-e11", "page": 34, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Advise the patient whose risk of self-harm or suicide is low • Discuss with patient reasons to stay alive. Encourage carers to closely monitor patient as long as risk persists and to bring patient back if any concerns. • Advise patient and carers to restrict access to means of self-harm (remove firearms from house, keep medications and toxic substances locked away) as long as risk persists. • Suggest patient seeks support from close relatives/friends and offer referral to counsellor or local mental health centre or helpline 200.", "bbox": [51.0, 457.3, 683.1, 498.4], "key": "p34-64bde5fe"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 305.5]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAHJCAIAAACwqnkXAAAACXBIWXMAABcSAAAXEgFnn9JSAAF3+ElEQVR4nOydh1cVx//+v3/I75zoBRF7w4oldrFrjBpjT6LG3gsae0v1Y0xssWvsLRqjJPaOYkPsKDYUFQsoKrb7e7xvmUx29+5dELkXeJ7zOpy9u7O7szOzOzMPs7P/d///BRNCCCGEEEIIIYQQkrv4P7/HgBBCCCGEEEIIIYSQzEJXixBCCCGEEEIIIYTkPv7jaj2bO/XZkp8IIYQQQgghhBBCCAlA0sYNtna1Xt8/4n55hhBCCCGEEEIIIYSQAOTFwTV0tQghhBBCCCGEEEJILoOuFiGEEEIIIYQQQgjJfdDVIoQQQgghhBBCCCG5D7pahBBCCCGEEEIIIST3QVeLEEIIIYQQQgghhOQ+6GoRQgghhBBCCCGEkNwHXS1CCCGEEEIIIYQQkvugq0UIIYQQQgghhBBCch90tQghhBBCCCGEEEJI7oOuFiGEEEIIIYQQQgjJfdDVIoSQbCblfrTf40DsyV15tH/3sqi/5gG/x8SS9LSTT1OP+T0aBs6c2iSJdv/OwTyfBbmag/uWS9q+Tj/t98jo2DwlXjw9JXGOPrAyZyKT7Wd8/uSEHPDoodX6+muXty9d+O2sGWMO77c4UfbeVrkdh/WI/RMy58sSIYTkPehqEUJI5kBn4I91v34/ZcjX3dq1/6xZ/z6dfv5p5OULUbJ13Og+ro8++qpra7/Hk3gj1+XRx9UqIsLA7zExgz5w2VLFixcpHGhdsmGDv5JEO7R/Rd7OgtxOw/ofS9ri0aqvnzljdO2Pq+zduTTno/Q6/XSTiFrBBQvOnTXeMkDK/WiJc4um9XImStl+xlvX98gB237aSK1cu/J/oYWCZP3g/l3Ne2XvbZWrcViP+HxC5nxZIoSQvAddLUIIyQSb1v9atXJ5aYPqqM5PRL0a+FmiaOiLp6f8HtsPytPUY9v+nDtxbP/FC6ZmYfcLZ7YsmDupV4/PUx/8W90c3Lv8559GfhPZM7sieSdx35oV/0NPTB938EHzyPK63jPCgWOpmK8uastvErfZv4zNllNkVxnIY66WOVne8wb8cBHLLN5crbq1qgYXLPgo+XDOX9T9OwdxakSpc/uWlgHypKuFNcWLFJaVSPxffx5t3ouulsJhPeLzCUlXixBC3h+6WoQQ4pRF8yYrG6tG1Yrdv2w7qF+XDu2alywWevrkHxLm2JG1I4Z02/XPIr/H9kNz/Mg6SYrRkb2ysHun9i1kd/1NFhkmUL92teyK5KwZY+Qsf22ao1Z+0DyyvK73jLDfLRWbq0tPOzlj2qipkwY9vJc97kN2lYE85mqZk+U9b8APF7HMYulqXb+yA2taf9LQX9e1ce0vI4f3uHD2L8utedLVWrvyf7LGxqOkq6VwWI/4fELS1SKEkPeHrhYhhDjizKlN0n8LCXKtXj7tzYs4tQnNVvUz4dLfF85sAVi+e2ufLN+7vV8FRjfp7Uqts/T8yUl0UP/eOi/x+m7LUz9KPizHUVbCncR3R37yKAY/H9w9JD8Rjaepx7ZvW6DOiLidjFn/z9b5yUkHXj2PlWCG4Q84L86OOOi9ysRruxDyavx2t6f/s3XznIP7lqsAOOMf636VtnjfXh0R8vaNPZYxx2G3/DH74N7lyUn/ujyXzm1t1aKB7H700Grs/vjhUfwtHPw2hWtWq4TlKxejVPjX6aeRYogD/uqT79hHElvHj+krZ5k/ZyJCyjQoeh4pkG6xxzciqrEnNiJH9E2ILQIjN7F87vSff/4xC2Esc8p8Xfq/8REfdIF2bV9smVY2EdYtFWR91F/zkKfm3X0WJKSMXDhSG8l48ezWbX/OjT+/Lcu5hqtLfXBEjokCZjjI3 \" \"finding\"))\n    (clinical_finding (snomed_concept \"Distress\" \"finding\"))\n    (clinical_finding (snomed_concept \"Does not communicate\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable high risk of self-harm or suicide\"\n  (diagnosis\n    (snomed_concept \"High suicide risk\" \"finding\")\n    probable\n  )\n  adult\n  (or\n    ;; Q1 = No -> Q2 = Yes: current thoughts or plans to attempt suicide\n    (clinical_finding (snomed_concept \"Suicidal thoughts\" \"finding\") (qualifier (snomed_concept \"Current\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Planning suicide\" \"finding\") (qualifier (snomed_concept \"Current\" \"qualifier value\")))\n    ;; Q2 = No -> Q3 = Yes -> Q4 = Yes\n    (and\n      (or (<= (onset (clinical_finding (snomed_concept \"Thoughts of self harm\" \"finding\"))) (time_ago 1 months))\n          (<= (onset (clinical_finding (snomed_concept \"Suicidal thoughts\" \"finding\"))) (time_ago 1 months))\n          (<= (onset (clinical_finding (snomed_concept \"Planning suicide\" \"finding\"))) (time_ago 1 months))\n          (<= (onset (clinical_finding (snomed_concept \"History of attempted suicide\" \"situation\"))) (time_ago 1 years))\n          (<= (onset (clinical_finding (snomed_concept \"History of deliberate self harm\" \"situation\"))) (time_ago 1 years))\n      )\n      (or (clinical_finding (snomed_concept \"Feeling agitated\" \"finding\"))\n          (clinical_finding (snomed_concept \"Aggressive behavior\" \"finding\"))\n          (clinical_finding (snomed_concept \"Distress\" \"finding\"))\n          (clinical_finding (snomed_concept \"Does not communicate\" \"finding\"))\n      )\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable low risk of self-harm or suicide\"\n  (diagnosis\n    (snomed_concept \"At low risk for suicide\" \"finding\")\n    probable\n  )\n  adult\n  ;; Q1 = No, Q2 = No, Q4 = No (the Q3 = No path is not modelled; see remaining questions)\n  (and\n    (no ( nage below (assess / advise sections)\"]\n```\n\nNote: the Yes branch of Q1 joins the same management box as \"High risk\" but does not pass through\nthe \"High risk\" box. It is Urgent through the header rule and is not diagnosed as high risk\n(reconciler decision; see remaining questions).\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Header: attempted/considered self-harm or suicide | Trigger: `Suicide attempt`, `Intentionally harming self`, `Suicidal thoughts`, `Thoughts of self harm` (covers `Suicidal thoughts`, `Planning suicide`, `Thoughts of deliberate self harm` and their descendants) | `Check for self-harm or suicide risk`; `Urgent: attempted/considered self-harm or suicide` |\n| Q1 = Yes | `Suicide attempt` or `Intentionally harming self` recorded in the encounter | `Urgent: attempted/considered self-harm or suicide` (no risk diagnosis) |\n| Q2 = Yes | `Suicidal thoughts` or `Planning suicide`, each with qualifier `Current` | `Diagnose probable high risk of self-harm or suicide`, first branch |\n| Q3 = Yes → Q4 = Yes | (onset of `Thoughts of self harm`, `Suicidal thoughts` or `Planning suicide` within 1 month, **or** onset of `History of attempted suicide` / `History of deliberate self harm` within 1 year) **and** any of `Feeling agitated`, `Aggressive behavior`, `Distress`, `Does not communicate` | same rule, second branch |\n| Q4 = No → Low risk | No attempt, no current suicidal thoughts/plans, and none of the four Q4 findings (explicit `no` records) | `Diagnose probable low risk of self-harm or suicide` |\n| Q3 = No → Low risk | Not modelled: \"no thoughts in past month\" cannot be expressed as a time-limited negative | see remaining-questions, Could not model |\n| ABC / overdose / CO / management box | Management, not encoded | — |\n", "questions": "# Page 34 – Self-harm or suicide: remaining questions\n\n## Decisions made\n\n- **Trigger.** The box header (\"attempted/considered self-harm or suicide\") is the trigger:\n  `Suicide attempt` (event), `Intentionally harming self` (event), `Suicidal thoughts` or `Thoughts of self harm`\n  (finding; its descendants include `Suicidal thoughts`, `Planning suicide` and\n  `Thoughts of deliberate self harm`). None of these is a recorded common symptom or warning sign.\n- **Urgent for everyone in the box.** The header says to give urgent attention to every patient who\n  has attempted or considered self-harm or suicide, so `Urgent: attempted/considered self-harm or\n  suicide` fires on the trigger itself, and also on `(active_condition High suicide risk)`. The page\n  does not escalate further (\"Refer urgently\"). `Aggressive behavior` is already a Very urgent\n  warning sign on its own.\n- **Q1 = Yes is Urgent but not diagnosed as high risk.** On the page, the Yes branch passes the\n  ABC/overdose box and joins the same management box as \"High risk of self-harm or suicide\", but it\n  does not pass through the \"High risk\" box. The attempt is Urgent through the header rule.\n- **Current vs past.** Q2 (\"current thoughts or plans to attempt suicide\") uses `Suicidal thoughts`\n  and `Planning suicide` with the `Current` qualifier. Q3 uses the onset of `Thoughts of self harm`\n  within 1 month, and the onset of `History of attempted suicide` / `History of deliberate self\n  harm` (situations) within 1 year. Following the brief, \"within\" is written with `<=`.\n- **Past acts are situations, not events.** `Previous known suicide attempt` (event) is a\n  descendant of `Suicide attempt`, so it would also match Q1 (\"has attempted\"). The history\n  situations avoid that.\n- **\"Violent\"** = `Aggressive behavior`, the VHA warning sign described as \"Violent or agressive\n  behavior\". There is no `Violent behavior` concept.\n- **High / low risk outcomes** are `probable` diagnoses of `High suicide risk` and `At low risk for\n  suicide`. The page's wording is \"self-harm or suicide\"; SNOMED has no combined concept.\n- No `manage` tasks. ABC, overdose (page 27), carbon monoxide oxygen, safety, sedation and referral\n  are accounted for as management steps or cross-references.\n\n## Could not model\n\n- **Q3 = No → Low risk** (no thoughts/plans in the past month and no act in the past year). The\n  language cannot express a time-limited negative such as \"no thoughts in the past month\". The\n  low-risk rule therefore covers only Q1 = No, Q2 = No and Q4 = No, with each answer recorded\n  explicitly as No. The result: `At low risk for suicide` is diagnosed **less often** than the\n  page intends. A patient on the Q3 = No path gets no risk diagnosis, but is still Urgent through\n  the trigger.\n- **Onset of past ideation.** The past-month branch only works if onset is recorded when the thought\n  or plan happened. If onset is always the recording time, it fires for any recorded ideation\n  (more often than the page intends).\n- **Onset of a history situation.** The past-year rule assumes the onset recorded on\n  `History of attempted suicide` / `History of deliberate self harm` is the date of the act. If the\n  app records the date of entry instead, the rule fires more often than the page intends.\n- The \"Assess / Advise the patient whose risk is low\" sections are every-visit screening and\n  advice that point to other pages (159, 165, 166, 98, 32, 33, 76, 191, 200). They are not modelled.\n\n## SNOMED gaps\n\n- \"Violent\": no `Violent behavior` (finding); used `Aggressive behavior`.\n- \"Uncommunicative\": no exact concept; used `Does not communicate` (finding).\n- \"High/Low risk of self-harm or suicide\": used `High suicide risk` / `At low risk for suicide`.\n  Alternatives: `At increased risk for deliberate self harm`, `At increased risk of\n  self-injurious behavior`.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR`:\n  `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Suicidal thoughts\" \"finding\") (snomed_concept \"No\" \"qualifier value\") (qualifier (snomed_concept \"Current\" \"qualifier value\"))))`.\n  The positive Current-qualified form is in the `check_for`, but the gate does not match the `(no …)`\n  form of a qualified finding to it. Dropping the qualifier would change the meaning of \"current\".\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR`:\n  `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Planning suicide\" \"finding\") (snomed_concept \"No\" \"qualifier value\") (qualifier (snomed_concept \"Current\" \"qualifier value\"))))`.\n  Same reason.\n\n## Questions for a clinician\n\n- Should a patient who has attempted self-harm or suicide (Q1 = Yes) also be recorded as high risk\n  of self-harm or suicide? The page sends them to the same management box but not through the\n  \"High risk\" box.\n- Should every patient who has *considered* self-harm or suicide be Urgent, as the box header says,\n  even when the flowchart ends at low risk?\n- Should a self-harm act more than a year ago, or ideation more than a month ago, still raise the\n  patient's priority in any way?\n- How should staff record a past attempt so that it is not read as a current one: a history record\n  (used here) or the `In the past` qualifier?\n\n- Should a patient with no thoughts or plans in the past month and no act in the past year (the\n  Q3 = No path) be recorded as low risk only after an explicit screen? The app cannot infer this\n  path today.\n- Does `Distress` (general) capture \"distressed\", or should it be `Mental distress`?\n- Should high risk raise the priority above Urgent (e.g. Very urgent), given \"Refer urgently\" and\n  \"avoid leaving patient alone\"?\n", "claims": [{"claim_id": "c001", "rule": "Check for self-harm or suicide risk", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Suicide attempt\" \"event\"))", "element_keys": ["p34-49e51b48"], "quote": "attempted/considered self-harm or suicide"}, {"claim_id": "c002", "rule": "Check for self-harm or suicide risk", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Intentionally harming self\" \"event\"))", "element_keys": ["p34-49e51b48"], "quote": "attempted/considered self-harm or suicide"}, {"claim_id": "c003", "rule": "Check for self-harm or suicide risk", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Suicidal thoughts\" \"finding\"))", "element_keys": ["p34-49e51b48"], "quote": "attempted/considered self-harm or suicide"}, {"claim_id": "c004", "rule": "Check for self-harm or suicide risk", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Thoughts of self harm\" \"finding\"))", "element_keys": ["p34-49e51b48"], "quote": "considered self-harm or suicide"}, {"claim_id": "c005", "rule": "Check for self-harm or suicide risk", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Suicidal thoughts\" \"finding\") (qualifier (snomed_concept \"Current\" \"qualifier value\")))", "element_keys": ["p34-a1c34aac"], "quote": "current thoughts or plans to attempt suicide"}, {"claim_id": "c006", "rule": "Check for self-harm or suicide risk", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Planning suicide\" \"finding\") (qualifier (snomed_concept \"Current\" \"qualifier value\")))", "element_keys": ["p34-a1c34aac"], "quote": "current thoughts or plans to attempt suicide"}, {"claim_id": "c007", "rule": lified Planning suicide and the two History situations. 'Thoughts in the past month' can therefore only reach the rule if recorded on another page or as a warning sign. (The unqualified forms cannot be added to check_for as-is because they are in the task's own due_to; the trigger set would need re-thinking, e.g. trigger on the events and the Current-qualified findings only.)", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Urgent: attempted/considered self-harm or suicide", "text": "Any Thoughts of self harm (and descendants Suicidal thoughts, Planning suicide) at any time raises Urgent, so a patient the flowchart classifies Low risk (thoughts a month ago, calm) is still Urgent. Defensible from the header 'attempted/considered', but the page sends Low risk to routine management ('Manage below'), so the priority and the low-risk diagnosis will disagree for the same patient.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Diagnose probable high risk of self-harm or suicide", "text": "`onset` of 'History of attempted suicide' / 'History of deliberate self harm' is the time the situation was recorded, not when the act occurred, so 'in past year' is only approximated even once the comparator direction is fixed.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Check for self-harm or suicide risk", "text": "Task due_to lists both Suicidal thoughts and its parent Thoughts of self harm; descendants match automatically, so the first is redundant. Harmless.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Urgent: attempted/considered self-harm or suicide", "text": "Triggers on any 'Thoughts of self harm' finding regardless of timing or current status; the page makes Urgent only for attempt or high risk. Also current thoughts/plans reach Urgent only through the high-risk diagnosis, relying on a derived active_condition.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Task check_for", "text": "Contains both qualified and unqualified Planning suicide, and Suicidal thoughts with and without Current inside the task trigger; duplicate/overlapping items. Thoughts of self harm in the trigger is not in check_for, and Suicide attempt/Intentionally harming self are not in check_for.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Diagnose probable low risk", "text": "Defined by absence of eight findings; empty record yields low risk. Excludes agitation even when history absent, diverging from page branch (no history -> low risk).", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Diagnose probable high risk", "text": "Past-year acts are mapped to history 'situation' concepts rather than acute event findings; attempted self-harm itself does not produce high risk (only Urgent).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "high", "ref": "Diagnose probable low risk of self-harm or suicide", "text": "Logic does not match the flowchart: page reaches low risk by EITHER no past-month/past-year history OR history without agitation; rule ignores history and always requires no agitation/aggression/distress/non-communication, losing the 'no history' route (agitated patient with no recent history).", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "high", "ref": "Diagnose probable low risk of self-harm or suicide / Check for self-harm or suicide risk", "text": "Low-risk rule requires recorded (no) for \"Suicide attempt\" and \"Intentionally harming self\", but these are only the task due_to and appear in no check_for; when the task fires on thoughts, the first flowchart question (attempted?) is never asked, so the low-risk diagnosis is effectively unreachable.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Diagnose probable high risk of self-harm or suicide", "text": "Past-year act uses onset of 'History of attempted suicide' / 'History of deliberate self harm' situations; onset of a history-of situation is the recording time, not the act date, so 'act in past year' is not really tested; recent 'Suicide attempt'/'Intentionally harming self' events are not used in this branch.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Diagnose probable high risk of self-harm or suicide", "text": "'Thoughts in past month' encoded as onset within 1 month; thoughts that began more than a month ago and persisted into the past month (but are not tagged Current) are missed.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Check for self-harm or suicide risk", "text": "check_for lists 'Planning suicide' both with Current qualifier and unqualified, and does not ask about the attempt itself or 'Thoughts of self harm' within the past month as a distinct item; the check list does not mirror the flowchart's first question.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Urgent: attempted/considered self-harm or suicide", "text": "Urgent trigger includes unqualified 'Thoughts of self harm' (and via descendants any suicidal thought/plan ever recorded), so every patient the page classes low risk is also Urgent; consistent with the box header 'attempted/considered' but means the low/high split does not affect priority. Past-year acts recorded only as history situations do not trigger Urgent.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Diagnose probable high risk of self-harm or suicide", "text": "and/or structure matches the page (Q2 Yes, or Q3 Yes and Q4 Yes) and probable is right for the box's own conclusion label. Two issues: (1) 'Distress' is far broader than 'distressed' (its descendants include Respiratory distress and Fetal distress), so an unrelated distress finding plus a past-month thought would make the patient high risk; use 'Mental distress'. (2) The Q1 = Yes branch (attempted) flows into the same 'Avoid leaving patient alone / Refer urgently' management as High risk, but neither Suicide attempt nor Intentionally harming self appears in this rule; the page's label box is not on that path, so this is a judgment call, but a patient who has just attempted is left with no risk diagnosis.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "high", "ref": "Diagnose probable low risk of self-harm or suicide", "text": "The due_to is made only of (no ...) conditions with no positive anchor. The page's low-risk patient is one who has 'considered self-harm or suicide' (entered the box) and answered No to Q1 and Q2 and either No to Q3 or No to Q4. As written the rule either fires for every patient with nothing recorded (labelling everyone 'At low risk for suicide') or never fires because nothing recorded matches it. It also drops the Q3 = No branch: on the page a patient with no recent thoughts/acts is low risk regardless of agitation/violence/distress, but the rule demands absence of all four. Fix: anchor with (or Thoughts of self harm, History of attempted suicide, History of deliberate self harm) and keep the negations; ideally (and anchor (no Q1) (no Q2) (or (no Q3-window) (no Q4))) if negated onset windows are expressible.", "detail": [{"checker": "backward-1", "severity": "high"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Check for self-harm or suicide risk", "text": "Past-month window and 'Thoughts of self harm' missing from the check_for list (c007); also Planning suicide appears twice (with and without Current), which is redundant.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Diagnose probable low risk of self-harm or suicide", "text": "Requires no agitation unconditionally; the page reaches Low risk directly when no recent history, without asking about agitation. Gap: agitated patient with no recent history gets no diagnosis.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Urgent: attempted/considered self-harm or suicide", "text": "Untimed 'Thoughts of self harm' makes any remote thought Urgent, broader than the page flow.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 34, "slug": "34-self-harm-or-suicide", "kind": "rule", "priority": "medium", "ref": "Check for self-harm or suicide risk", "text": "Trigger is fine. check_for duplicates Planning suicide and lacks unqualified past-month Suicidal thoughts and Thoughts of self harm. 'History of' situations can't carry the act's date for the 1-year window.", "detail": [{"checker": "backward-3", "severity"   <section class="pane"><h2>Red box text, piece by piece <span class="hb" data-k="source"></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="source"></div></section>
  <section class="pane"><h2><span id="rulesttl">Rules, in plain English</span> <span class="hb" data-k="rules"></span> <span style="float:right"><button id="rawbtn" style="font-size:11.5px;text-transform:none;letter-spacing:0">show structured rules</button><span class="hb" data-k="rawtoggle"></span></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="rules"></div></section>
</main>
<div class="lower">
  <div class="tabs" id="tabs"></div>
  <div class="tabbody" id="tabbody"></div>
</div>
<script src="help.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
