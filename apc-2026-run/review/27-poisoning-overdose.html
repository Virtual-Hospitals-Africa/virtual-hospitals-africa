10.2, 173.8], "key": "p27-54ae997c"}, {"id": "p27-rb1-e12", "page": 27, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with suspected poisoning/overdose and any of:", "section_y": 122.2, "indent": 1, "parent": null, "text": "Persistent vomiting", "bbox": [312.5, 162.8, 392.3, 173.6], "key": "p27-756940e0"}, {"id": "p27-rb1-e13", "page": 27, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the patient with suspected poisoning/overdose and any of:", "section_y": 122.2, "indent": 1, "parent": null, "text": "Pulse < 60 or >100", "bbox": [503.2, 162.8, 579.5, 173.6], "key": "p27-e254c2f0"}, {"id": "p27-rb1-e14", "page": 27, "box": 1, "kind_hint": "header", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 0, "parent": null, "text": "Manage and refer urgently:", "bbox": [51.2, 177.0, 157.1, 188.0], "key": "p27-88a5552a"}, {"id": "p27-rb1-e15", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "First assess and manage airway, breathing, circulation and level of consciousness 16. If oxygen saturation < 94%, give oxygen via face mask or nasal cannula to maintain oxygen saturation ≥ 94%. Doctor to consider intubation.", "bbox": [51.2, 187.2, 779.3, 208.0], "key": "p27-340616f7"}, {"id": "p27-rb1-e16", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "If shock1/systolic BP < 80, give sodium chloride 0.9% 1L IV rapidly, repeat until systolic BP > 80. Continue 1L 6 hourly. Stop if breathing worsens.", "bbox": [51.2, 207.0, 607.9, 218.0], "key": "p27-0f6836c0"}, {"id": "p27-rb1-e17", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "If poison on skin (e.g. pesticides):", "bbox": [51.2, 217.2, 184.5, 228.0], "key": "p27-d484415a"}, {"id": "p27-rb1-e18", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 2, "parent": "p27-rb1-e17", "text": "Health worker to wear gloves, apron and surgical mask. If health worker/caregiver has any skin contact or contact with bodily fluids, wash off immediately.", "bbox": [56.9, 227.2, 648.7, 238.0], "key": "p27-4bab9192"}, {"id": "p27-rb1-e19", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 2, "parent": "p27-rb1-e17", "text": "Remove patient's clothes and wash patient with soap and water after emergency care given.", "bbox": [56.9, 237.2, 413.6, 248.0], "key": "p27-2d35b113"}, {"id": "p27-rb1-e20", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "If poison in eye/s, immediately flush eye/s under running water or sodium chloride 0.9% for at least 20 minutes.", "bbox": [51.2, 247.2, 487.7, 258.0], "key": "p27-2c720cc2"}, {"id": "p27-rb1-e21", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "Ask about amount, type and time of substance ingestion/exposure. Examine tablets, packets/containers of suspected substance. If any of the following oral preparations taken in toxic dose in the past hour: paracetamol/amitriptyline/carbamazepine/phenytoin/theophylline/salicylates/mushroom poisoning/slow release preparations/digoxin/beta-blockers/NSAIDs and patient fully awake/cooperative or intubated, give activated charcoal2 50g diluted in 100mL water orally or via nasogastric tube. Avoid activated charcoal if patient swallowed petrol/paraffin/iron/lithium/ lead/mercury/arsenic/drain cleaners/alcohol/antifreeze/household detergents.", "bbox": [51.2, 257.2, 787.0, 298.0], "key": "p27-9163aefa"}, {"id": "p27-rb1-e22", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "If pinpoint pupils, excessive drooling/sweating, excessive secretions, vomiting/diarrhoea, pulse < 60, BP < 90/60, organophosphate poisoning likely. Give atropine 2mg IV immediately. Reassess every 3-5 minutes. If no response (still has excessive secretions, difficulty breathing, saturation < 94%, persistently low BP/pulse), give repeated doses of atropine every 3-5 minutes, doubling the dose each time: 4mg, 8mg, 16mg, 32mg. If some response, give the same or reduced dose. Continue until secretions controlled. Suction secretions frequently.", "bbox": [51.2, 297.0, 787.3, 328.0], "key": "p27-2a1c7693"}, {"id": "p27-rb1-e23", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "If shallow breathing/respiratory rate < 12 and opioid3 overdose suspected, connect bag-valve-mask to oxygen and slowly deliver each breath with patient. Also give naloxone 0.4mg IV/IM4 immediately. If known opioid user/addict, discuss starting dose of naloxone with PIH. Reassess every 2 minutes: if respiratory rate still < 12, give increasing doses of naloxone every 2-3 minutes: 0.8mg, 2mg, 4mg, up to a total of 10mg. Naloxone wears off quickly, monitor closely and give further doses if needed.", "bbox": [51.2, 327.0, 790.5, 358.0], "key": "p27-c1cdf7c4"}, {"id": "p27-rb1-e24", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "If overdose of > 10g or 200mg/kg of paracetamol or symptomatic and referral delay, give N-acetylcysteine 140mg/kg orally, then 70mg/kg 4 hourly. Avoid giving N-acetylcysteine together with activated charcoal. Monitor closely for possible anaphylactic reaction5 after initial dose, assess and manage 28.", "bbox": [51.2, 357.2, 778.1, 378.0], "key": "p27-50e63b39"}, {"id": "p27-rb1-e25", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "If exposed to carbon monoxide (exhaust fumes), give 100% face mask oxygen.", "bbox": [51.2, 377.2, 354.7, 388.0], "key": "p27-1cf83c31"}, {"id": "p27-rb1-e26", "page": 27, "box": 1, "kind_hint": "management", "section": "Manage and refer urgently:", "section_y": 177.0, "indent": 1, "parent": null, "text": "If no response, or overdose/poisoning with other or unknown substance, discuss with specialist or Poisons Information Helpline 200. Notify6 if pesticide, mercury or lead poisoning.", "bbox": [51.2, 387.2, 750.2, 398.0], "key": "p27-172cf4c6"}, {"id": "p27-out-e01", "page": 27, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "While assessing the patient, contact Poisons Information Helpline (PIH) 200 or consult AfriTox database (if available) to help with management and to calculate toxic dose.", "bbox": [104.8, 89.1, 737.1, 99.9], "key": "p27-c027c823"}, {"id": "p27-out-e02", "page": 27, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely. 2When mixing, add a small amount of water to charcoal in a container. Cap and shake the container to mix, then add the rest of the water. 3Examples of opioids include: codeine, tramadol, morphine, oxycodone, hydrocodone, fentanyl. 4Give naloxone IM only if IV not possible. 5Generalised rash, face/tongue swelling, vomiting, BP < 90/60. 6Notify within 24 hours (7 days if lead/mercury poisoning) via NMC App (download from NICD website/app store) or www.nicd.ac.za/nmc-overview/notification-process.", "bbox": [34.0, 527.3, 805.8, 551.8], "key": "p27-45b81a13"}, {"id": "p27-out-e03", "page": 27, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "POISONING/OVERDOSE", "bbox": [324.6, 48.7, 517.3, 71.0], "key": "p27-73ea64bd"}, {"id": "p27-out-e04", "page": 27, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Toxic dose", "bbox": [137.2, 466.7, 175.4, 476.9], "key": "p27-2dfb39f0"}, {"id": "p27-out-e05", "page": 27, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Refer urgently. • Discuss need for activated charcoal with PIH 200. • If self-harm 34. • Advise to return if condition worsens.", "bbox": [51.0, 491.7, 788.5, 512.5], "key": "p27-35ac1a06"}, {"id": "p27-out-e06", "page": 27, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Non-toxic dose and no symptoms Unknown poison or dose Non-toxic dose and has symptoms", "bbox": [323.5, 466.7, 780.7, 476.9], "key": "p27-2e736f38"}, {"id": "p27-out-e07", "page": 27, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with suspected poisoning/overdose not needing urgent attention • Ask about amount, type and time of substance ingestion or exposure. Examine tablets, packets, containers of suspected substance. If intentional exposure to poison/overdose, refer. • Contact the PIH 200 or consult AfriTox poisons information database to determine if toxic dose has been swallowed:", "bbox": [51.0, 420.3, 716.0, 451.4], "key": "p27-001186c3"}, {"id": "p27-out-e08", "page": 27, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Discuss further management with PIH 200.", "bbox": [370.3, 491.7, 537.5, 502.5], "key": "p27-4d8711c1"}], "boxes": [{"box": 1, "rect": [35.5, 117.1, 806.4, 403.2]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAJVCAIAAADr5rWyAAAACXBIWXMAABcSAAAXEgFnn9JSAAPZ90lEQVR4nOy9B1B only_B": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Dribbling from mouth\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pin point pupils\" \"finding\"))"], "both": ["(< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)", "(< (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 60)", "(< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Diarrhea\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Excessive sweating\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Finding of vomiting\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Poisoning\" \"disorder\"))"], "is_a_related": [{"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Constricted pupil\" \"finding\"))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pin point pupils\" \"finding\"))", "relation": "B_narrower"}], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Organophosphate poisoning\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 27 – Poisoning/Overdose: flowchart\n\nSource: APC 2026 e-book page 27. The page is a red box (urgent list + management) and a short\nrouting chart for the patient not needing urgent attention.\n\n```mermaid\nflowchart TD\n    P[\"Suspected poisoning/overdose\"] --> RB{\"Any of the red box signs?<br/>self-harm/suicide, ↓LOC, seizure, pupils dilated/pinpoint,<br/>confused/agitated/hallucinating, weakness/twitching,<br/>drooling/sweating, persistent vomiting, breathing problems,<br/>RR &lt; 12, shock/SBP &lt; 80, pulse &lt; 60 or &gt; 100\"}\n    RB -- Yes --> URG[\"Urgent: manage and refer urgently\"]\n    URG --> OPQ{\"Pinpoint pupils, drooling/sweating, excessive secretions,<br/>vomiting/diarrhoea, pulse &lt; 60, BP &lt; 90/60?\"}\n    OPQ -- Yes --> OP[\"Organophosphate poisoning likely (atropine)\"]\n    RB -- No --> NU[\"Ask about amount, type, time; contact PIH/AfriTox: toxic dose?\"]\n    NU --> T[\"Toxic dose: refer urgently\"]\n    NU --> U[\"Unknown poison or dose / non-toxic dose with symptoms: discuss with PIH\"]\n    NU --> N[\"Non-toxic dose, no symptoms: if self-harm 34; advise return\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Suspected poisoning/overdose | `(clinical_finding Poisoning)` (warning sign) | trigger of `Check for urgent poisoning/overdose conditions` |\n| Red box \"any of\" | `(and Poisoning (or …13 items…))` | `Urgent: poisoning/overdose with danger signs` |\n| Organophosphate signs | `(and Poisoning (or signs))` | `Diagnose probable organophosphate poisoning` |\n| Toxic / unknown / non-toxic dose | Not modelled: needs a toxic-dose judgment from PIH, management routing | — |\n", "questions": "# Page 27 – Poisoning/Overdose: remaining questions\n\nFinal build reconciled from builders A and B (base A; pupil and drooling concepts from B).\n\n## Decisions made\n\n- **Trigger** is `(clinical_finding (snomed_concept \"Poisoning\" \"disorder\"))`, the \"Poisoning or\n  overdose\" warning sign. Overdose is a descendant of Poisoning, so it matches.\n- **Priority level is `Urgent`**, as the red box says (\"Give urgent attention\"). The Poisoning\n  warning sign itself already carries \"Very urgent\"; this page does not escalate further.\n- **Shock:** \"Shock¹/systolic BP < 80\" is encoded as `(or Shock (< SBP 80))` on this page. Footnote 1\n  (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock\n  likely\") is not turned into a shock diagnosis rule, per the all-pages decision not to build a\n  shared shock definition.\n- **Organophosphate poisoning likely** → `probable` rule: suspected poisoning AND any of pinpoint\n  pupils, excessive drooling/sweating, vomiting/diarrhoea, pulse < 60, BP < 90/60 (systolic < 90\n  or diastolic < 60). The page lists the features with commas and no \"and\"/\"or\"; the \"any of\"\n  reading follows the page's identical list style in footnote 1.\n- **Confused** is encoded as Acute confusion or Clouded consciousness (whose synonym is\n  \"Confused\", the AVPU \"Confused\" vital), so either recording fires.\n- **Having/just had a seizure** → Seizure or Post-ictal state (\"just had\").\n- **Pinpoint** → `Pin point pupils` (finding), the exact page word.\n- **Excessive drooling** → `Dribbling from mouth` (synonym \"Drooling\"); \"excessive\" is not\n  expressed separately.\n- **Attempted self-harm/suicide** → Suicide attempt (event) or Intentionally harming self (event).\n- **Weakness** → Muscle weakness (paired with muscle twitching). **Slow breathing** → Slow respiration.\n- **Opioid overdose suspected** is not encoded as a diagnosis: the page gives it only as a\n  treatment condition with no evidence for the suspicion, and there is no `Opioid overdose` concept.\n  Shallow breathing and RR < 12 are still urgent criteria.\n- Pulse \"> 100\" is encoded strictly (`>`), as written; this differs from footnote 1's \"pulse ≥ 100\".\n- No `measure` task: RR, pulse and BP are routine vitals.\n\n## Could not model\n\n- Toxic-dose logic (toxic / unknown / non-toxic dose, \"in the past hour\", paracetamol > 10g or\n  200mg/kg): requires PIH/AfriTox judgment and units the language lacks; management routing.\n- **\"Excessive secretions\"** in the organophosphate list: left out (see SNOMED gaps). The rule\n  fires slightly **less often** than the page intends (only when secretions are the sole sign).\n- All management steps (oxygen, fluids, decontamination, activated charcoal, atropine, naloxone,\n  N-acetylcysteine, carbon monoxide, notification): out of scope (no manage tasks).\n\n## SNOMED gaps\n\n- `Pinpoint pupils` / `Miosis` (finding): not FSNs. Used `Pin point pupils` (finding).\n- `Mydriasis` (finding): used `Dilated pupil`.\n- `Drooling` (finding): not an FSN; used `Dribbling from mouth`. `Excessive salivation` (disorder)\n  is the alternative.\n- `Excessive secretions`: no generic concept. `Excessive bronchial secretion` / `Bronchorrhea`\n  exist but cover only bronchial secretions. Not encoded.\n- `Opioid overdose` (disorder): no FSN. `Morphinan opioid overdose` and `Intentional overdose of\n  opioid receptor agonist` are narrower.\n- `Attempted suicide` (event): used `Suicide attempt`.\n- `Confusion` (finding): used `Acute confusion` and `Clouded consciousness`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n1. In the organophosphate bullet, should **any one** feature, with suspected poisoning, make\n   organophosphate poisoning \"likely\" (as encoded), or should it need several (e.g. pinpoint pupils\n   plus secretions)? With the any-one reading, a poisoned patient with only diarrhoea, only\n   vomiting or only a low BP is labelled probable organophosphate poisoning.\n2. Should \"excessive secretions\" be read as bronchial secretions (`Excessive bronchial secretion`)?\n3. Is \"Weakness\" muscle weakness or general weakness (`Asthenia`)?\n4. Should \"opioid overdose suspected\" be inferred from anything recordable, such as a known opioid\n   user, an opioid exposure or pinpoint pupils?\n5. Is `Dribbling from mouth` (drooling) the right concept for \"excessive drooling\", or should\n   `Excessive salivation` (hypersalivation) be used, or both?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent poisoning/overdose conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Poisoning\" \"disorder\"))", "element_keys": ["p27-27a96e18"], "quote": "suspected poisoning/overdose"}, {"claim_id": "c002", "rule": "Check for urgent poisoning/overdose conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Suicide attempt\" \"event\"))", "element_keys": ["p27-6cac9bb1"], "quote": "Attempted self-harm/suicide"}, {"claim_id": "c003", "rule": "Check for urgent poisoning/overdose conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Intentionally harming self\" \"event\"))", "element_keys": ["p27-6cac9bb1"], "quote": "Attempted self-harm/suicide"}, {"claim_id": "c004", "rule": "Check for urgent poisoning/overdose conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased level of consciousness\" \"finding\"))", "element_keys": ["p27-d51fb97a"], "quote": "Decreased level of consciousness"}, {"claim_id": "c005", "rule": "Check for urgent poisoning/overdose conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Seizure\" \"finding\"))", "element_keys": ["p27-2483ce63"], "quote": "Having/just had a seizure"}, {"claim_id": "c006", "rule": "Check for urgent poisoning/overdose conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Post-ictal state\" \"finding\"))", "element_keys": ["p27-2483ce63"], "quote": "Having/just had a seizure"}, {"claim_id": "c007", "rule": "Check for urgent poisoning/overdose conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Dilated pupil\" \"finding\"))", "element_keys": ["p27-54ae997c"], "quote": "Pupils dilated or pinpoint"}, {"claim_id": "c008", "rule": "Check for urgent poisoning/overdose conditions" ning/overdose' and there is no overdose concept, so overdose without a Poisoning record will not fire.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "medium", "ref": "Diagnose probable organophosphate poisoning", "text": "Excessive secretions omitted; 'BP < 90/60' split into independent systolic OR diastolic criteria; vomiting uses generic Finding of vomiting (fine).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "medium", "ref": "Check for urgent poisoning/overdose conditions", "text": "Task due_to Poisoning and priority rule also requires Poisoning; consistent. No rules for opioid overdose, carbon monoxide or paracetamol conclusions; footnote shock-likely criteria not encoded.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "high", "ref": "Diagnose probable organophosphate poisoning", "text": "Single-sign 'or' under Poisoning makes any poisoning with vomiting, diarrhoea, sweating, bradycardia or low diastolic BP a probable organophosphate poisoning; the page describes a cholinergic cluster. Excessive secretions omitted.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "medium", "ref": "Urgent: poisoning/overdose with danger signs", "text": "'Shock¹' relies on a directly recorded Shock disorder; footnote 1's shock-likely criteria (SBP<80, pulse>=100, RR>30, confusion/restlessness, weakness) are not encoded as a probable Shock rule feeding (active_condition Shock), as the house standard asks.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "medium", "ref": "(page flowchart)", "text": "Non-urgent flowchart branch 'Toxic dose -> Refer urgently' not encoded; arguably not representable.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "medium", "ref": "Check for urgent poisoning/overdose conditions", "text": "Agitation coded as Feeling agitated (emotional state) rather than Psychomotor agitation; general weakness coded as Muscle weakness.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "medium", "ref": "Diagnose probable organophosphate poisoning", "text": "The page lists a cholinergic cluster ('pinpoint pupils, excessive drooling/sweating, excessive secretions, vomiting/diarrhoea, pulse < 60, BP < 90/60 ... organophosphate poisoning likely') as a constellation; the rule makes it a flat 'or', so any poisoning with vomiting alone, diarrhoea alone, or a diastolic BP < 60 alone becomes a PROBABLE organophosphate poisoning. 'probable' for 'likely' is right, but the and/or structure is looser than the page. Also 'excessive secretions' is dropped from the list. Suggested fix: require at least two of the listed features (any2, grouping drooling/sweating and vomiting/diarrhoea so each counts once), or anchor on pinpoint pupils/drooling plus one other.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "medium", "ref": "Diagnose probable organophosphate poisoning", "text": "OR over all signs: poisoning plus one non-specific finding (vomiting, diarrhoea, BP<90 or diastolic<60) yields 'probable'. Page says OP likely for the cluster; 'excessive secretions' is missing.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "high", "ref": "Diagnose probable organophosphate poisoning", "text": "The page says 'likely', so 'probable' is right, but the evidence is a flat 'or': any single sign (vomiting, sweating, pulse < 60, BP < 90/60) in any poisoned patient gives probable organophosphate poisoning. The page describes a cholinergic syndrome, a combination of signs. Use any2, or require pinpoint pupils or secretions. The page's 'excessive secretions' is missing; (snomed_concept \"Bronchorrhea\" \"finding\") or excessive salivation could encode it.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "rule", "priority": "medium", "ref": "(missing) possible opioid overdose / probable shock", "text": "The page says 'opioid overdose suspected' (shallow breathing or RR < 12), which should become a 'possible' opioid overdose rule, and footnote 1 says 'shock likely' (SBP < 80, pulse ≥ 100, RR > 30, confusion/restlessness, weakness). Neither is encoded.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "build_disagreement", "priority": "low", "ref": "check_for + priority_condition", "text": "A: (finding … \"Post-ictal state\" \"finding\")  vs  B: (absent)", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Post-ictal state\" \"finding\"))", "reason": "The page says \"Having/just had a seizure\"; Post-ictal state expresses the \"just had\" half alongside Seizure, which both builds have.", "unsettled": false}]}, {"page": 27, "slug": "27-poisoning-overdose", "kind": "build_disagreement", "priority": "low", "ref": "check_for + priority_condition", "text": "A: (finding … \"Clouded consciousness\" \"finding\")  vs  B: (absent)", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Clouded consciousness\" \"finding\"))", "reason": "The page word is \"Confused\" and Clouded consciousness carries the SNOMED synonym \"Confused\"; it is kept alongside Acute confusion (in both builds) so either recording fires." <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};

const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>

    <span><button id="exp">export decisions</button>${helpButton("export")}</span>

  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
