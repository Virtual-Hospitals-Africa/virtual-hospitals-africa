: "Avoid treating BP ≥ 140/90 as this may worsen stroke. If BP ≥ 220/120, discuss with specialist about need for pre-referral treatment.", "bbox": [51.2, 176.1, 555.3, 186.9], "key": "p152-69125f15"}, {"id": "p152-rb1-e06", "page": 152, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with a new stroke/TIA:", "section_y": 135.8, "indent": 1, "parent": null, "text": "Decide where to refer the patient depending on when symptoms started:", "bbox": [51.2, 186.1, 336.7, 196.9], "key": "p152-6a448a3b"}, {"id": "p152-rb1-e07", "page": 152, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with a new stroke/TIA:", "section_y": 135.8, "indent": 2, "parent": "p152-rb1-e06", "text": "If patient can reach hospital within 3 hours of onset of symptoms, refer urgently for thrombolysis to specialist stroke unit (if available).", "bbox": [56.9, 196.1, 568.0, 206.9], "key": "p152-e340c884"}, {"id": "p152-rb1-e08", "page": 152, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with a new stroke/TIA:", "section_y": 135.8, "indent": 2, "parent": "p152-rb1-e06", "text": "If patient cannot reach hospital within 3 hours of symptoms onset, refer same day and give single dose aspirin 300mg if fully conscious and can swallow (avoid if on long-term anticoagulant or headache/neck stiffness).", "bbox": [56.9, 206.1, 789.6, 226.9], "key": "p152-c506fb23"}, {"id": "p152-out-e01", "page": 152, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Sudden onset of one or more of the following suggests a stroke (or a transient ischaemic attack (TIA) if symptoms lasted < 24 hours and resolved completely): • Weakness or numbness of face/arm/leg, especially on one side of the body • Blurred or decreased vision in one/both eyes or double vision • Difficulty speaking or understanding • Difficulty walking, dizziness, loss of balance or co-ordination ime since onset,\n  aspirin), so there is no \"and any of\" list. A new stroke/TIA is any one of the 15 sudden-onset\n  symptoms, a recorded stroke (the `Focal neurology` warning-sign form, `Cerebrovascular\n  accident`), or a `New` TIA. The warning sign itself already carries `Very urgent`; this rule does\n  not lower it.\n- **Trigger.** `Check for new stroke/TIA` fires on any of the symptoms recorded without an onset\n  qualifier, or on the recorded stroke warning sign, and asks whether each symptom started\n  suddenly and whether there is a new TIA. Of the symptoms, only Dizziness is a recorded common\n  symptom; the others fire only if another page or the intake records them. The possible-stroke\n  diagnosis is not used as a trigger: it only fires from findings this task records.\n- **Symptom mapping.** \"Weakness or numbness of face/arm/leg\" → six concepts (weakness and\n  numbness × face, upper limb, lower limb). \"Blurred or decreased vision … or double vision\" →\n  Blurring of visual image, Reduced visual acuity, Diplopia. \"Difficulty speaking or\n  understanding\" → Difficulty talking, Difficulty understanding verbal language. \"Difficulty\n  walking, dizziness, loss of balance or co-ordination\" → Difficulty walking, Dizziness, Impairment\n  of balance, Decreased coordination.\n- **\"Especially on one side of the body\"** is emphasis, not a criterion; laterality is not encoded.\n- **No `measure` task:** SpO₂, RR, glucose and BP are routine vitals.\n- **Lower half of the page not modelled.** Assess / advise / treat the patient with previous\n  stroke/TIA is routine care, education and medicines, as on gold page 20.\n- **Shock and BP < 90/60** do not appear on this page.\n\n## Could not model\n\n- **TIA vs stroke.** \"TIA if symptoms lasted < 24 hours and resolved completely\" needs how long\n  the symptoms lasted and whether they resolved; `onset` gives only when a symptom started. No\n  separate TIA diagnosis is written. The possible-stroke rule also fires for TIAs (fires more often\n  for stroke than the page intends; never less often for urgency). A TIA is caught directly only\n  if the health worker records a `New` TIA.\n- **\"Within 3 hours of onset of symptoms\"** only decides the referral route (management); not encoded.\n- **Red-box thresholds** (SpO₂ < 94% or RR ≥ 30; glucose < 3, or < 4 with diabetes; BP ≥ 140/90\n  and ≥ 220/120) only control management steps, so none are encoded as criteria.\n- **Cholesterol > 7.5 / triglycerides > 10** (routine-care table) lead only to TSH and referral; not encoded.\n\n## SNOMED gaps\n\n- \"Weakness of arm\", \"Weakness of leg\", \"Facial weakness\": no FSN → `Muscle weakness of upper\n  limb`, `Weakness of muscle of lower limb`, `Weakness of face muscles`.\n- \"Numbness of arm\": no FSN → `Numbness of upper limb`.\n- \"Blurred vision\" is only a synonym → `Blurring of visual image`.\n- \"Decreased vision\": no FSN → `Reduced visual acuity` (alternative: `Sight deteriorating`).\n- \"Difficulty speaking\": no FSN → `Difficulty talking`.\n- \"Difficulty understanding\": no FSN → `Difficulty understanding verbal language` (alternative:\n  `Difficulty comprehending speech`; the two are siblings, neither is-a the other).\n- \"Loss of balance\": no FSN → `Impairment of balance`, the parent of `Poor balance` and `Unable to\n  balance` (which has \"loss of balance\" as a synonym).\n- \"Loss of co-ordination\": → `Decreased coordination`, the term already in the vocabulary\n  (`Incoordination` also exists; siblings).\n- \"Hemiparesis\" exists only as a disorder; not used.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should \"suggests a stroke\" be `probable` rather than `possible`?\n- Should the red box be `Very urgent` (matching the Focal neurology warning sign) rather than the page's \"urgent\"?\n- Is any single sudden-onset symptom on its own (e.g. sudden dizziness) enough to make the patient\n  Urgent, as the page reads? Sudden dizziness alone may over-trigger.\n- Should \"difficulty speaking\" also cover `Dysarthria` / `Aphasia` explicitly? (Neither is a\n  descendant of `Difficulty talking`, so neither matches the current rule.)\n- Is `Decreased coordination` the right reading of \"loss of … co-ordination\", or should\n  `Incoordination` or `Ataxia` be used?\n- Should \"decreased vision\" be `Reduced visual acuity` or `Sight deteriorating`?\n- Should the routine-care table (fasting cholesterol and triglycerides at diagnosis, ECG, HIV)\n  become `measure` tasks in a later pass?\n", "claims": [{"claim_id": "c001", "rule": "Check for new stroke/TIA", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of face muscles\" \"finding\"))", "element_keys": ["p152-b3ce8fa8", "p152-272f6a19"], "quote": "Weakness or numbness of face"}, {"claim_id": "c002", "rule": "Check for new stroke/TIA", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Muscle weakness of upper limb\" \"finding\"))", "element_keys": ["p152-b3ce8fa8", "p152-272f6a19"], "quote": "Weakness or numbness of face/arm"}, {"claim_id": "c003", "rule": "Check for new stroke/TIA", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of muscle of lower limb\" \"finding\"))", "element_keys": ["p152-b3ce8fa8", "p152-272f6a19"], "quote": "Weakness or numbness of face/arm/leg"}, {"claim_id": "c004", "rule": "Check for new stroke/TIA", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of face\" \"finding\"))", "element_keys": ["p152-b3ce8fa8", "p152-272f6a19"], "quote": "numbness of face"}, {"claim_id": "c005", "rule": "Check for new stroke/TIA", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of upper limb\" \"finding\"))", "element_keys": ["p152-b3ce <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}

    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;

    const head = flat(n[0]);

const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
