"id": "p28-rb1-e19", "page": 28, "box": 1, "kind_hint": "header", "section": "Manage anaphylaxis and refer urgently:", "section_y": 252.8, "indent": 0, "parent": null, "text": "Manage anaphylaxis and refer urgently:", "bbox": [51.0, 252.8, 205.2, 263.8], "key": "p28-07081abb"}, {"id": "p28-rb1-e20", "page": 28, "box": 1, "kind_hint": "management", "section": "Manage anaphylaxis and refer urgently:", "section_y": 252.8, "indent": 1, "parent": null, "text": "Give immediately adrenaline2 0.5mL (1:1000 solution) IM into mid outer thigh. Repeat every 5 minutes if needed. If patient has a prescribed auto-injector (like EpiPen®) available, use instead.", "bbox": [51.0, 263.0, 783.0, 273.8], "key": "p28-c695b35d"}, {"id": "p28-rb1-e21", "page": 28, "box": 1, "kind_hint": "management", "section": "Manage anaphylaxis and refer urgently:", "section_y": 252.8, "indent": 1, "parent": null, "text": "Raise legs and give face mask oxygen at 8-10L/min up to 15L/min (100%) if needed.", "bbox": [51.0, 273.0, 374.7, 283.8], "key": "p28-8796ba9d"}, {"id": "p28-rb1-e22", "page": 28, "box": 1, "kind_hint": "management", "section": "Manage anaphylaxis and refer urgently:", "section_y": 252.8, "indent": 1, "parent": null, "text": "Give sodium chloride 0.9% 1-2 L IV rapidly if BP still < 90/60 after adrenaline. Repeat until systolic BP > 90 then continue 1L 6 hourly. Stop if breathing worsens.", "bbox": [51.0, 283.0, 667.0, 293.8], "key": "p28-366ea3c4"}, {"id": "p28-rb1-e23", "page": 28, "box": 1, "kind_hint": "management", "section": "Manage anaphylaxis and refer urgently:", "section_y": 252.8, "indent": 1, "parent": null, "text": "If persistent wheeze or difficulty breathing despite adrenaline2, also give 1mL salbutamol 0.5% solution and 2mL ipratropium bromide solution with 1mL sodium chloride 0.9% via nebuliser every 20 minutes for 3 doses. If needed, assess and manage airway 16.", "bbox": [51.0, 293.0, 758.7, 313.8], "key": "p28-d1dbc24e"}, {"id": "p28-rb1-e24", "page": 28, "box": 1, "kind_hint": "management", "section": "Manage anaphylaxis and refer urgently:", "section_y": 252.8, "indent": 1, "parent": null, "text": "Give hydrocortisone 200mg IM/slow IV immediately and promethazine 50mg IM/slow IV.", "bbox": [51.0, 313.0, 407.6, 323.8], "key": "p28-9d41a893"}, {"id": "p28-out-e01", "page": 28, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Advise the patient with previous anaphylaxis • Advise to avoid identified trigger/s and if trigger is a medication, to always inform health worker. • Ensure patient has a plan in case of anaphylaxis: ambulance telephone number, nearest hospital and reliable transport plan. • If adrenaline2 auto-injector device (like EpiPen®) prescribed, ensure patient knows when and how to use it: - If exposed to trigger, use immediately if any of: itch/rash, face/tongue swelling, itchy/tight throat, cough, wheeze, difficulty breathing, dizziness/collapse, abdominal pain or vomiting. After use,", "bbox": [51.0, 452.1, 763.9, 503.1], "key": "p28-4473d3b8"}, {"id": "p28-out-e02", "page": 28, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "immediately phone for ambulance. - Advise to read instructions found in packaging. • Arrange a MedicAlert® bracelet 200 and advise patient to always wear it.", "bbox": [51.0, 502.9, 331.1, 533.1], "key": "p28-8c4447a0"}, {"id": "p28-out-e03", "page": 28, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess the patient with previous anaphylaxis", "bbox": [332.3, 341.9, 509.6, 352.9], "key": "p28-c79f4dbd"}, {"id": "p28-out-e04", "page": 28, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess When to assess Note", "bbox": [39.7, 357.7, 246.9, 368.7], "key": "p28-4cfd0a37"}, {"id": "p28-out-e05", "page": 28, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Trigger At first visit Ensure a specialist has reviewed the patient with anaphylaxis to confirm trigger/s. Common triggers include medications, food1 and insect bites/stings.", "bbox": [39.7, 373.2, 740.7, 383.4], "key": "p28-a21b787b"}, {"id": "p28-out-e06", "page": 28, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Other allergy At first visit • If recurrent cough, wheeze, tight chest or difficulty breathing, exclude asthma 138. If known asthma, give routine asthma care 140. • If patches of dry, scaly, itchy skin on wrists, ankles, inside elbows or behind knees, eczema likely 84. • If itchy, red, raised wheals that appear suddenly and usually disappear within 24 hours, urticaria likely 84. • If recurrent sneezing or itchy/runny/blocked nose most days for > 4 weeks, allergic rhinitis likely 51. • If both eyes watery and itchy, allergic conjunctivitis likely 48.", "bbox": [39.7, 387.3, 698.7, 438.3], "key": "p28-f6e39748"}, {"id": "p28-out-e07", "page": 28, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Common foods causing anaphylaxis include peanuts, tree nuts, egg, milk and fish. 2Adrenaline is also known as epinephrine.", "bbox": [34.0, 543.3, 416.3, 551.8], "key": "p28-3d242b5e"}, {"id": "p28-out-e08", "page": 28, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "ANAPHYLAXIS", "bbox": [361.3, 48.7, 480.7, 71.0], "key": "p28-4be1e91a"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 329.0]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAH6CAIAAAAyRAwUAAAACXBIWXMAABcSAAAXEgFnn9JSAAIWTklEQVR4nOx9h3dVxff99w/5rfWRB4QaaqiRFppBQQQUpAkCglSRIqIovYiNIkVpAiIoJUivodfQQq+BAEJoSuiIvN/mHTIOt8y96Qlv77VXVt59986dcmbmnP3mzv2/m/+vEEmSJEmSJEmSJEmSJEnmL/5frueAJEmSJEmSJEmSJEmSJNNLqlokSZIkSZIkSZIkSZJk/uMLqtaDH0c/mP0tSZIkSZIkSZIkSZIkSeZB3  \"substance\")))\n    (and (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Peanut\" \"substance\"))\n         (allergy (snomed_concept \"Peanut\" \"substance\")))\n    (and (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Tree nut\" \"substance\"))\n         (allergy (snomed_concept \"Tree nut\" \"substance\")))\n    (and (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))\n         (allergy (snomed_concept \"Drug or medicament\" \"substance\")))\n    (and (or (clinical_finding (snomed_concept \"Insect bite - wound\" \"disorder\"))\n             (clinical_finding (snomed_concept \"Insect sting\" \"disorder\")))\n         (allergy (snomed_concept \"Insect venom\" \"substance\")))\n    ;; Q1 = No, Q2 = Yes, Q3 = Yes: exposed, and sudden onset of >= 2 of the four groups\n    (and\n      (or (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Fish\" \"substance\"))\n          (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Milk\" \"substance\"))\n          (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Eggs (edible)\" \"substance\"))\n          (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Peanut\" \"substance\"))\n          (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Tree nut\" \"substance\"))\n          (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))\n          (clinical_finding (snomed_concept \"Insect bite - wound\" \"disorder\"))\n          (clinical_finding (snomed_concept \"Insect sting\" \"disorder\"))\n      )\n      (any2\n        (or (clinical_finding (snomed_concept \"Itching\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n            (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n            (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n            (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Tongue structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        )\n        (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n        (or (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n            (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)\n            (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n            (clinical_finding (snomed_concept \"Collapse\" \"finding\"))\n        )\n        (or (clinical_finding (snomed_concept \"Abdominal pain\" \"finding\"))\n            (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n        )\n      )\n    )\n    ;; Q2 = No, Q4 = Yes: sudden onset skin sign and any of difficulty breathing, BP < 90/60, dizziness/collapse\n    (and\n      (or (clinical_finding (snomed_concept \"Itching\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n          (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n          (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n          (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Tongue structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      )\n      (or (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n          (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n          (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)\n          (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n          (clinical_finding (snomed_concept \"Collapse\" \"finding\"))\n      )\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible anaphylaxis\"\n  (diagnosis\n    (snomed_concept \"Anaphylaxis\" \"disorder\")\n    possible\n  )\n  adult\n  (or (clinical_finding (snomed_concept \"Itching\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Tongue structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (any2\n        (or (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n            (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)\n        )\n        (clinical_finding (snomed_concept \"Insect bite - wound\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Insect sting\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Itching\" \"fin ge (not a flowchart, but it has \"likely\" logic), for the patient with\nprevious anaphylaxis, at first visit, row \"Other allergy\":\n\n```mermaid\nflowchart TD\n    P[\"Patient with previous anaphylaxis (first visit)\"] --> A1[\"Recurrent cough, wheeze, tight chest or difficulty breathing → exclude asthma 138\"]\n    P --> A2[\"Patches of dry, scaly, itchy skin on wrists, ankles, inside elbows or behind knees → eczema likely 84\"]\n    P --> A3[\"Itchy, red, raised wheals that appear suddenly (usually gone within 24 h) → urticaria likely 84\"]\n    P --> A4[\"Recurrent sneezing or itchy/runny/blocked nose most days for &gt; 4 weeks → allergic rhinitis likely 51\"]\n    P --> A5[\"Both eyes watery and itchy → allergic conjunctivitis likely 48\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Header: possible anaphylaxis (what makes us ask the questions) | Any sudden-onset skin sign alone, or `any2` of insect bite/sting, itch, rash, face/tongue swelling, difficulty breathing, dizziness, collapse, low BP (gold-standard pre-screen) | `Diagnose possible anaphylaxis` → triggers `Check for anaphylaxis` |\n| Q1 = Yes | Exposure to a substance **and** a recorded allergy to the same substance (fish, milk, egg, peanut, tree nut, drug), or insect bite/sting **and** allergy to insect venom | `Diagnose probable anaphylaxis`, first seven `or` branches |\n| Q1 = No → Q2 = Yes → Q3 = Yes | Any exposure (food, drug, insect bite/sting) **and** `any2` of the four symptom groups; sudden-onset qualifier on the skin group | `Diagnose probable anaphylaxis`, `(and (or exposures) (any2 …))` branch |\n| Q2 = No → Q4 = Yes | Sudden-onset skin group **and** any of difficulty breathing, BP < 90/60, dizziness, collapse (no abdominal pain/vomiting, as the page says) | `Diagnose probable anaphylaxis`, last `and` branch |\n| Q3 = No / Q4 = No | Anaphylaxis unlikely: no rule fires | (none; routing) |\n| Treat as anaphylaxis | `(active_condition Anaphylaxis)` → Urgent | `Urgent: anaphylaxis` |\n| Manage anaphylaxis and refer urgently | Management (adrenaline, oxygen, fluids, nebuliser, hydrocortisone, promethazine) | not encoded (no `manage` tasks in this pass) |\n| A1 exclude asthma | Previous anaphylaxis **and** any recurrent cough / wheeze / tight chest / difficulty breathing | `Diagnose possible asthma in previous anaphylaxis` |\n| A2 eczema likely | Previous anaphylaxis **and** scaly skin at wrist/ankle/cubital fossa/popliteal fossa **and** dry skin **and** itchy skin | `Diagnose probable eczema in previous anaphylaxis` |\n| A3 urticaria likely | Previous anaphylaxis **and** sudden-onset wheal **and** itchy skin | `Diagnose probable urticaria in previous anaphylaxis` |\n| A4 allergic rhinitis likely | Previous anaphylaxis **and** any of recurrent sneezing / itchy nose / nasal discharge / nasal congestion with onset > 4 weeks ago | `Diagnose probable allergic rhinitis in previous anaphylaxis` |\n| A5 allergic conjunctivitis likely | Previous anaphylaxis **and** watery eye **and** itching of both eyes | `Diagnose probable allergic conjunctivitis in previous anaphylaxis` |\n| Findings for A1–A5 | Checked for when history of anaphylaxis is recorded | `Assess the patient with previous anaphylaxis for other allergy` |\n\n## Notes\n\n- \"In the few hours before symptoms started\" is not modelled as a time comparison; exposures\n  recorded in the current encounter are taken as recent (as in the gold standard).\n- BP < 90/60 is read as systolic < 90 **or** diastolic < 60.\n- \"Generalised\" (itch/rash) is not added as a qualifier, following the gold standard.\n", "questions": "# Page 28 – Anaphylaxis (APC 2026): remaining questions\n\n## Decisions made\n\n- **Red box follows the gold standard (2023 page 20).** The 2026 red-box algorithm has the same\n  questions and branches. Q1 = Yes is exposure to substance X **and** an allergy to X (fish, milk,\n  egg, peanut, tree nut, drug), or insect bite/sting **and** an insect venom allergy. Q2 = Yes → Q3\n  is any exposure **and** `any2` of the four symptom groups. Q2 = No → Q4 is a sudden-onset skin\n  sign **and** any of difficulty breathing, BP < 90/60, dizziness/collapse. Abdominal pain and vomiting\n  are left out of Q4 because the page leaves them out.\n- **BP < 90/60** is read as systolic < 90 **or** diastolic < 60 (Will's convention). The page has no\n  \"Shock/SBP < 80\" wording.\n- **Priority.** `Urgent: anaphylaxis` fires on `(active_condition Anaphylaxis)`, which means the\n  flowchart has reached \"Treat as anaphylaxis\". The header says \"Give urgent attention to the\n  patient with *possible* anaphylaxis\". The `possible` pre-screen is used only to trigger\n  `Check for anaphylaxis`, as in the gold standard. See the questions for a clinician.\n- **Pre-screen** (`Diagnose possible anaphylaxis`) is copied from the gold standard.\n- **Lower half of the page.** The \"Other allergy\" row of \"Assess the patient with previous\n  anaphylaxis\" has \"X likely\" and \"exclude X\" logic, so (per the builder brief's scope) it is\n  encoded. A check task is triggered by `History of anaphylaxis` (situation). It feeds one\n  `possible` rule (asthma, from \"exclude asthma\") and four `probable` rules (eczema, urticaria,\n  allergic rhinitis and allergic conjunctivitis). Each rule also requires `History of anaphylaxis`,\n  because the row applies to the patient with previous anaphylaxis at first visit. The gold\n  standard left the 2023 lower half unencoded.\n- \"Recurrent\" in the asthma bullet is applied to all four items: cough, wheeze, tight chest and\n  difficulty breathing.\n- \"> 4 weeks\" (allergic rhinitis) is `(>= (onset X) (time_ago 4 weeks))`. The build wrote `>`; a script\n  changed it to `>=` after the checkers read it (2026-11-04; this note added 2026-11-05), because VHA's database accepts only\n  `>=` and `<=`. So exactly 4 weeks now counts.\n- Rule descriptions are named for this page's topic; the lower-half rules carry \"in previous anaphylaxis\".\n- **Reconciled build.** This final build is Builder A's. Builder B agreed on every red-box condition\n  but left the \"Other allergy\" row unencoded, as cross-references to pages 138, 84, 51 and 48. A's\n  encoding is kept because the brief's scope makes each \"X likely\" a probable rule. See `reconcile.json`.\n\n## Could not model\n\n- \"In the few hours before symptoms started\": exposures recorded in the current encounter count\n  as recent. The rule fires more often than the page intends if an old exposure is on record.\n- \"Generalised\" itch/rash: there is no generalised qualifier, as in the gold standard. Itch or rash\n  anywhere counts, so the rule fires more often.\n- \"Sudden onset\" governs all four groups in Q3 (\"sudden onset of ≥ 2 of\"). As in the gold standard,\n  it is encoded only on the skin group, so difficulty breathing, BP, dizziness/collapse and\n  abdominal pain/vomiting carry no onset qualifier. The rule fires somewhat more often than the page intends.\n- Urticaria: \"usually disappear within 24 hours\" is descriptive and is not encoded. \"Red\" and\n  \"raised\" are taken as inherent to a wheal.\n- Allergic rhinitis: \"most days\" is not representable. The rule fires more often.\n- Eczema: \"patches\" is not encoded. Scaly skin is site-specific, but dry skin and itchy skin are\n  recorded without a site, so the rule may fire more often.\n- Management (\"Manage anaphylaxis and refer urgently\", the advice section and the specialist\n  review of trigger/s) is not encoded, because there are no `manage` tasks in this pass.\n\n## SNOMED gaps\n\n- \"Dry skin\" (finding): not found. `Xeroderma` (disorder) is used instead.\n- \"Itching of nose\" (finding): not found. `Itching` (finding) is used with finding_site\n  `Nasal structure`.\n- \"Blocked nose\" / \"Nasal obstruction\" (finding): not found. `Nasal congestion` (finding) is used\n  instead.\n- Bilateral watery eye: not found, and there is no \"Bilateral\" qualifier value. `Watery eye` is\n  used unqualified, with `Itching of bilateral eyes` for \"both eyes … itchy\".\n- \"Antecubital fossa structure\": not found. `Structure of cubital fossa` is used for \"inside elbows\".\n- \"Generalised\" (British spelling) does not exist. `Generalized` (qualifier value), `Generalized\n  pruritus` (finding) and `Generalized rash` (disorder) do exist, but are not used (see Could not model).\n- \"Chest tightness\": not found. `Tight chest` (finding) is used instead.\n\n## Checker issues left in place\n\nAll four are CHECKED FOR BUT NEVER USED AS EVIDENCE. These findings are used only inside\n`(>= (onset …) (time_ago 4 weeks))` (originally `>`) in `Diagnose probable allergic rhinitis in previous\nanaphylaxis`, and the checker does not count findings inside an onset comparison. (Note 2026-11-05: since the\n2026-11-04 shakedown fixes the gate counts onset subjects, so these four no longer match any gate finding;\nWill's PR #1310 test still flags Sneezing.)\n\n- `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Sneezing\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))`\n- `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Itching\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Nasal structure\" \"body structure\")))`\n- `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Nasal discharge\" \"finding\"))`\n- `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Nasal congestion\" \"finding\"))`\n\n## Questions for a clinician\n\n1. Should urgency be given to *possible* anaphylaxis, as the header literally says, rather than only\n   once the questions conclude \"Treat as anaphylaxis\"?\n2. Should the eczema, urticaria, rhinitis, conjunctivitis and asthma rules apply only to patients\n   with previous anaphylaxis, as encoded, or to any patient?\n3. In \"recurrent cough, wheeze, tight chest or difficulty breathing\", does \"recurrent\" qualify every\n   item?\n4. Is recording an allergy to substance X a fair stand-in for \"has caused anaphylaxis before\"? An\n   allergy without previous anaphylaxis would also make Q1 = Yes.\n5. Should \"generalised\" be enforced with `Generalized pruritus` / `Generalized rash`? That would make\n   the rule miss records entered as plain itch or rash.\n6. Should a specific recorded drug allergy (e.g. penicillin), together with exposure to that drug,\n   satisfy Q1? The `Drug or medicament` pair matches only if both are recorded under that hierarchy.\n7. Should the \"Other allergy\" bullets (eczema, urticaria, rhinitis, conjunctivitis, asthma) have rules\n   on this page, as encoded here, or stay only with the pages they point to? (The two builders differed on this.)\n8. \"Exclude asthma\" is encoded as a *possible* asthma diagnosis. Is that the right reading of \"exclude\"?\n   (unsettled)\n9. In \"recurrent sneezing or itchy/runny/blocked nose most days for > 4 weeks\", does \"> 4 weeks\"\n   also qualify recurrent sneezing, as encoded, or only the nose symptoms? (unsettled)\n", "claims": [{"claim_id": "c001", "rule": "Check for anaphylaxis", "role": "trigger", "expr": "(diagnosis (snomed_concept \"Anaphylaxis\" \"disorder\") possible)", "element_keys": ["p28-8fd7fcd8"], "quote": "possible anaphylaxis"}, {"claim_id": "c002", "rule": "Check for anaphylaxis", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Itching\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "element_keys": ["p28-44b146d8"], "quote": "Generalised itch/rash"}, {"claim_id": "c003", "rule": "Check for anaphylaxis", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Eruption\" \"morphologic abnormality\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "element_keys": ["p28-44b1 em": "A broad pre-screen in the house pattern. Gap: it omits abdominal pain/vomiting and medication/food exposure, so for example a food exposure with difficulty breathing plus vomiting (Q2 yes on the page) does not trigger the check task.", "severity": "low"}, {"rule": "Diagnose possible asthma in previous anaphylaxis", "verdict": "ok", "problem": "'exclude asthma' maps to possible, per the house standard.", "severity": "low"}, {"rule": "Diagnose probable eczema in previous anaphylaxis", "verdict": "ok", "problem": "AND of dry, scaly (at the flexural/wrist/ankle sites) and itchy follows the page.", "severity": "low"}, {"rule": "Diagnose probable urticaria in previous anaphylaxis", "verdict": "ok", "problem": "Drops 'usually disappear within 24 hours'.", "severity": "low"}, {"rule": "Diagnose probable allergic rhinitis in previous anaphylaxis", "verdict": "ok", "problem": "The onset > 4 weeks direction is correct per the house convention; 'most days' is dropped.", "severity": "low"}, {"rule": "Diagnose probable allergic conjunctivitis in previous anaphylaxis", "verdict": "problem", "problem": "'both eyes watery' is encoded as an unlateralised Watery eye; the itch is correctly bilateral.", "severity": "low"}, {"rule": "Urgent: anaphylaxis", "verdict": "ok", "problem": "Urgent is justified by 'Give urgent attention to the patient with possible anaphylaxis'; no explicit escalation on the page.", "severity": "low"}], "summary": "Most consequential: the probable-anaphylaxis Q1 branches (allergy + exposure) need no symptoms and no 'few hours before' window, so any recorded allergen exposure in a patient with that allergy yields probable anaphylaxis and Urgent; allergy is also broader than 'has caused anaphylaxis before'. Food exposure is narrowed to the footnote's five examples ('include'), and 'generalised' is dropped from itch/rash throughout. The previous-anaphylaxis table rules are largely faithful, with minor losses (bilateral watery eyes, transient wheals, 'most days')."}], "scorecard": {"page": 28, "slug": "28-anaphylaxis", "validation_ok": true, "builder_agreement": 0.789, "elements": 32, "elements_agreed": 24, "claims": 132, "claims_agreed": 55, "queue": 157, "queue_by_priority": {"medium": 79, "low": 62, "high": 16}, "missing_reports": [], "element_rows": [{"key": "p28-8fd7fcd8", "id": "p28-rb1-e01", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p28-b949a38d", "id": "p28-rb1-e02", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"partial": 2, "correct": 1}}, {"key": "p28-4f99695e", "id": "p28-rb1-e03", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p28-0710cea4", "id": "p28-rb1-e04", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p28-46be17a2", "id": "p28-rb1-e05", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"partial": 2, "correct": 1}}, {"key": "p28-070ba821", "id": "p28-rb1-e06", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p28-21cb83f7", "id": "p28-rb1-e07", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p28-44b146d8", "id": "p28-rb1-e08", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"partial": 3}}, {"key": "p28-57d50a64", "id": "p28-rb1-e09", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"correct": 1, "partial": 2}}, {"key": "p28-29084cc2", "id": "p28-rb1-e10", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"correct": 2, "partial": 1}}, {"key": "p28-29d329b5", "id": "p28-rb1-e11", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p28-e3340eab", "id": "p28-rb1-e12", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p28-e23719ce", "id": "p28-rb1-e13", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts" rd's pre-screen, so this is an inherited gap rather than a builder error.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis", "text": "'Sudden onset' is applied only to the four skin findings in the Q3 any2 and the Q4 skin group; difficulty breathing, BP, dizziness, collapse, abdominal pain and vomiting are unqualified, although the page's 'sudden onset of >= 2 of' governs every group. 'In the few hours before symptoms started' is not expressed on any exposure finding. Both choices mirror the gold.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis", "text": "Q1's 'has caused anaphylaxis before' is approximated by (allergy X), which also matches a mild known allergy; SNOMED has per-substance 'Anaphylaxis caused by fish / egg / tree nut / venom' disorders that would be closer, but the gold uses the same proxy. 'Food' is limited to the five footnote foods although the footnote is illustrative.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Assess the patient with previous anaphylaxis for other allergy", "text": "The task and all five 'other allergy' rules are gated on (clinical_finding History of anaphylaxis (situation)), which nothing in this file checks for or produces; it relies on the situation being recorded during history-taking elsewhere. If it is not a recorded form, the entire second half of the page is unreachable.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable allergic rhinitis in previous anaphylaxis", "text": "Evidence is the onset form (> (onset <finding>) (time_ago 4 weeks)) while the check_for holds the bare findings. The briefing says onset works in due_to positions, but the 'probable evidence must be checked for' test matches by exact s-expression string; if the test does not unwrap onset, all four rhinitis criteria will be flagged as not checked for. Worth confirming with the per-page checker.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable eczema in previous anaphylaxis", "text": "Requires three separately recorded findings (sited Scaly skin, Xeroderma, Itching of skin) for what the page describes as one observation; strict conjunction may under-fire, and Itching of skin is also a required part of the urticaria rule, so an itchy patient with both scaly patches and a wheal gets both diagnoses. Acceptable reading of the page, flagged for awareness.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Urgent: anaphylaxis", "text": "Priority is tied to (active_condition Anaphylaxis), so it only fires once a clinician accepts the probable diagnosis; the page's header addresses the patient with 'possible' anaphylaxis. Same pattern as the gold; no page-justified level mismatch.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis", "text": "The page gives no possible-anaphylaxis criteria; the rule is invented. Its first four branches make any single sudden itch/rash/face or tongue swelling alone enough, and the any2 list omits abdominal pain/vomiting while including insect bite/sting. Acceptable as a broad pre-screen per the briefing but not page-traceable.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis", "text": "'Generalised' itch/rash is lost in both symptom branches (left ≥2-of-4 and right and-branch), so localised itch or rash counts.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis", "text": "The 'previously caused anaphylaxis' Yes-branch relies on an allergy record to the substance (or Insect venom for stings) rather than a link to prior anaphylaxis; any recorded allergy plus exposure triggers probable anaphylaxis without symptoms. Matches page structure but is a proxy.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis", "text": "The right branch (no exposure) is not conditioned on absence of exposure; harmless superset, but the left and right branches are not distinct as on the page.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "All rules", "text": "Age band is 'adult' while the gold anaphylaxis page uses all_ages; confirm intended population.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis", "text": "The Q1-Yes disjuncts fire on exposure plus allergy alone, with no symptom and no 'few hours' window. A patient with a recorded fish allergy and any recorded fish exposure gets probable anaphylaxis and so Urgent, whether or not symptoms are present. Also, 'allergy' stands in for 'has caused anaphylaxis before', which is broader.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 28, "slug": "28-anaphylaxis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis", "text": "'Generalised' itch/rash is dropped in both Q3 and Q4. With the Q4 branch (no expo   <section class="pane"><h2><span id="rulesttl">Rules, in plain English</span> <span class="hb" data-k="rules"></span> <span style="float:right"><button id="rawbtn" style="font-size:11.5px;text-transform:none;letter-spacing:0">show structured rules</button><span class="hb" data-k="rawtoggle"></span></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="rules"></div></section>
</main>
<div class="lower">
  <div class="tabs" id="tabs"></div>
  <div class="tabbody" id="tabbody"></div>
</div>
<script src="help.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
