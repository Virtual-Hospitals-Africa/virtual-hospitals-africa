nother facility for surgical TOP. • Give single dose misoprostol 400mcg vaginally 3 hours before procedure. • For pain during MVA: - Give morphine 0.1mg/", "bbox": [573.5, 229.6, 676.2, 339.8], "key": "p176-a21116f2"}, {"id": "p176-out-e29", "page": 176, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "kg IM 30 minutes before procedure (max 10 mg).", "bbox": [584.9, 339.6, 675.8, 359.8], "key": "p176-2a105d0d"}, {"id": "p176-out-e30", "page": 176, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If ≤ 9 weeks • Give single dose mifepristone 200mg orally. • Then give single dose misoprostol 800mcg sublingual to take at home after 24-48 hours: • Explain that abdominal cramping and bleeding (with products of conception) occur 2-4 hours after taking misoprostol dose and can continue (on and off) for up to a month. • If no or minimal bleeding within 4 hours advise to return to facility:", "bbox": [95.0, 242.1, 331.8, 332.3], "key": "p176-e86c2863"}, {"id": "p176-out-e31", "page": 176, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If > 9 weeks • If MVA/resuscitation equipment not available, refer to another facility for supervised medical TOP. • If MVA/resuscitation equipment available, offer supervised medical TOP:", "bbox": [348.7, 242.1, 551.3, 292.3], "key": "p176-a2bd4b9b"}, {"id": "p176-out-e32", "page": 176, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- Give single dose mifepristone 200mg orally. - Advise to return to facility early morning within", "bbox": [354.3, 291.5, 533.6, 312.3], "key": "p176-ea4a9e0a"}, {"id": "p176-out-e33", "page": 176, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "48 hours for supervised misoprostol dose. - Give single dose misoprostol 800mcg sublingual", "bbox": [354.3, 312.1, 547.4, 332.3], "key": "p176-153e83ae"}, {"id": "p176-out-e34", "page": 176, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "and observe patient at the facility:", "bbox": [360.0, 332.1, 485.0, 342.3], "key": "p176-e786c4ce"}, {"id": "p176-out-e35", "page": 176, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If no or minimal bleeding within 4 hours, give second dose misoprostol 400mcg orally or", "bbox": [158.3, 354.0, 493.8, 364.9], "key": "p176-25b473f5"}, {"id": "p176-out-e36", "page": 176, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "vaginally. If no or minimal bleeding after 4 hours of second dose, refer for ultrasound.", "bbox": [169.7, 364.7, 482.3, 374.9], "key": "p176-8a36facd"}], "boxes": [{"box": 1, "rect": [710.3, 459.3, 807.9, 530.6]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAM0AAACWCAIAAADyl5sKAAAACXBIWXMAABcSAAAXEgFnn9JSAAAghElEQVR4nO1deVAUyZ5+G7sRG/vP7ka82P1jY/fNG+fyGO8DBVERRREBRUBFFAE5REFEEEVU8MATL7xQFBDBC1QURBBEQBERBcX7Fs/xHnVGnXnv9X70j0nT6u6iBaxqNCO+6KjOysrK48vfkZXHn57+77cCAp8af1I9BwJfAgTPBJTABzx71rq9gEDToFV7/Tx71qqd5vfzAgJNgr8/LRc8E/jkEDwTUAKCZwJKQPBMQAkIngkoAcEzASUgeCagBATPBJSA4JmAEhA8E1ACgmcCSkDwTEAJCJ7JYf+etYWHknTD18XNvnIhR/XsNSMInsnhXs2RflYWb19X8YFnTu1xcbL9x2/nVM9eM4LgWT1YsiAsfk00HwKSnavap3rGmhcEz+rBq+cnrfuYP3t0nP5mZqyJnD6ej/DLz6duX8/XfRBS8OrFHPbgFw7Bs/qRtmXJ3KhJGi117G37Pn9cRuG4CBzvPs7TJXSy91AHm73pq9kjWZnrBlhbTgv1dXO1z9i5SvUiqA7Bs/rxt7dnHQZZw1ZLiJ+blrKUAmGfjXCxqzixi/6+flHhPHRg5ckMjZaOFmad376urKvid9WqF0F1CJ4ZhSMFyRP93T3chzLS5OyPnx8dzMfJP7gZAgwXj+6XgGdgp+rZNh0InhkLaMbiwyns75zZQbGLw3MPJDBsTVqMOHR3ctDYAD+3mhsFqmfbRCB4Ziy8PJzPn3nvZvp4uS6OCUtNXsLjYNYGugutujNtuY11zxnT/N+8Oq165lWH4JmxkPBsepgvZJj8I1CdMyMCIsL9Vc+86hA8MxYSnu1IXSYZ4NAL2GpWlt1Vz7zqEDwzFhKe/f7mrK1N77yc9yINupI+Erz7pQp3KbCibJev13DVM686BM+MhYRnwJOHpf4+I4c724WFeOPCec    R --> Q1[\"Any of: adnexal mass (closed cervix and small uterus),<br/>guarding/rebound abdominal tenderness, foul-smelling discharge,<br/>temperature ≥ 38 °C, SBP &lt; 80, pulse ≥ 100, Hb &lt; 6, RR ≥ 30?\"]\n    Q1 -- Yes --> URG[\"RED BOX: Manage urgently → 182\"]\n    URG --> ECT[\"If adnexal mass: ectopic pregnancy likely. Refer urgently.\"]\n    Q1 -- No --> Q2[\"Enlarged uterus, or open cervical os with<br/>bleeding / products of conception visible?\"]\n    Q2 -- \"Yes to either\" --> INC[\"Incomplete TOP likely. Refer to next level of care.\"]\n    Q2 -- \"No to both\" --> REASS[\"Reassure, contraception 170, mental health 98\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| R (TOP within the past 14 days) | `(<= (onset (clinical_finding Induced termination of pregnancy)) (time_ago 14 days))` | trigger of `Check for complications after a termination of pregnancy`, and the first conjunct of every rule below |\n| Q1 = Yes → red box | TOP within 14 days **and** any of: adnexal mass with closed cervix and small uterus, abdominal guarding, rebound tenderness, offensive vaginal discharge, temperature ≥ 38 °C, SBP < 80, pulse ≥ 100, RR ≥ 30 (Hb < 6 not representable) | `Urgent: complications within 14 days of a termination of pregnancy` |\n| Red box: \"If adnexal mass, ectopic pregnancy likely\" | TOP within 14 days **and** adnexal mass **and** closed cervix **and** small uterus | `Diagnose probable ectopic pregnancy after a termination of pregnancy` |\n| Q1 = No → Q2 = Yes | TOP within 14 days **and** (enlarged uterus **or** (cervical os open **and** (vaginal bleeding **or** products of conception at os/in vagina))) | `Diagnose probable incomplete termination of pregnancy` |\n| Q2 = No to both | Reassurance / contraception / mental health | not modelled (management) |\n| C1, gestation and TOP-method branches | Referral, booking, regimens | not modelled (management / routing; no diagnosis on the page) |\n\n## Notes\n\n- The \"No\" on Q1 before Q2 is not modelled; see remaining questions.\n- Hb < 6 has no unit/observable in the language.\n", "questions": "# Page 176 – Manage the patient requesting a termination of pregnancy (TOP): remaining questions\n\n## Reconciliation\n\nFinal build is builder A's, merged with builder B's open questions (see reconcile.json). B read\n\"(closed cervix and small uterus)\" as descriptive; A's conjunctive reading is kept and the question\nstays open below.\n\n## Decisions made\n\n- **Scope.** Only the lower part of the page (\"Review the patient who had a TOP within the past 14\n  days\") has triage or diagnostic logic. The upper part (comorbidities → refer, gestation routing,\n  medical/surgical TOP regimens, pain relief, return advice, follow-up) is management and routing and\n  is not encoded. No `manage` or `measure` tasks: temperature, SBP, pulse and respiratory rate are\n  routine vitals.\n- **Trigger.** \"Had a TOP within the past 14 days\" is\n  `(<= (onset (clinical_finding (snomed_concept \"Induced termination of pregnancy\" \"disorder\"))) (time_ago 14 days))`,\n  using `<=` per the brief's rule for \"within N\". It is the trigger of the `check_for` task and the\n  first conjunct of every rule.\n- **Red box → Urgent.** \"Yes\" to any item of the review question → \"Manage urgently 182\" is encoded\n  as `Urgent` (the page does not escalate further).\n- **Adnexal mass criterion.** \"adnexal mass (closed cervix and small uterus)\" is encoded as adnexal\n  mass AND closed cervix AND small uterus, in the Urgent rule and in the probable ectopic pregnancy\n  rule (\"If adnexal mass, ectopic pregnancy likely\").\n- **guarding/rebound abdominal tenderness** is split into `Abdominal guarding` OR `Rebound tenderness`.\n- **SBP < 80** is encoded alone, as written (no shock finding on this page).\n- **Incomplete TOP likely.** \"enlarged uterus or open cervical os with bleeding/products of\n  conception visible\" is read as enlarged uterus OR (open os AND (bleeding OR products of conception\n  at the os OR in the vagina)).\n- The `due_to` of the probable incomplete TOP rule does not require \"No\" to the urgent question\n  (the flowchart only reaches it after \"No\"). Both can fire together; the Urgent priority still applies.\n\n## Could not model\n\n- **Hb < 6**: no haemoglobin observable/unit in the language. Dropped from the Urgent `or`, so the\n  Urgent rule fires **less often** than the page intends (a patient whose only finding is Hb < 6 is missed).\n- The \"No\" precondition of the incomplete-TOP question (see above): the probable rule fires\n  **more often** than the page intends (also when an urgent item is present).\n- The 14-day window depends on the TOP finding being recorded with the date of the TOP as its onset.\n  If onset is the date of recording, a TOP done earlier but recorded today would still match.\n- The pre-TOP comorbidity question and gestation thresholds lead only to referral/booking, not to a\n  diagnosis; nothing to encode at triage level.\n\n## SNOMED gaps\n\n- \"foul-smelling discharge\": no exact concept; used `Offensive vaginal discharge` (finding), a child\n  of `Finding of odor of vaginal discharge`.\n- \"bleeding\" at the open cervical os: `Bleeding from cervix` does not exist; used `Bleeding from vagina` (finding).\n- \"adnexal mass\": `Adnexal mass` does not exist as a name; used `Mass of uterine adnexa` (finding).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Is \"(closed cervix and small uterus)\" part of the adnexal-mass criterion (as encoded), or just a\n  description, so that an adnexal mass alone should make the patient urgent and ectopic pregnancy likely?\n- Is a recent TOP recorded in the app as a finding with an onset date? If not, none of these rules\n  fire. The complaint is not a common symptom or warning sign.\n- Should \"foul-smelling discharge\" include non-vaginal discharge (e.g. wound), or is vaginal right?\n- Does \"enlarged uterus or open cervical os with bleeding/products of conception visible\" mean\n  enlarged uterus **or** (open os with bleeding/POC), as encoded, or (enlarged uterus or open os)\n  **with** bleeding/POC visible?\n- Should \"products of conception visible\" cover POC seen in the vagina as well as at the cervical os\n  (as encoded), or only at the os?\n- Should Hb < 6 be added once a haemoglobin observable exists?\n", "claims": [{"claim_id": "c001", "rule": "Check for complications after a termination of pregnancy", "role": "trigger", "expr": "(<= (onset (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Induced termination of pregnancy\" \"disorder\"))) (time_ago 14 days))", "element_keys": ["p176-53fe09d9"], "quote": "who had a TOP within the past 14 days"}, {"claim_id": "c002", "rule": "Check for complications after a termination of pregnancy", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Mass of uterine adnexa\" \"finding\"))", "element_keys": ["p176-53fe09d9"], "quote": "adnexal mass"}, {"claim_id": "c003", "rule": "Check for complications after a termination of pregnancy", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cervical os closed\" \"finding\"))", "element_keys": ["p176-53fe09d9"], "quote": "closed cervix"}, {"claim_id": "c004", "rule": "Check for complications after a termination of pregnancy", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Small uterus\" \"finding\"))", "element_keys": ["p176-53fe09d9"], "quote": "small uterus"}, {"claim_id": "c005", "rule": "Check for complications after a termination of pregnancy", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abdominal guarding\" \"finding\"))", "element_keys": ["p176-53fe09d9"], "quote": "guarding"}, {"claim_id": "c006", "rule": "Check fo y small (hypoplastic) uterus and will rarely be recorded post-TOP, so the AND it sits in may never fire.", "fix": "Replace with (no (clinical_finding (snomed_concept \"Enlarged uterus\" \"finding\"))), which is already checked for, or drop it and keep adnexal mass + closed os.", "confidence": "medium"}]}, {"page": 176, "slug": "176-manage-the-patient-requesting-a-termination-of-pre", "kind": "rule", "priority": "high", "ref": "Diagnose probable ectopic pregnancy after a termination of pregnancy; Urgent: complications within 14 days of a termination of pregnancy", "text": "'and' where the page means a single criterion: both rules require 'Mass of uterine adnexa' AND 'Cervical os closed' AND 'Small uterus'. The red box says 'If adnexal mass, ectopic pregnancy likely'; the parenthetical in the review question describes the ectopic picture rather than adding conditions. With the triple, an adnexal mass recorded without the two descriptors yields neither the probable diagnosis nor Urgent, and because the priority rule shares the triple, adnexal mass is effectively dropped from the 'any of' list. Fix: evidence = adnexal mass alone (keep 'Cervical os closed' and 'Small uterus' in the check_for only if some rule consumes them, e.g. as optional corroboration in an (or ...), otherwise remove them so the never-used-as-evidence test passes).", "detail": [{"checker": "forward-1", "severity": "high"}]}, {"page": 176, "slug": "176-manage-the-patient-requesting-a-termination-of-pre", "kind": "rule", "priority": "medium", "ref": "Urgent: complications within 14 days of a termination of pregnancy", "text": "Pulse >= 100 is written against 'Pulse, function' (8499008, observable entity), a function concept rather than a rate. If the system records the routine pulse vital under 'Heart rate' (364075005) or another rate concept, the criterion never matches. Could not verify the house vital concept from the allowed inputs; the gold page only uses blood pressure.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 176, "slug": "176-manage-the-patient-requesting-a-termination-of-pre", "kind": "rule", "priority": "medium", "ref": "Check for complications after a termination of pregnancy (task due_to)", "text": "The 14-day anchor uses 'Induced termination of pregnancy' as a disorder (57797005) inside clinical_finding. SNOMED also has the procedure (714812005). If a TOP done here or elsewhere is recorded as the procedure rather than the disorder-category finding, none of the three rules fire. Worth a note in the provenance; not wrong by the language.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 176, "slug": "176-manage-the-patient-requesting-a-termination-of-pre", "kind": "rule", "priority": "medium", "ref": "Urgent: complications within 14 days of a termination of pregnancy", "text": "Hb < 6 is omitted; this is the expected treatment (haemoglobin has no unit in the language, so it is not_representable). Recording it here so the omission is seen as deliberate rather than a miss.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 176, "slug": "176-manage-the-patient-requesting-a-termination-of-pre", "kind": "rule", "priority": "medium", "ref": "Diagnose probable ectopic pregnancy after a termination of pregnancy", "text": "Requires all three of adnexal mass, closed os, small uterus; page concludes ectopic likely if adnexal mass.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 176, "slug": "176-manage-the-patient-requesting-a-termination-of-pre", "kind": "rule", "priority": "medium", "ref": "Urgent: complications within 14 days of a termination of pregnancy", "text": "Hb < 6 criterion missing (not representable); no compensating note.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 176, "slug": "176-manage-the-patient-requesting-a-termination-of-pre", "kind": "rule", "priority": "medium", "ref": "Diagnose probable incomplete termination of pregnancy", <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";

// The rule's own text in the page's rule file: the top-level form whose description matches,

const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }

    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
