ut-e28", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Tinea versicolor likely • Advise to wear cool clothing in hot weather to reduce perspiration. • Apply selenium sulphide 2.5% suspension. Lather on affected areas. Apply once weekly for 3 weeks: leave on overnight then wash off next day. • May take months for colour to return. Absence of scale indicates adequate treatment. • Recurrence is common. Re-treatment may be needed.", "bbox": [512.7, 313.8, 613.6, 494.8], "key": "p94-f03fdeae"}, {"id": "p94-out-e29", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Generalised", "bbox": [739.8, 159.7, 783.0, 169.9], "key": "p94-e23e3d57"}, {"id": "p94-out-e30", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Present from birth.", "bbox": [727.4, 183.0, 797.4, 193.2], "key": "p94-5b1eaeea"}, {"id": "p94-out-e31", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Involves skin, hair", "bbox": [729.5, 193.0, 795.3, 203.2], "key": "p94-be74604f"}, {"id": "p94-out-e32", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "and eyes.", "bbox": [744.4, 203.0, 778.4, 213.2], "key": "p94-595dfafd"}, {"id": "p94-out-e33", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Albinism likely • Advise to avoid sunburn:", "bbox": [720.6, 225.5, 789.2, 256.5], "key": "p94-212255cd"}, {"id": "p94-out-e34", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- Avoid sun", "bbox": [726.3, 256.3, 769.0, 266.5], "key": "p94-3e9ebce1"}, {"id": "p94-out-e35", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "exposure, especially between 10am and 3pm. - Apply zinc", "bbox": [726.3, 266.3, 804.2, 306.5], "key": "p94-9bca0f03"}, {"id": "p94-out-e36", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "oxide ointment or sunscreen daily at least 15 minutes before going into sun. Reapply 2 hourly if in the sun. - Use sun hat and", "bbox": [726.3, 305.7, 802.9, 386.5], "key": "p94-10614bb3"}, {"id": "p94-out-e37", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "sunglasses and wear long-sleeves. • Refer to dermatologist and ophthalmologist. • If any skin lesions develop, especially in sun-exposed areas, refer to exclude skin cancer.", "bbox": [720.6, 386.3, 799.3, 486.5], "key": "p94-574e5e5b"}, {"id": "p94-out-e38", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "© University of Cape Town", "bbox": [637.0, 252.8, 701.7, 260.1], "key": "p94-630e1598"}, {"id": "p94-out-e39", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Absence of colour", "bbox": [683.0, 113.0, 749.6, 123.2], "key": "p94-922901e2"}, {"id": "p94-out-e40", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Is absence of colour patchy or generalised?", "bbox": [637.3, 136.3, 795.2, 146.5], "key": "p94-d82e66fb"}, {"id": "p94-out-e41", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Trunk", "bbox": [523.1, 159.7, 543.3, 169.9], "key": "p94-53d45d2b"}, {"id": "p94-out-e42", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check Hepatitis A IgM result", "bbox": [98.2, 351.0, 201.2, 361.2], "key": "p94-0ddbb456"}, {"id": "p94-out-e43", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Send blood for ALT, ALP, total bilirubin, full blood count, INR, hepatitis A IgM, HBsAg. • Advise to return if worsens.", "bbox": [59.5, 265.0, 221.0, 295.2], "key": "p94-a1161d6b"}, {"id": "p94-out-e44", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Venous stasis likely • Encourage exercise. • Advise elevating leg when possible and to avoid prolonged standing. • Apply compression bandage from foot to knee. • Assess CVD risk 142. • Give foot care advice 81. • If ulcer 90.", "bbox": [278.3, 346.4, 367.6, 477.4], "key": "p94-342169a5"}, {"id": "p94-out-e45", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Hepatitis A IgM positive Hepatitis", "bbox": [75.6, 374.3, 256.5, 384.5], "key": "p94-7d40901f"}, {"id": "p94-out-e46", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "A IgM negative", "bbox": [222.3, 384.3, 256.1, 404.5], "key": "p94-ce6b1328"}, {"id": "p94-out-e47", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Check HBsAg", "bbox": [226.3, 417.7, 252.2, 437.9], "key": "p94-d52eec86"}, {"id": "p94-out-e48", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "result. If positive,", "bbox": [219.8, 437.7, 258.6, 457.9], "key": "p94-162a2ed7"}, {"id": "p94-out-e49", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "refer.", "bbox": [229.4, 457.7, 249.1, 467.9], "key": "p94-c0427a0c"}, {"id": "p94-out-e50", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Patient has acute hepatitis A infection • Notify4 within 7 days. • Educate that infection will resolve by itself and no specific treatment needed. Advise strict handwashing, especially before handling food and after using toilet. Avoid alcohol and paracetamol whilst ill. • Check HBsAg result. If positive, refer. • If nausea/vomiting and unable to tolerate fluids, refer.", "bbox": [39.7, 396.7, 200.3, 497.9], "key": "p94-70ba91e8"}, {"id": "p94-out-e51", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Review with results within 2 days: Refer if ALT ≥ 200, INR ≥ 1.5, ALP raised out of proportion to", "bbox": [41.1, 306.9, 260.3, 327.9], "key": "p94-45a78492"}, {"id": "p94-out-e52", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "ALT, Hb < 12 (woman), Hb < 13 (man) or plts < 150.", "bbox": [56.1, 327.7, 245.3, 337.9], "key": "p94-fcc7edff"}, {"id": "p94-out-e53", "page": 94, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely. 2One drink is 1 tot of spirits, or 1 small glass (125mL) of wine or 1 can/bottle (330mL) of beer. 3If on atazanavir 131. 4Notify via NMC App (download from NICD website/app store) or www.nicd.ac.za/nmc-overview/notification-process.", "bbox": [34.3, 535.1, 794.4, 552.1], "key": "p94-d3625fac"}], "boxes": [{"box": 1, "rect": [35.5, 132.6, 263.9, 254.7]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAd0AAAD/CAIAAAA7TJuwAAAACXBIWXMAABcSAAAXEgFnn9JSAABtAklEQVR4nOy9CVAVSdsueG/cmTtbzI2YuTdmbkxMzN8eBBEEAUFUFkUU3ADFHXHBBXEBN9xw33BFW1Fp3FdcEBVBEUVoXFBZFMWl3ZfWbv1abbXVT/vv/s4857yaplV1qg77OYeMeOLEqaysrMyszCffzMp6n//w8v9tLCAgICBgOfgP9Z4DAQEBAQEegpcFBAQELAvf8PLHvcmfDm8QEBAQEKhjvJsxXpmX/35ZrP/36wICAgICdYyPB9YLXhYQEBCwIAheFhAQELAsCF4WE ng (snomed_concept \"Scaly skin\" \"finding\"))\n\n    ;; Absence of colour: patchy or generalised?\n    (clinical_finding (snomed_concept \"Achromia of skin\" \"disorder\") (qualifier (snomed_concept \"Patchy\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Achromia of skin\" \"disorder\") (qualifier (snomed_concept \"Generalized\" \"qualifier value\")) (qualifier (snomed_concept \"Congenital\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"White hair\" \"finding\"))\n    (clinical_finding (snomed_concept \"Iris hypopigmentation\" \"finding\"))\n  )\n)\n(task\n  \"Check for urgent jaundice conditions (changes in skin colour)\"\n  adult\n  (or (clinical_finding (snomed_concept \"Jaundice\" \"finding\"))\n      (active_condition (snomed_concept \"Jaundice\" \"finding\")))\n  (check_for\n    (clinical_finding (snomed_concept \"Shock\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Abdominal pain\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Drowsy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Easy bruising\" \"finding\"))\n    (clinical_finding (snomed_concept \"Bleeds easily\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of tendency to bleed\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Alcohol dependence\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Drinking binge\" \"finding\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))\n    (clinical_finding (snomed_concept \"Illicit drug use\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable jaundice (changes in skin colour)\"\n  (diagnosis\n    (snomed_concept \"Jaundice\" \"finding\")\n    probable\n  )\n  adult\n  (clinical_finding (snomed_concept \"Yellow skin\" \"finding\"))\n)\n(system_diagnosis_rule\n  \"Diagnose probable venous stasis (changes in skin colour)\"\n  (diagnosis\n    (snomed_concept \"Venous stasis\" \"finding\")\n    probable\n  )\n  adult\n  (clinical_finding (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (finding_site (snomed_concept \"Structure of lower limb from knee to ankle\" \"body structure\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable melasma (changes in skin colour)\"\n  (diagnosis\n    (snomed_concept \"Chloasma\" \"disorder\")\n    probable\n  )\n  adult\n  (clinical_finding (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (finding_site (snomed_concept \"Face structure\" \"body structure\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable tinea versicolor (changes in skin colour)\"\n  (diagnosis\n    (snomed_concept \"Pityriasis versicolor\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Scaly skin\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (finding_site (snomed_concept \"Trunk structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Hypopigmentation of skin\" \"disorder\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable vitiligo (changes in skin colour)\"\n  (diagnosis\n    (snomed_concept \"Vitiligo\" \"disorder\")\n    probable\n  )\n  adult\n  (clinical_finding (snomed_concept \"Achromia of skin\" \"disorder\") (qualifier (snomed_concept \"Patchy\" \"qualifier value\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable albinism (changes in skin colour)\"\n  (diagnosis\n    (snomed_concept \"Albinism\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Achromia of skin\" \"di omed_concept \"Achromia of skin\" \"disorder\") (qualifier (snomed_concept \"Generalized\" \"qualifier value\")))"], "both": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Achromia of skin\" \"disorder\") (qualifier (snomed_concept \"Patchy\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Face structure\" \"body structure\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Structure of lower limb from knee to ankle\" \"body structure\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Trunk structure\" \"body structure\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hypopigmentation of skin\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Yellow skin\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": [{"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Achromia of skin\" \"disorder\") (qualifier (snomed_concept \"Generalized\" \"qualifier value\")) (qualifier (snomed_concept \"Congenital\" \"qualifier value\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Achromia of skin\" \"disorder\") (qualifier (snomed_concept \"Generalized\" \"qualifier value\")))"}]}, "diagnosis": {"only_A": ["(diagnosis (snomed_concept \"Venous stasis syndrome\" \"disorder\") probable)"], "only_B": ["(diagnosis (snomed_concept \"Venous stasis\" \"finding\") probable)"], "both": ["(diagnosis (snomed_concept \"Albinism\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Chloasma\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Jaundice\" \"finding\") probable)", "(diagnosis (snomed_concept \"Pityriasis versicolor\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Vitiligo\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 94 – Changes in skin colour: flowchart\n\nSource: APC 2026 e-book page 94 (APC 2026 e-book, page 94).\n\n```mermaid\nflowchart TD\n    Q0[\"Is the skin yellow, too dark, too light or absent of colour?\"]\n    Q0 --> Y[\"Yellow skin: jaundice likely\"]\n    Q0 --> D[\"Dark patches\"]\n    Q0 --> L[\"Light patches\"]\n    Q0 --> A[\"Absence of colour\"]\n\n    Y --> RB[\"Refer urgently the patient with jaundice and any of:<br/>Temp ≥ 38°C · Hb &lt; 12 (woman) / &lt; 13 (man) · Shock/BP &lt; 80 ·<br/>Severe abdominal pain · Drowsy or confused · Easy bruising or bleeding ·<br/>Pregnant · Alcohol dependent or recent binge (≥ 4 drinks/session) ·<br/>Using any medication or illegal drugs\"]\n    Y --> BLOODS[\"Send blood (ALT, ALP, bilirubin, FBC, INR, hep A IgM, HBsAg); advise to return if worsens\"]\n    BLOODS --> REV[\"Review with results within 2 days: refer if ALT ≥ 200, INR ≥ 1.5,<br/>ALP raised out of proportion to ALT, Hb &lt; 12/13 or plts &lt; 150\"]\n    REV --> HAV[\"Check hepatitis A IgM result\"]\n    HAV -- positive --> HAVPOS[\"Patient has acute hepatitis A infection (manage, notify)\"]\n    HAV -- negative --> HBS[\"Check HBsAg result; if positive, refer\"]\n\n    D --> WHERE[\"Where are patches on body?\"]\n    WHERE -- Lower legs --> LL[\"Red-brown discolouration. May have breaks in skin or ulcers, spidery veins\"]\n    LL --> VS[\"Venous stasis likely\"]\n    WHERE -- Face --> FACE[\"Flat, brown patches on cheeks, forehead and upper lip\"]\n    FACE --> MEL[\"Melasma likely\"]\n    WHERE -- Trunk --> TR[\"Light or dark patches with fine scale. Usually on trunk, neck and upper arms\"]\n    L --> TR\n    TR --> TV[\"Tinea versicolor likely\"]\n\n    A --> PG[\"Is absence of colour patchy or generalised?\"]\n    PG -- Patchy --> VIT[\"Vitiligo likely\"]\n    PG -- Generalised --> GEN[\"Present from birth. Involves skin, hair and eyes\"]\n    GEN --> ALB[\"Albinism likely\"]\n\n    UNC[\"If diagnosis uncertain, discuss/refer\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint (skin colour change) | `Discoloration of skin` | `Check for causes of changes in skin colour` (task) |\n| Yellow skin → jaundice likely | `Yellow skin` | `Diagnose probable jaundice (changes in skin colour)` |\n| Red box | `Jaundice` (finding or probable diagnosis) **and** any red-box item | `Check for urgent jaundice conditions (changes in skin colour)` (task), `Urgent: jaundice with danger signs (changes in skin colour)` |\n| Dark patches → lower legs → venous stasis likely | `Hyperpigmentation of skin` at `Structure of lower limb from knee to ankle` | `Diagnose probable venous stasis (changes in skin colour)` |\n| Dark patches → face → melasma likely | `Hyperpigmentation of skin` at `Face structure` | `Diagnose probable melasma (changes in skin colour)` |\n| Dark patches on trunk, or light patches, with fine scale → tinea versicolor likely | `Scaly skin` **and** (`Hyperpigmentation of skin` at `Trunk structure` **or** `Hypopigmentation of skin`) | `Diagnose probable tinea versicolor (changes in skin colour)` |\n| Absence of colour, patchy → vitiligo likely | `Achromia of skin` + `Patchy` | `Diagnose probable vitiligo (changes in skin colour)` |\n| Absence of colour, generalised, from birth, skin + hair + eyes → albinism likely | `Achromia of skin` + `Generalized` + `Congenital`, **and** `White hair`, **and** `Iris hypopigmentation` | `Diagnose probable albinism (changes in skin colour)` |\n| Bloods, 2-day review, hepatitis A IgM / HBsAg | Lab values and results: not representable | none (see remaining questions) |\n\n## Notes\n\n- The descriptive sentences under \"Lower legs\" and \"Face\" (\"May have breaks in skin or ulcers,\n  spidery veins\"; \"flat, brown … cheeks, forehead and upper lip\") describe what the dark patches\n  look like; the branch itself is decided by the site, so only the site is encoded.\n- \"Usually on trunk, neck and upper arms\" is a description, not a requirement, so the light-patch\n  route to tinea versicolor carries no site.\n", "questions": "# Page 94 – Changes in skin colour: remaining questions\n\n## Decisions made\n\n- **Two tasks.** `Check for causes of changes in skin colour` (trigger `Discoloration of skin`)\n  checks the findings that steer the page's top-level question to each \"likely\" diagnosis.\n  `Check for urgent jaundice conditions (changes in skin colour)` (trigger: jaundice) checks the red\n  box.\n- **Jaundice is diagnosed at `probable` from `Yellow skin`** (\"Yellow skin: jaundice likely\"). The\n  red-box task and the priority rule accept either a recorded `Jaundice` finding or that probable\n  diagnosis (`or` of `clinical_finding` and `active_condition`).\n- **Shock/BP < 80** is encoded as `Shock` (disorder) **or** systolic BP < 80, as the page writes it\n  (shared decision). Footnote 1 (SBP < 80, pulse ≥ 100, RR > 30, confusion/restlessness, weakness →\n  shock likely) is not turned into a shock definition.\n- **Severe abdominal pain** = `Abdominal pain` + `Severe (severity modifier)` (no precoordinated\n  concept).\n- **Drowsy or confused** = `Drowsy`, `Acute confusion` (the Confusion warning sign's form) or\n  `Clouded consciousness` (the app's AVPU \"Confused\" finding). Reconciler kept both recorded forms.\n- **Easy bruising or bleeding** = `Easy bruising`, `Bleeds easily` or its parent `Finding of tendency to\n  bleed` (VHA's common form). Reconciler kept both bleeding forms.\n- **Using any medication** = exposure to `Drug or medicament` (page 20's exposure pattern), since\n  `Taking medication` exists only as an observable entity.\n- **Dark patches by site** = `Hyperpigmentation of skin` with `finding_site` lower leg (`Structure\n  of lower limb from knee to ankle`), `Face structure` or `Trunk structure`. The descriptions under\n  each site (red-brown discolouration, ulcers, spidery veins; flat brown patches on cheeks, forehead\n  and upper lip) are not required, because the page branches on the site.\n- **Tinea versicolor** = `Scaly skin` and (dark patch on trunk, or `Hypopigmentation of skin`\n  anywhere). \"Usually on trunk, neck and upper arms\" is descriptive, not a requirement.\n- **Absence of colour** = `Achromia of skin`; patchy (`Patchy` qualifier) → vitiligo; generalised\n  (`Generalized` + `Congenital` qualifiers) with `White hair` and `Iris hypopigmentation` → albinism.\n- Diagnosis concepts: `Jaundice` (finding), `Venous stasis` (finding, the page's exact words), `Chloasma` (SNOMED's FSN for\n  melasma), `Pityriasis versicolor` (FSN for tinea versicolor), `Vitiligo`, `Albinism`.\n- No `measure` task: temperature and BP are routine vitals; the bloods are lab tests.\n\n## Could not model\n\n- **Hb < 12 (woman) or < 13 (man)**: no haemoglobin observable or unit. Left out of the priority\n  rule, which therefore fires **less often** than the page intends.\n- **≥ 4 drinks/session** for the alcohol binge: no unit for drinks; `Drinking binge` with the\n  `Recent` qualifier counts whatever the number recorded, so this may fire **more often** than the\n  page intends.\n- The jaundice work-up: bloods (ALT, ALP, bilirubin, FBC, INR, hepatitis A IgM, HBsAg), the 2-day\n  review thresholds (ALT ≥ 200, INR ≥ 1.5, ALP out of proportion, Hb, plts < 150), and the hepatitis A\n  IgM / HBsAg result branches (\"Patient has acute hepatitis A infection\"). Lab values and results\n  have no representation; these are also referral/management steps.\n- All management (advice, sunscreen, selenium sulphide, compression, referral, notification).\n\n## SNOMED gaps\n\n- `Melasma` (disorder): not an FSN; used `Chloasma`.\n- `Tinea versicolor`: synonym only; used `Pityriasis versicolor`.\n- `Severe abdominal pain`: none; used `Abdominal pain` + `Severe (severity modifier)`.\n- `Confusion` (finding): none; used `Acute confusion` and `Clouded consciousness`.\n- `Lower leg structure` (body structure): none; used `Structure of lower limb from knee to ankle`.\n- \"Fine scale\": used `Scaly skin`. \"Absence of colour\": used `Achromia of skin`.\n- \"Hair involved\" in albinism: used `White hair`; \"eyes involved\": used `Iris hypopigmentation`.\n- \"Using any medication\": `Taking medication` is an observable entity only; used drug exposure.\n- `Venous stasis` exists only as a finding; used `Venous stasis` (finding), not `Venous stasis syndrome` (disorder).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- (Reconciler, unsettled) Albinism requires generalised congenital achromia **and** white hair **and** iris\n  hypopigmentation, following the page's \"Present from birth. Involves skin, hair and eyes.\" Is that\n  too strict for a health worker to record, or is generalised absence of colour (with or without\n  \"from birth\") enough, as builder B encoded it?\n- (Reconciler, unsettled) Tinea versicolor requires `Scaly skin` (the page's \"with fine scale\"). Should\n  light patches or dark trunk patches without recorded scale still give probable tinea versicolor, as\n  the flowchart routing alone suggests (builder B's encoding)? Light patches without scale currently\n  lead nowhere.\n- Are `Acute confusion` and `Clouded consciousness` both right for \"confused\" here?\n- Does \"Using any medication\" mean any current medication at all (as encoded), or only potentially\n  hepatotoxic ones?\n- Is `Exposure to … Drug or medicament` the right way to record \"using any medication\" (the\n  footnote singles out atazanavir)?\n- Does `Discoloration of skin` suit as the recorded complaint, given that hyper/hypopigmentation\n  and achromia are not its descendants in SNOMED?\n", "claims": [{"claim_id": "c001", "rule": "Check for causes of changes in skin colour", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Discoloration of skin\" \"finding\"))", "element_keys": ["p94-6aa1434b"], "quote": "Is the skin yellow, too dark, too light or absent of colour?"}, {"claim_id": "c002", "rule": "Check for causes of changes in skin colour", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Yellow skin\" \"finding\"))", "element_keys": ["p94-354fdabf"], "quote": "Yellow skin"}, {"claim_id": "c003", "rule": "Check for causes of changes in skin colour", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Structure of lower limb from knee to ankle\" \"body structure\")))", "element_keys": ["p94-3a757725", "p94-f5a9e389"], "quote": "Where are patches on body? Lower legs"}, {"claim_id": "c004", "rule": "Check for causes of changes in skin colour", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Face structure\" \"body structure\")))", "element_keys": ["p94-3a757725", "p94-5203c82c"], "quote": "Where are patches on body? Face"}, {"claim_id": "c005", "rule": "Check for causes of changes in skin colour", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperpigmentation of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Trunk structure\" \"body st , "kind": "rule", "priority": "medium", "ref": "Check for causes of changes in skin colour", "text": "Trigger is (clinical_finding (snomed_concept \"Discoloration of skin\" \"finding\")), which is not one of the listed common symptoms or warning signs; the task only runs if that finding is recorded somewhere. Yellow skin is a child of Discoloration of skin, so a recorded Yellow skin would trigger it, but the dark/light/absent branches depend on the nurse recording the parent concept.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "(no rule) hepatitis A branch", "text": "The IgM positive/negative flowchart branch and 'acute hepatitis A infection' conclusion are lost; no hepatitis A diagnosis or referral rule exists.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "Urgent: jaundice with danger signs", "text": "Hb < 12 (woman) / < 13 (man) criterion is silently dropped (not_representable). Priority rule is therefore weaker than the page; reviewers should be told. Also the 'any medication' branch fires for any patient on any drug.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "Check for causes of changes in skin colour", "text": "Dark patches vs light patches distinction relies on Hyperpigmentation/Hypopigmentation; Hyperpigmentation sites are body-structure qualified, so patches on other sites match nothing and the venous stasis/melasma rules cannot be told apart from plain hyperpigmentation features (red-brown, spidery veins) that the page uses.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable albinism", "text": "ANDs generalised congenital achromia, white hair and iris hypopigmentation; a patient lacking one of the three recorded findings gets no albinism suggestion. Defensible but strict.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "Diagnose probable vitiligo", "text": "Fires on any patchy achromia, with no exclusion for the other conditions. Page-faithful.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "Check for urgent jaundice conditions", "text": "Temperature and systolic BP are used in the priority rule but absent from check_for (measurements, acceptable). Check list and priority rule otherwise agree.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "Urgent: jaundice with danger signs (changes in skin colour)", "text": "The shock criterion relies only on a recorded 'Shock' finding or SBP < 80. Footnote 1's shock definition (pulse >= 100, RR > 30, restlessness, weakness) has no probable-shock rule, so a jaundiced patient who is tachycardic and tachypnoeic with SBP >= 80 is not escalated unless shock is entered manually.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "Urgent: jaundice with danger signs (changes in skin colour)", "text": "The Hb < 12/13 red-box criterion cannot be represented (no unit), so one red-box line has no encoding. This is expected, but it should be listed as a known gap.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 94, "slug": "94-changes-in-skin-colour", "kind": "rule", "priority": "medium", "ref": "(none)", "text": "The Hepatitis A IgM-positive branch, leading to 'Patient has acute hepatitis A infection <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};

const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;

  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>

  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
