id": "p47-out-e17", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Giant cell arteritis", "bbox": [727.6, 362.6, 799.8, 373.6], "key": "p47-534c194c"}, {"id": "p47-out-e18", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely • Check CRP. • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) for up to 5 days. • Review next day: if CRP > 5, discuss with specialist same day.", "bbox": [723.2, 373.4, 803.7, 473.6], "key": "p47-db418138"}, {"id": "p47-out-e19", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Tension headache", "bbox": [572.3, 372.6, 645.6, 383.6], "key": "p47-0b74d2a4"}, {"id": "p47-out-e20", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed up to 5 days. • Assess for stress and anxiety 98.", "bbox": [566.3, 383.4, 648.2, 463.6], "key": "p47-9fe1dd63"}, {"id": "p47-out-e21", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Constant", "bbox": [669.8, 330.1, 704.9, 340.3], "key": "p47-d6c7fbd4"}, {"id": "p47-out-e22", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "aching", "bbox": [673.9, 340.1, 700.8, 350.3], "key": "p47-729b6fd9"}, {"id": "p47-out-e23", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "pain, tender", "bbox": [674.2, 350.1, 700.5, 370.3], "key": "p47-b3e697d4"}, {"id": "p47-out-e24", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "neck muscles", "bbox": [671.5, 370.1, 701.2, 390.3], "key": "p47-c098fa07"}, {"id": "p47-out-e25", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Muscular", "bbox": [668.3, 402.6, 706.3, 413.6], "key": "p47-6ee7523f"}, {"id": "p47-out-e26", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "neck", "bbox": [677.0, 412.6, 697.6, 423.6], "key": "p47-1d1b1934"}, {"id": "p47-out-e27", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "pain likely 79.", "bbox": [676.5, 422.6, 697.5, 453.6], "key": "p47-384e4f74"}, {"id": "p47-out-e28", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If diagnosis uncertain or poor response to treatment, discuss/refer.", "bbox": [292.1, 522.6, 549.7, 533.6], "key": "p47-550f2d39"}, {"id": "p47-out-e29", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If none of above, treat as acute viral infection:", "bbox": [196.7, 359.3, 337.6, 380.3], "key": "p47-725fbe7e"}, {"id": "p47-out-e30", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- Advise on cough/sneeze hygiene and to", "bbox": [202.3, 380.1, 356.7, 390.3], "key": "p47-0cc4d5f0"}, {"id": "p47-out-e31", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "wash hands regularly. While unwell, avoid contact with elderly/those with long-term health conditions. - Give paracetamol 500mg-1g 4-6 hourly", "bbox": [202.3, 390.1, 364.5, 430.3], "key": "p47-d2739a2c"}, {"id": "p47-out-e32", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "(up to 4g in 24 hours) as needed for up to 5 days. - Explain antibiotics are not needed. - Advise to rest and maintain hydration. - Advise to return if worsening symptoms: if", "bbox": [202.3, 430.1, 369.2, 480.3], "key": "p47-c2b88d56"}, {"id": "p47-out-e33", "page": 47, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "cough/difficulty breathing 23, if face pain 49, if ear pain 50.", "bbox": [208.0, 479.5, 353.2, 500.3], "key": "p47-981443e0"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 197.7]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkYAAADoCAIAAAA1788OAAAACXBIWXMAABcSAAAXEgFnn9JSAAFY/0lEQVR4nOy9B1BV25ou2n1P39u3bvV7dau7b9+6/V69s12KoogBUVQUxew2Y1YMmDAHxIQ5YcSEYaNuc8acEBPmACKIbnMOW926zWmHc9b7WL8OhzOMORdBgn/VVxRrzDFHHn/45gj/8Ov/W4jBYDAYDAaDwWAwGAwGg8HIQ/iHHC8Bg8FgMBgMBoPBYDAYDAaD4RaY0mIwGAwGg8FgMBgMBoPBYOQxfKa03s0Z937FDAaDwWAwGAwGg8FgMBgMBiMX4u2U4QaU1p+3Dzn/+InBYDAYDAaDwWAwGAwGg8HIhfjj/C6mtBgMBoPBYDAYDAaDwWAwGHkJTGkxGAwGg8FgMBgMBoPBYDDyGJjSYjAYDAaDwWAwGAwGg8Fg5DEwpcVgMBgMBoPBYDAYDAaDwchjYEqLwWAwGAwGg8FgMBgMBoORx8CUFoPBYDAYDAaDwWAwGAwGI4+BKS0Gg8FgMBgMBoPBYDAYDEYeA1NaDAaDwWAwGAwGg8FgMBiMPAamtBgMBoPBYDAYDAaDwWAwGHkMTGkxGAwGg8FgMBgMBoPBYDDyGJjSYjAYDEYuwqtnSX/77XyOF4OhwMtfT+d4Gezj2KFV8bsXAzleEkP89jb13avkHC+GHpYz8adz26lhf318wjI1tyJnHieOrqHsMiNMfr57mBK5fnlPjndHdlTwK+DOjf0rl05ZED361LF1OV4YBoPBYORLMKXFYDAYjK+HD29Stm2aN23SoB7d2gS3btS/T4c5M4bfuBJPT3duW1CkUEF/vzKvniXmeFEZhhg7qo/jr3/t2qlFjpfEJqpW9kOBgRwviR5w+H1KFi9etMjp47nL4bczE4eEd6WGPXlsrWWCbkXOPL6vXZWyg8DJcCJbYqMpkZnTh+V4j2RHBbMbG9fN8vQoSOUM798px8vDYDAYjHwJprQYDAaD8ZWwffO8ShXKkocjY+GCcRRhzMg+FJKStCnHS5utePcqec/OhRPG9F++ZHIGXr/y064lCyf26t5WZhxOHFkzZ8bwkRE9s6qQjx8cjV07a0h4V3mFRd1aVdBB3sU8f393LsubxbBemWzV3ENp6WsXv2sRle2HuWOyJIusGgP6mahPmSmtHETup7R+vnu4eNEiVMia1SrNmzMqx4vEYDAYjHwJprQYDAaD8TWwbHGk4LCqVPIL7dJqYL+Qdm0al/DyPJ+6jeI8uHtozIjeSxdF5nhpsxtnEzdRU4yK6JWB1zsEN6HX5W1ctCCidvXKWVXIBdGjKZfd22NEYHLixmGDuiXsW5YdzWJYr0y2au6htPS1++1tavTMEZMnDnz+5FSWZJFVY0A/E/UpM6WVg8j9lNbGdbOohFlIsjMYDAaDoQdTWgwGg8HIdvx0bju5xIULOjasmfn33y+IR/Dqxc9H949c+WkX8P XNHO1pOxuG+cw8uHusv3dn2uqIYSoCPCQyDMMwDMMwFR+WtBhGz5uXZ8tomySGYRiLg4dEhmEYhmEYpuLDkhbDMAzDMAzDMAzDMAxjYbCkxTAMwzAMwzAMwzAMw1gYLGkxDMMwDMMwDMMwDMMwFgZLWgzDMAzDMAzDMAzDMIyFwZIWwzAMwzAMwzAMwzAMY2GwpMUwDMMwDMMwDMMwDMNYGCxpMQzDMAzDMAzDMAzDMBaGsqT1ctHUVxvnMwzDMAzDMAzDMAzDMEwF5MWc8QqSFsMwDMMwDMMwDMMwDMNYBCxpMQzDMAzDMAzDMAzDMBYGS1oMwzAMwzAMwzAMwzCMhfH/ouhnhdv430gAAAAASUVORK5CYII="}, "page_image": null, "lisp": ";; Page 47 - Headache\n;; Red box: \"Give urgent attention to the patient with headache and any of:\" (see 47-headache-flowchart.md)\n(task\n  \"Check for urgent headache conditions\"\n  adult\n  (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n  (check_for\n    ;; Pregnant or 1 week postpartum, and BP >= 140/90 / BP >= 180/110 and not pregnant\n    (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))\n\n    ;; New sudden asymmetric weakness or numbness of face, arm or leg; difficulty speaking: consider stroke or TIA\n    (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\"))\n\n    ;; New vision problems or eye pain\n    (clinical_finding (snomed_concept \"Abnormal vision\" \"finding\") (qualifier (snomed_concept \"New\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Pain in eye\" \"finding\"))\n\n    ;; Sudden severe headache or dizziness\n    (clinical_finding (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Dizziness\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n\n    ;; Headache that is getting worse and more frequent\n    (clinical_finding (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Worsening\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Frequent headache\" \"finding\"))\n\n    ;; Headache that wakes patient or is worse in the morning\n    (clinical_finding (snomed_concept \"Wakes up during night\" \"finding\"))\n    (clinical_finding (snomed_concept \"Morning headache\" \"finding\"))\n\n    ;; Neck stiffness, drowsy/confused or purple/red rash: meningitis likely\n    (clinical_finding (snomed_concept \"Stiff neck\" \"finding\"))\n    (clinical_finding (snomed_concept \"Drowsy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Purpuric rash\" \"disorder\"))\n\n    ;; Persistent headache since starting ART\n    (clinical_finding (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Chronic persistent\" \"qualifier value\")))\n    (finding (snomed_concept \"Procedure\" \"procedure\") (snomed_concept \"Highly active antiretroviral therapy\" \"procedure\"))\n\n    ;; Decreased consciousness, persistent nausea/vomiting, first seizure, recent head injury, unequal pupils\n    (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Persistent vomiting\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Seizure\" \"finding\") (qualifier (snomed_concept \"First episode\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Injury of head\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Anisocoria\" \"disorder\"))\n  )\n)\n;; \"Approach to the patient with headache not needing urgent attention\" (flowchart)\n(task\n  \"Check for causes of headache not needing urgent attention\"\n  adult\n  (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n  (check_for\n    ;; Does patient have fever and body pain or recent common cold?\n    (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\"))\n    (clinical_finding (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n\n    ;; Sinusitis: thick nasal/postnasal discharge, pain when pushing on forehead/cheeks\n    (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Thick\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Posterior rhinorrhea\" \"disorder\") (qualifier (snomed_concept \"Thick\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Tenderness\" \"finding\") (finding_site (snomed_concept \"Forehead structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Tenderness\" \"finding\") (finding_site (snomed_concept \"Cheek structure\" \"body structure\")))\n\n    ;; Tick bite fever\n    (clinical_finding (snomed_concept \"Tick bite\" \"disorder\"))\n\n    ;; Migraine: recurrent throbbing headaches with nausea or light/noise sensitivity\n    (clinical_finding (snomed_concept \"Throbbing headache\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Photophobia\" \"finding\"))\n    (clinical_finding (snomed_concept \"Phonophobia\" \"finding\"))\n\n    ;; Type and site of pain\n    (clinical_finding (snomed_concept \"Tightness sensation\" \"finding\") (finding_site (snomed_concept \"Head structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Generalized headache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Aching pain\" \"finding\") (qualifier (snomed_concept \"Continuous\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Tenderness\" \"finding\") (finding_site (snomed_concept \"Skeletal muscle structure of neck\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Temporal headache\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable meningitis in headache\"\n  (diagnosis\n    (snomed_concept \"Meningitis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Red box: \"Neck stiffness, drowsy/confused or purple/red rash: meningitis likely\"\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (or (clinical_finding (snomed_concept \"Stiff neck\" \"finding\"))\n        (clinical_finding (snomed_concept \"Drowsy\" \"finding\"))\n        (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n        (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n        (clinical_finding (snomed_concept \"Purpuric rash\" \"disorder\"))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible stroke in headache\"\n  (diagnosis\n    (snomed_concept \"Cerebrovascular accident\" \"disorder\")\n    possible\n  )\n  adult\n  ;; Red box: \"New sudden asymmetric weakness or numbness of face, arm or leg; difficulty speaking: consider stroke or TIA\"\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (or (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Numbness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\"))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible TIA in headache\"\n  (diagnosis\n    (snomed_concept \"Transient ischemic attack\" \"disorder\")\n    possible\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (or (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Numbness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\"))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable sinusitis in headache\"\n  (diagnosis\n    (snomed_concept \"Sinusitis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Flowchart: fever and body pain or recent common cold = Yes -> recent common cold and now any of ... -> Yes\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    (or (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Thick\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Posterior rhinorrhea\" \"disorder\") (qualifier (snomed_concept \"Thick\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Tenderness\" \"finding\") (finding_site (snomed_concept \"Forehead structure\" \"body structure\")))\n        (clinical_finding (snomed_concept \"Tenderness\" \"finding\") (finding_site (snomed_concept \"Cheek structure\" \"body structure\")))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable tick bite fever in headache\"\n  (diagnosis\n    (snomed_concept \"African tick bite fever\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Flowchart: fever and body pain or recent common cold = Yes -> sinusitis question = No -> tick bite -> tick bite fever likely\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (or (and (active_condition (snomed_concept \"Fever\" \"finding\"))\n             (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\")))\n        (clinical_finding (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    )\n    (clinical_finding (snomed_concept \"Tick bite\" \"disorder\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible acute viral infection in headache\"\n  (diagnosis\n    (snomed_concept \"Acute viral disease\" \"disorder\")\n    possible\n  )\n  adult\n  ;; Flowchart: fever and body pain or recent common cold = Yes -> sinusitis question = No -> no tick bite\n  ;; -> \"If none of above, treat as acute viral infection\" (the malaria-area branch is not representable)\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (or (and (active_condition (snomed_concept \"Fever\" \"finding\"))\n             (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\")))\n        (clinical_finding (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n    )\n    ;; none of above: no recent cold, or none of the sinusitis features; and no tick bite\n    (or (no (clinical_finding (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\"))))\n        (and (no (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Thick\" \"qualifier value\"))))\n             (no (clinical_finding (snomed_concept \"Posterior rhinorrhea\" \"disorder\") (qualifier (snomed_concept \"Thick\" \"qualifier value\"))))\n             (no (clinical_finding (snomed_concept \"Tenderness\" \"finding\") (finding_site (snomed_concept \"Forehead structure\" \"body structure\"))))\n             (no (clinical_finding (snomed_concept \"Tenderness\" \"finding\") (finding_site (snomed_concept \"Cheek structure\" \"body structure\")))))\n    )\n    (no (clinical_finding (snomed_concept \"Tick bite\" \"disorder\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable migraine in headache\"\n  (diagnosis\n    (snomed_concept \"Migraine\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Flowchart: recurrent headaches that are throbbing, disabling with nausea or light/noise sensitivity\n  ;; (\"disabling\" and \"resolve completely within 72 hours\" are not modelled; see remaining questions)\n  (and\n    (clinical_finding (snomed_concept \"Throbbing headache\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n    (or (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n        (clinical_finding (snomed_concept \"Photophobia\" \"finding\"))\n        (clinical_finding (snomed_concept \"Phonophobia\" \"finding\"))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable tension headache in headache\"\n  (diagnosis\n    (snomed_concept \"Tension-type headache\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Flowchart: tightness around head or generalised pressure-like pain\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (or (clinical_finding (snomed_concept \"Tightness sensation\" \"finding\") (finding_site (snomed_concept \"Head structure\" \"body structure\")))\n        (clinical_finding (snomed_concept \"Generalized headache\" \"finding\"))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable muscular neck pain in headache\"\n  (diagnosis\n    (snomed_concept \"Myofascial neck pain\" \"finding\")\n    probable\n  )\n  adult\n  ;; Flowchart: constant aching pain, tender neck muscles\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Aching pain\" \"finding\") (qualifier (snomed_concept \"Continuous\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Tenderness\" \"finding\") (finding_site (snomed_concept \"Skeletal muscle structure of neck\" \"body structure\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable giant cell arteritis in headache\"\n  (diagnosis\n    (snomed_concept \"Giant cell arteritis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Flowchart: patient > 50 years, pain over temples (age is not representable; see remaining questions)\n  (clinical_finding (snomed_concept \"Temporal headache\" \"finding\"))\n)\n(system_priority_evaluation\n  \"Urgent: headache with red-box danger signs\"\n  adult\n  Urgent\n  (and\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (or\n      ;; Pregnant or 1 week postpartum, and BP >= 140/90\n      (and (or (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n               (<= (onset (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))) (time_ago 1 weeks)))\n           (or (>= (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 140)\n               (>= (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 90)))\n      ;; BP >= 180/110 and not pregnant. \"and not pregnant\" only routes to page 148 instead of 177:\n      ;; a pregnant patient with BP >= 180/110 already meets the line above, so inside this \"or\"\n      ;; the clause changes nothing and is left out (the gate rejects \"not\"; \"no\" would need an\n      ;; explicit \"not pregnant\" record and would miss men)\n      (>= (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 180)\n      (>= (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 110)\n      ;; New sudden asymmetric weakness or numbness of face, arm or leg; difficulty speaking\n      (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n      (clinical_finding (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qua edure\" \"procedure\") (snomed_concept \"Highly active antiretroviral therapy\" \"procedure\")))\n      ;; Decreased consciousness\n      (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n      ;; Persistent nausea/vomiting\n      (clinical_finding (snomed_concept \"Persistent vomiting\" \"disorder\"))\n      ;; Following a first seizure\n      (clinical_finding (snomed_concept \"Seizure\" \"finding\") (qualifier (snomed_concept \"First episode\" \"qualifier value\")))\n      ;; Recent head injury\n      (clinical_finding (snomed_concept \"Injury of head\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n      ;; Unequal pupils\n      (clinical_finding (snomed_concept \"Anisocoria\" \"disorder\"))\n    )\n  )\n)\n", "rules": [{"atom": "task", "description": "Check for urgent headache conditions", "ages": ["adult"], "raw": "(task \"Check for urgent headache conditions\" \"adult\" (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\")) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pregnancy\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Postpartum state\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of muscle of lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \ oncept \"Cerebrovascular accident\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Giant cell arteritis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Meningitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Migraine\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Myofascial neck pain\" \"finding\") probable)", "(diagnosis (snomed_concept \"Sinusitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Tension-type headache\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Transient ischemic attack\" \"disorder\") possible)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Spotted fever group rickettsial disease\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"African tick bite fever\" \"disorder\") probable)", "relation": "B_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 47 – Headache: flowchart\n\nSource: APC 2026 e-book page 47 (red box and the \"Approach to the patient with headache not needing urgent attention\" flowchart).\n\n```mermaid\nflowchart TD\n    RB[\"Red box: headache and any of the urgent signs<br/>(pregnant/≤1 week postpartum + BP ≥ 140/90; BP ≥ 180/110; sudden focal weakness/numbness, difficulty speaking;<br/>new vision problems/eye pain; sudden severe headache/dizziness; worsening + more frequent;<br/>wakes patient/worse in morning; neck stiffness, drowsy/confused, purple/red rash; persistent headache since ART;<br/>decreased consciousness; persistent nausea/vomiting; first seizure; recent head injury; unequal pupils)\"]\n    RB -- Yes --> URG[\"Urgent. Manage and refer urgently\"]\n    URG --> MEN[\"Neck stiffness, drowsy/confused or purple/red rash: meningitis likely\"]\n    URG --> STR[\"Focal weakness/numbness, difficulty speaking: consider stroke or TIA\"]\n    URG --> MAL1[\"Fever now/past 3 days + malaria area in past 3 months: malaria likely\"]\n    RB -- No --> Q1[\"Does patient have fever and body pain or recent common cold?\"]\n    Q1 -- Yes --> Q2[\"Recent common cold and now any of: thick nasal/postnasal discharge,<br/>pain when pushing on forehead/cheeks, headache worse on bending forward?\"]\n    Q2 -- Yes --> SIN[\"Sinusitis likely\"]\n    Q2 -- No --> NO2[\"Malaria area in past 3 months: malaria likely<br/>Tick bite or tick present: tick bite fever likely<br/>None of above: treat as acute viral infection\"]\n    Q1 -- No --> Q3[\"Recurrent headaches that are throbbing, disabling with nausea or light/noise sensitivity,<br/>that resolve completely within 72 hours?\"]\n    Q3 -- Yes --> MIG[\"Migraine likely\"]\n    Q3 -- No --> TYPE[\"Check BP (≥ 140/90 → 148). Ask about type and site of pain\"]\n    TYPE --> TEN[\"Tightness around head or generalised pressure-like pain: tension headache likely\"]\n    TYPE --> NECK[\"Constant aching pain, tender neck muscles: muscular neck pain likely\"]\n    TYPE --> GCA[\"Patient > 50 years, pain over temples: giant cell arteritis likely\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Red box | Headache **and** any of the red-box items | `Check for urgent headache conditions`, `Urgent: headache with red-box danger signs` |\n| Meningitis likely | Headache and any of stiff neck, drowsy, clouded consciousness, acute confusion, purpuric rash | `Diagnose probable meningitis in headache` → `(active_condition Meningitis)` in the urgent rule |\n| Consider stroke or TIA | Headache and any sudden-onset face/arm/leg weakness or numbness, or difficulty talking | `Diagnose possible stroke in headache`, `Diagnose possible TIA in headache` |\n| Malaria likely (red box and Q2 = No) | Not encoded: no concept for \"been in a malaria area\" | — (see remaining questions) |\n| Q1 → Q2 = Yes | Headache, recent common cold, and any of thick nasal discharge, thick posterior rhinorrhea, forehead/cheek tenderness (\"worse on bending forward\" has no concept) | `Diagnose probable sinusitis in headache` |\n| Q1 = Yes → Q2 = No → tick | Headache, (fever and generalized aches) or recent common cold, and tick bite | `Diagnose probable tick bite fever in headache` |\n| Q1 = Yes → Q2 = No → none of above | Headache, (fever and generalized aches) or recent common cold, recorded absence of the sinusitis branch (no recent cold, or none of its features), and no tick bite (the malaria-area exclusion is not representable) | `Diagnose possible acute viral infection in headache` |\n| Q1 = No → Q3 = Yes | Recurrent throbbing headache and any of nausea, photophobia, phonophobia | `Diagnose probable migraine in headache` |\n| Q3 = No → tension | Headache and (tightness sensation of head or generalized headache) | `Diagnose probable tension headache in headache` |\n| Q3 = No → muscular neck | Headache, continuous aching pain and tender neck muscles | `Diagnose probable muscular neck pain in headache` |\n| Q3 = No → GCA | Temporal headache (age > 50 not representable) | `Diagnose probable giant cell arteritis in headache` |\n| All flowchart questions | Findings asked once | `Check for causes of headache not needing urgent attention` |\n\n## Notes\n\n- Except for acute viral infection, the \"No\" branches of Q1, Q2 and Q3 are not required as negative evidence (`no …`) in the later rules:\n  each \"likely\" rule fires on its own positive findings. This makes them fire somewhat more often\n  than a strict walk down the chart.\n- \"Check BP. If ≥ 140/90 → 148\" is a cross-reference; BP is a routine vital.\n- \"If none of above, treat as acute viral infection\" is encoded as a `possible` diagnosis (reconciler, from builder B); it is the only rule that needs the earlier answers as recorded negatives. The analgesia-overuse note is management.\n", "questions": "# Page 47 – Headache: remaining questions\n\nFinal build, reconciled from builders A and B (base: A). Every difference and its reason is in\n`reconcile.json`.\n\n## Decisions made\n\n- **Two `check_for` tasks**, both triggered by the common symptom Headache: one for the red box\n  (`Check for urgent headache conditions`), one for the flowchart \"Approach to the patient with\n  headache not needing urgent attention\" (`Check for causes of headache not needing urgent attention`).\n- **One Urgent priority rule** `(and Headache (or …red-box items…))`. The meningitis item uses\n  `(active_condition Meningitis)`, diagnosed at `probable`. Stroke/TIA (\"consider\") are `possible`\n  rules, so the priority rule lists their findings directly.\n- **BP pairs** follow Will's convention: BP ≥ 140/90 is systolic ≥ 140 **or** diastolic ≥ 90; BP ≥\n  180/110 is systolic ≥ 180 **or** diastolic ≥ 110.\n- **\"BP ≥ 180/110 and not pregnant\"** is encoded without the \"not pregnant\" clause. VHA's evidence\n  code rejects `not`, and `(no Pregnancy)` needs an explicit \"not pregnant\" record, so it would miss\n  men and anyone whose pregnancy status wasn't recorded. A pregnant patient with BP ≥ 180/110 already\n  meets the \"pregnant and BP ≥ 140/90\" line, so inside the red-box `or` the urgent result is the\n  same. The clause only chooses page 148 over 177.\n- **\"1 week postpartum\"** is `(<= (onset (clinical_finding Postpartum state)) (time_ago 1 weeks))`,\n  using `<=` as the team requires.\n- **Meningitis likely** is `probable`: headache and any of stiff neck, drowsy, clouded consciousness\n  or acute confusion (both for \"confused\"), purpuric rash (\"purple/red rash\").\n- **Consider stroke or TIA** is two `possible` rules. \"New sudden\" is the Sudden onset qualifier on the\n  six weakness/numbness findings. Difficulty speaking, after the semicolon, has no qualifier.\n- **Sudden severe dizziness**: \"sudden severe\" is read as covering dizziness too.\n- **\"Getting worse and more frequent\"** is a Worsening headache **and** a Frequent headache.\n- **\"Headache that wakes patient\"** is approximated by Wakes up during night (inside the headache  area in past 3 months\"; not\n  encoded (page 39). The acute-viral-infection \"none of above\" therefore can't exclude malaria\n  (fires slightly **more often**).\n- **Tension headache**: the \"pressure-like\" quality has no concept; any generalized headache counts\n  (**more often**).\n- **Sinusitis**: \"headache worse on bending forward\" has no concept; fires slightly **less often**.\n- **Persistent nausea**: only Persistent vomiting is encoded (**less often**).\n- **CRP > 5** (GCA review) is a lab value and management.\n\n## SNOMED gaps\n\n- Exposure to / having been in a malaria area in the past 3 months — none.\n- On antiretroviral therapy / since starting ART (finding) — none; only `Highly active antiretroviral\n  therapy` (procedure).\n- \"Persistent\" (qualifier value) — none; \"Chronic persistent\" used. No Persistent nausea concept.\n- Headache that wakes the patient from sleep — none; Wakes up during night used.\n- Headache worse on bending forward — none.\n- Tick present (attached tick) — none; Tick bite used.\n- Muscular neck pain — none; Myofascial neck pain used.\n- Pressure-like headache — none; Generalized headache used.\n- \"Difficulty speaking\" has no FSN; \"Difficulty talking\" used.\n- Asymmetrical (qualifier value) — none fitting.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Is probable giant cell arteritis on temporal headache alone acceptable until age can be expressed,\n  or should it be `possible` / held back?\n- Should \"persistent headache since starting ART\" fire for any patient on ART with a persistent\n  headache? Does the app record ART as a Procedure finding of \"Highly active antiretroviral therapy\"?\n  If not, that urgent criterion never fires.\n- Is \"sudden severe headache or dizziness\" meant as sudden severe dizziness, or any dizziness?\n- Does \"new sudden\" also apply to \"difficulty speaking\" (encoded without Sudden onset)?\n- \"Tick bite fever\": African tick bite fever only, or the broader Spotted fever group rickettsial\n  disease (which also covers Boutonneuse/Mediterranean spotted fever)?\n- Should \"treat as acute viral infection\" be a diagnosis at all, or only management?\n- Is Abnormal vision + New the right reading of \"new vision problems\", or should Visual disturbance\n  be used?\n- Should \"purple/red rash\" also include a non-purpuric red rash (e.g. petechial or erythematous)?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent headache conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\"))", "element_keys": ["p47-537e59c7"], "quote": "headache"}, {"claim_id": "c002", "rule": "Check for urgent headache conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pregnancy\" \"finding\"))", "element_keys": ["p47-5dac6f21"], "quote": "Pregnant"}, {"claim_id": "c003", "rule": "Check for urgent headache conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Postpartum state\" \"finding\"))", "element_keys": ["p47-5dac6f21"], "quote": "1 week postpartum"}, {"claim_id": "c004", "rule": "Check for urgent headache conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "element_keys": ["p47-0c149e18"], "quote": "New sudden asymmetric weakness or numbness of face, arm or leg"}, {"claim_id": "c005", "rule": "Check for urgent headache conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "element_keys": ["p47-0c149e18"], "quote": "New sudden asymmetric weakness or numbness o g": [], "problem": "Parts: sudden weakness of face/arm/leg (3), sudden numbness of face/arm/leg (3), difficulty speaking (1), 'consider stroke or TIA' (2 possible diagnoses). All seven findings are in the check_for and the priority rule, and both possible rules (Cerebrovascular accident, Transient ischemic attack) exist with the same evidence anchored on Headache. 'New' is subsumed by 'Sudden onset'; 'asymmetric' has no SNOMED expression and its omission widens the trigger slightly, which is the safe direction.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'asymmetric' (one-sided) not representable"], "problem": "Weakness/numbness face, arm, leg with Sudden onset encoded; stroke and TIA both as possible. Asymmetry dropped; 'Difficulty talking' has no Sudden onset, defensible as the page's wording is ambiguous.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'asymmetric' (unilateral) is not expressed; bilateral weakness or numbness would also trigger"], "problem": "The weakness and numbness of face/arm/leg (Sudden onset) and the difficulty talking are encoded in the priority rule. 'Consider stroke or TIA' becomes two possible-diagnosis rules (correct rule type). 'New' is carried only by 'Sudden onset'.", "confidence": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "element", "priority": "high", "ref": "p47-c873b15d", "text": "Headache that wakes patient or is worse in the morning", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "error", "parts_missing": [], "problem": "Two parts. (a) 'Headache that wakes patient' is encoded as (clinical_finding \"Wakes up during night\"), a generic sleep finding (parent: Finding related to sleep) that says nothing about headache. Any headache patient who reports waking at night for any reason (nocturia, insomnia) becomes Urgent. SNOMED has no 'headache wakes patient' concep medium", "ref": "Urgent: headache with red-box danger signs", "text": "'Headache that wakes patient' is encoded as the generic sleep finding 'Wakes up during night', so any headache patient who wakes at night for any reason is made Urgent; the finding is not tied to the headache.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable sinusitis in headache / Diagnose possible acute viral infection in headache", "text": "The sinusitis feature 'headache worse on bending forward' is absent from the check_for, the sinusitis or-list and the acute-viral exclusion list.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Urgent: headache with red-box danger signs", "text": "'Persistent nausea/vomiting' is encoded as Persistent vomiting only; persistent nausea is not checked for or used.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable migraine in headache", "text": "'Disabling' and 'resolve completely within 72 hours' are not encoded, and the rule is not gated on the 'No' answer to the fever/body pain/common cold question. Nothing in the file records which of these were judged not representable.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Urgent: headache with red-box danger signs", "text": "Dizziness carries the Sudden onset and Severe qualifiers, narrowing 'sudden severe headache or dizziness' to sudden severe dizziness; the plainer reading is headache with any dizziness (a recorded common symptom).", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable gian ef": "Urgent: headache with red-box danger signs", "text": "Persistent-ART branch uses an unusual (finding Procedure HAART) construction and may not evaluate; verify it parses against the VHA grammar.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable giant cell arteritis in headache", "text": "Fires on temporal headache alone; the page requires age > 50 as well. Over-diagnoses in young adults (not_representable but unflagged).", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable migraine in headache", "text": "No exclusion of the fever/body pain or recent-cold branch; omits 72h resolution and disability.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Urgent: headache with red-box danger signs", "text": "'Persistent nausea' missing, only vomiting; 'Wakes up during night' triggers on any night waking.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke / TIA in headache", "text": "Identical criteria for both; asymmetry dropped. Matches page ('consider stroke or TIA'), but the 'Difficulty talking' lacks Sudden onset.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Check for causes of headache not needing urgent attention", "text": "check_for omits Fever and Tick-bite-related absence checks is fine, but Fever (used in tick bite fever and viral rules) is not in check_for; Throbbing headache's qualifiers fine. Pregnancy checks fine.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "(no rule)", "text": "Malaria likely (fever now or past 3 days and malaria area) has no diagnosis rule; travel history not representable.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose possible acute viral infection in headache", "text": "Mixed level: page says 'treat as', encoded possible; acceptable but the 'none of above' does not exclude malaria.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "high", "ref": "Diagnose probable migraine / tension headache / muscular neck pain / giant cell arteritis", "text": "The flowchart's 'No' branch is lost. These four rules do not require the absence of (fever AND body pain) or recent cold, and tension, muscular and GCA do not require 'not migraine'. They can fire alongside sinusitis or viral infection. GCA in particular fires on 'Temporal headache' alone, with no age > 50 condition, so any adult with temporal headache gets probable GCA.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "high", "ref": "(missing) probable Malaria", "text": "'Malaria likely' appears twice on the page (red-box manage line, and the flowchart Yes -> No branch), yet there is no malaria rule and no check_for for fever timing or malaria-area exposure. Even if the exposure part is not representable, that should be explicit.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Urgent: headache with red-box danger signs", "text": "'Wakes up during night' (a generic sleep finding) is an independent Urgent trigger in the OR, so any headache patient who wakes at night is Urgent. That over-triages, because the page means a headache that wakes the patient.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Urgent: headache with red-box danger signs", "text": "The BP >= 180/110 branch omits 'and not pregnant', and 'Persistent nausea' is missing from the nausea/vomiting criterion (only 'Persistent vomiting').", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable sinusitis in headache", "text": "The 'headache worse on bending forward' alternative is dropped from the OR.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tick bite fever in headache", "text": "Only 'Tick bite' is used. 'Tick present' and the small dark scab (Eschar) alternatives are missing. Also, the rule does not require the 'No' answer to the sinusitis question.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Check for causes of headache not needing urgent attention", "text": "Fever is used via active_condition in the tick-bite and viral rules but is not in either check_for. That is acceptable because Fever is a recorded common symptom, but there is nothing to check for the 'past 3 days' timing.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Check for urgent headache conditions", "text": "Every red-box criterion is covered and the trigger (Headache) is right. But the red box's 'Manage and refer urgently' names 'malaria likely' (fever now or in past 3 days, and in a malaria area in past 3 months), and the file has no malaria-area finding and no probable Malaria rule; the same 'malaria likely' appears again in the non-urgent flow. House rule: every 'X likely' becomes a probable diagnosis.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Check for causes of headache not needing urgent attention", "text": "Omits two page discriminators: 'headache worse on bending forward' (third sinusitis criterion) and 'been in a malaria area in past 3 months' (malaria likely). Everything listed is on the page and nothing is invented.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable sinusitis in headache", "text": "Page: recent common cold AND any of {thick nasal/postnasal discharge, pain on pushing forehead/cheeks, headache worse on bending forward}. The or-list is missing 'headache worse on bending forward', so a patient with cold + positional headache alone never gets Sinusitis likely. Structure and probable level otherwise faithful.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose possible acute viral infection in headache", "text": "'If none of above' on the page also excludes 'in a malaria area in past 3 months' (malaria likely); the rule excludes only sinusitis signs and tick bite. Negation structure for the sinusitis question (no recent cold OR none of the signs) is faithful. possible is a defensible level for 'treat as'.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable migraine in headache", "text": "Page: recurrent, throbbing, disabling, with nausea or light/noise sensitivity, resolving completely within 72 hours, in a patient WITHOUT fever/body pain/recent cold. The rule keeps recurrent + throbbing + (nausea | photophobia | phonophobia) but drops 'disabling', the 72-hour resolution, and the No-branch gate, so it is broader than the page (fires alongside sinusitis/viral in a febrile patient). probable is right ('Migraine likely').", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "high", "ref": "Diagnose probable giant cell arteritis in headache", "text": "Page: 'Patient > 50 years, pain over temples' -> GCA likely. The rule has only Temporal headache; the age criterion is absent and the grammar cannot express patient age. As written, any adult with temple pain is labelled probable giant cell arteritis (CRP, same-day specialist discussion). Downgrade to possible or document the unexpressible criterion explicitly.", "detail": [{"checker": "backward-1", "severity": "high"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Check for urgent headache conditions", "text": "Check_for list omits Fever/BP items used by the priority rule and merges management; mostly aligned with the red box. Acceptable.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Check for causes of headache not needing urgent attention", "text": "Omits 'headache worse on bending forward' (sinusitis criterion), 'patient > 50 years' and fever/malaria items.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose probable sinusitis in headache", "text": "Page criterion 'headache worse on bending forward' is missing; otherwise structure faithful. Also should sit inside the 'fever+body pain or cold' Yes branch (cold is required, so ok).", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 47, "slug": "47-headache", "kind": "rule", "priority": "medium", "ref": "Diagnose possible acute viral infection in headache", "text": "Malaria-likely exclusion not encoded; 'if none of above' only approximated. Page says 'treat as', so possible is just // ---------- banners ----------
function renderBanners() {

    <input placeholder="note" value="${esc(cur.note || "")}">

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });

  } catch (err) { if (err && err.name === "AbortError") return }

}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;

    const head = flat(n[0]);

    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
