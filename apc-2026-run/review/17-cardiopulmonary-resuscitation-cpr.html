on_y": 91.6, "indent": 0, "parent": null, "text": "No pulse felt", "bbox": [511.4, 282.7, 559.5, 293.5], "key": "p17-1e19da66"}, {"id": "p17-rb1-e20", "page": 17, "box": 1, "kind_hint": "other", "section": "Pulseless electrical activity (PEA)", "section_y": 146.2, "indent": 0, "parent": null, "text": "Unsure", "bbox": [643.9, 282.7, 671.1, 293.5], "key": "p17-62f787e6"}, {"id": "p17-rb1-e21", "page": 17, "box": 1, "kind_hint": "other", "section": "Pulseless electrical activity (PEA)", "section_y": 146.2, "indent": 0, "parent": null, "text": "Pulse felt", "bbox": [741.9, 282.7, 776.6, 293.5], "key": "p17-5f95ac4f"}, {"id": "p17-rb1-e22", "page": 17, "box": 1, "kind_hint": "other", "section": "If patient has no pulse, record the time and start chest compressions", "section_y": 91.6, "indent": 0, "parent": null, "text": "PEA", "bbox": [589.7, 302.7, 604.6, 313.5], "key": "p17-dd662121"}, {"id": "p17-rb1-e23", "page": 17, "box": 1, "kind_hint": "other", "section": "Pulseless electrical activity (PEA)", "section_y": 146.2, "indent": 0, "parent": null, "text": "Stop CPR", "bbox": [741.8, 302.7, 778.5, 313.5], "key": "p17-59eba97e"}, {"id": "p17-rb1-e24", "page": 17, "box": 1, "kind_hint": "other", "section": "Pulseless electrical activity (PEA)", "section_y": 146.2, "indent": 0, "parent": null, "text": "and check breathing 16.", "bbox": [739.8, 312.7, 780.6, 343.5], "key": "p17-3976ccd4"}, {"id": "p17-rb1-e25", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 5, "parent": null, "text": "Immediately restart CPR, starting with chest compressions.", "bbox": [81.4, 322.7, 311.1, 333.5], "key": "p17-856517c1"}, {"id": "p17-rb1-e26", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 5, "parent": null, "text": "Give adrenaline1 1mL (1:1000 solution) IV, followed by 5mL sterile water or sodium chloride 0.9%. Repeat adrenaline every 2 cycles (every 3-5 minutes).", "bbox": [81.4, 332.7, 681.4, 343.5], "key": "p17-d3d1d501"}, {"id": "p17-rb1-e27", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 5, "parent": null, "text": "After every 2 minutes of CPR, pause compressions, recheck heart rhythm and manage as above.", "bbox": [81.4, 342.5, 464.1, 353.5], "key": "p17-5d8711c5"}, {"id": "p17-rb1-e28", "page": 17, "box": 1, "kind_hint": "header", "section": "While giving continuous CPR", "section_y": 362.6, "indent": 0, "parent": null, "text": "While giving continuous CPR", "bbox": [325.1, 362.6, 436.8, 373.6], "key": "p17-04208e07"}, {"id": "p17-rb1-e29", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 2, "parent": null, "text": "Doctor to consider intubation. If intubated, give 1 breath every 6 seconds and continuous chest compressions.", "bbox": [61.5, 372.7, 487.7, 383.6], "key": "p17-a9d132cd"}, {"id": "p17-rb1-e30", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 2, "parent": null, "text": "Look for and manage possible cause:", "bbox": [61.5, 382.7, 207.8, 393.6], "key": "p17-673e16f9"}, {"id": "p17-rb1-e31", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 3, "parent": "p17-rb1-e30", "text": "If trauma, diarrhoea/vomiting or dehydration2, give sodium chloride 0.9% 1L IV rapidly. Repeat if needed. If unsure, discuss with doctor.", "bbox": [67.2, 392.7, 592.9, 403.6], "key": "p17-f6e804ae"}, {"id": "p17-rb1-e32", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 3, "parent": "p17-rb1-e30", "text": "If glucose < 3 (< 4 if diabetes) or unable to measure 19. If temperature ≤ 35°C 18. If overdose/poisoning, discuss with specialist or poison helpline 200.", "bbox": [67.2, 402.7, 671.2, 413.6], "key": "p17-cd9acb7c"}, {"id": "p17-rb1-e33", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 3, "parent": "p17-rb1-e30", "text": "If more resonant/decreased breath sounds on 1 side or deviated trachea, tension pneumothorax likely. Insert large bore cannula above the 6th rib, anterior axillary line. Arrange urgent chest tube.", "bbox": [67.2, 412.6, 685.8, 433.6], "key": "p17-4ff37dc2"}, {"id": "p17-rb1-e34", "page": 17, "box": 1, "kind_hint": "header", "section": "Decide when to stop CPR", "section_y": 442.6, "indent": 0, "parent": null, "text": "Decide when to stop CPR", "bbox": [166.2, 442.6, 263.1, 453.6], "key": "p17-c722e4cf"}, {"id": "p17-rb1-e35", "page": 17, "box": 1, "kind_hint": "header", "section": "How to give chest compressions", "section_y": 446.9, "indent": 0, "parent": null, "text": "How to give chest compressions", "bbox": [528.2, 446.9, 655.5, 458.1], "key": "p17-426c53ca"}, {"id": "p17-rb1-e36", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 1, "parent": null, "text": "If ongoing VF/pVT, temperature ≤ 35°C, snake bite or overdose/poisoning, continue CPR and discuss/transfer urgently.", "bbox": [56.4, 452.8, 345.8, 473.6], "key": "p17-79aa55c6"}, {"id": "p17-rb1-e37", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "While giving continuous CPR", "section_y": 362.6, "indent": 1, "parent": null, "text": "Ensure patient is lying on firm surface. If on bed, use backboard or move patient onto floor.", "bbox": [399.9, 457.3, 751.9, 468.1], "key": "p17-668834bf"}, {"id": "p17-rb1-e38", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "While giving continuous CPR", "section_y": 362.6, "indent": 1, "parent": null, "text": "Place heel of one hand over lower half of sternum. Place heel of second hand on top of first hand.", "bbox": [399.9, 467.3, 758.7, 478.1], "key": "p17-b184c953"}, {"id": "p17-rb1-e39", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 1, "parent": null, "text": "If none of above or asystole after 20 minutes of continuous CPR or incurable underlying disease, consider stopping CPR in consultation with doctor.", "bbox": [56.4, 472.8, 353.5, 493.6], "key": "p17-b4c73754"}, {"id": "p17-rb1-e40", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "While giving continuous CPR", "section_y": 362.6, "indent": 1, "parent": null, "text": "Push down quickly, hard (depth of 5-6cm) and fast (100-120 per minute).", "bbox": [399.9, 477.3, 682.1, 488.1], "key": "p17-28aca3a5"}, {"id": "p17-rb1-e41", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "While giving continuous CPR", "section_y": 362.6, "indent": 1, "parent": null, "text": "Allow chest to return to normal shape between compressions.", "bbox": [399.9, 487.3, 642.4, 498.1], "key": "p17-55d5bc3f"}, {"id": "p17-rb1-e42", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "Ventricular fibrillation (VF)", "section_y": 136.2, "indent": 2, "parent": "p17-rb1-e39", "text": "If CPR stopped, pronounce dead and arrange bereavement counselling for family.", "bbox": [62.1, 492.8, 370.6, 503.6], "key": "p17-31747a83"}, {"id": "p17-rb1-e43", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "While giving continuous CPR", "section_y": 362.6, "indent": 1, "parent": null, "text": "Do not interrupt compressions unless giving ventilations or checking heart rhythm.", "bbox": [399.9, 497.3, 723.4, 508.1], "key": "p17-2c45f8e0"}, {"id": "p17-rb1-e44", "page": 17, "box": 1, "kind_hint": "unclassified", "section": "While giving continuous CPR", "section_y": 362.6, "indent": 1, "parent": null, "text": "Swop with colleague every 2 minutes to avoid fatigue.", "bbox": [399.9, 507.3, 612.3, 518.1], "key": "p17-c3fb1162"}, {"id": "p17-out-e01", "page": 17, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Adrenaline is also known as epinephrine. 2 Thirst, dry mouth, poor skin turgor, BP < 90/60, dehydration likely.", "bbox": [34.0, 543.3, 369.2, 551.8], "key": "p17-548401ca"}, {"id": "p17-out-e02", "page": 17, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "CARDIOPULMONARY RESUSCITATION (CPR)", "bbox": [243.4, 48.7, 598.5, 71.0], "key": "p17-a6a7320b"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 532.2]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAOhCAIAAADDkuUJAAAACXBIWXMAABcSAAAXEgFnn9JSAAR2hUlEQVR4nOx9B3cUx7b1+yHfWs/3DgYMD2wwYLKJNjnnHExOIpgcTDIZgzE555xzjgIBAglJSEQhEUXO2Xi+rTmoXHT3dPcojmDvtdesmerqCqdOVdc5U1X9Pw//Xw6SJEmSJEmSJEmSJEmSzF78nywvAUmSJEmSJEmSJEmSJEkGSnq1SJIkSZIkSZIkSZIkyezHT7xab5b2e7tmCEmSJEmSJEmSJEmSJEkGIV9N/sXaq+V9dML793mSJEmSJEmSJEmSJEmSDEJ+OL2QXi2SJEmSJEmSJEmSJEkym5FeLZIkSZIkSZIkSZIkSTL7kV4tkiRJkiRJkiRJkiRJMvuRXi2SJEmSJEmSJEmSJEky+5FeLZIkSZIkSZIkSZIkSTL7kV4tkiRJkiRJkiRJkiRJMvuRXi2SJEmSJEmSJEmSJEky+5FeLZIkSZIkSZIkSZIkSTL7kV4tkiRJkiRJkiRJkiRJMvuRXi2SJEmSJEmSJEmSJEky+5FeLZIkSTKVjDy7c+HCaYsW/ZVw9UgmZPfs4ZnMqVfSzeP79qwGr146lOVCzhweP7ZJqpzlJckc3rsdJvW9cvGgm/hxMfsk/qN7pzKoSJmm3unIv99Ei1hOn9yW5YVxz0xoTRJ8/zr69fPILC8GSZIk+dmTXi2SJEnSgZcvHOw/oA+4bu18FTh8+CDP/34l3LBhYYYW4J/35xs2apjLk2PBgmmZUN8tm5dIvf76a0KWCz9zWKVyFalylpckc7hvz2qp7+TJv7uJP3TYQIl/8sSWdC9MJqt3OvLZwzMilqbNmmZ5YdwzQ1uTFN64drRY0WIFvvsue3k8SZIkyexIerVIkiRJBx4/tkmMQFiDErJv7xoJyfHVfxo3bnT0yMZ0zO7e7bD16xcir1NhWyXk0b1TsPmRXefOHdIli0txBxYvntGnT8jzRxYLZOjV+uxp79UKO75lxoxJo0YNVSHp6AfJBPXONKbOq2Xf+9IiSZfMIK/W6+eRe3avGj9+5LJls7K8abKce1O62Lx5U7O8MCRJkuTnTXq1SJIkSQeavVqDBveTkJ07VqR7dnPnTpHEd+1cqQK3bFk6YuSQyxdc7RdzZKdOHSQLyy1I9Gp99rT3auX9Jg8u1a5dW4Wkox8kE9Q705g6r5Z970ujJN0wg7xakWd3SrKjRw/L8qbJcr5/HT1z5iT0rycPwrO8MCRJkuTnTXq1SJIkSQcavFqwvRs2aigh4ae2x182Hj519dKhS3EH7t8J8/rOqNq/b825iF1/v nomed_concept \"Unilateral\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased skin turgor\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperresonance\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Trachea displaced\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Xerostomia\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "priority_condition": {"only_A": [], "only_B": [], "both": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Absent pulse\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cardiac arrest\" \"disorder\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis_condition": {"only_A": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Increased thirst\" \"finding\"))"], "only_B": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Thirst due to water deprivation\" \"finding\"))"], "both": ["(< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)", "(< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Absent pulse\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Absent pulse\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cardiac arrest\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cardiac arrest\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased breath sounds\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Decreased skin turgor\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperresonance\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Trachea displaced\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Xerostomia\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Dehydration\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Tension pneumothorax\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 17 – Cardiopulmonary resuscitation (CPR): flowchart\n\nSource: APC 2026 e-book page 17 (red box).\n\n```mermaid\nflowchart TD\n    START[\"Patient has no pulse:<br/>record the time, start chest compressions<br/>30:2 with bag-valve-mask, 100% O2\"] --> RHY[\"Attach monitor/defibrillator,<br/>pause compressions, check initial rhythm\"]\n    RHY --> VF[\"VF\"] & PVT[\"pVT\"] & ASY[\"Asystole\"] & PEA0[\"Any other rhythm: PEA\"]\n    VF --> SHOCK1[\"Shock 120-150J (360J monophasic)\"]\n    PVT --> SHOCK1\n    SHOCK1 --> CPR1[\"Restart CPR; after 2 min recheck rhythm\"]\n    ASY --> CPR1\n    PEA0 --> CPR1\n    CPR1 --> VF2[\"VF / pVT\"] --> SHOCK2[\"Shock (increase joules)\"] --> CPR2\n    CPR1 --> ASY2[\"Asystole\"] --> CPR2\n    CPR1 --> OTH[\"Other rhythm\"] --> PULSE[\"Feel carotid pulse ≤ 10 s\"]\n    PULSE -- \"No pulse felt / Unsure\" --> PEA[\"PEA\"] --> CPR2[\"Restart CPR; adrenaline every 2 cycles;<br/>recheck rhythm every 2 min, manage as above\"]\n    PULSE -- \"Pulse felt\" --> STOP[\"Stop CPR, check breathing → 16\"]\n    CPR2 --> CPR1\n    CPR2 --> CAUSE[\"While giving CPR: look for and manage possible cause\"]\n    CAUSE --> TP[\"More resonant / decreased breath sounds on 1 side<br/>or deviated trachea → tension pneumothorax likely\"]\n    CAUSE --> DEH[\"Trauma, diarrhoea/vomiting or dehydration²<br/>(² thirst, dry mouth, poor skin turgor, BP &lt; 90/60: dehydration likely)\"]\n    CAUSE --> OTHERC[\"Glucose → 19; temperature ≤ 35°C → 18;<br/>overdose/poisoning → 200\"]\n    CAUSE --> DECIDE[\"Decide when to stop CPR\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Patient has no pulse | `(or Cardiac arrest, Absent pulse)` → Emergency | `Emergency: no pulse, start CPR` |\n| Look for possible cause (trigger) | Same `or` as the task's `due_to` | `Check for reversible causes during CPR` |\n| Tension pneumothorax likely | no pulse **and** any of unilateral hyperresonance, unilateral decreased breath sounds, trachea displaced | `Diagnose probable tension pneumothorax during CPR` |\n| Dehydration likely (footnote 2) | no pulse **and** any of thirst, xerostomia, decreased skin turgor, SBP < 90, DBP < 60 | `Diagnose probable dehydration during CPR` |\n| Rhythm branches (VF, pVT, asystole, PEA), pulse check, shocks, adrenaline | Not modelled: they route only to management | — |\n| Glucose / temperature / overdose pointers | Cross-references to pages 19, 18, 200 | — |\n| Decide when to stop CPR | Not modelled: management decision | — |\n", "questions": "# Page 17 – Cardiopulmonary resuscitation (CPR): remaining questions\n\n## Decisions made\n\n- **Emergency priority for no pulse.** `(or Cardiac arrest, Absent pulse)` is the trigger and the\n  `Emergency` priority. Cardiac arrest is the adult Emergency warning sign. Absent pulse is the\n  page's literal \"no pulse\". Emergency because the page is CPR (Will's briefing names CPR as explicit\n  escalation).\n- **Tension pneumothorax likely → probable.** \"on 1 side\" is applied to both \"more resonant\" and\n  \"decreased breath sounds\" (`Unilateral` qualifier). The rule is scoped to the no-pulse context,\n  because the page lists it under \"While giving continuous CPR … look for possible cause\".\n- **Footnote 2, dehydration likely → probable.** Read as any one of thirst, dry mouth, poor skin\n  turgor or BP < 90/60 (systolic < 90 or diastolic < 60). Scoped to the no-pulse context because the\n  footnote marks \"dehydration\" in the CPR cause search, so this page does not create a book-wide\n  definition of dehydration.\n- **Rhythms, shocks, adrenaline, pulse re-check, intubation, stop-CPR decisions** are management\n  and flowchart routing. They are accounted for in provenance, not encoded. No `manage` tasks.\n- **The other causes** (trauma, diarrhoea/vomiting, glucose, temperature ≤ 35°C, overdose/poisoning,\n  snake bite) lead only to management or to other pages (18, 19, 200). Checking for them here would\n  give findings that no rule on this page consumes, so they are not in the `check_for`. Glucose and\n  temperature are routine vitals, so no `measure` task.\n- No `Shock/SBP < 80` wording appears on this page.\n- **Reconciler:** the two builds differed only in the SNOMED concept for \"Thirst\"; the final build\n  uses `Thirst due to water deprivation` (see SNOMED gaps and Questions).\n\n## Could not model\n\n- The cardiac rhythms (VF, pVT, asystole, PEA) and the 2-minute rhythm-check loop: these are\n  management routing, and they are out of scope for this pass.\n- \"Record the time\": there is no task form for a timestamp.\n- \"Asystole after 20 minutes of continuous CPR\" (stopping CPR) is a management decision.\n\n## SNOMED gaps\n\n- \"Dry mouth\" (finding) does not exist; `Xerostomia` (finding) was used instead.\n- \"Thirst\": there is no active `Thirst` (finding). `Thirst due to water deprivation` (finding) was\n  used, as in VHA's vocabulary. Alternatives: its sibling `Increased thirst` (finding), which does not\n  presume a cause, and the grouper `Thirst finding` (includes normal/reduced thirst).\n- \"More resonant\": `Hyperresonance` (finding) with the `Unilateral` qualifier; there is no\n  precoordinated unilateral hyperresonance concept.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Does footnote 2 mean any one sign, or a combination? With \"any one\", a single low BP during an\n  arrest (nearly always present when BP is recorded) gives probable dehydration.\n- Should tension pneumothorax and dehydration also be diagnosed outside cardiac arrest from this\n  page (footnote 2 may be a general definition that recurs on other pages), or only during CPR (as\n  encoded here)?\n- For \"Thirst\" as a dehydration sign, is `Thirst due to water deprivation` the right concept, or\n  should it be `Increased thirst`?\n- Is it useful to record the monitor rhythm (VF/pVT/asystole/PEA) as findings for later pages, even\n  though this page uses them only for management?\n", "claims": [{"claim_id": "c001", "rule": "Check for reversible causes during CPR", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Cardiac arrest\" \"disorder\"))", "element_keys": ["p17-4dcb9379"], "quote": "no pulse"}, {"claim_id": "c002", "rule": "Check for reversible causes during CPR", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Absent pulse\" \"finding\"))", "element_keys": ["p17-4dcb9379"], "quote": "no pulse"}, {"claim_id": "c003", "rule": "Check for reversible causes during CPR", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Hyperresonance\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))", "element_keys": ["p17-4ff37dc2"], "quote": "more resonant"}, {"claim_id": "c004", "rule": "Check for reversible causes during CPR",  "Use (snomed_concept \"Carotid pulse absent\" \"finding\") (exists) or rely on Cardiac arrest alone.", "confidence": "high"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Emergency: no pulse, start CPR", "text": "The priority rule's evidence (Cardiac arrest, Absent pulse) is not checked for anywhere in this file, so it satisfies the house test only if one of those concepts is a registered warning sign or common symptom. If neither is, the rule has no trigger the system records and the test's priority-evidence constraint fails. The same two findings are the due_to of the check_for task and the and-gate of both probable rules, so everything on the page hangs on them being recordable.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "whole file", "text": "The page's discriminating finding, the heart rhythm (VF / pVT / asystole / PEA), appears nowhere. Every flowchart branch and the 'decide when to stop CPR' box turn on it, and SNOMED has exact concepts for all four. The file encodes only the two 'look for cause' diagnoses and the entry trigger, so the flowchart is lost.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "whole file", "text": "Expressible thresholds dropped: glucose < 3 mmol/L (< 4 if diabetic) and temperature ≤ 35 °C are routine vitals with units in the language, and the page uses them twice (reversible causes; decide when to stop). Possible Hypoglycemia and possible Hypothermia rules gated on cardiac arrest would carry them and hand off to pages 19 and 18.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Check for reversible causes during CPR", "text": "Trauma, snake bite and overdose/poisoning are reversible causes the page tells the worker to look for and none is in the check_for. Adding them needs a consuming rule (a possible diagnosis or priority) to pass the 'checked for but never used' test, which is probably why they were omitted; the omission should at least be recorded as a known gap.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Check for reversible causes during CPR / Diagnose probable dehydration during CPR", "text": "'Thirst due to water deprivation' (finding) is a child of 'Thirst finding' (finding) and asserts a cause the page does not; the page says only 'thirst'. The parent concept exists and is the closer match.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Diagnose probable dehydration during CPR", "text": "Diarrhoea/vomiting are listed by the page alongside dehydration as reasons for the fluid bolus; they are common symptoms so no check item is needed, but no rule on this page consumes them. Defensible under the no-manage-tasks rule; noted so the gap is deliberate.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Diagnose probable dehydration during CPR", "text": "'Thirst due to water deprivation' is narrower than the page's 'thirst'; use a plain Thirst concept. Also in check_for.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "high", "ref": "Check for reversible causes during CPR", "text": "check_for omits hypoglycaemia, hypothermia, overdose/poisoning, trauma and diarrhoea/vomiting, all listed under 'Look for possible cause'.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tension pneumothorax during CPR", "text": "'Trachea displaced' typed as disorder while page says 'deviated trachea' (a finding); verify concept and type. Check hierarchy of 'Hyperresonance' vs a percussion finding.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Emergency: no pulse, start CPR", "text": "Trigger includes 'Cardiac arrest' disorder as well as Absent pulse; fine, but the page's 'pulse felt -> stop CPR' branch is not modelled (acceptable).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "high", "ref": "(whole file)", "text": "No rules for hypoglycaemia, hypothermia, poisoning/snake bite and no rhythm findings (VF/pVT/asystole/PEA).", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Diagnose probable dehydration during CPR", "text": "Flat OR of five items including systolic < 90 and diastolic < 60 separately: in a pulseless patient any recorded low BP (or one dry-mouth finding) yields probable dehydration. The page's 'BP < 90/60' is one criterion, and the footnote list most plausibly means the cluster suggests dehydration; consider any2 with BP as a single (or ...) group.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Check for reversible causes during CPR", "text": "'Thirst due to water deprivation' is a cause-specific concept; 'Increased thirst' is the closer match to the page's 'thirst'. Because evidence matches by descendants, the chosen concept will not catch a generic thirst finding.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Check for reversible causes during CPR / whole file", "text": "Reversible causes named on the page (hypoglycaemia glucose < 3 / < 4 if diabetes, hypothermia ≤ 35°C, overdose/poisoning) have no rule; they are cross-references to pp. 19/18/200 so this is defensible, but no possible-diagnosis hooks exist to route to those pages.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Emergency: no pulse, start CPR", "text": "Evidence (Cardiac arrest / Absent pulse) is not in any check_for; it appears only as the task due_to. Passes test 5 only if these are warning signs or if due_to counts; worth confirming with the test. Also, recording 'Cardiac arrest' as a clinical_finding during triage presupposes the user records it that way.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "medium", "ref": "Check for reversible causes during CPR", "text": "Nothing in it is invented, but it checks only the tension-pneumothorax signs and the dehydration footnote signs. The page's 'Look for and manage possible cause' list also names trauma, diarrhoea/vomiting, overdose/poisoning (glucose and temperature are routine vitals), and the stop-CPR box adds snake bite and ongoing VF/pVT; none of these is checked for, and the page's rhythm branches (VF / pVT / asystole / PEA, pulse felt after 2 minutes) are not represented anywhere. Also carries the narrower 'Thirst due to water deprivation' (c006).", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "pr ue to water deprivation' is narrower than the page.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "rule", "priority": "high", "ref": "Emergency: no pulse, start CPR", "text": "Emergency level justified (no pulse/CPR). But 'Absent pulse' matches descendants such as 'Radial pulse absent', 'Femoral pulse absent' etc., so a patient with an absent limb pulse would be flagged Emergency/CPR. Replace with 'Carotid pulse absent' or Cardiac arrest only.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "build_disagreement", "priority": "medium", "ref": "check_for", "text": "A: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Increased thirst\" \"finding\"))  vs  B: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Thirst due to water deprivation\" \"finding\"))", "detail": [{"choice": "B", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Thirst due to water deprivation\" \"finding\"))", "reason": "Footnote 2 says only \"Thirst\" as a sign of dehydration; neither sibling under 'Thirst finding' is the bare word, so the concept already in VHA's vocabulary (and whose sense, thirst from fluid lack, matches 'dehydration likely') is kept for cross-page consistency.", "unsettled": true}]}, {"page": 17, "slug": "17-cardiopulmonary-resuscitation-cpr", "kind": "build_disagreement", "priority": "medium", "ref": "diagnosis_condition", "text": "A: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Increased thirst\" \"finding\"))  vs  B: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Thirst due to water deprivation\" \"finding\"))", "detail": [{"choice": "B", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Thirst due to water deprivation\" <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {

  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }

}

const ruleSource = (() => {

  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
