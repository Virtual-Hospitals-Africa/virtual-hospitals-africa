": "p80-out-e23", "page": 80, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "lump/s or changes in skin colour? • Check for pregnancy 174. • Check for kidney disease on urine dipstick: if blood or protein, check BP 148 and refer to doctor. • If none of the above or unsure of diagnosis, refer same week.", "bbox": [373.3, 381.0, 785.3, 511.2], "key": "p80-6ea7a3a4"}, {"id": "p80-out-e24", "page": 80, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Sprain/strain likely • Rest and elevate leg. • Apply ice and a pressure bandage. • Give ibuprofen2 400mg 8 hourly with/after food and paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed for up to 5 days. • Advise to mobilise leg after 2-3 days, even if mild to moderate pain. • Refer for physiotherapy. • Review after 1 week: if no better, arrange x-ray and doctor review.", "bbox": [477.9, 370.2, 611.4, 511.2], "key": "p80-f2697575"}, {"id": "p80-out-e25", "page": 80, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Pain in buttock radiating down back of lower leg", "bbox": [40.5, 320.1, 218.3, 330.3], "key": "p80-bb8b14ed"}, {"id": "p80-out-e26", "page": 80, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Refer.", "bbox": [745.2, 431.9, 765.0, 442.1], "key": "p80-137a4f98"}, {"id": "p80-out-e27", "page": 80, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Irritation of sciatic nerve likely • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed for up to 5 days. • If no better, add ibuprofen2 400mg 8 hourly with/after food for up to 5 days. • Advise to be as active as possible, continue normal activity and avoid bed rest. • If available, refer for physiotherapy. • Explain that pain does not always mean a disease/cancer, and tests cannot always show a reason for the pain and often are not needed. • Advise to return and refer same day if: - Retention/incontinence of urine or stool - Numbness of buttocks/perineum/legs - Leg weakness - Difficulty walking. • If pain ≥ 3 months, assess 76 and refer to confirm diagnosis.", "bbox": [39.7, 344.8, 220.9, 525.8], "key": "p80-0632bacf"}, {"id": "p80-out-e28", "page": 80, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1BMI = weight (kg) ÷ height (m) ÷ height (m). 2Avoid if peptic ulcer, asthma, hypertension, heart failure, kidney disease, pregnant.", "bbox": [34.1, 543.2, 428.1, 551.7], "key": "p80-1f315ad6"}], "boxes": [{"box": 1, "rect": [35.5, 129.8, 806.4, 203.0]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAACZCAIAAAAaU3pUAAAACXBIWXMAABcSAAAXEgFnn9JSAACy0UlEQVR4nOy9d3BUR/c2+O5++8fW76vvn63a3aqv9qvXDEgIRE4iCkQQYILIOYmco8g5YzBgwIBFzhlMFgIkEQVICEQw2SSDDSYZDBiw/c4+moMOzQ09d0YSkvCpempqpm/fvqe7T58+55nuvv968v/lEwgEAoFAIBAIBAKBQCAQCHIX/pXtEggEAoFAIBAIBAKBQCAQCAS+QlgtgUAgEAgEAoFAIBAIBAJB7sNHrNbv/bq+jOopEAgEAoFAIBAIBAKBQCAQ5EC8aN/SmtX6+0mS+88fBAKBQCAQCAQCgUAgEAgEghyId4mbhdUSCAQCgUAgEAgEAoFAIBDkMgirJRAIBAKBQCAQCAQCgUAgyH0QVksgEAgEAoFAIBAIBAKBQJD7IKyWQCAQCAQCgUAgEAgEAoEg90FYLYFAIBAIBAKBQCAQCAQCQe6DsFoCgUAgEAgEAoFAIBAIBILcB2G1BAKBQCAQCAQCgUAgEAgEuQ/CagkEAoFAIBAIBAKBQCAQCHIfhNUSCAQCgUAgEAgEAoFAIBDkPgirJRAIBAKBQCAQCAQCgUAgyH0QVksgEAgEWYUXT5P/fnsh28UQaPD8yalsl8E5jh1aE7t3CZDtklji7avU1y9Ssl0MPwT7+e5hatgbV/Z5Le2Hczsp85OHidleNYFzvHt9jjru1PEN2S6MHmeSti7+buKS6Im3ru/PdmEEAoFAkMMhrJZAIBAI/MfhuFXfzhk9sG9kq+b1enVvPXl8/xPH1tOl3TsW5s+Xt0JIyRdPZULJoRg/po/r3//u0rFZtkviEFUqhUBgINslMePOjwdLFC1UqED+nEYZOBHs+83zqGFnfz3ca4FDo7pQZh7sglyB509OUcc1rB+e7cJoMGJIN5IT2LLhm2yXRyAQCAQ5HMJqCQQCgcAfnEv5vknDWhx7MDq2b0IZxo3uQylnk7dmu7RZitcvUvbtXjRpXP+Vy6b5cfvVH/YsWzS5V/fWKv1nmZjpQtYOr4wOKlww6N3rc5neLBmsgqXAOYfVMtcuds9iku27b8dlyiMSj6ybO2vk6BE9M1iOWTBzycJqqcjgiM6xyBWs1v6YJTyb1K9T7XDcqmwXSSAQCAQ5HMJqCQQ oms\n;; See 80-leg-symptoms-flowchart.md for the decision nodes behind each rule.\n(task\n  \"Check for urgent leg symptom conditions\"\n  adult\n  (or (clinical_finding (snomed_concept \"Finding of lower limb\" \"finding\"))\n      (clinical_finding (snomed_concept \"Muscle pain\" \"finding\")))\n  (check_for\n    ;; Fracture: unable to bear weight following injury\n    (clinical_finding (snomed_concept \"Unable to weight-bear\" \"finding\"))\n    (clinical_finding (snomed_concept \"Injury of lower limb\" \"disorder\"))\n\n    ;; DVT: swelling and pain in one calf\n    (clinical_finding (snomed_concept \"Swollen calf\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Pain in calf\" \"finding\"))\n\n    ;; Acute limb ischaemia: sudden severe leg pain at rest with numbness, weakness, pallor or no pulse in the leg\n    (clinical_finding (snomed_concept \"Pain in lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"At rest\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\"))\n    (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\"))\n    (clinical_finding (snomed_concept \"White discoloration of skin\" \"finding\") (finding_site (snomed_concept \"Lower limb structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Absent pulse\" \"finding\") (finding_site (snomed_concept \"Lower limb structure\" \"body structure\")))\n\n    ;; Critical limb ischaemia: muscle pain on exercise with pain at rest, ulcer or gangrene\n    (clinical_finding (snomed_concept \"Intermittent claudication\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain in lower limb\" \"finding\") (qualifier (snomed_concept \"At rest\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Ulcer of lower extremity\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Gangrenous disorder\" \"disorder\") (finding_site (snomed_concept \"Lower limb structure\" \"body structure\")))\n  )\n)\n(task\n  \"Check leg symptoms not needing urgent attention\"\n  adult\n  (or (clinical_finding (snomed_concept \"Finding of lower limb\" \"finding\"))\n      (clinical_finding (snomed_concept \"Muscle pain\" \"finding\")))\n  (check_for\n    ;; Screen for joint problem\n    (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n    (clinical_finding (snomed_concept \"Tenderness of joint\" \"finding\"))\n    (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n    (clinical_finding (snomed_concept \"Difficulty walking\" \"finding\"))\n    (clinical_finding (snomed_concept \"Difficulty sitting down\" \"finding\"))\n    (clinical_finding (snomed_concept \"Difficulty standing up\" \"finding\"))\n\n    ;; Is there leg swelling?\n    (clinical_finding (snomed_concept \"Swelling of lower limb\" \"finding\"))\n    (clinical_finding (snomed_concept \"Swelling of bilateral lower limbs\" \"finding\"))\n    (clinical_finding (snomed_concept \"Orthopnea\" \"finding\"))\n\n    ;; No leg swelling: ask about leg pain/discomfort\n    (clinical_finding (snomed_concept \"Pain in buttock\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain radiating to left leg\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain radiating to right leg\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable fracture of leg (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Fracture of lower limb\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Red box: unable to bear weight following injury\n  (and (clinical_finding (snomed_concept \"Unable to weight-bear\" \"finding\"))\n       (clinical_finding (snomed_concept \"Injury of lower limb\" \"disorder\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable DVT (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Deep venous thrombosis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Red box: swelling and pain in one calf. The \"especially if\" risk factors are not required.\n  (and (clinical_finding (snomed_concept \"Swollen calf\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n       (clinical_finding (snomed_concept \"Pain in calf\" \"finding\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable acute limb ischaemia (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Acute lower limb ischemia\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Red box: sudden severe leg pain at rest with any of numbness, weakness, pallor, no pulse in the leg\n  (and (clinical_finding (snomed_concept \"Pain in lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"At rest\" \"qualifier value\")))\n       (or (clinical_finding (snomed_concept \"Numbness of lower limb\" \"finding\"))\n           (clinical_finding (snomed_concept \"Weakness of muscle of lower limb\" \"finding\"))\n           (clinical_finding (snomed_concept \"White discoloration of skin\" \"finding\") (finding_site (snomed_concept \"Lower limb structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Absent pulse\" \"finding\") (finding_site (snomed_concept \"Lower limb structure\" \"body structure\")))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable critical limb ischaemia (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Critical lower limb ischemia\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Red box: muscle pain in legs or buttocks on exercise associated with pain at rest, ulcer or gangrene\n  (and (clinical_finding (snomed_concept \"Intermittent claudication\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Pain in lower limb\" \"finding\") (qualifier (snomed_concept \"At rest\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Ulcer of lower extremity\" \"disorder\"))\n           (clinical_finding (snomed_concept \"Gangrenous disorder\" \"disorder\") (finding_site (snomed_concept \"Lower limb structure\" \"body structure\")))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable joint problem (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Arthropathy\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Screen: joint warm/tender/swollen or unable to walk, sit and stand up comfortably\n  (or (clinical_finding (snomed_concept \"Joint warm\" \"finding\"))\n      (clinical_finding (snomed_concept \"Tenderness of joint\" \"finding\"))\n      (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n      (clinical_finding (snomed_concept \"Difficulty walking\" \"finding\"))\n      (clinical_finding (snomed_concept \"Difficulty sitting down\" \"finding\"))\n      (clinical_finding (snomed_concept \"Difficulty standing up\" \"finding\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable sciatic nerve irritation (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Sciatica\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = No (no leg swelling) → pain in buttock radiating down back of lower leg\n  (and (no (clinical_finding (snomed_concept \"Swelling of lower limb\" \"finding\")))\n       (clinical_finding (snomed_concept \"Pain in buttock\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Pain radiating to left leg\" \"finding\"))\n           (clinical_finding (snomed_concept \"Pain radiating to right leg\" \"finding\"))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable peripheral vascular disease (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Peripheral vascular disease\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = No (no leg swelling) → muscle pain in legs or buttocks on exercise that is relieved by rest\n  (and (no (clinical_finding (snomed_concept \"Swelling of lower limb\" \"finding\")))\n       (clinical_finding (snomed_concept \"Intermittent claudication\" \"finding\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable heart failure (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Heart failure\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = Yes → both legs swollen → Q2 = Yes: difficulty breathing worse on lying flat\n  (and (clinical_finding (snomed_concept \"Swelling of bilateral lower limbs\" \"finding\"))\n       (clinical_finding (snomed_concept \"Orthopnea\" \"finding\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable sprain (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Sprain of ligament of lower limb\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = Yes → swelling over one joint → Q3 = Yes: recent injury\n  (and (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n       (clinical_finding (snomed_concept \"Injury of lower limb\" \"disorder\")))\n)\n(system_diagnosis_rule\n  \"Diagnose probable strain (leg symptoms)\"\n  (diagnosis\n    (snomed_concept \"Strain of muscle of lower limb\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = Yes → swelling over one joint → Q3 = Yes: recent injury (\"Sprain/strain likely\")\n  (and (clinical_finding (snomed_concept \"Joint swelling\" \"finding\"))\n       (clinical_finding (snomed_concept \"Injury of lower limb\" \"disorder\")))\n)\n(system_priority_evaluation\n  \"Urgent: leg symptoms with fracture, DVT or limb ischaemia\"\n  adult\n  Urgent\n  (and (or (clinical_finding (snomed_concept \"Finding of lower limb\" \"finding\"))\n           (clinical_finding (snomed_concept \"Muscle pain\" \"finding\")))\n       (or (active_condition (snomed_concept \"Fracture of lower limb\" \"disorder\"))\n           (active_condition (snomed_concept \"Deep venous thrombosis\" \"disorder\"))\n           (active_condition (snomed_concept \"Acute lower limb ischemia\" \"disorder\"))\n           (active_condition (snomed_concept \"Critical lower limb ischemia\" \"disorder\"))))\n)\n", "rules": [{"atom": "task", "description": "Check for urgent leg symptom conditions", "ages": ["adult"], "raw": "(task \"Check for urgent leg symptom conditions\" \"adult\" (or (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Finding of lower limb\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Muscle pain\" \"finding\"))) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to weight-bear\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Injury of lower limb\" \"disorder\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swollen calf\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pain in calf\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pain in lower limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"At rest\" \"qualifier value\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Numbness of lower limb\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of muscle of lower limb\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"White discoloration of skin\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Lower limb structure\" \"body structure\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Absent pulse\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Lower limb structure\" \"body structure\"))) (finding (s pt \"Arthropathy\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Critical lower limb ischemia\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Fracture of lower limb\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Heart failure\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Peripheral vascular disease\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Sciatica\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Sprain of ligament of lower limb\" \"disorder\") probable)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Deep venous thrombosis\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Deep venous thrombosis of lower extremity\" \"disorder\") probable)", "relation": "B_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 80 – Leg symptoms: flowchart\n\nSource: APC 2026 e-book page 80. Screening bullets, red box, then the approach\nto the patient not needing urgent attention.\n\n```mermaid\nflowchart TD\n    START[\"Leg symptoms\"] --> SCREEN[\"Screen for joint problem: check joints; ask patient to walk,<br/>sit and stand up with arms folded\"]\n    SCREEN -- \"joint warm/tender/swollen or unable to do all actions comfortably\" --> JOINT[\"Joint problem likely → 77\"]\n    START --> FOOT[\"Problem only in the foot → 81\"]\n    START --> RB{\"Red box: any of\"}\n    RB --> FX[\"Unable to bear weight following injury:<br/>fracture likely → 30\"]\n    RB --> DVT[\"Swelling and pain in one calf:<br/>deep venous thrombosis likely\"]\n    RB --> ALI[\"Sudden severe leg pain at rest with numbness, weakness,<br/>pallor or no pulse in the leg: acute limb ischaemia likely\"]\n    RB --> CLI[\"Muscle pain in legs/buttocks on exercise with pain at rest,<br/>ulcer or gangrene: critical limb ischaemia likely\"]\n    FX & DVT & ALI & CLI --> URG[\"Urgent: refer urgently\"]\n    START --> STATIN[\"On simvastatin/atorvastatin/rosuvastatin with muscle pain/cramps<br/>or weakness: discuss with doctor/specialist\"]\n    START --> Q1{\"Is there leg swelling?\"}\n    Q1 -- No --> PAIN[\"Ask about leg pain/discomfort\"]\n    PAIN --> SCI[\"Pain in buttock radiating down back of lower leg:<br/>irritation of sciatic nerve likely\"]\n    PAIN --> PVD[\"Muscle pain in legs or buttocks on exercise relieved by rest:<br/>peripheral vascular disease likely → 154\"]\n    Q1 -- Yes --> BOTH[\"Both legs swollen\"]\n    Q1 -- Yes --> ONE[\"Swelling over one joint\"]\n    BOTH --> Q2{\"Difficulty breathing worse on lying flat?\"}\n    Q2 -- Yes --> HF[\"Heart failure likely → 151\"]\n    Q2 -- No --> OTHER[\"Check for pregnancy 174; urine dipstick for kidney disease;<br/>if none or unsure, refer same week\"]\n    ONE --> Q3{\"Recent injury?\"}\n    Q3 -- Yes --> SPR[\"Sprain/strain likely\"]\n    Q3 -- No --> Q4{\"Painful areas, ulcer/s, lump/s or<br/>changes in skin colour?\"}\n    Q4 -- Yes --> SKIN[\"→ 82\"]\n    Q4 -- No --> REF[\"Refer\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Leg symptoms (presenting complaint) | `Finding of lower limb` (descendants match: leg pain, leg/calf swelling, leg numbness/weakness) **or** `Muscle pain` (recorded common symptom; covers intermittent claudication) | due_to of both `check_for` tasks; first term of the priority rule |\n| Red box, fracture | Unable to weight-bear **and** injury of lower limb | `Diagnose probable fracture of leg (leg symptoms)` |\n| Red box, DVT | Unilateral calf swelling **and** calf pain. Risk factors (\"especially if …\") not required | `Diagnose probable DVT (leg symptoms)` |\n| Red box, acute limb ischaemia | Sudden, severe leg pain at rest **and** any of leg numbness, leg weakness, white discoloration of skin sited to the leg, absent pulse in leg | `Diagnose probable acute limb ischaemia (leg symptoms)` |\n| Red box, critical limb ischaemia | Intermittent claudication **and** any of leg pain at rest, leg ulcer, gangrene of leg | `Diagnose probable critical limb ischaemia (leg symptoms)` |\n| Red box → Urgent | Complaint **and** any of the four diagnoses above | `Urgent: leg symptoms with fracture, DVT or limb ischaemia` |\n| Joint screen | Any of joint warm, joint tender, joint swelling, difficulty walking, difficulty sitting down, difficulty standing up | `Diagnose probable joint problem (leg symptoms)` |\n| Q1 = No → buttock pain radiating down leg | No leg swelling **and** buttock pain **and** pain radiating to left/right leg | `Diagnose probable sciatic nerve irritation (leg symptoms)` |\n| Q1 = No → exercise pain relieved by rest | No leg swelling **and** intermittent claudication | `Diagnose probable peripheral vascular disease (leg symptoms)` |\n| Q1 = Yes → both legs → Q2 = Yes | Bilateral leg swelling **and** orthopnoea | `Diagnose probable heart failure (leg symptoms)` |\n| Q1 = Yes → one joint → Q3 = Yes | Joint swelling **and** injury of lower limb | `Diagnose probable sprain (leg symptoms)`, `Diagnose probable strain (leg symptoms)` |\n| Q2 = No, Q3 = No → Q4, foot only, statin | Routing and management (check pregnancy, dipstick, refer, → 82, → 81, discuss) | Not modelled (see provenance) |\n", "questions": "# Page 80 – Leg symptoms: remaining questions\n\nFinal (reconciled) build. Base: builder A, with builder B's trigger, sitting-down item, pallor site\nand strain rule. See `reconcile.json` for every difference and why it was resolved.\n\n## Decisions made\n\n- **Presenting complaint** is `(or (clinical_finding (snomed_concept \"Finding of lower limb\" \"finding\"))\n  (clinical_finding (snomed_concept \"Muscle pain\" \"finding\")))` in both tasks and the priority rule.\n  *Finding of lower limb* is not a recorded common symptom; its descendants (leg pain, calf pain and\n  swelling, leg numbness/weakness, leg ulcer, bilateral leg swelling, buttock pain) match.\n  *Muscle pain* is a recorded common symptom and covers *Intermittent claudication*, which is not\n  under *Finding of lower limb*. Side effect: muscle pain anywhere opens the leg checks.\n  `Unable to weight-bear` and `Joint swelling` are under neither.\n- **Red box → one Urgent priority rule** over four `probable` diagnoses (fracture of lower limb,\n  deep venous thrombosis, acute lower limb ischaemia, critical lower limb ischaemia). The page says\n  \"Give urgent attention\", so the level is `Urgent`, although the adult warning sign \"Severe limb\n  ischemia\" is Very urgent.\n- **DVT risk factors** (\"especially if BMI > 30, smoker, immobile, pregnant, on oestrogen, leg\n  trauma, recent hospitalisation, TB or cancer\") strengthen the likelihood but are not required by\n  the page, so they are not encoded. Requiring one would make the rule fire less often than the page\n  intends; checking for them without using them would break constraint 2. No BMI measure task.\n- **DVT concept** is `Deep venous thrombosis` (the page's words, and the form VHA's vocabulary uses);\n  descendants such as *Deep venous thrombosis of lower extremity* still match the priority rule.\n- **\"One calf\"** is the `Unilateral` qualifier on `Swollen calf`, plus `Pain in calf`.\n- **Acute limb ischaemia**: leg pain with *Sudden onset*, *Severe* and *At rest* qualifiers, and any\n  of numbness, weakness, pallor (white discoloration of skin, site *Lower limb structure*) or absent\n  pulse (*Absent pulse*, site *Lower limb structure*) in the leg.\n- **\"Muscle pain in legs or buttocks on exercise\"** is `Intermittent claudication`, both in the\n  critical limb ischaemia rule (red box) and in the PVD rule (flowchart, \"relieved by rest\").\n- **Critical limb ischaemia**: claudication plus any of leg pain at rest, `Ulcer of lower extremity`,\n  or `Gangrenous disorder` sited to the lower limb.\n- **Flowchart \"Is there leg swelling? No\"** is `(no (clinical_finding (snomed_concept \"Swelling of\n  lower limb\" \"finding\")))` in the sciatica and PVD rules, following the page's branch. This needs\n  an explicit \"No\" record of leg swelling, so these two rules fire only after the swelling question\n  is answered (the task checks for it).\n- **\"Recent injury\" / \"following injury\"** are `Injury of lower limb`, read as recorded in the\n  current encounter; \"recent\" has no number, so no time comparison.\n- **Joint problem likely** is `Arthropathy`, probable, on any of joint warm, tender, swollen,\n  difficulty walking, difficulty sitting down, difficulty standing up.\n- **Sprain/strain likely** is two probable rules with the same evidence (joint swelling and injury\n  of lower limb): `Sprain of ligament of lower limb` and `Strain of muscle of lower limb`.\n- No `manage` tasks; treatment, referral and advice text accounted for as management.\n\n## Could not model\n\n- \"With arms folded\" (the joint screen manoeuvre) is not expressed.\n- \"Swelling over **one** joint\": `Joint swelling` does not express the count; the sprain/strain rules\n  may fire for multiple swollen joints with injury (more often than intended).\n- \"Down **back of** lower leg\": the radiating-pain concepts are per side and do not say posterior.\n- Statin with muscle pain/cramps or weakness → discuss with doctor: a management step, not a\n  diagnosis.\n- Both legs swollen, no orthopnoea → check pregnancy 174, urine dipstick, BP 148, refer same week;\n  no injury → skin check → 82 / refer; foot only → 81: routing and management, not modelled.\n\n## SNOMED gaps\n\n- `Pallor` (finding) and `Pallor of skin` do not exist. Used `White discoloration of skin` with\n  finding site `Lower limb structure`.\n- No sideless \"pain radiating to leg\"; used `Pain radiating to left leg` / `… right leg`.\n- No `Irritation of sciatic nerve`; used `Sciatica` (disorder).\n- No `Disorder of joint`; used `Arthropathy`.\n- No combined sprain/strain of leg; used `Sprain of ligament of lower limb` and\n  `Strain of muscle of lower limb`.\n- No `Gangrene of lower limb` (non-gas); used `Gangrenous disorder` with finding site\n  `Lower limb structure`.\n- `Ulcer of lower limb` does not exist; used `Ulcer of lower extremity`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the DVT rule require at least one of the listed risk factors, or (as built) fire on\n  unilateral calf swelling and pain alone?\n- Is `Intermittent claudication` acceptable for \"muscle pain in legs or buttocks on exercise\" in the\n  critical limb ischaemia criterion, where the page does not say \"relieved by rest\"?\n- Is white discoloration of the leg skin an acceptable recording of leg pallor?\n- Should acute/critical limb ischaemia be Very urgent (as the \"Severe limb ischemia\" warning sign)\n  rather than Urgent as the page states?\n- Is it acceptable that `Muscle pain` (a common symptom) opens the leg checks even when the muscle\n  pain is not in the leg? Without it, exercise leg pain recorded as claudication would not open them.\n- Should the sciatica and PVD rules require an explicit \"no leg swelling\" (as built, following the\n  flowchart's No branch), or fire regardless of swelling?\n- Is *Arthropathy* from difficulty walking/sitting/standing alone too broad? The page calls these\n  \"joint problem likely\", but they can have non-joint causes.\n- Is joint swelling after a leg injury enough for \"sprain/strain likely\", given that the red box\n  sends \"unable to bear weight following injury\" to fracture?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent leg symptom conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Finding of lower limb\" \"finding\"))", "element_keys": ["p80-926bed09"], "quote": "leg symptoms"}, {"claim_id": "c002", "rule": "Check for urgent leg symptom conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Muscle pain\" \"finding\")) }], "rules": [{"rule": "Check for urgent leg symptom conditions", "verdict": "ok", "problem": "Type and trigger right; every red-box item is present. Only gap (omission, not distortion): the DVT 'especially if' risk factors (BMI > 30, smoker, immobile, pregnant, oestrogen, leg trauma, recent hospitalisation, TB, cancer) are not checked for; the page treats them as likelihood modifiers, not required criteria, so this is acceptable.", "severity": "low"}, {"rule": "Check leg symptoms not needing urgent attention", "verdict": "ok", "problem": "Type and trigger right. The six joint-screen findings come from the page's top screening line, which precedes the red box and applies to every leg-symptom patient, not specifically to the 'not needing urgent attention' approach; the task name is slightly misleading but the role (check_for consumed by the joint-problem rule) is right.", "severity": "low"}, {"rule": "Diagnose probable fracture of leg (leg symptoms)", "verdict": "ok", "problem": "", "severity": "low"}, {"rule": "Diagnose probable DVT (leg symptoms)", "verdict": "ok", "problem": "", "severity": "low"}, {"rule": "Diagnose probable acute limb ischaemia (leg symptoms)", "verdict": "ok", "problem": "and/or structure matches 'Sudden severe leg pain at rest with any of ... numbness, weakness, pallor, no pulse'. Only the pallor concept choice (c039) is open.", "severity": "low"}, {"rule": "Diagnose probable critical limb ischaemia (leg symptoms)", "verdict": "ok", "problem": "and/or structure matches 'Muscle pain ... on exercise associated with pain at rest, ulcer or gangrene'.", "severity": "low"}, {"rule": "Diagnose probable joint problem (leg symptoms)", "verdict": "ok", "problem": "OR of six findings matches 'If joint warm/tender/swollen or unable to do all actions comfortably, joint problem likely'. 'Arthropathy' is a fair SNOMED reading of 'joint problem' (page sends to 77).", "severity": "low"}, {"rule": "Diagnose probable sciatic nerve irritation (leg symptoms)", "ve async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;

  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);

}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {

}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}

}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);

      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }

  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));

function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");

    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");

// ---------- linking ----------

// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes

function rulesNamed(ref) {

    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
