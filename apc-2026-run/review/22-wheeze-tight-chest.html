ection_y": 127.0, "indent": 0, "parent": null, "text": "respiratory rate ≥ 20 or PEFR2 not improved", "bbox": [324.0, 324.5, 485.6, 335.3], "key": "p22-b1cc0ebe"}, {"id": "p22-rb1-e24", "page": 22, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 0, "parent": null, "text": "Wheeze/tight chest resolved", "bbox": [69.6, 344.5, 123.5, 365.3], "key": "p22-0ed232a2"}, {"id": "p22-rb1-e25", "page": 22, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 0, "parent": null, "text": "Wheeze/tight chest still present", "bbox": [162.6, 344.5, 283.6, 355.3], "key": "p22-2cdd340a"}, {"id": "p22-rb1-e26", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 2, "parent": null, "text": "Give 40% face mask oxygen (if known COPD, give 24-28% face mask oxygen), keep saturation 93-95% while preparing nebuliser and between nebulisations.", "bbox": [328.8, 354.3, 745.1, 375.2], "key": "p22-c46cc749"}, {"id": "p22-rb1-e27", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 1, "parent": null, "text": "Repeat salbutamol every 2-4 hours as needed.", "bbox": [160.1, 364.5, 265.3, 385.3], "key": "p22-e93a86b7"}, {"id": "p22-rb1-e28", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 2, "parent": null, "text": "Refer urgently. While awaiting transport:", "bbox": [328.8, 374.3, 488.4, 385.2], "key": "p22-64f6bc39"}, {"id": "p22-rb1-e29", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 1, "parent": null, "text": "Is wheeze/tight chest still present after 3 hours of treatment?", "bbox": [160.1, 384.5, 264.5, 415.3], "key": "p22-638a993f"}, {"id": "p22-rb1-e30", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 3, "parent": "p22-rb1-e28", "text": "Nebulise 1mL salbutamol 0.5% solution in 3mL sodium chloride 0.9% with oxygen at flow rate of 8L/minute, every 20 minutes or give instead inhaled salbutamol via spacer 400-1000mcg (4-10 puffs), every 20 minutes. If using spacer, deliver 1 puff at a time, allow patient to take 6 breaths through the spacer before next puff.", "bbox": [334.4, 384.3, 767.4, 415.2], "key": "p22-b6f496ea"}, {"id": "p22-rb1-e31", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 3, "parent": "p22-rb1-e28", "text": "If not already given, give single dose prednisone 40mg orally. If unable to take oral medication, give single dose hydrocortisone 100mg IM/slow IV.", "bbox": [334.4, 414.3, 752.7, 435.2], "key": "p22-9400580c"}, {"id": "p22-rb1-e32", "page": 22, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 0, "parent": null, "text": "No", "bbox": [171.9, 424.5, 182.8, 435.3], "key": "p22-c38af526"}, {"id": "p22-rb1-e33", "page": 22, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 0, "parent": null, "text": "Yes", "bbox": [255.6, 424.5, 268.0, 435.3], "key": "p22-dc2e280a"}, {"id": "p22-rb1-e34", "page": 22, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 0, "parent": null, "text": "Assess response", "bbox": [518.4, 444.3, 579.9, 455.2], "key": "p22-a89bec76"}, {"id": "p22-rb1-e35", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 1, "parent": null, "text": "Discuss before discharge if any of: presents late afternoon, previous severe attacks, recent night time/ worsening of symptoms.", "bbox": [56.0, 444.5, 192.8, 485.3], "key": "p22-3ff200b9"}, {"id": "p22-rb1-e36", "page": 22, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 0, "parent": null, "text": "Continue", "bbox": [244.2, 444.5, 281.3, 455.3], "key": "p22-7fb7f6a8"}, {"id": "p22-rb1-e37", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 1, "parent": null, "text": "If poor response, add 2mL (0.5mg) ipratropium bromide solution to 1mL salbutamol 0.5% solution and 1mL sodium chloride 0.9%, and nebulise every 20 minutes up to 3 doses only. If nebuliser unavailable, continue salbutamol 400-1000mcg (4-10 puffs) via spacer and add inhaled ipratropium bromide via spacer 80-160 mcg (2-4 puffs), every 20 minutes as needed for up to 3 hours.", "bbox": [323.1, 454.3, 761.4, 495.2], "key": "p22-1d0c5c84"}, {"id": "p22-rb1-e38", "page": 22, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 0, "parent": null, "text": "salbutamol every 2-4 hours as needed and refer.", "bbox": [228.9, 454.5, 296.7, 485.3], "key": "p22-b98242b1"}, {"id": "p22-rb1-e39", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 1, "parent": null, "text": "If first episode of wheeze/tight chest, assess for asthma and COPD 138.", "bbox": [56.0, 484.5, 204.9, 505.3], "key": "p22-f4d2f322"}, {"id": "p22-rb1-e40", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 1, "parent": null, "text": "If still no better, repeat salbutamol nebulisations every 20 minutes until PEFR2 > 60% of predicted. Once PEFR2 > 60% of predicted, repeat every 2–4 hours as needed until referal.", "bbox": [323.1, 494.3, 774.5, 515.2], "key": "p22-76643222"}, {"id": "p22-rb1-e41", "page": 22, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient with wheeze/tight chest:", "section_y": 127.0, "indent": 1, "parent": null, "text": "If known asthma/COPD, give routine care: if asthma 140, if COPD 141.", "bbox": [56.0, 504.5, 202.4, 525.3], "key": "p22-ecb2e6f6"}, {"id": "p22-out-e01", "page": 22, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If sudden wheeze/tight chest and any of: generalised itch/rash, face/tongue swelling, BP < 90/60, dizziness/collapse, abdominal pain, vomiting or exposure to possible allergen1, check for anaphylaxis 28. • If difficulty breathing worse on lying flat and leg swelling or patient ≥ 50 years with first episode of wheeze/tight chest, heart failure likely 151.", "bbox": [51.0, 89.1, 790.9, 109.9], "key": "p22-6530e896"}, {"id": "p22-out-e02", "page": 22, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "WHEEZE/TIGHT CHEST", "bbox": [328.9, 48.5, 513.1, 70.8], "key": "p22-7fa4d6a7"}, {"id": "p22-out-e03", "page": 22, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Common allergens include medication, food or insect bite/sting within the past few hours. 2Peak expiratory flow rate: PEFR is expressed as a percentage of the predicted normal value for the patients age and height 139.", "bbox": [34.0, 541.5, 720.0, 552.3], "key": "p22-096a62b5"}], "boxes": [{"box": 1, "rect": [35.5, 122.0, 806.4, 534.7]}], "crops": {"1" omed_concept \"Unable to complete a sentence in one breath\" \"finding\"))\n    (clinical_finding (snomed_concept \"Feeling agitated\" \"finding\"))\n\n    ;; Heart failure likely: difficulty breathing worse on lying flat and leg swelling\n    (clinical_finding (snomed_concept \"Orthopnea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Leg swelling symptom\" \"finding\"))\n\n    ;; Check for anaphylaxis: sudden wheeze/tight chest and any of the listed features\n    (clinical_finding (snomed_concept \"Wheezing\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Tight chest\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Generalized pruritus\" \"finding\"))\n    (clinical_finding (snomed_concept \"Generalized rash\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Tongue structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Collapse\" \"finding\"))\n    (clinical_finding (snomed_concept \"Abdominal pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Food\" \"substance\"))\n    (clinical_finding (snomed_concept \"Insect bite - wound\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Insect sting\" \"disorder\"))\n  )\n)\n(task\n  \"Check for wheeze in tight chest\"\n  adult\n  ;; Silent chest = tight chest but no wheeze, so a patient with tight chest is examined for wheeze\n  (clinical_finding (snomed_concept \"Tight chest\" \"finding\"))\n  (check_for\n    (clinical_finding (snomed_concept \"Wheezing\" \"finding\"))\n  )\n)\n(task\n  \"Measure PEFR in wheeze/tight chest\"\n  adult\n  (or (clinical_finding (snomed_concept \"Wheezing\" \"finding\"))\n      (clinical_finding (snomed_concept \"Tight chest\" \"finding\")))\n  ;; PEFR is expressed as a percentage of the predicted normal value (footnote 2)\n  (measure (measurement (snomed_concept \"Recorded/predicted peak expiratory flow rate ratio\" \"observable entity\") %))\n)\n(system_diagnosis_rule\n  \"Diagnose probable heart failure from wheeze/tight chest\"\n  (diagnosis\n    (snomed_concept \"Heart failure\" \"disorder\")\n    probable\n  )\n  adult\n  ;; \"If difficulty breathing worse on lying flat and leg swelling ... heart failure likely\".\n  ;; The other branch (\"patient >= 50 years with first episode of wheeze/tight chest\") needs age,\n  ;; which the language cannot express; see remaining questions.\n  (and\n    (or (clinical_finding (snomed_concept \"Wheezing\" \"finding\"))\n        (clinical_finding (snomed_concept \"Tight chest\" \"finding\")))\n    (clinical_finding (snomed_concept \"Orthopnea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Leg swelling symptom\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible anaphylaxis from sudden wheeze/tight chest\"\n  (diagnosis\n    (snomed_concept \"Anaphylaxis\" \"disorder\")\n    possible\n  )\n  adult\n  ;; \"If sudden wheeze/tight chest and any of: ... check for anaphylaxis 28\"\n  (and\n    (or (clinical_finding (snomed_concept \"Wheezing\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Tight chest\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\"))))\n    (or (clinical_finding (snomed_concept \"Generalized pruritus\" \"finding\"))\n        (clinica ing\" \"finding\") (snomed_concept \"Generalized pruritus\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generalized rash\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Insect bite - wound\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Insect sting\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Leg swelling symptom\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Orthopnea\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Face structure\" \"body structure\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Tongue structure\" \"body structure\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Tight chest\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Tight chest\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Wheezing\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Wheezing\" \"finding\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Food\" \"substance\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Anaphylaxis\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Heart failure\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": ["(measurement (snomed_concept \"Recorded/predicted peak expiratory flow rate ratio\" \"observable entity\") %)"], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 22 – Wheeze/tight chest: flowchart\n\nSource: APC 2026 e-book page 22: two bullets above the red box, and the red box.\n\n## Bullets above the red box\n\n```mermaid\nflowchart TD\n    C[\"Wheeze / tight chest\"]\n    C --> A{\"Sudden wheeze/tight chest <b>and<\/b> any of: generalised itch/rash,<br/>face/tongue swelling, BP &lt; 90/60, dizziness/collapse,<br/>abdominal pain, vomiting, exposure to possible allergen¹?\"}\n    A -- Yes --> ANA[\"Check for anaphylaxis ↻ 28\"]\n    C --> H{\"Difficulty breathing worse on lying flat <b>and<\/b> leg swelling<br/><i>or<\/i> patient ≥ 50 years with first episode of wheeze/tight chest?\"}\n    H -- Yes --> HF[\"Heart failure likely → 151\"]\n```\n\n¹ Common allergens include medication, food or insect bite/sting within the past few hours.\n\n## Red box: \"Give urgent attention to the patient with wheeze/tight chest\"\n\n```mermaid\nflowchart TD\n    S1{\"Assess severity of episode. Any of: pulse &lt; 50, unable to talk,<br/>silent chest (tight chest but no wheeze), PEFR² &lt; 33% of predicted,<br/>drowsy or confused?\"}\n    S1 -- Yes --> LT[\"Life threatening:<br/>40% (COPD 24-28%) face mask O₂, refer urgently,<br/>nebulise salbutamol + ipratropium, hydrocortisone;<br/>if no longer life threatening, manage as severe\"]\n    S1 -- No --> S2{\"Any of: SpO₂ &lt; 90%, RR &gt; 30, pulse &gt; 120,<br/>unable to talk in full sentences, PEFR² &lt; 60% of predicted, agitated?\"}\n    S2 -- Yes --> SEV[\"Severe:<br/>face mask O₂, refer urgently, nebulised/spacer salbutamol,<br/>prednisone or hydrocortisone; assess response\"]\n    S2 -- No --> MM[\"Mild or moderate:<br/>salbutamol (spacer or nebuliser), prednisone if known asthma/COPD,<br/>monitor, repeat every 20 min in the first hour\"]\n    LT --> SEV\n    MM --> R1{\"Assess after 1 hour of treatment:<br/>check RR and PEFR², can patient talk normally?\"}\n    R1 -- \"Improving or no change:<br/>talks normally and RR &lt; 20 or PEFR² improved &gt; 20%\" --> R2{\"Wheeze/tight chest resolved?\"}\n    R1 -- \"Worsening despite treatment:<br/>unable to talk normally or RR ≥ 20 or PEFR² not improved\" --> SEV\n    R2 -- Resolved --> DIS[\"Discuss before discharge if late afternoon, previous severe attacks,<br/>recent night-time/worsening symptoms; first episode → assess asthma/COPD 138;<br/>known asthma → 140, COPD → 141\"]\n    R2 -- \"Still present\" --> R3{\"Repeat salbutamol every 2-4 h.<br/>Still present after 3 hours of treatment?\"}\n    R3 -- No --> DIS\n    R3 -- Yes --> REF[\"Continue salbutamol every 2-4 h and refer\"]\n```\n\n² PEFR is expressed as a percentage of the predicted normal value for the patient's age and height ↻ 139.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `Wheezing` or `Tight chest` (neither is a recorded common symptom or warning sign) | `Check for wheeze/tight chest severity and causes` (task trigger) |\n| Silent chest needs a wheeze check | A patient presenting with tight chest is examined for wheeze | `Check for wheeze in tight chest` |\n| PEFR² | Measure `Recorded/predicted peak expiratory flow rate ratio` in % | `Measure PEFR in wheeze/tight chest` |\n| Header: urgent attention to every patient with wheeze/tight chest | `(or Wheezing Tight chest)` → Urgent | `Urgent: wheeze/tight chest` |\n| S1 = Yes (life threatening) | complaint **and** any of: pulse < 50, unable to speak, tight chest with no wheeze, PEFR < 33% predicted, drowsy, acute confusion → Emergency | `Emergency: life-threatening wheeze/tight chest` |\n| S1 = No → S2 = Yes (severe) | complaint **and** any of: SpO₂ < 90%, RR > 30, pulse > 120, unable to complete a sentence in one breath, PEFR < 60% predicted, agitated → Urgent | `Urgent: severe wheeze/tight chest` |\n| S2 = No (mild/moderate) | No separate rule; covered by the base Urgent rule | `Urgent: wheeze/tight chest` |\n| R1, R2, R3 (reassessment after 1 h / 3 h of treatment) | Not modelled: they route management after treatment and depend on time since treatment started | — (see remaining questions) |\n| Anaphylaxis bullet | Sudden-onset wheeze/tight chest **and** any listed feature → `possible` anaphylaxis | `Diagnose possible anaphylaxis from sudden wheeze/tight chest` |\n| Heart failure bullet | complaint **and** orthopnoea **and** leg swelling → `probable` heart failure; the age ≥ 50 + first-episode branch is not modelled (no age in the language) | `Diagnose probable heart failure from wheeze/tight chest` |\n\n## Notes\n\n- All management (oxygen, salbutamol, ipratropium, steroids, referral, discharge advice) is out of\n  scope for this pass and is not modelled.\n- \"Life threatening\" is the page's own explicit escalation, so that tier is `Emergency`. The\n  severe tier stays `Urgent`, the level the header gives every patient with wheeze/tight chest.\n", "questions": "# Page 22 – Wheeze/tight chest: remaining questions\n\n## Decisions made\n\n- **Complaint.** \"Wheeze/tight chest\" is `(or Wheezing Tight chest)`. Neither concept is a recorded\n  common symptom or warning sign, so the rules fire only once one of them is recorded (for example\n  from another page's `check_for`).\n- **Every patient with wheeze/tight chest is Urgent.** The header reads \"Give urgent attention to\n  the patient with wheeze/tight chest:\" with no \"and any of\", so `Urgent: wheeze/tight chest` uses\n  the complaint alone.\n- **Life threatening → Emergency.** The page labels this tier \"Life threatening\", which is an\n  explicit escalation (`Emergency: life-threatening wheeze/tight chest`).\n- **Severe stays Urgent.** The page gives the severe tier no escalation beyond the header, so\n  `Urgent: severe wheeze/tight chest` is also Urgent. As a priority it repeats the base rule, but it\n  records the page's severe criteria and makes them used evidence.\n- **Mild/moderate** has no rule of its own: it leads only to management and is covered by the base\n  Urgent rule.\n- **Silent chest** (\"tight chest but no wheeze\") has no SNOMED concept. It is encoded as the page\n  defines it: `(and Tight chest (no Wheezing))`. `(no …)` needs a recorded \"No\", so a second task,\n  `Check for wheeze in tight chest`, asks for wheeze whenever tight chest is recorded.\n- **Unable to talk** → `Unable to speak` (\"Unable to talk\" does not exist). **Unable to talk in full\n  sentences** → `Unable to complete a sentence in one breath`. **Confused** → `Acute confusion` (the\n  warning-sign form). **Agitated** → `Feeling agitated`.\n- **PEFR** is \"a percentage of the predicted normal value\" (footnote 2), so it is measured as\n  `Recorded/predicted peak expiratory flow rate ratio` in `%`, with a `measure` task, and compared\n  with < 33 and < 60.\n- **Pulse** uses `Pulse, function` in bpm. SpO₂ < 90%, RR > 30 and pulse > 120 keep the page's\n  strict comparisons.\n- **\"Check for anaphylaxis 28\"** is read as \"suspect anaphylaxis\" → `possible` anaphylaxis\n  (`Diagnose possible anaphylaxis from sudden wheeze/tight chest`). \"Sudden\" is the `Sudden onset`\n  qualifier on the complaint. The listed features, and the footnote-1 allergens (medication, food,\n  insect bite/sting), are added to the `check_for` so the rule can fire. BP < 90/60 is systolic < 90\n  or diastolic < 60.\n- **Heart failure likely** → `probable` Heart failure from complaint **and** `Orthopnea`\n  (\"difficulty breathing worse on lying flat\") **and** `Leg swelling symptom`.\n- No shock definition is involved on this page.\n\n## Could not model\n\n- **Heart failure, second branch: \"patient ≥ 50 years with first episode of wheeze/tight chest\".**\n  The language has no age comparison. Encoding \"first episode\" alone would make heart failure\n  probable for every first episode at any age, so the branch is left out. The rule therefore fires\n  **less often** than the page intends (it misses older patients with a first episode and no\n  orthopnoea/leg swelling).\n- **Reassessment after 1 hour of treatment** (improving: talks normally and RR < 20, or PEFR\n  improved by > 20%; worsening: unable to talk normally, RR ≥ 20, or PEFR not improved) and\n  **\"still present after 3 hours of treatment\"**. These depend on time since treatment started and\n  on change from a baseline PEFR, which the language cannot express. They only route management, so\n  leaving them out changes no priority. Adding \"RR ≥ 20\" to the severe rule without the treatment\n  context would make most patients severe on arrival, so it was not done.\n- \"Within the past few hours\" (footnote 1) for allergen exposure: exposures recorded in the current\n  encounter are taken as recent, as on the gold page.\n- All management (oxygen, salbutamol, ipratropium, prednisone/hydrocortisone, referral, discharge\n  advice) is out of scope for this pass.\n\n## SNOMED gaps\n\n- `Silent chest` (finding): not found. Substitute: `(and Tight chest (no Wheezing))`.\n- `Unable to talk` (finding): not found. Substitute: `Unable to speak` (finding).\n- No concept for \"first episode of wheeze/tight chest\" combined with age; `First episode`\n  (qualifier value) exists but is unused because the age half cannot be expressed.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the severe tier (\"Yes: Severe\", referred urgently) be **Very urgent** rather than Urgent? As\n  encoded, mild/moderate and severe patients get the same priority.\n- Is **Emergency** right for the life-threatening tier, or is \"Very urgent\" intended?\n- Should \"patient ≥ 50 years with first episode of wheeze/tight chest\" be added once the language can\n  compare age? Until then, should a `possible` heart failure on first episode alone be added instead?\n- Is reading \"check for anaphylaxis\" as a `possible` anaphylaxis diagnosis acceptable, given that\n  any single feature (e.g. vomiting) with sudden wheeze makes it fire?\n- Silent chest relies on a recorded \"no wheeze\". Is a health worker expected to mark wheeze absent\n  when a patient presents with tight chest?\n- Silent chest: should it be recorded as absent breath sounds (the usual clinical meaning) rather\n  than \"tight chest but no wheeze\"? (The page's own parenthesis was encoded.)\n- Is `Food` (substance) as the exposure agent acceptable, or should the page-20 food list (peanut,\n  tree nut, egg, milk, fish) be repeated here?\n- Should the anaphylaxis and heart-failure rules also be anchored to `Dyspnea`, since many wheezy\n  patients will be recorded only as short of breath?\n", "claims": [{"claim_id": "c001", "rule": "Check for wheeze/tight chest severity and causes", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Wheezing\" \"finding\"))", "element_keys": ["p22-0687a589"], "quote": "wheeze/tight chest"}, {"claim_id": "c002", "rule": "Check for wheeze/tight chest severity and causes", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Tight chest\" \"finding\"))", "element_keys": ["p22-0687a589"], "quote": "wheeze/tight chest"}, {"claim_id": "c003", "rule": "Check for wheeze/tight chest severity and causes", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to speak\" \"finding\"))", "element_keys": ["p22-645fa848"], "quote": "unable to talk"}, {"claim_id": "c004", "rule": "Check for wheeze/tight chest severity and causes", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"findin "}], "outside_not_logic": ["p22-7fa4d6a7"], "rule_level_problems": [{"rule": "Diagnose probable heart failure from wheeze/tight chest", "problem": "The page gives two independent routes to 'heart failure likely'; only the orthopnoea-and-leg-swelling route is encoded. The second route (age ≥ 50 with a first episode of wheeze/tight chest) cannot be written because the grammar has no numeric age, but nothing in the file records that this branch was dropped, and a patient over 50 with first-episode wheeze and no leg swelling will get no heart failure prompt at all. 'First episode' exists as a SNOMED qualifier value, so the only blocker is age.", "severity": "medium"}, {"rule": "Emergency: life-threatening wheeze/tight chest; Urgent: severe wheeze/tight chest", "problem": "Pulse is compared on 'Pulse, function' (8499008) and saturation on 'Hemoglobin saturation with oxygen' (103228002). SNOMED also has 'Heart rate' (364075005) and 'Peripheral oxygen saturation' (431314004), which are the usual observables for a pulse and a pulse-oximeter reading. Whether these clauses ever fire depends on which concept the vitals system records; I could not verify that from the permitted inputs. If the system records the other concept, pulse < 50, pulse > 120 and SpO2 < 90% are silently dead.", "severity": "medium"}, {"rule": "Emergency: life-threatening wheeze/tight chest", "problem": "The page labels this branch 'Life threatening' and its management 'Refer urgently', the same words as the Severe branch; it never says 'emergency'. Emergency is a reasonable reading of the escalation above Severe but is a judgment the house standard asks to be explicit about.", "severity": "low"}, {"rule": "(no rule)", "problem": "'If first episode of wheeze/tight chest, assess for asthma and COPD' has no possible Asthma / COPD rule, although 'First episode' (qualifier value) and 'Asthma' (disorder) exist. Low consequence given the cross-reference to the asthma/COPD page.", "severity": "low"}, {"rule": "( e wheeze/tight chest", "verdict": "problem", "problem": "Its level (Urgent) is the same as the blanket rule 'Urgent: wheeze/tight chest', so it adds nothing to triage. The page refers severe patients urgently, which arguably calls for a higher level ('Very urgent') or for consolidating the two rules. This is a judgment call; the page doesn't name a level.", "severity": "low"}, {"rule": "Urgent: wheeze/tight chest", "verdict": "ok", "problem": "The red-box header 'Give urgent attention to the patient with wheeze/tight chest' has no 'and any of', so making every wheeze Urgent is faithful.", "severity": "low"}], "summary": "Most consequential: the probable heart-failure rule leaves out the page's second branch (patient ≥ 50 with first episode of wheeze/tight chest), and no check_for captures 'first episode'. Its claims c029/c030 cite that wording without encoding it. Face and tongue swelling use generic Swelling with a finding site where Facial swelling and Tongue swelling exist, and allergen exposure drops the footnote's 'within the past few hours' window. The severity thresholds and the Emergency/Urgent split otherwise match the page."}], "scorecard": {"page": 22, "slug": "22-wheeze-tight-chest", "validation_ok": true, "builder_agreement": 1.0, "elements": 44, "elements_agreed": 36, "claims": 69, "claims_agreed": 40, "queue": 62, "queue_by_priority": {"low": 24, "high": 7, "medium": 31}, "missing_reports": [], "element_rows": [{"key": "p22-0687a589", "id": "p22-rb1-e01", "box": 1, "status": "queue", "scopes": {"in_scope": 2, "out_of_scope": 1}, "verdicts": {"correct": 2}}, {"key": "p22-26faadae", "id": "p22-rb1-e02", "box": 1, "status": "queue", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p22-645fa848", "id": "p22-rb1-e03", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p22-b24de267", "id": "p22-rb1-e04", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p22-7d943aa7", " h a first-episode proxy could be a second rule or flagged as not representable.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Check for wheeze/tight chest severity and causes (check_for)", "text": "check_for lacks any age >= 50 / first-episode item needed for heart failure; BP < 90/60, pulse, RR, SpO2 and PEFR are covered only by measurement criteria in rules, not check_for (acceptable).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Urgent: severe wheeze/tight chest vs Urgent: wheeze/tight chest", "text": "Both are Urgent, so the severe rule is redundant with the catch-all urgent rule; severity distinction (mild/moderate vs severe) is not represented. Page does head the whole box 'give urgent attention', so Urgent for all is defensible.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Emergency: life-threatening wheeze/tight chest", "text": "Silent chest encoded as Tight chest AND NOT Wheezing under an outer wheeze-or-tight-chest requirement: logically correct. No problem found; noted as checked.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Diagnose probable heart failure from wheeze/tight chest", "text": "Page logic is (orthopnoea AND leg swelling) OR (age >= 50 AND first episode of wheeze/tight chest). Only the first branch is encoded; the second is dropped without approximation. Age >= 50 is not representable, but this should be recorded as a known gap; the rule as written under-diagnoses heart failure in older first-episode patients.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Urgent: severe wheeze/tight chest", "text": "Redundant with 'Urgent: wheeze/tight chest' (same priority, superset trigger), so the page's severe vs mild/moderate split has no effect on output. Either the severe tier needs a distinct level (e.g. 'Very urgent', since the page refers severe cases urgently) or a carrying diagnosis; otherwise the rule is dead weight.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "(none)", "text": "'If first episode of wheeze/tight chest, assess for asthma and COPD' has no possible-diagnosis rule.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Check for wheeze/tight chest severity and causes / Urgent: severe wheeze/tight chest", "text": "'Feeling agitated' is a subjective emotional-state finding; the page's 'agitated' is an observed sign ('Psychomotor agitation'). 'Unable to speak' is a language-ability finding rather than breathlessness. Both resolve and the test passes; meaning is approximate.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis from sudden wheeze/tight chest", "text": "Allergen exposure lacks the footnote's 'within the past few hours' window, so any recorded drug/food exposure or insect bite (a common symptom) with sudden wheeze fires the rule. Acceptable for a broad possible pre-screen.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Emergency: life-threatening wheeze/tight chest", "text": "Silent chest is encoded as Tight chest AND (no Wheezing); this fires only if wheeze absence is recorded (the separate 'Check for wheeze in tight chest' task supports this). Fine, but note dependency.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Check for wheeze/tight chest severity and causes", "text": "Type, trigger and check list are right (every red-box non-vital item, the anaphylaxis list and the heart-failure discriminators are present and all are consumed). Missing: a first-episode form of the complaint, e.g. (clinical_finding (snomed_concept \"Wheezing\" \"finding\") (qualifier (snomed_concept \"First episode\" \"qualifier value\"))) and the same for Tight chest, which the page's second heart-failure route ('patient >= 50 years with first episode of wheeze/tight chest') and the 'If first episode ... assess for asthma and COPD' step both need. Exposure timing ('within the past few hours') is dropped, as on the gold page.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "high", "ref": "Diagnose probable heart failure from wheeze/tight chest", "text": "The page gives two routes to 'heart failure likely': (difficulty breathing worse on lying flat AND leg swelling) OR (patient >= 50 years with first episode of wheeze/tight chest). The rule encodes only the first; the second is silently dropped, so an older patient with a first episode and no orthopnea/oedema never gets the probable diagnosis. The grammar has no patient-age comparison (only age groups), so the branch cannot be encoded exactly; it should at least be recorded as 'could not model', and an approximation considered (a probable or possible branch on the First-episode-qualified complaint, with the age left to the clinician). 'probable' for 'likely' and the and-structure of the first branch are right.", "detail": [{"checker": "backward-1", "severity": "high"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Urgent: severe wheeze/tight chest", "text": "All six criteria and thresholds match 'Yes: Severe'. But the level is Urgent, identical to the base 'Urgent: wheeze/tight chest' rule, so this rule never changes the outcome. Either it is intentionally documentary, or the page's 'Refer urgently' for severe was meant to escalate above the mild/moderate case (which the page treats and reassesses for 3 hours before referring); the briefing reserves 'Very urgent' for explicit escalation, so this is a judgement call to record, not a defect.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Check for wheeze/tight chest severity and causes", "text": "Mixes severity features, heart failure features and anaphylaxis features in one check_for list; acceptable but the 'sudden' qualifier items duplicate plain wheeze trigger. Missing age>=50 first-episode check.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "high", "ref": "Diagnose probable heart fail", "text": "Page's heart failure 'likely' has two alternatives: (orthopnea and leg swelling) OR (age>=50 with first episode); rule encodes only the first, and requires wheeze/tight chest as extra condition", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Urgent: severe wheeze/tight chest", "text": "Severe criteria: SpO2 concept is generic hemoglobin saturation; otherwise faithful. Note page severe is gated on the life-threatening criteria being absent; priority ordering is left to evaluation", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Check for wheeze/tight chest severity and causes", "text": "There's no check_for for 'first episode of wheeze/tight chest', so the heart-failure branch for patients ≥ 50 with a first episode can't be captured. Face and tongue swelling use the generic Swelling concept plus a finding site; Facial swelling and Tongue swelling exist. The allergen timing window is dropped. Known asthma/COPD and first episode (the 'assess for asthma and COPD' arm) aren't checked either.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "high", "ref": "Diagnose probable heart failure from wheeze/tight chest", "text": "The page says 'orthopnoea and leg swelling OR patient ≥ 50 years with first episode of wheeze/tight chest → heart failure likely'. Only the first branch is encoded. A first episode in a patient aged 50 or over never produces probable heart failure. Probable is right for 'likely'.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 22, "slug": "22-wheeze-tight-chest", "kind": "rule", "priority": "medium", "ref": "Urgent: severe wheeze/tight chest", "text": "Its level (Urgent) is the same as the blanket rule 'Urgent: wheeze/tight chest', so it adds nothing to triage. The page refers severe patients urgently, which arguably calls for a higher level ('Very urgent') or for consolidating the two rules. This is a judgment call; the page doesn't name a level.", "detail": [{"checker": "backward-3", "severity": "low"}]}], "concepts": {"Wheezing|finding": {"resolves": true, "id": "56018004", "descendants": 12, "parents": ["Finding of sound of breathing (finding)"]}, "Tight chest|finding": {"resolves": true, "id": "23924001", "descendants": 0, "parents": ["Tightness sensation (finding)", "Finding of thoracic region (finding)", "Finding of sensation by site (finding)"]}, "Unable to speak|finding": {"resolves": true, "id": "286369003", "descendants": 0, "parents": ["Finding related to ability to speak (finding)", "Unable to use language (finding)"]}, "Drowsy|finding": {"resolves": true, "id": "271782001" <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
