8", "page": 69, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "passing", "bbox": [764.2, 337.9, 794.0, 348.1], "key": "p69-a338b4d5"}, {"id": "p69-out-e19", "page": 69, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "urine • If on furosemide, doctor to review. • If vaginal atrophy 187, if constipation 60. • Advise to reduce alcohol and caffeine, and do pelvic muscle exercises. • If vaginal prolapse or no response, refer.", "bbox": [674.1, 340.5, 787.6, 520.7], "key": "p69-2c52b11d"}, {"id": "p69-out-e20", "page": 69, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If on amitriptyline,", "bbox": [753.8, 370.5, 803.9, 390.7], "key": "p69-24bde58b"}, {"id": "p69-out-e21", "page": 69, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "doctor to", "bbox": [760.8, 390.5, 797.0, 400.7], "key": "p69-da72dd5c"}, {"id": "p69-out-e22", "page": 69, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "review, otherwise", "bbox": [759.6, 400.5, 798.1, 420.7], "key": "p69-84f72188"}, {"id": "p69-out-e23", "page": 69, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "refer.", "bbox": [769.0, 420.5, 788.8, 430.7], "key": "p69-0c4fa8ed"}, {"id": "p69-out-e24", "page": 69, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Flow problem Blood on dipstick5 Send urine for microscopy. If at risk of bilharzia6, also request for Schistosoma ova:", "bbox": [500.5, 295.2, 763.7, 325.4], "key": "p69-e7a2e142"}, {"id": "p69-out-e25", "page": 69, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Schistosoma", "bbox": [500.4, 337.9, 548.7, 348.1], "key": +ypW1y+qY14kngqyLs//H4z//ueBkdf1b1C3yN5wQHG2QDU5DRxffOa00fXOq2N/TKpQhFGNFkehUCgUCoVCYaBZLcX/Xxw9sj392t5+aC5AULF7lXy0+8IzD5zxyigKgGpyGlx1ZffxNw4pf/j2FX+4c+jgPkhs4YLpZ7xWilqOarQ4CoVCoVAoFAoDzWopFNWAt7Y9ec3gyz96f/0Zr8mZxZqXlrQuabZpw7IzXhNFYVBNToPVqx5CSmVtW5W1u+jaa65I3B1MoVAoFAqFQqFQ1BA0q6VQKKoN//rHft38WKFQKBQKhUKhUCgUpwea1VIoFAqFQqFQKBQKhUKhUJx90KyWQqFQKBQKhUKhUCgUCoXi7INmtRQKhUKhUCgUCoVCoVAoFGcfNKulUCgUCoVCoVAoFAqFQqE4+6BZLYVCoVAoFAqFQqFQKBQKxdkHzWopFAqFQqFQKBQKhUKhUCjOPmhWS6FQKBQKhUKhUCgUCoVCcfYhNqv10/jrf558g0KhUCgUCoVCoVAoFAqFQlEL8eM1A6KzWgqFQqFQKBQKhUKhUCgUCsVZAc1qKRQKhUKhUCgUCoVCoVAozj5oVkuhUCgUCoVCoVAoFAqFQnH24f8AX6w2PLmBGNsAAAAASUVORK5CYII="}, "page_image": null, "lisp": ";; Page 69 - Urinary symptoms\n;; Presenting complaint \"urinary symptoms\" is not a recorded common symptom or warning sign;\n;; the trigger is the most natural clinical finding (see remaining questions).\n(task\n  \"Check for urgent urinary symptom conditions\"\n  adult\n  (clinical_finding (snomed_concept \"Urinary symptoms\" \"finding\"))\n  (check_for\n    ;; Unable to pass urine with lower abdominal discomfort/distension\n    (clinical_finding (snomed_concept \"Unable to void urine\" \"finding\"))\n    (clinical_finding (snomed_concept \"Abdominal discomfort\" \"finding\") (finding_site (snomed_concept \"Lower abdomen structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Distension of abdomen\" \"finding\") (finding_site (snomed_concept \"Lower abdomen structure\" \"body structure\")))\n\n    ;; Pyelonephritis: flank pain with leucocytes/nitrites, and the complicating factors\n    (clinical_finding (snomed_concept \"Flank pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n    (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n    (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Male\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Postmenopausal state\" \"finding\"))\n\n    ;; Kidney disease: blood/protein in urine with new swelling of face/feet or passing little urine\n    (clinical_finding (snomed_concept \"Blood in urine\" \"finding\"))\n    (clinical_finding (snomed_concept \"Proteinuria\" \"finding\"))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"New\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Foot structure\" \"body structure\")) (qualifier (snomed_concept \"New\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Oliguria\" \"finding\"))\n\n    ;; Kidney stone: sudden, severe, one-sided pain in flank or groin\n    (clinical_finding (snomed_concept \"Flank pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Inguinal pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n  )\n)\n;; Approach to the patient with urinary symptoms not needing urgent attention\n(task\n  \"Check for urinary infection features\"\n  adult\n  (clinical_finding (snomed_concept \"Urinary symptoms\" \"finding\"))\n  (check_for\n    ;; Approach not needing urgent attention: burning/frequency/urgency, sex, glucose on dipstick\n    (clinical_finding (snomed_concept \"Dysuria\" \"finding\"))\n    (clinical_finding (snomed_concept \"Increased frequency of urination\" \"finding\"))\n    (clinical_finding (snomed_concept \"Urgent desire to urinate\" \"finding\"))\n    (clinical_finding (snomed_concept \"Female\" \"finding\"))\n    (clinical_finding (snomed_concept \"Glycosuria\" \"finding\"))\n\n    ;; Woman: catheter, diabetes, pregnancy or urinary tract problem\n    (clinical_finding (snomed_concept \"Urinary catheter in situ\" \"finding\"))\n    (clinical_finding (snomed_concept \"Disorder of urinary system\" \"disorder\"))\n\n    ;; Man: urethral discharge; perineal/body pain or prostate tender on rectal exam\n    (clinical_finding (snomed_concept \"Urethral discharge\" \"finding\"))\n    (clinical_finding (snomed_concept \"Perineal pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\"))\n    (clinical_finding (snomed_concept \"Tenderness of prostate\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable complicated pyelonephritis (urinary symptoms)\"\n  (diagnosis\n    (snomed_concept \"Acute pyelonephritis\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Flank pain\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n           (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\")))\n       (or (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n           (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n           (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)\n           (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n           (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\"))\n           (clinical_finding (snomed_concept \"Male\" \"finding\"))\n           (clinical_finding (snomed_concept \"Pregnancy\" \"finding\"))\n           (clinical_finding (snomed_concept \"Postmenopausal state\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable uncomplicated pyelonephritis (urinary symptoms)\"\n  (diagnosis\n    (snomed_concept \"Acute pyelonephritis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; \"Not needing urgent attention\": flank pain with leucocytes/nitrites. The complicating factors are\n  ;; not negated (see remaining questions); both rules diagnose the same concept.\n  (and (clinical_finding (snomed_concept \"Flank pain\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n           (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable kidney disease (urinary symptoms)\"\n  (diagnosis\n    (snomed_concept \"Kidney disease\" \"disorder\")\n    probable\n  )\n  adult\n  (and (or (clinical_finding (snomed_concept \"Blood in urine\" \"finding\"))\n           (clinical_finding (snomed_concept \"Proteinuria\" \"finding\")))\n       (or (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"New\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Foot structure\" \"body structure\")) (qualifier (snomed_concept \"New\" \"qualifier value\")))\n           (>= (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 140)\n           (>= (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 90)\n           (clinical_finding (snomed_concept \"Oliguria\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable kidney stone (urinary symptoms)\"\n  (diagnosis\n    (snomed_concept \"Kidney stone\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Blood in urine\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Flank pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n           (clinical_finding (snomed_concept \"Inguinal pain\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\"))))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable simple UTI in a woman (urinary symptoms)\"\n  (diagnosis\n    (snomed_concept \"Lower urinary tract infectious disease\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Woman, leucocytes/nitrites, and no catheter, diabetes, pregnancy or urinary tract problem\n  (and (clinical_finding (snomed_concept \"Female\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n           (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\")))\n       (no (clinical_finding (snomed_concept \"Urinary catheter in situ\" \"finding\")))\n       (no (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\")))\n       (no (clinical_finding (snomed_concept \"Pregnancy\" \"finding\")))\n       (no (clinical_finding (snomed_concept \"Disorder of urinary system\" \"disorder\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable complicated UTI (urinary symptoms)\"\n  (diagnosis\n    (snomed_concept \"Urinary tract infectious disease\" \"disorder\")\n    probable\n  )\n  adult\n  (or\n    ;; Woman: leucocytes/nitrites and a catheter, diabetes, pregnancy or urinary tract problem\n    (and (clinical_finding (snomed_concept \"Female\" \"finding\"))\n         (or (clinical_finding (snomed_concept \"Leukocytes in urine\" \"finding\"))\n             (clinical_finding (snomed_concept \"Nitrite detected in urine\" \"finding\")))\n         (or (clinical_fi disease likely\"] --> URG\n    RB -- \"Blood in urine + sudden, severe, one-sided flank or groin pain\" --> KS[\"Kidney stone likely\"] --> URG\n    RB -- No --> NU[\"Not needing urgent attention\"]\n    NU --> UPN[\"Flank pain with leucocytes/nitrites:<br/>uncomplicated pyelonephritis likely\"]\n    NU --> G1{\"Burning/frequency/urgency or<br/>leucocytes/nitrites on dipstick?\"}\n    G1 -- Yes --> SEX{\"Woman or man?\"}\n    SEX -- Woman --> WL{\"Leucocytes/nitrites?\"}\n    WL -- No --> WG[\"If glucose: exclude diabetes<br/>If frequency: exclude pregnancy<br/>Otherwise discuss/refer\"]\n    WL -- Yes --> WC{\"Catheter, diabetes, pregnancy or<br/>urinary tract problem?\"}\n    WC -- No --> SUTI[\"Simple UTI likely\"]\n    WC -- Yes --> CUTI[\"Complicated UTI likely\"]\n    SEX -- Man --> MD[\"Urethral discharge? If present, MUS likely\"]\n    SEX -- Man --> MP{\"Perineal/body pain or prostate tender on rectal exam?\"}\n    MP -- Yes --> AP[\"Acute prostatitis likely\"]\n    MP -- No --> ML{\"Leucocytes/nitrites on dipstick?\"}\n    ML -- Yes --> MF{\"Frequency/urgency?\"}\n    MF -- No --> MUS2[\"MUS likely\"]\n    MF -- Yes --> CUTI\n    ML -- No --> MG[\"If glucose: exclude diabetes<br/>If no glucose: discuss/refer\"]\n    G1 -- No --> BR{\"Blood on dipstick or flow problem?\"}\n    BR -- \"Blood on dipstick\" --> MIC[\"Urine microscopy (+ Schistosoma ova if at risk)\"]\n    MIC -- \"Schistosoma positive\" --> SCH[\"Schistosomiasis likely\"]\n    MIC -- \"Negative / not at risk\" --> BLM[\"If blood on microscopy, refer same week\"]\n    BR -- \"Leakage of urine\" --> LEAK[\"Medication review, advice, refer if prolapse/no response\"]\n    BR -- \"Poor stream or difficulty passing urine\" --> STREAM[\"If on amitriptyline doctor to review, otherwise refer\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `Urinary symptoms` (finding) | `Check for urgent urinary symptom conditions` (red box) and `Check for urinary infection features` (approach below it), both triggers |\n| Red box: unable to pass urine with lower abdominal discomfort/distension | `Unable to void urine` **and** (abdominal discomfort or distension, site lower abdomen) | `Urgent: urinary symptoms with danger signs`, first branch |\n| Red box: complicated pyelonephritis likely | Flank pain **and** (leucocytes or nitrites) **and** any of the seven factors | `Diagnose probable complicated pyelonephritis (urinary symptoms)`; priority uses the criteria directly (see remaining questions) |\n| Red box: kidney disease likely | (Blood in urine or proteinuria) **and** (new face/foot swelling, SBP ≥ 140 or DBP ≥ 90, oliguria) | `Diagnose probable kidney disease (urinary symptoms)` → `(active_condition Kidney disease)` in the priority rule |\n| Red box: kidney stone likely | Blood in urine **and** sudden, severe, unilateral flank pain or inguinal pain | `Diagnose probable kidney stone (urinary symptoms)` → `(active_condition Kidney stone)` in the priority rule |\n| Uncomplicated pyelonephritis likely | Flank pain **and** (leucocytes or nitrites) | `Diagnose probable uncomplicated pyelonephritis (urinary symptoms)` |\n| Burning/frequency/urgency, woman/man, glucose, catheter/diabetes/pregnancy/urinary tract problem, urethral discharge, perineal/body pain, prostate tenderness | Findings checked for | `Check for urinary infection features` |\n| Woman, leucocytes/nitrites, no complicating factor → Simple UTI likely | Female **and** (leucocytes or nitrites) **and** no catheter, diabetes, pregnancy or urinary system disorder | `Diagnose probable simple UTI in a woman (urinary symptoms)` |\n| Woman, leucocytes/nitrites, complicating factor → Complicated UTI likely | Female **and** (leucocytes or nitrites) **and** any of the four factors | `Diagnose probable complicated UTI (urinary symptoms)`, woman branch |\n| Man, no prostatitis signs, leucocytes/nitrites, frequency/urgency → Complicated UTI likely | Male, no perineal/body pain, prostate not tender, (leucocytes or nitrites), (frequency or urgency) | `Diagnose probable complicated UTI (urinary symptoms)`, man branch |\n| Man: urethral discharge → MUS likely | Male, gate, urethral discharge | `Diagnose probable male urethritis syndrome (urinary symptoms)`, first branch |\n| Man, no prostatitis signs, leucocytes/nitrites, no frequency/urgency → MUS likely | Male, no perineal/body pain, prostate not tender, (leucocytes or nitrites), no frequency, no urgency | `Diagnose probable male urethritis syndrome (urinary symptoms)`, second branch |\n| Man: perineal/body pain or prostate tender → Acute prostatitis likely | Male, gate, (perineal pain or generalised aches and pains or prostate tenderness) | `Diagnose probable acute prostatitis (urinary symptoms)` |\n| No leucocytes/nitrites + glucose → exclude diabetes (woman and man) | Gate by burning/frequency/urgency, no leucocytes, no nitrites, glycosuria (man: also no prostatitis signs) | `Diagnose possible diabetes (urinary symptoms with glycosuria)` |\n| Woman, no leucocytes/nitrites + frequency → exclude pregnancy | Female, no leucocytes, no nitrites, increased frequency | `Diagnose possible pregnancy (urinary frequency)` |\n| Schistosoma positive → Schistosomiasis likely | Not modelled: a positive *Schistosoma* ova result has no recordable finding | – (see remaining questions) |\n| Discuss/refer, microscopy, leakage of urine, poor stream | Management or routing only | – |\n\n## Notes\n\n- \"Burning\" is read as `Dysuria`, \"frequency\" as `Increased frequency of urination`, \"urgency\" as\n  `Urgent desire to urinate`.\n- \"Leucocytes/nitrites\" is `Leukocytes in urine` **or** `Nitrite detected in urine`; \"no\n  leucocytes/nitrites\" is `(no …)` of both.\n- BP < 90/60 is systolic < 90 **or** diastolic < 60; BP ≥ 140/90 is systolic ≥ 140 **or** diastolic ≥ 90.\n", "questions": "# Page 69 – Urinary symptoms: remaining questions\n\nFinal build reconciled from builders A and B (base: B; task split from A; see `reconcile.json`).\n\n## Decisions made\n\n- **Trigger.** Both `check_for` tasks and the priority rule are anchored on\n  `(clinical_finding (snomed_concept \"Urinary symptoms\" \"finding\"))`. It isn't a recorded common\n  symptom or warning sign and has no SNOMED children, so the rules fire only once intake records it.\n- **Two tasks.** `Check for urgent urinary symptom conditions` holds the red-box findings;\n  `Check for urinary infection features` holds the findings of the \"not needing urgent attention\"\n  algorithm (burning/frequency/urgency, woman/man, glucose, the woman's and man's questions), as the\n  page separates the two.\n- **Priority rule.** Following Will's briefing, kidney disease and kidney stone are referenced as\n  `(active_condition Kidney disease)` / `(active_condition Kidney stone)`. Complicated pyelonephritis\n  is written out (flank pain, leucocytes or nitrites, and any of the seven factors), because the\n  non-urgent \"uncomplicated pyelonephritis likely\" rule diagnoses the same `Acute pyelonephritis`\n  concept, and `(active_condition Acute pyelonephritis)` would make every pyelonephritis Urgent.\n- **Complicated and uncomplicated pyelonephritis** are two `probable Acute pyelonephritis` rules, one\n  per \"likely\" statement on the page. The uncomplicated rule does not negate the complicating factors,\n  so in complicated cases both fire; they diagnose the same concept.\n- **BP pairs.** BP < 90/60 = systolic < 90 **or** diastolic < 60; BP ≥ 140/90 = systolic ≥ 140 **or**\n  diastolic ≥ 90.\n- **One-sided flank/groin pain** = `Flank pain` / `Inguinal pain` with qualifiers `Sudden onset`,\n  `Severe (severity modifier)` and `Unilateral` (the page's \"one-sided\"), rather than left/right\n  precoordinated concepts.\n- **Lower abdominal discomfort/distension** = `Abdominal discomfort` / `Distension of abdomen` with\n  `finding_site` Lower abdomen structure. **New swelling of face/feet** = `Swelling` +\n  `finding_site` Face structure / Foot structure + `New`. All body structures resolve.\n- **Diabetes and urinary tract problem** are plain `clinical_finding` forms, so the `(no …)` forms in\n  the simple-UTI rule match the `check_for` forms.\n- **\"Leucocytes/nitrites\"** = `Leukocytes in urine` **or** `Nitrite detected in urine`; \"no\n  leucocytes/nitrites\" = `(no …)` of both. **Burning/frequency/urgency** = `Dysuria`, `Increased\n  frequency of urination`, `Urgent desire to urinate`. Glucose on dipstick = `Glycosuria`; passing\n  little urine = `Oliguria`.\n- **Woman/man/male** are the findings `Female` and `Male`.\n- **Diagnosis concepts:** simple UTI → `Lower urinary tract infectious disease`; complicated UTI →\n  `Urinary tract infectious disease`; MUS (male urethritis syndrome) → `Urethritis`.\n- **The man's rules and the flowchart gate.** The MUS-by-discharge and acute prostatitis rules require\n  the column gate (burning/frequency/urgency or leucocytes/nitrites), because the Man box sits under it.\n- **No branches** use `(no …)` and fire only when the negative is recorded (simple UTI's four\n  factors; the man's \"No\" to perineal/body pain and prostate tenderness; MUS with no\n  frequency/urgency; no leucocytes/nitrites for the \"exclude\" rules).\n- **\"Exclude diabetes\" / \"exclude pregnancy\"** are `possible` diagnoses of `Diabetes mellitus` and\n  `Pregnancy`.\n- No `measure` task: dipstick results are findings, BP and pulse are routine vitals.\n- Management elements (catheter, medicines, fluids, referral, notification, advice) are not encoded.\n\n## Could not model\n\n- **Sex.** The language has no demographic sex form. If VHA never records `Male` / `Female` as\n  findings, the Woman/Man rules and the \"male\" factor of complicated pyelonephritis will never fire\n  (they fire **less often** than the page intends).\n- **Schistosomiasis likely** (blood on dipstick → microscopy → Schistosoma positive): no finding\n  concept for a positive *Schistosoma* ova result, and \"at risk of bilharzia\" (footnote 6) has no\n  form. Footnote 6's \"treat as schistosomiasis if microscopy not available\" is not modelled either.\n- **\"Not needing urgent attention\":** the non-urgent rules do not exclude the red-box features, so a\n  patient can be both Urgent and, e.g., probable UTI.\n- **Blood on microscopy → refer same week**, the leakage-of-urine and poor-stream branches, all\n  \"discuss/refer\" leaves and \"recurrent UTI\" → MCS are management or routing. Footnote 5 (repeat the\n  dipstick after menstruation) is a management note.\n\n## SNOMED gaps\n\n- No complicated / uncomplicated pyelonephritis: `Acute pyelonephritis` used.\n- No simple / complicated UTI: `Lower urinary tract infectious disease` / `Urinary tract infectious\n  disease` used.\n- No male urethritis syndrome: `Urethritis` used.\n- No \"burning micturition\": `Dysuria` used. No \"glucose in urine\": `Glycosuria` used. No \"groin\n  pain\": `Inguinal pain` used.\n- No finding for *Schistosoma* ova in urine (only organism concepts such as `Egg of genus\n  Schistosoma`): not encoded.\n- No precoordinated new face or foot swelling: `Swelling` + `finding_site` + `New`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Does \"perineal/body pain\" in the Man column mean generalised body aches (encoded as `Generalized\n  aches and pains`), perineal pain only, or something else (e.g. pubic, back or bony pain)?\n- Is simple UTI → `Lower urinary tract infectious disease` (builder A proposed `Acute cystitis`) and\n  complicated UTI → `Urinary tract infectious disease` acceptable, or should both be one concept?\n- The priority rule uses `(active_condition Kidney disease)` and `(active_condition Kidney stone)` as\n  Will's briefing asks. Any recorded kidney disease or kidney stone (including a known chronic one or\n  a descendant concept) will then make a patient with urinary symptoms Urgent, which the page does not\n  say. Should the red-box criteria be written out instead, as was done for complicated pyelonephritis?\n- Should a man with urethral discharge be classed as MUS even without burning, frequency, urgency or\n  leucocytes/nitrites? The rule currently requires one of them.\n- Should the non-urgent diagnoses be suppressed when a red-box feature is present?\n- How is the patient's sex recorded? If not as the `Male` / `Female` findings, the sex-dependent rules\n  won't fire.\n- Should \"urinary tract problem\" be any disorder of the urinary system, as encoded, or only\n  structural abnormalities?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent urinary symptom conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Urinary symptoms\" \"finding\"))", "element_keys": ["p69-0b341ae3"], "quote": "urinary symptoms"}, {"claim_id": "c002", "rule": "Check for urgent urinary symptom conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to void urine\" \"finding\"))", "element_keys": ["p69-6c03febf"], "quote": "Unable to pass urine"}, {"claim_id": "c003", "rule": "Check for urgent urinary symptom conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abdominal discomfort\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Lower abdomen structure\" \"body structure\")))", "element_keys": ["p69-6c03febf"], "quote": "lower abdominal discomfort"}, {"claim_id": "c004", "rule": "Check for urgent urinary symptom conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Distension of abdomen\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Lower abdomen structure\" \"body structure\")))", "element_keys": ["p69-6c03febf"], "quote": "lower abdominal discomfort/distension"}, {"claim_ _reason": "'Schistosomiasis likely' is an 'X likely' conclusion; the house standard wants a probable diagnosis rule. Notify, praziquantel, advice and refer-if lines are management.", "verdict": "missing", "parts_missing": ["probable diagnosis of schistosomiasis when Schistosoma ova are positive", "footnote 6 shortcut: microscopy not available and lives in endemic area -> treat as schistosomiasis"], "problem": "No rule, check_for item or diagnosis concept for schistosomiasis anywhere in the file. 'Urinary schistosomiasis' (disorder) and 'Schistosoma haematobium infection' (disorder) both exist in SNOMED, so the diagnosis itself is representable.", "evidence": [], "confidence": "high"}, {"element_key": "p69-b2e0b82d", "scope": "out_of_scope", "scope_reason": "figure_or_note", "verdict": null, "parts_missing": [], "problem": "Footnotes. Footnote 5 (repeat dipstick after menstruation) and 7 (notification) are notes; footnotes 1-4 are prescribing cautions. Footnote 6 contains a diagnostic shortcut ('if microscopy not available and patient lives in endemic area, treat as schistosomiasis'); 'microscopy not available' is not a patient finding the language can express, so it is listed as a missing part under p69-ac69a490 for the record rather than judged here.", "evidence": [], "confidence": "medium"}], "outside_not_logic": ["p69-9f1edd96", "p69-37c1c27a", "p69-15eba772", "p69-2fcd8dd0", "p69-cd541602", "p69-585ba3ec", "p69-d19318f1", "p69-a338b4d5", "p69-2c52b11d", "p69-24bde58b", "p69-da72dd5c", "p69-84f72188", "p69-0c4fa8ed", "p69-ae8096bd", "p69-c60ef982", "p69-3e2570b1", "p69-8227148b", "p69-51648b0c", "p69-7a81b407"], "rule_level_problems": [{"rule": "(whole file) / Schistosomiasis branch", "problem": "The right-hand half of the flowchart ('No burning/frequency/urgency and no leucocytes/nitrites' -> 'Blood on dipstick' -> microscopy -> 'Schistosoma positive' -> 'Schistosomiasis likely') is absent: no check_for item, no probable diagnosis rule, no use of 'Blood in urine fection features -> Schistosoma ova -> 'Schistosomiasis likely'), which has no rule although 'Urinary schistosomiasis' exists in SNOMED. Second, the uncomplicated and complicated pyelonephritis rules share one diagnosis concept and the uncomplicated rule has no exclusions, so they are indistinguishable; and the priority rule's active_condition triggers on Kidney disease and Kidney stone will mark patients with pre-existing kidney disease Urgent."}, {"page": 69, "checker": "forward-2", "elements": [{"element_key": "p69-0b341ae3", "scope": "out_of_scope", "scope_reason": "figure_or_note", "verdict": "", "parts_missing": "", "problem": "", "evidence": [], "confidence": "high"}, {"element_key": "p69-6c03febf", "scope": "in_scope", "scope_reason": "", "verdict": "correct", "parts_missing": [], "problem": "Urgent priority and check list encode unable to void AND (lower abdominal discomfort OR distension). Page says 'discomfort/distension', handled as or; correct.", "evidence": ["Urgent: urinary symptoms with danger signs :: (and (clinical_finding \"Unable to void urine\") (or (clinical_finding \"Abdominal discomfort\" (finding_site \"Lower abdomen structure\")) (clinical_finding \"Distension of abdomen\" (finding_site \"Lower abdomen structure\"))))"], "confidence": "high"}, {"element_key": "p69-fdf84f8c", "scope": "in_scope", "scope_reason": "", "verdict": "partial", "parts_missing": ["Complicated pyelonephritis is not distinguishable from uncomplicated: both rules emit the identical diagnosis 'Acute pyelonephritis' probable, and the uncomplicated rule (flank pain + leucocytes/nitrites) fires whenever the complicated one does"], "problem": "Criteria are all encoded correctly (flank pain, leucocytes OR nitrites, any of vomiting, SBP<90, DBP<60, pulse>=100, diabetes, male, pregnant, postmenopausal), including the 'BP < 90/60' split. But the 'complicated pyelonephritis likely' conclusion has no distinct identity; the same concept is used for the non-urgent route, so downstr mplicated = urgent, ceftriaxone IV/IM; uncomplicated = oral ciprofloxacin) survives only in the priority rule. Add (no ...) for the seven complicating features to the uncomplicated rule, or document the collapse deliberately.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: urinary symptoms with danger signs", "text": "Two of the four Urgent branches are (active_condition \"Kidney disease\") and (active_condition \"Kidney stone\"). Descendants match in due_to and 'Chronic kidney disease' is-a 'Kidney disease', so any patient with urinary symptoms and a pre-existing kidney disease (or a previously recorded stone) on their record is marked Urgent, which the page does not say: its trigger is the acute criteria (blood/protein + new swelling/BP/oliguria; blood + sudden severe one-sided pain). This is the house pattern from the briefing, but 'Kidney disease' is a common chronic condition in this population, so the over-trigger is larger here than on most pages. Inlining the criteria, as was done for pyelonephritis, would avoid it.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for urinary infection features / Diagnose probable simple UTI in a woman / Diagnose probable complicated UTI", "text": "'Urinary tract problem' is encoded as 'Disorder of urinary system', whose descendants include Kidney disease, Kidney stone, Urinary tract infectious disease, Urethritis, Proteinuria of undiagnosed cause and Hematuria syndrome, i.e. the very conditions this page records. If any of these is on the record as a clinical finding, the Simple UTI rule is suppressed and the Complicated UTI rule fires; the page means a known structural/functional urinary tract problem. A narrower concept (e.g. 'Disorder of urinary tract proper' or a 'Known present' qualifier) would be closer; at minimum this should be noted.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable complicated UTI (urinary symptoms), male branch", "text": "The page sends a man with urethral discharge to MUS (page 63); the male complicated-UTI branch does not exclude Urethral discharge, so such a man gets both Urethritis and Urinary tract infectious disease. The page is ambiguous about whether the second bullet applies to him, so this is a judgment call, not an error.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for urgent urinary symptom conditions / Check for urinary infection features", "text": "Minor concept choices: 'Oliguria' for 'passing little urine' where 'Decreased urine output' (finding) is the closer paraphrase; 'Generalized aches and pains' for 'body pain' where 'Generalized acute body pains' (finding) exists. Neither is wrong. The flow-problem branch (leakage of urine, poor stream/difficulty passing urine) is referral-only with no diagnosis, so its omission is consistent with the no-manage-tasks rule; 'Urinary incontinence' and 'Difficulty passing urine' exist should a later pass want them.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "high", "ref": "Diagnose probable complicated pyelonephritis / uncomplicated pyelonephritis", "text": "Both emit 'Acute pyelonephritis' probable. The uncomplicated rule's criteria are a subset of the complicated one's, so the pair is redundant and the urgent/non-urgent distinction is lost. No exclusion of the complicating features in the uncomplicated rule.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: urinary symptoms with danger signs", "text": "Kidney disease and kidney stone triggers use active_condition rather than the page's criteria; this works only if the diagnosis rules feed active conditions. Complicated pyelonephritis criteria are inlined while the other two are not (inconsistent). Priority is fine for the page (red box = urgent).", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable simple UTI / complicated UTI", "text": "Different concepts (Lower urinary tract infectious disease vs Urinary tract infectious disease) where the page has simple vs complicated UTI; complicated is a supertype so it subsumes simple. Male complicated UTI does not exclude urethral discharge, so it overlaps with MUS.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "(whole page)", "text": "Blood on dipstick / schistosomiasis branch and flow-problem branch (leakage, poor stream) have no rules or check_for items.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for urinary infection features", "text": "Check list has no items for blood on dipstick, bilharzia exposure, or leakage/poor stream.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for urgent urinary symptom conditions", "text": "Protein/blood/little urine and BP lack measurement checks, though they are used by the rules; 'Body pain' mapped to 'Generalized aches and pains' (loose).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "high", "ref": "(none) schistosomiasis branch", "text": "The whole 'No burning/frequency/urgency and no leucocytes/nitrites -> Blood on dipstick -> Schistosoma positive -> Schistosomiasis likely' branch is lost. 'Urinary schistosomiasis' (disorder) and 'Urine microscopy: parasites present' (finding) exist, so it is representable.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable uncomplicated pyelonephritis (urinary symptoms)", "text": "Same diagnosis concept as the complicated rule and a strict subset of its criteria, so every complicated case also fires the 'uncomplicated' rule and the output cannot distinguish them; the page's split (urgent vs not urgent) survives only in the priority rule.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable simple UTI in a woman / complicated UTI", "text": "'Urinary tract problem' is encoded as 'Disorder of urinary system', which has UTI and kidney stone as descendants: any recorded urinary disorder (including a prior UTI) blocks simple UTI and forces complicated UTI. Also 'Lower urinary tract infectious disease' is_a 'Urinary tract infectious disease', so simple and complicated UTI concepts nest.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible pregnancy (urinary frequency)", "text": "Does not require the branch entry explicitly beyond frequency itself (acceptable), but fires in women already known to be pregnant; harmless.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for urinary infection features", "text": "Nothing is checked for the right-hand branch of the page: blood on dipstick with Schistosoma ova on microscopy / bilharzia risk, which the page resolves to 'Schistosomiasis likely'. The check_for list matches the left-hand branch faithfully.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable uncomplicated pyelonephritis (urinary symptoms)", "text": "The page puts 'uncomplicated pyelonephritis likely' under 'not needing urgent attention', i.e. flank pain with leucocytes/nitrites and none of the complicating features (vomiting, BP < 90/60, pulse ≥ 100, diabetes, male, pregnant, post menopause). The rule has no exclusion of those features, so it also fires for every complicated case. Because both rules diagnose the same concept the practical effect is small, but the rule is not faithful to the page's branching.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable complicated pyelonephritis (urinary symptoms)", "text": "Duplicates the Urgent branch; the diagnosis \"Acute pyelonephritis\" cannot be told apart from the uncomplicated rule.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "high", "ref": "Diagnose probable uncomplicated pyelonephritis (urinary symptoms)", "text": "No exclusion of the complicating features, so it fires with every complicated case and gives the same diagnosis. The page offers it only in the non-urgent approach.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable simple UTI in a woman (urinary symptoms)", "text": "Condition \"Burning/frequency/urgency or leuc/nit\" alternative is not encoded. The leuc/nit requirement matches the \"If leucocytes/nitrites\" bullet. Overlap with the complicated rule is avoided. Minor.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable complicated UTI (urinary symptoms)", "text": "The male branch does not exclude urethral discharge, so it can fire together with male urethritis. The page checks for discharge first.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "high", "ref": "Urgent: urinary symptoms with danger signs", "text": "Kidney disease and kidney stone branches use active_condition rather than the page criteria. Kidney disease and kidney stone urgency is likely never triggered by findings alone.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for urgent urinary symptom conditions", "text": "Covers all four red-box criteria correctly. Face/foot swelling would be better as the precoordinated Facial swelling / Foot swelling. Male/Pregnancy/Postmenopausal state are recorded as clinical findings, so they only fire if a health worker records them as findings, not from demographics.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable complicated pyelonephritis (urinary symptoms)", "text": "Logic matches the red-box line exactly (BP < 90/60 split as systolic<90 OR diastolic<60 is the usual reading). But it emits the same concept, Acute pyelonephritis probable, as the uncomplicated rule, so the output can't tell the two apart.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 69, "slug": "69-urinary-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable uncomplicated pyelonephritis (urinary symptoms)", "text": "Page: uncomplicated pyelonephritis is flank pain + leucocytes/nitrites in a patient NOT meeting the urgent criteria. T <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
