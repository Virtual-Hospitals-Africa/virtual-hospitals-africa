tient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "Bruising around eyes or behind ears", "bbox": [551.3, 186.6, 649.0, 207.4], "key": "p30-ff9f21fd"}, {"id": "p30-rb1-e29", "page": 30, "box": 1, "kind_hint": "criterion", "section": "Head injury and any of", "section_y": 126.2, "indent": 1, "parent": null, "text": "Vomiting ≥ 2 times", "bbox": [670.4, 186.6, 748.3, 197.4], "key": "p30-0a066fd7"}, {"id": "p30-rb1-e30", "page": 30, "box": 1, "kind_hint": "unclassified", "section": "blood in urine", "section_y": 136.2, "indent": 2, "parent": null, "text": "If shock1/SBP < 80, give sodium chloride 0.9% 1L IV rapidly, repeat until systolic BP > 80. Continue 1L 6 hourly. Stop if breathing worsens.", "bbox": [133.3, 196.3, 273.8, 237.2], "key": "p30-054dcaa4"}, {"id": "p30-rb1-e31", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "If pain severe, give morphine 5-10mg IM or 3-5mg slow IV2. Avoid if severe head injury.", "bbox": [294.8, 196.3, 532.9, 217.2], "key": "p30-c399cf16"}, {"id": "p30-rb1-e32", "page": 30, "box": 1, "kind_hint": "criterion", "section": "Head injury and any of", "section_y": 126.2, "indent": 1, "parent": null, "text": "≥ 1 other injury", "bbox": [670.4, 196.6, 735.1, 207.4], "key": "p30-0a524cc7"}, {"id": "p30-rb1-e33", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "Blood behind eardrum", "bbox": [551.3, 206.6, 643.5, 217.4], "key": "p30-887593ad"}, {"id": "p30-rb1-e34", "page": 30, "box": 1, "kind_hint": "criterion", "section": "Head injury and any of", "section_y": 126.2, "indent": 1, "parent": null, "text": "Drug/alcohol intoxication", "bbox": [670.4, 206.6, 774.0, 217.4], "key": "p30-b0b28169"}, {"id": "p30-rb1-e35", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "If poor perfusion, weakness/numbness below fracture, gently re-align into normal position.", "bbox": [294.8, 216.3, 536.6, 237.2], "key": "p30-574433b2"}, {"id": "p30-rb1-e36", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "If GCS < 15, neck/spine tenderness, weak/numb limb or abnormal pupils, apply rigid neck collar and sandbags/ blocks on either side of head.", "bbox": [551.3, 226.6, 770.2, 257.5], "key": "p30-254a2e4e"}, {"id": "p30-rb1-e37", "page": 30, "box": 1, "kind_hint": "unclassified", "section": "blood in urine", "section_y": 136.2, "indent": 2, "parent": null, "text": "If excessive or pulsatile bleeding, apply direct pressure and elevate limb.", "bbox": [133.3, 236.3, 267.5, 267.2], "key": "p30-5aa5fe0d"}, {"id": "p30-rb1-e38", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "If open fracture, remove foreign material, irrigate with sodium chloride 0.9% and cover with saline-soaked gauze. Discuss antibiotic management with referral hospital.", "bbox": [294.8, 236.3, 532.0, 267.2], "key": "p30-c6de74a8"}, {"id": "p30-rb1-e39", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "If pupils unequal or respond poorly to light, keep body straight and tilt to raise head (avoid bending spine).", "bbox": [551.3, 256.6, 767.7, 277.5], "key": "p30-a53ee2d8"}, {"id": "p30-rb1-e40", "page": 30, "box": 1, "kind_hint": "unclassified", "section": "blood in urine", "section_y": 136.2, "indent": 2, "parent": null, "text": "If bleeding severe and persists, apply tourniquet above injury.", "bbox": [133.3, 266.3, 258.3, 287.2], "key": "p30-b6e36eb0"}, {"id": "p30-rb1-e41", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "Splint limb to immobilise joint above and below fracture.", "bbox": [294.8, 266.3, 517.8, 277.2], "key": "p30-e1901b42"}, {"id": "p30-rb1-e42", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "If pelvic fracture, tie sheet tightly around hips to immobilise.", "bbox": [294.8, 276.3, 530.2, 287.2], "key": "p30-af0dd304"}, {"id": "p30-rb1-e43", "page": 30, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the injured patient:", "section_y": 91.6, "indent": 1, "parent": null, "text": "If seizures 20.", "bbox": [551.3, 276.6, 617.5, 287.5], "key": "p30-fd5f4160"}, {"id": "p30-rb1-e44", "page": 30, "box": 1, "kind_hint": "unclassified", "section": "blood in urine", "section_y": 136.2, "indent": 1, "parent": null, "text": "Refer urgently. While awaiting transport, check BP, pulse, respiratory rate, oxygen saturation and GCS every 15 minutes.", "bbox": [60.5, 296.7, 521.1, 307.5], "key": "p30-04de7f0b"}, {"id": "p30-rb1-e45", "page": 30, "box": 1, "kind_hint": "unclassified", "section": "blood in urine", "section_y": 136.2, "indent": 1, "parent": null, "text": "If open wound, suture as below and give tetanus toxoid 0.5mL IM if none in past 5 years.", "bbox": [60.5, 306.7, 408.8, 317.5], "key": "p30-cf8be550"}, {"id": "p30-rb1-e46", "page": 30, "box": 1, "kind_hint": "unclassified", "section": "blood in urine", "section_y": 136.2, "indent": 1, "parent": null, "text": "If BP < 90/60, pulse > 100 or < 50, respiratory rate > 20 or < 9, oxygen saturation < 94% or drop in GCS, reassess airway, breathing, circulation, level of consciousness 16.", "bbox": [60.5, 316.7, 713.9, 327.5], "key": "p30-563381a4"}, {"id": "p30-out-e01", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "THE INJURED PATIENT", "bbox": [330.2, 48.5, 515.5, 70.8], "key": "p30-4a1548a1"}, {"id": "p30-out-e02", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Wound • Apply direct pressure to stop bleeding. Remove foreign material, loose/dead skin. Wash well with chlorhexidine 0.05% aqueous solution under running water for 5 minutes. Apply povidone iodine 10% solution if dirty. • If sutures needed, inject lidocaine without adrenaline 3 1% or 2% around wound to numb area. Apply non-adherent dressing for 24 hours. Plan to remove sutures after 5 days (face), 4 days (neck), 10 days (leg) or 7 days (rest of body). • Avoid suturing if > 12 hours (body), > 24 hours (head/neck), remaining foreign material, infected, gunshot or deep puncture: - Pack wound with saline-soaked gauze. If infected give cefalexin4 500mg or flucloxacillin4 500mg 6 hourly for 5 days. - Review in 2 days. Suture if needed and no infection, unless gunshot/deep puncture (irrigate and dress every 2 days instead). • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed for up to 5 days. • Advise patient to return if signs of infection (red, warm, painful, swollen, foul-smell or pus). • Refer if unable to close wound easily, weakness/numbness below injury, cosmetic concerns or wound infected. • If not healed completely after 3 months or heals by < 50% after 6 weeks on treatment 91.", "bbox": [39.7, 395.5, 498.6, 516.5], "key": "p30-234232d0"}, {"id": "p30-out-e03", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Fracture • Splint limb to immobilise joint above and below fracture. • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) and add ibuprofen5 400mg 8 hourly with/after food for up to 5 days if needed. • Do x-ray and refer to doctor same day.", "bbox": [517.3, 395.5, 618.1, 516.5], "key": "p30-7bba7e17"}, {"id": "p30-out-e04", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the injured patient not needing urgent attention • Refer same day if pregnant, known bleeding disorder, on anticoagulant, involved in high-speed collision, ejected from/hit by vehicle or fell > 3 metres. If sexual assault 32 or abuse 33. • If open wound, give tetanus toxoid 0.5mL IM if none in past 5 years.", "bbox": [39.7, 349.9, 731.2, 381.1], "key": "p30-06e0a102"}, {"id": "p30-out-e05", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Head injury • Observe for 2 hours before discharging. • If mild headache, dizziness or mental fogginess, concussion likely:", "bbox": [637.8, 395.5, 790.0, 436.5], "key": "p30-661aaf0e"}, {"id": "p30-out-e06", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- Advise complete rest for 2 days. If no", "bbox": [643.5, 436.3, 784.1, 446.5], "key": "p30-401805c4"}, {"id": "p30-out-e07", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "symptoms ≥ 3 days, gradually increase exertion. - Advise that recovery can take > 1 month. - Give paracetamol 500mg-1g 4-6 hourly", "bbox": [643.5, 446.3, 802.6, 486.5], "key": "p30-737f0436"}, {"id": "p30-out-e08", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "(up to 4g in 24 hours) for up to 5 days. • Advise to return immediately if any of above symptoms of severity develop.", "bbox": [637.8, 486.3, 788.6, 516.5], "key": "p30-e10396a7"}, {"id": "p30-out-e09", "page": 30, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely. 2Dilute 10mg morphine with 9mL of sodium chloride 0.9%. Give diluted morphine slowly at 1mL/minute. If needed, give another 1mL/min until pain improved, up to 10mL. Stop if BP drops < 90/60. 3Calculate volume to inject (max 3mg/kg): use 0.15mL/kg of lidocaine 2% and 0.3mL/kg of lidocaine 1%. 4If severe penicillin allergy (history of anaphylaxis, urticaria or angioedema), give azithromycin 500mg daily for 3 days instead. 5Avoid ibuprofen if peptic ulcer, asthma, hypertension, heart failure, kidney disease or pregnant.", "bbox": [34.0, 526.6, 797.3, 551.8], "key": "p30-93a633d2"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 336.8]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAIKCAIAAAAWPg+QAAAACXBIWXMAABcSAAAXEgFnn9JSAAMPRElEQVR4nOy9B3AUSRfn+d3exu3F7V3E7W5sXNzFXnxDC5BwAoFAOOE9g/feew/CCe/NDDAgnPDeCe+EQCCEQDgJhBAeBiu89zDM9P7VD+UkZbKqpZZaDC/jFwpVVlVm1suX5r3OyvrXs/+Rm2EYhmEYhmEYhmEYhmG+L/7l9RIwDMMwDMMwDMMwDMMwjLuwV4thGIZhGIZhGIZhGIb5/vjGq/Vh0dQPq2YyDMMwDMMwDMMwDMMwTA7k3bgQY6/Wn89OOf+4wDAMwzAMwzAMwzAMwzA5kM/xEezVYhiGYRiGYRiGYRiGYb4z2KvFMAzDMAzDMAzDMAzDfH+wV4thGIZhGIZhGIZhGIb5/mCvFsMwDMMwDMMwDMMwDPP9wV4thmEYhmEYhmEYhmEY5vuDvVoMwzAMwzAMwzAMwzDM9wd7tRiGYRiGYRiGYRiGYZjvD/ZqMQzDMAzDMAzDMAzDMN8f7NViGIZhGIZhGIZhGIZhvj/Yq8UwDMMwDMMwDMMwDMN8f7BXi2EYhmG8wKtnJ71eBkbBp3dJ718ner0YNrl/JzZq7xJw/fK+zKf2+vnpPz+dt389LsYt2fm8j1Lj6HmvXozMnhy/L31gGIZhmB8H9moxDMMwjOe5dH730vCJoUO7t25Rr2vHZiOGdd+5dd4fH5KdLhdAnZqVcufKtWjBeK+XkzHk9o3oooULFszne/LYBq8Xxg7bIsIc//43mPXr8EwmtXvHAt/cPmWCir1+bmsqiMtKBxX1y+OzZ8fCbHveqL1L6HmnThqUDdl9d/rAMAzDMD8O7NViGIZhGE/y4G7soH4dyOSW8S+Q78vHNK/Ws0fxuXPlQkz71g29Xtqs5sqFPcsWTerVvZVNF4nM+9eJ+3Yvmji2/8plU0Xko9S4iPW/DQ3pcuKox/wL+kJG7VlMtbZw7liPy8TwuTJZYA96tcaO6kNJnT29xc715xK30fXjRvfxuKzMyFKvVvyRdXNmjhgV2vPv7DyqD5lXAIZhGIZhBOzVYhiGYRiP8fr5qeDSxckA9suTu1nj2iH9O3bv0qJG1XJdOjYVl23fPHfEsO5XLu71eoGzmnatG5A0nj2Kd/feM6e20L2jQ3uJyAVhYyhy787wrCvkp3dJYbNGTp006MWTEx6XieFzZbLAHvRqpd45PHZk7+WLJ9u/ZWn4xHGj+zy4G+txWZmRpV4tvz JSUlJSUlJSUlJSOv0oMav1/QOTv5/7RyUlJSUlJSUlJSUlJSUlJSUlpVOQDk4YEp/VUlJSUlJSUlJSUlJSUlJSUlJSOi1Is1pKSkpKSkpKSkpKSkpKSkpKSqcfaVZLSUlJSUlJSUlJSUlJSUlJSen0o/8PYQ57m0CjzAEAAAAASUVORK5CYII="}, "page_image": null, "lisp": ";; Page 30 - The injured patient\n;; Red box: \"Give urgent attention to the injured patient:\" with four groups\n;; (Bruising and blood in urine / Wound and any of / Fracture and any of / Head injury and any of).\n;; Footnote 1 (shock likely) and the lower \"Head injury\" box (concussion likely) give the\n;; diagnosis rules. Management (fluids, morphine, splinting, collar, referral, monitoring) is not encoded.\n\n(task\n  \"Check for urgent injured patient conditions\"\n  adult\n  (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))\n  (check_for\n    ;; Which kind of injury (each opens its own red-box group)\n    (clinical_finding (snomed_concept \"Wound\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of bone\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Injury of head\" \"disorder\"))\n\n    ;; Bruising and blood in urine\n    (clinical_finding (snomed_concept \"Contusion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Blood in urine\" \"finding\"))\n\n    ;; Footnote 1: shock likely\n    (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Asthenia\" \"finding\"))\n  )\n)\n(task\n  \"Check for urgent wound conditions in the injured patient\"\n  adult\n  (clinical_finding (snomed_concept \"Wound\" \"disorder\"))\n  (check_for\n    ;; Poor perfusion (cold, pale, numb, no pulse) below injury: the named sign plus its listed parts (no limb pallor concept)\n    (clinical_finding (snomed_concept \"Limb ischemia\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Cold extremity\" \"finding\"))\n    (clinical_finding (snomed_concept \"Numbness of limbs\" \"finding\"))\n    (clinical_finding (snomed_concept \"Peripheral pulse absent\" \"finding\"))\n\n    ;; Excessive or pulsatile bleeding\n    (clinical_finding (snomed_concept \"Bleeding\" \"finding\") (qualifier (snomed_concept \"Excessive\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Bleeding\" \"finding\") (qualifier (snomed_concept \"Pulsatile\" \"qualifier value\")))\n\n    ;; Penetrating wound to head/neck/chest/abdomen\n    (clinical_finding (snomed_concept \"Penetrating wound\" \"disorder\") (finding_site (snomed_concept \"Head structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Penetrating wound of neck\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Penetrating wound\" \"disorder\") (finding_site (snomed_concept \"Thoracic structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Penetrating wound of abdomen\" \"disorder\"))\n  )\n)\n(task\n  \"Check for urgent fracture conditions in the injured patient\"\n  adult\n  (clinical_finding (snomed_concept \"Fracture of bone\" \"disorder\"))\n  (check_for\n    ;; Poor perfusion (cold, pale, numb, no pulse) below fracture\n    (clinical_finding (snomed_concept \"Limb ischemia\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Cold extremity\" \"finding\"))\n    (clinical_finding (snomed_concept \"Peripheral pulse absent\" \"finding\"))\n\n    ;; Increasing pain, muscle tightness, numbness in limb / Weak/numb below fracture\n    (clinical_finding (snomed_concept \"Pain in limb\" \"finding\") (qualifier (snomed_concept \"Increasing\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of limbs\" \"finding\"))\n    (clinical_finding (snomed_concept \"Muscle weakness of limb\" \"finding\"))\n\n    ;; Suspected femur, pelvis or spine fracture\n    (clinical_finding (snomed_concept \"Fracture of femur\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of pelvis\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of vertebral column\" \"disorder\"))\n\n    ;; Open fracture / > 2 rib fractures / Severe deformity\n    (clinical_finding (snomed_concept \"Fracture, open\" \"morphologic abnormality\"))\n    (clinical_finding (snomed_concept \"Fracture of three ribs\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of four ribs\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of five ribs\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of six ribs\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of seven ribs\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fracture of eight OR more ribs\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Deformity\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n  )\n)\n(task\n  \"Check for urgent head injury conditions in the injured patient\"\n  adult\n  (clinical_finding (snomed_concept \"Injury of head\" \"disorder\"))\n  (check_for\n    ;; Consciousness and seizure\n    (clinical_finding (snomed_concept \"Loss of consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n    (clinical_finding (snomed_concept \"Amnesia\" \"finding\"))\n\n    ;; Headache, vomiting\n    (clinical_finding (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n\n    ;; Signs of skull fracture\n    (clinical_finding (snomed_concept \"Fracture of skull\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Ecchymosis of periorbital region\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Ecchymosis of postauricular region\" \"finding\"))\n    (clinical_finding (snomed_concept \"Hematotympanum\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Bleeding from nose\" \"finding\"))\n    (clinical_finding (snomed_concept \"Bleeding from ear\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Clear\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Ear discharge\" \"finding\") (qualifier (snomed_concept \"Clear\" \"qualifier value\")))\n\n    ;; Pupils and limbs\n    (clinical_finding (snomed_concept \"Anisocoria\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Sluggish pupil movement\" \"finding\"))\n    (clinical_finding (snomed_concept \"No pupillary reaction to light\" \"finding\"))\n    (clinical_finding (snomed_concept \"Muscle weakness of limb\" \"finding\"))\n    (clinical_finding (snomed_concept \"Numbness of limbs\" \"finding\"))\n\n    ;; Other injury, intoxication\n    (clinical_finding (snomed_concept \"Multiple injuries\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Intoxication\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Alcohol intoxication\" \"disorder\"))\n\n    ;; Lower \"Head injury\" box: concussion likely\n    (clinical_finding (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Mild\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable shock in the injured patient\"\n  (diagnosis\n    (snomed_concept \"Shock\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Footnote 1: \"If SBP < 80, pulse >= 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely.\"\n  (and\n    (or (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Wound\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture of bone\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Injury of head\" \"disorder\"))\n    )\n    (or (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80)\n        (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n        (> (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)\n        (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n        (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n        (clinical_finding (snomed_concept \"Asthenia\" \"finding\"))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable concussion after head injury\"\n  (diagnosis\n    (snomed_concept \"Concussion injury of brain\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Lower \"Head injury\" box: \"If mild headache, dizziness or mental fogginess, concussion likely\"\n  (and\n    (clinical_finding (snomed_concept \"Injury of head\" \"disorder\"))\n    (or (clinical_finding (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Mild\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n        (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n    )\n  )\n)\n(system_priority_evaluation\n  \"Urgent: injured patient with bruising and blood in urine\"\n  adult\n  Urgent\n  (and\n    (clinical_finding (snomed_concept \"Contusion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Blood in urine\" \"finding\"))\n  )\n)\n(system_priority_evaluation\n  \"Urgent: injured patient with wound danger signs\"\n  adult\n  Urgent\n  (and\n    (clinical_finding (snomed_concept \"Wound\" \"disorder\"))\n    (or (clinical_finding (snomed_concept \"Limb ischemia\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Cold extremity\" \"finding\"))\n        (clinical_finding (snomed_concept \"Numbness of limbs\" \"finding\"))\n        (clinical_finding (snomed_concept \"Peripheral pulse absent\" \"finding\"))\n        (clinical_finding (snomed_concept \"Bleeding\" \"finding\") (qualifier (snomed_concept \"Excessive\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Bleeding\" \"finding\") (qualifier (snomed_concept \"Pulsatile\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Penetrating wound\" \"disorder\") (finding_site (snomed_concept \"Head structure\" \"body structure\")))\n        (clinical_finding (snomed_concept \"Penetrating wound of neck\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Penetrating wound\" \"disorder\") (finding_site (snomed_concept \"Thoracic structure\" \"body structure\")))\n        (clinical_finding (snomed_concept \"Penetrating wound of abdomen\" \"disorder\"))\n    )\n  )\n)\n(system_priority_evaluation\n  \"Urgent: injured patient with fracture danger signs\"\n  adult\n  Urgent\n  (and\n    (clinical_finding (snomed_concept \"Fracture of bone\" \"disorder\"))\n    (or (clinical_finding (snomed_concept \"Limb ischemia\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Cold extremity\" \"finding\"))\n        (clinical_finding (snomed_concept \"Peripheral pulse absent\" \"finding\"))\n        (clinical_finding (snomed_concept \"Pain in limb\" \"finding\") (qualifier (snomed_concept \"Increasing\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Numbness of limbs\" \"finding\"))\n        (clinical_finding (snomed_concept \"Muscle weakness of limb\" \"finding\"))\n        (clinical_finding (snomed_concept \"Fracture of femur\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture of pelvis\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture of vertebral column\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture, open\" \"morphologic abnormality\"))\n        (clinical_finding (snomed_concept \"Fracture of three ribs\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture of four ribs\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture of five ribs\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture of six ribs\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture of seven ribs\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Fracture of eight OR more ribs\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Deformity\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    )\n  )\n)\n(system_priority_evaluation\n  \"Urgent: injured patient with head injury danger signs\"\n  adult\n  Urgent\n  (and\n    (clinical_finding (snomed_concept \"Injury of head\" \"disorder\"))\n    (or (clinical_finding (snomed_concept \"Loss of consciousness\" \"finding\"))\n        (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n        (clinical_finding (snomed_concept \"Headache\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Amnesia\" \"finding\"))\n        (clinical_finding (snomed_concept \"Fracture of skull\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Ecchymosis of periorbital region\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Ecchymosis of postauricular region\" \"finding\"))\n        (clinical_finding (snomed_concept \"Hematotympanum\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Bleeding from nose\" \"finding\"))\n        (clinical_finding (snomed_concept \"Bleeding from ear\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Clear\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Ear discharge\" \"finding\") (qualifier (snomed_concept \"Clear\" \"qualifier value\")))\n        (clinical_finding (snomed_concept \"Anisocoria\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Sluggish pupil movement\" \"finding\"))\n        (clinical_finding (snomed_concept \"No pupillary reaction to light\" \"finding\"))\n        (clinical_finding (snomed_concept \"Muscle weakness of limb\" \"finding\"))\n        (clinical_fin y.", "reason_category": "management_step", "reason": "Tourniquet instruction."}, {"element_key": "p30-e1901b42", "element_id": "p30-rb1-e41", "text": "Splint limb to immobilise joint above and below fracture.", "reason_category": "management_step", "reason": "Splinting."}, {"element_key": "p30-af0dd304", "element_id": "p30-rb1-e42", "text": "If pelvic fracture, tie sheet tightly around hips to immobilise.", "reason_category": "management_step", "reason": "Pelvic binder."}, {"element_key": "p30-fd5f4160", "element_id": "p30-rb1-e43", "text": "If seizures 20.", "reason_category": "cross_reference_only", "reason": "Pointer to seizure page 20; seizure itself is encoded as a head-injury sign."}, {"element_key": "p30-04de7f0b", "element_id": "p30-rb1-e44", "text": "Refer urgently. While awaiting transport, check BP, pulse, respiratory rate, oxygen saturation and GCS every 15 minutes.", "reason_category": "management_step", "reason": "Urgent referral and 15-minute monitoring."}, {"element_key": "p30-cf8be550", "element_id": "p30-rb1-e45", "text": "If open wound, suture as below and give tetanus toxoid 0.5mL IM if none in past 5 years.", "reason_category": "management_step", "reason": "Suturing and tetanus toxoid."}, {"element_key": "p30-563381a4", "element_id": "p30-rb1-e46", "text": "If BP < 90/60, pulse > 100 or < 50, respiratory rate > 20 or < 9, oxygen saturation < 94% or drop in GCS, reassess airway, breathing, circulation, level of cons", "reason_category": "management_step", "reason": "Reassessment triggers (BP < 90/60, pulse, RR, SpO2, GCS) during monitoring of an already urgent patient; routes to page 16, does not add urgency criteria."}], "known_issues": [], "judgment_calls": [{"topic": "Structure of the red box", "decision": "One Urgent priority rule per group (bruising + blood in urine; wound; fracture; head injury), each (and <group finding> (or <signs>)), plus one check_for task per group triggered by the group finding.", "alternatives": "A single priority ru after head\n  injury`: head injury **and** (mild headache, dizziness or clouded consciousness).\n- **> 2 rib fractures** = Fracture of three / four / five / six / seven / eight OR more ribs.\n  `Fracture of multiple ribs` was not used because it includes two ribs.\n- **Clear fluid from nose/ear** is encoded literally (Nasal discharge / Ear discharge + `Clear`),\n  not as CSF rhinorrhoea/otorrhoea, which would be an interpretation.\n- **\"Suspected\" fractures** (femur, pelvis, spine, skull) are recorded as the fracture finding\n  itself.\n- **Drug/alcohol intoxication** = `Intoxication` (covers both as descendants) plus `Alcohol\n  intoxication` listed explicitly for the health worker.\n- **Bruising** = `Contusion` (no \"Bruising\" FSN).\n- **Bottom of the red box** (BP < 90/60, pulse > 100 or < 50, respiratory rate > 20 or < 9,\n  SpO₂ < 94% or drop in GCS → reassess ABC) is monitoring of an already urgent patient and routes\n  to page 16; accounted for as management, not as extra urgency criteria. BP < 90/60 therefore\n  does not appear in a rule on this page.\n- No `measure` task: GCS has no unit in the language, and BP, pulse, RR and SpO₂ are routine vitals.\n- No flowchart file: the page has grouped \"and any of\" lists, not Yes/No branches.\n\n## Could not model\n\n- **\"Vomiting ≥ 2 times\"**: the language cannot count episodes. Any vomiting (`Finding of\n  vomiting`) is used, so the head-injury rule fires **more often** than the page intends.\n- **\"below injury\" / \"below fracture\"**: the location of poor perfusion, weakness or numbness\n  relative to the injury cannot be expressed; limb-level findings are used (fires more often).\n- **Poor perfusion (cold, pale, numb, no pulse)**: encoded as any of `Limb ischemia` (the named\n  sign), `Cold extremity`, `Numbness of limbs` or `Peripheral pulse absent` (merged from both\n  builds). \"Pale\" has no limb concept and is not encoded (fires less often for pallor alone).\n  Reading each listed part as enough on its own fires more often than a reading where several are\n  needed.\n- **\"Mild\" headache** depends on the health worker recording the `Mild` qualifier; an unqualified\n  headache will not trigger the concussion rule (dizziness or fogginess still will).\n- **\"not needing urgent attention\"** context of the concussion box is not modelled; concussion is\n  also diagnosed in patients who meet red-box criteria.\n- \"Refer same day if pregnant, known bleeding disorder, on anticoagulant, high-speed collision …\"\n  is a referral rule (management), not encoded.\n\n## SNOMED gaps\n\n- **Muscle tightness** (fracture group, \"Increasing pain, muscle tightness, numbness in limb\"): no\n  fitting concept (`Muscle tension` is a stress/tone finding; `Tightness in arm` is site-specific).\n  Not encoded; increasing limb pain and limb numbness are.\n- **Penetrating wound of head / of chest**: no precoordinated concepts; used `Penetrating wound` +\n  `finding_site` `Head structure` / `Thoracic structure` (both confirmed body structures).\n  `Chest structure` does not exist as an FSN.\n- **Drug intoxication**: no FSN; `Intoxication` used.\n- **Pale limb**: no limb pallor finding (`Pallor` does not exist; only face/organ pallor). Not encoded.\n- **\"Respond poorly to light\"**: `Sluggish pupil movement` and `No pupillary reaction to light` used.\n  `Abnormal pupil reaction` was rejected: its only SNOMED child is poor dilation to mydriatic drops.\n- **Weakness**: no \"Weakness\" finding; `Asthenia` used. **Bruising**: `Contusion` used.\n  **Hemotympanum**: FSN is `Hematotympanum`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n1. Footnote 1 (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness,\n   weakness, shock likely\"): is any **one** sign enough, or are several needed together? The rule\n   currently uses any one, so pulse ≥ 100 alone in an injured patient gives probable shock.\n2. \"Increasing pain, muscle tightness, numbness in limb\": any one, or all together (compartment\n   syndrome picture)? Currently any one.\n3. Poor perfusion: is any one of cold, numb or absent pulse below the injury enough (as encoded),\n   or should several be present together?\n4. Is \"any vomiting\" an acceptable stand-in for \"vomiting ≥ 2 times\" after head injury, or should\n   it be narrower (e.g. `Persistent vomiting`)?\n5. Should \"Bruising and blood in urine\" require bruising in a particular area (e.g. loin/flank)?\n   The page does not say; any contusion is used.\n6. Should \"clear fluid leaking from nose/ear\" be recorded as CSF rhinorrhoea/otorrhoea rather\n   than clear nasal/ear discharge? (Encoded literally as clear discharge.)\n7. Should probable concussion exclude patients who have any urgent head-injury sign?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent injured patient conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Traumatic injury\" \"disorder\"))", "element_keys": ["p30-b6989ba1"], "quote": "injured patient"}, {"claim_id": "c002", "rule": "Check for urgent injured patient conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Wound\" \"disorder\"))", "element_keys": ["p30-48319e9a"], "quote": "Wound"}, {"claim_id": "c003", "rule": "Check for urgent injured patient conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Fracture of bone\" \"disorder\"))", "element_keys": ["p30-fb37659c"], "quote": "Fracture"}, {"claim_id": "c004", "rule": "Check for urgent injured patient conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Injury of head\" \"disorder\"))", "element_keys": ["p30-ba2041e7"], "quote": "Head injury"}, {"claim_id": "c005", "rule": "Check for urgent injured patient conditions", "role": "check_for" ifier (snomed_concept \"Mild\" \"qualifier value\"))) (clinical_finding (snomed_concept \"Dizziness\" \"finding\")) (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))))"], "confidence": "medium"}, {"element_key": "p30-93a633d2", "scope": "in_scope", "scope_reason": "Footnote 1 is an 'X likely' (shock) with five criteria: SBP < 80, pulse >= 100, RR > 30, confusion/restlessness, weakness. Footnotes 2-5 are dosing and drug-choice notes (management).", "verdict": "correct", "parts_missing": [], "problem": "All five criteria are encoded with the right thresholds, directions and units, scoped to the injured patient. The page's comma list is ambiguous between 'any of' and a cumulative picture; the builder took the literal 'any of' reading, so an injured patient whose only finding is Asthenia (weakness) is diagnosed with probable shock. See rule-level problems.", "evidence": ["Diagnose probable shock in the injured patient :: (or (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80) (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100) (> (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30) (clinical_finding (snomed_concept \"Acute confusion\" \"finding\")) (clinical_finding (snomed_concept \"Restlessness\" \"finding\")) (clinical_finding (snomed_concept \"Asthenia\" \"finding\")))"], "confidence": "medium"}], "outside_not_logic": ["p30-4a1548a1", "p30-234232d0", "p30-7bba7e17", "p30-401805c4", "p30-737f0436", "p30-e10396a7"], "rule_level_problems": [{"rule": "Diagnose probable shock in the injured patient", "problem": "Probable Shock is produced but consumed by nothing: no priority rule references (active_condition Shock), so the red box's 'If shock/SBP < 80' and the footnote's 'shock likely' have no triage consequence beyond the diagnosis label. Shock in an injured patient is at least Urgent on this page; the house pattern is a priority rule referencing the probable diagnosis.", "severity": "medium"}, {"rule": "Diagnose probable shock in the injured patient", "problem": "The footnote's five criteria are joined with 'or'. Read literally that is defensible, but it means isolated weakness (Asthenia), isolated restlessness or a respiratory rate of 31 in any injured patient yields probable shock. The page's list reads as the clinical picture of shock; a clinician should confirm whether SBP < 80 (or at least two signs) was intended. Record as a judgment call.", "severity": "medium"}, {"rule": "Check for urgent injured patient conditions", "problem": "The task's trigger is 'Traumatic injury'. SNOMED does not place Wound, Fracture of bone or Injury of head under Traumatic injury (verified with is_a), so a patient whose complaint is recorded as a wound, fracture or head injury never gets this task: Contusion, Blood in urine and the shock signs (Acute confusion, Restlessness, Asthenia) are only checked when the generic 'Traumatic injury' is recorded. The three sub-tasks fire directly, so the red-box columns are unaffected, but the bruising-and-blood-in-urine column and the shock findings depend on the generic anchor.", "severity": "medium"}, {"rule": "Urgent: injured patient with wound danger signs / fracture danger signs", "problem": "'Pale' is missing from both poor-perfusion lists and 'muscle tightness' from the fracture list; neither is in any check_for, so a nurse is never asked about them.", "severity": "medium"}, {"rule": "(no rule)", "problem": "The red box's explicit deterioration thresholds (BP < 90/60, pulse > 100 or < 50, RR > 20 or < 9, SpO2 < 94%) and the non-urgent box's same-day referral criteria (pregnant, bleeding disorder, anticoagulant, high-speed collision, ejected/hit by vehicle, fall > 3 m) are not encoded anywhere. Both are borderline in scope, but the choice to leave them out is not visible in the rules.", "severity": "medium"}, {"rule": "Urgent: injured patient with head injury danger signs", "problem": "'Finding of vomiting' (a common symptom) stands in for 'Vomiting >= 2 times'; the count is not representable, so the rule is over-inclusive by design.", "severity": "low"}, {"rule": "Check for urgent injured patient conditions", "problem": "The task checks for Contusion while its trigger is Traumatic injury, of which Contusion is a SNOMED descendant. The exact-string test will not flag it, but semantically the task asks about a finding that may already be the trigger.", "severity": "low"}, {"rule": "Diagnose probable concussion after head injury", "problem": "The page places 'concussion likely' under the patient not needing urgent attention; the rule does not exclude red-box signs, so a head injury with loss of consciousness and a mild headache is both Urgent and probable concussion. Minor; the Urgent priority still wins.", "severity": "low"}], "summary": "The four red-box columns are encoded almost completely and with correct concepts: of 34 criterion parts across the columns only 'pale' (both perfusion lists) and 'muscle tightness' are missing, and 'vomiting >= 2 times' is approximated by any vomiting. The most consequential gap is that the probable Shock diagnosis feeds no priority rule and is built on an 'or' across all five footnote signs, so shock is both too easy to diagnose and has no triage effect; the generic 'Traumatic injury' trigger of the first task also means the bruising-and-blood-in-urine column and the shock findings are only checked when that generic concept is recorded. The red box's reassessment thresholds and the same-day referral criteria for the non-urgent patient are not encoded; both are borderline in scope and should be a recorded decision rather than a silent omission."}, {"page": 30, "checker": "forward-2", "elements": [{"element_key": "p30-ce23af0d", "scope": "out_of_scope", "scope_reason": "management_step", "verdict": null, "parts_missing": [], "problem": "", "evidence": [], "confidence": "medium"}, {"element_key": "p30-68e8c  in the injured patient", "verdict": "problem", "severity": "medium", "problem": "Footnote 1 is a comma list ('If SBP < 80, pulse >= 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely'); the rule reads it as 'any one of'. SBP < 80 alone is supported by the box ('If shock/SBP < 80'), but under this reading restlessness alone or weakness alone after any injury yields a probable Shock diagnosis, which is a strong claim from one soft sign. The page is ambiguous; a clinician should confirm whether the soft signs need a vital-sign criterion as well. Pulse is encoded with 'Pulse, function' rather than a rate observable."}, {"rule": "Diagnose probable concussion after head injury", "verdict": "ok", "severity": "low", "problem": "'If mild headache, dizziness or mental fogginess, concussion likely' under Head injury: type, probable level and or-structure are faithful."}, {"rule": "Urgent: injured patient with bruising and blood in urine", "verdict": "ok", "severity": "low", "problem": "Faithful to the 'Bruising and blood in urine' column; Urgent matches 'Give urgent attention'."}, {"rule": "Urgent: injured patient with wound danger signs", "verdict": "ok", "severity": "low", "problem": "(and Wound (or ...)) matches 'Wound and any of'; Urgent is justified by the box heading. Limb ischemia imprecision as above."}, {"rule": "Urgent: injured patient with fracture danger signs", "verdict": "ok", "severity": "low", "problem": "(and Fracture (or ...)) matches 'Fracture and any of'. Rib enumeration misses a recorded 'Fracture of multiple ribs' with no count; 'Fracture, open' morphology instead of the Open fracture disorder."}, {"rule": "Urgent: injured patient with head injury danger signs", "verdict": "problem", "severity": "medium", "problem": "Finding of vomiting drops the page's '>= 2 times', so a head injury with a single vomit (a common symptom) is escalated to Urgent; Intoxication (disorder) also pulls in any Poisoning. Everything else in the or-list is faithful to 'Head injury and any of'."}], "summary": "The head-injury priority rule escalates any head injury with a single vomit to Urgent because the page's 'vomiting >= 2 times' lost its count, and the shock rule treats footnote 1's comma list as 'any of', so restlessness or weakness alone after an injury gives a probable Shock diagnosis; both deserve a clinician's eye. Smaller imprecisions: Limb ischemia (a disorder) stands in for the sign 'poor perfusion', 'Fracture, open' is a morphology where the disorder 'Open fracture' exists, Intoxication includes Poisoning, and pulse uses 'Pulse, function' rather than a rate observable. The umbrella task triggers only on Traumatic injury, which in this release does not subsume Wound, Fracture of bone or Injury of head, so its shock-related check_for items are never collected for patients recorded with those more specific findings; the page's same-day referral tier (pregnant, bleeding disorder, anticoagulant, high-speed collision, fall > 3 m) is not encoded at all."}, {"page": 30, "checker": "backward-2", "claims": [{"claim_id": "c001", "rule": "Check for urgent injured patient conditions", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Traumatic injury\" \"disorder\"))", "verdict": "imprecise", "reason": "Trigger 'Traumatic injury' is a proxy for the header 'injured patient'; reasonable but the box covers any injured patient presentation.", "fix": "Accept.", "confidence": "low"}, {"claim_id": "c002", "rule": "Check for urgent injured patient conditions", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Wound\" \"disorder\"))", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"claim_id": "c003", "rule": "Check for urgent injured patient conditions", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Fracture of bone\" \"disorder\"))", "verdict": "faithful", "reason": "", "fix": "", "confide ": "rule", "priority": "medium", "ref": "(no rule)", "text": "The red box's explicit deterioration thresholds (BP < 90/60, pulse > 100 or < 50, RR > 20 or < 9, SpO2 < 94%) and the non-urgent box's same-day referral criteria (pregnant, bleeding disorder, anticoagulant, high-speed collision, ejected/hit by vehicle, fall > 3 m) are not encoded anywhere. Both are borderline in scope, but the choice to leave them out is not visible in the rules.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with head injury danger signs", "text": "'Finding of vomiting' (a common symptom) stands in for 'Vomiting >= 2 times'; the count is not representable, so the rule is over-inclusive by design.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Check for urgent injured patient conditions", "text": "The task checks for Contusion while its trigger is Traumatic injury, of which Contusion is a SNOMED descendant. The exact-string test will not flag it, but semantically the task asks about a finding that may already be the trigger.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable concussion after head injury", "text": "The page places 'concussion likely' under the patient not needing urgent attention; the rule does not exclude red-box signs, so a head injury with loss of consciousness and a mild headache is both Urgent and probable concussion. Minor; the Urgent priority still wins.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable shock in the injured patient", "text": "Shock is diagnosed but no priority evaluation uses it or the SBP<80 / shock criteria; page puts shock inside the wound urgent branch (fluids, refer).", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with head injury danger signs", "text": "Vomiting count (>=2), 'other injury' semantics and head-box GCS<15 not preserved; a single vomit with head injury is Urgent.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with fracture danger signs", "text": "Redundant (Fracture of femur etc. already subtypes of Fracture of bone); 'suspected' fractures treated as definite; check_for task and priority rule duplicate lists consistently.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "(whole page)", "text": "No non-urgent branch: same-day referral criteria, wound/fracture/head injury non-urgent logic absent; vital sign reassess thresholds absent.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Check for urgent injured patient conditions (first task)", "text": "Top task check_for lists Acute confusion, Restlessness, Asthenia (shock criteria) but not pulse/BP/RR; Dizziness missing from check_for.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with bruising and blood in urine", "text": "Header 'Bruising and blood in urine' encoded as AND; could be two separate triggers. No site/injury linkage.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with fracture danger signs", "text": "Open fracture uses the morphologic abnormality 'Fracture, open' as a clinical_finding; the disorder 'Open fracture' (397181002) exists and should be used (same item in the fracture check_for).", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with head injury danger signs", "text": "'Vomiting ≥ 2 times' reduced to any vomiting, so a single vomit makes a head-injured patient Urgent; the threshold is not recorded as a known limitation.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with fracture danger signs", "text": "'Muscle tightness' (compartment syndrome warning) is dropped from the 'Increasing pain, muscle tightness, numbness in limb' bullet.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "(none)", "text": "Bottom-of-red-box vital-sign deterioration thresholds (BP < 90/60, pulse > 100/< 50, RR > 20/< 9, SpO2 < 94%, GCS drop) have no rule; nothing escalates a deteriorating injured patient above Urgent.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with wound danger signs; Urgent: injured patient with fracture danger signs", "text": "'Pale' from 'Poor perfusion (cold, pale, numb, no pulse)' is missing in both wound and fracture lists; 'below injury/fracture' localisation is lost (generic limb findings).", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable concussion after head injury", "tex y": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with head injury danger signs", "text": "Finding of vomiting drops the page's '>= 2 times', so a head injury with a single vomit (a common symptom) is escalated to Urgent; Intoxication (disorder) also pulls in any Poisoning. Everything else in the or-list is faithful to 'Head injury and any of'.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Check for urgent injured patient conditions", "text": "check_for mixes red-box headers with shock criteria (confusion, restlessness, weakness) that are not injured-patient conditions to check; Bruising and Blood in urine listed as separate checks though the page requires both together.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Check for urgent fracture conditions in the injured patient", "text": "Muscle tightness (compartment syndrome sign) from 'Increasing pain, muscle tightness, numbness in limb' not encoded; 'suspected' fractures encoded as definite.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "high", "ref": "Check for urgent head injury conditions in the injured patient", "text": "Includes mild headache and clouded consciousness, which are the non-urgent concussion signs outside the red box; vomiting count (>=2) dropped.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 30, "slug": "30-the-injured-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: injured patient with fracture danger signs", "text": "Muscle tightness missing; suspected fractures treated as confirmed.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 30, "sl <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);

const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {

function renderHeader() {

    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });

    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
