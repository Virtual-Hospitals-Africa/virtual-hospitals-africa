white, with anal itch worse at night, pinworm likely: give single dose mebendazole 100mg (and repeat dose after 2 weeks) or give single dose albendazole 400mg. • If other worm or unsure: give single dose mebendazole 500mg or single dose albendazole 400mg.", "bbox": [666.1, 299.6, 804.2, 389.8], "key": "p61-e1b77ac5"}, {"id": "p61-out-e14", "page": 61, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Treat all household members at the same time. • Check Hb. If Hb < 12 (woman) or < 13 (man), anaemia likely 44. • Advise to avoid uncooked meat and use good hygiene: wash hands with soap and water before handling food/after using toilet, wash soiled clothing/bedding and dispose of faeces properly. Keep fingernails short and keep toilet seat clean. © dermnetnz.org", "bbox": [473.6, 406.3, 796.9, 496.5], "key": "p61-eb431519"}, {"id": "p61-out-e15", "page": 61, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Refer if: abdominal tenderness/pain, abdominal mass felt, vomiting, itchy red line under the skin that may move (larva migrans).", "bbox": [473.6, 496.4, 777.4, 516.6], "key": "p61-f19fb3d2"}, {"id": "p61-out-e16", "page": 61, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with anal symptoms not needing urgent attention • If patient has anal sex, ask about genital symptoms and treat partner 62. If painless bleeding, passing mucus or unable to pass stools despite feeling the need to (tenesmus), treat for sexually transmitted proctitis: give single dose ceftriaxone 250mg IM2 and azithromycin 1g orally. If severe penicillin allergy3, omit ceftriaxone and increase azithromycin to 2g. If diarrhoea 58. • Then examine anal area to look for cause:", "bbox": [51.0, 182.3, 760.5, 223.5], "key": "p61-0da38d79"}, {"id": "p61-out-e17", "page": 61, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Red/raw skin", "bbox": [300.2, 238.7, 347.5, 248.9], "key": "p61-50afc687"}, {"id": "p61-out-e18", "page": 61, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Advise good hygiene. • Look for contact cause. If diarrhoea 58. • Wash with aqueous cream (UEA), avoid soap. • Apply zinc and castor oil ointment to raw areas. If severe itching, also apply hydrocortisone 1% cream twice a day for 5 days.", "bbox": [281.3, 264.2, 368.1, 404.4], "key": "p61-7acda35e"}, {"id": "p61-out-e19", "page": 61, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If no better with treatment, refer.", "bbox": [139.3, 444.3, 266.7, 455.3], "key": "p61-21fd5a62"}, {"id": "p61-out-e20", "page": 61, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Dilute 10mg morphine with 9mL sodium chloride 0.9%. 2Dissolve ceftriaxone 250mg in 0.9mL lidocaine 1% without adrenaline (epinephrine). 3History of anaphylaxis, urticaria or angioedema.", "bbox": [34.0, 542.8, 638.0, 551.8], "key": "p61-e62d650c"}, {"id": "p61-out-e21", "page": 61, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No Yes", "bbox": [551.9, 274.2, 739.5, 284.4], "key": "p61-8c8eb05d"}], "boxes": [{"box": 1, "rect": [35.8, 86.4, 806.4, 166.6]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkYAAACoCAIAAAA6t8ViAAAACXBIWXMAABcSAAAXEgFnn9JSAACmYElEQVR4nOydhVdVz9fGf3/Iu5ZyaREkRRFbsQURCzEwsVGxuzuxMLATCwsxQCREQlJssbCTBoH77svG8XzPTSwEn7U+y3XOnDkze2b2uTqPM3v+9+H/TAAAAAAAAAAAAAAAqEX8r8YtAAAAAAAAAAAAAACgWkDSAgAAAAAAAAAAAAC1jO+S1udOHcoeXQUAAAAAAAAAAAAA4C+k+HSQBknri0c35dfbAAAAAAAAAAAAAAD8hZTGhUDSAgAAAAAAAAAAAAC1CUhaAAAAAAAAAAAAAKCWAUkLAAAAAAAAAAAAANQyIGkBAAAAAAAAAAAAgFoGJC0AAAAAAAAAAAAAUMuApAUAAAAAAAAAAAAAahmQtAAAAAAAAAAAAABALQOSFgAAAAAAAAA med_concept \"Clinical finding\" \"finding\") (snomed_concept \"Worms in stool\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "priority_condition": {"only_A": [], "only_B": [], "both": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Anal finding\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Anal pain\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Does not defecate\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Perianal lump\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis_condition": {"only_A": [], "only_B": [], "both": ["(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Anal finding\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Mucus in stool\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Painless rectal bleeding\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pruritus ani\" \"disorder\") (qualifier (snomed_concept \"Night time\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Tenesmus of anus and/or rectum\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Worms in stool\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Enterobiasis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Infective proctitis\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 61 – Anal symptoms: flowchart\n\nSource: APC 2026 e-book page 61. The red box is a single \"any of\" list; the\nlower half of the page is an examination algorithm with one Yes/No branch (suspected worms).\n\n```mermaid\nflowchart TD\n    A[\"Patient with anal symptoms\"] --> RB{\"Red box: any of<br/>• Extremely painful lump on anus<br/>• Unable to pass stool because of anal symptoms\"}\n    RB -- Yes --> URG[\"Give urgent attention.<br/>Manage pain and refer same day\"]\n    RB -- No --> APP[\"Approach to the patient not needing urgent attention\"]\n    APP --> PROC{\"Painless bleeding, passing mucus<br/>or tenesmus?\"}\n    PROC -- Yes --> STIP[\"Treat for sexually transmitted proctitis\"]\n    APP --> EXAM[\"Examine anal area to look for cause\"]\n    EXAM --> CR[\"Crack/s\"] --> CRM[\"Treatment (lactulose if constipated, ointments)\"]\n    EXAM --> LP[\"Lump/pile\"] --> LPM[\"Treat constipation, ointment/suppositories;<br/>refer if irreducible or thrombosed\"]\n    EXAM --> RR[\"Red/raw skin\"] --> RRM[\"Hygiene, contact cause, creams\"]\n    CRM --> NB[\"If no better with treatment, refer\"]\n    LPM --> NB\n    RRM --> NB\n    EXAM --> UW[\"Ulcer/s or perianal wart/s\"] --> UWM[\"Refer criteria; treat as genital ulcer 65 / genital warts 68\"]\n    EXAM --> SW{\"Suspected worms:<br/>Is worm flat and white with worm segments (blunt ended)?\"}\n    SW -- Yes --> TAPE[\"Tapeworm likely\"]\n    SW -- No --> PIN{\"Worm thin and white,<br/>with anal itch worse at night?\"}\n    PIN -- Yes --> PINL[\"Pinworm likely\"]\n    PIN -- \"Other worm or unsure\" --> OTH[\"Mebendazole / albendazole\"]\n    TAPE --> HH[\"Treat household; check Hb:<br/>Hb < 12 (woman) or < 13 (man) → anaemia likely 44;<br/>hygiene; refer if abdominal tenderness/pain, mass, vomiting, larva migrans\"]\n    PINL --> HH\n    OTH --> HH\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Patient with anal symptoms | `(clinical_finding Anal finding)` as the task trigger (descendants such as Anal pain, Pruritus ani, Anal fissure match) | `Check for urgent anal symptom conditions` |\n| Red box = Yes | Anal finding **and** (Perianal lump **and** severe Anal pain, **or** Does not defecate) | `Urgent: anal symptoms with extremely painful lump or unable to pass stool` |\n| Painless bleeding / mucus / tenesmus → treat for STI proctitis | Anal finding **and** any of Painless rectal bleeding, Mucus in stool, Tenesmus of anus and/or rectum → `Infective proctitis` at `probable` | `Diagnose probable sexually transmitted proctitis from anal symptoms` |\n| Suspected worms → No → thin white worm with anal itch worse at night → pinworm likely | Worms in stool **and** Pruritus ani qualified `Night time` → `Enterobiasis` at `probable`. \"Thin and white\" and \"not flat/segmented\" are not representable | `Diagnose probable pinworm from anal itch at night` |\n| Suspected worms → Yes → tapeworm likely | **Not encoded**: the only discriminator (flat, white, segmented worm) has no SNOMED finding; see remaining questions | — |\n| Hb < 12 / < 13 → anaemia likely | **Not encoded**: haemoglobin has no unit/observable in the language | — |\n| Crack/s, Lump/pile, Red/raw skin, Ulcer/wart branches | Examination routing to management only; the page names no \"likely\" diagnosis on these branches | — (management) |\n", "questions": "# Page 61 – Anal symptoms: remaining questions\n\nReconciled final build (base: builder B; A and B encoded identical conditions).\n\n## Decisions made\n\n- **Presenting complaint.** \"Anal symptoms\" is encoded as `(clinical_finding (snomed_concept \"Anal finding\" \"finding\"))`, the general SNOMED parent. Anal pain, Pruritus ani, Anal fissure, Ulcer of anus and Anal warts are descendants and match in `due_to`. It is **not** a recorded common symptom or warning sign, so the task fires only if the app records an anal finding.\n- **Red box → `Urgent`** as `(and Anal finding (or (and Perianal lump, Anal pain + Severe) Does not defecate))`. The page doesn't escalate to Very urgent or Emergency.\n- **\"Extremely painful lump on anus\"** = Perianal lump **and** Anal pain with `Severe (severity modifier)`. No \"painful lump\" concept exists.\n- **\"Unable to pass stool because of anal symptoms\"** = `Does not defecate`. \"Because of anal symptoms\" is carried by the AND with the anal-finding trigger.\n- **Sexually transmitted proctitis.** \"If painless bleeding, passing mucus or … tenesmus, treat for sexually transmitted proctitis\" is encoded as a `probable` diagnosis of `Infective proctitis` (the parent of the gonococcal and other STI proctitis concepts), with evidence Anal finding AND any of Painless rectal bleeding, Mucus in stool, Tenesmus of anus and/or rectum. \"Treat for\" is neither \"likely\" nor \"consider\"; I chose probable because the page acts on it as a presumptive diagnosis. The rule isn't conditioned on anal sex, because the page puts that in a separate sentence.\n- **Pinworm likely** = probable `Enterobiasis` from Worms in stool AND `Pruritus ani` qualified `Night time`.\n- The examination branches (Crack/s, Lump/pile, Red/raw skin, Ulcer/s or perianal wart/s) lead only to management, referral or cross-references; the page names no \"likely\" diagnosis on them, so they aren't encoded.\n\n## Could not model\n\n- **Tapeworm likely** (worm flat and white with segments). There is no finding for a worm's appearance, so no rule. A rule on Worms in stool alone would diagnose tapeworm for every worm (fires far more often than the page intends). Not encoding it means it never fires.\n- **Pinworm discriminators** \"thin and white\" and the No branch (not flat/segmented) can't be expressed. The rule therefore also fires for a flat segmented worm that comes with night-time anal itch, so it fires slightly more often than the page intends. \"Worse at night\" is reduced to \"at night\".\n- **Anaemia likely** if Hb < 12 (woman) or < 13 (man): haemoglobin has no unit or observable in the language. Not encoded (never fires here; page 44 covers anaemia).\n- **\"Not needing urgent attention\"** (the approach section's scope) isn't expressible, so the proctitis rule also fires for urgent patients.\n- Management (paracetamol, morphine, \"Stop if BP drops < 90/60\", ointments, anthelmintics, household treatment, hygiene, referral criteria including larva migrans) is out of scope.\n\n- **Perianal lump and the trigger** (from builder A): `Perianal lump` is not a descendant of `Anal finding` (it sits under Perineal finding), so a patient recorded only with a perianal lump does not trigger the check task.\n\n## SNOMED gaps\n\n- \"Anal symptom\": not found; used `Anal finding` (finding).\n- \"Painful lump on anus\": not found; used `Perianal lump` + `Anal pain` (Severe).\n- \"Unable to pass stool / unable to defecate\": not found; used `Does not defecate`.\n- \"Sexually transmitted proctitis\": not found; used `Infective proctitis` (disorder).\n- \"Passing mucus per rectum\": not found; used `Mucus in stool`.\n- Flat/segmented or thin/white worm, tapeworm segments seen: not found (proglottids exist only as organisms). Tapeworm is not encoded.\n- \"Anal itch worse at night\": used `Pruritus ani` (disorder) + `Night time` qualifier.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should \"treat for sexually transmitted proctitis\" be a `probable` or a `possible` diagnosis, and should it require a history of anal sex (`Anal penetration` finding), or apply to every patient with painless bleeding, mucus or tenesmus as written?\n- Is \"Does not defecate\" an acceptable reading of \"unable to pass stool because of anal symptoms\", or should it be tenesmus, difficulty defecating, or a thrombosed/prolapsed haemorrhoid concept?\n- Should a seen worm with night-time anal itch be enough for pinworm without the worm's appearance being recorded?\n- Should a perianal lump alone (without another anal se of anal symptoms' item is encoded as the generic 'Does not defecate' and is not separated from non-urgent tenesmus, and 'anaemia likely' (Hb thresholds) is not encoded. The proctitis rule uses the broader 'Infective proctitis' and maps 'treat for' to probable, both defensible but worth a reviewer's eye."}], "scorecard": {"page": 61, "slug": "61-anal-symptoms", "validation_ok": true, "builder_agreement": 1.0, "elements": 27, "elements_agreed": 22, "claims": 21, "claims_agreed": 6, "queue": 49, "queue_by_priority": {"low": 7, "high": 12, "medium": 30}, "missing_reports": [], "element_rows": [{"key": "p61-6afff593", "id": "p61-rb1-e01", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p61-91253d54", "id": "p61-rb1-e02", "box": 1, "status": "agreed", "scopes": {"in_scope": 3}, "verdicts": {"correct": 3}}, {"key": "p61-19415dc4", "id": "p61-rb1-e03", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"correct": 2, "partial": 1}}, {"key": "p61-9de73694", "id": "p61-rb1-e04", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p61-84668eed", "id": "p61-rb1-e05", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p61-379d759e", "id": "p61-rb1-e06", "box": 1, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p61-e6c4c97f", "id": "p61-out-e01", "box": 0, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p61-6a3dbf98", "id": "p61-out-e02", "box": 0, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p61-0f092d4c", "id": "p61-out-e03", "box": 0, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p61-5930caa9", "id": "p61-out-e04", "box": 0, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p61-6b089871", "id": "p61-out-e05", "box": 0, "status": "agreed", "scopes": {"out_of_scope": 3}, "verdicts": {}}, {"key": "p he Yes branch is not encoded.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["The flat/white/segmented-worm decision is not encoded: the Yes branch (tapeworm) is absent and the No branch is not a condition of the pinworm rule"], "problem": "Only the generic 'Worms in stool' finding is captured; the discriminating question the flowchart asks is lost.", "confidence": "high"}]}, {"page": 61, "slug": "61-anal-symptoms", "kind": "element", "priority": "high", "ref": "p61-f783de97", "text": "Tapeworm likely", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "missing", "parts_missing": ["No diagnosis rule for tapeworm at any certainty."], "problem": "No rule diagnoses tapeworm. SNOMED has (snomed_concept \"Infection caused by Taenia\" \"disorder\") (76172008, synonym taeniasis) and the broader (snomed_concept \"Cestode infection\" \"disorder\") (86133004). The page's discriminator (flat, white, blunt-ended segments) is not representable, so the honest encoding is a rule on 'Worms in stool' alone (possible, or probable if the builders accept that the morphology question is answered by the nurse before recording), and a remaining-questions note. As written, a nurse who records 'Worms in stool' without night-time anal itch gets no diagnosis at all, and 'Worms in stool' is consumed only by the pinworm rule.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "missing", "parts_missing": [], "problem": "'Tapeworm likely' has no probable diagnosis rule (e.g. Taeniasis, with worm segments in stool). Page states it as an 'X likely' conclusion.", "confidence": "high"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "missing", "parts_missing": ["probable diagnosis of tapeworm infection (e.g. 'Cestode infection' or 'Infection caused by Taenia', both of which exist), with Worms in stool plus the flat/segmented worm as evidence"], "problem": "No rule encodes the tapeworm conclusion. The feature 'flat segmented worm' has no precoordinated finding (only the organisms 'Proglottid of Taenia ...'), so the builders may have dropped it, but it is not noted as not representable in the rules.", "confidence": "high"}]}, {"page": 61, "slug": "61-anal-symptoms", "kind": "element", "priority": "medium", "ref": "p61-e1b77ac5", "text": "• If worm is thin and white, with anal itch worse at night, pinworm likely: give single dose mebendazole 100mg (and repeat dose after 2 weeks) or give single dose albendazole 400mg. • If other worm or unsure: give single dose mebendazole 500mg or single dose albendazole 400mg.", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Encoded as probable 'Enterobiasis' (synonyms pinworm/threadworm, the right concept) from 'Worms in stool' and 'Pruritus ani' qualified 'Night time' (synonyms 'Nocturnal', 'At night', so the qualifier reads as 'worse at night' as well as the language allows). The 'thin and white' worm morphology is not representable in SNOMED and its absence is acceptable; the conjunction matches the page since the page reaches this box only after a worm is suspected. Mebendazole/albendazole doses and the 'other worm or unsure' arm are management and correctly not encoded.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["thin white worm criterion", "other worm/unsure branch"], "problem": "'Pinworm likely' encoded as probable Enterobiasis requiring Worms in stool AND night-time pruritus ani. Page: thin white worm with anal itch worse at night. 'Worms in stool' conflates worm visibility with morphology; thin/white and 'anal itch worse at night' as qualifier on pruritus is reasonable. Pruritus ani coded semantic tag 'disorder' used as finding.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'thin and white' worm description", "No-branch condition (worm NOT flat/segmented)"], "problem": "The rule fires on any worms in stool plus night-time anal itch. A patient with tapeworm segments and night itch would be labelled probable pinworm, against the flowchart. The concept (Enterobiasis), the night-itch qualifier and AND logic are otherwise right.", "confidence": "high"}]}, {"page": 61, "slug": "61-anal-symptoms", "kind": "element", "priority": "medium", "ref": "p61-0da38d79", "text": "Approach to the patient with anal symptoms not needing urgent attention • If patient has anal sex, ask about genital symptoms and treat partner 62. If painless bleeding, passing mucus or unable to pass stools despite feeling the need to (tenesmus), treat for sexually transmitted proctitis: give sing", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "partial", "parts_missing": ["The anal-sex context: on the page the proctitis sentence sits inside the bullet 'If patient has anal sex, ...', and the APC intends the STI-proctitis treatment for patients who have anal sex. The rule has no such condition; SNOMED has (clinical_finding (snomed_concept \"Anal penetration\" \"finding\")) which could carry it."], "problem": "The three criteria are correctly or-ed and all three are in check_for ('Painless rectal bleeding', 'Mucus in stool', 'Tenesmus of anus and/or rectum' are exact fits). 'Infective proctitis' is broader than 'sexually transmitted proctitis' (its children include candidal and tuberculous proctitis as well as chlamydial and gonococcal), but SNOMED has no 'sexually transmitted proctitis' concept, so it is the closest parent. The 'ask about genital symptoms and treat partner -> 62', the antibiotic doses, the penicillin-allergy substitution and 'If diarrhoea -> 58' are management/cross-reference and rightly not encoded. Whether the anal-sex precondition is required is arguable (a clinician may read the second sentence as applying to all anal-symptom patients), hence partial at me <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};

const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>

    <span><button id="exp">export decisions</button>${helpButton("export")}</span>

  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
