um jelly to surrounding skin to protect it, then apply salicylic acid 15-30% to wart, and cover with plaster. - Repeat every night and continue", "bbox": [45.4, 410.1, 169.2, 460.9], "key": "p89-9b7b1a43"}, {"id": "p89-out-e31", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "for a week after wart has come off. • If extensive warts or plantar wart in diabetic, refer.", "bbox": [39.7, 460.7, 167.0, 500.9], "key": "p89-7ff28e58"}, {"id": "p89-out-e32", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Molluscum contagiosum likely • Test for HIV 124. • Reassure that lesions often resolve spontaneously after years or with ART. • If treatment desired: open molluscum with sterile needle and apply tincture of iodine BP1 to centre of each lesion. • Refer if: - Extensive - Lesions on eyelid - Intolerable and", "bbox": [185.7, 311.0, 268.0, 482.0], "key": "p89-1c5d89bf"}, {"id": "p89-out-e33", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "not responding to treatment.", "bbox": [197.0, 481.8, 265.6, 502.0], "key": "p89-40a0fea9"}, {"id": "p89-out-e34", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Kaposi’s sarcoma", "bbox": [289.9, 325.9, 359.3, 336.9], "key": "p89-dd95a789"}, {"id": "p89-out-e35", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely • Lesions vary from isolated lumps to large ulcerating tumours. • May also appear in mouth and on genitals.", "bbox": [286.0, 336.7, 357.5, 416.9], "key": "p89-f0f70fcd"}, {"id": "p89-out-e36", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Test for HIV 124. • Refer for biopsy to confirm diagnosis and for further management.", "bbox": [286.1, 432.2, 360.6, 492.4], "key": "p89-5e460721"}, {"id": "p89-out-e37", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If not infected, reassure there is no need to treat. • If fluctuant, arrange incision and drainage. If on face, refer instead. • If infected (skin red, warm, painful):", "bbox": [379.7, 343.5, 501.4, 413.7], "key": "p89-c47fe137"}, {"id": "p89-out-e38", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- Give cefalexin 500mg", "bbox": [385.4, 412.9, 478.9, 423.7], "key": "p89-6dd1b3bf"}, {"id": "p89-out-e39", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "6 hourly or flucloxacillin 500mg 6 hourly for 5 days. - If severe penicillin allergy2,", "bbox": [385.4, 422.9, 489.7, 453.7], "key": "p89-4015fab0"}, {"id": "p89-out-e40", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "give instead azithromycin 500mg daily for 3 days. • If intolerable or recurrent infections, arrange for excision once infection resolved.", "bbox": [379.7, 452.9, 498.7, 503.7], "key": "p89-705606c6"}, {"id": "p89-out-e41", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Epidermoid cyst likely Usually found on face and trunk,", "bbox": [382.4, 297.2, 502.9, 318.2], "key": "p89-132e61fc"}, {"id": "p89-out-e42", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "uncommon on limbs.", "bbox": [402.3, 318.0, 481.1, 328.2], "key": "p89-8d3e9c90"}, {"id": "p89-out-e43", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Lipoma likely Usually found on trunk", "bbox": [522.9, 310.0, 608.3, 331.0], "key": "p89-05379956"}, {"id": "p89-out-e44", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "or upper limb.", "bbox": [538.7, 330.8, 590.5, 341.0], "key": "p89-1b5a3fb2"}, {"id": "p89-out-e45", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Reassure lump will not become cancer and usually does not need removal. • Refer if: - > 3cm - Causing pain or", "bbox": [522.2, 356.3, 605.8, 426.5], "key": "p89-c313192f"}, {"id": "p89-out-e46", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "discomfort - Getting bigger - Firm or deep", "bbox": [527.9, 426.3, 588.2, 456.5], "key": "p89-b229f21e"}, {"id": "p89-out-e47", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "beneath skin - New lump that", "bbox": [527.9, 456.3, 589.4, 476.5], "key": "p89-c10b2a31"}, {"id": "p89-out-e48", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "persists > 1 month - Intolerable", "bbox": [527.9, 476.3, 602.0, 496.5], "key": "p89-d3eb4b13"}, {"id": "p89-out-e49", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Acne likely • Ask about medication, isoniazid could be a cause. Discuss with doctor. • Wash skin with mild soap no more than twice a day. Avoid picking/squeezing/scratching. • Avoid oily cosmetics and hair products. • If blackheads only: - Apply tretinoin 0.05% cream sparingly3 at", "bbox": [625.6, 271.4, 800.4, 352.4], "key": "p89-e6077bcf"}, {"id": "p89-out-e50", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "night until better, for at least 6 weeks. Avoid if pregnant/planning a pregnancy and limit sun exposure. Acne may worsen before improving. Review after 6 weeks. • If red and swollen areas: - Apply instead benzoyl peroxide 5% topical", "bbox": [625.6, 352.2, 800.3, 412.4], "key": "p89-fce9bd45"}, {"id": "p89-out-e51", "page": 89, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "to affected areas in morning. Wash off in evening. If no better and tolerating gel, apply twice daily and give doxycycline4 100mg daily with meals, for 3 months. • If woman needing contraception, advise combined oral contraceptive 170. • Advise that response may take months. • If severe or no response after 3 months of treatment, refer.", "bbox": [625.6, 412.2, 800.5, 502.4], "key": "p89-12795619"}], "boxes": [{"box": 1, "rect": [35.5, 86.4, 806.4, 118.3]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAABDCAIAAACp9kUdAAAACXBIWXMAABcSAAAXEgFnn9JSAAA1VUlEQVR4nO2dh3cUx/K2f3/Id841CwoghMHkjBBZ5BwFAkwOJueMRTK2yYicDSaYLAQCGQlEFIhgcjZBtjEZDNi++73aEn2bmdnZkZCQVrznPGfP7kxPT093dXVVbXfP//35/woRQgghhBBCCCGEEOJf/F+ul4AQQgghhBBCCCGEkMzCqBYhhBBCCCGEEEII8T/ei2q9PbTh71PbCCGEEEIIIYQQQgjJg7xe8711VOvfP4+7//6FEEIIIYQQQgghhJA8yNvkjYxqEUIIIYQQQgghhBA/g1EtQgghhBBCCCGEEOJ/MKpFCCGEEEIIIYQQQvwPRrUIIYQQQgghhBBCiP/BqBYhhBBCCCGEEEII8T8Y1SKEEEIIIYQQQggh/gejWoQQQgghhBBCCCHE/2BUixBCCCGEEEIIIYT4H4xqEUIIIYQQQgghhBD/g1EtQgghhBBCCCGEEOJ/MKpFCCGE5BrPHp3YtGHW3Fljtm2el+uF8UcO/bwmbvcSkIVrX784LdeeOPJjrj+IJRCPf9+cy/VimHn657Gca5ePxv07B6WQ1y7t+fDcfjmzXXL787fkXH80Qggh5NOBUS1CCCEkKyQnrhs9omev7m2jIpuBwQO6zJw+7ObVvc5zgBtc+ovPXf/5D6hUvnSuP5E/Uq1yWanALFx7/85BubZ1i4hcfxAzO7ctCCpUsGLZks8e5S2TbMLYvqi0Lzu3zKF2+Wj8tHGOFPK7b0Z8eG7DBn8puR059EOuPxohhBDy6cCoFiGEEJIVvpk6VJxYnYKffYbjTi7/79vz9euGyVXlSpfo1b1trj+RP+I8enL5l13LFn3du0c7FSTKO1GtV89S9uxcNHn8VyuXTVUHx4/pK8U7fWJzDt0ia9StVRWlCi0S/PbVGW855++oluUjf2BU67d7SRt/+B6ZHD20PtdrhhBCCPEjGNUihBBCsoKKag0d1HXV8qn9ekcWDgyQIyePbfR5+a83D0jierWrvXmZmuuP46c4j550bN9EUqoFYnknqnXq+GYpydiRvdXBe3d+Hj+6z/LF0Tl3i6yRcnzTiCHdEvatsMk5 fier (snomed_concept \"Firm\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Mass of subcutaneous tissue\" \"finding\") (qualifier (snomed_concept \"Soft\" \"qualifier value\")) (qualifier (snomed_concept \"Painless\" \"qualifier value\")))\n\n    ;; Acne: red papules, pustules, nodules and blackheads\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Red color\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Pustule\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Skin nodule\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Comedone\" \"disorder\"))\n  )\n)\n(task\n  \"Check for mole features needing same-week referral (skin lump/s)\"\n  adult\n  (clinical_finding (snomed_concept \"Melanocytic nevus\" \"disorder\"))\n  (check_for\n    ;; Is irregular in shape or colour\n    (clinical_finding (snomed_concept \"Irregular outline of pigmented skin lesion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Mixed color of pigmented skin lesion\" \"disorder\"))\n\n    ;; Changed in size, shape or colour\n    (clinical_finding (snomed_concept \"Change in skin lesion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Changing shape of pigmented skin lesion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Changing color of pigmented skin lesion\" \"disorder\"))\n\n    ;; Bleeds easily / Itches\n    (clinical_finding (snomed_concept \"Bleeds easily\" \"finding\"))\n    (clinical_finding (snomed_concept \"Itching of pigmented skin lesion\" \"disorder\"))\n  )\n)\n(task\n  \"Measure width of mole (skin lump/s)\"\n  adult\n  (clinical_finding (snomed_concept \"Melanocytic nevus\" \"disorder\"))\n  (measure\n    (measurement (snomed_concept \"Lesion size, largest dimension\" \"observable entity\") mm)\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable boil (skin lump/s)\"\n  (diagnosis\n    (snomed_concept \"Furuncle\" \"disorder\")\n    probable\n  )\n nomed_concept \"Acne\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Kaposi's sarcoma\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Lipoma\" \"disorder\") probable)"], "only_B": ["(diagnosis (snomed_concept \"Acne vulgaris\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Furuncle\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Kaposi's sarcoma of skin\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Subcutaneous lipoma\" \"disorder\") probable)"], "both": ["(diagnosis (snomed_concept \"Abscess of skin and/or subcutaneous tissue\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Epidermoid cyst of skin\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Infection of skin caused by Molluscum contagiosum\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Viral wart of skin and/or mucous membrane caused by human papillomavirus\" \"disorder\") probable)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Acne\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Acne vulgaris\" \"disorder\") probable)", "relation": "B_narrower"}, {"A": "(diagnosis (snomed_concept \"Lipoma\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Subcutaneous lipoma\" \"disorder\") probable)", "relation": "B_narrower"}, {"A": "(diagnosis (snomed_concept \"Kaposi's sarcoma\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Kaposi's sarcoma of skin\" \"disorder\") probable)", "relation": "B_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": ["(measurement (snomed_concept \"Diameter of lump\" \"observable entity\") mm)"], "only_B": ["(measurement (snomed_concept \"Lesion size, largest dimension\" \"observable entity\") mm)"], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 89 – Skin lump/s: flowchart\n\nSource: APC 2026 e-book page 89. The page is a decision tree based on what the lesions look like. It has no Yes/No questions, but every branch ends in an \"X likely\" box.\n\n```mermaid\nflowchart TD\n    RB[\"Red box: refer same week the patient with a mole that:<br/>is irregular in shape or colour · changed in size, shape or colour ·<br/>differs from surrounding moles · is &gt; 6mm wide · bleeds easily · itches\"]\n    TOP[\"Skin lump/s\"]\n    TOP --> BOIL[\"Painful, firm, red, warm lump which softens in the centre<br/>to discharge pus → boil/abscess likely (→ 83)\"]\n    TOP --> W[\"Round, raised papules with rough surfaces\"] --> WL[\"Warts likely\"]\n    TOP --> MC[\"Small, skin-coloured pearly bumps with central dimples.<br/>Does not involve palms/soles\"] --> MCL[\"Molluscum contagiosum likely\"]\n    TOP --> KS[\"Painless, purple/brown lumps on skin\"] --> KSL[\"Kaposi's sarcoma likely\"]\n    TOP --> SUB[\"Smooth, well defined lump beneath skin\"]\n    SUB --> EC[\"Round, firm lump. May have central hole and discharge white substance\"] --> ECL[\"Epidermoid cyst likely\"]\n    SUB --> LP[\"Soft, doughy lump which is painless and moves easily\"] --> LPL[\"Lipoma likely\"]\n    TOP --> AC[\"Red papules, pustules, nodules and blackheads, usually on face\"] --> ACL[\"Acne likely\"]\n    TOP -.-> UNC[\"If diagnosis uncertain, discuss/refer\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Red box (mole) | Melanocytic nevus **and** any of: irregular outline, mixed colour, change in skin lesion, changing shape, changing colour, Lesion size, largest dimension > 6 mm, bleeds easily, itching of pigmented lesion. \"Differs from surrounding moles\" has no concept | `Check for mole features needing same-week referral (skin lump/s)`, `Measure width of mole (skin lump/s)`, `Urgent: mole needing same-week referral (skin lump/s)` |\n| Boil/abscess | AND of pain of skin, firm skin mass, redness over lesion, warmth over lesion, fluctuant, skin discharge (two rules: Furuncle; Abscess of skin and/or subcutaneous tissue) | `Diagnose probable boil (skin lump/s)`, `Diagnose probable skin abscess (skin lump/s)` |\n| Warts | Round raised papule AND rough skin | `Diagnose probable warts (skin lump/s)` |\n| Molluscum | Small papule AND skin dimple AND no papule on palm AND no papule on sole | `Diagnose probable molluscum contagiosum (skin lump/s)` |\n| Kaposi's sarcoma | Painless skin mass AND (purple OR brown skin mass) | `Diagnose probable Kaposi's sarcoma (skin lump/s)` |\n| Epidermoid cyst | Smooth, well-defined subcutaneous mass AND round, firm subcutaneous mass | `Diagnose probable epidermoid cyst (skin lump/s)` |\n| Lipoma | Smooth, well-defined subcutaneous mass AND soft, painless subcutaneous mass | `Diagnose probable lipoma (skin lump/s)` |\n| Acne | OR of red papule, pustule, skin nodule, comedone | `Diagnose probable acne (skin lump/s)` |\n| What triggers the questions | Mass of skin or Mass of subcutaneous tissue | `Check for skin lump/s features` |\n| Diagnosis uncertain → discuss/refer | Management | not encoded |\n", "questions": "# Page 89 – Skin lump/s: remaining questions\n\nFinal build, reconciled from builders A and B (see `reconcile.json`).\n\n## Decisions made\n\n- **\"Refer same week\" became `Urgent`.** The language has only `Emergency`, `\"Very urgent\"` and `Urgent`. Urgent is the lowest, but it still ranks a same-week referral above routine care, so this over-triages somewhat.\n- **Mole = `Melanocytic nevus` (disorder)**, the page's word. The red-box feature concepts (Irregular outline / Mixed color / Changing shape / Changing color / Itching of pigmented skin lesion) are children of `Pigmented skin lesion`, which is *not* a descendant of `Melanocytic nevus`, so a recorded feature does not by itself satisfy the mole condition. (Both builders' notes on this hierarchy were wrong and have been corrected.) The skin-lump task checks for the mole, which triggers the mole task, the width measurement and the priority rule.\n- **The lump task fires on `Mass of skin` or `Mass of subcutaneous tissue`.** SNOMED doesn't place lumps beneath the skin under `Mass of skin`.\n- **\"Changed in size, shape or colour\"** is changing shape, changing colour and the general `Change in skin lesion`. SNOMED has no change-in-size concept, so the general concept stands in; the rule fires for any recorded change.\n- **\"Is irregular in shape or colour\"** is `Irregular outline of pigmented skin lesion` or `Mixed color of pigmented skin lesion`.\n- **\"Is > 6mm wide\"** is `(> (measurement Lesion size, largest dimension mm) 6)`, measured by a `measure` task. This is a measurement comparison, not an onset one, so the page's `>` is kept.\n- **\"Bleeds easily\"** is the exact concept `Bleeds easily` (finding); it relies on the rule's mole condition for its site.\n- **Boil/abscess** is two probable rules on identical evidence (`Furuncle`; `Abscess of skin and/or subcutaneous tissue`), because the page names both and Furuncle is not a descendant of the abscess concept. All six listed features are ANDed: painful (`Pain of skin`), firm, red (`Redness of skin over lesion`), warm (`Temperature of skin over lesion warm`), softens (`Fluctuant`) and discharges pus (`Skin discharge`).\n- **Warts:** round, raised papule (qualifiers kept) and rough skin.\n- **Molluscum:** small papule, skin dimple, and no papule on the palm or sole (\"Does not involve palms/soles\").\n- **Kaposi's sarcoma:** painless skin mass and (purple or brown skin mass). Diagnosis is the general `Kaposi's sarcoma`, as the page names it and notes lesions in the mouth and on the genitals too.\n- **Epidermoid cyst / lipoma:** both need the smooth, well-defined subcutaneous mass; then round and firm (cyst) or soft and painless (lipoma). \"May have central hole and discharge white substance\" is optional on the page, so it is not required.\n- **Acne** uses an OR of red papules, pustules, nodules and blackheads. The page writes \"and\", but its management treats a \"blackheads only\" case.\n- Location notes (\"usually on face and trunk\", \"on hands, knees or elbows\", \"trunk or upper limb\", \"usually on face\") describe where lesions usually appear. They are not criteria and are not encoded.\n- Management is not encoded: HIV testing, the treatments, referral criteria such as \"> 3cm\" and \"persists > 1 month\", and \"If diagnosis uncertain, discuss/refer\".\n\n## Could not model\n\n- **\"Differs from surrounding moles\".** No concept; the priority rule fires **less often** than the page intends.\n- **\"Skin-coloured\", \"pearly\" (molluscum), \"doughy\" and \"moves easily\" (lipoma).** No concepts. Those rules rest on the remaining features and fire **more often** than the page intends.\n- **\"Discharge pus\".** Encoded as any `Skin discharge`, which is broader than pus (fires more often).\n\n## SNOMED gaps\n\n- Mole as such: no `Mole`/`Nevus` disorder; used `Melanocytic nevus`.\n- Mole that differs from the patient's other moles (\"ugly duckling\" sign): none found. Searched nevus, pigmented lesion, atypical, dysplastic; `Atypical pigmented lesion` is broader, not used.\n- Change in size of a pigmented lesion: none found. `Change in skin lesion` was used instead.\n- Skin-coloured or flesh-coloured qualifier, pearly, umbilicated: none found. `Skin dimple` was used for the central dimple.\n- Doughy, mobile or movable qualifier (`Mobile`, `Freely mobile` don't exist): none found.\n- Purulent discharge from skin as a finding: none found. `Purulent discharge` exists only as a substance or morphologic abnormality; `Skin discharge` was used instead.\n- Plain `Wart` (disorder): none found; used `Viral wart of skin and/or mucous membrane caused by human papillomavirus`. No plain `Molluscum contagiosum` disorder; used `Infection of skin caused by Molluscum contagiosum`.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\nThese four all come from the molluscum rule's `(no …)` evidence with a finding_site. The rendered `(no …)` puts the `\"No\"` qualifier before the finding_site attribute, so neither the gate's `NO_RE` nor VHA's `(no ${s})` lookup matches it to the checked-for form. The findings are checked for and used.\n\n- `CHECKED FOR BUT NEVER USED AS EVIDENCE`: `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Papule of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Palm (region) structure\" \"body structure\")))`\n- `CHECKED FOR BUT NEVER USED AS EVIDENCE`: `(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Papule of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Structure of sole of foot\" \"body structure\")))`\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR`: `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Papule of skin\" \"disorder\") (snomed_concept \"No\" \"qualifier value\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Palm (region) structure\" \"body structure\"))))`\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR`: `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Papule of skin\" \"disorder\") (snomed_concept \"No\" \"qualifier value\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Structure of sole of foot\" \"body structure\"))))`\n\n## Questions for a clinician\n\n- Should a mole needing same-week referral raise triage priority to `Urgent`, or should these findings only be recorded and flagged for referral?\n- Is `Melanocytic nevus` the right concept for \"mole\", or should the broader `Pigmented skin lesion` be used so that a lesion the patient calls a mole (which may be a melanoma) is caught?\n- \"Softens in the centre to discharge pus\": should boil/abscess require both fluctuance and discharge (as encoded), or either one?\n- Boil vs abscess: is one diagnosis enough, given that both go to page 83?\n- Acne: is an OR of the lesion types right? With it, a single pustule or nodule makes acne probable, which overlaps with boil and Kaposi's sarcoma. Or should blackheads alone, or a mixed picture, be required?\n- Is a \"skin lump\" ever recorded as such at intake (it is not a common symptom), so that these rules can fire?\n", "claims": [{"claim_id": "c001", "rule": "Check for skin lump/s features", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Mass of skin\" \"finding\"))", "element_keys": ["p89-08f5bffe"], "quote": "SKIN LUMP"}, {"claim_id": "c002", "rule": "Check for skin lump/s features", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Mass of subcutaneous tissue\" \"finding\"))", "element_keys": ["p89-23225713"], "quote": "lump beneath skin"}, {"claim_id": "c003", "rule": "Check for skin lump/s features", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Melanocytic nevus\" \"disorder\"))", "element_keys": ["p89-8bdefab1"], "quote": "a mole"}, {"claim_id": "c004", "rule": "Check for skin lump/s features", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pain of skin\" \"finding\"))", "element_keys": ["p89-bee317dd"], "quote": "painful"}, {"claim_id": "c005", "rule": "Check for skin lump/s features", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Mass of skin\" \"finding\") (qualifier (snomed_concept \"Firm\" \"qualifier value\")))", "element_keys": ["p89-bee317dd"], "quote": "firm"}, {"claim_id": "c006", "rule": "Check <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.

    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }

    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
