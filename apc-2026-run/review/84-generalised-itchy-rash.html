ind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Urticaria likely • Help to identify and advise to avoid triggers2. • Apply calamine lotion as needed. • If recurrent eye problem, check for allergic conjunctivitis 48. • If recurrent nose problem, check for allergic rhinitis 51. • If recurrent cough or wheeze, exclude asthma 138. • For itch, give chlorphenamine 4mg 6-8 hourly. If known with chronic urticaria, give instead cetirizine 10mg daily. • Advise to return immediately if any symptoms of anaphylaxis3 occur. • If no better after 24 hours, discuss/refer.", "bbox": [599.5, 273.0, 705.2, 534.0], "key": "p84-c6824b07"}, {"id": "p84-out-e24", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Eczema likely • Eczema is a chronic condition with acute exacerbations. • Advise to avoid triggers such as soap, detergents, heat, fabrics that cause itch, overheating at night. • If low mood, stress or anxiety 98. • Wash with aqueous cream (UEA) instead of soap. • If severe, start at Step 3. • Step 1. Moisturise skin with emulsifying ointment (UE) twice a day and immediately after bathing. • Step 2. If no better after 7 days: apply hydrocortisone 1% cream twice a day for 7 days (apply sparingly to face, avoid eyes). If good response, reduce to once a day for 3 days, then stop. Continue with UEA and UE as above. • Step 3. If poor response to hydrocortisone or severe eczema, apply instead betamethasone 0.1% ointment once a day for 7 days (avoid face, neck, flexures). If good response, reduce use to every second day for a few days, then stop. Continue with UEA and UE as above. • For itch, give chlorphenamine 4mg at night for up to 2 weeks. If no better/severe daytime itch, give instead cetirizine 10mg daily. • If oozing/pus/yellow crusts, treat for infection: give cefalexin 500mg or flucloxacillin 500mg 6 hourly for 5 days. If severe penicillin allergy1, give instead azithromycin 500mg daily for 3 days. • Refer if: no better after 2 weeks, extensive involvement or painful pustules.", "bbox": [365.7, 263.0, 582.8, 534.0], "key": "p84-5041ed38"}, {"id": "p84-out-e25", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Papular pruritic eruption", "bbox": [248.5, 291.7, 348.8, 302.7], "key": "p84-b43cc0b9"}, {"id": "p84-out-e26", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "(PPE) likely • Test for HIV 124. • If lesions in webspaces, axillae or genitals, also treat for scabies in adjacent column. • Apply hydrocortisone 1% cream twice a day for 7 days (apply sparingly to face, avoid eyes) • For itch, give cetirizine 10mg daily. • Advise patient: - Reduce exposure to", "bbox": [248.0, 301.7, 348.8, 442.7], "key": "p84-03225de4"}, {"id": "p84-out-e27", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "insect bites. - May be long-standing", "bbox": [253.7, 442.5, 340.8, 462.7], "key": "p84-63674bd6"}, {"id": "p84-out-e28", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "and skin often remains hyperpigmented. - May temporarily worsen", "bbox": [253.7, 462.5, 348.8, 492.7], "key": "p84-4cd8cee2"}, {"id": "p84-out-e29", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "after starting ART.", "bbox": [259.4, 492.5, 324.0, 502.7], "key": "p84-46fdfdad"}, {"id": "p84-out-e30", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Scabies likely • Apply benzyl benzoate 25% lotion from neck to soles of feet and rub in well:", "bbox": [39.7, 302.1, 222.2, 333.1], "key": "p84-f9f2a803"}, {"id": "p84-out-e31", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- Leave on for 24 hours, then wash off with soap", "bbox": [45.4, 332.9, 222.4, 343.1], "key": "p84-fd05e4a5"}, {"id": "p84-out-e32", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "and water. - If severe, repeat once after 24 hours or within", "bbox": [45.4, 342.9, 217.3, 363.1], "key": "p84-44c09406"}, {"id": "p84-out-e33", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "5 days. • Only if no better, apply permethrin 5% lotion at night from neck to soles of feet. Wash off after 8-12 hours. Repeat after 1 week if needed. Avoid using permethrin and benzyl benzoate together. • For itch, give chlorphenamine 4mg 8 hourly for up to 10 days. If mild itch, use only at night. • Advise can return to work after first treatment. • Treat all household contacts and sexual partners at the same time, even if asymptomatic. • Wash recently used linen and clothing in very hot water and dry well. Expose to direct sunlight. • If yellow crusts, also treat for likely impetigo 93.", "bbox": [39.7, 362.9, 229.3, 503.1], "key": "p84-f4e5148f"}, {"id": "p84-out-e34", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If no response to treatment, discuss/refer.", "bbox": [117.8, 516.9, 269.1, 527.1], "key": "p84-155a061d"}, {"id": "p84-out-e35", "page": 84, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1History of anaphylaxis, urticaria or angioedema. 2Common triggers: foods (milk, eggs, nuts, wheat, seafood), medications, insect bites/stings and latex. 3Wheeze, difficulty breathing, dizziness/collapse, abdominal pain, vomiting.", "bbox": [34.0, 543.5, 728.4, 552.0], "key": "p84-fa6f4dd1"}], "boxes": [{"box": 1, "rect": [35.5, 86.8, 806.4, 108.3]}], "crop lised itchy rash\"\n  adult\n  (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n  (check_for\n    ;; Insect bites: red itchy crops of bumps\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Grouped\" \"qualifier value\")))\n\n    ;; Scabies: small red bumps and burrows in webspaces of fingers, axillae, waist and genitals\n    (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Structure of interdigital web of hand\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Axillary region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Structure of waist region of trunk\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Genital structure\" \"body structure\")))\n\n    ;; Papular pruritic eruption: hyperpigmented, itchy bumps on limbs, trunk or face\n    (clinical_finding (snomed_concept \"Hyperpigmentation of skin\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Limb structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Trunk structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Face structure\" \"body structure\")))\n\n    ;; Eczema: patches of dry, scaly, itchy skin on wrists, ankles, inside elbows or behind knees\n    (clinical_finding (snomed_concept \"Xeroderma\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Wrist region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Ankle region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Antecubital region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Popliteal region structure\" \"body structure\")))\n\n    ;; Urticaria: very itchy, red, raised wheals that appear suddenly\n    (clinical_finding (snomed_concept \"Wheal\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n\n    ;; Drug rash: diffuse red rash, appeared within 3 months of starting a new medication\n    (clinical_finding (snomed_concept \"Erythematous rash\" \"disorder\") (qualifier (snomed_concept \"Diffuse\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"New medication commenced\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable insect bites (generalised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Insect bite - wound\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n       (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Grouped\" \"qualifier value\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable scabies (generalised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Infestation caused by Sarcoptes scabiei var hominis\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n       (clinical_finding (snomed_concept \"Burrows in skin\" \"disorder\"))\n       (or (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Structure of interdigital web of hand\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Axillary region structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Structure of waist region of trunk\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Genital structure\" \"body structure\")))\n       )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable papular pruritic eruption (generalised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Papular pruritic eruption of skin due to human immunodeficiency virus infection\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n       (clinical_finding (snomed_concept \"Hyperpigmentation of skin\" \"disorder\"))\n       (or (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Limb structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Trunk structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Papule of skin\" \"disorder\") (finding_site (snomed_concept \"Face structure\" \"body structure\")))\n       )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable eczema (generalised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Eczema\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n       (clinical_finding (snomed_concept \"Xeroderma\" \"disorder\"))\n       (or (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Wrist region structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Ankle region structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Antecubital region structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Scaly skin\" \"finding\") (finding_site (snomed_concept \"Popliteal region structure\" \"body structure\")))\n       )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable urticaria (generalised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Urticaria\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n       (clinical_finding (snomed_concept \"Wheal\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable drug rash (generalised itchy rash)\"\n  (diagnosis\n    (snomed_concept \"Eruption caused by drug\" \"disorder\")\n    probable\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Pruritic rash\" \"disorder\"))\n       (clinical_finding (snomed_concept \"Erythematous rash\" \"disorder\") (qualifier (snomed_concept \"Diffuse\" \"qualifier value\")))\n       (<= (onset (clinical_finding (snomed_concept \"New medication commenced\" \"finding\"))) (time_ago 3 months))\n  )\n)\n", "rules": [{"atom": "task", "description": "Check for causes of generalised itchy rash", "ages": ["adult"], "raw": "(task \"Check for causes of generalised itchy rash\" \"adult\" (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pruritic rash\" \"disorder\")) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Papule of skin\" \"disorder\") (qualifier (snomed_concept \"Grouped\" \"qualifier value\"))) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Burrows in skin\" \"disorder\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Papule of skin\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Structure of interdigital web of \") probable)", "(diagnosis (snomed_concept \"Infestation caused by Sarcoptes scabiei var hominis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Insect bite - wound\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Urticaria\" \"disorder\") probable)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Papular pruritic eruption of skin due to human immunodeficiency virus infection\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Papular eruption\" \"disorder\") probable)", "relation": "A_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 84 – Generalised itchy rash: flowchart\n\nSource: APC 2026 e-book page 84. The red box is a pointer only (\"Check if the patient needs urgent\nattention ↻ 82\"). The page is a pattern-recognition grid: a top line (insect bites) and five\npicture boxes, each leading to an \"X likely\" management box.\n\n```mermaid\nflowchart TD\n    START[\"Generalised itchy rash\"] --> URG[\"Check if the patient needs urgent attention ↻ 82\"]\n    URG --> IB{\"Red itchy crops of bumps (may have blistered / healed dark / scratch marks)?\"}\n    IB -- Yes --> IBL[\"Insect bites likely → 85\"]\n    URG --> SC{\"Small red bumps and burrows in webspaces of fingers, axillae, waist, genitals; very itchy esp. at night\"}\n    SC --> SCL[\"Scabies likely\"]\n    URG --> PPE{\"Hyperpigmented, itchy bumps on limbs, trunk or face\"}\n    PPE --> PPEL[\"Papular pruritic eruption (PPE) likely\"]\n    URG --> EC{\"Patches of dry, scaly, itchy skin on wrists, ankles, inside elbows or behind knees\"}\n    EC --> ECL[\"Eczema likely\"]\n    URG --> UR{\"Very itchy, red, raised wheals that appear suddenly, usually gone within 24 h\"}\n    UR --> URL[\"Urticaria likely\"]\n    URG --> DR{\"Diffuse red rash mainly on trunk, arms, legs, within 3 months of starting a new medication\"}\n    DR --> DRL[\"Drug rash likely → 88\"]\n    SCL --> NR[\"If no response to treatment, discuss/refer\"]\n    PPEL --> NR\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Generalised itchy rash | `Pruritic rash` (disorder) as trigger | `Check for causes of generalised itchy rash` |\n| Check urgent attention ↻ 82 | Pointer only; not modelled here | — |\n| Insect bites | Pruritic rash + Papule of skin (Grouped) | `Diagnose probable insect bites (generalised itchy rash)` |\n| Scabies | Pruritic rash + Burrows in skin + papule at finger web / axilla / waist / genitals | `Diagnose probable scabies (generalised itchy rash)` |\n| PPE | Pruritic rash + Hyperpigmentation of skin + papule at limb / trunk / face | `Diagnose probable papular pruritic eruption (generalised itchy rash)` |\n| Eczema | Pruritic rash + Xeroderma + scaly skin at wrist / ankle / antecubital / popliteal | `Diagnose probable eczema (generalised itchy rash)` |\n| Urticaria | Pruritic rash + Wheal (Sudden onset) | `Diagnose probable urticaria (generalised itchy rash)` |\n| Drug rash | Pruritic rash + Erythematous rash (Diffuse) + New medication commenced within 3 months | `Diagnose probable drug rash (generalised itchy rash)` |\n| No response → discuss/refer | Management; not modelled | — |\n", "questions": "# Page 84 – Generalised itchy rash: remaining questions\n\n## Decisions made\n\n- **Reconciled build** (base: builder A). From builder B: \"crops of bumps\" encoded with the `Grouped`\n  qualifier. Kept from A: trigger `Pruritic rash` only; every probable rule gated on `Pruritic rash`\n  (the whole page is about an itchy rash); `Diffuse` qualifier on the drug rash; antecubital/popliteal\n  *region* sites; HIV-specific PPE concept (unsettled, see questions).\n\n- **Red box is pointer-only** (\"Check if the patient needs urgent attention ↻ 82\"): no priority\n  evaluation; the element is `cross_reference_only`. The page's six \"X likely\" boxes are encoded as\n  `probable` diagnosis rules, all triggered by the complaint.\n- **Complaint concept:** `Pruritic rash` (disorder). It is not a recorded common symptom or warning\n  sign, so the task only fires once the rash itself is recorded.\n- **Insect bites:** only \"red itchy crops of bumps\" is required (`Papule of skin` with qualifier `Grouped`); blistering,\n  darkening and scratch marks are \"may have\" items. Diagnosis concept `Insect bite - wound`.\n- **Scabies:** burrows **and** red bumps at one of the listed sites (finger webspaces, axillae,\n  waist, genitals). \"Very itchy, especially at night\" is covered by the complaint; \"especially at\n  night\" is not required.\n- **PPE:** hyperpigmentation is recorded as a separate finding (`Hyperpigmentation of skin`) with\n  papules on limbs/trunk/face; diagnosis concept is the HIV-specific PPE concept (the only one).\n- **Eczema:** dry (`Xeroderma`) **and** scaly skin at wrist, ankle, antecubital or popliteal region.\n- **Urticaria:** `Wheal` with `Sudden onset`. \"Usually disappear within 24 hours\" is not required.\n- **Drug rash:** diffuse erythematous rash **and** a new medication commenced within the last 3\n  months, written `(<= (onset …) (time_ago 3 months))` per the time-comparator rule.\n- Management boxes (all treatment, advice, referral, \"test for HIV\", cross-references to 48, 51,\n  85, 88, 93, 98, 124, 138) are management, not modelled.\n\n## Could not model\n\n- \"Red\" of the bumps: no erythematous-papule concept; `Papule of skin` + `Grouped` is used, so the\n  insect-bites rule can fire alongside scabies/PPE (grouped papules occur in those too).\n- \"Appeared within 3 months of starting a new medication\" relates two event times; the language can\n  only compare one onset with now. Approximated as medication started within the last 3 months —\n  fires less often when a rash began soon after a medication started more than 3 months ago. Also\n  depends on the onset of `New medication commenced` being recorded as the start date, not the\n  date it was entered.\n- \"Usually disappear within 24 hours\" (lesion duration) and \"especially at night\" (timing of itch).\n- \"Mainly on trunk, arms and legs\" for drug rash: descriptive; not required.\n\n## SNOMED gaps\n\n- \"Scabies\" (disorder) does not exist → `Infestation caused by Sarcoptes scabiei var hominis`.\n- \"Dry skin\" (finding) does not exist → `Xeroderma` (disorder).\n- No \"Hyperpigmented\" qualifier → separate `Hyperpigmentation of skin` finding.\n- No PPE concept without HIV cause → `Papular pruritic eruption of skin due to human immunodeficiency virus infection`.\n- All `finding_site` body structures confirmed with `snomed exists`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the insect-bites rule require one of the \"may have\" features (blisters, dark healed\n  lesions, scratch marks) to avoid firing alongside scabies/PPE?\n- For scabies, should burrows alone or site-specific papules alone suffice (burrows are often not\n  seen)?\n- Is diagnosing the HIV-specific PPE concept acceptable before HIV status is known?\n- Is \"medication started within the last 3 months\" an acceptable stand-in for \"rash appeared\n  within 3 months of starting a new medication\"?\n- Should the task also fire on `Generalized rash` or `Generalized pruritus` (concepts VHA already uses),\n  or only on `Pruritic rash` as now? Each of those lacks either the itch or the rash in the page title.\n- Is `Papule of skin` + `Grouped` an acceptable proxy for \"crops of bumps\", given grouped papules\n  could also be scabies or PPE (several probable rules may fire together)?\n- Should the eczema sites be the fossae (`Structure of cubital fossa`, `Popliteal fossa structure`,\n  narrower) instead of the antecubital and popliteal regions used now?\n", "claims": [{"claim_id": "c001", "rule": "Check for causes of generalised itchy rash", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_  {"resolves": true, "id": "827160004", "descendants": 0, "parents": ["Eruption of skin (disorder)"]}, "Diffuse|qualifier value": {"resolves": true, "id": "19648000", "descendants": 1, "parents": ["General adjectival modifier (qualifier value)", "Distributions (qualifier value)"]}, "New medication commenced|finding": {"resolves": true, "id": "266712008", "descendants": 0, "parents": ["Drug dosage altered (finding)"]}, "Insect bite - wound|disorder": {"resolves": true, "id": "276433004", "descendants": 293, "parents": ["Arthropod bite wound (disorder)"]}, "Infestation caused by Sarcoptes scabiei var hominis|disorder": {"resolves": true, "id": "128869009", "descendants": 1, "parents": ["Infestation caused by Sarcoptes (disorder)"]}, "Papular pruritic eruption of skin due to human immunodeficiency virus infection|disorder": {"resolves": true, "id": "870328002", "descendants": 0, "parents": ["Papular eruption (disorder)", "Disorder of skin due to human immunodeficiency virus infection (disorder)"]}, "Eczema|disorder": {"resolves": true, "id": "43116000", "descendants": 235, "parents": ["Inflammatory dermatosis (disorder)"]}, "Urticaria|disorder": {"resolves": true, "id": "126485001", "descendants": 97, "parents": ["Edematous skin (disorder)", "Angioedema and/or urticaria (disorder)"]}, "Eruption caused by drug|disorder": {"resolves": true, "id": "28926001", "descendants": 19, "parents": ["Drug-induced lesion (disorder)", "Adverse reaction caused by drug (disorder)", "Eruption of skin (disorder)"]}}, "vs_will": {"page_2026": 84, "page_2023": 69, "will_file": null, "redbox_status_2023": [], "groups": {}, "note": "no 2023 rule file for this page"}, "rule_hash": "bdba836072a0"}</script>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {

// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.

function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
