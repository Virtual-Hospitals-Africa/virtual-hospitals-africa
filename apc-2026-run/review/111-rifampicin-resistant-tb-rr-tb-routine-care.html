, "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess the patient with RR-TB At diagnosis, notify1. Also register the patient in the RR-TB register (EDRWeb) once treatment started. Update register at every visit and upon discharge from care.", "bbox": [127.2, 171.9, 714.6, 193.0], "key": "p111-5cf11dcf"}, {"id": "p111-out-e03", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess When to assess Note", "bbox": [39.7, 197.3, 248.8, 208.3], "key": "p111-9328f89b"}, {"id": "p111-out-e04", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Symptoms Every visit • If respiratory rate ≥ 30, breathless at rest or while talking, prominent use of breathing muscles, drowsy/confused, coughs up ≥ 1 tablespoon fresh blood, neck stiffness, persistent vomiting or new weakness of arm/leg, give urgent attention and refer. If persistent episodes of coughing blood, consider referral for surgical review. • Expect gradual improvement. If not improving, assess adherence, other long-term conditions and review DST results. • If still no clinical improvement at 3-4 months or month 3 culture positive, request extended phenotypic DST and present to PCAC/NCAC 200 to advise on rescue regimen.", "bbox": [39.7, 211.7, 802.6, 261.8], "key": "p111-fdc6d6b7"}, {"id": "p111-out-e05", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Adherence Every visit Ask about factors that may influence adherence and give adherence support 195. If returning after loss to follow-up, request extended phenotypic DST on latest positive culture and present to PCAC/NCAC 200 to advise on regimen.", "bbox": [39.7, 264.8, 787.0, 285.6], "key": "p111-70d29801"}, {"id": "p111-out-e06", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Side effects Every visit • Ask about side effects of treatment 118. Manage promptly as side effects are common cause of treatment interruption. • If intolerance to any medication, present to PCAC/NCAC 200 for medication substitution. • Report adverse events on EDRWeb and to SAHPRA via EDRWeb.", "bbox": [39.7, 288.5, 649.3, 319.3], "key": "p111-8334c736"}, {"id": "p111-out-e07", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "TB contacts At diagnosis • Ask if patient is a TB contact2 of index patient with RR-TB. If yes, check index patient's DST results to help decide patient's RR-TB treatment regimen. • Advise that all TB contacts2 of newly diagnosed RR-TB patient have symptom screen and TB NAAT. If TB NAAT negative, assess for TPT and continue TB symptom screening 3 monthly for first 12 months then 6 monthly up to 24 months. Refer to CHW/WBOTs to do home visit for TB screening/testing or advise self-screening via TB HealthCheck 200.", "bbox": [39.7, 322.1, 794.7, 362.9], "key": "p111-875f51f0"}, {"id": "p111-out-e08", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Family planning Every visit • Check for pregnancy if patient is a woman of child-bearing potential. If not pregnant, advise to avoid pregnancy during treatment and assess patient's contraceptive needs 170. If pregnant, give routine antenatal care 175 and start RR-TB treatment. • If on injectable contraceptive, no need to change interval between doses.", "bbox": [39.7, 366.2, 796.7, 396.4], "key": "p111-9b90f505"}, {"id": "p111-out-e09", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Mental health Every visit If stress, anxiety or low mood, assess and manage further 98.", "bbox": [39.7, 399.4, 444.8, 410.2], "key": "p111-eb6dc1c5"}, {"id": "p111-out-e10", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Alcohol/drug use At diagnosis, if poor adherence In the past year, has patient: drunk ≥ 4 drinks3/session, used illegal drugs or misused prescription or over-the-counter medications? If yes to any 165.", "bbox": [39.7, 414.1, 743.2, 424.9], "key": "p111-c58c85b2"}, {"id": "p111-out-e11", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Palliative care If deteriorating If the patient has any of: in bed or chair for 50% or more of the day, dependent on others for most care, has had 2 or more unplanned hospital admissions in past 6 months, unintentional weight loss over the past 3-6 months or the patient/family requests palliative care; chooses to reduce, stop or not have treatment and wishes to focus on quality of life 191.", "bbox": [39.7, 429.3, 798.3, 459.5], "key": "p111-dd2f469f"}, {"id": "p111-out-e12", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Weight and BMI4 Every visit If BMI < 18.5, refer for nutritional support. Expect weight gain on treatment and adjust treatment doses. If losing weight on treatment, discuss with specialist/refer.", "bbox": [39.7, 462.8, 782.4, 473.0], "key": "p111-e8247b38"}, {"id": "p111-out-e13", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "BP At diagnosis If known hypertension 149. If not, check BP: if ≥ 140/90 148.", "bbox": [39.7, 476.0, 452.6, 486.8], "key": "p111-4ac11d99"}, {"id": "p111-out-e14", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "HIV At diagnosis and after 3 months of RR-TB treatment if previous test negative", "bbox": [39.7, 491.0, 216.7, 521.2], "key": "p111-e832b97b"}, {"id": "p111-out-e15", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Test for HIV 124. If positive, give HIV routine care 126. • Avoid giving the following medications together: zidovudine with linezolid; efavirenz with bedaquiline or pretomanid; tenofovir with amikacin.", "bbox": [229.6, 490.6, 720.9, 511.4], "key": "p111-9077d0f2"}, {"id": "p111-out-e16", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "RR-TB refers to TB that is resistant to rifampicin, with or without resistance to other TB medications. If patient has INH-resistant TB 107. If RR-TB care not available, refer to closest DR-TB treatment initiation site.", "bbox": [51.0, 89.1, 763.7, 109.9], "key": "p111-c3a9c53f"}, {"id": "p111-out-e17", "page": 111, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Complete notifiable medical conditions (NMC) case notification form and send to NMCsurveillanceReport@nicd.ac.za or notify electronically: www.nicd.ac.za/nmc-overview/notification-process. 2A TB contact refers to any person who shared an enclosed space (at school, socially, or in a household setting), for ≥ 1 night or for frequent/extended daytime periods, with an adult/adolescent with pulmonary TB (\"index patient\"), during the 3-month period before the index patient started their TB treatment. 3One drink is 1 tot of spirits, or 1 small glass (125mL) of wine or 1 can/bottle (330mL) of beer. 4BMI = weight (kg) ÷ height (m) ÷ height (m).", "bbox": [34.0, 526.8, 791.4, 551.8], "key": "p111-93332c67"}], "boxes": [{"box": 1, "rect": [35.5, 120.0, 806.3, 161.7]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAABXCAIAAAAxsQWQAAAACXBIWXMAABcSAAAXEgFnn9JSAABkqklEQVR4nO29h3MUx/P//ftDnip/LRsbg8nRZCEyCAkBAoTAiCSZHEQSwSKJZGGTETknkZMQOcoEAUJgcjZgwBhswASHzz5vbkR7mN2d3btTOuiqV6l0exsmdPd0983M/r/f/r9PGYZhGIZhGIZhGIZhGCaw+H8F e 111 – Rifampicin-resistant TB (RR-TB): routine care: remaining questions\n\n## Decisions made\n\n- **Trigger.** The page is routine care for a patient already known to have RR-TB, and the red-box\n  header (\"If any of the following, discuss or refer to hospital for admission\") names no complaint.\n  Every rule is anchored on `(clinical_finding (snomed_concept \"Rifampicin resistant tuberculosis\" \"disorder\"))`,\n  cited to the page title. No rule on this page diagnoses RR-TB at `probable`, so the\n  `clinical_finding` form is used in the task trigger and in both priority rules. RR-TB is not a\n  recorded common symptom or warning sign; the rules fire only once RR-TB is recorded as a finding.\n- **Two priority evaluations, both `Urgent`.**\n  - `Urgent: RR-TB routine care with criteria for hospital admission` encodes the red box.\n  - `Urgent: RR-TB with urgent symptoms at routine visit` encodes the Symptoms row\n    (\"If respiratory rate ≥ 30, breathless at rest or while talking, … give urgent attention and refer\").\n  The page does not escalate beyond \"urgent attention\", so neither rule uses `\"Very urgent\"` or `Emergency`.\n- **\"Unable to walk unaided\"** = `Difficulty walking` OR `Unable to walk`: these are the two abnormal\n  values of the adult mobility vital assessment (\"Difficulty walking\", \"Stretcher/Immobile\").\n- **\"Difficulty with adherence\"** = `Noncompliance with treatment` (finding).\n- **\"Patient requests admission\"** = `Patient requests a hospital referral` (situation). This is the closest concept.\n- **BMI < 18** is encoded as `(< (measurement \"Body mass index\" kg/m²) 18)`, exactly as the red box\n  writes it (the Weight and BMI row's \"< 18.5, refer for nutritional support\" is management and is not encoded).\n  A `measure` task for BMI (\"Weight and BMI, every visit\") makes it checked for.\n- **\"Breathless while talking\"** = `Unable to complete a sentence in one breath`. **\"Prominent use of\n  breathing muscles\"** = `Accessory respiratory muscles used`. **\"New weakness of arm/leg\"** =\n  `Muscle weakness of limb` + `New` qualifier.\n- **No diagnosis rules.** The page has no \"X likely\" or \"consider X\" statements. Its other rows are\n  management steps or cross-references (adherence 195, side effects 118, family planning 170/175,\n  mental health 98, alcohol 165, palliative care 191, BP 148/149, HIV 124/126). None is encoded.\n- No flowchart file: the page has no flowchart or Yes/No algorithm.\n\n## Could not model\n\n- **Hb < 8**: there is no haemoglobin observable or unit. Only the BMI half is encoded. The admission rule\n  fires **less often** than the page intends.\n- **\"Any condition that would be better managed in an inpatient setting\"**: open-ended clinical judgement.\n  Not encoded, so the rule fires **less often**.\n- **\"Coughs up ≥ 1 tablespoon fresh blood\"**: the volume can't be expressed, so it is encoded as plain\n  `Hemoptysis`. The rule fires **more often** than the page intends (any haemoptysis).\n- \"Persistent episodes of coughing blood, consider referral for surgical review\"; \"if not improving …\";\n  \"no clinical improvement at 3-4 months or month 3 culture positive\"; \"If losing weight on treatment\":\n  these are management or lab/culture-based. The page triggers no diagnosis from them. Not encoded.\n\n## SNOMED gaps\n\n- \"Infection control challenges at home\": nothing found (searched infection control, home environment,\n  housing). Not encoded, so the rule fires less often.\n- \"Unstable social circumstances\": nothing specific (searched social circumstances, social instability,\n  unstable, housing). `Social problem not due to a mental disorder` is too broad. Not encoded.\n- \"Patient requests admission\": no exact concept. The substitute is `Patient requests a hospital referral` (situation).\n- \"Difficulty with adherence\": no exact concept. The substitute is `Noncompliance with treatment` (finding).\n- \"Breathless while talking\": no \"dyspnea on talking\" concept. The substitute is\n  `Unable to complete a sentence in one breath` (finding).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the red box (\"discuss or refer for admission\") really raise the priority to `Urgent`? Some of its\n  criteria aren't time-critical: difficulty with adherence, BMI < 18 and social circumstances.\n- \"Difficulty with adherence\" is encoded as `Noncompliance with treatment`; the narrower\n  `Noncompliance with medication regimen` was the other builder's choice. Is the broader concept right?\n\n- Is `Patient requests a hospital referral` an acceptable stand-in for \"patient requests admission\"?\n- Should any haemoptysis in an RR-TB patient be urgent (current encoding), or only ≥ 1 tablespoon,\n  which can't be expressed?\n- Should \"Difficulty walking\" (walks with help) count as \"unable to walk unaided\"? The current encoding counts it.\n- Should the Symptoms-row criteria (breathless at rest/talking, haemoptysis, new limb weakness) be\n  `\"Very urgent\"` rather than `Urgent`?\n", "claims": [{"claim_id": "c001", "rule": "Check for RR-TB admission and urgent referral criteria", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Rifampicin resistant tuberculosis\" \"disorder\"))", "element_keys": ["p111-b997cfca"], "quote": "RIFAMPICIN-RESISTANT TB (RR-TB)"}, {"claim_id": "c002", "rule": "Check for RR-TB admission and urgent referral criteria", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Drowsy\" \"finding\"))", "element_keys": ["p111-35bd3688"], "quote": "Drowsy"}, {"claim_id": "c003", "rule": "Check for RR-TB admission and urgent referral criteria", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Acute confusion\" \"finding\"))", "element_keys": ["p111-35bd3688"], "quote": "confused"}, {"claim_id": "c <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
