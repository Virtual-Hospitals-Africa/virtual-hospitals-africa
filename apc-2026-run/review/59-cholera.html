 and water, before preparing food/after going to toilet. Use only safe/ disinfected water for preparing food/drinks/ice.", "bbox": [609.4, 402.2, 799.7, 492.4], "key": "p59-31b90d54"}, {"id": "p59-out-e07", "page": 59, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Notify4 as suspected cholera.", "bbox": [363.9, 504.7, 477.8, 515.7], "key": "p59-e671471b"}, {"id": "p59-out-e08", "page": 59, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Reassess hourly. Does patient have either of: • Signs of dehydration: unable to drink/drinking poorly, poor skin turgor, sunken eyes, weak pulse/pulse ≥ 100, not passing urine, unable to walk unaided • Ongoing diarrhoea or vomiting?", "bbox": [414.6, 301.6, 729.5, 342.4], "key": "p59-2059be34"}, {"id": "p59-out-e09", "page": 59, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No Dehydration unlikely Give oral rehydration solution", "bbox": [678.2, 199.5, 799.9, 229.7], "key": "p59-f1bbec25"}, {"id": "p59-out-e10", "page": 59, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "(ORS), at least 2L (as much as", "bbox": [684.9, 228.9, 793.2, 239.7], "key": "p59-461cc863"}, {"id": "p59-out-e11", "page": 59, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "patient wants) over 4 hours.", "bbox": [687.1, 239.5, 791.0, 249.7], "key": "p59-4ba03add"}, {"id": "p59-out-e12", "page": 59, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Does patient have reliable transport to return if worse?", "bbox": [528.6, 378.8, 728.6, 389.0], "key": "p59-6a08dcb3"}, {"id": "p59-out-e13", "page": 59, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes", "bbox": [3 btBp9ZDsAAAAASUVORK5CYII="}, "page_image": null, "lisp": ";; Page 59 - Cholera\n;; Flowchart and decision nodes: 59-cholera-flowchart.md\n(task\n  \"Check for cholera (cholera page)\"\n  adult\n  (clinical_finding (snomed_concept \"Diarrhea\" \"finding\"))\n  (check_for\n    (clinical_finding (snomed_concept \"Diarrhea\" \"finding\") (qualifier (snomed_concept \"Watery\" \"qualifier value\")))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Vibrio cholerae\" \"organism\"))\n  )\n)\n(task\n  \"Check for level of dehydration in cholera\"\n  adult\n  (active_condition (snomed_concept \"Cholera\" \"disorder\"))\n  (check_for\n    ;; Severe dehydration: any of\n    (clinical_finding (snomed_concept \"Drowsy\" \"finding\"))\n    (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Weak arterial pulse\" \"finding\"))\n\n    ;; Severe dehydration: or >= 2 of\n    (clinical_finding (snomed_concept \"Unable to drink\" \"finding\"))\n    (clinical_finding (snomed_concept \"Difficulty drinking\" \"finding\"))\n    (clinical_finding (snomed_concept \"Decreased skin turgor\" \"finding\"))\n    (clinical_finding (snomed_concept \"Sunken eyes\" \"finding\"))\n\n    ;; Some dehydration: >= 2 of (with pulse >= 100, a routine vital)\n    (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Increased thirst\" \"finding\"))\n    (clinical_finding (snomed_concept \"Xerostomia\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable cholera\"\n  (diagnosis\n    (snomed_concept \"Cholera\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Watery diarrhoea (with or without vomiting) and in a cholera outbreak area in the past 5 days\n  (and\n    (clinical_finding (snomed_concept \"Diarrhea\" \"finding\") (qualifier (snomed_concept \"Watery\" \"qualifier value\")))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Vibrio cholerae\" \"organism\"))\n    (<= (onset (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Vibrio cholerae\" \"organism\"))) (time_ago 5 days))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable some dehydration in cholera\"\n  (diagnosis\n    (snomed_concept \"Moderate dehydration\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Q1 = No, then Q2 = Yes: >= 2 of restless, thirsty, dry mouth, pulse >= 100\n  (and\n    (active_condition (snomed_concept \"Cholera\" \"disorder\"))\n    ;; Q1 = No, written as recorded \"No\" answers: none of the \"any of\" signs,\n    ;; and at most one of the \">= 2 of\" signs (so at least two of the three are \"No\")\n    (no (clinical_finding (snomed_concept \"Drowsy\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Acute confusion\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Weak arterial pulse\" \"finding\")))\n    (any2\n      (and (no (clinical_finding (snomed_concept \"Unable to drink\" \"finding\")))\n           (no (clinical_finding (snomed_concept \"Difficulty drinking\" \"finding\")))\n      )\n      (no (clinical_finding (snomed_concept \"Decreased skin turgor\" \"finding\")))\n      (no (clinical_finding (snomed_concept \"Sunken eyes\" \"finding\")))\n    )\n    (any2\n      (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n      (clinical_finding (snomed_concept \"Increased thirst\" \"finding\"))\n      (clinical_finding (snomed_concept \"Xerostomia\" \"finding\"))\n      (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n    )\n  )\n)\n(system_priority_evaluation\n  \"Urgent: cholera with severe dehydration\"\n  adult\n  Urgent\n  ;; Q1 = Yes: manage as severe dehydration and refer urgently\n  (and\n    (active_condition (snomed_concept \"Cholera\" \"disorder\"))\n    (or\n      (clinical_finding (snomed_concept \"Drowsy\" \"finding\"))\n      (clinical_finding (snomed_concept \"Decreased level of consciousness\" \"finding\"))\n      (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n      (clinical_finding (snomed_concept \"Clouded consciousness\" \"finding\"))\n      (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n      (clinical_finding (snomed_concept \"Weak arterial pulse\" \"finding\"))\n      (any2\n        (or (clinical_finding (snomed_concept \"Unable to drink\" \"finding\"))\n            (clinical_finding (snomed_concept \"Difficulty drinking\" \"finding\"))\n        )\n        (clinical_finding (snomed_concept \"Decreased skin turgor\" \"finding\"))\n        (clinical_finding (snomed_concept \"Sunken eyes\" \"finding\"))\n      )\n    )\n  )\n)\n(system_priority_evaluation\n  \"Urgent: cholera with some dehydration\"\n  adult\n  Urgent\n  ;; Red box 1: Some dehydration likely\n  (active_condition (snomed_concept \"Moderate dehydration\" \"disorder\"))\n)\n", "rules": [{"atom": "task", "description": "Check for cholera (cholera page)", "ages": ["adult"], "raw": "(task \"Check for cholera (cholera page)\" \"adult\" (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Diarrhea\" \"finding\")) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Diarrhea\" \"finding\") (qualifier (snomed_concept \"Watery\" \"qualifier value\"))) (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Vibrio cholerae\" \"organism\"))))", "headline": "Task: Check for cholera (cholera page)", "when": {"kind": concept \"Clinical finding\" \"finding\") (snomed_concept \"Weak arterial pulse\" \"finding\") (snomed_concept \"No\" \"qualifier value\")))"], "is_a_related": [{"A": "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Acute confusion\" \"finding\") (snomed_concept \"No\" \"qualifier value\")))", "B": "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Clouded consciousness\" \"finding\") (snomed_concept \"No\" \"qualifier value\")))", "relation": "A_narrower"}, {"A": "(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Acute confusion\" \"finding\") (snomed_concept \"No\" \"qualifier value\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Clouded consciousness\" \"finding\"))", "relation": "A_narrower"}], "same_concept_different_form": []}, "diagnosis": {"only_A": ["(diagnosis (snomed_concept \"Moderate dehydration\" \"disorder\") probable)"], "only_B": ["(diagnosis (snomed_concept \"Dehydration\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Severe dehydration\" \"disorder\") probable)"], "both": ["(diagnosis (snomed_concept \"Cholera\" \"disorder\") probable)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Moderate dehydration\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Dehydration\" \"disorder\") probable)", "relation": "A_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 59 – Cholera: flowchart\n\nSource: APC 2026 e-book page 59 (APC 2026 e-book, page 59; four red boxes).\n\n```mermaid\nflowchart TD\n    C[\"Watery diarrhoea (± vomiting) and in cholera outbreak area in past 5 days<br/>→ cholera likely. Discuss all suspected cases with doctor.<br/>Isolate; glucose &lt; 3 (&lt; 4 if diabetes) ↻ 19; record each episode\"]\n    C --> Q1[\"Does patient have any of: drowsy/decreased consciousness, confused,<br/>difficulty breathing, weak pulse<br/><i>or<\/i> ≥ 2 of: unable to drink (or drinking poorly), poor skin turgor, sunken eyes?\"]\n    Q1 -- Yes --> SEV[\"RED BOX 2: Manage as severe dehydration and refer urgently<br/>(IV fluids / ORS / NGT, ongoing losses)\"]\n    SEV --> RE15[\"RED BOX 3: Reassess every 15-30 minutes.<br/>No better/worse → discuss with referral centre.<br/>Awake, able to drink and pulse &lt; 100 → also manage as some dehydration\"]\n    RE15 --> CIPRO1[\"Give single dose ciprofloxacin 1g. Send stool for MCS and cholera\"]\n    Q1 -- No --> Q2[\"Does patient have ≥ 2 of: restless, thirsty, dry mouth, pulse ≥ 100?\"]\n    Q2 -- Yes --> SOME[\"RED BOX 1: Some dehydration likely<br/>ORS 75mL/kg over 4 hours + after each episode\"]\n    Q2 -- No --> NONE[\"Dehydration unlikely. ORS at least 2L over 4 hours\"]\n    SOME --> STOOL[\"Send stool specimen for MCS and cholera\"]\n    NONE --> STOOL\n    STOOL --> RH[\"Reassess hourly. Either of: signs of dehydration (unable to drink/drinking poorly,<br/>poor skin turgor, sunken eyes, weak pulse/pulse ≥ 100, not passing urine,<br/>unable to walk unaided) or ongoing diarrhoea or vomiting?\"]\n    RH -- Yes --> SEV2[\"RED BOX 4: Manage as severe dehydration and refer urgently (see adjacent)\"]\n    RH -- No --> TR[\"Reliable transport to return if worse?\"]\n    TR -- No --> DR[\"Discuss/refer; keep reassessing hourly;<br/>ciprofloxacin if some dehydration, pregnant, ≥ 60 y or long-term condition\"]\n    TR -- Yes --> DC[\"Discharge to reliable carer; advice; ORS after each stool; handwashing\"]\n    CIPRO1 --> N[\"Notify as suspected cholera\"]\n    DR --> N\n    DC --> N\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Diarrhoea presents (entry) | `Diarrhea` (common symptom) triggers the questions for cholera | `Check for cholera (cholera page)` |\n| C: cholera likely | Watery diarrhoea (Diarrhea + `Watery` qualifier) **and** exposure to *Vibrio cholerae* with onset within the past 5 days (`<=`). \"With or without vomiting\" adds no condition | `Diagnose probable cholera` |\n| Cholera → dehydration questions | `(active_condition Cholera)` triggers the dehydration check | `Check for level of dehydration in cholera` |\n| Q1 = Yes | Cholera **and** (any of drowsy / decreased consciousness / confused / difficulty breathing / weak pulse **or** `any2` of unable to drink-or-drinking-poorly, poor skin turgor, sunken eyes) | `Urgent: cholera with severe dehydration` |\n| Q1 = No → Q2 = Yes | Cholera **and** `(not Q1)` **and** `any2` of restless, thirsty, dry mouth, pulse ≥ 100 | `Diagnose probable some dehydration in cholera` → `Urgent: cholera with some dehydration` (red box 1) |\n| Q2 = No: dehydration unlikely | Not modelled (\"unlikely\" has no form) | — |\n| Reassess every 15–30 min (red box 3) | Not modelled: reassessment after IV treatment; management | — |\n| Reassess hourly → red box 4 | Not modelled: a re-evaluation after ORS, which the language cannot tell apart from the first assessment (see remaining questions) | — |\n| Transport / discharge / ciprofloxacin / notify | Management | — |\n\n## Notes\n\n- \"Pulse ≥ 100\" is `(>= (measurement \"Pulse, function\" bpm) 100)`.\n- \"Confused\" is either `Acute confusion` (checked for) or `Clouded consciousness` (the AVPU \"Confused\" vital).\n- \"Unable to drink (or drinking poorly)\" is one group: `Unable to drink` or `Difficulty drinking`, counted once inside the `any2`.\n", "questions": "# Page 59 – Cholera: remaining questions\n\n## Decisions made\n\n- **Entry point.** `Check for cholera (cholera page)` fires on `Diarrhea` (a recorded common\n  symptom) and asks about watery diarrhoea and exposure to cholera. \"With or without vomiting\" adds\n  no condition.\n- **Cholera likely → probable Cholera**: watery diarrhoea (`Diarrhea` + `Watery` qualifier) **and**\n  exposure to *Vibrio cholerae* with onset within the past 5 days, written\n  `(<= (onset …) (time_ago 5 days))`, as the brief requires for time comparisons.\n- **The dehydration flowchart is anchored on `(active_condition Cholera)`**, because the page applies\n  it to this patient (\"Decide on further management according to level of dehydration\"). A\n  second task, `Check for level of dehydration in cholera`, asks for every Q1/Q2 sign.\n- **Q1 = Yes → `Urgent: cholera with severe dehydration`** (red box 2, \"refer urgently\"). I wrote no\n  probable *Severe dehydration* diagnosis, because the page says \"manage as\", not \"likely\".\n- **Q1 = No → Q2 = Yes → probable `Moderate dehydration`** (\"Some dehydration likely\", red box 1),\n  then `Urgent: cholera with some dehydration`. `Moderate dehydration` is the concept VHA uses for\n  the \"Some Dehydration\" warning sign.\n- **How \"Q1 = No\" is written.** It uses recorded \"No\" answers: `(no X)` for each of drowsy,\n  decreased consciousness, confused, difficulty breathing and weak pulse, plus `any2` of \"No\" over\n  the three \"≥ 2 of\" groups, which means at most one of them is present. I tried `(not …)` first,\n  but VHA's evidence walker throws `Not supported not`, so the gate could not run. As a result, the\n  rule fires only when the health worker has explicitly answered No.\n- **\"Confused\"** is `Acute confusion` (checked for) **or** `Clouded consciousness` (the AVPU\n  \"Confused\" vital) in the positive branch. The `(no …)` branch uses only `Acute confusion`,\n  because the AVPU vital does not record a \"No\".\n- **\"Unable to drink (or drinking poorly)\"** is one group, `Unable to drink` or `Difficulty drinking`,\n  and counts once inside the `any2`.\n- **Priority:** Urgent for both red boxes. Weak pulse, confusion and decreased consciousness are also\n  warning signs with their own (higher) priority.\n\n## Could not model\n\n- **Red box 4 and the hourly reassessment.** After ORS, the patient is reassessed hourly: signs of\n  dehydration (including \"not passing urine\" and \"unable to walk unaided\") or ongoing diarrhoea or\n  vomiting lead to \"manage as severe dehydration and refer urgently\". The language cannot tell this\n  reassessment apart from the first assessment. Encoding it would make cholera with ongoing\n  diarrhoea Urgent at presentation, which contradicts the Q1/Q2 logic. Not encoded, so the rules\n  fire **less often** than the page intends for patients who do not improve.\n- **Red box 3** (reassess every 15–30 minutes; \"awake, able to drink and pulse < 100\" → also ORS)\n  is a response to treatment plus management. Not encoded.\n- **\"Dehydration unlikely\"** has no form in the language.\n- **Fingerprick glucose < 3 (< 4 if diabetes) ↻ 19** is left to page 19.\n- **Transport/discharge, ciprofloxacin criteria (pregnant, ≥ 60 years, long-term condition), stool\n  specimen, isolation and notification** are management.\n\n## SNOMED gaps\n\n- **\"Watery diarrhoea\":** no precoordinated concept. Used `Diarrhea` + qualifier `Watery`.\n- **\"In cholera outbreak area\":** no concept for being in an outbreak area. Used\n  `Exposure to (contextual qualifier)` + `Vibrio cholerae` (organism). `Exposure to Vibrio cholerae`\n  is an *event* concept, and `History of travel with high risk of exposure to communicable disease`\n  (situation) was the alternative.\n- **\"Drinking poorly\":** no exact concept. Used `Difficulty drinking` (sibling of `Unable to drink`\n  under *Finding related to ability to drink*). `Reduced fluid intake` was the alternative.\n- **\"Thirsty\":** `Thirst finding` is a grouper that includes normal thirst. Used\n  `Increased thirst`. VHA's vocabulary has `Thirst due to water deprivation`, but it names a cause\n  (water deprivation) the page does not state; diarrhoeal loss is a different mechanism.\n- **\"Some dehydration\":** no such concept. Used `Moderate dehydration` (VHA's \"Some Dehydration\"\n  warning sign); `Dehydration` (disorder) was the alternative.\n- **\"Dry mouth\":** the concept is named `Xerostomia`.\n- **\"Weak pulse\":** used `Weak arterial pulse`. `Thready pulse` is not a descendant of it.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should \"Q1 = No\" need explicit \"No\" answers, as encoded? Or should some dehydration be diagnosed\n  whenever Q2 is met, accepting that it also fires alongside severe dehydration?\n- Is exposure to *Vibrio cholerae* an acceptable way to record \"has been in a cholera outbreak area\n  in the past 5 days\"? Will the onset of that exposure be captured?\n- Should severe dehydration in cholera be Urgent, as written, or Very urgent / Emergency, given IV\n  lines and urgent referral?\n- Is \"some dehydration\" better recorded as `Moderate dehydration` (as encoded, matching VHA's\n  \"Some Dehydration\" warning sign), `Mild dehydration`, or the general `Dehydration`?\n- Does \"drinking poorly\" mean difficulty drinking (`Difficulty drinking`, as encoded) or drinking\n  less than usual (`Reduced fluid intake`)?\n- Should severe dehydration be a probable `Severe dehydration` diagnosis as well as Urgent? It is\n  encoded as Urgent only, because the page says \"manage as\", not \"likely\".\n- The onset of an exposure record may be its recording time, so the 5-day window may add little in\n  practice. Is that acceptable?\n- How should the hourly reassessment (red box 4) be represented once the app can record\n  reassessment after treatment?\n", "claims": [{"claim_id": "c001", "rule": "Check for cholera (cholera page)", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Diarrhea\" \"finding\"))", "element_keys": ["p59-5536a234"], "quote": "diarrhoea"}, {"claim_id": "c002", "rule": "Check for cholera (cholera page)", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Diarrhea\" \"finding\") (qualifier (snomed_concept \"Watery\" \"qualifier value\")))", "element_keys": ["p59-5536a234"], "quote": "watery d ns, fewer than two of the severe pair-signs (any2 over the negations = at most one present), and at least two of restless / thirsty / dry mouth / pulse >= 100. Concept choices Restlessness, Increased thirst, Xerostomia (synonym 'dry mouth') are apt. Two reservations are recorded under rule_level_problems: the pulse measurement concept 'Pulse, function' and the (active_condition Cholera) evidence not being checked for in this file.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "error", "parts_missing": [], "problem": "Probable some-dehydration rule has wrong 'severe criteria absent' logic: it wraps three NEGATED items in any2, i.e. fires when at least 2 of (no unable/poor drinking, no poor turgor, no sunken eyes) hold, which is true with up to 1 sign present but the page requires fewer than 2 signs, and the any2 over negations is semantically fragile; should be (no (any2 present-items)). Also 'Moderate dehydration' is only an approximation of 'some dehydration'. The restless/thirsty/dry mouth/pulse>=100 part (any2 of 4) is correct.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "'Moderate dehydration' is a reasonable SNOMED match for WHO 'some dehydration'. However, the Urgent rule is anchored only on (active_condition Moderate dehydration) and has no cholera context, so it fires on moderate dehydration diagnosed by any page (see rule-level problems).", "confidence": "high"}]}, {"page": 59, "slug": "59-cholera", "kind": "element", "priority": "medium", "ref": "p59-b01cae1d", "text": "Manage as severe dehydration and refer urgently:", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "partial", "parts_missing": ["a probable diagnosis of Severe dehydration (disorder, exists in SNOMED) is not produced, so the condition is never recorded and later boxes (3 and 4) cannot reference it"], "problem": "The 'refer urgently' half is encoded as an ne (Anuria exists in SNOMED)", "unable to walk unaided (Unable to walk exists)", "ongoing diarrhoea or vomiting", "weak pulse (already covered alone by the severe rule)"], "problem": "No rule escalates on the reassessment criteria. The page escalates on any ONE sign here, whereas the severe rule needs >= 2 of the drink/turgor/eyes group. Not passing urine, unable to walk unaided, isolated pulse >= 100 and ongoing losses are absent from both the check list and the rules.", "confidence": "high"}]}, {"page": 59, "slug": "59-cholera", "kind": "element", "priority": "medium", "ref": "p59-5536a234", "text": "• If patient has watery diarrhoea (with or without vomiting) and has been in cholera outbreak area in past 5 days, cholera likely. Discuss all suspected cases of cholera with doctor. • If possible, isolate patient. Health worker to wear gloves and apron while attending to patient. Disinfect surfaces", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Part 1 (watery diarrhoea, with or without vomiting, AND in cholera outbreak area in past 5 days -> cholera likely): encoded as probable Cholera on Diarrhea+Watery qualifier AND exposure to Vibrio cholerae with (<= (onset exposure) (time_ago 5 days)), which per the house time semantics means 'exposure at most 5 days ago' = within the past 5 days; direction is correct, and vomiting is rightly not required. 'Exposure to Vibrio cholerae' is a proxy for 'been in a cholera outbreak area' (a geographic/epidemiological question, not known organism contact); no closer usable form exists (SNOMED has 'Disease outbreak' event and 'Exposure to Vibrio cholerae' event, neither fits the exposure-finding form), so acceptable. Part 2 (isolate, PPE, disinfect): management_step. Part 3 (fingerprick glucose < 3, < 4 if diabetes -> page 19): cross_reference_only; page 19 owns hypoglycaemia logic; not encoded here. Part 4 (record episodes, calculate losses): management_step. Part 5 ('discuss all suspected cases with doctor'): management_step; the page gives no priority level for cholera itself and none is encoded, which is consistent.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'in cholera outbreak area' is modelled as exposure to Vibrio cholerae, which is not the same as being in an outbreak area; 'with or without vomiting' fine"], "problem": "Cholera probable rule present with watery diarrhoea AND exposure within 5 days; exposure concept is an approximation. Onset comparison uses <= time_ago 5 days (briefing says < means within); low confidence on direction. Isolation/glucose/discuss/record items are management or cross-reference.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'been in cholera outbreak area' is replaced by exposure to the organism Vibrio cholerae, a different and stronger claim than being in an outbreak area (SNOMED also has 'Exposure to Vibrio cholerae' (event) and 'Disease outbreak' (event); neither captures geography exactly)", "the 'past 5 days' window is probably inert: onset of an exposure finding is captured when it is recorded, so (<= (onset ...) (time_ago 5 days)) does not test when the patient was in the area", "glucose < 3 / < 4 diabetic is not encoded (it routes to page 19, so this is acceptable)"], "problem": "The probable cholera rule's logic (and of watery diarrhoea and exposure) is correct. The approximations in the exposure concept and the time window are the weak points. 'Diarrhea' qualified by 'Watery' is acceptable, and it is checked for in its exact qualified form.", "confidence": "medium"}]}, {"page": 59, "slug": "59-cholera", "kind": "element", "priority": "high", "ref": "p59-dfc9ebf2", "text": "No: Does patient have ≥ 2 of: restless, thirsty, dry mouth, pulse ≥ 100? Yes", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], es a some-dehydration patient on one of them (the severe rule needs two of the pair-group or a severe single sign). The 'hourly' timing is not representable, but the criteria themselves are, as (and (active_condition Moderate dehydration) (or ...)) -> probable Severe dehydration / Urgent. Priority outcome is unchanged because some dehydration is already Urgent, so severity is medium rather than high.", "confidence": "medium"}, {"checker": "forward-2", "scope": "borderline", "verdict": "missing", "parts_missing": [], "problem": "Not encoded; findings not checked, so no escalation to severe.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "missing", "parts_missing": ["unable to drink/drinking poorly (single)", "poor skin turgor (single)", "sunken eyes (single)", "pulse >= 100 (single)", "not passing urine", "unable to walk unaided", "ongoing diarrhoea or vomiting"], "problem": "Only weak pulse escalates on its own, and that comes from the initial severe rule. The rest of this branch is lost. See p59-cefc78f3.", "confidence": "high"}]}, {"page": 59, "slug": "59-cholera", "kind": "element", "priority": "high", "ref": "p59-f1bbec25", "text": "No Dehydration unlikely Give oral rehydration solution", "detail": [{"checker": "forward-1", "scope": "out_of_scope", "verdict": null, "parts_missing": null, "problem": "'No: Dehydration unlikely, give ORS' is the negative branch (fewer than two of the some-dehydration signs) followed by management. The house standard does not encode negative conclusions, and the ORS is management.", "confidence": "high"}, {"checker": "forward-2", "scope": "borderline", "verdict": "missing", "parts_missing": [], "problem": "No encoding of dehydration unlikely branch.", "confidence": "low"}, {"checker": "forward-3", "scope": "borderline", "verdict": "missing", "parts_missing": ["Dehydration unlikely"], "problem": "Not encoded. Low importance.", "confidence": "low"}]}, {"page": 59, "slug": "59-cholera", "kind": "cla <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },

const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>

  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
