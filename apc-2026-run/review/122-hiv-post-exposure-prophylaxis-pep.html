2 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 1, "parent": null, "text": "GiveTDF 300mg + 3TC 300mg + DTG 50mg once daily for 28 days as a fixed combination tablet (TLD). If kidney disease, give instead AZT 300mg + 3TC 150mg 12 hourly plus DTG 50mg once daily2.", "bbox": [258.3, 299.3, 671.7, 320.1], "key": "p122-4124454c"}, {"id": "p122-rb1-e22", "page": 122, "box": 1, "kind_hint": "management", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 1, "parent": null, "text": "Check for medication interactions and adjust doses if needed 133, especially TB, antiseizure medication, contraceptives and other common medications like: calcium, iron, zinc, antacids, metformin.", "bbox": [258.3, 319.3, 671.3, 340.1], "key": "p122-e8dacaa9"}, {"id": "p122-rb1-e23", "page": 122, "box": 1, "kind_hint": "management", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 1, "parent": null, "text": "If source is failing 2nd line ART, discuss PEP with HIV hotline 200.", "bbox": [258.3, 339.3, 521.2, 350.1], "key": "p122-9de20e54"}, {"id": "p122-rb1-e24", "page": 122, "box": 1, "kind_hint": "management", "section": "Give urgent attention to the patient exposed to infectious fluid. Does patient have either of:", "section_y": 124.2, "indent": 1, "parent": null, "text": "If unsure, discuss with HIV hotline 200 or specialist.", "bbox": [693.8, 339.1, 785.1, 369.9], "key": "p122-d87a3a75"}, {"id": "p122-rb1-e25", "page": 122, "box": 1, "kind_hint": "other", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 0, "parent": null, "text": "STEP 3. Take blood from exposed patient: Do HIV ELISA, unless known HIV positive. If giving TDF, do creatinine (eGFR). If giving AZT, do FBC.", "bbox": [95.2, 359.0, 638.1, 370.1], "key": "p122-379f19bb"}, {"id": "p122-rb1-e26", "page": 122, "box": 1, "kind_hint": "other", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 0, "parent": null, "text": "Send blood for HBsAb titre (unless documented HBsAb titre ≥ 10).", "bbox": [295.5, 379.3, 548.3, 390.1], "key": "p122-e6f979b4"}, {"id": "p122-rb1-e27", "page": 122, "box": 1, "kind_hint": "other", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 0, "parent": null, "text": "If source hepatitis C positive/unknown, do hepatitis C antibody. If source RPR positive/unknown, test for syphilis 66.", "bbox": [196.0, 389.3, 647.8, 400.1], "key": "p122-4e294967"}, {"id": "p122-rb1-e28", "page": 122, "box": 1, "kind_hint": "header", "section": "STEP 4. Take blood from source if possible and if source consents:", "section_y": 409.0, "indent": 0, "parent": null, "text": "STEP 4. Take blood from source if possible and if source consents:", "bbox": [291.4, 409.0, 550.5, 420.1], "key": "p122-6c867d6b"}, {"id": "p122-rb1-e29", "page": 122, "box": 1, "kind_hint": "management", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 1, "parent": null, "text": "Do rapid HIV test and send blood for HIV ELISA, HBsAg and hepatitis C antibody. If human bite, only do HBsAg. Also test for syphilis 66.", "bbox": [55.3, 419.3, 569.2, 430.1], "key": "p122-5732d81b"}, {"id": "p122-rb1-e30", "page": 122, "box": 1, "kind_hint": "management", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 1, "parent": null, "text": "If source HIV rapid negative, no need to continue PEP unless signs of acute HIV infection (history of flu-like symptoms - fever, sore throat, headache). If unsure, discuss PEP with HIV hotline 200.", "bbox": [55.3, 429.3, 786.6, 440.1], "key": "p122-cdff65fd"}, {"id": "p122-rb1-e31", "page": 122, "box": 1, "kind_hint": "header", "section": "STEP 5. Give hepatitis B PEP if needed:", "section_y": 449.0, "indent": 0, "parent": null, "text": "STEP 5. Give hepatitis B PEP if needed:", "bbox": [344.8, 449.0, 497.1, 460.2], "key": "p122-b1ddc7c9"}, {"id": "p122-rb1-e32", "page": 122, "box": 1, "kind_hint": "other", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 0, "parent": null, "text": "If exposed patient unvaccinated, vaccinations incomplete or HBsAb titre < 10, give 1st dose of hepatitis B vaccine 1mL IM within 7 days if sharps injury or within 14 days if sexual exposure.", "bbox": [61.8, 459.3, 782.0, 470.2], "key": "p122-4d182c9e"}, {"id": "p122-rb1-e33", "page": 122, "box": 1, "kind_hint": "other", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 0, "parent": null, "text": "Also give hepatitis B immunoglobulin (HBIG)3 500IU IM as soon as possible, within 7 days of exposure.", "bbox": [224.6, 469.3, 617.3, 480.2], "key": "p122-7b0245c2"}, {"id": "p122-rb1-e34", "page": 122, "box": 1, "kind_hint": "header", "section": "STEP 6. Continue to assess and manage the patient:", "section_y": 489.0, "indent": 0, "parent": null, "text": "STEP 6. Continue to assess and manage the patient:", "bbox": [318.6, 489.0, 523.3, 500.2], "key": "p122-8c9424fe"}, {"id": "p122-rb1-e35", "page": 122, "box": 1, "kind_hint": "other", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 0, "parent": null, "text": "If sexual assault 32. If emergency contraception needed 170. Record correct contact details in case of abnormal results. Review patient and blood results within 3 days 123.", "bbox": [81.9, 499.4, 761.9, 510.2], "key": "p122-71be4d95"}, {"id": "p122-rb1-e36", "page": 122, "box": 1, "kind_hint": "other", "section": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "section_y": 228.7, "indent": 0, "parent": null, "text": "AZT – zidovudine; DTG – dolutegravir; FTC – emtricitabine; TDF – tenofovir; 3TC – lamivudine; HBsAg – Hepatitis B surface antigen; HBsAbs – Hepatitis B surface antibody", "bbox": [149.3, 515.6, 692.6, 524.8], "key": "p122-d9586564"}, {"id": "p122-out-e01", "page": 122, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "HIV: POST-EXPOSURE PROPHYLAXIS (PEP)", "bbox": [249.6, 48.5, 592.3, 70.8], "key": "p122-dfd4f2b0"}, {"id": "p122-out-e02", "page": 122, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Body fluids transmit infection through sexual exposure (rape/sexual assault or consensual sex, burst condom), occupational or non-occupational exposure (sharps injury, splash to eye, mouth, nose or", "bbox": [57.5, 89.7, 786.3, 99.9], "key": "p122-975cbcf7"}, {"id": "p122-out-e03", "page": 122, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "broken skin), sharing needles, contact with used condom and exposure to blood. Tears, saliva (non-bloodstained), sweat, urine and stool are considered non-infectious fluids.", "bbox": [104.6, 99.7, 737.3, 109.9], "key": "p122-f2abb36e"}, {"id": "p122-out-e04", "page": 122, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Advise patient on possible side effects of HIV PEP and to return promptly if they occur. Advise condom use. 2If dolutegravir not tolerated or contraindicated, give instead atazanavir 300mg + ritonavir 100mg once daily or lopinavir 400mg + ritonavir 100mg 12 hourly. 3If giving both hepatitis B vaccine and immunoglobulin, give at different sites.", "bbox": [35.1, 534.5, 789.7, 551.5], "key": "p122-b9cc6423"}], "boxes": [{"box": 1, "rect": [35.5, 119.2, 806.4, 530.4]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAANZCAIAAAA6U359AAAACXBIWXMAABcSAAAXEgFnn9JSAAQA2UlEQVR4nOy9h5tN1/c//v1Dfs/zjovRRRklRu8laggRmehEF0SiBRFESIJoSZRECUKiM9roUQZj9DEMY0bvQZjg/l7uYn+2U/Y5d8yYGV6v5/Xc59599jln7bXXLmvdffb5f9f/v3wkSZIkSZIkSZIkSZIkmbv4/7JdApIkSZIkSZIkSZIkSZIMl4xqkSRJkiRJkiRJkiRJkrmPL0S17o8fen/ySJIkSZIkSZIkSZIkSZLMgbz7WXfnqNbj63uD/x0lSZIkSZIkSZIkSZIkyRzI9F1/MKpFkiRJkiRJkiRJkiRJ5jIyqkWSJEmSJEmSJEmSJEnmPjKqRZIkSZIkSZIkSZIkSeY+MqpFkiRJkiRJkiRJkiRJ5j4yqkWSJEmSJEmSJEmSJEnmPjKqRZIkSZIkSZIkSZIkSeY+MqpFkiRJkiRJkiRJkiRJ5j4yqkWSJEmSJEmSJEmSJEnmPjKqRZIkSZIkSZIkSZIkSeY+MqpFkiRJkiRJkiRJkiRJ5j4yqkWSJOmLD+/F37+zP9vFIA28c2Pf44eHs10Mnzx6aEXMml/A65d3Zbswjrx9fU+2y5CLuGv7AqnQrDDCDNg28q9f+8vUycPmzv4Gp2e7PJnCJ+lH/t7x+7w54yb/MGTBb9/G7f4DKf5PN5t0ltZgLuKrHOx2bJknOs/2Uhvo2RPmhFJkaXsnSZLM4WRUiyRJ8hmPH141c8aoQQO7tvmgcef2LQd/3nXFn1P++zcBh86d3ljq7aJFCxXYs3NhtstJOnLV8mkF8uWNKlf6zo3cMX4N7N8p8L//gfDSs10YO0cM6wnZOrV/P9slyS2sX6eqVOiDuwcz98oZsO27t+Ia1a8h8oDnkzdnrzyZwqQT6xrWq64KJWzSsJbP0z1N2mcNPkk/8s3o/n17tcWloj9s0v7j5p/2ajdt8peZq+Ts4ise7KpWKic6z/aCO/Lxw8MwuXx58vw0bWROLkWWtneSJMmcT0a1SJIkj148v7Vf73YWZwksXqTQowdPo1oxq3+WlOk/Ds92abOau7YtmPTd4KGDumXg3Mtp2//4/YeB/Tvt3rHQnJjpQg4f2lPq6OC+pZmuk5cvgl3gnBPVcixdvdpVIFuxwgXT7x96+VucPLp61k9fd+/6YW6JOWaAhpjIS9pPBmx75Je95JQiBSOaNKx169rujBXq/p3961b9NGp4n19njX0ZeV6e927vr1G1gty3U/v3O7dvKd8rvlPG5xU8TdpnVOu/fxPsgwWYP5AH40iGVZ0ttPdLmTvYOdqPzmyPB5l5/fKufHnyQLy2bZpJimNbzvZSZFZ7J0mSzKVkVIskyTedcLMrVSgjM8KC+fO1bN6gf5/2XTt9ULdWZfWv/sN78ZO/HzL26343r77+k8WC+fNCFXVqVMrAudMmfymaXLNihjkx04VMS9kyfEiP2T+PzgqdvHwR7ALnnKiWY+n2713yxYDOsRvmZMotPm7TVG6RYx+3fHkaYiIvaT8ZsO2K7zzt0+CQX0rd9jKFOrB3qUg+bFD3l5Hn5amiLYMGdpUUaVP+o1qeJh1uVKt4kULfj/9i3OgBXTq2isgbkMSPWjeR/0JyBe39UuYOdo72ozPb40GeXLbkx8Gfdz15bI38dGzL2V6KzGrvJEmSuZSMapEk+aa ason_category": "management_step", "reason": "First aid steps header."}, {"element_key": "p122-2c009c2b", "element_id": "p122-rb1-e07", "text": "No", "reason_category": "flowchart_routing", "reason": "No branch leads to reassurance/hepatitis B only advice (management)."}, {"element_key": "p122-442d3cb9", "element_id": "p122-rb1-e08", "text": "If broken skin, clean area immediately with soap and water.", "reason_category": "management_step", "reason": "Wound cleaning."}, {"element_key": "p122-7adc89b5", "element_id": "p122-rb1-e09", "text": "If splash to eye, mouth or nose, immediately rinse mouth/nose or irrigate eye thoroughly with sterile water.", "reason_category": "management_step", "reason": "Rinse/irrigate."}, {"element_key": "p122-f2b3f849", "element_id": "p122-rb1-e10", "text": "If human bite severe enough to cause bleeding, prevent hepatitis B only. Risk of HIV transmission is negligible and there is no need for HIV PEP.", "reason_category": "management_step", "reason": "Hepatitis B prevention only for bite; no PEP."}, {"element_key": "p122-50cf76d4", "element_id": "p122-rb1-e11", "text": "STEP 2. Assess need for HIV PEP and give immediately if ≤ 72 hours since exposure. Check HIV status:", "reason_category": "management_step", "reason": "Decision to give PEP within 72 hours is treatment, out of scope (no manage tasks)."}, {"element_key": "p122-1552264b", "element_id": "p122-rb1-e12", "text": "Patient known HIV positive", "reason_category": "flowchart_routing", "reason": "HIV status branch decides PEP vs routine HIV care (management only)."}, {"element_key": "p122-dcb6ef42", "element_id": "p122-rb1-e13", "text": "Patient HIV negative or unknown: obtain consent and do HIV rapid test 124.", "reason_category": "flowchart_routing", "reason": "HIV status branch / HIV rapid test decides PEP (management only)."}, {"element_key": "p122-9d8e81dc", "element_id": "p122-rb1-e14", "text": "Positive", "reason_category": "flowchart_routing", "reason": "HIV test result branch to management."}, {"element_key": "p122-b30bfa32", "element_id": "p122-rb1-e15", "text": "Negative", "reason_category": "flowchart_routing", "reason": "HIV test result branch to management."}, {"element_key": "p122-44a15641", "element_id": "p122-rb1-e16", "text": "Results inconclusive", "reason_category": "flowchart_routing", "reason": "HIV test result branch to management."}, {"element_key": "p122-df97ddef", "element_id": "p122-rb1-e17", "text": "Patient refuses HIV rapid test", "reason_category": "flowchart_routing", "reason": "HIV test refusal branch to management."}, {"element_key": "p122-6786a848", "element_id": "p122-rb1-e18", "text": "For all other exposures, reassure that HIV and hepatitis transmission is unlikely, avoid giving PEP.", "reason_category": "management_step", "reason": "Reassure, avoid PEP."}, {"element_key": "p122-2159e4f1", "element_id": "p122-rb1-e19", "text": "Avoid giving HIV PEP, give instead routine HIV care 126.", "reason_category": "management_step", "reason": "Routine HIV care instead of PEP."}, {"element_key": "p122-aee433ff", "element_id": "p122-rb1-e20", "text": "Give HIV PEP1 only if ≤ 72 hours since exposure (ideally within 1 hour) for 28 days:", "reason_category": "management_step", "reason": "PEP timing and duration."}, {"element_key": "p122-4124454c", "element_id": "p122-rb1-e21", "text": "GiveTDF 300mg + 3TC 300mg + DTG 50mg once daily for 28 days as a fixed combination tablet (TLD). If kidney disease, give instead AZT 300mg + 3TC 150mg 12 hourly", "reason_category": "management_step", "reason": "Medicines and doses."}, {"element_key": "p122-e8dacaa9", "element_id": "p122-rb1-e22", "text": "Check for medication interactions and adjust doses if needed 133, especially TB, antiseizure medication, contraceptives and other common medications like: calci", "reason_category": "management_step", "reason": "Medication interactions."}, {"element_key": "p122-9de20e54", "element_id": "p122-rb1-e23", "text": "If source is failing 2nd line ART, discuss PEP with HIV hotline 200.", "reason_category": "management_step", "reason": "Discuss with hotline."}, {"element_key": "p122-d87a3a75", "element_id": "p122-rb1-e24", "text": "If unsure, discuss with HIV hotline 200 or specialist.", "reason_category": "management_step", "reason": "Discuss with hotline."}, {"element_key": "p122-379f19bb", "element_id": "p122-rb1-e25", "text": "STEP 3. Take blood from exposed patient: Do HIV ELISA, unless known HIV positive. If giving TDF, do creatinine (eGFR). If giving AZT, do FBC.", "reason_category": "management_step", "reason": "Investigations on exposed patient; lab tests not representable as measure tasks."}, {"element_key": "p122-e6f979b4", "element_id": "p122-rb1-e26", "text": "Send blood for HBsAb titre (unless documented HBsAb titre ≥ 10).", "reason_category": "management_step", "reason": "HBsAb titre investigation."}, {"element_key": "p122-4e294967", "element_id": "p122-rb1-e27", "text": "If source hepatitis C positive/unknown, do hepatitis C antibody. If source RPR positive/unknown, test for syphilis 66.", "reason_category": "management_step", "reason": "Source-dependent investigations."}, {"element_key": "p122-6c867d6b", "element_id": "p122-rb1-e28", "text": "STEP 4. Take blood from source if possible and if source consents:", "reason_category": "management_step", "reason": "Testing the source person."}, {"element_key": "p122-5732d81b", "element_id": "p122-rb1-e29", "text": "Do rapid HIV test and send blood for HIV ELISA, HBsAg and hepatitis C antibody. If human bite, only do HBsAg. Also test for syphilis 66.", "reason_category": "management_step", "reason": "Tests on source."}, {"element_key": "p122-cdff65fd", "element_id": "p122-rb1-e30", "text": "If source HIV rapid negative, no need to continue PEP unless signs of acute HIV infection (history of flu-like symptoms - fever, sore throat, headache). If unsu", "reason_category": "management_step", "reason": "Decision to continue/stop PEP based on source result."}, {"element_key": "p122-b1ddc7c9", "element_id": "p122-rb1-e31", "text": "STEP 5. Give hepatitis B PEP if needed:", "reason_category": "management_step", "reason": "Hepatitis B PEP header."}, {"element_key": "p122-4d182c9e", "element_id": "p122-rb1-e32", "text": "If exposed patient unvaccinated, vaccinations incomplete or HBsAb titre < 10, give 1st dose of hepatitis B vaccine 1mL IM within 7 days if sharps injury or with", "reason_category": "management_step", "reason": "Hepatitis B vaccine."}, {"element_key": "p122-7b0245c2", "element_id": "p122-rb1-e33", "text": "Also give hepatitis B immunoglobulin (HBIG)3 500IU IM as soon as possible, within 7 days of exposure.", "reason_category": "management_step", "reason": "HBIG."}, {"element_key": "p122-8c9424fe", "element_id": "p122-rb1-e34", "text": "STEP 6. Continue to assess and manage the patient:", "reason_category": "management_step", "reason": "Follow-up header."}, {"element_key": "p122-71be4d95", "element_id": "p122-rb1-e35", "text": "If sexual assault 32. If emergency contraception needed 170. Record correct contact details in case of abnormal results. Review patient and blood results within", "reason_category": "management_step", "reason": "Follow-up and cross references to pages 32, 170, 123."}, {"element_key": "p122-d9586564", "element_id": "p122-rb1-e36", "text": "AZT – zidovudine; DTG – dolutegravir; FTC – emtricitabine; TDF – tenofovir; 3TC – lamivudine; HBsAg – Hepatitis B surface antigen; HBsAbs – Hepatitis B surface ", "reason_category": "figure_or_note", "reason": "Abbreviation legend."}], "known_issues": [], "judgment_calls": [{"topic": "Urgency", "decision": "Urgent when any listed infectious-fluid exposure or a human bite with bleeding is recorded; the route question (sexual/sharps/splash) is not required.", "alternatives": "Require the route question as well (and), which would make urgency depend on a management routing question; the header gives urgent attention to every patient exposed to inf \"qualifier value\") (snomed_concept \"Breast milk\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Cerebrospinal fluid\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Pericardial fluid\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Peritoneal fluid\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Pleural fluid\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Seminal fluid\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Synovial fluid\" \"substance\"))", "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Vaginal secretion\" \"substance\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis_condition": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 122 – HIV: post-exposure prophylaxis (PEP): flowchart\n\nSource: APC 2026 e-book page 122 (red box). Only the triage entry is modelled; every step after it is management.\n\n```mermaid\nflowchart TD\n    H[\"Give urgent attention to the patient exposed to infectious fluid.<br/>Does patient have either of:<br/>• Exposure to blood, blood-stained fluid/tissue, pleural/pericardial/peritoneal/amniotic/synovial/CSF, vaginal secretions, semen or breast milk<br/>• Human bite severe enough to cause bleeding\"]\n    H -- Yes --> R[\"Was there sexual contact, sharps injury, splash to eye/open wound/mouth/nose?\"]\n    H -- No --> OTHER[\"If human bite severe enough to cause bleeding, prevent hepatitis B only (no HIV PEP).<br/>For all other exposures, reassure; avoid PEP. If unsure, discuss with HIV hotline or specialist.\"]\n    R -- No --> OTHER\n    R -- Yes --> S1[\"STEP 1. Immediate first aid\"]\n    S1 --> S2[\"STEP 2. Assess need for HIV PEP (≤ 72 hours). Check HIV status\"]\n    S2 -- \"Known HIV positive / rapid test positive\" --> ROUT[\"Avoid PEP, routine HIV care 126\"]\n    S2 -- \"Negative / inconclusive / refuses test\" --> PEP[\"Give HIV PEP if ≤ 72 hours, 28 days\"]\n    ROUT --> S3[\"STEP 3. Bloods from exposed patient\"]\n    PEP --> S3\n    S3 --> S4[\"STEP 4. Bloods from source\"] --> S5[\"STEP 5. Hepatitis B PEP if needed\"] --> S6[\"STEP 6. Continue to assess and manage\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint \"exposed to infectious fluid\" | Exposure to Body fluid, or Human bite - wound | `Check for HIV PEP: exposure to infectious fluid or human bite` (trigger) |\n| H = Yes (either of) | `or` of exposure to each listed fluid, or (human bite **and** bleeding) | `Urgent: HIV PEP, exposure to infectious fluid or bleeding human bite` |\n| H = No | Not modelled (reassurance, management) | — |\n| R (sexual/sharps/splash) | Not modelled: routes only between management branches | — |\n| STEP 1–6, HIV status branches | Not modelled: management (no `manage` tasks this pass) | — |\n", "questions": "# Page 122 – HIV: post-exposure prophylaxis (PEP): remaining questions\n\n## Decisions made\n\n- **One check task and one Urgent priority rule.** The page has no \"X likely\" or \"consider X\"\n  wording, so there are no diagnosis rules. Everything after the \"either of\" question (first aid,\n  HIV status, PEP, bloods, hepatitis B PEP, follow-up) is management and is accounted for as\n  `management_step` or `flowchart_routing`.\n- **Urgency comes from the header alone.** \"Give urgent attention to the patient exposed to\n  infectious fluid\" with \"either of\" the two bullets → Urgent when any listed fluid exposure, or a\n  human bite with bleeding, is recorded. The follow-on question (sexual contact, sharps injury,\n  splash) is not required for urgency; it only chooses between management branches, so it is not\n  checked for (it would otherwise be a checked-for finding that no rule uses).\n- **Trigger.** Exposure to `Body fluid` (substance) is the presenting complaint; `Human bite - wound`\n  is a second trigger so the bite bullet can open the check. Exposure findings use the gold page 20\n  pattern `(finding (snomed_concept \"Exposure to (contextual qualifier)\" …) <substance>)`.\n- **\"Human bite severe enough to cause bleeding\"** = `(and Human bite - wound, Bleeding)`.\n- **Semen** encoded as `Seminal fluid` (substance); there is no \"Semen\" substance concept.\n\n## Could not model\n\n- **\"≤ 72 hours since exposure (ideally within 1 hour)\"**, the 7 and 14 day hepatitis B windows,\n  and \"within 3 days\" review: they time management steps, not triage, so they are out of scope.\n- **Route of exposure** (sexual contact, sharps injury, splash to eye/open wound/mouth/nose):\n  management routing only; SNOMED has `Sexual exposure` (finding) and `Sharps injury` (disorder) if\n  a later pass models PEP eligibility.\n- **HIV status branches, source testing, lab tests** (HIV ELISA, HBsAb titre ≥ 10 / < 10, eGFR,\n  FBC): lab values have no unit/observable in the language, and these steps are management.\n- **Non-infectious fluids** (tears, non-bloodstained saliva, sweat, urine, stool): the trigger uses\n  the general `Body fluid`, so exposure to those fluids still opens the check task; it does not make\n  the patient Urgent, because the priority rule lists only the infectious fluids.\n\n## SNOMED gaps\n\n- **Blood-stained fluid/tissue**: no substance concept. `Serosanguinous fluid` (substance) exists but\n  is a specific serum/blood mixture, so it was not used. This bullet item is not encoded; the rule\n  fires less often than the page intends for an exposure recorded only as blood-stained fluid or\n  tissue (exposure to `Blood` is still covered).\n- **Semen**: no \"Semen\" substance; `Seminal fluid` used.\n- No bite-specific bleeding concept; generic `Bleeding` (finding) used with the bite.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should urgency depend on the route question (sexual contact, sharps injury, splash), or, as\n  encoded, on any exposure to a listed fluid?\n- Should exposure to blood-stained fluid/tissue be recorded as exposure to `Blood`?\n- Is exposure to infectious fluid going to be a recorded complaint in the app? It is not among the\n  common symptoms or warning signs, so the check task only fires if someone records the exposure.\n- Should a bleeding human bite be Urgent even though the page says no HIV PEP is needed for it\n  (hepatitis B prevention only)? Encoded as Urgent, because it is one of the \"either of\" items\n  under \"Give urgent attention\".\n- Should the 72-hour PEP window (and the 7/14-day hepatitis B windows) affect triage priority?\n  Not encoded; the page uses them only to time management.\n\n## Reconciliation note\n\n- Builder A also required, in the Urgent rule, a separately recorded exposure to `Body fluid` or a\n  human bite wound (the trigger) as an `and` gate. The final build follows builder B: the page's\n  \"either of\" makes either bullet sufficient on its own.\n", "claims": [{"claim_id": "c001", "rule": "Check for HIV PEP: exposure to infectious fluid or human bite", "role": "trigger", "expr": "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Body fluid\" \"substance\"))", "element_keys": ["p122-d3c61078"], "quote": "exposed to infectious fluid"}, {"claim_id": "c002", "rule": "Check for HIV PEP: expo <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {

const prov = D.provenance || {};

const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>

    <span><button id="exp">export decisions</button>${helpButton("export")}</span>

  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
