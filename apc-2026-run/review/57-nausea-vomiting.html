section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with nausea/vomiting not needing urgent attention • If thirst, dry mouth or poor skin turgor, dehydration likely, give single dose metoclopramide 10mg orally/IM/IV. Then give oral rehydration solution and observe: encourage small frequent sips. Aim for 1-2L in first 2 hours. If vomits, wait 10 minutes and try again more slowly. • If unable to drink or no better after 2 hours, give sodium chloride 0.9% 500mL IV over 30 minutes and refer. • Exclude pregnancy 174. If pregnant, reassure that nausea/vomiting is common in first trimester. Encourage to eat smaller meals more frequently and drink fluids regularly. • If associated dizziness 46. • Review medication: NSAIDs (e.g. ibuprofen), metformin, contraceptives, hormone therapy, chemotherapy and morphine can cause nausea/vomiting. Discuss with doctor. If on DS-TB medication 108, RR-TB medication 117 or ART 131. • Screen for alcohol/drug use: in the past year, has patient: drunk ≥ 4 drinks5/session, used illegal drugs or misused prescription or over-the-counter medications? If yes to any 165.", "bbox": [51.0, 253.1, 778.9, 344.2], "key": "p57-7e405c9a"}, {"id": "p57-out-e04", "page": 57, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Is there recent onset vomiting with cramping abdominal pain, diarrhoea, loss of appetite, body pain or fever?", "bbox": [221.6, 357.4, 620.3, 367.6], "key": "p57-04c948c5"}, {"id": "p57-out-e05", "page": 57, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No • Assess for stress and anxiety 98. • If patient has a life limiting illness, give palliative care 191. • Discuss/refer if: - Nausea/vomiting", "bbox": [703.0, 414.0, 786.8, 494.2], "key": "p57-af66fb01"}, {"id": "p57-out-e06", "page": 57, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "per ottle (330mL) of beer. 6Maximum dose: 10mg (34-39kg), 12mg (40-46kg), 14mg (47-53kg), 16mg (≥ 54kg).", "bbox": [34.0, 535.3, 792.2, 551.8], "key": "p57-1d7a9ee9"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 239.7]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkYAAAFACAIAAABm11c5AAAACXBIWXMAABcSAAAXEgFnn9JSAAHVl0lEQVR4nOy9B1QV2ffv2TPvvXnz3qwJ7/9mvTezZtb89GJAEQQEUUQUA2ZRzIoBIwZQMWdMmLWVVhsT5pwToigqgoqiKLY5t7bYpja2+uv+3flyNx6PVXWr6iJwQfdan3VX3VOnTp06YZ+9d51z6odn/28ZhmEYhmEYhmEYhmEYhilB/OD0HDAMwzAMwzAMwzAMwzCMQ7BLi2EYhmEYhmEYhmEYhilhfHZpvVsw6c/VcxmGYRiGYRiGYRiGYRimGPJ2xhgNl9Zfd49a//kLwzAMwzAMwzAMwzAMwxRD/pm9j11aDMMwDMMwDMMwDMMwTEmCXVoMwzAMwzAMwzAMwzBMCYNdWgzDMAzDMAzDMAzDMEwJg11aDMMwDMMwDMMwDMMwTAmDXVoMwzAMwzAMwzAMwzBMCYNdWgzDMAzDMAzDMAzDMEwJg11aDMMwDMMwDMMwDMMwTAmDXVoMwzAMwzAMwzAMwzBMCYNdWgzDMAzDMAzDMAzDMEwJg11aDMMwDMMwDMMwDMMwTAmDXVoMwzCMw7x8dtrpeWD0KUF19P7N+aT9y8CZk5udnhlNXj0/8/eHbKdnQ41hLf9yYTeV7bPH6U7P7TfJh7dZ715lfn2cYsLVS/uowTzNSXN6ZnRAl9y6af5P88ft2rbQ6ZlhGIZhnAi7tBiGYRglv/+Wun71rMkxA8O7tArvHDp0cI9VK6Y///0knZ04PtLyj3/06t7W6flkNPn7Q3azRnXKlC69ZPEkp2fGDL/dP4YWBdq3aeL0zKjZu2tx+TIuNfyqvHqe4fTMyJjpiSOG9qKyPXlig9MzXHigaurXCegZ3qaI73vvVrJ35UqVKpQ/nbbxa+IUH6hRgaOHVzk9M/b45cJuX+/KlM+A6r5Ozw/DMAzjRNilxTAMw3zmz9fn4uaNhfVF1oLMxXM7KU6j4Fr4617R9eO7C07PcKHy+GHqlg0/jhja69SJ/Nii6cfXL5g7ZtzofiLk3avMA3uXTIkZtGrF9MLL5LPH6WVKl0YddQsLLYxiUT/XV2a4WLm01E8XMy7PyD9/ZtvXp1+AbUDREzVT/k5cWnt3LcYzTo4ZWMT3Tdq3lIr3559iKETdftRxijPF36X1r4+XmjYKokxW8/Xq16ej07PEMAzDOBF2aTEMwzCf6dOzvfBhNWtUZ+CALpH9Ordu2dDHy10svMrM2DpqWO+UQyudntvCZnHcBCqK/bvj83G5a1kXXNugbk0Rci5jGyU4fnT/Qs3kzq0/jRkZce3y/sIoFvVzfWWGi5VLS/10D+8fjRk7IGFpbIGkX4BtQNETNVP+Tlxa0VHheMb04+uL+L4f3mbFzRs7feqQF09OUYi6/ajjFGeKv0vr1ztHKIeNG9RG2To9PwzDMIxzYZcWwzAMk8falTPJVKjhV0Wxq9H7N+fF8Z0bB6/9sg/g+O7NZDp+88dZOvv2ZSaFwPAQl/zx9NTxI2tSU9bgQPPWCKerxI4/jx+myik/vJeC43u3knH85NGJvbsW/+vjJYr56vmZE0fXph1bh1vjmK6STZ2/P2Rfu7w/cU88fuUdkShNPILV5lVBhPTU9eJJcXbShCgqkOXxUxBTc98iXHjyxIY9OxefP7MNGRDFhfjly+Qat0E1q+H49vWk57+f3LVtISUY1b8LAh/9es Peritonitis\" \"disorder\") probable)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Acute appendicitis\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Appendicitis\" \"disorder\") probable)", "relation": "A_narrower"}, {"A": "(diagnosis (snomed_concept \"Acute pancreatitis\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Pancreatitis\" \"disorder\") probable)", "relation": "A_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": ["(measurement (snomed_concept \"Body mass index\" \"observable entity\") kg/m²)", "(measurement (snomed_concept \"Waist circumference\" \"observable entity\") cm)"], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 57 – Nausea/vomiting: flowchart\n\nSource: APC 2026 e-book page 57. The red box is a list (any one item makes the\npatient urgent); the lower half of the page is a two-question algorithm for the patient not needing\nurgent attention.\n\n```mermaid\nflowchart TD\n    START[\"Patient with nausea/vomiting\"] --> RB{\"Red box: any of the urgent items?\"}\n    RB -- Yes --> URGENT[\"Give urgent attention; manage and refer urgently\"]\n    RB -- No --> APPROACH[\"Approach to the patient not needing urgent attention:<br/>thirst/dry mouth/poor skin turgor → dehydration likely;<br/>exclude pregnancy ↻174; dizziness ↻46; review medication;<br/>screen alcohol/drug use ↻165\"]\n    APPROACH --> Q1{\"Recent onset vomiting with cramping abdominal pain,<br/>diarrhoea, loss of appetite, body pain or fever?\"}\n    Q1 -- Yes --> GE[\"Gastroenteritis likely\"]\n    Q1 -- No --> Q2{\"Epigastric pain worse with eating, hunger<br/>or lying down/bending forward?\"}\n    Q2 -- Yes --> DYS[\"Dyspepsia (heartburn) likely\"]\n    DYS --> GORD{\"BMI ≥ 25 and waist ≥ 80cm (woman) / ≥ 94cm (man)?\"}\n    GORD -- Yes --> GORDL[\"Gastro-oesophageal reflux disease likely\"]\n    Q2 -- No --> OTHER[\"Assess stress/anxiety ↻98; palliative care ↻191;<br/>discuss/refer if persists > 2 weeks or uncertain\"]\n```\n\n## Red box items → rules\n\n| Red box item | Modelled as | Rule |\n|---|---|---|\n| Headache ↗47 | Headache (common symptom) | `Urgent: nausea/vomiting with danger signs` |\n| Chest pain ↗24 | Chest pain (warning sign) | `Urgent: nausea/vomiting with danger signs` |\n| Watery diarrhoea + cholera outbreak area in past 5 days: cholera likely | N/V **and** Diarrhea + Watery qualifier **and** exposure to *Vibrio cholerae* with onset within 5 days | `Diagnose probable cholera in nausea/vomiting` → `(active_condition Cholera)` in the urgent rule |\n| Neck stiffness, drowsy/confused or purple/red rash: meningitis likely | N/V **and** any of stiff neck, drowsy, acute confusion, purpuric rash | `Diagnose probable meningitis in nausea/vomiting` → urgent rule |\n| Guarding or rigidity: peritonitis likely | N/V **and** abdominal guarding or rigidity | `Diagnose probable peritonitis in nausea/vomiting` → urgent rule |\n| Pain in right lower abdomen: appendicitis likely | N/V **and** right lower quadrant pain (Acute appendicitis) | `Diagnose probable appendicitis in nausea/vomiting` → urgent rule |\n| Sudden severe upper abdominal pain spreading to back: pancreatitis likely | N/V **and** upper abdominal pain (sudden onset, severe) **and** pain radiating to lumbar region of back | `Diagnose probable pancreatitis in nausea/vomiting` → urgent rule |\n| Shock/SBP < 80 | Shock **or** systolic BP < 80 | urgent rule |\n| Vomiting blood | Hematemesis | urgent rule |\n| Jaundice | Jaundice | urgent rule |\n| Abdominal pain/distension and no stools or flatus/wind | (abdominal pain or distension) **and** (obstipation, or constipation with \"No\" recorded for passing flatus) | urgent rule |\n| Drowsy/confused/rapid deep breathing | Drowsy, acute confusion, Kussmaul's respiration | urgent rule |\n| Sudden N/V and any of …: check for anaphylaxis ↻28 | Sudden-onset nausea or vomiting **and** any of the listed signs/exposures | `Diagnose possible anaphylaxis in nausea/vomiting` and the urgent rule |\n\n## Decision nodes (lower half) → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Thirst, dry mouth or poor skin turgor → dehydration likely | N/V **and** any of the three | `Diagnose probable dehydration in nausea/vomiting` |\n| Exclude pregnancy ↻174 | N/V | `Diagnose possible pregnancy in nausea/vomiting` |\n| Q1 = Yes | Vomiting with \"Recent\" qualifier **and** any of abdominal colic, diarrhoea, loss of appetite, generalised aches, fever | `Diagnose probable gastroenteritis in nausea/vomiting` |\n| Q1 = No → Q2 = Yes | N/V **and** epigastric pain **and** any of pain provoked by eating, hunger pain, pain aggravated by position. The \"Q1 = No\" precondition is not modelled | `Diagnose probable dyspepsia in nausea/vomiting` |\n| Dyspepsia + BMI/waist | Dyspepsia evidence **and** BMI ≥ 25 **and** waist ≥ 80 cm (sex split not representable) | `Diagnose probable GORD in nausea/vomiting with dyspepsia`, with `Measure BMI and waist circumference in dyspepsia` |\n| Q2 = No | Stress/anxiety, palliative care, referral | Not modelled (cross-references and management) |\n\n## Notes\n\n- The lower algorithm applies only to patients \"not needing urgent attention\"; the language cannot\n  express \"not urgent\", so the lower-half rules fire regardless of the red box.\n- \"Recent onset\" and \"within the past few hours\" (footnote 2) have no defined time span on the page.\n", "questions": "# Page 57 – Nausea/vomiting: remaining questions\n\n## Decisions made\n\n- **Trigger.** Both tasks fire on `Nausea` or `Finding of vomiting` (both recorded common symptoms).\n  The urgent `check_for` covers every red-box item; a second task covers the \"not needing urgent\n  attention\" approach and the Q1/Q2 algorithm.\n- **Red-box \"likely\" diagnoses** (meningitis, peritonitis, appendicitis, pancreatitis) are\n  `probable` rules that require nausea or vomiting, because the box is for \"the patient with\n  nausea/vomiting\". The urgent rule refers to them via `active_condition`. Cholera also requires nausea or\n  vomiting: the box is scoped to the patient with nausea/vomiting, and nausea alone satisfies\n  \"(with or without vomiting)\". Appendicitis and pancreatitis use `Acute appendicitis` and\n  `Acute pancreatitis`, the concepts in VHA's vocabulary.\n- **Shock/SBP < 80** is encoded on this page as `Shock` (disorder) **or** systolic BP < 80, per the\n  shared decision. Footnote 1 (the definition of shock) is not imported.\n- **Anaphylaxis item.** \"If sudden nausea/vomiting and any of … check for anaphylaxis ↻28\" is\n  encoded as `Diagnose possible anaphylaxis in nausea/vomiting` (to trigger the anaphylaxis page's\n  checks) **and** as a branch of the urgent rule, because it is listed among the urgent items.\n  \"Possible allergen\" uses footnote 2 (medication, food, insect bite/sting); \"within the past few\n  hours\" is not modelled, as on the gold page 20.\n- **Cholera outbreak area** is recorded as exposure to *Vibrio cholerae*, with \"in past 5 days\"\n  written as `(<= (onset …) (time_ago 5 days))`, following the shared decision on time comparisons.\n- **No stools or flatus/wind**: `Obstipation`, or `Constipation` together with a recorded No for\n  `Passing flatus`.\n- **Rapid deep breathing**: `Kussmaul's respiration`.\n- **Spreading to back** (pancreatitis): `Pain radiating to lumbar region of back`. Back pain alone\n  (`Backache`) is not used, because the page requires the abdominal pain to spread to the back.\n- **Dyspepsia (heartburn)**: diagnosis concept `Indigestion` (the SNOMED name for dyspepsia);\n  \"worse with eating, hunger or lying down/bending forward\" as `Pain provoked by eating`, `Hunger pain`\n  or `Pain aggravated by position`.\n- **Gastroenteritis**: diagnosis concept `Inflammation of stomach and intestine` (the SNOMED name\n  for gastroenteritis).\n- **Exclude pregnancy** → `possible` Pregnancy (Will's briefing: \"exclude X\" → possible).\n- **BMI and waist circumference** are measured once dyspepsia is likely (`measure` task), because the\n  GORD rule needs them.\n- Glucose (routine vital) and all medicines, fluids and referral steps are management and are not\n  encoded.\n\n## Could not model\n\n- **\"Not needing urgent attention\"**: the lower-half rules fire whether or not a red-box item\n  applies. The flowchart's \"Q1 = No\" precondition for dyspepsia is not modelled either, so dyspepsia\n  can be diagnosed alongside gastroenteritis (fires **more often** than the page intends).\n- **\"During peri-umbilical percussion\"**: how guarding/rigidity is elicited is not representable;\n  any recorded guarding or rigidity counts (fires **more often**).\n- **\"Recent onset\" vomiting**: no span is given, so a `Recent` qualifier is used instead of an onset\n  comparison. If the app cannot record that qualifier on vomiting, the gastroenteritis rule never\n  fires (**less often**).\n- **Sex-specific waist circumference** (≥ 80 cm woman, ≥ 94 cm man): sex is not representable. The\n  rule uses ≥ 80 cm for everyone, so it fires **more often** than the page intends for men with a\n  waist of 80–93 cm.\n- **Pregnancy** in men: the possible pregnancy rule cannot be limited to women (fires **more often**).\n- **Medication review, alcohol/drug screening, stress/anxiety, palliative care** and the\n  \"discuss/refer\" lists (including Hb < 12/< 13, which has no unit in the language) are management\n  or referral and are not modelled.\n- Footnote 2's time window (\"within the past few hours\") for allergen exposure.\n\n## SNOMED gaps\n\n- No `Watery diarrhea` concept: `Diarrhea` with the `Watery` qualifier.\n- No `Thirst` finding: `Thirst due to water deprivation` (in VHA vocabulary).\n- No `Dry mouth` finding: `Xerostomia`.\n- No concept for a cholera outbreak area: exposure to `Vibrio cholerae` (organism).\n- No `Abdominal pain radiating to back` / `Pain radiating to back`:\n  `Pain radiating to lumbar region of back` (narrower: lumbar only).\n- No `Recent onset` qualifier: `Recent`.\n- No `Gastroenteritis` or `Dyspepsia` FSN: `Inflammation of stomach and intestine` and `Indigestion`.\n- `Shock` and `Hematemesis` exist only as disorders, used as such.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the anaphylaxis item make the patient Urgent on this page (as encoded), or only prompt the\n  anaphylaxis check on page 28?\n- Is recording exposure to *Vibrio cholerae* an acceptable way to capture \"has been in a cholera\n  outbreak area\"? An alternative is `History of travel with high risk of exposure to communicable disease`.\n- For the waist threshold without sex: is ≥ 80 cm for everyone acceptable, or should the GORD rule\n  drop the waist criterion until sex can be expressed?\n- Should dyspepsia be suppressed when gastroenteritis is likely (flowchart Q1 = No)?\n- Is `Acute appendicitis` / `Acute pancreatitis` right for \"appendicitis/pancreatitis likely\", or\n  should the general concepts be used?\n- Should drowsiness or confusion alone in a patient with nausea/vomiting give probable meningitis,\n  as the box literally says, or should it also require another meningitis sign?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent nausea/vomiting conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Nausea\" \"finding\"))", "element_keys": ["p57-510665c9"], "quote": "nausea/vomiting"}, {"claim_id": "c002", "rule": "Check for urgent nausea/vomiting conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Finding of vomiting\" \"finding\"))", "element_keys": ["p57-510665c9"], "quote": "nausea/vomiting"}, {"claim_id": "c003", "rule": "Check for urgent nausea/vomiting conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Headache\" \"finding\"))" um", "ref": "Diagnose probable cholera in nausea/vomiting", "text": "The page says cholera is likely with watery diarrhoea 'with or without vomiting'; the rule additionally requires nausea or vomiting. On this page the patient has nausea/vomiting by definition, so the effect is nil here, but the rule would not help a diarrhoea-only presentation (presumably page 59 covers it).", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Measure BMI and waist circumference in dyspepsia with nausea/vomiting", "text": "BMI is a routine vital (anchors/vitals.ts body_mass_index), so measuring it is redundant; waist circumference is the only non-routine measurement. Harmless.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "high", "ref": "Diagnose probable cholera in nausea/vomiting", "text": "(<= onset (time_ago 5 days)) means exposure at least 5 days ago; page means within past 5 days, requiring (<). Cholera never fires for recent exposure, and Urgent via active Cholera is lost.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose probable GORD in nausea/vomiting with dyspepsia", "text": "Waist circumference >= 80 applied to men too; men need >= 94. Also requires full dyspepsia criteria duplicated rather than active Dyspepsia.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose probable cholera in nausea/vomiting", "text": "Requires nausea/vomiting although the page says watery diarrhoea 'with or without vomiting'.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Urgent: nausea/vomiting with danger signs", "text": "Priority depends on active_condition of diagnoses that are only probable rule outputs and on duplicated inline anaphylaxis criteria; could drift from the diagnosis rule. Obstruction branch uses Constipation-without-flatus as proxy for 'no stools'.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose possible pregnancy in nausea/vomiting", "text": "Fires on any nausea/vomiting; page only says 'Exclude pregnancy' (a check), so it is a catch-all possible diagnosis.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Check for causes of nausea/vomiting not needing urgent attention", "text": "The check list covers gastroenteritis/dyspepsia/dehydration items but dehydration-leading check items are fine; no check_for for 'recent vomiting' pregnancy/medication/alcohol (management/cross-refs, acceptable).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose probable GORD in nausea/vomiting with dyspepsia", "text": "Waist threshold 80 cm applied to all patients; the male threshold (94 cm) is lost, giving false GORD likely in men with waist 80-93 cm.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "(missing) probable Shock from footnote 1", "text": "The page defines 'shock likely' (SBP<80, pulse>=100, RR>30, confusion/restlessness, weakness); no rule derives Shock, so the Urgent item 'Shock' depends on a clinician recording Shock directly.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose possible pregnancy in nausea/vomiting", "text": "Fires for every adult with nausea/vomiting, men included; no sex restriction even though 'Female' (finding) exists in SNOMED.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose probable cholera in nausea/vomiting", "text": "'In cholera outbreak area in past 5 days' is encoded as exposure to Vibrio cholerae with an onset window; onset is the recording time, so the 5-day test does not measure time since being in the area.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Urgent: nausea/vomiting with danger signs", "text": "'No stools or flatus' approximated by Obstipation OR (Constipation AND no Passing flatus); 'Unable to break wind' (finding) exists and is closer.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose probable dyspepsia / GORD in nausea/vomiting", "text": "Flowchart puts dyspepsia on the 'No' branch of the gastroenteritis question; the rules do not exclude gastroenteritis criteria, so both can fire together (flowchart branch lost).", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis in nausea/vomiting / Urgent: nausea/vomiting with danger signs", "text": "Allergen exposure lacks the 'within the past few hours' window, so any recorded food/drug exposure plus sudden nausea makes the patient Urgent.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 57, "slug": "57-nausea-vomiting", "kind": "rule", "priority": "medium", "ref": "Diagnose probable cholera in nausea/vomiting", "text": "Page says cholera likely with watery diarrhoea 'with or without vomiting'; the rule requires nausea/vomiting as a conjunct, so it is <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);

(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });

(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });

(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });

const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {

  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;

}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>

    <span><button id="exp">export decisions</button>${helpButton("export")}</span>

  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
