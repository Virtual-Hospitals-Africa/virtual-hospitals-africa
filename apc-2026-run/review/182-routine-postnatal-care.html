g orally.", "bbox": [51.2, 253.8, 656.4, 264.6], "key": "p182-d1604824"}, {"id": "p182-out-e01", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "ROUTINE POSTNATAL CARE", "bbox": [309.0, 48.4, 532.9, 70.7], "key": "p182-568a682c"}, {"id": "p182-out-e02", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness, shock likely. 2If balloon catheter unavailable, make condom catheter: slip open condom over large Foley's catheter and tie with string at the base. 3Bimanual compression: insert clenched fist into vagina, with back of hand posteriorly. Place other hand on abdomen behind uterus and squeeze uterus firmly between two hands. 4Do not mix Ringer's lactate and IV ceftriaxone. 5One drink is 1 tot of spirits, or 1 small glass (125mL) of wine or 1 can/bottle (330mL) of beer. 6Avoid IUD if chorioamnionitis, rupture of membranes for > 18 hours or postpartum haemorrhage.", "bbox": [34.0, 527.3, 801.8, 551.8], "key": "p182-ba801413"}, {"id": "p182-out-e03", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess the patient and her baby 6 hours, 6 days, and 6 weeks after delivery", "bbox": [272.6, 278.8, 571.1, 290.0], "key": "p182-d40d1699"}, {"id": "p182-out-e04", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess When to assess Note", "bbox": [39.7, 294.2, 202.0, 305.2], "key": "p182-db5c7d88"}, {"id": "p182-out-e05", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Symptoms Every visit Manage patient’s symptoms as on symptom page. Manage baby’s symptoms with IMCI guide.", "bbox": [39.7, 308.6, 503.0, 318.8], "key": "p182-74ccad96"}, {"id": "p182-out-e06", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "TB Every visit If TB preventive treatment (TPT) deferred during pregnancy, reassess for TPT after delivery 100.", "bbox": [39.7, 321.7, 513.2, 332.5], "key": "p182-cc99e5b5"}, {"id": "p182-out-e07", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Mental health Every visit • If patient has suicidal thoughts or plans, previous mental illness, recent bereavement, trauma, sexual abuse/violence, no social/family support, financial difficulty 159. • If low mood, stress or anxiety 98.", "bbox": [39.7, 335.4, 759.1, 356.3], "key": "p182-7e46488f"}, {"id": "p182-out-e08", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Substance use Every visit In the past year, has patient drunk ≥ 4 drinks5/session, used illegal drugs or misused prescription or over-the-counter medications? If yes to any 165.", "bbox": [39.7, 359.2, 694.8, 370.0], "key": "p182-b8140c36"}, {"id": "p182-out-e09", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Family planning Every visit Assess patient’s contraceptive needs 170. Ideally, insert IUD within 48 hours of delivery if no contraindications6 or insert subdermal implant/start injectable/POP at any stage after delivery, or offer tubal ligation if appropriate. Avoid COC pill for 6 weeks after delivery and for 6 months if breastfeeding.", "bbox": [39.7, 372.9, 797.6, 393.7], "key": "p182-d8cbee9c"}, {"id": "p182-out-e10", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Infant feeding Every visit If breastfeeding, check for breast problems 55. Check that baby latches well. If formula feeding, ensure correct mixing of formula and water.", "bbox": [39.7, 396.7, 665.6, 407.5], "key": "p182-7c78e24c"}, {"id": "p182-out-e11", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Baby Every visit • Assess and manage baby according to IMCI guide. • Ensure baby gets immunisations at birth and 6 weeks. If patient known to have TB, hepatitis B or syphilis, prevent infections in the newborn 185.", "bbox": [39.7, 410.8, 690.0, 431.0], "key": "p182-97b003a3"}, {"id": "p182-out-e12", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Psychosocial risk Every visit Patient at risk of mental health problem if any of: patient not interacting with baby, difficult life event in last year, unplanned pregnancy, unsupportive partner, violence at home, no social/family support, previous depression/anxiety, < 20 years, no money for food, patient is a refugee or has long-term health conditions. Refer to social worker.", "bbox": [39.7, 434.4, 796.2, 454.6], "key": "p182-5a670463"}, {"id": "p182-out-e13", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Abdomen and perineum", "bbox": [39.7, 457.9, 91.0, 478.1], "key": "p182-8b10b689"}, {"id": "p182-out-e14", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Every visit • If painful abdomen or foul-smelling vaginal discharge, discuss/refer same day. • If perineal or abdominal wound, check healing. Advise salt baths twice daily in warm water for perineal wounds. If red/warm/painful/swollen/foul-smell/oozing pus, discuss/refer.", "bbox": [112.0, 457.9, 791.6, 478.1], "key": "p182-30d597ad"}, {"id": "p182-out-e15", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "BP Every visit If BP ≥ 140/90, allow patient to rest for 1 hour, then recheck BP. If ≤ 1 week postpartum and BP still ≥ 140/90, discuss same day. If > 1 week postpartum and BP ≥ 140/90 148.", "bbox": [39.7, 481.1, 780.1, 491.9], "key": "p182-a8fbc6a3"}, {"id": "p182-out-e16", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "BMI Every visit Patient’s BMI = weight (kg) ÷ height (m) ÷ height (m). If < 18.5, arrange nutritional support.", "bbox": [39.7, 495.2, 491.4, 505.4], "key": "p182-296b1e4f"}, {"id": "p182-out-e17", "page": 182, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Continue to assess the postnatal patient and baby 183", "bbox": [311.6, 510.7, 530.3, 521.7], "key": "p182-592d38de"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 269.8]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAF/CAIAAAB8OYl/AAAACXBIWXMAABcSAAAXEgFnn9JSAAJ1HklEQVR4nOy9d3BVR/M2+Nvar3a3vtr9Z7dqt2prqz5zRBAICUQSGUTG5AxCBJEkMggwGUROBky2yDljI5IQCEQUQQSRTQ4GG9uYjA1+/b53H92W2sM55865V1nQVU+pdE+Y6Uk93c+Z6fmv3/+/wgKBQCAQCAQCgUAgEAgEAkHBwn/luQQCgUAgEAgEAoFAIBAIBAKBrxBWSyAQCAQCgUAgEAgEAoFAUPDwEav114kt/7oQJxAIBAKBQCAQCAQCgUAgEORDvF//jT2r9e/fz7r+dU0gEAgEAoFAIBAIBAKBQCDIh/greZuwWgKBQCAQCAQCgUAgEAgEggIGYbUEAoFAIBAIBAKBQCAQCAQFD8JqCQQCgUAgEAgEAoFAIBAICh6E1RIIBAKBQCAQCAQCgUAgEBQ8CKslEAgEAoFAIBAIBAKBQCAoeBBWSyAQCAQCgUAgEAgEAoFAUPAgrJZAIBAIBAKBQCAQCAQCgaDgQVgtgUAgEAgEAoFAIBAIBAJBwYOwWgKBQCAQCAQCgUAgEAgEgoIHYbUEAoFAIBAIBAKBQCAQCAQFD8JqCQQCQa7i1e9n8lwGgR4FqI3ev72YsG85kHJqa54Lk89x4sh6qqtcy7GgdKQP71L/eH1e88BPj45S1d35YX+mEykouHZpFxX291+SczSj189Ttm+Zt3De2Lgdi/RP/vLkOIl063q8Y7LWxvo0miZbemn+hPc9QSAQCAS2EFZLIBAIshO//nR849pZk2IGRnRuFdGp5dDB3desnP7811O49e8PV5o0rFW4UKGlSybmuZwCWxS4NoIjZ/yP/wG0b9Moz4XJ56hZLYTqKhfyypOO1CmseYB/0bPJW3x66+HdxDKlSpYsXuzMyc2envl+2wKqurlfj8x0Il4CXfpQwsqkxDW5Vm8mDB/akwp76sSmnMvl2qVd5cuUooyqViqvfzhh33J6cvqUIY4pmxorG5smE4gZ0w99cuO6r7OYTrb00vwJn3qCQCAQCGwhrJZAIBBkD/58c2HB3DEwu8k8VXH5wk488PsvyfBy8bNreMs8lzan8cuT49s2fQP/8PQJn12pP16f379n6e cal_finding (snomed_concept \"Heavy episode of vaginal bleeding\" \"finding\"))\n\n    ;; Perineal tear extending to anus or rectum\n    (clinical_finding (snomed_concept \"Third degree perineal laceration\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fourth degree perineal laceration\" \"disorder\"))\n\n    ;; Recent seizure, up to 1 week postpartum\n    (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n\n    ;; Shock/systolic BP < 80\n    (clinical_finding (snomed_concept \"Shock\" \"disorder\"))\n\n    ;; Pallor with respiratory rate >= 30, dizzy, faint or chest pain\n    (clinical_finding (snomed_concept \"Pallor of skin of face\" \"finding\"))\n    (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Feeling faint\" \"finding\"))\n    (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))\n\n    ;; Unwell and temperature >= 38°C\n    (clinical_finding (snomed_concept \"Generally unwell\" \"finding\"))\n  )\n)\n(task\n  \"Measure BMI at routine postnatal visit\"\n  adult\n  (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))\n  (measure (measurement (snomed_concept \"Body mass index\" \"observable entity\") kg/m²))\n)\n(system_diagnosis_rule\n  \"Diagnose probable postpartum haemorrhage at routine postnatal care\"\n  (diagnosis\n    (snomed_concept \"Postpartum hemorrhage\" \"disorder\")\n    probable\n  )\n  adult\n  ;; \"Heavy bleeding (soaks pad in < 5 minutes), postpartum haemorrhage likely\"\n  ;; The pad-soaking time cannot be expressed; heavy vaginal bleeding in the postpartum patient stands for it.\n  ;; Scoped by the box header: \"postnatal patient (within 6 weeks of delivery)\".\n  (and (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))\n       (<= (onset (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))) (time_ago 6 weeks))\n       (clinical_finding (snomed_concept \"Heavy episode of vaginal bleeding\" \"finding\")))\n)\n(system_priority_evaluation\n  \"Urgent: routine postnatal care with danger signs\"\n  adult\n  Urgent\n  (and\n    ;; postnatal patient (within 6 weeks of delivery)\n    (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))\n    (<= (onset (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))) (time_ago 6 weeks))\n    (or\n      (active_condition (snomed_concept \"Postpartum hemorrhage\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Third degree perineal laceration\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Fourth degree perineal laceration\" \"disorder\"))\n      ;; Hb < 6: not representable (no haemoglobin observable/unit)\n      ;; Recent seizure, up to 1 week postpartum\n      (and (clinical_finding (snomed_concept \"Seizure\" \"finding\"))\n           (<= (onset (clinical_finding (snomed_concept \"Postpartum state\" \"finding\"))) (time_ago 1 weeks)))\n      ;; Shock/systolic BP < 80\n      (clinical_finding (snomed_concept \"Shock\" \"disorder\"))\n      (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 80)\n      ;; Pallor with respiratory rate >= 30, dizzy, faint or chest pain\n      (and (clinical_finding (snomed_concept \"Pallor of skin of face\" \"finding\"))\n           (or (>= (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)\n               (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n               (clinical_finding (snomed_concept \"Feeling faint\" \"finding\"))\n               (clinical_finding (snomed_concept \"Chest pain\" \"finding\"))))\n      ;; Unwell and temperature >= 38°C\n      (and (clinical_finding (snomed_concept \"Generally unwell\" \"finding\"))\n           (>= (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38))\n      ;; Pulse >= 100\n      (>= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 100)\n    )\n  )\n)\n", "rules": [{ ` Postpartum hemorrhage from\n  Postpartum state (within 6 weeks) AND `Heavy episode of vaginal bleeding`; the priority rule refers\n  to it through `active_condition`.\n- **Recent seizure, up to 1 week postpartum, treat as eclampsia 177**: encoded directly in the\n  priority rule as Seizure AND postpartum ≤ 1 week. \"Treat as eclampsia 177\" is read as a management\n  pointer, not an \"X likely\" statement, so there is no eclampsia diagnosis rule (builder A wrote a\n  probable one; see Questions).\n- **Perineal tear extending to anus or rectum**: an `or` of Third degree and Fourth degree perineal\n  laceration.\n- **Shock/SBP < 80** is encoded as written on this page: `(or (clinical_finding Shock) (< SBP 80))`.\n  Footnote 1 (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness, weakness,\n  shock likely\") is not built into a shock rule; pulse ≥ 100 is its own red-box item anyway.\n- **Pallor with RR ≥ 30, dizzy, faint or chest pain**: `(and Pallor of skin of face (or RR ≥ 30,\n  Dizziness, Feeling faint, Chest pain))`.\n- **Unwell and temperature ≥ 38°C**: `Generally unwell` AND body temperature ≥ 38 °C.\n- **Pulse ≥ 100**: `Pulse, function` ≥ 100 bpm.\n- **Priority level** is `Urgent`, as the box header says.\n- **BMI row:** a `measure` task for Body mass index (kg/m²) at every postnatal visit (BMI is not a\n  routine vital). \"< 18.5, arrange nutritional support\" is management.\n- The rest of the assessment table (TB, mental health, substance use, family planning, infant\n  feeding, baby, psychosocial risk, abdomen/perineum, BP ≥ 140/90 recheck) consists of\n  cross-references, management or referral steps, with no \"X likely\" or \"consider X\", so it is not\n  encoded. No flowchart file: the page has no Yes/No branches.\n\n## Could not model\n\n- **Hb < 6:** the language has no haemoglobin observable or unit. Leaving it out means the priority\n  rule fires **less often** than the page intends (a patient with Hb < 6 and no other sign is not flagged).\n- **\"(soaks pad in < 5 minutes)\":** the time to soak a pad cannot be expressed. \"Heavy episode of\n  vaginal bleeding\" stands for it, so the PPH rule may fire **more often** than the page intends.\n- **\"Recent\" seizure:** captured only by the 1-week postpartum window; no time limit on the seizure itself.\n- All \"Manage and refer urgently\" steps (fluids, oxytocin, tranexamic acid, ergometrine,\n  misoprostol, uterine massage, balloon catheter, bimanual compression, ceftriaxone, metronidazole)\n  are management steps and out of scope.\n\n## SNOMED gaps\n\n- No `Pallor` (finding); used `Pallor of skin of face` (finding), as other VHA rules do. (`Pale\n  complexion` was the alternative.)\n- No `Heavy bleeding` (finding); used `Heavy episode of vaginal bleeding` (finding).\n- No `Feeling unwell` (finding); used `Generally unwell` (finding).\n- `Shock` exists only as a disorder, which is the form used.\n- No concept for \"perineal tear extending to anus or rectum\"; used Third/Fourth degree perineal laceration.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Is the onset of a recorded `Postpartum state` the delivery date? If onset is the time of\n  recording, the 6-week and 1-week windows are always met at intake and do not filter.\n- Should \"perineal tear extending to anus\" include third-degree tears (anal sphincter), or only\n  fourth-degree tears (anal/rectal mucosa)?\n- Which sign should \"pallor\" map to: facial pallor (used), pale complexion, conjunctival pallor or\n  generalised pallor of the skin?\n- \"Treat as eclampsia\": should a seizure up to 1 week postpartum also produce a `probable` (or\n  `possible`) Eclampsia diagnosis? (Builder A encoded probable; the final build does not.)\n- Should \"faint\" also match `Syncope` (actually fainted), not only `Feeling faint`?\n- Should postpartum haemorrhage be `Emergency` rather than `Urgent`, given the page calls it\n  \"life-threatening … requires immediate management\"?\n- Should a seizure more than 1 week postpartum (but within 6 weeks) still be urgent here? As\n  encoded it is not urgent on this page (only through the general Seizure warning sign).\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent routine postnatal care conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Postpartum state\" \"finding\"))", "element_keys": ["p182-2de4d887"], "quote": "postnatal patient"}, {"claim_id": "c002", "rule": "Check for urgent routine postnatal care conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Heavy episode of vaginal bleeding\" \"finding\"))", "element_keys": ["p182-5c0aae53"], "quote": "Heavy bleeding"}, {"claim_id": "c003", "rule": "Check for urgent routine postnatal care conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Third degree perineal laceration\" \"disorder\"))", "element_keys": ["p182-33c2c260"], "quote": "Perineal tear extending to anus or rectum"}, {"claim_id": "c004", "rule": "Check for urgent routine postnatal care conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Fourth degree perineal laceration\" \"disorder\"))", "element_keys": ["p182-33c2c260"], "quote": "Perineal tear extending to anus or rectum"}, {"claim_id": "c005", "rule": "Check for urgent routine postnatal care conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Seizure\" \"finding\"))", "element_keys": ["p182-e5efd0e8"], "quote": "Recent seizure"}, {"claim_id": "c006", "rule": "Check for urgent routine postnatal care conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Shock\" \"disorder\"))", "element_keys": ["p182-42a235ac"], " e standard; and the page's BMI < 18.5 threshold is not consumed by any rule. Harmless, but either drop the task or add the threshold it exists to serve.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "Check for urgent routine postnatal care conditions", "text": "The check_for task triggers on any Postpartum state without the 6-week window the red box states, while both downstream rules apply the window. Mild over-triggering, not a correctness error.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "(page-level)", "text": "None of the table's same-day criteria (painful abdomen or foul-smelling discharge; infected wound; BP >= 140/90 within 1 week postpartum) or the psychosocial 'at risk if any of' list is encoded. Defensible under a red-box-only reading of the house standard, but the page repeats 'painful abdomen or foul-smelling vaginal discharge' inside the red box as well and it is checked for nowhere.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "high", "ref": "system_priority_evaluation Urgent; PPH probable rule", "text": "6-week and 1-week windows use (<= onset(Postpartum state) (time_ago N weeks)), which reads as postpartum started at least N weeks ago, opposite of 'within'. Seizure window also tests postpartum onset, not seizure onset.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "task Check for urgent routine postnatal care conditions", "text": "check_for lacks measurement items used by the priority rule (SBP, pulse, RR, temperature); no measure tasks for them. Hb absent (not representable).", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "system_priority_evaluation Urgent", "text": "Pallor concept is face-specific; Heavy bleeding reaches Urgent only via a probable PPH diagnosis, with no direct branch.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "whole page", "text": "No probable shock rule, no eclampsia rule, no BP >=140/90 or painful abdomen/foul discharge rules.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "high", "ref": "Urgent: routine postnatal care with danger signs; Diagnose probable postpartum haemorrhage at routine postnatal care", "text": "All three onset comparisons use (<= (onset Postpartum state) (time_ago N)), which per the briefing convention means 'at least N ago'. The 6-week window and the 1-week seizure window are inverted: the Urgent rule and PPH rule cannot fire for a patient within 6 weeks of delivery. Also note onset of 'Postpartum state' is captured when the finding is recorded, not at delivery, so even the corrected window approximates time since delivery poorly.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "(missing) probable Shock diagnosis", "text": "Footnote 1 defines 'shock likely'; no probable rule exists and the Urgent rule uses (clinical_finding Shock) instead of (active_condition Shock). Confusion/restlessness and weakness are not checked.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "(missing) Eclampsia", "text": "'Recent seizure up to 1 week postpartum, treat as eclampsia' arguably warrants a possible/probable Eclampsia diagnosis rule; none exists (borderline - 'treat as' is a management directive).", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "Check for urgent routine postnatal care conditions", "text": "check_for omits a 'Recent' qualifier for seizure and any qualifier for 'soaks pad in < 5 minutes'; Hb < 6 correctly omitted. Pallor concept 'Pallor of skin of face' is narrower than the page's 'Pallor'.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "Check for urgent routine postnatal care conditions", "text": "Right type and trigger, but the red-box item 'Hb < 6' is not checked for at all, and 'Pallor' is narrowed to facial skin. Hb has no g/dL unit in the briefing's unit list; a finding form such as (clinical_finding (snomed_concept \"Hemoglobin below reference range\" \"finding\")) would at least carry the sign.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "high", "ref": "Urgent: routine postnatal care with danger signs", "text": "Urgent level matches 'Give urgent attention' and the (and postnatal (or ...)) structure is right, but one of the nine red-box criteria, 'Hb < 6', is missing from the or, so a severely anaemic postnatal patient is never escalated. The seizure item's 'treat as eclampsia' is also not reflected anywhere (no possible/probable Eclampsia diagnosis rule), and the footnote defining shock (SBP < 80, pulse ≥ 100, RR > 30, confusion/restlessness, weakness) is not used to infer Shock. Pallor concept narrowed (c027) and pulse concept questionable (c034).", "detail": [{"checker": "backward-1", "severity": "high"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "high", "ref": "Urgent: routine postnatal care with danger signs", "text": "Omits the page criterion 'Hb < 6' (no haemoglobin measurement condition). Heavy bleeding is only represented indirectly via the PPH diagnosis (active_condition), not as the page's heavy-bleeding finding, so urgency depends on the diagnosis rule firing. Pulse >=100 and SBP<80 are standalone, correct.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "Check for urgent routine postnatal care conditions", "text": "check_for list omits Hb < 6 (no measurement item) and the vital-sign danger signs (SBP<80, pulse>=100, RR>=30, temperature>=38) that appear in the box; acceptable only if check_for is restricted to findings.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "high", "ref": "Urgent: routine postnatal care with danger signs", "text": "The red-box criterion 'Hb < 6' (p182-919613b7) is missing from the OR list entirely, so a postnatal patient with Hb < 6 and no other sign is not flagged Urgent. Otherwise the type, the Urgent level (from 'Give urgent attention'), the 6-week window and the nested pallor and unwell+fever ANDs are faithful.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "Check for urgent routine postnatal care conditions", "text": "Hb < 6 is not prompted for, and neither is a haemoglobin measurement, so the missing criterion can't even be collected. Heavy bleeding is checked without its 'soaks pad in < 5 minutes' definition. Pallor is narrowed to the face.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 182, "slug": "182-routine-postnatal-care", "kind": "rule", "priority": "medium", "ref": "Diagnose probable postpartum haemorrhage at routine postnatal care", "text": "'Likely' maps correctly to probable an "use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
