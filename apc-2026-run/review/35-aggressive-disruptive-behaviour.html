5, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 124.6, "indent": 2, "parent": "p35-rb1-e15", "text": "If restraints used, document type, duration and site and check restraint sites every 15 minutes. Counsel the family regarding reasons for restraints.", "bbox": [57.0, 224.0, 618.3, 234.8], "key": "p35-3f55a385"}, {"id": "p35-rb1-e18", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Try to avoid IM/IV medication to sedate the aggressive/disruptive patient, especially if > 65 years or substance user.", "bbox": [201.7, 238.4, 640.0, 249.3], "key": "p35-b196688f"}, {"id": "p35-rb1-e19", "page": 35, "box": 1, "kind_hint": "other", "section": "Manage urgently:", "section_y": 124.6, "indent": 0, "parent": null, "text": "Ensure emergency trolley and resuscitation equipment available before giving sedation. Will patient accept oral medication?", "bbox": [183.5, 248.4, 658.1, 259.3], "key": "p35-76a2025b"}, {"id": "p35-rb1-e20", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Yes", "bbox": [356.2, 269.2, 368.6, 280.0], "key": "p35-594cc78b"}, {"id": "p35-rb1-e21", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "No", "bbox": [725.3, 269.2, 736.3, 280.0], "key": "p35-cc7f998c"}, {"id": "p35-rb1-e22", "page": 35, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "Give diazepam 5mg orally or buccal1 midazolam 7.5-15mg.", "bbox": [221.4, 279.2, 462.4, 290.0], "key": "p35-c4b9b4bd"}, {"id": "p35-rb1-e23", "page" -e30", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Delirium", "bbox": [479.3, 351.3, 512.3, 362.1], "key": "p35-285cf984"}, {"id": "p35-rb1-e31", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Psychosis", "bbox": [638.8, 351.3, 673.6, 362.1], "key": "p35-fccbaa9a"}, {"id": "p35-rb1-e32", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Cause unknown", "bbox": [718.6, 351.3, 779.7, 362.1], "key": "p35-1c7af79b"}, {"id": "p35-rb1-e33", "page": 35, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 124.6, "indent": 1, "parent": null, "text": "Give midazolam 7.5-15mg IM or diazepam 10mg IV over 2 minutes.", "bbox": [149.1, 372.0, 359.1, 392.9], "key": "p35-c00e937a"}, {"id": "p35-rb1-e34", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Give haloperidol 0.5-1mg IM. If haloperidol not available:", "bbox": [389.4, 372.1, 602.0, 382.9], "key": "p35-06279d53"}, {"id": "p35-rb1-e35", "page": 35, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 124.6, "indent": 1, "parent": null, "text": "If alcohol withdrawal, also give thiamine 200mg IM.", "bbox": [149.1, 392.1, 357.6, 402.9], "key": "p35-f8c73474"}, {"id": "p35-rb1-e36", "page": 35, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "Give olanzapine 5-10mg orodispersible/IM. If > 65 years, give 2.5-5mg orodispersible/IM instead.", "bbox": [389.4, 392.8, 765.6, 403.6], "key": "p35-552631c1"}, {"id": "p35-rb1-e37", "page": 35, "box": 1, "kind_hint": "criterion", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 1, "parent": null, "text": "If previous olanzapine intolerance (fever, sweating, muscle rigidity and changes in blood pressure) give midazolam 7.5-15mg IM.", "bbox": [389.4, 402.8, 786.0, 423.6], "key": "p35-5644598e"}, {"id": "p35-rb1-e38", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "Assess response after 30 minutes:", "bbox": [397.1, 432.8, 525.0, 443.6], "key": "p35-3c82f64a"}, {"id": "p35-rb1-e39", "page": 35, "box": 1, "kind_hint": "other", "section": "Manage urgently:", "section_y": 124.6, "indent": 0, "parent": null, "text": "Patient calm", "bbox": [143.0, 453.5, 190.3, 464.3], "key": "p35-68822531"}, {"id": "p35-rb1-e40", "page": 35, "box": 1, "kind_hint": "other", "section": "Give urgent attention to the aggressive/disruptive patient with any of:", "section_y": 91.8, "indent": 0, "parent": null, "text": "If partial response or no response, repeat same dose of medication used above", "bbox": [350.0, 453.5, 650.1, 464.3], "key": "p35-51b4c85a"}, {"id": "p35-rb1-e41", "page": 35, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 124.6, "indent": 3, "parent": "p35-rb1-e17", "text": "Monitor and record temperature, BP, respiratory and pulse rate, level of consciousness every 15 minutes for first hour, then every 30 minutes until patient referred, or alert and walking.", "bbox": [65.8, 474.2, 768.5, 485.0], "key": "p35-1c7da1a4"}, {"id": "p35-rb1-e42", "page": 35, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 124.6, "indent": 3, "parent": "p35-rb1-e17", "text": "Once patient is calmer, reassess for underlying cause if not already done, and manage further 36.", "bbox": [65.8, 484.2, 449.4, 495.0], "key": "p35-a7a0f05f"}, {"id": "p35-rb1-e43", "page": 35, "box": 1, "kind_hint": "management", "section": "Manage urgently:", "section_y": 124.6, "indent": 1, "parent": null, "text": "Refer the mentally ill aggressive patient to hospital same day3: document history, and time and dose of medication given. If emergency admission needed without patient consent, fill in MHCA 01 form. If restraints used, complete MHCA 48 form.", "bbox": [51.4, 500.6, 776.3, 521.6], "key": "p35-f2a43bbd"}, {"id": "p35-out-e01", "page": 35, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "AGGRESSIVE/DISRUPTIVE BEHAVIOUR", "bbox": [263.9, 48.7, 576.7, 71.0], "key": "p35-5e9dbeaa"}, {"id": "p35-out-e02", "page": 35, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Buccal: use IV formulation of midazolam, use syringe to draw up correct dose, remove needle and give midazolam between the cheek and gum. 2Stimulants include: methamphetamines (tik), cocaine (crack), methaqualone (mandrax), cannabis. 3If delay in transport, try to move patient to most calm/quiet area and enlist help of a family member to monitor patient.", "bbox": [33.7, 535.2, 807.3, 551.7], "key": "p35-356a0ede"}], "boxes": [{"box": 1, "rect": [35.2, 86.8, 806.0, 526.8]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAOWCAIAAADa7dIcAAAACXBIWXMAABcSAAAXEgFnn9JSAAPbF0lEQVR4nOydh1sVx/f/v3/I73kSr6IokYCiWFFERey9YkGNEnvvvWCLJool2HvXqFGxoFhRQRRLLLFFIxFji0aN+kmyvzf3yDjZMrtcuF7A8zyv5z73zs7uTjlz5pxzZ2f/78n/K8EwDMMwDMMwDMMwDMMwhYv/83kJGIZhGIZhGIZhGIZhGCa3cFSLYRiGYRiGYRiGYRiGKXx8iGo9LRv8rHJVhmEYhmEYhmEYhmEYhimYPPmspElU668V32j/+4lhGIZhGIZhGIZhGIZhCibPKlbiqBbDMAzDMAzDMAzDMAxTyOCoFsMwDMMwDMMwDMMwDFP44KgWwzAMwzAMwzAMwzAMU/jgqBbDMAzDMAzDMAzDMAxT+OCoFsMwDMMwDMMwDMMwDFP44KgWwzAMwzAMwzAMwzA nding walls and throwing objects are aggression towards property; 'Destructive behavior' (child of Aggressive behavior) is the closest concept."}], "elements_not_encoded": [{"element_key": "p35-355c22e9", "element_id": "p35-rb1-e08", "text": "Manage urgently:", "reason_category": "management_step", "reason": "Header of the management list; no triage logic."}, {"element_key": "p35-07173df1", "element_id": "p35-rb1-e09", "text": "Ensure the safety of yourself, the patient and those around you: ensure security personnel present, call police if needed. They should disarm patient if s/he ha", "reason_category": "management_step", "reason": "Management step (safety, calming, restraint, sedation medicine or dose); no management tasks in this pass."}, {"element_key": "p35-4a3f93e0", "element_id": "p35-rb1-e10", "text": "Try to verbally calm the patient:", "reason_category": "management_step", "reason": "Management step (safety, calming, restraint, sedation medicine or dose); no management tasks in this pass."}, {"element_key": "p35-4a549765", "element_id": "p35-rb1-e11", "text": "Avoid direct eye contact, sudden movements and approaching patient from behind. Stand at least two arm's lengths away.", "reason_category": "management_step", "reason": "Management step (safety, calming, restraint, sedation medicine or dose); no management tasks in this pass."}, {"element_key": "p35-21c7415f", "element_id": "p35-rb1-e12", "text": "Use an honest, non-threatening manner. Avoid talking down to the patient, arguing or commanding him/her to calm down. Use a friendly gesture like offering a dri", "reason_category": "management_step", "reason": "Management step (safety, calming, restraint, sedation medicine or dose); no management tasks in this pass."}, {"element_key": "p35-0535168f", "element_id": "p35-rb1-e13", "text": "Listen to patient, identify his/her feelings and desires and offer choices. Take all threats seriously.", "reason_category": "management_step", "reason": "Management step (safety, calming, restraint, sedation medicine or dose); no management tasks in this pass."}, {"element_key": "p35-4d354f63", "element_id": "p35-rb1-e14", "text": "Consider involuntary admission if signs of mental illness and refuses treatment/admission and a danger to self, others, own reputation or financial interest/pro", "reason_category": "management_step", "reason": "Involuntary admission (MHCA) decision; legal/management step, cross-reference to page 158."}, {"element_key": "p35-0f914f13", "element_id": "p35-rb1-e15", "text": "Restrain and/or sedate only if absolutely needed (imminent harm to self/others, disruption of important treatment, damage to environment, verbal attempts to cal", "reason_category": "management_step", "reason": "Management step (safety, calming, restraint, sedation medicine or dose); no management tasks in this pass."}, {"element_key": "p35-9a4f50c0", "element_id": "p35-rb1-e16", "text": "If possible, before sedation, assess and manage possible causes of abnormal thoughts or behaviour 36.", "reason_category": "management_step", "reason": "Assess causes before sedation; cross-reference to page 36, management."}, {"element_key": "p35-3f55a385", "element_id": "p35-rb1-e17", "text": "If restraints used, document type, duration and site and check restraint sites every 15 minutes. Counsel the family regarding reasons for restraints.", "reason_category": "management_step", "reason": "Management step (safety, calming, restraint, sedation medicine or dose); no management tasks in this pass."}, {"element_key": "p35-b196688f", "element_id": "p35-rb1-e18", "text": "Try to avoid IM/IV medication to sedate the aggressive/disruptive patient, especially if > 65 years or substance user.", "reason_category": "management_step", "reason": "Sedation route advice (age > 65 / substance use); medication choice, not triage."}, {"element_key": "p35-76a2025b", "element_id": "p35-rb1-e19", "text": "Ensure emergency trolley and resuscitation equipment available before giving sedation. Will patient accept oral medication?", "reason_category": "management_step", "reason": "Equipment check and oral-medication question; a management branch point."}, {"element_key": "p35-594cc78b", "element_id": "p35-rb1-e20", "text": "Yes", "reason_category": "flowchart_routing", "reason": "Yes branch of the oral-medication question (management flow)."}, {"element_key": "p35-cc7f998c", "element_id": "p35-rb1-e21", "text": "No", "reason_category": "flowchart_routing", "reason": "No branch of the oral-medication question (management flow)."}, {"element_key": "p35-c4b9b4bd", "element_id": "p35-rb1-e22", "text": "Give diazepam 5mg orally or buccal1 midazolam 7.5-15mg.", "reason_category": "management_step", "reason": "Management step (safety, calming, restraint, sedation medicine or dose); no management tasks in this pass."}, {"element_key": "p35-7e086277", "element_id": "p35-rb1-e23", "text": "Assess response after 30 minutes:", "reason_category": "management_step", "reason": "Reassessment after sedation."}, {"element_key": "p35-d99bf28f", "element_id": "p35-rb1-e24", "text": "Patient calm", "reason_category": "flowchart_routing", "reason": "Outcome of sedation reassessment; management flow."}, {"element_key": "p35-217a2373", "element_id": "p35-rb1-e25", "text": "Patient still aggressive/disruptive after 30 minutes", "reason_category": "flowchart_routing", "reason": "Outcome of sedation reassessment; management flow."}, {"element_key": "p35-1ec0e900", "element_id": "p35-rb1-e26", "text": "Decide which medication to use according to likely cause", "reason_category": "flowchart_routing", "reason": "Choice of medication by likely cause; the causes route medicines, the page does not diagnose them here."}, {"element_key": "p35-2ac9e20a", "element_id": "p35-rb1-e27", "text": "Stimulant2 withdrawal", "reason_category": "flowchart_routing", "reason": "Cause box used only to choose medication; no diagnostic criteria given on this page."}, {"element_key": " y tense\" \"finding\"))", "relation": "B_narrower"}], "same_concept_different_form": []}, "diagnosis_condition": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 35 – Aggressive/disruptive behaviour: flowchart\n\nSource: APC 2026 page 35 (APC 2026 e-book page 35, red box 1).\n\n```mermaid\nflowchart TD\n    RB[\"Aggressive/disruptive patient with any of:<br/>angry behaviour; challenging, insulting or provocative behaviour;<br/>tense posturing; loud, aggressive speech;<br/>frequently changing body position, pacing; aggressive acts\"]\n    RB --> URG[\"Give urgent attention\"]\n    URG --> MU[\"Manage urgently: safety, verbal calming,<br/>consider involuntary admission, restrain/sedate only if absolutely needed\"]\n    MU --> Q1[\"Try to avoid IM/IV sedation. Ensure resuscitation equipment.<br/>Will patient accept oral medication?\"]\n    Q1 -- Yes --> ORAL[\"Give diazepam orally or buccal midazolam.<br/>Assess response after 30 minutes\"]\n    Q1 -- No --> CAUSE[\"Decide which medication to use according to likely cause\"]\n    ORAL --> CALM1[\"Patient calm\"]\n    ORAL --> STILL[\"Patient still aggressive/disruptive after 30 minutes\"]\n    STILL --> CAUSE\n    CAUSE --> C1[\"Stimulant withdrawal / Alcohol withdrawal / Seizures\"]\n    CAUSE --> C2[\"Delirium\"]\n    CAUSE --> C3[\"Psychosis / Cause unknown\"]\n    C1 --> M1[\"Midazolam IM or diazepam IV (+ thiamine if alcohol withdrawal)\"]\n    C2 --> M2[\"Haloperidol IM; if unavailable → olanzapine\"]\n    C3 --> M3[\"Olanzapine (midazolam if previous olanzapine intolerance)\"]\n    M1 --> RE[\"Assess response after 30 minutes\"]\n    M2 --> RE\n    M3 --> RE\n    RE --> CALM2[\"Patient calm\"]\n    RE --> REP[\"Partial/no response: repeat same dose\"]\n    CALM1 --> MON[\"Monitor vitals and level of consciousness;<br/>reassess underlying cause (page 36)\"]\n    CALM2 --> MON\n    REP --> MON\n    MON --> REF[\"Refer the mentally ill aggressive patient to hospital same day\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Red box (complaint + any of six behaviours) | `(and (or Aggressive behavior, Disruptive behavior) (or …ten findings for the six items…))` | `Urgent: aggressive/disruptive patient with signs of escalating aggression`; findings asked by `Check for urgent aggressive/disruptive behaviour signs` |\n| Will patient accept oral medication? (Yes/No) | Not modelled: management (sedation route) | — |\n| Patient calm / still aggressive after 30 minutes | Not modelled: response to treatment | — |\n| Likely cause (stimulant/alcohol withdrawal, seizures, delirium, psychosis, unknown) | Not modelled: the boxes choose a medicine; the page gives no criteria for diagnosing them | — |\n| Repeat dose, monitoring, referral | Not modelled: management | — |\n", "questions": "# Page 35 – Aggressive/disruptive behaviour: remaining questions\n\n## Decisions made\n\n- **Scope.** Only the triage part of the red box is encoded: one `check_for` task and one `Urgent`\n  priority evaluation. Everything below \"Manage urgently:\" (safety, verbal calming, involuntary\n  admission, restraint, the sedation flowchart, monitoring, referral) is management and is\n  accounted for as `management_step` / `flowchart_routing`.\n- **Priority level is `Urgent`**, as the page says (\"Give urgent attention\"). VHA's `Aggression`\n  warning sign (`Aggressive behavior`) already carries `Very urgent`; the page does not escalate,\n  so this rule does not either.\n- **Presenting complaint** = `(or Aggressive behavior, Disruptive behavior)`, used as the task's\n  `due_to` and as the first conjunct of the priority rule. `Aggressive behavior` is the recorded\n  warning sign; `Disruptive behavior` is not a recorded common symptom or warning sign, so that\n  half fires only if a worker records it directly.\n- **Item mapping (six red-box items → ten findings):**\n  - Angry behaviour → `Anger reaction` (an observed behaviour; `Feeling angry` is a mood finding).\n  - Challenging, insulting or provocative behaviour → `Challenging behavior`, `Verbally abusive\n    behavior` (for \"insulting\"), `Provocative behavior`.\n  - Tense posturing → `Feeling physically tense` (low confidence; see SNOMED gaps).\n  - Loud, aggressive speech → `Verbal aggression`.\n  - Frequently changing body position, pacing → `Restlessness`, `Pacing up and down`.\n  - Aggressive acts like pounding walls, throwing objects, hitting → `Physical aggression`,\n    `Destructive behavior`.\n- **The \"likely cause\" boxes** (stimulant withdrawal, alcohol withdrawal, seizures, delirium,\n  psychosis, cause unknown) only choose a medicine. The page gives no criteria for them, so no\n  diagnosis rules were written.\n- No `measure` task: the monitoring line lists routine vitals and level of consciousness, as\n  post-sedation management.\n\n## Could not model\n\n- The sedation algorithm (oral medication acceptance, 30-minute reassessment, choice of medicine\n  by cause, repeat dosing): management, out of scope for this pass.\n- \"Especially if > 65 years or substance user\" (avoid IM/IV sedation): medication advice.\n- Involuntary-admission criteria (signs of mental illness and refuses treatment and a danger…):\n  a legal/management decision that points to page 158.\n\n## SNOMED gaps\n\n- **Tense posturing (gripping arm rails tightly, clenching fists):** no concept for observed tense\n  posture. Searched \"tense posture\", \"clench\", \"clenched fist\", \"gripping\", \"posturing\",\n  \"tension\". Substitute: `Feeling physically tense` (finding), which is patient-reported. Others\n  rejected: `Tension` (emotional state), `Muscle tension` (increased tone), `Posturing behavior`\n  (catatonic sense), `Clenching teeth`.\n- **Insulting behaviour:** no concept; substitute `Verbally abusive behavior`.\n- **Loud speech:** no \"loud speech\" concept; `Verbal aggression` used for the item as a whole.\n  `Finding of shouting` exists but was not added.\n- **Pounding walls / throwing objects:** no specific concept; `Destructive behavior` used.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the priority be `Very urgent` to match VHA's `Aggression` warning sign, or `Urgent` as\n  the page says? In practice the warning sign already raises recorded aggression to Very urgent.\n- Is `Feeling physically tense` acceptable for observed tense posturing, or should the item be left\n  unencoded?\n- Should `Disruptive behavior` be added as a recorded presenting complaint or warning sign so that\n  the disruptive (non-aggressive) patient reaches this page?\n- Should \"loud\" speech alone (e.g. `Finding of shouting`) qualify, or only aggressive speech?\n- Reconciler: is `Anger reaction` (behavioural) or `Feeling angry` (mood) the better code for\n  \"Angry behaviour\"? The two builders split on this; the final build uses `Anger reaction`.\n- Reconciler: `Feeling physically tense` (final) vs the broader `Feeling tense` for \"tense\n  posturing\" — the builders split; neither describes an observed posture.\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent aggressive/disruptive behaviour signs", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Aggressive behavior\" \"finding\"))", "element_keys": ["p35-80245a7f"], "quote": "aggressive/disruptive patient"}, {"claim_id": "c002", "rule": "Check for urgent aggressive/disruptive behaviour signs", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Disruptive behavior\" \"finding\"))", "element_keys": ["p35-80245a7f"], "quote": "aggressive/disruptive patient"}, {"claim_id": "c003", };

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

function prettyLisp(expr, width = 72) {

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";

// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {

      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }

const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;

    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
