 [45.4, 407.9, 237.9, 438.1], "key": "p48-0051c150"}, {"id": "p48-out-e10", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "51. If recurrent skin problem, check for urticaria and eczema 82. If recurrent cough or wheeze, check for asthma 138. • If one eye involved and no eczema, hayfever or asthma, localised cause likely: wash eye with sterile water. Try to identify and remove cause. Give oxymetazoline 0.025% eye drops 1 drop 6 hourly for 3 days. If no better after 24 hours, advise to return: refer.", "bbox": [39.7, 437.3, 244.4, 518.1], "key": "p48-05c0c7c2"}, {"id": "p48-out-e11", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No. Is the discharge clear or pus? • If painful lump on eyelid, stye likely. Apply warm compresses four times a day. Advise to return if no better, discuss. • If itchy/swollen eyelids, wash twice a day with warm water. • Discuss/refer if: - Eyelashes", "bbox": [321.0, 307.9, 584.9, 458.1], "key": "p48-54242764"}, {"id": "p48-out-e12", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "touching cornea - Eyelids bent", "bbox": [523.0, 457.9, 575.9, 488.1], "key": "p48-a17c75af"}, {"id": "p48-out-e13", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "in/out.", "bbox": [528.7, 487.9, 553.0, 498.1], "key": "p48-278f4a8c"}, {"id": "p48-out-e14", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Viral conjunctivitis likely • Apply cold compresses. • Give oxymetazoline 0.025% eye drops 1 drop 6 hourly up to 7 days. • Return to work once better/no discharge. • Refer if one red eye for >1 day, or no better after 5 days.", "bbox": [262.8, 373.8, 362.6, 474.8], "key": "p48-2fa0d385"}, {"id": "p48-out-e15", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Superficial foreign body", "bbox": [614.7, 284.6, 702.1, 294.8], "key": "p48-f0fac4dc"}, {"id": "p48-out-e16", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Wash out eye with sterile water or sodium chloride 0.9%. • If foreign body not visible, use fluorescein stain and ultraviolet light. • Instil 1 drop tetracaine 1% eye drops4 and gently remove foreign body with moist cotton bud. • Apply eye shield until tetracaine has worn off. • Give chloramphenicol 1% ointment 6 hourly in affected eye for 5 days • Refer same day if: - Removal unsuccessful - Damage to eye - Abnormal vision or eye", "bbox": [604.5, 307.9, 711.6, 498.1], "key": "p48-c706e05c"}, {"id": "p48-out-e17", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "movement - No better 24 hours after", "bbox": [610.2, 497.9, 702.2, 518.1], "key": "p48-bee166f5"}, {"id": "p48-out-e18", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "removal.", "bbox": [615.9, 517.9, 646.4, 528.1], "key": "p48-6b6656b3"}, {"id": "p48-out-e19", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Bacterial conjunctivitis likely • Wipe eyes gently from inside to outside with clean cotton wool soaked in sodium chloride 0.9% until pus clears. • Give chloramphenicol 1% ointment 6 hourly in each eye for 7 days. • Return to work after 2 days of treatment and no pus. • Refer if one red eye, or no better after 5 days.", "bbox": [380.5, 353.8, 498.1, 474.8], "key": "p48-3ea1d024"}, {"id": "p48-out-e20", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Poor vision", "bbox": [746.7, 284.6, 786.9, 294.8], "key": "p48-358aa5b3"}, {"id": "p48-out-e21", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Pus Clear watery discharge, fever, sore throat, enlarged", "bbox": [263.7, 331.2, 446.0, 351.4], "key": "p48-16ecc272"}, {"id": "p48-out-e22", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "lymph nodes", "bbox": [288.4, 351.2, 336.5, 361.4], "key": "p48-d6d3696c"}, {"id": "p48-out-e23", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Check vision using Snellen E chart and pinhole test:", "bbox": [731.4, 307.9, 787.1, 348.1], "key": "p48-9959db21"}, {"id": "p48-out-e24", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- If vision", "bbox": [737.0, 347.9, 770.4, 358.1], "key": "p48-eeb9ff07"}, {"id": "p48-out-e25", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "improves when looking through pinhole and service available, refer for glasses. - If vision no", "bbox": [737.0, 357.9, 804.2, 418.1], "key": "p48-590fd190"}, {"id": "p48-out-e26", "page": 48, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "better with pinhole, service not available or unsure, refer for full assessment. • Check for diabetes 19 and hypertension 148.", "bbox": [731.4, 417.9, 802.4, 508.1], "key": "p48-5f262a94"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 250.7]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAFXCAIAAACXxg4kAAAACXBIWXMAABcSAAAXEgFnn9JSAAIdKUlEQVR4nOy9B3BWx7bvee47MzUzd6benTsz9abee/fNMR8IBEJkEEYgEAIFksg5iSSZHESwyEkkk5OFMRmRMVkEgYgiCkQwwWSMbGEwyYCxj8/Z89e3pKbZoff+FJA+vKp+pdLXO3VYvXqttbt7/+Xn/yjBMAzDMAzDMAzDMAzDMN7FXwo9BwzDMAzDMAzDMAzDMAzjKRzVYhiGYRiGY "Allergic rhinitis caused by pollen\" \"disorder\"))"}]}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Acute angle closure\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Allergic conjunctivitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Bacterial conjunctivitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Cerebrovascular accident\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Gonococcal conjunctivitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Hordeolum\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Jaundice\" \"finding\") probable)", "(diagnosis (snomed_concept \"Orbital cellulitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Viral conjunctivitis\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 48 – Eye/vision symptoms: flowchart\n\n```mermaid\nflowchart TD\n  A[Eye or vision symptoms] --> B{Any red-box item?}\n  B -- Yes --> U[Urgent: manage and refer urgently]\n  B -- No --> C{Presentation}\n  C --> D{Eyes discharging or watery.<br/>Prominent itch?}\n  D -- Yes --> E{Both eyes, or eczema / hayfever / asthma?}\n  E -- Yes --> F[Allergic conjunctivitis likely]\n  E -- \"No (one eye, no atopy)\" --> G[Localised cause likely]\n  D -- No --> H{Discharge clear or pus?}\n  H -- \"Clear watery + fever / sore throat / enlarged nodes\" --> I[Viral conjunctivitis likely]\n  H -- Pus --> J[Bacterial conjunctivitis likely]\n  C --> K[Eyelid problems] --> L[Painful lump on eyelid: stye likely]\n  C --> M[Superficial foreign body: management only]\n  C --> N[Poor vision: Snellen / pinhole; check diabetes and hypertension]\n```\n\n| Node | Content | Rule |\n|---|---|---|\n| A | Trigger | `Check for urgent eye/vision conditions`, `Check for causes of non-urgent eye/vision symptoms` |\n| B / U | Red box | `Urgent: eye/vision symptoms with danger signs` (with `Diagnose probable stroke or TIA in a patient with eye/vision symptoms`, `Diagnose probable gonococcal conjunctivitis`, `Diagnose probable orbital cellulitis`, `Diagnose probable jaundice from yellow eyes`, `Diagnose probable acute glaucoma in a patient with eye/vision symptoms`) |\n| D, E, F | Itch yes, both eyes or atopy | `Diagnose probable allergic conjunctivitis` |\n| G | Localised cause likely | Not encoded (no SNOMED concept; see remaining questions) |\n| H, I | Itch no, clear discharge | `Diagnose probable viral conjunctivitis` |\n| H, J | Itch no, pus | `Diagnose probable bacterial conjunctivitis` |\n| L | Stye likely | `Diagnose probable stye` |\n| M, N | Management / vision testing | Not encoded (management; visual acuity has no unit) |\n", "questions": "# Page 48 – Eye/vision symptoms: remaining questions\n\nFinal build, reconciled from two independent builds (base A). Every resolved difference is in\n`reconcile.json`.\n\n## Decisions made\n\n- **Trigger:** `Eye / vision finding` (finding) for both tasks and the priority rule. Any recorded eye finding (a descendant) fires them. \"Eye or vision symptoms\" isn't a recorded common symptom or warning sign.\n- **Two `check_for` tasks:** red-box items go in `Check for urgent eye/vision conditions`; the discriminators from the \"not needing urgent attention\" approach go in `Check for causes of non-urgent eye/vision symptoms`.\n- **Stroke/TIA:** \"New sudden asymmetric weakness or numbness of face, arm or leg\" uses face, upper-limb and lower-limb concepts, each with the `New`, `Sudden onset` and `Asymmetry` qualifiers. \"Difficulty speaking or visual disturbance\" carries `New` + `Sudden onset` (asymmetry doesn't apply). There is one `probable` rule for `Cerebrovascular accident`, because a rule has one diagnosis and TIA has no separate rule. The separate red-box item \"Sudden loss or change in vision\" uses `Visual disturbance` + `Sudden onset` (without `New`).\n- **BP ≥ 180/110 and not pregnant:** systolic ≥ 180 or diastolic ≥ 110 (Will's convention for BP pairs), and `(no Pregnancy)`. `(not …)` makes VHA's evidence code throw \"Not supported not\", so the rule needs \"not pregnant\" to be recorded.\n- **Pre-eclampsia (\"treat as\"):** written into the priority rule as (Pregnancy, or Postpartum state with onset `(<= … (time_ago 1 weeks))`) and (SBP ≥ 140 or DBP ≥ 90). There is no diagnosis rule, because the page says \"treat as\", not \"likely\".\n- **Acute glaucoma:** the \"Manage and refer urgently\" line says \"acute glaucoma likely\", so it gets a `probable` rule using `Acute angle closure` (`Acute angle-closure glaucoma` isn't an FSN). The rule requires every listed feature (an `and`), with headache/nausea/vomiting as an `or`. It is also in the urgent priority, since it sits in the red box under \"refer urgently\".\n- **One painful red/watery eye:** `Pain in eye`, `Red eye` and `Watery eye` each carry the `Unilateral` qualifier: unilateral pain AND (unilateral red eye OR unilateral watery eye).\n- **Shingles involving eye or nose:** `Herpes zoster ophthalmicus`, or `Herpes zoster` with `finding_site Nasal structure` (broader than the precoordinated `Herpes zoster involving tip of nose`, matching \"nose\").\n- **Chemical burn:** the general `Chemical burn`, as the page words it. It is also a warning sign.\n- **Eczema, hayfever, asthma:** plain `clinical_finding` forms. Hayfever is `Allergic rhinitis caused by pollen`, the FSN behind the synonym \"hay fever\".\n- **Both eyes involved:** the `Right and left` qualifier on discharge or watery eye, because `Bilateral` isn't a qualifier FSN.\n- **Viral conjunctivitis:** no itch, and clear watery discharge, and at least one of fever, sore throat or enlarged lymph nodes. The page puts all four features in one node and doesn't say how many are needed.\n- **Stye:** `Lump in eyelid` (finding) and `Pain` with `finding_site Eyelid structure`.\n- **\"No\" to prominent itch:** written as `(no Itching of eye)`, so it needs a recorded absence.\n\n## Could not model\n\n- **\"stroke or TIA likely\":** one rule gives one diagnosis, so only `Cerebrovascular accident` is diagnosed; TIA is not.\n- **\"Whole\" eyelid (orbital cellulitis):** only eyelid swelling, redness and pain are modelled, so the rule fires more often.\n- **\"Prominent\" itch:** any itch counts, so the rule fires more often.\n- **\"STI symptoms\":** approximated by `Sexually transmitted infectious disease` + `Recent`.\n- **\"One painful red/watery eye\":** the language can't say that the painful eye and the red or watery eye are the same eye.\n- **\"If one eye involved and no eczema, hayfever or asthma, localised cause likely\":** there is no SNOMED concept for a localised cause, so this isn't encoded.\n- **Poor vision**, \"Check vision using Snellen E chart and pinhole test\": visual acuity has no unit or observable in the language, so there is no `measure` task. The referral steps and \"check for diabetes / hypertension\" are pointers.\n- **Management or referral only:** superficial foreign body box, itchy/swollen eyelids, \"Discuss/refer if eyelashes touching cornea / eyelids bent in/out\".\n\n## SNOMED gaps\n\n- `Difficulty speaking` → `Difficulty talking`.\n- `Pain of eyelid` and `Erythema of eyelid` → `Pain` / `Erythema` with `finding_site` `Eyelid structure` (body structure, verified).\n- `Acute angle-closure glaucoma` → `Acute angle closure`.\n- `Yellow sclera` → `Scleral icterus`.\n- `Proptosis` → `Exophthalmos`.\n- `Bilateral` (qualifier) → `Right and left`.\n- `Hay fever` → `Allergic rhinitis caused by pollen`.\n- `Purulent/watery discharge from eye` → `Purulent conjunctival discharge` / `Serous conjunctival discharge`.\n- \"STI symptoms\" → `Sexually transmitted infectious disease` + `Recent`.\n- No concept for a chemical burn of the eye (`Chemical burn of eyelid` is too narrow); general `Chemical burn` used.\n- No concept for shingles of the nose as a whole; `Herpes zoster` + `finding_site Nasal structure` (verified) used.\n- \"Localised cause\" (of conjunctivitis): none found.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Acute glaucoma: should it need all the listed features (current encoding), or a painful red eye plus any one of the others? (The two builders split on this.)\n- Viral conjunctivitis: should fever, sore throat or enlarged lymph nodes be required alongside clear discharge (current encoding), or is clear watery discharge alone enough? (The two builders split on this.)\n- Does \"New sudden\" apply to \"difficulty speaking or visual disturbance\" too? As encoded, a new sudden visual disturbance alone gives probable stroke/TIA, although \"sudden change in vision\" is also its own urgent criterion.\n- \"Not pregnant\" now needs pregnancy status to be recorded. Is that acceptable, or should the BP ≥ 180/110 branch fire whenever pregnancy isn't recorded?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent eye/vision conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Eye / vision finding\" \"finding\"))", "element_keys": ["p48-93b4be0c"], "quote": "eye or vision symptoms"}, {"claim_id": "c002", "rule": "Check for urgent eye/vision conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"New\" \"qualifier value\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Asymmetry\" \"qualifier value\")))", "element_keys": ["p48-dd6dc05d"], "quote": "New sudden asymmetric weakness or numbness of face"}, {"claim_id": "c003", "rule": "Check for urgent eye/vision conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Muscle weakness of upper limb\" \"finding\") (qu  "48-eye-vision-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable gonococcal conjunctivitis", "text": "Requires a recorded STI disease rather than STI symptoms.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 48, "slug": "48-eye-vision-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: eye/vision symptoms with danger signs", "text": "Chemical burn and foreign-body concepts are not eye-specific/site-bound; no severe pre-eclampsia diagnosis despite 'treat as severe pre-eclampsia'; no non-urgent routes for superficial foreign body.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 48, "slug": "48-eye-vision-symptoms", "kind": "rule", "priority": "medium", "ref": "Priority rules", "text": "Only one priority level (Urgent) used; page justifies this (single red box).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 48, "slug": "48-eye-vision-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stroke or TIA in a patient with eye/vision symptoms", "text": "Rule title says 'stroke or TIA' but diagnoses only Cerebrovascular accident; TIA (which exists in SNOMED) is dropped.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 48, "slug": "48-eye-vision-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable stroke or TIA in a patient with eye/vision symptoms", "text": "A new sudden 'Visual disturbance' alone makes stroke probable. That is literal to the page, but on an eye page it means any sudden visual change from a local eye cause (e.g. acute glaucoma) also yields probable stroke. Worth a reviewer's eye.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 48, "slug": "48-eye-vision-symptoms", "kind": "rule", "priority": "medium", "ref": "(none) localised cause branch", "text": "The itch=yes, one-eye, no atopy branch ('localised cause likely') has no rule, so the flowchart's second itch outcome <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";

const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }

    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
