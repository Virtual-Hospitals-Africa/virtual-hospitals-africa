ull, "section_y": -1, "indent": 0, "parent": null, "text": "Sinusitis likely • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed for up to 5 days. • Give sodium chloride 0.9% nose drops as needed. • Give oxymetazoline 0.05% 2 drops in each nostril 8 hourly as needed for a maximum of 5 days. Advise against overuse which may worsen blocked nose. • If symptoms ≥ 10 days, temperature ≥ 38°C, purulent nasal discharge, face pain ≥ 3 days, or symptoms worsen after initial improvement of common cold, give amoxicillin 500mg 8 hourly for 5 days. If severe penicillin allergy (history of anaphylaxis, urticaria or angioedema) give instead azithromycin 500mg daily for 3 days. • If recurrent, test for HIV 124. • If poor response to antibiotic, refer. • Refer same day if: - Tooth infection - Swelling over sinus or around eye - Neck stiffness.", "bbox": [212.2, 332.6, 416.4, 533.5], "key": "p49-fd9260ad"}, {"id": "p49-out-e23", "page": 49, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Recurrent", "bbox": [52.9, 313.4, 90.6, 323.5], "key": "p49-32d3b7f6"}, {"id": "p49-out-e24", "page": 49, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "intense, superficial, stabbing pain", "bbox": [45.5, 323.4, 96.1, 353.5], "key": "p49-d00d187f"}, {"id": "p49-out-e25", "page": 49, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Trigeminal neuralgia likely • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed. • If needed, add tramadol 50mg 6 hourly. • Refer.", "bbox": [39.7, 368.0, 102.2, 489.0], "key": "p49-2ca26b2e"}, {"id": "p49-out-e26", "page": 49, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Previous shingles", "bbox": [125.5, 313.4, 190.4, 323.5], "key": "p49-e3398f9f"}, {"id": "p49-out-e27", "page": 49, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "on same side of", "bbox": [128.2, 323.4, 187.7, 333.5], "key": "p49-d7cba3ba"}, {"id": "p49-out-e28", "page": 49, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "face", "bbox": [149.4, 333.4, 164.5, 343.5], "key": "p49-d9f9729e"}, {"id": "p49-out-e29", "page": 49, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Post-herpetic neuralgia likely • Give amitriptyline2 25mg (10mg if ≥ 65 years) at night. If no response, increase by 25mg every 2 weeks, up to 75mg at night. • If pain ≥ 3 months, assess and advise 76. • If poor response, refer.", "bbox": [120.1, 358.0, 192.7, 519.0], "key": "p49-4559fe88"}], "boxes": [{"box": 1, "rect": [35.7, 86.8, 806.2, 194.0]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkYAAADhCAIAAAAS4J7GAAAACXBIWXMAABcSAAAXEgFnn9JSAAEiV0lEQVR4nOy9B3QV19Ym6Jm/18zqnl4za7pn/TPd/f/9zCVnBCIng8jZRBONSJJNzphkkkUyJoNFzhmTEUEgskGAiSaYjMEGG2ODAWM/v1fz6W5p+3Cq6lTdKwkh2Gt9S+uq6tSpc/bZuU5466d/yyUQCAQCgUAgEAgEAoFAIBBkI7yV5S0QCAQCgUAgEAgEAoFAIBAIQoKktAQCgUAgEAgEAoFAIBAIBNkMSkorZ4GHBYoKBAKBQCAQCAQCgUAgEAgEryB+CuRzSGk9mzbK+vvXAoFAIBAIBAKBQCAQCAQCwSuIJwO7SUpLIBAIBAKBQCAQCAQCgUCQnSApLYFAIBAIBAKBQCAQCAQCQTaDpLQEAoFAIBAIBAKBQCAQCATZDJLSEggEAoFAIBAIBAKBQCAQZDNISksgEAgEAoFAIBAIBAKBQJDNICktgUAgEAgEAoFAIBAIBAJBNoOktAQCgUAgEAgEAoFAIBAIBNkMktISCAQCgUAgEAgEAoFAIBBkM0hKSyAQCAQCgUAgEAgEAoFAkM0gKS2BQCAQCAQCgUAgEAgEAkE2g6S0BAKBQCAQCAQCgUAgEAgE2QyS0hIIBAJBhuHRT8eyvA0CM7LXGB3at2zn9nlAlrfEEb8/Pf3s8cksb4Ydjx8e/8fv5wwFvj6zmQj70/0jPuu8dS1x6cLxs6d/fPTQqizvoCCdOHJwBTGAmU+yHMJ1AoFAIDBDUloCgUAg8IvnT05tWj9z4tj+H3Rp1aZlw17d35/22ZBrl3fS3ZHDuwf+9rfOHZpneTsFbsh2Y/ROxdJoMJDlLbEDwXbxooUK5c977PCrFWxv3TQ7b66c5UuXePww2a3MwH6dibBfHlrpp851q6bky52THunXq0OW91GQTtSp+Q6NJrR6ljfGDcJ1AoFAIPCEpLQEAoFA4Aubv5hZoWxJii5UzJmdajJq16iMfwsXyPfHszNZ3tpMxbPHJ3dsnTNmRK/FC8aF8fiRAyumfTZk2OAPPS+mB/fvHly wGAwGg1EiwJQWg8FgMBgMBoPBYDAYDAajhIEpLQaDwWAwGAwGg8FgMBgMRgkDU1oMBoPBYDAYDAaDwWAwGIwShv8DW4i7TsharZYAAAAASUVORK5CYII="}, "page_image": null, "lisp": ";; Page 49 - Face symptoms\n;; Presenting complaint \"face symptoms\": no single recorded common symptom or warning sign covers it,\n;; so the tasks are anchored to the face findings the page's own tree branches on\n;; (swelling of face, face pain, weakness/numbness of face), plus lip and eye swelling (angioedema branch).\n(task\n  \"Check for urgent face symptom conditions\"\n  adult\n  (or (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Pain in face\" \"finding\"))\n      (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\"))\n      (clinical_finding (snomed_concept \"Numbness of face\" \"finding\"))\n      (clinical_finding (snomed_concept \"Lip swelling\" \"finding\"))\n      (clinical_finding (snomed_concept \"Swelling around eyes\" \"finding\"))\n  )\n  (check_for\n    ;; Stroke or TIA\n    (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Upper facial weakness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Muscle weakness of limb\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Numbness of limbs\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Difficulty talking\" \"finding\"))\n    (clinical_finding (snomed_concept \"Visual disturbance\" \"disorder\"))\n\n    ;; Anaphylaxis\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Tongue structure\" \"body structure\")) (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Difficulty breathing\" \"finding\"))\n    (clinical_finding (snomed_concept \"Dizziness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Collapse\" \"finding\"))\n    (clinical_finding (snomed_concept \"Abdominal pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Finding of vomiting\" \"finding\"))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Food\" \"substance\"))\n    (clinical_finding (snomed_concept \"Insect bite - wound\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Insect sting\" \"disorder\"))\n\n    ;; Facial cellulitis / orbital cellulitis\n    (clinical_finding (snomed_concept \"Redness of skin of face\" \"finding\"))\n    (clinical_finding (snomed_concept \"Swelling of eyelid\" \"finding\"))\n    (clinical_finding (snomed_concept \"Erythema of skin of eyelid\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Pain\" \"finding\") (finding_site (snomed_concept \"Eyelid structure\" \"body structure\")))\n\n    ;; Kidney disease\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"New\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Blood in urine\" \"finding\"))\n    (clinical_finding (snomed_concept \"Proteinuria\" \"finding\"))\n  )\n)\n(task\n  \"Check for causes of face pain\"\n  adult\n  (clinical_finding (snomed_concept \"Pain in face\" \"finding\"))\n  (check_for\n    ;; Pain on one side of face: trigeminal / post-herpetic neuralgia\n    (clinical_finding (snomed_concept \"Pain in face\" \"finding\") (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Stabbing pain\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")) (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"History of herpes zoster\" \"situation\"))\n\n    ;; Sinusitis\n    (clinical_finding (snomed_concept \"Tenderness of face\" \"finding\"))\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Thick\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Posterior rhinorrhea\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n  )\n)\n(task\n  \"Check for causes of facial weakness\"\n  adult\n  (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\"))\n  (check_for\n    ;; Bell's palsy: unable to wrinkle forehead or close eye\n    (clinical_finding (snomed_concept \"Upper facial weakness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Unable to close eyes\" \"finding\"))\n  )\n)\n(task\n  \"Check for causes of facial swelling\"\n  adult\n  (or (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")))\n      (clinical_finding (snomed_concept \"Lip swelling\" \"finding\"))\n      (clinical_finding (snomed_concept \"Swelling around eyes\" \"finding\"))\n  )\n  (check_for\n    ;; Angioedema: painless swelling of lips/eyes\n    (clinical_finding (snomed_concept \"Lip swelling\" \"finding\") (qualifier (snomed_concept \"Painless\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Swelling around eyes\" \"finding\") (qualifier (snomed_concept \"Painless\" \"qualifier value\")))\n\n    ;; Mumps: painful swelling with fever, headache, body pain\n    (clinical_finding (snomed_concept \"Pain in face\" \"finding\"))\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible stroke from face symptoms\"\n  (diagnosis\n    (snomed_concept \"Cerebrovascular accident\" \"disorder\")\n    possible\n  )\n  adult\n  (or\n    ;; \"with no/minimal forehead involvement\" applies to the face weakness\n    (and (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n         (no (clinical_finding (snomed_concept \"Upper facial weakness\" \"finding\"))))\n    (clinical_finding (snomed_concept \"Numbness of face\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Unilateral\" \"qualifier value\")))\n    (and (or (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Face structure\" \"body structure\")))\n             (clinical_finding (snomed_concept \"Pain in face\" \"finding\"))\n             (clinical_finding (snomed_concept \"Weakness of face muscles\" \"finding\"))\n             (clinical_finding (snomed_concept \"Numbness of face\" \"finding\"))\n             (clinical_finding (snomed_concept \"Lip swelling\" \"fin  \"Cerebrovascular accident\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Kidney disease\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Mumps\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Orbital cellulitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Postherpetic neuralgia\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Sinusitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Transient ischemic attack\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Trigeminal neuralgia\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 49 – Face symptoms: flowchart\n\nSource: APC 2026 e-book page 49: the red box, then the \"Approach to patient\nwith face symptoms not needing urgent attention\" tree.\n\n```mermaid\nflowchart TD\n    START[\"Patient with face symptoms<br/>(facial swelling, face pain, facial weakness or numbness)\"]\n    START --> RB{\"Red box: any of?\"}\n    RB -- \"New sudden asymmetric weakness/numbness of face<br/>(no/minimal forehead involvement), arm or leg;<br/>difficulty speaking or visual disturbance\" --> STROKE[\"Consider stroke or TIA → 152<br/>URGENT\"]\n    RB -- \"Sudden face/tongue swelling AND any of: difficulty breathing,<br/>BP &lt; 90/60, dizziness/collapse, abdominal pain, vomiting,<br/>exposure to possible allergen¹\" --> ANA[\"Check for anaphylaxis ↻ 28<br/>URGENT\"]\n    RB -- \"Painful red facial swelling AND temperature ≥ 38°C\" --> CELL[\"Facial cellulitis likely<br/>URGENT\"]\n    CELL -- \"whole eyelid swollen, red and painful\" --> ORB[\"Orbital cellulitis likely\"]\n    RB -- \"New swelling of face AND blood/protein in urine\" --> KID[\"Kidney disease likely<br/>URGENT\"]\n    RB -- None --> APP[\"Approach: not needing urgent attention\"]\n    APP -- \"Rash on face\" --> R82[\"→ 82\"]\n    APP -- \"Gum or tooth problem\" --> R54[\"↻ 54\"]\n    APP --> PAIN[\"Face pain\"]\n    APP --> WEAK[\"Sudden progressive weakness of one side of face and unable to<br/>wrinkle forehead or close eye (may have impaired taste or dry eye)\"]\n    APP --> SWELL[\"Swelling of face\"]\n    PAIN --> ONE[\"Pain on one side of face\"]\n    ONE --> REC[\"Recurrent intense, superficial, stabbing pain\"] --> TN[\"Trigeminal neuralgia likely\"]\n    ONE --> SHI[\"Previous shingles on same side of face\"] --> PHN[\"Post-herpetic neuralgia likely\"]\n    PAIN --> SIN_F[\"Pain when pushing on forehead/cheeks, headache worse on bending forward.<br/>Thick nasal/postnasal discharge, recent common cold\"] --> SIN[\"Sinusitis likely\"]\n    WEAK --> BELL[\"Bell's palsy likely\"]\n    SWELL --> LIPS[\"Painless swelling of lips/eyes\"] --> ANG[\"Angioedema likely\"]\n    SWELL --> PAR[\"Painful swelling of one/both sides of face<br/>with fever, headache, body pain\"] --> MUM[\"Mumps likely\"]\n```\n\n¹ Common allergens include medication, food or insect bite/sting within the past few hours.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Patient with face symptoms | `or` of Swelling (face), Pain in face, Weakness of face muscles, Numbness of face, Lip swelling, Swelling around eyes | due_to of `Check for urgent face symptom conditions`; first `and` arm of `Urgent: face symptoms with stroke, anaphylaxis, facial cellulitis or kidney disease signs` |\n| Stroke/TIA bullet | Sudden-onset unilateral face weakness with no upper facial (forehead) weakness, or sudden-onset unilateral face numbness, limb weakness or limb numbness, or difficulty talking, or visual disturbance | `Diagnose possible stroke from face symptoms`, `Diagnose possible TIA from face symptoms`, and the priority rule |\n| Anaphylaxis bullet | Sudden-onset face or tongue swelling **and** any of difficulty breathing, SBP < 90 / DBP < 60, dizziness, collapse, abdominal pain, vomiting, exposure to drug/food, insect bite/sting | `Diagnose possible anaphylaxis from face swelling` and the priority rule |\n| Facial cellulitis bullet | Facial swelling **and** pain in face **and** redness of skin of face **and** temperature ≥ 38 °C | `Diagnose probable facial cellulitis`; priority via `(active_condition Cellulitis of face)` |\n| Orbital cellulitis | Facial cellulitis evidence **and** eyelid swelling, eyelid erythema, eyelid pain | `Diagnose probable orbital cellulitis from facial cellulitis` |\n| Kidney disease bullet | New facial swelling **and** (blood in urine **or** proteinuria) | `Diagnose probable kidney disease from facial swelling`; priority via `(active_condition Kidney disease)` |\n| Rash on face → 82, gum/tooth → 54 | Cross-references only | not encoded |\n| Face pain → one side → recurrent stabbing | Pain in face (unilateral) **and** stabbing pain of face (recurrent, severe) | `Diagnose probable trigeminal neuralgia` |\n| Face pain → one side → previous shingles | Pain in face (unilateral) **and** history of herpes zoster | `Diagnose probable post-herpetic neuralgia` |\n| Face pain → sinus features | Pain in face **and** tenderness of face **and** headache **and** (thick nasal discharge **or** posterior rhinorrhea) **and** recent common cold | `Diagnose probable sinusitis from face pain` |\n| Facial weakness → Bell's palsy | Sudden-onset unilateral face weakness **and** (upper facial weakness **or** unable to close eyes) | `Diagnose probable Bell's palsy` |\n| Swelling → painless lips/eyes | Painless lip swelling **or** painless swelling around eyes | `Diagnose probable angioedema from face swelling` |\n| Swelling → painful with fever, headache, body pain | Facial swelling **and** pain in face **and** fever **and** headache **and** generalised aches and pains | `Diagnose probable mumps from painful face swelling` |\n\n## Notes\n\n- The \"not needing urgent attention\" tree is reached only when no red-box item applies. The rules\n  do not add `(no …)` guards for the red-box items to the non-urgent diagnoses; overlapping\n  diagnoses (e.g. mumps and facial cellulitis) can both fire.\n- The forehead distinction between stroke (no/minimal forehead involvement) and Bell's palsy\n  (unable to wrinkle forehead) is modelled with `Upper facial weakness`.\n", "questions": "# Page 49 – Face symptoms: remaining questions\n\n## Decisions made\n\n- **Presenting complaint.** \"Face symptoms\" is not a recorded common symptom or warning sign, and\n  SNOMED has no \"face symptom\" concept. The tasks and the urgent priority are anchored to an `or`\n  of the face findings the page's tree branches on: Swelling (finding site Face structure), Pain in\n  face, Weakness of face muscles, Numbness of face, plus Lip swelling and Swelling around eyes\n  (the angioedema branch). None of these is a recorded common symptom yet.\n- **Four tasks.** One for the red box (`Check for urgent face symptom conditions`) and one per branch\n  of the non-urgent tree (face pain, facial weakness, facial swelling). Splitting by branch keeps a\n  finding out of its own task's `due_to` (e.g. Pain in face is checked for when the patient\n  presents with swelling).\n- **Stroke/TIA bullet.** \"consider stroke or TIA\" → two `possible` rules (Cerebrovascular accident,\n  Transient ischemic attack) with the same evidence, plus the items inline in the urgent priority.\n  \"New sudden asymmetric\" → `Sudden onset` + `Unilateral` qualifiers on weakness/numbness of face,\n  arm or leg (sudden onset implies new). \"with no/minimal\n  forehead involvement\" is modelled as `(no Upper facial weakness)` on the face-weakness arm.\n  Difficulty speaking and visual disturbance carry no qualifier (the page puts them after a\n  semicolon without \"sudden\").\n- **Anaphylaxis bullet.** \"check for anaphylaxis 28\" is encoded as a `possible` Anaphylaxis rule (so\n  that page 28's check task can fire) and inline in the urgent priority. \"Exposure to possible\n  allergen\" uses footnote 1: exposure to Drug or medicament, exposure to Food, Insect bite - wound,\n  Insect sting. BP < 90/60 is systolic < 90 or diastolic < 60.\n- **Facial cellulitis / kidney disease.** `probable` rules; the urgent priority references them as\n  `active_condition`, following Will's briefing. \"Painful red facial swelling\" = facial swelling\n  **and** Pain in face **and** Redness of skin of face.\n- **Orbital cellulitis** (in \"Manage and refer urgently\") is a \"likely\" statement, so it gets a\n  `probable` rule that repeats the facial cellulitis evidence and adds eyelid swelling, eyelid\n  erythema and eyelid pain. It gets no priority rule of its own; the patient is already Urgent via\n  facial cellulitis.\n- **Non-urgent tree.** Each \"X likely\" → `probable`; the evidence is the chain of boxes leading to it.\n  No `(no …)` guards against the red-box items were added.\n- \"May have impaired taste or dry eye\" (Bell's palsy) is optional on the page and is not encoded.\n- Fever for mumps uses `(active_condition Fever)`; \"body pain\" = Generalized aches and pains.\n- Bell's palsy \"one side of face\" → `Unilateral` qualifier on sudden-onset facial weakness.\n- Reconciled from two independent builds (A as base); every difference and its reason is in\n  `reconcile.json`.\n\n## Could not model\n\n- \"asymmetric\" (stroke) and \"one side of face\" (Bell's palsy) need a recorded `Unilateral`\n  qualifier; a weakness recorded without it does not count (fires less often if not recorded).\n- \"minimal\" forehead involvement: a patient with recorded upper facial weakness who has only\n  minimal forehead involvement would be excluded from the stroke face arm (fires less often).\n- \"progressive\" (Bell's palsy), \"superficial\" (trigeminal neuralgia), \"whole\" eyelid (orbital\n  cellulitis): not encoded, so those rules fire more often.\n- \"on same side of face\" (post-herpetic neuralgia): not representable; fires more often.\n- \"headache worse on bending forward\": no concept; plain Headache used (fires more often).\n- Footnote 1 \"within the past few hours\": not modelled (same as page 20).\n- Management lines (oxygen, furosemide, amlodipine, pulse > 100 / RR > 30 / BP > 150/100 thresholds,\n  \"If delay in transfer, discuss with doctor\") are management steps.\n\n## SNOMED gaps\n\n- No \"face symptom\" concept: an `or` of face findings is used.\n- \"Postnasal drip\" (finding) does not exist; `Posterior rhinorrhea` (disorder) used.\n- \"Post-herpetic neuralgia\" does not exist; `Postherpetic neuralgia` (disorder) used.\n- No concept for headache worse on bending forward; `Headache` used.\n- No \"unable to wrinkle forehead\" concept: `Upper facial weakness` (finding) used.\n- No precoordinated eyelid pain concept; `Pain` with finding site `Eyelid structure` (verified).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Sinusitis: should all features (tenderness, headache, thick nasal/postnasal discharge, recent\n  common cold) be required, as encoded, or would two of them suffice? The page lists them as one\n  description box.\n- `(active_condition Kidney disease)` in the urgent priority also matches a patient with known\n  kidney disease who presents with any face symptom. Is that acceptable, or should the priority use\n  the page's evidence (new facial swelling and blood/protein in urine) directly?\n- Is `(no Upper facial weakness)` an acceptable way to express \"no/minimal forehead involvement\"?\n- Should \"asymmetric\" weakness require a recorded Unilateral qualifier, as encoded (fewer false\n  stroke alerts, but missed strokes if the qualifier is not recorded)?\n- Does \"new sudden\" also apply to difficulty speaking and visual disturbance? They follow a\n  semicolon on the page and are encoded without a qualifier.\n- Mumps: should all of fever, headache and body pain be required, as encoded?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent face symptom conditions", "role": "trigger", "expr le), and SNOMED has a positive concept 'Lower facial weakness' (finding, child of Weakness of face muscles) that states forehead sparing directly; the builders' (no Upper facial weakness) is a defensible alternative but treats an unrecorded forehead exam as absent.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'New' qualifier", "'asymmetric' mapped only to Unilateral"], "problem": "Parts: sudden unilateral face weakness with no upper-face involvement (encoded, via no Upper facial weakness); sudden unilateral face numbness (encoded); sudden unilateral arm/leg weakness and numbness (encoded); difficulty speaking (encoded); visual disturbance (encoded). Missing: 'New' not encoded; 'no/minimal forehead involvement' is not applied to numbness (correct per page wording is ambiguous); stroke and TIA are two identical rules, so stroke-vs-TIA is not differentiated (page says 'consider stroke or TIA', so acceptable). In the stroke/TIA rules the limb/speech/vision branch is gated by any face symptom including face pain or swelling, which is looser than the page's 'face symptoms and any of'. Actually that matches the page; low concern.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "All parts present: sudden unilateral face weakness with (no Upper facial weakness) for 'no/minimal forehead involvement'; sudden unilateral face numbness; sudden unilateral limb weakness/numbness; Difficulty talking; Visual disturbance; possible CVA and possible TIA; all in the Urgent priority. 'New' is folded into Sudden onset and 'asymmetric' into Unilateral, both acceptable.", "confidence": "high"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "element", "priority": "medium", "ref": "p49-96a95e1e", "text": "Sudden face/tongue swelling and any of: difficulty breathing, BP < 90/60, dizziness/collapse, abdominal pain, vomiting or exposure to possible allergen1, check for anaphylaxis 28.", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Parts: sudden face swelling, sudden tongue swelling (Swelling + finding_site Face/Tongue + Sudden onset); difficulty breathing; BP < 90/60 (systolic < 90 OR diastolic < 60, the same reading as the gold page 20); dizziness; collapse; abdominal pain; vomiting; exposure to possible allergen per footnote 1 (Exposure to Drug or medicament, Exposure to Food, Insect bite - wound, Insect sting). 'check for anaphylaxis' = possible Anaphylaxis, which is the trigger of page 20's check task. The footnote's 'within the past few hours' window is not encoded (see p49-9b2a92df).", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["time window for allergen exposure", "latex/other allergens not needed"], "problem": "Sudden face/tongue swelling plus any of the listed features is encoded in the possible-anaphylaxis rule and in the priority rule. Problems: (1) the 'within the past few hours' time bound on allergen exposure is not encoded; (2) 'Exposure to (contextual qualifier)' + Drug/Food as a generic finding is an unusual construction and 'Insect bite - wound' is a wound, not a sting event; (3) the priority rule gate requires face swelling/pain/weakness/numbness/lip/eye swelling, so sudden TONGUE swelling alone with difficulty breathing does not satisfy the gate; (4) BP < 90/60 encoded as SBP<90 OR DBP<60 which is a reasonable reading.", "confidence": "high"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["Urgent priority does not fire for sudden TONGUE swelling + a criterion unless one of the six face findings in the outer gate is also recorded (tongue swelling is not in the gate)", "'within the past few hours' qualifier on allergen exposure (footnote 1)"], "problem": "Possible anaphylaxis rule is complete: sudden face OR tongue swellin phylaxis and priority rules only react to 'Sudden onset' face/tongue swelling plus a listed sign. Painless lip/eye swelling with noisy breathing is therefore recorded as a non-urgent probable Angioedema.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable sinusitis from face pain; Diagnose probable mumps from painful face swelling", "text": "Both rules AND every descriptive feature of the flowchart box (sinusitis: face pain, tenderness, headache, thick/postnasal discharge, recent cold; mumps: swelling, pain, fever, headache, body pain). The page reads as a descriptive cluster, not a checklist; a strict conjunction will rarely fire. A patient with tender cheeks, headache and thick discharge but no reported recent cold gets no sinusitis diagnosis. Consider any2/any3 of the secondary features, or at least making 'recent common cold' and 'body pain' optional.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke from face symptoms; Diagnose probable Bell's palsy", "text": "Forehead sparing is expressed as (no Upper facial weakness), so an unrecorded forehead examination is treated as sparing and yields possible stroke/TIA. Also, Bell's palsy accepts 'Unable to close eyes' as evidence of forehead involvement, but the stroke rule excludes only 'Upper facial weakness', so sudden unilateral weakness + Unable to close eyes (forehead not recorded) fires both possible stroke and probable Bell's palsy. SNOMED's 'Lower facial weakness' (finding, child of Weakness of face muscles) would state forehead sparing as a positive finding.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable facial cellulitis; Diagnose probable orbital cellulitis; Diagnose probable mumps", "text": "These probable rules use the unqualified finding (Swelling at Face structure), but every check_for in the file records it only with a qualifier (Sudden onset or New). Whether the 'probable evidence must be checked for in the same file' constraint accepts a qualified check for unqualified evidence could not be verified from the inputs allowed; if it does not, these rules fail the test. Likewise the mumps rule's (active_condition Fever) has no check_for in this file (Fever is a recorded common symptom, so this is probably accepted).", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable post-herpetic neuralgia of face", "text": "'History of herpes zoster' is not site-specific and cannot be side-matched to the pain, so the rule is looser than 'previous shingles on same side of face'.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mumps from painful face swelling", "text": "'Body pain' is encoded as Generalized aches and pains; the recorded common symptom is Muscle pain, which is not a descendant, so a patient recorded with Muscle pain does not satisfy the clause.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: face symptoms with stroke, anaphylaxis, facial cellulitis or kidney disease signs", "text": "Gate requires one of the face symptoms (including face swelling, not tongue swelling), so sudden tongue swelling with difficulty breathing but no face swelling does not trigger Urgent, though the page lists 'face/tongue swelling'. Also the Urgent rule relies on active_condition Cellulitis of face / Kidney disease rather than the findings, and the gate also admits plain face pain.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for causes of facial swelling", "text": "check_for lacks Fever and temperature, yet the mumps and cellulitis rules use them; check lists and diagnosis rules disagree. The Urgent task check_for also omits temperature, BP and urine items used downstream (only Blood in urine and Proteinuria are present).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke / TIA", "text": "Two identical rules, so stroke and TIA are indistinguishable; 'New' onset not encoded. Limb/speech/vision branch requires any face symptom, as the page.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable orbital cellulitis from facial cellulitis", "text": "Duplicates cellulitis criteria rather than depending on the facial cellulitis diagnosis; 'whole eyelid' lost.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Urgent: face symptoms with stroke, anaphylaxis, facial cellulitis or kidney disease signs", "text": "Outer gate requires one of six plain face findings. Sudden tongue swelling is not in the gate, so tongue swelling + difficulty breathing/low BP does not raise Urgent unless a face finding is also recorded. If evidence matching is by exact s-expression, a patient recorded only with the qualified 'Swelling of face + Sudden onset' or '+ New' form also fails the plain-swelling gate. The urgent task's due_to has the same gap.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable sinusitis from face pain", "text": "Five mandatory conjuncts (face pain AND tenderness AND headache AND thick/postnasal discharge AND recent common cold). The page lists typical features and does not say all are required; requiring a recorded recent cold is very strict and will rarely fire. 'Worse on bending forward' is missing.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable Bell's palsy vs Diagnose possible stroke/TIA", "text": "Sudden unilateral face weakness + Unable to close eyes with forehead spared satisfies both probable Bell's palsy (via the 'or close eye' branch) and possible stroke. This follows the page's literal 'or', but an upper-motor-neuron pattern is labelled probable Bell's. The Urgent priority still fires, so the safety impact is limited.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable trigeminal neuralgia / post-herpetic neuralgia", "text": "Qualifiers dropped: 'superficial' (TN) and shingles 'on same side of face' (PHN). With these gone, any unilateral face pain plus a past zoster anywhere gives probable PHN.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Concept choice (several)", "text": "Precoordinated 'Facial swelling' (finding) and 'Tongue swelling' (finding) exist; the rules use Swelling + finding_site instead. Valid, but less canonical.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable sinusitis from face pain", "text": "All five descriptive features (tenderness, headache, thick/postnasal discharge, recent cold, face pain) are required with 'and'. The page presents them as one descriptive cluster with no 'all of'; a patient with sinus tenderness, positional headache and thick discharge but no recent cold would not get the likely diagnosis. Consider requiring tenderness or headache plus any of the rest, or ask a clinician; also 'worse on bending forward' is lost (c119).", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible stroke from face symptoms", "text": "The facial-weakness branch excludes only Upper facial weakness, not 'Unable to close eyes', so a Bell's palsy presentation (sudden unilateral weakness, cannot close eye, no forehead recorded) fires stroke/TIA as well as Bell's. Also stroke and TIA rules are identical copies.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TIA from face symptoms", "text": "Identical to the stroke rule; fine as the page says 'stroke or TIA', but same Bell's overlap.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose possible anaphylaxis from face swelling", "text": "Allergen exposure within the past few hours (footnote 1) not captured; exposure concepts are generic.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable orbital cellulitis from facial cellulitis", "text": "Restates the cellulitis evidence instead of referencing the diagnosis; 'whole eyelid' not captured (Swelling of eyelid may fire on partial swelling). Acceptable.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 49, "slug": "49-face-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable post-herpetic neuralgia of face", "text": "Same-side-of-face link for previous shingles is not expressed.", "detail": [{"checker": "backward-2", " <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.

  while (i < src.length) {
    const ch = src[i];

    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }

}

  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
