ss\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pain in scrotum\" \"finding\") (qualifier (snomed_concept \"Sudden onset\" \"qualifier value\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pain in scrotum\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Pain\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Glans penis structure\" \"body structure\")) (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling of scrotum\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling\" \"finding\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Glans penis structure\" \"body structure\")))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Urethral discharge\" \"finding\"))"], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Balanitis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Malignant neoplasm of testis\" \"disorder\") possible)", "(diagnosis (snomed_concept \"Paraphimosis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Priapism\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Torsion of testis\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Urethritis\" \"disorder\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 63 – Genital symptoms in a man: flowchart\n\nSource: APC 2026 e-book page 63 (APC 2026 e-book, page 63). Red box at top; below it an\n\"Approach to the man with genital symptoms not needing urgent attention\" with three columns.\n\n```mermaid\nflowchart TD\n    START[\"Man with genital symptoms\"] --> RB{\"Red box: any of?\"}\n    RB -- \"Scrotal swelling/pain AND any of: sudden severe pain,<br/>testicle higher/rotated, preceding trauma/strenuous activity\" --> TORS[\"Torsion of testicle likely<br/>→ refer urgently to surgical unit\"]\n    RB -- \"Foreskin retracted, cannot be reduced,<br/>AND swollen AND very painful glans\" --> PARA[\"Paraphimosis likely<br/>→ glans blue/black: refer urgently;<br/>else doctor attempts manual reduction\"]\n    RB -- \"Prolonged erection > 4 hours\" --> PRIA[\"Priapism likely<br/>→ refer urgently to surgical unit\"]\n    RB -- \"None\" --> APP[\"Approach: assess/advise ↻62, HIV test ↻124 …<br/>Check for urethral discharge (milk urethra if not visible)\"]\n    APP -- \"No urethral discharge AND urinary symptoms\" --> P69[\"→ page 69\"]\n    APP --> C1[\"Urethral discharge<br/>(± dysuria/burning urine)\"]\n    APP --> C2[\"Scrotal swelling or pain\"]\n    APP --> C3[\"Painful, itchy or foul-smelling glans,<br/>difficulty retracting foreskin\"]\n    C1 --> MUS[\"Treat for male urethritis syndrome (MUS)\"]\n    MUS --> MUSF[\"Return in 7 days if symptoms persist:<br/>ceftriaxone treatment failure likely. Refer\"]\n    C2 -- \"Pain with/without swelling or discharge\" --> SSW[\"Treat for scrotal swelling (SSW)\"]\n    C2 -- \"Painless lump\" --> CA[\"Exclude testicular cancer → Refer\"]\n    C3 -- \"Unable to retract foreskin\" --> REF[\"Refer\"]\n    C3 -- \"Able to retract: wash, dry, examine\" --> EX{\"Findings\"}\n    EX -- \"Ulcer/s present\" --> P65[\"→ page 65\"]\n    EX -- \"Glans inflamed\" --> BAL[\"Treat for balanitis/balanoposthitis (BAL)\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Trigger: man with genital symptoms | `Male genitalia finding` (descendants match) or `Urethral discharge` | `Check for urgent genital symptoms in a man` (task) |\n| Torsion of testicle likely | (Swelling of scrotum or Pain in scrotum) **and** any of: sudden-onset severe scrotal pain, Testicle out of place, Testes - transverse lie, Traumatic injury, Injury of scrotum, Injury of testis, Overexertion and strenuous movements | `Diagnose probable torsion of testis (genital symptoms in a man)` |\n| Paraphimosis likely | Fixed, retracted foreskin **and** swelling of glans **and** severe pain of glans | `Diagnose probable paraphimosis (genital symptoms in a man)` |\n| Priapism likely | Onset of prolonged erection of penis at least 4 hours ago | `Diagnose probable priapism (genital symptoms in a man)` |\n| Red box → urgent attention | Genital symptom **and** any of the three likely diagnoses | `Urgent: genital symptoms in a man with torsion, paraphimosis or priapism` |\n| Urethral discharge → treat for MUS | Urethral discharge → probable Urethritis (judgment call: \"Treat for\" read as the syndromic diagnosis) | `Diagnose probable male urethritis syndrome (genital symptoms in a man)` |\n| Painless lump → exclude testicular cancer | Painless mass of scrotum or of testicle → possible Malignant neoplasm of testis | `Diagnose possible testicular cancer (painless scrotal lump)` |\n| Glans inflamed → treat for BAL | Inflammatory morphology at glans penis → probable Balanitis (Balanoposthitis is a descendant) | `Diagnose probable balanitis/balanoposthitis (genital symptoms in a man)` |\n| Pain ± swelling/discharge → treat for SSW | Not modelled: no SNOMED concept for the syndromic \"scrotal swelling\" diagnosis | — (see remaining questions) |\n| Ulcer/s → page 65; no discharge + urinary symptoms → page 69; unable to retract → refer | Routing / management only | — |\n\n## Notes\n\n- \"Not needing urgent attention\" (the gate before the three columns) is not encoded as a negation in\n  the MUS/BAL/cancer rules; they fire regardless of the red box.\n- \"Glans blue/black\" only changes management of paraphimosis; not modelled.\n- \"Ceftriaxone treatment failure likely\" depends on persistence after treatment, which the language\n  cannot express.\n", "questions": "# Page 63 – Genital symptoms in a man: remaining questions\n\n## Decisions made\n\n- **Complaint anchor.** \"Man with genital symptoms\" is not a recorded common symptom or warning sign.\n  The check_for task and the urgent rule use `(or Male genitalia finding, Urethral discharge)`.\n  `Male genitalia finding` matches scrotal, testicular, penile, foreskin and erection findings by\n  descendant; `Urethral discharge` is not under it in SNOMED, so it is added explicitly.\n- **Red box → probable diagnoses + one Urgent rule.** Each \"X likely\" in the red box is a `probable`\n  rule (torsion of testis, paraphimosis, priapism). The urgent rule is `(and complaint (or\n  active_condition …))`. Level is `Urgent`: the page says \"Give urgent attention\" and \"refer urgently\",\n  not \"Emergency\".\n- **Torsion.** `(and (or scrotal swelling, scrotal pain) (or sudden-onset severe scrotal pain, testicle\n  out of place, transverse lie, traumatic injury, injury of scrotum, injury of testis,\n  overexertion/strenuous movements))`. Injury of scrotum and Injury of testis are not descendants of\n  Traumatic injury in SNOMED, so all three are listed (reconciler merge of builds A and B).\n- **Paraphimosis.** All three of: fixed retracted foreskin, swollen glans, very painful (severe) glans,\n  following the page's \"with\".\n- **Priapism.** \"> 4 hours\" written as `(>= (onset (clinical_finding \"Prolonged erection of penis\"))\n  (time_ago 4 hours))`, because the database rejects `>` in onset comparisons. `>=` includes exactly\n  4 hours; the page says \"> 4\".\n- **\"Treat for\" boxes.** \"Treat for male urethritis syndrome\" is encoded as probable `Urethritis`\n  from urethral discharge. \"Treat for balanitis/balanoposthitis\" is encoded as probable `Balanitis`\n  from inflamed glans. `Balanoposthitis` is a descendant of Balanitis. This follows Will's reading\n  of \"Treat for anaphylaxis\" on page 20. \"Treat for scrotal swelling (SSW)\" is not encoded (see\n  SNOMED gaps).\n- **Urethral discharge** is in the trigger and the urgent rule's complaint, not in `check_for`:\n  the page's \"Check for urethral discharge\" would make the check_for item identical to the trigger,\n  which Will's constraint rejects as self-referential.\n- **\"Exclude testicular cancer\"** for a painless lump: `possible` Malignant neoplasm of testis, from a\n  painless mass of scrotum or of testicle.\n- No `manage` or `measure` tasks. The urine dipstick for glucose in the BAL box is a management step\n  with no unit in the language.\n\n## Could not model\n\n- \"Not needing urgent attention\": the gate before the three approach columns. The MUS, BAL and\n  cancer rules don't require that the urgent rule did not fire, so they fire more often than the\n  page intends. This matters only when a red-box condition coexists.\n- \"Preceding\" trauma/strenuous activity: the timing is not modelled. Any recorded traumatic injury\n  or strenuous-movement event counts.\n- \"If glans blue/black\": this changes only the paraphimosis referral. It is management.\n- \"Ceftriaxone treatment failure likely\" (symptoms persisting at 7 days after treatment): the\n  language cannot express \"after treatment\". Not encoded.\n- \"If no urethral discharge and urinary symptoms → 69\", \"ulcer/s present → 65\" and \"unable to\n  retract foreskin, refer\" are routing and management only.\n\n## SNOMED gaps\n\n- Scrotal swelling syndrome (SSW) and male urethritis syndrome: no syndromic concepts.\n  `Urethritis` is used for MUS. SSW is not encoded.\n- High-riding testicle: no concept. `Testicle out of place` is used (broader).\n- Rotated testicle: `Testes - transverse lie` is used.\n- Swollen glans, painful glans, inflamed glans: no precoordinated concepts. `Swelling`, `Pain` and\n  `Inflammatory morphology` are used, each with finding_site `Glans penis structure` (verified).\n- Strenuous activity: the only match is the event `Overexertion and strenuous movements`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- \"Preceding trauma\" for torsion: should any recorded traumatic injury count, or only injury of the\n  scrotum or testis? Both are encoded.\n- \"Preceding … strenuous activity\" uses the SNOMED **event** `Overexertion and strenuous movements`.\n  Can a health worker record this event in VHA, or should the criterion be left out (as builder A did)?\n- Should \"sudden severe pain\" in the torsion criterion be restricted to scrotal pain, as encoded?\n\n- Should \"Treat for MUS / BAL\" be diagnoses at all, or management only? And is `Urethritis` an\n  acceptable stand-in for male urethritis syndrome?\n- Is `Testicle out of place` an acceptable stand-in for \"affected testicle higher\"?\n- Should a painless testicular lump also raise priority (the page only says \"exclude testicular\n  cancer\" and \"Refer\")?\n- Should the scrotal \"painless lump\" be limited to testicular masses for \"Exclude testicular cancer\"?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent genital symptoms in a man", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Male genitalia finding\" \"finding\"))", "element_keys": ["p63-0f15404d"], "quote": "genital symptoms"}, {"claim_id": "c002", "rule": "Check for urgent genital symptoms in a man", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Urethral discharge\" \"finding\"))", "element_keys": ["p63-0f15404d"], "quote": "genital symptoms"}, {"claim_id": "c003", "rule": "Check for urgent genital symptoms in a man", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Swelling of scrotum\" \"finding\"))", "element_keys": ["p63-1849c7a7"], "quote": "Scrot "use strict";
const D = JSON.parse(document.getElementById("data").textContent);

// ---------- storage: browser drafts only, namespaced; export is the record ----------

  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));

const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));

(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });

(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

function prettyLisp(expr, width = 72) {

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";

// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {

      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }

const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;

    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
