dent": 0, "parent": null, "text": "Advise the patient who has been sexually assaulted and/or raped • If patient vulnerable3, explain that mandatory reporting to police is needed. If unsure if mandatory reporting is needed, discuss with Thuthuzela Care Centre/other dedicated centre. • If not vulnerable3, encourage patient to report to police and open a case. If patient declines, respect his/her decision, explain s/he will still receive treatment and may open a case later.", "bbox": [51.0, 404.4, 727.9, 435.5], "key": "p32-77a9d250"}, {"id": "p32-out-e03", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Treat the patient who has been sexually assaulted and/or raped • Discuss with Thuthuzela Care Centre/other dedicated centre and ensure patient has follow up with trauma counsellor/mental health nurse/psychologist/social worker/helpline 200. • If patient vulnerable3, refer to social worker, local DSD and FCS4 detective to open a case. If not vulnerable3, but at risk of harm/needing shelter/history of domestic violence, refer to social worker same day. • If genital symptoms 62. Give presumptive STI treatment, even if no genital symptoms. Give single dose each of ceftriaxone 250mg IM1, azithromycin 1g and metronidazole2 2g orally. • Give paracetamol 500mg-1g orally 4-6 hourly (up to 4g in 24 hours) as needed for pain for up to 5 days. If needed, also give ibuprofen 400mg 8 hourly with/after food for up to 5 days (avoid if peptic ulcer, asthma, hypertension, heart failure, kidney disease, pregnant).", "bbox": [51.0, 446.2, 788.7, 507.3], "key": "p32-57d6e20a"}, {"id": "p32-out-e04", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Review the patient who has been sexually assaulted and/or raped 2 weeks after first visit.", "bbox": [249.0, 518.1, 594.8, 529.1], "key": "p32-b9ceca95"}, {"id": "p32-out-e05", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1Dissolve 250mg ceftriaxone in 0.9mL lidocaine 1% without adrenaline. If severe penicillin allergy (previous angioedema, anaphylaxis, urticaria), omit ceftriaxone and increase azithromycin to 2g. 2Advise no alcohol for 48 hours after last dose. 3Any type of disability, relying daily on care services, woman < 25 years in higher education, patient ≥ 60 years. 4Family Violence, Child Protection and Sexual Offences detective. 5One drink is 1 tot of spirits, 1 glass (125mL) of wine or 1 can/bottle (330mL) of beer.", "bbox": [34.0, 534.8, 808.3, 551.8], "key": "p32-7cd33709"}, {"id": "p32-out-e06", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess the patient who has been sexually assaulted and/or raped not needing urgent attention", "bbox": [232.4, 250.3, 609.5, 261.4], "key": "p32-47dd43cd"}, {"id": "p32-out-e07", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess Note", "bbox": [39.7, 265.5, 189.7, 276.6], "key": "p32-9246eb9b"}, {"id": "p32-out-e08", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Symptoms Ask about genital symptoms 62. Manage other symptoms on symptom pages.", "bbox": [39.7, 279.5, 448.3, 290.3], "key": "p32-bd4e273b"}, {"id": "p32-out-e09", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Abuse If physical, emotional, verbal, psychological or other types of abuse 33.", "bbox": [39.7, 293.1, 419.4, 303.9], "key": "p32-ea863d3a"}, {"id": "p32-out-e10", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Social risk Ask about living conditions, disabilities and identity of perpetrator to determine if patient is vulnerable3. Advise and treat as below.", "bbox": [39.7, 307.1, 615.2, 317.3], "key": "p32-a7f62dfa"}, {"id": "p32-out-e11", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Willingness to report to police and undergo forensic examination", "bbox": [39.7, 320.6, 159.1, 340.8], "key": "p32-ba48f588"}, {"id": "p32-out-e12", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If patient agrees to report, or is unsure/unwilling but agrees to forensic examination: contact FCS4 detective and refer to Thuthuzela Care Centre/other dedicated centre. • Advise that cleaning/washing, eating or smoking before assessment at designated facility may remove evidence. Ensure patient is transported with police vehicle or ambulance.", "bbox": [170.1, 320.5, 778.1, 340.8], "key": "p32-d9600db6"}, {"id": "p32-out-e13", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Mental health If stress, anxiety or low mood 98.", "bbox": [39.7, 343.6, 290.7, 354.4], "key": "p32-06874b9c"}, {"id": "p32-out-e14", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Substance use In the past year, has patient: drunk ≥ 4 drinks5/session, used illegal drugs or misused prescription or over-the-counter medications? If yes to any 165.", "bbox": [39.7, 357.2, 685.5, 368.0], "key": "p32-5bab79a8"}, {"id": "p32-out-e15", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Family planning If woman of child bearing age, offer long-term contraception 170. If menstruation has not occurred 4 weeks after rape, repeat pregnancy test.", "bbox": [39.7, 370.9, 665.8, 381.7], "key": "p32-f1198fe4"}, {"id": "p32-out-e16", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "HIV, syphilis and hepatitis Test for HIV 124 and syphilis 66. Assess for hepatitis B PEP 122. If known HIV, give routine care 126. If HIV negative, assess for PrEP at follow up visit 119.", "bbox": [39.7, 384.5, 728.0, 395.3], "key": "p32-e8d45260"}, {"id": "p32-out-e17", "page": 32, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "SEXUAL ASSAULT AND/OR RAPE", "bbox": [290.9, 48.7, 551.0, 71.0], "key": "p32-a042e1d9"}], "boxes": [{"box": 1, "rect": [35.5, 118.4, 806.4, 241.5]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAECCAIAAADLhZdgAAAACXBIWXMAABcSAAAXEgFnn9JSAAGkEklEQVR4nOy9Z1RVydsn+t6Z+TD3nTUfZubeDzNr5nZ7EMWcUMyKKIpZzFnMOeeIrW3OGXNOiC0mRFHEgEpQRNuIbWjttm1zau3wP/fHeaQsd6i9zwE8oM9av3XW2bVrVz1V9dSTdlXtf3vyvwsyGAwGg8FgMBgMBoPBYDAY+Qv/5nUKGAwGg8FgMBgMBoPBYDAYDHfBUS0Gg8FgMBgMBoPBYDAYDEb+wydRrZdh7V/27MRgMBgMBoPBYDAYDAaDwWDkQbxo0dQ4qvXPkyTnXz8yGAwGg8FgMBgMBoPBYDAYeRB/JkZyVIvBYDAYDAaDwWAwGAwGg5HPwFEtBoPBYDAYDAaDwWAwGAxG/gNHtRgMBoPBYDAYDAaDwWAwGPkPHNViMBgMBoPBYDAYDAaDwWDkP3BUi8FgMBgMBoPBYDAYDAaDkf/AUS0Gg8FgMBgMBoPBYDAYDEb+A0e1GAwGg8FgMBgMBoPBYDAY+Q8c1WIwGAwGg8FgMBgMBoPBYOQ/cFSLwWAwGAwGg8FgMBgMBoOR/8BRLQaDwWAwGAwGg8FgMBgMRv4DR7UYDAaDwWAwGAwGg8FgMBj5DxzVYjAYjOzi5dPkf95f8joZDAVePDnndRrs49TxzbEHVwNep8QQ79+kvX2Z6nUyNPjx4l7qtCe/JXqdmHwNTU/+ci+BLjOuHfI6bTnVqBxB4smtVGZuy/8/316kis6d3u71nsxV5FSXWirl/CsuzidFrVoxZXXElNs3D3udGAaDwcgj4KgWg8FgWODd6wvRUUtnTx/Rp2e7Dm2bDB7QedG8cbeux9Ld/dHLCxf0qRJQ7uVTFpt5FJMnDnB8802Prq28TolN1KwWAIIBr1Oix91bcWVLFS9epHBec7BHDe9BnXbm1DavE5OvoenJHyIX0+X8OWO8TltONSpHUL9uTSoTOiJXiX/x5BxV1KxxsOZWr26tawdWef74rNd7OO90qR2lnE/FxdiRvYhsYNf2BV6nh8FgMPIIOKrFYDAYKuzdvbRqpfLCjhRYufw7yhA+YQClXEiO8jq1uYq3L1MP7V85NXzwhrUzPHj8+o8H1q78vl/v9rKnkXhi66J54yaM7ZtTRP724GTktgXwWM6e+hhzCQmugQEqUdTvz7cXc7xbDNuVTYLzTlRL37rYA6uIthVLwnOkipzigXzqpuZBfA1RrWxKM4LXo1q//3oKiQ1DAr3evTmFHOlSjVI2HOv8KC4Ox6wWFkjjBkEJRzd6nSQGg8HII+CoFoPBYJhi/eppwoisUTWgV/c2wwaFdWzXtGQxv0tp0ZTnwb3 or matching. It is written out to mirror\n  the page's \"and/or\". Neither concept is a recorded common symptom or warning sign, so the\n  `check_for` task only runs when a health worker records one of these events.\n- **Woman/man windows.** \"Within last 5 days if woman or last 3 days if man\" is encoded as\n  `(and Female (<= (onset assault/rape) (time_ago 5 days)))` or\n  `(and Male (<= (onset …) (time_ago 3 days)))`. Female and Male are the `finding` concepts under\n  \"Finding related to biological sex\". The language has no sex or gender predicate. Following the\n  brief, \"within\" uses `<=`. The onset comparison is written for both Sexual assault and Rape\n  because I'm not sure that onset matching follows descendants.\n- **Priority level.** The page says \"Give urgent attention\", so the priority is `Urgent`. Overdose is\n  a descendant of Poisoning, which is a `Very urgent` warning sign and fires on its own.\n- **\"Injuries needing attention ↻ 30\"** is encoded as Traumatic injury (disorder), the concept the\n  warning-sign anchors use.\n- **\"Manage and refer urgently\" list** (severe bleeding, multiple injuries, severe abdominal pain,\n  pregnant, difficulty breathing, strangled/choked, foreign object) is treated as a referral\n  decision (`management_step`) and not encoded. Per the brief, there are no referral steps in this\n  pass. \"Pregnant\" is still encoded, because it is also an urgent-attention criterion.\n- **No diagnosis rules.** The \"Suspect sexual assault / suspect rape\" lines define the event\n  (consent, penetration). The only evidence for them is the patient's account, which is the event\n  finding itself, so a `possible` rule would be circular. No \"X likely\" statement appears on the page.\n- **Self harm** is `Intentionally harming self` (event), the concept VHA's current rules use most\n  (vocabulary: 2 uses, against 1 for `Self-injurious behavior`). The two are not is-a related.\n- **Reconciled build.** This is builder B's encoding; builder A's alternative (a `Victim of sexual\n  aggression` trigger, a single 5-day window, two `possible` diagnosis rules) was not taken. See\n  `reconcile.json`. The SNOMED \"Sexual assault with … penetration\" events A used are descendants of\n  `Sexual assault` (event), so they are covered by this trigger if matching follows descendants.\n- **No flowchart file.** The page has no flowchart or Yes/No branches.\n\n## Could not model\n\n- **Patient sex** is not a language primitive. The rule needs a recorded Female/Male finding. If\n  the app stores sex only on the patient's demographic record, the time-window branches never fire,\n  so the rule fires **less often** than the page intends. The other criteria are unaffected.\n- **\"Needing attention\"** has no qualifier. Any recorded traumatic injury makes the patient Urgent,\n  so the rule fires **more often** than the page intends.\n- **Onset semantics.** This assumes that the onset of the Sexual assault/Rape record is when the\n  assault happened. If onset is instead the time the finding was recorded, the window is always\n  met at the visit, so the rule fires **more often** than the page intends.\n- The management steps (fluids, oxygen, PEP, STI prophylaxis, emergency contraception, Thuthuzela\n  referral) are out of scope.\n\n## SNOMED gaps\n\n- No disorder concept for sexual assault or rape (builder A); events are used here.\n- All concepts were confirmed with `snomed exists`: Sexual assault (event), Rape (event),\n  Female (finding), Male (finding), Pregnancy (finding), Traumatic injury (disorder), Suicidal\n  thoughts (finding), Planning suicide (finding), Overdose (disorder) and Intentionally harming\n  self (event).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should the \"manage and refer urgently\" criteria (severe bleeding, strangled/choked, difficulty\n  breathing, etc.) also raise the priority, possibly to Emergency, or is Urgent from the\n  red-box criteria enough?\n- How does VHA record patient sex? Is there a finding that a rule can test, or only a demographic\n  field?\n- The page says \"Suspect sexual assault if … Suspect rape if …\". Should these become `possible`\n  diagnosis rules (one builder encoded them from specific SNOMED penetration events and\n  `Victim of forced sexual activity`), or are they only definitions of the presenting complaint, as\n  this build assumes?\n- Will health workers record the assault as `Sexual assault` / `Rape` events, or as\n  `Victim of sexual aggression` / `Victim of rape` findings? If findings, the trigger should include them.\n- Should \"woman\" cover all patients with a vagina, and should the 3-day window for men apply only\n  once sex is recorded as a finding?\n- For \"Injuries needing attention\", should only certain injuries count (as on page 30), rather than\n  any traumatic injury?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent sexual assault/rape conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Sexual assault\" \"event\"))", "element_keys": ["p32-83ced725"], "quote": "sexually assaulted"}, {"claim_id": "c002", "rule": "Check for urgent sexual assault/rape conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Rape\" \"event\"))", "element_keys": ["p32-83ced725"], "quote": "raped"}, {"claim_id": "c003", "rule": "Check for urgent sexual assault/rape conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Female\" \"finding\"))", "element_keys": ["p32-1565c8a9"], "quote": "if woman"}, {"claim_id": "c004", "rule": "Check for urgent sexual assault/rape conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Male\" \"finding\"))", "element_keys": ["p32-1565c8a9"], "quote": "if man"}, {"claim_id": "c005", "rule": " oblem": "No possible-diagnosis rule for sexual assault or rape. Low consequence: there is no discriminating finding to put in the evidence that is not the event itself, and the rules fire off the recorded event. The second sentence (safe space, confidentiality) is advice.", "confidence": "low"}, {"checker": "forward-2", "scope": "out_of_scope", "verdict": "", "parts_missing": null, "problem": "not triage/diagnostic logic", "confidence": null}, {"checker": "forward-3", "scope": "borderline", "verdict": "missing", "parts_missing": ["possible 'Sexual assault' rule", "possible 'Rape' rule (penetration of vagina/anus/mouth without consent)"], "problem": "No diagnosis rule exists, so the event recorded by the health worker is the only entry point to the page. 'Sexual assault' is not a common symptom or warning sign, so the check task fires only if someone records that event directly.", "confidence": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "element", "priority": "high", "ref": "p32-7cd33709", "text": "1Dissolve 250mg ceftriaxone in 0.9mL lidocaine 1% without adrenaline. If severe penicillin allergy (previous angioedema, anaphylaxis, urticaria), omit ceftriaxone and increase azithromycin to 2g. 2Advise no alcohol for 48 hours after last dose. 3Any type of disability, relying daily on care services", "detail": [{"checker": "forward-1", "scope": "out_of_scope", "verdict": "", "parts_missing": null, "problem": "not triage/diagnostic logic", "confidence": null}, {"checker": "forward-2", "scope": "borderline", "verdict": "missing", "parts_missing": ["vulnerability criteria"], "problem": "Not encoded; only supports management.", "confidence": "low"}, {"checker": "forward-3", "scope": "out_of_scope", "verdict": "", "parts_missing": [], "problem": "The footnotes define 'vulnerable', which drives reporting and social-work referral, not triage or diagnosis.", "confidence": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "clai  days))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Same time-direction caveat as c014.", "fix": "Confirm operator direction against 48-constipation example; if literal, use >= onset (time_ago 5 days).", "confidence": "medium"}, {"checker": "backward-3", "verdict": "faithful", "reason": "'within last N days' = onset after time_ago N days; house standard writes '<' for 'within', '<=' is the inclusive equivalent.", "fix": "", "confidence": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "claim", "priority": "medium", "ref": "c020", "text": "Urgent: sexual assault/rape with urgent features :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Traumatic injury\" \"disorder\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "Same as c006: 'needing attention' is dropped, so any recorded injury makes the patient Urgent; no closer SNOMED concept found.", "fix": "", "confidence": "low"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Any traumatic injury triggers urgent; page requires injuries needing attention (page 30).", "fix": "", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "\"Traumatic injury\" covers any injury; the page limits this to injuries needing attention (p.30), so minor bruises/abrasions would make every assault Urgent.", "fix": "Add a severity/qualifier (e.g. (qualifier (snomed_concept \"Severe\" \"qualifier value\"))) or accept as a nurse-judgement proxy; no closer SNOMED concept for 'needing attention' found.", "confidence": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "The time-window branch (the page's first and most common urgent criterion) only fires if the patient's sex has been recorded as the clinical findings \"Female\" (finding) or \"Male\" (finding). If VHA holds sex as a demographic rather than a recorded finding, neither branch matches and a woman raped yesterday with no other urgent feature is not flagged Urgent. The check_for does list Female/Male, which mitigates this only if the nurse answers those items. Worth confirming how sex is represented before relying on this rule.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Check for urgent sexual assault/rape conditions", "text": "The check_for omits the red-box findings in the \"manage and refer urgently\" line (severe bleeding, multiple injuries, severe abdominal pain, difficulty breathing, strangled/choked, foreign object). The house standard asks for every red-box item in the check_for; these would need to be consumed by a rule (e.g. added to the Urgent or-list) to satisfy the never-used-as-evidence test.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "The evidence \"Sexual assault\" and \"Rape\" (event) appear only as the task's due_to, not in a check_for. The house constraint 5 says priority-evaluation evidence must be checked for in the same file (constraint 4 explicitly allows a task due_to; constraint 5 does not say). If the test does not accept a task due_to for priority evaluations, this will be reported as PRIORITY EVALUATION ... NOT CHECKED FOR. Also, the task due_to uses the general \"Sexual assault\" which already matches \"Rape\" by descent; harmless redundancy.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "\"Traumatic injury\" (disorder) without any qualifier makes every recorded injury, however minor, an Urgent criterion, whereas the page says \"injuries needing attention\". No clean representation exists; noted so a clinician can decide whether the over-inclusion is acceptable.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Check for urgent sexual assault/rape conditions", "text": "Task is consistent with the priority rule; every check_for item is used by the priority rule. No problem found beyond the broad Traumatic injury concept.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "Female/Male branches fail silently if sex is not recorded, so a recent assault in a patient with no recorded sex is not caught by the time criterion. Also the Urgent level is justified by the page's red box.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "The escalating features in 'Manage and refer urgently' (severe bleeding, severe abdominal pain, difficulty breathing, strangled/choked, foreign object) are not urgent triggers. A patient outside the 5-day/3-day window who has any of them is not prioritised.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "The time-window criterion relies on onset of the 'Sexual assault'/'Rape' event, so it works only if onset records the assault date rather than the recording time. If onset defaults to the recording time, the 5-day/3-day criterion is always true, and every female or male patient is Urgent. Female/Male are also recorded as clinical findings rather than taken from patient sex.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Check for urgent sexual assault/rape conditions", "text": "The due_to anchor 'Sexual assault'/'Rape' (event) is neither a common symptom nor a warning sign, and no possible pre-screen rule exists, so the rules fire only if the event is recorded directly.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Check for urgent sexual assault/rape conditions", "text": "Type and trigger are right and every item in the 'with any of' line is checked for. But the red box has a second tier under 'Manage and refer urgently' ('If severe bleeding, multiple injuries, severe abdominal pain, pregnant, difficulty breathing, strangled/choked, or use of a foreign object, manage and refer urgently to next level of care') and none of those findings except pregnancy is checked for. Minor: Female/Male as check_for findings is a clumsy way to ask the patient's sex, and the trigger events are not recorded common symptoms or warning signs, so the task depends on another page recording 'Sexual assault'/'Rape'.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "Urgent is justified by the box heading, the (and trigger (or ...)) shape is right, and the woman-5-days / man-3-days split is faithfully encoded for both events. What is missing is the box's referral tier: severe bleeding, multiple injuries, severe abdominal pain, difficulty breathing, strangled/choked, use of a foreign object, BP < 90/60 and SpO2 < 95% all mark a patient the page sends urgently to the next level of care, and no rule carries them (only 'pregnant' from that list is covered). Those patients only reach Urgent today if they also happen to meet a first-tier item.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Check for urgent sexual assault/rape conditions", "text": "check_for lists Female/Male (demographics) and the full urgent list including Traumatic injury, which the page qualifies as needing attention; otherwise the task type and trigger are right.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "Time-window comparison operator direction is doubtful (<= onset vs time_ago); Traumatic injury lacks 'needing attention'; 'Pregnant' is also a manage item but correctly an urgent criterion. Priority Urgent matches the box heading 'Give urgent attention'. Structure and/or is faithful.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "rule", "priority": "medium", "ref": "Urgent: sexual assault/rape with urgent features", "text": "Urgent level is justified by 'Give urgent attention' and the or-structure (sex-specific time window | pregnant | injury | suicidal/overdose/self harm) matches the page. But (1) 'Traumatic injury' is broader than 'injuries needing attention', so almost any assault with a minor injury triggers Urgent; (2) the time window depends on the assault/rape finding's onset — the briefing says onset is captured when the finding is recorded, so unless the nurse back-dates onset to the assault date, the 5/3-day clause will always be true at presentation and every assault becomes Urgent.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "build_disagreement", "priority": "medium", "ref": "trigger", "text": "A: (or Victim of sexual aggression (finding), possible dx Victim of sexual aggression, possible dx Victim of rape)  vs  B: (or Sexual assault (event), Rape (event))", "detail": [{"choice": "B", "final": "(or (clinical_finding (snomed_concept \"Sexual assault\" \"event\")) (clinical_finding (snomed_concept \"Rape\" \"event\")))", "reason": "The header says 'sexually assaulted and/or raped'; B's Sexual assault/Rape concepts are the page's words directly, and A's diagnosis triggers depend on diagnosis rules not taken (below).", "unsettled": true}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: Self-injurious behavior (finding)  vs  B: Intentionally harming self (event)", "detail": [{"choice": "B", "final": "(clinical_finding (snomed_concept \"Intentionally harming self\" \"event\"))", "reason": "Both fit 'self harm' equally; B's concept is the one VHA's existing vocabulary uses most, so the same idea is written the same way across pages.", "unsettled": false}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "B only: Female (finding), Male (finding)", "detail": [{"choice": "B", "final": "(clinical_finding (snomed_concept \"Female\" \"finding\")) ; (clinical_finding (snomed_concept \"Male\" \"finding\"))", "reason": "The page sets different windows 'if woman' and 'if man'; checking for sex is needed to encode that split.", "unsettled": false}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "build_disagreement", "priority": "medium", "ref": "priority_condition", "text": "A: one 5-day window for everyone on Victim of sexual aggression, Victim of forced sexual activity and six penetration events  vs  B: Female AND onset <= 5 days, or Male AND onset <= 3 days, on Sexual assault/Rape", "detail": [{"choice": "B", "final": "(or (and Female (or (<= (onset Sexual assault) (time_ago 5 days)) (<= (onset Rape) (time_ago 5 days)))) (and Male (or (<= (onset Sexual assault) (time_ago 3 days)) (<= (onset Rape) (time_ago 3 days)))))", "reason": "The page says 'within last 5 days if woman or last 3 days if man'; B keeps both numbers, A drops the 3-day window for men.", "unsettled": true}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "build_disagreement", "priority": "low", "ref": "priority_condition", "text": "A: complaint part = Victim of sexual aggression / possible diagnoses  vs  B: Sexual assault / Rape events", "detail": [{"choice": "B", "final": "(or (clinical_finding (snomed_concept \"Sexual assault\" \"event\")) (clinical_finding (snomed_concept \"Rape\" \"event\")))", "reason": "Follows the trigger decision so the priority rule's complaint matches the task's.", "unsettled": false}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "build_disagreement", "priority": "low", "ref": "priority_condition", "text": "A: Self-injurious behavior (finding)  vs  B: Intentionally harming self (event)", "detail": [{"choice": "B", "final": "(clinical_finding (snomed_concept \"Intentionally harming self\" \"event\"))", "reason": "Same as the check_for decision for 'self harm'.", "unsettled": false}]}, {"page": 32, "slug": "32-sexual-assault-and-or-rape", "kind": "build_disagreement", "priority": "medium", "ref": "diagnosis_condition", "text": "A only: Victim of forced sexual activity -> possible sexual assault; six 'Sexual assault with ... penetration' events -> possible rape", "detail": [{"choice": "neither", "final": "", "reason": "The 'Suspect sexual assault/rape if …' lines define the complaint from the patient's account; the evidence A uses is itself a recorded sexual assault (the penetration events are descendants of Sexual assault), so the rules restate the trigger rather than ad   <section class="pane"><h2><span id="rulesttl">Rules, in plain English</span> <span class="hb" data-k="rules"></span> <span style="float:right"><button id="rawbtn" style="font-size:11.5px;text-transform:none;letter-spacing:0">show structured rules</button><span class="hb" data-k="rawtoggle"></span></span></h2><p class="lede">What the small labels mean <span class="hb" data-k="chips"></span> · How to decide <span class="hb" data-k="decide"></span></p><div id="rules"></div></section>
</main>
<div class="lower">
  <div class="tabs" id="tabs"></div>
  <div class="tabbody" id="tabbody"></div>
</div>
<script src="help.js"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
