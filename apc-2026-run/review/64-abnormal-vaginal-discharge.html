dent": 0, "parent": null, "text": "candidiasis • Give single dose clotrimazole vaginal pessary 500mg inserted at night or clotrimazole vaginal cream, inserted with applicator, 12 hourly for 7 days. • If vulva inflamed or itchy, also give clotrimazole topical cream, apply 12 hourly for 7 days.", "bbox": [722.8, 317.4, 801.7, 488.4], "key": "p64-54627d3c"}, {"id": "p64-out-e18", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Treat for bacterial vaginosis: • Give single dose metronidazole3 2g. • Advise to return if no better after 7 days. Perform vaginal and speculum examinations:", "bbox": [371.9, 307.4, 691.6, 338.4], "key": "p64-5979723c"}, {"id": "p64-out-e19", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes: is there lower abdominal pain or pain on moving the cervix?", "bbox": [73.8, 260.2, 310.3, 270.4], "key": "p64-8d9fbcbf"}, {"id": "p64-out-e20", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No to both No", "bbox": [82.0, 284.2, 539.2, 294.4], "key": "p64-a443e992"}, {"id": "p64-out-e21", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Treat for cervicitis: • Give single dose ceftriaxone5 250mg IM6 and azithromycin 1g and metronidazole3 2g. • Give partner notification slip/s with code: VDS. • If discharge itchy, curd-like or vulva red, scratched or inflamed:", "bbox": [39.7, 307.4, 165.9, 388.4], "key": "p64-bac7bfa8"}, {"id": "p64-out-e22", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- Add treatment for vaginal", "bbox": [45.4, 387.4, 148.8, 398.4], "key": "p64-3a7af9bc"}, {"id": "p64-out-e23", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "candidiasis (see adjacent). • Advise to return if no better after 7 days.", "bbox": [39.7, 397.4, 149.9, 428.4], "key": "p64-3d0a19e7"}, {"id": "p64-out-e24", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If no better after 7 days, give", "bbox": [50.1, 442.3, 155.9, 452.5], "key": "p64-f1862c6b"}, {"id": "p64-out-e25", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "metronidazole3 400mg", "bbox": [55.4, 451.7, 150.7, 462.5], "key": "p64-be849a64"}, {"id": "p64-out-e26", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "12 hourly for 7 days.", "bbox": [65.4, 462.3, 140.6, 472.5], "key": "p64-f7f486ac"}, {"id": "p64-out-e27", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Advise to return if no better after", "bbox": [42.0, 486.3, 164.1, 496.5], "key": "p64-55905b99"}, {"id": "p64-out-e28", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "7 days: refer.", "bbox": [79.7, 496.3, 124.4, 506.5], "key": "p64-76a9c249"}, {"id": "p64-out-e29", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes to either: Is there pain on moving the cervix?", "bbox": [199.3, 284.2, 328.0, 304.4], "key": "p64-c434c1b6"}, {"id": "p64-out-e30", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Is there pain on moving the cervix?", "bbox": [469.3, 352.3, 598.0, 362.5], "key": "p64-cd43913b"}, {"id": "p64-out-e31", "page": 64, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Abnormal vaginal discharges are itchy or different in colour, smell or quantity.", "bbox": [279.6, 89.5, 564.8, 99.7], "key": "p64-119ec544"}], "boxes": [{"box": 1, "rect": [36.6, 110.9, 806.9, 204.2]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkYAAADECAIAAABFgQpDAAAACXBIWXMAABcSAAAXEgFnn9JSAADxe0lEQVR4nOydh1cUSff3f3/Ie87KECQIAqIoCIqoiIqYI6KoqxjAhAkT5pwj6oqIGTMqogIqiiQVMYc1rTnnVZ/dnfcLV8uye6Z7QHBE7zmfw5murq66XfHeS1X1/z39f3YMwzAMwzAMwzAMwzAMU4n4P6tLwDAMwzAMwzAMwzAMwzClgl1aDMMwDMMwDMMwDMMwTCWDXVoMwzAMwzAMwzAMwzBMJeOLS+vd0in/PsllGIZhGIZhGIZhGIZhmB+Nf25kmnZp/Z0w2/i/8wzDMAzDMAzDMAzDMAzzo/Hv0zx2aTEMwzAMwzAMwzAMwzCVCXZpMQzDMAzDMAzDMAzDMJUMdmkxDMMwDMMwDMMwDMMwlQx2aTEMwzAMwzAMwzAMwzCVDHZpMQzDMAzDMAzDMAzDMJUMdmkxDMMwDMMwDMMwDMMwlQx2aTEMwzAMwzAMwzAMwzCVDHZpMQzDMAzDMAzDMAzDMJUMdmkxDMMwDMMwDMMwDMMwlQx2aTEMwzAMwzAMwzAMwzCVDHZpMQzDMKXg5dNcq8vAaFOJ6uj9m9Np+1aB/BNbrC6MSV49y//3w1mri6FGt5aPHV5HZWt1UT+8LXz36mS5JHXv9hF6qWuX9utGfng3iyJfuZBaLpKcP7ObEnz6MNvqpVrRfHx3hl429/gmqwujzam8bSuXT1oVP+nG1QNWF4ZhGIb5zrBLi2EYhvnCo3tZG9bOmhQ3MCK8TUTX1jGDeyaunv7s0QncgmEfEtzAzsZmxbKJVpeTMUmlq6N7t48YfvsNdGzXzOrCqNmza1lVO1tf7xqvnuVZXRiZCeOiUGi/92ivEae+nzeVrXVFvfXnIc/q1ao5VS0Xz8iO5EX0UvNmj9KNnLZvFUWePmVouUgyIuZ3SvDEsY3WLdXvwMunufSyrVo0trowGsQO70Nygq2b5ltdHoZhGOY7wy4thmEYppi/X59aNG8M7D1hHgiKTu1EhKcPs+1sbHDZPay11aWtaB7ezUreOB8WbM6xUlu/716d3L9nxeS4QYmrp2sHfiOXz+9dvWJK/8guwuFS0XWUfXTDwrmjx8b2Ky+BfxyXlskKihsbReKdzt/27Vl8S6NSENy4HqRydXb8+O6MOeF/EJdW2t6VJMbyxXHfntq3uLS+XRJ2af1oHEhdJeapFs0Cj6SvtbpIDMMwzHeGXVoMwzBMMX16dRS2QUhwg4EDwqP6dW3bqomXh6vYeLVz6+LRIyMvX9hndWkrmmWLxlNR7NsdX9pnT+Vto2fHxfbXDvxGuoW1ojTlbVAVWkeO9rbILijQr7wE/nFcWiYr6O7tw3FjBiSsnFouWXxLo1JwMm/rqGG9Mw+u0RD+B3FpfXhbuGjemOlThj5/nPPtqX2LS+vbJWGX1o9GzKAeJOSeXcusLgzDMAxjFdilxTAMw5xft2YmGQa+3jUUpxq9f3Oafvzv76LL5/eC29fTcXnz2iG6fPOigCK8fXmSQv66kSEev3v78IHUVTC5RToK7t0+Qk/9/foUhdy4dpBC/vt4rjiFW5n4fevPQ/j9+P4xmC4Ubiw55+jY4XXHj6xH1vhNT8FwFYn/++Hs5Qv7UlPi8Vc+EenqxVTEfHQvC78vnt2DNItO7/wi863MieOjqUD+iJ+MmOpziyDDn5fTDqcnIvFL5/aicCj82aMTu7YtoWej+4fj2ft/HTEZKJVwIcoHpYSykrPQFhJ327ZqQmmiyhDz47szijoSQICcY5v271lx7dJ+uRxQKRT/9fP8f inding\"))\n    (clinical_finding (snomed_concept \"Shock\" \"disorder\"))\n\n    (clinical_finding (snomed_concept \"Sexually active\" \"finding\"))\n    (clinical_finding (snomed_concept \"Lower abdominal pain\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain on movement of cervix\" \"finding\"))\n\n    (clinical_finding (snomed_concept \"Pruritus of vagina\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Erythema of vulva\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Scratch marks\" \"finding\") (finding_site (snomed_concept \"Vulval structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Inflammation of vulva\" \"disorder\"))\n\n    (clinical_finding (snomed_concept \"Erythema\" \"finding\") (finding_site (snomed_concept \"Cervix uteri structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Cervix uteri structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Cervical discharge\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable LAP syndrome (vaginal discharge)\"\n  (diagnosis\n    (snomed_concept \"Female pelvic inflammatory disease\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Vaginal discharge\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain on movement of cervix\" \"finding\"))\n    (or\n      ;; Sexually active → lower abdominal pain or pain on moving cervix → pain on moving cervix = Yes\n      (clinical_finding (snomed_concept \"Sexually active\" \"finding\"))\n      ;; Not sexually active → no curd-like/vulval signs → BV → speculum: pain on moving cervix = Yes\n      (and (no (clinical_finding (snomed_concept \"Sexually active\" \"finding\")))\n           (no (clinical_finding (snomed_concept \"Erythema of vulva\" \"disorder\")))\n           (no (clinical_finding (snomed_concept \"Scratch marks\" \"finding\") (finding_site (snomed_concept \"Vulval structure\" \"body structure\"))))\n           (no (clinical_finding (snomed_concept \"Inflammation of vulva\" \"disorder\"))))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable cervicitis (vaginal discharge)\"\n  (diagnosis\n    (snomed_concept \"Inflammation of cervix\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Vaginal discharge\" \"finding\"))\n    (or\n      ;; Sexually active, no to both lower abdominal pain and pain on moving cervix\n      (and (clinical_finding (snomed_concept \"Sexually active\" \"finding\"))\n           (no (clinical_finding (snomed_concept \"Lower abdominal pain\" \"finding\")))\n           (no (clinical_finding (snomed_concept \"Pain on movement of cervix\" \"finding\"))))\n      ;; Not sexually active → BV path → no pain on moving cervix → cervical redness/swelling/discharge\n      (and (no (clinical_finding (snomed_concept \"Sexually active\" \"finding\")))\n           (no (clinical_finding (snomed_concept \"Erythema of vulva\" \"disorder\")))\n           (no (clinical_finding (snomed_concept \"Scratch marks\" \"finding\") (finding_site (snomed_concept \"Vulval structure\" \"body structure\"))))\n           (no (clinical_finding (snomed_concept \"Inflammation of vulva\" \"disorder\")))\n           (no (clinical_finding (snomed_concept \"Pain on movement of cervix\" \"finding\")))\n           (or (clinical_finding (snomed_concept \"Erythema\" \"finding\") (finding_site (snomed_concept \"Cervix uteri structure\" \"body structure\")))\n               (clinical_finding (snomed_concept \"Swelling\" \"finding\") (finding_site (snomed_concept \"Cervix uteri structure\" \"body structure\")))\n               (clinical_finding (snomed_concept \"Cervical discharge\" \"finding\"))))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable bacterial vaginosis (vaginal discharge)\"\n  (diagnosis\n    (snomed_concept \"Bacterial vaginosis\" \"disorder\")\n    probable\n  )\ , "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 64 – Abnormal vaginal discharge: flowchart\n\nSource: APC 2026 page 64, red box and \"Approach to a patient with an\nabnormal vaginal discharge not needing urgent attention\".\n\n```mermaid\nflowchart TD\n    VD[\"Vaginal discharge\"] --> RB{\"Red box: any of recent delivery/TOP/miscarriage,<br/>pregnant or missed/overdue period, abnormal vaginal bleeding,<br/>temperature ≥ 38°C, pulse &gt; 100, Shock/SBP &lt; 80,<br/>abdominal mass, peritonitis (guarding, rigidity, rebound tenderness)?\"}\n    RB -- Yes --> URG[\"Urgent: manage and refer urgently<br/>for gynaecological/surgical assessment\"]\n    RB -- No --> APP[\"Approach (not needing urgent attention):<br/>assess/advise ↻62, test for HIV ↻124\"]\n    APP --> SA{\"Has patient been sexually active<br/>in the last 3 months?\"}\n    SA -- Yes --> Y1{\"Lower abdominal pain or<br/>pain on moving the cervix?\"}\n    Y1 -- \"No to both\" --> CERV1[\"Treat for cervicitis<br/>(+ vaginal candidiasis if discharge itchy, curd-like<br/>or vulva red, scratched or inflamed)\"]\n    Y1 -- \"Yes to either\" --> Y2{\"Pain on moving the cervix?\"}\n    Y2 -- No --> UTI[\"Assess for UTI → 69\"]\n    Y2 -- Yes --> LAP[\"Treat for lower abdominal pain (LAP) syndrome\"]\n    SA -- No --> N1{\"Discharge curd-like or vulva<br/>red, scratched or inflamed?\"}\n    N1 -- Yes --> CAND[\"Treat for vaginal candidiasis\"]\n    N1 -- No --> BV[\"Treat for bacterial vaginosis;<br/>perform vaginal and speculum examinations\"]\n    BV --> N2{\"Pain on moving the cervix?\"}\n    N2 -- Yes --> LAP\n    N2 -- No --> N3{\"Cervical redness/swelling/discharge?\"}\n    N3 -- Yes --> CERV2[\"Treat for cervicitis\"]\n    N3 -- No --> BV2[\"Continue bacterial vaginosis treatment\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `Vaginal discharge` (finding) | `Check for abnormal vaginal discharge findings` (task trigger) |\n| Red box | `(and Vaginal discharge (or …8 red-box items…))`; Shock/SBP < 80 as `(or Shock (< SBP 80))`; peritonitis as the disorder or its three listed signs; overdue period as `Menstrual period late`; recent delivery/TOP/miscarriage with the `Recent` qualifier | `Urgent: vaginal discharge with danger signs` |\n| SA = Yes → Y1 = No to both → Treat for cervicitis | Discharge, sexually active, `(no Lower abdominal pain)`, `(no Pain on movement of cervix)` | `Diagnose probable cervicitis (vaginal discharge)`, first branch |\n| … → \"If discharge itchy, curd-like or vulva red, scratched or inflamed: add vaginal candidiasis\" | Same branch **and** any of `Pruritus of vagina`, vulval erythema, vulval scratch marks, vulval inflammation (curd-like: no SNOMED concept) | `Diagnose probable vaginal candidiasis (vaginal discharge)`, second branch |\n| SA = Yes → Y1 = Yes → Y2 = No → Assess for UTI → 69 | Discharge, sexually active, lower abdominal pain, `(no Pain on movement of cervix)` | `Diagnose possible UTI (vaginal discharge, lower abdominal pain)` |\n| Y2 = Yes / N2 = Yes → Treat for LAP syndrome | Discharge, pain on moving cervix, and either sexually active, or not sexually active with no vulval signs (the path that reaches N2) | `Diagnose probable LAP syndrome (vaginal discharge)` |\n| SA = No → N1 = Yes → Treat for vaginal candidiasis | Discharge, `(no Sexually active)`, any of vulval erythema / scratch marks / inflammation (curd-like: no SNOMED concept) | `Diagnose probable vaginal candidiasis (vaginal discharge)`, first branch |\n| SA = No → N1 = No → Treat for bacterial vaginosis | Discharge, `(no Sexually active)`, none of the vulval signs | `Diagnose probable bacterial vaginosis (vaginal discharge)` |\n| N2 = No → N3 = Yes → Treat for cervicitis | BV path **and** `(no Pain on movement of cervix)` **and** any of cervical erythema / swelling / discharge | `Diagnose probable cervicitis (vaginal discharge)`, second branch |\n| N3 = No → Continue BV treatment | Covered by the BV rule (BV is treated on the whole SA = No / N1 = No path) | `Diagnose probable bacterial vaginosis (vaginal discharge)` |\n\n## Notes\n\n- \"In the last 3 months\" is not modelled: a recorded `Sexually active` finding is taken as\n  current (no SNOMED concept for exactly 3 months; see remaining questions).\n- \"Curd-like\" discharge has no SNOMED concept, so both curd-like branches fire only on the vulval\n  signs (and, in the sexually-active branch, itching).\n- Diagnosis rules do not require the absence of the red-box items (\"not needing urgent attention\"),\n  following the gold standard's style; the urgent priority is evaluated independently.\n", "questions": "# Page 64 – Abnormal vaginal discharge: remaining questions\n\n## Decisions made\n\n- **Trigger.** The check_for task and the urgent rule are triggered by `Vaginal discharge` (finding).\n  It is not a recorded common symptom or warning sign, so the rules only fire once a health worker\n  records it.\n- **Shock/SBP < 80** is encoded as `(or Shock (< SBP 80))` on this page only, per the all-pages\n  decision. Footnote 1 (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30, confusion/restlessness,\n  weakness, shock likely\") is not expanded into a shock definition.\n- **Pulse > 100** is strict, as the red box writes it.\n- **Recent delivery/TOP/miscarriage**: `Delivery finding`, `Induced termination of pregnancy` and\n  `Miscarriage`, each with the `Recent` qualifier. (Builder B used `Postpartum state` for recent\n  delivery; the reconciler kept `Delivery finding` + `Recent`, which follows the page's words and\n  VHA's existing vocabulary.)\n- **Pregnant or missed/overdue period**: `Pregnancy`, `Missed period` or `Menstrual period late`\n  (for \"overdue\").\n- **Peritonitis (guarding, rigidity, rebound tenderness)** is encoded as an `or` of the\n  `Peritonitis` disorder and the three listed signs.\n- **\"Treat for X\" read as probable X**, as the gold standard does for \"Treat for anaphylaxis\":\n  cervicitis (`Inflammation of cervix`), bacterial vaginosis, vaginal candidiasis\n  (`Candidiasis of vagina`) and LAP syndrome (`Female pelvic inflammatory disease`).\n- **\"Assess for UTI → 69\"** is read as \"consider UTI\": a possible diagnosis of\n  `Urinary tract infectious disease`.\n- **LAP syndrome** comes from both paths that reach \"pain on moving the cervix = Yes\". These are\n  sexually active, or not sexually active with a vulva that is not red, scratched or inflamed.\n- **Bacterial vaginosis** covers the whole path \"not sexually active → not curd-like/vulva not\n  red, scratched or inflamed\". The page starts BV treatment there before the speculum examination,\n  and the later branches add treatment on top of it.\n- The diagnosis rules do not require the absence of the red-box items (\"not needing urgent\n  attention\"). This follows the gold standard, and the urgent priority is evaluated separately.\n- **Itchy discharge** is `Pruritus of vagina` (disorder), a precoordinated concept.\n- **Pain on moving the cervix** is `Pain on movement of cervix` (finding).\n- Cervical redness and swelling and vulval scratch marks use `finding_site` on a\n  general finding (Erythema, Swelling, Scratch marks), because there is no\n  precoordinated concept. All body structures were checked with `snomed exists`.\n\n## Could not model\n\n- **\"In the last 3 months\"** (sexual activity): the finding `Sexually active` is taken as current.\n  The rules fire more often than the page intends for someone who was sexually active more than\n  3 months ago. An onset comparison would mean \"became sexually active within 3 months\", which is\n  wrong.\n- **\"Curd-like\" discharge**: no concept, so it is left out. Both candidiasis branches fire less\n  often than intended, because a curd-like discharge with normal vulva is not caught. On the\n  not-sexually-active path, such a patient falls to bacterial vaginosis instead.\n- The HIV testing, PrEP and \"assess and advise ↻ 62\" steps, as well as all drugs, partner\n  notification, return and referral advice, are management.\n\n## SNOMED gaps\n\n- Curd-like vaginal discharge: none found (\"curd\" only finds substances; `Finding of consistency\n  of vaginal discharge` has only `Leukorrhea` as a child).\n- Lower abdominal pain (LAP) syndrome: no concept; `Female pelvic inflammatory disease` used.\n- Sexually active in the last 3 months: only \"last month\", \"last six months\" and \"last year\"\n  exist; `Sexually active` used.\n- Overdue period: `Menstrual period late` used.\n- Cervicitis: no FSN \"Cervicitis\"; `Inflammation of cervix` used.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\n- `PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR`:\n  `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Scratch marks\" \"finding\") (snomed_concept \"No\" \"qualifier value\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Vulval structure\" \"body structure\"))))`.\n  This is a checker artefact: the gate's `(no X)` regex expects the `No` qualifier last, but here\n  the `finding_site` attribute comes after it. The positive form is in the check_for, so in\n  substance the finding is checked for.\n\n## Questions for a clinician\n\n- Is `Female pelvic inflammatory disease` an acceptable diagnosis for \"LAP syndrome\"? Or should\n  the syndromic endpoint stay undiagnosed?\n- Should the syndromic \"Treat for …\" endpoints be `probable` diagnoses, or only `possible`?\n- Is \"discharge itchy\" better recorded as `Pruritus of vagina` (used) or `Pruritus of vulva`?\n- In the not-sexually-active l discharge with danger signs", "text": "'Delivery finding' + Recent stands in for 'recent delivery'. It is a hierarchy header whose children include 'Mother not delivered' and neonatal-condition findings, and descendants match automatically in due_to. 'Postpartum state' (finding) or 'Mother delivered' (finding) + Recent would be the precise concept.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "(none) footnote 1", "text": "'Shock likely' (SBP < 80, pulse >= 100, RR > 30, confusion/restlessness, weakness) has no probable rule, so 'Shock' in the priority rule is only ever nurse-recorded. Borderline scope; low impact because the vitals already trigger Urgent.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Check for abnormal vaginal discharge findings / all diagnosis rules", "text": "'Sexually active in the last 3 months' is encoded as bare 'Sexually active'; the 3-month window is lost. Probably not representable in the language, but the check_for item carries no hint of the window for the nurse.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable LAP syndrome (vaginal discharge)", "text": "'LAP syndrome' is mapped to 'Female pelvic inflammatory disease'. There is no syndromic LAP concept in SNOMED and PID is the usual correlate, but the mapping is a judgment call that should be confirmed by a clinician.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable cervicitis (vaginal discharge) / Check for abnormal vaginal discharge findings", "text": "Cervical redness and swelling use finding_site on 'Cervix uteri structure'. The grammar says finding_site findings must be declared in finding_site_findings; that declaration cannot be checked from the inputs here, so these could fail to resolve at load time even though the body structure exists in SNOMED.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "high", "ref": "All diagnosis rules", "text": "Curd-like discharge (the page's main discriminator for candidiasis in the non-sexually-active branch and an add-on trigger in the sexually active branch) is not encoded and not in check_for. A non-sexually-active patient with curd-like discharge and normal vulva gets BV probable instead of candidiasis.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable bacterial vaginosis", "text": "Fires with cervical pain or cervical redness/swelling/discharge present in non-sexually-active patients, where the page moves on to LAP or cervicitis; BV and LAP/cervicitis become co-probable. Also lacks the curd-like exclusion.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable cervicitis / candidiasis / BV / LAP", "text": "'Sexually active in the last 3 months' encoded as bare 'Sexually active' with no time window.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable LAP syndrome", "text": "Mapped to Female pelvic inflammatory disease; plausible but LAP is a syndrome. Non-SA branch lacks curd-like exclusion.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Task check_for", "text": "Temperature, pulse and SBP are used by the priority rule but absent from check_for (probably by design as measurements). Vulva 'Scratch marks' uses generic concept plus finding_site where 'Scratch marks on vulva' exists. Pruritus of vagina is used for 'discharge itchy', which is a different thing (itchy discharge vs vaginal itch).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose possible UTI", "text": "Page says 'Assess for UTI' (a cross-reference, not 'consider UTI'); a possible diagnosis is a reasonable but interpretive encoding.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "high", "ref": "Diagnose probable vaginal candidiasis / bacterial vaginosis / LAP syndrome / cervicitis (non-sexually-active branches)", "text": "'Discharge curd-like' is missing from the whole file. On the 'not sexually active' branch, curd-like discharge with a normal vulva gives probable BV, and possibly cervicitis or LAP, instead of candidiasis. In the sexually active no-LAP/no-CMT branch, curd-like discharge does not add candidiasis. SNOMED has no exact concept, but the gap is neither encoded nor flagged in the rules.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Urgent: vaginal discharge with danger signs (and the check_for)", "text": "'Delivery finding' is a grouper whose descendants include 'Mother not delivered', 'Delivery problem' and labor-stage findings. With descendant matching, findings that are not a recent delivery trigger Urgent. Use 'Mother delivered' or 'Postpartum state' with Recent.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "All rules (anchor)", "text": "'Vaginal discharge' includes 'Normal vaginal secretions' and 'Hydrorrhea gravidarum' as descendants, but the page is about abnormal discharge. Combined with 'Pregnancy' in the Urgent list, normal pregnancy secretions would trigger Urgent.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "All diagnosis rules using 'Sexually active'", "text": "The page's 'in the last 3 months' window is dropped. Remote sexual activity routes the patient to the STI branch.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Urgent: vaginal discharge with danger signs", "text": "Footnote 1 ('shock likely' criteria) has no probable-Shock rule, so 'Shock' depends on direct entry.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Check for abnormal vaginal discharge findings", "text": "The page's not-sexually-active decision node is 'is discharge curd-like OR are vulva red, scratched or inflamed?', and the sexually-active cervicitis box repeats 'If discharge itchy, curd-like or vulva red...'. Curd-like discharge is a discriminating finding used twice on the page and is absent from check_for and from every rule. No exact SNOMED concept exists; nearest findings are 'White vaginal discharge' or 'Creamy vaginal discharge' (finding), which should be added (and the gap recorded). Also c002: 'Delivery finding' should be 'Postpartum state' (finding).", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable LAP syndrome (vaginal discharge)", "text": "Type (probable from 'Treat for ...') and branch 1 (sexually active + pain on moving the cervix) are faithful. Branch 2 (not sexually active -> BV path -> exam -> cervix pain) omits the page's 'discharge curd-like' gate: on the page a curd-like discharge goes to the candidiasis column and never reaches the speculum-exam questions. Diagnosis concept 'Female pelvic inflammatory disease' for 'LAP syndrome' is an acceptable substitute but should be noted.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable cervicitis (vaginal discharge)", "text": "Both branches match the page's flow (sexually active with neither pain; not sexually active, no vulval signs, no cervix pain, cervical redness/swelling/discharge). Branch 2 omits the 'discharge curd-like' gate as above.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable bacterial vaginosis (vaginal discharge)", "text": "Page: not sexually active AND No to 'is discharge curd-like or are vulva red, scratched or inflamed?' -> BV. The rule only negates the three vulval findings, so a patient with a curd-like discharge and a normal vulva gets probable BV instead of probable candidiasis. Needs (no <curd-like discharge finding>) added.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable vaginal candidiasis (vaginal discharge)", "text": "Branch structure follows the page (not sexually active + vulval signs; sexually active + no pains + itchy/vulval signs), but 'discharge curd-like' is missing from both branches' or-lists, so curd-like discharge alone (the classic candidiasis presentation the page names first) never fires the diagnosis.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Check for abnormal vaginal discharge findings", "text": "Task check_for mixes urgent danger signs with branch questions but omits the red-box measurements (temperature, pulse, SBP); acceptable but incomplete. Type is plausible (page approach asks these questions).", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable bacterial vaginosis (vaginal discharge)", "text": "Page's not-active branch requires 'discharge NOT curd-like and vulva not red/scratched/inflamed'. Curd-like is not encoded, so BV fires on curd-like discharge with a normal vulva where the page says candidiasis.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable vaginal candidiasis (vaginal discharge)", "text": "Not-active branch omits 'curd-like' discharge as a trigger, so candidiasis is missed when curd-like discharge is the only sign. Active branch omits 'curd-like' as well (only itch encoded).", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "high", "ref": "Check for abnormal vaginal discharge findings", "text": "Omits 'discharge curd-like', a discriminating finding the page uses at two branch points (non-sexually-active candidiasis vs BV; sexually-active add-on candidiasis). Sexually active lacks the 3-month window. 'Recent delivery' uses the broad 'Delivery finding' grouper.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 64, "slug": "64-abnormal-vaginal-discharge", "kind": "rule", "priority": "medium", "ref": "Diagnose probable LAP syndrome (vaginal discharge)", "text": "Logic matches both paths (sexually active + CMT; not active + no vulval signs <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};

const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>

    <span><button id="exp">export decisions</button>${helpButton("export")}</span>

  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
