inding\"))\n    (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\"))\n\n    ;; Mpox: lesions at other sites and associated symptoms\n    (clinical_finding (snomed_concept \"Lesion of genitalia\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Lesion\" \"morphologic abnormality\") (finding_site (snomed_concept \"Anal structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Lesion of rectum\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Oral lesion\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Lesion of eye\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Backache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Lymphadenopathy\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Fatigue\" \"finding\"))\n    (clinical_finding (snomed_concept \"Sore throat\" \"finding\"))\n    (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Cough\" \"finding\"))\n\n    ;; Drug rash: medication started (onset of the exposure is compared in the rule)\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))\n\n    ;; Syphilis and HIV tests, and HIV risk\n    (clinical_finding (snomed_concept \"Syphilis titer detected\" \"finding\"))\n    (clinical_finding (snomed_concept \"Syphilis titer not detected\" \"finding\"))\n    (clinical_finding (snomed_concept \"Human immunodeficiency virus not detected\" \"finding\"))\n    (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Human immunodeficiency virus\" \"organism\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable tick bite fever (generalised rash page)\"\n  (diagnosis\n    (snomed_concept \"Spotted fever group rickettsial disease\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (clinical_finding (snomed_concept \"Generalized rash\" T --> MPOX{\"Unexplained rash or lesion/s of skin/genitals/anus/rectum/mouth/eyes<br/>and ≥ 1 of: headache/backache/body pain, swollen lymph nodes,<br/>temperature &gt; 38.5°C, fatigue, sore throat/nasal congestion/cough?\"}\n    MPOX -- Yes --> MP[\"Consider mpox → 40\"]\n    START --> DRUG{\"Started any medication in the past 3 months?\"}\n    DRUG -- Yes --> DR[\"Consider drug rash ⮌ 88\"]\n    START --> TEST[\"Test for syphilis ⮌ 66 and HIV ⮌ 124\"]\n    TEST --> SR[\"Syphilis reactive\"]\n    TEST --> HP[\"HIV positive\"]\n    TEST --> NEG[\"Syphilis and HIV negative\"]\n    SR --> SS[\"Secondary syphilis likely<br/>Treat syphilis ⮌ 67\"]\n    HP --> HC[\"Give routine HIV care ⮌ 126\"]\n    NEG --> RISK{\"Was patient at risk¹ of HIV in the past 6 weeks?\"}\n    RISK -- Yes --> SERO[\"Rash may be part of HIV seroconversion illness.<br/>Repeat HIV test after 6 weeks. Encourage safe sex.\"]\n    RISK -- No --> VIR[\"Non-specific viral rash likely\"]\n    START -.-> REF[\"If rash persists ≥ 2 weeks or diagnosis uncertain, discuss/refer\"]\n```\n\n¹ HIV can be transmitted via exposure to infectious body fluids, through sexual contact, occupational\nor non-occupational exposure, sharing needles, contact with used condom and exposure to blood.\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Presenting complaint | `Generalized rash` (disorder) as the trigger | `Check for causes of generalised non-itchy rash` |\n| Red box (pointer to 82) | Not modelled here; page 82 owns the urgent-attention logic | – |\n| TICK = Yes | `(and Generalized rash (or Tick bite, Ixodidae infestation, Argasidae infestation) (or Headache, temperature ≥ 38, Generalized aches and pains))` | `Diagnose probable tick bite fever (generalised rash page)` |\n| MPOX = Yes | `(and (or Skin lesion, lesion of genitalia/anus/rectum/mouth/eye) (or Headache, Backache, Generalized aches and pains, Lymphadenopathy, temperature > 38.5, Fatigue, Sore throat, Nasal congestion, Cough))` | `Diagnose possible mpox (generalised rash page)` |\n| DRUG = Yes | Rash **and** exposure to `Drug or medicament` with onset within 3 months | `Diagnose possible drug rash (generalised rash page)` |\n| Syphilis reactive | Rash **and** `Syphilis titer detected` | `Diagnose probable secondary syphilis (generalised rash page)` |\n| HIV positive | Management only (routine HIV care) | – |\n| Syphilis and HIV negative → RISK = Yes | Rash **and** `Syphilis titer not detected` **and** `Human immunodeficiency virus not detected` **and** HIV exposure with onset within 6 weeks | `Diagnose possible HIV seroconversion illness (generalised rash page)` |\n| Syphilis and HIV negative → RISK = No | Same negatives **and** (HIV exposure recorded as No, **or** exposure onset at least 6 weeks ago) | `Diagnose probable non-specific viral rash (generalised rash page)` |\n| Persists ≥ 2 weeks / uncertain | Referral step, not modelled | – |\n", "questions": "# Page 87 – Generalised non-itchy rash: remaining questions\n\n## Decisions made\n\n- **Red box is pointer-only** (\"Check if the patient needs urgent attention ⮌ 82\"). No priority\n  evaluation on this page; the element is accounted for as `cross_reference_only`. The page's own\n  diagnostic logic (bullets and the syphilis/HIV flowchart) is encoded.\n- **Trigger** is `Generalized rash` (disorder). \"Non-itchy\" is not required: `(no Itching)` would only\n  fire when itch was explicitly answered No. So the check_for also fires for itchy generalised rash.\n  The rash is not a recorded common symptom or warning sign.\n- **Tick bite fever likely → probable `Spotted fever group rickettsial disease`**, the common parent of\n  `African tick bite fever` and `South African tick-bite fever` (both are \"tick bite fever\" in SA).\n  \"Tick present\" = `Infestation caused by Ixodidae` or `… Argasidae` (no generic tick-infestation concept).\n  \"Body pain\" = `Generalized aches and pains`.\n- **The tick-bite-fever rule also requires the generalised rash** (page context, as in every other\n  diagnosis rule here; reconciler merge from build A).\n- **Consider mpox → possible `Monkeypox`.** Rash/lesion part: `Skin lesion` (the generalised rash is a\n  descendant, so it matches) or lesions of genitalia, anus (`Lesion` morphology + finding_site\n  `Anal structure`), rectum, mouth (`Oral lesion`), eye. Temperature is strictly `> 38.5` °C as written.\n- **Consider drug rash → possible `Eruption caused by drug`**: rash and exposure to `Drug or medicament`\n  with onset within 3 months, written `(<= (onset …) (time_ago 3 months))`. The named examples (antiseizure\n  medication, ART, TB medication, co-trimoxazole, TPT) are \"such as\" examples, covered by descendants.\n- **Syphilis reactive → probable `Secondary syphilis`** (rash and `Syphilis titer detected`). Applies\n  whatever the HIV result is, as the page's branches are side by side.\n- **HIV positive → \"Give routine HIV care\"** is management only; not encoded.\n- **Syphilis and HIV negative** = `Syphilis titer not detected` and `Human immunodeficiency virus not detected`.\n  - At risk of HIV in past 6 weeks = exposure to `Human immunodeficiency virus` (organism) with onset\n    `<=` 6 weeks → possible `Acute human immunodeficiency virus infection` (\"may be part of HIV\n    seroconversion illness\").\n  - Not at risk → probable `Viral exanthem` (\"Non-specific viral rash likely\"): exposure answered No,\n    or exposure onset `>=` 6 weeks ago.\n- **Drug rash evidence** is exposure to `Drug or medicament` with an onset, not a\n  \"New medication commenced\" finding: the exposure pattern is the gold standard's, and its onset is\n  what the 3-month comparison needs (reconciler chose B over A).\n- Time comparisons use only `<=` / `>=`, per the all-pages decision.\n- No `measure` task: temperature is a routine vital.\n\n## Could not model\n\n- \"Unexplained\" rash (mpox): not expressible; the mpox rule fires more often than the page intends.\n- \"Patient may have temperature ≥ 38°C, headache, lymphadenopathy, muscle pain/body aches\" under the\n  viral rash box is descriptive, not a criterion; not encoded.\n- \"Rash often on palms and soles. May have wart-like lesions on genitals and patchy hair loss\" is\n  descriptive of secondary syphilis; not used as criteria.\n- \"If rash persists ≥ 2 weeks or diagnosis uncertain, discuss/refer\", \"Repeat HIV test after 6 weeks\",\n  safe sex advice, paracetamol, treat syphilis, routine HIV care: management/referral steps.\n- \"Tick present\" uses hard- and soft-tick infestation concepts; a tick seen but not recorded as an\n  infestation will not match.\n- Exactly 6 weeks: the `<=` and `>=` onset comparisons overlap at the boundary instant; negligible.\n- \"Test for syphilis and HIV\" is an instruction to test; only the results are used as evidence.\n\n## SNOMED gaps\n\n- No generic \"tick present / tick infestation\" concept; used Ixodidae and Argasidae infestations.\n- No precoordinated \"lesion of anus\" disorder; used `Lesion` (morphologic abnormality) with finding_site\n  `Anal structure` (body structure; checked with `snomed exists`).\n- \"Syphilis reactive\" / \"negative\": no reactive-test finding; used `Syphilis titer detected` / `not detected`.\n- \"Body pain\": used `Generalized aches and pains`. \"Non-specific viral rash\": used `Viral exanthem`.\n- \"Tick bite fever\" has no exact concept; used the spotted-fever-group parent.\n- \"At risk of HIV\" has no concept matching the footnote; used the exposure-to-HIV-organism finding pattern.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Is `Spotted fever group rickettsial disease` acceptable for \"tick bite fever\", or should it be the\n  specific `African tick bite fever` (build A's choice) or `Boutonneuse fever` (R. conorii, \"South\n  African tick-bite fever\")? The parent covers both but also non-African rickettsioses.\n- Should the check_for require the rash to be non-itchy (i.e. only fire when itch is answered No)?\n- Does the intake record syphilis/HIV results as `Syphilis titer detected/not detected` and\n  `Human immunodeficiency virus not detected`, or as test procedures with values? If the latter, the\n  syphilis and viral-rash rules need a different evidence form.\n- Is \"Syphilis titer detected\" an acceptable recording of a reactive syphilis test (RPR/rapid test)?\n- Should \"HIV positive\" produce a diagnosis (e.g. probable HIV infection) here, or is routine HIV\n  care on page 126 enough?\n- Is the \"No\" branch (no HIV risk) correctly read as \"no exposure, or exposure more than 6 weeks ago\"?\n- Should the mpox check ask about lesions of genitals/anus/rectum/mouth/eyes when the patient already\n  has a generalised rash (which already satisfies the \"rash or lesion\" part)? They are asked because the\n  page lists them, but they cannot change the outcome on this page.\n- Will an HIV-exposure finding record an onset date for the 6-week comparison? Without it, the\n  seroconversion rule cannot fire and the viral-rash rule fires only on an explicit No.\n", "claims": [{"claim_id": "c001", "rule": "Check for causes of generalised non-itchy rash", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generalized rash\" \"disorder\"))", "element_keys": ["p87-7bd6d699"], "quote": "GENERALISED NON-ITCHY RASH"}, {"claim_id": "c002", "rule": "Check for causes of generalised non-itchy rash", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Tick bite\" \"disorder\"))", "element_keys": ["p87-89554e4e"], "quote": "If tick bite"}, {"claim_id": "c003", "rule": "Check for causes of generalised non-itchy rash", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Infestation caused by Ixodidae\" \"disorder\"))", "element_keys": ["p87-89554e4e"], "quote": "tick present"}, {"claim_id": "c004", " adache, >= Body temperature 38, Generalized aches and pains): correct, right comparator and unit. (3) 'tick bite fever likely' = probable Spotted fever group rickettsial disease: correct. Closer children exist (African tick bite fever, South African tick-bite fever/Boutonneuse fever) but the page does not distinguish R. africae from R. conorii, so the common parent is the right choice. (4) mpox 'unexplained rash or lesion/s of skin/genitals/anus/rectum/mouth/eyes' = or(Skin lesion, Lesion of genitalia, Lesion+finding_site Anal structure, Lesion of rectum, Oral lesion, Lesion of eye): correct; Generalized rash is_a Skin lesion so the presenting rash satisfies it; there is no precoordinated anal-lesion disorder so finding_site is the right form. (5) '>= 1 of headache/backache/body pain, swollen lymph nodes, temperature > 38.5C, fatigue, sore throat/nasal congestion/cough' = or of nine items with > 38.5: correct, all nine present. (6) 'consider mpox' = possible Monkeypox: correct (Mpox is a synonym of Monkeypox in this release). (7) 'started any medication ... in the past 3 months' = (<= (onset exposure to Drug or medicament) (time_ago 3 months)): correct direction per the briefing's convention (<= time_ago N = within the last N); the named examples (antiseizure, ART, TB drugs, co-trimoxazole, TPT) are covered by the generic substance. (8) 'consider drug rash' = possible Eruption caused by drug: correct. (9) 'Test for syphilis and HIV' is a test order (management); its results are checked for as Syphilis titer detected / not detected and HIV not detected. The positive HIV result is not checked for; see p87-fd394714.", "evidence": ["Diagnose probable tick bite fever (generalised rash page) :: (and (clinical_finding (snomed_concept \"Generalized rash\" \"disorder\")) (or (clinical_finding (snomed_concept \"Tick bite\" \"disorder\")) (clinical_finding (snomed_concept \"Infestation caused by Ixodidae\" \"disorder\")) (clinical_finding (snomed_concept \"Infestation caused by Argasidae\" \"disorder\"))) (or (clinical_finding (snomed_concept \"Headache\" \"finding\")) (>= (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38) (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\"))))", "Diagnose possible mpox (generalised rash page) :: (and (or (clinical_finding (snomed_concept \"Skin lesion\" \"disorder\")) (clinical_finding (snomed_concept \"Lesion of genitalia\" \"disorder\")) (clinical_finding (snomed_concept \"Lesion\" \"morphologic abnormality\") (finding_site (snomed_concept \"Anal structure\" \"body structure\"))) (clinical_finding (snomed_concept \"Lesion of rectum\" \"disorder\")) (clinical_finding (snomed_concept \"Oral lesion\" \"disorder\")) (clinical_finding (snomed_concept \"Lesion of eye\" \"disorder\"))) (or (clinical_finding (snomed_concept \"Headache\" \"finding\")) (clinical_finding (snomed_concept \"Backache\" \"finding\")) (clinical_finding (snomed_concept \"Generalized aches and pains\" \"finding\")) (clinical_finding (snomed_concept \"Lymphadenopathy\" \"disorder\")) (> (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38.5) (clinical_finding (snomed_concept \"Fatigue\" \"finding\")) (clinical_finding (snomed_concept \"Sore throat\" \"finding\")) (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\")) (clinical_finding (snomed_concept \"Cough\" \"finding\"))))", "Diagnose possible drug rash (generalised rash page) :: (and (clinical_finding (snomed_concept \"Generalized rash\" \"disorder\")) (<= (onset (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))) (time_ago 3 months)))", "Check for causes of generalised non-itchy rash :: (check_for (clinical_finding (snomed_concept \"Tick bite\" \"disorder\")) ... (clinical_finding (snomed_concept \"Syphilis titer detected\" \"finding\")) (clinical_finding (snomed_concept \"Syphilis titer not detected\" \"finding\")) (clinical_finding (snomed_concept \"Human immunodeficiency virus not detected\" \"finding\")) ...)"], "confidence": "high"}, {"element_key": "p87-fd394714", "scope": "borderline", "scope_reason": "Two flowchart decision nodes fragmented into one element. 'Syphilis reactive' is a diagnostic criterion (it alone yields 'Secondary syphilis likely'). 'HIV positive' is a branch whose only outcome is a management step ('Give routine HIV care'), so whether it needs a recorded finding is arguable.", "verdict": "partial", "parts_missing": ["'HIV positive' branch: no (clinical_finding (snomed_concept \"Human immunodeficiency virus detected\" \"finding\")) anywhere in the file, although the concept exists and the page says 'Test for ... HIV'."], "problem": "'Syphilis reactive' is encoded correctly as Syphilis titer detected in the probable secondary syphilis rule. The HIV-positive branch is not represented. This is defensible: the branch leads only to routine HIV care (management, out of scope), and test constraint 2 forbids a check_for item that no rule consumes. The cost is that the HIV test result can only be recorded as 'not detected', which is an odd check list for a page that says to test for HIV.", "evidence": ["Diagnose probable secondary syphilis (generalised rash page) :: (and (clinical_finding (snomed_concept \"Generalized rash\" \"disorder\")) (clinical_finding (snomed_concept \"Syphilis titer detected\" \"finding\")))"], "confidence": "medium"}, {"element_key": "p87-a7e06b39", "scope": "in_scope", "scope_reason": "Flowchart decision node: both tests negative gates the HIV-risk question and both downstream conclusions.", "verdict": "correct", "parts_missing": [], "problem": "Both 'Syphilis titer not detected' and 'Human immunodeficiency virus not detected' are required (and) in the seroconversion rule and the viral rash rule, matching the page.", "evidence": ["Diagnose possible HIV seroconversion illness (generalised rash page) :: (clinical_finding er)\" \"qualifier value\") (snomed_concept \"Human immunodeficiency virus\" \"organism\"))) (time_ago 6 weeks))", "Diagnose probable non-specific viral rash (generalised rash page) :: (or (no (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Human immunodeficiency virus\" \"organism\"))) (>= (onset (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Human immunodeficiency virus\" \"organism\"))) (time_ago 6 weeks)))"], "confidence": "high"}, {"element_key": "p87-9c7e5806", "scope": "out_of_scope", "scope_reason": "flowchart_routing: the 'Yes' / 'No' labels of the HIV-risk question; the logic they route is judged under p87-e1419590.", "verdict": "", "parts_missing": [], "problem": "", "evidence": [], "confidence": "high"}, {"element_key": "p87-dfe1467f", "scope": "in_scope", "scope_reason": "'Non-specific viral rash likely' is an 'X likely' conclusion. The rest of the element ('Patient may have temperature >= 38C, headache, lymphadenopathy, muscle pain/body aches') is descriptive ('may have'), not a criterion, and 'Reassure' / paracetamol are management steps.", "verdict": "correct", "parts_missing": [], "problem": "Probable Viral exanthem gated on Generalized rash + both tests negative + (no HIV exposure or exposure >= 6 weeks ago), which is exactly the page's path to this box. The 'may have' features are correctly not used as criteria; 'Viral exanthem' is the closest SNOMED concept to 'non-specific viral rash' (no 'nonspecific viral exanthem' concept exists). Paracetamol dosing is out of scope by design.", "evidence": ["Diagnose probable non-specific viral rash (generalised rash page) :: (diagnosis (snomed_concept \"Viral exanthem\" \"disorder\") probable) ... (and (clinical_finding (snomed_concept \"Generalized rash\" \"disorder\")) (clinical_finding (snomed_concept \"Syphilis titer not detected\" \"finding\")) (clinical_finding (snomed_concept \"Human immunodef high"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Claim expr carries a \"No\" qualifier that is not in the lisp; the lisp encodes \"no recorded HIV exposure\", which is a reasonable reading of the \"No\" answer but depends on absence of data.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "claim", "priority": "low", "ref": "c062", "text": "Diagnose probable non-specific viral rash (generalised rash page) :: (>= (onset (finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Human immunodeficiency virus\" \"organism\"))) (time_ago 6 weeks))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "Exposure at least 6 weeks ago is not 'at risk in the past 6 weeks', so it also lands on the 'No' branch.", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Page \"No\" = not at risk in the past 6 weeks; the lisp instead says exposure onset at least 6 weeks ago. Logically compatible but the page never mentions older exposure.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable non-specific viral rash (generalised rash page)", "text": "A probable rule whose HIV-exposure evidence appears only in wrapped forms: (no (finding ...)) and (>= (onset (finding ...)) (time_ago 6 weeks)). Test constraint 4 matches evidence to check_for by exact s-expression string; the check_for holds only the bare (finding (snomed_concept \"Exposure to (contextual qualifier)\" ...) (snomed_concept \"Human immunodeficiency virus\" \"organism\")). If the test does not unwrap no/onset, this reports PROBABLE DIAGNOSIS ... NOT CHECKED FOR. Also, (no ...) needs an explicit negative record; if the exposure question is simply unanswered the viral-rash conclusion never fires.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Check for causes of generalised non-itchy rash", "text": "The check list records the HIV test only as 'not detected'. 'Human immunodeficiency virus detected' exists in SNOMED and the page's HIV-positive branch is real, but no rule on the page would consume it (the branch is management only), so under test constraint 2 it was left out. Worth a clinician/maintainer decision rather than silent omission.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose possible mpox (generalised rash page)", "text": "Unlike the other four diagnosis rules, this one is not anchored to Generalized rash; it fires from any Skin lesion (or site lesion) plus one symptom, and 'Skin lesion' itself is not in the check_for although every other lesion site is. Acceptable for a 'consider' rule (and Generalized rash is_a Skin lesion so the page's own patients qualify), but inconsistent with the file's pattern.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tick bite fever (generalised rash page)", "text": "Uses the broad parent 'Spotted fever group rickettsial disease'; 'African tick bite fever' exists in SNOMED and is the South African entity. Also the rule conjoins Generalized rash although the page criterion does not itself say rash.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "task check_for vs Diagnose possible mpox", "text": "'Skin lesion' is used in the mpox rule but is not a check_for item; the check list and rule disagree.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose possible mpox", "text": "'Unexplained' is not captured, and the rule does not require absence of other explanations; mpox can fire alongside syphilis or tick bite fever. Likely acceptable for a possible-level rule.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose possible drug rash", "text": "Any drug exposure counts, with no start-of-treatment nuance or the page's named drug classes; broad but defensible.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable non-specific viral rash", "text": "Fires whenever both tests negative and no recent risk; requires tests to have been recorded, so does not fire untested, which matches the flowchart.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose possible drug rash / Diagnose possible HIV seroconversion illness / Diagnose probable non-specific viral rash", "text": "All three depend on the onset of an Exposure finding. The house standard says onset is captured when a finding is recorded, so a long-standing medication (e.g. ART for years) or an old HIV exposure recorded at this visit would get onset = now. Drug rash would then fire for every patient with any recorded medication, seroconversion would fire for any recorded HIV exposure, and non-specific viral rash could only fire on (no exposure). The logic is right only if the onset is entered explicitly.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose possible mpox (generalised rash page)", "text": "Because Generalized rash is_a Skin lesion and 'unexplained' cannot be represented, possible mpox fires for almost every generalised-rash patient who has headache, fatigue, cough or any other common symptom, including patients with a reactive syphilis result or a recent drug start. This is broader than the page intends.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "HIV seroconversion vs non-specific viral rash", "text": "The boundaries overlap: (<= onset 6 weeks) and (>= onset 6 weeks) are both true at exactly 6 weeks, so possible seroconversion and probable viral rash fire together on that day.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "All rules (due_to Generalized rash)", "text": "The 'non-itchy' part of the presenting complaint is not encoded, so these rules (e.g. probable non-specific viral rash) also fire for itchy generalised rash, which belongs on a different page. Generalized rash is not a common symptom; the rules fire only if another task records it.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable non-specific viral rash (generalised rash page)", "text": "The rule does not exclude the earlier bullets (tick bite fever, mpox, drug rash), so it can be probable alongside probable tick bite fever in the same patient. The page orders those bullets first, but it does not say explicitly that they exclude viral rash.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "check_for", "text": "'Human immunodeficiency virus detected' is not checked for, so the 'HIV positive' branch result cannot be recorded from this task. This is harmless for the rules because that branch only routes to routine HIV care.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Check for causes of generalised non-itchy rash", "text": "check_for omits Skin lesion (used by the mpox rule), the temperature thresholds, and HIV detected/positive (page has an HIV positive branch). The red box 'Check if the patient needs urgent attention (page 82)' is not encoded as a priority/pointer.", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose probable tick bite fever (generalised rash page)", "text": "Diagnosis concept is the broad group Spotted fever group rickettsial disease rather than tick bite fever; the page's bullet does not itself require rash (page context only).", "detail": [{"checker": "backward-2", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose possible mpox (generalised rash page)", "text": "Page trigger is 'unexplained rash OR lesion/s'; rule requires a lesion concept only, dropping rash and 'unexplained'. Structure and thresholds (>38.5) otherwise faithful; possible is right for 'consider'.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "rule", "priority": "medium", "ref": "Diagnose possible mpox (generalised rash page)", "text": "'consider' gives possible, and the >=1-of symptom OR is faithful, but 'unexplained' is dropped. Because Generalized rash is_a Skin lesion, every generalised rash patient with headache, fatigue, cough, etc. gets possible mpox, even when another rule explains the rash.", "detail": [{"checker": "backward-3", "severity": "low"}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (New medication commenced finding)  vs  B: (Exposure to (contextual qualifier) + Drug or medicament)", "detail": [{"choice": "B", "final": "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Drug or medicament\" \"substance\"))", "reason": "\"started any medication ... in the past 3 months\" needs an exposure with an onset; B's exposure form is the gold standard's pattern, while the onset of a 'New medication commenced' finding is a roundabout reading.", "unsettled": false}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (none)  vs  B: (Infestation caused by Ixodidae), (Infestation caused by Argasidae)", "detail": [{"choice": "B", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Infestation caused by Ixodidae\" \"disorder\")); (finding ... \"Infestation caused by Argasidae\" ...)", "reason": "The page says \"If tick bite or tick present\"; A dropped \"tick present\" entirely, B covers it with the hard- and soft-tick infestation concepts.", "unsettled": false}]}, {"page": 87, "slug": "87-generalised-non-itchy-rash", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (none)  vs  B: lesion of genitalia / anus / rectum / mouth / eye", "detail": [{"choice": "B", "final": "(Lesion of genitalia), (Lesion + finding_site Anal structure), (Lesion of rectum), (Oral lesion), (Lesion of eye)", "reason": "The page lists \"lesion/s of skin/genitals/anus/rectum/mouth/eyes\" as mpox evidence and both builds use them in the mpox rule, so the task asks for them; A omitted them only because the rash already satisfies that part (raised as a clinici sorder": {"resolves": true, "id": "724386005", "descendants": 1835, "parents": ["Genital finding (finding)", "Disorder of reproductive system (disorder)"]}, "Lesion|morphologic abnormality": {"resolves": true, "id": "52988006", "descendants": 3770, "parents": ["Morphologically abnormal structure (morphologic abnormality)"]}, "Finding site|attribute": {"resolves": true, "id": "363698007", "descendants": 0, "parents": ["Concept model object attribute (attribute)"]}, "Anal structure|body structure": {"resolves": true, "id": "53505006", "descendants": 93, "parents": ["Structure of anus and/or rectum (body structure)", "Anal region structure (body structure)"]}, "Lesion of rectum|disorder": {"resolves": true, "id": "300312006", "descendants": 150, "parents": ["Disorder of rectum (disorder)"]}, "Oral lesion|disorder": {"resolves": true, "id": "1071000119107", "descendants": 1378, "parents": ["Disorder of mouth (disorder)"]}, "Lesion of eye|disorder": {"resolves": true, "id": "301905003", "descendants": 1947, "parents": ["Anomaly of eye (disorder)"]}, "Backache|finding": {"resolves": true, "id": "161891005", "descendants": 59, "parents": ["Finding of back (finding)", "Pain of truncal structure (finding)"]}, "Lymphadenopathy|disorder": {"resolves": true, "id": "30746006", "descendants": 240, "parents": ["Disorder of lymphatic system (disorder)"]}, "Fatigue|finding": {"resolves": true, "id": "84229001", "descendants": 20, "parents": ["Energy and stamina finding (finding)", "General problem AND/OR complaint (finding)"]}, "Sore throat|finding": {"resolves": true, "id": "267102003", "descendants": 2, "parents": ["Pain in throat (finding)", "Soreness (finding)"]}, "Nasal congestion|finding": {"resolves": true, "id": "68235000", "descendants": 0, "parents": ["Nasal airway finding (finding)"]}, "Cough|finding": {"resolves": true, "id": "49727002", "descendants": 65, "parents": ["Finding of respiratory function (finding)"]}, "Exposure to (contextual qualifier)|qualifier value": {"r <header>

</header>

<details class="cropband" id="cropband" open><summary>The red box, from the e-book page <span class="hb" data-k="cropband"></span> <span style="text-transform:none;letter-spacing:0;font-weight:400">(click to hide or show; scroll inside it, or drag its bottom-right corner to resize)</span></summary><div id="crops"></div></details>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {

    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;

    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
