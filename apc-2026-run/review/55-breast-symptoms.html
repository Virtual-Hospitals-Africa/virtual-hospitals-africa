, {"id": "p55-out-e18", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Axillary lump/s • Ask about other symptoms. If recent fever with cough/sore throat 23. If skin rash/itch 82. • If reactive node from infection or skin cause, manage as on symptom pages. Reassure that lymphadenopathy should resolve with treatment. • Review in 2-4 weeks. If lymph node persists, refer.", "bbox": [39.7, 421.2, 172.0, 531.4], "key": "p55-ec0e0ba5"}, {"id": "p55-out-e19", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Breast enlargement • If only one breast enlarged, refer to breast clinic/Regional Breast Unit. • If BMI ≥ 25 156. • Review medication: antipsychotics, antidepressants, efavirenz, nifedipine, amlodipine can cause breast enlargement. Discuss with doctor. If on efavirenz, doctor to consider switch to dolutegravir 132.", "bbox": [188.5, 421.2, 318.3, 531.4], "key": "p55-f137073a"}, {"id": "p55-out-e20", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Is the patient breastfeeding?", "bbox": [368.7, 205.6, 473.0, 215.8], "key": "p55-71ba0b51"}, {"id": "p55-out-e21", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes. Mastitis likely • Give flucloxacillin1 500mg 6 hourly for 5 days. • Give paracetamol 500mg-1g 4-6 hourly (up to 4g in 24 hours) as needed up to 5 days. • Advise warm compresses. If no better after 2 days or breast abscess develops, refer same day.", "bbox": [273.5, 261.7, 618.9, 302.7], "key": "p55-b6f433cc"}, {"id": "p55-out-e22", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "No. Engorgement/blocked", "bbox": [642.7, 261.7, 748.2, 272.7], "key": "p55-26b36b9b"}, {"id": "p55-out-e23", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "duct likely • Advise frequent breastfeeds, warm compresses and to gently massage breast. • Advise to return if fever/body pain (mastitis) develops. • If symptoms persists, consider other causes and discuss/refer.", "bbox": [637.8, 271.7, 752.0, 352.7], "key": "p55-be80fdbc"}, {"id": "p55-out-e24", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Refer to breastfeeding counsellor/lactation consultant or support group. If HIV positive, give routine HIV care 126 and prevent transmission to baby 186.", "bbox": [107.6, 365.4, 683.3, 376.2], "key": "p55-39562887"}, {"id": "p55-out-e25", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Breastfeeding and painful breast/s with or without lump/s", "bbox": [406.1, 229.2, 618.6, 239.4], "key": "p55-f9488df4"}, {"id": "p55-out-e26", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Does patient have temperature ≥ 38°C or body pain?", "bbox": [415.5, 239.2, 609.2, 249.4], "key": "p55-252459e9"}, {"id": "p55-out-e27", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If HIV negative, advise to continue breastfeeding. • If HIV positive and only one breast affected, express and discard milk from affected side. Continue breastfeeding from other side. - If both breasts affected, temporarily stop feeding from breasts, express and discard breast milk. Replace feeds with formula until cracks/mastitis resolved.", "bbox": [39.7, 315.6, 606.7, 345.8], "key": "p55-19f12e2b"}, {"id": "p55-out-e28", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with breast symptoms not needing urgent attention Carefully examine both breasts including nipples and axillae. If any of the following warning signs, refer to breast clinic/Regional Breast Unit same week: • Skin changes: dimpling, ulceration, indentations or pulling (\"orange peel\" appearance) • Breast lump/s with any of: patient > 25 years, family history of breast cancer, irregular fixed lump, skin/nipple changes, nipple discharge, axillary lump", "bbox": [58.4, 129.4, 697.2, 180.8], "key": "p55-83a75454"}, {"id": "p55-out-e29", "page": 55, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Axillary lump/s with any of: skin/nipple changes, nipple discharge, breast lump/s • Nipple discharge/retraction with any of: patient ≥ 50 years, blood-stained or one-sided discharge, male, skin changes (crusts/ulcers), breast/axillary lump If none of above, continue to assess the patient below:", "bbox": [51.0, 150.6, 784.9, 192.5], "key": "p55-adca6b63"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 117.9]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAABCCAIAAABiqpa4AAAACXBIWXMAABcSAAAXEgFnn9JSAABWY0lEQVR4nO29Z3BVR9cm+n4z31Td+1XNTM2tuvPdH/e+LxwQiCBMEAgQCIsgwJhgmWBAYASYHEWOJicbMDnnZHJGCAmEABGEQELC5GxkggEDSiRx7nPOklrNDn32kY4QMqvqKZXO3r07rF69eq1nd/f+x9P/tySDwWAwGAwGg8FgMBgMBoNRtPCPQq8Bg8FgMBgMBoPBYDAYDAaD4S6Y1WIwGAwGg8FgMBgMBoPBYBQ9fMBqZS6dlrl2FoPBYDAYDAaDwWAwGAwGg/EJIn38YGNWK+tpnP3tbwwGg8FgMBgMBoPBYDAYDMYniDcntzKrxWAwGAwGg8FgMBgMBoPBKGJgVovBYDAYDAaDwWAwGAwGg1H0wKwWg8FgMBgMBoPBYDAYDAaj6IFZLQaDwWAwGAwGg8FgMBgMRtEDs1oMBoPBYDAYDAaDwWAwGIyiB2a1GAwGg8FgMBgMBoPBYDAYRQ/MajEYDAaDwWAwGAwGg8FgMIoemNViMBgMBoPBYDAYDAaDwWAUPTCrxWAwGAwGg8FgMBgMBoPBKHpgVovBYDAYDAaDwWAwGAwGg1H0wKwWg/G3RXLi7ogDy9+/uVjoNfkbwC1hHjuy7uypLYVeZ8bHxMtncdCQ2zciC70mjCKEjJfnoDY3rhz0YJ4JZ7cfjlhZ6E37yPiU57vE+B1LFo7fsnF22vN4dcqUu9FoxZOHJ4tWAy2CWvf0kUHr/sagMX79crhHpGeoG58CSD89mOG9W4cxZOb9MnrDmp+uXjpQ6A0sOEA3ILrTJ34t9Jp8Pq2IO7n55bOz+uvXLoXfvRnlqdwYHxnMan0SwChas3LayGE9Qto279W93dRJYRcT99CtW9 ": {"only_A": ["(diagnosis (snomed_concept \"Engorgement of breasts\" \"finding\") probable)", "(diagnosis (snomed_concept \"Pain of breast\" \"finding\") probable)"], "only_B": ["(diagnosis (snomed_concept \"Milk engorgement of breast\" \"disorder\") probable)"], "both": ["(diagnosis (snomed_concept \"Abscess of breast\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Mastitis associated with lactation\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Obstruction of lactiferous duct\" \"disorder\") probable)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Engorgement of breasts\" \"finding\") probable)", "B": "(diagnosis (snomed_concept \"Milk engorgement of breast\" \"disorder\") probable)", "relation": "B_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 55 – Breast symptoms: flowchart\n\nSource: APC 2026 e-book page 55, red box plus the \"Approach to the patient\nwith breast symptoms not needing urgent attention\" algorithm.\n\n```mermaid\nflowchart TD\n    START[\"Patient with breast symptoms\"]\n    START --> RB{\"Temperature ≥ 38°C or body pain<br/>with painful lump in breast/s (may be fluctuant)?\"}\n    RB -- Yes --> ABSCESS[\"Breast abscess likely → urgent attention<br/>(paracetamol, tramadol, refer urgently for I&D)\"]\n    RB -- No --> WARN{\"Any warning sign?<br/>skin changes; breast lump with risk feature;<br/>axillary lump with feature; nipple discharge/retraction with feature\"}\n    WARN -- Yes --> REFWEEK[\"Refer to breast clinic/Regional Breast Unit same week\"]\n    WARN -- No --> BF{\"Is the patient breastfeeding?\"}\n    BF -- \"Painful/cracked nipples\" --> NIPPLES[\"Usually poor latching: latch advice, nipple care\"]\n    BF -- \"Painful breast/s ± lump/s\" --> FEVER{\"Temperature ≥ 38°C or body pain?\"}\n    FEVER -- Yes --> MASTITIS[\"Mastitis likely\"]\n    FEVER -- No --> ENGORGE[\"Engorgement/blocked duct likely\"]\n    NIPPLES --> HIV[\"HIV-status breastfeeding advice; refer to lactation support\"]\n    MASTITIS --> HIV\n    BF -- No --> NOTBF[\"Symptoms not related to breastfeeding\"]\n    NOTBF --> AX[\"Axillary lump/s: look for infection/skin cause, review 2-4 weeks\"]\n    NOTBF --> ENL[\"Breast enlargement: one-sided → refer; BMI; medication review\"]\n    NOTBF --> LUMP[\"Breast lump/s: re-examine day 7 of cycle; if persists refer by age<br/>(< 25 y: 60 days; > 25 y: 21 days)\"]\n    NOTBF --> PAIN{\"Painful breast/s: breast exam normal?\"}\n    PAIN -- Yes --> MASTALGIA[\"Mastalgia likely\"]\n    NOTBF --> DISCH[\"Nipple discharge: pregnancy, medication review, refer if uncertain\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Red box | Breast finding **and** (temperature ≥ 38 °C **or** generalized aches and pains) **and** breast lump **and** pain of breast | `Diagnose probable breast abscess` → `Urgent: breast symptoms with likely breast abscess` |\n| What is asked | Breast finding (presenting complaint) triggers the check-for task | `Check for breast symptom conditions` |\n| Warning signs → refer same week | Referral criteria, no diagnosis named | Not encoded (`management_step`) |\n| Breastfeeding, painful breast/s ± lump/s, fever/body pain = Yes | Maternal breastfeeding **and** pain of breast **and** (temperature ≥ 38 °C **or** generalized aches and pains) | `Diagnose probable mastitis associated with lactation` |\n| Breastfeeding, painful breast/s ± lump/s, fever/body pain = No | Maternal breastfeeding **and** pain of breast **and** temperature < 38 °C **and** (no generalized aches and pains) | `Diagnose probable breast engorgement` (Milk engorgement of breast) and `Diagnose probable blocked milk duct` |\n| Painful/cracked nipples | \"Usually due to poor latching\": no \"likely\" diagnosis | Not encoded (`management_step`) |\n| Not breastfeeding → painful breast/s, breast exam normal | (no maternal breastfeeding) **and** pain of breast **and** breast normal | `Diagnose probable mastalgia` |\n| Axillary lump, breast enlargement, breast lump, nipple discharge | Management and referral only | Not encoded |\n\n## Notes\n\n- \"Body pain\" is encoded as `Generalized aches and pains` (finding).\n- \"Painful lump in breast/s\" is encoded as the pair `Breast lump` + `Pain of breast`; no\n  \"painful\" qualifier exists in SNOMED. \"Which may be fluctuant\" is descriptive (not required) and\n  is not encoded.\n- The \"No\" branch of \"temperature ≥ 38°C or body pain?\" is encoded as temperature < 38 °C and no\n  generalized aches and pains.\n", "questions": "# Page 55 – Breast symptoms: remaining questions\n\nReconciled from two independent builds (base: builder A; see `reconcile.json`).\n\n## Decisions made\n\n- **Trigger.** \"Breast symptoms\" is not a recorded common symptom or warning sign. The check-for\n  task is triggered by the general `Breast finding`, so any recorded breast finding (lump, pain,\n  breastfeeding, …) starts it.\n- **Red box → probable breast abscess → Urgent.** The red box names \"breast abscess likely\" for\n  all of its criteria, so `Diagnose probable breast abscess` carries them and\n  `Urgent: breast symptoms with likely breast abscess` fires on `(active_condition Abscess of breast)`\n  (`Breast abscess` is not an FSN). No escalation beyond Urgent, since the page does not escalate.\n  The abscess rule does not repeat `Breast finding` (\"patient with breast symptoms\"): `Breast lump`\n  and `Pain of breast` are already breast findings, so it would add nothing.\n- **\"Painful lump in breast/s\"** is `Breast lump` AND `Pain of breast`; SNOMED has no \"painful\"\n  qualifier value or precoordinated painful breast lump (the `Tender` qualifier means something\n  different). \"Which may be fluctuant\" is descriptive, not a requirement, and is not encoded.\n- **\"Body pain\"** is `Generalized aches and pains` (finding).\n- **Temperature ≥ 38 °C** is the measured body temperature, not the `Fever` finding, exactly as the\n  page writes it.\n- **Breastfeeding** is `Maternal breastfeeding` (finding). `Mother currently breastfeeding`\n  (situation) was rejected: in SNOMED it is a family-history context about the patient's mother.\n- **Mastitis** uses `Mastitis associated with lactation`, because the page reaches it only on the\n  breastfeeding branch. Evidence: breastfeeding AND pain of breast (lump optional, \"with or without\n  lump/s\") AND (temperature ≥ 38 °C OR body pain).\n- **Engorgement/blocked duct** is the \"No\" branch: temperature < 38 °C AND (no body pain). It is one\n  outcome on the page, written as two probable rules with identical evidence (`Milk engorgement of\n  breast`, the lactational concept, and `Obstruction of lactiferous duct`).\n- **Mastalgia** is diagnosed as `Pain of breast`, the concept whose synonym is \"mastalgia\".\n  Evidence: (no maternal breastfeeding) AND pain of breast AND `Breast normal`. The diagnosis\n  concept is also one of its evidence findings (see Questions for a clinician).\n- **A breastfeeding patient who meets the red-box criteria also meets the mastitis rule.** That is\n  how the page reads (the red box comes first); both diagnoses can fire, and Urgent reflects the\n  red box.\n- **Not encoded (management or referral only):** the warning-sign list (refer same week), painful\n  or cracked nipples (\"usually due to poor latching\"), HIV breastfeeding advice, axillary lump,\n  breast enlargement, breast lump re-examination and age-based referral, nipple discharge, all\n  medicines and the footnote.\n\n## Could not model\n\n- The \"Is the patient breastfeeding? → No\" branch depends on breastfeeding being recorded as absent.\n  `(no Maternal breastfeeding)` needs an explicit negative; if breastfeeding is simply not\n  recorded, mastalgia does not fire (fires less often than the page intends).\n- The engorgement/blocked duct rules need a measured temperature (< 38 °C). Without a temperature\n  reading they do not fire (less often than intended).\n- **Warning signs for same-week referral** (skin changes; breast lump with age > 25, family history,\n  irregular fixed lump, skin/nipple changes, discharge or axillary lump; axillary lump with …;\n  nipple discharge/retraction with age ≥ 50, blood-stained or one-sided discharge, male, …) are\n  referral criteria with no named diagnosis and no urgency level, so they were not encoded. They\n  also gate the breastfeeding branch (\"If none of above, continue to assess\"), which the mastitis,\n  engorgement and mastalgia rules do not model, so those may fire alongside a warning sign (more\n  often than the page intends).\n\n## SNOMED gaps\n\n- No \"Mastitis\" (disorder) by that exact name: used `Mastitis associated with lactation`.\n- No \"Breast abscess\" (disorder): used `Abscess of breast`.\n- No \"Blocked milk duct\"/\"Galactostasis\": used `Obstruction of lactiferous duct`.\n- No \"Breast engorgement\": used `Milk engorgement of breast` (disorder).\n- No \"Breastfeeding\" (finding): used `Maternal breastfeeding` (finding).\n- No \"Painful\" qualifier value: \"painful lump\" = `Breast lump` + `Pain of breast`.\n- No separate \"Mastalgia\" concept: used `Pain of breast`.\n- No \"Body ache\"/\"Body pain\": used `Generalized aches and pains`.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should \"body pain\" be the common symptom `Muscle pain` (which the app already records) instead of,\n  or as well as, `Generalized aches and pains`?\n- Should a painful breast lump with fever in a breastfeeding woman be diagnosed as both mastitis and\n  breast abscess, or abscess only?\n- Should \"Engorgement/blocked duct likely\" be two diagnoses, or only engorgement?\n- Should mastalgia be recorded as a diagnosis at all, given that its SNOMED concept (`Pain of\n  breast`) is also the presenting finding? Is it acceptable that it needs breastfeeding to be\n  recorded a ty level, so omitting a rule is defensible, but the check_for prompts for none of these findings, and nipple discharge and axillary lump (two of the page's five presenting complaints) occur nowhere in the file.", "severity": "medium"}, {"rule": "Diagnose probable breast abscess / Diagnose probable mastitis associated with lactation", "problem": "'Body pain' is encoded as (snomed_concept \"Generalized aches and pains\" \"finding\"). The system's recorded common symptom for body/muscle pain is 'Muscle pain', which is neither an ancestor nor a descendant of 'Generalized aches and pains' (checked). A patient whose body pain is recorded as Muscle pain will fail the fever-or-body-pain test in both rules and, if breastfeeding and afebrile, fall through to probable engorgement/blocked duct instead of mastitis. Either add Muscle pain as an alternative or use the common-symptom concept.", "severity": "medium"}, {"rule": "Diagnose probable mastalgia", "problem": "The diagnosis concept (snomed_concept \"Pain of breast\" \"finding\") is identical to one of its own evidence findings, so the rule records as a probable diagnosis the very finding the nurse entered. Mastalgia is a SNOMED synonym of Pain of breast and no better general concept exists (Cyclical / Non-cyclical mastalgia are narrower than the page), so this may be the best available, but it should be flagged for the clinician.", "severity": "low"}, {"rule": "Diagnose probable breast engorgement / Diagnose probable blocked milk duct", "problem": "The 'No' branch is encoded as (< Body temperature 38) AND (no Generalized aches and pains). The page's 'No' is the absence of fever/body pain; requiring a recorded temperature below 38 means the rules never fire when temperature was not measured. Minor, since temperature is a routine vital.", "severity": "low"}, {"rule": "Diagnose probable breast abscess / Diagnose probable mastitis associated with lactation", "problem": "A breastfeeding patient with painful breast, lump and fever satisfies both rules and gets probable abscess and probable mastitis together. The page itself does not separate them cleanly (mastitis branch is 'with or without lump/s'; red box adds 'may be fluctuant'), so this is a faithful ambiguity, but a Fluctuant check_for item would give the nurse the page's discriminator.", "severity": "low"}, {"rule": "Check for breast symptom conditions (check_for)", "problem": "'which may be fluctuant' (red box) is not in the check_for; the house standard says the list must include every red-box item. (snomed_concept \"Fluctuant\" \"finding\") exists.", "severity": "low"}], "summary": "The red box is encoded correctly except that fluctuance is not checked for, and the Urgent priority is anchored to the probable abscess as the house pattern requires. The most consequential problem is that 'Pain of breast' silently absorbs sore/painful nipples through the SNOMED hierarchy, so the page's separate cracked-nipple branch is mis-diagnosed as engorgement/blocked duct or mastitis; the second is that body pain is encoded as 'Generalized aches and pains', which the recorded common symptom 'Muscle pain' does not match. The warning-signs screen (skin changes, nipple discharge/retraction, axillary lump, family history) is entirely absent from the file, which is arguably defensible since the page names no diagnosis and no matching priority level, but it leaves two of the page's five presenting complaints unrepresented."}, {"page": 55, "checker": "forward-2", "elements": [{"element_key": "p55-c6a87d0c", "scope": "in_scope", "scope_reason": "", "verdict": "correct", "parts_missing": [], "problem": "Minor: 'may be fluctuant' not encoded (optional wording). 'Breast symptoms' and 'painful lump' captured as Breast lump + Pain of breast; temp >=38 or body pain captured as OR.", "evidence": ["Diagnose probable breast abscess :: (and (or (>= (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38) (clinical_finding (snomed_concept \"G s the right rendering of 'if breast exam normal' and is in the check_for. Mastalgia is a SNOMED synonym of Pain of breast, so the concept is the closest general one (Cyclical / Non-cyclical mastalgia are narrower than the page), but the rule diagnoses the same concept it takes as evidence, which is tautological; see rule_level_problems.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'symptoms not related to breastfeeding' only approximated by no Maternal breastfeeding", "pregnancy and hormonal contraception causes not captured (management/cross-reference)"], "problem": "Mastalgia rule uses 'Pain of breast' (synonym Mastalgia) as both criterion and diagnosis, so it is circular and adds no information beyond the symptom; a distinct mastalgia concept (e.g. Persistent or Cyclical mastalgia is too specific) would be preferable or the rule should be flagged as such.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "'If breast exam normal, mastalgia likely' is encoded as not breastfeeding + Pain of breast + Breast normal, at probable. The diagnosis concept is 'Pain of breast' itself; SNOMED has no separate generic Mastalgia (it is a synonym), so this is acceptable but tautological. The pregnancy check and contraceptive advice are management/cross-reference. See the rule-level note on the missing warning-sign gate.", "confidence": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "element", "priority": "low", "ref": "p55-572d5c4a", "text": "Symptoms not related to breastfeeding", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "The not-breastfeeding condition is encoded as (no Maternal breastfeeding) in the one rule on this branch that has an 'X likely' (mastalgia).", "confidence": "high"}, {"checker": "forward-2", "scope": "out_of_scope", "verdict": "", "parts_missing": null, "problem": "not triage/diagnostic logic", "confidence": null}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "The 'No' branch is encoded as (no Maternal breastfeeding) in the mastalgia rule.", "confidence": "high"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "element", "priority": "high", "ref": "p55-83a75454", "text": "Approach to the patient with breast symptoms not needing urgent attention Carefully examine both breasts including nipples and axillae. If any of the following warning signs, refer to breast clinic/Regional Breast Unit same week: • Skin changes: dimpling, ulceration, indentations or pulling (\"orange", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "missing", "parts_missing": ["skin changes: dimpling / ulceration / indentations / orange peel (no check_for item, no rule)", "breast lump + family history of breast cancer (no check_for item, no rule)", "breast lump + irregular fixed lump (no check_for item, no rule)", "breast lump + skin/nipple changes (no check_for item, no rule)", "breast lump + nipple discharge (no check_for item, no rule)", "breast lump + axillary lump (no check_for item, no rule)", "breast lump + patient > 25 years (not_representable)"], "problem": "None of these findings appears in the check_for or any rule. The only outside-the-red-box triage logic on the page is this screen, and it is absent. The task does check for 'Breast normal', which the mastalgia rule relies on, but nothing prompts the nurse to look for the specific warning signs the page lists.", "confidence": "medium"}, {"checker": "forward-2", "scope": "borderline", "verdict": "missing", "parts_missing": ["skin changes (dimpling, ulceration, indentation, peau d'orange)", "breast lump with age >25, family history of breast cancer, irregular fixed lump, skin/nipple change, nipple discharge, axillary lump", "no suspected-malignancy or same-week priority rule"], "problem": "None of the warning-sign logic appears; no breast cancer possible diagnosis or priority evaluation. Only 'Breast lump' is a check_for item used in the abscess rule.", "confidence": "medium"}, {"checker": "forward-3", "scope": "borderline", "verdict": "missing", "parts_missing": ["skin changes (dimpling, ulceration, orange peel)", "breast lump with any of: age > 25, family history of breast cancer, irregular fixed lump, skin/nipple changes, nipple discharge, axillary lump"], "problem": "None of the warning-sign findings are checked for or used. As a result, the downstream 'mastalgia likely' rule doesn't require them to be absent.", "confidence": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "element", "priority": "high", "ref": "p55-adca6b63", "text": "• Axillary lump/s with any of: skin/nipple changes, nipple discharge, breast lump/s • Nipple discharge/retraction with any of: patient ≥ 50 years, blood-stained or one-sided discharge, male, skin changes (crusts/ulcers), breast/axillary lump If none of above, continue to assess the patient below:", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "missing", "parts_missing": ["axillary lump with skin/nipple changes, nipple discharge or breast lump (no check_for item, no rule)", "nipple discharge/retraction with blood-stained or one-sided discharge (no check_for item, no rule)", "nipple discharge/retraction with skin changes (crusts/ulcers) or breast/axillary lump (no check_for item, no rule)", "nipple discharge/retraction with patient >= 50 years or male (not_representable)", "'If none of above, continue below': the non-urgent rules are not gated on the absence of warning signs (flowchart_routing; partly covered for mastalgia by the Breast normal criterion)"], "problem": "Not encoded at all. Nipple discharge and axillary lump, two of the page's five presenting complaints, appear nowhere in the file.", "confidence": "medium"}, {"checker": "forward-2", "scope": "borderline", "verdict": "missing", "parts_missing": ["axillary lump with skin/nipple changes, discharge, breast lump", "nipple discharge/retraction with age >=50, blood-stained or one-sided, male, skin changes, breast/axillary lump"], "problem": "Not encoded; no check_for items for nipple discharge, axillary lump or skin changes.", "confidence": "medium"}, {"checker": "forward-3", "scope": "borderline", "verdict": "missing", "parts_missing": ["axillary lump with skin/nipple changes, nipple discharge or breast lump", "nipple discharge/retraction with any of: age >= 50, blood-stained or one-sided discharge, male, skin crusts/ulcers, breast/axillary lump", "'if none of above' gate"], "problem": "Not encoded. The gate into the non-urgent algorithm is lost.", "confidence": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "claim", "priority": "low", "ref": "c001", "text": "Check for breast symptom conditions :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Breast finding\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Trigger is the page title only; 'Breast finding' is very broad so task fires for any breast finding. Acceptable but loose.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "claim", "priority": "low", "ref": "c004", "text": "Check for breast symptom conditions :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Generalized aches and pains\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "'Body pain' is a patient symptom used by the page as a mastitis/abscess discriminator; 'Generalized aches and pains' is reasonable but a check_for in the task is not clearly asked for by the page.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "claim", "priority": "low", "ref": "c006", "text": "Check for breast symptom conditions :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Breast normal\" \"finding\"))", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "'If breast exam normal' is an examination result in the mastalgia branch only; listing it as a task check_for is fine but 'Breast normal' is a finding not a symptom.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "claim", "priority": "low", "ref": "c021", "text": "Diagnose probable breast engorgement :: (diagnosis (snomed_concept \"Milk engorgement of breast\" \"disorder\") probable)", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "page gives one combined outcome 'Engorgement/blocked duct likely'; splitting into two separate probable diagnoses on identical evidence asserts both as likely at once rather than either/or", "fix": "acceptable if reviewers want both named; otherwise consider one rule or mark the pair as alternatives in remaining questions", "confidence": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "claim", "priority": "low", "ref": "c026", "text": "Diagnose probable blocked milk duct :: (diagnosis (snomed_concept \"Obstruction of lactiferous duct\" \"disorder\") probable)", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "same split of the single 'Engorgement/blocked duct likely' outcome as c021; concept itself is the right one", "fix": "", "confidence": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "claim", "priority": "medium", "ref": "c030", "text": "Diagnose probable mastalgia :: (diagnosis (snomed_concept \"Pain of breast\" \"finding\") probable)", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Diagnosis concept is the same 'Pain of breast' finding used as the symptom input, so the rule is circular; page says 'mastalgia likely' (no disorder-level concept exists; closest are 'Cyclical mastalgia'/'Persistent mastalgia' which over-narrow).", "fix": "Keep but flag for reviewer; no clearly better concept.", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "'Pain of breast' is SNOMED's mastalgia synonym, but it is also the rule's own evidence, so the rule just restates its input; no separate mastalgia concept exists (only Cyclical/Non-cyclical/Persistent mastalgia, which are narrower than the page)", "fix": "keep, but note the circularity in remaining questions", "confidence": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable breast engorgement / Diagnose probable blocked milk duct / Diagnose probable mastitis associated with lactation / Diagnose probable mastalgia", "text": "All four use (clinical_finding (snomed_concept \"Pain of breast\" \"finding\")) as the 'painful breast/s' evidence. In SNOMED, 'Sore nipple' and 'Painful lactation' are direct children of 'Pain of breast', and descendants match in due_to. The page's left branch ('Breastfeeding and painful/cracked nipples') is deliberately separate from 'painful breast/s with or without lump/s', yet a breastfeeding patient recorded with sore nipples alone would receive probable engorgement and probable blocked duct (afebrile) or probable mastitis (febrile). Nothing in the file checks for or excludes nipple pain.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for breast symptom conditions (check_for) and the file as a whole", "text": "The page's warning-signs screen (skin changes, breast lump with any of >25 years / family history / irregular fixed lump / skin-nipple changes / nipple discharge / axillary lump, axillary lump with ..., nipple discharge/retraction with ...) is entirely absent. Most of it is expressible (Dimpling of surface of breast, Peau d'orange surface of breast, Breast symptom of change in skin, Family history of malignant neoplasm of breast, Nipple discharge symptom, Bloody nipple discharge, Axillary lymphadenopathy, Retraction of bilateral nipples all exist); age and sex are not. The page names no diagnosis and 'refer same week' matches no priority level, so omitting a rule is defensible, but the check_for prompts for none of these findings, and nipple discharge and axillary lump (two of the page's five presenting complaints) occur nowhere in the file.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable breast abscess / Diagnose probable mastitis associated with lactation", "text": "'Body pain' is encoded as (snomed_concept \"Generalized aches and pains\" \"finding\"). The system's recorded common symptom for body/muscle pain is 'Muscle pain', which is neither an ancestor nor a descendant of 'Generalized aches and pains' (checked). A patient whose body pain is recorded as Muscle pain will fail the fever-or-body-pain test in both rules and, if breastfeeding and afebrile, fall through to probable engorgement/blocked duct instead of mastitis. Either add Muscle pain as an alternative or use the common-symptom concept.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mastalgia", "text": "The diagnosis concept (snomed_concept \"Pain of breast\" \"finding\") is identical to one of its own evidence findings, so the rule records as a probable diagnosis the very finding the nurse entered. Mastalgia is a SNOMED synonym of Pain of breast and no better general concept exists (Cyclical / Non-cyclical mastalgia are narrower than the page), so this may be the best available, but it should be flagged for the clinician.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable breast engorgement / Diagnose probable blocked milk duct", "text": "The 'No' branch is encoded as (< Body temperature 38) AND (no Generalized aches and pains). The page's 'No' is the absence of fever/body pain; requiring a recorded temperature below 38 means the rules never fire when temperature was not measured. Minor, since temperature is a routine vital.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable breast abscess / Diagnose probable mastitis associated with lactation", "text": "A breastfeeding patient with painful breast, lump and fever satisfies both rules and gets probable abscess and probable mastitis together. The page itself does not separate them cleanly (mastitis branch is 'with or without lump/s'; red box adds 'may be fluctuant'), so this is a faithful ambiguity, but a Fluctuant check_for item would give the nurse the page's discriminator.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for breast symptom conditions (check_for)", "text": "'which may be fluctuant' (red box) is not in the check_for; the house standard says the list must include every red-box item. (snomed_concept \"Fluctuant\" \"finding\") exists.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mastalgia", "text": "Diagnosis concept is identical to the criterion concept (Pain of breast); rule is circular.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable breast engorgement / blocked milk duct", "text": "Two rules with identical criteria; page gives one combined 'Engorgement/blocked duct likely'. Both always fire together.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable breast abscess / mastitis", "text": "A breastfeeding patient with fever, painful breast and lump triggers both abscess (Urgent) and mastitis; page treats mastitis as the non-urgent case but abscess box has no breastfeeding exclusion, which is consistent with the page's box. Acceptable but overlapping.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "high", "ref": "check_for / whole page", "text": "Same-week referral warning signs (skin changes, axillary lump, nipple discharge, age/family history) have no check_for items, no possible/priority rule; no possible breast cancer rule.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for breast symptom conditions", "text": "check_for items Breast lump, Pain of breast, aches, breastfeeding, Breast normal are all used by rules; no unused items.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mastalgia", "text": "The page reaches 'mastalgia likely' only after 'If none of [the warning signs] above, continue'. The rule doesn't check for or exclude any warning sign: skin changes, irregular fixed lump, nipple discharge, axillary lump, age/family-history combinations. A patient with breast pain plus a red-flag combination could still be labelled probable mastalgia, provided 'Breast normal' is recorded, which partly mitigates this.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable breast abscess / Diagnose probable mastitis associated with lactation", "text": "These overlap. A breastfeeding patient with fever or body pain and a painful lump gets both probable abscess and probable mastitis. The page sends such a patient to the red box (abscess) before the non-urgent mastitis branch, but the mastitis rule doesn't exclude a lump. The page's 'with or without lump' makes this defensible, so it is a design note, not an error.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable breast engorgement / Diagnose probable blocked milk duct", "text": "The No branch requires a recorded temperature < 38 °C. If temperature isn't measured, neither diagnosis fires, even though the page's No branch is just 'no fever or body pain'.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Check for breast symptom conditions", "text": "The due_to 'Breast finding' is not a recorded common symptom or warning sign. 'Maternal breastfeeding' is a descendant of Breast finding (is_a YES), so the check task also triggers on breastfeeding alone. The check list has no warning-sign items (see the mastalgia note). Every check_for item is consumed by some rule.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mastitis associated with lactation", "text": "Overlaps with the abscess rule: a breastfeeding patient with a painful lump and fever/body pain satisfies both, so the system will output probable mastitis (clinic flucloxacillin) and probable breast abscess (urgent surgical referral) at once. The page's lower algorithm is headed 'Approach to the patient with breast symptoms not needing urgent attention', so mastitis is meant only for patients who do not meet the red box; the page's own discriminator is weak ('which may be fluctuant'). The grammar does not allow (no (active_condition ...)), so this cannot be excluded cleanly. This reproduces an ambiguity on the page rather than inventing one; it should go to a clinician. The concept is right: plain 'Mastitis' does not exist in SNOMED and the rule already requires breastfeeding.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 55, "slug": "55-breast-symptoms", "kind": "rule", "priority": "medium", "ref": "Diagnose probable mastalgia", "text": "The diagnosis concept 'Pain of breast' is the same concept as one of its own evidence findings, so the rule restates a recorded finding as a probable diagnosis. SNOMED has no better general concept (mastalgia is a synonym of 'Pain of breast'; 'Cyclical mastalgia' and 'Non-cyclical mastalgia' are narrower than the page). The not-breastfeeding, breast pain, exam-normal conditions are faithful to the page. Worth confirming <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);

const prov = D.provenance || {};

(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });

(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });

((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {

}
function renderHeader() {

}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {

  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
