_for\n    ;; Infection (surrounding skin red/warm/swollen)\n    (clinical_finding (snomed_concept \"Infected ulcer of skin\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Local infection of wound\" \"disorder\"))\n\n    ;; ... with any of (vitals are routine: systolic BP, pulse, temperature)\n    (clinical_finding (snomed_concept \"Acute confusion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Blister of skin\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Subcutaneous crepitus\" \"finding\"))\n    (clinical_finding (snomed_concept \"Severe pain\" \"finding\"))\n\n    ;; Critical limb ischaemia; claudication is also the arterial-ulcer question\n    (clinical_finding (snomed_concept \"Intermittent claudication\" \"finding\"))\n    (clinical_finding (snomed_concept \"Pain provoked by rest\" \"finding\"))\n    (clinical_finding (snomed_concept \"Gangrenous disorder\" \"disorder\"))\n  )\n)\n(task\n  \"Check for the cause of a skin ulcer or non-healing wound\"\n  adult\n  (or (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\"))\n      (clinical_finding (snomed_concept \"Wound, non-healed\" \"morphologic abnormality\")))\n  (check_for\n    ;; Q1: bedridden/in wheelchair and ulcer in a common pressure ulcer site (sites from the page's figure)\n    (clinical_finding (snomed_concept \"Bed-ridden\" \"finding\"))\n    (clinical_finding (snomed_concept \"Dependence on wheelchair\" \"finding\"))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Occipital region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Structure of vertebral column\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Structure of scapular region of back\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Elbow region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Sacral region back structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Hip region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Ankle region structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Heel structure\" \"body structure\")))\n\n    ;; Q2: ulcer on the lower leg or foot\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Structure of lower limb from knee to ankle\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Skin ulcer\" \"disorder\") (finding_site (snomed_concept \"Foot structure\" \"body structure\")))\n\n    ;; Q3: reduced/absent foot pulses (muscle pain on exercise is checked in the urgent task)\n    (clinical_finding (snomed_concept \"Weak arterial pulse\" \"finding\") (finding_site (snomed_concept \"Foot structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Foot pulse absent\" \"finding\"))\n\n    ;; Q4: darkening of skin around ulcer, varicose veins, chronic swelling of the leg\n    (clinical_finding (snomed_concept \"Hyperpigmentation of skin\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Varicose veins of lower extremity\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Swelling of lower limb\" \"finding\") (qualifier (snomed_concept \"Chronic\" \"qualifier value\")))\n\n    ;; Q5: known with diabetes\n    (clinical_finding (snomed_concept \"Diabetes mellitus\" \"disorder\") (qualifier (snomed_concept \"Known present\" \"qualifier value\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable critical limb ischaemia in a patient with a sk g site\" \"attribute\") (snomed_concept \"Sacral region back structure\" \"body structure\"))))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Skin ulcer\" \"disorder\"))"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Skin ulcer\" \"disorder\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Heel structure\" \"body structure\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Skin ulcer\" \"disorder\"))"}]}, "diagnosis": {"only_A": ["(diagnosis (snomed_concept \"Ischemic ulcer\" \"disorder\") probable)"], "only_B": ["(diagnosis (snomed_concept \"Ischemic ulcer of lower limb\" \"disorder\") probable)"], "both": ["(diagnosis (snomed_concept \"Critical lower limb ischemia\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Pressure injury\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Skin ulcer due to diabetes mellitus\" \"disorder\") probable)", "(diagnosis (snomed_concept \"Venous ulcer of lower limb\" \"disorder\") probable)"], "is_a_related": [{"A": "(diagnosis (snomed_concept \"Ischemic ulcer\" \"disorder\") probable)", "B": "(diagnosis (snomed_concept \"Ischemic ulcer of lower limb\" \"disorder\") probable)", "relation": "B_narrower"}], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 90 – Skin ulcer or non-healing wound: diagnosis (flowchart)\n\nAPC 2026 page 90. Red box first (urgent attention), then the \"Identify cause\" algorithm.\n\n```mermaid\nflowchart TD\n    START[\"Skin ulcer or non-healing wound\"] --> RB{\"Red box: infection (surrounding skin red/warm/swollen)<br/>with any of SBP < 80, pulse > 100, temp ≥ 38°C,<br/>confused, blisters, crepitus, severe pain?<br/>OR muscle pain in legs/buttocks on exercise<br/>with pain at rest or gangrene?\"}\n    RB -- Yes --> URG[\"Urgent: manage and refer urgently<br/>(critical limb ischaemia likely for the 2nd bullet)\"]\n    RB -- No --> ID[\"Identify cause<br/>If genital ulcer → 62\"]\n    ID --> Q1{\"Q1: bedridden / in wheelchair AND ulcer in<br/>common pressure ulcer site (figure)?\"}\n    Q1 -- Yes --> PU[\"Pressure ulcer likely\"]\n    Q1 -- No --> Q2{\"Q2: ulcer on the lower leg or foot?\"}\n    Q2 -- No --> OTHER[\"Ask about trauma, surgery, rash, burn, cancer, radiation;<br/>test glucose 19, HIV 124; TB 102 if symptoms\"]\n    Q2 -- Yes --> Q3{\"Q3: muscle pain in legs/buttocks on exercise<br/>or reduced/absent foot pulses?\"}\n    Q3 -- Yes --> AU[\"Arterial (ischaemic) ulcer likely\"]\n    Q3 -- No --> Q4{\"Q4: darkening of skin around ulcer, varicose veins<br/>or chronic swelling of the leg?\"}\n    Q4 -- Yes --> VU[\"Venous ulcer likely\"]\n    Q4 -- No --> Q5{\"Q5: known with diabetes?\"}\n    Q5 -- Yes --> DU[\"Diabetic ulcer likely\"]\n    Q5 -- No --> OTHER\n    PU --> CARE[\"Routine ulcer/wound care 91; doctor review if pressure;<br/>refer to district hospital if arterial/venous/diabetic or uncertain\"]\n    AU --> CARE\n    VU --> CARE\n    DU --> CARE\n    OTHER --> CARE\n```\n\n## Decision nodes\n\n| Node | Page wording | Rule(s) in the `.lisp` |\n|---|---|---|\n| RB (bullet 1) | \"Infection (surrounding skin red/warm/swollen) with any of: systolic BP < 80, pulse > 100, temperature ≥ 38°C, confused, blisters, crepitus or severe pain\" | `Urgent: skin ulcer or non-healing wound with infection and systemic or severe signs`; findings in `Check for urgent skin ulcer or non-healing wound conditions` |\n| RB (bullet 2) | \"Muscle pain in legs or buttocks on exercise associated with pain at rest or gangrene: critical limb ischaemia likely\" | `Diagnose probable critical limb ischaemia in a patient with a skin ulcer or non-healing wound` → `Urgent: skin ulcer or non-healing wound with critical limb ischaemia` |\n| Q1 | \"Is patient bedridden/in wheelchair and is ulcer in common pressure ulcer site (see below)?\" | Yes → `Diagnose probable pressure ulcer (APC 2026 page 90)`; No is the first `or` block in each of the three rules below |\n| Q2 | \"Is ulcer on the lower leg or foot?\" | Yes is required by the arterial, venous and diabetic rules; No → no rule (investigation box, not encoded) |\n| Q3 | \"Does patient have muscle pain in legs/buttocks on exercise or reduced/absent foot pulses?\" | Yes → `Diagnose probable arterial (ischaemic) ulcer (APC 2026 page 90)`; No is the `(no …)` triple in the venous and diabetic rules |\n| Q4 | \"Is there darkening of skin around ulcer, varicose veins or chronic swelling of the leg?\" | Yes → `Diagnose probable venous ulcer (APC 2026 page 90)`; No is the `(no …)` triple in the diabetic rule |\n| Q5 | \"Is patient known with diabetes?\" | Yes → `Diagnose probable diabetic ulcer (APC 2026 page 90)`; No → investigation box (not encoded) |\n| OTHER / CARE | Investigations, routine care, referral | Not encoded (management / cross-references) |\n", "questions": "# Page 90 – Skin ulcer or non-healing wound: diagnosis — remaining questions\n\n## Decisions made\n\n- **Reconciled** from two independent builds; base is build A, with B's wheelchair concept, B's narrower arterial-ulcer concept and B's ulcer/wound context on the critical limb ischaemia rule. See `reconcile.json`.\n\n- **Presenting complaint** is `Skin ulcer` (disorder) or `Wound, non-healed` (morphologic abnormality). Neither is a recorded common symptom or warning sign, so the tasks fire only when one of them is recorded.\n- **Red box, bullet 1:** \"Infection\" is encoded as `Infected ulcer of skin` or `Local infection of wound`. The parenthesis \"(surrounding skin red/warm/swollen)\" is read as how to recognise infection, not as separate criteria. The page's numbers are encoded exactly: systolic BP < 80, pulse > 100 (strict), temperature ≥ 38°C. \"Confused\" is `Acute confusion`. \"Crepitus\" is `Subcutaneous crepitus`, following the footnote (\"under the skin\").\n- **Red box, bullet 2:** \"critical limb ischaemia likely\" is a `probable` rule for `Critical lower limb ischemia`: `Intermittent claudication` and (`Pain provoked by rest` or `Gangrenous disorder`). The urgent rule references `(active_condition …)`. The probable rule also requires the ulcer or wound, since the red box is about \"the patient with a skin ulcer or non-healing wound\".\n- **Flowchart:** each \"X likely\" is a `probable` rule. Each later rule requires every earlier question answered No, encoded with `(no X)`:\n  - Q1 No: (not bedridden and not wheelchair-dependent) or no ulcer at any of the pressure sites.\n  - Q2 Yes: an ulcer on the lower leg or the foot.\n  - Q3 No: no claudication, no weak foot pulse and no absent foot pulse.\n  - Q4 No: no hyperpigmentation, no varicose veins and no chronic leg swelling.\n  So the rules are mutually exclusive, as on the page. One consequence: a negation fires only if the health worker answered \"no\" explicitly.\n- **Pressure ulcer sites** come from the figure, which has no text. Its dots are read as: occiput, upper spine, scapulae, elbows, sacrum, hips, ankles and heels. Each site is `Skin ulcer` with a `finding_site`.\n- \"In wheelchair\" is `Dependence on wheelchair` (finding).\n- **Arterial ulcer** is `Ischemic ulcer of lower limb`, since the branch only covers lower leg/foot ulcers.\n- \"Reduced foot pulses\" is `Weak arterial pulse` with `finding_site` `Foot structure`. \"Absent\" is `Foot pulse absent`.\n- \"Darkening of skin around ulcer\" is `Hyperpigmentation of skin`. The \"around ulcer\" part is not expressed.\n- There are no `measure` tasks. Glucose is a routine vital, and \"check glucose 19\" is a cross-reference in the No box.\n\n## Could not model\n\n- **The No-to-Q2 / No-to-Q5 box** (ask about trauma, surgery, rash, burn, cancer, radiation; test for diabetes, HIV, TB) is investigation and cross-references, so it is not encoded. Neither are routine care (→91), doctor review or referral (management). \"If genital ulcer → 62\" is a cross-reference.\n- **\"Cause uncertain\"** has no diagnosis to express.\n- **\"Surrounding skin\" and \"around ulcer\"** cannot be tied to the ulcer's location.\n\n## SNOMED gaps\n\n- **No FSN for \"non-healing wound\"** as a disorder or finding. Used `Wound, non-healed` (morphologic abnormality).\n- **No \"reduced foot pulse\".** Used `Weak arterial pulse` + foot site (the other build used the broader `Abnormal foot pulse`).\n- **No \"ulcer of lower leg\"** disorder at the right level. Used `Skin ulcer` + `Structure of lower limb from knee to ankle`.\n- **No \"Critical limb ischaemia\"** without \"lower\". Used `Critical lower limb ischemia`, since the page's context is the legs.\n\n## Checker issues left in place\n\n> **Note, 2026-11-05.** The gate's `(no X)` pattern was fixed on 2026-11-05: it now recognizes `(no X)` when X has a qualifier or finding site. The gate no longer reports the findings below. Will's PR #1310 test may still flag the `(no X)` forms, because it wants `(no X)` itself checked for; see `RUN-REPORT.md`, \"What the test result means\".\n\n`PROBABLE DIAGNOSIS EVIDENCE NOT CHECKED FOR` is reported for the `(no X)` form of findings that carry a `finding_site` or qualifier. The gate's `positive()` regex expects the `\"No\"` value at the end, but it renders before the attribute. Every positive X is in the check_for of \"Check for the cause of a skin ulcer or non-healing wound\". Exact strings:\n\n- `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Skin ulcer\" \"disorder\") (snomed_concept \"No\" \"qualifier value\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"Occipital region structure\" \"body structure\"))))`\n- `(no (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Skin ulcer\" \"disorder\") (snomed_concept \"No\" \"qualifier value\") (attribute (snomed_concept \"Finding site\" \"attribute\") (snomed_concept \"S tail": [{"checker": "forward-1", "severity": "high"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: skin ulcer or non-healing wound with infection and systemic or severe signs", "text": "Pulse is measured against the observable 'Pulse, function'. 'Heart rate' (observable entity) also exists, and the gold standard gives no example of a pulse measurement. If VHA records the routine pulse vital under a different concept, the 'pulse > 100' criterion never fires. Needs confirming against the vital's recorded concept.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable pressure ulcer (APC 2026 page 90) / Check for the cause of a skin ulcer or non-healing wound", "text": "The figure's buttock dots (ischial tuberosities, the pressure site for a seated wheelchair user) are represented only by 'Hip region structure'. 'Buttock structure' and 'Ischial tuberosity structure' exist and could be added so a buttock ulcer in a wheelchair user is a pressure ulcer. The figure is the only source for the site list, so this is a judgment call.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: skin ulcer or non-healing wound with infection and systemic or severe signs", "text": "Infection is (or 'Infected ulcer of skin' 'Local infection of wound'). 'Cellulitis' and 'Wound cellulitis' are not descendants of either, so an infected ulcer recorded as cellulitis (the clinical name for 'surrounding skin red/warm/swollen') does not trigger the Urgent rule unless the nurse also picks one of the two listed findings. Low because the check list steers the nurse to the listed concepts.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: skin ulcer or non-healing wound with infection and systemic or severe signs", "text": "'Severe pain' is unsited, so severe pain recorded for any reason (e.g. a headache) plus an infected ulcer satisfies the rule. Over-triggering, not under-triggering, and the page's wording is equally unsited, so low.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: skin ulcer or non-healing wound with critical limb ischaemia", "text": "Depends on active_condition of a diagnosis produced by another rule instead of restating claudication AND (rest pain OR gangrene); fires only if diagnosis chaining is supported.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Check for urgent skin ulcer... (task 1)", "text": "check_for lists no measurements (SBP, pulse, temperature) though the priority rule uses them; also nothing for the red/warm/swollen infection signs.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Check for the cause of a skin ulcer (task 2)", "text": "Pressure-site ulcers and lower-limb ulcer sites are listed as check_for items although they are findings of the ulcer itself; history prompts (trauma, surgery, rash, burn, cancer, radiotherapy) and genital ulcer route not represented; no rule for the non-lower-leg non-pressure 'cause uncertain' branch.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable arterial/venous/diabetic ulcer", "text": " ": "rule", "priority": "medium", "ref": "Diagnose probable arterial (ischaemic) ulcer (APC 2026 page 90)", "text": "Structure is faithful (De Morgan of the pressure question, then lower leg/foot, then claudication or reduced/absent foot pulses), but the lower-leg/foot disjunction excludes ankle ulcers (see task 2) and accepts only 'Skin ulcer', not the non-healing wound the page also routes down this flow.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable venous ulcer (APC 2026 page 90)", "text": "Same site gap as the arterial rule, and it bites hardest here because venous ulcers classically sit at the ankle/gaiter area; otherwise the negated arterial findings and the (or darkening, varicose veins, chronic swelling) group follow the page.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Diagnose probable diabetic ulcer (APC 2026 page 90)", "text": "Same site gap as the arterial rule; otherwise the chain of negations and 'known with diabetes' is faithful and probable matches 'likely'.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", "priority": "medium", "ref": "Urgent: skin ulcer or non-healing wound with infection and systemic or severe signs", "text": "Priority level and (and complaint (or infection) (or seven signs)) match the red box 'Infection ... with any of'. The pulse measurement uses 'Pulse, function', a function observable rather than a rate; 'Heart rate' (observable entity) is the rate concept unless the house records pulse under another name.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 90, "slug": "90-skin-ulcer-or-non-healing-wound-diagnosis", "kind": "rule", " // ---------- header ----------
function counts() {

function renderHeader() {

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));

const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;

    if (!b) continue;

}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
