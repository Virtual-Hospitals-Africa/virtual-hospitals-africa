rful/anxious, emotional/verbal/psychological abuse likely. • If patient reports any other unwelcomed behaviour, manipulation or violation, consider other types of abuse.", "bbox": [39.7, 212.4, 776.0, 253.4], "key": "p33-79aa6d72"}, {"id": "p33-out-e07", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Social risk Ask about living conditions, disabilities and identity of perpetrator to determine if mandatory reporting is needed. Advise and treat as below.", "bbox": [39.7, 257.6, 614.4, 267.8], "key": "p33-0a8c7096"}, {"id": "p33-out-e08", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Willingness to report to police and undergo forensic examination", "bbox": [39.7, 272.0, 117.9, 302.2], "key": "p33-d8c4df5f"}, {"id": "p33-out-e09", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• If patient agrees to report, or is unsure/unwilling to report but agrees to forensic examination: contact FCS1 detective and refer to Thuthuzela Care Centre/other dedicated centre. • Ensure patient is transported with police vehicle or ambulance. • If patient declines both, respect his/her decision and advise that they can open a case later.", "bbox": [136.2, 272.0, 747.6, 302.2], "key": "p33-d368ee91"}, {"id": "p33-out-e10", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Mental health If stress, anxiety or low mood 98.", "bbox": [39.7, 306.0, 258.6, 316.8], "key": "p33-fdf49565"}, {"id": "p33-out-e11", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Substance use In the past year, has patient drunk ≥ 4 drinks2/session, used illegal drugs or misused prescription or over-the-counter medications? If yes to any 165.", "bbox": [39.7, 320.6, 650.0, 331.4], "key": "p33-2d774dd4"}, {"id": "p33-out-e12", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Family planning Do pregnancy test. If pregnant 175. If pregnancy test negative, assess contraceptive needs and offer long-term contraceptive same day 170.", "bbox": [39.7, 335.2, 632.2, 346.0], "key": "p33-d596424b"}, {"id": "p33-out-e13", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Advise the traumatised/abused patient • Reassure patient that information is confidential, except where mandatory reporting is needed (patient has disability, ≥ 60 years, or children exposed to domestic violence). If unsure if mandatory reporting is needed, discuss with Thuthuzela Care Centre/other dedicated centre. • Encourage patient to report to police and open a case. If patient declines, respect his/her decision, explain that s/he will still receive treatment and may open a case later. • Advise that there are many organisations that offer support and counselling and link patient to these 200.", "bbox": [51.0, 359.7, 768.6, 410.9], "key": "p33-db900727"}, {"id": "p33-out-e14", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Treat the traumatised/abused patient • Discuss with Thuthuzela Care Centre/other dedicated centre/social worker/DSD (regardless of willingness to open a case), to arrange ongoing support and assess for application of protection order. • If mandatory reporting is needed (patient has disability, ≥ 60 years, or children exposed to domestic violence): report to social worker, local DSD or FCS1 detective. • If physical abuse, document examination on J88 form. Avoid handing J88 to patient. If patient willing to open case, police to collect and sign for J88. If not willing, keep form in patient's clinical records. • Ensure patient has follow up with trauma counsellor/mental health nurse/psychologist/social worker/helpline 200. • If at risk of further harm, needing shelter or history of domestic violence, offer referral to social worker same day. • Manage any injuries 30. • Give paracetamol 500mg-1g orally 4-6 hourly (up to 4g in 24 hours) as needed for pain for up to 5 days.", "bbox": [51.0, 425.8, 788.3, 506.9], "key": "p33-3c6077d3"}, {"id": "p33-out-e15", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Review the traumatised/abused patient in 1 month.", "bbox": [321.1, 521.9, 522.6, 532.9], "key": "p33-4c9cd5eb"}, {"id": "p33-out-e16", "page": 33, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "TRAUMATISED/ABUSED PATIENT", "bbox": [288.1, 48.7, 553.8, 71.0], "key": "p33-3f8d026d"}], "boxes": [{"box": 1, "rect": [35.5, 122.6, 806.4, 154.4]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAABDCAIAAACp9kUdAAAACXBIWXMAABcSAAAXEgFnn9JSAABHvElEQVR4nO2dB3QVR5fnJ3wzs7M7u3smz54Jn3nknEQw0SIak3MOIueco0giGTDZImNAGISwiUIEkQUIMCKYnA0GmxwtbH/z9q93pUvRobrfk4QkuOf8jo5ed3V1dYWbuqr6zx7+Rw5BEARBEARBEARBEARByFr8WYaXQBAEQRAEQRAEQRAEQRD8RaJagiAIgiAIgiAIgiAIQtbjrajWq89HvZozThAEQRAEQRAEQRAEQRAyIS8G97COav3pYbz3t+8FQRAEQRAEQRAEQRAEIRPya1ykRLUEQRAEQRAEQRAEQRCELIZEtQRBEARBEARBEARBEISsh0S1BEEQBEEQBEEQBEEQhKyHRLUEQRAEQRAEQRAEQRCErIdEtQRBEARBEARBEARBEISsh0S1BEEQBEEQBEEQBEEQhKyHRLUEQRAEQRAEQRAEQRCErIdEtQRBEARBEARBEARBEISsh0S1BEEQBEEQBEEQBEEQhKyHRLUEQRAEQRAEQRAEQRCErIdEtQRBEITU8vTh0Qwvg6Ana7XRwb2rYrYtBhlekkxFejTihbNbqaof3DsUwOU/3tpHl1+5sD1jK+enOweoJJfORb+bO75+mfDq2YmMfWpLnj069qfXZzQJvj+1ierq4U9xGV5av7h5ddfKZVMWzBlz5ODXGV4YQRAEIZMgUS1BEATBgcQXJzdGzZs2aVC3zi1aNa/bt1fb2TNGXL0YQ2fHju7l+eMfO7VvkuHlFOzIcm30SflSKDDI8JJkHtKpESlbsHf3CvX4/DmjK39SZn/sSv3l30TOoctnfj4sY+snZttiKsnkiQPewe1uXt1VrHCBAnlzHz2UucIrWzYuyJ0je9lSxZ89srXkhwzsRHV1+OCaDC+we9Z//UWenNmp5AP7ts/w8giCIAiZBIlqCYIgCDo2bZhX7uMS5EioLFwwjhLUqFYRPwvmy/Prq1MZXtp -screen\n;; that also triggers the check_for task.\n(task\n  \"Check for traumatised/abused patient urgent signs and abuse type\"\n  adult\n  (or (clinical_finding (snomed_concept \"Victim of abuse\" \"finding\"))\n      (clinical_finding (snomed_concept \"Victim of psychological trauma\" \"finding\"))\n      (diagnosis (snomed_concept \"Victim of abuse\" \"finding\") possible))\n  (check_for\n    ;; Red box\n    (clinical_finding (snomed_concept \"Victim of forced sexual activity\" \"finding\"))\n    (clinical_finding (snomed_concept \"Female\" \"finding\"))\n    (clinical_finding (snomed_concept \"Male\" \"finding\"))\n    (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Suicidal thoughts\" \"finding\"))\n    (clinical_finding (snomed_concept \"Planning suicide\" \"finding\"))\n    (clinical_finding (snomed_concept \"Overdose\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Self-injurious behavior\" \"finding\"))\n\n    ;; Physical abuse\n    (clinical_finding (snomed_concept \"Victim of physical assault\" \"finding\"))\n    (clinical_finding (snomed_concept \"Scar\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Multiple bruising\" \"finding\"))\n\n    ;; Emotional/verbal/psychological abuse\n    (clinical_finding (snomed_concept \"Intimidation\" \"finding\"))\n    (clinical_finding (snomed_concept \"Victim of threats\" \"finding\"))\n    (clinical_finding (snomed_concept \"Withdrawn behavior\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Fearful mood\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Anxiety\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible abuse (traumatised/abused patient page)\"\n  (diagnosis\n    (snomed_concept \"Victim of abuse\" \"finding\")\n    possible\n  )\n  adult\n  ;; \"Suspect abuse if ... patient's behaviour seems strange\". Disclosure is the trigger finding\n  ;; itself; \"examination contradicts history\" and \"abuse clear on examination\" have no concept.\n  (clinical_finding (snomed_concept \"Abnormal behavior\" \"finding\"))\n)\n(system_diagnosis_rule\n  \"Diagnose probable sexual assault/rape (traumatised/abused patient page)\"\n  (diagnosis\n    (snomed_concept \"Victim of sexual aggression\" \"finding\")\n    probable\n  )\n  adult\n  ;; \"If forced to do any form of sexual act without consent, sexual assault/rape likely\"\n  (clinical_finding (snomed_concept \"Victim of forced sexual activity\" \"finding\"))\n)\n(system_diagnosis_rule\n  \"Diagnose probable physical abuse (traumatised/abused patient page)\"\n  (diagnosis\n    (snomed_concept \"Victim of physical abuse\" \"finding\")\n    probable\n  )\n  adult\n  ;; Context: the page applies to the traumatised/abused patient (scars or bruises alone are not enough)\n  (and\n    (or (clinical_finding (snomed_concept \"Victim of abuse\" \"finding\"))\n        (clinical_finding (snomed_concept \"Victim of psychological trauma\" \"finding\")))\n    (or (clinical_finding (snomed_concept \"Victim of physical assault\" \"finding\"))\n        (clinical_finding (snomed_concept \"Scar\" \"disorder\"))\n        (clinical_finding (snomed_concept \"Multiple bruising\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)\"\n  (diagnosis\n    (snomed_concept \"Victim of emotional abuse\" \"finding\")\n    probable\n  )\n  adult\n  ;; \"excessively withdrawn/fearful/anxious\" is written as the Severe (severity modifier) qualifier\n  (and\n    (or (clinical_finding (snomed_concept \"Victim of abuse\" \"finding\"))\n        (clinical_finding (snomed_concept \"Victim of psychological trauma\" \"finding\")))\n    (o ding\") (snomed_concept \"Multiple bruising\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of abuse\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of abuse\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of physical assault\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of psychological trauma\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of psychological trauma\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of threats\" \"finding\"))"], "is_a_related": [{"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Strange and inexplicable behavior\" \"finding\"))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abnormal behavior\" \"finding\"))", "relation": "A_narrower"}], "same_concept_different_form": [{"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Fearful mood\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Fearful mood\" \"finding\"))"}, {"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Anxiety\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Anxiety\" \"finding\"))"}]}, "diagnosis": {"only_A": [], "only_B": [], "both": ["(diagnosis (snomed_concept \"Victim of abuse\" \"finding\") possible)", "(diagnosis (snomed_concept \"Victim of emotional abuse\" \"finding\") probable)", "(diagnosis (snomed_concept \"Victim of physical abuse\" \"finding\") probable)", "(diagnosis (snomed_concept \"Victim of sexual aggression\" \"finding\") probable)"], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": null, "questions": "# Page 33 – Traumatised/abused patient: remaining questions\n\n## Decisions made\n\n- **Presenting complaint.** Recorded as `Victim of abuse` (finding) or `Victim of psychological\n  trauma` (finding). Descendants of `Victim of abuse` include victims of sexual abuse (so\n  `Victim of forced sexual activity`), physical assault, and physical, emotional, psychological and\n  verbal abuse, so recording any of these also counts. `Victim of trauma` was rejected because it\n  also covers vehicle, sports and aircraft accident victims. Neither concept is a recorded common\n  symptom or warning sign yet.\n- **\"Suspect abuse if …\"** becomes a `possible` diagnosis of `Victim of abuse` from `Abnormal\n  behavior` (\"behaviour seems strange\"). As on page 20, it pre-screens and also triggers the\n  `check_for` task. Disclosure is the trigger finding itself.\n- **Red box** → `Urgent`, structured as `(and <abuse context> (or …))`.\n  - Sexual assault/rape within 5 days (woman) or 3 days (man): `Victim of forced sexual activity`\n    with `(<= (onset …) (time_ago 5 days))` paired with `Female`, and 3 days paired with `Male`.\n    `<=` is used, as the brief requires for time comparisons.\n  - Injuries needing attention: `Traumatic injury` (the warning-sign concept).\n  - Suicidal thoughts/plans, overdose or self harm: `Suicidal thoughts`, `Planning suicide`,\n    `Overdose`, `Self-injurious behavior`.\n- **\"X likely\" → probable rules.**\n  - Sexual assault/rape: `Victim of forced sexual activity` → `Victim of sexual aggression`\n    (parent of `Victim of rape` and the sexual-assault findings).\n  - Physical abuse: abuse context AND any of physical assault, scars, multiple bruising →\n    `Victim of physical abuse`.\n  - Emotional/verbal/psychological abuse: abuse context AND any of intimidation, threats,\n    or severe withdrawn behaviour / fearful mood / anxiety → `Victim of emotional abuse`. One rule,\n    not three. \"Excessively\" is written as the `Severe (severity modifier)` qualifier.\n  - The physical and emotional rules require the abuse context because the page applies them only\n    to the traumatised/abused patient. Without it, a scar or anxiety alone would diagnose abuse in\n    any patient.\n- No `measure` tasks. The pregnancy test has no unit, and the drinks-per-session question routes\n  to page 165.\n\n## Could not model\n\n- **Patient sex.** The language has no patient-sex predicate. Sex is checked for as the SNOMED\n  findings `Female` / `Male`. If neither is recorded, the recent-sexual-assault branch never\n  fires, so it fires *less* often than the page intends.\n- **\"Needing attention\"** (injuries): any recorded traumatic injury counts, so the rule fires\n  *more* often than the page intends.\n- **\"Excessively\"** withdrawn/fearful/anxious: written as `Severe (severity modifier)`. If the\n  clinician records these without a severity, the emotional-abuse rule fires *less* often.\n- **\"Bruises of different ages\"**: approximated by `Multiple bruising` (fires *more* often, since\n  same-age bruises also count).\n- **\"Examination contradicts history\"** and **\"abuse clear on examination\"** (suspect abuse): not\n  representable as findings. Not encoded, so the possible rule fires *less* often.\n- **Management, routing and advice** (J88 form, reporting to police, Thuthuzela referral,\n  mandatory reporting, pregnancy test, contraception, paracetamol, review in 1 month): out of\n  scope as management steps.\n- Pointers to other pages (injuries 30, genital symptoms 62, sleep 99, mental health 98,\n  substance use 165, pregnancy 175, contraception 170) are cross-references only.\n\n## SNOMED gaps\n\n- \"Unusual wounds\": no concept. Not encoded (`Wound` would match any wound).\n- \"Harassment\" (non-sexual): only `Sexual harassment` exists. Not encoded.\n- \"Being ridiculed/controlled\", \"insulted\": no concept. Not encoded. `Victim of verbal abuse`\n  was not used as evidence because it is itself one of the diagnoses the page names.\n- \"Bruises of different ages\": no concept. `Multiple bruising` used instead.\n- \"Any other unwelcomed behaviour, manipulation or violation\" → \"consider other types of abuse\":\n  no concepts. The `possible` abuse rule from strange behaviour covers it only partly.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Does the app record patient sex in a way that `Female` / `Male` findings would match? If not,\n  should the recent-assault window use 5 days for everyone (over-triaging men on days 4–5)?\n- Should any recorded traumatic injury make an abused patient Urgent, or only injuries that meet\n  page 30's urgent criteria?\n- Is `Victim of sexual aggression` the right diagnosis concept for \"sexual assault/rape\", or\n  should it be `Victim of rape`?\n- Should emotional, verbal and psychological abuse be three separate diagnoses?\n- Is `Severe (severity modifier)` the right reading of \"excessively\" withdrawn/fearful/anxious?\n- `Intimidation` (finding) sits under `Aggressive behavior` in SNOMED, so it may describe the\n  patient intimidating others rather than being intimidated. Is it acceptable evidence for\n  \"history of … intimidation\", or should `Victim of bullying` / `Victim of threats` alone be used?\n- Should scars and bruising count only in a patient already recorded as abused (the current gate),\n  or on their own?\n", "claims": [{"claim_id": "c001", "rule": "Check for traumatised/abused patient urgent signs and abuse type", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of abuse\" \"finding\"))", "element_keys": ["p33-ae45ef98"], "quote": "traumatised/abused patient"}, {"claim_id": "c002", "rule": "Check for traumatised/abused patient urgent signs and abuse type", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of psychological trauma\" \"finding\"))", "element_keys": ["p33-ae45ef98"], "quote": "traumatised"}, {"claim_id": "c003", "rule": "Check for traumatised/abused patient urgent signs and abuse type", "role": "trigger", "expr": "(diagnosis (snomed_concept \"Victim of abuse\" \"finding\") possible)", "element_keys": ["p33-af319d48"], "quote": "Suspect abuse"}, {"claim_id": "c004", "rule": "Check for traumatised/abused patient urgent signs and abuse type", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of forced sexual activity\" \"finding\"))", "element_keys": ["p33-ad385df3"], "quote": "Sexual assault/rape"}, {"claim_id": "c005", "rule": "Check for traumatised/abused patient urgent signs and abuse type", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Female\" \"finding\"))", "element_keys": ["p33-ad385df3"], "quote": "5 days if woman"}, {"claim_id": "c006", "rule": "Check for traumatised/abused patient urgent signs and abuse type", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Male\" \"finding\"))", "element_keys": ["p33-ad385df3"], "quote": "3 days if man"}, {"claim_id": "c007", "rule": "Check for traumatised/abused patient urgent signs and abuse type", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Traumatic injury\" \"disorder\"))", "element_keys": ["p33-48769124"], "quote": "Injuries needing attention"}, {"claim_id": "c008", "rule": "Check for traumatised/abused patient urgent signs and abuse type", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snome ical_finding (snomed_concept \"Victim of forced sexual activity\" \"finding\")) / (clinical_finding (snomed_concept \"Female\" \"finding\")) / (clinical_finding (snomed_concept \"Male\" \"finding\"))"], "confidence": "medium"}, {"element_key": "p33-48769124", "scope": "in_scope", "scope_reason": "Red-box criterion.", "verdict": "correct", "parts_missing": [], "problem": "Encoded as Traumatic injury (disorder), checked for and used in the Urgent rule. The qualifier 'needing attention' is a clinical judgment the language cannot express; any recorded injury triggers Urgent, which is the safe reading.", "evidence": ["Urgent: traumatised/abused patient ... :: (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))", "Check for traumatised/abused patient urgent signs and abuse type :: (clinical_finding (snomed_concept \"Traumatic injury\" \"disorder\"))"], "confidence": "medium"}, {"element_key": "p33-0b08397b", "scope": "in_scope", "scope_reason": "Red-box criterion with four parts.", "verdict": "correct", "parts_missing": [], "problem": "All four parts present as separate or-branches: suicidal thoughts = Suicidal thoughts (finding); plans = Planning suicide (finding); overdose = Overdose (disorder); self harm = Self-injurious behavior (finding, SNOMED synonym 'self-harm'). All checked for in the task.", "evidence": ["Urgent: traumatised/abused patient ... :: (clinical_finding (snomed_concept \"Suicidal thoughts\" \"finding\")) / (clinical_finding (snomed_concept \"Planning suicide\" \"finding\")) / (clinical_finding (snomed_concept \"Overdose\" \"disorder\")) / (clinical_finding (snomed_concept \"Self-injurious behavior\" \"finding\"))"], "confidence": "high"}, {"element_key": "p33-af319d48", "scope": "in_scope", "scope_reason": "First bullet is a 'suspect abuse if ...' criterion list (a 'possible' rule under the house standard); second bullet is management and is ignored here.", "verdict": "partial", "parts_missing": ["examination contradicts history (no SNOMED concept found; probably not_representable, but it is not noted or approximated)", "abuse clear on examination (only reachable if the clinician records Victim of abuse directly; no finding-level evidence)"], "problem": "The possible rule encodes only 'patient's behaviour seems strange' as Abnormal behavior (finding). 'Patient discloses' is reasonably treated as the clinician recording Victim of abuse itself (the task's trigger). The other two suspicion criteria are absent. Abnormal behavior is a broad concept (parent: Behavior finding) but acceptable for a possible rule whose purpose is to trigger the check_for task.", "evidence": ["Diagnose possible abuse (traumatised/abused patient page) :: (system_diagnosis_rule ... (diagnosis (snomed_concept \"Victim of abuse\" \"finding\") possible) adult (clinical_finding (snomed_concept \"Abnormal behavior\" \"finding\")))", "Check for traumatised/abused patient urgent signs and abuse type :: (or (clinical_finding (snomed_concept \"Victim of abuse\" \"finding\")) (clinical_finding (snomed_concept \"Victim of psychological trauma\" \"finding\")) (diagnosis (snomed_concept \"Victim of abuse\" \"finding\") possible))"], "confidence": "medium"}, {"element_key": "p33-79aa6d72", "scope": "in_scope", "scope_reason": "Three 'X likely' conclusions and one 'consider other types of abuse' conclusion with their criteria: the page's diagnostic core.", "verdict": "error", "parts_missing": ["Physical abuse likely: 'unusual wounds' not encoded (Wound (disorder) exists)", "Emotional/verbal/psychological abuse likely: 'harassment' not encoded (no general victim-of-harassment concept; Victim of bullying and Victim of sexual harassment are the nearest)", "Emotional/verbal/psychological abuse likely: 'being ridiculed/controlled' not encoded", "Emotional/verbal/psychological abuse likely: 'insulted' not encoded (Victim of verbal abuse (finding) exists and covers ridiculed/insulted)", "Consider other types of abuse if 'any other unwelcomed behaviour, manipulation or violation': no possible rule or evidence for it (near-tautological with Victim of abuse, but not noted)"], "problem": "Bullet 1 (sexual assault/rape likely): correct; probable Victim of sexual aggression from Victim of forced sexual activity. Note the diagnosis concept is a sibling of the evidence under Victim of sexual abuse, not its ancestor, and 'Victim of rape' (finding, child of Victim of sexual aggression) is the page's own word; acceptable. Bullet 2 (physical abuse likely): partial; history of physical assault = Victim of physical assault, old/new scars = Scar (disorder), bruises of different ages = Multiple bruising (finding, the closest available), unusual wounds missing. Bullet 3 (emotional/verbal/psychological abuse likely): ERROR. 'Intimidation' (finding) is a child of 'Aggressive behavior' (finding), i.e. it records the patient as the one intimidating others, not as a victim of intimidation; it is the wrong side of the relationship, and because Aggressive behavior is a warning sign and descendants match in due_to, recording it would also raise the aggressive-behaviour warning on an abuse victim. 'Victim of threats' is the correct victim-side form for 'threatened'; harassment, ridiculed/controlled and insulted are missing although Victim of verbal abuse exists. 'Excessively withdrawn/fearful/anxious' as Severe-qualified Withdrawn behavior / Fearful mood / Anxiety is a reasonable reading. The diagnosis is Victim of emotional abuse only; Victim of verbal abuse and Victim of psychological abuse both exist and the page names all three. Bullet 4 (consider other types of abuse): missing.", "evidence": ["Diagnose probable sexual assault/rape (traumatised/abused patient page) :: (diagnosis (snomed_concept \"Victim of sexual aggression\" \"finding\") probable) adult (clinical_finding (snomed_concept \"Victim of forced sexual activity\" \"finding\"))", "Diagnose probable physical abuse (traumatised/abused patient page) :: (and (or Victim of abuse / Victim of psychological trauma) (or (clinical_finding (snomed_concept \"Victim of physical assault\" \"finding\")) (clinical_finding (snomed_concept \"Scar\" \"disorder\")) (clinical_finding (snomed_concept \"Multiple bruising\" \"finding\"))))", "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page) :: (diagnosis (snomed_concept \"Victim of emotional abuse\" \"finding\") probable) ... (or (clinical_finding (snomed_concept \"Intimidation\" \"finding\")) (clinical_finding (snomed_concept \"Victim of threats\" \"finding\")) (clinical_finding (snomed_concept \"Withdrawn behavior\" \"finding\") (qualifier (snomed_concept \"Severe (severity modifier)\" \"qualifier value\"))) (clinical_finding (snomed_concept \"Fearful mood\" \"finding\") (qualifier ...Severe...)) (clinical_finding (snomed_concept \"Anxiety\" \"finding\") (qualifier ...Severe...)))"], "confidence": "high"}, {"element_key": "p33-fbbfe68c", "scope": "out_of_scope", "scope_reason": "cross_reference_only", "verdict": null, "parts_missing": [], "problem": "Symptoms row: 'ask about injuries (30), genital symptoms (62), if difficulty sleeping (99)' routes to other pages; no diagnosis or priority on this page. Injuries are already covered by the red box.", "evidence": [], "confidence": "high"}, {"element_key": "p33-fdf49565", "scope": "out_of_scope", "scope_reason": "cross_reference_only", "verdict": null, "parts_missing": [], "problem": "Mental health row: 'if stress, anxiety or low mood -> 98' is a pointer to the mental health page.", "evidence": [], "confidence": "high"}, {"element_key": "p33-2d774dd4", "scope": "out_of_scope", "scope_reason": "cross_reference_only", "verdict": null, "parts_missing": [], "problem": "Substance use screen (>= 4 drinks/session, illegal drugs, misused medication -> 165) is a routing question to the substance-use page with no diagnosis or priority on this page. A reviewer could argue it is borderline since it carries a numeric threshold.", "evidence": [], "confidence": "medium"}], "outside_not_logic": ["p33-3f8d026d", "p33-e38d14e3", "p33-8c8235f3", "p33-0a8c7096", "p33-d8c4df5f", "p33-d368ee91", "p33-d596424b", "p33-db900727", "p33-3c6077d3", "p33-4c9cd5eb", "p33-551f2ad1"], "rule_level_problems": [{"rule": "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)", "problem": "'Intimidation' (finding) is a direct child of 'Aggressive behavior' (finding): it describes the patient intimidating others, not being intimidated. Used as evidence it records the victim as an aggressor, and since Aggressive behavior is a warning sign and descendants match in due_to, recording it on an abuse victim would also fire the aggressive-behaviour warning. The same check_for item carries the error. No victim-of-intimidation concept exists; 'Victim of threats' (already present) or 'Victim of bullying' are the victim-side substitutes.", "severity": "high"}, {"rule": "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)", "problem": "Four of the page's eight criteria are not encoded: harassment, ridiculed, controlled, insulted. 'Victim of verbal abuse' (finding) exists and would carry ridiculed/insulted; 'Victim of bullying' (finding) exists for harassment. The diagnosis is only 'Victim of emotional abuse' although 'Victim of verbal abuse' and 'Victim of psychological abuse' both exist and the page names all three.", "severity": "medium"}, {"rule": "Diagnose probable physical abuse (traumatised/abused patient page)", "problem": "'Unusual wounds' is dropped ('Wound' (disorder) exists). Separately, a bare 'Scar' (disorder) is sufficient evidence for a probable physical-abuse diagnosis once Victim of abuse is recorded; the page's 'old/new scars' means scars of mixed age, so any single scar (surgical, old accident) will produce a probable physical abuse diagnosis. 'Multiple bruising' for 'bruises of different ages' is the closest concept but loses the 'different ages' discriminator; neither approximation is flagged.", "severity": "medium"}, {"rule": "Diagnose possible abuse (traumatised/abused patient page)", "problem": "Only 'behaviour seems strange' (Abnormal behavior) is encoded from the page's four suspicion criteria; 'examination contradicts history' and 'abuse clear on examination' are absent, and the fourth bullet of the Abuse row ('consider other types of abuse' on unwelcomed behaviour, manipulation or violation) has no possible rule.", "severity": "low"}, {"rule": "Diagnose probable sexual assault/rape (traumatised/abused patient page)", "problem": "Diagnosis concept 'Victim of sexual aggression' is a sibling of the evidence 'Victim of forced sexual activity' under 'Victim of sexual abuse', not its parent; 'Victim of rape' (finding) is the page's own term and sits under sexual aggression. Not wrong, but the diagnosis/evidence pair is not hierarchically consistent, and a clinician recording 'Victim of rape' directly matches neither this rule nor the Urgent rule's 5/3-day branch.", "severity": "low"}, {"rule": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "problem": "The recent-sexual-assault branch requires Female or Male to be recorded; a patient with neither gets no urgent flag for a 2-day-old assault. The page gives no sex-neutral default, so this follows the page, but a fallback (e.g. within 3 days regardless of sex) would be safer.", "severity": "low"}], "summary": "The red box is fully and correctly encoded as one Urgent rule (sex-dependent 5/3-day window on sexual assault, any injury, suicidal thoughts/plans/overdose/self-harm), and all check_for items are consumed. The serious defect is in the emotional/verbal/psychological abuse rule: 'Intimidation' is an aggressor-side concept under 'Aggressive behavior' (a warning sign), so it records the victim as the intimidator and would raise an aggression warning; the same rule also drops harassment, ridiculed/contr ": "", "confidence": "high"}, {"claim_id": "c048", "rule": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "expr": "Self-injurious behavior", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}], "rules": [{"rule": "Check for traumatised/abused patient urgent signs and abuse type", "verdict": "problem", "problem": "It checks for Intimidation (the patient's own aggressive behaviour) instead of the patient being intimidated. Harassment, being ridiculed/controlled, insulted and unusual wounds from the Abuse row are not checked for. The trigger itself is reasonable.", "severity": "medium"}, {"rule": "Diagnose possible abuse (traumatised/abused patient page)", "verdict": "problem", "problem": "The page gives four 'suspect abuse' criteria: discloses, examination contradicts history, abuse clear on examination, behaviour seems strange. Only the last (Abnormal behavior) is encoded. Also, the page's 'consider other types of abuse' (unwelcome behaviour, manipulation or violation) has no possible diagnosis rule.", "severity": "medium"}, {"rule": "Diagnose probable sexual assault/rape (traumatised/abused patient page)", "verdict": "ok", "problem": "", "severity": "low"}, {"rule": "Diagnose probable physical abuse (traumatised/abused patient page)", "verdict": "problem", "problem": "A bare Scar matches any scar, and the Victim of psychological trauma gate lets a patient traumatised by something other than abuse, who has a surgical scar, reach 'physical abuse probable'. 'Unusual wounds' is missing from the or-branch.", "severity": "medium"}, {"rule": "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)", "verdict": "problem", "problem": "The Intimidation concept has the wrong direction (aggressor, not victim). Harassment, ridiculed/controlled and insulted are omitted. Only emotional abuse is diagnosed, not verbal or psychological, and the psychological-trauma gate lets anxiety after an accident yield emotional abuse.", "severity": "medium"}, {"rule": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "verdict": "problem", "problem": "Its structure and Urgent level match the red box. But the 5-day and 3-day windows are measured from onset, which is when the finding is recorded, not when the assault happened, so the time limit doesn't really work. 'Injuries needing attention' has lost its qualifier, so any injury makes the patient Urgent.", "severity": "medium"}], "summary": "The most consequential problem is the Intimidation concept, used in both the check_for and the emotional abuse rule. In SNOMED it is a child of Aggressive behavior, so it records the patient as the aggressor, the opposite of the page. The red box's 5-day (woman) and 3-day (man) windows depend on onset, which is when the finding is recorded, so they hardly discriminate, and 'injuries needing attention' has lost its qualifier. The 'suspect abuse' rule encodes only one of four criteria, 'consider other types of abuse' is missing, and a bare Scar plus the psychological-trauma gate make 'physical abuse probable' too easy to reach."}], "scorecard": {"page": 33, "slug": "33-traumatised-abused-patient", "validation_ok": true, "builder_agreement": 0.681, "elements": 20, "elements_agreed": 14, "claims": 48, "claims_agreed": 25, "queue": 72, "queue_by_priority": {"low": 17, "medium": 42, "high": 13}, "missing_reports": [], "element_rows": [{"key": "p33-ae45ef98", "id": "p33-rb1-e01", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"correct": 2, "partial": 1}}, {"key": "p33-ad385df3", "id": "p33-rb1-e02", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"correct": 1, "partial": 2}}, {"key": "p33-48769124", "id": "p33-rb1-e03", "box": 1, "status": "queue", "scopes": {"in_scope": 3}, "verdicts": {"correct": 1, "partial": 2}}, {"key": "p33-0b08397b", "id": "p33-rb1-e04", "box": 1, "status": "agreed", "scopes": ind": "element", "priority": "low", "ref": "p33-ae45ef98", "text": "Give urgent attention to the traumatised/abused patient with any of:", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Encoded as a single Urgent system_priority_evaluation shaped (and <presenting complaint> (or ...)), matching the house pattern. Presenting complaint is (or Victim of abuse / Victim of psychological trauma), which covers 'traumatised' as well as 'abused'. Urgent is the level the page's wording ('urgent attention') justifies.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["page has no precondition that an abuse/psychological-trauma finding be recorded"], "problem": "Header 'urgent attention to the traumatised/abused patient with any of' is encoded as Urgent priority, but the rule is gated behind (Victim of abuse OR Victim of psychological trauma) AND (any criterion). A patient with recent rape or suicidal intent who has no abuse finding recorded does not fire. Gate is an addition not on the page (though arguably the page-entry trigger).", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Urgent level and (and anchor (or items)) structure match the page. Anchor is Victim of abuse OR Victim of psychological trauma; since sexual-assault, physical-assault, emotional-abuse concepts all descend from Victim of abuse, recording any of them satisfies the anchor.", "confidence": "high"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "element", "priority": "medium", "ref": "p33-ad385df3", "text": "Sexual assault/rape within last 5 days if woman or last 3 days if man 32", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Three parts, all present: (1) sexual assault/rape = Victim of forced sexual activity (exists; child of Victim of sexual abuse), (2) within last 5 days if woman = (and Female (<= (onset ...) (time_ago 5 days))), (3) within last 3 days if man = (and Male (<= (onset ...) (time_ago 3 days))). Direction follows the briefing convention ('<' time_ago N = within the last N). Two caveats, neither an error: a patient with no recorded sex gets no urgent flag for a recent assault (the page gives no default either); and a rape recorded as 'Victim of rape' (a child of Victim of sexual aggression, not of Victim of forced sexual activity) would not match, though the check_for asks the forced-sexual-activity form so the recorded form should match.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["not independent of abuse gate"], "problem": "Female within 5 days / Male within 3 days correctly encoded with Victim of forced sexual activity, onset <= time_ago (briefing convention: within last). Sex expressed as clinical_finding 'Female'/'Male' (workable but findings, not demographics). Rule only fires if the abuse/trauma gate is also true.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["Time window may not work as intended: the house standard says onset is captured when the finding is recorded, so onset of 'Victim of forced sexual activity' is the recording time, not when the assault happened, unless the worker enters a back-dated onset. In that case the 5-day/3-day limits are always met and any sexual assault, however old, is Urgent", "'Victim of rape' (child of Victim of sexual aggression) is not a descendant of 'Victim of forced sexual activity', so a worker who records rape directly does not trigger this branch"], "problem": "Structure is right: (Female AND onset <= 5 days) OR (Male AND onset <= 3 days), with <= used as the house standard's 'within the last N'. Sex is expressed as Female/Male clinical findings in check_for because the grammar has no sex atom, which is acceptable but unusual. Whether this is correct depends on how onset is captured.", "confidence": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "element", "priority": "medium", "ref": "p33-48769124", "text": "Injuries needing attention 30", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Encoded as Traumatic injury (disorder), checked for and used in the Urgent rule. The qualifier 'needing attention' is a clinical judgment the language cannot express; any recorded injury triggers Urgent, which is the safe reading.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'needing attention' (injury severity, page 30 triage) not captured"], "problem": "Any 'Traumatic injury' triggers Urgent, whereas the page says only injuries needing attention; trivial injuries would over-trigger. Cross-reference to page 30 not expressible, so this is a coarse proxy.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'needing attention' is dropped: any Traumatic injury, even a minor one that has been dealt with, makes the patient Urgent"], "problem": "'Injuries needing attention' is encoded as plain Traumatic injury with no qualifier, so the rule over-triggers. No precoordinated 'injury requiring attention' concept exists, but a qualifier (such as Current, or a severity) would match the page more closely.", "confidence": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "element", "priority": "medium", "ref": "p33-af319d48", "text": "• Suspect abuse if patient discloses, examination contradicts history, abuse clear on examination or patient's behaviour seems strange. • Ensure a safe space, offer confidentiality, be patient, listen attentively, and record the patient’s account of abuse. Allow a trusted friend/relative to stay clo", " ng (snomed_concept \"Victim of sexual aggression\" \"finding\"))) (time_ago 5 days)) and check for it, or use (active_condition (snomed_concept \"Victim of sexual aggression\" \"finding\")) from the probable rule.", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "The direction matches the house convention for 'within the last N days'. But onset is captured when the finding is recorded, not when the assault happened, so at triage the window is nearly always met and the woman's 5 days vs the man's 3 days doesn't discriminate.", "fix": "Record when the assault happened (e.g. a time-of-event entry), or flag this as a modelling limitation in the remaining questions.", "confidence": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "claim", "priority": "medium", "ref": "c043", "text": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk :: (<= (onset (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Victim of forced sexual activity\" \"finding\"))) (time_ago 3 days))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "As c041 (3-day window itself is correct).", "fix": "As c041.", "confidence": "medium"}, {"checker": "backward-2", "verdict": "faithful", "reason": "", "fix": "", "confidence": "high"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "As c041: onset is when the finding is recorded, not when the assault happened.", "fix": "As c041.", "confidence": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "claim", "priority": "medium", "ref": "c044", "text": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Traumatic injury\" \"disorder\"))", "detail": [{"checker": "backward-1", "verdict": "imprecise", "reason": "As c007: 'needing attention' dropped, so any recorded injury makes the abused patient Urgent.", "fix": "", "confidence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "'Needing attention' dropped; any traumatic injury makes it urgent.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "'Needing attention' is dropped, so any injury makes the patient Urgent.", "fix": "Add a qualifier for the injury needing treatment.", "confidence": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "high", "ref": "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)", "text": "'Intimidation' (finding) is a direct child of 'Aggressive behavior' (finding): it describes the patient intimidating others, not being intimidated. Used as evidence it records the victim as an aggressor, and since Aggressive behavior is a warning sign and descendants match in due_to, recording it on an abuse victim would also fire the aggressive-behaviour warning. The same check_for item carries the error. No victim-of-intimidation concept exists; 'Victim of threats' (already present) or 'Victim of bullying' are the victim-side substitutes.", "detail": [{"checker": "forward-1", "severity": "high"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)", "text": "Four of the page's eight criteria are not encoded: harassment, ridiculed, controlled, insulted. 'Victim of verbal abuse' (finding) exists and would carry ridiculed/insulted; 'Victim of bullying' (finding) exists for harassment. The diagnosis is only 'Victim of emotional abuse' although 'Victim of verbal abuse' and 'Victim of psychological abuse' both exist and the page names all three.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable physical abuse (traumatised/abused patient page)", "text": "'Unusual wounds' is dropped ('Wound' (disorder) exists). Separately, a bare 'Scar' (disorder) is sufficient evidence for a probable physical-abuse diagnosis once Victim of abuse is recorded; the page's 'old/new scars' means scars of mixed age, so any single scar (surgical, old accident) will produce a probable physical abuse diagnosis. 'Multiple bruising' for 'bruises of different ages' is the closest concept but loses the 'different ages' discriminator; neither approximation is flagged.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose possible abuse (traumatised/abused patient page)", "text": "Only 'behaviour seems strange' (Abnormal behavior) is encoded from the page's four suspicion criteria; 'examination contradicts history' and 'abuse clear on examination' are absent, and the fourth bullet of the Abuse row ('consider other types of abuse' on unwelcomed behaviour, manipulation or violation) has no possible rule.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable sexual assault/rape (traumatised/abused patient page)", "text": "Diagnosis concept 'Victim of sexual aggression' is a sibling of the evidence 'Victim of forced sexual activity' under 'Victim of sexual abuse', not its parent; 'Victim of rape' (finding) is the page's own term and sits under sexual aggression. Not wrong, but the diagnosis/evidence pair is not hierarchically consistent, and a clinician recording 'Victim of rape' directly matches neither this rule nor the Urgent rule's 5/3-day branch.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "text": "The recent-sexual-assault branch requires Female or Male to be recorded; a patient with neither gets no urgent flag for a 2-day-old assault. The page gives no sex-neutral default, so this follows the page, but a fallback (e.g. within 3 days regardless of sex) would be safer.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "high", "ref": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "text": "Abuse/psychological-trauma finding is a mandatory precondition for all urgent criteria; page does not require it. Rape, injuries or suicide risk without that finding will not be flagged Urgent.", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "high", "ref": "Diagnose probable physical abuse / emotional abuse", "text": "Both require Victim of abuse or Victim of psychological trauma AND a sign; page says history/sign alone makes abuse likely. This makes the diagnosis circular (abuse finding needed to diagnose abuse).", "detail": [{"checker": "forward-2", "severity": "high"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose possible abuse", "text": "Driven by 'Abnormal behavior' alone; does not reflect 'other unwelcomed behaviour, manipulation or violation'. The task trigger also includes diagnosis possible Victim of abuse, which creates a loop with this rule.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "task Check for traumatised/abused patient", "text": "check_for lists Female and Male, which are used only in the priority rule; fine. But 'Anxiety'/'Withdrawn'/'Fearful' with Severe qualifier is not on the page ('excessively' is), and 'Scar' is generic, not old/new or unusual. Page 'difficulty sleeping', 'genital symptoms' and 'ask about injuries' items are not in check_for.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "text": "The 5-day/3-day window relies on the onset of 'Victim of forced sexual activity'. If onset defaults to the recording time (as the house standard describes), the window is always met at triage, so old assaults are also Urgent. The rules need the assault time captured as onset, or a note in remaining questions.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable emotional/verbal/psychological abuse", "text": "Uses 'Intimidation' (finding; child of Aggressive behavior), which describes the patient's own behaviour, not being intimidated. The concept is wrong, and the same finding sits in the check_for list, so the health worker is asked whether the patient is intimidating.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "(missing) possible 'other types of abuse'", "text": "The page's 'consider other types of abuse' (any other unwelcome behaviour, manipulation or violation) has no possible rule. The emotional-abuse rule also leaves out harassment, ridicule/control and insults, and concludes only emotional abuse, not verbal or psychological abuse.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: ... (Traumatic injury)", "text": "'Injuries needing attention' is encoded as any Traumatic injury, so a minor or already-treated injury in an abused patient becomes Urgent. Over-triage.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable physical abuse", "text": "Lacks 'unusual wounds'. Also, 'Victim of rape' and 'Victim of sexual aggression' descend from 'Victim of physical assault', so a recorded rape also yields probable physical abuse.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Check for traumatised/abused patient urgent signs and abuse type", "text": "Sex is checked as Female/Male clinical findings because there is no sex atom. The check list and the priority rule agree, and every check_for item is used by a rule.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Check for traumatised/abused patient urgent signs and abuse type", "text": "Type, trigger and grouping are right and every check_for item is consumed. But (1) 'Intimidation' is the perpetrator-side concept (child of Aggressive behavior, a warning sign); (2) the page's 'unusual wounds', 'harassment', 'ridiculed/controlled', 'insulted' are not checked although (snomed_concept \"Wound\" \"disorder\"), (snomed_concept \"Victim of verbal abuse\" \"finding\") and (snomed_concept \"Victim of bullying\" \"finding\") exist; (3) sex is checked as clinical findings 'Female'/'Male', which the grammar permits but which may never match how VHA records sex, leaving the sexual-assault red-box branch dead.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)", "text": "'Intimidation' is the wrong side of the act (patient intimidating others); harassment, ridiculed/controlled and insulted are not represented although 'Victim of verbal abuse' / 'Victim of bullying' exist; the diagnosis concept 'Victim of emotional abuse' does not subsume the verbal and psychological siblings the page names.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "text": "Urgent is justified by 'Give urgent attention' and the (and trigger (or ...)) shape matches the box. Time windows and comparator direction follow the house convention. Problems: the sexual-assault branch fires only on 'Victim of forced sexual activity' (a rape victim recorded as 'Victim of rape' or 'Victim of sexual aggression', the concept the page's own probable rule produces, is not a descendant) and depends on sex being recorded as a clinical finding; 'Injuries needing attention' is widened to any traumatic injury.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Check for traumatised/abused patient urgent signs and abuse type", "text": "Female and Male are listed as check_for findings (not clinical signs); severe qualifier on fearful/anxious invented; Female/Male etc. make the task a poor fit.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose possible abuse (traumatised/abused patient page)", "text": "Only 'behaviour seems strange' is encoded; page also says suspect abuse if patient discloses, examination contradicts history, or abuse clear on examination (no conditions for these).", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "high", "ref": "Diagnose probable physical abuse (traumatised/abused patient page)", "text": "Invented AND precondition on Victim of abuse/psychological trauma, so physical abuse can never be probable from physical findings alone; 'unusual wounds' missing; no onset/age condition for bruises.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "high", "ref": "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)", "text": "Invented abuse/trauma precondition; harassment, ridiculed/controlled and insulted missing; severe qualifier invented on fearful/anxious.", "detail": [{"checker": "backward-2", "severity": "high"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "text": "Urgent box header is the context; requiring Victim of abuse/trauma finding as an AND gate is not on the page as a finding and may suppress the red box for a patient with only the listed criteria (e.g. recent rape without abuse flag). Priority Urgent itself is justified.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Check for traumatised/abused patient urgent signs and abuse type", "text": "It checks for Intimidation (the patient's own aggressive behaviour) instead of the patient being intimidated. Harassment, being ridiculed/controlled, insulted and unusual wounds from the Abuse row are not checked for. The trigger itself is reasonable.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose possible abuse (traumatised/abused patient page)", "text": "The page gives four 'suspect abuse' criteria: discloses, examination contradicts history, abuse clear on examination, behaviour seems strange. Only the last (Abnormal behavior) is encoded. Also, the page's 'consider other types of abuse' (unwelcome behaviour, manipulation or violation) has no possible diagnosis rule.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable physical abuse (traumatised/abused patient page)", "text": "A bare Scar matches any scar, and the Victim of psychological trauma gate lets a patient traumatised by something other than abuse, who has a surgical scar, reach 'physical abuse probable'. 'Unusual wounds' is missing from the or-branch.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Diagnose probable emotional/verbal/psychological abuse (traumatised/abused patient page)", "text": "The Intimidation concept has the wrong direction (aggressor, not victim). Harassment, ridiculed/controlled and insulted are omitted. Only emotional abuse is diagnosed, not verbal or psychological, and the psychological-trauma gate lets anxiety after an accident yield emotional abuse.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 33, "slug": "33-traumatised-abused-patient", "kind": "rule", "priority": "medium", "ref": "Urgent: traumatised/abused patient with recent sexual assault, injuries or suicide risk", "text": "Its structure and Urgent level match the red box. But the 5-day and 3-day windows are measured from onset, which is when the finding is recorded, not when the assault happened, so the time limit doesn't really work. 'Injuries needing attention' has lost i <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);

(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });

(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });

(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });

const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;

function renderHeader() {

    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>

  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };

}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);

  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
