age": 196, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Reduce risk of respiratory infections • Before managing a patient with possible/confirmed respiratory infection, wear appropriate PPE. • Wash hands with soap and water. • Encourage patient to cover mouth/nose with a tissue when coughing/sneezing, to dispose of used tissues correctly and to wash hands regularly with soap and water. • Advise patient to avoid close contact with others while sick.", "bbox": [450.7, 428.7, 792.2, 499.7], "key": "p196-0ec9874e"}, {"id": "p196-out-e05", "page": 196, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Protect yourself Adopt standard precautions with every patient: • Wash hands with soap/water or use alcohol-based cleaner after contact with patient/ body fluids. • Dispose of sharps correctly in sharps bins. Wear protective gear: • Wear gloves when handling blood, body fluids, secretions or non-intact skin. • Wear N95 mask if performing aerosol-generating procedure, if in contact with patient suspected of having respiratory virus or possible/confirmed TB. • Wear surgical mask with a visor or glasses if at risk of splashes. Get vaccinated: • Get vaccinated against hepatitis B (if not yet done) and yearly against influenza. Know your HIV status: • Test for HIV 124. ART and TPT can decrease the risk of TB. • If HIV, you are entitled to work in an area of the facility where exposure to TB is limited.", "bbox": [51.3, 227.4, 372.0, 389.9], "key": "p196-4380fcab"}, {"id": "p196-out-e06", "page": 196, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Protect your facility Clean the facility: • Clean frequently touched surfaces (door handles, telephones, keyboards) daily with soap and water. • Disinfect surfaces contaminated with blood/secretions with 70% alcohol or chlorine-based disinfectant. Ensure adequate ventilation: • Leave windows and doors open when possible and use fans to increase air exchange. Organise waiting areas: • Prevent overcrowding in waiting areas. • Fast track patients with suspected respiratory infections, TB or acute gastroenteritis. Manage sharps safely: • Ensure sharps bins are easily accessible and regularly replaced. Manage infection control in the facility: • Appoint infection control officer to coordinate and monitor infection control policies.", "bbox": [452.2, 227.4, 792.4, 392.7], "key": "p196-b06831fc"}, {"id": "p196-out-e07", "page": 196, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Adopt measures to diminish your risk of occupational infection", "bbox": [295.6, 204.0, 546.3, 215.2], "key": "p196-5e7dbeea"}, {"id": "p196-out-e08", "page": 196, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1TB symptoms: cough, fever ≥ 2 weeks, unexplained weight loss or drenching night sweats.", "bbox": [34.3, 543.3, 312.1, 551.8], "key": "p196-589511b3"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 193.7]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAADgCAIAAAA2fiZdAAAACXBIWXMAABcSAAAXEgFnn9JSAADGzElEQVR4nOydh1cVx/v/v3/I75zIpYgiCCpib9gbauxiQY1iAXs0xlhjiUaNYtfYsWFviKKICCJFEUssWGPXqDEWNMnn/t7cRyeb3Xv3XpqAeZ/zOvfcnZ2dmX1mduZ5np2Z/b/f/p8HIYQQQgghhBBCCCFli/8r8RIQQgghhBBCCCGEEJJf6NUihBBCCCGEEEIIIWWPf3m13q6Y9Xb9PEIIIYQQQgghhBBCSiGvp4y279X6+7c0658XCSGEEEIIIYQQQggphbxPiaFXixBCCCGEEEIIIYSUMejVIoQQQgghhBBCCCFlD3q1CCGEEEIIIYQQQkjZg14tQgghhBBCCCGEEFL2oFeLEEIIIYQQQgghhJQ96NUihBBCCCGEEEIIIWUPerUIIYQQQgghhBBCSNmDXi1CCCGEEEIIIYQQUvagV4sQQgghhBBCCCGElD3o1SKEEEIIIYQQQgghZQ96tQgpRn7/7XSJl4GY8O511puXmSVeDBe5fycx7uAqkHP5UCGTunhuryT126OUIi/nyeMbJfFCxvk05L46KyVJP7WtZEvitDUWYQNwhWJtJIXk5bP0v9+dz9cl/5HeuEierNJc9WWdT/wUFy3F1FuWeCfsSqV8mg7EaS6lZ+gkxQ2Gue1bFyxa8N2eHYtLvDCElH7o1SKk4Pxyfv/Py78fPzY8tFvIgL5dvh0Xvnfn4j/fZuMULK42LRp5uLmtWDq ive gear, vaccination, HIV testing,\n  facility cleaning/ventilation/waiting areas, sharps bins, TB self-screening every 6 months, respiratory\n  hygiene) is prevention advice for the health worker or facility and is not encoded.\n- No flowchart file: the page has no Yes/No branches or algorithm.\n\n## Could not model\n\n- **\"Health worker.\"** The language has no occupation criterion. The rules apply to any adult with a\n  sharps injury/body-fluid exposure and an exposure to a listed fluid (**fires more often**).\n- **Route specificity of the splash** (eye, mouth, nose, broken skin): not expressible with the stand-in\n  event; it fires for any recorded blood/body-fluid exposure event (**fires more often**). It is also not\n  clear whether the app can record this event concept.\n- **\"Blood-stained … tissue\".** No substance concept for tissue (only `Body tissue material`, a surgical\n  material), so the \"/tissue\" part is not encoded (**fires less often**).\n- **\"Drenching\" night sweats.** No severity qualifier; plain `Night sweats` is used (**fires more often**).\n\n## SNOMED gaps\n\n- **Splash to eye/mouth/nose/broken skin**: no splash, mucous-membrane or non-intact-skin exposure concept\n  (searched splash, contamination, mucosal, body fluid exposure). Substitute: `Exposure to blood and/or body fluid` (event).\n- **Semen** (substance): not found; `Seminal fluid` (substance) used.\n- **Wound secretions**: no wound exudate/secretion substance; `Exudate` (substance) used (broader).\n  `Wound discharge` exists only as a patient finding.\n- **Blood-stained fluid**: no such substance; `Serosanguinous fluid` (substance) used. `Bloody discharge`\n  (substance) was the alternative.\n- **Drenching night sweats**: none found.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n1. Is `Exposure to blood and/or body fluid` (event) an acceptable stand-in for a splash exposure, and can the\n   app record it? If not, should VHA add a local concept for mucous-membrane/non-intact-skin splash, or should\n   any recorded exposure to one of the listed fluids be Urgent on its own?\n2. Are `Exudate`, `Serosanguinous fluid` and `Seminal fluid` acceptable stand-ins for \"wound secretions\",\n   \"blood-stained fluid\" and \"semen\"? Should exposure to blood-stained tissue be recorded as exposure to Blood?\n3. In \"cough, fever ≥ 2 weeks\", does \"≥ 2 weeks\" apply to cough as well? Here it applies to fever only.\n4. Should the TB-symptom screen on this infection-control page be its own `possible` TB rule (as encoded), or\n   left to the TB pages?\n5. Should this page be restricted to staff (health worker) once the language can express occupation?\n", "claims": [{"claim_id": "c001", "rule": "Check for occupational sharps/splash exposure to body fluids", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Sharps injury\" \"disorder\"))", "element_keys": ["p196-9dbf7719"], "quote": "sharps injury"}, {"claim_id": "c002", "rule": "Check for occupational sharps/splash exposure to body fluids", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Exposure to blood and/or body fluid\" \"event\"))", "element_keys": ["p196-9dbf7719"], "quote": "splash to eye/mouth/nose/broken skin"}, {"claim_id": "c003", "rule": "Check for occupational sharps/splash exposure to body fluids", "role": "check_for", "expr": "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Blood\" \"substance\"))", "element_keys": ["p196-5670955a"], "quote": "Blood"}, {"claim_id": "c004", "rule": "Check for occupational sharps/splash exposure to body fluids", "role": "check_for", "expr": "(finding (snomed_concept \"Exposure to (contextual qualifier)\" \"qualifier value\") (snomed_concept \"Vaginal secretion\" \"substance\"))", "element_keys": ["p196-6ecc4d0c"], "quote": "Vaginal secretions"}, {"claim_id": " te is only covered loosely by the generic exposure event; no site (eye, mouth, nose, broken skin) is encoded. The 'Exposure to blood and/or body fluid' event also makes the first half of the and redundant with the fluid list.", "confidence": "high"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["route of the splash: eye/mouth/nose/broken skin (mucosal or non-intact skin) is not encoded; the generic 'Exposure to blood and/or body fluid' event also matches intact-skin exposure", "'health worker' (occupational) context is not encoded; the rule fires for any person with these exposures"], "problem": "Sharps injury part is encoded correctly. The splash part is stood in for by the generic event 'Exposure to blood and/or body fluid', which drops the four routes that make a splash significant. No closer precoordinated SNOMED concept was found (no mucosal-exposure or splash concept); 'Exposure to body fluid due to accidental needle stick injury' exists but is narrower than 'sharps injury'. Occupational context is probably not representable, but the routes could be added as finding_site qualifiers or check_for items.", "confidence": "high"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "element", "priority": "medium", "ref": "p196-32f2a256", "text": "Blood-stained fluid/tissue", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "partial", "parts_missing": ["Blood-stained tissue is not encoded. 'Human tissue' (substance, 272171002) exists and could carry it."], "problem": "Blood-stained fluid is approximated by 'Serosanguinous fluid' (substance, 734132004; a child of Body fluid). SNOMED has no 'blood-stained fluid' substance, so this is a reasonable substitute for the fluid half. The tissue half is simply absent.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["tissue (blood-stained tissue)"], "problem": "Encoded as 'Serosanguinous fluid', which is a different substance (serum plus blood) and only approximates 'blood-stained fluid'. Blood-stained tissue is not captured.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["blood-stained tissue (only a fluid is encoded)"], "problem": "'Blood-stained fluid' is mapped to 'Serosanguinous fluid', a wound-drainage term for thin, pale-red serum with some blood. It is an approximation of 'any blood-stained body fluid' (for example bloodstained CSF, pleural fluid or sputum). No 'bloodstained fluid' substance concept was found, so the approximation is defensible, but the tissue half is absent. 'Body fluid' (substance) with a blood-stained qualifier, or the general 'Blood' already present, would have been alternatives; this should be noted as a judgment call.", "confidence": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "element", "priority": "low", "ref": "p196-eb498253", "text": "Wound secretions", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Encoded as 'Exudate' (substance, 247450001), which is broader than wound secretions (any exudate). SNOMED has no wound-specific secretion substance ('Wound discharge' is a finding, not a substance), so this is the closest usable concept; accepted with the generalisation noted.", "confidence": "medium"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": [], "problem": "'Exudate' is a loose stand-in for wound secretions; a wound-specific concept (e.g. wound exudate/discharge) would match the page better.", "confidence": "low"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "'Wound secretions' is mapped to the general 'Exudate' (substance). That is broader than wound-specific, but no wound-exudate substance concept exists ('Wound discharge' is a finding, not a substance), so this is acceptable.", "confidence": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "element", "priority": "low", "ref": "p196-35974afd", "text": "Reduce TB risk Identify patients with possible TB promptly: • The patient has TB symptoms1. • Separate patients with possible TB from others in the facility. • Educate about cough hygiene and give face mask/tissues to cover mouth/nose to protect others. Diagnose TB rapidly: • Fast track TB workup an", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "correct", "parts_missing": [], "problem": "Encoded as a possible Tuberculosis rule triggered by any one TB symptom, which matches 'possible TB' + 'has TB symptoms' (plural used generically; any one symptom qualifies on the page). Rule type (possible) and concept (Tuberculosis, disorder) are right. The symptom definition itself is judged under the footnote key.", "confidence": "medium"}, {"checker": "forward-2", "scope": "borderline", "verdict": "partial", "parts_missing": ["no priority/check task; no link to the facility triage"], "problem": "A possible-TB diagnosis rule exists, which is reasonable, but the page frames it as infection-control identification, not a diagnosis.", "confidence": "low"}, {"checker": "forward-3", "scope": "borderline", "verdict": "correct", "parts_missing": [], "problem": "The conclusion is encoded with the right rule type (possible) and concept. The criteria come from footnote p196-589511b3 and are judged there.", "confidence": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "element", "priority": "medium", "ref": "p196-589511b3", "text": "1TB symptoms: cough, fever ≥ 2 weeks, unexplained weight loss or drenching night sweats.", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "All four parts are present with the right concepts and 'or' logic. '>= 2 weeks' is attached to fever only, as (>= (onset Fever) (time_ago 2 weeks)) = fever began at least 2 weeks ago, which is the right direction. The footnote's punctuation ('cough, fever >= 2 weeks') can also be read as the duration applying to both cough and fever, as in the usual SA TB symptom screen (cough >= 2 weeks); the builder took the literal reading. 'Drenching' has no SNOMED qualifier; plain 'Night sweats' is the closest concept. Cough and Fever are common symptoms; Unexplained weight loss and Night sweats are not checked for on this page, which is allowed for a possible rule.", "confidence": "medium"}, {"checker": "forward-2", "scope": "borderline", "verdict": "partial", "parts_missing": ["'drenching' qualifier on night sweats", "duration for cough if >= 2 weeks was intended"], "problem": "Fever >= 2 weeks is encoded as (>= (onset ...) (time_ago 2 weeks)); the direction should be checked against the language convention (onset at least 2 weeks ago). Cough has no duration, which may be right per the literal footnote wording but is ambiguous. Unexplained weight loss and night sweats are plain findings.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'≥ 2 weeks' on cough: the footnote reads 'cough, fever ≥ 2 weeks', and the APC TB symptom screen applies ≥ 2 weeks to cough as well, but the rule takes cough of any duration", "'drenching' on night sweats (encoded as plain 'Night sweats')"], "problem": "Fever ≥ 2 weeks is encoded correctly with the house onset convention ((>= (onset ...) (time_ago 2 weeks)) = onset at least 2 weeks ago). Cough has no duration, so any cough of any length yields possible TB. That is the most consequential reading choice here and it is not justified by the page's wording. Unexplained weight loss is correct.", "confidence": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "claim", "priority": "medium", "ref": "c002", "t : "imprecise", "reason": "Page says 'possible TB' for patients with TB symptoms, so 'possible' is right, but the diagnosis applies to the patient, not the exposed health worker; fine as triage logic.", "fix": "", "confidence": "low"}, {"checker": "backward-3", "verdict": "faithful", "reason": "The page says 'possible TB' (identify patients with possible TB: the patient has TB symptoms), so the possible level fits.", "fix": "", "confidence": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Check for occupational sharps/splash exposure to body fluids; Urgent: occupational sharps/splash exposure to body fluids", "text": "The 'splash' half of the trigger is a clinical_finding wrapping an event-category concept ('Exposure to blood and/or body fluid', event). The briefing and gold standard express exposures as (finding (snomed_concept \"Exposure to (contextual qualifier)\" ...) <substance>) and never put an event concept under clinical_finding. The grammar parses it, but whether a nurse can record it in the app, and so whether the task and the priority rule ever fire on a splash without a sharps injury, is unverified. If it cannot be recorded, the whole splash branch is dead.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Urgent: occupational sharps/splash exposure to body fluids", "text": "The exposure route the page names (eye / mouth / nose / broken skin) is lost: any exposure to blood/body fluid counts, including one to intact skin, which the page does not escalate. SNOMED offers 'Exposure to biological agent via mucous membrane' (event) and 'Broken skin' (disorder) if a route-specific trigger is wanted. Also, the generic event trigger overlaps the specific fluid findings: a record of 'Exposure to Blood' alone (without the generic event or a sharps injury) does not fire the rule, which may surprise a nurse who records only the specific exposure.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Check for occupational sharps/splash exposure to body fluids", "text": "'Blood-stained tissue' is not in the check_for list or the priority rule; only the fluid half of that red-box item is covered (as Serosanguinous fluid). 'Human tissue' (substance) exists.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms (occupational infection control)", "text": "The >= 2 weeks duration is applied to fever only. The footnote 'cough, fever >= 2 weeks, ...' is ambiguous and the standard SA TB screen applies >= 2 weeks to cough; if that reading is intended, the rule fires on any cough, which is broader than the page. Question for a clinician; not a clear error.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "whole file", "text": "The page addresses the health worker, not a patient. The language has no way to say that the exposed person is the clinician, so the rules will fire for any patient with a recorded sharps injury or body-fluid exposure. Not representable; worth a note in the remaining questions rather than a fix.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Urgent: occupational sharps/splash exposure to body fluids", "text": "Trigger 'sharps injury OR splash' reduced to sharps injury or a generic exposure event; splash site not represented, and 'Exposure to blood and/or body fluid' event duplicates the fluid list, so an exposure to any fluid event alone with any fluid satisfies it.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Check for occupational sharps/splash exposure to body fluids", "text": "Task trigger is an 'or' of sharps injury / exposure event, while the check_for list repeats fluids already required by the priority rule; consistent, but fluids approximated (Serosanguinous fluid, Exudate).", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms", "text": "Fever onset comparison direction and missing cough duration are unverified; rule fires on any single symptom (cough alone), which may over-trigger.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Diagnose possible TB from TB symptoms (occupational infection control)", "text": "The rule is anchored on bare Cough (a common symptom), so every coughing adult gets a possible-TB diagnosis from this infection-control page. It probably duplicates or conflicts with the TB chapter's own screening rules. Night sweats and Unexplained weight loss are not in any check_for task on this page, so those branches depend on other pages recording them.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Check for occupational sharps/splash exposure to body fluids / Urgent: occupational sharps/splash exposure to body fluids", "text": "The due_to anchors ('Sharps injury' disorder, 'Exposure to blood and/or body fluid' event) are neither common symptoms nor warning signs, and no pre-screen rule records them. The check task and Urgent rule may never fire in practice. The trigger event 'Exposure to blood and/or body fluid' already implies the exposure the or-list then re-asks for, so the 'splash' arm is semantically circular and does not restrict to eye/mouth/nose/broken skin.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Urgent: occupational sharps/splash exposure to body fluids", "text": "There is no occupational or health-worker restriction, so the rule applies to any adult (for example, non-occupational exposure to semen). The page addresses health workers only. This is probably not representable, but it should be recorded as a known deviation.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Check for occupational sharps/splash exposure to body fluids", "text": "Type and structure are right: trigger (sharps injury OR splash) and check_for covers every fluid in the red box. Two scope qualifiers from the heading are not encoded: 'health worker' (no finding form exists; the rule fires for any patient with a sharps injury or fluid exposure) and the splash route 'eye/mouth/nose/broken skin' (c002). Both widen the trigger slightly; the clinical response (PEP assessment) is the same, so this is acceptable if recorded.", "detail": [{"checker": "backward-1", "severity": "low"}]}, {"page": 196, "slug": "196-protect-yourself-from-occupational-infection", "kind": "rule", "priority": "medium", "ref": "Urgent: occupational sharps/splash exposure to body fluids", "text": "Urgent is justified by 'Give urgent attention'. The (and (or sharps, splash) (or fluids...)) structure matches the heading 'with a sharps injury or splash ... with exposure to any of async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,

  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

function prettyLisp(expr, width = 72) {

    const head = flat(n[0]);

// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;

    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {

  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}

    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}

function treeHtml(n, rule) {

// ---------- source pane ----------
function renderSource() {

      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");

  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));

function elHtml(e) {

document.addEventListener("click", e => {

  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
