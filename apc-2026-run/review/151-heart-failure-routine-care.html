ative care Every visit Assess need for palliative care 191.", "bbox": [39.7, 295.7, 384.9, 306.5], "key": "p151-ea6db19b"}, {"id": "p151-out-e13", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Creatinine (eGFR) and potassium", "bbox": [39.7, 309.8, 115.6, 330.0], "key": "p151-ab3a47c8"}, {"id": "p151-out-e14", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "At diagnosis, 6 monthly • If starting/increasing dose of enalapril/spironolactone: also check after 2 weeks if eGFR < 60, or after 4 weeks if eGFR ≥ 60. • If creatinine increases by > 20%, eGFR < 30 or potassium > 5.0, stop enalapril/spironolactone and discuss with specialist.", "bbox": [151.6, 309.8, 676.7, 330.0], "key": "p151-58897853"}, {"id": "p151-out-e15", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Other blood tests At diagnosis Test for HIV 124. Check Hb, TSH and if not known diabetes, check fingerprick glucose 19. If abnormal, discuss with specialist.", "bbox": [39.7, 332.8, 699.1, 343.6], "key": "p151-28dcc512"}, {"id": "p151-out-e16", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Treat the patient with heart failure • Give influenza vaccine 0.5mL IM yearly. Aim to have patient on steps 1 and 2. Add step 3 if patient has ongoing symptoms on steps 1 and 2. If uncontrolled on steps 1-3, refer to specialist for digoxin. Medication Dose Note", "bbox": [51.0, 393.4, 788.3, 427.6], "key": "p151-71463249"}, {"id": "p151-out-e17", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Hydrochlorothiazide or furosemide and enalapril", "bbox": [60.7, 431.4, 139.4, 472.3], "key": "p151-a6e1f507"}, {"id": "p151-out-e18", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "25-50mg daily For mild heart failure. Avoid if: eGFR < 30, liver disease, gout, pregnancy. Use cautiously if personal/family history of skin cancer.", "bbox": [151.4, 432.1, 798.5, 442.3], "key": "p151-eb3f4479"}, {"id": "p151-out-e19", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Start 40mg daily. If needed, increase every 2-3 days until symptoms improve, up to 250mg/day.", "bbox": [151.4, 445.6, 344.0, 465.8], "key": "p151-9382e997"}, {"id": "p151-out-e20", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Use if severe heart failure symptoms or eGFR < 60. Once improved, consider switch to HCTZ if eGFR ≥ 60. • If > 80mg needed, give half dose 12 hourly.", "bbox": [378.1, 445.6, 740.7, 465.8], "key": "p151-b70d5dec"}, {"id": "p151-out-e21", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Start 2.5mg 12 hourly. If needed, increase up to 10mg 12 hourly. Avoid if pregnant, previous angioedema, aortic stenosis, hypertrophic obstructive cardiomyopathy, renal artery stenosis.", "bbox": [151.4, 469.2, 785.9, 479.4], "key": "p151-b0d5c7ea"}, {"id": "p151-out-e22", "page": 151, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "2 Add carvedilol Start 3.125mg 12 hourly. If tolerated, double dose every 2 weeks until symptoms improve, up to 25mg 12 hourly. • Start once on optimal dose of enalapril and aim for resting pulse 50-70. • If > 85 kg, titrate to a maximum of 50mg twice daily, if tolerated. If still symptomatic, do ECG2 and/or refer. • Avoid if severe fluid overload, cardiogenic shock3, BP < 90/60, asthma. Avoid or decrease dose if pulse < 50.", "bbox": [40.8, 486.1, 749.2, 516.9], "key": "p151-1c636ecf"}, {"id": "p151-out-e23", th": ["(< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)", "(< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)", "(>= (measurement (snomed_concept \"Respiratory rate\" \"observable entity\") bpm) 30)", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Chest pain\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Difficulty breathing\" \"finding\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Heart failure\" \"disorder\"))", "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Wheezing\" \"finding\") (qualifier (snomed_concept \"New\" \"qualifier value\")))"], "is_a_related": [], "same_concept_different_form": [{"A": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Heart failure\" \"disorder\") (qualifier (snomed_concept \"Worsening\" \"qualifier value\")) (qualifier (snomed_concept \"Rapid\" \"qualifier value\")))", "B": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Heart failure\" \"disorder\") (qualifier (snomed_concept \"Worsening\" \"qualifier value\") (qualifier (snomed_concept \"Rapid\" \"qualifier value\"))))"}]}, "diagnosis_condition": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}, "diagnosis": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": ["(measurement (snomed_concept \"Body weight\" \"observable entity\") kg)"], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": null, "questions": "# Page 151 – Heart failure: routine care: remaining questions\n\n## Decisions made\n\n- **Trigger.** Heart failure is written as `(clinical_finding (snomed_concept \"Heart failure\" \"disorder\"))`\n  in both the `check_for` task and the priority rule. No rule on this page diagnoses heart failure at\n  `probable` (the page says a doctor must confirm the diagnosis), so `active_condition` would not be\n  recognised as checked for.\n- **Red box → one `Urgent` priority evaluation**: heart failure AND any of chest pain, rapid\n  worsening of symptoms, respiratory rate ≥ 30, difficulty breathing, BP < 90/60, new wheeze.\n  The page doesn't escalate past \"urgent\", so the level is `Urgent`.\n- **BP < 90/60** is encoded as systolic < 90 or diastolic < 60, following Will's convention.\n- **Rapid worsening of symptoms** is encoded as heart failure qualified `Worsening` with a nested\n  `Rapid` qualifier. SNOMED has no precoordinated concept for this (see SNOMED gaps).\n- **Measure task for body weight** (kg). The Assess table says to check weight at every visit. Body\n  weight isn't a routine vital, so it gets a `measure` task. No rule consumes it (see Could not model).\n- **Not encoded:**\n  - The red box's management lines (oxygen, furosemide, isosorbide dinitrate, enalapril).\n  - The Advise and Treat sections.\n  - The Assess table's referral steps (\"If fainting/blackouts, refer same day\", \"If new irregular\n    pulse, refer same day\", the pregnancy referral, the substance-use pointer to page 165, and the\n    BP pointers to pages 148/149).\n  These are management, referral or cross-reference content, which this pass leaves out.\n- **No shock definition imported.** Footnote 3 (\"If SBP < 80, pulse ≥ 100, respiratory rate > 30,\n  confusion/restlessness, weakness, shock likely\") belongs to the carvedilol contraindication\n  \"cardiogenic shock\". It was not encoded (see Could not model and Questions).\n\n## Could not model\n\n- **Comparing weight.** \"Assess changes in fluid balance by comparing with weight when patient least\n  symptomatic\" and \"If patient gains ≥ 2kg in 2 days\" both compare two weights. The language has\n  no way to compare a measurement with an earlier one, so weight is only measured.\n- **Lab values.** Creatinine/eGFR, potassium, Hb and TSH thresholds (eGFR < 60 / ≥ 60 / < 30,\n  creatinine increase > 20%, potassium > 5.0) have no unit or observable in the language\n  (`not_representable`). They are all management or monitoring steps anyway, so no rule fires more\n  or less often because of this.\n- **Footnote 3, \"shock likely\".** The footnote lists SBP < 80, pulse ≥ 100, respiratory rate > 30,\n  confusion/restlessness and weakness, separated by commas. It doesn't say whether one sign is\n  enough or several are needed. Encoding either reading would add logic the page doesn't state.\n  The footnote also only serves a medication contraindication. If it were encoded with `or`, a\n  probable cardiogenic shock rule would fire on weakness alone, which is far more often than the\n  page intends.\n\n## SNOMED gaps\n\n- **\"Rapid worsening of symptoms\":** searches for \"rapidly worsening\", \"symptom worsening\",\n  \"worsening heart failure\" and the qualifier \"Rapidly progressive\" found nothing.\n  - Substitute: `Heart failure` + `(qualifier Worsening (qualifier Rapid))`.\n  - `Decompensated cardiac failure` (disorder) exists but was not used, because it names a\n    diagnosis rather than the page's symptom wording.\n\n## Reconciliation\n\n- Builders A and B agreed on every condition except the form of \"Rapid worsening of symptoms\":\n  A gave heart failure two sibling qualifiers (`Worsening`, `Rapid`); B nested `Rapid` inside\n  `Worsening`. The final build keeps B's nested form, because the page's \"Rapid\" modifies\n  \"worsening\", not heart failure (the grammar's qualifier allows nested qualifiers).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Footnote 3: does \"shock likely\" need all of the listed signs, any one of them, or SBP < 80 plus\n  one other? Should heart-failure patients with cardiogenic shock be escalated above `Urgent`?\n- Should \"rapid worsening of symptoms\" be recorded as worsening heart failure, as here, as\n  `Decompensated cardiac failure` (disorder), or as worsening of each symptom (for example dyspnoea\n  or leg swelling)?\n- Should \"fainting/blackouts\" and \"new irregular pulse\" (refer same day) get their own priority\n  evaluation, at a level below `Urgent`?\n- The red box says \"difficulty breathing\", but the page's definition of heart failure also includes\n  breathlessness that worsens on lying down or with effort. Should any difficulty breathing in a\n  known heart-failure patient make them urgent? That is what the page says, and it is encoded that way.\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent heart failure conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Heart failure\" \"disorder\"))", "element_keys": ["p151-25600fc3"], "quote": "heart failure"}, {"claim_id": "c002", "rule": "Check for urgent heart failure conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Chest pain\" \"finding\"))", "element_keys": ["p151-b4ee2b85"], "quote": "Chest pain"}, {"claim_id": "c003", "rule": "Check for urgent heart failure conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Heart failure\" \"disorder\") (qualifier (snomed_concept \"Worsening\" \"qualifier value\") (qualifier (snomed_concept \"Rapid\" \"qualifier value\"))))", "element_keys": ["p151-72b50a2b"], "quote": "Rapid worsening of symptoms"}, {"claim_id": "c004", "rule": "Check for urgent heart failure conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Difficulty breathing\" \"finding\"))", "element_keys": ["p151-1c16fce4"], "quote": "difficulty breathing"}, {"claim_id": "c005", "rule": "Check for urgent heart failure conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Cli nce": "medium"}, {"checker": "forward-2", "scope": "borderline", "verdict": "correct", "parts_missing": [], "problem": "Measure weight task encoded in kg; comparison part not representable.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Weight every visit -> measure task for Body weight in kg. The comparison with least-symptomatic weight is not representable.", "confidence": "high"}]}, {"page": 151, "slug": "151-heart-failure-routine-care", "kind": "element", "priority": "high", "ref": "p151-7d5bc2bb", "text": "BP and pulse Every visit If known hypertension 149. If not known hypertension and BP ≥ 140/90 148. If new irregular pulse, refer same day.", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "missing", "parts_missing": ["new irregular pulse -> same-day referral"], "problem": "Pulse irregular (finding) with a New qualifier is neither checked for nor used in any rule. The two page cross-references are out of scope (cross_reference_only).", "confidence": "medium"}, {"checker": "forward-2", "scope": "borderline", "verdict": "missing", "parts_missing": [], "problem": "No rule or check for new irregular pulse (same-day referral) and no BP/pulse measure task.", "confidence": "medium"}, {"checker": "forward-3", "scope": "borderline", "verdict": "missing", "parts_missing": ["heart failure + new irregular pulse -> same-day referral priority"], "problem": "Not encoded; 'Pulse irregular' (finding) with New qualifier is available.", "confidence": "low"}]}, {"page": 151, "slug": "151-heart-failure-routine-care", "kind": "claim", "priority": "medium", "ref": "c003", "text": "Check for urgent heart failure conditions :: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Heart failure\" \"disorder\") (qualifier (snomed_concept \"Worsening\" \"qualifier value\") (qualifier (snomed_concept \"Rapid\" \"qualifier value\"))))", "detail": [{"checker": "back dence": "medium"}, {"checker": "backward-2", "verdict": "imprecise", "reason": "Same as c003: nested qualifier, symptoms dropped; also redundant with the heart failure conjunct.", "fix": "", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "Same as c003: 'rapid worsening of symptoms' encoded as a nested-qualified copy of the trigger disorder; whether a plain Heart failure record could match it depends on qualifier matching semantics.", "fix": "Same as c003; keep check_for and priority forms identical.", "confidence": "medium"}]}, {"page": 151, "slug": "151-heart-failure-routine-care", "kind": "claim", "priority": "low", "ref": "c014", "text": "Urgent: heart failure with urgent signs :: (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)", "detail": [{"checker": "backward-1", "verdict": "faithful", "reason": "'BP < 90/60' split into SBP < 90 or DBP < 60, the same reading the gold anaphylaxis page uses.", "fix": "", "confidence": "high"}, {"checker": "backward-2", "verdict": "faithful", "reason": "As c013; ambiguity noted.", "fix": "", "confidence": "medium"}, {"checker": "backward-3", "verdict": "imprecise", "reason": "'BP < 90/60' is split into two independent disjuncts, so DBP < 60 alone (e.g. 130/55, common on carvedilol/enalapril) makes the patient Urgent; the page's emphasis elsewhere is on systolic (SBP > 90 for furosemide/ISDN, footnote SBP < 80 for shock). Defensible as the usual hypotension reading, but it should be a documented choice.", "fix": "Keep only SBP < 90, or record the either/or reading in remaining-questions for clinician confirmation.", "confidence": "low"}]}, {"page": 151, "slug": "151-heart-failure-routine-care", "kind": "rule", "priority": "medium", "ref": "(whole file)", "text": "Footnote 3 ('shock likely') is the page's only 'X likely' statement and there is no probable Shock diagnosis rule. Criteria are SBP < 80, pulse >= 100, respiratory rate > 30, confusion/res sness, weakness, shock likely' has no probable diagnosis rule (Cardiogenic shock), and confusion/restlessness and weakness are not checked for.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 151, "slug": "151-heart-failure-routine-care", "kind": "rule", "priority": "medium", "ref": "Urgent: heart failure with urgent signs / Check for urgent heart failure conditions", "text": "'Difficulty breathing' (230145002) is not a descendant of Dyspnea (267036007), the recorded common symptom. A heart failure patient recorded with Dyspnea will not fire the difficulty-breathing branch; consider also accepting Dyspnea or using it instead.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 151, "slug": "151-heart-failure-routine-care", "kind": "rule", "priority": "medium", "ref": "Check for urgent heart failure conditions / Urgent: heart failure with urgent signs / Measure weight in heart failure routine care", "text": "Every rule is anchored on (clinical_finding Heart failure disorder), which is not a common symptom or warning sign. Nothing on the page produces it, so the rules fire only if a known heart-failure diagnosis is recorded at triage as a clinical_finding. A possible-heart-failure pre-screen from the intro sentence, or a 'Known present' qualifier, would make this explicit.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 151, "slug": "151-heart-failure-routine-care", "kind": "rule", "priority": "medium", "ref": "(page as a whole)", "text": "Same-day referral triggers in the assessment table (fainting/blackouts, new irregular pulse) have no priority evaluation. Defensible as management, but they are triage-like.", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 151, "slug": "151-heart-failure-routine-care", "kind": "rule", "priority": "medium", "ref": "Check for urgent heart failure conditions", "text": "Check task lists red-box criteria but omits RR >= 30 and BP < 90/60 (measurable, onl <script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}

async function exportDecisions() {

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {

    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }

}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));

})();

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;

    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);

}

let cidN = 0;

  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",

  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">

    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
