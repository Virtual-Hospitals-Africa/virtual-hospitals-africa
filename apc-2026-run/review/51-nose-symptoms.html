de", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Runny nose with persistent cough,", "bbox": [595.4, 228.1, 660.9, 248.3], "key": "p51-a0cd4531"}, {"id": "p51-out-e13", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "and/or frequent", "bbox": [597.9, 248.1, 658.4, 258.3], "key": "p51-8ca5afc5"}, {"id": "p51-out-e14", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "throat clearing", "bbox": [600.3, 258.1, 654.0, 268.3], "key": "p51-848b8619"}, {"id": "p51-out-e15", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Upper airway cough syndrome", "bbox": [594.4, 282.7, 661.7, 303.7], "key": "p51-4c77f343"}, {"id": "p51-out-e16", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "(postnasal drip)", "bbox": [597.0, 302.7, 659.2, 313.7], "key": "p51-9ab31317"}, {"id": "p51-out-e17", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely • Check throat: secretions or cobblestone appearance may be seen at back of throat. • Treat as for allergic rhinitis (see adjacent column). • If no improvement after 2 weeks, refer/discuss.", "bbox": [593.4, 313.5, 660.8, 463.7], "key": "p51-615b011b"}, {"id": "p51-out-e18", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Sore throat or fever for less than 3 days", "bbox": [58.2, 228.1, 199.8, 238.3], "key": "p51-2b217b08"}, {"id": "p51-out-e19", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Any of: temperature ≥ 38°C, chills, nausea, sore muscles?", "bbox": [39.7, 253.5, 218.3, 273.7], "key": "p51-2e835257"}, {"id": "p51-out-e20", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Acute viral infection", "bbox": [133.2, 313.7, 214.8, 324.7], "key": "p51-2c2ee3d2"}, {"id": "p51-out-e21", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely Common cold", "bbox": [46.9, 313.7, 182.2, 334.7], "key": "p51-084cbdd6"}, {"id": "p51-out-e22", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "likely", "bbox": [65.2, 324.5, 83.6, 334.7], "key": "p51-00d8ddb4"}, {"id": "p51-out-e23", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Firmly pinch nostrils together for 10 minutes with patient sitting and leaning forward. • Check BP: - If SBP < 80, give sodium", "bbox": [679.3, 218.1, 794.7, 268.3], "key": "p51-cf1e97d9"}, {"id": "p51-out-e24", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "chloride 0.9% 1L IV rapidly, repeat until systolic BP > 80. Continue 1L 6 hourly. Stop if breathing worsens. - If ≥ 140/90 148. • If still bleeding, insert bismuth iodoform paraffin paste (BIPP) soaked ribbon gauze into nostril/s:", "bbox": [679.3, 267.4, 796.2, 358.3], "key": "p51-54784cf3"}, {"id": "p51-out-e25", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "- If bleeding stops, advise to", "bbox": [684.9, 358.1, 789.0, 368.3], "key": "p51-d2589063"}, {"id": "p51-out-e26", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "return next day to remove BIPP gauze. - If bleeding persists, refer", "bbox": [684.9, 368.1, 788.4, 398.3], "key": "p51-d955dd14"}, {"id": "p51-out-e27", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "urgently. • If patient on aspirin or warfarin, doctor to review medication and if on warfarin, check INR. • Advise to avoid nose-picking and contact sport if recurrent bleeds. • If continually rubbing or itchy nose, consider allergic rhinitis (see adjacent). • If recurrent bleeds and no improvement with above management, refer.", "bbox": [679.3, 398.1, 801.5, 528.3], "key": "p51-d6492a8d"}, {"id": "p51-out-e28", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Bleeding nose", "bbox": [714.7, 192.6, 766.8, 202.8], "key": "p51-31f56219"}, {"id": "p51-out-e29", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Approach to the patient with nose symptoms not needing urgent attention If sore throat, mild fever and a thick grey layer in nose/throat (pseudomembrane), consider diphtheria 53.", "bbox": [222.4, 146.2, 621.4, 167.3], "key": "p51-0700b10b"}, {"id": "p51-out-e30", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Manage according to nose symptom/s:", "bbox": [349.1, 167.1, 492.8, 177.3], "key": "p51-c7d3c38d"}, {"id": "p51-out-e31", "page": 51, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Yes No", "bbox": [69.1, 289.1, 179.0, 299.2], "key": "p51-372ec676"}], "boxes": [{"box": 1, "rect": [35.5, 86.5, 806.4, 128.8]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAABZCAIAAAALu2TgAAAACXBIWXMAABcSAAAXEgFnn9JSAAA0x0lEQVR4nO3dZ1BVWbsn8L7vvVX3w8yXqZm6NVN17205REVQEEQFVBQxizkgBgyAASMmTJgwNWpDq23GhAFRURFRFBVBoiAiJkwoioqoCIq23WceeHD1du/DOQdED/j+q35l7b12WunQtZ5ee+2fXv6nCQAAAAAAAAAAQMPyk8FzAAAAAAAAAAAAUFOIagEAAAAAAAAAQMPzRVTr/eYV73etAQAAAAAAAAAAqIfKFvlrjmr9+TJV/cd1AAAAAAAAAACAeuhjUgSiWgAAAAAAAAAA0MAgqgUAAAAAAAAAAA0PoloAAAAAAAAAANDwIKoFAAAAAAAAAAAND6 \" \"finding\"))\n  (check_for\n    (clinical_finding (snomed_concept \"Injury of head\" \"disorder\"))\n    (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Clear\" \"qualifier value\")) (qualifier (snomed_concept \"Watery\" \"qualifier value\")))\n  )\n)\n(task\n  \"Check for causes of nose symptoms\"\n  adult\n  ;; \"nose symptoms\": general concept; Nasal discharge, Nasal congestion and Bleeding from nose are descendants\n  (clinical_finding (snomed_concept \"Nose finding\" \"finding\"))\n  (check_for\n    ;; The page's symptom columns: Blocked/runny nose, Bleeding nose\n    (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\"))\n    (clinical_finding (snomed_concept \"Bleeding from nose\" \"finding\"))\n\n    ;; Diphtheria\n    (clinical_finding (snomed_concept \"Sore throat\" \"finding\"))\n    (clinical_finding (snomed_concept \"Fever\" \"finding\") (qualifier (snomed_concept \"Mild\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Pseudomembrane\" \"morphologic abnormality\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Pseudomembrane\" \"morphologic abnormality\") (finding_site (snomed_concept \"Pharyngeal structure\" \"body structure\")))\n\n    ;; Common cold / acute viral infection\n    (clinical_finding (snomed_concept \"Chill\" \"finding\"))\n    (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n    (clinical_finding (snomed_concept \"Muscle pain\" \"finding\"))\n\n    ;; Sinusitis\n    (clinical_finding (snomed_concept \"Tenderness over frontal sinus\" \"finding\"))\n    (clinical_finding (snomed_concept \"Tenderness over maxillary sinus\" \"finding\"))\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    (clinical_finding (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n\n    ;; Allergic rhinitis\n    (clinical_finding (snomed_concept \"Sneezing\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Itching\" \"finding\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")) (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))\n\n    ;; Upper airway cough syndrome (postnasal drip)\n    (clinical_finding (snomed_concept \"Persistent cough\" \"finding\"))\n    (clinical_finding (snomed_concept \"Clearing throat - hawking\" \"finding\") (qualifier (snomed_concept \"Frequent\" \"qualifier value\")))\n\n    ;; Bleeding nose\n    (clinical_finding (snomed_concept \"Repetitive rubbing of body parts\" \"finding\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")))\n    (clinical_finding (snomed_concept \"Itching\" \"finding\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose possible diphtheria from nose symptoms\"\n  (diagnosis\n    (snomed_concept \"Diphtheria caused by Corynebacterium diphtheriae\" \"disorder\")\n    possible\n  )\n  adult\n  (and (clinical_finding (snomed_concept \"Sore throat\" \"finding\"))\n       (clinical_finding (snomed_concept \"Fever\" \"finding\") (qualifier (snomed_concept \"Mild\" \"qualifier value\")))\n       (or (clinical_finding (snomed_concept \"Pseudomembrane\" \"morphologic abnormality\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Pseudomembrane\" \"morphologic abnormality\") (finding_site (snomed_concept \"Pharyngeal structure\" \"body structure\")))))\n)\n(system_diagnosis_rule\n  \"Diagnose probable common cold from nose symptoms\"\n  (diagnosis\n    (snomed_concept \"Common cold\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    ;; Blocked/runny nose\n    (or (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\"))\n        (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\")))\n    ;; Sore throat or fever for less than 3 days\n    (or (<= (onset (clinical_finding (snomed_concept \"Sore throat\" \"finding\"))) (time_ago 3 days))\n        (<= (onset (active_condition (snomed_concept \"Fever\" \"finding\"))) (time_ago 3 days)))\n    ;; Any of: temperature >= 38, chills, nausea, sore muscles? -> No\n    (< (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38)\n    (no (clinical_finding (snomed_concept \"Chill\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Nausea\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Muscle pain\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable acute viral infection from nose symptoms\"\n  (diagnosis\n    (snomed_concept \"Acute viral disease\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    ;; Blocked/runny nose\n    (or (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\"))\n        (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\")))\n    ;; Sore throat or fever for less than 3 days\n    (or (<= (onset (clinical_finding (snomed_concept \"Sore throat\" \"finding\"))) (time_ago 3 days))\n        (<= (onset (active_condition (snomed_concept \"Fever\" \"finding\"))) (time_ago 3 days)))\n    ;; Any of: temperature >= 38, chills, nausea, sore muscles? -> Yes\n    (or (>= (measurement (snomed_concept \"Body temperature\" \"observable entity\") °C) 38)\n        (clinical_finding (snomed_concept \"Chill\" \"finding\"))\n        (clinical_finding (snomed_concept \"Nausea\" \"finding\"))\n        (clinical_finding (snomed_concept \"Muscle pain\" \"finding\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable sinusitis from nose symptoms\"\n  (diagnosis\n    (snomed_concept \"Sinusitis\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    (or (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\"))\n        (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\")))\n    ;; Pain when pushing on forehead/cheeks\n    (or (clinical_finding (snomed_concept \"Tenderness over frontal sinus\" \"finding\"))\n        (clinical_finding (snomed_concept \"Tenderness over maxillary sinus\" \"finding\")))\n    ;; Headache worse on bending forward (no precoordinated concept; general Headache used)\n    (clinical_finding (snomed_concept \"Headache\" \"finding\"))\n    ;; Recent common cold\n    (clinical_finding (snomed_concept \"Common cold\" \"disorder\") (qualifier (snomed_concept \"Recent\" \"qualifier value\")))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable allergic rhinitis from nose symptoms\"\n  (diagnosis\n    (snomed_concept \"Allergic rhinitis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Recurrent sneezing or itchy/runny/blocked nose most days for > 4 weeks\n  (or (>= (onset (clinical_finding (snomed_concept \"Sneezing\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))) (time_ago 4 weeks))\n      (>= (onset (clinical_finding (snomed_concept \"Itching\" \"finding\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")) (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))) (time_ago 4 weeks))\n      (>= (onset (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))) (time_ago 4 weeks))\n      (>= (onset (clinical_finding (snomed_concept \"Nasal congestion\" \"finding\") (qualifier (snomed_concept \"Recurrent\" \"qualifier value\")))) (time_ago 4 weeks)))\n)\n(system_diagnosis_rule\n  \"Diagnose probable postnasal drip from nose symptoms\"\n  (diagnosis\n    (snomed_concept \"Posterior rhinorrhea\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Runny nose with persistent cough and/or frequent throat clearing\n  (and (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Persistent cough\" \"finding\"))\n           (clinical_finding (snomed_concept \"Clearing throat - hawking\" \"finding\") (qualifier (snomed_concept \"Frequent\" \"qualifier value\")))))\n)\n(system_diagnosis_rule\n  \"Diagnose possible allergic rhinitis from nosebleed\"\n  (diagnosis\n    (snomed_concept \"Allergic rhinitis\" \"disorder\")\n    possible\n  )\n  adult\n  ;; Bleeding nose: if continually rubbing or itchy nose, consider allergic rhinitis\n  (and (clinical_finding (snomed_concept \"Bleeding from nose\" \"finding\"))\n       (or (clinical_finding (snomed_concept \"Repetitive rubbing of body parts\" \"finding\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")))\n           (clinical_finding (snomed_concept \"Itching\" \"finding\") (finding_site (snomed_concept \"Nasal structure\" \"body structure\")))))\n)\n(system_priority_evaluation\n  \"Urgent: nose symptoms with head injury and clear watery nasal discharge\"\n  adult\n  Urgent\n  ;; The nose-symptom complaint is implied by the clear watery nasal discharge itself\n  (and (clinical_finding (snomed_concept \"Injury of head\" \"disorder\"))\n       (clinical_finding (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Clear\" \"qualifier value\")) (qualifier (snomed_concept \"Watery\" \"qualifier value\"))))\n)\n", "rules": [{"atom": "task", "description": "Check for urgent nose symptom conditions", "ages": ["adult"], "raw": "(task \"Check for urgent nose symptom conditions\" \"adult\" (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Nose finding\" \"finding\")) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Injury of head\" \"disorder\")) (finding (snomed_concept \"Clinical finding\" "only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 51 – Nose symptoms: flowchart\n\nSource: APC 2026 e-book page 51.\n\n```mermaid\nflowchart TD\n    START[\"Patient with nose symptoms\"] --> RB{\"Head injury with clear watery<br/>discharge from nose?\"}\n    RB -- Yes --> URG[\"Give urgent attention. Refer urgently (→30)\"]\n    RB -- No --> APP[\"Approach to the patient not needing urgent attention\"]\n    APP --> DIPH{\"Sore throat, mild fever and thick grey layer<br/>in nose/throat (pseudomembrane)?\"}\n    DIPH -- Yes --> DIPHX[\"Consider diphtheria (→53)\"]\n    APP --> SYM[\"Manage according to nose symptom/s\"]\n    SYM --> BR[\"Blocked/runny nose: ask about duration and associated symptoms\"]\n    SYM --> BL[\"Bleeding nose\"]\n    BR --> A[\"Sore throat or fever for less than 3 days\"]\n    A --> AQ{\"Any of: temperature ≥ 38°C, chills,<br/>nausea, sore muscles?\"}\n    AQ -- No --> CC[\"Common cold likely\"]\n    AQ -- Yes --> AVI[\"Acute viral infection likely\"]\n    BR --> S[\"Pain when pushing on forehead/cheeks, headache worse<br/>on bending forward, recent common cold\"]\n    S --> SIN[\"Sinusitis likely\"]\n    BR --> AR[\"Recurrent sneezing or itchy/runny/blocked nose<br/>most days for > 4 weeks\"]\n    AR --> ARX[\"Allergic rhinitis likely\"]\n    BR --> U[\"Runny nose with persistent cough and/or<br/>frequent throat clearing\"]\n    U --> UX[\"Upper airway cough syndrome (postnasal drip) likely\"]\n    BL --> BLR{\"Continually rubbing or itchy nose?\"}\n    BLR -- Yes --> ARP[\"Consider allergic rhinitis\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Nose symptoms (entry) | `(clinical_finding \"Nose finding\")`; Nasal discharge, Nasal congestion and Bleeding from nose are descendants | due_to of `Check for urgent nose symptom conditions` and `Check for causes of nose symptoms` |\n| Red box: head injury with clear watery discharge | Injury of head **and** Nasal discharge qualified Clear + Watery | `Urgent: nose symptoms with head injury and clear watery nasal discharge` |\n| Consider diphtheria | Sore throat **and** Fever (Mild) **and** Pseudomembrane in nose or pharynx | `Diagnose possible diphtheria from nose symptoms` |\n| < 3 days, AQ = No | Blocked/runny nose **and** sore throat or fever with onset within 3 days **and** temperature < 38 and no chill, nausea, muscle pain | `Diagnose probable common cold from nose symptoms` |\n| < 3 days, AQ = Yes | Same first two parts **and** any of temperature ≥ 38, chill, nausea, muscle pain | `Diagnose probable acute viral infection from nose symptoms` |\n| Sinusitis likely | Blocked/runny nose **and** frontal or maxillary sinus tenderness **and** headache **and** recent common cold | `Diagnose probable sinusitis from nose symptoms` |\n| Allergic rhinitis likely | Any of recurrent sneezing / itchy nose / runny nose / blocked nose with onset at least 4 weeks ago | `Diagnose probable allergic rhinitis from nose symptoms` |\n| Upper airway cough syndrome likely | Nasal discharge **and** (persistent cough **or** frequent throat clearing) | `Diagnose probable postnasal drip from nose symptoms` |\n| Bleeding nose → consider allergic rhinitis | Bleeding from nose **and** (repetitive rubbing of nose **or** itchy nose) | `Diagnose possible allergic rhinitis from nosebleed` |\n\n## Notes\n\n- The flowchart under \"Blocked/runny nose\" has four parallel columns with no Yes/No between them; each is\n  modelled as its own diagnosis rule.\n- Everything inside the \"likely\" boxes (medicines, referral, checks of BP and throat, follow-up) is\n  management and is not modelled.\n", "questions": "# Page 51 – Nose symptoms: remaining questions\n\n## Decisions made\n\n- **Entry trigger.** \"Nose symptoms\" is not one recorded symptom. Both check_for tasks fire on the\n  general `(clinical_finding \"Nose finding\")`, since descendants match in `due_to` and the page names\n  the complaint generally. Nasal discharge (a recorded common symptom), Nasal congestion and Bleeding\n  from nose are all descendants (checked with `snomed is_a`). \"Nose finding\" itself is not a recorded\n  common symptom or warning sign. Nasal congestion and Bleeding from nose are in the causes task's\n  `check_for`, because rules use them as evidence.\n- **Blocked nose** is `Nasal congestion` (finding), the symptom form; `Nasal obstruction` (disorder)\n  was the alternative.\n- **Red box.** \"Head injury with clear watery discharge from nose\" is encoded as Injury of head **and**\n  Nasal discharge qualified Clear and Watery → `Urgent` (\"Give urgent attention … Refer urgently\").\n  The priority rule doesn't repeat the nose-symptom `or`: the watery nasal discharge is itself a nose\n  symptom, and the gate flagged the `or` as always true. Cerebrospinal fluid rhinorrhea was considered\n  and rejected because it is the diagnosis the box is screening for, not what the health worker sees.\n- **Common cold / acute viral infection.** Both need blocked/runny nose and sore throat or fever with\n  onset within 3 days, written `(<= (onset …) (time_ago 3 days))` per the time-comparison decision.\n  \"No\" → temperature < 38 °C and no chill, nausea or muscle pain. \"Yes\" → any of temperature ≥ 38 °C,\n  chill, nausea, muscle pain.\n- **Sinusitis.** All of: blocked/runny nose, frontal or maxillary sinus tenderness (\"pain when pushing\n  on forehead/cheeks\"), headache, recent common cold. The page gives no and/or between the features.\n- **Allergic rhinitis.** Any of recurrent sneezing, itchy nose, runny nose or blocked nose with onset\n  at least 4 weeks ago (\"> 4 weeks\" written as `>=`). \"May have itchy eyes, ears or throat\" is\n  descriptive and doesn't change the logic, so it is not encoded.\n- **Upper airway cough syndrome (postnasal drip).** Runny nose **and** (persistent cough **or**\n  frequent throat clearing); \"and/or\" read as `or`.\n- **Bleeding nose.** \"If continually rubbing or itchy nose, consider allergic rhinitis\" → possible\n  allergic rhinitis from bleeding nose plus repetitive rubbing of the nose or itchy nose.\n- **Diphtheria.** \"Consider diphtheria\" → possible: sore throat, mild fever (Fever + Mild) and a\n  pseudomembrane in the nose or pharynx.\n- No Shock/SBP < 80 rule: the SBP < 80 on this page is a management step in the bleeding-nose column.\n- No `measure` tasks: the only measurements (temperature, BP) are routine vitals.\n\n## Could not model\n\n- \"Headache worse on bending forward\": encoded as general Headache, so the sinusitis rule fires\n  **more often** than the page intends on that element.\n- \"Most days\" (allergic rhinitis): only the Recurrent qualifier and onset ≥ 4 weeks.\n- \"Mild\" fever (diphtheria) uses `Fever` + `Mild` qualifier, a form that fires only when the fever is\n  recorded with that qualifier; the plain `(active_condition Fever)` anchor would fire more often.\n- The common cold \"No\" branch needs chill, nausea and muscle pain each recorded as absent, and a\n  temperature; if any is unrecorded the rule does not fire (fires less often).\n- \"Thick grey layer\": only the Pseudomembrane morphology with finding site.\n- Management within the \"likely\" boxes (medicines, antibiotic criteria such as symptoms ≥ 10 days,\n  refer-same-day list, BP checks and fluids for bleeding nose, BIPP gauze, follow-up) is management\n  and out of scope.\n\n## SNOMED gaps\n\n- \"Upper airway cough syndrome\": no FSN; used Posterior rhinorrhea (disorder), synonym postnasal drip.\n- \"Diphtheria\" (disorder): no exact FSN; used Diphtheria caused by Corynebacterium diphtheriae.\n- \"Throat structure\": none; used Pharyngeal structure.\n- \"Itchy nose\" / \"Rubbing nose\": none; used Itching and Repetitive rubbing of body parts with finding\n  site Nasal structure. `Repetitive rubbing of body parts` sits under \"Repetitive routines\"\n  (behaviour), so its fit is uncertain.\n- \"Head injury\": used Injury of head. \"Chills\": used Chill. \"Throat clearing\" (finding): used\n  Clearing throat - hawking.\n- Headache aggravated by bending: none found (see above).\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Sinusitis: should all three features be needed, or is sinus tenderness with a recent cold enough?\n- Should the urgent rule use Cerebrospinal fluid rhinorrhea, or is the observable form (clear watery\n  nasal discharge after head injury) right for a primary-care nurse?\n- Is \"mild fever\" for diphtheria best captured with a Mild qualifier, or should any fever count?\n- Allergic rhinitis: does \"Recurrent\" apply only to sneezing, or also to itchy/runny/blocked nose? The\n  final build requires the Recurrent qualifier on all four (plus onset ≥ 4 weeks).\n- Should the common cold \"No\" branch fire when chills/nausea/muscle pain are simply not recorded?\n- Is \"Repetitive rubbing of body parts\" at the nose an acceptable encoding of \"continually rubbing … nose\"?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent nose symptom conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Nose finding\" \"finding\"))", "element_keys": ["p51-a6b50479"], "quote": "nose symptoms"}, {"claim_id": "c002", "rule": "Check for urgent nose symptom conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Injury of head\" \"disorder\"))", "element_keys": ["p51-a6b50479"], "quote": "Head injury"}, {"claim_id": "c003", "rule": "Check for urgent nose symptom conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Nasal discharge\" \"finding\") (qualifier (snomed_concept \"Clear\" \"qualifier value\")) (qualifier (snomed_concept \"Watery\" \"qualifier value\")))", "element_keys": ["p51-a6b50479"], "quote": "clear watery discharge from nose"}, {"claim_id async function exportDecisions() {

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }

}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }

}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;

    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {

  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];

    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,

  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}

}
function treeHtml(n, rule) {

function renderRules() {

// ---------- source pane ----------
function renderSource() {

    }).join("");

  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));

function elHtml(e) {

// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes

  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
