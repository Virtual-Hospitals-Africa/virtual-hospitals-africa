p60-1432cd44"}, {"id": "p60-out-e07", "page": 60, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Advise a high fibre diet (vegetables, fruit, coarse mielie meal, bran and cooked dried prunes), with adequate fluid intake.", "bbox": [49.1, 415.9, 121.2, 470.0], "key": "p60-63a37d3c"}, {"id": "p60-out-e08", "page": 60, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If patient smokes, encourage to stop 164.", "bbox": [210.7, 429.4, 269.2, 456.5], "key": "p60-1e89f954"}, {"id": "p60-out-e09", "page": 60, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Treat the patient with constipation • If no better with diet and exercise, give sennosides A and B 13.5mg at night or lactulose 10-20 mL once daily. If needed, increase sennosides A and B to 2 tablets (up to 4 tablets at night), or increase lactulose to 12 hourly. • If any of: > 65 years old/frail, postpartum woman, spinal disease, severe cognitive impairment, pelvic organ/rectal prolapse after surgery, refer to rehabilitation services for bowel care. • If no response after 1 week of laxative use, or if recent change in bowel habits, weight loss, blood in stool or occult blood positive, or cause uncertain, refer.", "bbox": [51.0, 488.4, 773.8, 539.5], "key": "p60-3ead8ac8"}, {"id": "p60-out-e10", "page": 60, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Assess the patient with constipation for colorectal cancer • Patient has an increased risk of colorectal cancer if > 50 years old and any of: - Previous history of colorectal cancer, polyps, ulcerative colitis, or Crohn's disease - Family history of colorectal cancer in first-degree relative (parent, sibling or child), especially if diagnosed before age 60, or family history of multiple polyps or Lynch syndrome. • Ask about common colorectal cancer symptoms: - Change in bowel habits like constipation, diarrhoea, or change in stool consistency - Rectal bleeding or visible blood in stool - Persistent abdominal discomfort including cramps, gas or pain - A feeling that the bowel does not empty completely after defecation (tenesmus) - Unexplained weight loss/weakness/fatigue. • If patient has any of above symptoms, discuss/refer.", "bbox": [51.0, 254.5, 701.5, 365.6], "key": "p60-cb8c75ea"}], "boxes": [{"box": 1, "rect": [35.5, 86.6, 806.4, 131.6]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAABfCAIAAADd4of9AAAACXBIWXMAABcSAAAXEgFnn9JSAAA5T0lEQVR4nO2dh1cV1/f2f3/Iu9bXBBXF2HvQ2CMaW+zG3hXFioqiKCoWIoqaYMNesGHBgiIIgigiCIIQu7EGjRp7N/d9uBtOxrn3zh1QA9c8a30W686ZM+fs0ybuJ+fs+b8H/68sIYQQQgghhBBCCCGuxf+VuAWEEEIIIYQQQgghhBQVqlqEEEIIIYQQQgghxPX4QNV6tXHS6+3TCCGEEEIIIYQQQggphbxYOMi+qmV5eNLyLocQQgghhBBCCCGEkFLI+9NrqWoRQgghhBBCCCGEEBeDqhYhhBBCCCGEEEIIcT2oahFCCCGEEEIIIYQQ14OqFiGEEEIIIYQQQghxPahqEUIIIYQQQgghhBDXg6oWIYQQQgghhBBCCHE9qGoRQgghhBBCCCGEENeDqhYhhBBCCCGEEEIIcT2oahFCCCGEEEIIIYQQ14OqFiGEEEIIIYQQQghxPahqEUIIcW2ePEgvcRuIMa41RieO74mN2QZK3BK7vH2Z/fJpZombYcuzv878/dYow2/nYqVjH95LLXFrzfMvzF5XWSDvXmXLCJ4+tb/EjSGEEEIEqlqEEEJKNa+fZ+2L2hgaOm/c+NFDhg72m+wbFhZy9VKC3J03L9Dtf2VGjR5Z4nYSR7jcGLVu1RoGgxK3xJab15Lq16tfvVq10iYrRB/c4uFeoXmz5k8fOhRoAqZPkY49dTKqxA02yb8we11ogTx5kC4j2LNXzxI3hhBCCBGoahFCCCm97N+38fsW34sfpWXNmqWSoXPnTrisWb3Gu1fZJW7tZ+Xl08yYw1uDg2dt2rS8GI+nnIgKCwuZPTvAaeLHcO9OSmTk2oDpU1JT9qnEzzpGF387un59mK/vGAMxpagGlx5Vy3aAjsRsE9vCwxd/fPkfOam0zJ0bKIadzTjkqORSrmrZtfnTzt5/oYrPClUtQgghpRCqWoQQQkopGzcuUzJWK69WY8f6+PtPGjpsSK0aNXOyYyRPRnr0jED/Y/GRJW7t5ybzTLR0RVDQ9GI8XqmiB5798ccfnSZ+DKtWhYqRh6IjVOJnHaPhw4dKjcU71GbX4NKjatkO0NuX2cuWhSxcOOfR/bSPL/8jJ5WWP26emDN3xoYNYQYll3JVy67Nn3b2/gtVfFaoahFCCCmFUNUihBBSGvntXKy49BXLu0fuXGN5l6tuwbFXl79fSbz421GA33/+kSK/7+edUpkvnY9HCv6qlMf3044n7U5O2vPYgS6AdClHCSX37hSU/PxxBi7/+vN0YaW5L59mHo3boWqEbVkZh+Jitz/IS33/Jkey6SqC/x97ZDv829fPs1TinRvJyHnjaiJ+5906cfhQRMrJKJUBNe6L2ij+5CS/8ciZd9vOf6bx4KmTU oncept_different_form": []}, "measured": {"only_A": [], "only_B": [], "both": [], "is_a_related": [], "same_concept_different_form": []}}}, "flowchart": "# Page 60 – Constipation: flowchart\n\nSource: APC 2026 e-book page 60. The page has no drawn flowchart; this\ntraces its red box and its multi-step \"if … check … if present, X likely\" bullets.\n\n```mermaid\nflowchart TD\n    C[\"Patient with constipation\"]\n    C --> U{\"No stools or flatus/wind in the past 24 hours<br/>with abdominal pain/distension?\"}\n    U -- Yes --> URG[\"Give urgent attention. Refer same day.\"]\n    U -- No --> A[\"Approach to the patient not needing urgent attention\"]\n    A --> HB[\"Check Hb. If &lt; 12 (woman) or &lt; 13 (man): anaemia likely ↻ 44\"]\n    A --> TSH[\"Weakness/tiredness, weight gain, low mood, dry skin, cold intolerance → check TSH\"]\n    A --> G{\"&gt; 65 years, bed-bound/receiving palliative care,<br/>or overflow diarrhoea?\"}\n    G -- Yes --> R{\"Solid immobile bulk of stool in rectum?\"}\n    R -- Yes --> IMP[\"Impaction likely: refer\"]\n    C --> CRC{\"Any common colorectal cancer symptom?<br/>change in bowel habits, rectal bleeding/blood in stool,<br/>persistent abdominal discomfort (cramps, gas, pain),<br/>tenesmus, unexplained weight loss/weakness/fatigue\"}\n    CRC -- Yes --> REF[\"Discuss/refer (colorectal cancer)\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Patient with constipation | `(clinical_finding Constipation)`, a recorded common symptom | trigger of `Check for urgent constipation conditions` and `Check for colorectal cancer symptoms in constipation` |\n| Urgent box | Constipation **and** Obstipation with onset ≥ 24 hours ago **and** Unable to break wind with onset ≥ 24 hours ago **and** (abdominal pain **or** distension of abdomen) | `Urgent: constipation with no stools or flatus for 24 hours` |\n| Anaemia (Hb) | Not modelled: Hb has no observable/unit in the language | none |\n| TSH bullet | Not modelled: TSH is a lab value with no unit; no diagnosis is named | none |\n| Impaction gate | Constipation **and** (bed-ridden **or** seen by palliative care service **or** chronic constipation with overflow). \"> 65 years\" cannot be expressed | `Check for faecal impaction in constipation` (task), and the gate inside `Diagnose probable faecal impaction` |\n| Bulk of stool in rectum → impaction likely | Hard stool with finding site rectum, plus the gate | `Diagnose probable faecal impaction` |\n| Colorectal cancer symptoms | Any of the listed symptoms in a constipated patient → `possible` colorectal cancer | `Diagnose possible colorectal cancer in constipation` |\n| Treat / advise sections | Management | none |\n", "questions": "# Page 60 – Constipation: remaining questions\n\n## Decisions made\n\n- **Trigger.** Constipation is a recorded common symptom, so `(clinical_finding Constipation)` anchors\n  all three tasks and the rules.\n- **Red box: \"No stools or flatus/wind in the past 24 hours with abdominal pain/distension\".** I read\n  this as *neither* stools *nor* flatus for at least 24 hours, **and** (abdominal pain **or**\n  distension). \"No stools\" is encoded as `Obstipation` (disorder, a kind of Constipation). SNOMED has no\n  \"absent bowel movement\" finding. \"No flatus\" is `Unable to break wind`. Each has\n  `(>= (onset …) (time_ago 24 hours))`, using `>=` because the database rejects other comparators in\n  onset comparisons. The priority is `Urgent` (\"Give urgent attention … Refer same day\"). The\n  referral itself is a management step.\n- **Faecal impaction.** The page says: \"If > 65 years, bed-bound/receiving palliative care, or overflow\n  diarrhoea, check for solid immobile bulk of stool in rectum. If present, impaction likely.\" This is\n  encoded as a task that checks the rectum when the gate is met, plus a `probable` Fecal impaction\n  rule: constipation, the gate, and hard stool with finding site rectum.\n- **Colorectal cancer.** The page says \"Assess the patient with constipation for colorectal cancer …\n  If patient has any of above symptoms, discuss/refer\". I read this as \"consider colorectal cancer\"\n  and wrote a `possible` rule for `Malignant neoplasm of cecum and/or colon and/or rectum`, which fires\n  on any listed symptom in a constipated patient.\n- **Change in bowel habits.** I first used `Altered bowel function`. The gate flagged that\n  Constipation is a kind of Altered bowel function, which made the rule true for every constipated\n  patient. It is replaced by `Diarrhea` (the page's other example). Note that `Chronic constipation\n  with overflow` is a kind of Diarrhea, so overflow diarrhoea also raises possible colorectal cancer.\n  That fits the page's wording.\n\n- **Reconciled build.** This is the reconciler's final build, based on builder A. Builder B's\n  build was narrower (no colorectal cancer rule, ungated impaction check). Every difference and its\n  reason is in `reconcile.json`.\n- **Overflow diarrhoea.** `Chronic constipation with overflow` (disorder; a kind of Chronic\n  constipation and of Chronic diarrhea) matches the page's \"prolonged constipation followed by\n  watery stool\". The other builder's `Spurious diarrhea - overflow` (finding) sits under\n  Incontinence of feces, so it describes soiling rather than the page's definition; not used.\n\n## Could not model\n\n- **\"> 65 years\"** (impaction gate) has no age-in-years expression in the language. The impaction task\n  and rule fire **less often** than the page intends: a patient over 65 who is not bed-bound, not\n  receiving palliative care and has no overflow diarrhoea is not checked.\n- **\"Check Hb. If < 12 (woman) or < 13 (man), anaemia likely\"**: Hb has no observable or unit in the\n  language, and the rule has nothing left without it. Not encoded.\n- **\"If weakness/tiredness, weight gain, low mood, dry skin or cold intolerance, check TSH. If abnormal,\n  refer\"**: TSH is a lab value with no unit, and the page names no diagnosis. Not encoded.\n- **Colorectal cancer risk (\"> 50 years old and any of\" previous colorectal cancer/polyps/UC/Crohn's,\n  family history, Lynch syndrome)**: this is a risk statement, not a diagnosis, and age in years is\n  not representable. Not encoded.\n- **\"Persistent\"** abdominal discomfort and **\"Unexplained\"** weakness/fatigue: no qualifier for these.\n  Unqualified concepts are used, so the possible rule fires **more often** than the page intends.\n- **\"Change in stool consistency\"**: there is no concept that would not overlap with constipation\n  itself. Not encoded.\n- Medication review, pregnancy (175), palliative care (191), lifestyle advice, laxatives and the\n  referral criteria in \"Treat the patient with constipation\" are management. They are not encoded.\n\n## SNOMED gaps\n\n- \"No stools / absolute constipation\": no concept found. `Obstipation` (disorder) was used instead.\n- \"Receiving palliative care\": no situation or finding found. `Seen by palliative care service`\n  (finding) was used instead (low confidence).\n- \"Solid immobile bulk of stool in rectum\": no precoordinated concept. `Hard stool` was used with\n  finding site `Rectum structure`. `Feces in rectum` was rejected because it does not say solid or\n  immobile.\n- \"Tenesmus\" alone is not a finding. `Tenesmus of anus and/or rectum` was used.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n1. Does \"No stools or flatus/wind\" mean neither stools nor flatus (as encoded), or either one?\n2. Is Obstipation an acceptable stand-in for \"no stools in 24 hours\"?\n3. Should the colorectal cancer symptoms raise a possible colorectal cancer diagnosis for *every*\n   constipated patient who has them, or only for patients with the risk factors (> 50 years plus\n   history)?\n4. Should the impaction rule fire on the rectal finding alone, without the gate (the \"> 65 years\"\n   part of the gate is lost)?\n5. The colorectal cancer section says \"assess … for colorectal cancer\" and \"discuss/refer\", not\n   \"consider\" or \"likely\". Should it produce a `possible` colorectal cancer diagnosis (as encoded),\n   or only a referral flag once management tasks are in scope? (The other builder left it out.)\n6. If Obstipation is not acceptable, is constipation with onset ≥ 24 hours ago (the other builder's\n   choice) a better stand-in for \"no stools in the past 24 hours\"?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent constipation conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Constipation\" \"finding\"))", "element_keys": ["p60-3ea295c1"], "quote": "patient with constipation"}, {"claim_id": "c002", "rule": "Check for urgent constipation conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Obstipation\" \"disorder\"))", "element_keys": ["p60-e3979f69"], "quote": "No stools"}, {"claim_id": "c003", "rule": "Check for urgent constipation conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Unable to break wind\" \"finding\"))", "element_keys": ["p60-e3979f69"], "quote": "flatus/wind"}, {"claim_id": "c004", "rule": "Check for urgent constipation conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Abdominal pain\" \"finding\"))", "element_keys": ["p60-e3979f69"], "quote": "abdominal pain"}, {"claim_id": "c005", "rule": "Check for urgent constipation conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Distension of abdomen\" \"finding\"))", "element_keys": ["p60-e3979f69"], "quote": "distension"}, {"claim_id": "c006", "rule": "Check for urgent constipation conditions", "role": "check_for", "expr": "(finding (snomed_concept \"Clinical finding\" \"findin ug": "60-constipation", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: Bed-ridden, Seen by palliative care service, Chronic constipation with overflow in the urgent task  vs  B: in the impaction task", "detail": [{"choice": "A", "final": "(Bed-ridden, Seen by palliative care service, Chronic constipation with overflow in check_for of \"Check for urgent constipation conditions\")", "reason": "Because the impaction task is gated on these findings (\"If > 65 years, bed-bound/receiving palliative care, or overflow diarrhoea, check …\"), they have to be asked about in the always-on constipation task.", "unsettled": false}]}, {"page": 60, "slug": "60-constipation", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: Chronic constipation with overflow (disorder)  vs  B: Spurious diarrhea - overflow (finding)", "detail": [{"choice": "A", "final": "(clinical_finding (snomed_concept \"Chronic constipation with overflow\" \"disorder\"))", "reason": "The page defines overflow diarrhoea as \"prolonged constipation followed by watery stool\"; A's concept is a kind of Chronic constipation and Chronic diarrhea, while B's sits under Incontinence of feces.", "unsettled": false}]}, {"page": 60, "slug": "60-constipation", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: colorectal cancer symptoms (Diarrhea, Rectal hemorrhage, Hematochezia, Abdominal discomfort, Abdominal colic, Flatulence symptom, Tenesmus of anus and/or rectum, Unexplained weight loss, Asthenia, Fatigue)  vs  B: none", "detail": [{"choice": "A", "final": "(clinical_finding (snomed_concept \"Diarrhea\" \"finding\")) (clinical_finding (snomed_concept \"Rectal hemorrhage\" \"disorder\")) (clinical_finding (snomed_concept \"Hematochezia\" \"finding\")) (clinical_finding (snomed_concept \"Abdominal discomfort\" \"finding\")) (clinical_finding (snomed_concept \"Abdominal colic\" \"finding\")) (clinical_finding (snomed_concept \"Fl "use strict";
const D = JSON.parse(document.getElementById("data").textContent);

const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },

};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }

}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line

function parseLisp(s) {

    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;

    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";

// The rule's own text in the page's rule file: the top-level form whose description matches,

const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }

    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
