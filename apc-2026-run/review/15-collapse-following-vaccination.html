ptoms present.", "bbox": [90.7, 180.4, 397.8, 250.6], "key": "p15-d247855b"}, {"id": "p15-out-e04", "page": 15, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Sudden collapse", "bbox": [226.3, 155.0, 286.8, 165.2], "key": "p15-668d2784"}, {"id": "p15-out-e05", "page": 15, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Management: • If not already done, lie patient flat on back and raise legs. • Loosen any tight clothing: undo buttons around the neck, loosen tie or tight belt. • Apply cool cloth to face/neck. • Calmly reassure patient and explain what happened. • Check for any injuries they may have sustained while falling. • Stay with the patient until fully recovered. Patient should remain lying with legs raised until feeling better.", "bbox": [76.5, 290.5, 417.2, 371.5], "key": "p15-1220e69b"}, {"id": "p15-out-e06", "page": 15, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Refer if: • Head injury. • Known with a heart condition or other serious illness. • Patient has unusual symptoms, such as chest pain, shortness of breath, confusion, blurred vision, or difficulty talking.", "bbox": [90.7, 386.0, 397.4, 437.0], "key": "p15-1f44ce15"}, {"id": "p15-out-e07", "page": 15, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Fainting episode likely", "bbox": [213.2, 265.1, 299.8, 276.1], "key": "p15-833b98d5"}, {"id": "p15-out-e08", "page": 15, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Occurs 5-10 minutes after vaccination (up to 1 hour). • Loss of consciousness lasts > 1 minute and not relieved by lying patient down and raising legs. • BP < 90/60 and remains low • Pulse > 120 • Breathing: may have wheeze, stridor, cough • Other signs and symptoms (like swelling or rash) prese _finding (snomed_concept \"Swelling\" \"finding\")))\n    (no (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\")))\n    ;; complement of the delayed column's \"BP < 90/60\" and \"Pulse > 120\" (VHA does not support `not`)\n    (>= (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n    (>= (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)\n    (<= (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 120)\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable anaphylaxis after collapse following vaccination\"\n  (diagnosis\n    (snomed_concept \"Anaphylaxis\" \"disorder\")\n    probable\n  )\n  adult\n  ;; Delayed collapse column → \"Treat as anaphylaxis 28\"\n  (and\n    (clinical_finding (snomed_concept \"Collapse\" \"finding\"))\n    (clinical_finding (snomed_concept \"Vaccination given\" \"situation\"))\n    (or (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90)\n        (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60)\n        (> (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 120)\n        (clinical_finding (snomed_concept \"Wheezing\" \"finding\"))\n        (clinical_finding (snomed_concept \"Stridor\" \"finding\"))\n        (clinical_finding (snomed_concept \"Cough\" \"finding\"))\n        (clinical_finding (snomed_concept \"Swelling\" \"finding\"))\n        (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\"))\n    )\n  )\n)\n", "rules": [{"atom": "task", "description": "Check for collapse following vaccination features", "ages": ["adult"], "raw": "(task \"Check for collapse following vaccination features\" \"adult\" (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Collapse\" \"finding\")) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_c ac arrest / obstructed airway are existing Emergency warning signs | — |\n| Sudden collapse → Fainting episode likely | Collapse **and** vaccination given **and** no wheeze/stridor/cough/swelling/rash **and** SBP ≥ 90 **and** DBP ≥ 60 **and** pulse ≤ 120 (the complement of the delayed column's BP < 90/60 and pulse > 120) | `Diagnose probable fainting episode following vaccination` |\n| Delayed collapse → Treat as anaphylaxis 28 | Collapse **and** vaccination given **and** any of: SBP < 90, DBP < 60, pulse > 120, wheeze, stridor, cough, swelling, rash | `Diagnose probable anaphylaxis after collapse following vaccination` (page 28's rules then give the urgency) |\n| Timing (at time vs 5–10 min / up to 1 h) and LOC duration (20 s–1 min vs > 1 min, relieved or not) | Not representable: no time relative to another event, no event duration | — |\n| Refer if … | Management / referral, out of scope | — |\n\n## Notes\n\n- BP < 90/60 is read as systolic < 90 **or** diastolic < 60.\n- The two rules are written to be mutually exclusive: any one delayed-collapse feature routes away\n  from \"fainting\" towards anaphylaxis.\n", "questions": "# Page 15 – Collapse following vaccination: remaining questions\n\n## Decisions made\n\n- **The red box is a pointer** (\"Treat as anaphylaxis →28\"), but the page has its own triage logic\n  outside it: a sudden-collapse column ending in \"**Fainting episode** likely\" and a\n  delayed-collapse column ending in the red box. Both are encoded; the red-box element is cited by\n  the anaphylaxis diagnosis rather than listed as `cross_reference_only`.\n- **Trigger:** `(clinical_finding Collapse)`, quoted from the page title (there is no box header).\n  Vaccination is recorded by checking for `Vaccination given` (situation).\n- **\"Fainting episode likely\" → probable `Syncope` (finding)**; \"Fainting\" is a synonym of that\n  concept. `Vasovagal syncope` was considered but the page does not name the mechanism.\n- **\"Treat as anaphylaxis\" → probable `Anaphylaxis`**, so that page 28's anaphylaxis rules\n  (urgency, management) take over. No priority evaluation is written on this page.\n- **Any one delayed-column feature** (BP < 90/60, pulse > 120, wheeze, stridor, cough, swelling,\n  rash) with collapse after vaccination gives probable anaphylaxis. The page lists the features as a\n  picture without a count; the sudden column explicitly has \"no other signs or symptoms\".\n- **The two rules are mutually exclusive.** Fainting requires recorded absence of wheeze, stridor,\n  cough, swelling and rash, and SBP ≥ 90, DBP ≥ 60 and pulse ≤ 120. VHA's evidence code does not\n  support `not` (the gate failed with `Not supported not`), so the complement is written as explicit\n  `>=` / `<=` measurements.\n- BP < 90/60 is systolic < 90 **or** diastolic < 60 (Will's convention).\n- \"If no pulse/not breathing, start CPR ↻16\" is not encoded here: cardiac arrest and obstructed\n  airway are already Emergency warning signs, and page 16 holds the CPR logic.\n\n- **Reconciled from two builds.** Builder B wrote no anaphylaxis rule (red box as `cross_reference_only`)\n  and put `Vaccination given` in the task's trigger. The final build keeps builder A's anaphylaxis\n  rule (the delayed-collapse column is page logic outside the pointer) and A's trigger on Collapse\n  alone, checking for `Vaccination given`: nothing in the app records a vaccination, so a trigger\n  that requires it would never fire.\n\n## Could not model\n\n- **Timing relative to vaccination**: \"at the time of vaccination (before, during or immediately\n  after)\" vs \"5-10 minutes after vaccination (up to 1 hour)\". The language has no comparison between\n  two events' times. Both rules fire on any recorded vaccination, so they fire **more often** than the\n  page intends (e.g. a collapse long after vaccination).\n- **Duration of loss of consciousness** (20 s–1 min vs > 1 min) and whether it is **relieved by lying\n  down and raising legs**: no event duration or response-to-manoeuvre form. Not encoded; loss of\n  consciousness is therefore not checked for (it would be unused evidence).\n- **\"BP … remains low\" / \"briefly low but rapidly normal again\"**: persistence over repeated readings\n  is not representable; a single reading is used. A low reading taken during a brief vasovagal dip\n  would route to anaphylaxis instead of fainting (fainting fires **less often**, anaphylaxis\n  **more often**).\n- \"Pulse may be slow\" and \"breathing … may be rapid and deep (hyperventilation)\" are non-discriminating\n  (\"may\") and are not encoded.\n- Management, \"Refer if …\" (head injury, heart condition, unusual symptoms) and AEFI reporting are\n  management/referral steps, out of scope.\n\n## SNOMED gaps\n\n- None. All concepts confirmed with `snomed exists`: Collapse, Vaccination given (situation),\n  Wheezing, Stridor, Cough, Swelling, Eruption (morphologic abnormality), Syncope, Anaphylaxis,\n  Systolic/Diastolic blood pressure, Pulse, function.\n\n## Checker issues left in place\n\n- None.\n\n## Questions for a clinician\n\n- Should a single delayed-column feature (e.g. cough alone, or pulse > 120 alone) after a\n  post-vaccination collapse be enough to treat as anaphylaxis, or should several be required?\n- A BP taken during the brief vasovagal dip may be < 90/60. Should the fainting diagnosis tolerate a\n  low first reading if it normalises, and how should repeat BP be recorded?\n- Is the collapse trigger acceptable, given it will also fire this check for collapses unrelated to\n  vaccination (the vaccination question is then answered \"No\" and neither rule fires)?\n- Should a cough alone (common, often pre-existing) be enough to rule out a fainting episode and\n  route to anaphylaxis?\n- Should the delayed-collapse picture give **probable** anaphylaxis (as now, so page 28's urgency\n  follows), **possible** anaphylaxis, or no rule on this page at all (leaving page 28's own rules to\n  pick up the same findings)?\n ylaxis\" \"disorder\") probable)", "Diagnose probable anaphylaxis after collapse following vaccination :: (and (clinical_finding (snomed_concept \"Collapse\" \"finding\")) (clinical_finding (snomed_concept \"Vaccination given\" \"situation\")) (or (< (measurement (snomed_concept \"Systolic blood pressure\" \"observable entity\") mmHg) 90) (< (measurement (snomed_concept \"Diastolic blood pressure\" \"observable entity\") mmHg) 60) (> (measurement (snomed_concept \"Pulse, function\" \"observable entity\") bpm) 120) (clinical_finding (snomed_concept \"Wheezing\" \"finding\")) (clinical_finding (snomed_concept \"Stridor\" \"finding\")) (clinical_finding (snomed_concept \"Cough\" \"finding\")) (clinical_finding (snomed_concept \"Swelling\" \"finding\")) (clinical_finding (snomed_concept \"Eruption\" \"morphologic abnormality\"))))"], "confidence": "medium"}, {"element_key": "p15-2414a22d", "scope": "borderline", "scope_reason": "Mostly management (call for help, lie flat, raise legs, check response, assess timing) and a cross-reference to the CPR page. The one triage statement is 'if unresponsive ... no pulse/not breathing, start CPR', which the house standard treats as an Emergency escalation; but it is a cross-reference to page 16 and the Collapse warning sign presumably already carries a priority, so reasonable people would leave it to page 16.", "verdict": "missing", "parts_missing": ["Unresponsive + no pulse / not breathing -> CPR (Emergency): no priority rule and no check_for of Unresponsive (finding, exists in SNOMED) on this page"], "problem": "Not encoded on this page at all. Low consequence if page 16 (CPR) or the Collapse warning sign carries the Emergency level; I cannot verify that from here. The remaining bullets (call for help, positioning, assess timing/duration, check breathing/pulse/BP) are management or routine vitals and need no rule.", "evidence": [], "confidence": "low"}, {"element_key": "p15-668d2784", "scope": "out_of_scope", "scope_reason": "not_representable", "verdict": null, "parts_missing": [], "problem": "Flowchart branch header 'Sudden collapse'. The branch is defined by timing relative to the vaccination (at the time of vaccination vs 5-10 minutes after). The grammar only compares an onset/timestamp_of_event with time_ago (now-relative); it cannot compare the collapse's onset with the vaccination's time, so the branch itself cannot be expressed. The builders instead split the branches on the clinical features (BP, pulse, wheeze/stridor/cough, swelling/rash), which is the only available approximation. Noted under rule-level problems.", "evidence": [], "confidence": "high"}, {"element_key": "p15-7cdfec6e", "scope": "out_of_scope", "scope_reason": "not_representable", "verdict": null, "parts_missing": [], "problem": "Flowchart branch header 'Delayed collapse'. Same reason as 'Sudden collapse': timing relative to vaccination is not expressible.", "evidence": [], "confidence": "high"}, {"element_key": "p15-d247855b", "scope": "in_scope", "scope_reason": "The feature list that leads to 'Fainting episode likely'. Six parts, judged separately below.", "verdict": "partial", "parts_missing": ["Part 1 'Occurs suddenly, at the time of vaccination (before, during or immediately after)': not_representable (timing relative to vaccination); not encoded, correctly so.", "Part 2 'Loss of consciousness usually lasts 20 seconds to 1 minute and is relieved by lying patient down and raising legs': missing. The duration has no unit in the language, and 'relieved by' is a response to intervention, so a literal encoding is impossible; but SNOMED has (snomed_concept \"Brief loss of consciousness\" \"finding\") and (snomed_concept \"Prolonged loss of consciousness\" \"finding\"), which would have carried the page's '< 1 minute' vs '> 1 minute' split as a check_for finding. Neither is used.", "Part 3 'BP is: briefly low but rapidly normal again': partial. Encoded as SBP >= 90 and DBP >= 60 (the complement of the delayed branch ion. The red box 'Treat as anaphylaxis' is the page's escalation and the house standard turns the red box into an Urgent priority (referencing (active_condition Anaphylaxis)). The file depends on the anaphylaxis page providing that rule; if it does, this is fine, but it is not visible from this page and the file does not say so.", "severity": "medium"}, {"rule": "Diagnose probable fainting episode following vaccination", "problem": "The rule requires SBP >= 90, DBP >= 60 and pulse <= 120 as positive evidence. If BP or pulse has not been recorded (collapse is often seen before vitals are taken), the comparisons cannot be satisfied and the fainting rule never fires, while the anaphylaxis rule may fire on a single sign. Also the page allows a 'briefly low' BP in fainting; a BP recorded during that window makes the rules call anaphylaxis instead. Both are consequences of the measurement-only approximation; worth a note for the clinician reviewer.", "severity": "low"}, {"rule": "Diagnose probable fainting episode following vaccination", "problem": "'No other signs or symptoms present' is encoded only as the absence of the five delayed-branch signs. Difficulty breathing / Dyspnea (a recorded common symptom and the anaphylaxis page's breathing criterion) is excluded from neither rule, so a collapsed patient with difficulty breathing but no wheeze/stridor/cough and normal vitals is called fainting.", "severity": "low"}, {"rule": "whole file", "problem": "The 'Refer if' criteria (head injury, known heart condition or serious illness, chest pain, shortness of breath, confusion, blurred vision, difficulty talking) are not collected or used. Scope is arguable (referral is management), but these are findings the page tells the health worker to look for after a faint and the check_for does not ask for them.", "severity": "low"}], "summary": "The red box is captured as a probable Anaphylaxis rule with the right concepts and thresholds (BP < 90/60, pulse > 120, wheeze, stridor, cough, swelling, rash), and 'Fainting episode likely' as its mutually exclusive probable Syncope complement; every SNOMED concept resolves and every check_for item is used. The most consequential problems are that Cough alone triggers probable anaphylaxis (and alone excludes fainting) although the page never makes cough a discriminator, and that the page's main axis, timing and duration of loss of consciousness, is absent: timing relative to vaccination is not representable, but the > 1 minute split could have used the existing 'Brief/Prolonged loss of consciousness' findings. There is no priority evaluation on the page, so the red box's urgency depends on the anaphylaxis page's rule; the referral criteria and the CPR escalation are not encoded."}, {"page": 15, "checker": "forward-2", "elements": [{"element_key": "p15-9f025f7d", "scope": "in_scope", "scope_reason": "'Treat as anaphylaxis' is the conclusion of the delayed-collapse branch; the house standard encodes it as a probable Anaphylaxis diagnosis rule from the branch criteria.", "verdict": "partial", "parts_missing": ["Delayed-collapse timing (5-10 min, up to 1 hour after vaccination) not encoded or declared not_representable", "Loss of consciousness > 1 minute and not relieved by lying down not encoded", "BP 'remains low' (persistence) not encoded; only a single low reading", "Anaphylaxis branch is a flat OR, so any single sign (e.g. cough alone) after collapse+vaccination yields probable anaphylaxis, whereas the page lists the features together as a pattern"], "problem": "Core criteria (BP <90/60, pulse >120, wheeze, stridor, cough, swelling, rash) are encoded with correct thresholds and units and right concepts; the temporal/duration discriminators of the branch are absent. 'Eruption' (morphologic abnormality) is a weak stand-in for 'rash'; a finding such as Rash may be closer.", "evidence": ["Diagnose probable anaphylaxis after collapse following vaccination :: (and (clinical_finding Collapse) (clinical_findi heck for collapse following vaccination features", "verdict": "problem", "problem": "The trigger and items are correct, but it does not check the page's main discriminators: timing of collapse relative to vaccination, duration of loss of consciousness, and whether it is relieved by lying down with legs raised ('assess timing of collapse and duration of loss of consciousness'). Brief/Prolonged loss of consciousness concepts exist.", "severity": "medium"}, {"rule": "Diagnose probable fainting episode following vaccination", "verdict": "problem", "problem": "Discriminates only by the absence of delayed-column features plus BP>=90/60 and pulse<=120 (both inferred from the other column). The page's own criteria (sudden onset at the time of vaccination, LOC 20 s-1 min relieved by raising legs) are absent. A fainter assessed during the 'briefly low' BP is pushed into probable anaphylaxis.", "severity": "high"}, {"rule": "Diagnose probable anaphylaxis after collapse following vaccination", "verdict": "problem", "problem": "Collapse + vaccination + ANY one item (e.g. cough alone, or a single BP<90/60 reading) gives probable anaphylaxis. The page describes a delayed-collapse picture (5-10 min to 1 h, LOC >1 min not relieved, BP remains low) that is not encoded. Because the two rules are exact complements on the same inputs, every assessed post-vaccination collapse gets one of the two diagnoses. Also, the red box ('Treat as anaphylaxis') has no system_priority_evaluation (Emergency, referencing active_condition Anaphylaxis), and the CPR branch (no pulse/not breathing) is not encoded.", "severity": "high"}], "summary": "The page separates fainting from anaphylaxis mainly by timing and duration/relief of loss of consciousness, and none of these is encoded. Instead both rules split on bare Collapse + Vaccination given, with anaphylaxis triggered by any single feature (cough alone, or one transient BP<90/60 reading even though the Sudden column says BP is 'briefly low'). The red b r after vaccination) not encoded or declared not_representable", "Loss of consciousness > 1 minute and not relieved by lying down not encoded", "BP 'remains low' (persistence) not encoded; only a single low reading", "Anaphylaxis branch is a flat OR, so any single sign (e.g. cough alone) after collapse+vaccination yields probable anaphylaxis, whereas the page lists the features together as a pattern"], "problem": "Core criteria (BP <90/60, pulse >120, wheeze, stridor, cough, swelling, rash) are encoded with correct thresholds and units and right concepts; the temporal/duration discriminators of the branch are absent. 'Eruption' (morphologic abnormality) is a weak stand-in for 'rash'; a finding such as Rash may be closer.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["No system_priority_evaluation at all in the file: the red box is never turned into a priority (anaphylaxis/collapse with hypotension would be Emergency/'Very urgent' by the house standard's escalation rule: BP < 90/60, collapse, airway signs)", "No (active_condition (snomed_concept \"Anaphylaxis\" \"disorder\")) referenced from any priority rule"], "problem": "The diagnosis half of the red box exists (probable Anaphylaxis), but the triage half, which is what a red box is for, is missing.", "confidence": "high"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "element", "priority": "low", "ref": "p15-f73f4e66", "text": "COLLAPSE FOLLOWING VACCINATION", "detail": [{"checker": "forward-1", "scope": "out_of_scope", "verdict": "", "parts_missing": null, "problem": "not triage/diagnostic logic", "confidence": null}, {"checker": "forward-2", "scope": "out_of_scope", "verdict": "", "parts_missing": null, "problem": "not triage/diagnostic logic", "confidence": null}, {"checker": "forward-3", "scope": "out_of_scope", "verdict": "", "parts_missing": null, "problem": "not triage/diagnostic logic", "confidence": null}]}, {"page": s: briefly low but rapidly normal again. • Pulse may be slow. • Breathing is usually normal ", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "partial", "parts_missing": ["Part 1 'Occurs suddenly, at the time of vaccination (before, during or immediately after)': not_representable (timing relative to vaccination); not encoded, correctly so.", "Part 2 'Loss of consciousness usually lasts 20 seconds to 1 minute and is relieved by lying patient down and raising legs': missing. The duration has no unit in the language, and 'relieved by' is a response to intervention, so a literal encoding is impossible; but SNOMED has (snomed_concept \"Brief loss of consciousness\" \"finding\") and (snomed_concept \"Prolonged loss of consciousness\" \"finding\"), which would have carried the page's '< 1 minute' vs '> 1 minute' split as a check_for finding. Neither is used.", "Part 3 'BP is: briefly low but rapidly normal again': partial. Encoded as SBP >= 90 and DBP >= 60 (the complement of the delayed branch's < 90/60). The page allows a transient low BP in fainting; the rule excludes fainting whenever the recorded BP is low, and the sister rule then calls it anaphylaxis. 'Rapidly normal again' needs a repeat measurement and is not representable, so this is an accepted approximation, but it is lossy in the direction of over-calling anaphylaxis.", "Part 6 'No other signs or symptoms present': partial. Only the five delayed-branch signs (wheeze, stridor, cough, swelling, rash) are excluded with (no ...). 'No other signs or symptoms' is broader; at minimum Difficulty breathing / Dyspnea (a recorded common symptom and the anaphylaxis page's breathing sign) is not excluded."], "problem": "Parts 4 and 5 are correct: 'Pulse may be slow' and 'Breathing is usually normal but may be rapid and deep' are 'may' statements with no threshold, so the rule's pulse <= 120 and absence of wheeze/stridor/cough are the right reading. The conclusion concept Syncope (finding) is right for ; it does not make cough alone a discriminator. Cough should at least be paired with another sign (or dropped from both rules).", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "whole file", "text": "The page's primary discriminator, timing (sudden/at the time of vaccination vs 5-10 minutes after, up to 1 hour) and the duration of loss of consciousness (< 1 minute vs > 1 minute), is absent from both rules. Timing relative to the vaccination is genuinely not representable, but the duration split could have been approximated with the existing SNOMED findings 'Brief loss of consciousness' and 'Prolonged loss of consciousness' as check_for items used as evidence. Without them the two rules split purely on BP, pulse and five signs.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "whole file", "text": "No system_priority_evaluation. The red box 'Treat as anaphylaxis' is the page's escalation and the house standard turns the red box into an Urgent priority (referencing (active_condition Anaphylaxis)). The file depends on the anaphylaxis page providing that rule; if it does, this is fine, but it is not visible from this page and the file does not say so.", "detail": [{"checker": "forward-1", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fainting episode following vaccination", "text": "The rule requires SBP >= 90, DBP >= 60 and pulse <= 120 as positive evidence. If BP or pulse has not been recorded (collapse is often seen before vitals are taken), the comparisons cannot be satisfied and the fainting rule never fires, while the anaphylaxis rule may fire on a single sign. Also the page allows a 'briefly low' BP in fainting; a BP recorded during that window makes the rules call anaphylaxis instead. Both are consequences of the measurement-only approximation; worth a note for the clinician reviewer.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fainting episode following vaccination", "text": "'No other signs or symptoms present' is encoded only as the absence of the five delayed-branch signs. Difficulty breathing / Dyspnea (a recorded common symptom and the anaphylaxis page's breathing criterion) is excluded from neither rule, so a collapsed patient with difficulty breathing but no wheeze/stridor/cough and normal vitals is called fainting.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "whole file", "text": "The 'Refer if' criteria (head injury, known heart condition or serious illness, chest pain, shortness of breath, confusion, blurred vision, difficulty talking) are not collected or used. Scope is arguable (referral is management), but these are findings the page tells the health worker to look for after a faint and the check_for does not ask for them.", "detail": [{"checker": "forward-1", "severity": "low"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "task Check for collapse following vaccination features", "text": "check_for omits Systolic BP, Diastolic BP and Pulse, which both diagnosis rules use; a clinician is not prompted to record them. The page explicitly says to check breathing, pulse and BP.", "detail": [{"checker": "forward-2", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fainting episode following vaccination", "text": "Fainting criteria from outside box (sudden onset at time of vaccination; LOC 20 s to 1 min; no other signs) only partly captured: timing and LOC duration absent; 'Vaccination given' is used as proxy for timing. BP requires a recorded measurement, so with BP missing fainting cannot fire. Hyperventilation (allowed) is not excluded, fine. Page says 'BP briefly low but rapidly normal', which the rule encodes as currently normal; acceptable.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fainting episode / anaphylaxis", "text": "Branches are complementary except when vitals are missing; if no vitals and no symptoms are recorded neither fires, and if a symptom is present only anaphylaxis fires. Not contradictory, but note the fainting rule's Syncope concept for a collapse presentation is reasonable.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "(file)", "text": "Refer-if items (head injury, heart condition, unusual symptoms such as chest pain, shortness of breath, confusion) are management/referral, out of scope by design. Fine.", "detail": [{"checker": "forward-2", "severity": "low"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "high", "ref": "(file)", "text": "No system_priority_evaluation anywhere: the red box 'Treat as anaphylaxis' and the CPR branch (no pulse / not breathing) produce no priority, so a collapsed post-vaccination patient with BP < 90/60 is never escalated.", "detail": [{"checker": "forward-3", "severity": "high"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable anaphylaxis after collapse following vaccination", "text": "Flat 'or' makes any single delayed-collapse feature sufficient (e.g. cough alone, or diastolic < 60 with normal systolic, or pulse 121 in an anxious patient) for probable anaphylaxis; the page's delayed-collapse picture is a cluster, and timing/LOC duration that would anchor it are absent.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Check for collapse following vaccination features", "text": "check_for omits the page's two key discriminators, timing after vaccination and LOC duration/response to leg-raising (Brief / Prolonged loss of consciousness exist in SNOMED), so neither rule can use them; it also lacks 'unresponsive'.", "detail": [{"checker": "forward-3", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fainting episode following vaccination", "text": "Fainting is defined as the complement of the anaphylaxis rule plus all three vitals present and in range; if any vital is unrecorded neither rule fires. Pulse <= 120 is not on the page (page says pulse may be slow).", "detail": [{"checker": "forward-3", "severity": "low"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Check for collapse following vaccination features", "text": "Type and trigger are right, and every red-box/discriminating feature of the Delayed column is listed, but the page's primary discriminators between the two columns are timing (sudden vs delayed) and duration of loss of consciousness (20 s-1 min relieved by lying down vs > 1 min not relieved), and none is checked for. SNOMED has Sudden onset / Delayed onset (qualifier value) and Brief loss of consciousness / Prolonged loss of consciousness (finding), all confirmed with exists. 'Pulse may be slow' (Pulse slow, finding) is also unchecked, though it is optional on the page.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fainting episode following vaccination", "text": "'Fainting episode likely' -> probable Syncope and the 'no other signs' negations are faithful, but (a) no Sudden onset qualifier on Collapse, so a delayed collapse with normal vitals is called a faint; (b) SBP >= 90 and DBP >= 60 are required although the page says BP is 'briefly low but rapidly normal again', so a reading taken during the dip blocks the diagnosis; (c) the LOC-duration criterion is absent. Only the no-features list actually comes from the Sudden column.", "detail": [{"checker": "backward-1", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "high", "ref": "Diagnose probable anaphylaxis after collapse following vaccination", "text": "The flat 'or' makes any single feature sufficient: collapse + vaccination + one cough, one rash, or one BP reading < 90/60 (which the page says also happens briefly in a faint) yields probable anaphylaxis, with no requirement that the collapse was delayed, that LOC lasted > 1 min, or that BP 'remains low'. The page describes a cluster for the Delayed column. Suggested shape: (and Collapse+Delayed onset, Vaccination given, (or (any2 of the vital/airway/skin features) Prolonged loss of consciousness)). Probable level is defensible for 'Treat as anaphylaxis'; no priority evaluation is needed here because page 20's 'Urgent: Anaphylaxis' fires on the active condition.", "detail": [{"checker": "backward-1", "severity": "high"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Check for collapse following vaccination features", "text": "Task omits the page's explicit checks: BP, pulse, loss of consciousness duration, timing; check_for mixes vaccination history with delayed-column signs. Also the opening step 'no pulse/not breathing -> CPR 16' is not encoded (no rule). Refer-if criteria (head injury, known heart condition, chest pain, SOB, confusion, blurred vision, difficulty talking) and management steps are absent entirely.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Diagnose probable fainting episode following vaccination", "text": "BP>=90/60 and pulse<=120 are inverted delayed-column criteria; page says BP is 'briefly low' in fainting, so a patient with transient low BP is excluded. Sudden-onset timing not encoded. 'Fainting episode likely' -> probable is correct.", "detail": [{"checker": "backward-2", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "medium", "ref": "Check for collapse following vaccination features", "text": "The trigger and items are correct, but it does not check the page's main discriminators: timing of collapse relative to vaccination, duration of loss of consciousness, and whether it is relieved by lying down with legs raised ('assess timing of collapse and duration of loss of consciousness'). Brief/Prolonged loss of consciousness concepts exist.", "detail": [{"checker": "backward-3", "severity": "medium"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "high", "ref": "Diagnose probable fainting episode following vaccination", "text": "Discriminates only by the absence of delayed-column features plus BP>=90/60 and pulse<=120 (both inferred from the other column). The page's own criteria (sudden onset at the time of vaccination, LOC 20 s-1 min relieved by raising legs) are absent. A fainter assessed during the 'briefly low' BP is pushed into probable anaphylaxis.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "rule", "priority": "high", "ref": "Diagnose probable anaphylaxis after collapse following vaccination", "text": "Collapse + vaccination + ANY one item (e.g. cough alone, or a single BP<90/60 reading) gives probable anaphylaxis. The page describes a delayed-collapse picture (5-10 min to 1 h, LOC >1 min not relieved, BP remains low) that is not encoded. Because the two rules are exact complements on the same inputs, every assessed post-vaccination collapse gets one of the two diagnoses. Also, the red box ('Treat as anaphylaxis') has no system_priority_evaluation (Emergency, referencing active_condition Anaphylaxis), and the CPR branch (no pulse/not breathing) is not encoded.", "detail": [{"checker": "backward-3", "severity": "high"}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "build_disagreement", "priority": "low", "ref": "trigger", "text": "A: (none extra)  vs  B: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Vaccination given\" \"situation\"))", "detail": [{"choice": "A", "final": "", "reason": "The page's complaint is 'COLLAPSE FOLLOWING VACCINATION'; Collapse is the recorded anchor, and requiring 'Vaccination given' in the trigger would never fire because nothing records it, so vaccination is asked instead (see check_for).", "unsettled": false}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "build_disagreement", "priority": "low", "ref": "check_for", "text": "A: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Vaccination given\" \"situation\"))  vs  B: (none)", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Vaccination given\" \"situation\"))", "reason": "The title's 'VACCINATION' must be recorded for both column rules to use it; checking for it after a collapse is how it gets recorded.", "unsettled": false}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "build_disagreement", "priority": "medium", "ref": "diagnosis", "text": "A: (diagnosis (snomed_concept \"Anaphylaxis\" \"disorder\") probable)  vs  B: (none; red box as cross_reference_only)", "detail": [{"choice": "A", "final": "(diagnosis (snomed_concept \"Anaphylaxis\" \"disorder\") probable)", "reason": "The delayed-collapse column is the page's own logic leading to 'Treat as anaphylaxis', and the pointer rule allows rules where the page has triage logic outside the pointer; 'Treat as' reads as probable rather than possible.", "unsettled": true}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "build_disagreement", "priority": "low", "ref": "diagnosis_condition", "text": "A: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Collapse\" \"finding\")) (anaphylaxis rule)  vs  B: (no anaphylaxis rule)", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Collapse\" \"finding\"))", "reason": "Part of the anaphylaxis rule kept above: the delayed column starts from 'Delayed collapse'.", "unsettled": false}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "build_disagreement", "priority": "low", "ref": "diagnosis_condition", "text": "A: (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Vaccination given\" \"situation\")) (anaphylaxis rule)  vs  B: (no anaphylaxis rule)", "detail": [{"choice": "A", "final": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Vaccination given\" \"situation\"))", "reason": "Part of the anaphylaxis rule kept above: the delayed column starts from '5-10 minutes after vaccination'.", "unsettled": false}]}, {"page": 15, "slug": "15-collapse-following-vaccination", "kind": "build_disagreement", "priority": "medium", "ref": "diagnosis_condition", "text": "A: (or (< SBP 90) (< DBP 60) (> pulse 120) Wheezing Stridor Cough Swelling Eruption) — 8 conditions in the anaphylaxis rule  vs  B: (no anaphylaxis rule)", "detail": [{"choice": "A", "final": "(or (< (measurement Systolic blood pressure mmHg) 90) (< (measurement Diastolic blood pressure mmHg) 60) (> (measurement Pulse, function bpm) 120) Wheezing Stridor Cough Swelling Eruption)", "reason": "Each is a delayed-column line ('BP < 90/60 and remains low', 'Pulse > 120', 'may have wheeze, stridor, cough', 'swelling or rash'); the page gives no count, so any one suffices, making the rule the exact complement of the fainting rule's 'No other signs or symptoms'.", "unsettled": true}]}], "concepts": {"Collapse|finding": {"resolves": true, "id": "271787007", "descendants": 3, "parents": ["Clinical finding (finding)"]}, "Vaccination given|situation": {"resolves": true, "id": "713404003", "descendants": 45, "parents": ["Procedure carried out on subject (situation)"]}, "Wheezing|finding": {"resolves": true, "id": "56018004", "descendants": 12, "parents": ["Finding of sound of breathing (finding)"]}, "Stridor|finding": {"resolves": true, "id": "70407001", "descendants": 7, "parents": ["Finding of sound of breathing (finding)", "Upper respiratory tract finding (finding)"]}, "Cough|finding": {"resolves": true, "id": "49727002", "descendants": 65, "parents": ["Finding of respiratory function (finding)"]}, "Swelling|finding": {"resolves": true, "id": "65124004", "descendants": 215, "parents": ["Clinical finding (finding)"]}, "Eruption|morphologic abnormality": {"resolves": true, "id": "1806006", "descendants": 21, "parents": ["Lesion (morphologic abnormality)"]}, "No|qualifier value": {"resolves": true, "id": "373067005", "descendants": 0, "parents": ["Absence findings (qualifier value)"]}, "Systolic blood pressure|observable entity": {"resolves": true, "id": "271649006", "descendants": 9, "parents": ["Blood pressure (observable entity)", "Vascular measure (observable entity)"]}, "Diastolic blood pressure|observable entity": {"resolves": true, "id": "271650006", "descendants": 9, "parents": ["Blood pressure (observable entity)", "Vascular measure (observable entity)"]}, "Pulse, function|observable entity": {"resolves": true, "id": "8499008", "descendants": 18, "parents": ["Cardiovascular function (observable entity)"]}, "Syncope|finding": {"resolves": true, "id": "271594007", "descendants": 21, "parents": ["Loss of consciousness (finding)", "Finding of brain (finding)", "Decreased vascular flow (finding)"]}, "Anaphylaxis|disorder": {"resolves": true, "id": "39579001", "descendants": 52, "parents": ["Acute allergic reaction (disorder)", "Systemic disease (disorder)"]}}, "vs_will": {"page_2026": 15, "page_2023": 13, "will_file": null, "redbox_status_2023": [], "groups": {}, "note": "no 2023 rule file for this page"}, "rule_hash": "994f3d47e7f4"}</script>

<details class="cropband" id="cropband" open><summary>The red box, from the e-book page <span class="hb" data-k="cropband"></span> <span style="text-transform:none;letter-spacing:0;font-weight:400">(click to hide or show; scroll inside it, or drag its bottom-right corner to resize)</span></summary><div id="crops"></div></details>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ws = s => String(s ?? "").replace(/\s+/g, " ").trim();

// ---------- storage: browser drafts only, namespaced; export is the record ----------
const NS = `apc-review|${D.edition}|p${D.page}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } },
};
let decisions = store.get(NS, {});
const me = store.get("apc-review|reviewer", { reviewer: "", role: "" });

// ---------- indexes ----------
const elByKey = Object.fromEntries(D.elements.map(e => [e.key, e]));
const prov = D.provenance || {};
const notEnc = Object.fromEntries((prov.elements_not_encoded || []).map(x => [x.element_key, x]));
const provQueues = {};
(prov.conditions || []).forEach(p => { const k = p.rule + "\u0000" + ws(p.expr); (provQueues[k] = provQueues[k] || []).push(p) });
const claimsBy = {};
(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });
const fwBy = {};  // element key -> [{checker, ...}]
(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });
const bwBy = {};  // claim id -> [{checker, ...}]
(D.backward || []).forEach((r, i) => { if (!r) return; (r.claims || []).forEach(x => { (bwBy[x.claim_id] = bwBy[x.claim_id] || []).push({ checker: r.checker || `backward-${i + 1}`, ...x }) }) });
const recByExpr = {};
((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;
  const decided = Object.values(decisions).filter(v => v.decision && v.rule_hash === D.rule_hash).length;
  const stale = Object.values(decisions).filter(v => v.decision && v.rule_hash !== D.rule_hash).length;
  return { items, decided, stale, open: (D.queue || []).length };
}
function renderHeader() {
  $("#h1").textContent = `APC ${D.edition} · p${D.page} ${D.title.charAt(0) + D.title.slice(1).toLowerCase()}`;
  const c = counts();
  $("#meta").innerHTML = `
    <span>generated ${esc(D.generated)} · rules ${esc(D.rule_hash)}</span>
    <span>review queue: <b>${c.open}</b>${helpButton("hdr_queue")}</span>
    <span>decided ${c.decided} / ${c.items}${c.stale ? ` · <b style="color:var(--bad)">${c.stale} need reconfirm</b>` : ""}${helpButton("hdr_decided")}</span>
    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>
    <label>reviewer <input id="rv" size="12" placeholder="your name" value="${esc(me.reviewer)}">${helpButton("reviewer")}</label>
    <label>role <select id="rl"><option value="" ${me.role ? "" : "selected"}>choose…</option>${["clinical", "engineering", "other"].map(r => `<option ${r === me.role ? "selected" : ""}>${r}</option>`).join("")}</select>${helpButton("role")}</label>
    <span><button id="exp">export decisions</button>${helpButton("export")}</span>
    <a href="index.html">← Back to the list of pages</a> <a href="guide.html" target="_blank" rel="noopener">Reviewer’s guide</a>`;
  $("#rv").onchange = e => { me.reviewer = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#rl").onchange = e => { me.role = e.target.value; store.set("apc-review|reviewer", me); renderBanners() };
  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.

    const ch = src[i];

    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }

}

    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }

  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
</body>
</html>
