xiety is induced by a particular situation/object (phobia) or is repeated sudden fear with physical symptoms and no obvious cause (panic), discuss/refer. • If anxiety > 1 month linked to a bad experience, with ≥ 3 of: nightmares/flashbacks, avoids situations/people, constantly on guard/easily startled, feels numb/detached from others/surroundings, post-traumatic stress disorder (PTSD) likely. Discuss/refer.", "bbox": [39.7, 148.1, 791.5, 199.1], "key": "p98-eb4428e6"}, {"id": "p98-out-e05", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Depression In the past month, has patient felt down/depressed/hopeless or little interest/pleasure in doing things? If yes to either 159.", "bbox": [39.7, 201.8, 545.4, 212.6], "key": "p98-346bde9a"}, {"id": "p98-out-e06", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Substance use In the past year, has patient drunk ≥ 4 drinks1/session, used illegal drugs or misused prescription or over-the-counter medications? If yes to any 165.", "bbox": [39.7, 215.2, 631.1, 226.0], "key": "p98-758da856"}, {"id": "p98-out-e07", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Abuse If patient is being abused 33.", "bbox": [39.7, 228.7, 227.1, 239.5], "key": "p98-ce14956d"}, {"id": "p98-out-e08", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Stressors • Help identify psychosocial stressors. Ask about family or relationship problems, infertility, financial difficulty, bereavement, chronic ill-health. If sexual problems 74. • If patient has a life-limiting illness, in bed or chair for 50% or more of the day or dependent on others for most care, also give palliative care 191. • If older person, ask about loneliness and if available, refer to nearest social club for older people in the area.", "bbox": [39.7, 242.1, 684.0, 273.0], "key": "p98-d7ad470b"}, {"id": "p98-out-e09", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Women’s health • If recent delivery, give postnatal care 182 and if available, refer to mother's support group. • If woman > 40 years, ask about menopausal symptoms: hot flushes, night sweats, vaginal dryness, mood changes, difficulty sleeping and sexual problems 74.", "bbox": [39.7, 275.6, 668.7, 296.4], "key": "p98-ff6d9ce9"}, {"id": "p98-out-e10", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Medication Review medication: prednisone, efavirenz, metoclopramide, theophylline and contraceptives can cause mood changes. Discuss with doctor. Consider alternative contraceptive 187.", "bbox": [39.7, 299.1, 740.8, 309.9], "key": "p98-d4e348ad"}, {"id": "p98-out-e11", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Advise the patient with low mood, stress or anxiety • Refer to social worker, occupational therapist, counsellor or psychiatric nurse/psychologist. Encourage supportive family member/friend to attend follow up visits as well. • Encourage patient to question negative thinking and be realistic if s/he often predicts the worst, exaggerates problem, inappropriately takes the blame, takes things personally. • Help patient to choose strategies to get help and cope:", "bbox": [51.0, 321.2, 698.6, 362.3], "key": "p98-47b90a35"}, {"id": "p98-out-e12", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Limit alcohol and avoid drugs • Limit alcohol to ≤ 2 drinks/ day if man and 1 drink/day if woman. • Avoid drugs.", "bbox": [697.5, 377.0, 753.2, 458.9], "key": "p98-f2fa37a8"}, {"id": "p98-out-e13", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Get enough sleep", "bbox": [49.8, 365.0, 115.0, 374.9], "key": "p98-eaead4a0"}, {"id": "p98-out-e14", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "If patient has difficulty sleeping,", "bbox": [51.3, 374.8, 156.4, 383.9], "key": "p98-e4a37837"}, {"id": "p98-out-e15", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "give advice 99.", "bbox": [97.3, 383.2, 154.7, 392.9], "key": "p98-36a20e8e"}, {"id": "p98-out-e16", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Access support Link patient with helpline or support group 200.", "bbox": [628.7, 409.2, 683.0, 455.1], "key": "p98-05359983"}, {"id": "p98-out-e17", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Get active Do some enjoyable physical activity", "bbox": [560.9, 378.1, 654.0, 406.0], "key": "p98-5bb40d65"}, {"id": "p98-out-e18", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Do a relaxing breathing exercise each day.", "bbox": [425.4, 378.9, 469.7, 415.0], "key": "p98-f8557d16"}, {"id": "p98-out-e19", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Spend time with supportive", "bbox": [165.5, 437.0, 258.4, 446.1], "key": "p98-64643c21"}, {"id": "p98-out-e20", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "friends or family.", "bbox": [184.4, 446.0, 237.8, 455.1], "key": "p98-d33531c5"}, {"id": "p98-out-e21", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Find a creative or fun activity to do.", "bbox": [333.3, 378.9, 371.1, 415.0], "key": "p98-afe327bd"}, {"id": "p98-out-e22", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Encourage patient to take time to relax:", "bbox": [246.3, 365.0, 389.5, 374.9], "key": "p98-cc5d903c"}, {"id": "p98-out-e23", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "• Deal with bereavement issues if patient or family member has a life-limiting illness or if patient is recently bereaved: - Acknowledge grief reactions: denial, disbelief, confusion, shock, sadness, bargaining, yearning, anger, humiliation, despair, guilt and acceptance. - Allow patient/family to share sorrow and talk of memories, the meaning of the patient’s life or religious beliefs. Suggest connecting with a spiritual counsellor as appropriate. - Identify worrying issues (e.g. child care, will and funeral arrangements) and who can give practical support with these before and after the patient dies. • For tips on how to communicate effectively 198.", "bbox": [51.0, 460.5, 693.3, 510.7], "key": "p98-1700be03"}, {"id": "p98-out-e24", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "Review the patient every 2-4 weeks. If no improvement after 3 months, assess for depression/anxiety 159.", "bbox": [213.1, 524.1, 628.7, 535.1], "key": "p98-1ea380c6"}, {"id": "p98-out-e25", "page": 98, "box": 0, "kind_hint": "outside", "section": null, "section_y": -1, "indent": 0, "parent": null, "text": "1One drink is 1 tot of spirits, or 1 small glass (125mL) of wine or 1 can/bottle (330mL) of beer.", "bbox": [34.0, 543.5, 316.7, 552.0], "key": "p98-d7b30ec1"}], "boxes": [{"box": 1, "rect": [35.5, 86.8, 806.4, 108.3]}], "crops": {"1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkcAAAAuCAIAAAAdnFmZAAAACXBIWXMAABcSAAAXEgFnn9JSAAAcDElEQVR4nO2daVRU15bH6dXdr3v1h179sdfqXquTV _finding (snomed_concept \"Suicidal thoughts\" \"finding\"))\n    (clinical_finding (snomed_concept \"Suicidal behavior\" \"finding\"))\n  )\n)\n(task\n  \"Check for generalised anxiety disorder and PTSD features\"\n  adult\n  (or (clinical_finding (snomed_concept \"Depressed mood\" \"finding\"))\n      (clinical_finding (snomed_concept \"Stress\" \"finding\"))\n      (clinical_finding (snomed_concept \"Anxiety\" \"finding\")))\n  (check_for\n    ;; Generalised anxiety disorder: excessive worry causing impaired function/distress\n    (clinical_finding (snomed_concept \"Worried\" \"finding\") (qualifier (snomed_concept \"Excessive\" \"qualifier value\")))\n    (clinical_finding (snomed_concept \"Distress\" \"finding\"))\n\n    ;; Generalised anxiety disorder: >= 3 of these\n    (clinical_finding (snomed_concept \"Muscle tension\" \"finding\"))\n    (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n    (clinical_finding (snomed_concept \"Feeling irritable\" \"finding\"))\n    (clinical_finding (snomed_concept \"Difficulty sleeping\" \"finding\"))\n    (clinical_finding (snomed_concept \"Poor concentration\" \"finding\"))\n    (clinical_finding (snomed_concept \"Fatigue\" \"finding\"))\n\n    ;; PTSD: anxiety linked to a bad experience\n    (clinical_finding (snomed_concept \"Victim of psychological trauma\" \"finding\"))\n\n    ;; PTSD: >= 3 of these\n    (clinical_finding (snomed_concept \"Nightmares\" \"finding\"))\n    (clinical_finding (snomed_concept \"Flashback due to and following trauma\" \"finding\"))\n    (clinical_finding (snomed_concept \"Avoidance behavior\" \"finding\"))\n    (clinical_finding (snomed_concept \"Hypervigilant behavior\" \"finding\"))\n    (clinical_finding (snomed_concept \"Predisposed to startle\" \"finding\"))\n    (clinical_finding (snomed_concept \"Emotionally detached\" \"finding\"))\n    (clinical_finding (snomed_concept \"Derealization\" \"finding\"))\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable generalised anxiety disorder (low mood, stress or anxiety page)\"\n  (diagnosis\n    (snomed_concept \"Generalized anxiety disorder\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    ;; excessive worry for at least 6 months\n    (>= (onset (clinical_finding (snomed_concept \"Worried\" \"finding\") (qualifier (snomed_concept \"Excessive\" \"qualifier value\")))) (time_ago 6 months))\n    ;; causing impaired function/distress (only distress is representable)\n    (clinical_finding (snomed_concept \"Distress\" \"finding\"))\n    ;; >= 3 of six symptoms, written as: first present item plus at least 2 of the items after it\n    (or\n      (and (clinical_finding (snomed_concept \"Muscle tension\" \"finding\"))\n           (any2 (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Feeling irritable\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Difficulty sleeping\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Poor concentration\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Fatigue\" \"finding\"))))\n      (and (clinical_finding (snomed_concept \"Restlessness\" \"finding\"))\n           (any2 (clinical_finding (snomed_concept \"Feeling irritable\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Difficulty sleeping\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Poor concentration\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Fatigue\" \"finding\"))))\n      (and (clinical_finding (snomed_concept \"Feeling irritable\" \"finding\"))\n           (any2 (clinical_finding (snomed_concept \"Difficulty sleeping\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Poor concentration\" \"finding\"))\n                 (clinical_finding (snomed_concept \"Fatigue\" \"finding\"))))\n      (and (clinical_finding (snomed_concept \"Difficulty sleeping\" \"finding\"))\n           (clinical_finding (snomed_concept \"Poor concentration\" \"finding\"))\n           (clinical_finding (snomed_concept \"Fatigue\" \"finding\")))\n    )\n  )\n)\n(system_diagnosis_rule\n  \"Diagnose probable post-traumatic stress disorder (low mood, stress or anxiety page)\"\n  (diagnosis\n    (snomed_concept \"Post-traumatic stress disorder\" \"disorder\")\n    probable\n  )\n  adult\n  (and\n    ;; anxiety > 1 month (written as >= 1 month; the database rejects >)\n    (>= (onset (clinical_finding (snomed_concept \"Anxiety\" \"finding\"))) (time_ago 1 months))\n    ;; linked to a bad experience\n    (clinical_finding (snomed_concept \"Victim of psychological trauma\" \"finding\"))\n    ;; >= 3 of four groups, written as: first group plus 2 of the rest, or the last three groups\n    (or\n      (and (or (clinical_finding (snomed_concept \"Nightmares\" \"finding\"))\n               (clinical_finding (snomed_concept \"Flashback due to and following trauma\" \"finding\")))\n           (any2 (clinical_finding (snomed_concept \"Avoidance behavior\" \"finding\"))\n                 (or (clinical_finding (snomed_concept \"Hypervigilant behavior\" \"finding\"))\n                     (clinical_finding (snomed_concept \"Predisposed to startle\" \"finding\")))\n                 (or (clinical_finding (snomed_concept \"Emotionally detached\" \"finding\"))\n                     (clinical_finding (snomed_concept \"Derealization\" \"finding\")))))\n      (and (clinical_finding (snomed_concept \"Avoidance behavior\" \"finding\"))\n           (or (clinical_finding (snomed_concept \"Hypervigilant behavior\" \"finding\"))\n               (clinical_finding (snomed_concept \"Predisposed to startle\" \"finding\")))\n           (or (clinical_finding (snomed_concept \"Emotionally detached\" \"finding\"))\n               (clinical_finding (snomed_concept \"Derealization\" \"finding\"))))\n    )\n  )\n)\n(system_priority_evaluation\n  \"Urgent: low mood, stress or anxiety with suicidal thoughts or behaviour\"\n  adult\n  Urgent\n  (and\n    (or (clinical_finding (snomed_concept \"Depressed mood\" \"finding\"))\n        (clinical_finding (snomed_concept \"Stress\" \"finding\"))\n        (clinical_finding (snomed_concept \"Anxiety\" \"finding\")))\n    (or (clinical_finding (snomed_concept \"Suicidal thoughts\" \"finding\"))\n        (clinical_finding (snomed_concept \"Suicidal behavior\" \"finding\")))\n  )\n)\n", "rules": [{"atom": "task", "description": "Check for urgent low mood, stress or anxiety conditions", "ages": ["adult"], "raw": "(task \"Check for urgent low mood, stress or anxiety conditions\" \"adult\" (or (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Depressed mood\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stress\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Anxiety\" \"finding\"))) (check_for (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Suicidal thoughts\" \"finding\")) (finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Suicidal behavior\" \"finding\"))))", "headline": "Task: Check for urgent low mood, stress or anxiety conditions", "when": {"kind": "group", "op": "or", "text": "ANY of:", "children": [{"kind": "leaf", "text": "Depressed mood", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Depressed mood\" \"finding\"))", "atom": "finding"}, {"kind": "leaf", "text": "Stress", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stress\" \"finding\"))", "atom": "finding"}, {"kind": "leaf", "text": "Anxiety", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Anxiety\" \"finding\"))", "atom": "finding"}]}, "do_label": "Check for", "do": [{"kind": "leaf", "text": "Suicidal thoughts", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed le). The page is a table, not a drawn\nflowchart; its \"If … likely\" rows are multi-step conditions, so they are drawn here.\n\n```mermaid\nflowchart TD\n    P[\"Patient with low mood, stress or anxiety\"]\n    P --> RB{\"Suicidal thoughts or behaviour?\"}\n    RB -- Yes --> URG[\"Give urgent attention ↻ 34\"]\n    P --> GAD{\"Excessive worry causing impaired function/distress<br/>for at least 6 months, with ≥ 3 of: muscle tension,<br/>restlessness, irritability, difficulty sleeping,<br/>poor concentration, tiredness?\"}\n    GAD -- Yes --> GADL[\"Generalised anxiety disorder likely ↻ 160\"]\n    P --> PTSD{\"Anxiety &gt; 1 month linked to a bad experience, with ≥ 3 of:<br/>nightmares/flashbacks, avoids situations/people,<br/>constantly on guard/easily startled,<br/>feels numb/detached from others/surroundings?\"}\n    PTSD -- Yes --> PTSDL[\"PTSD likely. Discuss/refer\"]\n    P --> PH{\"Anxiety induced by a situation/object (phobia)<br/>or repeated sudden fear with physical symptoms (panic)?\"}\n    PH -- Yes --> DR[\"Discuss/refer\"]\n    P --> DEP{\"Past month: down/depressed/hopeless<br/>or little interest/pleasure?\"}\n    DEP -- Yes --> P159[\"→ 159\"]\n    P --> SUB{\"Past year: ≥ 4 drinks/session, illegal drugs,<br/>misused medication?\"}\n    SUB -- Yes --> P165[\"↻ 165\"]\n```\n\n## Decision nodes → rules\n\n| Node | Modelled as | Rule |\n|---|---|---|\n| Trigger | Depressed mood, Stress or Anxiety (finding) | `Check for urgent low mood, stress or anxiety conditions`, `Check for generalised anxiety disorder and PTSD features` |\n| Red box | Complaint **and** (suicidal thoughts or suicidal behaviour) | `Urgent: low mood, stress or anxiety with suicidal thoughts or behaviour` |\n| GAD | Excessive worry with onset ≥ 6 months ago **and** distress **and** ≥ 3 of the six symptoms | `Diagnose probable generalised anxiety disorder (low mood, stress or anxiety page)` |\n| PTSD | Anxiety onset ≥ 1 month ago **and** victim of psychological trauma **and** ≥ 3 of the four groups | `Diagnose probable post-traumatic stress disorder (low mood, stress or anxiety page)` |\n| Phobia / panic | Not modelled: the page says \"discuss/refer\", not \"likely\" or \"consider\" | none |\n| Depression, substance use, abuse, stressors, women's health, medication | Routing to other pages or management | none |\n\n## Notes\n\n- \"≥ 3 of\" is written with `any2` nested in `or`/`and` (the language has only `any2`): the first\n  present item plus at least two of the items after it. This is exactly equivalent to \"at least 3\".\n", "questions": "# Page 98 – Low mood, stress or anxiety: remaining questions\n\n## Decisions made\n\n- **Red box as a priority rule.** \"Give urgent attention to the patient with suicidal thoughts or\n  behaviour ↻ 34\" states its own urgency criterion, so it is encoded as `Urgent` on\n  (low mood/stress/anxiety **and** (Suicidal thoughts **or** Suicidal behavior)), with a `check_for`\n  task. It is not treated as a pointer-only box. Page 34's own logic is not imported.\n- **Trigger** = `Depressed mood`, `Stress` or `Anxiety` (finding). There is no \"Low mood\" concept;\n  `Depressed mood` is used. None of the three is a recorded common symptom or warning sign, so the\n  tasks only fire if one of these is recorded (for example from another page's `check_for`).\n- **\"≥ 3 of\"** is not in the language (only `any2`). It is expanded exactly: the first present\n  item plus `any2` of the items after it, e.g. for four groups `(or (and a (any2 b c d)) (and b c d))`.\n- **GAD**: \"excessive worry … for at least 6 months\" → `(>= (onset Worried+Excessive) (time_ago 6 months))`;\n  \"impaired function/distress\" → `Distress`; tiredness → `Fatigue` (common-symptom form).\n- **PTSD**: \"anxiety > 1 month\" → `(>= (onset Anxiety) (time_ago 1 months))` (`>` is rejected by the\n  database); \"linked to a bad experience\" → `Victim of psychological trauma`; each of the four\n  slash-groups is an `or` counted once.\n- **Not encoded**: phobia/panic (\"discuss/refer\", neither \"likely\" nor \"consider\"); the depression,\n  substance-use, abuse, stressors, women's health and medication rows (pointers to 159, 165, 33,\n  74, 191, 182, 187 or management); all advice; the review interval; the drink-size footnote.\n- **\"If patient known with depression, give routine depression care instead → 160\"** is routing and\n  is not modelled as an exclusion on the triggers.\n\n## Could not model\n\n- **\"Impaired function\"** (GAD): no SNOMED concept for impaired daily functioning. Only `Distress`\n  is required, so the GAD rule fires **less often** than the page intends (impaired function without\n  recorded distress is missed).\n- **\"Linked to\" a bad experience** (PTSD): the causal link cannot be expressed; the rule requires\n  anxiety and trauma together, so it may fire **more often** (unrelated trauma).\n- **\"Feels numb\"**: only the physical `Numbness` exists; covered by `Emotionally detached` /\n  `Derealization`.\n- **\"> 1 month\"** encoded as `>=` (boundary case at exactly 1 month fires).\n- Depression screening questions (past month low mood / anhedonia) route to page 159 and are not\n  diagnosis rules on this page.\n- **\"Excessive\" worry** depends on the health worker recording the Excessive qualifier.\n\n## SNOMED gaps\n\n- \"Low mood\" → `Depressed mood` (finding).\n- \"Excessive worry\" → `Worried` (finding) + `Excessive` (qualifier value).\n- \"Irritability\" → `Feeling irritable` (finding); `Hyperirritability` is neonatal/neurological.\n- \"Easily startled\" → `Predisposed to startle` (finding); no \"exaggerated startle response\".\n- \"Constantly on guard\" → `Hypervigilant behavior` (finding).\n- \"Flashbacks\" → `Flashback due to and following trauma` (finding).\n- \"Impaired function\" → none found (searched \"Impaired function\", \"Functional impairment\",\n  \"functioning\", \"psychosocial functioning\").\n- \"Feels numb\" (emotional) → none found.\n\n## Checker issues left in place\n\n- None.\n\n## Reconciliation (final build = builder B)\n\n- Builder A left out \"impaired function/distress\" (GAD fires more often); builder B requires\n  `Distress` (GAD fires less often). The final build keeps B's `Distress`, the part of the page's\n  \"function/distress\" that SNOMED can express. Unsettled: see the first question below.\n- Builder A encoded \"constantly on guard/easily startled\" with `Hypervigilant behavior` only;\n  the final build keeps B's `Hypervigilant behavior` OR `Predisposed to startle`, since the page\n  names \"easily startled\" separately.\n\n## Questions for a clinician\n- GAD: should \"impaired function/distress\" be required as `Distress`, accepting that the rule then\n  misses patients recorded only with impaired function, or dropped, accepting that it then fires on\n  excessive worry without impairment? (The final build requires `Distress`.)\n\n- Should the urgent rule fire on suicidal thoughts/behaviour alone, regardless of the presenting\n  complaint? The page scopes the box to this page's patients, so the complaint is required.\n- Is `Victim of psychological trauma` an acceptable reading of \"a bad experience\"?\n- Is `Predisposed to startle` (a character-trait finding) acceptable for \"easily startled\"?\n- Should \"known with depression\" suppress this page's tasks?\n- Should phobia and panic get `possible` diagnoses, even though the page only says \"discuss/refer\"?\n", "claims": [{"claim_id": "c001", "rule": "Check for urgent low mood, stress or anxiety conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Depressed mood\" \"finding\"))", "element_keys": ["p98-d5070c49"], "quote": "low mood"}, {"claim_id": "c002", "rule": "Check for urgent low mood, stress or anxiety conditions", "role": "trigger", "expr": "(finding (snomed_concept \"Clinical finding\" \"finding\") (snomed_concept \"Stress\" \"finding\"))", "element_keys": ["p98-d5070c49"], "quote": "stress"}, { t> (or <red-box items>)) per the house standard. Both SNOMED concepts exist as named. Note only: in SNOMED 'Suicidal behavior' is a descendant of 'Suicidal thoughts', so the (or ...) is redundant in due_to (descendants match automatically) but not wrong, and listing both in check_for is reasonable for the nurse-facing checklist. The page's '-> 34' is a cross-reference and is out of scope.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["Urgent trigger is suicidal thoughts/behaviour alone; rule additionally requires low mood/stress/anxiety"], "problem": "The red box says give urgent attention to the patient with suicidal thoughts or behaviour. The priority rule is an AND with depressed mood/stress/anxiety, so a patient recorded only with suicidal thoughts gets no Urgent. Contexts differ on whether that is wanted, but the box itself carries no such condition. The suicide concepts are right.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "correct", "parts_missing": [], "problem": "Red box encoded as Urgent with the presenting complaint (low mood / stress / anxiety) AND (suicidal thoughts OR suicidal behaviour); both items are in a check_for task and used as evidence. Cross-reference to p34 is out of scope. Both concepts exist and match the page.", "confidence": "high"}]}, {"page": 98, "slug": "98-low-mood-stress-or-anxiety", "kind": "element", "priority": "low", "ref": "p98-d5070c49", "text": "Assess the patient with low mood, stress or anxiety. If patient known with depression, give routine depression care instead 160.", "detail": [{"checker": "forward-1", "scope": "out_of_scope", "verdict": null, "parts_missing": [], "problem": "'If patient known with depression, give routine depression care instead -> 160' is routing to another page; the language has no way to express 'use another page instead'. The trigger (Depressed mood / Stress / Anxiety) is the builders' choice of presenting complaint and matches the page title.", "confidence": "high"}, {"checker": "forward-2", "scope": "out_of_scope", "verdict": "", "parts_missing": null, "problem": "not triage/diagnostic logic", "confidence": null}, {"checker": "forward-3", "scope": "out_of_scope", "verdict": "", "parts_missing": [], "problem": "flowchart_routing: 'If known with depression, give routine depression care instead → 160' is routing to another page, no diagnosis or triage criterion.", "confidence": "medium"}]}, {"page": 98, "slug": "98-low-mood-stress-or-anxiety", "kind": "element", "priority": "medium", "ref": "p98-eb4428e6", "text": "Anxiety • If excessive worry causes impaired function/distress for at least 6 months with ≥ 3 of: muscle tension, restlessness, irritability, difficulty sleeping, poor concentration, tiredness, generalised anxiety disorder likely 160. • If anxiety is induced by a particular situation/object (phobia)", "detail": [{"checker": "forward-1", "scope": "in_scope", "verdict": "partial", "parts_missing": ["Bullet 1 (GAD likely): 'causes impaired function/distress' is encoded as Distress only; the 'impaired function' alternative is not encoded, so the probable GAD rule requires Distress and will not fire for a patient whose excessive worry impairs function without reported distress. (No SNOMED concept for generic impaired function was found by search; the rule should at least note this or use the and-with-Distress as a documented approximation.)", "Bullet 2 (phobia / panic): nothing is encoded. The page names two conditions ('induced by a particular situation/object (phobia)', 'repeated sudden fear with physical symptoms and no obvious cause (panic)') and the house standard treats a named condition the page wants recognised as at least a possible diagnosis or a check_for item. SNOMED has (snomed_concept \"Phobia\" \"finding\"), (snomed_concept \"Panic attack\" \"finding\") and (snomed_concept \"Panic disorder\" \"disorder\"). The 'discuss/refer' action itself is a management step and out of scope."], "problem": "Part-by-part: (1) GAD likely: PARTIAL. Duration '(>= (onset Worried+Excessive) (time_ago 6 months))' correctly means onset at least 6 months ago; 'excessive worry' as Worried with qualifier Excessive is a fair encoding; the '>= 3 of 6' is enumerated exactly (A+any2(rest) | B+any2(rest) | C+any2(rest) | D+E+F covers every 3-subset of {muscle tension, restlessness, irritability, difficulty sleeping, poor concentration, tiredness}); the six symptom concepts map correctly (tiredness -> Fatigue, irritability -> Feeling irritable). Only the impaired-function alternative is missing. (2) Phobia/panic: MISSING (see parts_missing). (3) PTSD likely: CORRECT. '> 1 month' is encoded as (>= (onset Anxiety) (time_ago 1 months)), which is 'at least 1 month' rather than strictly more; immaterial. 'linked to a bad experience' -> Victim of psychological trauma is a reasonable concept (parent: Victim of trauma). The four groups (nightmares/flashbacks; avoids situations/people; on guard/easily startled; numb/detached from others/surroundings) are each an (or ...) so a group counts once, and '>= 3 of 4' is enumerated exactly as (G1 and any2(G2,G3,G4)) or (G2 and G3 and G4). 'feels numb/detached from others/surroundings' -> Emotionally detached + Derealization is a fair split. All concepts exist as named. The '-> 160' and 'discuss/refer' are out of scope.", "confidence": "high"}, {"checker": "forward-2", "scope": "in_scope", "verdict": "partial", "parts_missing": ["'impaired function' alternative: page says impaired function/distress (or), rule requires Distress only", "Distress concept is generic; 'Mental distress' may be closer"], "problem": "Excessive worry >=6 months and >=3 of 6 symptoms (tension, restlessness, irritability, sleep, concentration, tiredness) is encoded correctly as an exhaustive ordered-combination or/any2. Probable rule type is right. Fatigue for tiredness acceptable.", "confidence": "medium"}, {"checker": "forward-3", "scope": "in_scope", "verdict": "partial", "parts_missing": ["(a) GAD: 'impaired function' as an alternative to distress is not encoded; rule requires Distress unconditionally, so a patient with excessive worry ≥6 months impairing function but no recorded distress fails the rule", "(b) phobia (anxiety induced by a particular situation/object) and panic (repeated sudden fear with physical symptoms, no obvious cause): no rule and no check_for items (borderline scope; Phobia/Panic attack/Panic disorder concepts exist)"], "problem": "(a) GAD: excessive worry with onset ≥ 6 months ago (direction correct per house convention: >= onset time_ago = at least 6 months ago), ≥3 of 6 symptoms correctly enumerated (each size-3 subset covered by smallest-element decomposition with any2), concepts reasonable. Missing 'impaired function' OR-branch; Distress is not tied to the worry. (c) PTSD: onset of Anxiety ≥ 1 month ago (page says > 1 month; boundary off by equality, minor), linked to bad experience → Victim of psychological trauma, ≥3 of 4 groups correctly enumerated with nightmares/flashbacks, on-guard/startled and numb/detached each grouped with or so they count once. Correct. 'Predisposed to startle' is a character-trait concept (parent 'Character trait finding of predisposition to startle') rather than a symptom of being easily startled; acceptable but imperfect. (b) not encoded.", "confidence": "high"}]}, {"page": 98, "slug": "98-low-mood-stress-or-anxiety", "kind": "element", "priority": "high", "ref": "p98-346bde9a", "text": "Depression In the past month, has patient felt down/depressed/hopeless or little interest/pleasure in doing things? If yes to either 159.", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "missing", "parts_missing": ["felt down/depressed/hopeless in the past month", "little interest/pleasure in doing things in the past month"], "problem": "Neither screening question is in a check_for and no rule consumes them. Depressed mood appears only as one of the page's trigger findings, not as something the page asks the nurse to elicit. If encoded, a check_for of (clinical_finding (snomed_concept \"Feeling hopeless\" \"finding\")) and (clinical_finding (snomed_concept \"Loss of interest\" \"finding\")) with a possible-depression rule, or nothing at all, are both acceptable readings; the file documents neither.", "confidence": "medium"}, {"checker": "forward-2", "scope": "out_of_scope", "verdict": "", "parts_missing": [], "problem": "Screening question for depression pointing to page 159; no diagnosis stated. Depression/Depressed mood is used only as a task trigger.", "confidence": "medium"}, {"checker": "forward-3", "scope": "borderline", "verdict": "missing", "parts_missing": ["felt down/depressed/hopeless in past month", "little interest/pleasure in doing things", "either → possible depressive disorder (if encoded)"], "problem": "No rule or check_for for anhedonia/hopelessness; Depressed mood appears only as a task trigger.", "confidence": "medium"}]}, {"page": 98, "slug": "98-low-mood-stress-or-anxiety", "kind": "element", "priority": "high", "ref": "p98-758da856", "text": "Substance use In the past year, has patient drunk ≥ 4 drinks1/session, used illegal drugs or misused prescription or over-the-counter medications? If yes to any 165.", "detail": [{"checker": "forward-1", "scope": "borderline", "verdict": "missing", "parts_missing": [">= 4 drinks per session in the past year", "illegal drug use in the past year", "misuse of prescription or over-the-counter medication in the past year"], "problem": "Nothing encoded. The drinks-per-session threshold has no unit in the language, so that part is arguably not_representable; the drug-use and medication-misuse parts could be plain findings. Low consequence: the page routes to page 165 rather than concluding anything here.", "confidence": "medium"}, {"checker": "forward-2", "scope": "out_of_scope", "verdict": "", "parts_missing": [], "proble "use strict";
const D = JSON.parse(document.getElementById("data").textContent);

(D.claims || []).forEach(c => { const k = c.rule + "\u0000" + ws(c.expr); (claimsBy[k] = claimsBy[k] || []).push(c) });

(D.forward || []).forEach((r, i) => { if (!r) return; (r.elements || []).forEach(x => { (fwBy[x.element_key] = fwBy[x.element_key] || []).push({ checker: r.checker || `forward-${i + 1}`, ...x }) }) });

((D.reconcile || {}).decisions || []).forEach(d => { if (d.final_expr) (recByExpr[ws(d.final_expr)] = recByExpr[ws(d.final_expr)] || []).push(d) });
const citedBy = {};  // element key -> [condition ids]
const conds = [];    // {cid, rule, expr, prov, claim, leafText}

// ---------- header ----------
function counts() {
  const items = conds.length + D.elements.filter(e => e.box).length;

  return { items, decided, stale, open: (D.queue || []).length };

function renderHeader() {

    <span>APC 2023 page: ${esc(D.manifest.page_2023 ? "p" + D.manifest.page_2023 : "none (new in 2026)")} · red box since 2023: ${esc((D.manifest.redbox_status || []).join(", ") || D.manifest.index_status || "")}${helpButton("hdr_2023")}</span>

  $("#exp").onclick = exportDecisions;
}

// ---------- banners ----------
function renderBanners() {
  const b = [];
  const v = D.validation;
  if (!D.lisp) b.push(["bad", "No final build for this page yet."]);
  else if (!v || !v.ok) b.push(["bad", "The final build does not pass the deterministic checks: " + esc(JSON.stringify(v ? v.summary : "no validation"))]);
  if (v && v.problems && v.problems.always_true && v.problems.always_true.length) b.push(["bad", "Always-true (is-a only): " + v.problems.always_true.map(esc).join("; ")]);
  if (v && v.warnings && v.warnings.length) b.push(["warn", v.warnings.map(esc).join("<br>")]);
  const miss = (D.scorecard || {}).missing_reports || [];
  if (miss.length) b.push(["warn", "Missing checker reports: " + miss.join(", ")]);
  if (!me.reviewer || !me.role) b.push(["warn", "Enter your name and choose your role at the top before deciding anything: both are saved with every decision."]);
  b.push(["info", `Checker verdicts are model judgments, not clinical sign-off. Decisions are drafts in this browser until you export them. New here? Read the <a href="guide.html" target="_blank" rel="noopener">reviewer’s guide</a>.`]);
  $("#banners").innerHTML = b.map(([k, t]) => `<div class="banner ${k}">${t}</div>`).join("");
}

// ---------- decision widget ----------
function decideWidget(itemKey, opts = {}) {
  const cur = decisions[itemKey] || {};
  const stale = cur.decision && cur.rule_hash !== D.rule_hash;
  const choices = opts.scope ? ["confirm out of scope", "should be encoded", "question"] : ["accept", "fix", "question"];
  const disabledAccept = opts.blockAccept ? "accept" : null;
  return `<div class="decide" data-item="${esc(itemKey)}">
    ${choices.map(c => `<button data-d="${c === "confirm out of scope" ? "accept" : c === "should be encoded" ? "fix" : c}" data-v="${c}" class="${cur.decision === c ? "on" : ""}" ${c === disabledAccept ? 'disabled title="the concept does not resolve in VHA: fix or question"' : ""}>${c}</button>`).join("")}
    <input placeholder="note" value="${esc(cur.note || "")}">
    ${stale ? `<span class="stale">rule changed since this decision: reconfirm</span>` : ""}
    ${cur.decision && !stale ? `<span class="muted" style="font-size:11px">${esc(cur.reviewer || "?")} · ${esc(cur.ts || "").slice(0, 16)}</span>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".decide button");
  if (!btn) return;
  e.stopPropagation();
  const box = btn.closest(".decide"), key = box.dataset.item;
  const cur = decisions[key] || {};
  const val = btn.dataset.v;
  decisions[key] = { ...cur, decision: cur.decision === val && cur.rule_hash === D.rule_hash ? "" : val, note: $("input", box).value,
    reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
  box.outerHTML = decideWidget(key, { scope: box.querySelector('[data-v="confirm out of scope"]') !== null });
  renderHeader();
}, true);
document.addEventListener("change", e => {
  const box = e.target.closest(".decide");
  if (!box || e.target.tagName !== "INPUT") return;
  const key = box.dataset.item;
  decisions[key] = { ...(decisions[key] || {}), note: e.target.value, reviewer: me.reviewer, role: me.role, ts: new Date().toISOString(), rule_hash: D.rule_hash };
  store.set(NS, decisions);
});
document.addEventListener("click", e => { if (e.target.closest(".decide")) e.stopPropagation() }, true);

async function exportDecisions() {
  const out = { edition: D.edition, page: D.page, slug: D.slug, rule_hash: D.rule_hash, generated: D.generated, exported_at: new Date().toISOString(),
    reviewer: me.reviewer, role: me.role,
    decisions: Object.entries(decisions).filter(([, v]) => v.decision || v.note).map(([k, v]) => ({ item: k, ...v, needs_reconfirm: v.rule_hash !== D.rule_hash })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const name = `decisions-${D.slug}-${(me.reviewer || "reviewer").replace(/\W+/g, "_")}.json`;
  try {
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

// ---------- Lisp source, shown the way a code editor does ----------
// Tokens: ; comments, "strings", numbers, ( ) brackets colored by depth, the symbol after "(" as a keyword.
function highlightLisp(src) {
  let out = "", depth = 0, i = 0, afterOpen = false;
  const sp = (cls, s) => `<span class="${cls}">${esc(s)}</span>`;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); const e = j < 0 ? src.length : j; out += sp("c", src.slice(i, e)); i = e; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; out += sp("s", src.slice(i, j + 1)); i = j + 1; afterOpen = false; continue }
    if (ch === "(") { out += sp("p" + (depth % 3), "("); depth++; i++; afterOpen = true; continue }
    if (ch === ")") { depth = Math.max(0, depth - 1); out += sp("p" + (depth % 3), ")"); i++; afterOpen = false; continue }
    if (/\s/.test(ch)) { out += ch; i++; continue }
    let j = i; while (j < src.length && !/[\s()";]/.test(src[j])) j++;
    const tok = src.slice(i, j);
    out += sp(afterOpen ? "k" : /^-?\d+(\.\d+)?$/.test(tok) ? "n" : "y", tok);
    afterOpen = false; i = j;
  }
  return out;
}
// Parse one s-expression and print it the way the rule files are laid out: a form stays on one line
// when it fits, otherwise its head stays on the first line and each argument goes on its own line.
function parseLisp(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++ };
  function read() {
    ws();
    if (s[i] === "(") { i++; const list = []; ws(); while (i < s.length && s[i] !== ")") { list.push(read()); ws() } i++; return list }
    if (s[i] === '"') { let j = i + 1; while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1; const tok = s.slice(i, j + 1); i = j + 1; return tok }
    let j = i; while (j < s.length && !/[\s()]/.test(s[j])) j++; const tok = s.slice(i, j); i = j; return tok;
  }
  return read();
}
function flat(n) { return Array.isArray(n) ? "(" + n.map(flat).join(" ") + ")" : n }
function prettyLisp(expr, width = 72) {
  function pr(n, ind) {
    const f = flat(n);
    if (!Array.isArray(n) || ind.length + f.length <= width || n.length < 2) return f;
    const head = flat(n[0]);
    return "(" + head + n.slice(1).map(c => "\n" + ind + "  " + pr(c, ind + "  ")).join("") + ")";
  }
  try { return pr(parseLisp(expr), "") } catch { return expr }
}
// The rule's own text in the page's rule file: the top-level form whose description matches,
// with the comment lines right above it.
const ruleSource = (() => {
  const src = D.lisp || "", forms = [];
  let i = 0, start = -1, depth = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ";") { const j = src.indexOf("\n", i); i = j < 0 ? src.length : j; continue }
    if (ch === '"') { let j = i + 1; while (j < src.length && src[j] !== '"') j += src[j] === "\\" ? 2 : 1; i = j + 1; continue }
    if (ch === "(") { if (depth === 0) start = i; depth++ }
    else if (ch === ")") { depth--; if (depth === 0) {
      // take the comment lines directly above the form
      let s = src.lastIndexOf("\n", start - 1) + 1;
      while (s > 0) { const p = src.lastIndexOf("\n", s - 2) + 1; if (src.slice(p, s - 1).trim().startsWith(";")) s = p; else break }
      forms.push(src.slice(s, i + 1));
    } }
    i++;
  }
  return desc => forms.find(f => f.includes(JSON.stringify(desc))) || null;
})();
const codeBlock = (src, cls = "") => `<pre class="code ${cls}">${highlightLisp(src)}</pre>`;

// ---------- chips ----------
const CONCEPT = /\(snomed_concept "((?:[^"\\]|\\.)*)" "([^"]*)"\)/g;
function conceptChips(expr) {
  const out = []; let m; CONCEPT.lastIndex = 0;
  let blockAccept = false;
  while ((m = CONCEPT.exec(expr))) {
    if (m[1] === "Clinical finding" && m[2] === "finding") continue;
    if (/^(Finding site|Attribute)$/.test(m[1])) continue;
    const b = D.concepts[m[1] + "|" + m[2]];
    if (!b) continue;
    if (!b.resolves) { blockAccept = true; out.push(`<span class="chip bad" title="no active fully specified name matches exactly">${esc(m[1])} (${esc(m[2])}): does not resolve in VHA</span>`) }
    else out.push(`<span class="chip" title="parents: ${esc((b.parents || []).join("; "))}">${esc(m[1])} (${esc(m[2])}) · ${b.descendants} descendants</span>`);
  }
  return { html: out.join(""), blockAccept };
}
// "forward-2" -> "checker 2", with a hover note saying which direction that checker read in
function checkerLabel(name) {
  const n = (String(name).match(/\d+/) || ["?"])[0];
  return { text: `checker ${n}`, title: /^forward/.test(name) ? `Page-to-rules checker ${n} of 3: an AI model that read the page and judged whether the rules encode this text` : `Rules-to-page checker ${n} of 3: an AI model that read the rules and judged whether this condition is faithful to the page` };
}
function verdictChip(name, v, suffix = "") {
  const cls = /^(faithful|correct)$/.test(v) ? "ok" : /^(imprecise|partial|borderline)$/.test(v) ? "warn" : "bad";
  const l = checkerLabel(name);
  return `<span class="chip ${cls}" title="${esc(l.title)}">${esc(l.text + suffix)}: ${esc(v || "?")}</span>`;
}

// ---------- rules pane ----------
let cidN = 0;
function leafHtml(leaf, rule) {
  const k = rule + "\u0000" + ws(leaf.expr);
  const p = (provQueues[k] || []).shift();
  const c = (claimsBy[k] || []).shift();
  const cid = `c${++cidN}`;
  const occ = conds.filter(x => x.rule === rule && x.expr === ws(leaf.expr)).length + 1;
  const itemKey = `cond|${rule}|${ws(leaf.expr)}|${occ}`;
  conds.push({ cid, rule, expr: ws(leaf.expr), prov: p, claim: c, itemKey });
  (p ? p.element_keys : []).forEach(ek => (citedBy[ek] = citedBy[ek] || []).push(cid));
  const cc = conceptChips(leaf.expr);
  const bw = c ? (bwBy[c.claim_id] || []) : [];
  const recs = recByExpr[ws(leaf.expr)] || [];
  const chips = [
    p ? `<span class="chip ok" title="verbatim in the cited element(s)">quote: “${esc(p.quote)}”</span>` : `<span class="chip bad">no provenance</span>`,
    p && p.confidence ? `<span class="chip ${p.confidence === "high" ? "" : "warn"}">builder: ${esc(p.confidence)}</span>` : "",
    ...bw.map(v => verdictChip(v.checker, v.verdict)),
    recs.length ? `<span class="chip ${recs.some(r => r.unsettled) ? "bad" : "warn"}" title="${esc(recs.map(r => r.difference + " → " + r.choice + ": " + r.reason).join("\n"))}">builds differed${recs.some(r => r.unsettled) ? " · unsettled" : ""}</span>` : "",
    cc.html,
  ].join("");
  const reasons = bw.filter(v => v.verdict !== "faithful").map(v => `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict)}: ${esc(v.reason)}${v.fix ? " · fix: " + esc(v.fix) : ""}</div>`).join("");
  return `<div class="leaf" data-cid="${cid}" data-claim="${esc(c ? c.claim_id : "")}" data-keys="${esc((p ? p.element_keys : []).join(" "))}">
    <div class="en">${esc(leaf.text)}</div>${codeBlock(prettyLisp(leaf.expr), "raw")}
    <div class="chips">${chips}</div>
    ${p && p.note ? `<div class="detail">builder note: ${esc(p.note)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${decideWidget(itemKey, { blockAccept: cc.blockAccept })}
  </div>`;
}
function treeHtml(n, rule) {
  if (n.kind === "group") return `<div class="group"><div class="op">${esc(n.text)}</div>${n.children.map(c => treeHtml(c, rule)).join("")}</div>`;
  return leafHtml(n, rule);
}
function renderRules() {
  const R = D.rules || [];
  if (!R.length) { $("#rules").innerHTML = D.lisp ? `<p class="muted">This page's file has no rules (pointer-only box, or nothing representable). See the scope decisions below.</p>` : `<p class="muted">Not built yet.</p>`; return }
  $("#rules").innerHTML = R.map(r => {
    let body = `<div class="lbl">When${helpButton("when")}</div>${treeHtml(r.when, r.description)}`;
    if (r.atom === "task") body += `<div class="lbl">${esc(r.do_label)}${helpButton("do")}</div>${(r.do || []).map(l => leafHtml(l, r.description)).join("")}`;
    if (r.atom === "system_diagnosis_rule") body = `<div class="lbl">Concludes${helpButton("concludes")}</div>${leafHtml(r.diagnosis, r.description)}` + body;
    return `<div class="rule" data-rule="${esc(r.description)}"><h3>${esc(r.headline)}</h3>${codeBlock(ruleSource(r.description) || prettyLisp(r.raw), "raw")}${body}</div>`;
  }).join("");
}

// ---------- source pane ----------
function renderSource() {
  const parts = [], crops = [];
  const many = D.boxes.length > 1;
  for (const b of D.boxes) {
    const [bx0, by0, bx1, by1] = b.rect;
    const W = (bx1 - bx0), H = (by1 - by0);
    const rects = D.elements.filter(e => e.box === b.box).map(e => {
      const [x0, y0, x1, y1] = e.bbox;
      return `<rect data-key="${esc(e.key)}" x="${((x0 - bx0) / W * 100).toFixed(2)}%" y="${((y0 - by0) / H * 100).toFixed(2)}%" width="${((x1 - x0) / W * 100).toFixed(2)}%" height="${(Math.max(y1 - y0, 8) / H * 100).toFixed(2)}%"><title>${esc(e.id)}</title></rect>`;
    }).join("");
    const src = D.crops[String(b.box)];
    crops.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + (src ? `<button type="button" class="zoombtn">zoom to full size</button><div class="cropscroll"><div class="cropwrap" title="double-click to zoom"><img src="${src}" alt="red box ${b.box}"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${rects.replace(/%/g, "")}</svg></div></div>` : `<p class="muted">crop for box ${b.box} missing</p>`));
    parts.push((many ? `<div class="boxlbl">Red box ${b.box}</div>` : "") + D.elements.filter(e => e.box === b.box).map(elHtml).join(""));
  }
  const outsideCited = D.elements.filter(e => !e.box && citedBy[e.key]);
  if (outsideCited.length) parts.push(`<h2 style="margin-top:14px">Cited from outside the red box</h2>` + outsideCited.map(elHtml).join(""));
  const outsideFlag = D.elements.filter(e => !e.box && !citedBy[e.key] && (fwBy[e.key] || []).some(v => v.scope !== "out_of_scope"));
  if (outsideFlag.length) parts.push(`<h2 style="margin-top:14px">Outside the red box: a checker says this is logic the rules miss</h2>` + outsideFlag.map(elHtml).join(""));
  $("#source").innerHTML = parts.join("");
  $("#crops").innerHTML = crops.join("");
}
function elHtml(e) {
  const f = fwBy[e.key] || [];
  const ne = notEnc[e.key];
  const chips = [
    citedBy[e.key] ? `<span class="chip ok">cited by ${citedBy[e.key].length} condition${citedBy[e.key].length > 1 ? "s" : ""}</span>` :
      ne ? `<span class="chip warn" title="${esc(ne.reason)}">not encoded: ${esc(ne.reason_category)}</span>` : (e.box ? `<span class="chip bad">not accounted for</span>` : ""),
    ...f.map(v => v.scope === "out_of_scope" ? `<span class="chip" title="${esc(checkerLabel(v.checker).title)}">${esc(checkerLabel(v.checker).text)}: out of scope</span>` : verdictChip(v.checker, v.verdict, v.scope === "borderline" ? " (borderline)" : "")),
  ].join("");
  const reasons = f.filter(v => v.scope !== "out_of_scope" && v.verdict !== "correct" || v.scope === "borderline").map(v =>
    `<div>${esc(checkerLabel(v.checker).text)}: ${esc(v.verdict || v.scope)}${v.parts_missing && v.parts_missing.length ? " · missing: " + esc(v.parts_missing.join(", ")) : ""}${v.problem ? " · " + esc(v.problem) : ""}${v.scope_reason ? " · " + esc(v.scope_reason) : ""}</div>`).join("");
  const scopeDecision = !citedBy[e.key];
  return `<div class="el ${e.kind_hint === "header" ? "header-el" : ""}" data-key="${esc(e.key)}">
    <div>${esc(e.text)}</div><div class="k">${esc(e.id)} · ${esc(e.key)} · ${esc(e.kind_hint)}</div>
    <div class="chips">${chips}</div>
    ${ne ? `<div class="detail">builder: ${esc(ne.reason)}</div>` : ""}
    ${reasons ? `<div class="detail">${reasons}</div>` : ""}
    ${e.box || citedBy[e.key] || reasons ? decideWidget(`el|${e.key}`, { scope: scopeDecision }) : ""}
  </div>`;
}

// ---------- linking ----------
function clearHl() { document.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")) }
document.addEventListener("click", e => {
  const leaf = e.target.closest(".leaf"), el = e.target.closest(".el"), rect = e.target.closest("rect");
  if (!leaf && !el && !rect) return;
  clearHl();
  if (leaf) {
    leaf.classList.add("hl");
    (leaf.dataset.keys || "").split(" ").filter(Boolean).forEach(k => document.querySelectorAll(`[data-key="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl")));
    const first = document.querySelector(`.el[data-key="${CSS.escape((leaf.dataset.keys || "").split(" ")[0] || "")}"]`);
    if (first && window.innerWidth > 900) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } else {
    const key = (el || rect).dataset.key;
    document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(x => x.classList.add("hl"));
    (citedBy[key] || []).forEach(cid => { const l = document.querySelector(`.leaf[data-cid="${cid}"]`); if (l) l.classList.add("hl") });
    const l = document.querySelector(`.leaf[data-cid="${(citedBy[key] || [])[0]}"]`);
    if (l && window.innerWidth > 900) l.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});
document.addEventListener("dblclick", e => { const c = e.target.closest(".cropwrap"); if (c) c.classList.toggle("zoom") });
document.addEventListener("click", e => {
  const z = e.target.closest(".zoombtn"); if (!z) return;
  const c = z.nextElementSibling.querySelector(".cropwrap"); c.classList.toggle("zoom");
  z.textContent = c.classList.contains("zoom") ? "fit to pane" : "zoom to full size";
});
// review queue rows jump to their item in the panes. Rule refs are the checkers' wording: sometimes
// several rules joined by "/" or ";", or a shortened name, so they are matched loosely by name.
function rulesNamed(ref) {
  const descs = (D.rules || []).map(r => r.description), out = new Set();
  for (const part of ref.split(/\s*[\/;]\s*/).map(s => s.trim().toLowerCase()).filter(s => s.length >= 12)) {
    const exact = descs.filter(d => d.toLowerCase() === part);
    (exact.length ? exact : descs.filter(d => d.toLowerCase().startsWith(part) || part.startsWith(d.toLowerCase()))).forEach(d => out.add(d));
  }
  return [...out];
}
function gotoTargets(kind, ref) {
  if (kind === "claim") return [...document.querySelectorAll(`.leaf[data-claim="${CSS.escape(ref)}"]`)];
  if (kind === "element") return [...document.querySelectorAll(`.el[data-key="${CSS.escape(ref)}"]`)];
  if (kind === "rule") return rulesNamed(ref).flatMap(d => [...document.querySelectorAll(`.rule[data-rule="${CSS.escape(d)}"]`)]);
  return [];
}
document.addEventListener("click", e => {
  const g = e.target.closest("td.goto"); if (!g) return;
  const targets = gotoTargets(g.dataset.kind, g.dataset.ref); if (!targets.length) return;
  clearHl(); targets.forEach(x => x.classList.add("hl")); targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
});
$("#rawbtn").onclick = () => { const on = document.body.classList.toggle("showraw"); $("#rawbtn").textContent = on ? "show English" : "show structured rules"; $("#rulesttl").textContent = on ? "Rules, as written in the rule file" : "Rules, in plain English" };

// ---------- lower tabs ----------
function md(s) {
  if (!s) return `<p class="muted">none</p>`;
  return `<div class="md">` + esc(s).split("\n").map(l => {
    if (/^#{1,3} /.test(l)) return `<h3>${l.replace(/^#+ /, "")}</h3>`;
    if (/^\s*[-*] /.test(l)) return `<li style="margin-left:${(l.match(/^\s*/)[0].length) * 6 + 14}px">${l.replace(/^\s*[-*] /, "")}</li>`;
    if (/^```/.test(l)) return "";
    return l.trim() ? `<p>${l}</p>` : "";
  }).join("").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") + `</div>`;
}
const TABS = {
  "Review queue": () => {
    const order = { high: 0, medium: 1, low: 2 };
    const q = [...(D.queue || [])].sort((a, b) => order[a.priority] - order[b.priority]);
    if (!q.length) return `<p class="muted">Empty. That orders the work, it does not bound it: every condition and element above still needs a person.</p>`;
    const linkable = x => gotoTargets(x.kind, x.ref || "").length > 0;
    return `<table><tr><th>priority${helpButton("q_priority")}</th><th>kind${helpButton("q_kind")}</th><th>item${helpButton("q_item")}</th><th>what the checkers and builders said${helpButton("q_said")}</th></tr>` + q.map(x =>
      `<tr><td class="pri-${x.priority}">${x.priority}</td><td>${esc(x.kind)}</td><td${linkable(x) ? ` class="goto" data-kind="${x.kind}" data-ref="${esc(x.ref)}" title="jump to this item above"` : ""}>${esc(x.text)}<div class="k muted" style="font-size:11px">${esc(x.ref)}${linkable(x) ? " · jump to it ↑" : ""}</div></td><td>${(Array.isArray(x.detail) ? x.detail : [x.detail]).map(d => `<div>${esc(typeof d === "string" ? d : Object.entries(d || {}).filter(([, v]) => v !== null && v !== "" && v !== undefined).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(" · "))}</div>`).join("")}</td></tr>`).join("") + `</table>`;
  },
  "Scope decisions": () => {
    const rows = D.elements.filter(e => e.box && !citedBy[e.key]);
    if (!rows.length) return `<p class="muted">Every red-box element is cited by a condition.</p>`;
    return `<p class="muted">Every red-box element the rules do not encode, with the builder's reason and the forward checkers' scope calls. Confirm or overturn each.</p>` + rows.map(elHtml).join("");
  },
  "Builder disagreements": () => {
    const R = D.reconcile;
    if (!R) return `<p class="muted">No reconcile record.</p>`;
    const dif = D.diff ? `<p>Builder agreement: <b>${D.diff.agreement}</b> (A ${D.diff.conditions_A} conditions, B ${D.diff.conditions_B}, ${D.diff.conditions_in_both} in both).</p>` : "";
    return dif + `<table><tr><th>role${helpButton("bd_role")}</th><th>difference${helpButton("bd_difference")}</th><th>choice${helpButton("bd_choice")}</th><th>reason${helpButton("bd_reason")}</th></tr>` + (R.decisions || []).map(d =>
      `<tr><td>${esc(d.role)}</td><td style="font:11.5px ui-monospace,monospace">${esc(d.difference)}</td><td>${esc(d.choice)}${d.unsettled ? ' <span class="chip bad">unsettled</span>' : ""}</td><td>${esc(d.reason)}</td></tr>`).join("") + `</table>` + (R.notes ? `<p>${esc(R.notes)}</p>` : "");
  },
  "Edition context": () => {
    const V = D.vs_will, m = D.manifest;
    let h = `<p>2026 p${D.page} pairs with ${m.page_2023 ? "2023 p" + m.page_2023 : "no 2023 page (new in 2026)"}. Red box vs 2023: <b>${esc((m.redbox_status || []).join(", ") || m.index_status)}</b>. A 2023 decision never carries over by itself: shock was redefined on about 30 pages, and some boxes became flowcharts.</p>`;
    if (!V || !V.groups || !Object.keys(V.groups).length) return h + `<p class="muted">${esc(V ? V.note : "no comparison")}</p>`;
    h += `<p>Compared with Will's 2023 rules (<code>${esc(V.will_file)}</code>${String(m.page_2023) === "20" ? "" : ", on the not-yet-reviewed list in his PR #1310"}): ${V.counts.exact} conditions match exactly, and ${V.counts.related} pairs are related through SNOMED, out of ${V.counts.will_2023} distinct 2023 conditions and ${V.counts.build_2026} distinct 2026 ones. This is a comparison of agreement, not a grade.</p>`;
    h += `<table><tr><th>role${helpButton("ec_role")}</th><th>only in 2023 rules${helpButton("ec_2023")}</th><th>only in 2026 build${helpButton("ec_2026")}</th><th>related${helpButton("ec_related")}</th></tr>` + Object.entries(V.groups).filter(([, g]) => g.only_2023.length || g.only_2026.length).map(([r, g]) =>
      `<tr><td>${esc(r)}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2023.map(esc).join("<br>")}</td><td style="font:11.5px ui-monospace,monospace">${g.only_2026.map(esc).join("<br>")}</td><td>${g.is_a_related.map(x => esc(x.relation)).join("<br>")}</td></tr>`).join("") + `</table>`;
    return h;
  },
  "Remaining questions": () => md(D.questions),
  "Flowchart": () => D.flowchart ? `<pre class="md">${esc(D.flowchart)}</pre>` : `<p class="muted">No flowchart file for this page.</p>`,
  "Checker summaries": () => [...(D.forward || []), ...(D.backward || [])].map((r, i) => r ? `<p><b>${esc(r.checker)}</b>: ${esc(r.summary || "")}</p>` + ((r.rule_level_problems || r.rules || []).filter(x => x.problem).map(x => `<div class="detail">• ${esc(x.rule)}: ${esc(x.problem)} (${esc(x.severity)})</div>`).join("")) : `<p class="muted">report ${i + 1} missing</p>`).join(""),
  "Raw rule file": () => D.lisp ? codeBlock(D.lisp) : `<p class="muted">not built</p>`,
};
let tab = store.get("apc-review|tab", "Review queue");
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map(t => `<button class="${t === tab ? "on" : ""}">${t}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.textContent; store.set("apc-review|tab", tab); renderTabs() });
  const t = TABS[tab] ? tab : "Review queue";
  $("#tabbody").innerHTML = `<p class="tabhelp">About this tab${helpButton(t)}</p>` + TABS[t]();
}

document.querySelectorAll(".hb").forEach(s => s.outerHTML = helpButton(s.dataset.k));
const layout = store.get("apc-review|layout", { compact: false, band: true });
function applyLayout() {
  document.body.classList.toggle("compact", layout.compact);
  $("#hdrbtn").textContent = layout.compact ? "show details ▾" : "hide details ▴";
  $("#cropband").open = layout.band;
}
$("#hdrbtn").onclick = () => { layout.compact = !layout.compact; store.set("apc-review|layout", layout); applyLayout() };
$("#cropband").addEventListener("toggle", () => { layout.band = $("#cropband").open; store.set("apc-review|layout", layout) });
applyLayout();
// the red box band keeps the height the reviewer drags it to
if (layout.cropH) $("#crops").style.height = layout.cropH + "px";
new ResizeObserver(() => { const h = $("#crops").offsetHeight; if ($("#cropband").open && h > 0 && h !== layout.cropH) { layout.cropH = h; store.set("apc-review|layout", layout) } }).observe($("#crops"));
renderRules();   // fills conds and citedBy first
renderSource();
renderHeader();
renderBanners();
renderTabs();
</script>
